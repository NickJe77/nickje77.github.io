name: Build NBA Team Leaders

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/data/nba/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build team totals
        run: |
          python <<EOF
          import json
          from collections import defaultdict
          from pathlib import Path

          master_path = Path("docs/data/nba/nba_games_master.json")
          if not master_path.exists():
              raise FileNotFoundError("nba_games_master.json not found")

          master = json.loads(master_path.read_text())

          team_totals = defaultdict(lambda: defaultdict(lambda: {
              "points": 0,
              "rebounds": 0,
              "assists": 0,
              "steals": 0,
              "games": 0
          }))

          for game in master:
              season = game.get("season")
              game_id = game.get("game_id")

              if not season or not game_id:
                  continue

              game_file = Path(f"docs/data/nba/{season}/{game_id}.json")
              if not game_file.exists():
                  continue

              full = json.loads(game_file.read_text())

              if full.get("game_type") != "Regular Season":
                  continue

              for p in full.get("players", []):
                  team = p.get("team")
                  name = p.get("player_name")

                  if not team or not name:
                      continue

                  stats = team_totals[team][name]
                  stats["points"] += p.get("points", 0)
                  stats["rebounds"] += p.get("rebounds", 0)
                  stats["assists"] += p.get("assists", 0)
                  stats["steals"] += p.get("steals", 0)
                  stats["games"] += 1

          output = {}

          for team, players in team_totals.items():
              output[team] = list(players.items())

          Path("docs/data/nba/nba_player_team_totals.json").write_text(
              json.dumps(output)
          )

          print("NBA team totals built.")
          EOF

      - name: Commit file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nba/nba_player_team_totals.json
          git commit -m "Update NBA team leader totals" || echo "No changes"
          git push
