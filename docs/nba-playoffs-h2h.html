<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Playoff Head-to-Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1100px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;margin:0 0 10px;}
p{text-align:center;color:#555;margin:0 0 18px;}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;}
select{padding:8px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;}
.summary{max-width:900px;margin:0 auto 14px;text-align:center;color:#333;font-weight:700;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
.small{color:#666;font-size:13px;}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">
  <h1>Playoff Head-to-Head</h1>
  <p>Team vs team playoff series history.</p>

  <div class="controls">
    <select id="teamA"></select>
    <select id="teamB"></select>
  </div>

  <div class="summary" id="summary">Select two teams.</div>

  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>Round</th>
        <th>Matchup</th>
        <th>Result</th>
        <th class="small">Winner</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
let data=[];
const teamA=document.getElementById("teamA");
const teamB=document.getElementById("teamB");
const summary=document.getElementById("summary");
const rows=document.getElementById("rows");

fetch("data/nba/playoff-h2h.json")
  .then(r=>r.json())
  .then(d=>{
    data=d||[];
    const teams = Array.from(new Set(data.flatMap(x=>[x.team1,x.team2]))).sort();
    teams.forEach(t=>{
      const o1=document.createElement("option"); o1.value=t; o1.textContent=t; teamA.appendChild(o1);
      const o2=document.createElement("option"); o2.value=t; o2.textContent=t; teamB.appendChild(o2);
    });
    if(teams.length){
      teamA.value=teams[0];
      teamB.value=teams.length>1?teams[1]:teams[0];
    }
    render();
  })
  .catch(()=>{ summary.textContent="Could not load data."; });

teamA.addEventListener("change", render);
teamB.addEventListener("change", render);

function render(){
  const a=teamA.value, b=teamB.value;
  rows.innerHTML="";
  if(!a || !b){ summary.textContent="Select two teams."; return; }
  if(a===b){ summary.textContent="Pick two different teams."; return; }

  const match = data.filter(x=>{
    return (x.team1===a && x.team2===b) || (x.team1===b && x.team2===a);
  }).sort((x,y)=>String(x.season).localeCompare(String(y.season)));

  if(!match.length){
    summary.textContent=`No recorded playoff series between ${a} and ${b}.`;
    return;
  }

  let aWins=0, bWins=0;
  match.forEach(s=>{
    if(s.winner===a) aWins++;
    if(s.winner===b) bWins++;
  });

  summary.textContent = `${a} vs ${b} — Series wins: ${a} ${aWins} – ${bWins} ${b}`;

  match.forEach(s=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${s.season || ""}</td>
      <td>${s.round || ""}</td>
      <td>${s.team1} vs ${s.team2}</td>
      <td>${s.result || ""}</td>
      <td class="small">${s.winner || ""}</td>
    `;
    rows.appendChild(tr);
  });
}
</script>

</body>
</html>
