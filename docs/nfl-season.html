<script>

const params = new URLSearchParams(window.location.search);
const year = params.get("year");

const title = document.getElementById("title");
const tbody = document.querySelector("#games tbody");

if(!year){

title.innerHTML="NFL Season";
tbody.innerHTML="<tr><td colspan='5'>No season specified</td></tr>";
throw new Error("Missing year");

}

title.innerHTML="NFL "+year;

const filePath="data/nfl/nfl_"+year+".json";

fetch(filePath)

.then(res=>{

if(!res.ok){

throw new Error("File not found: "+filePath);

}

return res.json();

})

.then(data=>{

if(!data.games || data.games.length===0){

tbody.innerHTML="<tr><td colspan='5'>No games found</td></tr>";
return;

}

tbody.innerHTML="";

data.games.forEach(game=>{

let away="";
let home="";
let awayScore="";
let homeScore="";

if(game.score && game.score.length>=2){

away = game.score[0]["Unnamed: 1"] || "";
home = game.score[1]["Unnamed: 1"] || "";

awayScore = game.score[0]["Final"] || "";
homeScore = game.score[1]["Final"] || "";

}

const round="Regular Season";

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${game.game_id.substring(4,6)}/${game.game_id.substring(6,8)}/${year}</td>
<td>${away} ${awayScore}</td>
<td>def</td>
<td>${home} ${homeScore}</td>
<td>${round}</td>
`;

tr.onclick=()=>{

location.href=`nfl-game.html?year=${year}&id=${game.game_id}`;

};

tbody.appendChild(tr);

});

})

.catch(err=>{

console.error(err);

tbody.innerHTML=`
<tr>
<td colspan="5">
Error loading season<br>
${filePath}
</td>
</tr>
`;

});

</script>
