<script>

const params = new URLSearchParams(window.location.search);
const year = params.get("year");

const title = document.getElementById("title");
const tbody = document.querySelector("#games tbody");

if(!year){

title.innerHTML = "NFL Season";
tbody.innerHTML = "<tr><td colspan='5'>No season specified</td></tr>";
throw new Error("No year parameter");

}

title.innerHTML = "NFL " + year;

const filePath = "data/nfl/nfl_" + year + ".json";

fetch(filePath)

.then(response=>{

if(!response.ok){

throw new Error("File not found: " + filePath);

}

return response.json();

})

.then(data=>{

if(!data.games || data.games.length===0){

tbody.innerHTML="<tr><td colspan='5'>No games found</td></tr>";
return;

}

tbody.innerHTML="";

data.games.forEach(game=>{

let away="";
let home="";
let awayScore="";
let homeScore="";

if(game.score && game.score.length>=2){

away = game.score[0].Tm || "";
home = game.score[1].Tm || "";

awayScore = game.score[0].Final || "";
homeScore = game.score[1].Final || "";

}

const round = game.round || "Regular Season";

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${game.week || ""}</td>
<td>${away} ${awayScore}</td>
<td>def</td>
<td>${home} ${homeScore}</td>
<td class="${game.is_playoff ? "playoff":""}">${round}</td>
`;

tr.onclick=()=>{

location.href=`nfl-game.html?year=${year}&id=${game.game_id}`;

};

tbody.appendChild(tr);

});

})

.catch(error=>{

console.error(error);

tbody.innerHTML=`
<tr>
<td colspan="5">
Error loading season<br>
${filePath}
</td>
</tr>
`;

});

</script>
