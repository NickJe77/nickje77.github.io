<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NFL Season</title>

<style>

body{
font-family:Inter;
background:#f4f6f8;
margin:0;
}

.header{
background:#013369;
color:white;
padding:20px;
font-size:28px;
}

.container{
max-width:1000px;
margin:20px auto;
background:white;
padding:20px;
border-radius:12px;
}

.game{
padding:10px;
border-bottom:1px solid #ddd;
cursor:pointer;
}

.game:hover{
background:#f4f8fc;
}

</style>
</head>
<body>

<div class="header" id="title">
Season
</div>

<div class="container" id="games">
Loading games...
</div>

<script>

const params=new URLSearchParams(location.search);

const year=params.get("year");

document.getElementById("title").innerHTML=`NFL ${year}`;

fetch(`data/nfl/nfl_${year}.json`)
.then(r=>r.json())
.then(data=>{

const container=document.getElementById("games");

container.innerHTML="";

data.games.forEach(game=>{

const div=document.createElement("div");

div.className="game";

div.innerHTML=game.game_id;

div.onclick=()=>{
location.href=`nfl-game.html?id=${game.game_id}&year=${year}`;
};

container.appendChild(div);

});

});

</script>

</body>
</html>
