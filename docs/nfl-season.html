<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
}

.navbar a{
  text-decoration:none;
  color:#013369;
  font-weight:600;
}

.hero{
  background:linear-gradient(90deg,#013369,#d50a0a);
  color:white;
  padding:30px;
  text-align:center;
  font-size:28px;
  font-weight:700;
}

.container{
  max-width:1000px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  border-bottom:1px solid #eee;
}

.playoff{
  color:#d50a0a;
  font-weight:700;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero" id="title">NFL Season</div>

<div class="container">

<table id="games">

<thead>
<tr>
<th>Date</th>
<th>Winner</th>
<th></th>
<th>Loser</th>
<th>Round</th>
</tr>
</thead>

<tbody>
<tr><td colspan="5">Loading season...</td></tr>
</tbody>

</table>

</div>

<script>

const year = new URLSearchParams(location.search).get("year");

const tbody = document.querySelector("#games tbody");

async function loadSeason(){

document.getElementById("title").innerHTML="NFL "+year;

const res = await fetch("data/nfl/nfl_"+year+".json");
const data = await res.json();

const games = data.games.filter(g =>
g.game_id &&
g.score &&
g.score.length>=2 &&
g.score[0]["Unnamed:1"] !== undefined
);

// count games per date

const dateCounts={};

games.forEach(g=>{

const d=g.game_id.substring(0,8);

dateCounts[d]=(dateCounts[d]||0)+1;

});

// find regular season max

const dates=Object.keys(dateCounts).sort();

const maxGames=Math.max(...Object.values(dateCounts));

// find last regular season date

let lastRegular=null;

dates.forEach(d=>{
if(dateCounts[d]===maxGames)
lastRegular=d;
});

// playoff dates

const playoffDates=dates.filter(d=>d>lastRegular);

// cluster playoff dates

const clusters=[];

let current=[];

playoffDates.forEach(d=>{

if(current.length===0){

current.push(d);

}else{

const prev=current[current.length-1];

const diff=(new Date(d.substring(0,4)+"-"+d.substring(4,6)+"-"+d.substring(6,8))-
new Date(prev.substring(0,4)+"-"+prev.substring(4,6)+"-"+prev.substring(6,8)))
/86400000;

if(diff<=2){

current.push(d);

}else{

clusters.push(current);
current=[d];

}

}

});

if(current.length) clusters.push(current);

// map round names

const roundMap={};

clusters.forEach(cluster=>{

let total=0;

cluster.forEach(d=>total+=dateCounts[d]);

let name="Playoffs";

if(total===1) name="Super Bowl";
else if(total===2) name="Conference Championship";
else if(total===4) name="Divisional";
else if(total===6||total===8) name="Wild Card";

cluster.forEach(d=>roundMap[d]=name);

});

// render table

tbody.innerHTML="";

games.sort((a,b)=>a.game_id.localeCompare(b.game_id));

games.forEach(g=>{

const d=g.game_id.substring(0,8);

const team1=g.score[0]["Unnamed: 1"];
const team2=g.score[1]["Unnamed: 1"];

const s1=Number(g.score[0]["Final"]);
const s2=Number(g.score[1]["Final"]);

let winner,loser,ws,ls;

if(s1>s2){
winner=team1; loser=team2; ws=s1; ls=s2;
}else{
winner=team2; loser=team1; ws=s2; ls=s1;
}

const round=roundMap[d]||"Regular Season";

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${d.substring(6,8)}/${d.substring(4,6)}/${d.substring(0,4)}</td>
<td>${winner} ${ws}</td>
<td>def</td>
<td>${loser} ${ls}</td>
<td class="${round!=="Regular Season"?"playoff":""}">${round}</td>
`;

tbody.appendChild(tr);

});

}

loadSeason();

</script>

</body>
</html>
