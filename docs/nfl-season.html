<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
}

.navbar a{
  text-decoration:none;
  color:#013369;
  font-weight:600;
}

.hero{
  background:linear-gradient(90deg,#013369,#d50a0a);
  color:white;
  padding:30px;
  text-align:center;
  font-size:28px;
  font-weight:700;
}

.container{
  max-width:1000px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  background:#f8fafc;
}

tr:hover{
  background:#f1f5f9;
  cursor:pointer;
}

.playoff{
  color:#d50a0a;
  font-weight:700;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero" id="title">
NFL Season
</div>

<div class="container">

<table id="games">

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th></th>
<th>Home</th>
<th>Round</th>
</tr>
</thead>

<tbody>
<tr><td colspan="5">Loading season...</td></tr>
</tbody>

</table>

</div>

<script>

const params = new URLSearchParams(location.search);
const year = params.get("year");

document.getElementById("title").innerHTML = "NFL " + year;

fetch("data/nfl/nfl_" + year + ".json")
.then(r=>r.json())
.then(data=>{

const tbody = document.querySelector("#games tbody");

tbody.innerHTML="";

data.games.forEach(game=>{

let away = "";
let home = "";
let awayScore = "";
let homeScore = "";

if(game.score && game.score.length>=2){

away = game.score[0].Tm || "";
home = game.score[1].Tm || "";

awayScore = game.score[0].Final || "";
homeScore = game.score[1].Final || "";

}

const tr = document.createElement("tr");

const round = game.round ? game.round : "Regular Season";

tr.innerHTML = `
<td>${game.week || ""}</td>
<td>${away} ${awayScore}</td>
<td>def</td>
<td>${home} ${homeScore}</td>
<td class="${game.is_playoff ? "playoff":""}">${round}</td>
`;

tr.onclick=()=>{
location.href=`nfl-game.html?year=${year}&id=${game.game_id}`;
};

tbody.appendChild(tr);

});

});

</script>

</body>
</html>
