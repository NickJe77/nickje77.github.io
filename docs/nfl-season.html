<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
}

.navbar a{
  text-decoration:none;
  color:#013369;
  font-weight:600;
}

.hero{
  background:linear-gradient(90deg,#013369,#d50a0a);
  color:white;
  padding:30px;
  text-align:center;
  font-size:28px;
  font-weight:700;
}

.container{
  max-width:1000px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:10px;
  border-bottom:1px solid #eee;
}

th{
  background:#f8fafc;
}

tr:hover{
  background:#f1f5f9;
  cursor:pointer;
}

.playoff{
  color:#d50a0a;
  font-weight:700;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero" id="title">NFL Season</div>

<div class="container">

<table id="games">

<thead>
<tr>
<th>Date</th>
<th>Winner</th>
<th></th>
<th>Loser</th>
<th>Type</th>
</tr>
</thead>

<tbody>
<tr><td colspan="5">Loading season...</td></tr>
</tbody>

</table>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const year = parseInt(params.get("year"));

const title = document.getElementById("title");
const tbody = document.querySelector("#games tbody");

async function loadSeason(){

try{

if(!year){
tbody.innerHTML="<tr><td colspan='5'>No season specified</td></tr>";
return;
}

title.innerHTML="NFL "+year;

const res = await fetch("data/nfl/nfl_"+year+".json");
const data = await res.json();

tbody.innerHTML="";


// COUNT GAMES PER DATE
const dateCounts = {};

data.games.forEach(game=>{

if(!game.game_id) return;

const date = game.game_id.substring(0,8);

if(!dateCounts[date]) dateCounts[date] = 0;

dateCounts[date]++;

});


// RENDER GAMES
data.games.forEach(game=>{

if(!game.score || game.score.length < 2) return;

const team1 = game.score[0]["Unnamed: 1"];
const team2 = game.score[1]["Unnamed: 1"];

const score1 = Number(game.score[0]["Final"]);
const score2 = Number(game.score[1]["Final"]);

if(!team1 || !team2) return;
if(isNaN(score1) || isNaN(score2)) return;


// determine winner

let winner, loser, winnerScore, loserScore;

if(score1 > score2){

winner = team1;
loser = team2;
winnerScore = score1;
loserScore = score2;

}else{

winner = team2;
loser = team1;
winnerScore = score2;
loserScore = score1;

}


// date parsing

const rawDate = game.game_id.substring(0,8);

const y = rawDate.substring(0,4);
const m = rawDate.substring(4,6);
const d = rawDate.substring(6,8);

const displayDate = d+"/"+m+"/"+y;


// PLAYOFF RULE: LESS THAN 8 GAMES THAT DAY

let type = "Regular Season";

if(dateCounts[rawDate] < 8){

type = "Playoffs";

}


// render row

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${displayDate}</td>
<td>${winner} ${winnerScore}</td>
<td>def</td>
<td>${loser} ${loserScore}</td>
<td class="${type==='Playoffs'?'playoff':''}">${type}</td>
`;

tr.onclick=()=>{
location.href="nfl-game.html?year="+year+"&id="+game.game_id;
};

tbody.appendChild(tr);

});


}catch(err){

console.error(err);
tbody.innerHTML="<tr><td colspan='5'>Error loading season</td></tr>";

}

}

loadSeason();

</script>

</body>
</html>
