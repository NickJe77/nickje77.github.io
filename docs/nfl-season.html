<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f3f4f7;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
}

.navbar a{
text-decoration:none;
color:#013369;
font-weight:600;
}

.hero{
background:linear-gradient(90deg,#013369,#d50a0a);
color:white;
padding:30px;
text-align:center;
font-size:28px;
font-weight:700;
}

.container{
max-width:1000px;
margin:30px auto;
background:white;
padding:20px;
border-radius:12px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#f1f5f9;
cursor:pointer;
}

.playoff{
color:#d50a0a;
font-weight:700;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero" id="title">NFL Season</div>

<div class="container">

<table id="games">

<thead>
<tr>
<th>Date</th>
<th>Winner</th>
<th></th>
<th>Loser</th>
<th>Round</th>
</tr>
</thead>

<tbody>
<tr><td colspan="5">Loading season...</td></tr>
</tbody>

</table>

</div>

<script>

const params=new URLSearchParams(location.search);

const year=parseInt(params.get("year"));

document.getElementById("title").innerHTML="NFL "+year;

function playoffStructure(year){

if(year<=1977)return{wild:0,div:4,conf:2,sb:1};
if(year<=1989)return{wild:4,div:4,conf:2,sb:1};
if(year<=2001)return{wild:6,div:4,conf:2,sb:1};
if(year<=2019)return{wild:4,div:4,conf:2,sb:1};
return{wild:6,div:4,conf:2,sb:1};

}

fetch("data/nfl/nfl_"+year+".json")

.then(r=>r.json())

.then(data=>{

const games=data.games.filter(g=>
g&&g.game_id&&g.score&&g.score.length>=2
);

games.sort((a,b)=>a.game_id.localeCompare(b.game_id));

const structure=playoffStructure(year);

const roundMap={};

let i=games.length-1;

roundMap[games[i--].game_id]="Super Bowl";

for(let x=0;x<structure.conf;x++)
roundMap[games[i--].game_id]="Conference Championship";

for(let x=0;x<structure.div;x++)
roundMap[games[i--].game_id]="Divisional";

for(let x=0;x<structure.wild;x++)
roundMap[games[i--].game_id]="Wild Card";

const tbody=document.querySelector("#games tbody");

tbody.innerHTML="";

games.forEach(g=>{

const date=g.game_id.substring(0,8);

const team1=g.score[0]["Unnamed: 1"];
const team2=g.score[1]["Unnamed: 1"];

const s1=parseInt(g.score[0]["Final"]);
const s2=parseInt(g.score[1]["Final"]);

let winner,loser,ws,ls;

if(s1>s2){

winner=team1;
loser=team2;
ws=s1;
ls=s2;

}else{

winner=team2;
loser=team1;
ws=s2;
ls=s1;

}

const round=roundMap[g.game_id]||"Regular Season";

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${date.substring(6,8)}/${date.substring(4,6)}/${date.substring(0,4)}</td>
<td>${winner} ${ws}</td>
<td>def</td>
<td>${loser} ${ls}</td>
<td class="${round!=="Regular Season"?"playoff":""}">${round}</td>
`;

tr.onclick=()=>{
location.href="nfl-game.html?year="+year+"&id="+g.game_id;
};

tbody.appendChild(tr);

});

});

</script>

</body>
</html>
