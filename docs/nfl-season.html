<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
}

.navbar a{
  text-decoration:none;
  color:#013369;
  font-weight:600;
}

.hero{
  background:linear-gradient(90deg,#013369,#d50a0a);
  color:white;
  padding:30px;
  text-align:center;
  font-size:28px;
  font-weight:700;
}

.container{
  max-width:1000px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  background:#f8fafc;
}

tr:hover{
  background:#f1f5f9;
  cursor:pointer;
}

.playoff{
  color:#d50a0a;
  font-weight:700;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero" id="title">
NFL Season
</div>

<div class="container">

<table id="games">

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th></th>
<th>Home</th>
<th>Round</th>
</tr>
</thead>

<tbody>
<tr>
<td colspan="5">Loading season...</td>
</tr>
</tbody>

</table>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const year = params.get("year");

const title = document.getElementById("title");
const tbody = document.querySelector("#games tbody");

if(!year){

title.innerHTML="NFL Season";
tbody.innerHTML="<tr><td colspan='5'>No season selected</td></tr>";
throw new Error("Missing year parameter");

}

title.innerHTML="NFL "+year;

const filePath="data/nfl/nfl_"+year+".json";

fetch(filePath)

.then(response=>{

if(!response.ok){

throw new Error("File not found");

}

return response.json();

})

.then(data=>{

if(!data.games || data.games.length===0){

tbody.innerHTML="<tr><td colspan='5'>No games found</td></tr>";
return;

}

tbody.innerHTML="";

data.games.forEach(game=>{

const away = game.score?.[0]?.["Unnamed: 1"] || "";
const home = game.score?.[1]?.["Unnamed: 1"] || "";

const awayScore = game.score?.[0]?.Final ?? "";
const homeScore = game.score?.[1]?.Final ?? "";

let date="";

if(game.game_id){

const month=game.game_id.substring(4,6);
const day=game.game_id.substring(6,8);

date=day+"/"+month+"/"+year;

}

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${date}</td>
<td>${away} ${awayScore}</td>
<td>def</td>
<td>${home} ${homeScore}</td>
<td>Regular Season</td>
`;

tr.onclick=()=>{

location.href="nfl-game.html?year="+year+"&id="+game.game_id;

};

tbody.appendChild(tr);

});

})

.catch(error=>{

console.error(error);

tbody.innerHTML=`
<tr>
<td colspan="5">
Failed to load season<br>
${filePath}
</td>
</tr>
`;

});

</script>

</body>
</html>
