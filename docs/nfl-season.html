<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}


/* HEADER */

.hero{
padding:20px;
font-size:32px;
font-weight:700;
}


/* YEAR TABS */

.year-tabs{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:0 20px 10px 20px;
}

.year-tab{
padding:10px 16px;
background:#d9d9d9;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.year-tab.active{
background:#333;
color:white;
}


/* ROUND TABS */

.round-tabs{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:0 20px 20px 20px;
}

.round-tab{
padding:10px 16px;
background:#d9d9d9;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.round-tab.active{
background:#333;
color:white;
}


/* TABLE */

.container{
max-width:1100px;
margin:0 auto;
background:white;
border-radius:12px;
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#f1f5f9;
cursor:pointer;
}

.playoff{
color:#d50a0a;
font-weight:700;
}

</style>
</head>
<body>


<div class="hero" id="title">NFL Season</div>


<div class="year-tabs" id="yearTabs"></div>


<div class="round-tabs" id="roundTabs">

<div class="round-tab active" onclick="setRound('All')">All Rounds</div>
<div class="round-tab" onclick="setRound('Regular Season')">Regular Season</div>
<div class="round-tab" onclick="setRound('Wild Card')">Wild Card</div>
<div class="round-tab" onclick="setRound('Divisional')">Divisional</div>
<div class="round-tab" onclick="setRound('Conference Championship')">Conference Championship</div>
<div class="round-tab" onclick="setRound('Super Bowl')">Super Bowl</div>

</div>


<div class="container">

<table id="games">

<thead>
<tr>
<th>Date</th>
<th>Winner</th>
<th></th>
<th>Loser</th>
<th>Round</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>


<script>

const startYear=1970;
const currentYear=new Date().getFullYear();

let currentSeason=currentYear;
let currentRound="All";
let seasonGames=[];


/* BUILD YEAR TABS */

const yearTabs=document.getElementById("yearTabs");

for(let y=startYear;y<=currentYear;y++){

const tab=document.createElement("div");

tab.className="year-tab";

tab.innerText=y;

tab.onclick=()=>loadSeason(y);

yearTabs.appendChild(tab);

}


/* HIGHLIGHT YEAR */

function highlightYear(year){

document.querySelectorAll(".year-tab").forEach(t=>{

t.classList.remove("active");

if(parseInt(t.innerText)==year)
t.classList.add("active");

});

}


/* ROUND SELECT */

function setRound(round){

currentRound=round;

document.querySelectorAll(".round-tab").forEach(t=>{

t.classList.remove("active");

if(t.innerText==round|| (round=="All" && t.innerText=="All Rounds"))
t.classList.add("active");

});

renderGames();

}


/* PLAYOFF STRUCTURE */

function playoffStructure(year){

if(year<=1977)return{wild:0,div:4,conf:2,sb:1};
if(year<=1989)return{wild:4,div:4,conf:2,sb:1};
if(year<=2001)return{wild:6,div:4,conf:2,sb:1};
if(year<=2019)return{wild:4,div:4,conf:2,sb:1};

return{wild:6,div:4,conf:2,sb:1};

}


/* LOAD SEASON */

async function loadSeason(year){

currentSeason=year;

highlightYear(year);

document.getElementById("title").innerText="NFL "+year;

const res=await fetch("data/nfl/nfl_"+year+".json");

const data=await res.json();


seasonGames=data.games.filter(g=>

g &&
g.game_id &&
g.score &&
g.score.length==2 &&
g.score[0]["Unnamed: 1"] &&
g.score[1]["Unnamed: 1"]

);


seasonGames.sort((a,b)=>a.game_id.localeCompare(b.game_id));


const structure=playoffStructure(year);

let i=seasonGames.length-1;

seasonGames[i--].round="Super Bowl";

for(let x=0;x<structure.conf;x++)
seasonGames[i--].round="Conference Championship";

for(let x=0;x<structure.div;x++)
seasonGames[i--].round="Divisional";

for(let x=0;x<structure.wild;x++)
seasonGames[i--].round="Wild Card";

seasonGames.forEach(g=>{

if(!g.round)
g.round="Regular Season";

});


renderGames();

}


/* RENDER */

function renderGames(){

const tbody=document.querySelector("#games tbody");

tbody.innerHTML="";

seasonGames.forEach(g=>{

if(currentRound!="All" && g.round!=currentRound)
return;

const date=g.game_id.substring(0,8);

const team1=g.score[0]["Unnamed: 1"];
const team2=g.score[1]["Unnamed: 1"];

const s1=parseInt(g.score[0]["Final"]);
const s2=parseInt(g.score[1]["Final"]);

let winner,loser,ws,ls;

if(s1>s2){

winner=team1;
loser=team2;
ws=s1;
ls=s2;

}else{

winner=team2;
loser=team1;
ws=s2;
ls=s1;

}

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${date.substring(6,8)}/${date.substring(4,6)}/${date.substring(0,4)}</td>
<td>${winner} ${ws}</td>
<td>def</td>
<td>${loser} ${ls}</td>
<td class="${g.round!='Regular Season'?'playoff':''}">${g.round}</td>
`;

tr.onclick=()=>{
location.href="nfl-game.html?year="+currentSeason+"&id="+g.game_id;
};

tbody.appendChild(tr);

});

}


/* INIT */

loadSeason(currentYear);

</script>

</body>
</html>
