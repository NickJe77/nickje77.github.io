<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
}

.navbar a{
  text-decoration:none;
  color:#013369;
  font-weight:600;
}

.hero{
  background:linear-gradient(90deg,#013369,#d50a0a);
  color:white;
  padding:30px;
  text-align:center;
  font-size:28px;
  font-weight:700;
}

.container{
  max-width:1200px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px 10px;
  border-bottom:1px solid #eee;
}

th{
  background:#f8fafc;
  text-align:left;
}

tr:hover{
  background:#f1f5f9;
  cursor:pointer;
}

.round.playoff{
  color:#d50a0a;
  font-weight:700;
}

.venue{
  color:#666;
  font-size:14px;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero" id="title">NFL Season</div>

<div class="container">

<table id="games">

<thead>
<tr>
<th>Date</th>
<th>Winner</th>
<th></th>
<th>Loser</th>
<th>Venue</th>
<th>Round</th>
</tr>
</thead>

<tbody>
<tr><td colspan="6">Loading season...</td></tr>
</tbody>

</table>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const year = parseInt(params.get("year"));

const tbody = document.querySelector("#games tbody");

async function loadSeason(){

document.getElementById("title").innerHTML="NFL "+year;

const res = await fetch("data/nfl/nfl_"+year+".json");
const data = await res.json();

tbody.innerHTML="";

data.games.forEach(game=>{

if(!game.game_id) return;
if(!game.score || game.score.length<2) return;

const team1 = game.score[0]["Unnamed: 1"];
const team2 = game.score[1]["Unnamed: 1"];

const score1 = Number(game.score[0]["Final"]);
const score2 = Number(game.score[1]["Final"]);

if(isNaN(score1) || isNaN(score2)) return;

let winner, loser, wScore, lScore;

if(score1 > score2){

winner=team1;
loser=team2;
wScore=score1;
lScore=score2;

}else{

winner=team2;
loser=team1;
wScore=score2;
lScore=score1;

}

const rawDate = game.game_id.substring(0,8);

const date =
rawDate.substring(6,8)+"/"+
rawDate.substring(4,6)+"/"+
rawDate.substring(0,4);

const venue = game.venue || game.stadium || "";

const round = game.round || "Regular Season";

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${date}</td>
<td>${winner} ${wScore}</td>
<td>def</td>
<td>${loser} ${lScore}</td>
<td class="venue">${venue}</td>
<td class="round">${round}</td>
`;

tbody.appendChild(tr);

});

}

loadSeason();

</script>

</body>
</html>
