<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst Driver | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:Inter,system-ui,Arial;
      margin:0;
      background:#f4f6f8;
    }

    .navbar{
      display:flex;
      justify-content:center;
      gap:24px;
      padding:16px 0;
      background:#fff;
      border-bottom:1px solid #ddd;
      font-weight:600;
    }

    .navbar a{
      text-decoration:none;
      color:#0056d6;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:10px;
    }

    .summary{
      display:flex;
      justify-content:center;
      gap:40px;
      margin-bottom:20px;
      font-weight:600;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#fff;
      border-radius:10px;
      overflow:hidden;
    }

    th, td{
      padding:10px;
      text-align:left;
      font-size:14px;
    }

    th{
      background:#002D72;
      color:#fff;
    }

    tbody tr:nth-child(even){
      background:#f2f6ff;
    }

    tbody tr:hover{
      background:#e0ecff;
    }

    .win{
      background:#d4edda !important;
      font-weight:600;
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="bathurst-drivers.html">Drivers</a>
  <a href="bathurst.html">Bathurst</a>
  <a href="/">Home</a>
</div>

<div class="container">
  <h1 id="name">Loading...</h1>

  <div class="summary">
    <div>Starts: <span id="starts">0</span></div>
    <div>Wins: <span id="wins">0</span></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Result</th>
        <th>Car</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

<script>

// -------------------------
// GET DRIVER
// -------------------------
const params = new URLSearchParams(window.location.search);
const slug = params.get("driver") || "";

function deslug(s){
  return s
    .split("-")
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(" ");
}

const driverName = deslug(slug);

document.getElementById("name").innerText = driverName || "Driver";

// -------------------------
let starts = 0;
let wins = 0;
let races = [];

// -------------------------
// LOAD INDEX (YEARS)
// -------------------------
fetch("/data/bathurst/index.json")
  .then(res => res.json())
  .then(index => {

    let years = index.seasons || index.years || index;

    if(!Array.isArray(years)){
      throw new Error("Invalid index.json");
    }

    // load all seasons
    return Promise.all(
      years.map(y =>
        fetch(`/data/bathurst/seasons/${y}.json`)
          .then(r => r.json())
          .then(data => ({ year: y, data }))
      )
    );

  })
  .then(allSeasons => {

    allSeasons.forEach(season => {

      season.data.results.forEach(r => {

        // split drivers properly
        let driverList = [];

        if(r.driver && r.driver.includes("/")){
          driverList = r.driver.split("/").map(d => d.trim());
        } else {
          const parts = r.driver.trim().split(" ");
          const mid = Math.floor(parts.length / 2);
          driverList = [
            parts.slice(0, mid).join(" "),
            parts.slice(mid).join(" ")
          ];
        }

        // check if this driver is in the race
        if(driverList.some(d => d.toLowerCase() === driverName.toLowerCase())){

          starts++;

          if(r.position == 1){
            wins++;
          }

          races.push({
            year: season.year,
            position: r.position,
            car: r.car
          });

        }

      });

    });

    render();

  })
  .catch(err => {
    document.getElementById("name").innerText = "Error loading driver";
    console.error(err);
  });

// -------------------------
function render(){

  document.getElementById("starts").innerText = starts;
  document.getElementById("wins").innerText = wins;

  const tbody = document.getElementById("table");
  tbody.innerHTML = "";

  races.sort((a,b) => b.year - a.year);

  races.forEach(r => {

    const tr = document.createElement("tr");

    if(r.position == 1){
      tr.classList.add("win");
    }

    tr.innerHTML = `
      <td>${r.year}</td>
      <td>${r.position}</td>
      <td>${r.car || ""}</td>
    `;

    tbody.appendChild(tr);
  });
}

</script>

</body>
</html>
