<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst Driver | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#eceff3;
      --surface:#ffffff;
      --ink:#0f141a;
      --muted:#69727c;
      --faint:#9aa3ad;
      --line:#e3e8ee;
      --board:#0c130f;
      --board-2:#161f16;
      --accent:#c99a3d;
      --accent-soft:rgba(201,154,61,.16);
      --win-bg:#e6f4ea;
      --win-text:#1e7a3d;
      --display:'Oswald',system-ui,sans-serif;
      --body:'Inter',system-ui,sans-serif;
      --radius:16px;
    }
    *{box-sizing:border-box;}
    body{
      font-family:var(--body);
      margin:0;
      background:var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
    }
    .navbar{
      display:flex;
      justify-content:center;
      gap:22px;
      padding:15px 0;
      background:var(--surface);
      border-bottom:1px solid var(--line);
      font-weight:600;
      font-size:13.5px;
    }
    .navbar a{
      text-decoration:none;
      color:var(--ink);
      opacity:.7;
      transition:opacity .15s,color .15s;
    }
    .navbar a:hover,.navbar a[aria-current="page"]{
      opacity:1;
      color:var(--accent);
    }
    .container{
      max-width:1000px;
      margin:0 auto;
      padding:26px 20px 70px;
    }

    /* ── Hero ─────────────────────────────────────────────── */
    .hero{
      position:relative;
      background:linear-gradient(160deg,var(--board-2),var(--board));
      color:#fff;
      padding:32px 34px;
      border-radius:var(--radius);
      margin-bottom:22px;
      text-align:center;
      box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
    }
    .hero .eyebrow{
      font-family:var(--body);
      font-size:11.5px;
      font-weight:600;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--accent);
      margin-bottom:10px;
    }
    .hero h1{
      margin:0;
      font-family:var(--display);
      font-weight:600;
      font-size:clamp(26px,5vw,40px);
      letter-spacing:.01em;
      text-transform:uppercase;
      color:#fff;
    }

    /* ── Summary stat cards ───────────────────────────────── */
    .summary{
      display:flex;
      justify-content:center;
      gap:14px;
      margin-bottom:22px;
      flex-wrap:wrap;
    }
    .summary div{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px 28px;
      text-align:center;
      font-weight:600;
      color:var(--muted);
      font-size:13px;
    }
    .summary span{
      display:block;
      font-family:var(--display);
      font-weight:600;
      font-size:26px;
      color:var(--ink);
      margin-top:4px;
      font-variant-numeric:tabular-nums;
    }

    /* ── Table ────────────────────────────────────────────── */
    table{
      width:100%;
      border-collapse:collapse;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
    }
    th, td{
      padding:11px 14px;
      text-align:left;
      font-size:13.5px;
      border-bottom:1px solid var(--line);
    }
    th{
      background:#f7f9fb;
      color:var(--muted);
      font-family:var(--body);
      font-weight:600;
      font-size:11px;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    td{
      color:#27313c;
      font-variant-numeric:tabular-nums;
    }
    td:first-child{
      font-weight:700;
      color:var(--ink);
    }
    tbody tr:last-child td{ border-bottom:none; }
    tbody tr:hover td{ background:#f9fbfd; }
    .win td{
      background:var(--win-bg) !important;
      font-weight:600;
      color:var(--win-text);
    }
    .win td:first-child{ color:var(--win-text); }
  </style>
</head>
<body>
<div class="navbar">
  <a href="bathurst.html">Bathurst</a>
  <a href="/">Home</a>
</div>
<div class="container">
  <div class="hero">
    <div class="eyebrow">Bathurst</div>
    <h1 id="name">Loading...</h1>
  </div>
  <div class="summary">
    <div>Starts<span id="starts">0</span></div>
    <div>Wins<span id="wins">0</span></div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Result</th>
        <th>Car</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>
<script>
// -------------------------
// GET DRIVER FROM URL
// -------------------------
const params = new URLSearchParams(window.location.search);
const slug = params.get("driver") || "";
function deslug(s){
  return s
    .split("-")
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(" ");
}
const driverName = deslug(slug);
document.getElementById("name").innerText = driverName || "Driver";
// -------------------------
let starts = 0;
let wins = 0;
let races = [];
// -------------------------
// LOAD INDEX
// -------------------------
fetch("/data/bathurst/index.json")
  .then(res => res.json())
  .then(index => {
    return Promise.all(
      index.map(item =>
        fetch(`/data/bathurst/seasons/${item.year}.json`)
          .then(r => r.json())
          .then(data => ({ year: item.year, data }))
      )
    );
  })
  .then(allSeasons => {
    allSeasons.forEach(season => {
      season.data.results.forEach(r => {
        if(!r.driver) return;
        let driverList = r.driver.includes("/")
          ? r.driver.split("/").map(d => d.trim())
          : [r.driver.trim()];
        if(driverList.some(d => d.toLowerCase().trim() === driverName.toLowerCase().trim())){
          starts++;
          if(String(r.position) === "1"){
            wins++;
          }
          races.push({
            year: season.year,
            position: r.position,
            car: r.car
          });
        }
      });
    });
    render();
  })
  .catch(err => {
    document.getElementById("name").innerText = "Error loading driver";
    console.error(err);
  });
// -------------------------
function render(){
  document.getElementById("starts").innerText = starts;
  document.getElementById("wins").innerText = wins;
  const tbody = document.getElementById("table");
  tbody.innerHTML = "";
  races.sort((a,b) => b.year - a.year);
  races.forEach(r => {
    const tr = document.createElement("tr");
    if(String(r.position) === "1"){
      tr.classList.add("win");
    }
    tr.innerHTML = `
      <td>${r.year}</td>
      <td>${r.position}</td>
      <td>${r.car || ""}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>
</body>
</html>
