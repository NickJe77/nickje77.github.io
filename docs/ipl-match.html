<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.summary-box{
  border:1px solid #ddd;
  border-radius:14px;
  padding:15px;
  background:#faf7ff;
}
.summary-box strong{
  display:block;
  margin-bottom:6px;
}

h2{margin-top:40px;color:#3b007a;}

table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:25px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>IPL Match</h1>
  <p id="statusText">Loading match…</p>
</div>

<div class="summary-grid">
  <div class="summary-box"><strong>Date</strong><span id="dateBox">—</span></div>
  <div class="summary-box"><strong>Teams</strong><span id="teamsBox">—</span></div>
  <div class="summary-box"><strong>Venue</strong><span id="venueBox">—</span></div>
  <div class="summary-box"><strong>Winner</strong><span id="winnerBox">—</span></div>
  <div class="summary-box"><strong>Result</strong><span id="resultBox">—</span></div>
</div>

<div id="inningsContainer"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const params = new URLSearchParams(window.location.search);
const fileParam = params.get("file");

const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";

const statusText = document.getElementById("statusText");
const dateBox = document.getElementById("dateBox");
const teamsBox = document.getElementById("teamsBox");
const venueBox = document.getElementById("venueBox");
const winnerBox = document.getElementById("winnerBox");
const resultBox = document.getElementById("resultBox");
const inningsContainer = document.getElementById("inningsContainer");

if(!fileParam){
  statusText.textContent = "Missing match file parameter.";
  return;
}

fetch(indexUrl)
.then(r=>r.json())
.then(files=>Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json()))))
.then(seasons=>{
  let match=null;
  seasons.forEach(season=>{
    season.forEach(m=>{
      if(m.file===fileParam) match=m;
    });
  });

  if(!match){
    statusText.textContent="Match not found.";
    return;
  }

  const info = match.info;
  statusText.textContent="Match loaded";

  dateBox.textContent = formatDate(info.dates[0]);
  teamsBox.textContent = info.teams.join(" vs ");
  venueBox.textContent = info.venue;
  winnerBox.textContent = info.outcome?.winner || "—";

  let result="—";
  if(info.outcome?.by){
    if(info.outcome.by.runs) result="won by "+info.outcome.by.runs+" runs";
    if(info.outcome.by.wickets) result="won by "+info.outcome.by.wickets+" wickets";
  }
  resultBox.textContent=result;

  renderInnings(match.innings);
});

function renderInnings(innings){
  innings.forEach(inn=>{
    const batStats={}, bowlStats={};
    let runs=0, wickets=0, balls=0;

    inn.overs.forEach(over=>{
      over.deliveries.forEach(d=>{
        balls++;
        const batter=d.batter;
        const bowler=d.bowler;
        const r=d.runs.batter;

        if(!batStats[batter]) batStats[batter]={runs:0,balls:0};
        batStats[batter].runs+=r;
        batStats[batter].balls++;

        if(!bowlStats[bowler]) bowlStats[bowler]={runs:0,balls:0,wkts:0};
        bowlStats[bowler].runs+=d.runs.total;
        bowlStats[bowler].balls++;

        if(d.wickets) bowlStats[bowler].wkts+=d.wickets.length;

        runs+=d.runs.total;
        if(d.wickets) wickets+=d.wickets.length;
      });
    });

    const overs=(Math.floor(balls/6)+"."+(balls%6));

    let html=`<h2>${inn.team} Innings</h2>
    <p><strong>${runs}/${wickets}</strong> (${overs} overs)</p>

    <h3>Batting</h3>
    <table><tr><th>Batter</th><th>R</th><th>B</th><th>SR</th></tr>`;

    Object.entries(batStats).forEach(([p,s])=>{
      const sr=((s.runs/s.balls)*100).toFixed(1);
      html+=`<tr><td>${p}</td><td>${s.runs}</td><td>${s.balls}</td><td>${sr}</td></tr>`;
    });
    html+=`</table><h3>Bowling</h3>
    <table><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th></tr>`;

    Object.entries(bowlStats).forEach(([p,s])=>{
      const o=(Math.floor(s.balls/6)+"."+(s.balls%6));
      html+=`<tr><td>${p}</td><td>${o}</td><td>${s.runs}</td><td>${s.wkts}</td></tr>`;
    });

    html+=`</table>`;
    inningsContainer.innerHTML+=html;
  });
}

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

});
</script>

</body>
</html>
