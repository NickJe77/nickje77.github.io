<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{
  margin:0;
  font-size:46px;
}
.hero p{
  margin-top:10px;
  font-size:18px;
  opacity:0.95;
}

/* rest of your CSS unchanged */
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="ipl-player.html">IPL Players</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="matchTitle">Loading match…</h1>
  <p id="statusText"></p>
</div>

<!-- your summary + innings sections unchanged -->

<script>
document.addEventListener("DOMContentLoaded", () => {

const params = new URLSearchParams(window.location.search);
const fileParam = params.get("file");

const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const nameMapUrl = "data/ipl/player-names.json";

let nameMap = {};

const matchTitle = document.getElementById("matchTitle");
const statusText = document.getElementById("statusText");

fetch(nameMapUrl)
.then(r => r.json())
.then(names => {

nameMap = names || {};

return fetch(indexUrl).then(r=>r.json());

})
.then(files=>Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json()))))
.then(seasons=>{

let match=null;

seasons.forEach(season=>{
season.forEach(m=>{
if(m.file===fileParam) match=m;
});
});

if(!match){
matchTitle.textContent="Match not found";
return;
}

const info = match.info;

const team1 = nameMap[info.teams[0]] || info.teams[0];
const team2 = nameMap[info.teams[1]] || info.teams[1];

const venue = info.venue || "";

const date =
new Date(info.dates[0]).toDateString();

const winner =
nameMap[info.outcome?.winner] ||
info.outcome?.winner ||
"—";

const pom =
info.player_of_match
? info.player_of_match
.map(p=>nameMap[p]||p)
.join(", ")
: null;

/* HERO TITLE */
matchTitle.textContent =
team1 + " vs " + team2;

/* HERO SUBTITLE */
let meta =
venue +
" • " +
date +
" • Winner: " +
winner;

if(pom){
meta +=
" • Player of the Match: " +
pom;
}

statusText.textContent = meta;

/* rest of your rendering unchanged */

});

});
</script>

</body>
</html>
