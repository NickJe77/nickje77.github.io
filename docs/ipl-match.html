<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:10px;font-size:18px;}

.box-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-bottom:30px;
}
.box{
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  background:#faf7ff;
}
.box strong{display:block;margin-bottom:6px;}

.debug{
  background:#000;
  color:#0f0;
  padding:15px;
  border-radius:10px;
  font-family:monospace;
  white-space:pre-wrap;
}
.error{color:#ff4d4d;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>IPL Match</h1>
  <p id="statusText">Loading match…</p>
</div>

<div class="box-grid">
  <div class="box"><strong>Season</strong><span id="seasonBox">—</span></div>
  <div class="box"><strong>Date</strong><span id="dateBox">—</span></div>
  <div class="box"><strong>Teams</strong><span id="teamsBox">—</span></div>
  <div class="box"><strong>Venue</strong><span id="venueBox">—</span></div>
  <div class="box"><strong>Winner</strong><span id="winnerBox">—</span></div>
  <div class="box"><strong>Result</strong><span id="resultBox">—</span></div>
</div>

<div class="debug" id="debugLog"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const season = params.get("season");
const fileId = params.get("file");

const debug = document.getElementById("debugLog");
function log(msg){ debug.textContent += msg + "\n"; }

log("Season param = " + season);
log("File param = " + fileId);

if(!season || !fileId){
  document.getElementById("statusText").textContent = "Missing match parameters";
  log("ERROR: Missing season or file");
  throw new Error("Missing params");
}

const seasonUrl = `data/ipl/ipl_${season}.json`;
log("Fetching season file: " + seasonUrl);

fetch(seasonUrl)
.then(r=>{
  log("HTTP " + r.status);
  if(!r.ok) throw new Error("Season file not found");
  return r.json();
})
.then(matches=>{
  log("Matches loaded: " + matches.length);

  const match = matches.find(m => m.file === fileId);

  if(!match){
    document.getElementById("statusText").textContent = "Match not found in season file";
    log("ERROR: Match not found");
    return;
  }

  document.getElementById("statusText").textContent = "Match loaded";

  document.getElementById("seasonBox").textContent = season;
  document.getElementById("dateBox").textContent = formatDate(match.date);
  document.getElementById("teamsBox").textContent = match.teams.join(" vs ");
  document.getElementById("venueBox").textContent = match.venue || "—";
  document.getElementById("winnerBox").textContent = match.outcome?.winner || "—";

  let result="—";
  if(match.outcome?.by){
    if(match.outcome.by.runs) result = "Won by " + match.outcome.by.runs + " runs";
    if(match.outcome.by.wickets) result = "Won by " + match.outcome.by.wickets + " wickets";
  }
  document.getElementById("resultBox").textContent = result;

})
.catch(err=>{
  document.getElementById("statusText").textContent = "Could not load match";
  log("ERROR: " + err.message);
});

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
</script>

</body>
</html>
