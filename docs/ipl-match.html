<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>IPL Match | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#eceff3;
      --surface:#ffffff;
      --ink:#0f141a;
      --muted:#69727c;
      --faint:#9aa3ad;
      --line:#e3e8ee;
      --board:#0c130f;
      --board-2:#161f16;
      --accent:#c99a3d;
      --accent-soft:rgba(201,154,61,.16);
      --display:'Oswald',system-ui,sans-serif;
      --body:'Inter',system-ui,sans-serif;
      --radius:16px;
    }
    *{box-sizing:border-box;}
    body{
      font-family:var(--body);
      margin:0;
      background:var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
    }

    .navbar{
      display:flex;
      justify-content:center;
      gap:22px;
      padding:15px 0;
      background:var(--surface);
      border-bottom:1px solid var(--line);
      font-weight:600;
      font-size:13.5px;
    }
    .navbar a{
      color:var(--ink);
      text-decoration:none;
      opacity:.7;
      transition:opacity .15s,color .15s;
    }
    .navbar a:hover,.navbar a[aria-current="page"]{
      opacity:1;
      color:var(--accent);
    }

    .page-wrap{
      max-width:1200px;
      margin:0 auto;
      padding:26px 20px 70px;
    }

    /* ── Hero ─────────────────────────────────────────────── */
    .hero{
      position:relative;
      background:linear-gradient(160deg,var(--board-2),var(--board));
      color:#fff;
      padding:32px 34px;
      border-radius:var(--radius);
      margin-bottom:26px;
      box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
    }
    .eyebrow{
      display:block;
      font-family:var(--body);
      font-size:11.5px;
      font-weight:600;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--accent);
      margin-bottom:10px;
    }
    .hero h1{
      margin:0;
      font-family:var(--display);
      font-weight:600;
      font-size:clamp(24px,4.5vw,36px);
      letter-spacing:.01em;
      text-transform:uppercase;
    }
    .hero p{
      margin-top:10px;
      font-size:13px;
      color:rgba(255,255,255,.75);
      font-weight:600;
    }

    h2{
      margin:34px 0 4px;
      font-family:var(--display);
      font-weight:600;
      font-size:20px;
      letter-spacing:.01em;
      text-transform:uppercase;
      color:var(--ink);
    }
    h2 + p{
      margin:0 0 12px;
      font-family:var(--display);
      font-size:18px;
      font-weight:600;
      color:var(--accent);
    }
    h3{
      margin:22px 0 10px;
      font-family:var(--display);
      font-weight:600;
      font-size:15px;
      letter-spacing:.02em;
      text-transform:uppercase;
      color:var(--muted);
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      font-size:13.5px;
    }

    th,td{
      border-bottom:1px solid var(--line);
      padding:9px 12px;
    }

    th{
      background:#f7f9fb;
      color:var(--muted);
      font-family:var(--body);
      font-weight:600;
      font-size:11px;
      letter-spacing:.04em;
      text-transform:uppercase;
      text-align:left;
    }
    td{
      color:#27313c;
      font-variant-numeric:tabular-nums;
    }
    td.num{text-align:right;}
    tbody tr:last-child td, tr:last-child td{border-bottom:none;}
    tr:hover td{background:#f0f6ff;}

    .note{
      margin-top:8px;
      font-size:12.5px;
      color:var(--muted);
    }

    a.player-link{
      color:var(--ink);
      text-decoration:none;
      font-weight:600;
    }
    a.player-link:hover{
      color:var(--accent);
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="ipl-player.html">IPL Players</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <span class="eyebrow">Cricket · IPL</span>
    <h1 id="matchTitle">Loading match…</h1>
    <p id="statusText"></p>
  </div>

  <div id="inningsContainer"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const params = new URLSearchParams(location.search);
  const season = params.get("season");
  const indexParam = params.get("index");

  const namesUrl = "/data/ipl/player-names.json";

  let nameMap = {};

  const matchTitle = document.getElementById("matchTitle");
  const statusText = document.getElementById("statusText");
  const inningsContainer = document.getElementById("inningsContainer");

  // ✅ FIXED FUNCTION (THIS WAS YOUR PROBLEM)
  function fullName(n){
    if (!n) return n;

    const slug = n
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, "")
      .trim()
      .replace(/\s+/g, "-");

    return nameMap[slug] || n;
  }

  function slugify(name){
    return name
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9\s-]/g,"")
      .trim()
      .replace(/\s+/g,"-");
  }

  function playerLink(name){
    const slug = slugify(name);
    return `<a class="player-link" href="ipl-player.html?player=${slug}">${fullName(name)}</a>`;
  }

  if (!season || indexParam === null) {
    matchTitle.textContent = "Missing match data";
    return;
  }

  const matchIndex = parseInt(indexParam, 10);

  fetch(namesUrl)
    .then(r => r.json())
    .then(names => {
      nameMap = names || {};
      return fetch(`/data/ipl/ipl_${season}_FULL.json`).then(r => r.json());
    })
    .then(matches => {

      const sortedMatches = [...matches].sort((a, b) => {
        const da = new Date(a.info?.dates?.[0] || a.date);
        const db = new Date(b.info?.dates?.[0] || b.date);
        return db - da;
      });

      const match = sortedMatches[matchIndex];

      if (!match) {
        matchTitle.textContent = "Match not found";
        return;
      }

      const info = match.info;

      matchTitle.textContent =
        fullName(info.teams[0]) + " vs " + fullName(info.teams[1]);

      let heroMeta =
        (info.venue || "") + " • " +
        new Date(info.dates[0]).toDateString() +
        " • Winner: " +
        fullName(info.outcome?.winner || "—");

      if (info.player_of_match) {
        heroMeta += " • Player of the Match: " +
          info.player_of_match.map(fullName).join(", ");
      }

      statusText.textContent = heroMeta;

      renderInnings(match.innings);
    });

  function renderInnings(innings){
    inningsContainer.innerHTML = "";

    innings.forEach(inn => {

      const batStats = {};
      const bowlStats = {};
      const dismissals = {};

      let runs = 0;
      let wkts = 0;
      let legalBalls = 0;

      let extras = {b:0, lb:0, w:0, nb:0, p:0};
      let fall = [];

      inn.overs.forEach((over, oIndex) => {
        over.deliveries.forEach((d, bIndex) => {

          const batter = d.batter;
          const bowler = d.bowler;

          if (!batStats[batter]) {
            batStats[batter] = { runs:0, balls:0 };
          }

          batStats[batter].runs += d.runs.batter;

          if (!d.extras?.wides) {
            batStats[batter].balls++;
          }

          if (!bowlStats[bowler]) {
            bowlStats[bowler] = { runs:0, balls:0, wkts:0 };
          }

          bowlStats[bowler].runs += d.runs.total;

          if (!d.extras?.wides && !d.extras?.noballs) {
            bowlStats[bowler].balls++;
            legalBalls++;
          }

          if (d.extras) {
            extras.b += d.extras.byes || 0;
            extras.lb += d.extras.legbyes || 0;
            extras.w += d.extras.wides || 0;
            extras.nb += d.extras.noballs || 0;
            extras.p += d.extras.penalty || 0;
          }

          if (d.wickets) {
            d.wickets.forEach(w => {

              wkts++;

              const out = w.player_out;

              let how = "";

              if (w.kind === "caught")
                how = `c ${playerLink(w.fielders?.[0]?.name || "")} b ${playerLink(bowler)}`;
              else if (w.kind === "bowled")
                how = `b ${playerLink(bowler)}`;
              else if (w.kind === "lbw")
                how = `lbw b ${playerLink(bowler)}`;
              else if (w.kind === "run out")
                how = `run out (${playerLink(w.fielders?.[0]?.name || "")})`;
              else
                how = `${w.kind} b ${playerLink(bowler)}`;

              dismissals[out] = how;

              bowlStats[bowler].wkts++;

              fall.push(`${runs}/${wkts} (${playerLink(out)}, ${oIndex}.${bIndex+1})`);
            });
          }

          runs += d.runs.total;
        });
      });

      const overs = Math.floor(legalBalls / 6) + "." + (legalBalls % 6);

      let html = `
        <h2>${fullName(inn.team)} Innings</h2>
        <p><strong>${runs}/${wkts}</strong> (${overs} ov)</p>

        <table>
          <tr>
            <th>Batter</th>
            <th>How out</th>
            <th class="num">R</th>
            <th class="num">B</th>
            <th class="num">SR</th>
          </tr>
      `;

      Object.entries(batStats).forEach(([p, s]) => {
        const sr = s.balls ? ((s.runs / s.balls) * 100).toFixed(1) : "";
        html += `
          <tr>
            <td>${playerLink(p)}</td>
            <td>${dismissals[p] || "not out"}</td>
            <td class="num">${s.runs}</td>
            <td class="num">${s.balls}</td>
            <td class="num">${sr}</td>
          </tr>
        `;
      });

      html += `</table>

      <div class="note">
        Extras: ${extras.b + extras.lb + extras.w + extras.nb + extras.p}
      </div>

      <div class="note">
        Fall of wickets: ${fall.join(", ")}
      </div>

      <h3>Bowling vs ${fullName(inn.team)}</h3>

      <table>
        <tr>
          <th>Bowler</th>
          <th class="num">O</th>
          <th class="num">R</th>
          <th class="num">W</th>
          <th class="num">Econ</th>
        </tr>`;

      Object.entries(bowlStats).forEach(([p, s]) => {
        const o = Math.floor(s.balls / 6) + "." + (s.balls % 6);
        const econ = s.balls ? (s.runs / (s.balls / 6)).toFixed(2) : "0.00";

        html += `
          <tr>
            <td>${playerLink(p)}</td>
            <td class="num">${o}</td>
            <td class="num">${s.runs}</td>
            <td class="num">${s.wkts}</td>
            <td class="num">${econ}</td>
          </tr>
        `;
      });

      html += `</table>`;

      inningsContainer.innerHTML += html;
    });
  }
});
</script>

</body>
</html>
