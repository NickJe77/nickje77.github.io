<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:40px;}
.hero p{margin-top:10px;font-size:18px;opacity:0.95;}

.section{
  margin-bottom:40px;
}

h2{
  margin-top:30px;
  border-bottom:2px solid #ddd;
  padding-bottom:6px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:14px;
}
th,td{
  border:1px solid #ddd;
  padding:6px 8px;
  text-align:right;
}
th:first-child, td:first-child{text-align:left;}
thead{background:#f3ecff;}
tfoot{background:#faf7ff;font-weight:600;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="matchTitle">IPL Match</h1>
  <p id="matchInfo">Loading match…</p>
</div>

<div id="scorecard"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const fileParam = params.get("file");

const basePath = "data/ipl/";
const seasonFile = "ipl_2008_FULL.json"; // for now we use 2008 only

const matchInfo = document.getElementById("matchInfo");
const matchTitle = document.getElementById("matchTitle");
const scorecardDiv = document.getElementById("scorecard");

if(!fileParam){
  matchInfo.textContent = "Missing match file parameter.";
  throw new Error("No file parameter");
}

fetch(basePath + seasonFile)
  .then(r=>r.json())
  .then(matches=>{
    const found = matches.find(m => m.file === fileParam);
    if(!found){
      matchInfo.textContent = "Match not found.";
      return;
    }
    renderMatch(found);
  })
  .catch(err=>{
    console.error(err);
    matchInfo.textContent = "Error loading match data.";
  });

function renderMatch(match){
  const info = match.info;

  const date = info.dates[0];
  const venue = info.venue;
  const teams = info.teams.join(" vs ");
  const winner = info.outcome?.winner || "—";

  let result = "";
  if(info.outcome?.by?.runs) result = "won by " + info.outcome.by.runs + " runs";
  if(info.outcome?.by?.wickets) result = "won by " + info.outcome.by.wickets + " wickets";

  const pom = info.player_of_match?.join(", ") || "—";

  matchTitle.textContent = teams;
  matchInfo.textContent =
    formatDate(date) + " | " + venue + " | " + winner + " " + result + " | Player of Match: " + pom;

  match.innings.forEach((inn, idx)=>{
    renderInnings(inn, idx+1);
  });
}

function renderInnings(innings, num){
  const battingStats = {};
  const bowlingStats = {};
  let totalRuns = 0;
  let totalWkts = 0;
  let totalBalls = 0;

  innings.overs.forEach(over=>{
    over.deliveries.forEach(ball=>{
      const batter = ball.batter;
      const bowler = ball.bowler;
      const runs = ball.runs.total;

      totalRuns += runs;
      totalBalls++;

      if(!battingStats[batter]){
        battingStats[batter] = {runs:0, balls:0, fours:0, sixes:0, out:false};
      }

      battingStats[batter].runs += ball.runs.batter;
      battingStats[batter].balls += 1;
      if(ball.runs.batter === 4) battingStats[batter].fours++;
      if(ball.runs.batter === 6) battingStats[batter].sixes++;

      if(ball.wickets){
        totalWkts += ball.wickets.length;
        battingStats[batter].out = true;
      }

      if(!bowlingStats[bowler]){
        bowlingStats[bowler] = {balls:0, runs:0, wickets:0};
      }

      bowlingStats[bowler].balls++;
      bowlingStats[bowler].runs += runs;
      if(ball.wickets){
        bowlingStats[bowler].wickets += ball.wickets.length;
      }
    });
  });

  const overs = (Math.floor(totalBalls/6)) + "." + (totalBalls%6);

  let html = `<div class="section">
    <h2>${innings.team} – Innings ${num}</h2>

    <table>
      <thead>
        <tr>
          <th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>Status</th>
        </tr>
      </thead>
      <tbody>`;

  Object.entries(battingStats).forEach(([name, s])=>{
    html += `<tr>
      <td>${name}</td>
      <td>${s.runs}</td>
      <td>${s.balls}</td>
      <td>${s.fours}</td>
      <td>${s.sixes}</td>
      <td>${s.out ? "out" : "not out"}</td>
    </tr>`;
  });

  html += `</tbody>
    <tfoot>
      <tr>
        <td>Total</td>
        <td>${totalRuns}/${totalWkts}</td>
        <td colspan="4">${overs} overs</td>
      </tr>
    </tfoot>
    </table>

    <table>
      <thead>
        <tr>
          <th>Bowler</th><th>O</th><th>R</th><th>W</th>
        </tr>
      </thead>
      <tbody>`;

  Object.entries(bowlingStats).forEach(([name, s])=>{
    const o = (Math.floor(s.balls/6)) + "." + (s.balls%6);
    html += `<tr>
      <td>${name}</td>
      <td>${o}</td>
      <td>${s.runs}</td>
      <td>${s.wickets}</td>
    </tr>`;
  });

  html += `</tbody></table></div>`;

  scorecardDiv.insertAdjacentHTML("beforeend", html);
}

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
</script>

</body>
</html>
