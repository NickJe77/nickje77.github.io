<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Indian Premier League | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1300px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

.year-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:12px;
  margin-bottom:30px;
}
.year-btn{
  background:#2b004f;
  color:white;
  border:none;
  padding:12px 0;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}
.year-btn:hover{background:#4b0082;}
.year-btn.active{background:#9d4edd;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}
.winner{font-weight:600;color:#1a7f37;}
.match-link{color:inherit;text-decoration:none;}
.match-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>Indian Premier League</h1>
  <p>Complete IPL match history by season.</p>
</div>

<div id="yearGrid" class="year-grid"></div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Team 1</th>
  <th>Team 2</th>
  <th>Venue</th>
  <th>Winner</th>
  <th>Margin</th>
</tr>
</thead>
<tbody id="matchTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const yearGrid = document.getElementById("yearGrid");
const tableBody = document.getElementById("matchTable");

fetch(indexUrl)
  .then(r=>r.json())
  .then(files=>{
    files.forEach((file,i)=>{
      const year = file.match(/\d{4}/)[0];
      const btn = document.createElement("button");
      btn.className="year-btn";
      btn.textContent=year;
      btn.onclick=()=>loadSeason(file,btn);
      yearGrid.appendChild(btn);
      if(i===files.length-1){
        btn.classList.add("active");
        loadSeason(file,btn);
      }
    });
  });

function loadSeason(file,btn){
  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");

  fetch(basePath+file)
  .then(r=>r.json())
  .then(matches=>{
    tableBody.innerHTML="";
    matches.sort((a,b)=>new Date(b.info.dates[0])-new Date(a.info.dates[0]));

    matches.forEach(m=>{
      const info = m.info;

      let margin="";
      if(info.outcome?.by){
        if(info.outcome.by.runs) margin=info.outcome.by.runs+" runs";
        else if(info.outcome.by.wickets) margin=info.outcome.by.wickets+" wickets";
      }

      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>
          <a class="match-link" href="ipl-match.html?file=${m.file}">
            ${formatDate(info.dates[0])}
          </a>
        </td>
        <td>${info.teams?.[0]||""}</td>
        <td>${info.teams?.[1]||""}</td>
        <td>${info.venue||""}</td>
        <td class="winner">${info.outcome?.winner||""}</td>
        <td>${margin}</td>
      `;
      tableBody.appendChild(tr);
    });
  });
}

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
</script>

</body>
</html>
