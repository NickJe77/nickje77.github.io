<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Indian Premier League | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* SAME STYLING — UNCHANGED */
body{
  font-family: Inter, system-ui, Arial;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1300px;margin:auto;padding:30px 20px;}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px;
  border-radius:24px;
  margin-bottom:25px;
}

.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px;margin-bottom:30px;}

.year-btn{
  background:#2b004f;color:white;border:none;
  padding:12px;border-radius:10px;cursor:pointer;
}
.year-btn.active{background:#9d4edd;}

table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{padding:10px;border-bottom:1px solid #ddd;}
tr:hover{background:#eef4ff;cursor:pointer;}
.winner{font-weight:600;color:#1a7f37;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>Indian Premier League</h1>
</div>

<div id="yearGrid" class="year-grid"></div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Team 1</th>
<th>Team 2</th>
<th>Venue</th>
<th>Winner</th>
<th>Margin</th>
</tr>
</thead>
<tbody id="matchTable"></tbody>
</table>

</div>

<script>
const indexUrl="data/ipl/index.json";
const basePath="data/ipl/";
const yearGrid=document.getElementById("yearGrid");
const tableBody=document.getElementById("matchTable");

fetch(indexUrl)
.then(r=>r.json())
.then(files=>{

files.forEach((file,i)=>{
const year=file.match(/\d{4}/)[0];

const btn=document.createElement("button");
btn.className="year-btn";
btn.textContent=year;

btn.onclick=()=>loadSeason(file,btn);

yearGrid.appendChild(btn);

if(i===files.length-1){
btn.classList.add("active");
loadSeason(file,btn);
}
});

});

function loadSeason(file,btn){

document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");

const season=file.match(/\d{4}/)[0];

fetch(basePath+file)
.then(r=>r.json())
.then(matches=>{

tableBody.innerHTML="";

matches.sort((a,b)=>{
return new Date(b.info?.dates?.[0]||b.date)
     - new Date(a.info?.dates?.[0]||a.date);
});

matches.forEach((m,idx)=>{

const info=m.info||m;

let margin="";
if(info.outcome?.by){
if(info.outcome.by.runs) margin=info.outcome.by.runs+" runs";
else if(info.outcome.by.wickets) margin=info.outcome.by.wickets+" wickets";
}

const tr=document.createElement("tr");

tr.onclick=()=>{
window.location.href=
`ipl-match.html?index=${idx}&season=${season}`;
};

tr.innerHTML=`
<td>${new Date(info.dates?.[0]||m.date).toLocaleDateString()}</td>
<td>${info.teams?.[0]||""}</td>
<td>${info.teams?.[1]||""}</td>
<td>${info.venue||""}</td>
<td class="winner">${info.outcome?.winner||""}</td>
<td>${margin}</td>
`;

tableBody.appendChild(tr);

});

});

}
</script>

</body>
</html>
