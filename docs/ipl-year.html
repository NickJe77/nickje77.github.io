<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.summary-box{
  border:1px solid #ddd;
  border-radius:14px;
  padding:15px;
  background:#faf7ff;
}
.summary-box strong{
  display:block;
  margin-bottom:6px;
}

.innings-block{
  margin-bottom:40px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:20px;
  font-size:14px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>IPL Match</h1>
  <p id="statusText">Loading match…</p>
</div>

<div class="summary-grid">
  <div class="summary-box"><strong>Date</strong><span id="dateBox">—</span></div>
  <div class="summary-box"><strong>Teams</strong><span id="teamsBox">—</span></div>
  <div class="summary-box"><strong>Venue</strong><span id="venueBox">—</span></div>
  <div class="summary-box"><strong>Winner</strong><span id="winnerBox">—</span></div>
  <div class="summary-box"><strong>Result</strong><span id="resultBox">—</span></div>
</div>

<div id="inningsContainer"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const params = new URLSearchParams(window.location.search);
const fileParam = params.get("file");

const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";

const statusText = document.getElementById("statusText");
const dateBox = document.getElementById("dateBox");
const teamsBox = document.getElementById("teamsBox");
const venueBox = document.getElementById("venueBox");
const winnerBox = document.getElementById("winnerBox");
const resultBox = document.getElementById("resultBox");
const inningsContainer = document.getElementById("inningsContainer");

if(!fileParam){
  statusText.textContent = "Missing match file parameter.";
  return;
}

fetch(indexUrl)
.then(r=>r.json())
.then(files=>Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json()))))
.then(seasons=>{
  let foundMatch=null;

  seasons.forEach(matches=>{
    matches.forEach(m=>{
      if(m.file===fileParam) foundMatch=m;
    });
  });

  if(!foundMatch){
    statusText.textContent="Match not found.";
    return;
  }

  const info = foundMatch.info;

  statusText.textContent="Match loaded";
  dateBox.textContent = formatDate(info.dates[0]);
  teamsBox.textContent = info.teams.join(" vs ");
  venueBox.textContent = info.venue || "—";
  winnerBox.textContent = info.outcome?.winner || "—";

  let result="—";
  if(info.outcome?.by){
    if(info.outcome.by.runs) result="won by "+info.outcome.by.runs+" runs";
    if(info.outcome.by.wickets) result="won by "+info.outcome.by.wickets+" wickets";
  }
  resultBox.textContent=result;

  renderInnings(foundMatch.innings || []);
});

function renderInnings(innings){
  innings.forEach((inn,idx)=>{
    const batting = {};
    const bowling = {};

    inn.overs.forEach(o=>{
      o.deliveries.forEach(d=>{
        const bat = d.batter;
        const bowl = d.bowler;
        const runsBat = d.runs?.batter || 0;
        const runsTot = d.runs?.total || 0;

        if(!batting[bat]) batting[bat]={runs:0,balls:0,fours:0,sixes:0};
        batting[bat].runs += runsBat;
        batting[bat].balls += 1;
        if(runsBat===4) batting[bat].fours++;
        if(runsBat===6) batting[bat].sixes++;

        if(!bowling[bowl]) bowling[bowl]={balls:0,runs:0,wkts:0};
        bowling[bowl].balls += 1;
        bowling[bowl].runs += runsTot;

        if(d.wickets){
          bowling[bowl].wkts += d.wickets.length;
        }
      });
    });

    const div=document.createElement("div");
    div.className="innings-block";
    div.innerHTML=`<h2>Innings ${idx+1}: ${inn.team}</h2>`;

    let batHTML=`<table><thead><tr>
      <th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th>
    </tr></thead><tbody>`;
    Object.keys(batting).forEach(p=>{
      const b=batting[p];
      const sr=((b.runs/b.balls)*100).toFixed(1);
      batHTML+=`<tr>
        <td>${p}</td>
        <td>${b.runs}</td>
        <td>${b.balls}</td>
        <td>${b.fours}</td>
        <td>${b.sixes}</td>
        <td>${sr}</td>
      </tr>`;
    });
    batHTML+=`</tbody></table>`;

    let bowlHTML=`<table><thead><tr>
      <th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Eco</th>
    </tr></thead><tbody>`;
    Object.keys(bowling).forEach(p=>{
      const b=bowling[p];
      const overs=(b.balls/6).toFixed(1);
      const eco=(b.runs/(b.balls/6)).toFixed(2);
      bowlHTML+=`<tr>
        <td>${p}</td>
        <td>${overs}</td>
        <td>${b.runs}</td>
        <td>${b.wkts}</td>
        <td>${eco}</td>
      </tr>`;
    });
    bowlHTML+=`</tbody></table>`;

    div.innerHTML += `<h3>Batting</h3>${batHTML}<h3>Bowling</h3>${bowlHTML}`;
    inningsContainer.appendChild(div);
  });
}

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

});
</script>

</body>
</html>
