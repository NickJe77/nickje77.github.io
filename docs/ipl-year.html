<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Indian Premier League | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#eceff3;
      --surface:#ffffff;
      --ink:#0f141a;
      --muted:#69727c;
      --faint:#9aa3ad;
      --line:#e3e8ee;
      --board:#0c130f;
      --board-2:#161f16;
      --accent:#c99a3d;
      --accent-soft:rgba(201,154,61,.16);
      --win:#1e7a3d;
      --display:'Oswald',system-ui,sans-serif;
      --body:'Inter',system-ui,sans-serif;
      --radius:16px;
    }
    *{box-sizing:border-box;}
    body{
      font-family:var(--body);
      margin:0;
      background:var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
    }

    .navbar{
      display:flex;
      justify-content:center;
      gap:22px;
      padding:15px 0;
      background:var(--surface);
      border-bottom:1px solid var(--line);
      font-weight:600;
      font-size:13.5px;
    }
    .navbar a{
      color:var(--ink);
      text-decoration:none;
      opacity:.7;
      transition:opacity .15s,color .15s;
    }
    .navbar a:hover,.navbar a[aria-current="page"]{
      opacity:1;
      color:var(--accent);
    }

    .page-wrap{
      max-width:1300px;
      margin:0 auto;
      padding:26px 20px 70px;
    }

    /* ── Hero ─────────────────────────────────────────────── */
    .hero{
      position:relative;
      background:linear-gradient(160deg,var(--board-2),var(--board));
      color:#fff;
      padding:32px 34px;
      border-radius:var(--radius);
      margin-bottom:22px;
      box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
    }
    .eyebrow{
      display:block;
      font-family:var(--body);
      font-size:11.5px;
      font-weight:600;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--accent);
      margin-bottom:10px;
    }
    .hero h1{
      margin:0;
      font-family:var(--display);
      font-weight:600;
      font-size:clamp(28px,5vw,40px);
      letter-spacing:.01em;
      text-transform:uppercase;
    }
    .hero p{
      margin-top:10px;
      font-size:14px;
      color:rgba(255,255,255,.75);
      font-weight:600;
    }

    /* ── Year grid ────────────────────────────────────────── */
    .year-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
      gap:8px;
      margin-bottom:24px;
    }
    .year-btn{
      background:var(--surface);
      color:var(--muted);
      border:1px solid var(--line);
      padding:10px 0;
      border-radius:999px;
      font-family:var(--body);
      font-weight:600;
      font-size:13.5px;
      cursor:pointer;
      transition:background .15s,color .15s,border-color .15s;
    }
    .year-btn:hover{border-color:var(--faint);color:var(--ink);}
    .year-btn.active{
      background:var(--ink);
      color:#fff;
      border-color:var(--ink);
    }

    /* ── Summary ──────────────────────────────────────────── */
    .summary{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:20px;
      margin-bottom:22px;
    }
    .summary h2{
      margin:0 0 14px;
      font-family:var(--display);
      font-weight:600;
      font-size:17px;
      letter-spacing:.02em;
      text-transform:uppercase;
      color:var(--ink);
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:14px;
    }
    .summary-box{
      border:1px solid var(--line);
      border-radius:12px;
      padding:14px 16px;
      background:var(--bg);
    }
    .summary-box strong{
      display:block;
      margin-bottom:4px;
      font-family:var(--display);
      font-size:11px;
      letter-spacing:.05em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .summary-box span{
      font-weight:700;
      color:var(--ink);
      font-size:15px;
    }

    /* ── Table ────────────────────────────────────────────── */
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:0;
      font-size:13.5px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
    }
    th,td{
      border-bottom:1px solid var(--line);
      padding:11px 14px;
      text-align:left;
    }
    th{
      background:#f7f9fb;
      color:var(--muted);
      font-family:var(--body);
      font-weight:600;
      font-size:11px;
      letter-spacing:.04em;
      text-transform:uppercase;
      position:sticky;
      top:0;
    }
    td{
      color:#27313c;
      font-variant-numeric:tabular-nums;
    }
    tbody tr:last-child td{border-bottom:none;}
    tbody tr:hover td{background:#f0f6ff;cursor:pointer;}
    .winner{font-weight:700;color:var(--win);}

    @media(max-width:900px){
      th:nth-child(4), td:nth-child(4){display:none;}
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <span class="eyebrow">Cricket</span>
    <h1>Indian Premier League</h1>
    <p>Complete IPL match history by season. Click any match for full scorecard.</p>
  </div>

  <div id="yearGrid" class="year-grid"></div>

  <div class="summary">
    <h2>Season Summary</h2>
    <div class="summary-grid">
      <div class="summary-box">
        <strong>Winner</strong>
        <span id="winnerBox">—</span>
      </div>
      <div class="summary-box">
        <strong>Runner-up</strong>
        <span id="runnerBox">—</span>
      </div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Team 1</th>
        <th>Team 2</th>
        <th>Venue</th>
        <th>Winner</th>
        <th>Margin</th>
      </tr>
    </thead>
    <tbody id="matchTable"></tbody>
  </table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const yearGrid = document.getElementById("yearGrid");
const tableBody = document.getElementById("matchTable");

const winnerBox = document.getElementById("winnerBox");
const runnerBox = document.getElementById("runnerBox");

fetch(indexUrl)
  .then(r => r.json())
  .then(files => {
    files.forEach((file, i) => {
      const year = file.replace("ipl_", "").replace("_FULL.json", "");
      const btn = document.createElement("button");
      btn.className = "year-btn";
      btn.textContent = year;
      btn.onclick = () => selectSeason(file, btn);
      yearGrid.appendChild(btn);

      if (i === files.length - 1) {
        btn.classList.add("active");
        loadSeason(file);
      }
    });
  });

function selectSeason(file, btn){
  document.querySelectorAll(".year-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  loadSeason(file);
}

function loadSeason(file){
  fetch(basePath + file)
    .then(r => r.json())
    .then(matches => {
      tableBody.innerHTML = "";

      const season = file.match(/\d{4}/)[0];

      matches.sort((a, b) => {
        const da = new Date(a.info?.dates?.[0] || a.date);
        const db = new Date(b.info?.dates?.[0] || b.date);
        return db - da;
      });

      const finalMatch = matches[0];
      const info = finalMatch.info || finalMatch;
      const winner = info.outcome?.winner || "—";
      const teams = info.teams || [];
      const runnerUp = teams.find(t => t !== winner) || "—";

      winnerBox.textContent = winner;
      runnerBox.textContent = runnerUp;

      matches.forEach((m, idx) => {
        const info = m.info || m;

        let margin = "";
        if (info.outcome?.by) {
          if (info.outcome.by.runs) margin = info.outcome.by.runs + " runs";
          else if (info.outcome.by.wickets) margin = info.outcome.by.wickets + " wickets";
        }

        const tr = document.createElement("tr");
        tr.onclick = () => {
          window.location.href = `ipl-match.html?season=${season}&index=${idx}`;
        };

        tr.innerHTML = `
          <td>${formatDate(info.dates?.[0] || m.date)}</td>
          <td>${info.teams?.[0] || ""}</td>
          <td>${info.teams?.[1] || ""}</td>
          <td>${info.venue || ""}</td>
          <td class="winner">${info.outcome?.winner || ""}</td>
          <td>${margin}</td>
        `;

        tableBody.appendChild(tr);
      });
    });
}

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB", {
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}
</script>

</body>
</html>
