<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Indian Premier League | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1300px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

.year-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:12px;
  margin-bottom:30px;
}
.year-btn{
  background:#2b004f;
  color:white;
  border:none;
  padding:12px 0;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}
.year-btn:hover{background:#4b0082;}
.year-btn.active{background:#9d4edd;}

.summary{
  border:1px solid #ddd;
  border-radius:18px;
  padding:20px;
  margin-bottom:30px;
}
.summary h2{margin-top:0;}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.summary-box{
  border:1px solid #ddd;
  border-radius:14px;
  padding:15px;
  background:#faf7ff;
}
.summary-box strong{
  display:block;
  margin-bottom:6px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  font-size:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}
th{
  background:#f3f6fb;
  position:sticky;
  top:0;
}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}
.winner{font-weight:600;color:#1a7f37;}
.match-link{
  color:inherit;
  text-decoration:none;
  display:contents;
}

@media(max-width:900px){
  th:nth-child(4), td:nth-child(4){display:none;}
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>Indian Premier League</h1>
  <p>Complete IPL match history by season.</p>
</div>

<div id="yearGrid" class="year-grid"></div>

<div class="summary">
  <h2>Season Summary</h2>
  <div class="summary-grid">
    <div class="summary-box">
      <strong>Winner</strong>
      <span id="winnerBox">—</span>
    </div>
    <div class="summary-box">
      <strong>Runner-up</strong>
      <span id="runnerBox">—</span>
    </div>
  </div>
</div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Team 1</th>
  <th>Team 2</th>
  <th>Venue</th>
  <th>Winner</th>
  <th>Margin</th>
</tr>
</thead>
<tbody id="matchTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const yearGrid = document.getElementById("yearGrid");
const tableBody = document.getElementById("matchTable");

const winnerBox = document.getElementById("winnerBox");
const runnerBox = document.getElementById("runnerBox");

let seasonFiles = [];

fetch(indexUrl)
  .then(r=>r.json())
  .then(files=>{
    seasonFiles = files;

    files.forEach((file,i)=>{
      const year = file.replace("ipl_","").replace("_FULL.json","");
      const btn = document.createElement("button");
      btn.className="year-btn";
      btn.textContent=year;
      btn.onclick=()=>selectSeason(file,btn);
      yearGrid.appendChild(btn);

      if(i===files.length-1){
        btn.classList.add("active");
        loadSeason(file);
      }
    });
  });

function selectSeason(file,btn){
  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  loadSeason(file);
}

function loadSeason(file){
fetch(basePath+file)
.then(r=>r.json())
.then(matches=>{
  tableBody.innerHTML="";
  matches.sort((a,b)=>new Date(b.info.dates[0])-new Date(a.info.dates[0]));

  const finalMatch = matches[0];
  const winner = finalMatch?.info?.outcome?.winner || "—";
  const teams = finalMatch?.info?.teams || [];
  const runnerUp = teams.find(t=>t!==winner) || "—";

  winnerBox.textContent = winner;
  runnerBox.textContent = runnerUp;

  matches.forEach(m=>{
    let margin="";
    if(m.info?.outcome?.by){
      if(m.info.outcome.by.runs) margin=m.info.outcome.by.runs+" runs";
      else if(m.info.outcome.by.wickets) margin=m.info.outcome.by.wickets+" wickets";
    }

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <a class="match-link" href="ipl-match.html?file=${encodeURIComponent(m.file)}">
        <td>${formatDate(m.info.dates[0])}</td>
        <td>${m.info.teams?.[0]||""}</td>
        <td>${m.info.teams?.[1]||""}</td>
        <td>${m.info.venue||""}</td>
        <td class="winner">${m.info.outcome?.winner||""}</td>
        <td>${margin}</td>
      </a>
    `;
    tableBody.appendChild(tr);
  });
});
}

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
</script>

</body>
</html>
