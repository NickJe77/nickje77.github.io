<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Super League Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c1118;
  --board-2:#141c26;
  --board-line:rgba(255,255,255,.10);
  --win:#ffffff;
  --lose:rgba(255,255,255,.42);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

.page{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

h1{
  font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);
  letter-spacing:.01em;text-transform:uppercase;margin:0;
}

/* ── Hero header (matches the game page's scorebug) ──────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:22px 26px 26px;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);
  margin-bottom:8px;
}
.hero h1{color:#fff;}

/* ── Controls ─────────────────────────────────────────── */
.controls{
  display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap;
}

.segment{
  display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px;gap:2px;max-width:100%;
  overflow-x:auto;scrollbar-width:none;
}
.segment::-webkit-scrollbar{display:none;}
.seg-btn{
  border:none;background:transparent;font-family:var(--body);font-size:13px;font-weight:600;
  color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s;
}
.seg-btn:hover{color:var(--ink);}
.seg-btn.active{background:var(--ink);color:#fff;}

select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);min-width:220px;
  cursor:pointer;
}
select:hover{border-color:var(--faint);}

.status{margin:2px 2px 18px;color:var(--muted);font-size:12.5px;font-weight:600;}

/* ── Layout ───────────────────────────────────────────── */
.content{
  display:grid;grid-template-columns:360px 1fr;gap:20px;
}
@media(max-width:820px){
  .content{grid-template-columns:1fr;}
}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
.card-head{
  display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);
}
.card-head h2{
  margin:0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;}
thead th{
  background:#f7f9fb;font-family:var(--body);font-weight:600;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  text-align:center;
}
td{text-align:center;font-variant-numeric:tabular-nums;color:#27313c;}
td.team{text-align:left;font-weight:700;color:var(--ink);}
tbody tr:hover td{background:#f0f6ff;}

/* ── Match list ───────────────────────────────────────── */
.matches{display:flex;flex-direction:column;gap:10px;}
.match{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 18px;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s;
}
.match:hover{
  transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,16,24,.18);border-color:var(--faint);
}
.match .line1{
  font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.01em;color:var(--ink);
}
.match .line2{color:var(--muted);font-size:12px;margin-top:4px;font-weight:600;letter-spacing:.02em;}

.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;}

.scorebug{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;
}
.scorebug .eyebrow{
  text-align:center;font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:#c8102e;
  padding:20px 16px 0;
}
.bug-grid{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:14px;padding:14px 30px 20px;
}
.bug-team{display:flex;align-items:center;gap:14px;min-width:0;}
.bug-team.home{justify-content:flex-end;text-align:right;}
.bug-team.away{justify-content:flex-start;text-align:left;}
.bug-team a.tname{
  font-family:var(--display);font-weight:600;font-size:clamp(15px,2.4vw,24px);
  line-height:1.04;letter-spacing:.01em;text-transform:uppercase;color:#fff;text-decoration:none;
}
.bug-team a.tname:hover{color:#c8102e;}
.bug-score{
  display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:600;
  font-size:clamp(32px,6vw,56px);line-height:1;letter-spacing:.01em;white-space:nowrap;
}
.bug-score .sc.lose{color:rgba(255,255,255,.42);font-weight:500;}
.bug-score .dash{color:rgba(255,255,255,.3);font-weight:400;}
.winner-line{
  text-align:center;padding:0 16px 22px;font-size:13px;font-weight:600;color:rgba(255,255,255,.65);
}
@media(max-width:820px){
  .bug-grid{grid-template-columns:1fr;gap:14px;padding:10px 18px 20px;}
  .bug-team.home,.bug-team.away{justify-content:center;text-align:center;}
}
.section-title{
  font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  margin:26px 0 12px;color:var(--muted);
}
.detail-row{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 18px;margin-bottom:10px;
}
.detail-row h3{margin:0;font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink);}
.detail-row .small{color:var(--muted);font-size:12.5px;margin-top:4px;font-weight:600;}
</style>
</head>

<body>

<nav class="navbar">
<a href="/">Home</a>
<a href="/rugby-league.html">Rugby League</a>
<a href="/sl.html">Super League</a>
</nav>

<div class="page">
<div id="output"></div>
</div>

<script>

const params = new URLSearchParams(location.search);
const seasonQ = params.get("season") || "";
const matchQ = params.get("match") || "";

if(!seasonQ || !matchQ){
  document.getElementById("output").innerHTML = `<div class="scorebug"><div class="winner-line" style="padding-top:20px;">Match not found.</div></div>`;
  throw new Error("Missing season or match param");
}

fetch(`data/sl/results/${seasonQ}.json`)
.then(r => r.ok ? r.json() : null)
.then(matches => {
  const m = matches ? matches.find(x => String(x.match_id) === String(matchQ)) : null;
  render(m);
})
.catch(() => render(null));

function render(m){
  const out = document.getElementById("output");

  if(!m){
    out.innerHTML = `
      <div class="scorebug">
        <div class="eyebrow">Super League</div>
        <div class="winner-line" style="padding-top:20px;">Match not found.</div>
      </div>`;
    return;
  }

  const team1 = m.home_team.name;
  const team2 = m.away_team.name;

  document.title = `${team1} vs ${team2} ${seasonQ} | The Sporting Almanac`;

  const winner = m.home_score === m.away_score ? "" :
    (m.home_score > m.away_score ? team1 : team2);
  const team1Lost = winner && winner !== team1;
  const team2Lost = winner && winner !== team2;

  const scoreHTML = `<span class="sc ${team1Lost?'lose':''}">${m.home_score}</span><span class="dash">–</span><span class="sc ${team2Lost?'lose':''}">${m.away_score}</span>`;
  const winnerLine = winner ? `Winner: ${winner}` : "Draw";

  out.innerHTML = `
    <div class="scorebug">
      <div class="eyebrow">${seasonQ} Super League &middot; ${m.round || ""}</div>
      <div class="bug-grid">
        <div class="bug-team home">
          <span class="tname">${team1}</span>
        </div>
        <div class="bug-score">${scoreHTML}</div>
        <div class="bug-team away">
          <span class="tname">${team2}</span>
        </div>
      </div>
      <div class="winner-line">${winnerLine}</div>
    </div>

    <div class="section-title">Match Details</div>
    ${m.venue && m.venue.name ? `<div class="detail-row"><h3>${m.venue.name}</h3>${m.attendance ? `<div class="small">Attendance: ${Number(m.attendance).toLocaleString()}</div>` : ""}</div>` : ""}
    ${m.referee && m.referee.name ? `<div class="detail-row"><h3>Referee: ${m.referee.name}</h3></div>` : ""}
    <div class="detail-row"><h3>${m.date}${m.day_of_week ? ", " + m.day_of_week : ""}, ${seasonQ}</h3></div>
  `;
}

</script>
</body>
</html>
