<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Best Individual Performances | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
.hero{background:linear-gradient(90deg,#003566,#0077b6);color:white;padding:40px 50px;border-radius:24px;margin-bottom:25px;}
.tabs{display:flex;gap:10px;margin-bottom:20px;}
.tab{background:#003566;color:white;border:none;padding:10px 16px;border-radius:10px;cursor:pointer;}
.tab.active{background:#00b4d8;}
table{width:100%;border-collapse:collapse;font-size:15px;}
th,td{border-bottom:1px solid #ddd;padding:10px 12px;text-align:left;}
th{background:#f3f6fb;}
a{color:#003566;text-decoration:none;font-weight:600;}
a:hover{text-decoration:underline;}
</style>
</head>

<body>
<div class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">
<div class="hero">
<h1>BBL Best Individual Performances</h1>
<p>Top 25 batting and bowling performances in a single Big Bash League match.</p>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('batting',event)">Batting</button>
<button class="tab" onclick="showTab('bowling',event)">Bowling</button>
</div>

<table>
<thead>
<tr><th>Rank</th><th>Player</th><th id="figureHeader">Runs</th><th>Date</th><th>Match</th></tr>
</thead>
<tbody id="recordsTable"></tbody>
</table>
</div>

<script>
const indexUrl="data/bbl/index.json";
const basePath="data/bbl/";
const nameMapUrl="data/bbl/player-names.json";

let battingInnings=[], bowlingFigures=[], nameMap={};

Promise.all([
  fetch(nameMapUrl).then(r=>r.json()),
  fetch(indexUrl).then(r=>r.json())
])
.then(([names,files])=>{
  nameMap=names;
  return Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json())));
})
.then(seasons=>{
  seasons.forEach(matches=>{
    matches.forEach(match=>{
      const date=match.info?.dates?.[0]||"";
      const teams=match.info?.teams?.join(" vs ")||"";

      let batterRuns={}, bowlerStats={};

      match.innings.forEach(inn=>{
        inn.overs.forEach(over=>{
          over.deliveries.forEach(ball=>{
            const batter=ball.batter;
            const bowler=ball.bowler;
            const runs=ball.runs.batter;
            const total=ball.runs.total;

            batterRuns[batter]=(batterRuns[batter]||0)+runs;

            bowlerStats[bowler]=bowlerStats[bowler]||{wickets:0,runs:0};
            bowlerStats[bowler].runs+=total;

            if(ball.wickets){
              ball.wickets.forEach(w=>{
                if(w.kind!=="run out") bowlerStats[bowler].wickets++;
              });
            }
          });
        });
      });

      for(const b in batterRuns){
        battingInnings.push({player:b,runs:batterRuns[b],date,match:teams});
      }
      for(const b in bowlerStats){
        bowlingFigures.push({player:b,wickets:bowlerStats[b].wickets,runs:bowlerStats[b].runs,date,match:teams});
      }
    });
  });

  renderTable("batting");
});

function showTab(tab,e){
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active");
  renderTable(tab);
}

function renderTable(type){
  const tbody=document.getElementById("recordsTable");
  const header=document.getElementById("figureHeader");
  tbody.innerHTML="";

  let rows=[];
  if(type==="batting"){
    header.textContent="Runs";
    rows=battingInnings.sort((a,b)=>b.runs-a.runs).slice(0,25);
    rows.forEach((r,i)=>{
      tbody.innerHTML+=`<tr>
        <td>${i+1}</td>
        <td><a href="bbl-player.html?player=${encodeURIComponent(r.player)}">${r.player}</a></td>
        <td>${r.runs}</td>
        <td>${formatDate(r.date)}</td>
        <td>${r.match}</td>
      </tr>`;
    });
  }

  if(type==="bowling"){
    header.textContent="Figures";
    rows=bowlingFigures.sort((a,b)=>b.wickets-a.wickets||a.runs-b.runs).slice(0,25);
    rows.forEach((r,i)=>{
      tbody.innerHTML+=`<tr>
        <td>${i+1}</td>
        <td><a href="bbl-player.html?player=${encodeURIComponent(r.player)}">${r.player}</a></td>
        <td>${r.wickets} / ${r.runs}</td>
        <td>${formatDate(r.date)}</td>
        <td>${r.match}</td>
      </tr>`;
    });
  }
}

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
</script>
</body>
</html>
