<!DOCTYPE html>

<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Women's T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:30px auto;
padding:0 20px;
}

/* UNIFIED HERO */

.hero{
background:linear-gradient(90deg,#7b1fa2,#e91e63);
color:#fff;
padding:40px;
border-radius:22px;
margin-bottom:25px;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:12px;
overflow:hidden;
}

/* UNIFIED HEADER */

th{
background:#e91e63;
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
}

/* UNIFIED ROW STRIPING */

tbody tr:nth-child(even){
background:#eef3ff;
}

tbody tr{
cursor:pointer;
}

tbody tr:hover{
background:#dbe6ff;
}

.team{
font-weight:700;
}

.margin{
font-weight:700;
color:#0a4;
}

</style>

</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="womens-t20-world-cup.html">Women's T20 World Cup</a>
</div>

<div class="page">
  <div class="hero">
    <h1>Women's T20 World Cup Finals</h1>
  </div>

  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Winner</th>
        <th>Runner-up</th>
        <th>Margin</th>
        <th>Venue</th>
      </tr>
    </thead>
    <tbody id="finalsTable"></tbody>
  </table>
</div>

<script>

const FINALS = [

  {
    year: 2014,
    winner: "Australia",
    runner: "England",
    margin: "Australia won by 6 wickets",
    venue: "Sher-e-Bangla National Stadium",
    file: "data/womens-t20-world-cup/matches/wt20wc_2014_FULL.json"
  },

  {
    year: 2016,
    winner: "West Indies",
    runner: "Australia",
    margin: "West Indies won by 8 wickets",
    venue: "Eden Gardens",
    file: "data/womens-t20-world-cup/matches/wt20wc_2016_FULL.json"
  },

  {
    year: 2018,
    winner: "Australia",
    runner: "England",
    margin: "Australia won by 8 wickets",
    venue: "Sir Vivian Richards Stadium",
    file: "data/womens-t20-world-cup/matches/wt20wc_2018_FULL.json"
  },

  {
    year: 2020,
    winner: "Australia",
    runner: "India",
    margin: "Australia won by 85 runs",
    venue: "Melbourne Cricket Ground",
    file: "data/womens-t20-world-cup/matches/wt20wc_2020_FULL.json"
  },

  {
    year: 2023,
    winner: "Australia",
    runner: "South Africa",
    margin: "Australia won by 19 runs",
    venue: "Newlands Cricket Ground",
    file: "data/womens-t20-world-cup/matches/wt20wc_2023_FULL.json"
  },

  {
    year: 2024,
    winner: "New Zealand",
    runner: "South Africa",
    margin: "New Zealand won by 32 runs",
    venue: "Dubai International Cricket Stadium",
    file: "data/womens-t20-world-cup/matches/wt20wc_2024_FULL.json"
  }

];

const tbody = document.getElementById("finalsTable");

tbody.innerHTML = "";

for (const f of FINALS)
{

  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td>${f.year}</td>
    <td class="team">${f.winner}</td>
    <td class="team">${f.runner}</td>
    <td class="margin">${f.margin}</td>
    <td>${f.venue}</td>
  `;

  tr.onclick = () =>
  {
    window.location.href =
      `womens-t20wc-match.html?file=${encodeURIComponent(f.file)}&year=${encodeURIComponent(String(f.year))}`;
  };

  tbody.appendChild(tr);

}

</script>

</body>
</html>
