<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>ICC World Cup Teams | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Inter, system-ui, Arial, sans-serif; margin: 0; background: #ffffff; }
    .navbar { display: flex; justify-content: center; gap: 22px; padding: 16px 0; border-bottom: 1px solid #ddd; font-weight: 600; }
    .navbar a { color: #0056d6; text-decoration: none; font-size: 18px; }
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .hero { background: linear-gradient(90deg, #004d00, #006400); color: white; padding: 40px 50px; border-radius: 24px; margin-bottom: 25px; }
    .hero h1 { margin: 0; font-size: 46px; }
    .hero p { margin-top: 10px; font-size: 20px; opacity: 0.95; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { border-bottom: 1px solid #ddd; padding: 12px 14px; text-align: left; }
    th { background: #f3f6fb; }
    tr:nth-child(even) { background: #f6fbf6; }
    tr:hover { background: #edf7ed; }
    .team-link { color: #004d00; font-weight: 600; text-decoration: none; }
    .team-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>
<div class="page-wrap">
  <div class="hero">
    <h1>ICC World Cup Teams</h1>
    <p>All competing nations, championships and win records.</p>
  </div>
  <table>
    <thead>
      <tr>
        <th>Team</th><th>Titles</th><th>Years Won</th>
        <th>Wins</th><th>Losses</th><th>Win %</th>
      </tr>
    </thead>
    <tbody id="teamsTable"></tbody>
  </table>
</div>

<script>
const TOURNAMENTS = [
  { year: "1975",      file: "wc_1975",      champion: "West Indies" },
  { year: "1979",      file: "wc_1979",      champion: "West Indies" },
  { year: "1983",      file: "wc_1983",      champion: "India" },
  { year: "1987",      file: "wc_1987_1988", champion: "Australia" },
  { year: "1992",      file: "wc_1991_1992", champion: "Pakistan" },
  { year: "1996",      file: "wc_1995_1996", champion: "Sri Lanka" },
  { year: "1999",      file: "wc_1999",      champion: "Australia" },
  { year: "2003",      file: "wc_2002_2003", champion: "Australia" },
  { year: "2007",      file: "wc_2006_2007", champion: "Australia" },
  { year: "2011",      file: "wc_2010_2011", champion: "India" },
  { year: "2015",      file: "wc_2014_2015", champion: "Australia" },
  { year: "2019",      file: "wc_2019",      champion: "England" },
  { year: "2023",      file: "wc_2023",      champion: "Australia" },
];

const basePath = "data/cricket/world-cup/scorecards/";

Promise.all(
  TOURNAMENTS.map(t =>
    fetch(`${basePath}${t.file}.json`)
      .then(r => r.json())
      .then(data => ({ tournament: t, matches: data.matches || [] }))
      .catch(() => ({ tournament: t, matches: [] }))
  )
).then(results => {
  const teams = {};

  results.forEach(({ tournament, matches }) => {
    matches.forEach(m => {
      const parts = m.teams.split(' v ');
      if (parts.length !== 2) return;
      const t1 = parts[0].trim();
      const t2 = parts[1].trim();
      if (!teams[t1]) teams[t1] = { wins: 0, losses: 0, titles: 0, years: [] };
      if (!teams[t2]) teams[t2] = { wins: 0, losses: 0, titles: 0, years: [] };
      const result = m.result || '';
      if (result.includes(t1 + ' won')) { teams[t1].wins++; teams[t2].losses++; }
      else if (result.includes(t2 + ' won')) { teams[t2].wins++; teams[t1].losses++; }
    });
    const champ = tournament.champion;
    if (teams[champ]) {
      teams[champ].titles++;
      teams[champ].years.push(tournament.year);
    }
  });

  const rows = Object.entries(teams).map(([team, d]) => {
    const total = d.wins + d.losses;
    const pct = total ? ((d.wins / total) * 100).toFixed(1) : '0.0';
    return { team, titles: d.titles, years: d.years.join(', '), wins: d.wins, losses: d.losses, pct };
  });

  rows.sort((a, b) => b.titles - a.titles || parseFloat(b.pct) - parseFloat(a.pct));

  document.getElementById('teamsTable').innerHTML = rows.map(r => `
    <tr>
      <td><a class="team-link" href="cricket-wc-team.html?team=${encodeURIComponent(r.team)}">${r.team}</a></td>
      <td>${r.titles || '—'}</td>
      <td>${r.years || '—'}</td>
      <td>${r.wins}</td>
      <td>${r.losses}</td>
      <td>${r.pct}%</td>
    </tr>`).join('');
});
</script>
</body>
</html>
