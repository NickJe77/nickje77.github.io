<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:30px auto;padding:0 20px;}
.hero{background:linear-gradient(90deg,#8b0000,#e10600);color:#fff;padding:40px;border-radius:22px;margin-bottom:25px;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;}
th{background:#e10600;color:#fff;padding:12px;text-align:left;}
td{padding:12px;}
tbody tr:nth-child(even){background:#eaf3ff;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#d8e8ff;}
.team{font-weight:700;}
.margin{font-weight:700;color:#0a4;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">
  <div class="hero">
    <h1>T20 World Cup Finals</h1>
  </div>

  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Winner</th>
        <th>Runner-up</th>
        <th>Margin</th>
        <th>Venue</th>
      </tr>
    </thead>
    <tbody id="finalsTable"></tbody>
  </table>
</div>

<script>
// Hardcoded finals — these never change. Each row links to the match page using
// season + id (match_type_number), the scheme t20-world-cup-match.html reads.
const FINALS = [
  { year:2007, winner:"India",       runner:"Pakistan",     margin:"India won by 5 runs",        venue:"Kingsmead",                                 id:46   },
  { year:2009, winner:"Pakistan",    runner:"Sri Lanka",    margin:"Pakistan won by 8 wickets",  venue:"Lord's",                                    id:116  },
  { year:2010, winner:"England",     runner:"Australia",    margin:"England won by 7 wickets",   venue:"Kensington Oval, Bridgetown",               id:177  },
  { year:2012, winner:"West Indies", runner:"Sri Lanka",    margin:"West Indies won by 36 runs", venue:"R Premadasa Stadium",                       id:289  },
  { year:2014, winner:"Sri Lanka",   runner:"India",        margin:"Sri Lanka won by 6 wickets", venue:"Shere Bangla National Stadium",             id:400  },
  { year:2016, winner:"West Indies", runner:"England",      margin:"West Indies won by 4 wickets", venue:"Eden Gardens",                            id:557  },
  { year:2021, winner:"Australia",   runner:"New Zealand",  margin:"Australia won by 8 wickets", venue:"Dubai International Cricket Stadium",        id:1428 },
  { year:2022, winner:"England",     runner:"Pakistan",     margin:"England won by 5 wickets",   venue:"Melbourne Cricket Ground",                  id:1879 },
  { year:2024, winner:"India",       runner:"South Africa", margin:"India won by 7 runs",        venue:"Kensington Oval, Bridgetown, Barbados",     id:2729 }
];

const tbody = document.getElementById("finalsTable");
tbody.innerHTML = "";

for (const f of FINALS) {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>${f.year}</td>
    <td class="team">${f.winner}</td>
    <td class="team">${f.runner}</td>
    <td class="margin">${f.margin}</td>
    <td>${f.venue}</td>
  `;

  tr.onclick = () => {
    window.location.href =
      `t20-world-cup-match.html?season=${f.year}&id=${f.id}`;
  };

  tbody.appendChild(tr);
}
</script>

</body>
</html>
