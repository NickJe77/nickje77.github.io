<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:30px auto;padding:0 20px;}
.hero{background:linear-gradient(90deg,#8b0000,#e10600);color:#fff;padding:40px;border-radius:22px;margin-bottom:25px;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;}
th{background:#e10600;color:#fff;padding:12px;text-align:left;}
td{padding:12px;}
tbody tr:nth-child(even){background:#eaf3ff;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#d8e8ff;}
.team{font-weight:700;}
.margin{font-weight:700;color:#0a4;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">
  <div class="hero">
    <h1>T20 World Cup Finals</h1>
  </div>

  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Winner</th>
        <th>Runner-up</th>
        <th>Margin</th>
        <th>Venue</th>
      </tr>
    </thead>
    <tbody id="finalsTable"></tbody>
  </table>
</div>

<script>
// Bulletproof: no JSON parsing. These NEVER change.
const FINALS = [
  {
    year: 2007,
    winner: "India",
    runner: "Pakistan",
    margin: "India won by 5 runs",
    venue: "Kingsmead",
    file: "data/t20-world-cup/matches/t20wc_2007_FULL.json"
  },
  {
    year: 2009,
    winner: "Pakistan",
    runner: "Sri Lanka",
    margin: "Pakistan won by 8 wickets",
    venue: "Lord's",
    file: "data/t20-world-cup/matches/t20wc_2009_FULL.json"
  },
  {
    year: 2010,
    winner: "England",
    runner: "Australia",
    margin: "England won by 7 wickets",
    venue: "Kensington Oval, Bridgetown",
    file: "data/t20-world-cup/matches/t20wc_2010_FULL.json"
  },
  {
    year: 2012,
    winner: "West Indies",
    runner: "Sri Lanka",
    margin: "West Indies won by 36 runs",
    venue: "R Premadasa Stadium",
    file: "data/t20-world-cup/matches/t20wc_2012_FULL.json"
  },
  {
    year: 2014,
    winner: "Sri Lanka",
    runner: "India",
    margin: "Sri Lanka won by 6 wickets",
    venue: "Shere Bangla National Stadium",
    file: "data/t20-world-cup/matches/t20wc_2014_FULL.json"
  },
  {
    year: 2016,
    winner: "West Indies",
    runner: "England",
    margin: "West Indies won by 4 wickets",
    venue: "Eden Gardens",
    file: "data/t20-world-cup/matches/t20wc_2016_FULL.json"
  },
  {
    year: 2021,
    winner: "Australia",
    runner: "New Zealand",
    margin: "Australia won by 8 wickets",
    venue: "Dubai International Cricket Stadium",
    file: "data/t20-world-cup/matches/t20wc_2021_FULL.json"
  },
  {
    year: 2022,
    winner: "England",
    runner: "Pakistan",
    margin: "England won by 5 wickets",
    venue: "Melbourne Cricket Ground",
    file: "data/t20-world-cup/matches/t20wc_2022_FULL.json"
  },
  {
    year: 2024,
    winner: "India",
    runner: "South Africa",
    margin: "India won by 7 runs",
    venue: "Kensington Oval, Bridgetown, Barbados",
    file: "data/t20-world-cup/matches/t20wc_2024_FULL.json"
  }
];

// Click behaviour: open the match page with FULL file.
// We pass year too, so the match page can reliably pick the Final without needing match_id.
const tbody = document.getElementById("finalsTable");
tbody.innerHTML = "";

for (const f of FINALS) {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>${f.year}</td>
    <td class="team">${f.winner}</td>
    <td class="team">${f.runner}</td>
    <td class="margin">${f.margin}</td>
    <td>${f.venue}</td>
  `;

  tr.onclick = () => {
    window.location.href =
      `t20-world-cup-match.html?file=${encodeURIComponent(f.file)}&year=${encodeURIComponent(String(f.year))}`;
  };

  tbody.appendChild(tr);
}
</script>

</body>
</html>
