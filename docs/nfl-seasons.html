<!DOCTYPE html>

<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}


/* HERO */

.hero{
padding:20px;
font-size:32px;
font-weight:700;
}


/* YEAR TABS */

.year-tabs{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:0 20px 10px 20px;
}

.year-tab{
padding:10px 16px;
background:#d9d9d9;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.year-tab.active{
background:#333;
color:white;
}


/* ROUND TABS */

.round-tabs{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:0 20px 20px 20px;
}

.round-tab{
padding:10px 16px;
background:#d9d9d9;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.round-tab.active{
background:#333;
color:white;
}


/* TABLE */

.container{
max-width:1100px;
margin:0 auto;
background:white;
border-radius:12px;
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
}


/* LIGHT BLUE EVERY SECOND ROW */

tbody tr:nth-child(even){
background:#eaf3ff;
}

tbody tr:hover{
background:#dbeafe;
cursor:pointer;
}

.playoff{
color:#d50a0a;
font-weight:700;
}

</style>

</head>
<body>

<div class="hero" id="title">NFL Season</div>

<div class="year-tabs" id="yearTabs"></div>

<div class="round-tabs" id="roundTabs">

<div class="round-tab active" onclick="setRound('All')">All Rounds</div>
<div class="round-tab" onclick="setRound('Regular Season')">Regular Season</div>
<div class="round-tab" onclick="setRound('Wild Card')">Wild Card</div>
<div class="round-tab" onclick="setRound('Divisional')">Divisional</div>
<div class="round-tab" onclick="setRound('Conference Championship')">Conference Championship</div>
<div class="round-tab" onclick="setRound('Super Bowl')">Super Bowl</div>

</div>

<div class="container">

<table id="games">

<thead>
<tr>
<th>Date</th>
<th>Winner</th>
<th></th>
<th>Loser</th>
<th>Round</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>

const startYear=1970;
const currentYear=new Date().getFullYear();

let currentSeason=currentYear;
let currentRound="All";
let seasonGames=[];


/* BUILD YEAR TABS */

const yearTabs=document.getElementById("yearTabs");

for(let y=startYear;y<=currentYear;y++){

const tab=document.createElement("div");

tab.className="year-tab";

tab.innerText=y;

tab.onclick=()=>loadSeason(y);

yearTabs.appendChild(tab);

}


/* HIGHLIGHT YEAR */

function highlightYear(year){

document.querySelectorAll(".year-tab").forEach(t=>{

t.classList.remove("active");

if(parseInt(t.innerText)==year)
t.classList.add("active");

});

}


/* ROUND SELECT */

function setRound(round){

currentRound=round;

document.querySelectorAll(".round-tab").forEach(t=>{

t.classList.remove("active");

if(t.innerText==round || (round=="All" && t.innerText=="All Rounds"))
t.classList.add("active");

});

renderGames();

}


/* LOAD SEASON (NEW DATA STRUCTURE) */

async function loadSeason(year){

currentSeason=year;

highlightYear(year);

document.getElementById("title").innerText="NFL "+year;

const res=await fetch(`/data/nfl/games/${year}.json`);
const data=await res.json();

seasonGames=data.games || [];

/* sort by date */
seasonGames.sort((a,b)=>a.date.localeCompare(b.date));

renderGames();

}


/* RENDER */

function renderGames(){

const tbody=document.querySelector("#games tbody");

tbody.innerHTML="";

seasonGames.forEach(g=>{

if(currentRound!="All" && g.game_type!=currentRound)return;

const date=g.date;

const home=g.home_team;
const away=g.away_team;

const hs=g.home_score;
const as=g.away_score;

let winner,loser,ws,ls;

if(hs>as){
winner=home;
loser=away;
ws=hs;
ls=as;
}else{
winner=away;
loser=home;
ws=as;
ls=hs;
}

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${date.split("-").reverse().join("/")}</td>
<td>${winner} ${ws}</td>
<td>def</td>
<td>${loser} ${ls}</td>
<td class="${g.game_type!='Regular Season'?'playoff':''}">${g.game_type}</td>
`;

tr.onclick=()=>{
location.href=`nfl-game.html?year=${currentSeason}&id=${g.game_id}`;
};

tbody.appendChild(tr);

});

}


/* INIT */

loadSeason(currentYear);

</script>

</body>
</html>
