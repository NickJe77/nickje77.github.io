<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
color:#111;
}

/* HERO */

.hero{
position:relative;
height:260px;
background-image:url('/images/nfl_hero.jpg?v=2');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
margin-bottom:20px;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(rgba(1,51,105,.72),rgba(213,10,10,.72));
}

.hero-content{
position:relative;
z-index:2;
text-align:center;
color:white;
padding:20px;
}

.hero-content h1{
margin:0;
font-size:54px;
font-weight:900;
text-shadow:0 3px 10px rgba(0,0,0,.35);
}

.hero-content p{
margin-top:10px;
font-size:20px;
opacity:.95;
}

/* YEAR TABS */

.year-tabs{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:0 20px 20px 20px;
max-width:1200px;
margin:0 auto;
}

.year-tab{
padding:10px 16px;
background:#d9d9d9;
border-radius:10px;
cursor:pointer;
font-weight:700;
transition:.2s;
}

.year-tab:hover{
background:#c7d7ea;
}

.year-tab.active{
background:#013369;
color:white;
}

/* ROUND TABS */

.round-tabs{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:0 20px 20px 20px;
max-width:1200px;
margin:0 auto;
}

.round-tab{
padding:10px 16px;
background:#d9d9d9;
border-radius:10px;
cursor:pointer;
font-weight:700;
transition:.2s;
}

.round-tab:hover{
background:#c7d7ea;
}

.round-tab.active{
background:#d50a0a;
color:white;
}

/* TABLE */

.container{
max-width:1200px;
margin:0 auto 40px auto;
background:white;
border-radius:14px;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:850px;
}

th{
background:#013369;
color:white;
font-size:15px;
padding:14px;
text-align:left;
}

td{
padding:14px;
border-bottom:1px solid #eee;
font-size:15px;
}

/* LIGHT BLUE EVERY SECOND ROW */

tbody tr:nth-child(even){
background:#eaf3ff;
}

tbody tr:hover{
background:#dbeafe;
cursor:pointer;
}

.playoff{
color:#d50a0a;
font-weight:700;
}

.score{
font-weight:800;
}

@media(max-width:700px){

.hero{
height:220px;
}

.hero-content h1{
font-size:38px;
}

.hero-content p{
font-size:16px;
}

th,td{
padding:10px;
font-size:13px;
}

}

</style>

</head>
<body>

<div class="hero">

  <div class="hero-content">
    <h1 id="title">NFL Season</h1>
    <p>The Sporting Almanac</p>
  </div>

</div>

<div class="year-tabs" id="yearTabs"></div>

<div class="round-tabs">

<div class="round-tab active" onclick="setRound('All')">All Rounds</div>
<div class="round-tab" onclick="setRound('Regular Season')">Regular Season</div>
<div class="round-tab" onclick="setRound('Wild Card')">Wild Card</div>
<div class="round-tab" onclick="setRound('Divisional')">Divisional</div>
<div class="round-tab" onclick="setRound('Conference Championship')">Conference Championship</div>
<div class="round-tab" onclick="setRound('Super Bowl')">Super Bowl</div>

</div>

<div class="container">

<table id="games">

<thead>
<tr>
<th>Date</th>
<th>Winner</th>
<th></th>
<th>Loser</th>
<th>Round</th>
<th>Venue</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>

const startYear = 1970;
const currentYear = 2025;

let currentSeason = currentYear;
let currentRound = "All";
let seasonGames = [];

/* URL PARAM */

const params = new URLSearchParams(location.search);

if(params.get("season")){
currentSeason = parseInt(params.get("season"));
}

/* BUILD YEAR TABS */

const yearTabs = document.getElementById("yearTabs");

for(let y = currentYear; y >= startYear; y--){

  const tab = document.createElement("div");

  tab.className = "year-tab";

  tab.innerText = y;

  tab.onclick = () => {
    location.href = `nfl-season.html?season=${y}`;
  };

  yearTabs.appendChild(tab);

}

/* HIGHLIGHT YEAR */

function highlightYear(year){

document.querySelectorAll(".year-tab").forEach(t=>{

t.classList.remove("active");

if(parseInt(t.innerText)==year)
t.classList.add("active");

});

}

/* ROUND SELECT */

function setRound(round){

currentRound=round;

document.querySelectorAll(".round-tab").forEach(t=>{

t.classList.remove("active");

if(t.innerText==round || (round=="All" && t.innerText=="All Rounds"))
t.classList.add("active");

});

renderGames();

}

/* LOAD SEASON */

async function loadSeason(year){

currentSeason=year;

highlightYear(year);

document.getElementById("title").innerText="NFL "+year;

try{

const res=await fetch(`/data/nfl/seasons/${year}.json`);

const data=await res.json();

seasonGames = Array.isArray(data) ? data : (data.games || []);

}catch(err){

console.log(err);

seasonGames=[];

}

seasonGames.sort((a,b)=>a.date.localeCompare(b.date));

renderGames();

}

/* RENDER */

function renderGames(){

const tbody=document.querySelector("#games tbody");

tbody.innerHTML="";

seasonGames.forEach(g=>{

const round = g.game_type || g.round || "Regular Season";

if(currentRound!="All" && round!=currentRound)return;

const date = g.date || "";

const winner = g.winner || "";
const loser = g.loser || "";

const ws = g.winner_points || "";
const ls = g.loser_points || "";

const venue = g.venue || "";

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${date}</td>
<td class="score">${winner} ${ws}</td>
<td>def</td>
<td>${loser} ${ls}</td>
<td class="${round!='Regular Season'?'playoff':''}">
${round}
</td>
<td>${venue}</td>
`;

tr.onclick=()=>{

location.href=`nfl-game.html?season=${currentSeason}&game=${g.game_id}`;

};

tbody.appendChild(tr);

});

}

/* INIT */

loadSeason(currentSeason);

</script>

</body>
</html>
