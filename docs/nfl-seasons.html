<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

/* HERO */

.hero{
position:relative;
height:220px;
background-image:url('/images/nfl_hero.jpg?v=2');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
margin-bottom:22px;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(160deg,rgba(12,19,15,.72),rgba(12,19,15,.85));
}

.hero-content{
position:relative;
z-index:2;
text-align:center;
color:#fff;
padding:20px;
}

.hero-content h1{
margin:0;
font-family:var(--display);
font-weight:600;
font-size:clamp(28px,5vw,42px);
letter-spacing:.01em;
text-transform:uppercase;
}

.hero-content p{
margin-top:8px;
font-size:13.5px;
color:rgba(255,255,255,.68);
}

/* YEAR TABS */

.year-tabs{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:0 20px 16px 20px;
max-width:1200px;
margin:0 auto;
justify-content:center;
}

.year-tab{
padding:9px 16px;
background:var(--surface);
border:1px solid var(--line);
border-radius:999px;
cursor:pointer;
font-weight:600;
font-size:13.5px;
transition:.2s;
color:var(--ink);
font-family:var(--body);
}

.year-tab:hover{
border-color:var(--faint);
}

.year-tab.active{
background:var(--board);
border-color:var(--board);
color:#fff;
}

/* ROUND TABS */

.round-tabs{
display:flex;
flex-wrap:wrap;
gap:8px;
padding:0 20px 20px 20px;
max-width:1200px;
margin:0 auto;
justify-content:center;
}

.round-tab{
padding:9px 16px;
background:var(--surface);
border:1px solid var(--line);
border-radius:999px;
cursor:pointer;
font-weight:600;
font-size:13.5px;
transition:.2s;
color:var(--ink);
font-family:var(--body);
}

.round-tab:hover{
border-color:var(--faint);
}

.round-tab.active{
background:var(--accent);
border-color:var(--accent);
color:var(--ink);
}

/* TABLE */

.container{
max-width:1200px;
margin:0 auto 60px auto;
padding:0 20px;
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:750px;
background:var(--surface);
border:1px solid var(--line);
border-radius:var(--radius);
overflow:hidden;
}

th{
background:#f7f9fb;
color:var(--muted);
font-size:11px;
font-weight:600;
padding:11px 14px;
text-align:left;
text-transform:uppercase;
letter-spacing:.04em;
font-family:var(--body);
border-bottom:1px solid var(--line);
}

td{
padding:11px 14px;
border-bottom:1px solid var(--line);
font-size:13.5px;
color:#27313c;
}

tbody tr:last-child td{border-bottom:none;}

tbody tr:hover td{
background:#f9fbfd;
cursor:pointer;
}

.playoff{
color:var(--accent);
font-weight:700;
}

.score{
font-weight:700;
color:var(--ink);
}

@media(max-width:700px){

.hero{
height:200px;
}

th,td{
padding:9px 10px;
font-size:12.5px;
}

}

</style>

</head>
<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div class="hero">

  <div class="hero-content">
    <h1 id="title">NFL Season</h1>
    <p>The Sporting Almanac</p>
  </div>

</div>

<div class="year-tabs" id="yearTabs"></div>

<div class="round-tabs" id="roundTabs"></div>

<div class="container">

<table id="games">

<thead>
<tr>
<th>Date</th>
<th>Winner</th>
<th></th>
<th>Loser</th>
<th>Week</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>

const startYear = 1970;
const currentYear = 2025;

let currentSeason = 2025;
let currentRound = "All";
let seasonGames = [];

/* URL PARAM */

const params = new URLSearchParams(location.search);

if(params.get("season")){
currentSeason = parseInt(params.get("season"));
}

/* BUILD YEAR TABS */

const yearTabs = document.getElementById("yearTabs");

for(let y = currentYear; y >= startYear; y--){

  const tab = document.createElement("div");

  tab.className = "year-tab";

  if(y === currentSeason){
    tab.classList.add("active");
  }

  tab.innerText = y;

  tab.onclick = () => {
    loadSeason(y);
  };

  yearTabs.appendChild(tab);

}

/* HIGHLIGHT YEAR */

function highlightYear(year){

document.querySelectorAll(".year-tab").forEach(t=>{

t.classList.remove("active");

if(parseInt(t.innerText)==year){
t.classList.add("active");
}

});

}

/* ROUND SELECT */

function setRound(round){

currentRound = round;

document.querySelectorAll(".round-tab").forEach(t=>{

t.classList.remove("active");

if(t.dataset.round == round){
t.classList.add("active");
}

});

renderGames();

}

/* BUILD ROUND TABS */

function buildRoundTabs(){

const roundTabs = document.getElementById("roundTabs");

roundTabs.innerHTML = "";

const allTab = document.createElement("div");

allTab.className = "round-tab active";
allTab.dataset.round = "All";
allTab.innerText = "All Rounds";

allTab.onclick = ()=>setRound("All");

roundTabs.appendChild(allTab);

const rounds = [...new Set(
seasonGames.map(g => g.week).filter(Boolean)
)];

rounds.forEach(round=>{

const tab = document.createElement("div");

tab.className = "round-tab";

if(!isNaN(parseInt(round))){
tab.innerText = `Week ${round}`;
}else{
tab.innerText = round;
}

tab.dataset.round = round;

tab.onclick = ()=>setRound(round);

roundTabs.appendChild(tab);

});

}

/* LOAD SEASON */

async function loadSeason(year){

currentSeason = year;

highlightYear(year);

document.getElementById("title").innerText = "NFL " + year;

try{

const res = await fetch(`/data/nfl/seasons/${year}.json`);

const data = await res.json();

seasonGames = data.games || [];

seasonGames.sort((a,b)=>
(a.date || "").localeCompare(b.date || "")
);

}catch(err){

console.log(err);

seasonGames=[];

}

currentRound = "All";

buildRoundTabs();

renderGames();

}

/* RENDER */

function renderGames(){

const tbody = document.querySelector("#games tbody");

tbody.innerHTML = "";

seasonGames.forEach(g=>{

const week = g.week || "";

if(currentRound!="All" && week!=currentRound)return;

const date = g.date || "";

const team1 = g.team1 || "";
const team2 = g.team2 || "";

const score1 = parseInt(g.score1 || 0);
const score2 = parseInt(g.score2 || 0);

let winner="", loser="", ws="", ls="";

if(score1 >= score2){

winner = team1;
loser = team2;
ws = score1;
ls = score2;

}else{

winner = team2;
loser = team1;
ws = score2;
ls = score1;

}

const tr = document.createElement("tr");

tr.innerHTML = `
<td>${date}</td>
<td class="score">${winner} ${ws}</td>
<td>def</td>
<td>${loser} ${ls}</td>
<td class="${isNaN(parseInt(week)) ? 'playoff' : ''}">
${isNaN(parseInt(week)) ? week : 'Week ' + week}
</td>
`;

tr.onclick = ()=>{

location.href =
`nfl-game.html?season=${currentSeason}&game=${g.game_id}`;

};

tbody.appendChild(tr);

});

}

/* INIT */

loadSeason(currentSeason);

</script>

</body>
</html>
