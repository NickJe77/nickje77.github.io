<script>

const indexUrl="data/bbl/index.json";
const basePath="data/bbl/";

const yearGrid=document.getElementById("yearGrid");
const tableBody=document.getElementById("finalsTable");

let finalsData=[];

function seasonLabel(year){

const y=parseInt(year);

return y+"/"+String(y+1).slice(2);

}

fetch(indexUrl)

.then(r=>r.json())

.then(files=>Promise.all(

files.map(file=>

fetch(basePath+file)

.then(r=>r.json())

.then(matches=>({file,matches}))

)

))

.then(seasons=>{

seasons.forEach(season=>{

let finalMatch=null;
let finalIndex=-1;

season.matches.forEach((m,index)=>{

if(

m.info?.event?.stage==="Final" ||

m.info?.event?.name==="Final" ||

m.info?.stage==="Final"

){

finalMatch=m;
finalIndex=index;

}

});


// fallback: last match of season if Final not tagged

if(!finalMatch && season.matches.length){

finalMatch=season.matches[season.matches.length-1];
finalIndex=season.matches.length-1;

}

if(!finalMatch) return;

const year=parseInt(finalMatch.info.season);

const winner=finalMatch.info.outcome?.winner||"—";

const runnerUp=finalMatch.info.teams.find(t=>t!==winner)||"—";

let result="—";

if(finalMatch.info.outcome?.by?.runs)
result="won by "+finalMatch.info.outcome.by.runs+" runs";

else if(finalMatch.info.outcome?.by?.wickets)
result="won by "+finalMatch.info.outcome.by.wickets+" wickets";

finalsData.push({

season:seasonLabel(year),

year:year,

winner,

runnerUp,

result,

date:finalMatch.info.dates[0],

venue:finalMatch.info.venue,

file:season.file,

matchIndex:finalIndex

});

});

finalsData.sort((a,b)=>a.year-b.year);

buildYearButtons();

renderTable(finalsData);

});


function buildYearButtons(){

yearGrid.innerHTML="";

const allBtn=document.createElement("button");

allBtn.className="year-btn active";

allBtn.textContent="ALL";

allBtn.onclick=()=>{

setActive(allBtn);

renderTable(finalsData);

};

yearGrid.appendChild(allBtn);


finalsData.forEach(f=>{

const btn=document.createElement("button");

btn.className="year-btn";

btn.textContent=f.season;

btn.onclick=()=>{

setActive(btn);

renderTable(finalsData.filter(x=>x.season===f.season));

};

yearGrid.appendChild(btn);

});

}


function setActive(btn){

document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

}


function renderTable(rows){

tableBody.innerHTML="";

rows.forEach(f=>{

const tr=document.createElement("tr");

tr.className="clickable";

tr.onclick=()=>{

location.href=`bbl-match.html?file=${encodeURIComponent(f.file)}&match=${f.matchIndex}`;

};

tr.innerHTML=`

<td>${f.season}</td>

<td class="winner">

<a class="team-link" href="bbl-team.html?team=${encodeURIComponent(f.winner)}">

${f.winner}

</a>

</td>

<td class="runnerup">

<a class="team-link" href="bbl-team.html?team=${encodeURIComponent(f.runnerUp)}">

${f.runnerUp}

</a>

</td>

<td class="result">${f.result}</td>

<td>${formatDate(f.date)}</td>

<td>${f.venue}</td>

`;

tableBody.appendChild(tr);

});

}


function formatDate(d){

return new Date(d).toLocaleDateString("en-GB",{

day:"2-digit",

month:"short",

year:"numeric"

});

}

</script>
