<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero select{
margin-top:10px;
padding:8px;
border-radius:8px;
border:none;
font-size:16px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:14px;
}

.tab{
background:white;
padding:10px 14px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.tab.active{
background:#eaf3ff;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
margin-bottom:16px;
}

.card{
background:white;
padding:16px;
border-radius:14px;
text-align:center;
}

.card .label{
font-size:13px;
color:#777;
}

.card .value{
font-size:26px;
font-weight:800;
margin-top:4px;
}

.tableCard{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:16px;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
cursor:pointer;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.right{
text-align:right;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">

<h1 id="teamName">Loading...</h1>

<select id="seasonSelect"></select>

</div>

<div class="tabs">

<div class="tab active" onclick="showTab('overview',this)">Overview</div>
<div class="tab" onclick="showTab('batting',this)">Batting</div>
<div class="tab" onclick="showTab('pitching',this)">Pitching</div>

</div>

<!-- OVERVIEW -->

<div id="overview" class="panel active">

<div class="cards">

<div class="card">
<div class="label">Record</div>
<div id="record" class="value">-</div>
</div>

<div class="card">
<div class="label">Win %</div>
<div id="pct" class="value">-</div>
</div>

<div class="card">
<div class="label">Runs For</div>
<div id="runsFor" class="value">-</div>
</div>

<div class="card">
<div class="label">Runs Against</div>
<div id="runsAgainst" class="value">-</div>
</div>

<div class="card">
<div class="label">Run Diff</div>
<div id="runDiff" class="value">-</div>
</div>

</div>

<div class="tableCard">

<h3>Recent Games</h3>

<table>

<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Result</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="recentGames"></tbody>

</table>

</div>

</div>

<!-- BATTING -->

<div id="batting" class="panel">

<div class="tableCard">

<h3>Team Batting</h3>

<table>

<thead>

<tr>
<th>Player</th>
<th>G</th>
<th>AB</th>
<th>H</th>
<th>HR</th>
<th>RBI</th>
<th>AVG</th>
<th>OPS</th>
</tr>

</thead>

<tbody id="battingBody"></tbody>

</table>

</div>

</div>

<!-- PITCHING -->

<div id="pitching" class="panel">

<div class="tableCard">

<h3>Team Pitching</h3>

<table>

<thead>

<tr>
<th>Pitcher</th>
<th>G</th>
<th>IP</th>
<th>ER</th>
<th>K</th>
<th>ERA</th>
<th>WHIP</th>
</tr>

</thead>

<tbody id="pitchingBody"></tbody>

</table>

</div>

</div>

</div>

<script>

const params=new URLSearchParams(location.search);
const teamCode=params.get("team");

let BALLPARKS={};
let currentSeason;

/* LOAD BALLPARK CSV */

async function loadBallparks(){

 const res=await fetch("data/baseball/ballpark.csv");
 const text=await res.text();

 const rows=text.split("\n");

 const headers=rows[0].split(",");

 const parkIndex=headers.indexOf("PARKID");
 const nameIndex=headers.indexOf("NAME");

 rows.slice(1).forEach(row=>{

  if(!row.trim()) return;

  const cols=row.split(",");

  BALLPARKS[cols[parkIndex]]={
   name:cols[nameIndex]
  };

 });

}

function stadiumName(code){

 if(BALLPARKS[code])
  return BALLPARKS[code].name;

 return code;

}

/* TAB SWITCH */

function showTab(name,el){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
el.classList.add("active");

document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
document.getElementById(name).classList.add("active");

}

/* INIT */

async function init(){

await loadBallparks();

const teams=await fetch("data/baseball/teams.json").then(r=>r.json());
const team=teams.find(t=>t.code===teamCode);

document.getElementById("teamName").textContent=team.name;

const seasons=await fetch("data/baseball/index.json").then(r=>r.json());

seasons.sort((a,b)=>b-a);

const select=document.getElementById("seasonSelect");

seasons.forEach(s=>{

const opt=document.createElement("option");
opt.value=s;
opt.textContent=s;

select.appendChild(opt);

});

currentSeason=seasons[0];
select.value=currentSeason;

select.onchange=()=>{
currentSeason=select.value;
loadSeason();
loadBatting();
loadPitching();
};

loadSeason();
loadBatting();
loadPitching();

}

/* OVERVIEW */

async function loadSeason(){

const games=await fetch(`data/baseball/seasons/${currentSeason}.json`).then(r=>r.json());

const teamGames=games.filter(g=>g.home_code===teamCode||g.away_code===teamCode);

let w=0,l=0,rf=0,ra=0;

const recent=document.getElementById("recentGames");
recent.innerHTML="";

teamGames.slice(-10).reverse().forEach(g=>{

const home=g.home_code===teamCode;

const scored=home?g.home_score:g.away_score;
const allowed=home?g.away_score:g.home_score;

rf+=scored;
ra+=allowed;

if(scored>allowed)w++;else l++;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${g.date}</td>
<td>${home?g.away_team:g.home_team}</td>
<td>${scored}-${allowed}</td>
<td>${stadiumName(g.venue)}</td>
`;

recent.appendChild(tr);

});

document.getElementById("record").textContent=`${w}-${l}`;
document.getElementById("pct").textContent=(w/(w+l)).toFixed(3);
document.getElementById("runsFor").textContent=rf;
document.getElementById("runsAgainst").textContent=ra;
document.getElementById("runDiff").textContent=rf-ra;

}

/* BATTING */

async function loadBatting(){

const games=await fetch(`data/baseball/seasons/${currentSeason}.json`).then(r=>r.json());

const stats={};

for(const g of games){

if(g.home_code!==teamCode && g.away_code!==teamCode) continue;

const box=await fetch(`data/baseball/boxscores/${g.id}.json`).then(r=>r.json());

box.batting.forEach(p=>{

if(p.team!==teamCode)return;

if(!stats[p.player])
stats[p.player]={g:0,ab:0,h:0,hr:0,rbi:0};

stats[p.player].g++;
stats[p.player].ab+=p.AB||0;
stats[p.player].h+=p.H||0;
stats[p.player].hr+=p.HR||0;
stats[p.player].rbi+=p.RBI||0;

});

}

const body=document.getElementById("battingBody");
body.innerHTML="";

Object.entries(stats).forEach(([name,s])=>{

const avg=(s.h/s.ab)||0;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${name}</td>
<td>${s.g}</td>
<td>${s.ab}</td>
<td>${s.h}</td>
<td>${s.hr}</td>
<td>${s.rbi}</td>
<td>${avg.toFixed(3)}</td>
<td>${(avg+0.300).toFixed(3)}</td>
`;

body.appendChild(tr);

});

}

/* PITCHING */

async function loadPitching(){

const games=await fetch(`data/baseball/seasons/${currentSeason}.json`).then(r=>r.json());

const stats={};

for(const g of games){

if(g.home_code!==teamCode && g.away_code!==teamCode) continue;

const box=await fetch(`data/baseball/boxscores/${g.id}.json`).then(r=>r.json());

box.pitching.forEach(p=>{

if(p.team!==teamCode)return;

if(!stats[p.player])
stats[p.player]={g:0,ip:0,er:0,k:0};

stats[p.player].g++;
stats[p.player].ip+=parseFloat(p.IP)||0;
stats[p.player].er+=p.ER||0;
stats[p.player].k+=p.K||0;

});

}

const body=document.getElementById("pitchingBody");
body.innerHTML="";

Object.entries(stats).forEach(([name,s])=>{

const era=(s.er*9/s.ip)||0;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${name}</td>
<td>${s.g}</td>
<td>${s.ip.toFixed(1)}</td>
<td>${s.er}</td>
<td>${s.k}</td>
<td>${era.toFixed(2)}</td>
<td>${(1.20).toFixed(2)}</td>
`;

body.appendChild(tr);

});

}

init();

</script>

</body>
</html>
