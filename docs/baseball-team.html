<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}

body{
font-family:var(--body);
margin:0;
background:var(--bg);
color:var(--ink);
-webkit-font-smoothing:antialiased;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:15px;
background:var(--surface);
border-bottom:1px solid var(--line);
font-weight:600;
font-size:13.5px;
}
.navbar a{
text-decoration:none;
color:var(--ink);
opacity:.7;
transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
opacity:1;
color:var(--accent);
}

.page{
max-width:1200px;
margin:0 auto;
padding:26px 20px 70px;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
position:relative;
background:linear-gradient(160deg,var(--board-2),var(--board));
color:#fff;
padding:32px 34px;
border-radius:var(--radius);
margin-bottom:22px;
box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
font-family:var(--body);
font-size:11.5px;
font-weight:600;
letter-spacing:.16em;
text-transform:uppercase;
color:var(--accent);
margin-bottom:10px;
}
.hero h1{
margin:0;
font-family:var(--display);
font-weight:600;
font-size:clamp(28px,5vw,40px);
letter-spacing:.01em;
text-transform:uppercase;
}
.hero select{
margin-top:16px;
padding:9px 16px;
border-radius:999px;
border:1px solid rgba(255,255,255,.2);
font-family:var(--body);
font-size:13px;
font-weight:600;
background:rgba(255,255,255,.08);
color:#fff;
cursor:pointer;
}
.hero select:focus{ outline:none;border-color:var(--accent); }

/* ── Tabs ─────────────────────────────────────────────── */
.tabs{
display:inline-flex;
background:var(--surface);
border:1px solid var(--line);
border-radius:999px;
padding:4px;
gap:4px;
margin-bottom:20px;
}

.tab{
padding:8px 18px;
border-radius:999px;
font-family:var(--body);
font-weight:600;
font-size:13px;
color:var(--muted);
cursor:pointer;
transition:background .15s,color .15s;
}
.tab:hover{ color:var(--ink); }

.tab.active{
background:var(--accent-soft);
color:var(--ink);
}

/* ── Cards / tables ───────────────────────────────────── */
.card{
background:var(--surface);
border:1px solid var(--line);
border-radius:var(--radius);
padding:16px;
margin-bottom:16px;
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px 12px;
border-bottom:1px solid var(--line);
font-size:13.5px;
}

th{
background:#f7f9fb;
color:var(--muted);
font-family:var(--body);
font-weight:600;
font-size:11px;
letter-spacing:.04em;
text-transform:uppercase;
text-align:left;
}

td{
color:#27313c;
font-variant-numeric:tabular-nums;
}

tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover td{ background:#f0f6ff; }

.click{
color:var(--ink);
font-weight:700;
cursor:pointer;
}
.click:hover{ color:var(--accent); }

.right{ text-align:right; }

.panel{ display:none; }
.panel.active{ display:block; }

</style>
</head>
<body>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-players.html">Players</a>
<a href="baseball-standings.html">Standings</a>
</nav>

<div class="page">

<div class="hero">

<div class="eyebrow">MLB</div>
<h1 id="teamName">Loading...</h1>

<select id="seasonSelect"></select>

</div>

<div class="tabs">

<div class="tab active" onclick="showTab('overview',this)">Overview</div>
<div class="tab" onclick="showTab('batting',this)">Batting</div>
<div class="tab" onclick="showTab('pitching',this)">Pitching</div>

</div>

<div id="overview" class="panel active">
<div class="card">
<table>
<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th class="right">Result</th>
<th>Venue</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>
</div>

<div id="batting" class="panel">
<div class="card">
<table>
<thead>
<tr>
<th>Player</th>
<th class="right">G</th>
<th class="right">AB</th>
<th class="right">H</th>
<th class="right">HR</th>
<th class="right">RBI</th>
<th class="right">AVG</th>
</tr>
</thead>
<tbody id="battingBody"></tbody>
</table>
</div>
</div>

<div id="pitching" class="panel">
<div class="card">
<table>
<thead>
<tr>
<th>Pitcher</th>
<th class="right">G</th>
<th class="right">IP</th>
<th class="right">ER</th>
<th class="right">K</th>
<th class="right">ERA</th>
</tr>
</thead>
<tbody id="pitchingBody"></tbody>
</table>
</div>
</div>

</div>

<script>

const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
const teamCode=new URLSearchParams(location.search).get("team");

let currentSeason;

let ALL_GAMES=[];
let TEAM_GAMES=[];

let PARKS={};

function showTab(name,el){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
el.classList.add("active");

document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
document.getElementById(name).classList.add("active");

}

async function loadBallparks(){

const text=await fetch(`${R2}/baseball/ballparks.csv`).then(r=>r.text());

text.split("\n").slice(1).forEach(r=>{

const cols=r.split(",");
PARKS[cols[0]]=cols[1];

});

}

function parkName(code){
return PARKS[code]||code;
}

async function init(){

await loadBallparks();

const teams=await fetch(`${R2}/baseball/teams.json`).then(r=>r.json());

const team=teams.find(t=>t.code==teamCode);

teamName.textContent=team.name;

const seasons=await fetch(`${R2}/baseball/index.json`).then(r=>r.json());

seasons.sort((a,b)=>b-a);

seasonSelect.innerHTML=seasons.map(s=>`<option>${s}</option>`).join("");

currentSeason=seasons[0];

seasonSelect.value=currentSeason;

seasonSelect.onchange=()=>{
currentSeason=seasonSelect.value;
loadSeason();
};

loadSeason();

}

async function loadSeason(){

ALL_GAMES=await fetch(
`${R2}/baseball/seasons/${currentSeason}.json`
).then(r=>r.json());

const looksLikeGameData = Array.isArray(ALL_GAMES) && ALL_GAMES.length > 0
    && ALL_GAMES[0] && typeof ALL_GAMES[0] === "object"
    && "date" in ALL_GAMES[0] && "home_score" in ALL_GAMES[0];

if(!looksLikeGameData){
gamesBody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:20px;">Game-by-game results aren't available yet for this season.</td></tr>`;
TEAM_GAMES=[];
return;
}

TEAM_GAMES=ALL_GAMES.filter(g=>
g.home_code==teamCode||g.away_code==teamCode);

renderGames();

loadBatting();
loadPitching();

}

function renderGames(){

gamesBody.innerHTML="";

TEAM_GAMES.forEach(g=>{

const id=`${g.date}_${g.away_code}_${g.home_code}`;

const opp=g.home_code==teamCode?g.away_team:g.home_team;

const scored=g.home_code==teamCode?g.home_score:g.away_score;

const allowed=g.home_code==teamCode?g.away_score:g.home_score;

gamesBody.innerHTML+=`

<tr>

<td>${g.date}</td>

<td>${opp}</td>

<td class="click right"
onclick="location.href='baseball-game.html?id=${id}'">
${scored}-${allowed}
</td>

<td>${parkName(g.venue)}</td>

</tr>

`;

});

}

async function loadBatting(){

const stats={};

const boxes=await Promise.all(
TEAM_GAMES.map(g=>
fetch(`${R2}/baseball/boxscores/${g.date}_${g.away_code}_${g.home_code}.json`)
.then(r=>r.json())
)
);

boxes.forEach(box=>{

(box.batting||[]).forEach(p=>{

if(p.team!=teamCode)return;

if(!stats[p.player])
stats[p.player]={g:0,ab:0,h:0,hr:0,rbi:0};

stats[p.player].g++;
stats[p.player].ab+=p.AB||0;
stats[p.player].h+=p.H||0;
stats[p.player].hr+=p.HR||0;
stats[p.player].rbi+=p.RBI||0;

});

});

battingBody.innerHTML="";

Object.entries(stats).forEach(([name,s])=>{

const avg=s.ab? (s.h/s.ab):0;

battingBody.innerHTML+=`

<tr>

<td class="click"
onclick="location.href='baseball-player.html?player=${encodeURIComponent(name)}'">
${name}
</td>

<td class="right">${s.g}</td>
<td class="right">${s.ab}</td>
<td class="right">${s.h}</td>
<td class="right">${s.hr}</td>
<td class="right">${s.rbi}</td>
<td class="right">${avg.toFixed(3)}</td>

</tr>

`;

});

}

async function loadPitching(){

const stats={};

const boxes=await Promise.all(
TEAM_GAMES.map(g=>
fetch(`${R2}/baseball/boxscores/${g.date}_${g.away_code}_${g.home_code}.json`)
.then(r=>r.json())
)
);

boxes.forEach(box=>{

(box.pitching||[]).forEach(p=>{

if(p.team!=teamCode)return;

if(!stats[p.player])
stats[p.player]={g:0,ip:0,er:0,k:0};

stats[p.player].g++;
stats[p.player].ip+=parseFloat(p.IP)||0;
stats[p.player].er+=p.ER||0;
stats[p.player].k+=p.K||0;

});

});

pitchingBody.innerHTML="";

Object.entries(stats).forEach(([name,s])=>{

const era=s.ip? (s.er*9/s.ip):0;

pitchingBody.innerHTML+=`

<tr>

<td class="click"
onclick="location.href='baseball-player.html?player=${encodeURIComponent(name)}'">
${name}
</td>

<td class="right">${s.g}</td>
<td class="right">${s.ip.toFixed(1)}</td>
<td class="right">${s.er}</td>
<td class="right">${s.k}</td>
<td class="right">${era.toFixed(2)}</td>

</tr>

`;

});

}

init();

</script>

</body>
</html>
