<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:28px;
border-radius:20px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:40px;
}

.hero select{
margin-top:10px;
padding:8px;
border-radius:8px;
border:none;
font-size:16px;
}

/* TABS */

.tabs{
display:flex;
gap:10px;
margin-bottom:16px;
}

.tab{
background:white;
padding:10px 14px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.tab.active{
background:#eaf3ff;
}

/* CARDS */

.card{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:16px;
}

.card h3{
margin:0 0 12px;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.right{
text-align:right;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">

<h1 id="teamName">Loading...</h1>

<select id="seasonSelect"></select>

</div>

<div class="tabs">

<div class="tab active" onclick="showTab('overview',this)">Overview</div>
<div class="tab" onclick="showTab('batting',this)">Batting</div>
<div class="tab" onclick="showTab('pitching',this)">Pitching</div>

</div>

<!-- OVERVIEW -->

<div id="overview" class="panel active">

<div class="card">

<h3>Games</h3>

<table>

<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th class="right">Result</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

</div>

<!-- BATTING -->

<div id="batting" class="panel">

<div class="card">

<h3>Batting</h3>

<table>

<thead>
<tr>
<th>Player</th>
<th class="right">G</th>
<th class="right">AB</th>
<th class="right">H</th>
<th class="right">HR</th>
<th class="right">RBI</th>
<th class="right">AVG</th>
</tr>
</thead>

<tbody id="battingBody"></tbody>

</table>

</div>

</div>

<!-- PITCHING -->

<div id="pitching" class="panel">

<div class="card">

<h3>Pitching</h3>

<table>

<thead>
<tr>
<th>Pitcher</th>
<th class="right">G</th>
<th class="right">IP</th>
<th class="right">ER</th>
<th class="right">K</th>
<th class="right">ERA</th>
</tr>
</thead>

<tbody id="pitchingBody"></tbody>

</table>

</div>

</div>

</div>

<script>

const params=new URLSearchParams(location.search);

const teamCode=params.get("team");

let currentSeason;

let PARKS={};

/* LOAD BALLPARKS */

async function loadBallparks(){

const res=await fetch("data/baseball/ballparks.csv");

const text=await res.text();

const rows=text.split("\n");

const headers=rows[0].split(",");

const parkIndex=headers.indexOf("PARKID");
const nameIndex=headers.indexOf("NAME");

rows.slice(1).forEach(r=>{

const cols=r.split(",");

if(!cols[parkIndex])return;

PARKS[cols[parkIndex]]=cols[nameIndex];

});

}

function parkName(code){

return PARKS[code]||code;

}

/* TAB SWITCH */

function showTab(name,el){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

el.classList.add("active");

document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));

document.getElementById(name).classList.add("active");

}

/* INIT */

async function init(){

await loadBallparks();

const teams=await fetch("data/baseball/teams.json")
.then(r=>r.json());

const team=teams.find(t=>t.code==teamCode);

document.getElementById("teamName").textContent=team.name;

/* SEASONS */

const seasons=await fetch("data/baseball/index.json")
.then(r=>r.json());

seasons.sort((a,b)=>b-a);

const select=document.getElementById("seasonSelect");

seasons.forEach(s=>{

const opt=document.createElement("option");

opt.value=s;

opt.textContent=s;

select.appendChild(opt);

});

currentSeason=seasons[0];

select.value=currentSeason;

select.onchange=()=>{

currentSeason=select.value;

loadGames();
loadBatting();
loadPitching();

};

loadGames();
loadBatting();
loadPitching();

}

/* LOAD GAMES */

async function loadGames(){

const games=await fetch(
`data/baseball/seasons/${currentSeason}.json`
).then(r=>r.json());

const body=document.getElementById("gamesBody");

body.innerHTML="";

games.forEach(g=>{

if(g.home_code!=teamCode && g.away_code!=teamCode)return;

const gameId=
`${g.date}_${g.away_code}_${g.home_code}`;

const opponent=
g.home_code==teamCode?
g.away_team:g.home_team;

const scored=
g.home_code==teamCode?
g.home_score:g.away_score;

const allowed=
g.home_code==teamCode?
g.away_score:g.home_score;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${g.date}</td>

<td class="click">
${opponent}
</td>

<td class="right click"
onclick="location.href='baseball-game.html?id=${gameId}'">
${scored}-${allowed}
</td>

<td>${parkName(g.venue)}</td>

`;

body.appendChild(tr);

});

}

/* BATTING */

async function loadBatting(){

const games=await fetch(
`data/baseball/seasons/${currentSeason}.json`
).then(r=>r.json());

const stats={};

for(const g of games){

if(g.home_code!=teamCode && g.away_code!=teamCode)continue;

const gameId=
`${g.date}_${g.away_code}_${g.home_code}`;

const box=await fetch(
`data/baseball/boxscores/${gameId}.json`
).then(r=>r.json());

box.batting.forEach(p=>{

if(p.team!=teamCode)return;

if(!stats[p.player])
stats[p.player]={g:0,ab:0,h:0,hr:0,rbi:0};

stats[p.player].g++;

stats[p.player].ab+=p.AB||0;

stats[p.player].h+=p.H||0;

stats[p.player].hr+=p.HR||0;

stats[p.player].rbi+=p.RBI||0;

});

}

const body=document.getElementById("battingBody");

body.innerHTML="";

Object.entries(stats).forEach(([name,s])=>{

const avg=s.h/s.ab||0;

body.innerHTML+=`

<tr>

<td class="click"
onclick="location.href='baseball-player.html?player=${encodeURIComponent(name)}'">
${name}
</td>

<td class="right">${s.g}</td>

<td class="right">${s.ab}</td>

<td class="right">${s.h}</td>

<td class="right">${s.hr}</td>

<td class="right">${s.rbi}</td>

<td class="right">${avg.toFixed(3)}</td>

</tr>

`;

});

}

/* PITCHING */

async function loadPitching(){

const games=await fetch(
`data/baseball/seasons/${currentSeason}.json`
).then(r=>r.json());

const stats={};

for(const g of games){

if(g.home_code!=teamCode && g.away_code!=teamCode)continue;

const gameId=
`${g.date}_${g.away_code}_${g.home_code}`;

const box=await fetch(
`data/baseball/boxscores/${gameId}.json`
).then(r=>r.json());

box.pitching.forEach(p=>{

if(p.team!=teamCode)return;

if(!stats[p.player])
stats[p.player]={g:0,ip:0,er:0,k:0};

stats[p.player].g++;

stats[p.player].ip+=parseFloat(p.IP)||0;

stats[p.player].er+=p.ER||0;

stats[p.player].k+=p.K||0;

});

}

const body=document.getElementById("pitchingBody");

body.innerHTML="";

Object.entries(stats).forEach(([name,s])=>{

const era=s.er*9/s.ip||0;

body.innerHTML+=`

<tr>

<td class="click"
onclick="location.href='baseball-player.html?player=${encodeURIComponent(name)}'">
${name}
</td>

<td class="right">${s.g}</td>

<td class="right">${s.ip.toFixed(1)}</td>

<td class="right">${s.er}</td>

<td class="right">${s.k}</td>

<td class="right">${era.toFixed(2)}</td>

</tr>

`;

});

}

init();

</script>

</body>
</html>
