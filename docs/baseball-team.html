<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:18px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero select{
margin-top:12px;
padding:8px;
font-size:16px;
border-radius:8px;
border:none;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
margin-bottom:18px;
}

.card{
background:white;
padding:16px;
border-radius:14px;
text-align:center;
}

.card .label{
font-size:13px;
color:#777;
}

.card .value{
font-size:26px;
font-weight:800;
margin-top:4px;
}

.tableCard{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:18px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:9px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

tbody tr:hover{
background:#d6e6ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.sectionTitle{
font-weight:800;
margin-bottom:10px;
font-size:18px;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">

<h1 id="teamName">Loading...</h1>

<select id="seasonSelect"></select>

</div>

<div class="cards">

<div class="card">
<div class="label">Record</div>
<div id="record" class="value">-</div>
</div>

<div class="card">
<div class="label">Win %</div>
<div id="pct" class="value">-</div>
</div>

<div class="card">
<div class="label">Runs For</div>
<div id="runsFor" class="value">-</div>
</div>

<div class="card">
<div class="label">Runs Against</div>
<div id="runsAgainst" class="value">-</div>
</div>

<div class="card">
<div class="label">Run Diff</div>
<div id="runDiff" class="value">-</div>
</div>

</div>

<div class="tableCard">

<div class="sectionTitle">Recent Games</div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Result</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="recentGames"></tbody>

</table>

</div>

<div class="tableCard">

<div class="sectionTitle">Full Season Games</div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Result</th>
<th>Venue</th>
<th>Attendance</th>
</tr>
</thead>

<tbody id="allGames"></tbody>

</table>

</div>

</div>

<script>

const params=new URLSearchParams(location.search);
const teamCode=params.get("team");

let teamName="";
let currentSeason="";

async function init(){

const teamsRes=await fetch("data/baseball/teams.json");
const teams=await teamsRes.json();

const team=teams.find(t=>t.code===teamCode);

teamName=team.name;

document.getElementById("teamName").textContent=teamName;

const indexRes=await fetch("data/baseball/index.json");
const seasons=await indexRes.json();

const select=document.getElementById("seasonSelect");

seasons.sort((a,b)=>b-a);

seasons.forEach(year=>{

const opt=document.createElement("option");

opt.value=year;
opt.textContent=year;

select.appendChild(opt);

});

currentSeason=seasons[0];

select.value=currentSeason;

select.onchange=()=>{

currentSeason=select.value;

loadSeason();

};

loadSeason();

}

function format(n){

return n.toLocaleString();

}

async function loadSeason(){

const res=
await fetch(`data/baseball/seasons/${currentSeason}.json`);

const games=await res.json();

const teamGames=
games.filter(g=>
g.home_code===teamCode ||
g.away_code===teamCode
);

let wins=0;
let losses=0;
let runsFor=0;
let runsAgainst=0;

teamGames.forEach(g=>{

const isHome=g.home_code===teamCode;

const scored=isHome?g.home_score:g.away_score;
const allowed=isHome?g.away_score:g.home_score;

runsFor+=scored;
runsAgainst+=allowed;

if(scored>allowed) wins++;
else losses++;

});

const pct=(wins/(wins+losses)).toFixed(3);

document.getElementById("record").textContent=`${wins}-${losses}`;
document.getElementById("pct").textContent=pct;
document.getElementById("runsFor").textContent=format(runsFor);
document.getElementById("runsAgainst").textContent=format(runsAgainst);
document.getElementById("runDiff").textContent=format(runsFor-runsAgainst);

renderRecent(teamGames);
renderAll(teamGames);

}

function renderRecent(games){

const body=document.getElementById("recentGames");

body.innerHTML="";

games.slice(-10).reverse().forEach(g=>{

const isHome=g.home_code===teamCode;

const opponent=isHome?g.away_team:g.home_team;
const opponentCode=isHome?g.away_code:g.home_code;

const result=isHome
?`${g.home_score}-${g.away_score}`
:`${g.away_score}-${g.home_score}`;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${g.date}</td>

<td>
<span class="click"
onclick="location.href='baseball-team.html?team=${opponentCode}'">
${opponent}
</span>
</td>

<td>
<span class="click"
onclick="location.href='baseball-game.html?id=${g.id}'">
${result}
</span>
</td>

<td>${g.venue||""}</td>

`;

body.appendChild(tr);

});

}

function renderAll(games){

const body=document.getElementById("allGames");

body.innerHTML="";

games.forEach(g=>{

const isHome=g.home_code===teamCode;

const opponent=isHome?g.away_team:g.home_team;
const opponentCode=isHome?g.away_code:g.home_code;

const result=isHome
?`${g.home_score}-${g.away_score}`
:`${g.away_score}-${g.home_score}`;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${g.date}</td>

<td>
<span class="click"
onclick="location.href='baseball-team.html?team=${opponentCode}'">
${opponent}
</span>
</td>

<td>
<span class="click"
onclick="location.href='baseball-game.html?id=${g.id}'">
${result}
</span>
</td>

<td>${g.venue||""}</td>

<td>${g.attendance?.toLocaleString()||""}</td>

`;

body.appendChild(tr);

});

}

init();

</script>

</body>
</html>
