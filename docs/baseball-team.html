<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:18px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero select{
margin-top:12px;
padding:8px;
font-size:16px;
border-radius:8px;
border:none;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:14px;
}

.tab{
background:white;
padding:10px 14px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.tab.active{
background:#eaf3ff;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
margin-bottom:18px;
}

.card{
background:white;
padding:16px;
border-radius:14px;
text-align:center;
}

.card .label{
font-size:13px;
color:#777;
}

.card .value{
font-size:26px;
font-weight:800;
margin-top:4px;
}

.tableCard{
background:white;
padding:16px;
border-radius:14px;
}

th,td{
padding:9px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">
<h1 id="teamName">Loading...</h1>
<select id="seasonSelect"></select>
</div>

<div class="tabs">
<div class="tab active" onclick="showTab('overview',this)">Overview</div>
<div class="tab" onclick="showTab('batting',this)">Batting</div>
<div class="tab" onclick="showTab('pitching',this)">Pitching</div>
<div class="tab" onclick="showTab('roster',this)">Roster</div>
</div>

<!-- OVERVIEW -->

<div id="overview" class="panel active">

<div class="cards">

<div class="card">
<div class="label">Record</div>
<div id="record" class="value">-</div>
</div>

<div class="card">
<div class="label">Win %</div>
<div id="pct" class="value">-</div>
</div>

<div class="card">
<div class="label">Runs For</div>
<div id="runsFor" class="value">-</div>
</div>

<div class="card">
<div class="label">Runs Against</div>
<div id="runsAgainst" class="value">-</div>
</div>

<div class="card">
<div class="label">Run Diff</div>
<div id="runDiff" class="value">-</div>
</div>

</div>

</div>

<!-- OTHER PANELS PLACEHOLDER -->

<div id="batting" class="panel">
<div class="tableCard">Batting tab ready.</div>
</div>

<div id="pitching" class="panel">
<div class="tableCard">Pitching tab ready.</div>
</div>

<div id="roster" class="panel">
<div class="tableCard">Roster tab ready.</div>
</div>

</div>

<script>

const params = new URLSearchParams(location.search);
const teamCode = params.get("team");

let currentSeason = null;

function showTab(name,el){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
el.classList.add("active");

document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
document.getElementById(name).classList.add("active");

}

async function init(){

/* LOAD TEAM NAME */

const teams =
await fetch("data/baseball/teams.json").then(r=>r.json());

const team =
teams.find(t=>t.code===teamCode);

if(!team){

document.getElementById("teamName").textContent="Team not found";
return;

}

document.getElementById("teamName").textContent=team.name;

/* LOAD SEASONS */

const seasons =
await fetch("data/baseball/index.json").then(r=>r.json());

seasons.sort((a,b)=>b-a);

const select =
document.getElementById("seasonSelect");

seasons.forEach(year=>{

const opt=document.createElement("option");
opt.value=year;
opt.textContent=year;

select.appendChild(opt);

});

currentSeason=seasons[0];

select.value=currentSeason;

select.onchange=()=>{

currentSeason=select.value;
loadOverview();

};

await loadOverview();

}

async function loadOverview(){

const games =
await fetch(`data/baseball/seasons/${currentSeason}.json`)
.then(r=>r.json());

const teamGames =
games.filter(g =>
g.home_code===teamCode ||
g.away_code===teamCode
);

let wins=0;
let losses=0;
let runsFor=0;
let runsAgainst=0;

teamGames.forEach(g=>{

const isHome =
g.home_code===teamCode;

const scored =
isHome ? g.home_score : g.away_score;

const allowed =
isHome ? g.away_score : g.home_score;

runsFor += scored;
runsAgainst += allowed;

if(scored>allowed) wins++;
else losses++;

});

const gamesPlayed = wins+losses;

document.getElementById("record").textContent =
`${wins}-${losses}`;

document.getElementById("pct").textContent =
gamesPlayed ? (wins/gamesPlayed).toFixed(3) : "0.000";

document.getElementById("runsFor").textContent =
runsFor;

document.getElementById("runsAgainst").textContent =
runsAgainst;

document.getElementById("runDiff").textContent =
runsFor - runsAgainst;

}

init();

</script>

</body>
</html>
