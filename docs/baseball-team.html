<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:18px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero select{
margin-top:12px;
padding:8px;
font-size:16px;
border-radius:8px;
border:none;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:14px;
}

.tab{
background:white;
padding:10px 14px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.tab.active{
background:#eaf3ff;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
margin-bottom:18px;
}

.card{
background:white;
padding:16px;
border-radius:14px;
text-align:center;
}

.card .label{
font-size:13px;
color:#777;
}

.card .value{
font-size:26px;
font-weight:800;
margin-top:4px;
}

.tableCard{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:18px;
}

th,td{
padding:9px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

tbody tr:hover{
background:#d6e6ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.sectionTitle{
font-weight:800;
margin-bottom:10px;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">
<h1 id="teamName">Loading...</h1>
<select id="seasonSelect"></select>
</div>

<div class="tabs">
<div class="tab active" onclick="showTab('overview',this)">Overview</div>
<div class="tab" onclick="showTab('batting',this)">Batting</div>
<div class="tab" onclick="showTab('pitching',this)">Pitching</div>
<div class="tab" onclick="showTab('roster',this)">Roster</div>
</div>

<!-- OVERVIEW -->

<div id="overview" class="panel active">

<div class="cards">

<div class="card">
<div class="label">Record</div>
<div id="record" class="value">-</div>
</div>

<div class="card">
<div class="label">Win %</div>
<div id="pct" class="value">-</div>
</div>

<div class="card">
<div class="label">Runs For</div>
<div id="runsFor" class="value">-</div>
</div>

<div class="card">
<div class="label">Runs Against</div>
<div id="runsAgainst" class="value">-</div>
</div>

<div class="card">
<div class="label">Run Diff</div>
<div id="runDiff" class="value">-</div>
</div>

</div>

<div class="tableCard">

<div class="sectionTitle">Recent Games</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Result</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="recentGames"></tbody>

</table>

</div>

<div class="tableCard">

<div class="sectionTitle">Full Season Games</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Result</th>
<th>Venue</th>
<th>Attendance</th>
</tr>
</thead>

<tbody id="allGames"></tbody>

</table>

</div>

</div>

<div id="batting" class="panel">
<div class="tableCard">Batting tab ready.</div>
</div>

<div id="pitching" class="panel">
<div class="tableCard">Pitching tab ready.</div>
</div>

<div id="roster" class="panel">
<div class="tableCard">Roster tab ready.</div>
</div>

</div>

<script>

const params = new URLSearchParams(location.search);
const teamCode = params.get("team");

let currentSeason;

function showTab(name,el){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
el.classList.add("active");

document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
document.getElementById(name).classList.add("active");

}

async function init(){

const teams =
await fetch("data/baseball/teams.json").then(r=>r.json());

const team =
teams.find(t=>t.code===teamCode);

document.getElementById("teamName").textContent=team.name;

const seasons =
await fetch("data/baseball/index.json").then(r=>r.json());

seasons.sort((a,b)=>b-a);

const select =
document.getElementById("seasonSelect");

seasons.forEach(year=>{

const opt=document.createElement("option");
opt.value=year;
opt.textContent=year;

select.appendChild(opt);

});

currentSeason=seasons[0];

select.value=currentSeason;

select.onchange=()=>{

currentSeason=select.value;
loadSeason();

};

loadSeason();

}

async function loadSeason(){

const games =
await fetch(`data/baseball/seasons/${currentSeason}.json`)
.then(r=>r.json());

const teamGames =
games.filter(g =>
g.home_code===teamCode ||
g.away_code===teamCode
);

/* OVERVIEW */

let w=0,l=0,rf=0,ra=0;

teamGames.forEach(g=>{

const home=g.home_code===teamCode;

const scored=home?g.home_score:g.away_score;
const allowed=home?g.away_score:g.home_score;

rf+=scored;
ra+=allowed;

if(scored>allowed) w++; else l++;

});

document.getElementById("record").textContent=`${w}-${l}`;
document.getElementById("pct").textContent=(w/(w+l)).toFixed(3);
document.getElementById("runsFor").textContent=rf;
document.getElementById("runsAgainst").textContent=ra;
document.getElementById("runDiff").textContent=rf-ra;

/* RECENT GAMES */

const recentBody=document.getElementById("recentGames");
recentBody.innerHTML="";

teamGames.slice(-10).reverse().forEach(g=>{

const home=g.home_code===teamCode;

const opp=home?g.away_team:g.home_team;
const oppCode=home?g.away_code:g.home_code;

const result=home
?`${g.home_score}-${g.away_score}`
:`${g.away_score}-${g.home_score}`;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${g.date}</td>

<td>
<span class="click"
onclick="location.href='baseball-team.html?team=${oppCode}'">
${opp}
</span>
</td>

<td>
<span class="click"
onclick="location.href='baseball-game.html?id=${g.id}'">
${result}
</span>
</td>

<td>${g.venue||""}</td>

`;

recentBody.appendChild(tr);

});

/* FULL GAMES */

const allBody=document.getElementById("allGames");
allBody.innerHTML="";

teamGames.forEach(g=>{

const home=g.home_code===teamCode;

const opp=home?g.away_team:g.home_team;
const oppCode=home?g.away_code:g.home_code;

const result=home
?`${g.home_score}-${g.away_score}`
:`${g.away_score}-${g.home_score}`;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${g.date}</td>

<td>
<span class="click"
onclick="location.href='baseball-team.html?team=${oppCode}'">
${opp}
</span>
</td>

<td>
<span class="click"
onclick="location.href='baseball-game.html?id=${g.id}'">
${result}
</span>
</td>

<td>${g.venue||""}</td>

<td>${g.attendance?.toLocaleString()||""}</td>

`;

allBody.appendChild(tr);

});

}

init();

</script>

</body>
</html>
