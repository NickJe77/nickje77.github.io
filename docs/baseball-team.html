<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:18px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero select{
margin-top:12px;
padding:8px;
font-size:16px;
border-radius:8px;
border:none;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:14px;
}

.tab{
background:white;
padding:10px 14px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.tab.active{
background:#eaf3ff;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
margin-bottom:18px;
}

.card{
background:white;
padding:16px;
border-radius:14px;
text-align:center;
}

.card .label{
font-size:13px;
color:#777;
}

.card .value{
font-size:26px;
font-weight:800;
margin-top:4px;
}

.tableCard{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:18px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:9px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">

<h1 id="teamName">Loading...</h1>

<select id="seasonSelect"></select>

</div>

<div class="tabs">

<div class="tab active" onclick="showTab('overview',this)">Overview</div>
<div class="tab" onclick="showTab('batting',this)">Batting</div>
<div class="tab" onclick="showTab('pitching',this)">Pitching</div>
<div class="tab" onclick="showTab('roster',this)">Roster</div>

</div>

<!-- OVERVIEW -->

<div id="overview" class="panel active">

<div class="cards">

<div class="card">
<div class="label">Record</div>
<div id="record" class="value">-</div>
</div>

<div class="card">
<div class="label">Win %</div>
<div id="pct" class="value">-</div>
</div>

<div class="card">
<div class="label">Runs For</div>
<div id="runsFor" class="value">-</div>
</div>

<div class="card">
<div class="label">Runs Against</div>
<div id="runsAgainst" class="value">-</div>
</div>

<div class="card">
<div class="label">Run Diff</div>
<div id="runDiff" class="value">-</div>
</div>

</div>

</div>

<!-- BATTING -->

<div id="batting" class="panel">

<div class="tableCard">

<table>

<thead>
<tr>
<th>Player</th>
<th>Games</th>
<th>Hits</th>
<th>Runs</th>
<th>RBI</th>
</tr>
</thead>

<tbody id="battingBody"></tbody>

</table>

</div>

</div>

<!-- PITCHING -->

<div id="pitching" class="panel">

<div class="tableCard">

<table>

<thead>
<tr>
<th>Player</th>
<th>Games</th>
<th>IP</th>
<th>ER</th>
<th>K</th>
</tr>
</thead>

<tbody id="pitchingBody"></tbody>

</table>

</div>

</div>

<!-- ROSTER -->

<div id="roster" class="panel">

<div class="tableCard">

<table>

<thead>
<tr>
<th>Player</th>
<th>Position</th>
</tr>
</thead>

<tbody id="rosterBody"></tbody>

</table>

</div>

</div>

</div>

<script>

const params=new URLSearchParams(location.search);
const teamCode=params.get("team");

let currentSeason;

function showTab(name,el){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
el.classList.add("active");

document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
document.getElementById(name).classList.add("active");

}

async function init(){

const teams=await fetch("data/baseball/teams.json").then(r=>r.json());
const team=teams.find(t=>t.code===teamCode);

document.getElementById("teamName").textContent=team.name;

const seasons=await fetch("data/baseball/index.json").then(r=>r.json());

const select=document.getElementById("seasonSelect");

seasons.sort((a,b)=>b-a);

seasons.forEach(s=>{

const opt=document.createElement("option");
opt.value=s;
opt.textContent=s;
select.appendChild(opt);

});

currentSeason=seasons[0];

select.value=currentSeason;

select.onchange=()=>{
currentSeason=select.value;
loadOverview();
loadBatting();
loadPitching();
loadRoster();
};

loadOverview();
loadBatting();
loadPitching();
loadRoster();

}

async function loadOverview(){

const games=await fetch(`data/baseball/seasons/${currentSeason}.json`).then(r=>r.json());

const teamGames=games.filter(g=>g.home_code===teamCode||g.away_code===teamCode);

let w=0,l=0,rf=0,ra=0;

teamGames.forEach(g=>{

const home=g.home_code===teamCode;
const scored=home?g.home_score:g.away_score;
const allowed=home?g.away_score:g.home_score;

rf+=scored;
ra+=allowed;

if(scored>allowed)w++;else l++;

});

document.getElementById("record").textContent=`${w}-${l}`;
document.getElementById("pct").textContent=(w/(w+l)).toFixed(3);
document.getElementById("runsFor").textContent=rf;
document.getElementById("runsAgainst").textContent=ra;
document.getElementById("runDiff").textContent=rf-ra;

}

async function loadBatting(){

const boxscores=await fetch(`data/baseball/boxscores/index.json`).then(r=>r.json()).catch(()=>[]);

const stats={};

boxscores.forEach(game=>{

game.batting?.forEach(p=>{

if(p.team!==teamCode)return;

if(!stats[p.player])
stats[p.player]={games:0,hits:0,runs:0,rbi:0};

stats[p.player].games++;
stats[p.player].hits+=p.H||0;
stats[p.player].runs+=p.R||0;
stats[p.player].rbi+=p.RBI||0;

});

});

const body=document.getElementById("battingBody");
body.innerHTML="";

Object.entries(stats).forEach(([name,s])=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td class="click">${name}</td>
<td>${s.games}</td>
<td>${s.hits}</td>
<td>${s.runs}</td>
<td>${s.rbi}</td>
`;

body.appendChild(tr);

});

}

async function loadPitching(){

const body=document.getElementById("pitchingBody");
body.innerHTML="<tr><td colspan=5>Pitching stats loading (connect boxscore pitching arrays)</td></tr>";

}

async function loadRoster(){

const players=await fetch("data/baseball/players.json").then(r=>r.json());

const teamPlayers=players.filter(p=>p.team===teamCode);

const body=document.getElementById("rosterBody");
body.innerHTML="";

teamPlayers.forEach(p=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td class="click">${p.name}</td>
<td>${p.position||""}</td>
`;

body.appendChild(tr);

});

}

init();

</script>

</body>
</html>
