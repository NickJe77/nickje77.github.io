<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Olympic Event | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
    font-family:var(--body);
    margin:0;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
}
.navbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    font-weight:600;
    font-size:13.5px;
}
.navbar a{
    color:var(--ink);
    text-decoration:none;
    opacity:.7;
    transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
    opacity:1;
    color:var(--accent);
}
.hero{
    background:linear-gradient(160deg,var(--board-2),var(--board));
    color:#fff;
    text-align:center;
    padding:36px 20px;
}
.hero h1{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,32px);letter-spacing:.01em;text-transform:uppercase;}
.hero p{margin:0;color:rgba(255,255,255,.68);font-size:13.5px;}
.container{
    max-width:800px;
    margin:0 auto;
    padding:26px 20px 70px;
}
.podium{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:34px;
}
.medal-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    text-align:center;
}
.medal-card h3{
    margin:0 0 12px;
    font-family:var(--display);
    font-weight:600;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
}
.medal-card.gold  { border-top:3px solid #d4af37; }
.medal-card.silver{ border-top:3px solid #9ea7ad; }
.medal-card.bronze{ border-top:3px solid #b06a35; }
.medal-card .country-heading{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    margin:10px 0 4px;
    text-transform:uppercase;
    letter-spacing:.03em;
}
.medal-card a{
    display:block;
    color:var(--ink);
    text-decoration:none;
    padding:3px 0;
    font-size:14px;
    font-weight:600;
}
.medal-card a:hover{ color:var(--accent); }
.history h2{
    font-family:var(--display);
    font-weight:600;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:.01em;
    margin-bottom:14px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
    color:var(--ink);
}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{
    width:100%;
    border-collapse:collapse;
}
th{
    background:#f7f9fb;
    color:var(--muted);
    padding:11px 14px;
    text-align:left;
    font-family:var(--body);
    font-weight:600;
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    border-bottom:1px solid var(--line);
}
td{
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
    font-size:13.5px;
    color:#27313c;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{ background:#f9fbfd; cursor:pointer; }
.gold-text  { color:#a3821f; font-weight:700; }
.silver-text{ color:var(--muted); font-weight:700; }
.bronze-text{ color:#8a5225; font-weight:700; }
.country-tag{
    font-size:10.5px;
    color:var(--faint);
    font-weight:500;
    display:block;
    margin-top:2px;
}
.back{
    display:inline-block;
    margin-bottom:20px;
    color:var(--ink);
    text-decoration:none;
    font-weight:600;
    font-size:13.5px;
}
.back:hover{ color:var(--accent); }
.no-results{
    text-align:center;
    color:var(--muted);
    padding:40px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
}
</style>
</head>

<body>

<nav class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</nav>

<div class="hero">
    <h1 id="hero-event">Loading...</h1>
    <p id="hero-year"></p>
</div>

<div class="container">

    <a class="back" href="javascript:history.back()">← Back</a>

    <div class="podium" id="podium"></div>

    <div class="history">
        <h2>All Editions</h2>
        <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Year</th>
                    <th>Gold</th>
                    <th>Silver</th>
                    <th>Bronze</th>
                </tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>
        </div>
    </div>

</div>

<script>
const params    = new URLSearchParams(window.location.search);
const eventName = decodeURIComponent(params.get("event") || "");
const eventYear = parseInt(params.get("year") || "0");

document.getElementById("hero-event").innerText = eventName || "Olympic Event";
document.getElementById("hero-year").innerText  = eventYear || "";

fetch("/data/olympics/summer_olympic_medals.json")
.then(r => r.json())
.then(data => build(data));

function build(data){

    const eventRows = data.filter(r =>
        (r.event || "").trim() === eventName
    );

    if(!eventRows.length){
        document.getElementById("podium").innerHTML =
            `<div class="no-results" style="grid-column:1/-1">No data found for this event.</div>`;
        return;
    }

    // Group by year → { gold:[{name,country}], silver:[], bronze:[] }
    const byYear = {};
    eventRows.forEach(r => {
        const y = r.year;
        const m = (r.medal || "").toUpperCase();
        if(!["GOLD","SILVER","BRONZE"].includes(m)) return;
        if(!byYear[y]) byYear[y] = { gold:[], silver:[], bronze:[] };
        byYear[y][m.toLowerCase()].push({
            name:    (r.athlete || "").trim(),
            country: (r.country || "").trim()
        });
    });

    const selected = byYear[eventYear];
    if(selected){
        renderPodium(selected);
    } else {
        document.getElementById("podium").innerHTML =
            `<div class="no-results" style="grid-column:1/-1">No data for ${eventYear}.</div>`;
    }

    const years = Object.keys(byYear).map(Number).sort((a,b) => b - a);
    renderHistory(years, byYear);
}

function groupByCountry(athletes){
    const map = {};
    athletes.forEach(a => {
        if(!map[a.country]) map[a.country] = [];
        map[a.country].push(a.name);
    });
    return map;
}

function renderPodium(yr){
    const medals = ["gold","silver","bronze"];
    document.getElementById("podium").innerHTML = medals.map(m => {
        const grouped = groupByCountry(yr[m]);
        const entries = Object.entries(grouped);
        const html = entries.length
            ? entries.map(([country, names]) => `
                <div class="country-heading">${country}</div>
                ${names.map(n =>
                    `<a href="olympics-athlete.html?name=${encodeURIComponent(n)}">${n}</a>`
                ).join("")}
              `).join("")
            : "<span style='color:#aaa'>—</span>";
        return `<div class="medal-card ${m}"><h3>${m}</h3>${html}</div>`;
    }).join("");
}

function renderHistory(years, byYear){
    const tb = document.getElementById("history-body");
    tb.innerHTML = "";

    years.forEach(y => {
        const yr = byYear[y];
        const tr = document.createElement("tr");
        if(y === eventYear) tr.style.background = "rgba(201,154,61,.16)";

        function formatCell(athletes){
            if(!athletes.length) return "—";
            const map = groupByCountry(athletes);
            return Object.entries(map).map(([country, names]) =>
                `${names.join(", ")}<span class="country-tag">${country}</span>`
            ).join("");
        }

        tr.innerHTML = `
            <td><b>${y}</b></td>
            <td class="gold-text"  >${formatCell(yr.gold)}</td>
            <td class="silver-text">${formatCell(yr.silver)}</td>
            <td class="bronze-text">${formatCell(yr.bronze)}</td>
        `;

        tr.style.cursor = "pointer";
        tr.onclick = () => {
            window.location.href =
                `olympics-event.html?event=${encodeURIComponent(eventName)}&year=${y}`;
        };

        tb.appendChild(tr);
    });
}
</script>

</body>
</html>
