<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Olympic Event | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:system-ui,Arial,sans-serif;
    margin:0;
    background:#f5f5f5;
}
.navbar{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:#111;
}
.navbar a{
    color:white;
    text-decoration:none;
    font-weight:600;
}
.hero{
    background:linear-gradient(90deg,#0085C7,#F4C300,#000,#009F3D,#DF0024);
    color:white;
    text-align:center;
    padding:30px;
}
.hero h1{margin:0 0 6px;}
.hero p{margin:0;opacity:0.9;}
.container{
    max-width:800px;
    margin:30px auto;
    padding:0 10px;
}
.podium{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:40px;
}
.medal-card{
    background:white;
    border-radius:10px;
    padding:16px;
    text-align:center;
}
.medal-card h3{
    margin:0 0 12px;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:1px;
}
.medal-card.gold  { border-top:5px solid gold; }
.medal-card.silver{ border-top:5px solid silver; }
.medal-card.bronze{ border-top:5px solid #cd7f32; }
.medal-card .country-heading{
    font-size:13px;
    font-weight:700;
    color:#444;
    margin:10px 0 4px;
}
.medal-card a{
    display:block;
    color:#1a56db;
    text-decoration:none;
    padding:3px 0;
    font-size:15px;
}
.medal-card a:hover{ text-decoration:underline; }
.history h2{
    font-size:18px;
    margin-bottom:12px;
    border-bottom:2px solid #ddd;
    padding-bottom:6px;
}
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}
th{
    background:#111;
    color:white;
    padding:10px;
    text-align:left;
}
td{
    padding:10px;
    border-bottom:1px solid #eee;
    vertical-align:top;
}
tbody tr:nth-child(even){ background:#f9f9f9; }
tbody tr:hover{ background:#f0f4ff; cursor:pointer; }
.gold-text  { color:#c9a400; font-weight:700; }
.silver-text{ color:#888;    font-weight:700; }
.bronze-text{ color:#b87333; font-weight:700; }
.country-tag{
    font-size:11px;
    color:#999;
    font-weight:400;
    display:block;
    margin-top:2px;
}
.back{
    display:inline-block;
    margin-bottom:20px;
    color:#1a56db;
    text-decoration:none;
    font-weight:600;
}
.back:hover{ text-decoration:underline; }
.no-results{
    text-align:center;
    color:#888;
    padding:40px;
    background:white;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/olympics.html">Olympics</a>
    <a href="/olympics-medals.html">Medal Table</a>
    <a href="/olympics-events.html">Events</a>
    <a href="/olympics-athletes.html">Athletes</a>
</div>

<div class="hero">
    <h1 id="hero-event">Loading...</h1>
    <p id="hero-year"></p>
</div>

<div class="container">

    <a class="back" href="javascript:history.back()">← Back</a>

    <div class="podium" id="podium"></div>

    <div class="history">
        <h2>All Editions</h2>
        <table>
            <thead>
                <tr>
                    <th>Year</th>
                    <th>Gold</th>
                    <th>Silver</th>
                    <th>Bronze</th>
                </tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>
    </div>

</div>

<script>
const params    = new URLSearchParams(window.location.search);
const eventName = decodeURIComponent(params.get("event") || "");
const eventYear = parseInt(params.get("year") || "0");

document.getElementById("hero-event").innerText = eventName || "Olympic Event";
document.getElementById("hero-year").innerText  = eventYear || "";

fetch("/data/olympics/summer_olympic_medals.json")
.then(r => r.json())
.then(data => build(data));

function build(data){

    const eventRows = data.filter(r =>
        (r.event || "").trim() === eventName
    );

    if(!eventRows.length){
        document.getElementById("podium").innerHTML =
            `<div class="no-results" style="grid-column:1/-1">No data found for this event.</div>`;
        return;
    }

    // Group by year → { gold:[{name,country}], silver:[], bronze:[] }
    const byYear = {};
    eventRows.forEach(r => {
        const y = r.year;
        const m = (r.medal || "").toUpperCase();
        if(!["GOLD","SILVER","BRONZE"].includes(m)) return;
        if(!byYear[y]) byYear[y] = { gold:[], silver:[], bronze:[] };
        byYear[y][m.toLowerCase()].push({
            name:    (r.athlete || "").trim(),
            country: (r.country || "").trim()
        });
    });

    const selected = byYear[eventYear];
    if(selected){
        renderPodium(selected);
    } else {
        document.getElementById("podium").innerHTML =
            `<div class="no-results" style="grid-column:1/-1">No data for ${eventYear}.</div>`;
    }

    const years = Object.keys(byYear).map(Number).sort((a,b) => b - a);
    renderHistory(years, byYear);
}

function groupByCountry(athletes){
    const map = {};
    athletes.forEach(a => {
        if(!map[a.country]) map[a.country] = [];
        map[a.country].push(a.name);
    });
    return map;
}

function renderPodium(yr){
    const medals = ["gold","silver","bronze"];
    document.getElementById("podium").innerHTML = medals.map(m => {
        const grouped = groupByCountry(yr[m]);
        const entries = Object.entries(grouped);
        const html = entries.length
            ? entries.map(([country, names]) => `
                <div class="country-heading">${country}</div>
                ${names.map(n =>
                    `<a href="olympics-athlete.html?name=${encodeURIComponent(n)}">${n}</a>`
                ).join("")}
              `).join("")
            : "<span style='color:#aaa'>—</span>";
        return `<div class="medal-card ${m}"><h3>${m}</h3>${html}</div>`;
    }).join("");
}

function renderHistory(years, byYear){
    const tb = document.getElementById("history-body");
    tb.innerHTML = "";

    years.forEach(y => {
        const yr = byYear[y];
        const tr = document.createElement("tr");
        if(y === eventYear) tr.style.background = "#e8f0ff";

        function formatCell(athletes){
            if(!athletes.length) return "—";
            const map = groupByCountry(athletes);
            return Object.entries(map).map(([country, names]) =>
                `${names.join(", ")}<span class="country-tag">${country}</span>`
            ).join("");
        }

        tr.innerHTML = `
            <td><b>${y}</b></td>
            <td class="gold-text"  >${formatCell(yr.gold)}</td>
            <td class="silver-text">${formatCell(yr.silver)}</td>
            <td class="bronze-text">${formatCell(yr.bronze)}</td>
        `;

        tr.style.cursor = "pointer";
        tr.onclick = () => {
            window.location.href =
                `olympics-event.html?event=${encodeURIComponent(eventName)}&year=${y}`;
        };

        tb.appendChild(tr);
    });
}
</script>

</body>
</html>
