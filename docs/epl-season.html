<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --league:#c99a3d;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:44px 20px;text-align:center;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4.5vw,42px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero p{margin-top:10px;font-size:14px;color:rgba(255,255,255,.65);}

.container{max-width:1500px;margin:0 auto;padding:26px 20px 70px;}

/* ── Controls ─────────────────────────────────────────── */
.controls{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.controls select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;
  background:var(--surface);color:var(--ink);cursor:pointer;
}
.controls select:hover{border-color:var(--faint);}

/* ── Card & table ─────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;overflow:hidden;}
.section-title{
  margin-top:0;margin-bottom:20px;font-family:var(--display);font-weight:600;font-size:22px;
  letter-spacing:.01em;text-transform:uppercase;color:var(--ink);
}
table{width:100%;border-collapse:collapse;}
th{background:var(--league);color:#fff;padding:12px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-align:center;}
td{padding:12px;border-bottom:1px solid var(--line);text-align:center;font-size:13.5px;color:#27313c;}
tr:last-child td{border-bottom:none;}
.match-row{cursor:pointer;transition:.15s ease;}
.match-row:hover td{background:#f0f6ff;}
.team-link{color:var(--ink);text-decoration:none;font-weight:700;}
.team-link:hover{color:var(--accent);text-decoration:underline;}
.score{font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink);}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
@media(max-width:900px){
  th,td{padding:8px;font-size:11.5px;}
  .score{font-size:14px;}
}
</style>
</head>
<body>

<nav class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
  <a href="epl-teams.html">Teams</a>
  <a href="epl-players.html">Players</a>
</nav>

<div class="hero">
  <div class="eyebrow">Premier League</div>
  <h1 id="seasonTitle">Loading...</h1>
  <p>Premier League fixtures, scores and results</p>
</div>

<div class="container">

  <div class="controls">
    <select id="seasonSelect"></select>
    <select id="teamFilter"><option value="">All Teams</option></select>
  </div>

  <div class="card">
    <h2 class="section-title">Matches</h2>
    <div id="matchesContainer" class="loading">Loading matches...</div>
  </div>

</div>

<script>
const START_YEAR = 1992;
const END_YEAR   = 2026;

function buildSeasonList() {
  const seasons = [];
  for (let y = END_YEAR; y >= START_YEAR; y--) {
    seasons.push(`${y}-${y + 1}`);
  }
  return seasons;
}

const params  = new URLSearchParams(window.location.search);
const seasons = buildSeasonList();

let currentSeason = params.get("season") || seasons[0];
if (!seasons.includes(currentSeason)) currentSeason = seasons[0];

const seasonSelect     = document.getElementById("seasonSelect");
const teamFilter       = document.getElementById("teamFilter");
const matchesContainer = document.getElementById("matchesContainer");

seasons.forEach(s => {
  const opt = document.createElement("option");
  opt.value = s;
  opt.textContent = s;
  if (s === currentSeason) opt.selected = true;
  seasonSelect.appendChild(opt);
});

let allMatches = [];

async function loadSeason() {
  document.getElementById("seasonTitle").textContent = `${currentSeason} EPL Season`;
  matchesContainer.innerHTML = '<div class="loading">Loading matches...</div>';
  teamFilter.innerHTML = '<option value="">All Teams</option>';

  // Raw season files use short team names ("Tottenham"), but
  // team-stats.json (which team pages read) uses full official names
  // ("Tottenham Hotspur") -- confirmed real mismatch, affecting every
  // EPL season, not just the current one. Without this, clicking a
  // team link for any of these five silently leads to "Team Not Found".
  const TEAM_NAME_CANONICAL = {
    "tottenham": "Tottenham Hotspur",
    "newcastle": "Newcastle United",
    "manchester utd": "Manchester United",
    "brighton": "Brighton & Hove Albion",
    "nottingham": "Nottingham Forest",
  };
  function canonicalTeam(name){
    if(!name) return name;
    return TEAM_NAME_CANONICAL[name.trim().toLowerCase()] || name;
  }

  try {
    const response = await fetch(`/data/epl/seasons/${currentSeason}.json`);
    if (!response.ok) throw new Error("Season JSON not found");
    const data = await response.json();
    allMatches = (data.games || data).map(m => ({
      ...m,
      home: canonicalTeam(m.home),
      away: canonicalTeam(m.away),
    }));
    buildFilters();
    renderMatches();
  } catch (err) {
    console.error(err);
    matchesContainer.innerHTML = '<div class="loading">Failed to load season data</div>';
  }
}

function buildFilters() {
  const teams = new Set();
  allMatches.forEach(m => {
    if (m.home) teams.add(m.home);
    if (m.away) teams.add(m.away);
  });
  [...teams].sort().forEach(team => {
    const opt = document.createElement("option");
    opt.value = team;
    opt.textContent = team;
    teamFilter.appendChild(opt);
  });
}

function renderMatches() {
  let filtered = [...allMatches];
  const team = teamFilter.value;
  if (team) {
    filtered = filtered.filter(m => m.home === team || m.away === team);
  }

  if (filtered.length === 0) {
    matchesContainer.innerHTML = '<div class="loading">No matches found</div>';
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Home</th>
          <th>Score</th>
          <th>Away</th>
          <th>Venue</th>
        </tr>
      </thead>
      <tbody>
  `;

  filtered.forEach(match => {
    const url = `/epl-game.html?match=${encodeURIComponent(match.match_id)}&season=${encodeURIComponent(currentSeason)}&date=${encodeURIComponent(match.date || '')}&venue=${encodeURIComponent(match.venue || '')}`;
    html += `
      <tr class="match-row" onclick="window.location.href='${url}'">
        <td>${match.date || ''}</td>
        <td>
          <a class="team-link"
             href="/epl-team.html?team=${encodeURIComponent(match.home)}"
             onclick="event.stopPropagation()">
            ${match.home || ''}
          </a>
        </td>
        <td class="score">
          ${match.score_home ?? '-'} - ${match.score_away ?? '-'}
        </td>
        <td>
          <a class="team-link"
             href="/epl-team.html?team=${encodeURIComponent(match.away)}"
             onclick="event.stopPropagation()">
            ${match.away || ''}
          </a>
        </td>
        <td>${match.venue || ''}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  matchesContainer.innerHTML = html;
}

seasonSelect.addEventListener("change", () => {
  currentSeason = seasonSelect.value;
  const url = new URL(window.location);
  url.searchParams.set("season", currentSeason);
  window.history.pushState({}, "", url);
  loadSeason();
});

teamFilter.addEventListener("change", renderMatches);

loadSeason();
</script>

</body>
</html>
