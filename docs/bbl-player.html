<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f8fc;
}

/* NAV */
.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* PAGE */
.page{
max-width:1200px;
margin:auto;
padding:24px;
}

/* HERO — BBL COLOURS */
.hero{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:40px;
border-radius:22px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero p{
margin-top:6px;
opacity:.9;
}

/* CONTROLS */
.controls{
margin:20px 0;
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

select,button{
padding:8px 14px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
}

/* TAB BUTTONS */
.tab-btn{
background:#fff;
cursor:pointer;
}

.tab-btn.active{
background:#003566;
color:#fff;
border-color:#003566;
}

/* TITLES */
.section-title{
margin:30px 0 10px;
text-align:center;
font-weight:700;
color:#003566;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:14px;
}

.stat{
background:#fff;
padding:18px;
border-radius:14px;
text-align:center;
}

.stat h3{
margin:0;
font-size:28px;
color:#003566;
}

/* TABLE */
.table-wrap{
margin-top:24px;
background:#fff;
border-radius:14px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:12px;
text-align:left;
}

th.num{
text-align:right;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

td.num{
text-align:right;
font-variant-numeric:tabular-nums;
}

tr:nth-child(even){
background:#f4f8fc;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="bbl.html">BBL</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading…</h1>
<p>BBL career statistics</p>
</div>

<div class="controls">
Opposition:
<select id="oppSelect"></select>

<button class="tab-btn" id="batBtn">Batting</button>
<button class="tab-btn" id="bowlBtn">Bowling</button>
</div>

<div class="section-title">CAREER SUMMARY</div>
<div class="stats" id="careerStats"></div>

<div class="section-title" id="vsTitle">VS OPPOSITION</div>
<div class="stats" id="vsStats"></div>

<div class="table-wrap">
<table>
<thead id="tableHead"></thead>
<tbody id="gamesTable"></tbody>
</table>
</div>

</div>

<script>
(async function(){

const params=new URLSearchParams(location.search);
const player=params.get("player");

if(!player) return;

let names={}, index={};

[names,index]=await Promise.all([
fetch("data/bbl/player-names.json").then(r=>r.json()),
fetch("data/bbl/player-index.json").then(r=>r.json())
]);

function full(n){
return names[n]||n;
}

document.getElementById("playerName").textContent=full(player);

const data=index[player]||{batting:[],bowling:[]};

let battingGames=data.batting;
let bowlingGames=data.bowling;

let currentTab=bowlingGames.length>battingGames.length?"bowl":"bat";

/* OPPONENT LIST */

const oppSel=document.getElementById("oppSelect");

["All",...new Set([...battingGames,...bowlingGames].map(g=>g.opp))]
.forEach(o=>{
const opt=document.createElement("option");
opt.value=o;
opt.textContent=o;
oppSel.appendChild(opt);
});

/* STATS FUNCTIONS */

function sum(list,key){
return list.reduce((a,b)=>a+(b[key]||0),0);
}

function batStats(list){

const runs=sum(list,"r");
const balls=sum(list,"b");
const outs=list.filter(x=>x.out!="not out").length;

return{
m:list.length,
r:runs,
avg:outs?(runs/outs).toFixed(2):"—",
sr:balls?((runs/balls)*100).toFixed(1):"—",
hs:list.length?Math.max(...list.map(x=>x.r)):"—"
};
}

function bowlStats(list){

const balls=sum(list,"balls");
const runs=sum(list,"r");
const wkts=sum(list,"w");

return{
m:list.length,
o:(balls/6).toFixed(1),
w:wkts,
avg:wkts?(runs/wkts).toFixed(2):"—",
econ:balls?((runs/(balls/6))).toFixed(2):"—"
};
}

/* RENDER */

function render(){

const opp=oppSel.value;

const all=currentTab=="bat"?battingGames:bowlingGames;

const list=opp=="All"?all:all.filter(x=>x.opp==opp);

vsTitle.textContent=opp=="All"?"VS OPPOSITION":"VS "+opp;

if(currentTab=="bat"){

const c=batStats(battingGames);

careerStats.innerHTML=`
<div class=stat><h3>${c.m}</h3><span>Matches</span></div>
<div class=stat><h3>${c.r}</h3><span>Runs</span></div>
<div class=stat><h3>${c.avg}</h3><span>Average</span></div>
<div class=stat><h3>${c.sr}</h3><span>Strike Rate</span></div>
<div class=stat><h3>${c.hs}</h3><span>High Score</span></div>
`;

tableHead.innerHTML=`
<tr>
<th>Season</th>
<th>Opponent</th>
<th>Venue</th>
<th class=num>R</th>
<th class=num>B</th>
<th class=num>SR</th>
</tr>`;

gamesTable.innerHTML=list.map(g=>`
<tr>
<td>${g.season}</td>
<td>${g.opp}</td>
<td>${g.venue}</td>
<td class=num>${g.r}</td>
<td class=num>${g.b}</td>
<td class=num>${g.sr}</td>
</tr>`).join("");

}else{

const c=bowlStats(bowlingGames);

careerStats.innerHTML=`
<div class=stat><h3>${c.m}</h3><span>Matches</span></div>
<div class=stat><h3>${c.o}</h3><span>Overs</span></div>
<div class=stat><h3>${c.w}</h3><span>Wickets</span></div>
<div class=stat><h3>${c.avg}</h3><span>Average</span></div>
<div class=stat><h3>${c.econ}</h3><span>Economy</span></div>
`;

tableHead.innerHTML=`
<tr>
<th>Season</th>
<th>Opponent</th>
<th>Venue</th>
<th class=num>O</th>
<th class=num>R</th>
<th class=num>W</th>
<th class=num>Econ</th>
</tr>`;

gamesTable.innerHTML=list.map(g=>`
<tr>
<td>${g.season}</td>
<td>${g.opp}</td>
<td>${g.venue}</td>
<td class=num>${g.o}</td>
<td class=num>${g.r}</td>
<td class=num>${g.w}</td>
<td class=num>${g.econ}</td>
</tr>`).join("");

}

}

batBtn.onclick=()=>{
currentTab="bat";
batBtn.classList.add("active");
bowlBtn.classList.remove("active");
render();
};

bowlBtn.onclick=()=>{
currentTab="bowl";
bowlBtn.classList.add("active");
batBtn.classList.remove("active");
render();
};

oppSel.onchange=render;

render();

})();
</script>

</body>
</html>
