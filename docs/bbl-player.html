<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd;font-weight:600}
.navbar a{text-decoration:none;color:#0056d6;font-size:18px}
.page{max-width:1200px;margin:auto;padding:30px}

.hero{
  background:linear-gradient(90deg,#4b0082,#7a2bbf);
  color:#fff;
  padding:36px 44px;
  border-radius:22px;
}
.hero h1{margin:0;font-size:42px}
.hero p{margin-top:6px;opacity:.9}

.controls{margin:20px 0;display:flex;gap:16px;align-items:center}

.tabs button{
  padding:10px 18px;
  border-radius:10px;
  border:1px solid #ccc;
  background:#f4f6fb;
  cursor:pointer;
  font-weight:600;
}
.tabs button.active{background:#4b0082;color:#fff;border-color:#4b0082}

.section-title{margin-top:28px;font-weight:700;color:#444}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
  margin-top:14px;
}
.stat{
  background:#f7f9fc;
  border-radius:14px;
  padding:16px;
  text-align:center;
}
.stat h3{margin:0;font-size:26px}
.stat span{font-size:13px;color:#555}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th,td{padding:10px;border-bottom:1px solid #ddd}
th{background:#f2f5fb}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl.html">BBL Seasons</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName"></h1>
  <p>BBL performance breakdown by opposition</p>
</div>

<div class="controls">
  Opposition:
  <select id="opp"></select>

  <div class="tabs">
    <button id="batTab" class="active">Batting</button>
    <button id="bowlTab">Bowling</button>
  </div>
</div>

<div id="content"></div>

</div>

<script>
const params=new URLSearchParams(location.search);
const player=params.get("player");
if(!player) throw "Missing player";

const norm=n=>n.toLowerCase();
document.getElementById("playerName").textContent=player;

let matches=[],currentTab="bat";

const oppSel=document.getElementById("opp");
["All"].forEach(v=>oppSel.add(new Option(v,v)));

document.getElementById("batTab").onclick=()=>switchTab("bat");
document.getElementById("bowlTab").onclick=()=>switchTab("bowl");

function switchTab(t){
  currentTab=t;
  document.getElementById("batTab").classList.toggle("active",t==="bat");
  document.getElementById("bowlTab").classList.toggle("active",t==="bowl");
  render();
}

function render(){
  const opp=oppSel.value;
  const filtered=opp==="All"?matches:matches.filter(m=>m.info.teams.includes(opp));
  currentTab==="bat"?renderBat(filtered):renderBowl(filtered);
}

function renderBat(list){
  let runs=0,balls=0,outs=0,games=0,hs=0;
  list.forEach(m=>{
    let innsRuns=0,played=false;
    m.innings.forEach(i=>{
      i.overs.forEach(o=>{
        o.deliveries.forEach(d=>{
          if(norm(d.batter)===norm(player)){
            played=true;
            innsRuns+=d.runs.batter;
            if(!d.extras?.wides) balls++;
            runs+=d.runs.batter;
          }
          d.wickets?.forEach(w=>{
            if(norm(w.player_out)===norm(player)) outs++;
          });
        });
      });
    });
    if(played){games++;hs=Math.max(hs,innsRuns);}
  });

  const avg=outs?(runs/outs).toFixed(2):"–";
  const sr=balls?((runs/balls)*100).toFixed(1):"–";

  document.getElementById("content").innerHTML=`
    <div class="section-title">CAREER SUMMARY</div>
    <div class="stats">
      <div class="stat"><h3>${games}</h3><span>Matches</span></div>
      <div class="stat"><h3>${runs}</h3><span>Runs</span></div>
      <div class="stat"><h3>${avg}</h3><span>Average</span></div>
      <div class="stat"><h3>${sr}</h3><span>Strike Rate</span></div>
      <div class="stat"><h3>${hs}</h3><span>High Score</span></div>
    </div>
  `;
}

function renderBowl(list){
  let balls=0,runs=0,wkts=0;
  list.forEach(m=>{
    m.innings.forEach(i=>{
      i.overs.forEach(o=>{
        o.deliveries.forEach(d=>{
          if(norm(d.bowler)===norm(player)){
            balls++;
            if(!d.extras?.byes && !d.extras?.legbyes) runs+=d.runs.total;
          }
          d.wickets?.forEach(w=>{
            if(norm(w.bowler)===norm(player)) wkts++;
          });
        });
      });
    });
  });

  const overs=(balls/6).toFixed(1);
  const avg=wkts?(runs/wkts).toFixed(2):"–";
  const econ=balls?((runs/(balls/6))).toFixed(2):"–";

  document.getElementById("content").innerHTML=`
    <div class="section-title">CAREER SUMMARY</div>
    <div class="stats">
      <div class="stat"><h3>${overs}</h3><span>Overs</span></div>
      <div class="stat"><h3>${wkts}</h3><span>Wickets</span></div>
      <div class="stat"><h3>${avg}</h3><span>Average</span></div>
      <div class="stat"><h3>${econ}</h3><span>Economy</span></div>
    </div>
  `;
}

fetch("data/bbl/index.json")
.then(r=>r.json())
.then(files=>Promise.all(files.map(f=>fetch("data/bbl/"+f).then(r=>r.json()))))
.then(seasons=>{
  seasons.forEach(s=>s.forEach(m=>{
    matches.push(m);
    m.info.teams.forEach(t=>oppSel.add(new Option(t,t)));
  }));
  render();
});
</script>

</body>
</html>
