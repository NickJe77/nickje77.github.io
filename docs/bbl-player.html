<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1300px;
  margin:0 auto;
  padding:30px 20px;
}

/* HERO */
.hero{
  background:linear-gradient(90deg,#4b0082,#7a2bbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
}
.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:8px;font-size:18px;opacity:0.95;}

/* CONTROLS */
.controls{
  margin:24px 0;
  display:flex;
  gap:18px;
  align-items:center;
}

select{
  font-size:16px;
  padding:8px 12px;
  border-radius:8px;
}

/* TABS */
.tabs button{
  padding:10px 18px;
  border-radius:10px;
  border:1px solid #ccc;
  background:#f4f6fb;
  cursor:pointer;
  font-weight:600;
}
.tabs button.active{
  background:#4b0082;
  color:#fff;
  border-color:#4b0082;
}

/* SECTIONS */
.section-title{
  margin-top:30px;
  font-weight:700;
  color:#444;
}

/* STAT CARDS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;
  margin-top:16px;
}

.stat{
  background:#f7f9fc;
  border-radius:14px;
  padding:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stats.vs .stat{
  background:#eef2ff;
}

.stat h3{
  margin:0;
  font-size:26px;
  line-height:1.1;
}

.stat span{
  margin-top:4px;
  font-size:13px;
  color:#555;
  text-align:center;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:26px;
  font-size:14px;
}
th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}
th{
  background:#f2f5fb;
}
tbody tr:nth-child(even){
  background:#fafcff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl.html">BBL Seasons</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName"></h1>
  <p>BBL performance breakdown by opposition</p>
</div>

<div class="controls">
  Opposition:
  <select id="opp">
    <option value="All">All</option>
  </select>

  <div class="tabs">
    <button id="batTab" class="active">Batting</button>
    <button id="bowlTab">Bowling</button>
  </div>
</div>

<div id="content"></div>

</div>

<script>
const params = new URLSearchParams(location.search);
const player = params.get("player");
if(!player) throw "Missing player";

const P = player.toLowerCase();
document.getElementById("playerName").textContent = player;

const oppSel = document.getElementById("opp");
oppSel.addEventListener("change", render);

let matches = [];
let currentTab = "bat";

document.getElementById("batTab").onclick = ()=>switchTab("bat");
document.getElementById("bowlTab").onclick = ()=>switchTab("bowl");

function switchTab(tab){
  currentTab = tab;
  document.getElementById("batTab").classList.toggle("active",tab==="bat");
  document.getElementById("bowlTab").classList.toggle("active",tab==="bowl");
  render();
}

function render(){
  const opp = oppSel.value;
  const career = matches;
  const vs = opp==="All" ? [] : matches.filter(m=>m._opponent===opp);

  currentTab==="bat"
    ? renderBat(career, opp, vs)
    : renderBowl(career, opp, vs);
}

/* ---------- MATCH ENRICH ---------- */
function enrichMatch(m){
  let team=null;
  m.innings.forEach(inn=>{
    inn.overs.forEach(o=>{
      o.deliveries.forEach(d=>{
        if(d.batter?.toLowerCase()===P || d.bowler?.toLowerCase()===P){
          team = inn.team;
        }
      });
    });
  });
  if(!team) return false;
  m._playerTeam = team;
  m._opponent = m.info.teams.find(t=>t!==team);
  return true;
}

/* ---------- STAT CALCULATORS ---------- */
function batStats(list){
  let runs=0,balls=0,outs=0,games=0,hs=0;
  list.forEach(m=>{
    let r=0,b=0,out=false;
    m.innings.forEach(i=>{
      i.overs.forEach(o=>{
        o.deliveries.forEach(d=>{
          if(d.batter?.toLowerCase()===P){
            r+=d.runs.batter;
            if(!d.extras?.wides) b++;
          }
          d.wickets?.forEach(w=>{
            if(w.player_out?.toLowerCase()===P) out=true;
          });
        });
      });
    });
    if(b){
      games++;runs+=r;balls+=b;
      if(out) outs++;
      hs=Math.max(hs,r);
    }
  });
  return {
    games,runs,hs,
    avg:outs?(runs/outs).toFixed(2):"–",
    sr:balls?((runs/balls)*100).toFixed(1):"–"
  };
}

function bowlStats(list){
  let balls=0,runs=0,wkts=0;
  list.forEach(m=>{
    m.innings.forEach(i=>{
      i.overs.forEach(o=>{
        o.deliveries.forEach(d=>{
          if(d.bowler?.toLowerCase()===P){
            balls++;
            if(!d.extras?.byes && !d.extras?.legbyes) runs+=d.runs.total;
          }
          d.wickets?.forEach(w=>{
            if(w.bowler?.toLowerCase()===P) wkts++;
          });
        });
      });
    });
  });
  return {
    overs:(balls/6).toFixed(1),
    wkts,
    avg:wkts?(runs/wkts).toFixed(2):"–",
    econ:balls?((runs/(balls/6))).toFixed(2):"–"
  };
}

/* ---------- RENDER BATTING ---------- */
function renderBat(career,opp,vs){
  const c = batStats(career);
  const o = opp!=="All" ? batStats(vs) : null;

  let rows=[];
  (opp==="All"?career:vs).forEach(m=>{
    let r=0,b=0,out="not out";
    m.innings.forEach(i=>{
      i.overs.forEach(o2=>{
        o2.deliveries.forEach(d=>{
          if(d.batter?.toLowerCase()===P){
            r+=d.runs.batter;
            if(!d.extras?.wides) b++;
          }
          d.wickets?.forEach(w=>{
            if(w.player_out?.toLowerCase()===P) out=w.kind;
          });
        });
      });
    });
    if(b){
      rows.push(`
        <tr>
          <td>${m.info.season}</td>
          <td>${m.info.dates[0]}</td>
          <td>${m._opponent}</td>
          <td>${m.info.venue}</td>
          <td>${r}</td>
          <td>${b}</td>
          <td>${((r/b)*100).toFixed(1)}</td>
          <td>${out}</td>
        </tr>
      `);
    }
  });

  document.getElementById("content").innerHTML = `
    <div class="section-title">CAREER SUMMARY</div>
    <div class="stats">
      <div class="stat"><h3>${c.games}</h3><span>Matches</span></div>
      <div class="stat"><h3>${c.runs}</h3><span>Runs</span></div>
      <div class="stat"><h3>${c.avg}</h3><span>Average</span></div>
      <div class="stat"><h3>${c.sr}</h3><span>Strike Rate</span></div>
      <div class="stat"><h3>${c.hs}</h3><span>High Score</span></div>
    </div>

    ${o?`
    <div class="section-title">VS ${opp.toUpperCase()}</div>
    <div class="stats vs">
      <div class="stat"><h3>${o.games}</h3><span>Matches</span></div>
      <div class="stat"><h3>${o.runs}</h3><span>Runs</span></div>
      <div class="stat"><h3>${o.avg}</h3><span>Average</span></div>
      <div class="stat"><h3>${o.sr}</h3><span>Strike Rate</span></div>
      <div class="stat"><h3>${o.hs}</h3><span>High Score</span></div>
    </div>`:""}

    <table>
      <thead>
        <tr><th>Season</th><th>Date</th><th>Opponent</th><th>Venue</th><th>R</th><th>B</th><th>SR</th><th>Out</th></tr>
      </thead>
      <tbody>${rows.join("")}</tbody>
    </table>
  `;
}

/* ---------- RENDER BOWLING ---------- */
function renderBowl(career,opp,vs){
  const c = bowlStats(career);
  const o = opp!=="All" ? bowlStats(vs) : null;

  let rows=[];
  (opp==="All"?career:vs).forEach(m=>{
    let b=0,r=0,w=0;
    m.innings.forEach(i=>{
      i.overs.forEach(o2=>{
        o2.deliveries.forEach(d=>{
          if(d.bowler?.toLowerCase()===P){
            b++;
            if(!d.extras?.byes && !d.extras?.legbyes) r+=d.runs.total;
          }
          d.wickets?.forEach(wi=>{
            if(wi.bowler?.toLowerCase()===P) w++;
          });
        });
      });
    });
    if(b){
      rows.push(`
        <tr>
          <td>${m.info.season}</td>
          <td>${m.info.dates[0]}</td>
          <td>${m._opponent}</td>
          <td>${m.info.venue}</td>
          <td>${(b/6).toFixed(1)}</td>
          <td>${r}</td>
          <td>${w}</td>
          <td>${(r/(b/6)).toFixed(2)}</td>
        </tr>
      `);
    }
  });

  document.getElementById("content").innerHTML = `
    <div class="section-title">CAREER SUMMARY</div>
    <div class="stats">
      <div class="stat"><h3>${c.overs}</h3><span>Overs</span></div>
      <div class="stat"><h3>${c.wkts}</h3><span>Wickets</span></div>
      <div class="stat"><h3>${c.avg}</h3><span>Average</span></div>
      <div class="stat"><h3>${c.econ}</h3><span>Economy</span></div>
    </div>

    ${o?`
    <div class="section-title">VS ${opp.toUpperCase()}</div>
    <div class="stats vs">
      <div class="stat"><h3>${o.overs}</h3><span>Overs</span></div>
      <div class="stat"><h3>${o.wkts}</h3><span>Wickets</span></div>
      <div class="stat"><h3>${o.avg}</h3><span>Average</span></div>
      <div class="stat"><h3>${o.econ}</h3><span>Economy</span></div>
    </div>`:""}

    <table>
      <thead>
        <tr><th>Season</th><th>Date</th><th>Opponent</th><th>Venue</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>
      </thead>
      <tbody>${rows.join("")}</tbody>
    </table>
  `;
}

/* ---------- LOAD DATA ---------- */
fetch("data/bbl/index.json")
.then(r=>r.json())
.then(files=>Promise.all(files.map(f=>fetch("data/bbl/"+f).then(r=>r.json()))))
.then(seasons=>{
  const oppSet=new Set();
  seasons.forEach(s=>s.forEach(m=>{
    if(enrichMatch(m)){
      matches.push(m);
      oppSet.add(m._opponent);
    }
  }));
  [...oppSet].sort().forEach(t=>oppSel.add(new Option(t,t)));
  render();
});
</script>

</body>
</html>
