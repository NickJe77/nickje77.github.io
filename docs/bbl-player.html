<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f6f7f9;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page{max-width:1200px;margin:30px auto;padding:0 20px;}

.hero{
  background:linear-gradient(90deg,#4b0082,#7a2cbf);
  color:white;
  padding:40px;
  border-radius:24px;
}
.hero h1{margin:0;font-size:38px;}
.hero p{margin-top:8px;font-size:18px;opacity:.9;}

.controls{
  margin:20px 0;
  display:flex;
  gap:12px;
  align-items:center;
}
select,button{
  padding:8px 12px;
  font-size:16px;
  border-radius:8px;
}
.tab-btn{
  border:1px solid #bbb;
  background:#fff;
  cursor:pointer;
}
.tab-btn.active{
  background:#4b0082;
  color:#fff;
  border-color:#4b0082;
}

.section-title{
  margin:30px 0 10px;
  font-weight:700;
  color:#555;
  text-align:center;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}
.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
}
.stat h3{margin:0;font-size:28px;}
.stat span{font-size:14px;color:#666;}

.table-wrap{
  margin-top:30px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}
table{width:100%;border-collapse:collapse;}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:center;}
th{background:#f1f4f8;}
td:nth-child(3),td:nth-child(4){text-align:left;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl.html">BBL</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading…</h1>
  <p>BBL performance by opposition</p>
</div>

<div class="controls">
  Opposition:
  <select id="oppSelect"></select>
  <button class="tab-btn active">Batting</button>
</div>

<div class="section-title">CAREER SUMMARY</div>
<div class="stats" id="careerStats"></div>

<div class="section-title" id="vsTitle">VS OPPOSITION</div>
<div class="stats" id="vsStats"></div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Season</th>
  <th>Date</th>
  <th>Opponent</th>
  <th>Venue</th>
  <th>R</th>
  <th>B</th>
  <th>SR</th>
  <th>Out</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>
</div>

</div>

<script>
(async function(){

const params = new URLSearchParams(location.search);
const player = params.get("player");
if(!player){ return; }
document.getElementById("playerName").textContent = player;

const P = player.toLowerCase();
let games = [];

const index = await fetch("data/bbl/index.json").then(r=>r.json());

for(const file of index){
  const data = await fetch("data/bbl/"+file).then(r=>r.json());

  data.forEach(match=>{
    match.innings.forEach(inn=>{
      let runs=0, balls=0, out="not out", played=false;

      inn.overs.forEach(o=>{
        o.deliveries.forEach(d=>{
          if(d.batter?.toLowerCase()===P){
            played=true;
            runs+=d.runs.batter;
            if(!d.extras?.wides) balls++;
          }
          d.wickets?.forEach(w=>{
            if(w.player_out?.toLowerCase()===P){
              out=w.kind;
            }
          });
        });
      });

      if(played){
        const team = inn.team;
        const opponent = match.info.teams.find(t=>t!==team);

        games.push({
          season: match.info.season,
          date: match.info.dates[0],
          opp: opponent,
          venue: match.info.venue,
          r: runs,
          b: balls,
          sr: balls ? ((runs/balls)*100).toFixed(1) : "—",
          out
        });
      }
    });
  });
}

if(!games.length){
  document.getElementById("gamesTable").innerHTML =
    `<tr><td colspan="8">No data found</td></tr>`;
  return;
}

const oppSel=document.getElementById("oppSelect");
const opponents=["All",...new Set(games.map(g=>g.opp))];
opponents.forEach(o=>{
  const opt=document.createElement("option");
  opt.value=o;
  opt.textContent=o;
  oppSel.appendChild(opt);
});

function stats(list){
  const runs=list.reduce((a,b)=>a+b.r,0);
  const balls=list.reduce((a,b)=>a+b.b,0);
  const outs=list.filter(g=>g.out!=="not out").length;
  return{
    m:list.length,
    r:runs,
    a:outs?(runs/outs).toFixed(2):"—",
    s:balls?((runs/balls)*100).toFixed(1):"—",
    h:Math.max(...list.map(g=>g.r))
  };
}

function render(list){
  const c=stats(games);
  const v=stats(list);

  careerStats.innerHTML=`
    <div class="stat"><h3>${c.m}</h3><span>Matches</span></div>
    <div class="stat"><h3>${c.r}</h3><span>Runs</span></div>
    <div class="stat"><h3>${c.a}</h3><span>Average</span></div>
    <div class="stat"><h3>${c.s}</h3><span>Strike Rate</span></div>
    <div class="stat"><h3>${c.h}</h3><span>High Score</span></div>
  `;

  vsStats.innerHTML=`
    <div class="stat"><h3>${v.m}</h3><span>Matches</span></div>
    <div class="stat"><h3>${v.r}</h3><span>Runs</span></div>
    <div class="stat"><h3>${v.a}</h3><span>Average</span></div>
    <div class="stat"><h3>${v.s}</h3><span>Strike Rate</span></div>
    <div class="stat"><h3>${v.h}</h3><span>High Score</span></div>
  `;

  gamesTable.innerHTML=list.map(g=>`
    <tr>
      <td>${g.season}</td>
      <td>${g.date}</td>
      <td>${g.opp}</td>
      <td>${g.venue}</td>
      <td>${g.r}</td>
      <td>${g.b}</td>
      <td>${g.sr}</td>
      <td>${g.out}</td>
    </tr>
  `).join("");
}

render(games);

oppSel.onchange=()=>{
  const f=oppSel.value==="All"?games:games.filter(g=>g.opp===oppSel.value);
  document.getElementById("vsTitle").textContent=
    oppSel.value==="All"?"VS OPPOSITION":"VS "+oppSel.value.toUpperCase();
  render(f);
};

})();
</script>

</body>
</html>
