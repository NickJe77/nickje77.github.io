<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#f6f7f9;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:28px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#4b0082,#7a2cbf);
  color:#fff;
  padding:40px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:40px;}
.hero p{margin:8px 0 0;font-size:18px;opacity:.9;}

.controls{
  display:flex;
  gap:12px;
  align-items:center;
  margin:20px 0;
}

select{
  padding:8px 12px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
}

.tab-btn{
  padding:8px 16px;
  border-radius:20px;
  border:1px solid #bbb;
  cursor:pointer;
  background:#fff;
}
.tab-btn.active{
  background:#4b0082;
  color:#fff;
  border-color:#4b0082;
}

.section-title{
  margin:30px 0 10px;
  font-weight:700;
  color:#555;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border-radius:14px;
  padding:18px;
  text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
}
.stat h3{
  margin:0;
  font-size:28px;
}
.stat span{
  font-size:14px;
  color:#666;
}

.table-wrap{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}
th{
  background:#f1f4f8;
  font-weight:700;
}
td:nth-child(3),
td:nth-child(4){
  text-align:left;
}

@media(max-width:700px){
  .hero h1{font-size:28px;}
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/cricket.html">Cricket</a>
  <a href="/bbl.html">BBL Seasons</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="playerName">Loading…</h1>
    <p>BBL performance breakdown by opposition</p>
  </div>

  <div class="controls">
    <label>Opposition:</label>
    <select id="oppositionSelect"></select>

    <button class="tab-btn active" id="batTab">Batting</button>
    <button class="tab-btn" id="bowlTab">Bowling</button>
  </div>

  <div class="section-title">CAREER SUMMARY</div>
  <div class="stats" id="careerStats"></div>

  <div class="section-title" id="vsTitle">VS OPPOSITION</div>
  <div class="stats" id="vsStats"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Season</th>
          <th>Date</th>
          <th>Opponent</th>
          <th>Venue</th>
          <th>R</th>
          <th>B</th>
          <th>SR</th>
          <th>Out</th>
        </tr>
      </thead>
      <tbody id="gamesTable"></tbody>
    </table>
  </div>

</div>

<script>
(async function(){

  const params = new URLSearchParams(location.search);
  const player = params.get("player");
  if(!player){
    document.getElementById("playerName").textContent = "Missing player";
    return;
  }
  document.getElementById("playerName").textContent = player;

  const files = [
    "bbl_2011.json","bbl_2012.json","bbl_2013.json","bbl_2014.json",
    "bbl_2015.json","bbl_2016.json","bbl_2017.json","bbl_2018.json",
    "bbl_2019.json","bbl_2020.json","bbl_2021.json","bbl_2022.json",
    "bbl_2023.json","bbl_2024.json","bbl_2025.json","bbl_2026.json"
  ];

  let games=[];

  for(const f of files){
    try{
      const r=await fetch(`/docs/data/bbl/${f}`);
      if(!r.ok) continue;
      const d=await r.json();

      d.matches.forEach(m=>{
        m.innings.forEach(i=>{
          i.batting.forEach(b=>{
            if(b.player===player){
              games.push({
                season:m.season,
                date:m.date,
                opp:i.opposition,
                venue:m.venue,
                r:b.runs,
                b:b.balls,
                sr:b.balls?((b.runs/b.balls)*100).toFixed(1):"—",
                out:b.dismissal||"not out"
              });
            }
          });
        });
      });

    }catch(e){}
  }

  if(!games.length){
    document.getElementById("gamesTable").innerHTML=
      `<tr><td colspan="8">No BBL data found</td></tr>`;
    return;
  }

  const oppSel=document.getElementById("oppositionSelect");
  const opponents=["All",...new Set(games.map(g=>g.opp))];
  opponents.forEach(o=>{
    const opt=document.createElement("option");
    opt.value=o;
    opt.textContent=o;
    oppSel.appendChild(opt);
  });

  function stats(list){
    const runs=list.reduce((a,b)=>a+b.r,0);
    const balls=list.reduce((a,b)=>a+b.b,0);
    const outs=list.filter(g=>g.out!=="not out").length;
    return{
      matches:list.length,
      runs,
      avg:outs?(runs/outs).toFixed(2):"—",
      sr:balls?((runs/balls)*100).toFixed(1):"—",
      hs:Math.max(...list.map(g=>g.r))
    };
  }

  function renderStats(){
    const career=stats(games);
    document.getElementById("careerStats").innerHTML=`
      <div class="stat"><h3>${career.matches}</h3><span>Matches</span></div>
      <div class="stat"><h3>${career.runs}</h3><span>Runs</span></div>
      <div class="stat"><h3>${career.avg}</h3><span>Average</span></div>
      <div class="stat"><h3>${career.sr}</h3><span>Strike Rate</span></div>
      <div class="stat"><h3>${career.hs}</h3><span>High Score</span></div>
    `;
  }

  function renderVs(list){
    const s=stats(list);
    document.getElementById("vsStats").innerHTML=`
      <div class="stat"><h3>${s.matches}</h3><span>Matches</span></div>
      <div class="stat"><h3>${s.runs}</h3><span>Runs</span></div>
      <div class="stat"><h3>${s.avg}</h3><span>Average</span></div>
      <div class="stat"><h3>${s.sr}</h3><span>Strike Rate</span></div>
      <div class="stat"><h3>${s.hs}</h3><span>High Score</span></div>
    `;
  }

  function renderTable(list){
    const tb=document.getElementById("gamesTable");
    tb.innerHTML="";
    list.forEach(g=>{
      tb.innerHTML+=`
        <tr>
          <td>${g.season}</td>
          <td>${g.date}</td>
          <td>${g.opp}</td>
          <td>${g.venue}</td>
          <td>${g.r}</td>
          <td>${g.b}</td>
          <td>${g.sr}</td>
          <td>${g.out}</td>
        </tr>`;
    });
  }

  renderStats();
  renderVs(games);
  renderTable(games);

  oppSel.onchange=()=>{
    const f=oppSel.value==="All"
      ?games
      :games.filter(g=>g.opp===oppSel.value);
    document.getElementById("vsTitle").textContent=
      oppSel.value==="All"?"VS OPPOSITION":`VS ${oppSel.value.toUpperCase()}`;
    renderVs(f);
    renderTable(f);
  };

})();
</script>

</body>
</html>
