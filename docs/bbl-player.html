<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#4b0082,#7a2bbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}

.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:8px;font-size:18px;opacity:.95;}

.controls{
  margin:20px 0;
}

select{
  font-size:16px;
  padding:8px 12px;
  border-radius:8px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-top:20px;
}

.stat{
  background:#f7f9fc;
  border-radius:14px;
  padding:18px;
  text-align:center;
}

.stat h3{
  margin:0;
  font-size:28px;
}

.stat span{
  font-size:14px;
  color:#555;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl.html">BBL Seasons</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="playerName">Loading player…</h1>
  <p>BBL performance breakdown by opposition</p>
</div>

<div class="controls">
  Opposition:
  <select id="oppSelect">
    <option value="ALL">All</option>
  </select>
</div>

<div class="stats-grid" id="stats"></div>

</div>

<script>
const params = new URLSearchParams(location.search);
const rawPlayer = params.get("player");

if(!rawPlayer){
  document.body.innerHTML = "<h2 style='padding:40px'>Missing player parameter</h2>";
  throw "No player";
}

const player = rawPlayer.toLowerCase();

document.getElementById("playerName").textContent = rawPlayer;

const statsBox = document.getElementById("stats");
const oppSelect = document.getElementById("oppSelect");

let matches = [];
let opponents = new Set();

function norm(n){ return n.toLowerCase(); }

function render(filtered){
  let runs=0, balls=0, outs=0, games=0;

  filtered.forEach(m=>{
    let played=false;
    m.innings.forEach(inn=>{
      inn.overs.forEach(o=>{
        o.deliveries.forEach(d=>{
          if(d.batter && norm(d.batter)===player){
            played=true;
            runs+=d.runs.batter;
            if(!d.extras?.wides) balls++;
          }
          if(d.wickets){
            d.wickets.forEach(w=>{
              if(norm(w.player_out)===player) outs++;
            });
          }
        });
      });
    });
    if(played) games++;
  });

  const avg = outs ? (runs/outs).toFixed(2) : "–";
  const sr  = balls ? ((runs/balls)*100).toFixed(1) : "–";

  statsBox.innerHTML = `
    <div class="stat"><h3>${games}</h3><span>Matches</span></div>
    <div class="stat"><h3>${runs}</h3><span>Runs</span></div>
    <div class="stat"><h3>${avg}</h3><span>Average</span></div>
    <div class="stat"><h3>${sr}</h3><span>Strike Rate</span></div>
  `;
}

fetch("data/bbl/index.json")
.then(r=>r.json())
.then(files=>{
  return Promise.all(
    files.map(f=>fetch("data/bbl/"+f).then(r=>r.json()))
  );
})
.then(seasons=>{
  seasons.forEach(season=>{
    season.forEach(match=>{
      matches.push(match);
      match.info.teams.forEach(t=>opponents.add(t));
    });
  });

  [...opponents].sort().forEach(t=>{
    const opt=document.createElement("option");
    opt.value=t;
    opt.textContent=t;
    oppSelect.appendChild(opt);
  });

  render(matches);

  oppSelect.addEventListener("change",()=>{
    const val=oppSelect.value;
    if(val==="ALL"){
      render(matches);
    }else{
      render(matches.filter(m=>m.info.teams.includes(val)));
    }
  });
});
</script>

</body>
</html>
