<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#f6f7f9;
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:white;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

/* HERO */
.hero{
  max-width:1200px;
  margin:30px auto 20px;
  padding:40px 50px;
  border-radius:28px;
  background:linear-gradient(90deg,#4b0082,#8a2be2);
  color:white;
}
.hero h1{
  margin:0 0 8px 0;
  font-size:36px;
}
.hero p{
  margin:0;
  font-size:18px;
  opacity:.9;
}

/* CONTROLS */
.controls{
  max-width:1200px;
  margin:20px auto;
  display:flex;
  align-items:center;
  gap:14px;
}
.controls select{
  padding:10px 14px;
  border-radius:10px;
  font-size:16px;
}
.tab-btn{
  padding:10px 18px;
  border-radius:20px;
  border:1px solid #ccc;
  cursor:pointer;
  background:#f2f2f2;
  font-weight:600;
}
.tab-btn.active{
  background:#5a189a;
  color:white;
  border-color:#5a189a;
}

/* STATS WRAPPER */
.stats-wrap{
  max-width:1200px;
  margin:20px auto;
  background:white;
  border-radius:22px;
  padding:30px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

/* SECTION HEADERS — FIX */
.section-title{
  margin:20px 0 14px;
  font-size:15px;
  letter-spacing:.05em;
  color:#666;
  font-weight:700;
  text-transform:uppercase;
  text-align:center;
}

/* STAT CARDS — FIX */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-bottom:25px;
}

.stat{
  background:#f3f6fb;
  border-radius:16px;
  padding:22px;
  text-align:center;
}

.stat h3{
  margin:0;
  font-size:32px;
  font-weight:800;
  text-align:center;
}

.stat span{
  display:block;
  margin-top:6px;
  font-size:15px;
  color:#555;
  text-align:center;
}

/* TABLE */
.table-wrap{
  max-width:1200px;
  margin:30px auto 50px;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:18px;
  overflow:hidden;
}

thead{
  background:#f1f4f9;
}

th,td{
  padding:14px 16px;
  border-bottom:1px solid #e2e6ef;
  font-size:15px;
}

/* TABLE HEADER — FIX */
th{
  font-weight:700;
  text-align:center;
}

/* TABLE CELLS — FIX NUMERIC */
td:nth-child(1),
td:nth-child(2),
td:nth-child(5),
td:nth-child(6),
td:nth-child(7),
td:nth-child(8){
  text-align:center;
}

td:nth-child(3),
td:nth-child(4){
  text-align:left;
}

tbody tr:nth-child(even){
  background:#fafbfe;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl-seasons.html">BBL Seasons</a>
</div>

<div class="hero">
  <h1 id="playerName">Player</h1>
  <p>BBL performance breakdown by opposition</p>
</div>

<div class="controls">
  <label>Opposition:</label>
  <select id="oppositionSelect"></select>

  <button class="tab-btn active" id="batTab">Batting</button>
  <button class="tab-btn" id="bowlTab">Bowling</button>
</div>

<div class="stats-wrap">
  <div class="section-title">Career Summary</div>
  <div class="stats-grid" id="careerStats"></div>

  <div class="section-title" id="vsTitle">VS Selected Opposition</div>
  <div class="stats-grid" id="vsStats"></div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>Date</th>
        <th>Opponent</th>
        <th>Venue</th>
        <th>R</th>
        <th>B</th>
        <th>SR</th>
        <th>Out</th>
      </tr>
    </thead>
    <tbody id="gamesTable"></tbody>
  </table>
</div>

<script src="bbl-player.js"></script>
</body>
</html>
