<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:26px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#4b0082,#7b2cbf);
  color:#fff;
  padding:34px 40px;
  border-radius:24px;
  margin-bottom:26px;
}
.hero h1{margin:0;font-size:38px;}
.hero p{margin-top:8px;font-size:16px;opacity:.95;}

.controls{
  margin:20px 0;
}
select{
  padding:10px 14px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-bottom:30px;
}

.stat{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  text-align:center;
  background:#f9fafb;
}
.stat strong{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.error{
  background:#fff1f2;
  border:1px solid #fecdd3;
  color:#7f1d1d;
  padding:18px;
  border-radius:12px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl-season.html">BBL Seasons</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading player…</h1>
  <p id="subtitle"></p>
</div>

<div class="controls">
  Opposition:
  <select id="teamSelect"></select>
</div>

<div class="stats" id="stats"></div>

</div>

<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const player = params.get("player");

  const nameEl = document.getElementById("playerName");
  const subEl = document.getElementById("subtitle");
  const teamSelect = document.getElementById("teamSelect");
  const statsEl = document.getElementById("stats");

  if(!player){
    document.body.innerHTML =
      '<div class="error">Missing player parameter</div>';
    return;
  }

  nameEl.textContent = player;
  subEl.textContent = "BBL performance breakdown by opposition";

  // 🔹 Load all seasons automatically
  const index = await fetch("data/bbl/index.json").then(r=>r.json());

  const seasonFiles = index.map(s=>s.file);

  const matches = [];

  for(const f of seasonFiles){
    try{
      const data = await fetch("data/bbl/"+f).then(r=>r.json());
      if(Array.isArray(data)) matches.push(...data);
      else matches.push(data);
    }catch(e){}
  }

  const byTeam = {};
  const teamsSet = new Set();

  function init(team){
    byTeam[team] ??= {
      matches:0,
      runs:0,
      balls:0,
      outs:0,
      wickets:0,
      ballsBowled:0,
      runsConceded:0
    };
  }

  matches.forEach(m=>{
    if(!m.innings) return;

    const teams = m.info.teams;

    m.innings.forEach(inn=>{
      const opp = teams.find(t=>t!==inn.team);
      if(!opp) return;

      inn.overs.forEach(o=>{
        o.deliveries.forEach(d=>{
          // Batting
          if(d.batter === player){
            teamsSet.add(opp);
            init(opp);
            byTeam[opp].runs += d.runs.batter;
            if(!(d.extras && d.extras.wides)) byTeam[opp].balls++;
          }

          if(d.wickets){
            d.wickets.forEach(w=>{
              if(w.player_out === player){
                init(opp);
                byTeam[opp].outs++;
              }
            });
          }

          // Bowling
          if(d.bowler === player){
            teamsSet.add(opp);
            init(opp);
            if(!(d.extras && (d.extras.wides || d.extras.noballs))){
              byTeam[opp].ballsBowled++;
            }
            byTeam[opp].runsConceded +=
              d.runs.total -
              ((d.extras?.byes||0)+(d.extras?.legbyes||0));
            if(d.wickets) byTeam[opp].wickets += d.wickets.length;
          }
        });
      });

      if(byTeam[opp]) byTeam[opp].matches++;
    });
  });

  const teams = ["All", ...Array.from(teamsSet).sort()];
  teams.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    teamSelect.appendChild(o);
  });

  function render(team){
    let d={
      matches:0,runs:0,balls:0,outs:0,
      wickets:0,ballsBowled:0,runsConceded:0
    };

    const src = team==="All" ? Object.values(byTeam) : [byTeam[team]];
    src.forEach(s=>{
      if(!s) return;
      Object.keys(d).forEach(k=>d[k]+=s[k]||0);
    });

    const avg=d.outs?(d.runs/d.outs).toFixed(2):"—";
    const sr=d.balls?((d.runs/d.balls)*100).toFixed(1):"—";
    const ov=(d.ballsBowled/6).toFixed(1);
    const econ=d.ballsBowled?(d.runsConceded/(d.ballsBowled/6)).toFixed(2):"—";

    statsEl.innerHTML=`
      <div class="stat"><strong>${d.matches}</strong>Matches</div>
      <div class="stat"><strong>${d.runs}</strong>Runs</div>
      <div class="stat"><strong>${avg}</strong>Average</div>
      <div class="stat"><strong>${sr}</strong>Strike Rate</div>
      <div class="stat"><strong>${d.wickets}</strong>Wickets</div>
      <div class="stat"><strong>${ov}</strong>Overs</div>
      <div class="stat"><strong>${econ}</strong>Economy</div>
    `;
  }

  teamSelect.addEventListener("change",()=>render(teamSelect.value));
  render("All");
})();
</script>

</body>
</html>
