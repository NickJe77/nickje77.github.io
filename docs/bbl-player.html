<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f8fc;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1200px;
margin:auto;
padding:24px;
}

.hero{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:40px;
border-radius:22px;
}

.hero h1{
margin:0;
font-size:42px;
}

.controls{
margin:20px 0;
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

select,button{
padding:8px 14px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
}

.tab-btn.active{
background:#003566;
color:#fff;
border-color:#003566;
}

.section-title{
margin:30px 0 10px;
text-align:center;
font-weight:700;
color:#003566;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:14px;
}

.stat{
background:#fff;
padding:18px;
border-radius:14px;
text-align:center;
}

.stat h3{
margin:0;
font-size:28px;
color:#003566;
}

.table-wrap{
margin-top:24px;
background:#fff;
border-radius:14px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

td.num{
text-align:right;
}

tr:nth-child(even){
background:#f4f8fc;
}

tr.game-row{
cursor:pointer;
}

tr.game-row:hover{
background:#dbeafe;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="bbl.html">BBL</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading…</h1>
</div>

<div class="controls">

Opposition:
<select id="oppSelect"></select>

<button class="tab-btn" id="batBtn">Batting</button>
<button class="tab-btn" id="bowlBtn">Bowling</button>

</div>

<div class="section-title">CAREER</div>
<div class="stats" id="careerStats"></div>

<div class="section-title">VS OPPONENT</div>
<div class="stats" id="vsStats"></div>

<div class="table-wrap">

<table>
<thead id="tableHead"></thead>
<tbody id="gamesTable"></tbody>
</table>

</div>

</div>

<script>

(async function(){

const params=new URLSearchParams(location.search);
const player=params.get("player");

if(!player)return;

let names={};

try{
names=await fetch("data/bbl/player-names.json").then(r=>r.json());
}catch{}

function full(n){return names[n]||n;}

document.getElementById("playerName").textContent=full(player);

const P=player.toLowerCase();

let battingGames=[];
let bowlingGames=[];
let currentTab="bat";

const index=await fetch("data/bbl/index.json").then(r=>r.json());

const files=await Promise.all(
index.map(f=>fetch("data/bbl/"+f).then(r=>r.json().then(d=>({file:f,data:d}))))
);

files.forEach(({file,data})=>{

data.forEach(match=>{

match.innings.forEach(inn=>{

let batRuns=0,batBalls=0,batted=false;
let bowlBalls=0,bowlRuns=0,bowlWkts=0;

inn.overs.forEach(o=>{

o.deliveries.forEach(d=>{

if(d.batter?.toLowerCase()===P){
batted=true;
batRuns+=d.runs.batter;
if(!d.extras?.wides)batBalls++;
}

if(d.bowler?.toLowerCase()===P){
bowlBalls++;
if(!d.extras?.byes&&!d.extras?.legbyes)bowlRuns+=d.runs.total;
}

if(d.wickets){
d.wickets.forEach(w=>{
if(d.bowler?.toLowerCase()===P)bowlWkts++;
});
}

});

});

const opp=match.info.teams.find(t=>t!==inn.team);

if(batted){
battingGames.push({
file,
season:match.info.season,
opp,
venue:match.info.venue,
r:batRuns,
b:batBalls,
sr:batBalls?((batRuns/batBalls)*100).toFixed(1):"—"
});
}

if(bowlBalls){
bowlingGames.push({
file,
season:match.info.season,
opp,
venue:match.info.venue,
balls:bowlBalls,
o:(bowlBalls/6).toFixed(1),
r:bowlRuns,
w:bowlWkts,
econ:(bowlRuns/(bowlBalls/6)).toFixed(2)
});
}

});

});

});

const oppSel=document.getElementById("oppSelect");

["All",...new Set([...battingGames,...bowlingGames].map(g=>g.opp))]
.forEach(o=>{
const opt=document.createElement("option");
opt.value=o;
opt.textContent=o;
oppSel.appendChild(opt);
});

function sum(list,key){
return list.reduce((a,b)=>a+(b[key]||0),0);
}

function render(){

const opp=oppSel.value;

const all=currentTab==="bat"?battingGames:bowlingGames;
const list=opp==="All"?all:all.filter(g=>g.opp===opp);

/* CAREER always uses full dataset */
const career=all;

if(currentTab==="bat"){

careerStats.innerHTML=`
<div class=stat><h3>${career.length}</h3><span>Matches</span></div>
<div class=stat><h3>${sum(career,"r")}</h3><span>Runs</span></div>
<div class=stat><h3>${sum(career,"b")?((sum(career,"r")/sum(career,"b"))*100).toFixed(1):"—"}</h3><span>SR</span></div>
`;

vsStats.innerHTML=`
<div class=stat><h3>${list.length}</h3><span>Matches</span></div>
<div class=stat><h3>${sum(list,"r")}</h3><span>Runs</span></div>
<div class=stat><h3>${sum(list,"b")?((sum(list,"r")/sum(list,"b"))*100).toFixed(1):"—"}</h3><span>SR</span></div>
`;

tableHead.innerHTML=`
<tr>
<th>Season</th>
<th>Opponent</th>
<th>Venue</th>
<th class=num>R</th>
<th class=num>B</th>
<th class=num>SR</th>
</tr>
`;

gamesTable.innerHTML=list.map(g=>`
<tr class="game-row" onclick="location.href='bbl-match.html?file=${g.file}'">
<td>${g.season}</td>
<td>${g.opp}</td>
<td>${g.venue}</td>
<td class=num>${g.r}</td>
<td class=num>${g.b}</td>
<td class=num>${g.sr}</td>
</tr>
`).join("");

}else{

careerStats.innerHTML=`
<div class=stat><h3>${career.length}</h3><span>Matches</span></div>
<div class=stat><h3>${sum(career,"w")}</h3><span>Wickets</span></div>
<div class=stat><h3>${sum(career,"balls")?(sum(career,"r")/(sum(career,"balls")/6)).toFixed(2):"—"}</h3><span>Econ</span></div>
`;

vsStats.innerHTML=`
<div class=stat><h3>${list.length}</h3><span>Matches</span></div>
<div class=stat><h3>${sum(list,"w")}</h3><span>Wickets</span></div>
<div class=stat><h3>${sum(list,"balls")?(sum(list,"r")/(sum(list,"balls")/6)).toFixed(2):"—"}</h3><span>Econ</span></div>
`;

tableHead.innerHTML=`
<tr>
<th>Season</th>
<th>Opponent</th>
<th>Venue</th>
<th class=num>O</th>
<th class=num>R</th>
<th class=num>W</th>
<th class=num>Econ</th>
</tr>
`;

gamesTable.innerHTML=list.map(g=>`
<tr class="game-row" onclick="location.href='bbl-match.html?file=${g.file}'">
<td>${g.season}</td>
<td>${g.opp}</td>
<td>${g.venue}</td>
<td class=num>${g.o}</td>
<td class=num>${g.r}</td>
<td class=num>${g.w}</td>
<td class=num>${g.econ}</td>
</tr>
`).join("");

}

}

batBtn.onclick=()=>{currentTab="bat";batBtn.classList.add("active");bowlBtn.classList.remove("active");render();}
bowlBtn.onclick=()=>{currentTab="bowl";bowlBtn.classList.add("active");batBtn.classList.remove("active");render();}
oppSel.onchange=render;

render();

})();
</script>

</body>
</html>
