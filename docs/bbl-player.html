<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f6f8fc;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:26px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
  background:#fff;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 70px;
}

.hero{
  background:linear-gradient(90deg,#4b0082,#7b2cbf);
  color:#fff;
  padding:36px 44px;
  border-radius:26px;
  margin-bottom:28px;
}
.hero h1{margin:0;font-size:40px;}
.hero p{margin-top:8px;font-size:16px;opacity:.95;}

.controls{
  margin:20px 0 26px;
  font-size:16px;
}
select{
  padding:10px 14px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}

.section{
  background:#fff;
  border-radius:22px;
  padding:26px;
  margin-bottom:28px;
  box-shadow:0 10px 22px rgba(0,0,0,.06);
}

.section h2{
  margin:0 0 18px;
  font-size:20px;
  letter-spacing:.4px;
  color:#475569;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}

.stat{
  background:#f3f6fb;
  border-radius:18px;
  padding:18px 12px;
  text-align:center;
}
.stat strong{
  display:block;
  font-size:30px;
  margin-bottom:4px;
}
.stat span{
  font-size:14px;
  color:#475569;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl-season.html">BBL Seasons</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading…</h1>
  <p>BBL performance breakdown</p>
</div>

<div class="controls">
  Opposition:
  <select id="teamSelect"></select>
</div>

<div class="section">
  <h2>CAREER SUMMARY</h2>
  <div class="stats" id="careerStats"></div>
</div>

<div class="section">
  <h2>VS SELECTED OPPONENT</h2>
  <div class="stats" id="oppStats"></div>
</div>

</div>

<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const player = params.get("player");

  if(!player){
    document.body.innerHTML = "<h2 style='padding:40px'>Missing player</h2>";
    return;
  }

  document.getElementById("playerName").textContent = player;

  const teamSelect = document.getElementById("teamSelect");
  const careerEl = document.getElementById("careerStats");
  const oppEl = document.getElementById("oppStats");

  const index = await fetch("data/bbl/index.json").then(r=>r.json());
  const seasonFiles = index.map(s=>s.file);

  const career = {
    matches:0,runs:0,balls:0,outs:0,
    wickets:0,ballsBowled:0,runsConceded:0
  };
  const vs = {};
  const teams = new Set();

  function init(team){
    vs[team] ??= {
      matches:0,runs:0,balls:0,outs:0,
      wickets:0,ballsBowled:0,runsConceded:0
    };
  }

  for(const f of seasonFiles){
    const data = await fetch("data/bbl/"+f).then(r=>r.json());
    const matches = Array.isArray(data) ? data : [data];

    matches.forEach(m=>{
      if(!m.innings) return;
      const tms = m.info.teams;

      let played = false;
      const oppSet = new Set();

      m.innings.forEach(inn=>{
        const opp = tms.find(t=>t!==inn.team);
        if(!opp) return;

        inn.overs.forEach(o=>{
          o.deliveries.forEach(d=>{
            // Batting
            if(d.batter === player){
              played = true;
              teams.add(opp);
              init(opp);

              career.runs += d.runs.batter;
              if(!(d.extras && d.extras.wides)) career.balls++;

              vs[opp].runs += d.runs.batter;
              if(!(d.extras && d.extras.wides)) vs[opp].balls++;
            }

            if(d.wickets){
              d.wickets.forEach(w=>{
                if(w.player_out === player){
                  career.outs++;
                  init(opp);
                  vs[opp].outs++;
                }
              });
            }

            // Bowling
            if(d.bowler === player){
              played = true;
              teams.add(opp);
              init(opp);

              if(!(d.extras && (d.extras.wides||d.extras.noballs))){
                career.ballsBowled++;
                vs[opp].ballsBowled++;
              }

              const conceded =
                d.runs.total -
                ((d.extras?.byes||0)+(d.extras?.legbyes||0));

              career.runsConceded += conceded;
              vs[opp].runsConceded += conceded;

              if(d.wickets){
                career.wickets += d.wickets.length;
                vs[opp].wickets += d.wickets.length;
              }
            }
          });
        });

        if(played) oppSet.add(opp);
      });

      if(played){
        career.matches++;
        oppSet.forEach(o=>{
          init(o);
          vs[o].matches++;
        });
      }
    });
  }

  function render(el, d){
    const avg = d.outs ? (d.runs/d.outs).toFixed(2) : "—";
    const sr  = d.balls ? ((d.runs/d.balls)*100).toFixed(1) : "—";
    const ov  = (d.ballsBowled/6).toFixed(1);
    const eco = d.ballsBowled ? (d.runsConceded/(d.ballsBowled/6)).toFixed(2) : "—";

    el.innerHTML = `
      <div class="stat"><strong>${d.matches}</strong><span>Matches</span></div>
      <div class="stat"><strong>${d.runs}</strong><span>Runs</span></div>
      <div class="stat"><strong>${avg}</strong><span>Average</span></div>
      <div class="stat"><strong>${sr}</strong><span>Strike Rate</span></div>
      <div class="stat"><strong>${d.wickets}</strong><span>Wickets</span></div>
      <div class="stat"><strong>${ov}</strong><span>Overs</span></div>
      <div class="stat"><strong>${eco}</strong><span>Economy</span></div>
    `;
  }

  render(careerEl, career);

  [...teams].sort().forEach(t=>{
    const o=document.createElement("option");
    o.value=t;
    o.textContent=t;
    teamSelect.appendChild(o);
  });

  const first = teamSelect.options[0]?.value;
  if(first){
    render(oppEl, vs[first]);
  }

  teamSelect.addEventListener("change",()=>{
    render(oppEl, vs[teamSelect.value]);
  });
})();
</script>

</body>
</html>
