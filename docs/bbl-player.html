<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f8fc;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1200px;
margin:auto;
padding:24px;
}

/* HERO */
.hero{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:40px;
border-radius:22px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero p{
margin-top:6px;
opacity:.9;
}

/* CONTROLS */
.controls{
margin:20px 0;
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
}

select,button{
padding:8px 14px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
}

.tab-btn{
background:#fff;
cursor:pointer;
}

.tab-btn.active{
background:#003566;
color:#fff;
border-color:#003566;
}

/* TITLES */
.section-title{
margin:30px 0 10px;
text-align:center;
font-weight:700;
color:#003566;
}

/* STAT BOXES */
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:14px;
}

.stat{
background:#fff;
padding:18px;
border-radius:14px;
text-align:center;
}

.stat h3{
margin:0;
font-size:28px;
color:#003566;
}

.stat span{
font-size:14px;
color:#666;
}

/* TABLE */
.table-wrap{
margin-top:24px;
background:#fff;
border-radius:14px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:12px;
text-align:left;
}

th.num{
text-align:right;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

td.num{
text-align:right;
font-variant-numeric:tabular-nums;
}

tr:nth-child(even){
background:#f4f8fc;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="bbl.html">BBL</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading…</h1>
<p>BBL career statistics</p>
</div>

<div class="controls">

Opposition:
<select id="oppSelect"></select>

<button class="tab-btn" id="batBtn">Batting</button>
<button class="tab-btn" id="bowlBtn">Bowling</button>

</div>

<div class="section-title">CAREER SUMMARY</div>
<div class="stats" id="careerStats"></div>

<div class="section-title">MATCHES</div>

<div class="table-wrap">

<table>
<thead id="tableHead"></thead>
<tbody id="gamesTable"></tbody>
</table>

</div>

</div>

<script>

(async function(){

const playerNameEl = document.getElementById("playerName");
const oppSelect = document.getElementById("oppSelect");
const careerStats = document.getElementById("careerStats");
const tableHead = document.getElementById("tableHead");
const gamesTable = document.getElementById("gamesTable");
const batBtn = document.getElementById("batBtn");
const bowlBtn = document.getElementById("bowlBtn");

const params = new URLSearchParams(location.search);
const player = params.get("player");

if(!player){

playerNameEl.textContent = "Player not specified";
return;

}

let PLAYER_NAMES = {};

try{

PLAYER_NAMES = await fetch("data/bbl/player-names.json").then(r=>r.json());

}catch{}

function full(n){

return PLAYER_NAMES[n] || n;

}

playerNameEl.textContent = full(player);

const P = player.toLowerCase();

let battingGames=[];
let bowlingGames=[];
let currentTab="bat";

let index=[];

try{

index = await fetch("data/bbl/index.json").then(r=>r.json());

}catch{

playerNameEl.textContent="Failed to load index";
return;

}

/* LOAD ALL MATCH FILES IN PARALLEL */

let matchesFiles=[];

try{

matchesFiles = await Promise.all(
index.map(file=>fetch("data/bbl/"+file).then(r=>r.json()))
);

}catch{

playerNameEl.textContent="Failed to load match files";
return;

}

const allMatches = matchesFiles.flat();

/* PROCESS MATCHES */

allMatches.forEach(match=>{

match.innings.forEach(inn=>{

let batRuns=0;
let batBalls=0;
let batOut="not out";
let batted=false;

let bowlBalls=0;
let bowlRuns=0;
let bowlWkts=0;

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

if(d.batter?.toLowerCase()===P){

batted=true;
batRuns+=d.runs.batter;

if(!d.extras?.wides)
batBalls++;

}

if(d.bowler?.toLowerCase()===P){

bowlBalls++;

if(!d.extras?.byes && !d.extras?.legbyes)
bowlRuns+=d.runs.total;

}

if(d.wickets){

d.wickets.forEach(w=>{

if(w.player_out?.toLowerCase()===P)
batOut=w.kind;

if(d.bowler?.toLowerCase()===P)
bowlWkts++;

});

}

});

});

const opponent = match.info.teams.find(t=>t!==inn.team);

if(batted){

battingGames.push({

season:match.info.season,
opp:opponent,
venue:match.info.venue,
r:batRuns,
b:batBalls,
sr:batBalls?((batRuns/batBalls)*100).toFixed(1):"—"

});

}

if(bowlBalls){

bowlingGames.push({

season:match.info.season,
opp:opponent,
venue:match.info.venue,
balls:bowlBalls,
o:(bowlBalls/6).toFixed(1),
r:bowlRuns,
w:bowlWkts,
econ:(bowlRuns/(bowlBalls/6)).toFixed(2)

});

}

});

});

/* DEFAULT TAB */

if(bowlingGames.length > battingGames.length){

currentTab="bowl";
bowlBtn.classList.add("active");

}else{

currentTab="bat";
batBtn.classList.add("active");

}

/* OPPONENT SELECT */

const oppSet = new Set(["All"]);

battingGames.forEach(g=>oppSet.add(g.opp));
bowlingGames.forEach(g=>oppSet.add(g.opp));

oppSet.forEach(o=>{

const opt=document.createElement("option");
opt.value=o;
opt.textContent=o;
oppSelect.appendChild(opt);

});

/* STATS FUNCTIONS */

function sum(list,key){

return list.reduce((a,b)=>a+(b[key]||0),0);

}

function render(){

const opp=oppSelect.value;

const all=currentTab==="bat"?battingGames:bowlingGames;

const list = opp==="All"?all:all.filter(g=>g.opp===opp);

if(currentTab==="bat"){

const runs=sum(list,"r");
const balls=sum(list,"b");

careerStats.innerHTML=`

<div class="stat"><h3>${list.length}</h3><span>Matches</span></div>
<div class="stat"><h3>${runs}</h3><span>Runs</span></div>
<div class="stat"><h3>${balls?((runs/balls)*100).toFixed(1):"—"}</h3><span>Strike Rate</span></div>

`;

tableHead.innerHTML=`

<tr>
<th>Season</th>
<th>Opponent</th>
<th>Venue</th>
<th class="num">R</th>
<th class="num">B</th>
<th class="num">SR</th>
</tr>

`;

gamesTable.innerHTML=list.map(g=>`

<tr>
<td>${g.season}</td>
<td>${g.opp}</td>
<td>${g.venue}</td>
<td class="num">${g.r}</td>
<td class="num">${g.b}</td>
<td class="num">${g.sr}</td>
</tr>

`).join("");

}else{

const balls=sum(list,"balls");
const runs=sum(list,"r");
const wkts=sum(list,"w");

careerStats.innerHTML=`

<div class="stat"><h3>${list.length}</h3><span>Matches</span></div>
<div class="stat"><h3>${wkts}</h3><span>Wickets</span></div>
<div class="stat"><h3>${balls?((runs/(balls/6))).toFixed(2):"—"}</h3><span>Economy</span></div>

`;

tableHead.innerHTML=`

<tr>
<th>Season</th>
<th>Opponent</th>
<th>Venue</th>
<th class="num">O</th>
<th class="num">R</th>
<th class="num">W</th>
<th class="num">Econ</th>
</tr>

`;

gamesTable.innerHTML=list.map(g=>`

<tr>
<td>${g.season}</td>
<td>${g.opp}</td>
<td>${g.venue}</td>
<td class="num">${g.o}</td>
<td class="num">${g.r}</td>
<td class="num">${g.w}</td>
<td class="num">${g.econ}</td>
</tr>

`).join("");

}

}

batBtn.onclick=()=>{

currentTab="bat";
batBtn.classList.add("active");
bowlBtn.classList.remove("active");
render();

};

bowlBtn.onclick=()=>{

currentTab="bowl";
bowlBtn.classList.add("active");
batBtn.classList.remove("active");
render();

};

oppSelect.onchange=render;

render();

})();

</script>

</body>
</html>
