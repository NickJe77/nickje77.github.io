<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#f6f7f9;
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:white;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

/* HERO */
.hero{
  max-width:1200px;
  margin:30px auto 20px;
  padding:40px 50px;
  border-radius:28px;
  background:linear-gradient(90deg,#4b0082,#8a2be2);
  color:white;
}
.hero h1{margin:0;font-size:36px;}
.hero p{margin-top:6px;font-size:18px;opacity:.9}

/* CONTROLS */
.controls{
  max-width:1200px;
  margin:20px auto;
  display:flex;
  align-items:center;
  gap:14px;
}
select,button{
  padding:10px 14px;
  border-radius:10px;
  font-size:16px;
}
.tab-btn{
  border:1px solid #ccc;
  cursor:pointer;
  background:#eee;
  font-weight:600;
}
.tab-btn.active{
  background:#5a189a;
  color:white;
  border-color:#5a189a;
}

/* STATS */
.stats-wrap{
  max-width:1200px;
  margin:20px auto;
  background:white;
  border-radius:22px;
  padding:30px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.section-title{
  text-align:center;
  font-weight:700;
  text-transform:uppercase;
  color:#666;
  margin:20px 0 14px;
  letter-spacing:.05em;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
}

.stat{
  background:#f3f6fb;
  border-radius:16px;
  padding:22px;
  text-align:center;
}
.stat h3{margin:0;font-size:30px;}
.stat span{display:block;margin-top:6px;color:#555}

/* TABLE */
.table-wrap{
  max-width:1200px;
  margin:30px auto 60px;
}
table{
  width:100%;
  border-collapse:collapse;
  background:white;
}
th,td{
  padding:14px 16px;
  border-bottom:1px solid #e2e6ef;
  text-align:center;
}
th{text-transform:uppercase;font-size:13px;}
td:nth-child(3),td:nth-child(4){text-align:left}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl-seasons.html">BBL Seasons</a>
</div>

<div class="hero">
  <h1 id="playerName">Loading player…</h1>
  <p>BBL performance breakdown by opposition</p>
</div>

<div class="controls">
  <label>Opposition:</label>
  <select id="oppositionSelect"></select>
  <button class="tab-btn active" id="batBtn">Batting</button>
  <button class="tab-btn" id="bowlBtn">Bowling</button>
</div>

<div class="stats-wrap">
  <div class="section-title">Career Summary</div>
  <div class="stats-grid" id="careerStats"></div>

  <div class="section-title" id="vsTitle">VS Selected Opposition</div>
  <div class="stats-grid" id="vsStats"></div>
</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>Season</th>
      <th>Date</th>
      <th>Opponent</th>
      <th>Venue</th>
      <th>R</th>
      <th>B</th>
      <th>SR</th>
      <th>Out</th>
    </tr>
  </thead>
  <tbody id="gamesTable"></tbody>
</table>
</div>

<script>
/* ==========================
   HARD FAIL PROTECTION
========================== */
document.addEventListener("DOMContentLoaded", () => {
  console.log("BBL PLAYER SCRIPT LOADED");

  // TEMP SAMPLE DATA (proves rendering works)
  const player = "GJ Maxwell";

  const games = [
    {season:"2025/26",date:"2026-01-21",opp:"Hobart Hurricanes",venue:"Bellerive Oval",r:9,b:4,sr:225,out:"not out"},
    {season:"2023/24",date:"2024-01-15",opp:"Hobart Hurricanes",venue:"MCG",r:32,b:18,sr:177.8,out:"bowled"},
    {season:"2021/22",date:"2022-01-19",opp:"Hobart Hurricanes",venue:"MCG",r:154,b:64,sr:240.6,out:"not out"}
  ];

  document.getElementById("playerName").textContent = player;

  const oppSel = document.getElementById("oppositionSelect");
  ["All","Hobart Hurricanes"].forEach(o=>{
    const opt=document.createElement("option");
    opt.value=o;
    opt.textContent=o;
    oppSel.appendChild(opt);
  });

  function renderStats(list){
    document.getElementById("careerStats").innerHTML = `
      <div class="stat"><h3>${list.length}</h3><span>Matches</span></div>
      <div class="stat"><h3>${list.reduce((a,b)=>a+b.r,0)}</h3><span>Runs</span></div>
      <div class="stat"><h3>${Math.max(...list.map(g=>g.r))}</h3><span>High Score</span></div>
    `;
    document.getElementById("vsStats").innerHTML = document.getElementById("careerStats").innerHTML;
  }

  function renderTable(list){
    const tb=document.getElementById("gamesTable");
    tb.innerHTML="";
    list.forEach(g=>{
      tb.innerHTML+=`
        <tr>
          <td>${g.season}</td>
          <td>${g.date}</td>
          <td>${g.opp}</td>
          <td>${g.venue}</td>
          <td>${g.r}</td>
          <td>${g.b}</td>
          <td>${g.sr}</td>
          <td>${g.out}</td>
        </tr>`;
    });
  }

  renderStats(games);
  renderTable(games);

  oppSel.onchange=()=>{
    const f = oppSel.value==="All" ? games : games.filter(g=>g.opp===oppSel.value);
    renderStats(f);
    renderTable(f);
  };
});
</script>

</body>
</html>
