<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>W.S. Cox Plate | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="racing.css">
<link rel="stylesheet" href="archive.css">
</head>

<body class="archive-page">

<!-- NAV -->
<nav class="home-nav">
  <a href="index.html">Home</a>
  <a href="racing.html" class="active">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</nav>

<!-- HERO -->
<div class="page-hero">
  <img src="images/cox-plate-hero.jpg" alt="W.S. Cox Plate">
  <div class="hero-text">W.S. COX PLATE</div>
</div>

<!-- FILTERS -->
<div class="filters-row">

  <select id="yearFilter" onchange="applyFilters()">
    <option value="">Year</option>
  </select>

  <input list="horseList" id="horseSearch" placeholder="Horse" oninput="applyFilters()">
  <datalist id="horseList"></datalist>

  <input list="trainerList" id="trainerSearch" placeholder="Trainer" oninput="applyFilters()">
  <datalist id="trainerList"></datalist>

  <input list="jockeyList" id="jockeySearch" placeholder="Jockey" oninput="applyFilters()">
  <datalist id="jockeyList"></datalist>

</div>

<!-- TABLE -->
<div class="table-container">
  <table class="results-table">
    <thead>
      <tr>
        <th>Year</th>
        <th>Finish</th>
        <th>Horse</th>
        <th>Jockey</th>
        <th>Trainer</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>
</div>

<script src="cox-plate.js"></script>

</body>
</html>
