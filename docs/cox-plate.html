<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>W.S. Cox Plate | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/racing.css">

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b0b;
    color: #fff;
}

.header-hero {
    width: 100%;
    height: 340px;
    background: url("images/cox-plate-header.jpg") center/cover no-repeat;
    position: relative;
}

.header-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.7), rgba(0,0,0,0.1));
}

.page-title {
    position: absolute;
    bottom: 30px;
    left: 40px;
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 2px;
}

.content-wrap {
    max-width: 1400px;
    margin: auto;
    padding: 40px;
}

.intro {
    font-size: 18px;
    line-height: 1.6;
    color: #ddd;
    margin-bottom: 40px;
}

.tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
}

.tile {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    cursor: pointer;
    background: #111;
}

.tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
}

.tile:hover img {
    transform: scale(1.05);
}

.tile-title {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    font-size: 18px;
    font-weight: bold;
}

.footer-space {
    height: 60px;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="header-hero">
    <div class="header-overlay"></div>
    <div class="page-title">W.S. COX PLATE</div>
</div>

<!-- CONTENT -->
<div class="content-wrap">

    <div class="intro">
        The W.S. Cox Plate is Australia’s weight-for-age championship and one of the greatest races in world racing history.
        From Phar Lap to Winx, legends have defined themselves on this stage at Moonee Valley.
    </div>

    <!-- TILES -->
    <div class="tile-grid">

        <div class="tile" onclick="location.href='cox-plate-winners.html'">
            <img src="images/tiles/cox-winners.jpg">
            <div class="tile-title">Winners</div>
        </div>

        <div class="tile" onclick="location.href='cox-plate-horses.html'">
            <img src="images/tiles/cox-horses.jpg">
            <div class="tile-title">Champion Horses</div>
        </div>

        <div class="tile" onclick="location.href='cox-plate-jockeys.html'">
            <img src="images/tiles/cox-jockeys.jpg">
            <div class="tile-title">Jockeys</div>
        </div>

        <div class="tile" onclick="location.href='cox-plate-trainers.html'">
            <img src="images/tiles/cox-trainers.jpg">
            <div class="tile-title">Trainers</div>
        </div>

        <div class="tile" onclick="location.href='cox-plate-records.html'">
            <img src="images/tiles/cox-records.jpg">
            <div class="tile-title">Records</div>
        </div>

        <div class="tile" onclick="location.href='cox-plate-gallery.html'">
            <img src="images/tiles/cox-gallery.jpg">
            <div class="tile-title">Gallery</div>
        </div>

    </div>

</div>

<div class="footer-space"></div>

</body>
</html>
