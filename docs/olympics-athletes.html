<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Olympic Athletes | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui,Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{text-align:center;}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

/* SEARCH */
.controls{
  text-align:center;
  margin:20px 0;
}

input{
  padding:10px;
  width:260px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* TABLE */
table{
  width:100%;
  max-width:900px;
  margin:20px auto;
  border-collapse:collapse;
}

/* HEADER */
th{
  background:#111;
  color:#fff;
  padding:10px;
  cursor:pointer;
}

/* ALIGNMENT */
th:first-child,
td:first-child{
  text-align:left;
}

th:not(:first-child),
td:not(:first-child){
  text-align:center;
}

/* CELLS */
td{
  padding:10px;
  border-bottom:1px solid #ddd;
  font-variant-numeric: tabular-nums;
}

/* STRIPING */
tbody tr:nth-child(even){
  background:#f2f6ff;
}

tr:hover{
  background:#e6edff;
}

/* LINKS */
a{
  color:#1a56db;
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./olympics.html">Olympics</a>
</div>

<h1>Olympic Athletes</h1>

<div class="controls">
  <input id="search" placeholder="Search athlete...">
</div>

<table>
<thead>
<tr>
  <th onclick="setSort('name')">Athlete</th>
  <th onclick="setSort('gold')">Gold</th>
  <th onclick="setSort('silver')">Silver</th>
  <th onclick="setSort('bronze')">Bronze</th>
  <th onclick="setSort('total')">Total</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>

<script>

let athletes = [];
let currentSort = { key:"gold", asc:false };

/* LOAD DATA */
fetch("/data/olympics/athletes.json")
.then(r => r.json())
.then(data => build(data));

/* CLEAN NAME */
function cleanName(name){
  if(!name) return "";

  const cleaned = name.trim();

  if(
    cleaned === "" ||
    cleaned.toLowerCase() === "nan" ||
    cleaned.toLowerCase() === "null"
  ){
    return "";
  }

  return cleaned;
}

/* BUILD */
function build(data){

  const map = {};

  data.forEach(a => {

    const name = cleanName(a.name || a.Name);
    if(!name) return;

    if(!map[name]){
      map[name] = {
        name,
        gold: 0,
        silver: 0,
        bronze: 0,
        total: 0
      };
    }

    const gold = Number(a.gold || a.Gold || 0);
    const silver = Number(a.silver || a.Silver || 0);
    const bronze = Number(a.bronze || a.Bronze || 0);

    map[name].gold += gold;
    map[name].silver += silver;
    map[name].bronze += bronze;
    map[name].total += gold + silver + bronze;

  });

  athletes = Object.values(map);
  sortAndRender();
}

/* SORT */
function sortAndRender(){

  const {key, asc} = currentSort;

  athletes.sort((a,b)=>{
    if(typeof a[key] === "string"){
      return asc ? a[key].localeCompare(b[key]) : b[key].localeCompare(a[key]);
    }
    return asc ? a[key]-b[key] : b[key]-a[key];
  });

  render(athletes);
}

/* RENDER */
function render(data){

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  data.forEach(a => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <a href="olympics-athlete.html?name=${encodeURIComponent(a.name)}">
          ${a.name}
        </a>
      </td>
      <td>${a.gold}</td>
      <td>${a.silver}</td>
      <td>${a.bronze}</td>
      <td>${a.total}</td>
    `;

    tbody.appendChild(tr);

  });

}

/* SORT CLICK */
function setSort(key){

  if(currentSort.key === key){
    currentSort.asc = !currentSort.asc;
  }else{
    currentSort.key = key;
    currentSort.asc = false;
  }

  sortAndRender();
}

/* SEARCH */
document.getElementById("search").addEventListener("input", e=>{
  const q = e.target.value.toLowerCase();
  render(athletes.filter(a=>a.name.toLowerCase().includes(q)));
});

</script>

</body>
</html>
