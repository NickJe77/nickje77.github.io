<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Olympic Athletes | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f5f5f5;}

.navbar{
  display:flex;justify-content:center;gap:20px;
  padding:15px;background:#111;
}
.navbar a{color:white;text-decoration:none;font-weight:600;}

.hero{
  background:linear-gradient(90deg,#0085C7,#F4C300,#000,#009F3D,#DF0024);
  color:white;text-align:center;padding:30px 20px;
}
.hero h1{margin:0 0 6px;font-size:2rem;}
.hero p{margin:0;opacity:0.9;}

.controls{
  text-align:center;margin:24px auto;
  max-width:700px;padding:0 10px;
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
}
.controls input{
  flex:1;min-width:220px;
  padding:14px 18px;border-radius:10px;
  border:none;font-size:16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);
  outline:none;
}
.controls input:focus{
  box-shadow:0 0 0 3px #0085C7aa;
}
.controls select{
  padding:14px 18px;border-radius:10px;
  border:none;font-size:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);
  background:white;cursor:pointer;
}

/* TABLE */
.table-wrap{
  max-width:1000px;margin:0 auto 40px;padding:0 10px;
}
table{
  width:100%;border-collapse:collapse;
  background:white;border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
}
th{
  background:#111;color:#fff;padding:12px 10px;
  cursor:pointer;font-size:14px;text-transform:uppercase;
  letter-spacing:0.5px;
}
th:hover{background:#333;}
td{
  padding:11px 10px;border-bottom:1px solid #eee;text-align:center;
}
td:first-child{text-align:left;font-weight:500;}

tbody tr:nth-child(even){background:#f7f9ff;}
tbody tr:hover{background:#e6edff;}

/* Medal colours */
td:nth-child(3){color:#c9a400;font-weight:700;}
td:nth-child(4){color:#888;font-weight:700;}
td:nth-child(5){color:#b87333;font-weight:700;}

a{color:#1a56db;text-decoration:none;}
a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div class="hero">
  <h1>Olympic Athletes</h1>
  <p>Medal records across every Summer Olympics</p>
</div>

<div class="controls">
  <input id="search" placeholder="🔍  Search athlete...">
  <select id="countryFilter"><option value="">All Countries</option></select>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th onclick="setSort('name')">Athlete</th>
  <th onclick="setSort('country')">Country</th>
  <th onclick="setSort('gold')">🥇 Gold</th>
  <th onclick="setSort('silver')">🥈 Silver</th>
  <th onclick="setSort('bronze')">🥉 Bronze</th>
  <th onclick="setSort('total')">Total</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>
</div>

<script>

let athletes = [];
let filtered = [];
let currentSort = { key:"gold", asc:false };

/* LOAD */
fetch("/data/olympics/summer_olympic_medals.json")
.then(r=>r.json())
.then(data=>build(data));

function clean(v){
  if(!v) return "";
  const x = String(v).trim();
  if(["","nan","null","undefined"].includes(x.toLowerCase())) return "";
  return x;
}

/* BUILD */
function build(data){

  const map = {};

  data.forEach(row=>{

    // ❌ REMOVE WINTER OLYMPICS
    if(Number(row.year) === 2022) return;

    const nameRaw = clean(row.athlete);
    if(!nameRaw) return;

    const key = nameRaw.toLowerCase();
    const country = clean(row.country) || "Unknown";
    const medal = clean(row.medal).toUpperCase();

    if(!map[key]){
      map[key] = {
        name: toTitle(nameRaw),
        raw: nameRaw,
        country,
        gold:0, silver:0, bronze:0, total:0
      };
    }

    if(medal==="GOLD") map[key].gold++;
    if(medal==="SILVER") map[key].silver++;
    if(medal==="BRONZE") map[key].bronze++;

    map[key].total = map[key].gold + map[key].silver + map[key].bronze;

  });

  athletes = Object.values(map);

  buildCountryFilter();
  applyFilters();
}

function toTitle(n){
  return n.toLowerCase().split(" ")
    .map(x=>x.charAt(0).toUpperCase()+x.slice(1))
    .join(" ");
}

/* COUNTRY */
function buildCountryFilter(){
  const set = [...new Set(athletes.map(a=>a.country))].sort();
  const sel = document.getElementById("countryFilter");

  set.forEach(c=>{
    const o = document.createElement("option");
    o.value=c;o.textContent=c;
    sel.appendChild(o);
  });
}

/* FILTER */
function applyFilters(){
  const q = document.getElementById("search").value.toLowerCase();
  const c = document.getElementById("countryFilter").value;

  filtered = athletes.filter(a=>{
    return a.name.toLowerCase().includes(q) &&
           (!c || a.country===c);
  });

  sort();
  render();
}

/* SORT */
function setSort(k){
  if(currentSort.key===k) currentSort.asc=!currentSort.asc;
  else{currentSort.key=k;currentSort.asc=false;}
  sort(); render();
}

function sort(){
  const {key,asc} = currentSort;

  filtered.sort((a,b)=>{
    if(typeof a[key]==="string"){
      return asc ? a[key].localeCompare(b[key]) : b[key].localeCompare(a[key]);
    }
    return asc ? a[key]-b[key] : b[key]-a[key];
  });
}

/* RENDER */
function render(){
  const tb = document.getElementById("table-body");
  tb.innerHTML="";

  filtered.forEach(a=>{
    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>
        <a href="olympics-athlete.html?name=${encodeURIComponent(a.raw)}">
          ${a.name}
        </a>
      </td>
      <td>${a.country}</td>
      <td>${a.gold}</td>
      <td>${a.silver}</td>
      <td>${a.bronze}</td>
      <td>${a.total}</td>
    `;

    tb.appendChild(tr);
  });
}

document.getElementById("search").addEventListener("input",applyFilters);
document.getElementById("countryFilter").addEventListener("change",applyFilters);

</script>
</body>
</html>
