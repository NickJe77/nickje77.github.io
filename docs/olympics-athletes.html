<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Olympic Athletes | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: system-ui, Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}

/* NAV */
.navbar{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:#111;
}
.navbar a{
    color:white;
    text-decoration:none;
    font-weight:600;
}

/* HERO */
.hero{
    background:linear-gradient(90deg,#0085C7,#F4C300,#000,#009F3D,#DF0024);
    color:white;
    text-align:center;
    padding:30px 10px;
}

/* CONTENT */
.container{
    max-width:1000px;
    margin:20px auto;
    padding:10px;
}

/* SEARCH */
.search-box{
    margin-bottom:15px;
}
input{
    width:100%;
    padding:10px;
    font-size:16px;
}

/* CARD */
.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    cursor:pointer;
}

.card:hover{
    background:#f0f0f0;
}

.medals{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.medal{
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:6px;
    background:#f2f2f2;
}

.gold{border-left:5px solid gold;}
.silver{border-left:5px solid silver;}
.bronze{border-left:5px solid #cd7f32;}

.detail{
    background:white;
    padding:20px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/olympics.html">Olympics</a>
</div>

<div class="hero">
    <h1>Olympic Athletes</h1>
    <p>Career Medal Records</p>
</div>

<div class="container">

<div class="search-box">
    <input id="search" placeholder="Search athlete...">
</div>

<div id="detail"></div>
<div id="results"></div>

</div>

<script>

let athletes = [];

const params = new URLSearchParams(window.location.search);
const selectedAthlete = params.get("athlete");

async function load(){
    const res = await fetch("data/olympics/olympic_athletes.json");
    athletes = await res.json();

    if(selectedAthlete){
        showDetail(selectedAthlete);
    }else{
        renderTop();
    }
}

function renderTop(){
    const top = [...athletes].sort((a,b)=>b.total - a.total).slice(0,50);
    renderList(top);
}

function renderList(list){
    const container = document.getElementById("results");
    container.innerHTML = "";

    list.forEach(a=>{
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <h2>${a.athlete}</h2>

            <div class="medals">
                <div class="medal gold">Gold<br>${a.GOLD || 0}</div>
                <div class="medal silver">Silver<br>${a.SILVER || 0}</div>
                <div class="medal bronze">Bronze<br>${a.BRONZE || 0}</div>
            </div>

            <div>Total: <b>${a.total}</b></div>
        `;

        div.onclick = () => {
            window.location.href = `olympics-athletes.html?athlete=${encodeURIComponent(a.athlete)}`;
        };

        container.appendChild(div);
    });
}

function showDetail(name){
    const athlete = athletes.find(a => a.athlete === name);

    if(!athlete) return;

    document.getElementById("results").style.display = "none";

    const div = document.getElementById("detail");

    div.innerHTML = `
        <div class="detail">
            <h2>${athlete.athlete}</h2>

            <div class="medals">
                <div class="medal gold">Gold<br>${athlete.GOLD || 0}</div>
                <div class="medal silver">Silver<br>${athlete.SILVER || 0}</div>
                <div class="medal bronze">Bronze<br>${athlete.BRONZE || 0}</div>
            </div>

            <h3>Total: ${athlete.total}</h3>

            <br>
            <button onclick="window.location.href='olympics-athletes.html'">
                Back
            </button>
        </div>
    `;
}

document.getElementById("search").addEventListener("input", function(){
    const q = this.value.toLowerCase();

    const filtered = athletes.filter(a =>
        a.athlete.toLowerCase().includes(q)
    ).slice(0,50);

    renderList(filtered);
});

load();

</script>

</body>
</html>
