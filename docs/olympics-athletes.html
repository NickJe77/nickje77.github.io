<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Olympic Athletes | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;flex-wrap:wrap;justify-content:center;gap:20px;
  padding:15px;background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{color:var(--ink);text-decoration:none;opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;text-align:center;padding:36px 20px;
}
.hero h1{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:clamp(24px,4.5vw,36px);letter-spacing:.01em;text-transform:uppercase;}
.hero p{margin:0;font-size:13.5px;color:rgba(255,255,255,.68);}

.controls{
  text-align:center;margin:22px auto;
  max-width:700px;padding:0 20px;
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
}
.controls input{
  flex:1;min-width:220px;
  padding:12px 18px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink);
  outline:none;
}
.controls input:hover{border-color:var(--faint);}
.controls input:focus{border-color:var(--accent);}
.controls select{
  padding:12px 18px;border-radius:999px;
  border:1px solid var(--line);font-size:13.5px;font-weight:600;
  background:var(--surface);color:var(--ink);cursor:pointer;font-family:var(--body);
}
.controls select:hover{border-color:var(--faint);}
.controls select:focus{outline:none;border-color:var(--accent);}

/* TABLE */
.table-wrap{
  max-width:1000px;margin:0 auto 70px;padding:0 20px;
  overflow-x:auto;
}
table{
  width:100%;border-collapse:collapse;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;
  cursor:pointer;font-size:11px;text-transform:uppercase;
  letter-spacing:.04em;font-weight:600;font-family:var(--body);
  border-bottom:1px solid var(--line);text-align:left;
}
th:hover{color:var(--ink);}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;font-size:13.5px;color:#27313c;
}
td:first-child{text-align:left;font-weight:600;}

tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}

/* Medal colours */
td:nth-child(3){color:#a3821f;font-weight:700;}
td:nth-child(4){color:var(--muted);font-weight:700;}
td:nth-child(5){color:#8a5225;font-weight:700;}

a{color:var(--ink);text-decoration:none;font-weight:700;}
a:hover{color:var(--accent);}
</style>
</head>
<body>

<nav class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</nav>

<div class="hero">
  <h1>Olympic Athletes</h1>
  <p>Medal records across every Summer Olympics</p>
</div>

<div class="controls">
  <input id="search" placeholder="Search athlete...">
  <select id="countryFilter"><option value="">All Countries</option></select>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th onclick="setSort('name')">Athlete</th>
  <th onclick="setSort('country')">Country</th>
  <th onclick="setSort('gold')">Gold</th>
  <th onclick="setSort('silver')">Silver</th>
  <th onclick="setSort('bronze')">Bronze</th>
  <th onclick="setSort('total')">Total</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>
</div>

<script>

let athletes = [];
let filtered = [];
let currentSort = { key:"gold", asc:false };

/* LOAD */
fetch("/data/olympics/summer_olympic_medals.json")
.then(r=>r.json())
.then(data=>build(data));

function clean(v){
  if(!v) return "";
  const x = String(v).trim();
  if(["","nan","null","undefined"].includes(x.toLowerCase())) return "";
  return x;
}

/* BUILD */
function build(data){

  const map = {};

  data.forEach(row=>{

    // ❌ REMOVE WINTER OLYMPICS
    if(Number(row.year) === 2022) return;

    const nameRaw = clean(row.athlete);
    if(!nameRaw) return;

    const key = nameRaw.toLowerCase();
    const country = clean(row.country) || "Unknown";
    const medal = clean(row.medal).toUpperCase();

    if(!map[key]){
      map[key] = {
        name: toTitle(nameRaw),
        raw: nameRaw,
        country,
        gold:0, silver:0, bronze:0, total:0
      };
    }

    if(medal==="GOLD") map[key].gold++;
    if(medal==="SILVER") map[key].silver++;
    if(medal==="BRONZE") map[key].bronze++;

    map[key].total = map[key].gold + map[key].silver + map[key].bronze;

  });

  athletes = Object.values(map);

  buildCountryFilter();
  applyFilters();
}

function toTitle(n){
  return n.toLowerCase().split(" ")
    .map(x=>x.charAt(0).toUpperCase()+x.slice(1))
    .join(" ");
}

/* COUNTRY */
function buildCountryFilter(){
  const set = [...new Set(athletes.map(a=>a.country))].sort();
  const sel = document.getElementById("countryFilter");

  set.forEach(c=>{
    const o = document.createElement("option");
    o.value=c;o.textContent=c;
    sel.appendChild(o);
  });
}

/* FILTER */
function applyFilters(){
  const q = document.getElementById("search").value.toLowerCase();
  const c = document.getElementById("countryFilter").value;

  filtered = athletes.filter(a=>{
    return a.name.toLowerCase().includes(q) &&
           (!c || a.country===c);
  });

  sort();
  render();
}

/* SORT */
function setSort(k){
  if(currentSort.key===k) currentSort.asc=!currentSort.asc;
  else{currentSort.key=k;currentSort.asc=false;}
  sort(); render();
}

function sort(){
  const {key,asc} = currentSort;

  filtered.sort((a,b)=>{
    if(typeof a[key]==="string"){
      return asc ? a[key].localeCompare(b[key]) : b[key].localeCompare(a[key]);
    }
    return asc ? a[key]-b[key] : b[key]-a[key];
  });
}

/* RENDER */
function render(){
  const tb = document.getElementById("table-body");
  tb.innerHTML="";

  filtered.forEach(a=>{
    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>
        <a href="olympics-athlete.html?name=${encodeURIComponent(a.raw)}">
          ${a.name}
        </a>
      </td>
      <td>${a.country}</td>
      <td>${a.gold}</td>
      <td>${a.silver}</td>
      <td>${a.bronze}</td>
      <td>${a.total}</td>
    `;

    tb.appendChild(tr);
  });
}

document.getElementById("search").addEventListener("input",applyFilters);
document.getElementById("countryFilter").addEventListener("change",applyFilters);

</script>
</body>
</html>
