<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Inter,system-ui,Arial,sans-serif;
    background:#f3f4f7;
    color:#111;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px;
    background:white;
    border-bottom:1px solid #ddd;
    flex-wrap:wrap;
}

.navbar a{
    text-decoration:none;
    color:#0056d6;
    font-weight:600;
}

.hero{
    background:linear-gradient(135deg,#37003c,#963cff);
    color:white;
    padding:50px 20px;
    text-align:center;
}

.hero h1{
    margin:0;
    font-size:48px;
    font-weight:800;
}

.hero p{
    margin-top:12px;
    font-size:18px;
    opacity:.95;
}

.team-stripe{
    height:8px;
    background:linear-gradient(90deg,#37003c,#963cff);
}

.container{
    max-width:1400px;
    margin:30px auto;
    padding:0 20px;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat-box{
    background:white;
    border-radius:16px;
    padding:24px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.stat-number{
    font-size:42px;
    font-weight:800;
    color:#37003c;
}

.stat-label{
    margin-top:10px;
    font-size:15px;
    color:#666;
}

.filters{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.filters select{
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #ddd;
    background:white;
    font-size:15px;
}

.card{
    background:white;
    border-radius:16px;
    padding:24px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.section-title{
    margin-top:0;
    margin-bottom:20px;
    font-size:28px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#37003c;
    color:white;
    padding:12px;
    text-align:center;
    font-size:14px;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:center;
    font-size:14px;
}

tr:nth-child(even){
    background:#f7f9fc;
}

.game-row{
    cursor:pointer;
    transition:.15s ease;
}

.game-row:hover{
    background:#e8f0ff !important;
}

.team-link{
    color:#0056d6;
    text-decoration:none;
    font-weight:600;
}

.loading{
    text-align:center;
    padding:50px;
    color:#666;
    font-size:18px;
}

@media(max-width:900px){

.hero h1{
    font-size:34px;
}

th,td{
    padding:8px;
    font-size:12px;
}

.stat-number{
    font-size:30px;
}

}

</style>
</head>
<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/epl.html">EPL</a>
    <a href="/nba.html">NBA</a>
    <a href="/afl.html">AFL</a>
    <a href="/baseball.html">Baseball</a>
</div>

<div class="hero">
    <h1 id="playerName">Loading Player...</h1>
    <p id="playerTeams"></p>
</div>

<div class="team-stripe"></div>

<div class="container">

    <div class="stats-grid">

        <div class="stat-box">
            <div class="stat-number" id="gamesStat">0</div>
            <div class="stat-label">Games</div>
        </div>

        <div class="stat-box">
            <div class="stat-number" id="goalsStat">0</div>
            <div class="stat-label">Goals</div>
        </div>

        <div class="stat-box">
            <div class="stat-number" id="yellowStat">0</div>
            <div class="stat-label">Yellow Cards</div>
        </div>

        <div class="stat-box">
            <div class="stat-number" id="redStat">0</div>
            <div class="stat-label">Red Cards</div>
        </div>

    </div>

    <div class="filters">

        <select id="teamFilter">
            <option value="">All Teams</option>
        </select>

        <select id="seasonFilter">
            <option value="">All Seasons</option>
        </select>

    </div>

    <div class="card">

        <h2 class="section-title">Career Matches</h2>

        <div id="matchesContainer" class="loading">
            Loading player data...
        </div>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const slug = params.get("player");

const playerName = document.getElementById("playerName");
const playerTeams = document.getElementById("playerTeams");

const matchesContainer = document.getElementById("matchesContainer");

const teamFilter = document.getElementById("teamFilter");
const seasonFilter = document.getElementById("seasonFilter");

let allMatches = [];
let playerData = null;

async function loadPlayer(){

    try{

        const response = await fetch(`/data/epl/players/${slug}.json`);

        playerData = await response.json();

        allMatches = playerData.matches || [];

        buildPage();

    }catch(err){

        console.error(err);

        matchesContainer.innerHTML = `
            <div class="loading">
                Failed to load player
            </div>
        `;

    }

}

function buildPage(){

    playerName.textContent = playerData.player || "Unknown Player";

    const teams = [...new Set(allMatches.map(m => m.team).filter(Boolean))];

    playerTeams.textContent = teams.join(" • ");

    document.title = `${playerData.player} | EPL Player`;

    buildFilters();

    buildStats();

    renderMatches();

}

function buildFilters(){

    const teams = new Set();
    const seasons = new Set();

    allMatches.forEach(match => {

        if(match.team) teams.add(match.team);
        if(match.season) seasons.add(match.season);

    });

    [...teams].sort().forEach(team => {

        const option = document.createElement("option");

        option.value = team;
        option.textContent = team;

        teamFilter.appendChild(option);

    });

    [...seasons].sort().reverse().forEach(season => {

        const option = document.createElement("option");

        option.value = season;
        option.textContent = season;

        seasonFilter.appendChild(option);

    });

}

function getFilteredMatches(){

    let filtered = [...allMatches];

    const team = teamFilter.value;
    const season = seasonFilter.value;

    if(team){

        filtered = filtered.filter(m => m.team === team);

    }

    if(season){

        filtered = filtered.filter(m => m.season === season);

    }

    return filtered;

}

function buildStats(){

    const matches = getFilteredMatches();

    const games = matches.length;

    const goals = matches.reduce((sum,m) => sum + (m.goals || 0), 0);

    const yellow = matches.reduce((sum,m) => sum + (m.yellow_cards || 0), 0);

    const red = matches.reduce((sum,m) => sum + (m.red_cards || 0), 0);

    document.getElementById("gamesStat").textContent = games;

    document.getElementById("goalsStat").textContent = goals;

    document.getElementById("yellowStat").textContent = yellow;

    document.getElementById("redStat").textContent = red;

}

function renderMatches(){

    const matches = getFilteredMatches();

    matches.sort((a,b) => new Date(b.date) - new Date(a.date));

    let html = `
        <table>

            <thead>

                <tr>
                    <th>Date</th>
                    <th>Season</th>
                    <th>Team</th>
                    <th>Opponent</th>
                    <th>Goals</th>
                    <th>YC</th>
                    <th>RC</th>
                </tr>

            </thead>

            <tbody>
    `;

    matches.forEach(match => {

        html += `
            <tr class="game-row"
                onclick="window.location.href='/epl-game.html?match=${match.match_id}&season=${match.season}'">

                <td>${match.date || ''}</td>

                <td>${match.season || ''}</td>

                <td>
                    <a class="team-link"
                       href="/epl-team.html?team=${encodeURIComponent(match.team)}"
                       onclick="event.stopPropagation()">
                       ${match.team || ''}
                    </a>
                </td>

                <td>
                    <a class="team-link"
                       href="/epl-team.html?team=${encodeURIComponent(match.opponent)}"
                       onclick="event.stopPropagation()">
                       ${match.opponent || ''}
                    </a>
                </td>

                <td>${match.goals || 0}</td>

                <td>${match.yellow_cards || 0}</td>

                <td>${match.red_cards || 0}</td>

            </tr>
        `;

    });

    html += `
            </tbody>
        </table>
    `;

    matchesContainer.innerHTML = html;

    buildStats();

}

teamFilter.addEventListener("change", renderMatches);

seasonFilter.addEventListener("change", renderMatches);

loadPlayer();

</script>

</body>
</html>
