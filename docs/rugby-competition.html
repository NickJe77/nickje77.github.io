<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Rugby Competition | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
  body{font-family:Inter,system-ui,-apple-system,sans-serif;margin:0;background:#f4f6f8;color:#111;}
  .navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;position:sticky;top:0;z-index:100;}
  .navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
  .navbar a:hover{text-decoration:underline;}
  .hero{background:linear-gradient(135deg,#1a3a1a,#2d7a2d);color:white;padding:52px 20px 44px;text-align:center;}
  .hero h1{margin:0;font-size:52px;font-weight:900;letter-spacing:-2px;}
  .hero p{margin:10px 0 0;font-size:16px;opacity:.88;}
  .page-wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
  .season-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
  .season-tab{padding:8px 16px;border-radius:20px;border:2px solid #2d7a2d;background:white;color:#2d7a2d;font-size:13px;font-weight:800;cursor:pointer;transition:.15s;}
  .season-tab.active{background:#2d7a2d;color:white;}
  .season-tab:hover:not(.active){background:#e8f5e8;}
  .section{background:white;border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px;}
  .section-title{font-size:18px;font-weight:900;margin:0 0 16px;border-left:5px solid #2d7a2d;padding-left:12px;}
  .match-card{border:1px solid #eee;border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:.15s;}
  .match-card:hover{background:#f0faf0;border-color:#2d7a2d;}
  .match-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;}
  .team-name{font-size:16px;font-weight:900;}
  .team-name.right{text-align:right;}
  .score-box{text-align:center;}
  .score{font-size:28px;font-weight:900;color:#2d7a2d;}
  .score-sep{font-size:20px;color:#ccc;margin:0 4px;}
  .match-meta{text-align:center;font-size:12px;color:#888;margin-top:6px;}
  .winner-badge{font-size:11px;font-weight:800;color:#2d7a2d;text-transform:uppercase;}
  .loading{text-align:center;padding:60px;font-size:18px;font-weight:700;color:#888;}
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="rugby.html">Rugby Union</a>
  <a href="rugby-players.html">Players</a>
</div>
<div id="hero" class="hero"><div class="loading">Loading...</div></div>
<div class="page-wrap">
  <div class="season-tabs" id="seasonTabs"></div>
  <div id="matchesSection"></div>
</div>

<script>
var params = new URLSearchParams(location.search);
var compId = params.get('id');
var currentYear = null;
var compName = '';

var COMP_NAMES = {
  "164205":"Rugby World Cup","180659":"Six Nations","244293":"The Rugby Championship",
  "242041":"Super Rugby Pacific","267979":"Gallagher Premiership",
  "270557":"United Rugby Championship","271937":"European Rugby Champions Cup"
};

compName = COMP_NAMES[compId] || 'Rugby Union';
document.title = compName + ' | The Sporting Almanac';
document.getElementById('hero').innerHTML = '<h1>'+compName+'</h1><p>All seasons and results</p>';

fetch('/data/rugby/'+compId+'/index.json')
  .then(function(r){ return r.json(); })
  .then(function(seasons){
    seasons = seasons.slice().reverse();
    var tabs = document.getElementById('seasonTabs');
    tabs.innerHTML = seasons.map(function(s){
      return '<button class="season-tab" onclick="loadSeason('+s.year+',this)">'+s.year+'</button>';
    }).join('');

    // Load most recent season by default
    if(seasons.length){
      var first = tabs.querySelector('.season-tab');
      if(first) first.click();
    }
  });

function loadSeason(year, btn){
  currentYear = year;
  document.querySelectorAll('.season-tab').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');

  document.getElementById('matchesSection').innerHTML = '<div class="loading">Loading '+year+' season...</div>';

  fetch('/data/rugby/'+compId+'/'+year+'.json')
    .then(function(r){ return r.json(); })
    .then(function(matches){
      if(!matches.length){
        document.getElementById('matchesSection').innerHTML = '<div class="loading">No matches found.</div>';
        return;
      }

      var html = '<div class="section"><div class="section-title">'+year+' Season — '+matches.length+' matches</div>';

      matches.slice().reverse().forEach(function(m){
        var hw = m.winner === m.home_team;
        var aw = m.winner === m.away_team;
        html += '<div class="match-card">'+
          '<div class="match-grid">'+
            '<div>'+
              '<div class="team-name">'+(hw?'<strong>':'')+m.home_team+(hw?'</strong>':'')+'</div>'+
              (hw?'<div class="winner-badge">Winner</div>':'')+
            '</div>'+
            '<div class="score-box">'+
              '<div class="score">'+m.home_score+'<span class="score-sep">–</span>'+m.away_score+'</div>'+
              '<div class="match-meta">'+(m.date||'')+(m.venue?' · '+m.venue:'')+'</div>'+
            '</div>'+
            '<div style="text-align:right">'+
              '<div class="team-name right">'+(aw?'<strong>':'')+m.away_team+(aw?'</strong>':'')+'</div>'+
              (aw?'<div class="winner-badge" style="text-align:right">Winner</div>':'')+
            '</div>'+
          '</div>'+
          '</div>';
      });

      html += '</div>';
      document.getElementById('matchesSection').innerHTML = html;
    })
    .catch(function(){
      document.getElementById('matchesSection').innerHTML = '<div class="loading">Failed to load season data.</div>';
    });
}
</script>
</body>
</html>
