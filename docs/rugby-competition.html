<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Rugby Competition | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
  body{font-family:Inter,system-ui,-apple-system,sans-serif;margin:0;background:#f4f6f8;color:#111;}
  .navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;position:sticky;top:0;z-index:100;}
  .navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
  .navbar a:hover{text-decoration:underline;}
  .hero{background:linear-gradient(135deg,#1a3a1a,#2d7a2d);color:white;padding:52px 20px 44px;text-align:center;}
  .hero h1{margin:0;font-size:52px;font-weight:900;letter-spacing:-2px;}
  .hero p{margin:10px 0 0;font-size:16px;opacity:.88;}
  .page-wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
  .season-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
  .season-tab{padding:8px 16px;border-radius:20px;border:2px solid #2d7a2d;background:white;color:#2d7a2d;font-size:13px;font-weight:800;cursor:pointer;transition:.15s;}
  .season-tab.active{background:#2d7a2d;color:white;}
  .season-tab:hover:not(.active){background:#e8f5e8;}
  .section{background:white;border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px;}
  .section-title{font-size:18px;font-weight:900;margin:0 0 16px;border-left:5px solid #2d7a2d;padding-left:12px;}
  .match-card{border:1px solid #eee;border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:.15s;}
  .match-card:hover{background:#f0faf0;border-color:#2d7a2d;}
  .match-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;}
  .team-name{font-size:16px;font-weight:900;}
  .team-name.right{text-align:right;}
  .score-box{text-align:center;}
  .score{font-size:28px;font-weight:900;color:#2d7a2d;}
  .score-sep{font-size:20px;color:#ccc;margin:0 4px;}
  .match-meta{text-align:center;font-size:12px;color:#888;margin-top:6px;}
  .winner-badge{font-size:11px;font-weight:800;color:#2d7a2d;text-transform:uppercase;}
  .loading{text-align:center;padding:60px;font-size:18px;font-weight:700;color:#888;}
  .standings-table{width:100%;border-collapse:collapse;font-size:14px;}
  .standings-table th{background:#1a3a1a;color:white;padding:10px 12px;text-align:center;font-size:12px;font-weight:800;text-transform:uppercase;}
  .standings-table td{padding:10px 12px;border-bottom:1px solid #eee;text-align:center;}
  .standings-table tr:nth-child(even) td{background:#f8faf8;}
  .standings-table .leader-row td{background:#e8f5e8;font-weight:700;}
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="rugby.html">Rugby Union</a>
  <a href="rugby-players.html">Players</a>
</div>
<div id="hero" class="hero"><div class="loading">Loading...</div></div>
<div class="page-wrap">
  <div class="season-tabs" id="seasonTabs"></div>
  <div id="matchesSection"></div>
</div>

<script>
var params = new URLSearchParams(location.search);
var compId = params.get('id');
var currentYear = null;
var compName = '';

var COMP_NAMES = {
  "164205":"Rugby World Cup","180659":"Six Nations","244293":"The Rugby Championship",
  "242041":"Super Rugby Pacific","267979":"Gallagher Premiership",
  "270557":"United Rugby Championship","271937":"European Rugby Champions Cup"
};

// Round-robin competitions where table determines champion
// Finals-based competitions show the final match winner instead
var ROUND_ROBIN = {"180659":true, "244293":true}; // World Cup (164205) uses finals

compName = COMP_NAMES[compId] || 'Rugby Union';
document.title = compName + ' | The Sporting Almanac';
document.getElementById('hero').innerHTML = '<h1>'+compName+'</h1><p>All seasons and results</p>';

fetch('/data/rugby/'+compId+'/index.json')
  .then(function(r){ return r.json(); })
  .then(function(seasons){
    seasons = seasons.slice().reverse();
    var tabs = document.getElementById('seasonTabs');
    tabs.innerHTML = seasons.map(function(s){
      return '<button class="season-tab" onclick="loadSeason('+s.year+',this)">'+s.year+'</button>';
    }).join('');

    // Load most recent season by default
    if(seasons.length){
      var first = tabs.querySelector('.season-tab');
      if(first) first.click();
    }
  });

function buildStandings(matches){
  var teams = {};
  matches.forEach(function(m){
    if(!m.home_team || !m.away_team) return;
    if(m.home_score === '' || m.away_score === '') return;
    [m.home_team, m.away_team].forEach(function(t){ if(!teams[t]) teams[t]={team:t,p:0,w:0,d:0,l:0,pf:0,pa:0,pts:0}; });
    var hs = parseInt(m.home_score)||0, as = parseInt(m.away_score)||0;
    teams[m.home_team].p++; teams[m.away_team].p++;
    teams[m.home_team].pf+=hs; teams[m.home_team].pa+=as;
    teams[m.away_team].pf+=as; teams[m.away_team].pa+=hs;
    if(hs>as){
      teams[m.home_team].w++; teams[m.home_team].pts+=4;
      teams[m.away_team].l++;
    } else if(as>hs){
      teams[m.away_team].w++; teams[m.away_team].pts+=4;
      teams[m.home_team].l++;
    } else {
      teams[m.home_team].d++; teams[m.home_team].pts+=2;
      teams[m.away_team].d++; teams[m.away_team].pts+=2;
    }
    // Bonus point for 4+ tries (approximated from score diff)
    if(hs>=28 && hs-as>=7) teams[m.home_team].pts+=1;
    if(as>=28 && as-hs>=7) teams[m.away_team].pts+=1;
    // Losing bonus point (within 7)
    if(hs<as && as-hs<=7) teams[m.home_team].pts+=1;
    if(as<hs && hs-as<=7) teams[m.away_team].pts+=1;
  });

  var rows = Object.values(teams).sort(function(a,b){ return b.pts-a.pts||b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa); });
  if(!rows.length) return '';

  var leader = rows[0].team;
  var tableHtml = '<div class="section" style="margin-bottom:20px">'+
    '<div class="section-title">Standings</div>'+
    '<div style="overflow-x:auto"><table class="standings-table">'+
    '<thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PF</th><th>PA</th><th>Diff</th><th>Pts</th></tr></thead>'+
    '<tbody>'+
    rows.map(function(r,i){
      var diff = r.pf-r.pa;
      return '<tr'+(i===0?' class="leader-row"':'')+'>'+
        '<td>'+(i+1)+'</td>'+
        '<td style="text-align:left;font-weight:700">'+r.team+'</td>'+
        '<td>'+r.p+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td>'+
        '<td>'+r.pf+'</td><td>'+r.pa+'</td>'+
        '<td>'+(diff>=0?'+':'')+diff+'</td>'+
        '<td><strong>'+r.pts+'</strong></td>'+
        '</tr>';
    }).join('')+
    '</tbody></table></div></div>';

  return {html: tableHtml, leader: leader};
}

function loadSeason(year, btn){
  currentYear = year;
  document.querySelectorAll('.season-tab').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');

  document.getElementById('matchesSection').innerHTML = '<div class="loading">Loading '+year+' season...</div>';

  fetch('/data/rugby/'+compId+'/'+year+'.json')
    .then(function(r){ return r.json(); })
    .then(function(matches){
      if(!matches.length){
        document.getElementById('matchesSection').innerHTML = '<div class="loading">No matches found.</div>';
        return;
      }

      // Build standings or find final winner
      var banner = '';
      var standingsHtml = '';

      if(ROUND_ROBIN[compId]){
        var standings = buildStandings(matches);
        var leader = standings ? standings.leader : '';
        standingsHtml = standings ? standings.html : '';
        if(leader){
          banner = '<div style="background:linear-gradient(135deg,#1a3a1a,#2d7a2d);color:white;border-radius:16px;padding:24px;text-align:center;margin-bottom:20px">'+
            '<div style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;opacity:.8">'+year+' Champion</div>'+
            '<div style="font-size:36px;font-weight:900;margin-top:8px">'+leader+'</div>'+
            '</div>';
        }
      } else {
        // Finals-based: show the last completed match winner as champion
        var completed = matches.filter(function(m){ return m.winner; });
        var finalMatch = completed.length ? completed[completed.length-1] : null;
        if(finalMatch && finalMatch.winner){
          banner = '<div style="background:linear-gradient(135deg,#1a3a1a,#2d7a2d);color:white;border-radius:16px;padding:24px;text-align:center;margin-bottom:20px">'+
            '<div style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;opacity:.8">'+year+' Champion</div>'+
            '<div style="font-size:36px;font-weight:900;margin-top:8px">'+finalMatch.winner+'</div>'+
            '<div style="font-size:14px;opacity:.8;margin-top:6px">'+finalMatch.home_team+' '+finalMatch.home_score+' – '+finalMatch.away_score+' '+finalMatch.away_team+'</div>'+
            '</div>';
        }
      }

      var matchesHtml = '<div class="section"><div class="section-title">'+year+' Results — '+matches.length+' matches</div>';
      matches.slice().reverse().forEach(function(m){
        var hw = m.winner === m.home_team;
        var aw = m.winner === m.away_team;
        matchesHtml += '<div class="match-card">'+
          '<div class="match-grid">'+
            '<div>'+
              '<div class="team-name">'+(hw?'<strong>':'')+m.home_team+(hw?'</strong>':'')+'</div>'+
              (hw?'<div class="winner-badge">Winner</div>':'')+
            '</div>'+
            '<div class="score-box">'+
              '<div class="score">'+m.home_score+'<span class="score-sep">–</span>'+m.away_score+'</div>'+
              '<div class="match-meta">'+(m.date||'')+(m.venue?' · '+m.venue:'')+'</div>'+
            '</div>'+
            '<div style="text-align:right">'+
              '<div class="team-name right">'+(aw?'<strong>':'')+m.away_team+(aw?'</strong>':'')+'</div>'+
              (aw?'<div class="winner-badge" style="text-align:right">Winner</div>':'')+
            '</div>'+
          '</div>'+
          '</div>';
      });
      matchesHtml += '</div>';

      document.getElementById('matchesSection').innerHTML = banner + standingsHtml + matchesHtml;
    })
    .catch(function(){
      document.getElementById('matchesSection').innerHTML = '<div class="loading">Failed to load season data.</div>';
    });
}
</script>
</body>
</html>
