<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tour de France Stages | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

/* MATCH SITE FONT + RESET */
body{
  font-family:system-ui, Arial, sans-serif;
  margin:0;
  padding:20px;
}

/* NAVBAR (MATCH HOME) */
.home-nav{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.home-nav a{
  color:#0056d6;
  text-decoration:none;
  font-size:15px;
}

/* PAGE TITLE */
h1{
  text-align:center;
  margin-top:20px;
}

/* CONTROLS */
.controls{
  text-align:center;
  margin:20px 0;
}

select{
  padding:8px;
  font-size:16px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#111;
  color:#fff;
}

tr:hover{
  background:#f5f5f5;
}

</style>
</head>

<body>

<!-- NAVIGATION -->
<nav class="home-nav">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nfl.html">NFL</a>
  <a href="./olympics.html">Olympics</a>
</nav>

<h1>Tour de France Stages</h1>

<div class="controls">
  <label>Season:</label>
  <select id="yearFilter">
    <option value="all">All</option>
  </select>
</div>

<table>
  <thead>
    <tr>
      <th>Year</th>
      <th>Stage</th>
      <th>Start</th>
      <th>End</th>
      <th>Stage Winner</th>
      <th>Yellow</th>
      <th>Green</th>
      <th>Polka Dot</th>
      <th>White</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>

let DATA = [];

/* FIX ACCENTS */
function clean(text){
  if(!text) return "";
  try{
    return decodeURIComponent(JSON.parse('"' + text.replace(/"/g,'\\"') + '"'));
  }catch{
    return text;
  }
}

/* LOAD DATA */
fetch("data/cycling/stages.json")
  .then(res => res.json())
  .then(data => {
    DATA = data;
    console.log("Sample:", DATA[0]); // debug
    buildYearFilter();
    renderTable();
  });

/* YEAR FILTER */
function buildYearFilter(){
  const years = [...new Set(DATA.map(d => d.Year))].sort((a,b)=>b-a);

  const select = document.getElementById("yearFilter");

  years.forEach(y=>{
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    select.appendChild(opt);
  });

  select.addEventListener("change", renderTable);
}

/* RENDER */
function renderTable(){
  const year = document.getElementById("yearFilter").value;

  let rows = DATA;

  if(year !== "all"){
    rows = rows.filter(d => d.Year == year);
  }

  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  rows.slice(0,500).forEach(d => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${d.Year || ""}</td>
      <td>${d.Stages || ""}</td>
      <td>${clean(d.Start)}</td>
      <td>${clean(d.End)}</td>
      <td>${clean(d["Winner of stage"]) || "—"}</td>
      <td>${clean(d["Yellow jersey"]) || "—"}</td>
      <td>${clean(d["Green jersey"]) || "—"}</td>
      <td>${clean(d["Polka-dot jersey"]) || "—"}</td>
      <td>${clean(d["White jersey"]) || "—"}</td>
    `;

    body.appendChild(tr);
  });
}

</script>

</body>
</html>
