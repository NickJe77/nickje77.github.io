<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tour de France Stages | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui,Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
}

.controls{
  text-align:center;
  margin:20px 0;
}

select{
  padding:8px;
  font-size:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#111;
  color:#fff;
}

tr:hover{
  background:#f5f5f5;
}
</style>
</head>

<body>

<h1>Tour de France Stages</h1>

<div class="controls">
  <label>Season:</label>
  <select id="yearFilter">
    <option value="all">All</option>
  </select>
</div>

<table>
  <thead>
    <tr>
      <th>Year</th>
      <th>Stage</th>
      <th>Date</th>
      <th>Start</th>
      <th>Finish</th>
      <th>Winner</th>
      <th>Distance (km)</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>

let DATA = [];

fetch("data/cycling/stages.json")
  .then(res => res.json())
  .then(data => {
    DATA = data;
    buildYearFilter();
    renderTable();
  });

function buildYearFilter(){
  const years = [...new Set(DATA.map(d => d.Year))].sort((a,b)=>b-a);

  const select = document.getElementById("yearFilter");

  years.forEach(y=>{
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    select.appendChild(opt);
  });

  select.addEventListener("change", renderTable);
}

function renderTable(){
  const year = document.getElementById("yearFilter").value;

  let rows = DATA;

  if(year !== "all"){
    rows = rows.filter(d => d.Year == year);
  }

  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  rows.slice(0, 500).forEach(d => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${d.Year || ""}</td>
      <td>${d.Stage || ""}</td>
      <td>${d.Date || ""}</td>
      <td>${d.Start || ""}</td>
      <td>${d.Finish || ""}</td>
      <td>${d.Winner || ""}</td>
      <td>${d.Distance || ""}</td>
    `;

    body.appendChild(tr);
  });
}

</script>

</body>
</html>
