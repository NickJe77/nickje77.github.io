<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tour de France Stages | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:system-ui, Arial, sans-serif;
  margin:0;
  padding:20px;
}

/* NAVBAR */
.home-nav{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.home-nav a{
  color:#0056d6;
  text-decoration:none;
  font-size:15px;
}

/* TITLE */
h1{
  text-align:center;
  margin-top:20px;
}

/* FILTER */
.controls{
  text-align:center;
  margin:20px 0;
}

select{
  padding:8px;
  font-size:16px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#111;
  color:#fff;
}

tr:hover{
  background:#f5f5f5;
}

a{
  color:#0056d6;
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}

</style>
</head>

<body>

<!-- NAV -->
<nav class="home-nav">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
  <a href="./nba.html">NBA</a>
  <a href="./nfl.html">NFL</a>
</nav>

<h1>Tour de France Stages</h1>

<div class="controls">
  <label>Season:</label>
  <select id="yearFilter">
    <option value="all">All</option>
  </select>
</div>

<table>
  <thead>
    <tr>
      <th>Year</th>
      <th>Stage</th>
      <th>Start</th>
      <th>End</th>
      <th>Stage Winner</th>
      <th>Yellow</th>
      <th>Green</th>
      <th>Polka Dot</th>
      <th>White</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>

let DATA = [];

/* FIX TEXT (ACCENTS) */
function clean(text){
  if(!text) return "";
  try{
    return decodeURIComponent(JSON.parse('"' + text.replace(/"/g,'\\"') + '"'));
  }catch{
    return text;
  }
}

/* FLEXIBLE FIELD LOOKUP */
function get(d, keys){
  for(let k of keys){
    if(d[k] && d[k] !== "") return clean(d[k]);
  }
  return "—";
}

/* SLUG FOR LINKS */
function slug(name){
  if(!name) return "";
  return name
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

/* LINK BUILDER */
function riderLink(name){
  if(!name || name === "—") return "—";
  return `<a href="cycling-rider.html?name=${slug(name)}">${name}</a>`;
}

/* LOAD DATA */
fetch("data/cycling/stages.json")
  .then(res => res.json())
  .then(data => {
    DATA = data;
    console.log("FIELDS:", Object.keys(DATA[0])); // debug
    buildYearFilter();
    renderTable();
  });

/* YEAR FILTER */
function buildYearFilter(){
  const years = [...new Set(DATA.map(d => d.Year))].sort((a,b)=>b-a);

  const select = document.getElementById("yearFilter");

  years.forEach(y=>{
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    select.appendChild(opt);
  });

  select.addEventListener("change", renderTable);
}

/* RENDER TABLE */
function renderTable(){

  const year = document.getElementById("yearFilter").value;

  let rows = DATA;

  if(year !== "all"){
    rows = rows.filter(d => d.Year == year);
  }

  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  rows.slice(0,500).forEach(d => {

    const winner = get(d, ["Winner of stage","Winner","Stage Winner"]);
    const yellow = get(d, ["Yellow jersey","Yellow Jersey","Yellow"]);
    const green = get(d, ["Green jersey","Green"]);
    const polka = get(d, ["Polka-dot jersey","Polka Dot"]);
    const white = get(d, ["White jersey","White"]);

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${d.Year || ""}</td>
      <td>${d.Stages || ""}</td>
      <td>${clean(d.Start)}</td>
      <td>${clean(d.End)}</td>
      <td>${riderLink(winner)}</td>
      <td>${riderLink(yellow)}</td>
      <td>${riderLink(green)}</td>
      <td>${riderLink(polka)}</td>
      <td>${riderLink(white)}</td>
    `;

    body.appendChild(tr);
  });
}

</script>

</body>
</html>
