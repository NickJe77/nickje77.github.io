<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tour de France Stages | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover{opacity:1;color:var(--accent);}

.page{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:36px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:10px;display:block;
}
h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.controls{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:20px;}
.controls label{font-size:13px;font-weight:600;color:var(--muted);}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

.table-wrap{
  overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
}
table{width:100%;border-collapse:collapse;min-width:900px;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;white-space:nowrap;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
td:first-child{font-weight:700;color:var(--ink);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
a{color:inherit;text-decoration:none;}
a:hover{color:var(--accent);}
</style>
</head>

<body>

<!-- NAV -->
<nav class="navbar">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
</nav>

<div class="page">

  <div class="hero">
    <span class="eyebrow">Tour de France</span>
    <h1>Tour de France Stages</h1>
  </div>

  <div class="controls">
    <label>Season</label>
    <select id="yearFilter">
      <option value="all">All</option>
    </select>
  </div>

  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Stage</th>
        <th>Start</th>
        <th>End</th>
        <th>Stage Winner</th>
        <th>Yellow</th>
        <th>Green</th>
        <th>Polka Dot</th>
        <th>White</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  </div>

</div>

<script>

let DATA = [];

/* FIX TEXT (ACCENTS) */
function clean(text){
  if(!text) return "";
  try{
    return decodeURIComponent(JSON.parse('"' + text.replace(/"/g,'\\"') + '"'));
  }catch{
    return text;
  }
}

/* FLEXIBLE FIELD LOOKUP */
function get(d, keys){
  for(let k of keys){
    if(d[k] && d[k] !== "") return clean(d[k]);
  }
  return "—";
}

/* SLUG FOR LINKS */
function slug(name){
  if(!name) return "";
  return name
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

/* LINK BUILDER */
function riderLink(name){
  if(!name || name === "—") return "—";
  return `<a href="cycling-rider.html?name=${slug(name)}">${name}</a>`;
}

/* LOAD DATA */
fetch("data/cycling/stages.json")
  .then(res => res.json())
  .then(data => {
    DATA = data;
    console.log("FIELDS:", Object.keys(DATA[0])); // debug
    buildYearFilter();
    renderTable();
  });

/* YEAR FILTER */
function buildYearFilter(){
  const years = [...new Set(DATA.map(d => d.Year))].sort((a,b)=>b-a);

  const select = document.getElementById("yearFilter");

  years.forEach(y=>{
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    select.appendChild(opt);
  });

  select.addEventListener("change", renderTable);
}

/* RENDER TABLE */
function renderTable(){

  const year = document.getElementById("yearFilter").value;

  let rows = DATA;

  if(year !== "all"){
    rows = rows.filter(d => d.Year == year);
  }

  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  rows.slice(0,500).forEach(d => {

    const winner = get(d, ["Winner of stage","Winner","Stage Winner"]);
    const yellow = get(d, ["Yellow jersey","Yellow Jersey","Yellow"]);
    const green = get(d, ["Green jersey","Green"]);
    const polka = get(d, ["Polka-dot jersey","Polka Dot"]);
    const white = get(d, ["White jersey","White"]);

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${d.Year || ""}</td>
      <td>${d.Stages || ""}</td>
      <td>${clean(d.Start)}</td>
      <td>${clean(d.End)}</td>
      <td>${riderLink(winner)}</td>
      <td>${riderLink(yellow)}</td>
      <td>${riderLink(green)}</td>
      <td>${riderLink(polka)}</td>
      <td>${riderLink(white)}</td>
    `;

    body.appendChild(tr);
  });
}

</script>

</body>
</html>
