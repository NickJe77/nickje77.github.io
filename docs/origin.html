<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8" />
<title>State of Origin | The Sporting Almanac</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --board-line:rgba(255,255,255,.10);
  --win:#ffffff;
  --lose:rgba(255,255,255,.42);
  --accent:#e0b94a;
  --accent-soft:rgba(224,185,74,.18);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;

  /* State of Origin team colours */
  --qld:#8b1538;
  --qld-soft:rgba(139,21,56,.12);
  --nsw:#0f3d8c;
  --nsw-soft:rgba(15,61,140,.12);
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

.page-wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

h1{
  font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);
  letter-spacing:.01em;text-transform:uppercase;margin:0;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:22px 26px 26px;
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg, var(--qld) 0%, var(--qld) 50%, var(--nsw) 50%, var(--nsw) 100%);
  opacity:.10;
}
.hero .eyebrow{
  position:relative;font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:8px;
}
.hero h1{position:relative;color:#fff;}
.hero .series-line{
  position:relative;margin-top:10px;font-family:var(--body);font-size:14px;font-weight:600;
  color:rgba(255,255,255,.75);
}
.hero .series-line b{color:#fff;}

/* ── Controls ─────────────────────────────────────────── */
.controls{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}

select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);min-width:160px;
  cursor:pointer;
}
select:hover{border-color:var(--faint);}

/* ── Layout ───────────────────────────────────────────── */
.main-layout{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start;}
@media(max-width:900px){ .main-layout{grid-template-columns:1fr;} }

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
}
.card-head{
  display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);
}
.card-head h2{
  margin:0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
}

/* ── Series summary card ─────────────────────────────── */
.series-summary{padding:18px;}
.series-row{
  display:flex;align-items:center;justify-content:space-between;padding:12px 0;
  border-bottom:1px solid var(--line);
}
.series-row:last-child{border-bottom:none;}
.series-team{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:16px;}
.series-team .dot{width:11px;height:11px;border-radius:3px;}
.series-wins{font-family:var(--display);font-size:22px;font-weight:700;}
.series-verdict{
  margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
  font-size:12.5px;color:var(--muted);text-align:center;font-weight:600;letter-spacing:.02em;
}

/* ── Match list ───────────────────────────────────────── */
.matches{display:flex;flex-direction:column;gap:10px;}
.match{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 18px;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s;
  border-left:4px solid transparent;
}
.match:hover{
  transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,16,24,.18);border-color:var(--faint);
}
.match .round-label{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
  margin-bottom:6px;
}
.match .line1{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.01em;color:var(--ink);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.match .line1 .dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:0 0 auto;}
.match .meta{color:var(--muted);font-size:12px;margin-top:6px;font-weight:600;letter-spacing:.02em;}
.match .potm{color:var(--muted);font-size:12px;margin-top:4px;}
.match .potm b{color:var(--ink);}

.loading,.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;}
</style>
</head>
<body>
<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
  <a href="origin.html" class="current">Origin</a>
</nav>

<div class="page-wrap">

<div class="hero">
  <div class="eyebrow">STATE OF ORIGIN</div>
  <h1 id="heroTitle">State of Origin</h1>
  <div class="series-line" id="seriesLine"></div>
</div>

<div class="controls">
  <select id="yearSelect"><option>Loading…</option></select>
</div>

<div class="main-layout">
  <div class="card">
    <div class="card-head"><h2>Series</h2></div>
    <div class="series-summary" id="seriesSummary"></div>
  </div>
  <div class="matches" id="matches"><div class="loading">Loading Origin results…</div></div>
</div>

</div>

<script>

const TEAM_META = {
  QLD: { label: "Queensland", short: "QLD", colour: "var(--qld)" },
  NSW: { label: "New South Wales", short: "NSW", colour: "var(--nsw)" },
};

const yearSelect   = document.getElementById("yearSelect");
const matchesDiv   = document.getElementById("matches");
const summaryDiv   = document.getElementById("seriesSummary");
const heroTitle    = document.getElementById("heroTitle");
const seriesLine   = document.getElementById("seriesLine");

let allMatches = [];      // every match, every year — loaded once
let currentMatches = [];  // filtered to the selected year
let currentYear = null;

fetch("data/nrl/origin_results.json")
  .then(r => { if(!r.ok) throw new Error("no data"); return r.json(); })
  .then(data => {
    allMatches = data || [];
    const years = [...new Set(allMatches.map(m => m.year))].sort((a,b) => b - a);

    if(!years.length){
      matchesDiv.innerHTML = `<div class="empty">No Origin data found in data/nrl/origin_results.json.</div>`;
      return;
    }

    yearSelect.innerHTML = "";
    years.forEach(y => {
      const opt = document.createElement("option");
      opt.value = y; opt.textContent = y;
      yearSelect.appendChild(opt);
    });
    yearSelect.onchange = () => loadYear(Number(yearSelect.value));

    loadYear(years[0]); // most recent year with data
  })
  .catch(() => {
    matchesDiv.innerHTML = `<div class="empty">Couldn't load data/nrl/origin_results.json.</div>`;
  });

function loadYear(year){
  currentYear = year;
  yearSelect.value = year;
  heroTitle.textContent = year + " State of Origin";

  currentMatches = allMatches
    .filter(m => m.year === year)
    .sort((a,b) => (a.game_number||0) - (b.game_number||0));

  if(!currentMatches.length){
    matchesDiv.innerHTML = `<div class="empty">No data for ${year} yet.</div>`;
    summaryDiv.innerHTML = "";
    seriesLine.textContent = "";
    return;
  }
  renderSeriesSummary();
  renderMatches();
}

function renderSeriesSummary(){
  const wins = { QLD: 0, NSW: 0 };
  let pointsFor = { QLD: 0, NSW: 0 };
  currentMatches.forEach(m => {
    if(m.winner === "QLD") wins.QLD++;
    if(m.winner === "NSW") wins.NSW++;
    pointsFor.QLD += (m.score && m.score.QLD) || 0;
    pointsFor.NSW += (m.score && m.score.NSW) || 0;
  });

  seriesLine.innerHTML = `<b>QLD ${wins.QLD}</b> &ndash; <b>NSW ${wins.NSW}</b> &middot; ${currentMatches.length} game${currentMatches.length===1?"":"s"} played`;

  const verdict = wins.QLD === wins.NSW
    ? (currentMatches.length < 3 ? "Series in progress" : "Series drawn")
    : `${TEAM_META[wins.QLD > wins.NSW ? "QLD" : "NSW"].label} win the series`;

  summaryDiv.innerHTML = `
    <div class="series-row">
      <div class="series-team"><span class="dot" style="background:${TEAM_META.QLD.colour}"></span>Queensland</div>
      <div class="series-wins" style="color:${TEAM_META.QLD.colour}">${wins.QLD}</div>
    </div>
    <div class="series-row">
      <div class="series-team"><span class="dot" style="background:${TEAM_META.NSW.colour}"></span>New South Wales</div>
      <div class="series-wins" style="color:${TEAM_META.NSW.colour}">${wins.NSW}</div>
    </div>
    <div class="series-verdict">${verdict}</div>
  `;
}

function gameLink(m){
  return `origin-game.html?year=${m.year}&game=${m.game_number || 1}`;
}

function renderMatches(){
  matchesDiv.innerHTML = currentMatches.map((m, i) => {
    const qldScore = (m.score && m.score.QLD) ?? "–";
    const nswScore = (m.score && m.score.NSW) ?? "–";
    const winnerColour = !m.winner || m.winner === "Draw" ? "transparent" : `var(--${m.winner.toLowerCase()})`;

    const line = m.winner === "QLD"
      ? `<span class="dot" style="background:var(--qld)"></span>QLD ${qldScore} def <span class="dot" style="background:var(--nsw)"></span>NSW ${nswScore}`
      : m.winner === "NSW"
      ? `<span class="dot" style="background:var(--nsw)"></span>NSW ${nswScore} def <span class="dot" style="background:var(--qld)"></span>QLD ${qldScore}`
      : `<span class="dot" style="background:var(--qld)"></span>QLD ${qldScore} drew <span class="dot" style="background:var(--nsw)"></span>NSW ${nswScore}`;

    const metaParts = [m.date, m.venue, m.referee ? `Ref: ${m.referee}` : null, m.attendance ? `Crowd: ${m.attendance.toLocaleString()}` : null].filter(Boolean);

    return `
    <div class="match" style="border-left-color:${winnerColour}" onclick="location.href='${gameLink(m)}'">
      <div class="match-head">
        <div class="round-label">Game ${m.game_number || i+1}</div>
        <div class="line1">${line}</div>
        <div class="meta">${metaParts.join(" · ")}</div>
        ${m.player_of_match ? `<div class="potm">Player of the Match: <b>${m.player_of_match}</b></div>` : ""}
      </div>
    </div>`;
  }).join("");
}
</script>
</body>
</html>
