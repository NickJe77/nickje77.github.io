<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Women's World Cup Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#f3f4f7;color:#111;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:white;border-bottom:1px solid #ddd;flex-wrap:wrap;}
.navbar a{text-decoration:none;font-weight:700;color:#0056d6;}
.hero{background:linear-gradient(135deg,#4b0082,#9b30ff);color:white;padding:70px 20px;text-align:center;}
.hero h1{margin:0;font-size:64px;font-weight:900;}
.hero p{margin-top:14px;font-size:22px;font-weight:600;opacity:.95;}
.container{max-width:1600px;margin:40px auto;padding:0 20px;}
.search-wrap{margin-bottom:28px;display:flex;justify-content:center;}
#teamSearch{width:100%;max-width:520px;padding:16px 18px;font-size:18px;border-radius:14px;border:1px solid #d7dbe3;outline:none;font-family:Inter,system-ui,Arial,sans-serif;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.05);}
#teamSearch:focus{border-color:#4b0082;box-shadow:0 0 0 4px rgba(75,0,130,.15);}
.team-count{margin-bottom:24px;font-size:18px;font-weight:700;color:#555;text-align:center;}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;}
.team-card{background:white;border-radius:18px;overflow:hidden;text-decoration:none;color:#111;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:.2s ease;display:block;}
.team-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.14);}
.team-band{height:10px;width:100%;}
.team-content{padding:28px 22px;}
.team-name{font-size:30px;font-weight:900;margin-bottom:10px;line-height:1.15;}
.team-meta{font-size:16px;color:#666;font-weight:600;}
.no-results{text-align:center;font-size:22px;font-weight:800;padding:60px 20px;color:#666;display:none;}
@media(max-width:900px){
  .hero h1{font-size:42px;}
  .hero p{font-size:18px;}
  .team-name{font-size:24px;}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/womens-wc.html">Women's WC</a>
  <a href="/womens-wc-players.html">Players</a>
  <a href="/nba.html">NBA</a>
  <a href="/afl.html">AFL</a>
</div>

<div class="hero">
  <h1>Women's World Cup Nations</h1>
  <p>Every nation to compete at the Women's World Cup</p>
</div>

<div class="container">
  <div class="search-wrap">
    <input type="text" id="teamSearch" placeholder="Search nations...">
  </div>
  <div class="team-count" id="teamCount"></div>
  <div class="teams-grid" id="teamsGrid"></div>
  <div class="no-results" id="noResults">No nations found</div>
</div>

<script>

const TEAMS = [
  { name:"Argentina",            colour:"linear-gradient(90deg,#74ACDF,#FFFFFF)" },
  { name:"Australia",            colour:"linear-gradient(90deg,#00008B,#CC0000)" },
  { name:"Austria",              colour:"linear-gradient(90deg,#CC0000,#FFFFFF)" },
  { name:"Belgium",              colour:"linear-gradient(90deg,#000000,#FFD700)" },
  { name:"Brazil",               colour:"linear-gradient(90deg,#009C3B,#FFDF00)" },
  { name:"Cameroon",             colour:"linear-gradient(90deg,#007A3D,#CE1126)" },
  { name:"Canada",               colour:"linear-gradient(90deg,#CC0000,#FFFFFF)" },
  { name:"Chile",                colour:"linear-gradient(90deg,#CC0000,#003DA5)" },
  { name:"China PR",             colour:"linear-gradient(90deg,#CC0000,#FFDE00)" },
  { name:"Colombia",             colour:"linear-gradient(90deg,#FFD700,#003087)" },
  { name:"Costa Rica",           colour:"linear-gradient(90deg,#CC0000,#003DA5)" },
  { name:"Denmark",              colour:"linear-gradient(90deg,#CC0000,#FFFFFF)" },
  { name:"England",              colour:"linear-gradient(90deg,#CC0000,#FFFFFF)" },
  { name:"Finland",              colour:"linear-gradient(90deg,#003580,#FFFFFF)" },
  { name:"France",               colour:"linear-gradient(90deg,#002395,#ED2939)" },
  { name:"Germany",              colour:"linear-gradient(90deg,#000000,#CC0000)" },
  { name:"Ghana",                colour:"linear-gradient(90deg,#006B3F,#FCD116)" },
  { name:"Haiti",                colour:"linear-gradient(90deg,#00209F,#D21034)" },
  { name:"Ireland",              colour:"linear-gradient(90deg,#169B62,#FFFFFF)" },
  { name:"Italy",                colour:"linear-gradient(90deg,#003DA5,#FFFFFF)" },
  { name:"Jamaica",              colour:"linear-gradient(90deg,#000000,#FFD700)" },
  { name:"Japan",                colour:"linear-gradient(90deg,#BC002D,#FFFFFF)" },
  { name:"Morocco",              colour:"linear-gradient(90deg,#CC0000,#006233)" },
  { name:"Netherlands",          colour:"linear-gradient(90deg,#FF6600,#003DA5)" },
  { name:"New Zealand",          colour:"linear-gradient(90deg,#000000,#FFFFFF)" },
  { name:"Nigeria",              colour:"linear-gradient(90deg,#008751,#FFFFFF)" },
  { name:"Norway",               colour:"linear-gradient(90deg,#CC0000,#003DA5)" },
  { name:"Panama",               colour:"linear-gradient(90deg,#CC0000,#003DA5)" },
  { name:"Philippines",          colour:"linear-gradient(90deg,#003DA5,#CC0000)" },
  { name:"Portugal",             colour:"linear-gradient(90deg,#006600,#CC0000)" },
  { name:"Republic of Ireland",  colour:"linear-gradient(90deg,#169B62,#FFFFFF)" },
  { name:"South Africa",         colour:"linear-gradient(90deg,#007A4D,#FFB612)" },
  { name:"South Korea",          colour:"linear-gradient(90deg,#CC0000,#003DA5)" },
  { name:"Spain",                colour:"linear-gradient(90deg,#CC0000,#F1BF00)" },
  { name:"Sweden",               colour:"linear-gradient(90deg,#006AA7,#FECC02)" },
  { name:"Switzerland",          colour:"linear-gradient(90deg,#CC0000,#FFFFFF)" },
  { name:"Tanzania",             colour:"linear-gradient(90deg,#009900,#000000)" },
  { name:"United States",        colour:"linear-gradient(90deg,#002868,#BF0A30)" },
  { name:"Vietnam",              colour:"linear-gradient(90deg,#CC0000,#FFCD00)" },
  { name:"Zambia",               colour:"linear-gradient(90deg,#198A00,#EF7D00)" },
];

const grid      = document.getElementById("teamsGrid");
const search    = document.getElementById("teamSearch");
const count     = document.getElementById("teamCount");
const noResults = document.getElementById("noResults");

function renderTeams(filter=""){
  grid.innerHTML = "";

  const filtered = TEAMS
    .sort((a,b) => a.name.localeCompare(b.name))
    .filter(team => team.name.toLowerCase().includes(filter.toLowerCase()));

  count.innerHTML = `${filtered.length} Nations`;

  if(filtered.length === 0){
    noResults.style.display = "block";
    return;
  }

  noResults.style.display = "none";

  filtered.forEach(team => {
    grid.innerHTML += `
      <a class="team-card" href="/womens-wc-team.html?team=${encodeURIComponent(team.name)}">
        <div class="team-band" style="background:${team.colour};"></div>
        <div class="team-content">
          <div class="team-name">${team.name}</div>
          <div class="team-meta">View nation stats, results and players</div>
        </div>
      </a>
    `;
  });
}

search.addEventListener("input", e => renderTeams(e.target.value));

renderTeams();

</script>
</body>
</html>
