<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>NHL Season | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8J9ZPKDDH"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N8J9ZPKDDH');</script>
  <link rel="stylesheet" href="style.css">
  <style>
  body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f4f6f8;}
  .navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;position:sticky;top:0;z-index:100;}
  .navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
  .navbar a:hover{text-decoration:underline;}
  .page-wrap{max-width:1200px;margin:0 auto;padding:0 20px 60px;}
  .hero{background:linear-gradient(135deg,#041E42,#0072CE);color:white;padding:48px 20px 40px;text-align:center;margin-bottom:30px;}
  .hero h1{margin:0;font-size:52px;font-weight:900;letter-spacing:-2px;}
  .hero p{margin:10px 0 0;font-size:17px;opacity:.88;font-weight:600;}
  .prev-next{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .prev-next a{color:#0056d6;text-decoration:none;font-weight:700;font-size:15px;}
  .prev-next a:hover{text-decoration:underline;}
  .prev-next span{font-size:18px;font-weight:800;color:#111;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px;}
  .stat-box{background:white;border-radius:14px;padding:18px 14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .stat-box b{display:block;font-size:11px;color:#0056d6;text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:8px;}
  .stat-num{font-size:36px;font-weight:900;line-height:1;color:#111;}
  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px;}
  .tabs{display:flex;gap:8px;}
  .tab{padding:9px 20px;border-radius:30px;border:2px solid #041E42;background:white;color:#041E42;font-size:13px;font-weight:800;cursor:pointer;transition:.15s;text-transform:uppercase;}
  .tab.active{background:#041E42;color:white;}
  .tab:hover:not(.active){background:#e8f0fc;}
  .controls select{padding:9px 14px;border-radius:12px;border:1px solid #ddd;font-size:14px;font-weight:700;background:white;cursor:pointer;}
  .section{background:white;border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .section-title{font-size:19px;font-weight:900;margin:0 0 16px;border-left:5px solid #0056d6;padding-left:12px;color:#111;}
  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid #dce3ec;}
  table{width:100%;border-collapse:collapse;background:white;}
  th{background:#041E42;color:white;padding:12px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;text-align:left;white-space:nowrap;}
  td{padding:11px 10px;border-bottom:1px solid #edf2f7;font-size:14px;font-weight:500;}
  tr:nth-child(even) td{background:#f4f8fd;}
  tr:hover td{background:#e8f2ff;}
  .score{font-weight:900;text-align:center;}
  .team-link{color:#0056d6;font-weight:700;text-decoration:none;}
  .team-link:hover{text-decoration:underline;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;}
  .badge-reg{background:#e8f0fc;color:#0056d6;}
  .badge-po{background:#fde8e8;color:#c00;}
  .loading{text-align:center;padding:60px;font-size:18px;font-weight:700;color:#555;}
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="nba.html">NBA</a>
  <a href="nhl.html">NHL</a>
</div>

<div class="hero">
  <h1 id="heroTitle">NHL Season</h1>
  <p id="heroSub">&nbsp;</p>
</div>

<div class="page-wrap">
  <div class="prev-next">
    <a id="prevLink" href="#">&larr; Previous</a>
    <span id="seasonLabel"></span>
    <a id="nextLink" href="#">Next &rarr;</a>
  </div>

  <div class="stat-grid" id="statGrid"><div class="loading">Loading...</div></div>

  <div class="controls">
    <div class="tabs">
      <button class="tab active" onclick="setTab('results',this)">Results</button>
    </div>
    <select id="teamFilter" onchange="renderResults()"><option value="">All Teams</option></select>
    <select id="typeFilter" onchange="renderResults()">
      <option value="">All Games</option>
      <option value="R">Regular Season</option>
      <option value="P">Playoffs</option>
    </select>
  </div>

  <div id="resultsSection" class="section">
    <div class="section-title">Results</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Home</th><th style="text-align:center">Score</th><th>Away</th><th>Venue</th><th>Type</th>
        </tr></thead>
        <tbody id="resultsBody"><tr><td colspan="6" class="loading">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>


</div>

<script>
var params = new URLSearchParams(window.location.search);
var season = parseInt(params.get('season') || '2024');
var allGames = [];
var currentTab = 'results';

var TEAM_NAMES = {
  "ANA":"Anaheim Ducks","ARI":"Arizona Coyotes","ATL":"Atlanta Thrashers",
  "BOS":"Boston Bruins","BUF":"Buffalo Sabres","CGY":"Calgary Flames",
  "CAR":"Carolina Hurricanes","CHI":"Chicago Blackhawks","COL":"Colorado Avalanche",
  "CBJ":"Columbus Blue Jackets","DAL":"Dallas Stars","DET":"Detroit Red Wings",
  "EDM":"Edmonton Oilers","FLA":"Florida Panthers","LAK":"Los Angeles Kings",
  "MIN":"Minnesota Wild","MTL":"Montreal Canadiens","NSH":"Nashville Predators",
  "NJD":"New Jersey Devils","NYI":"New York Islanders","NYR":"New York Rangers",
  "OTT":"Ottawa Senators","PHI":"Philadelphia Flyers","PHX":"Phoenix Coyotes",
  "PIT":"Pittsburgh Penguins","SJS":"San Jose Sharks","SEA":"Seattle Kraken",
  "STL":"St. Louis Blues","TBL":"Tampa Bay Lightning","TOR":"Toronto Maple Leafs",
  "UTA":"Utah Hockey Club","VAN":"Vancouver Canucks","VGK":"Vegas Golden Knights",
  "WSH":"Washington Capitals","WPG":"Winnipeg Jets",
  "QUE":"Quebec Nordiques","HFD":"Hartford Whalers","MNS":"Minnesota North Stars",
  "KCS":"Kansas City Scouts","CLR":"Colorado Rockies","OAK":"Oakland Seals",
  "CAL":"California Golden Seals","CLE":"Cleveland Barons","ATF":"Atlanta Flames"
};

function tn(code){ return TEAM_NAMES[code] || code; }

var seasonLabel = season + '\u2013' + String(season+1).slice(2);
document.getElementById('heroTitle').innerText = 'NHL ' + seasonLabel;
document.getElementById('seasonLabel').innerText = seasonLabel;
document.title = 'NHL ' + seasonLabel + ' Season | The Sporting Almanac';
document.getElementById('prevLink').href = '/nhl-season.html?season=' + (season-1);
document.getElementById('nextLink').href = '/nhl-season.html?season=' + (season+1);
document.getElementById('prevLink').innerText = '\u2190 ' + (season-1) + '\u2013' + String(season).slice(2);
document.getElementById('nextLink').innerText = (season+1) + '\u2013' + String(season+2).slice(2) + ' \u2192';

function setTab(tab,el){}

fetch('/data/nhl/seasons/' + season + '.json')
  .then(function(r){ return r.json(); })
  .then(function(games){
    allGames = games;
    var reg = games.filter(function(g){ return gameType(g) === 'R'; });
    var po  = games.filter(function(g){ return gameType(g) === 'P'; });
    var goals = games.reduce(function(s,g){ return s + (g.home_score||0) + (g.away_score||0); }, 0);
    var avg = games.length ? (goals/games.length).toFixed(1) : '–';

    document.getElementById('heroSub').innerText =
      reg.length + ' regular season · ' + po.length + ' playoff games';

    document.getElementById('statGrid').innerHTML =
      sbox('Total Games', games.length) +
      sbox('Regular Season', reg.length) +
      sbox('Playoff Games', po.length) +
      sbox('Total Goals', goals.toLocaleString()) +
      sbox('Goals / Game', avg);

    var teams = {};
    games.forEach(function(g){
      if(g.home_team) teams[g.home_team] = 1;
      if(g.away_team) teams[g.away_team] = 1;
    });
    var tf = document.getElementById('teamFilter');
    Object.keys(teams).sort().forEach(function(t){
      tf.innerHTML += '<option value="'+t+'">'+tn(t)+'</option>';
    });
    renderResults();
  })
  .catch(function(){
    document.getElementById('resultsBody').innerHTML = '<tr><td colspan="6" style="text-align:center">Failed to load data.</td></tr>';
  });

function sbox(label, val){
  return '<div class="stat-box"><b>'+label+'</b><div class="stat-num">'+val+'</div></div>';
}

function gameType(g){
  if(g.game_type) return g.game_type;
  // Derive from game_id: digits 4-5 (0-indexed) = '02' regular, '03' playoff
  var id = String(g.game_id || '');
  return id.slice(4,6) === '03' ? 'P' : 'R';
}

function getFiltered(){
  var tv = document.getElementById('teamFilter').value;
  var ty = document.getElementById('typeFilter').value;
  return allGames.filter(function(g){
    if(tv && g.home_team !== tv && g.away_team !== tv) return false;
    if(ty && gameType(g) !== ty) return false;
    return true;
  });
}

function renderResults(){
  var games = getFiltered();
  if(!games.length){
    document.getElementById('resultsBody').innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888">No games match this filter.</td></tr>';
    return;
  }
  var rows = games.map(function(g){
    var score = (g.home_score != null && g.away_score != null) ? g.home_score + ' – ' + g.away_score : '–';
    var badge = gameType(g) === 'P'
      ? '<span class="badge badge-po">Playoff</span>'
      : '<span class="badge badge-reg">Regular</span>';
    return '<tr>' +
      '<td><a class="team-link" href="/nhl-team.html?team='+encodeURIComponent(g.home_team)+'">'+tn(g.home_team)+'</a></td>' +
      '<td class="score">'+score+'</td>' +
      '<td><a class="team-link" href="/nhl-team.html?team='+encodeURIComponent(g.away_team)+'">'+tn(g.away_team)+'</a></td>' +
      '<td style="color:#888;font-size:13px">'+(g.venue||'')+'</td>' +
      '<td>'+badge+'</td>' +
      '</tr>';
  }).join('');
  document.getElementById('resultsBody').innerHTML = rows;
}

function renderStandings(){
  var reg = allGames.filter(function(g){ return gameType(g) === 'R'; });
  var rec = {};
  reg.forEach(function(g){
    if(!g.home_team||!g.away_team) return;
    [g.home_team,g.away_team].forEach(function(t){
      if(!rec[t]) rec[t]={w:0,l:0,pts:0,gf:0,ga:0,gp:0};
    });
    var hs=g.home_score, as=g.away_score;
    if(hs==null||as==null) return;
    rec[g.home_team].gp++; rec[g.away_team].gp++;
    rec[g.home_team].gf+=hs; rec[g.home_team].ga+=as;
    rec[g.away_team].gf+=as; rec[g.away_team].ga+=hs;
    if(hs>as){ rec[g.home_team].w++; rec[g.away_team].l++; rec[g.home_team].pts+=2; }
    else if(as>hs){ rec[g.away_team].w++; rec[g.home_team].l++; rec[g.away_team].pts+=2; }
    else { rec[g.home_team].pts++; rec[g.away_team].pts++; }
  });
  var sorted = Object.keys(rec).map(function(t){ return Object.assign({team:t},rec[t]); })
    .sort(function(a,b){ return b.pts-a.pts||b.w-a.w; });
  document.getElementById('standingsBody').innerHTML = sorted.map(function(r,i){
    return '<tr>'+
      '<td>'+(i+1)+'</td>'+
      '<td><a class="team-link" href="/nhl-team.html?team='+encodeURIComponent(r.team)+'">'+tn(r.team)+'</a></td>'+
      '<td>'+r.gp+'</td><td>'+r.w+'</td><td>'+r.l+'</td>'+
      '<td><b>'+r.pts+'</b></td>'+
      '<td>'+r.gf+'</td><td>'+r.ga+'</td><td>'+(r.gf-r.ga)+'</td>'+
      '</tr>';
  }).join('');
}
</script>
</body>
</html>
