<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>NHL Season | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8J9ZPKDDH"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N8J9ZPKDDH');</script>

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;position:sticky;top:0;z-index:100;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:44px 20px;text-align:center;margin-bottom:26px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(30px,6vw,46px);
  letter-spacing:.01em;text-transform:uppercase;
}
.hero p{margin:8px 0 0;font-size:14.5px;color:rgba(255,255,255,.68);}

.prev-next{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.prev-next a{color:var(--ink);text-decoration:none;font-weight:700;font-size:13.5px;}
.prev-next a:hover{color:var(--accent);}
.prev-next span{
  font-family:var(--display);font-size:16px;font-weight:600;color:var(--ink);
  letter-spacing:.01em;text-transform:uppercase;
}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px;}
.stat-box{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 14px;text-align:center;
}
.stat-box b{
  display:block;font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;font-weight:600;margin-bottom:8px;font-family:var(--body);
}
.stat-num{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;color:var(--ink);}

.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px;}
.tabs{display:flex;gap:8px;}
.tab{
  padding:9px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  text-transform:uppercase;letter-spacing:.02em;font-family:var(--body);
}
.tab.active{background:var(--board);color:#fff;border-color:var(--board);}
.tab:hover:not(.active){border-color:var(--faint);}
.controls select{
  padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;
  font-weight:600;background:var(--surface);cursor:pointer;font-family:var(--body);color:var(--ink);
}
.controls select:hover{border-color:var(--faint);}
.controls select:focus{outline:none;border-color:var(--accent);}

.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
.section-title{
  font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 16px;
  border-left:4px solid var(--accent);padding-left:12px;color:var(--ink);
  text-transform:uppercase;letter-spacing:.01em;
}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;background:var(--surface);}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;text-align:left;white-space:nowrap;
  font-family:var(--body);border-bottom:1px solid var(--line);
}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tr:hover td{background:#f9fbfd;}
.score{font-weight:700;text-align:center;color:var(--ink);}
.team-link{color:var(--ink);font-weight:700;text-decoration:none;}
.team-link:hover{color:var(--accent);}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:10.5px;font-weight:700;text-transform:uppercase;}
.badge-reg{background:var(--accent-soft);color:var(--ink);}
.badge-po{background:#fbe7e5;color:#c0362c;}
.loading{text-align:center;padding:60px;font-size:15px;font-weight:600;color:var(--muted);}
</style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="nba.html">NBA</a>
  <a href="nhl.html">NHL</a>
</div>

<div class="hero">
  <h1 id="heroTitle">NHL Season</h1>
  <p id="heroSub">&nbsp;</p>
</div>

<div class="page-wrap">
  <div class="prev-next">
    <a id="prevLink" href="#">&larr; Previous</a>
    <span id="seasonLabel"></span>
    <a id="nextLink" href="#">Next &rarr;</a>
  </div>

  <div class="stat-grid" id="statGrid"><div class="loading">Loading...</div></div>

  <div class="controls">
    <div class="tabs">
      <button class="tab active" onclick="setTab('results',this)">Results</button>
    </div>
    <select id="teamFilter" onchange="renderResults()"><option value="">All Teams</option></select>
    <select id="typeFilter" onchange="renderResults()">
      <option value="">All Games</option>
      <option value="R">Regular Season</option>
      <option value="P">Playoffs</option>
    </select>
  </div>

  <div id="resultsSection" class="section">
    <div class="section-title">Results</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Home</th><th style="text-align:center">Score</th><th>Away</th><th>Venue</th><th>Type</th>
        </tr></thead>
        <tbody id="resultsBody"><tr><td colspan="6" class="loading">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>


</div>

<script>
var params = new URLSearchParams(window.location.search);
var season = parseInt(params.get('season') || '2024');
var allGames = [];
var currentTab = 'results';

var TEAM_NAMES = {
  "ANA":"Anaheim Ducks","ARI":"Arizona Coyotes","ATL":"Atlanta Thrashers",
  "BOS":"Boston Bruins","BUF":"Buffalo Sabres","CGY":"Calgary Flames",
  "CAR":"Carolina Hurricanes","CHI":"Chicago Blackhawks","COL":"Colorado Avalanche",
  "CBJ":"Columbus Blue Jackets","DAL":"Dallas Stars","DET":"Detroit Red Wings",
  "EDM":"Edmonton Oilers","FLA":"Florida Panthers","LAK":"Los Angeles Kings",
  "MIN":"Minnesota Wild","MTL":"Montreal Canadiens","NSH":"Nashville Predators",
  "NJD":"New Jersey Devils","NYI":"New York Islanders","NYR":"New York Rangers",
  "OTT":"Ottawa Senators","PHI":"Philadelphia Flyers","PHX":"Phoenix Coyotes",
  "PIT":"Pittsburgh Penguins","SJS":"San Jose Sharks","SEA":"Seattle Kraken",
  "STL":"St. Louis Blues","TBL":"Tampa Bay Lightning","TOR":"Toronto Maple Leafs",
  "UTA":"Utah Hockey Club","VAN":"Vancouver Canucks","VGK":"Vegas Golden Knights",
  "WSH":"Washington Capitals","WPG":"Winnipeg Jets",
  "QUE":"Quebec Nordiques","HFD":"Hartford Whalers","MNS":"Minnesota North Stars",
  "KCS":"Kansas City Scouts","CLR":"Colorado Rockies","OAK":"Oakland Seals",
  "CAL":"California Golden Seals","CLE":"Cleveland Barons","ATF":"Atlanta Flames"
};

function tn(code){ return TEAM_NAMES[code] || code; }

var seasonLabel = season + '\u2013' + String(season+1).slice(2);
document.getElementById('heroTitle').innerText = 'NHL ' + seasonLabel;
document.getElementById('seasonLabel').innerText = seasonLabel;
document.title = 'NHL ' + seasonLabel + ' Season | The Sporting Almanac';
document.getElementById('prevLink').href = '/nhl-season.html?season=' + (season-1);
document.getElementById('nextLink').href = '/nhl-season.html?season=' + (season+1);
document.getElementById('prevLink').innerText = '\u2190 ' + (season-1) + '\u2013' + String(season).slice(2);
document.getElementById('nextLink').innerText = (season+1) + '\u2013' + String(season+2).slice(2) + ' \u2192';

function setTab(tab,el){}

fetch('/data/nhl/seasons/' + season + '.json')
  .then(function(r){ return r.json(); })
  .then(function(games){
    allGames = games;
    var reg = games.filter(function(g){ return gameType(g) === 'R'; });
    var po  = games.filter(function(g){ return gameType(g) === 'P'; });
    var goals = games.reduce(function(s,g){ return s + (g.home_score||0) + (g.away_score||0); }, 0);
    var avg = games.length ? (goals/games.length).toFixed(1) : '–';

    document.getElementById('heroSub').innerText =
      reg.length + ' regular season · ' + po.length + ' playoff games';

    document.getElementById('statGrid').innerHTML =
      sbox('Total Games', games.length) +
      sbox('Regular Season', reg.length) +
      sbox('Playoff Games', po.length) +
      sbox('Total Goals', goals.toLocaleString()) +
      sbox('Goals / Game', avg);

    var teams = {};
    games.forEach(function(g){
      if(g.home_team) teams[g.home_team] = 1;
      if(g.away_team) teams[g.away_team] = 1;
    });
    var tf = document.getElementById('teamFilter');
    Object.keys(teams).sort().forEach(function(t){
      tf.innerHTML += '<option value="'+t+'">'+tn(t)+'</option>';
    });
    renderResults();
  })
  .catch(function(){
    document.getElementById('resultsBody').innerHTML = '<tr><td colspan="6" style="text-align:center">Failed to load data.</td></tr>';
  });

function sbox(label, val){
  return '<div class="stat-box"><b>'+label+'</b><div class="stat-num">'+val+'</div></div>';
}

function gameType(g){
  if(g.game_type) return g.game_type;
  // Derive from game_id: digits 4-5 (0-indexed) = '02' regular, '03' playoff
  var id = String(g.game_id || '');
  return id.slice(4,6) === '03' ? 'P' : 'R';
}

function getFiltered(){
  var tv = document.getElementById('teamFilter').value;
  var ty = document.getElementById('typeFilter').value;
  return allGames.filter(function(g){
    if(tv && g.home_team !== tv && g.away_team !== tv) return false;
    if(ty && gameType(g) !== ty) return false;
    return true;
  });
}

function renderResults(){
  var games = getFiltered();
  if(!games.length){
    document.getElementById('resultsBody').innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888">No games match this filter.</td></tr>';
    return;
  }
  var rows = games.map(function(g){
    var score = (g.home_score != null && g.away_score != null) ? g.home_score + ' – ' + g.away_score : '–';
    var badge = gameType(g) === 'P'
      ? '<span class="badge badge-po">Playoff</span>'
      : '<span class="badge badge-reg">Regular</span>';
    return '<tr style="cursor:pointer" onclick="window.location.href=\''+'/nhl-game.html?game='+g.game_id+'\'">'+
      '<td><a class="team-link" href="/nhl-franchise.html?team='+encodeURIComponent(g.home_team)+'">'+tn(g.home_team)+'</a></td>' +
      '<td class="score">'+score+'</td>' +
      '<td><a class="team-link" href="/nhl-franchise.html?team='+encodeURIComponent(g.away_team)+'">'+tn(g.away_team)+'</a></td>' +
      '<td style="color:#888;font-size:13px">'+(g.venue||'')+'</td>' +
      '<td>'+badge+'</td>' +
      '</tr>';
  }).join('');
  document.getElementById('resultsBody').innerHTML = rows;
}

function renderStandings(){
  var reg = allGames.filter(function(g){ return gameType(g) === 'R'; });
  var rec = {};
  reg.forEach(function(g){
    if(!g.home_team||!g.away_team) return;
    [g.home_team,g.away_team].forEach(function(t){
      if(!rec[t]) rec[t]={w:0,l:0,pts:0,gf:0,ga:0,gp:0};
    });
    var hs=g.home_score, as=g.away_score;
    if(hs==null||as==null) return;
    rec[g.home_team].gp++; rec[g.away_team].gp++;
    rec[g.home_team].gf+=hs; rec[g.home_team].ga+=as;
    rec[g.away_team].gf+=as; rec[g.away_team].ga+=hs;
    if(hs>as){ rec[g.home_team].w++; rec[g.away_team].l++; rec[g.home_team].pts+=2; }
    else if(as>hs){ rec[g.away_team].w++; rec[g.home_team].l++; rec[g.away_team].pts+=2; }
    else { rec[g.home_team].pts++; rec[g.away_team].pts++; }
  });
  var sorted = Object.keys(rec).map(function(t){ return Object.assign({team:t},rec[t]); })
    .sort(function(a,b){ return b.pts-a.pts||b.w-a.w; });
  document.getElementById('standingsBody').innerHTML = sorted.map(function(r,i){
    return '<tr>'+
      '<td>'+(i+1)+'</td>'+
      '<td><a class="team-link" href="/nhl-team.html?team='+encodeURIComponent(r.team)+'">'+tn(r.team)+'</a></td>'+
      '<td>'+r.gp+'</td><td>'+r.w+'</td><td>'+r.l+'</td>'+
      '<td><b>'+r.pts+'</b></td>'+
      '<td>'+r.gf+'</td><td>'+r.ga+'</td><td>'+(r.gf-r.ga)+'</td>'+
      '</tr>';
  }).join('');
}
</script>
</body>
</html>
