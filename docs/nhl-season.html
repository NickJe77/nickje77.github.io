<!DOCTYPE html>
<html>
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NHL Season</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(135deg,#041E42,#0072CE);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th{
background:#041E42;
color:white;
padding:10px;
}

td{
padding:8px;
}

tr:nth-child(even){
background:#e9f2ff;
}

tr{
cursor:pointer;
}

tr:hover{
background:#cfe2ff;
}

</style>
</head>
<body>

<div class="page">

<div id="hero" class="hero"></div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th></th>
<th>Home</th>
</tr>
</thead>

<tbody id="games"></tbody>

</table>

</div>

<script>

function getSeason(){
const url=new URLSearchParams(window.location.search);
return url.get("season");
}

function formatDate(d){
if(!d) return "";
return d;
}

async function loadSeason(){

const season=getSeason();

const res=await fetch(`/data/nhl/seasons/${season}.json`);

const data=await res.json();

document.getElementById("hero").innerHTML=`<h1>${season} NHL Season</h1>`;

const tbody=document.getElementById("games");

tbody.innerHTML="";

/* 🔥 SORT — newest first, nulls last */
data.sort((a,b)=>{
if(!a.date && !b.date) return 0;
if(!a.date) return 1;
if(!b.date) return -1;
return new Date(b.date) - new Date(a.date);
});

data.forEach(game=>{

const tr=document.createElement("tr");

tr.onclick=()=>{
location.href=`nhl-game.html?id=${game.game_id}&season=${season}`;
};

tr.innerHTML=`

<td>${formatDate(game.date)}</td>
<td>${game.away_team}</td>
<td>${game.away_score} - ${game.home_score}</td>
<td>${game.home_team}</td>

`;

tbody.appendChild(tr);

});

}

loadSeason();

</script>

</body>
</html>
