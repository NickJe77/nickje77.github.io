<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f3f4f7;
}


/* NAVBAR */

.navbar{
  display:flex;
  justify-content:center;
  gap:28px;
  padding:18px;
  background:#ffffff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}


/* HERO — RED THEME */

.hero{
  width:90%;
  margin:30px auto;
  height:260px;
  border-radius:20px;
  overflow:hidden;
  position:relative;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, rgba(106,4,15,0.85), rgba(208,0,0,0.75));
}

.hero-text{
  position:absolute;
  bottom:30px;
  left:40px;
  color:white;
}

.hero-text h1{
  margin:0;
  font-size:44px;
}


/* TABLE */

.container{
  width:90%;
  margin:30px auto;
}

.table-wrap{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid #eee;
}

tr:nth-child(even){
  background:#fafafa;
}


/* TEAM CELL */

.team{
  display:flex;
  align-items:center;
  gap:10px;
}

.flag{
  width:26px;
  height:18px;
  object-fit:cover;
  border-radius:3px;
  border:1px solid #ccc;
}


/* LINK */

.link{
  color:#d00000;
  font-weight:600;
  text-decoration:none;
}

.link:hover{
  text-decoration:underline;
}


/* LOADING */

.loading{
  padding:30px;
  text-align:center;
  font-size:18px;
}

</style>
</head>

<body>


<div class="navbar">

<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>

</div>


<div class="hero">

<img src="images/t20wc-hero.jpg">

<div class="hero-overlay"></div>

<div class="hero-text">
<h1>T20 World Cup Finals</h1>
</div>

</div>


<div class="container">

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Year</th>
<th>Winner</th>
<th>Score</th>
<th>Runner-Up</th>
<th>Score</th>
<th>Margin</th>
<th>Venue</th>
<th>Scorecard</th>

</tr>

</thead>

<tbody id="body">

<tr>
<td colspan="8" class="loading">
Data loading...
</td>
</tr>

</tbody>

</table>

</div>

</div>


<script>

const INDEX =
"data/t20-world-cup/matches/index.json";

const FOLDER =
"data/t20-world-cup/matches/";


function flag(team){

return "images/flags/" + team + ".png";

}


function score(match, team){

for(const inn of match.innings){

const t = Object.keys(inn)[0];

if(t === team){

return inn[t].runs + "-" + inn[t].wickets;

}

}

return "";

}


async function load(){

const res =
await fetch(INDEX);

const files =
await res.json();

const finals = [];

for(const file of files){

const r =
await fetch(FOLDER + file);

const match =
await r.json();


if(
match.info.event?.match_number === "Final"
||
match.info.stage === "Final"
){

finals.push(match);

}

}


render(finals);

}


function render(finals){

const body =
document.getElementById("body");

body.innerHTML = "";


finals.sort((a,b)=>

new Date(b.info.dates[0])
-
new Date(a.info.dates[0])

);


for(const m of finals){

const info =
m.info;

const year =
new Date(info.dates[0])
.getFullYear();

const winner =
info.outcome.winner;

const runner =
info.teams.find(
t=>t!==winner
);

const wScore =
score(m,winner);

const rScore =
score(m,runner);

let margin="";

if(info.outcome.by?.runs)
margin =
info.outcome.by.runs
+ " runs";

if(info.outcome.by?.wickets)
margin =
info.outcome.by.wickets
+ " wickets";


const tr =
document.createElement("tr");

tr.innerHTML = `

<td>${year}</td>

<td>
<div class="team">
<img class="flag"
src="${flag(winner)}">
${winner}
</div>
</td>

<td>${wScore}</td>

<td>
<div class="team">
<img class="flag"
src="${flag(runner)}">
${runner}
</div>
</td>

<td>${rScore}</td>

<td>${margin}</td>

<td>${info.venue}</td>

<td>
<a class="link"
href="t20-match.html?matchId=${year}">
View
</a>
</td>

`;

body.appendChild(tr);

}

}


load();

</script>


</body>
</html>
