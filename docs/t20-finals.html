<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#8b0000,#e10600);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:25px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
}

th{
  background:#e10600;
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
}

tbody tr:nth-child(even){
  background:#eaf3ff;
}

tbody tr{
  cursor:pointer;
}

tbody tr:hover{
  background:#d8e8ff;
}

.team{
  font-weight:700;
}

.margin{
  font-weight:700;
  color:#0a4;
}

</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1>T20 World Cup Finals</h1>
</div>

<table>

<thead>
<tr>
  <th>Year</th>
  <th>Winner</th>
  <th>Runner-up</th>
  <th>Margin</th>
  <th>Venue</th>
</tr>
</thead>

<tbody id="finalsTable">
<tr><td colspan="5">Loading finals...</td></tr>
</tbody>

</table>

</div>

<script>

// REAL ICC MEN'S T20 WORLD CUP YEARS ONLY
const YEARS = [2007,2009,2010,2012,2014,2016,2021,2022,2024];

// Hardcode finalists so we never accidentally grab qualifiers / random finals
const FINALISTS = {
  2007:["India","Pakistan"],
  2009:["Pakistan","Sri Lanka"],
  2010:["England","Australia"],
  2012:["West Indies","Sri Lanka"],
  2014:["Sri Lanka","India"],
  2016:["West Indies","England"],
  2021:["Australia","New Zealand"],
  2022:["England","Pakistan"],
  2024:["India","South Africa"]
};

const table = document.getElementById("finalsTable");
table.innerHTML = "";

loadFinals();

async function loadFinals(){

for(const year of YEARS){

try{

const file = `data/t20-world-cup/matches/t20wc_${year}_FULL.json`;

const res = await fetch(file);

if(!res.ok) continue;

const matches = await res.json();

const pair = FINALISTS[year];

const match = matches.find(m =>
m.info?.teams?.includes(pair[0]) &&
m.info?.teams?.includes(pair[1])
);

if(!match) continue;

const venue = match.info.venue || "";

const outcome = match.info.outcome || {};

const winner = outcome.winner || pair[0];
const runner = (match.info.teams || pair).find(t => t !== winner) || pair[1];

const margin = formatMargin(outcome, winner);

const tr = document.createElement("tr");

tr.innerHTML = `
<td>${year}</td>
<td class="team">${winner}</td>
<td class="team">${runner}</td>
<td class="margin">${margin}</td>
<td>${venue}</td>
`;

// Keep your existing click behaviour (uses your match page)
tr.onclick = () => {
  const matchId = match.info.match_id || "";
  window.location.href =
    `t20-world-cup-match.html?file=${encodeURIComponent(file)}&match=${encodeURIComponent(String(matchId))}`;
};

table.appendChild(tr);

}catch(e){
  // ignore year
}

}

if(!table.children.length){
  table.innerHTML = `<tr><td colspan="5">No finals found.</td></tr>`;
}

}

function formatMargin(outcome, winner){

if(outcome.by?.runs !== undefined && outcome.by?.runs !== null)
return `${winner} won by ${outcome.by.runs} runs`;

if(outcome.by?.wickets !== undefined && outcome.by?.wickets !== null)
return `${winner} won by ${outcome.by.wickets} wickets`;

const r = (outcome.result || "").toString().trim();
return r;

}

</script>

</body>
</html>
