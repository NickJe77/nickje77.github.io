<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:40px;
border-radius:22px;
margin-bottom:25px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:12px;
overflow:hidden;
}

th{
background:#e10600;
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

tbody tr{
cursor:pointer;
}

tbody tr:hover{
background:#d8e8ff;
}

.team{font-weight:700;}
.score{font-weight:600;}
.margin{font-weight:700;color:#0a4;}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1>T20 World Cup Finals</h1>
</div>

<table>

<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Score</th>
<th>Runner-up</th>
<th>Score</th>
<th>Margin</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="finalsTable">
<tr><td colspan="7">Loading finals...</td></tr>
</tbody>

</table>

</div>

<script>

const YEARS = [
2007,
2009,
2010,
2012,
2014,
2016,
2021,
2022,
2024
];

const FINALISTS = {

2007:["India","Pakistan"],
2009:["Pakistan","Sri Lanka"],
2010:["England","Australia"],
2012:["West Indies","Sri Lanka"],
2014:["Sri Lanka","India"],
2016:["West Indies","England"],
2021:["Australia","New Zealand"],
2022:["England","Pakistan"],
2024:["India","South Africa"]

};

const table=document.getElementById("finalsTable");
table.innerHTML="";

loadFinals();

async function loadFinals(){

for(const year of YEARS){

try{

const file=`data/t20-world-cup/matches/t20wc_${year}_FULL.json`;

const res=await fetch(file);

if(!res.ok) continue;

const matches=await res.json();

const finalists=FINALISTS[year];

const match=matches.find(m =>
m.info &&
m.info.teams &&
m.info.teams.includes(finalists[0]) &&
m.info.teams.includes(finalists[1])
);

if(!match) continue;

const teams=match.info.teams;

const scoreA=getScore(match,teams[0]);
const scoreB=getScore(match,teams[1]);

const winner=getWinner(match,teams,scoreA,scoreB);

const loser=teams.find(t=>t!==winner);

const winnerScore=
winner===teams[0]?scoreA:scoreB;

const loserScore=
winner===teams[0]?scoreB:scoreA;

const margin=getMargin(match);

const venue=match.info.venue || "";

const tr=document.createElement("tr");

tr.innerHTML=
`<td>${year}</td>
<td class="team">${winner}</td>
<td class="score">${winnerScore}</td>
<td class="team">${loser}</td>
<td class="score">${loserScore}</td>
<td class="margin">${margin}</td>
<td>${venue}</td>`;

tr.onclick=()=>{
window.location.href=
`t20-world-cup-match.html?file=${file}&match=${match.info.match_id||""}`;
};

table.appendChild(tr);

}catch(e){}

}

}

// SAFE SCORE EXTRACTION

function getScore(match,team){

if(!match.innings) return "";

for(const inn of match.innings){

const data=Object.values(inn)[0];

if(data.team===team){

return `${data.runs}/${data.wickets}`;

}

}

return "";

}

// SAFE WINNER EXTRACTION

function getWinner(match,teams,scoreA,scoreB){

// method 1
if(match.info.outcome?.winner)
return match.info.outcome.winner;

// method 2 derive from runs
const runsA=parseInt(scoreA);
const runsB=parseInt(scoreB);

if(!isNaN(runsA)&&!isNaN(runsB)){

if(runsA>runsB) return teams[0];
if(runsB>runsA) return teams[1];

}

return teams[0];

}

// SAFE MARGIN

function getMargin(match){

const outcome=match.info.outcome;

if(outcome?.by?.runs)
return `${outcome.winner} won by ${outcome.by.runs} runs`;

if(outcome?.by?.wickets)
return `${outcome.winner} won by ${outcome.by.wickets} wickets`;

return "";

}

</script>

</body>
</html>
