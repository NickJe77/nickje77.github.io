<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ICC Men's T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family: Inter, system-ui, Arial, sans-serif;
    margin:0;
    background:#f4f6f8;
}

/* NAVBAR */

.navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px 0;
    background:white;
    border-bottom:1px solid #ddd;
    font-weight:600;
}

.navbar a{
    color:#0b5fff;
    text-decoration:none;
    font-size:17px;
}

/* HERO */

.hero{
    position:relative;
    height:260px;
    overflow:hidden;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,.6));
}

.hero-text{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    text-align:center;
}

.hero-text h1{
    font-size:38px;
    margin:0;
}

.hero-text p{
    margin-top:8px;
    font-size:18px;
}

/* CONTENT */

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

/* TABLE */

.table-wrap{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0b5fff;
    color:white;
    padding:14px;
    font-size:15px;
    text-align:left;
}

td{
    padding:14px;
    border-bottom:1px solid #eee;
}

tr:nth-child(even){
    background:#f9fbff;
}

.score-link{
    color:#0b5fff;
    font-weight:600;
    text-decoration:none;
}

.score-link:hover{
    text-decoration:underline;
}

.loading{
    text-align:center;
    padding:40px;
    font-size:18px;
}

</style>
</head>
<body>


<div class="navbar">
    <a href="index.html">Home</a>
    <a href="t20-world-cup.html">T20 World Cup</a>
    <a href="t20-finals.html">Finals</a>
</div>


<div class="hero">
    <img src="images/t20-world-cup-hero.jpg">
    <div class="hero-overlay"></div>
    <div class="hero-text">
        <h1>T20 World Cup Finals</h1>
        <p>Every final, result, venue and Player of the Match</p>
    </div>
</div>


<div class="container">

<div class="table-wrap">

<table id="finalsTable">

<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Runner-Up</th>
<th>Margin</th>
<th>Venue</th>
<th>Player of the Match</th>
<th>Scorecard</th>
</tr>
</thead>

<tbody id="finalsBody">
<tr>
<td colspan="7" class="loading">Loading finals...</td>
</tr>
</tbody>

</table>

</div>

</div>


<script>

const INDEX_PATH = "data/t20-world-cup/matches/index.json";
const MATCH_FOLDER = "data/t20-world-cup/matches/";

async function loadFinals(){

    const indexRes = await fetch(INDEX_PATH);
    const index = await indexRes.json();

    let finals = [];

    for(const file of index){

        const res = await fetch(MATCH_FOLDER + file);
        const data = await res.json();

        for(const match of data){

            const info = match.info;

            if(
                info.event?.match_number === "Final" ||
                info.stage === "Final"
            ){

                finals.push(match);

            }

        }

    }

    renderFinals(finals);

}


function renderFinals(finals){

    const body = document.getElementById("finalsBody");
    body.innerHTML = "";

    finals.sort((a,b)=>{

        const yearA = new Date(a.info.dates[0]).getFullYear();
        const yearB = new Date(b.info.dates[0]).getFullYear();

        return yearB - yearA;

    });

    for(const match of finals){

        const info = match.info;

        const year = new Date(info.dates[0]).getFullYear();

        const winner = info.outcome.winner || "—";

        const teams = info.teams;

        const runner = teams.find(t=>t !== winner) || "—";

        let margin = "";

        if(info.outcome.by){

            if(info.outcome.by.runs){

                margin = info.outcome.by.runs + " runs";

            }

            if(info.outcome.by.wickets){

                margin = info.outcome.by.wickets + " wickets";

            }

        }

        const venue = info.venue;

        let pom = "—";

        if(info.player_of_match){

            pom = info.player_of_match[0];

        }

        const matchId = match.info.match_id || info.dates[0] + winner;

        const row = document.createElement("tr");

        row.innerHTML = `
        <td>${year}</td>
        <td><strong>${winner}</strong></td>
        <td>${runner}</td>
        <td>${margin}</td>
        <td>${venue}</td>
        <td>${pom}</td>
        <td>
            <a class="score-link"
            href="t20-match.html?matchId=${matchId}">
            View
            </a>
        </td>
        `;

        body.appendChild(row);

    }

}


loadFinals();

</script>


</body>
</html>
