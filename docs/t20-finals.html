<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:28px;
  padding:18px;
  background:#ffffff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.container{
  width:90%;
  margin:30px auto;
}

.card{
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:26px;
  border-radius:16px;
}

.hero h1{
  margin:0;
}

.score{
  font-size:22px;
  font-weight:700;
  margin-top:10px;
}

.meta{
  margin-top:6px;
  opacity:.9;
}

.section{
  margin-top:26px;
}

.section h2{
  color:#6a040f;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#6a040f;
  color:white;
  padding:10px;
  text-align:left;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
}

.loading{
  padding:30px;
  text-align:center;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="container">

<div id="content" class="card loading">

Loading match...

</div>

</div>

<script>


const params =
new URLSearchParams(window.location.search);

const file =
params.get("file");

const matchIndex =
parseInt(params.get("matchIndex"),10);


const folder =
"data/t20-world-cup/matches/";


function getScore(match,team){

for(const inn of match.innings){

const name =
Object.keys(inn)[0];

if(name===team){

return inn[name].runs +
"-" +
inn[name].wickets;

}

}

return "";

}


function buildBatting(match,team){

let rows="";

for(const inn of match.innings){

const name=
Object.keys(inn)[0];

if(name!==team) continue;

for(const over of inn[name].overs){

for(const ball of over.deliveries){

const batter=
Object.keys(ball)[0];

const runs=
ball[batter].runs.batter;

rows+=`
<tr>
<td>${batter}</td>
<td>${runs}</td>
</tr>`;

}

}

}

return `
<div class="section">

<h2>${team} Batting</h2>

<table>
<tr>
<th>Batter</th>
<th>Runs</th>
</tr>

${rows}

</table>

</div>
`;

}


async function loadMatch(){

const content=
document.getElementById("content");


if(!file || isNaN(matchIndex)){

content.innerHTML=
"Invalid match link";

return;

}


const res=
await fetch(folder+file);

const matches=
await res.json();

const match=
matches[matchIndex];


if(!match){

content.innerHTML=
"Match not found";

return;

}


const teams=
match.info.teams;

const winner=
match.info.outcome.winner;

const runner=
teams.find(t=>t!==winner);


const winnerScore=
getScore(match,winner);

const runnerScore=
getScore(match,runner);


content.classList.remove("loading");


content.innerHTML=`

<div class="hero">

<h1>${teams[0]} vs ${teams[1]}</h1>

<div class="score">
${winner} ${winnerScore}
def
${runner} ${runnerScore}
</div>

<div class="meta">
${match.info.venue} • ${match.info.dates[0]}
</div>

</div>

${buildBatting(match,teams[0])}

${buildBatting(match,teams[1])}

`;

}


loadMatch();


</script>

</body>
</html>
