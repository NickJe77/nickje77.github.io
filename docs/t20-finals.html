<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#8b0000,#e10600);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:25px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
}

th{
  background:#e10600;
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
}

tbody tr:nth-child(even){
  background:#eaf3ff;
}

tbody tr{
  cursor:pointer;
}

tbody tr:hover{
  background:#d8e8ff;
}

.team{font-weight:700;}
.score{font-weight:600;}
.margin{font-weight:700;color:#0a4;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

  <div class="hero">
    <h1>T20 World Cup Finals</h1>
  </div>

  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Winner</th>
        <th>Score</th>
        <th>Runner-up</th>
        <th>Score</th>
        <th>Margin</th>
        <th>Venue</th>
      </tr>
    </thead>
    <tbody id="finalsTable">
      <tr><td colspan="7">Loading finals...</td></tr>
    </tbody>
  </table>

</div>

<script>
// Years you have FULL files for (per your folder screenshot)
const YEARS = [2007,2008,2009,2010,2012,2013,2014,2015,2016,2021,2022,2023,2024,2025];

// Hard lock finalists for the REAL ICC Men's T20 World Cup finals.
// This prevents accidentally grabbing a qualifier/regional "Final".
const FINALISTS = {
  2007: ["India","Pakistan"],
  2009: ["Pakistan","Sri Lanka"],
  2010: ["England","Australia"],
  2012: ["West Indies","Sri Lanka"],
  2014: ["Sri Lanka","India"],
  2016: ["West Indies","England"],
  2021: ["Australia","New Zealand"],
  2022: ["England","Pakistan"],
  2024: ["India","South Africa"]
};

const table = document.getElementById("finalsTable");
table.innerHTML = "";

(async function loadFinals(){
  for(const year of YEARS){
    const file = `data/t20-world-cup/matches/t20wc_${year}_FULL.json`;

    try{
      const res = await fetch(file, { cache:"no-store" });
      if(!res.ok) continue;

      const matches = await res.json();
      if(!Array.isArray(matches)) continue;

      const finalMatch = pickFinalForYear(matches, year);
      if(!finalMatch) continue;

      const teams = (finalMatch.info && finalMatch.info.teams) ? finalMatch.info.teams : [];
      const venue = (finalMatch.info && finalMatch.info.venue) ? finalMatch.info.venue : "";

      const outcome = finalMatch.info?.outcome || {};
      const winner = outcome.winner || "";
      const loser = teams.find(t => t !== winner) || "";

      const sA = getScore(finalMatch, teams[0]);
      const sB = getScore(finalMatch, teams[1]);

      const winnerScore = (winner === teams[0]) ? sA : sB;
      const loserScore  = (winner === teams[0]) ? sB : sA;

      const margin = getMargin(outcome);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${year}</td>
        <td class="team">${winner || teams[0] || ""}</td>
        <td class="score">${winnerScore}</td>
        <td class="team">${loser || teams[1] || ""}</td>
        <td class="score">${loserScore}</td>
        <td class="margin">${margin}</td>
        <td>${venue}</td>
      `;

      // Keep your existing match page pattern: it must load the FULL file and use match id
      const matchId =
        finalMatch.info?.match_id ??
        finalMatch.info?.matchId ??
        finalMatch.info?.match_number ??
        finalMatch.info?.event?.match_number ??
        "";

      tr.onclick = () => {
        // Do NOT guess a per-match json file (you don't have them). Pass FULL file + match id.
        window.location.href = `t20-world-cup-match.html?file=${encodeURIComponent(file)}&match=${encodeURIComponent(String(matchId))}`;
      };

      table.appendChild(tr);

    }catch(e){
      // ignore year if file missing / parse error
    }
  }

  if(!table.children.length){
    table.innerHTML = `<tr><td colspan="7">No finals found (check filenames/folder path).</td></tr>`;
  }
})();

function pickFinalForYear(matches, year){
  const pair = FINALISTS[year];

  // 1) Strict: must include both finalists
  if(pair){
    const hit = matches.find(m => hasBothTeams(m, pair[0], pair[1]) && isFinalStage(m));
    if(hit) return hit;

    // Some datasets may not have event.stage perfectly — fallback to just team match
    const hit2 = matches.find(m => hasBothTeams(m, pair[0], pair[1]));
    if(hit2) return hit2;
  }

  // 2) Generic fallback: stage is Final + event name looks like T20 WC, not qualifiers
  const hit3 = matches.find(m => isFinalStage(m) && looksLikeWorldCup(m));
  return hit3 || null;
}

function hasBothTeams(m, a, b){
  const teams = m?.info?.teams || [];
  return teams.includes(a) && teams.includes(b);
}

function isFinalStage(m){
  const stage = (m?.info?.event?.stage || "").toString().toLowerCase();
  // exact "final" is best, but allow slight variations
  return stage === "final" || stage === "grand final";
}

function looksLikeWorldCup(m){
  const name = (m?.info?.event?.name || "").toString().toLowerCase();
  if(!name) return false;
  if(!name.includes("t20")) return false;
  if(!name.includes("world cup")) return false;
  if(name.includes("qualifier")) return false;
  if(name.includes("regional")) return false;
  return true;
}

function getScore(match, team){
  // Cricsheet-style: innings is array of objects; each object has a single key whose value has {team,runs,wickets,overs}
  const innings = Array.isArray(match.innings) ? match.innings : [];
  for(const inn of innings){
    const k = Object.keys(inn || {})[0];
    if(!k) continue;
    const data = inn[k];
    if(!data) continue;

    const t = data.team || k; // prefer explicit team field
    if(t !== team) continue;

    const runs = (data.runs ?? "").toString();
    const wkts = data.wickets;

    if(runs === "") return "";
    if(wkts === undefined || wkts === null) return `${runs}`;
    return `${runs}/${wkts}`;
  }
  return "";
}

function getMargin(outcome){
  const winner = outcome.winner || "";
  if(outcome.by?.runs !== undefined) return `${winner} won by ${outcome.by.runs} runs`;
  if(outcome.by?.wickets !== undefined) return `${winner} won by ${outcome.by.wickets} wickets`;
  return "";
}
</script>

</body>
</html>
