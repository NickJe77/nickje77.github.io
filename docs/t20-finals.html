<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>T20 World Cup | Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="style.css" />

<style>
  body{
    font-family: Inter, system-ui, Arial, sans-serif;
    margin:0;
    background:#f4f6f8;
    color:#111;
  }

  /* NAV */
  .navbar{
    display:flex;
    justify-content:center;
    gap:22px;
    padding:16px 0;
    border-bottom:1px solid #ddd;
    background:#fff;
    font-weight:600;
  }
  .navbar a{
    color:#0056d6;
    text-decoration:none;
    font-size:18px;
  }
  .navbar a.active{ text-decoration:underline; }

  .page{
    max-width:1200px;
    margin:26px auto;
    padding:0 20px 40px;
  }

  /* HERO */
  .hero{
    background:linear-gradient(90deg,#8b0000,#e10600);
    color:#fff;
    padding:34px 40px;
    border-radius:22px;
    margin-bottom:18px;
  }
  .hero h1{ margin:0; font-size:34px; letter-spacing:.2px; }
  .hero p{ margin:8px 0 0; opacity:.95; }

  /* CONTROLS */
  .controls{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    margin:14px 0 12px;
  }
  .search{
    flex:1 1 340px;
    display:flex;
    gap:10px;
    align-items:center;
  }
  .search input{
    width:100%;
    padding:12px 12px;
    border:1px solid #cfd8e3;
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:#fff;
  }
  .pill{
    background:#fff;
    border:1px solid #cfd8e3;
    border-radius:999px;
    padding:10px 12px;
    font-weight:700;
    font-size:14px;
  }

  /* YEAR TABS */
  .tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:10px 0 14px;
  }
  .tab{
    border:1px solid #cfd8e3;
    background:#fff;
    border-radius:999px;
    padding:10px 14px;
    font-weight:800;
    cursor:pointer;
    user-select:none;
  }
  .tab.active{
    background:#e10600;
    color:#fff;
    border-color:#e10600;
  }

  /* TABLE */
  .table-wrap{
    background:#fff;
    border:1px solid #dde6f0;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.05);
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  thead th{
    background:#e10600;
    color:#fff;
    text-align:left;
    padding:14px 12px;
    font-size:15px;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th .sort{
    opacity:.9;
    font-size:12px;
    margin-left:6px;
  }
  tbody td{
    padding:12px;
    border-top:1px solid #edf2f7;
    font-size:15px;
    vertical-align:middle;
  }
  tbody tr:nth-child(even){
    background:#eaf3ff; /* light blue alternating like your tables */
  }
  tbody tr{
    cursor:pointer;
  }
  tbody tr:hover{
    background:#d8e8ff;
  }

  .muted{ opacity:.75; font-weight:600; }
  .right{ text-align:right; }

  /* LOADER / ERROR */
  .state{
    padding:18px 16px;
    font-weight:700;
  }
  .error{
    color:#b00020;
  }

  @media (max-width:720px){
    .hero{ padding:28px 22px; }
    .hero h1{ font-size:28px; }
    thead th, tbody td{ font-size:14px; }
  }
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a class="active" href="t20-world-cup.html">T20 World Cup</a>
</nav>

<div class="page">

  <div class="hero">
    <h1>T20 World Cup – Finals</h1>
    <p>Click any final to open the full match page.</p>
  </div>

  <div class="controls">
    <div class="search">
      <input id="searchBox" type="text" placeholder="Search (year, teams, venue)..." />
    </div>
    <div class="pill" id="countPill">0 results</div>
  </div>

  <div class="tabs" id="yearTabs"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="year">Year <span class="sort" id="sort-year"></span></th>
          <th data-key="winner">Winner <span class="sort" id="sort-winner"></span></th>
          <th data-key="runnerUp">Runner-up <span class="sort" id="sort-runnerUp"></span></th>
          <th data-key="venue">Venue <span class="sort" id="sort-venue"></span></th>
          <th data-key="matchLabel">Match <span class="sort" id="sort-matchLabel"></span></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="state">Loading finals…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
/**
 * HOW THIS PAGE WORKS
 * - It will try to load finals from: data/t20wc_finals.json
 * - If that file doesn't exist, it falls back to the embedded list below.
 *
 * REQUIRED fields per final:
 *  {
 *    "year": 2024,
 *    "winner": "India",
 *    "runnerUp": "South Africa",
 *    "venue": "Barbados",
 *    "file": "data/t20wc/2024/1415750.json",   // path used by match page
 *    "matchLabel": "Final"
 *  }
 */

const FINALS_FALLBACK = [
  { year:2024, winner:"India", runnerUp:"South Africa", venue:"Barbados", file:"data/t20wc/2024/1415750.json", matchLabel:"Final" },
  { year:2022, winner:"England", runnerUp:"Pakistan", venue:"Melbourne", file:"data/t20wc/2022/1319677.json", matchLabel:"Final" },
  { year:2021, winner:"Australia", runnerUp:"New Zealand", venue:"Dubai", file:"data/t20wc/2021/1273756.json", matchLabel:"Final" },
  { year:2016, winner:"West Indies", runnerUp:"England", venue:"Kolkata", file:"data/t20wc/2016/951373.json", matchLabel:"Final" },
  { year:2014, winner:"Sri Lanka", runnerUp:"India", venue:"Dhaka", file:"data/t20wc/2014/682965.json", matchLabel:"Final" },
  { year:2012, winner:"West Indies", runnerUp:"Sri Lanka", venue:"Colombo", file:"data/t20wc/2012/533285.json", matchLabel:"Final" },
  { year:2010, winner:"England", runnerUp:"Australia", venue:"Barbados", file:"data/t20wc/2010/412690.json", matchLabel:"Final" },
  { year:2009, winner:"Pakistan", runnerUp:"Sri Lanka", venue:"London", file:"data/t20wc/2009/355998.json", matchLabel:"Final" },
  { year:2007, winner:"India", runnerUp:"Pakistan", venue:"Johannesburg", file:"data/t20wc/2007/287879.json", matchLabel:"Final" },
];

const rowsEl = document.getElementById("rows");
const tabsEl = document.getElementById("yearTabs");
const searchBox = document.getElementById("searchBox");
const countPill = document.getElementById("countPill");

let finalsAll = [];
let activeYear = "ALL";

let sortKey = "year";
let sortDir = "desc"; // "asc" | "desc"

function safeStr(x){ return (x ?? "").toString(); }

function buildMatchLink(filePath){
  // THIS is the key fix:
  // Some of your match pages read params.get("file")
  // Some older versions read params.get("match")
  // We send BOTH so whichever exists will work.
  const enc = encodeURIComponent(filePath);
  return `t20-match.html?file=${enc}&match=${enc}`;
}

function setSort(key){
  if (sortKey === key){
    sortDir = (sortDir === "asc") ? "desc" : "asc";
  } else {
    sortKey = key;
    sortDir = (key === "year") ? "desc" : "asc";
  }
  render();
}

function applySort(list){
  const dir = (sortDir === "asc") ? 1 : -1;
  return [...list].sort((a,b) => {
    const av = a[sortKey];
    const bv = b[sortKey];

    if (sortKey === "year"){
      return (Number(av) - Number(bv)) * dir;
    }
    return safeStr(av).localeCompare(safeStr(bv), undefined, {numeric:true, sensitivity:"base"}) * dir;
  });
}

function updateSortIcons(){
  ["year","winner","runnerUp","venue","matchLabel"].forEach(k=>{
    const el = document.getElementById(`sort-${k}`);
    if (!el) return;
    if (k !== sortKey){
      el.textContent = "";
    } else {
      el.textContent = sortDir === "asc" ? "▲" : "▼";
    }
  });
}

function buildTabs(){
  const years = [...new Set(finalsAll.map(f => f.year))].sort((a,b)=>b-a);
  tabsEl.innerHTML = "";

  const makeTab = (label, value) => {
    const t = document.createElement("div");
    t.className = "tab" + (activeYear === value ? " active" : "");
    t.textContent = label;
    t.onclick = () => { activeYear = value; render(); };
    tabsEl.appendChild(t);
  };

  makeTab("All", "ALL");
  years.forEach(y => makeTab(String(y), y));
}

function render(){
  updateSortIcons();

  const q = safeStr(searchBox.value).trim().toLowerCase();

  let list = finalsAll;

  if (activeYear !== "ALL"){
    list = list.filter(f => f.year === activeYear);
  }

  if (q){
    list = list.filter(f => {
      const hay = [
        f.year,
        f.winner,
        f.runnerUp,
        f.venue,
        f.matchLabel
      ].map(safeStr).join(" ").toLowerCase();
      return hay.includes(q);
    });
  }

  list = applySort(list);

  countPill.textContent = `${list.length} result${list.length===1?"":"s"}`;

  if (!list.length){
    rowsEl.innerHTML = `<tr><td colspan="5" class="state muted">No finals match your search.</td></tr>`;
    return;
  }

  rowsEl.innerHTML = "";
  list.forEach(f => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><strong>${f.year}</strong></td>
      <td>${safeStr(f.winner)}</td>
      <td>${safeStr(f.runnerUp)}</td>
      <td>${safeStr(f.venue)}</td>
      <td class="muted">${safeStr(f.matchLabel || "Final")}</td>
    `;

    tr.onclick = () => {
      const link = buildMatchLink(f.file);
      window.location.href = link;
    };

    rowsEl.appendChild(tr);
  });
}

async function loadFinals(){
  try{
    const res = await fetch("data/t20wc_finals.json", {cache:"no-store"});
    if (!res.ok) throw new Error("No finals JSON");
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error("Finals JSON must be an array");
    return data;
  }catch(err){
    return FINALS_FALLBACK;
  }
}

function normalizeFinals(list){
  return list.map(x => ({
    year: Number(x.year),
    winner: safeStr(x.winner),
    runnerUp: safeStr(x.runnerUp),
    venue: safeStr(x.venue),
    file: safeStr(x.file),
    matchLabel: safeStr(x.matchLabel || "Final")
  })).filter(x => x.year && x.file);
}

document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => setSort(th.dataset.key));
});

searchBox.addEventListener("input", render);

(async function init(){
  const loaded = await loadFinals();
  finalsAll = normalizeFinals(loaded);

  if (!finalsAll.length){
    rowsEl.innerHTML = `<tr><td colspan="5" class="state error">No finals data found.</td></tr>`;
    countPill.textContent = "0 results";
    return;
  }

  buildTabs();
  render();
})();
</script>

</body>
</html>
