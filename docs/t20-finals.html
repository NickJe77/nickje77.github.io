<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f3f4f7;
}


/* NAVBAR */

.navbar{
  display:flex;
  justify-content:center;
  gap:28px;
  padding:18px;
  background:#ffffff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}


/* HERO */

.hero{
  width:90%;
  margin:30px auto;
  height:260px;
  border-radius:20px;
  overflow:hidden;
  position:relative;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, rgba(106,4,15,0.85), rgba(208,0,0,0.75));
}

.hero-text{
  position:absolute;
  bottom:30px;
  left:40px;
  color:white;
}

.hero-text h1{
  margin:0;
  font-size:44px;
}


/* TABLE */

.container{
  width:90%;
  margin:30px auto;
}

.table-wrap{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid #eee;
}

tr:nth-child(even){
  background:#fafafa;
}


/* TEAM CELL */

.team{
  display:flex;
  align-items:center;
  gap:10px;
}

.flag{
  width:26px;
  height:18px;
  object-fit:cover;
  border-radius:3px;
  border:1px solid #ccc;
}


/* SCORE LINK */

.link{
  color:#d00000;
  font-weight:600;
  text-decoration:none;
}

.link:hover{
  text-decoration:underline;
}


/* LOADING */

.loading{
  padding:30px;
  text-align:center;
  font-size:18px;
}

</style>
</head>

<body>


<!-- NAVBAR -->

<div class="navbar">

<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>

</div>


<!-- HERO -->

<div class="hero">

<img src="images/t20wc-hero.jpg">

<div class="hero-overlay"></div>

<div class="hero-text">
<h1>T20 World Cup Finals</h1>
</div>

</div>


<!-- TABLE -->

<div class="container">

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Score</th>
<th>Runner-Up</th>
<th>Score</th>
<th>Margin</th>
<th>Venue</th>
<th>Scorecard</th>
</tr>
</thead>

<tbody id="body">

<tr>
<td colspan="8" class="loading">
Data loading...
</td>
</tr>

</tbody>

</table>

</div>

</div>


<script>

const INDEX_PATH =
"data/t20-world-cup/matches/index.json";

const MATCH_FOLDER =
"data/t20-world-cup/matches/";


function getFlag(team){

return "images/flags/" + team + ".png";

}


function getScore(match, team){

if(!match.innings) return "";

for(const inn of match.innings){

const teamName =
Object.keys(inn)[0];

if(teamName === team){

return inn[teamName].runs +
"-" +
inn[teamName].wickets;

}

}

return "";

}


async function loadFinals(){

try{

const res =
await fetch(INDEX_PATH);

const index =
await res.json();

const finals = [];


for(const item of index){

const file =
item.file;

const matchRes =
await fetch(MATCH_FOLDER + file);

const match =
await matchRes.json();


if(
match.info?.event?.match_number === "Final"
||
match.info?.stage === "Final"
){

finals.push(match);

}

}


renderFinals(finals);

}
catch(error){

document.getElementById("body").innerHTML =
`<tr>
<td colspan="8" class="loading">
Error loading data
</td>
</tr>`;

console.error(error);

}

}


function renderFinals(finals){

const body =
document.getElementById("body");

body.innerHTML = "";


if(finals.length === 0){

body.innerHTML =
`<tr>
<td colspan="8" class="loading">
No finals found
</td>
</tr>`;

return;

}


finals.sort((a,b)=>

new Date(b.info.dates[0])
-
new Date(a.info.dates[0])

);


for(const match of finals){

const info =
match.info;

const year =
new Date(info.dates[0])
.getFullYear();

const winner =
info.outcome.winner;

const runner =
info.teams.find(
t=>t!==winner
);

const winnerScore =
getScore(match,winner);

const runnerScore =
getScore(match,runner);


let margin="";

if(info.outcome.by?.runs)
margin =
info.outcome.by.runs
+ " runs";

if(info.outcome.by?.wickets)
margin =
info.outcome.by.wickets
+ " wickets";


const row =
document.createElement("tr");

row.innerHTML = `

<td>${year}</td>

<td>
<div class="team">
<img class="flag"
src="${getFlag(winner)}">
${winner}
</div>
</td>

<td>${winnerScore}</td>

<td>
<div class="team">
<img class="flag"
src="${getFlag(runner)}">
${runner}
</div>
</td>

<td>${runnerScore}</td>

<td>${margin}</td>

<td>${info.venue}</td>

<td>
<a class="link"
href="t20-match.html?matchId=${year}">
View
</a>
</td>

`;

body.appendChild(row);

}

}


loadFinals();

</script>


</body>
</html>
