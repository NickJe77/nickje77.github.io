<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family: Inter, system-ui, Arial, sans-serif;
    margin:0;
    background:#f4f6f8;
}

/* NAVBAR */

.navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px 0;
    background:white;
    border-bottom:1px solid #ddd;
    font-weight:600;
}

.navbar a{
    color:#0b5fff;
    text-decoration:none;
}

/* HERO */

.hero{
    position:relative;
    height:260px;
    overflow:hidden;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,.6));
}

.hero-text{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    text-align:center;
}

.hero-text h1{
    font-size:38px;
    margin:0;
}

/* TABLE */

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

.table-wrap{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0b5fff;
    color:white;
    padding:14px;
    text-align:left;
}

td{
    padding:14px;
    border-bottom:1px solid #eee;
}

tr:nth-child(even){
    background:#f9fbff;
}

.team-cell{
    display:flex;
    align-items:center;
    gap:10px;
}

.flag{
    width:26px;
    height:18px;
    object-fit:cover;
    border-radius:3px;
    border:1px solid #ccc;
}

.score{
    font-weight:600;
    font-size:15px;
}

.score-link{
    color:#0b5fff;
    font-weight:600;
    text-decoration:none;
}

.loading{
    text-align:center;
    padding:40px;
}

</style>
</head>
<body>


<div class="navbar">
<a href="index.html">Home</a>
<a href="t20-world-cup.html">T20 World Cup</a>
<a href="t20-finals.html">Finals</a>
</div>


<div class="hero">
<img src="images/t20-world-cup-hero.jpg">
<div class="hero-overlay"></div>
<div class="hero-text">
<h1>T20 World Cup Finals</h1>
</div>
</div>


<div class="container">

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Score</th>
<th>Runner-Up</th>
<th>Score</th>
<th>Margin</th>
<th>Venue</th>
<th>Scorecard</th>
</tr>
</thead>

<tbody id="finalsBody">

<tr>
<td colspan="8" class="loading">Loading finals...</td>
</tr>

</tbody>

</table>

</div>

</div>
