<script>

const YEARS = [2007,2009,2010,2012,2014,2016,2021,2022,2024,2026];

const FOLDER = "data/t20-world-cup/matches/";


function flag(team){
  return "images/flags/" + team + ".png";
}


function score(match, team){

  if(!match.innings) return "";

  for(const inn of match.innings){

    const name = Object.keys(inn)[0];

    if(name === team){

      return inn[name].runs + "-" + inn[name].wickets;

    }

  }

  return "";

}


async function load(){

  const finals = [];

  for(const year of YEARS){

    const file = `t20wc_${year}_FULL.json`;

    try{

      const res = await fetch(FOLDER + file);

      const data = await res.json();

      const matches = data.matches;

      if(!matches) continue;

      /* SORT BY DATE */

      matches.sort((a,b)=>

        new Date(a.info.dates[0]) -
        new Date(b.info.dates[0])

      );

      /* FINAL IS LAST MATCH */

      const finalMatch = matches[matches.length - 1];

      finals.push(finalMatch);

    }
    catch(e){

      console.log("Error loading", file);

    }

  }

  render(finals);

}
