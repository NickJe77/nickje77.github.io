<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#8b0000,#e10600);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:25px;
}

.table{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.row{
  display:grid;
  grid-template-columns:100px 1fr 1fr 240px 180px 1fr;
  padding:16px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.row:hover{
  background:#fff7f7;
}

.header{
  font-weight:800;
  background:#8b0000;
  color:#fff;
}

.team{
  display:flex;
  align-items:center;
  gap:10px;
}

.flag{
  width:26px;
  height:18px;
}

.score{
  font-weight:700;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1>T20 World Cup Finals</h1>
</div>

<div class="table" id="table">

<div class="row header">

<div>Year</div>
<div>Winner</div>
<div>Runner-Up</div>
<div>Score</div>
<div>Margin</div>
<div>Venue</div>

</div>

</div>

</div>

<script>


const FINALS=[

{year:2007,date:"2007-09-24",teams:["India","Pakistan"]},
{year:2009,date:"2009-06-21",teams:["Pakistan","Sri Lanka"]},
{year:2010,date:"2010-05-16",teams:["England","Australia"]},
{year:2012,date:"2012-10-07",teams:["West Indies","Sri Lanka"]},
{year:2014,date:"2014-04-06",teams:["Sri Lanka","India"]},
{year:2016,date:"2016-04-03",teams:["West Indies","England"]},
{year:2021,date:"2021-11-14",teams:["Australia","New Zealand"]},
{year:2022,date:"2022-11-13",teams:["England","Pakistan"]},
{year:2024,date:"2024-06-29",teams:["India","South Africa"]}

];

const PATH="data/t20-world-cup/matches/";

function flag(team)
{
return "images/flags/"+team+".png";
}

function score(match,team)
{
for(const inn of match.innings)
{
const name=Object.keys(inn)[0];

if(name===team)
return inn[name].runs+"-"+inn[name].wickets;
}
return "";
}

async function load()
{
const table=document.getElementById("table");

for(const f of FINALS)
{
const file=`t20wc_${f.year}_FULL.json`;

const res=await fetch(PATH+file);

const data=await res.json();

const matches=Array.isArray(data)?data:data.matches;

const match=matches.find(m=>

m.info.dates[0]===f.date &&
m.info.teams.includes(f.teams[0]) &&
m.info.teams.includes(f.teams[1])

);

if(!match) continue;

const index=matches.indexOf(match);

const winner=match.info.outcome.winner;

const runner=match.info.teams.find(t=>t!==winner);

let margin="";

if(match.info.outcome.by.runs)
margin=match.info.outcome.by.runs+" runs";

else if(match.info.outcome.by.wickets)
margin=match.info.outcome.by.wickets+" wickets";


const link=
`t20-world-cup-match.html?file=${file}&match=${index}`;


const row=document.createElement("div");

row.className="row";

row.onclick=()=>window.location.href=link;

row.innerHTML=`

<div>${f.year}</div>

<div class="team">
<img class="flag" src="${flag(winner)}">
${winner}
</div>

<div class="team">
<img class="flag" src="${flag(runner)}">
${runner}
</div>

<div class="score">
${winner} ${score(match,winner)}<br>
${runner} ${score(match,runner)}
</div>

<div>${margin}</div>

<div>${match.info.venue}</div>

`;

table.appendChild(row);

}
}

load();

</script>

</body>
</html>
