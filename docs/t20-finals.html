<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#8b0000,#e10600);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:30px;
}

.hero h1{
  margin:0;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
}

th{
  background:#e10600;
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
}

tbody tr:nth-child(even){
  background:#eaf3ff;
}

tbody tr{
  cursor:pointer;
}

tbody tr:hover{
  background:#d8e8ff;
}

</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1>T20 World Cup Finals</h1>
</div>

<table>
<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Runner Up</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="finalsTable"></tbody>

</table>

</div>

<script>

const FINALS = [

{year:2024,file:"t20wc/2024/1415750.json",winner:"India",runner:"South Africa",venue:"Barbados"},
{year:2022,file:"t20wc/2022/1319677.json",winner:"England",runner:"Pakistan",venue:"Melbourne"},
{year:2021,file:"t20wc/2021/1273756.json",winner:"Australia",runner:"New Zealand",venue:"Dubai"},
{year:2016,file:"t20wc/2016/951373.json",winner:"West Indies",runner:"England",venue:"Kolkata"},
{year:2014,file:"t20wc/2014/682965.json",winner:"Sri Lanka",runner:"India",venue:"Dhaka"},
{year:2012,file:"t20wc/2012/533285.json",winner:"West Indies",runner:"Sri Lanka",venue:"Colombo"},
{year:2010,file:"t20wc/2010/412690.json",winner:"England",runner:"Australia",venue:"Barbados"},
{year:2009,file:"t20wc/2009/355998.json",winner:"Pakistan",runner:"Sri Lanka",venue:"London"},
{year:2007,file:"t20wc/2007/287879.json",winner:"India",runner:"Pakistan",venue:"Johannesburg"}

];

const table = document.getElementById("finalsTable");

FINALS.forEach(f => {

const tr = document.createElement("tr");

tr.innerHTML = `
<td>${f.year}</td>
<td>${f.winner}</td>
<td>${f.runner}</td>
<td>${f.venue}</td>
`;

tr.onclick = () => {

window.location.href =
`t20-match.html?file=${f.file}`;

};

table.appendChild(tr);

});

</script>

</body>
</html>
