<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:28px;
  padding:18px;
  background:#ffffff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.hero{
  width:90%;
  margin:30px auto;
  height:260px;
  border-radius:20px;
  overflow:hidden;
  position:relative;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,
    rgba(106,4,15,0.85),
    rgba(208,0,0,0.75));
}

.hero-text{
  position:absolute;
  bottom:30px;
  left:40px;
  color:white;
}

.hero-text h1{
  margin:0;
  font-size:44px;
}

.container{
  width:90%;
  margin:30px auto;
}

.table-wrap{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid #eee;
}

tr:hover{
  background:#fafafa;
  cursor:pointer;
}

.team{
  display:flex;
  align-items:center;
  gap:10px;
}

.flag{
  width:26px;
  height:18px;
  border-radius:3px;
  border:1px solid #ccc;
}

.score{
  font-weight:700;
}

.loading{
  padding:30px;
  text-align:center;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="hero">
<img src="images/t20wc-hero.jpg">
<div class="hero-overlay"></div>
<div class="hero-text">
<h1>T20 World Cup Finals</h1>
</div>
</div>

<div class="container">

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Runner-Up</th>
<th>Score</th>
<th>Margin</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="body">
<tr>
<td colspan="6" class="loading">Loading finals...</td>
</tr>
</tbody>

</table>

</div>

</div>

<script>


const YEARS = [
2007,2009,2010,2012,2014,2016,2021,2022,2024
];

const FOLDER =
"data/t20-world-cup/matches/";


function flag(team){

return "images/flags/" + team + ".png";

}


function getScore(match,team){

for(const inn of match.innings){

const name =
Object.keys(inn)[0];

if(name===team){

return inn[name].runs + "-" + inn[name].wickets;

}

}

return "";

}


async function loadFinals(){

const body =
document.getElementById("body");

body.innerHTML="";


for(const year of YEARS){

const file =
`t20wc_${year}_FULL.json`;

try{

const res =
await fetch(FOLDER + file);

const matches =
await res.json();


/* find final by date (latest match) */

matches.sort((a,b)=>
new Date(b.info.dates[0]) -
new Date(a.info.dates[0])
);

const final =
matches[0];

const matchIndex =
matches.indexOf(final);


const winner =
final.info.outcome.winner;

const runner =
final.info.teams.find(
t=>t!==winner
);

const winnerScore =
getScore(final,winner);

const runnerScore =
getScore(final,runner);


let margin="";

if(final.info.outcome.by.runs)
margin=
final.info.outcome.by.runs+" runs";

else if(final.info.outcome.by.wickets)
margin=
final.info.outcome.by.wickets+" wickets";


const link =
`t20-world-cup-match.html?file=${file}&matchIndex=${matchIndex}`;


const row =
document.createElement("tr");


row.onclick =
()=> window.location.href = link;


row.innerHTML = `
<td>${year}</td>

<td>
<div class="team">
<img class="flag" src="${flag(winner)}">
<strong>${winner}</strong>
</div>
</td>

<td>
<div class="team">
<img class="flag" src="${flag(runner)}">
${runner}
</div>
</td>

<td class="score">
${winner} ${winnerScore}<br>
${runner} ${runnerScore}
</td>

<td>${margin}</td>

<td>${final.info.venue}</td>
`;

body.appendChild(row);

}
catch(e){

console.log("Missing file",year);

}

}

}


loadFinals();


</script>

</body>
</html>
