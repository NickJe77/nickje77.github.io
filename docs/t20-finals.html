<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#8b0000,#e10600);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:25px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
}

th{
  background:#e10600;
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
}

tbody tr:nth-child(even){
  background:#eaf3ff;
}

tbody tr{
  cursor:pointer;
}

tbody tr:hover{
  background:#d8e8ff;
}

.team{font-weight:700;}
.score{font-weight:600;}
.margin{font-weight:700;color:#0a4;}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1>T20 World Cup Finals</h1>
</div>

<table>

<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Score</th>
<th>Runner-up</th>
<th>Score</th>
<th>Margin</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="finalsTable"></tbody>

</table>

</div>

<script>

const FINALS = [

{
year:2024,
winner:"India",
winner_score:"176/7",
runner:"South Africa",
runner_score:"169/8",
margin:"India won by 7 runs",
venue:"Barbados",
file:"data/t20-world-cup/matches/t20wc_2024_FULL.json",
matchId:"1415750"
},

{
year:2022,
winner:"England",
winner_score:"138/5",
runner:"Pakistan",
runner_score:"137/8",
margin:"England won by 5 wickets",
venue:"Melbourne",
file:"data/t20-world-cup/matches/t20wc_2022_FULL.json",
matchId:"1319677"
},

{
year:2021,
winner:"Australia",
winner_score:"173/2",
runner:"New Zealand",
runner_score:"172/4",
margin:"Australia won by 8 wickets",
venue:"Dubai",
file:"data/t20-world-cup/matches/t20wc_2021_FULL.json",
matchId:"1273756"
}

];

const table = document.getElementById("finalsTable");

FINALS.forEach(f=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${f.year}</td>
<td class="team">${f.winner}</td>
<td class="score">${f.winner_score}</td>
<td class="team">${f.runner}</td>
<td class="score">${f.runner_score}</td>
<td class="margin">${f.margin}</td>
<td>${f.venue}</td>
`;

tr.onclick=()=>{

window.location.href=
`t20-world-cup-match.html?file=${encodeURIComponent(f.file)}&match=${f.matchId}`;

};

table.appendChild(tr);

});

</script>

</body>
</html>
