<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:28px;
  padding:18px;
  background:#ffffff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.hero{
  width:90%;
  margin:30px auto;
  height:260px;
  border-radius:20px;
  overflow:hidden;
  position:relative;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,
    rgba(106,4,15,0.85),
    rgba(208,0,0,0.75));
}

.hero-text{
  position:absolute;
  bottom:30px;
  left:40px;
  color:white;
}

.hero-text h1{
  margin:0;
  font-size:44px;
}

.container{
  width:90%;
  margin:30px auto;
}

.table-wrap{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid #eee;
}

tr:hover{
  background:#fafafa;
  cursor:pointer;
}

.team{
  display:flex;
  align-items:center;
  gap:10px;
}

.flag{
  width:26px;
  height:18px;
  border:1px solid #ccc;
  border-radius:3px;
}

.score{
  font-weight:700;
}

.loading{
  padding:30px;
  text-align:center;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="hero">
<img src="images/t20wc-hero.jpg">
<div class="hero-overlay"></div>
<div class="hero-text">
<h1>T20 World Cup Finals</h1>
</div>
</div>

<div class="container">

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Runner-Up</th>
<th>Score</th>
<th>Margin</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="body">

<tr>
<td colspan="6" class="loading">
Loading finals...
</td>
</tr>

</tbody>

</table>

</div>

</div>

<script>


const FINALS = [

{year:2007,date:"2007-09-24",teams:["India","Pakistan"]},
{year:2009,date:"2009-06-21",teams:["Pakistan","Sri Lanka"]},
{year:2010,date:"2010-05-16",teams:["England","Australia"]},
{year:2012,date:"2012-10-07",teams:["West Indies","Sri Lanka"]},
{year:2014,date:"2014-04-06",teams:["Sri Lanka","India"]},
{year:2016,date:"2016-04-03",teams:["West Indies","England"]},
{year:2021,date:"2021-11-14",teams:["Australia","New Zealand"]},
{year:2022,date:"2022-11-13",teams:["England","Pakistan"]},
{year:2024,date:"2024-06-29",teams:["India","South Africa"]}

];


const FOLDER =
"data/t20-world-cup/matches/";


function flag(team){

return "images/flags/" + team + ".png";

}


function score(match,team){

for(const inn of match.innings){

const name =
Object.keys(inn)[0];

if(name===team){

return inn[name].runs+"-"+inn[name].wickets;

}

}

return "";

}


async function loadFinals(){

const body =
document.getElementById("body");

body.innerHTML="";


for(const f of FINALS){

const file =
`t20wc_${f.year}_FULL.json`;

const res =
await fetch(FOLDER + file);

const matches =
await res.json();


const final =
matches.find(m=>

m.info.dates[0]===f.date &&
m.info.teams.includes(f.teams[0]) &&
m.info.teams.includes(f.teams[1])

);


if(!final) continue;


const matchIndex =
matches.indexOf(final);


const winner =
final.info.outcome.winner;

const runner =
final.info.teams.find(t=>t!==winner);


const winnerScore =
score(final,winner);

const runnerScore =
score(final,runner);


let margin="";

if(final.info.outcome.by.runs)
margin=
final.info.outcome.by.runs+" runs";

else if(final.info.outcome.by.wickets)
margin=
final.info.outcome.by.wickets+" wickets";


const link =
`t20-world-cup-match.html?file=${file}&matchIndex=${matchIndex}`;


const row =
document.createElement("tr");

row.onclick =
()=>window.location.href=link;


row.innerHTML=`

<td>${f.year}</td>

<td>
<div class="team">
<img class="flag" src="${flag(winner)}">
<strong>${winner}</strong>
</div>
</td>

<td>
<div class="team">
<img class="flag" src="${flag(runner)}">
${runner}
</div>
</td>

<td class="score">
${winner} ${winnerScore}<br>
${runner} ${runnerScore}
</td>

<td>${margin}</td>

<td>${final.info.venue}</td>
`;

body.appendChild(row);

}

}


loadFinals();


</script>

</body>
</html>
