<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Formula 1 Results | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

/* NAV */
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

/* HERO */
.hero{width:100%;height:220px;position:relative;overflow:hidden;}
.hero img{width:100%;height:100%;object-fit:cover;display:block;}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(12,19,15,.55),rgba(12,19,15,.75));
}
.hero-caption{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;z-index:2;color:#fff;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero-caption h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.page-wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}
p.lead{text-align:center;color:var(--muted);margin:0 0 22px;font-size:14.5px;}

/* YEAR SELECTOR */
.year-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px;}
.year-btn{
  padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;font-family:var(--body);font-weight:600;font-size:13.5px;color:var(--ink);
  transition:background .15s,border-color .15s,color .15s;
}
.year-btn:hover{border-color:var(--faint);}
.year-btn.active{background:var(--board);color:#fff;border-color:var(--board);}

/* STAT TILES */
.tile-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px;}
.tile{
  border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  background:var(--surface);text-align:center;
}
.tile h3{
  margin:0 0 6px;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
}
.tile div{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);}

/* RACE DETAILS */
details{
  margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;background:var(--surface);overflow:hidden;
}
summary{
  cursor:pointer;font-family:var(--display);font-weight:600;font-size:15px;
  letter-spacing:.01em;color:var(--ink);
}

table{width:100%;border-collapse:collapse;margin-top:12px;}
th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;font-size:13.5px;}
th{
  background:#f7f9fb;color:var(--muted);font-family:var(--body);font-weight:600;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;
}
tbody tr:hover td{background:#f9fbfd;}

.season-points{text-align:center;font-variant-numeric:tabular-nums;}

/* GREY OUT NON-FINISHERS */
.dnf-row{color:var(--faint);background:#f7f8fa !important;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="hero">
  <img src="images/f1-header.jpg" alt="Formula 1">
  <div class="hero-caption">
    <span class="eyebrow">Formula 1</span>
    <h1>Season Results</h1>
  </div>
</div>

<div class="page-wrap">

<p class="lead">Race results by season (1950–present).</p>

<div class="year-grid" id="yearGrid"></div>

<div class="tile-wrap">
  <div class="tile"><h3>Season</h3><div id="tileSeason">—</div></div>
  <div class="tile"><h3>Champion</h3><div id="tileChampion">—</div></div>
  <div class="tile"><h3>Total Points</h3><div id="tilePoints">—</div></div>
</div>

<div id="results"></div>

</div>

<script>
const yearGrid=document.getElementById("yearGrid");
const resultsDiv=document.getElementById("results");
const tileSeason=document.getElementById("tileSeason");
const tileChampion=document.getElementById("tileChampion");
const tilePoints=document.getElementById("tilePoints");

const startYear=1950;
const endYear=new Date().getFullYear();

function cleanDriver(n){return String(n||"").replace(/\s[A-Z]{3}$/,"");}

/* FLAGS */
const flagByCountry={
  "Australia":"🇦🇺","Bahrain":"🇧🇭","China":"🇨🇳","Japan":"🇯🇵","Malaysia":"🇲🇾",
  "United States":"🇺🇸","Italy":"🇮🇹","Spain":"🇪🇸","Monaco":"🇲🇨","Canada":"🇨🇦",
  "Austria":"🇦🇹","Belgium":"🇧🇪","Netherlands":"🇳🇱","France":"🇫🇷","Brazil":"🇧🇷",
  "Mexico":"🇲🇽","Hungary":"🇭🇺","Singapore":"🇸🇬","Qatar":"🇶🇦",
  "Saudi Arabia":"🇸🇦","United Arab Emirates":"🇦🇪","Great Britain":"🇬🇧",
  "Germany":"🇩🇪","Portugal":"🇵🇹","Sweden":"🇸🇪","Switzerland":"🇨🇭",
  "Argentina":"🇦🇷","South Africa":"🇿🇦","Turkey":"🇹🇷","Russia":"🇷🇺",
  "India":"🇮🇳","South Korea":"🇰🇷","San Marino":"🇸🇲","Azerbaijan":"🇦🇿"
};

/* CLEAN GP NAME */
function normalizeGpRaw(s){
  let n=String(s||"").trim();

  n=n.replace(/^Flag of\s+/i,"");
  n=n.replace(/People’?s Republic of China/i,"China");
  n=n.replace(/United States of America/i,"United States");
  n=n.replace(/United Kingdom/i,"Great Britain");
  n=n.replace(/Grand Prix/i,"");

  n=n.replace(/\s+/g," ").trim();
  n=n.replace(/\b(\w+)\s+\1\b/gi,"$1");

  return n;
}

function parseGpName(g){
  let raw=normalizeGpRaw(g);
  for(const c of Object.keys(flagByCountry)){
    if(raw===c || raw.startsWith(c+" ")) return {label:c,country:c};
  }
  return {label:raw,country:""};
}

function formatRoundTitle(r,g,c){
  const p=parseGpName(g);
  const flag=p.country?flagByCountry[p.country]:"";
  return `Round ${r} – ${p.label}${c?" – "+c:""}${flag?" "+flag:""}`;
}

/* YEARS */
for(let y=startYear;y<=endYear;y++){
  let b=document.createElement("button");
  b.className="year-btn";
  b.textContent=y;
  b.id="year-"+y;
  b.onclick=()=>loadSeason(y);
  yearGrid.appendChild(b);
}

async function loadSeason(y){
  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  const btn=document.getElementById("year-"+y);
  if(btn)btn.classList.add("active");

  tileSeason.textContent=y;
  resultsDiv.innerHTML="Loading…";

  try{
    const r=await fetch(`data/f1/${y}.json`);
    if(!r.ok){resultsDiv.innerHTML="No data";return;}
    renderSeason(await r.json());
  }catch{resultsDiv.innerHTML="Error loading season";}
}

function renderSeason(data){
  resultsDiv.innerHTML="";
  let totals={},running={};

  data.races.forEach(r=>{
    r.results.forEach(x=>{
      totals[x.driver]=(totals[x.driver]||0)+(Number(x.points)||0);
    });
  });

  let champ=Object.entries(totals).sort((a,b)=>b[1]-a[1])[0];
  tileChampion.textContent=champ?cleanDriver(champ[0]):"—";
  tilePoints.textContent=champ?champ[1]:"—";

  data.races.forEach(r=>{
    let d=document.createElement("details");
    let s=document.createElement("summary");
    s.textContent=formatRoundTitle(r.round,r.grand_prix,r.circuit||"");
    d.appendChild(s);

    let t=document.createElement("table");
    t.innerHTML=`<thead><tr><th>Pos</th><th>Driver</th><th>Team</th><th>Grid</th><th>Points</th><th>Season Points</th></tr></thead><tbody></tbody>`;
    let tb=t.querySelector("tbody");

    let res=[...r.results];

    res.sort((a,b)=>{
      function rank(x){
        const p=String(x.position||"").toUpperCase().trim();
        if(/^\d+$/.test(p)) return 0;
        if(p==="DNF"||p==="DSQ") return 1;
        return 2;
      }
      const ra=rank(a), rb=rank(b);
      if(ra!==rb) return ra-rb;
      return parseInt(a.position)-parseInt(b.position);
    });

    res.forEach(x=>{
      running[x.driver]=(running[x.driver]||0)+(Number(x.points)||0);
      let pos=String(x.position||"").toUpperCase();

      const isDNF = (!/^\d+$/.test(pos));

      const tr=document.createElement("tr");
      if(isDNF) tr.classList.add("dnf-row");

      tr.innerHTML=`
        <td>${pos}</td>
        <td>${cleanDriver(x.driver)}</td>
        <td>${x.team||""}</td>
        <td>${x.grid||""}</td>
        <td>${x.points||0}</td>
        <td class="season-points">${running[x.driver]}</td>
      `;
      tb.appendChild(tr);
    });

    d.appendChild(t);
    resultsDiv.appendChild(d);
  });
}

loadSeason(endYear);
</script>

</body>
</html>
