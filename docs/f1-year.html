<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Formula 1 Results | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
  background:#fff;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

/* HERO */
.hero{width:100%;height:260px;position:relative;overflow:hidden;}
.hero img{width:100%;height:100%;object-fit:cover;display:block;}
.hero::after{content:"";position:absolute;inset:0;
background:linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.45));}

.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:20px;}

.year-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:25px;}
.year-btn{padding:8px 14px;border-radius:12px;border:1px solid #ccc;background:#e0e0e0;cursor:pointer;font-size:15px;}
.year-btn.active{background:#222;color:white;border-color:#222;}

.tile-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:30px;}
.tile{border:1px solid #ddd;border-radius:10px;padding:16px;background:#f6f9ff;text-align:center;}
.tile h3{margin:0 0 6px;font-size:14px;color:#555;font-weight:600;}
.tile div{font-size:22px;font-weight:700;}

details{margin-bottom:20px;border:1px solid #ddd;border-radius:8px;padding:10px;}
summary{cursor:pointer;font-weight:700;font-size:18px;}

table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
.season-points{text-align:center;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="hero">
  <img src="images/f1-header.jpg" alt="Formula 1">
</div>

<div class="page-wrap">

<h1>Formula 1 Results</h1>
<p>Race results by season (1950–present).</p>

<div class="year-grid" id="yearGrid"></div>

<div class="tile-wrap">
  <div class="tile"><h3>Season</h3><div id="tileSeason">—</div></div>
  <div class="tile"><h3>Champion</h3><div id="tileChampion">—</div></div>
  <div class="tile"><h3>Total Points</h3><div id="tilePoints">—</div></div>
</div>

<div id="results"></div>

</div>

<script>
const yearGrid=document.getElementById("yearGrid");
const resultsDiv=document.getElementById("results");
const tileSeason=document.getElementById("tileSeason");
const tileChampion=document.getElementById("tileChampion");
const tilePoints=document.getElementById("tilePoints");

const startYear=1950;
const endYear=new Date().getFullYear();

function cleanDriver(n){return String(n||"").replace(/\s[A-Z]{3}$/,"");}

/* FLAGS */
const flagByCountry={
  "Australia":"🇦🇺","Bahrain":"🇧🇭","China":"🇨🇳","Japan":"🇯🇵",
  "Malaysia":"🇲🇾","United States":"🇺🇸","Italy":"🇮🇹","Spain":"🇪🇸",
  "Monaco":"🇲🇨","Canada":"🇨🇦","Austria":"🇦🇹","Belgium":"🇧🇪",
  "Netherlands":"🇳🇱","France":"🇫🇷","Brazil":"🇧🇷","Mexico":"🇲🇽",
  "Hungary":"🇭🇺","Singapore":"🇸🇬","Qatar":"🇶🇦","Saudi Arabia":"🇸🇦",
  "United Arab Emirates":"🇦🇪"
};

/* CLEAN GP NAME */
function normalizeGpRaw(s){
  let n=String(s||"").trim();

  n=n.replace(/^Flag of\s+/i,"");
  n=n.replace(/People’?s Republic of China/i,"China");
  n=n.replace(/United States of America/i,"United States");
  n=n.replace(/Grand Prix/i,"");

  n=n.replace(/\s+/g," ").trim();
  n=n.replace(/\b(\w+)\s+\1\b/gi,"$1"); // remove duplicates like Bahrain Bahrain

  return n;
}

function parseGpName(g){
  let raw=normalizeGpRaw(g);
  for(const c of Object.keys(flagByCountry)){
    if(raw===c || raw.startsWith(c+" ")) return {label:c,country:c};
  }
  return {label:raw,country:""};
}

function formatRoundTitle(r,g,c){
  const p=parseGpName(g);
  const flag=p.country?flagByCountry[p.country]:"";
  return `Round ${r} – ${p.label}${c?" – "+c:""}${flag?" "+flag:""}`;
}

/* YEARS */
for(let y=startYear;y<=endYear;y++){
  let b=document.createElement("button");
  b.className="year-btn";
  b.textContent=y;
  b.id="year-"+y;
  b.onclick=()=>loadSeason(y);
  yearGrid.appendChild(b);
}

async function loadSeason(y){
  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  const btn=document.getElementById("year-"+y);
  if(btn)btn.classList.add("active");

  tileSeason.textContent=y;
  resultsDiv.innerHTML="Loading…";

  try{
    const r=await fetch(`data/f1/${y}.json`);
    if(!r.ok){resultsDiv.innerHTML="No data";return;}
    renderSeason(await r.json());
  }catch{resultsDiv.innerHTML="Error loading season";}
}

function renderSeason(data){
  resultsDiv.innerHTML="";
  let totals={},running={};

  data.races.forEach(r=>{
    r.results.forEach(x=>{
      totals[x.driver]=(totals[x.driver]||0)+(Number(x.points)||0);
    });
  });

  let champ=Object.entries(totals).sort((a,b)=>b[1]-a[1])[0];
  tileChampion.textContent=champ?cleanDriver(champ[0]):"—";
  tilePoints.textContent=champ?champ[1]:"—";

  data.races.forEach(r=>{
    let d=document.createElement("details");
    let s=document.createElement("summary");
    s.textContent=formatRoundTitle(r.round,r.grand_prix,r.circuit||"");
    d.appendChild(s);

    let t=document.createElement("table");
    t.innerHTML=`<thead><tr><th>Pos</th><th>Driver</th><th>Team</th><th>Grid</th><th>Points</th><th>Season Points</th></tr></thead><tbody></tbody>`;
    let tb=t.querySelector("tbody");

    let res=[...r.results];

    res.sort((a,b)=>{
      function rank(x){
        const p=String(x.position||"").toUpperCase().trim();
        if(/^\d+$/.test(p)) return 0;
        if(p==="DNF"||p==="DSQ") return 1;
        return 2;
      }
      const ra=rank(a), rb=rank(b);
      if(ra!==rb) return ra-rb;
      return parseInt(a.position)-parseInt(b.position);
    });

    res.forEach(x=>{
      running[x.driver]=(running[x.driver]||0)+(Number(x.points)||0);
      let pos=String(x.position||"").toUpperCase();
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${pos}</td>
        <td>${cleanDriver(x.driver)}</td>
        <td>${x.team||""}</td>
        <td>${x.grid||""}</td>
        <td>${x.points||0}</td>
        <td class="season-points">${running[x.driver]}</td>
      `;
      tb.appendChild(tr);
    });

    d.appendChild(t);
    resultsDiv.appendChild(d);
  });
}

loadSeason(endYear);
</script>

</body>
</html>
