<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>La Liga Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
    margin:0;
    font-family:var(--body);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    font-weight:600;
    font-size:13.5px;
    flex-wrap:wrap;
}

.navbar a{
    text-decoration:none;
    color:var(--ink);
    opacity:.7;
    transition:opacity .15s,color .15s;
}
.navbar a:hover{opacity:1;color:var(--accent);}

.hero{
    background:linear-gradient(160deg,var(--board-2),var(--board));
    color:#fff;
    padding:44px 20px 38px;
    text-align:center;
}

.teams{
    font-family:var(--display);
    font-size:clamp(24px,4.5vw,34px);
    font-weight:600;
    margin-bottom:10px;
    text-transform:uppercase;
    letter-spacing:.01em;
}

.score{
    font-family:var(--display);
    font-size:clamp(40px,8vw,58px);
    font-weight:600;
}

.details{
    margin-top:12px;
    font-size:14.5px;
    opacity:.85;
    font-weight:600;
}

.venue{
    margin-top:6px;
    font-size:13px;
    opacity:.7;
}

.container{
    max-width:1400px;
    margin:0 auto;
    padding:26px 20px 70px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
}

.card h2{
    margin-top:0;
    margin-bottom:16px;
    font-family:var(--display);
    font-weight:600;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:.01em;
    color:var(--ink);
}

.event-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.event{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--accent-soft);
    padding:12px 14px;
    border-radius:12px;
}

.minute{
    font-weight:700;
    color:var(--accent);
    font-size:13.5px;
}

.player-link{
    color:var(--ink);
    text-decoration:none;
    font-weight:700;
    font-size:13.5px;
}
.player-link:hover{color:var(--accent);}

.team-link{
    color:#fff;
    text-decoration:none;
}
.team-link:hover{opacity:.8;}

.loading{
    text-align:center;
    padding:50px;
    font-size:15px;
    color:var(--muted);
    font-style:italic;
}

.empty{
    color:var(--muted);
    padding:10px 0;
    font-size:13.5px;
}

@media(max-width:900px){
.grid{
    grid-template-columns:1fr;
}
}

</style>
</head>
<body>

<div class="navbar">
    <a href="./index.html">Home</a>
    <a href="./on-this-day.html">On This Day</a>
    <a href="./racing.html">Racing</a>
    <a href="./afl.html">AFL</a>
    <a href="./nrl.html">NRL</a>
    <a href="./football.html">Football</a>
    <a href="./cricket.html">Cricket</a>
    <a href="./baseball.html">Baseball</a>
    <a href="./f1.html">F1</a>
    <a href="./nba.html">NBA</a>
    <a href="./nhl.html">NHL</a>
    <a href="./ufc.html">UFC</a>
    <a href="./nfl.html">NFL</a>
    <a href="./tennis.html">Tennis</a>
    <a href="./olympics.html">Olympics</a>
    <a href="laliga.html">La Liga</a>
    <a href="laliga-teams.html">Teams</a>
    <a href="laliga-players.html">Players</a>
</div>

<div class="hero">
    <div class="teams" id="teams">Loading Match...</div>
    <div class="score" id="score"></div>
    <div class="details" id="details"></div>
    <div class="venue" id="venue"></div>
</div>

<div class="container">
    <div id="content" class="loading">Loading match...</div>
</div>

<script>

const params     = new URLSearchParams(window.location.search);
const matchId    = params.get("match");
const season     = params.get("season");
const matchDate  = params.get("date")  || '';
const matchVenue = params.get("venue") || '';

const teamsEl   = document.getElementById("teams");
const scoreEl   = document.getElementById("score");
const detailsEl = document.getElementById("details");
const venueEl   = document.getElementById("venue");
const content   = document.getElementById("content");

function slugify(name){
    return name
        .toLowerCase()
        .replace(/\./g,'')
        .replace(/'/g,'')
        .replace(/"/g,'')
        .replace(/\s+/g,'-');
}

async function loadMatch(){

    try{

        const response = await fetch(`/data/laliga/matches/${season}/${matchId}.json`);

        if(!response.ok){
            throw new Error("Match not found");
        }

        const match = await response.json();

        renderMatch(match);

    }catch(err){

        console.error(err);
        content.innerHTML = `<div class="loading">Failed to load match</div>`;

    }

}

function renderEvents(events, label){

    if(!events || !events.length){
        return `<div class="empty">No ${label}</div>`;
    }

    return `
        <div class="event-list">
            ${events.map(event => `
                <div class="event">
                    <div>
                        <a class="player-link"
                           href="/laliga-player.html?player=${slugify(event.player)}">
                           ${event.player || ''}
                        </a>
                        ${event.penalty ? ' (P)' : ''}
                        ${event.own_goal ? ' (OG)' : ''}
                    </div>
                    <div class="minute">${event.minute || ''}'</div>
                </div>
            `).join('')}
        </div>
    `;

}

function renderMatch(match){

    document.title = `${match.home_team} vs ${match.away_team} | La Liga Match`;

    teamsEl.innerHTML = `
        <a class="team-link"
           href="/laliga-team.html?team=${encodeURIComponent(match.home_team)}">
           ${match.home_team}
        </a>
        vs
        <a class="team-link"
           href="/laliga-team.html?team=${encodeURIComponent(match.away_team)}">
           ${match.away_team}
        </a>
    `;

    scoreEl.textContent = `${match.home_score ?? '-'} - ${match.away_score ?? '-'}`;
    detailsEl.textContent = match.date  || matchDate;
    venueEl.textContent   = match.venue || matchVenue;

    content.innerHTML = `
        <div class="grid">

            <div class="card">
                <h2>Goalscorers</h2>
                ${renderEvents(match.scorers, 'goalscorers')}
            </div>

            <div class="card">
                <h2>Yellow Cards</h2>
                ${renderEvents(match.yellow_cards, 'yellow cards')}
            </div>

            <div class="card">
                <h2>Red Cards</h2>
                ${renderEvents(match.red_cards, 'red cards')}
            </div>

        </div>
    `;

}

loadMatch();

</script>

</body>
</html>
