<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Tournament | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#0c6f3c;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e3e7eb;
  --zebra:#f3f8f4;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#08552d,#0c6f3c);
  color:#fff;
  text-align:center;
  padding:40px 20px;
}

.hero h1{
  margin:0;
  font-size:40px;
}

/* PAGE */
.page{
  max-width:1000px;
  margin:auto;
  padding:25px;
}

/* TABLE */
.table-card{
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:var(--green);
  color:#fff;
}

th, td{
  padding:12px;
  font-size:14px;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/majors.html">Majors</a>
  <a href="/players.html">Players</a>
</div>

<div class="hero">
  <h1 id="title">Tournament</h1>
</div>

<div class="page">

<div class="table-card">
<table>
<thead>
<tr>
  <th>Year</th>
  <th>Winner</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>
function getParam(name){
  const url=new URL(window.location.href);
  return url.searchParams.get(name);
}

async function load(){
  const tournament=getParam("tournament");

  document.getElementById("title").textContent=tournament;

  const res=await fetch("/data/golf/pga_winners.json");
  const data=await res.json();

  const rows=data
    .filter(d=>d.event===tournament)
    .sort((a,b)=>b.year-a.year);

  const tbody=document.getElementById("tableBody");

  rows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r.year}</td>
      <td>${r.winner}</td>
    `;
    tbody.appendChild(tr);
  });
}

load();
</script>

</body>
</html>
