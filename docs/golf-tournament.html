<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Tournament | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#0c6f3c;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e3e7eb;
  --zebra:#f3f8f4;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.hero{
  background:linear-gradient(135deg,#08552d,#0c6f3c);
  color:#fff;
  text-align:center;
  padding:40px 20px;
}

.hero h1{
  margin:0;
  font-size:34px;
  text-transform:capitalize;
}

.page{
  max-width:1000px;
  margin:auto;
  padding:25px;
}

.table-card{
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:var(--green);
  color:#fff;
}

th, td{
  padding:12px;
  font-size:14px;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/majors.html">Majors</a>
  <a href="/players.html">Players</a>
</div>

<div class="hero">
  <h1 id="title">Loading...</h1>
</div>

<div class="page">

<div class="table-card">
<table>
<thead>
<tr>
  <th>Year</th>
  <th>Winner</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>
function clean(name){
  if(!name) return "";

  return String(name)
    .replace(/\s*\(.*?\)/g,"")
    .replace(/\*/g,"")
    .trim()
    .split(/\/|&| and /i)[0]
    .trim();
}

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-");
}

// 🔥 KEY FIX
function matchTournament(dataName, urlSlug){
  const s1 = slug(dataName);
  const s2 = urlSlug;

  return s1 === s2 || s1.includes(s2) || s2.includes(s1);
}

async function load(){
  const params = new URLSearchParams(location.search);
  const tournamentSlug = params.get("tournament");

  const res = await fetch("/data/golf/pga_winners.json");
  const data = await res.json();

  const rows = [];

  data.forEach(d=>{
    const name = d.event || d.tournament || d.name || "";

    if(!name) return;

    if(matchTournament(name, tournamentSlug)){
      rows.push({
        year: d.year,
        winner: clean(d.winner),
        tournament: name
      });
    }
  });

  if(rows.length === 0){
    document.getElementById("title").innerText = "Tournament not found";
    return;
  }

  // set title nicely
  document.getElementById("title").innerText = rows[0].tournament;

  const tbody = document.getElementById("tbody");

  rows
    .sort((a,b)=>b.year-a.year)
    .forEach(r=>{
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${r.year}</td>
        <td>${r.winner}</td>
      `;

      tbody.appendChild(tr);
    });
}

load();
</script>

</body>
</html>
