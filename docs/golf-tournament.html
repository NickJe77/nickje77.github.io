<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Tournament | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:36px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.page{max-width:900px;margin:0 auto;padding:26px 20px 70px;}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
a{color:var(--ink);text-decoration:none;font-weight:700;}
a:hover{color:var(--accent);}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
  <a href="golf-majors.html">Majors</a>
</div>

<div class="hero">
<span class="eyebrow">The Sporting Almanac</span>
<h1 id="title">Loading...</h1>
</div>

<div class="page">

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Year</th>
<th>Winner</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>

/* GET URL PARAM */
function getParam(name){
const url=new URL(window.location.href);
return url.searchParams.get(name);
}

/* NORMALISE STRING */
function clean(str){
return (str||"")
.toLowerCase()
.replace(/\s+/g," ")
.trim();
}

async function load(){

const tournamentParam=getParam("tournament");

if(!tournamentParam){
document.getElementById("title").textContent="Tournament not found";
return;
}

const decoded=decodeURIComponent(tournamentParam);

const res=await fetch("/data/golf/pga_winners.json");
const data=await res.json();

/* MATCH PROPERLY */
const rows=data.filter(d=>clean(d.event)===clean(decoded));

if(rows.length===0){
document.getElementById("title").textContent="Tournament not found";
return;
}

/* SORT */
rows.sort((a,b)=>b.year-a.year);

/* SET TITLE */
document.getElementById("title").textContent=rows[0].event;

/* DRAW TABLE */
const tbody=document.getElementById("tableBody");
tbody.innerHTML="";

rows.forEach(r=>{
const tr=document.createElement("tr");

tr.innerHTML=`
<td>${r.year}</td>
<td>
<a href="/golf-player.html?player=${encodeURIComponent(r.winner)}">
${r.winner}
</a>
</td>
`;

tbody.appendChild(tr);
});

}

load();

</script>

</body>
</html>
