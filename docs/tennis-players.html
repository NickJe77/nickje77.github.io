<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Players | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
"Segoe UI",Roboto,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

/* NAV */
.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* HERO */
.hero{
position:relative;
height:260px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
overflow:hidden;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.6);
}

.hero-content{
position:relative;
z-index:2;
}

/* WRAP */
.wrap{
max-width:900px;
margin:0 auto;
padding:40px 20px;
}

/* SEARCH */
.search-box{
position:relative;
background:#fff;
padding:25px;
border-radius:18px;
box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.search-box input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

/* 🔥 DROPDOWN */
.dropdown{
position:absolute;
top:80px;
left:25px;
right:25px;
background:#fff;
border-radius:12px;
box-shadow:0 8px 24px rgba(0,0,0,0.1);
max-height:300px;
overflow:auto;
z-index:10;
}

.dropdown div{
padding:12px;
cursor:pointer;
border-bottom:1px solid #eee;
}

.dropdown div:hover,
.dropdown .active{
background:#eef3ff;
}

button{
margin-top:12px;
padding:12px 18px;
border:none;
border-radius:10px;
background:#0056d6;
color:#fff;
font-weight:700;
cursor:pointer;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html">Tennis</a>
<a href="tennis-players.html">Players</a>
</div>

<div class="hero">
<img src="/images/tennis-hero.jpg">
<div class="hero-content">
<h1>Tennis Players</h1>
<p>Search any player</p>
</div>
</div>

<div class="wrap">

<div class="search-box">

<input id="search" placeholder="Start typing a player name...">

<div id="dropdown" class="dropdown" style="display:none;"></div>

<button onclick="goToPlayer()">Search</button>

</div>

</div>

<script>

let players = [];
let currentIndex = -1;

// LOAD PLAYERS
async function loadPlayers(){

  try{
    let res = await fetch('/data/tennis/players.json');

    if(!res.ok){
      res = await fetch('/docs/data/tennis/players.json');
    }

    players = await res.json();

  }catch(e){
    console.error("Error loading players", e);
  }
}

// SEARCH INPUT
const input = document.getElementById("search");
const dropdown = document.getElementById("dropdown");

input.addEventListener("input", function(){

  const q = this.value.toLowerCase();

  if(!q){
    dropdown.style.display = "none";
    return;
  }

  const results = players.filter(p =>
    p.toLowerCase().includes(q)
  ).slice(0,15);

  renderDropdown(results);

});

// RENDER DROPDOWN
function renderDropdown(list){

  dropdown.innerHTML = "";

  if(!list.length){
    dropdown.style.display = "none";
    return;
  }

  list.forEach((p,i)=>{
    const div = document.createElement("div");
    div.textContent = p;

    div.onclick = ()=>{
      input.value = p;
      dropdown.style.display = "none";
    };

    dropdown.appendChild(div);
  });

  dropdown.style.display = "block";
  currentIndex = -1;
}

// KEYBOARD NAV
input.addEventListener("keydown", function(e){

  const items = dropdown.querySelectorAll("div");

  if(e.key === "ArrowDown"){
    currentIndex++;
  }

  if(e.key === "ArrowUp"){
    currentIndex--;
  }

  if(e.key === "Enter"){
    if(currentIndex >= 0 && items[currentIndex]){
      input.value = items[currentIndex].textContent;
    }
    goToPlayer();
  }

  items.forEach(el => el.classList.remove("active"));

  if(items[currentIndex]){
    items[currentIndex].classList.add("active");
  }

});

// GO TO PLAYER PAGE
function goToPlayer(){
  const name = input.value.trim();
  if(!name) return;

  location.href =
    `tennis-player.html?player=${encodeURIComponent(name)}`;
}

// CLOSE DROPDOWN
document.addEventListener("click", e=>{
  if(!e.target.closest(".search-box")){
    dropdown.style.display = "none";
  }
});

// INIT
loadPlayers();

</script>

</body>
</html>
