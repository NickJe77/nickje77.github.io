<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Players | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
"Segoe UI",Roboto,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

/* NAV */
.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* HERO */
.hero{
position:relative;
height:260px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
overflow:hidden;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.6);
}

.hero-content{
position:relative;
z-index:2;
}

/* WRAP */
.wrap{
max-width:900px;
margin:0 auto;
padding:40px 20px;
}

/* SEARCH */
.search-box{
background:#fff;
padding:25px;
border-radius:18px;
box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.search-box input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

/* RESULTS */
.results{
margin-top:20px;
background:#fff;
border-radius:18px;
box-shadow:0 6px 20px rgba(0,0,0,0.08);
max-height:400px;
overflow:auto;
}

.result-item{
padding:14px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.result-item:hover{
background:#f0f4ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html">Tennis</a>
<a href="tennis-players.html">Players</a>
</div>

<div class="hero">
<img src="/images/tennis-hero.jpg">
<div class="hero-content">
<h1>Tennis Players</h1>
<p>Search any player</p>
</div>
</div>

<div class="wrap">

<div class="search-box">
<input id="search" placeholder="Start typing a player name...">
</div>

<div id="results" class="results"></div>

</div>

<script>

let players = [];

// LOAD PLAYERS
fetch('/data/tennis/players.json')
.then(r => r.json())
.then(data => {
  players = data.sort();
});

// SEARCH
document.getElementById("search").addEventListener("input", function(){

  const q = this.value.toLowerCase();

  const filtered = players.filter(p =>
    p.toLowerCase().includes(q)
  ).slice(0,50);

  render(filtered);

});

// RENDER
function render(list){

  const container = document.getElementById("results");

  if(!list.length){
    container.innerHTML = "";
    return;
  }

  container.innerHTML = "";

  list.forEach(p => {

    const div = document.createElement("div");
    div.className = "result-item";
    div.textContent = p;

    div.onclick = () => {
      location.href =
        `tennis-player.html?player=${encodeURIComponent(p)}`;
    };

    container.appendChild(div);

  });

}

</script>

</body>
</html>
