<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Players | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
font-family:var(--body);
margin:0;
background:var(--bg);
color:var(--ink);
-webkit-font-smoothing:antialiased;
}

/* NAV */
.navbar{
display:flex;
justify-content:center;
gap:20px;
padding:15px;
border-bottom:1px solid var(--line);
background:var(--surface);
font-weight:600;
font-size:13.5px;
flex-wrap:wrap;
}

.navbar a{
color:var(--ink);
text-decoration:none;
opacity:.7;
transition:opacity .15s,color .15s;
}
.navbar a:hover{opacity:1;color:var(--accent);}

/* HERO */
.hero{
position:relative;
height:240px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#fff;
overflow:hidden;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(160deg,rgba(12,19,15,.75),rgba(12,19,15,.88));
}

.hero-content{
position:relative;
z-index:2;
}

.hero-content h1{
margin:0;
font-family:var(--display);
font-weight:600;
font-size:clamp(28px,5vw,40px);
letter-spacing:.01em;
text-transform:uppercase;
}
.hero-content p{
margin-top:8px;
font-size:14px;
color:rgba(255,255,255,.68);
}

/* WRAP */
.wrap{
max-width:900px;
margin:0 auto;
padding:34px 20px 70px;
}

/* SEARCH */
.search-box{
position:relative;
background:var(--surface);
border:1px solid var(--line);
padding:24px;
border-radius:var(--radius);
}

.search-box input{
width:100%;
padding:12px 18px;
border-radius:999px;
border:1px solid var(--line);
background:var(--surface);
font-family:var(--body);
font-size:14px;
font-weight:600;
color:var(--ink);
box-sizing:border-box;
}
.search-box input:hover{border-color:var(--faint);}
.search-box input:focus{outline:none;border-color:var(--accent);}

.dropdown{
position:absolute;
top:78px;
left:24px;
right:24px;
background:var(--surface);
border-radius:14px;
box-shadow:0 14px 30px -12px rgba(10,16,24,.4);
max-height:300px;
overflow:auto;
z-index:10;
}

.dropdown div{
padding:12px 16px;
cursor:pointer;
font-weight:600;
font-size:13.5px;
border-bottom:1px solid var(--line);
}
.dropdown div:last-child{border-bottom:none;}

.dropdown div:hover,
.dropdown .active{
background:var(--accent-soft);
}

button{
margin-top:12px;
padding:11px 22px;
border:none;
border-radius:999px;
background:var(--board);
color:#fff;
font-weight:600;
font-size:13.5px;
font-family:var(--body);
cursor:pointer;
}
button:hover{background:#000;}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
<a href="nba.html">NBA</a>
<a href="nhl.html">NHL</a>
<a href="ufc.html">UFC</a>
<a href="nfl.html">NFL</a>
<a href="tennis.html">Tennis</a>
<a href="tennis-players.html">Players</a>
</div>

<div class="hero">
<img src="/images/tennis-hero.jpg">
<div class="hero-content">
<h1>Tennis Players</h1>
<p>Search any player</p>
</div>
</div>

<div class="wrap">

<div class="search-box">

<input id="search" placeholder="Start typing a player name...">

<div id="dropdown" class="dropdown" style="display:none;"></div>

<button onclick="goToPlayer()">Search</button>

</div>

</div>

<script>

let players = [];
let currentIndex = -1;

// LOAD PLAYERS
async function loadPlayers(){

  try{
    let res = await fetch('/data/tennis/players.json');

    if(!res.ok){
      res = await fetch('/docs/data/tennis/players.json');
    }

    players = await res.json();

  }catch(e){
    console.error("Error loading players", e);
  }
}

// SEARCH INPUT
const input = document.getElementById("search");
const dropdown = document.getElementById("dropdown");

input.addEventListener("input", function(){

  const q = this.value.toLowerCase();

  if(!q){
    dropdown.style.display = "none";
    return;
  }

  const results = players.filter(p =>
    p.toLowerCase().includes(q)
  ).slice(0,15);

  renderDropdown(results);

});

// RENDER DROPDOWN
function renderDropdown(list){

  dropdown.innerHTML = "";

  if(!list.length){
    dropdown.style.display = "none";
    return;
  }

  list.forEach((p,i)=>{
    const div = document.createElement("div");
    div.textContent = p;

    div.onclick = ()=>{
      input.value = p;
      dropdown.style.display = "none";
    };

    dropdown.appendChild(div);
  });

  dropdown.style.display = "block";
  currentIndex = -1;
}

// KEYBOARD NAV
input.addEventListener("keydown", function(e){

  const items = dropdown.querySelectorAll("div");

  if(e.key === "ArrowDown"){
    currentIndex++;
  }

  if(e.key === "ArrowUp"){
    currentIndex--;
  }

  if(e.key === "Enter"){
    if(currentIndex >= 0 && items[currentIndex]){
      input.value = items[currentIndex].textContent;
    }
    goToPlayer();
  }

  items.forEach(el => el.classList.remove("active"));

  if(items[currentIndex]){
    items[currentIndex].classList.add("active");
  }

});

// GO TO PLAYER PAGE
function goToPlayer(){
  const name = input.value.trim();
  if(!name) return;

  location.href =
    `tennis-player.html?player=${encodeURIComponent(name)}`;
}

// CLOSE DROPDOWN
document.addEventListener("click", e=>{
  if(!e.target.closest(".search-box")){
    dropdown.style.display = "none";
  }
});

// INIT
loadPlayers();

</script>

</body>
</html>
