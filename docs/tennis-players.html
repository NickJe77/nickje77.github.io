<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Players | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
"Segoe UI",Roboto,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

/* NAVBAR */
.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* HERO */
.hero{
position:relative;
height:260px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
overflow:hidden;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
top:0;
left:0;
z-index:0;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.6);
z-index:1;
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{
margin:0;
font-size:40px;
}

.hero p{
margin-top:10px;
font-size:18px;
opacity:0.95;
}

/* WRAP */
.wrap{
max-width:900px;
margin:0 auto;
padding:40px 20px;
}

/* SEARCH BOX */
.search-box{
background:#fff;
padding:25px;
border-radius:18px;
box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.search-box input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

button{
margin-top:12px;
padding:12px 18px;
border:none;
border-radius:10px;
background:#0056d6;
color:#fff;
font-weight:700;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html">Tennis</a>
<a href="tennis-players.html">Players</a>
</div>

<!-- HERO -->
<div class="hero">
<img src="/images/tennis-hero.jpg" alt="Tennis">
<div class="hero-content">
<h1>Tennis Players</h1>
<p>Search any player</p>
</div>
</div>

<div class="wrap">

<div class="search-box">

<input 
  id="playerInput"
  list="playersList"
  placeholder="Start typing a player name..."
>

<datalist id="playersList"></datalist>

<button onclick="goToPlayer()">Search</button>

</div>

</div>

<script>

let players = [];

// LOAD PLAYERS
async function loadPlayers(){
  try{
    let res = await fetch('/data/tennis/players.json');

    // fallback for GitHub Pages structure
    if(!res.ok){
      res = await fetch('/docs/data/tennis/players.json');
    }

    if(!res.ok){
      console.error("players.json not found");
      return;
    }

    players = await res.json();

    buildList();

  }catch(e){
    console.error("Error loading players", e);
  }
}

// BUILD DATALIST (PREDICTIVE SEARCH)
function buildList(){
  const list = document.getElementById("playersList");
  list.innerHTML = "";

  players.sort().forEach(p=>{
    const opt = document.createElement("option");
    opt.value = p;
    list.appendChild(opt);
  });
}

// NAVIGATE TO PLAYER PAGE
function goToPlayer(){
  const name = document.getElementById("playerInput").value.trim();
  if(!name) return;

  location.href =
    `tennis-player.html?player=${encodeURIComponent(name)}`;
}

// ENTER KEY SUPPORT
document.getElementById("playerInput").addEventListener("keypress", e=>{
  if(e.key === "Enter"){
    goToPlayer();
  }
});

// INIT
loadPlayers();

</script>

</body>
</html>
