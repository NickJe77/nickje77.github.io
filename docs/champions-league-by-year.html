<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>European Champions League – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:white;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.navbar a:hover{
  text-decoration:underline;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

h1{
  text-align:center;
  margin-bottom:30px;
}

.year-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:10px;
  margin-bottom:40px;
}

.year-btn{
  background:#111;
  color:white;
  text-align:center;
  padding:10px 0;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.year-btn.active{
  background:#0056d6;
}

.year-btn:hover{
  background:#333;
}

.section-box{
  border:1px solid #ddd;
  border-radius:12px;
  padding:20px;
  margin-bottom:30px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.summary-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
}

.summary-box h3{
  margin-top:0;
  margin-bottom:10px;
}
</style>
</head>

<body>

<!-- NAV BAR -->
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="football.html">Football</a>
  <a href="champions-league.html">Champions League</a>
  <a href="champions-league-by-year.html">By Year</a>
</div>

<div class="page-wrap">

<h1>European Champions League – By Year</h1>

<!-- YEAR BUTTONS -->
<div class="year-grid" id="yearGrid"></div>

<!-- SEASON SUMMARY -->
<div class="section-box">
  <h2>Season Summary</h2>
  <div class="summary-grid">
    <div class="summary-box">
      <h3>Winner</h3>
      <div id="winner"></div>
    </div>
    <div class="summary-box">
      <h3>Runner-up</h3>
      <div id="runnerUp"></div>
    </div>
    <div class="summary-box">
      <h3>Top Scorers</h3>
      <div id="topScorers"></div>
    </div>
  </div>
</div>

<!-- MATCH RESULTS -->
<div id="matches"></div>

</div>

<script>
// Years to display
const years = [
2025,2024,2023,2022,2021,2020,2019,2018,2017,2016,
2015,2014,2013,2012,2011,2010,2009,2008,2007,2006,
2005,2004,2003,2002,2001,2000,1999,1998,1997,1996,
1995,1994,1993,1992,1991,1990,1989,1988,1987,1986,
1985,1984,1983,1982,1981,1980,1979,1978,1977,1976,
1975,1974,1973,1972,1971,1970,1969,1968,1967,1966,
1965,1964,1963,1962,1961,1960,1959,1958,1957,1956,1955
];

const yearGrid = document.getElementById("yearGrid");

years.forEach(y=>{
  const d=document.createElement("div");
  d.className="year-btn";
  d.innerText=y;
  d.onclick=()=>selectYear(y,d);
  yearGrid.appendChild(d);
});

function selectYear(year,btn){
  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  // PLACEHOLDER until JSON wiring
  document.getElementById("winner").innerText="—";
  document.getElementById("runnerUp").innerText="—";
  document.getElementById("topScorers").innerText="—";

  document.getElementById("matches").innerHTML="";
}

// default select first year
yearGrid.firstChild.classList.add("active");
</script>

</body>
</html>
