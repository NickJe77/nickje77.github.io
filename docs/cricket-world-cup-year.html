<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket World Cup – Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body {
  font-family: Inter, system-ui, Arial, sans-serif;
  margin: 0;
  background: white;
}

.navbar {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 16px 0;
  border-bottom: 1px solid #ddd;
  font-weight: 600;
}

.navbar a {
  color: #0056d6;
  text-decoration: none;
  font-size: 18px;
}

.navbar a:hover {
  text-decoration: underline;
}

.page-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin: 25px 0;
}

.summary-box {
  border: 1px solid #ddd;
  border-radius: 18px;
  padding: 18px;
  text-align: center;
  background: #f9fafc;
}

.summary-box h3 {
  margin: 0 0 8px 0;
  font-size: 15px;
  color: #555;
}

.summary-box strong {
  font-size: 20px;
}

.section-title {
  margin-top: 40px;
  margin-bottom: 10px;
  font-size: 22px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  padding: 10px 8px;
  border-bottom: 1px solid #ddd;
  text-align: left;
  font-size: 14px;
}

th {
  background: #f2f4f8;
}

tr:hover {
  background: #f9fafc;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="cricket-world-cup.html">Cricket World Cup</a>
</div>

<div class="page-wrap">

<h1 id="title">Cricket World Cup</h1>

<div class="summary">
  <div class="summary-box">
    <h3>Winner</h3>
    <strong id="winner">—</strong>
  </div>
  <div class="summary-box">
    <h3>Runner-up</h3>
    <strong id="runnerUp">—</strong>
  </div>
  <div class="summary-box">
    <h3>Top Run Scorer</h3>
    <strong id="topRuns">—</strong>
  </div>
  <div class="summary-box">
    <h3>Top Wicket Taker</h3>
    <strong id="topWickets">—</strong>
  </div>
</div>

<h2 class="section-title">Matches</h2>
<table id="matchesTable">
  <thead>
    <tr>
      <th>Date</th>
      <th>Team 1</th>
      <th>Team 2</th>
      <th>Result</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const year = params.get("year");

document.getElementById("title").textContent = "Cricket World Cup " + year;

// CSV paths
const MATCH_RESULTS = "data/cwc_match_results.csv";
const BY_TOURNAMENT = "data/cwc_by_tournament.csv";
const BATTING = "data/cwc_batting_summary.csv";
const BOWLING = "data/cwc_bowling_summary.csv";

Promise.all([
  fetch(MATCH_RESULTS).then(r => r.text()),
  fetch(BY_TOURNAMENT).then(r => r.text()),
  fetch(BATTING).then(r => r.text()),
  fetch(BOWLING).then(r => r.text())
]).then(([matchesText, tournamentText, battingText, bowlingText]) => {

  const matches = parseCSV(matchesText).filter(r => r.tournament_year === year);
  const tournament = parseCSV(tournamentText).find(r => r.tournament_year === year);
  const batting = parseCSV(battingText).filter(r => r.tournament_year === year);
  const bowling = parseCSV(bowlingText).filter(r => r.tournament_year === year);

  if (tournament) {
    document.getElementById("winner").textContent = tournament.winner;
    document.getElementById("runnerUp").textContent = tournament.runner_up;
  }

  if (batting.length) {
    batting.sort((a, b) => Number(b.runs) - Number(a.runs));
    document.getElementById("topRuns").textContent =
      batting[0].player + " (" + batting[0].runs + ")";
  }

  if (bowling.length) {
    bowling.sort((a, b) => Number(b.wickets) - Number(a.wickets));
    document.getElementById("topWickets").textContent =
      bowling[0].player + " (" + bowling[0].wickets + ")";
  }

  const tbody = document.querySelector("#matchesTable tbody");
  matches.forEach(m => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${m.date}</td>
      <td>${m.team1}</td>
      <td>${m.team2}</td>
      <td>${m.result}</td>
    `;
    tbody.appendChild(tr);
  });

});

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines.shift().split(",");
  return lines.map(line => {
    const obj = {};
    line.split(",").forEach((val, i) => {
      obj[headers[i]] = val;
    });
    return obj;
  });
}
</script>

</body>
</html>
