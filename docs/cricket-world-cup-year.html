<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket World Cup – Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:white;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}
.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}
h1{text-align:center;}
.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
  margin:30px 0;
}
.card{
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:left;
}
th{background:#f4f4f4;}
.section-title{
  margin-top:50px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/racing.html">Racing</a>
  <a href="/afl.html">AFL</a>
  <a href="/football.html">Football</a>
  <a href="/cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<h1 id="title">Cricket World Cup</h1>

<div class="summary" id="summary"></div>

<h2 class="section-title">Matches</h2>
<table id="matches">
<thead>
<tr><th>Date</th><th>Team 1</th><th>Team 2</th><th>Winner</th></tr>
</thead>
<tbody></tbody>
</table>

<h2 class="section-title">Top Run Scorers</h2>
<table id="batting">
<thead>
<tr><th>Player</th><th>Runs</th></tr>
</thead>
<tbody></tbody>
</table>

<h2 class="section-title">Top Wicket Takers</h2>
<table id="bowling">
<thead>
<tr><th>Player</th><th>Wickets</th></tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>
const year = new URLSearchParams(window.location.search).get("year");
document.getElementById("title").textContent = `Cricket World Cup ${year}`;

function parseCSV(text){
  const lines = text.trim().split("\n");
  const headers = lines.shift().split(",");
  return lines.map(line=>{
    const values=line.split(",");
    let obj={};
    headers.forEach((h,i)=>obj[h]=values[i]);
    return obj;
  });
}

async function loadData(){
  const matchCSV = await fetch("/data/cwc_match_results.csv").then(r=>r.text());
  const batCSV = await fetch("/data/cwc_batting_summary.csv").then(r=>r.text());
  const bowlCSV = await fetch("/data/cwc_bowling_summary.csv").then(r=>r.text());
  const tourCSV = await fetch("/data/cwc_by_tournament.csv").then(r=>r.text());

  const matches=parseCSV(matchCSV).filter(r=>r.year==year);
  const batting=parseCSV(batCSV).filter(r=>r.year==year);
  const bowling=parseCSV(bowlCSV).filter(r=>r.year==year);
  const tournament=parseCSV(tourCSV).find(r=>r.year==year);

  const summary=document.getElementById("summary");
  summary.innerHTML=`
    <div class="card"><b>Winner</b><br>${tournament?.winner||"N/A"}</div>
    <div class="card"><b>Matches</b><br>${matches.length}</div>
  `;

  const matchBody=document.querySelector("#matches tbody");
  matches.forEach(m=>{
    matchBody.innerHTML+=`<tr>
      <td>${m.date}</td>
      <td>${m.team1}</td>
      <td>${m.team2}</td>
      <td>${m.winner}</td>
    </tr>`;
  });

  batting.sort((a,b)=>b.runs-a.runs).slice(0,10).forEach(p=>{
    document.querySelector("#batting tbody").innerHTML+=
      `<tr><td>${p.player}</td><td>${p.runs}</td></tr>`;
  });

  bowling.sort((a,b)=>b.wickets-a.wickets).slice(0,10).forEach(p=>{
    document.querySelector("#bowling tbody").innerHTML+=
      `<tr><td>${p.player}</td><td>${p.wickets}</td></tr>`;
  });
}

loadData();
</script>

</body>
</html>
