<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket World Cup – Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
h1{text-align:center;}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:30px 0;}
.card{border:1px solid #ddd;border-radius:14px;padding:16px;background:#f9fafc;}
.card .k{font-size:13px;color:#666;margin-bottom:6px;font-weight:700;text-transform:uppercase;}
.card .v{font-size:20px;font-weight:800;}
.section-title{margin-top:40px;}
table{width:100%;border-collapse:collapse;margin-top:12px;}
th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left;font-size:14px;}
th{background:#f2f4f8;}
.notice{padding:14px;border:1px dashed #ccc;border-radius:12px;margin:12px 0;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="cricket-world-cup.html">Cricket World Cup</a>
</div>

<div class="page-wrap">

<h1 id="title">Cricket World Cup</h1>

<div class="summary">
  <div class="card"><div class="k">Matches</div><div class="v" id="matchesCount">—</div></div>
  <div class="card"><div class="k">Winner</div><div class="v" id="winner">—</div></div>
  <div class="card"><div class="k">Top Run Scorer</div><div class="v" id="topRuns">—</div></div>
  <div class="card"><div class="k">Top Wicket Taker</div><div class="v" id="topWickets">—</div></div>
</div>

<h2 class="section-title">Matches</h2>
<table id="matchesTbl">
<thead>
<tr><th>Date</th><th>Team 1</th><th>Team 2</th><th>Winner</th><th>Venue</th></tr>
</thead>
<tbody></tbody>
</table>

<h2 class="section-title">Top Run Scorers</h2>
<table id="runsTbl">
<thead>
<tr><th>Player</th><th>Runs</th></tr>
</thead>
<tbody></tbody>
</table>

<h2 class="section-title">Top Wicket Takers</h2>
<table id="wktsTbl">
<thead>
<tr><th>Player</th><th>Wickets</th></tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>
const year = new URLSearchParams(location.search).get("year");
document.getElementById("title").textContent = "Cricket World Cup " + year;

const MATCHES_URL = "data/cwc_match_results.csv";
const BATTING_URL = "data/cwc_by_tournament.csv";
const BOWLING_URL = "data/cwc_bowling_summary.csv";

function parseCSV(text){
  const rows = [];
  let row=[], field="", inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c=='"'&&inQ&&n=='"'){field+='"';i++;continue;}
    if(c=='"'){inQ=!inQ;continue;}
    if(c==","&&!inQ){row.push(field);field="";continue;}
    if(c=="\n"&&!inQ){row.push(field);rows.push(row);row=[];field="";continue;}
    if(c!="\r")field+=c;
  }
  if(field||row.length){row.push(field);rows.push(row);}
  const headers=rows.shift().map(h=>h.trim());
  return rows.map(r=>{
    const o={};
    headers.forEach((h,i)=>o[h]=(r[i]||"").trim());
    return o;
  });
}

function yearFromDate(d){
  return d ? d.slice(0,4) : "";
}

Promise.all([
  fetch(MATCHES_URL).then(r=>r.text()),
  fetch(BATTING_URL).then(r=>r.text()),
  fetch(BOWLING_URL).then(r=>r.text())
]).then(([mText,bText,boText])=>{

  const matches=parseCSV(mText).filter(r=>yearFromDate(r.date)==year);
  const batting=parseCSV(bText).filter(r=>r.year==year);
  const bowling=parseCSV(boText).filter(r=>r.year==year);

  document.getElementById("matchesCount").textContent = matches.length;

  if(matches.length){
    document.getElementById("winner").textContent = matches[matches.length-1].winner;
  }

  batting.sort((a,b)=>Number(b.runs)-Number(a.runs));
  if(batting.length){
    document.getElementById("topRuns").textContent = batting[0].batter+" ("+batting[0].runs+")";
  }

  bowling.sort((a,b)=>Number(b.wickets)-Number(a.wickets));
  if(bowling.length){
    document.getElementById("topWickets").textContent = bowling[0].bowler+" ("+bowling[0].wickets+")";
  }

  const mBody=document.querySelector("#matchesTbl tbody");
  matches.forEach(m=>{
    mBody.innerHTML+=`<tr>
      <td>${m.date}</td>
      <td>${m.team1}</td>
      <td>${m.team2}</td>
      <td>${m.winner}</td>
      <td>${m.venue}</td>
    </tr>`;
  });

  const rBody=document.querySelector("#runsTbl tbody");
  batting.slice(0,10).forEach(p=>{
    rBody.innerHTML+=`<tr><td>${p.batter}</td><td>${p.runs}</td></tr>`;
  });

  const wBody=document.querySelector("#wktsTbl tbody");
  bowling.slice(0,10).forEach(p=>{
    wBody.innerHTML+=`<tr><td>${p.bowler}</td><td>${p.wickets}</td></tr>`;
  });

});
</script>

</body>
</html>
