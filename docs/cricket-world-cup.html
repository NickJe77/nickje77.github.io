<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket World Cup (Men) | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
.hero{background:linear-gradient(135deg,#0b2d5c,#1e4fa3);color:#fff;padding:40px;border-radius:22px;margin-bottom:22px;}
.hero h1{margin:0 0 10px;font-size:42px;}
.hero p{margin:0;font-size:18px;opacity:.9;}
.controls{display:flex;gap:12px;align-items:center;margin:18px 0 20px;flex-wrap:wrap;}
.controls input{flex:1;min-width:220px;padding:12px 14px;font-size:16px;border-radius:14px;border:1px solid #ccc;}
.btn{padding:10px 16px;border-radius:999px;border:2px solid #0056d6;background:#fff;color:#0056d6;font-weight:700;cursor:pointer;}
.btn.active{background:#0056d6;color:#fff;}
.meta{margin-left:auto;color:#444;font-size:14px;}
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px;}
.year-card{border:1px solid #ddd;border-radius:18px;padding:20px;text-align:center;cursor:pointer;transition:.15s;background:#fff;}
.year-card:hover{box-shadow:0 4px 10px rgba(0,0,0,.08);transform:translateY(-2px);}
.year-card h2{margin:0;font-size:28px;}
.year-card span{display:block;margin-top:8px;color:#666;}
.notice{padding:14px;border:1px dashed #d7d7d7;border-radius:14px;color:#444;display:none;}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">
  <div class="hero">
    <h1>Cricket World Cup (Men)</h1>
    <p>Every match, every player, every dismissal — built from ball-by-ball data.</p>
  </div>

  <div class="controls">
    <input id="search" type="text" placeholder="Search year (e.g. 1999) …">
    <button id="asc" class="btn active" type="button">Oldest → Newest</button>
    <button id="desc" class="btn" type="button">Newest → Oldest</button>
    <div id="meta" class="meta"></div>
  </div>

  <div id="notice" class="notice"></div>
  <div id="grid" class="year-grid"></div>
</div>

<script>
const MATCHES_URL = "data/cwc_match_results.csv";
const YEAR_PAGE = "cricket-world-cup-year.html?year=";

function parseCSV(text){
  // Robust enough for your CSVs (handles quoted commas)
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if (c === '"' && inQuotes && n === '"'){ field += '"'; i++; continue; }
    if (c === '"'){ inQuotes = !inQuotes; continue; }
    if (c === ',' && !inQuotes){ row.push(field); field=""; continue; }
    if (c === '\n' && !inQuotes){ row.push(field); rows.push(row); row=[]; field=""; continue; }
    if (c !== '\r') field += c;
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  const headers = (rows.shift() || []).map(h => h.trim());
  return rows
    .filter(r => r.length && r.some(x => String(x).trim() !== ""))
    .map(r => {
      const o = {};
      headers.forEach((h,idx) => o[h] = (r[idx] ?? "").trim());
      return o;
    });
}

function pick(obj, candidates){
  for (const k of candidates){
    if (obj[k] !== undefined && obj[k] !== "") return obj[k];
  }
  return "";
}

function extractYearFromDate(d){
  if (!d) return "";
  const y = String(d).slice(0,4);
  return /^\d{4}$/.test(y) ? y : "";
}

function render(years, order){
  const grid = document.getElementById("grid");
  const meta = document.getElementById("meta");
  grid.innerHTML = "";
  meta.textContent = years.length ? `${years.length} World Cups` : "";

  const sorted = [...years].sort((a,b) => order==="desc" ? Number(b)-Number(a) : Number(a)-Number(b));
  for (const y of sorted){
    const card = document.createElement("div");
    card.className = "year-card";
    card.innerHTML = `<h2>${y}</h2><span>View matches & stats</span>`;
    card.onclick = () => location.href = YEAR_PAGE + encodeURIComponent(y);
    grid.appendChild(card);
  }
}

(async function init(){
  const notice = document.getElementById("notice");
  try{
    const res = await fetch(MATCHES_URL, {cache:"no-store"});
    if (!res.ok) throw new Error(`Could not load ${MATCHES_URL} (${res.status})`);
    const text = await res.text();
    const rows = parseCSV(text);

    // Expecting at least a "date" column (from your generator)
    const yearsSet = new Set();
    for (const r of rows){
      const date = pick(r, ["date","Date"]);
      const y = extractYearFromDate(date);
      if (y) yearsSet.add(y);
    }
    let allYears = Array.from(yearsSet);

    if (!allYears.length){
      notice.style.display = "block";
      notice.textContent = "No years found. Check that cwc_match_results.csv has a 'date' column like YYYY-MM-DD.";
      return;
    }

    // UI
    let order = "asc";
    let filtered = allYears;

    const search = document.getElementById("search");
    const asc = document.getElementById("asc");
    const desc = document.getElementById("desc");

    function apply(){
      const q = search.value.trim();
      filtered = q ? allYears.filter(y => y.includes(q)) : allYears;
      render(filtered, order);
    }
    asc.onclick = () => { order="asc"; asc.classList.add("active"); desc.classList.remove("active"); apply(); };
    desc.onclick = () => { order="desc"; desc.classList.add("active"); asc.classList.remove("active"); apply(); };
    search.addEventListener("input", apply);

    apply();
  }catch(e){
    notice.style.display = "block";
    notice.textContent = "Could not load World Cup data. Confirm docs/data/cwc_match_results.csv exists and is committed.";
    console.error(e);
  }
})();
</script>
</body>
</html>
