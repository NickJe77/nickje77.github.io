<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket World Cup (Men)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Inter, system-ui, Arial, sans-serif;
  margin: 0;
  background: #ffffff;
}

.navbar {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 16px 0;
  border-bottom: 1px solid #ddd;
  font-weight: 600;
}

.navbar a {
  color: #0056d6;
  text-decoration: none;
  font-size: 18px;
}

.page-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px;
}

.hero {
  background: linear-gradient(135deg, #0a2a66, #1f4fa3);
  color: white;
  padding: 40px;
  border-radius: 22px;
  margin-bottom: 30px;
}

.hero h1 {
  margin: 0 0 10px 0;
  font-size: 40px;
}

.year-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 18px;
}

.year-card {
  border: 1px solid #ddd;
  border-radius: 16px;
  padding: 22px;
  text-align: center;
  cursor: pointer;
  background: white;
  transition: 0.15s ease;
}

.year-card:hover {
  background: #f3f6ff;
  transform: translateY(-2px);
}

.year-card h2 {
  margin: 0;
  font-size: 28px;
}

.year-card span {
  display: block;
  margin-top: 8px;
  color: #666;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1>Cricket World Cup (Men)</h1>
    <p>Every tournament, every match, every player — built from ball-by-ball data.</p>
  </div>

  <div id="yearGrid" class="year-grid"></div>

</div>

<script>
const DATA_URL = "data/cwc_match_results.csv"; // this file has the date column

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines.shift().split(",");

  return lines.map(line => {
    const values = line.split(",");
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (values[i] || "").trim());
    return obj;
  });
}

fetch(DATA_URL)
  .then(res => {
    if (!res.ok) throw new Error("CSV not found");
    return res.text();
  })
  .then(text => {
    const data = parseCSV(text);

    if (!data.length) {
      document.getElementById("yearGrid").innerHTML =
        "<p style='color:red'>CSV loaded but contains no rows.</p>";
      return;
    }

    if (!("date" in data[0])) {
      document.getElementById("yearGrid").innerHTML =
        "<p style='color:red'>CSV must contain a 'date' column.</p>";
      return;
    }

    const years = [...new Set(
      data
        .map(r => new Date(r.date).getFullYear())
        .filter(y => !isNaN(y))
    )].sort((a, b) => a - b);

    const grid = document.getElementById("yearGrid");
    grid.innerHTML = "";

    years.forEach(year => {
      const card = document.createElement("div");
      card.className = "year-card";
      card.innerHTML = `
        <h2>${year}</h2>
        <span>View matches & stats</span>
      `;
      card.onclick = () => {
        window.location.href = "cricket-world-cup-year.html?year=" + year;
      };
      grid.appendChild(card);
    });
  })
  .catch(err => {
    document.getElementById("yearGrid").innerHTML =
      "<p style='color:red'>Failed to load World Cup data.</p>";
    console.error(err);
  });
</script>

</body>
</html>
