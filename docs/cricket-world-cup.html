<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket World Cup (Men)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #ffffff;
}

.navbar {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 16px 0;
  border-bottom: 1px solid #ddd;
  font-weight: 600;
}

.navbar a {
  color: #0056d6;
  text-decoration: none;
  font-size: 18px;
}

.navbar a:hover {
  text-decoration: underline;
}

.page-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px;
}

.hero {
  background: #123b8a;
  color: white;
  padding: 40px;
  border-radius: 20px;
  margin-bottom: 30px;
}

.hero h1 {
  margin: 0 0 10px 0;
  font-size: 40px;
}

.controls {
  margin-bottom: 25px;
}

.year-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 18px;
}

.year-card {
  border: 1px solid #ddd;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  background: white;
}

.year-card:hover {
  background: #f3f6ff;
}

.year-card h2 {
  margin: 0;
  font-size: 28px;
}

.year-card span {
  display: block;
  margin-top: 8px;
  color: #666;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1>Cricket World Cup (Men)</h1>
    <p>Every tournament from 1975 to today.</p>
  </div>

  <div id="yearGrid" class="year-grid"></div>

</div>

<script>
const years = [
  1975, 1979, 1983, 1987,
  1992, 1996, 1999,
  2003, 2007, 2011,
  2015, 2019, 2023
];

const grid = document.getElementById("yearGrid");

years.forEach(year => {
  const card = document.createElement("div");
  card.className = "year-card";
  card.innerHTML = `
    <h2>${year}</h2>
    <span>View matches & stats</span>
  `;
  card.onclick = () => {
    window.location.href = "cricket-world-cup-year.html?year=" + year;
  };
  grid.appendChild(card);
});
</script>

</body>
</html>
