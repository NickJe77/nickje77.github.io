<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket World Cup (Men) | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body {
  font-family: Inter, system-ui, Arial, sans-serif;
  margin: 0;
  background: white;
}

.navbar {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 16px 0;
  border-bottom: 1px solid #ddd;
  font-weight: 600;
}

.navbar a {
  color: #0056d6;
  text-decoration: none;
  font-size: 18px;
}

.navbar a:hover {
  text-decoration: underline;
}

.page-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px;
}

.hero {
  background: linear-gradient(135deg, #0b2d5c, #1e4fa3);
  color: white;
  padding: 40px;
  border-radius: 22px;
  margin-bottom: 30px;
}

.hero h1 {
  margin: 0 0 10px 0;
  font-size: 42px;
}

.hero p {
  margin: 0;
  font-size: 18px;
  opacity: 0.9;
}

.controls {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 25px;
  flex-wrap: wrap;
}

.controls input {
  flex: 1;
  padding: 14px 16px;
  font-size: 16px;
  border-radius: 14px;
  border: 1px solid #ccc;
}

.toggle-btn {
  padding: 12px 18px;
  border-radius: 20px;
  border: 2px solid #0056d6;
  background: white;
  color: #0056d6;
  font-weight: 600;
  cursor: pointer;
}

.toggle-btn.active {
  background: #0056d6;
  color: white;
}

.year-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 18px;
}

.year-card {
  border: 1px solid #ddd;
  border-radius: 18px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: 0.15s;
  background: white;
}

.year-card:hover {
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  transform: translateY(-2px);
}

.year-card h2 {
  margin: 0;
  font-size: 28px;
}

.year-card span {
  display: block;
  margin-top: 8px;
  color: #666;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1>Cricket World Cup (Men)</h1>
    <p>Every match, every player, every dismissal — built from ball-by-ball data.</p>
  </div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search year (e.g. 1999) …">
    <button id="oldestBtn" class="toggle-btn active">Oldest → Newest</button>
    <button id="newestBtn" class="toggle-btn">Newest → Oldest</button>
  </div>

  <div id="yearGrid" class="year-grid"></div>

</div>

<script>
const YEARS = [2003, 2007, 2011, 2015, 2019, 2023];
const YEAR_PAGE = "cricket-world-cup-year.html?year=";

let ascending = true;

const grid = document.getElementById("yearGrid");
const searchBox = document.getElementById("searchBox");
const oldestBtn = document.getElementById("oldestBtn");
const newestBtn = document.getElementById("newestBtn");

function renderYears() {
  grid.innerHTML = "";

  let filtered = YEARS.filter(y =>
    y.toString().includes(searchBox.value)
  );

  let ordered = ascending ? filtered : [...filtered].reverse();

  ordered.forEach(year => {
    const card = document.createElement("div");
    card.className = "year-card";
    card.innerHTML = `
      <h2>${year}</h2>
      <span>View matches & stats</span>
    `;
    card.onclick = () => {
      window.location.href = YEAR_PAGE + year;
    };
    grid.appendChild(card);
  });
}

oldestBtn.onclick = () => {
  ascending = true;
  oldestBtn.classList.add("active");
  newestBtn.classList.remove("active");
  renderYears();
};

newestBtn.onclick = () => {
  ascending = false;
  newestBtn.classList.add("active");
  oldestBtn.classList.remove("active");
  renderYears();
};

searchBox.addEventListener("input", renderYears);

renderYears();
</script>

</body>
</html>
