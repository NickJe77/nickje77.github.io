<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races – Jockeys & Trainers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/racing.css">

  <style>
    .hk-wrap {
      max-width: 1200px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }

    .hk-filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #f3f7fc;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e1e8f0;
      text-align: left;
    }

    tbody tr:nth-child(even) {
      background: #f5f9ff;
    }

    @media (max-width: 900px) {
      .hk-filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<nav class="home-nav">
  <a href="/index.html">Home</a>
  <a href="/racing.html">Racing</a>
  <a href="/hong-kong.html">Hong Kong</a>
  <a href="/hk-jockeys-trainers.html" class="active">Jockeys & Trainers</a>
</nav>

<div class="hk-wrap">

  <h1>Hong Kong International Races – Jockeys & Trainers</h1>

  <div class="hk-filters">
    <div>
      <label>Jockey</label>
      <select id="jockey">
        <option value="">All jockeys</option>
      </select>
    </div>

    <div>
      <label>Trainer</label>
      <select id="trainer">
        <option value="">All trainers</option>
      </select>
    </div>

    <div>
      <label>Race</label>
      <select id="race">
        <option value="">All races</option>
      </select>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Horse</th>
        <th>Jockey</th>
        <th>Trainer</th>
        <th>SP</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="6">Loading data…</td></tr>
    </tbody>
  </table>

</div>

<script>
/* =========================================================
   HK JOCKEYS & TRAINERS – INLINE (CACHE SAFE)
   ========================================================= */

fetch("https://thesportingalmanac.com/data/hong-kong-jockeys-trainers.json")
  .then(r => r.json())
  .then(data => {

    const jockeySel  = document.getElementById("jockey");
    const trainerSel = document.getElementById("trainer");
    const raceSel    = document.getElementById("race");
    const rows       = document.getElementById("rows");

    const jockeys  = [...new Set(data.map(d => d.jockey))].sort();
    const trainers = [...new Set(data.map(d => d.trainer))].sort();
    const races    = [...new Set(data.map(d => d.race))].sort();

    jockeys.forEach(v => jockeySel.add(new Option(v, v)));
    trainers.forEach(v => trainerSel.add(new Option(v, v)));
    races.forEach(v => raceSel.add(new Option(v, v)));

    function render() {
      rows.innerHTML = "";

      const j = jockeySel.value;
      const t = trainerSel.value;
      const r = raceSel.value;

      const filtered = data.filter(d =>
        (!j || d.jockey === j) &&
        (!t || d.trainer === t) &&
        (!r || d.race === r)
      );

      if (!filtered.length) {
        rows.innerHTML = `<tr><td colspan="6">No matching rides</td></tr>`;
        return;
      }

      filtered.forEach(d => {
        rows.insertAdjacentHTML("beforeend", `
          <tr>
            <td>${d.year}</td>
            <td>${d.race}</td>
            <td>${d.horse}</td>
            <td>${d.jockey}</td>
            <td>${d.trainer}</td>
            <td>${d.sp || ""}</td>
          </tr>
        `);
      });
    }

    jockeySel.onchange = render;
    trainerSel.onchange = render;
    raceSel.onchange = render;

    render();
  });
</script>

</body>
</html>
