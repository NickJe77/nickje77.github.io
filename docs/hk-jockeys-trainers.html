<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races – Jockeys & Trainers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/racing.css">

  <style>
    .hk-wrap {
      max-width: 1200px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }

    .hk-filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .hk-filters label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    .hk-filters input {
      width: 100%;
      height: 44px;
      padding: 6px 10px;
      font-size: 15px;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #f3f7fc;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e1e8f0;
      text-align: left;
    }

    tbody tr:nth-child(even) {
      background: #f5f9ff;
    }

    @media (max-width: 900px) {
      .hk-filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<nav class="home-nav">
  <a href="/index.html">Home</a>
  <a href="/racing.html">Racing</a>
  <a href="/hong-kong.html">Hong Kong</a>
  <a href="/hk-jockeys-trainers.html" class="active">Jockeys & Trainers</a>
</nav>

<div class="hk-wrap">

  <h1>Hong Kong International Races – Jockeys & Trainers</h1>

  <!-- PREDICTIVE FILTERS -->
  <div class="hk-filters">
    <div>
      <label>Jockey</label>
      <input id="jockeyInput" list="jockeyList" placeholder="Type jockey name">
      <datalist id="jockeyList"></datalist>
    </div>

    <div>
      <label>Trainer</label>
      <input id="trainerInput" list="trainerList" placeholder="Type trainer name">
      <datalist id="trainerList"></datalist>
    </div>

    <div>
      <label>Race</label>
      <input id="raceInput" list="raceList" placeholder="Type race name">
      <datalist id="raceList"></datalist>
    </div>
  </div>

  <!-- RESULTS -->
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Horse</th>
        <th>Jockey</th>
        <th>Trainer</th>
        <th>SP</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="6">Loading data…</td></tr>
    </tbody>
  </table>

</div>

<script>
/* =========================================================
   HK JOCKEYS & TRAINERS – PREDICTIVE FILTERS
   ========================================================= */

fetch("https://thesportingalmanac.com/data/hong-kong-jockeys-trainers.json")
  .then(r => r.json())
  .then(data => {

    const jockeyInput  = document.getElementById("jockeyInput");
    const trainerInput = document.getElementById("trainerInput");
    const raceInput    = document.getElementById("raceInput");

    const jockeyList  = document.getElementById("jockeyList");
    const trainerList = document.getElementById("trainerList");
    const raceList    = document.getElementById("raceList");

    const rows = document.getElementById("rows");

    // Build predictive lists
    [...new Set(data.map(d => d.jockey))].sort()
      .forEach(v => jockeyList.innerHTML += `<option value="${v}">`);

    [...new Set(data.map(d => d.trainer))].sort()
      .forEach(v => trainerList.innerHTML += `<option value="${v}">`);

    [...new Set(data.map(d => d.race))].sort()
      .forEach(v => raceList.innerHTML += `<option value="${v}">`);

    function render() {
      rows.innerHTML = "";

      const j = jockeyInput.value.toLowerCase();
      const t = trainerInput.value.toLowerCase();
      const r = raceInput.value.toLowerCase();

      const filtered = data.filter(d =>
        (!j || d.jockey.toLowerCase().includes(j)) &&
        (!t || d.trainer.toLowerCase().includes(t)) &&
        (!r || d.race.toLowerCase().includes(r))
      );

      if (!filtered.length) {
        rows.innerHTML = `<tr><td colspan="6">No matching rides</td></tr>`;
        return;
      }

      filtered.forEach(d => {
        rows.innerHTML += `
          <tr>
            <td>${d.year}</td>
            <td>${d.race}</td>
            <td>${d.horse}</td>
            <td>${d.jockey}</td>
            <td>${d.trainer}</td>
            <td>${d.sp || ""}</td>
          </tr>
        `;
      });
    }

    jockeyInput.addEventListener("input", render);
    trainerInput.addEventListener("input", render);
    raceInput.addEventListener("input", render);

    render();
  });
</script>

</body>
</html>
