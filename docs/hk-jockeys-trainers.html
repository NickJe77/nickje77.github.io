<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races – Jockeys & Trainers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="racing.css">

  <style>
    /* HERO */
    .hk-hero {
      max-width: 1200px;
      margin: 36px auto 40px;
      padding: 0 24px;
    }

    .hk-hero img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
      /* NO direction logic. NONE. */
    }

    /* PAGE WRAP */
    .hk-wrap {
      max-width: 1200px;
      margin: 0 auto 90px;
      padding: 0 24px;
    }

    /* FILTERS */
    .hk-filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin: 18px 0 26px;
      align-items: end;
    }

    .hk-filters label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    .hk-filters input {
      width: 100%;
      height: 48px;
      padding: 10px 12px;
      font-size: 16px;
      border-radius: 10px;
      box-sizing: border-box;
      font-family: inherit;
    }

    /* TABLE */
    .archive-table {
      overflow-x: auto;
      border: 1px solid #d6e4f2;
      border-radius: 14px;
    }

    .archive-table table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
    }

    .archive-table thead {
      background: #f3f7fc;
    }

    .archive-table th,
    .archive-table td {
      padding: 14px 12px;
      border-bottom: 1px solid #e1e8f0;
      text-align: left;
      vertical-align: top;
      word-wrap: break-word;
    }

    .archive-table tbody tr:nth-child(even) {
      background: #f5f9ff;
    }

    @media (max-width: 900px) {
      .hk-filters { grid-template-columns: 1fr; }
      .hk-hero img { height: 240px; }
    }
  </style>
</head>

<body>

<nav class="home-nav">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="hong-kong.html">Hong Kong</a>
  <a href="hk-jockeys-trainers.html" class="active">Jockeys & Trainers</a>
</nav>

<!-- HERO IMAGE -->
<div class="hk-hero">
  <img src="images/hk-hero-jt.jpg" alt="Hong Kong International Races">
</div>

<div class="hk-wrap">
  <h1>Hong Kong International Races – Jockeys & Trainers</h1>

  <!-- PREDICTIVE FILTERS -->
  <div class="hk-filters">
    <div>
      <label>Jockey</label>
      <input id="jockeyInput" list="jockeyList" placeholder="Type jockey name">
      <datalist id="jockeyList"></datalist>
    </div>

    <div>
      <label>Trainer</label>
      <input id="trainerInput" list="trainerList" placeholder="Type trainer name">
      <datalist id="trainerList"></datalist>
    </div>

    <div>
      <label>Race</label>
      <input id="raceInput" list="raceList" placeholder="Type race name">
      <datalist id="raceList"></datalist>
    </div>
  </div>

  <!-- RESULTS TABLE -->
  <div class="archive-table">
    <table>
      <thead>
        <tr>
          <th>Year</th>
          <th>Race</th>
          <th>Finish</th>
          <th>Horse</th>
          <th>Jockey</th>
          <th>Trainer</th>
          <th>SP</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="7">Loading data…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
fetch("data/hong-kong-jockeys-trainers.json")
  .then(res => res.json())
  .then(data => {

    const jockeyInput  = document.getElementById("jockeyInput");
    const trainerInput = document.getElementById("trainerInput");
    const raceInput    = document.getElementById("raceInput");

    const jockeyList  = document.getElementById("jockeyList");
    const trainerList = document.getElementById("trainerList");
    const raceList    = document.getElementById("raceList");

    const rows = document.getElementById("rows");

    data.sort((a, b) => (b.year || 0) - (a.year || 0));

    [...new Set(data.map(d => d.jockey).filter(Boolean))].sort()
      .forEach(v => jockeyList.innerHTML += `<option value="${v}">`);

    [...new Set(data.map(d => d.trainer).filter(Boolean))].sort()
      .forEach(v => trainerList.innerHTML += `<option value="${v}">`);

    [...new Set(data.map(d => d.race).filter(Boolean))].sort()
      .forEach(v => raceList.innerHTML += `<option value="${v}">`);

    function render() {
      rows.innerHTML = "";

      const j = jockeyInput.value.toLowerCase();
      const t = trainerInput.value.toLowerCase();
      const r = raceInput.value.toLowerCase();

      const filtered = data.filter(d =>
        (!j || (d.jockey || "").toLowerCase().includes(j)) &&
        (!t || (d.trainer || "").toLowerCase().includes(t)) &&
        (!r || (d.race || "").toLowerCase().includes(r))
      );

      if (!filtered.length) {
        rows.innerHTML = `<tr><td colspan="7">No matching rides</td></tr>`;
        return;
      }

      filtered.forEach(d => {
        rows.innerHTML += `
          <tr>
            <td>${d.year}</td>
            <td>${d.race}</td>
            <td>${d.finish ?? ""}</td>
            <td>${d.horse}</td>
            <td>${d.jockey}</td>
            <td>${d.trainer}</td>
            <td>${d.sp ?? ""}</td>
          </tr>
        `;
      });
    }

    jockeyInput.addEventListener("input", render);
    trainerInput.addEventListener("input", render);
    raceInput.addEventListener("input", render);

    render();
  });
</script>

</body>
</html>
