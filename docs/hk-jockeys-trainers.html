<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races – Jockeys & Trainers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/racing.css">

  <style>
    .hk-page {
      max-width: 1200px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }

    .hk-page h1 {
      margin-bottom: 28px;
    }

    .hk-filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .hk-filters label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .hk-filters select {
      width: 100%;
      height: 44px;
      padding: 6px 10px;
      font-size: 15px;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead {
      background: #f3f7fc;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e1e8f0;
      text-align: left;
    }

    tbody tr:nth-child(even) {
      background: #f5f9ff;
    }

    @media (max-width: 900px) {
      .hk-filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<nav class="home-nav">
  <a href="/index.html">Home</a>
  <a href="/racing.html">Racing</a>
  <a href="/hong-kong.html">Hong Kong</a>
  <a href="/hk-jockeys-trainers.html" class="active">Jockeys & Trainers</a>
</nav>

<div class="hk-page">

  <h1>Hong Kong International Races – Jockeys & Trainers</h1>

  <div class="hk-filters">
    <div>
      <label for="jockeySelect">Jockey</label>
      <select id="jockeySelect">
        <option value="">All jockeys</option>
      </select>
    </div>

    <div>
      <label for="trainerSelect">Trainer</label>
      <select id="trainerSelect">
        <option value="">All trainers</option>
      </select>
    </div>

    <div>
      <label for="raceSelect">Race</label>
      <select id="raceSelect">
        <option value="">All races</option>
      </select>
    </div>
  </div>

  <table id="resultsTable">
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Horse</th>
        <th>Jockey</th>
        <th>Trainer</th>
        <th>SP</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="6">Loading data…</td>
      </tr>
    </tbody>
  </table>

</div>

<script src="/js/hong-kong-jockeys-trainers.js"></script>
</body>
</html>
