<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races – Jockeys & Trainers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/racing.css">
</head>

<body>

<nav class="home-nav">
  <a href="/index.html">Home</a>
  <a href="/racing.html">Racing</a>
  <a href="/hong-kong.html">Hong Kong</a>
  <a href="/hk-jockeys-trainers.html" class="active">Jockeys & Trainers</a>
</nav>

<div style="max-width:1200px;margin:40px auto;padding:0 24px;">

  <h1>Hong Kong International Races – Jockeys & Trainers</h1>

  <p id="js-status" style="color:red;font-weight:bold;">
    JS NOT RUNNING
  </p>

  <table border="1" width="100%" style="margin-top:20px;">
    <tbody id="debug-output">
      <tr><td>Waiting for JS…</td></tr>
    </tbody>
  </table>

</div>

<script>
  // 🔴 THIS SHOULD ALWAYS RUN
  document.getElementById("js-status").textContent = "INLINE JS RUNNING";
  document.getElementById("debug-output").innerHTML =
    "<tr><td>Inline JavaScript executed successfully</td></tr>";

  fetch("https://thesportingalmanac.com/data/hong-kong-jockeys-trainers.json")
    .then(r => r.json())
    .then(d => {
      document.getElementById("debug-output").innerHTML =
        "<tr><td>JSON loaded: " + d.length + " rows</td></tr>";
    })
    .catch(err => {
      document.getElementById("debug-output").innerHTML =
        "<tr><td>JSON ERROR</td></tr>";
    });
</script>

</body>
</html>
