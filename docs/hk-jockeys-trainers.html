<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races – Jockeys & Trainers | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Global styles -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="racing.css">

  <style>
    .hk-hero {
      max-width: 1200px;
      margin: 36px auto 50px;
      padding: 0 24px;
    }

    .hk-hero img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .page-intro {
      max-width: 900px;
      margin: 0 auto 40px;
      padding: 0 24px;
      text-align: center;
    }

    .page-intro h1 {
      font-size: 36px;
      margin-bottom: 14px;
    }

    .page-intro p {
      font-size: 18px;
      color: #444;
      line-height: 1.6;
    }

    .people-section {
      max-width: 1200px;
      margin: 0 auto 70px;
      padding: 0 24px;
    }

    .people-section h2 {
      font-size: 28px;
      margin-bottom: 16px;
    }

    .filters {
      max-width: 420px;
      margin-bottom: 24px;
    }

    .filters label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .filters select {
      width: 100%;
      height: 48px;
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 10px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .archive-table {
      overflow-x: auto;
      border: 1px solid #d6e4f2;
      border-radius: 14px;
    }

    .archive-table table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 15px;
    }

    .archive-table thead {
      background: #f3f7fc;
    }

    .archive-table th,
    .archive-table td {
      padding: 14px 12px;
      border-bottom: 1px solid #e1e8f0;
      text-align: left;
    }

    .archive-table tbody tr:nth-child(even) {
      background: #f5f9ff;
    }
  </style>
</head>

<body>

<nav class="home-nav">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="hong-kong.html">Hong Kong</a>
  <a href="hk-jockeys-trainers.html" class="active">Jockeys & Trainers</a>
</nav>

<div class="hk-hero">
  <img src="hong-kong-hero.jpg" alt="Hong Kong International Races">
</div>

<div class="page-intro">
  <h1>Hong Kong International Races – Jockeys & Trainers</h1>
  <p>
    A complete record of jockeys and trainers to have competed and won
    at the Hong Kong International Races.
  </p>
</div>

<section class="people-section">
  <h2>Jockeys</h2>

  <div class="filters">
    <label for="jockeySelect">Select Jockey</label>
    <select id="jockeySelect">
      <option value="">Choose a jockey</option>
    </select>
  </div>

  <div class="archive-table">
    <table id="jockeyTable">
      <thead>
        <tr>
          <th>Year</th>
          <th>Race</th>
          <th>Horse</th>
          <th>Trainer</th>
          <th>SP</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<section class="people-section">
  <h2>Trainers</h2>

  <div class="filters">
    <label for="trainerSelect">Select Trainer</label>
    <select id="trainerSelect">
      <option value="">Choose a trainer</option>
    </select>
  </div>

  <div class="archive-table">
    <table id="trainerTable">
      <thead>
        <tr>
          <th>Year</th>
          <th>Race</th>
          <th>Horse</th>
          <th>Jockey</th>
          <th>SP</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<script src="js/hong-kong-jockeys-trainers.js" defer></script>

</body>
</html>
