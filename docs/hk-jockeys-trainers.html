<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races – Jockeys & Trainers | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="racing.css">

  <style>
    .hk-page .container {
      max-width: 1200px;
      margin: 40px auto 90px;
      padding: 0 24px;
    }

    .hk-page h1 {
      text-align: center;
      margin-bottom: 36px;
    }

    .hk-page .filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
      margin-bottom: 36px;
    }

    .hk-page label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .hk-page select {
      width: 100%;
      height: 46px;
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 8px;
    }

    .hk-page table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    .hk-page thead {
      background: #f3f7fc;
    }

    .hk-page th,
    .hk-page td {
      padding: 12px;
      border-bottom: 1px solid #e1e8f0;
      text-align: left;
    }

    .hk-page tbody tr:nth-child(even) {
      background: #f5f9ff;
    }

    @media (max-width: 900px) {
      .hk-page .filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body class="hk-page">

<nav class="home-nav">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="hong-kong.html">Hong Kong</a>
  <a href="hk-jockeys-trainers.html" class="active">Jockeys & Trainers</a>
</nav>

<div class="container">

  <h1>Hong Kong International Races – Jockeys & Trainers</h1>

  <!-- FILTERS -->
  <div class="filters">
    <div>
      <label for="jockeySelect">Jockey</label>
      <select id="jockeySelect">
        <option value="">All jockeys</option>
      </select>
    </div>

    <div>
      <label for="trainerSelect">Trainer</label>
      <select id="trainerSelect">
        <option value="">All trainers</option>
      </select>
    </div>

    <div>
      <label for="raceSelect">Race</label>
      <select id="raceSelect">
        <option value="">All races</option>
      </select>
    </div>
  </div>

  <!-- RESULTS TABLE -->
  <table id="resultsTable">
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Horse</th>
        <th>Jockey</th>
        <th>Trainer</th>
        <th>SP</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script src="js/hong-kong-jockeys-trainers.js" defer></script>

</body>
</html>
