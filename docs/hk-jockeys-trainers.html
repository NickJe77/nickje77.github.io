<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races – Jockeys & Trainers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/racing.css">
</head>

<body>

<nav class="home-nav">
  <a href="/index.html">Home</a>
  <a href="/racing.html">Racing</a>
  <a href="/hong-kong.html">Hong Kong</a>
  <a href="/hk-jockeys-trainers.html" class="active">Jockeys & Trainers</a>
</nav>

<div style="max-width:1200px;margin:40px auto 80px;padding:0 24px;">

  <h1>Hong Kong International Races – Jockeys & Trainers</h1>

  <div class="filters" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:30px;">
    <div>
      <label for="jockeySelect">Jockey</label>
      <select id="jockeySelect">
        <option value="">All jockeys</option>
      </select>
    </div>

    <div>
      <label for="trainerSelect">Trainer</label>
      <select id="trainerSelect">
        <option value="">All trainers</option>
      </select>
    </div>

    <div>
      <label for="raceSelect">Race</label>
      <select id="raceSelect">
        <option value="">All races</option>
      </select>
    </div>
  </div>

  <table id="resultsTable" style="width:100%;border-collapse:collapse;">
    <thead style="background:#f3f7fc;">
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Horse</th>
        <th>Jockey</th>
        <th>Trainer</th>
        <th>SP</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="6">Loading data…</td></tr>
    </tbody>
  </table>

</div>

<script src="/js/hong-kong-jockeys-trainers.js" defer></script>
