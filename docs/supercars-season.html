<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Supercars Season | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}

.page{
  max-width:900px;
  margin:0 auto;
  padding:26px 20px 70px;
}

.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  padding:24px 28px;
}
.eyebrow{
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:14px;
  text-align:center;
}
.nav-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.nav-header a{
  color:rgba(255,255,255,.75);
  text-decoration:none;
  font-family:var(--body);
  font-weight:600;
  font-size:13px;
  white-space:nowrap;
  transition:color .15s;
}
.nav-header a:hover{ color:var(--accent); }
.nav-header a:empty{ visibility:hidden; }
h1{
  margin:0;
  text-align:center;
  flex:1;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(22px,4.5vw,32px);
  letter-spacing:.01em;
  text-transform:uppercase;
  color:#fff;
}

.table{
  width:100%;
  border-collapse:collapse;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}
.table th{
  background:#f7f9fb;
  color:var(--muted);
  padding:11px 14px;
  text-align:left;
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  border-bottom:1px solid var(--line);
}
.table td{
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  font-size:13.5px;
  color:#27313c;
  font-variant-numeric:tabular-nums;
}
.table td:first-child{
  font-weight:700;
  color:var(--ink);
}
.table tbody tr{ cursor:pointer; }
.table tbody tr:last-child td{ border-bottom:none; }
.table tbody tr:hover td{ background:#f9fbfd; }

.loading{
  text-align:center;
  color:var(--muted);
  font-style:italic;
  padding:20px;
}
</style>

</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./supercars.html">Supercars</a>
</div>

<div class="page">

  <div class="hero">
    <div class="eyebrow">V8 Supercars</div>
    <div class="nav-header">
      <a id="prev"></a>
      <h1 id="title">Loading...</h1>
      <a id="next"></a>
    </div>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Event</th>
        <th>Race</th>
        <th>Winner</th>
      </tr>
    </thead>
    <tbody id="races">
      <tr><td colspan="4" class="loading">Loading races...</td></tr>
    </tbody>
  </table>

</div>

<script>

// -------------------------
// GET YEAR
// -------------------------
const params = new URLSearchParams(window.location.search);
let year = parseInt(params.get("year"));

if(!year || isNaN(year)){
  document.getElementById("title").textContent = "No year selected";
  throw new Error("Missing year parameter");
}

// -------------------------
// BUILD PREV/NEXT NAV
// -------------------------
fetch("/data/supercars/index.json")
  .then(res => res.json())
  .then(index => {
    if(!Array.isArray(index)) return;

    const years = index.map(x => x.year).sort((a,b) => a - b);
    const i = years.indexOf(year);

    const prevYear = years[i - 1];
    const nextYear = years[i + 1];

    if(prevYear){
      const prev = document.getElementById("prev");
      prev.textContent = "← " + prevYear;
      prev.href = `./supercars-season.html?year=${prevYear}`;
    }
    if(nextYear){
      const next = document.getElementById("next");
      next.textContent = nextYear + " →";
      next.href = `./supercars-season.html?year=${nextYear}`;
    }
  });

// -------------------------
// LOAD SEASON DATA
// -------------------------
// Updated for the new supercars.com-sourced schema (supercars_official_{year}.json)
// -- the old thethirdturn.com-based file had no 2026 data.
fetch(`/data/supercars/supercars_official_${year}.json`)
  .then(res => {
    if(!res.ok) throw new Error("Fetch failed");
    return res.json();
  })
  .then(data => {
    if(!data || !Array.isArray(data.races)){
      document.getElementById("title").textContent = "Season not found";
      return;
    }

    document.getElementById("title").textContent = `${year} Supercars Season`;

    const tbody = document.getElementById("races");
    tbody.innerHTML = "";

    data.races.forEach(r => {
      const winnerEntry = (r.results || []).find(x => String(x.finishing_position) === "1");
      const winner = winnerEntry ? winnerEntry.driver_name : "";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.event_name || ""}</td>
        <td>${r.race_label || ""}</td>
        <td>${winner}</td>
      `;
      tr.onclick = () => {
        window.location.href = `./supercars-race.html?year=${year}&url=${encodeURIComponent(r.url)}`;
      };
      tbody.appendChild(tr);
    });
  })
  .catch(err => {
    document.getElementById("title").textContent = "Error loading season";
    console.error(err);
  });

</script>

</body>
</html>
