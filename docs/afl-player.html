<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AFL Player Profile</title>

<style>
body{
  font-family:system-ui, Arial, sans-serif;
  margin:20px;
}
h1{margin-bottom:10px;}
table{
  border-collapse:collapse;
  width:100%;
}
th,td{
  border:1px solid #ccc;
  padding:6px;
  text-align:center;
}
th{
  background:#eee;
}
td.left{
  text-align:left;
  font-weight:600;
}
</style>
</head>

<body>

<h1 id="playerName"></h1>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Round</th>
  <th>Team</th>
  <th>Opponent</th>
  <th>D</th>
  <th>G</th>
  <th>B</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<script>
const params = new URLSearchParams(window.location.search);
const playerName = params.get("name");

document.getElementById("playerName").textContent = playerName;

const startYear = 1990;
const endYear = new Date().getFullYear();

let years = [];
for(let y=startYear; y<=endYear; y++){
  years.push(y);
}

Promise.all(
  years.map(y =>
    fetch(`/data/afl/afl_${y}.json`)
      .then(r => r.json())
      .catch(() => [])
  )
).then(allData => {

  const allPlayers = allData.flat();

  const playerGames = allPlayers.filter(p => p.player === playerName);

  const tbody = document.getElementById("rows");

  playerGames.forEach(p => {
    tbody.innerHTML += `
      <tr>
        <td>${p.season}</td>
        <td>${p.round}</td>
        <td class="left">${p.played_for}</td>
        <td>${p.played_against}</td>
        <td>${p.D || 0}</td>
        <td>${p.G || 0}</td>
        <td>${p.B || 0}</td>
      </tr>
    `;
  });

});
</script>

</body>
</html>
