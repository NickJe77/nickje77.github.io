<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AFL Player Profile</title>

<style>
body{
  font-family:system-ui, Arial, sans-serif;
  margin:0;
  background:#f4f6f8;
}
.page{max-width:1200px;margin:0 auto;padding:25px;}
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  flex-wrap:wrap;
  gap:12px;
}
.name-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.team-stripes{height:22px;width:140px;border-radius:6px;border:1px solid #ccc;}

#playerSearch{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:17px;
  width:320px;
  max-width:100%;
}

@media (max-width:700px){
  #playerSearch{
    width:100%;
    font-size:18px;
    padding:12px 16px;
  }
}

.opponent-select{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
  width:240px;
}

h1{font-size:38px;margin:0;}

#summary{
  background:white;border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  padding:25px 30px;margin-bottom:20px;
}

.section-title{
  margin-top:16px;margin-bottom:6px;
  font-weight:700;color:#666;
  text-transform:uppercase;font-size:13px;
  letter-spacing:0.6px;
}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;}
.stat-box{
  background:linear-gradient(180deg,#f9fbff,#eef3fb);
  border-radius:12px;padding:16px 10px;text-align:center;
  box-shadow:inset 0 0 0 1px #dde3ec;
}
.stat-box strong{display:block;font-size:26px;margin-bottom:4px;}
.stat-box span{font-size:14px;color:#555;}
.stat-box em{display:block;font-size:12px;color:#777;margin-top:2px;}

table{
  border-collapse:collapse;width:100%;background:white;
  border-radius:10px;overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.06);
}
th,td{border:1px solid #ddd;padding:8px;text-align:center;}
th{cursor:pointer;background:#eef3fb;}
td.left{text-align:left;font-weight:600;}
tbody tr:nth-child(even){background:#f2f7ff;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#e8f0ff;}

.reset-sort{margin-top:10px;padding:6px 12px;border-radius:6px;border:1px solid #aaa;cursor:pointer;}
</style>
</head>

<body>
<div class="page">

<div class="top-bar">
  <div class="name-wrap">
    <h1 id="playerName"></h1>
    <div id="teamStripe" class="team-stripes"></div>
  </div>

  <div>
    <input id="playerSearch" list="playerList" placeholder="Search player...">
    <datalist id="playerList"></datalist>
  </div>
</div>

<div id="summary">
  <select id="opponentSelect" class="opponent-select">
    <option value="all">All Opponents</option>
  </select>

  <div class="section-title">Career Summary</div>
  <div class="stats" id="careerStats"></div>

  <div class="section-title">Vs Selected Opponent</div>
  <div class="stats" id="opponentStats"></div>
</div>

<button class="reset-sort" onclick="resetSort()">Reset Sort</button>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Round</th>
  <th>Team</th>
  <th>Opponent</th>
  <th>D</th>
  <th>G</th>
  <th>B</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

</div>

<script>
const params=new URLSearchParams(window.location.search);
const playerName=params.get("name")||"";
document.getElementById("playerName").textContent=playerName||"Select a player";

let allGames=[], currentGames=[];

const years=[];
for(let y=1990;y<=new Date().getFullYear();y++) years.push(y);

Promise.all(years.map(y=>fetch(`data/afl/afl_${y}.json`).then(r=>r.json()).catch(()=>[])))
.then(data=>{
  allGames=data.flat();

  const names=[...new Set(allGames.map(p=>p.player))].sort();
  const list=document.getElementById("playerList");
  names.forEach(n=>{
    const o=document.createElement("option");
    o.value=n; list.appendChild(o);
  });

  currentGames=allGames.filter(p=>p.player===playerName);

  if(currentGames.length){
    setupOpponents(currentGames);
    renderCareer(currentGames);
    renderOpponent([]);
    renderTable(currentGames);
  }
});

function setupOpponents(games){
  const sel=document.getElementById("opponentSelect");
  [...new Set(games.map(g=>g.played_against))].sort().forEach(o=>{
    const opt=document.createElement("option");
    opt.value=o; opt.textContent=o; sel.appendChild(opt);
  });

  sel.onchange=()=>{
    let f=games;
    if(sel.value!=="all") f=games.filter(g=>g.played_against===sel.value);
    renderOpponent(f);
    renderTable(f);
  };
}

function renderCareer(g){ renderStats(g,"careerStats"); }
function renderOpponent(g){ renderStats(g,"opponentStats"); }

function renderStats(g,id){
  if(!g.length){document.getElementById(id).innerHTML="";return;}

  const games=g.length;
  const ds=g.map(x=>x.D||0);
  const gs=g.map(x=>x.G||0);

  const bestD=Math.max(...ds);
  const bestG=Math.max(...gs);

  const bestDGames=g.filter(x=>x.D===bestD);
  const bestGGames=g.filter(x=>x.G===bestG);

  function detailLine(arr){
    if(arr.length===1){
      const m=arr[0];
      return `<em>${m.round}, ${m.season} vs ${m.played_against}</em>`;
    }
    return `<em>(${arr.length}×)</em>`;
  }

  document.getElementById(id).innerHTML=`
    <div class="stat-box">
      <strong>${games}</strong>
      <span>Games</span>
    </div>
    <div class="stat-box">
      <strong>${bestD}</strong>
      <span>Best Disposals</span>
      ${detailLine(bestDGames)}
    </div>
    <div class="stat-box">
      <strong>${bestG}</strong>
      <span>Best Goals</span>
      ${detailLine(bestGGames)}
    </div>
  `;
}

function renderTable(g){
  const tbody=document.getElementById("rows");
  tbody.innerHTML="";
  g.forEach(p=>{
    const tr=document.createElement("tr");
    tr.onclick=()=>location.href=
      `afl-game.html?season=${p.season}&round=${encodeURIComponent(p.round)}&team=${encodeURIComponent(p.played_for)}&opp=${encodeURIComponent(p.played_against)}`;
    tr.innerHTML=`
      <td>${p.season}</td>
      <td>${p.round}</td>
      <td class="left">${p.played_for}</td>
      <td>${p.played_against}</td>
      <td>${p.D||0}</td>
      <td>${p.G||0}</td>
      <td>${p.B||0}</td>
    `;
    tbody.appendChild(tr);
  });
}

function resetSort(){
  renderTable(currentGames);
}

document.getElementById("playerSearch").onchange=e=>{
  window.location.href="afl-player.html?name="+encodeURIComponent(e.target.value);
};
</script>
</body>
</html>
