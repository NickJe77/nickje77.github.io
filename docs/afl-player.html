<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --board-line:rgba(255,255,255,.10);
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;font-size:14px;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

.page{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero (title + search) ────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:20px;padding:22px 26px 26px;
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:8px;
}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,38px);letter-spacing:.01em;text-transform:uppercase;color:#fff;}
.team-stripes{height:8px;width:140px;border-radius:6px;border:1px solid var(--board-line);margin-top:14px;}
#playerSearch{
  padding:10px 16px;border-radius:999px;border:1px solid var(--board-line);background:rgba(255,255,255,.08);
  font-family:var(--body);font-size:13.5px;font-weight:500;width:280px;max-width:100%;color:#fff;
}
#playerSearch::placeholder{color:rgba(255,255,255,.45);}
#playerSearch:focus{outline:none;border-color:rgba(255,255,255,.35);}
@media (max-width:700px){#playerSearch{width:100%;}}

select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}
.opponent-select{width:220px;margin-bottom:16px;}

/* ── Summary card ─────────────────────────────────────── */
#summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:20px;}
.section-title{
  margin-top:20px;margin-bottom:10px;font-family:var(--display);font-weight:600;color:var(--muted);
  text-transform:uppercase;font-size:12.5px;letter-spacing:.1em;
}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 12px;text-align:center;}
.stat-box strong{display:block;font-family:var(--display);font-weight:600;font-size:26px;margin-bottom:4px;color:var(--ink);}
.stat-box span{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
.stat-box .sub{margin-top:6px;font-size:12px;color:var(--faint);line-height:1.5;text-transform:none;letter-spacing:0;font-weight:500;}

.top8-split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;}
.top8-card{border-radius:var(--radius);padding:16px 14px;border:1px solid var(--line);}
.top8-card.top8{background:#f0f9ef;border-color:#bfe0bd;}
.top8-card.non-top8{background:#fdf5ec;border-color:#eed3ae;}
.top8-card .t8-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.top8-card.top8 .t8-label{color:#2a7a2a;}
.top8-card.non-top8 .t8-label{color:#a05a10;}
.top8-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;}
.top8-mini strong{display:block;font-family:var(--display);font-size:20px;font-weight:600;margin-bottom:2px;}
.top8-card.top8 .top8-mini strong{color:#1a5c1a;}
.top8-card.non-top8 .top8-mini strong{color:#7a4010;}
.top8-mini span{font-size:11px;color:var(--muted);}
.top8-games{margin-top:8px;font-size:12px;text-align:center;color:var(--muted);}
@media(max-width:600px){.top8-split{grid-template-columns:1fr;}}

/* ── Tables ───────────────────────────────────────────── */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{padding:9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
th{
  cursor:pointer;background:#f7f9fb;font-family:var(--body);font-weight:600;font-size:11px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
}
td.left{text-align:left;font-weight:700;color:var(--ink);}
td{color:#27313c;font-variant-numeric:tabular-nums;}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:#f0f6ff;}
td.top8-badge{font-size:11px;color:#2a7a2a;font-weight:700;}
.reset-sort{

  background:var(--ink);color:#fff;font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;
}
.reset-sort:hover{opacity:.85;}
.loading{color:var(--muted);font-style:italic;padding:20px;font-size:13.5px;}

/* ── Disambiguation ───────────────────────────────────── */
.disambig{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:20px;}
.disambig h2{margin:0 0 8px;font-family:var(--display);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.01em;color:var(--ink);}
.disambig p{color:var(--muted);margin:0 0 18px;font-size:13.5px;}
.disambig-options{display:flex;flex-wrap:wrap;gap:12px;}
.disambig-card{
  display:flex;align-items:center;gap:10px;padding:14px 20px;border-radius:var(--radius);
  border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:15px;font-weight:600;
  background:var(--surface);transition:border-color .15s,box-shadow .15s,transform .15s;
}
.disambig-card:hover{border-color:var(--accent);box-shadow:0 10px 24px -14px rgba(10,16,24,.2);transform:translateY(-2px);}
.disambig-stripe{height:28px;width:40px;border-radius:6px;border:1px solid var(--line);flex-shrink:0;}

/* ── Teammates ────────────────────────────────────────── */
#teammatesSection{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:20px;}
#teammatesSection .section-title{margin-top:0;}
.teammate-controls{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.teammate-controls label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;}
#teammateSelect{width:260px;}
.teammate-names{
  text-align:center;font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);
  margin-bottom:16px;display:none;text-transform:uppercase;letter-spacing:.01em;
}
.teammate-names .amp{color:var(--accent);margin:0 10px;font-weight:600;}
.teammate-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.tstat-box{border-radius:var(--radius);padding:14px 10px;text-align:center;background:var(--surface);border:1px solid var(--line);}
.tstat-box strong{display:block;font-family:var(--display);font-size:26px;font-weight:600;margin-bottom:4px;}
.tstat-box.wins strong{color:#1a6b1a;}
.tstat-box.losses strong{color:#b01a1a;}
.tstat-box.draws strong{color:#7a6010;}
.tstat-box.winpct strong{color:var(--accent);}
.tstat-box span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
#teammateTable{display:none;}
#teammateTable .table-wrap{margin-top:0;}
.win-row td{background:#eef7ee !important;}
.loss-row td{background:#fef2f2 !important;}
.draw-row td{background:#fffbee !important;}
.result-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;}
.result-badge.W{background:#d0edcc;color:#1a5c1a;}
.result-badge.L{background:#fddcdc;color:#8c1a1a;}
.result-badge.D{background:#fef3cc;color:#6b5010;}
</style>

<script>
const DISAMBIG_GROUPS = {
  "Will Hayes": [["Western Bulldogs","Carlton"],["Collingwood"]],
  "Josh Kennedy": [["West Coast","Carlton"],["Sydney","Hawthorn"]],
};
// Confirmed same-player aliases: data-source variant name -> canonical name.
// Everything on the left gets folded into the name on the right wherever
// it appears (roster lookups, teammates, search, stat totals, etc).
// Add new confirmed pairs here as they're found — see findPotentialDuplicateNames()
// below for a tool that surfaces candidates for review instead of hunting by eye.
const PLAYER_NAME_ALIASES = {
  "Luke D-Uniacke": "Luke Davies-Uniacke",
  "Cooper D-Tytler": "Cooper Duff-Tytler",
  "Bailey Williams": "Bailey J. Williams",
};
const teamColours = {
  "Adelaide":"#002b5c,#e21937","Brisbane":"#7c0a02,#fdb827","Carlton":"#031a29,#ffffff",
  "Collingwood":"#000000,#ffffff","Essendon":"#cc2031,#000000","Fremantle":"#2a0f5a,#ffffff",
  "Geelong":"#002b5c,#ffffff","Gold Coast":"#c8102e,#fdb827","GWS":"#f37021,#333333",
  "Hawthorn":"#4b2c20,#fdb827","Melbourne":"#001a33,#c8102e","North Melbourne":"#003a8f,#ffffff",
  "Port Adelaide":"#008aab,#000000","Richmond":"#ffd100,#000000","St Kilda":"#ed1b2e,#000000",
  "Sydney":"#e1251b,#ffffff","West Coast":"#003087,#f2a900","Western Bulldogs":"#003087,#c8102e"
};
const playerSearchEl = document.getElementById("playerSearch");
const playerList     = document.getElementById("playerList");
const opponentSelect = document.getElementById("opponentSelect");
const rows           = document.getElementById("rows");
const loadingMsg     = document.getElementById("loadingMsg");
const params     = new URLSearchParams(location.search);
const playerName = normalizeName(params.get("name") || "");
const playerTeam = params.get("team") || "";
document.getElementById("playerName").textContent = playerName || "Select a player";
let allGames = [], currentGames = [], sortDir = -1, sortKey = null;
let top8BySeasonRound = {};
let gameResultMap = {};
let gameRosterMap = {};
const startYear = 1965, endYear = new Date().getFullYear();
// Unique per page load. Cloudflare (and the browser) have never seen this exact
// URL, so they cannot serve a stale cached copy — every load fetches the current
// files straight from the origin. This is what makes updated data show up.
const DATA_VERSION = Date.now();
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalizeDashes(str) {
  return str ? str.replace(/[\u2013\u2014]/g, '-') : str;
}
// Canonicalises a PLAYER name so the same person can't split into duplicates:
// - curly apostrophe -> straight   (O\u2019Sullivan -> O'Sullivan)
// - missing apostrophe in O' surnames -> inserted   (OSullivan -> O'Sullivan)
// Leaves ordinary names (Oliver, Oscar, ...) untouched.
function normalizeName(str) {
  if (!str) return str;
  str = normalizeDashes(str);
  str = str.replace(/\u2019/g, "'");
  str = str.replace(/\bO([A-Z][a-z])/g, "O'$1");
  return str;
}
// Finals rounds show up in the data under multiple spellings for the same
// round ("Round EF" vs "Elimination Final", etc). Left as-is, those get
// treated as two different rounds: the same match ends up listed twice in
// a player's game log (double-counting every stat total) and can throw off
// the top-8 ladder calc by inventing an extra round. This maps every known
// variant to one canonical label so they collapse into a single round.
const ROUND_NAME_CANONICAL = {
  'ef': 'Elimination Final', 'round ef': 'Elimination Final', 'elimination final': 'Elimination Final',
  'sf': 'Semi Final',        'round sf': 'Semi Final',        'semi final': 'Semi Final',
  'qf': 'Qualifying Final',  'round qf': 'Qualifying Final',  'qualifying final': 'Qualifying Final',
  'pf': 'Preliminary Final', 'round pf': 'Preliminary Final', 'preliminary final': 'Preliminary Final',
  'gf': 'Grand Final',       'round gf': 'Grand Final',       'grand final': 'Grand Final',
};
function normalizeRound(r) {
  if (!r) return r;
  const key = r.trim().toLowerCase();
  return ROUND_NAME_CANONICAL[key] || r.trim();
}
function normalizeGame(g) {
  if (g.player)         g.player         = normalizeName(g.player);
  if (g.played_for)     g.played_for     = normalizeDashes(g.played_for);
  if (g.played_against) g.played_against = normalizeDashes(g.played_against);
  if (g.home_team)      g.home_team      = normalizeDashes(g.home_team);
  if (g.away_team)      g.away_team      = normalizeDashes(g.away_team);
  if (g.round)           g.round          = normalizeRound(g.round);
  if (g.player === 'Gary Ablett' && g.season >= 2000) g.player = 'Gary Ablett Jnr';
  if (g.player && PLAYER_NAME_ALIASES[g.player]) g.player = PLAYER_NAME_ALIASES[g.player];
  return g;
}
// After round-name canonicalization, two records that only differed by
// round spelling ("Round EF" vs "Elimination Final") now have identical
// season+round+played_for+played_against — a true duplicate of the same
// match. This collapses those down to one record so stats aren't double
// counted, keeping the first occurrence seen.
function dedupeGames(games) {
  const seen = new Set();
  const out = [];
  games.forEach(g => {
    const key = g.season + '__' + g.round + '__' + g.played_for + '__' + g.played_against;
    if (seen.has(key)) return;
    seen.add(key);
    out.push(g);
  });
  return out;
}
function gameKey(g) {
  const teams = [g.home_team, g.away_team].sort().join('__');
  return g.season + '__' + g.round + '__' + teams;
}
function roundOrder(r) {
  if (!r) return 999;
  if (/^R(\d+)$/i.test(r)) return parseInt(r.slice(1));
  const nm = r.match(/\d+/); if (nm) return parseInt(nm[0]);
  const finals = ['EF','SF','QF','PF','GF','Elimination Final','Semi Final','Qualifying Final','Preliminary Final','Grand Final'];
  const fi = finals.findIndex(f => r.toLowerCase().includes(f.toLowerCase()));
  return fi >= 0 ? 100 + fi : 999;
}
function buildTop8Lookup(yearGames) {
  const bySeason = {};
  yearGames.forEach(g => {
    if (!g.season || !g.home_team || !g.away_team) return;
    if (!bySeason[g.season]) bySeason[g.season] = [];
    bySeason[g.season].push(g);
  });
  Object.entries(bySeason).forEach(([season, games]) => {
    const matchResults = {};
    games.forEach(g => {
      const key = g.season+'_'+g.round+'_'+g.home_team+'_'+g.away_team;
      if (!matchResults[key]) matchResults[key] = g;
    });
    const matches = Object.values(matchResults);
    const roundsInSeason = [...new Set(matches.map(g => g.round))].sort((a,b) => roundOrder(a)-roundOrder(b));
    if (!top8BySeasonRound[season]) top8BySeasonRound[season] = {};
    const wins = {}, draws = {}, losses = {}, pf = {}, pa = {};
    const initTeam = t => { if (!wins[t]) { wins[t]=0; draws[t]=0; losses[t]=0; pf[t]=0; pa[t]=0; } };
    roundsInSeason.forEach(round => {
      const standings = computeStandings(wins, draws, losses, pf, pa);
      top8BySeasonRound[season][round] = new Set(standings.slice(0,8).map(s=>s.team));
      matches.filter(g => g.round === round).forEach(g => {
        initTeam(g.home_team); initTeam(g.away_team);
        const hs = +(g.home_score||0), as = +(g.away_score||0);
        pf[g.home_team] += hs; pa[g.home_team] += as;
        pf[g.away_team] += as; pa[g.away_team] += hs;
        if (hs > as) { wins[g.home_team]++; losses[g.away_team]++; }
        else if (as > hs) { wins[g.away_team]++; losses[g.home_team]++; }
        else { draws[g.home_team]++; draws[g.away_team]++; }
      });
    });
  });
}
function computeStandings(wins, draws, losses, pf, pa) {
  return Object.keys(wins).map(team => {
    const pts = wins[team]*4 + draws[team]*2;
    const pct = pa[team] ? (pf[team]/pa[team]*100) : 0;
    return { team, pts, pct };
  }).sort((a,b) => b.pts-a.pts || b.pct-a.pct);
}
function isTop8(game) {
  const s = top8BySeasonRound[game.season];
  if (!s) return false;
  const set = s[game.round];
  if (!set) return false;
  return set.has(game.played_against);
}
function buildGameMaps(yearGames) {
  yearGames.forEach(g => {
    const k = gameKey(g);
    if (!gameResultMap[k]) {
      gameResultMap[k] = {
        home_team: g.home_team, away_team: g.away_team,
        home_score: +(g.home_points||g.home_score||0), away_score: +(g.away_points||g.away_score||0)
      };
    }
    if (!gameRosterMap[k]) gameRosterMap[k] = {};
    if (g.player) {
      if (!gameRosterMap[k][g.played_for]) gameRosterMap[k][g.played_for] = new Set();
      gameRosterMap[k][g.played_for].add(g.player);
    }
  });
}
async function loadAllYears() {
  if (allGames.length) return;
  loadingMsg.textContent = "Loading data...";
  const years = [];
  for (let y = startYear; y <= endYear; y++) years.push(y);
  const allYearGames = [];
  const batchSize = 5;
  for (let i = 0; i < years.length; i += batchSize) {
    const batch = years.slice(i, i + batchSize);
    const results = await Promise.all(
      batch.map(y => fetch('/data/afl/afl_'+y+'.json?v='+DATA_VERSION).then(r=>r.ok?r.json():[]).catch(()=>[]))
    );
    results.forEach(d => {
      d.forEach(g => {
        normalizeGame(g);
        allYearGames.push(g);
        allGames.push(g);
      });
    });
    loadingMsg.textContent = 'Loading data... '+Math.min(i+batchSize,years.length)+'/'+years.length+' years';
  }
  buildTop8Lookup(allYearGames);
  buildGameMaps(allYearGames);
  loadingMsg.textContent = "";
  buildDatalist();
  if (playerName) findAndShowPlayer();
  // Dev tool: append ?finddupes=1 to the URL to scan the loaded data for
  // players who are probably the same person under two different name
  // spellings (missed by PLAYER_NAME_ALIASES so far). Results print to the
  // console as a table for manual review — nothing here changes live data,
  // it's purely a discovery aid so new aliases can be found in bulk instead
  // of one screenshot at a time.
  if (params.get('finddupes') === '1') findPotentialDuplicateNames();
}
function buildDatalist() {
  const nameToTeams = {};
  allGames.forEach(g => {
    if (!nameToTeams[g.player]) nameToTeams[g.player] = new Set();
    nameToTeams[g.player].add(g.played_for);
  });
  const opts = new Set();
  Object.keys(nameToTeams).sort().forEach(name => {
    if (DISAMBIG_GROUPS[name]) {
      DISAMBIG_GROUPS[name].forEach(group => {
        if (group.some(t => nameToTeams[name].has(t))) {
          opts.add(group.length === 1 ? name+' ('+group[0]+')' : name+' ('+group.join(" / ")+')');
        }
      });
    } else {
      opts.add(name);
    }
  });
  playerList.innerHTML = "";
  [...opts].forEach(label => {
    const o = document.createElement("option");
    o.value = label;
    playerList.appendChild(o);
  });
}
function findAndShowPlayer() {
  const allMatchingGames = allGames.filter(p => p.player === playerName);
  if (!allMatchingGames.length) return;
  if (DISAMBIG_GROUPS[playerName]) {
    const teamsInData = new Set(allMatchingGames.map(g => g.played_for));
    const validGroups = DISAMBIG_GROUPS[playerName].filter(group => group.some(t => teamsInData.has(t)));
    if (validGroups.length > 1 && !playerTeam) { showDisambiguation(playerName, validGroups); return; }
    const chosenTeams = playerTeam.split("/").map(s => s.trim());
    const matchedGroup = DISAMBIG_GROUPS[playerName].find(group =>
      chosenTeams.every(t => group.includes(t)) || group.some(t => chosenTeams.includes(t))
    ) || validGroups[0];
    currentGames = dedupeGames(allMatchingGames.filter(p => matchedGroup.includes(p.played_for)));
  } else {
    currentGames = dedupeGames(allMatchingGames);
  }
  if (!currentGames.length) return;
  let latestGame = currentGames.reduce((a, g) => g.season > a.season ? g : a, currentGames[0]);
  const team = latestGame.played_for;
  if (teamColours[team]) {
    const c = teamColours[team].split(",");
    const stripe = document.getElementById("teamStripe");
    stripe.style.background = 'linear-gradient(90deg,'+c[0]+' 50%,'+c[1]+' 50%)';
    stripe.style.display = "block";
  }
  document.getElementById("mainTable").style.display      = "";
  document.getElementById("resetBtn").style.display       = "";
  document.getElementById("opponentSelect").style.display = "";
  document.getElementById("careerLabel").style.display    = "";
  document.getElementById("opponentLabel").style.display  = "";
  document.getElementById("top8Label").style.display      = "";
  setupOpponents(currentGames);
  renderCareer(currentGames);
  renderOpponent([]);
  renderTop8Split(currentGames);
  renderTable(currentGames);
  setupTeammates(currentGames);
}
function showDisambiguation(name, groups) {
  document.getElementById("summary").innerHTML =
    '<div class="disambig"><h2>Multiple players named "'+name+'"</h2><p>Select the player\'s you\'re looking for:</p><div class="disambig-options">'+
    groups.map(group => {
      const stripes = group.map(t => '<div class="disambig-stripe" style="'+getStripeStyle(t)+'"></div>').join("");
      return '<a class="disambig-card" href="afl-player.html?name='+encodeURIComponent(name)+'&team='+encodeURIComponent(group.join("/"))+'">'+stripes+name+'&ensp;<span style="color:#888;font-weight:400;">('+group.join(" / ")+')</span></a>';
    }).join("")+
    '</div></div>';
}
function getStripeStyle(team) {
  if (!teamColours[team]) return "background:#eee;";
  const c = teamColours[team].split(",");
  return 'background:linear-gradient(90deg,'+c[0]+' 50%,'+c[1]+' 50%);';
}
function setupOpponents(games) {
  opponentSelect.innerHTML = '<option value="all">All Opponents</option>';
  [...new Set(games.map(g => g.played_against))].sort().forEach(o => {
    const opt = document.createElement("option"); opt.value = o; opt.textContent = o;
    opponentSelect.appendChild(opt);
  });
  opponentSelect.onchange = () => {
    let f = opponentSelect.value === "all" ? games : games.filter(g => g.played_against === opponentSelect.value);
    renderOpponent(f); renderTable(f);
  };
}

// --- Teammates logic ---
function setupTeammates(games) {
  const section = document.getElementById("teammatesSection");
  const select  = document.getElementById("teammateSelect");
  // Always reveal the section once a player is loaded, no matter what happens below.
  section.style.display = "block";
  // Reset sub-elements.
  document.getElementById("teammateHeader").style.display = "none";
  document.getElementById("teammateHeader").innerHTML = "";
  document.getElementById("teammateStats").innerHTML = "";
  document.getElementById("teammateTable").style.display = "none";

  const teammateMap = new Map();
  try {
    // Build an O(1) lookup of the chosen player's games by team+round+season.
    const myGameByKey = new Map();
    games.forEach(g => { myGameByKey.set(g.season + "__" + g.round + "__" + g.played_for, g); });
    // Single pass over all games: anyone sharing a key is a teammate in that match.
    allGames.forEach(g => {
      if (!g || g.player === playerName) return;
      const myGame = myGameByKey.get(g.season + "__" + g.round + "__" + g.played_for);
      if (!myGame) return;
      let arr = teammateMap.get(g.player);
      if (!arr) { arr = []; teammateMap.set(g.player, arr); }
      if (!arr.some(x => x.season === myGame.season && x.round === myGame.round)) arr.push(myGame);
    });
  } catch (err) {
    console.error("Teammates build failed:", err);
  }

  select.innerHTML = '<option value="">— Choose a teammate (' + teammateMap.size + ' found) —</option>';
  [...teammateMap.keys()].sort().forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name + " (" + teammateMap.get(name).length + " games)";
    select.appendChild(opt);
  });

  if (teammateMap.size === 0) {
    document.getElementById("teammateStats").innerHTML =
      '<div style="grid-column:1/-1;color:#aaa;font-style:italic;text-align:center;padding:14px;">No teammates found in the data for this player.</div>';
  }

  select.onchange = () => {
    const chosen = select.value;
    if (!chosen) {
      document.getElementById("teammateHeader").style.display = "none";
      document.getElementById("teammateHeader").innerHTML = "";
      document.getElementById("teammateStats").innerHTML = "";
      document.getElementById("teammateTable").style.display = "none";
      return;
    }
    try {
      renderTeammateStats(chosen, teammateMap.get(chosen) || []);
    } catch (err) {
      console.error("Teammate render failed:", err);
    }
  };
}

function getGameResult(g) {
  const k = gameKey(g);
  const res = gameResultMap[k];
  if (!res) return { result: '?', score: '?' };
  const playerTeamIsHome = res.home_team === g.played_for;
  const teamScore  = playerTeamIsHome ? res.home_score : res.away_score;
  const oppScore   = playerTeamIsHome ? res.away_score : res.home_score;
  let result;
  if (teamScore > oppScore) result = 'W';
  else if (teamScore < oppScore) result = 'L';
  else result = 'D';
  return { result, score: teamScore + ' – ' + oppScore };
}

function renderTeammateStats(name, sharedGames) {
  let wins = 0, losses = 0, draws = 0;
  sharedGames.forEach(g => {
    const { result } = getGameResult(g);
    if (result === 'W') wins++;
    else if (result === 'L') losses++;
    else if (result === 'D') draws++;
  });
  const total = sharedGames.length;
  const winPct = total > 0 ? ((wins + draws * 0.5) / total * 100).toFixed(1) : '—';

  // The two players' names
  const header = document.getElementById("teammateHeader");
  header.innerHTML = escapeHtml(playerName) + '<span class="amp">&amp;</span>' + escapeHtml(name);
  header.style.display = "block";

  document.getElementById("teammateStats").innerHTML =
    '<div class="tstat-box games"><strong>'+total+'</strong><span>Games Together</span></div>'+
    '<div class="tstat-box wins"><strong>'+wins+'</strong><span>Wins</span></div>'+
    '<div class="tstat-box losses"><strong>'+losses+'</strong><span>Losses</span></div>'+
    '<div class="tstat-box draws"><strong>'+draws+'</strong><span>Draws</span></div>'+
    '<div class="tstat-box winpct"><strong>'+winPct+'%</strong><span>Win %</span></div>';

  const tbody = document.getElementById("teammateRows");
  tbody.innerHTML = "";
  // Sort chronologically
  const sorted = [...sharedGames].sort((a,b) => a.season !== b.season ? a.season-b.season : roundOrder(a.round)-roundOrder(b.round));
  sorted.forEach(g => {
    const { result, score } = getGameResult(g);
    const tr = document.createElement("tr");
    tr.className = result==='W'?'win-row':result==='L'?'loss-row':result==='D'?'draw-row':'';
    tr.onclick = () => location.href = gameLink(g);
    tr.innerHTML =
      '<td>'+g.season+'</td>'+
      '<td>'+g.round+'</td>'+
      '<td class="left">'+g.played_for+'</td>'+
      '<td>'+g.played_against+'</td>'+
      '<td><span class="result-badge '+result+'">'+result+'</span></td>'+
      '<td>'+score+'</td>';
    tbody.appendChild(tr);
  });

  document.getElementById("teammateTable").style.display = "";
}

function renderCareer(g)   { renderStats(g, "careerStats"); }
function renderOpponent(g) { renderStats(g, "opponentStats"); }
function renderStats(g, id) {
  if (!g.length) { document.getElementById(id).innerHTML = ""; return; }
  const games = g.length;
  const dTotal = g.reduce((a,x) => a+(+x.D||0), 0);
  const gTotal = g.reduce((a,x) => a+(+x.G||0), 0);
  const brTotal= g.reduce((a,x) => a+(+x.BR||0), 0);
  const bestD  = Math.max(...g.map(x => +x.D||0));
  const bestG  = Math.max(...g.map(x => +x.G||0));
  const bestDGames = g.filter(x => (+x.D||0) === bestD);
  const bestGGames = g.filter(x => (+x.G||0) === bestG);
  function bestDetail(arr) {
    if (arr.length===1) return '<div class="sub">vs '+arr[0].played_against+'<br>'+arr[0].round+', '+arr[0].season+'</div>';
    return '<div class="sub">('+arr.length+' times)</div>';
  }
  const br3 = g.filter(x => (+x.BR||0) === 3).length;
  document.getElementById(id).innerHTML =
    '<div class="stat-box"><strong>'+games+'</strong><span>Games</span></div>'+
    '<div class="stat-box"><strong>'+bestD+'</strong><span>Best Disposals</span>'+bestDetail(bestDGames)+'</div>'+
    '<div class="stat-box"><strong>'+bestG+'</strong><span>Best Goals</span>'+bestDetail(bestGGames)+'</div>'+
    '<div class="stat-box"><strong>'+(dTotal/games).toFixed(1)+'</strong><span>Avg Disposals</span></div>'+
    '<div class="stat-box"><strong>'+(gTotal/games).toFixed(2)+'</strong><span>Avg Goals</span></div>'+
    '<div class="stat-box"><strong>'+brTotal+'</strong><span>Brownlow Votes</span></div>'+
    '<div class="stat-box"><strong>'+(brTotal/games).toFixed(2)+'</strong><span>Avg Brownlow</span></div>'+
    '<div class="stat-box"><strong>'+br3+'</strong><span>3 Vote Games</span></div>';
}
function renderTop8Split(games) {
  const t8  = games.filter(g => isTop8(g));
  const nt8 = games.filter(g => !isTop8(g));
  const el = document.getElementById("top8Split");
  function miniStats(g) {
    if (!g.length) return { d:'—', goals:'—', br:'—', n:0 };
    const n = g.length;
    return {
      d: (g.reduce((a,x)=>a+(+x.D||0),0)/n).toFixed(1),
      goals: (g.reduce((a,x)=>a+(+x.G||0),0)/n).toFixed(2),
      br: (g.reduce((a,x)=>a+(+x.BR||0),0)/n).toFixed(2),
      n
    };
  }
  const s1 = miniStats(t8), s2 = miniStats(nt8);
  el.innerHTML =
    '<div class="top8-card top8"><div class="t8-label">▲ vs top 8 opponents</div><div class="top8-mini">'+
    '<div><strong>'+s1.d+'</strong><span>Avg disposals</span></div>'+
    '<div><strong>'+s1.goals+'</strong><span>Avg goals</span></div>'+
    '<div><strong>'+s1.br+'</strong><span>Avg Brownlow</span></div>'+
    '</div><div class="top8-games">'+s1.n+' game'+(s1.n===1?'':'s')+'</div></div>'+
    '<div class="top8-card non-top8"><div class="t8-label">▽ vs non-top 8 opponents</div><div class="top8-mini">'+
    '<div><strong>'+s2.d+'</strong><span>Avg disposals</span></div>'+
    '<div><strong>'+s2.goals+'</strong><span>Avg goals</span></div>'+
    '<div><strong>'+s2.br+'</strong><span>Avg Brownlow</span></div>'+
    '</div><div class="top8-games">'+s2.n+' game'+(s2.n===1?'':'s')+'</div></div>';
}
function gameLink(p) {
  return 'afl-game.html?year='+p.season+'&home='+encodeURIComponent(p.home_team)+'&away='+encodeURIComponent(p.away_team)+'&round='+encodeURIComponent(p.round);
}
function renderTable(g) {
  rows.innerHTML = "";
  g.forEach(p => {
    const t8 = isTop8(p);
    const tr = document.createElement("tr");
    if (t8) tr.style.background = "#eef7ee";
    tr.onclick = () => location.href = gameLink(p);
    tr.innerHTML = '<td>'+p.season+'</td><td>'+p.round+'</td><td class="left">'+p.played_for+'</td><td>'+p.played_against+'</td><td class="'+(t8?'top8-badge':'')+'">'+(t8?'Top 8':'')+'</td><td>'+(p.D||0)+'</td><td>'+(p.G||0)+'</td><td>'+(p.B||0)+'</td><td>'+(p.BR||0)+'</td>';
    rows.appendChild(tr);
  });
}
function sortTable(key) {
  if (sortKey===key) sortDir*=-1; else { sortKey=key; sortDir=-1; }
  currentGames.sort((a,b) => ((a[key]||0)-(b[key]||0))*sortDir);
  renderTable(currentGames);
}
function resetSort() {
  const all = allGames.filter(p => p.player===playerName);
  if (DISAMBIG_GROUPS[playerName] && playerTeam) {
    const chosenTeams = playerTeam.split("/").map(s=>s.trim());
    const matchedGroup = DISAMBIG_GROUPS[playerName].find(group =>
      chosenTeams.every(t=>group.includes(t))||group.some(t=>chosenTeams.includes(t)));
    currentGames = dedupeGames(matchedGroup ? all.filter(p=>matchedGroup.includes(p.played_for)) : all);
  } else { currentGames = dedupeGames(all); }
  renderTable(currentGames);
}
playerSearchEl.onchange = e => {
  const val = e.target.value.trim();
  const match = val.match(/^(.+?)\s+\((.+)\)$/);
  if (match) {
    const name = match[1].trim(), teams = match[2].split("/").map(s=>s.trim());
    if (DISAMBIG_GROUPS[name]) {
      const group = DISAMBIG_GROUPS[name].find(g => teams.every(t=>g.includes(t))||g.some(t=>teams.includes(t)));
      if (group) { location.href='afl-player.html?name='+encodeURIComponent(name)+'&team='+encodeURIComponent(group.join("/")); return; }
    }
    location.href = 'afl-player.html?name='+encodeURIComponent(name)+'&team='+encodeURIComponent(teams[0]);
  } else {
    location.href = 'afl-player.html?name='+encodeURIComponent(val);
  }
};

// ---------------------------------------------------------------------
// Duplicate-name discovery tool (dev aid, not used on normal page loads)
// ---------------------------------------------------------------------
// Rationale: individual name-collision bugs (Cooper D-Tytler / Cooper
// Duff-Tytler, Bailey Williams / Bailey J. Williams) keep surfacing one at
// a time because there's no way to see the whole list at once. This scans
// every name that has ever appeared in the loaded data and flags pairs
// that are probably the same person:
//   - they share at least one club, AND
//   - their seasons overlap or are back-to-back (so it's plausible to be
//     one uninterrupted career, not two different eras), AND
//   - the names look alike: either every token (first/last/etc, split on
//     spaces and hyphens) of the shorter name is a prefix of the matching
//     token in the longer name (catches truncation like "D-Tytler" vs
//     "Duff-Tytler"), or the full names are within edit-distance 2 of each
//     other (catches near-misses like "Bailey Williams" vs "Bailey J.
//     Williams" once punctuation/spacing is stripped).
// This does NOT auto-merge anything — it only prints candidates to the
// console for a human to confirm before adding them to PLAYER_NAME_ALIASES.
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function nameTokens(s) {
  return s.replace(/[.,]/g, '').split(/[\s-]+/).filter(Boolean);
}
function tokensLookLikeTruncation(a, b) {
  const ta = nameTokens(a), tb = nameTokens(b);
  if (ta.length !== tb.length) return false;
  let anyDiffers = false;
  for (let i = 0; i < ta.length; i++) {
    const x = ta[i], y = tb[i];
    if (x.toLowerCase() === y.toLowerCase()) continue;
    const shorter = x.length < y.length ? x : y;
    const longer  = x.length < y.length ? y : x;
    if (shorter.length < 1 || !longer.toLowerCase().startsWith(shorter.toLowerCase())) return false;
    anyDiffers = true;
  }
  return anyDiffers;
}
function findPotentialDuplicateNames() {
  const byName = {};
  allGames.forEach(g => {
    if (!g.player) return;
    if (!byName[g.player]) byName[g.player] = { teams: new Set(), seasons: [] };
    byName[g.player].teams.add(g.played_for);
    byName[g.player].seasons.push(+g.season);
  });
  const names = Object.keys(byName);
  const candidates = [];
  for (let i = 0; i < names.length; i++) {
    for (let j = i + 1; j < names.length; j++) {
      const a = names[i], b = names[j];
      const infoA = byName[a], infoB = byName[b];
      const sharesTeam = [...infoA.teams].some(t => infoB.teams.has(t));
      if (!sharesTeam) continue;
      const minA = Math.min(...infoA.seasons), maxA = Math.max(...infoA.seasons);
      const minB = Math.min(...infoB.seasons), maxB = Math.max(...infoB.seasons);
      const seasonsCompatible = minA <= maxB + 1 && minB <= maxA + 1;
      if (!seasonsCompatible) continue;
      const truncation = tokensLookLikeTruncation(a, b);
      const dist = levenshtein(a.toLowerCase().replace(/[.,]/g,''), b.toLowerCase().replace(/[.,]/g,''));
      if (truncation || (dist > 0 && dist <= 2)) {
        candidates.push({
          nameA: a, nameB: b,
          teamsA: [...infoA.teams].join('/'), teamsB: [...infoB.teams].join('/'),
          gamesA: infoA.seasons.length, gamesB: infoB.seasons.length,
          reason: truncation ? 'prefix/truncation' : 'edit-distance ' + dist
        });
      }
    }
  }
  candidates.sort((x, y) => (x.reason.startsWith('prefix') === y.reason.startsWith('prefix') ? 0 : x.reason.startsWith('prefix') ? -1 : 1));
  console.log('Scanned ' + names.length + ' distinct player names.');
  console.log(candidates.length + ' potential duplicate pair(s) found — review before adding to PLAYER_NAME_ALIASES:');
  console.table(candidates);
  return candidates;
}
