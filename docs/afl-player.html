<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Player Performance | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:900px;
  margin:0 auto;
  padding:30px 20px;
}

.search-box{
  max-width:420px;
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
}

.stats-table{
  width:100%;
  border-collapse:collapse;
  margin-top:30px;
}

.stats-table th{
  background:#f0f0f0;
  text-align:left;
  padding:10px;
  font-size:15px;
}

.stats-table td{
  border-bottom:1px solid #ddd;
  padding:10px;
  font-size:15px;
}

.section-title{
  margin-top:30px;
  font-size:20px;
  font-weight:700;
}

.placeholder{
  color:#666;
  font-style:italic;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>AFL Player Performance</h1>

<p>
Search a player and an opponent to view performance comparisons.
</p>

<div class="search-box">
  <input id="playerSearch" type="text" placeholder="Enter player name...">
</div>

<div class="search-box">
  <input id="opponentSearch" type="text" placeholder="Enter opponent team...">
</div>

<table class="stats-table">

<tr>
<th colspan="2">PLAYER</th>
</tr>

<tr>
<td>Best Game Disposals</td>
<td id="pBestDisp" class="placeholder">—</td>
</tr>

<tr>
<td>Best Game Goals</td>
<td id="pBestGoals" class="placeholder">—</td>
</tr>

<tr>
<td>Average Disposals</td>
<td id="pAvgDisp" class="placeholder">—</td>
</tr>

<tr>
<td>Average Goals</td>
<td id="pAvgGoals" class="placeholder">—</td>
</tr>

<tr>
<th colspan="2">OPPONENT</th>
</tr>

<tr>
<td>Best Game Disposals</td>
<td id="oBestDisp" class="placeholder">—</td>
</tr>

<tr>
<td>Best Game Goals</td>
<td id="oBestGoals" class="placeholder">—</td>
</tr>

<tr>
<td>Average Disposals</td>
<td id="oAvgDisp" class="placeholder">—</td>
</tr>

<tr>
<td>Average Goals</td>
<td id="oAvgGoals" class="placeholder">—</td>
</tr>

</table>

</div>

<script>
/* TEMP DEMO FILL UNTIL JSON IS READY */

const pInput=document.getElementById("playerSearch");
const oInput=document.getElementById("opponentSearch");

pInput.addEventListener("change",updateDemo);
oInput.addEventListener("change",updateDemo);

function updateDemo(){
  if(pInput.value && oInput.value){
    document.getElementById("pBestDisp").innerText="42 vs "+oInput.value;
    document.getElementById("pBestGoals").innerText="7 vs "+oInput.value;
    document.getElementById("pAvgDisp").innerText="27.4";
    document.getElementById("pAvgGoals").innerText="1.9";

    document.getElementById("oBestDisp").innerText="38 by "+pInput.value;
    document.getElementById("oBestGoals").innerText="6 by "+pInput.value;
    document.getElementById("oAvgDisp").innerText="25.1";
    document.getElementById("oAvgGoals").innerText="1.6";
  }
}
</script>

</body>
</html>
