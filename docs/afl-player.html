<!DOCTYPE html>
<html>
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Player Profile</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:22px;padding:14px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:17px;}
.navbar a:hover{text-decoration:underline;}
.page{max-width:1200px;margin:0 auto;padding:25px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:12px;}
.name-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.team-stripes{height:22px;width:140px;border-radius:6px;border:1px solid #ccc;}
#playerSearch{padding:10px 14px;border-radius:10px;border:1px solid #ccc;font-size:17px;width:320px;max-width:100%;}
@media (max-width:700px){#playerSearch{width:100%;font-size:18px;padding:12px 16px;}}
.opponent-select{padding:8px 12px;border-radius:8px;border:1px solid #ccc;font-size:15px;width:240px;}
h1{font-size:38px;margin:0;}
#summary{background:white;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.08);padding:25px 30px;margin-bottom:20px;}
.section-title{margin-top:16px;margin-bottom:6px;font-weight:700;color:#666;text-transform:uppercase;font-size:13px;letter-spacing:.6px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;}
.stat-box{background:linear-gradient(180deg,#f9fbff,#eef3fb);border-radius:12px;padding:16px 10px;text-align:center;box-shadow:inset 0 0 0 1px #dde3ec;}
.stat-box strong{display:block;font-size:26px;margin-bottom:4px;}
.stat-box span{font-size:14px;color:#555;}
.stat-box .sub{margin-top:6px;font-size:12px;color:#666;line-height:1.5;}
.top8-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;}
.top8-card{border-radius:12px;padding:16px 14px;}
.top8-card.top8{background:#eef7ee;box-shadow:inset 0 0 0 1px #b6ddb6;}
.top8-card.non-top8{background:#fef6ee;box-shadow:inset 0 0 0 1px #f0d8b6;}
.top8-card .t8-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;}
.top8-card.top8 .t8-label{color:#2a7a2a;}
.top8-card.non-top8 .t8-label{color:#a05a10;}
.top8-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;}
.top8-mini strong{display:block;font-size:20px;font-weight:700;margin-bottom:2px;}
.top8-card.top8 .top8-mini strong{color:#1a5c1a;}
.top8-card.non-top8 .top8-mini strong{color:#7a4010;}
.top8-mini span{font-size:11px;color:#666;}
.top8-games{margin-top:8px;font-size:12px;text-align:center;color:#888;}
@media(max-width:600px){.top8-split{grid-template-columns:1fr;}}
table{border-collapse:collapse;width:100%;background:white;border-radius:10px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.06);}
th,td{border:1px solid #ddd;padding:8px;text-align:center;}
th{cursor:pointer;background:#eef3fb;}
td.left{text-align:left;font-weight:600;}
tbody tr:nth-child(even){background:#f2f7ff;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#e8f0ff;}
td.top8-game{background:#eef7ee !important;}
td.top8-badge{font-size:11px;color:#2a7a2a;font-weight:700;}
.reset-sort{margin-top:10px;padding:6px 12px;border-radius:6px;border:1px solid #aaa;cursor:pointer;}
.loading{color:#888;font-style:italic;padding:20px;}
.disambig{background:white;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.08);padding:30px;margin-bottom:20px;}
.disambig h2{margin:0 0 8px;font-size:22px;color:#333;}
.disambig p{color:#666;margin:0 0 20px;}
.disambig-options{display:flex;flex-wrap:wrap;gap:14px;}
.disambig-card{display:flex;align-items:center;gap:10px;padding:16px 22px;border-radius:12px;border:2px solid #dde3ec;text-decoration:none;color:#333;font-size:17px;font-weight:600;background:#f9fbff;transition:border-color .15s,box-shadow .15s;}
.disambig-card:hover{border-color:#0056d6;box-shadow:0 4px 14px rgba(0,86,214,.12);}
.disambig-stripe{height:32px;width:44px;border-radius:6px;border:1px solid #ccc;flex-shrink:0;}

/* DUO SECTION */
#duoSection{background:white;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.08);padding:25px 30px;margin-bottom:20px;}
.duo-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.duo-header h2{margin:0;font-size:20px;font-weight:700;}
#duoSearch{padding:9px 13px;border-radius:9px;border:1px solid #ccc;font-size:15px;width:260px;max-width:100%;}
.duo-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:14px;}
.duo-stat{background:linear-gradient(180deg,#f5f0ff,#ede6fb);border-radius:12px;padding:14px 10px;text-align:center;box-shadow:inset 0 0 0 1px #cfc0e8;}
.duo-stat strong{display:block;font-size:28px;font-weight:700;color:#3b007a;margin-bottom:3px;}
.duo-stat span{font-size:13px;color:#555;}
.duo-win-bar{margin-top:14px;background:#e8e0f5;border-radius:8px;height:12px;overflow:hidden;}
.duo-win-fill{height:100%;background:linear-gradient(90deg,#7b2cbf,#9d4edd);border-radius:8px;transition:width .4s;}
.duo-bar-label{display:flex;justify-content:space-between;font-size:12px;color:#666;margin-top:4px;}
.duo-empty{color:#999;font-style:italic;margin-top:8px;font-size:14px;}
.duo-games-list{margin-top:16px;max-height:260px;overflow-y:auto;border:1px solid #e0d6f5;border-radius:10px;}
.duo-games-list table{box-shadow:none;border-radius:0;}
.duo-games-list th{font-size:12px;padding:6px 8px;background:#f3eeff;}
.duo-games-list td{font-size:13px;padding:6px 8px;}
.duo-result-W{color:#1a7f37;font-weight:700;}
.duo-result-L{color:#c0392b;font-weight:700;}
.duo-result-D{color:#888;font-weight:700;}
</style>
</head>
<body>
<div class="navbar">
<a href="/index.html">Home</a>
<a href="/afl.html">AFL</a>
</div>
<div class="page">
<div class="top-bar">
<div class="name-wrap">
<h1 id="playerName"></h1>
<div id="teamStripe" class="team-stripes" style="display:none"></div>
</div>
<div>
<input id="playerSearch" list="playerList" placeholder="Search player...">
<datalist id="playerList"></datalist>
</div>
</div>
<div id="summary">
<select id="opponentSelect" class="opponent-select" style="display:none"><option value="all">All Opponents</option></select>
<div class="section-title" id="careerLabel" style="display:none">Career Summary</div>
<div class="stats" id="careerStats"></div>
<div class="section-title" id="opponentLabel" style="display:none">Vs Selected Opponent</div>
<div class="stats" id="opponentStats"></div>
<div class="section-title" id="top8Label" style="display:none">Top 8 Split (at time of game)</div>
<div class="top8-split" id="top8Split"></div>
</div>

<!-- DUO SECTION -->
<div id="duoSection" style="display:none">
  <div class="duo-header">
    <h2>Duo Record with Teammate</h2>
    <input id="duoSearch" list="duoList" placeholder="Search teammate...">
    <datalist id="duoList"></datalist>
  </div>
  <div id="duoContent"><p class="duo-empty">Start typing a teammate's name above.</p></div>
</div>

<div id="loadingMsg" class="loading"></div>
<button class="reset-sort" id="resetBtn" style="display:none" onclick="resetSort()">Reset Sort</button>
<table id="mainTable" style="display:none">
<thead><tr>
<th onclick="sortTable('season')">Season</th>
<th onclick="sortTable('round')">Round</th>
<th>Team</th>
<th>Opponent</th>
<th>Top 8?</th>
<th onclick="sortTable('D')">D</th>
<th onclick="sortTable('G')">G</th>
<th onclick="sortTable('B')">B</th>
<th onclick="sortTable('BR')">BR</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
</div>

<script>
const DISAMBIG_GROUPS = {
  "Will Hayes": [["Western Bulldogs","Carlton"],["Collingwood"]],
  "Josh Kennedy": [["West Coast","Carlton"],["Sydney","Hawthorn"]],
};

const PLAYER_NAME_ALIASES = {
  "Luke D-Uniacke": "Luke Davies-Uniacke",
};

const teamColours = {
  "Adelaide":"#002b5c,#e21937","Brisbane":"#7c0a02,#fdb827","Carlton":"#031a29,#ffffff",
  "Collingwood":"#000000,#ffffff","Essendon":"#cc2031,#000000","Fremantle":"#2a0f5a,#ffffff",
  "Geelong":"#002b5c,#ffffff","Gold Coast":"#c8102e,#fdb827","GWS":"#f37021,#333333",
  "Hawthorn":"#4b2c20,#fdb827","Melbourne":"#001a33,#c8102e","North Melbourne":"#003a8f,#ffffff",
  "Port Adelaide":"#008aab,#000000","Richmond":"#ffd100,#000000","St Kilda":"#ed1b2e,#000000",
  "Sydney":"#e1251b,#ffffff","West Coast":"#003087,#f2a900","Western Bulldogs":"#003087,#c8102e"
};

const playerSearchEl = document.getElementById("playerSearch");
const playerList     = document.getElementById("playerList");
const opponentSelect = document.getElementById("opponentSelect");
const rows           = document.getElementById("rows");
const loadingMsg     = document.getElementById("loadingMsg");

const params     = new URLSearchParams(location.search);
const playerName = params.get("name") || "";
const playerTeam = params.get("team") || "";

document.getElementById("playerName").textContent = playerName || "Select a player";

let allGames = [], currentGames = [], sortDir = -1, sortKey = null;
let top8BySeasonRound = {};
let gameResultMap = {};
let gameRosterMap = {};

const startYear = 1965, endYear = new Date().getFullYear();

function normalizeDashes(str) {
  return str ? str.replace(/[\u2013\u2014]/g, '-') : str;
}

function normalizeGame(g) {
  if (g.player)         g.player         = normalizeDashes(g.player);
  if (g.played_for)     g.played_for     = normalizeDashes(g.played_for);
  if (g.played_against) g.played_against = normalizeDashes(g.played_against);
  if (g.home_team)      g.home_team      = normalizeDashes(g.home_team);
  if (g.away_team)      g.away_team      = normalizeDashes(g.away_team);
  if (g.player && PLAYER_NAME_ALIASES[g.player]) g.player = PLAYER_NAME_ALIASES[g.player];
  return g;
}

function gameKey(g) {
  return g.season + '__' + g.round + '__' + g.home_team + '__' + g.away_team;
}

function roundOrder(r) {
  if (!r) return 999;
  if (/^R(\d+)$/i.test(r)) return parseInt(r.slice(1));
  const nm = r.match(/\d+/); if (nm) return parseInt(nm[0]);
  const finals = ['EF','SF','QF','PF','GF','Elimination Final','Semi Final','Qualifying Final','Preliminary Final','Grand Final'];
  const fi = finals.findIndex(f => r.toLowerCase().includes(f.toLowerCase()));
  return fi >= 0 ? 100 + fi : 999;
}

function buildTop8Lookup(yearGames) {
  const bySeason = {};
  yearGames.forEach(g => {
    if (!g.season || !g.home_team || !g.away_team) return;
    if (!bySeason[g.season]) bySeason[g.season] = [];
    bySeason[g.season].push(g);
  });
  Object.entries(bySeason).forEach(([season, games]) => {
    const matchResults = {};
    games.forEach(g => {
      const key = g.season+'_'+g.round+'_'+g.home_team+'_'+g.away_team;
      if (!matchResults[key]) matchResults[key] = g;
    });
    const matches = Object.values(matchResults);
    const roundsInSeason = [...new Set(matches.map(g => g.round))].sort((a,b) => roundOrder(a)-roundOrder(b));
    if (!top8BySeasonRound[season]) top8BySeasonRound[season] = {};
    const wins = {}, draws = {}, losses = {}, pf = {}, pa = {};
    const initTeam = t => { if (!wins[t]) { wins[t]=0; draws[t]=0; losses[t]=0; pf[t]=0; pa[t]=0; } };
    roundsInSeason.forEach(round => {
      const standings = computeStandings(wins, draws, losses, pf, pa);
      top8BySeasonRound[season][round] = new Set(standings.slice(0,8).map(s=>s.team));
      matches.filter(g => g.round === round).forEach(g => {
        initTeam(g.home_team); initTeam(g.away_team);
        const hs = +(g.home_score||0), as = +(g.away_score||0);
        pf[g.home_team] += hs; pa[g.home_team] += as;
        pf[g.away_team] += as; pa[g.away_team] += hs;
        if (hs > as) { wins[g.home_team]++; losses[g.away_team]++; }
        else if (as > hs) { wins[g.away_team]++; losses[g.home_team]++; }
        else { draws[g.home_team]++; draws[g.away_team]++; }
      });
    });
  });
}

function computeStandings(wins, draws, losses, pf, pa) {
  return Object.keys(wins).map(team => {
    const pts = wins[team]*4 + draws[team]*2;
    const pct = pa[team] ? (pf[team]/pa[team]*100) : 0;
    return { team, pts, pct };
  }).sort((a,b) => b.pts-a.pts || b.pct-a.pct);
}

function isTop8(game) {
  const s = top8BySeasonRound[game.season];
  if (!s) return false;
  const set = s[game.round];
  if (!set) return false;
  return set.has(game.played_against);
}

function buildGameMaps(yearGames) {
  yearGames.forEach(g => {
    const k = gameKey(g);
    if (!gameResultMap[k]) {
      gameResultMap[k] = {
        home_team: g.home_team, away_team: g.away_team,
        home_score: +(g.home_points||g.home_score||0), away_score: +(g.away_points||g.away_score||0)
      };
    }
    if (!gameRosterMap[k]) gameRosterMap[k] = {};
    if (g.player) {
      if (!gameRosterMap[k][g.played_for]) gameRosterMap[k][g.played_for] = new Set();
      gameRosterMap[k][g.played_for].add(g.player);
    }
  });
}

async function loadAllYears() {
  loadingMsg.textContent = "Loading data...";
  const years = [];
  for (let y = startYear; y <= endYear; y++) years.push(y);
  const allYearGames = [];
  const batchSize = 5;
  for (let i = 0; i < years.length; i += batchSize) {
    const batch = years.slice(i, i + batchSize);
    const results = await Promise.all(
      batch.map(y => fetch('/data/afl/afl_'+y+'.json').then(r => r.json()).catch(() => []))
    );
    results.forEach(d => {
      d.forEach(g => { normalizeGame(g); allYearGames.push(g); });
      allGames = allGames.concat(d);
    });
    loadingMsg.textContent = 'Loading data... '+Math.min(i+batchSize,years.length)+'/'+years.length+' years';
  }
  buildTop8Lookup(allYearGames);
  buildGameMaps(allYearGames);
  loadingMsg.textContent = "";
  buildDatalist();
  if (playerName) findAndShowPlayer();
}

function buildDatalist() {
  const nameToTeams = {};
  allGames.forEach(g => {
    if (!nameToTeams[g.player]) nameToTeams[g.player] = new Set();
    nameToTeams[g.player].add(g.played_for);
  });
  const opts = new Set();
  Object.keys(nameToTeams).sort().forEach(name => {
    if (DISAMBIG_GROUPS[name]) {
      DISAMBIG_GROUPS[name].forEach(group => {
        if (group.some(t => nameToTeams[name].has(t))) {
          opts.add(group.length === 1 ? name+' ('+group[0]+')' : name+' ('+group.join(" / ")+')');
        }
      });
    } else {
      opts.add(name);
    }
  });
  playerList.innerHTML = "";
  [...opts].forEach(label => {
    const o = document.createElement("option");
    o.value = label;
    playerList.appendChild(o);
  });
}

function findAndShowPlayer() {
  const allMatchingGames = allGames.filter(p => p.player === playerName);
  if (!allMatchingGames.length) return;

  if (DISAMBIG_GROUPS[playerName]) {
    const teamsInData = new Set(allMatchingGames.map(g => g.played_for));
    const validGroups = DISAMBIG_GROUPS[playerName].filter(group => group.some(t => teamsInData.has(t)));
    if (validGroups.length > 1 && !playerTeam) { showDisambiguation(playerName, validGroups); return; }
    const chosenTeams = playerTeam.split("/").map(s => s.trim());
    const matchedGroup = DISAMBIG_GROUPS[playerName].find(group =>
      chosenTeams.every(t => group.includes(t)) || group.some(t => chosenTeams.includes(t))
    ) || validGroups[0];
    currentGames = allMatchingGames.filter(p => matchedGroup.includes(p.played_for));
  } else {
    currentGames = allMatchingGames;
  }

  if (!currentGames.length) return;

  let latestGame = currentGames.reduce((a, g) => g.season > a.season ? g : a, currentGames[0]);
  const team = latestGame.played_for;
  if (teamColours[team]) {
    const c = teamColours[team].split(",");
    const stripe = document.getElementById("teamStripe");
    stripe.style.background = 'linear-gradient(90deg,'+c[0]+' 50%,'+c[1]+' 50%)';
    stripe.style.display = "block";
  }

  document.getElementById("mainTable").style.display      = "";
  document.getElementById("resetBtn").style.display       = "";
  document.getElementById("opponentSelect").style.display = "";
  document.getElementById("careerLabel").style.display    = "";
  document.getElementById("opponentLabel").style.display  = "";
  document.getElementById("top8Label").style.display      = "";
  document.getElementById("duoSection").style.display     = "";

  setupOpponents(currentGames);
  renderCareer(currentGames);
  renderOpponent([]);
  renderTop8Split(currentGames);
  renderTable(currentGames);
  setupDuo(currentGames);
}

function showDisambiguation(name, groups) {
  document.getElementById("summary").innerHTML =
    '<div class="disambig"><h2>Multiple players named "'+name+'"</h2><p>Select the player you\'re looking for:</p><div class="disambig-options">'+
    groups.map(group => {
      const stripes = group.map(t => '<div class="disambig-stripe" style="'+getStripeStyle(t)+'"></div>').join("");
      return '<a class="disambig-card" href="afl-player.html?name='+encodeURIComponent(name)+'&team='+encodeURIComponent(group.join("/"))+'">'+stripes+name+'&ensp;<span style="color:#888;font-weight:400;">('+group.join(" / ")+')</span></a>';
    }).join("")+
    '</div></div>';
}

function getStripeStyle(team) {
  if (!teamColours[team]) return "background:#eee;";
  const c = teamColours[team].split(",");
  return 'background:linear-gradient(90deg,'+c[0]+' 50%,'+c[1]+' 50%);';
}

function setupOpponents(games) {
  opponentSelect.innerHTML = '<option value="all">All Opponents</option>';
  [...new Set(games.map(g => g.played_against))].sort().forEach(o => {
    const opt = document.createElement("option"); opt.value = o; opt.textContent = o;
    opponentSelect.appendChild(opt);
  });
  opponentSelect.onchange = () => {
    let f = opponentSelect.value === "all" ? games : games.filter(g => g.played_against === opponentSelect.value);
    renderOpponent(f); renderTable(f);
  };
}

function renderCareer(g)   { renderStats(g, "careerStats"); }
function renderOpponent(g) { renderStats(g, "opponentStats"); }

function renderStats(g, id) {
  if (!g.length) { document.getElementById(id).innerHTML = ""; return; }
  const games = g.length;
  const dTotal = g.reduce((a,x) => a+(+x.D||0), 0);
  const gTotal = g.reduce((a,x) => a+(+x.G||0), 0);
  const brTotal= g.reduce((a,x) => a+(+x.BR||0), 0);
  const bestD  = Math.max(...g.map(x => +x.D||0));
  const bestG  = Math.max(...g.map(x => +x.G||0));
  const bestDGames = g.filter(x => (+x.D||0) === bestD);
  const bestGGames = g.filter(x => (+x.G||0) === bestG);
  function bestDetail(arr) {
    if (arr.length===1) return '<div class="sub">vs '+arr[0].played_against+'<br>'+arr[0].round+', '+arr[0].season+'</div>';
    return '<div class="sub">('+arr.length+' times)</div>';
  }
  const br3 = g.filter(x => (+x.BR||0) === 3).length;
  document.getElementById(id).innerHTML =
    '<div class="stat-box"><strong>'+games+'</strong><span>Games</span></div>'+
    '<div class="stat-box"><strong>'+bestD+'</strong><span>Best Disposals</span>'+bestDetail(bestDGames)+'</div>'+
    '<div class="stat-box"><strong>'+bestG+'</strong><span>Best Goals</span>'+bestDetail(bestGGames)+'</div>'+
    '<div class="stat-box"><strong>'+(dTotal/games).toFixed(1)+'</strong><span>Avg Disposals</span></div>'+
    '<div class="stat-box"><strong>'+(gTotal/games).toFixed(2)+'</strong><span>Avg Goals</span></div>'+
    '<div class="stat-box"><strong>'+brTotal+'</strong><span>Brownlow Votes</span></div>'+
    '<div class="stat-box"><strong>'+(brTotal/games).toFixed(2)+'</strong><span>Avg Brownlow</span></div>'+
    '<div class="stat-box"><strong>'+br3+'</strong><span>3 Vote Games</span></div>';
}

function renderTop8Split(games) {
  const t8  = games.filter(g => isTop8(g));
  const nt8 = games.filter(g => !isTop8(g));
  const el = document.getElementById("top8Split");
  function miniStats(g) {
    if (!g.length) return { d:'—', goals:'—', br:'—', n:0 };
    const n = g.length;
    return {
      d: (g.reduce((a,x)=>a+(+x.D||0),0)/n).toFixed(1),
      goals: (g.reduce((a,x)=>a+(+x.G||0),0)/n).toFixed(2),
      br: (g.reduce((a,x)=>a+(+x.BR||0),0)/n).toFixed(2),
      n
    };
  }
  const s1 = miniStats(t8), s2 = miniStats(nt8);
  el.innerHTML =
    '<div class="top8-card top8"><div class="t8-label">▲ vs top 8 opponents</div><div class="top8-mini">'+
    '<div><strong>'+s1.d+'</strong><span>Avg disposals</span></div>'+
    '<div><strong>'+s1.goals+'</strong><span>Avg goals</span></div>'+
    '<div><strong>'+s1.br+'</strong><span>Avg Brownlow</span></div>'+
    '</div><div class="top8-games">'+s1.n+' game'+(s1.n===1?'':'s')+'</div></div>'+
    '<div class="top8-card non-top8"><div class="t8-label">▽ vs non-top 8 opponents</div><div class="top8-mini">'+
    '<div><strong>'+s2.d+'</strong><span>Avg disposals</span></div>'+
    '<div><strong>'+s2.goals+'</strong><span>Avg goals</span></div>'+
    '<div><strong>'+s2.br+'</strong><span>Avg Brownlow</span></div>'+
    '</div><div class="top8-games">'+s2.n+' game'+(s2.n===1?'':'s')+'</div></div>';
}

function gameLink(p) {
  return 'afl-game.html?year='+p.season+'&home='+encodeURIComponent(p.home_team)+'&away='+encodeURIComponent(p.away_team)+'&round='+encodeURIComponent(p.round);
}

function renderTable(g) {
  rows.innerHTML = "";
  g.forEach(p => {
    const t8 = isTop8(p);
    const tr = document.createElement("tr");
    if (t8) tr.style.background = "#eef7ee";
    tr.onclick = () => location.href = gameLink(p);
    tr.innerHTML = '<td>'+p.season+'</td><td>'+p.round+'</td><td class="left">'+p.played_for+'</td><td>'+p.played_against+'</td><td class="'+(t8?'top8-badge':'')+'">'+(t8?'Top 8':'')+'</td><td>'+(p.D||0)+'</td><td>'+(p.G||0)+'</td><td>'+(p.B||0)+'</td><td>'+(p.BR||0)+'</td>';
    rows.appendChild(tr);
  });
}

function sortTable(key) {
  if (sortKey===key) sortDir*=-1; else { sortKey=key; sortDir=-1; }
  currentGames.sort((a,b) => ((a[key]||0)-(b[key]||0))*sortDir);
  renderTable(currentGames);
}

function resetSort() {
  const all = allGames.filter(p => p.player===playerName);
  if (DISAMBIG_GROUPS[playerName] && playerTeam) {
    const chosenTeams = playerTeam.split("/").map(s=>s.trim());
    const matchedGroup = DISAMBIG_GROUPS[playerName].find(group =>
      chosenTeams.every(t=>group.includes(t))||group.some(t=>chosenTeams.includes(t)));
    currentGames = matchedGroup ? all.filter(p=>matchedGroup.includes(p.played_for)) : all;
  } else { currentGames = all; }
  renderTable(currentGames);
}

playerSearchEl.onchange = e => {
  const val = e.target.value.trim();
  const match = val.match(/^(.+?)\s+\((.+)\)$/);
  if (match) {
    const name = match[1].trim(), teams = match[2].split("/").map(s=>s.trim());
    if (DISAMBIG_GROUPS[name]) {
      const group = DISAMBIG_GROUPS[name].find(g => teams.every(t=>g.includes(t))||g.some(t=>teams.includes(t)));
      if (group) { location.href='afl-player.html?name='+encodeURIComponent(name)+'&team='+encodeURIComponent(group.join("/")); return; }
    }
    location.href = 'afl-player.html?name='+encodeURIComponent(name)+'&team='+encodeURIComponent(teams[0]);
  } else {
    location.href = 'afl-player.html?name='+encodeURIComponent(val);
  }
};

// ── DUO LOGIC ──────────────────────────────────────────────────────────────

function setupDuo(mainPlayerGames) {
  // Build datalist of teammates: players who share a game key AND played for the same team
  const teammateNames = new Set();
  mainPlayerGames.forEach(g => {
    const k = gameKey(g);
    const teamRoster = gameRosterMap[k] && gameRosterMap[k][g.played_for];
    if (teamRoster) {
      teamRoster.forEach(name => { if (name !== playerName) teammateNames.add(name); });
    }
  });

  const duoList = document.getElementById("duoList");
  duoList.innerHTML = "";
  [...teammateNames].sort().forEach(name => {
    const o = document.createElement("option");
    o.value = name;
    duoList.appendChild(o);
  });

  const duoSearch = document.getElementById("duoSearch");
  duoSearch.oninput = () => renderDuo(duoSearch.value.trim(), mainPlayerGames);
  duoSearch.onchange = () => renderDuo(duoSearch.value.trim(), mainPlayerGames);
}

function getGameResult(g) {
  const k = gameKey(g);
  const result = gameResultMap[k];
  if (!result) return null;
  const isHome = g.played_for === result.home_team;
  const myScore = isHome ? +result.home_score : +result.away_score;
  const theirScore = isHome ? +result.away_score : +result.home_score;
  // If scores are missing/zero, fall back to winner field on the game row itself
  if (!myScore && !theirScore) {
    const winner = g.winner || g.winning_team || "";
    if (!winner) return null;
    if (winner === g.played_for) return 'W';
    if (winner === g.played_against) return 'L';
    return 'D';
  }
  if (myScore > theirScore) return 'W';
  if (myScore < theirScore) return 'L';
  return 'D';
}

function renderDuo(teammateName, mainPlayerGames) {
  const duoContent = document.getElementById("duoContent");
  if (!teammateName) {
    duoContent.innerHTML = '<p class="duo-empty">Start typing a teammate\'s name above.</p>';
    return;
  }

  // Games where both players were on the same team
  const sharedGames = mainPlayerGames.filter(g => {
    const k = gameKey(g);
    const teamRoster = gameRosterMap[k] && gameRosterMap[k][g.played_for];
    return teamRoster && teamRoster.has(teammateName);
  });

  if (!sharedGames.length) {
    duoContent.innerHTML = '<p class="duo-empty">No shared games found for <strong>'+teammateName+'</strong>. Check the spelling matches exactly.</p>';
    return;
  }

  let wins = 0, losses = 0, draws = 0;
  sharedGames.forEach(g => {
    const r = getGameResult(g);
    if (r === 'W') wins++;
    else if (r === 'L') losses++;
    else draws++;
  });

  const total = sharedGames.length;
  const winPct = ((wins / total) * 100).toFixed(1);
  const barW = (wins / total * 100);

  const sorted = [...sharedGames].sort((a,b) => b.season - a.season || roundOrder(a.round) - roundOrder(b.round));

  const gameRows = sorted.map(g => {
    const r = getGameResult(g);
    const rClass = r==='W' ? 'duo-result-W' : r==='L' ? 'duo-result-L' : 'duo-result-D';
    const res = gameResultMap[gameKey(g)];
    const score = res ? (res.home_score||0)+'-'+(res.away_score||0) : '';
    return '<tr onclick="location.href=\''+gameLink(g)+'\'" style="cursor:pointer">'+
      '<td>'+g.season+'</td><td>'+g.round+'</td>'+
      '<td style="text-align:left">'+g.played_for+'</td>'+
      '<td>'+g.played_against+'</td>'+
      '<td>'+score+'</td>'+
      '<td class="'+rClass+'">'+r+'</td></tr>';
  }).join('');

  duoContent.innerHTML =
    '<div style="font-size:15px;color:#555;margin-bottom:12px;">'+
    '<strong style="color:#3b007a">'+playerName+'</strong> &amp; <strong style="color:#3b007a">'+teammateName+'</strong> — games played together on the same team</div>'+
    '<div class="duo-stats-grid">'+
    '<div class="duo-stat"><strong>'+total+'</strong><span>Games together</span></div>'+
    '<div class="duo-stat"><strong>'+wins+'</strong><span>Wins</span></div>'+
    '<div class="duo-stat"><strong>'+losses+'</strong><span>Losses</span></div>'+
    '<div class="duo-stat"><strong>'+draws+'</strong><span>Draws</span></div>'+
    '<div class="duo-stat"><strong>'+winPct+'%</strong><span>Win %</span></div>'+
    '</div>'+
    '<div class="duo-win-bar"><div class="duo-win-fill" style="width:'+barW+'%"></div></div>'+
    '<div class="duo-bar-label"><span>'+wins+'W / '+losses+'L'+(draws?' / '+draws+'D':'')+'</span><span>'+winPct+'%</span></div>'+
    '<div class="duo-games-list"><table>'+
    '<thead><tr><th>Season</th><th>Round</th><th>Team</th><th>Opponent</th><th>Score</th><th>Result</th></tr></thead>'+
    '<tbody>'+gameRows+'</tbody></table></div>';
}

loadAllYears();
</script>
