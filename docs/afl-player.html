<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Player Performance | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:900px;
  margin:0 auto;
  padding:30px 20px;
}

.search-box{
  max-width:420px;
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
}

.stats-table{
  width:100%;
  border-collapse:collapse;
  margin-top:30px;
}

/* HEADER */
.stats-table th{
  background:#f0f0f0;
  text-align:left;
  padding:10px;
  font-size:15px;
  font-weight:700;
}

/* CELLS */
.stats-table td{
  border-bottom:1px solid #ddd;
  padding:10px;
  font-size:15px;
}

/* FAINT BLUE STRIPING */
.stats-table tr:nth-child(even) td{
  background:#f3f7ff;
}

.placeholder{
  color:#666;
  font-style:italic;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>AFL Player Performance</h1>

<p>
Search a player and an opponent to view performance comparisons.
</p>

<div class="search-box">
  <input id="playerSearch" type="text" placeholder="Enter player name...">
</div>

<div class="search-box">
  <input id="opponentSearch" type="text" placeholder="Enter opponent team...">
</div>

<table class="stats-table">

<tr>
<th colspan="2">PLAYER</th>
</tr>

<tr>
<td>Best Game Disposals</td>
<td id="pBestDisp" class="placeholder">—</td>
</tr>

<tr>
<td>Best Game Goals</td>
<td id="pBestGoals" class="placeholder">—</td>
</tr>

<tr>
<td>Average Disposals</td>
<td id="pAvgDisp" class="placeholder">—</td>
</tr>

<tr>
<td>Average Goals</td>
<td id="pAvgGoals" class="placeholder">—</td>
</tr>

<tr>
<th colspan="2">OPPONENT</th>
</tr>

<tr>
<td>Best Game Disposals</td>
<td id="oBestDisp" class="placeholder">—</td>
</tr>

<tr>
<td>Best Game Goals</td>
<td id="oBestGoals" class="placeholder">—</td>
</tr>

<tr>
<td>Average Disposals</td>
<td id="oAvgDisp" class="placeholder">—</td>
</tr>

<tr>
<td>Average Goals</td>
<td id="oAvgGoals" class="placeholder">—</td>
</tr>

</table>

</div>

<script>
const pInput = document.getElementById("playerSearch");
const oInput = document.getElementById("opponentSearch");

let allData = [];

/* LOAD ALL SEASONS */
async function loadAllSeasons(){
  const startYear = 1990;
  const endYear = new Date().getFullYear();

  for(let y=startYear; y<=endYear; y++){
    try{
      const res = await fetch(`/data/afl/afl_${y}.json`);
      if(res.ok){
        const seasonData = await res.json();
        allData = allData.concat(seasonData);
      }
    }catch(e){}
  }
}

loadAllSeasons();

pInput.addEventListener("change",updateStats);
oInput.addEventListener("change",updateStats);

function updateStats(){
  const player = pInput.value.trim();
  const opponent = oInput.value.trim();

  if(!player || !opponent || allData.length === 0) return;

  const playerGames = allData.filter(r =>
    r.player === player &&
    r.played_against === opponent
  );

  const opponentGames = allData.filter(r =>
    r.player === player &&
    r.played_for === opponent
  );

  updateBlock(playerGames, "p");
  updateBlock(opponentGames, "o");
}

function updateBlock(rows, prefix){
  if(rows.length === 0){
    document.getElementById(prefix+"BestDisp").innerText = "—";
    document.getElementById(prefix+"BestGoals").innerText = "—";
    document.getElementById(prefix+"AvgDisp").innerText = "—";
    document.getElementById(prefix+"AvgGoals").innerText = "—";
    return;
  }

  const bestDisp = Math.max(...rows.map(r=>Number(r.D)||0));
  const bestGoals = Math.max(...rows.map(r=>Number(r.G)||0));
  const avgDisp = (rows.reduce((s,r)=>s+(Number(r.D)||0),0)/rows.length).toFixed(1);
  const avgGoals = (rows.reduce((s,r)=>s+(Number(r.G)||0),0)/rows.length).toFixed(2);

  document.getElementById(prefix+"BestDisp").innerText = bestDisp;
  document.getElementById(prefix+"BestGoals").innerText = bestGoals;
  document.getElementById(prefix+"AvgDisp").innerText = avgDisp;
  document.getElementById(prefix+"AvgGoals").innerText = avgGoals;
}
</script>

</body>
</html>
