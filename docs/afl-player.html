<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AFL Player Profile</title>

<style>
body{
  font-family:system-ui, Arial, sans-serif;
  margin:0;
  background:#f4f6f8;
}
.page{max-width:1200px;margin:0 auto;padding:25px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.name-wrap{display:flex;align-items:center;gap:14px;}
.team-stripes{height:22px;width:140px;border-radius:6px;border:1px solid #ccc;}
.player-search input{padding:8px 12px;border-radius:8px;border:1px solid #ccc;font-size:15px;width:240px;}
h1{font-size:38px;margin:0;}

#summary{
  background:white;border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  padding:25px 30px;margin-bottom:35px;
}

.section-title{
  margin-top:22px;margin-bottom:6px;
  font-weight:700;color:#666;
  text-transform:uppercase;font-size:13px;
  letter-spacing:0.6px;
}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;}

.stat-box{
  background:linear-gradient(180deg,#f9fbff,#eef3fb);
  border-radius:12px;padding:16px 10px;text-align:center;
  box-shadow:inset 0 0 0 1px #dde3ec;
}
.stat-box strong{display:block;font-size:26px;margin-bottom:6px;}
.stat-box span{font-size:14px;color:#555;}

hr{margin:40px 0 20px;border:none;border-top:1px solid #ddd;}
button{padding:6px 12px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;}
button:hover{background:#eef3fb;}

table{
  border-collapse:collapse;width:100%;background:white;
  border-radius:10px;overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.06);
}
th,td{border:1px solid #ddd;padding:8px;text-align:center;}
td.left{text-align:left;font-weight:600;}
tbody tr:nth-child(even){background:#f2f7ff;}
</style>
</head>

<body>
<div class="page">

<div class="top-bar">
  <div class="name-wrap">
    <h1 id="playerName"></h1>
    <div id="teamStripe" class="team-stripes"></div>
  </div>

  <div class="player-search">
    <input id="playerSearch" list="playerList" placeholder="Search player...">
    <datalist id="playerList"></datalist>
  </div>
</div>

<div id="summary">
  <div class="section-title">Career Summary</div>
  <div class="stats" id="careerStats"></div>
</div>

<hr>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Round</th>
  <th>Team</th>
  <th>Opponent</th>
  <th>D</th>
  <th>G</th>
  <th>B</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

</div>

<script>
const params=new URLSearchParams(window.location.search);
const playerName=params.get("name")||"";
document.getElementById("playerName").textContent=playerName||"Select a player";

/* jumper stripes */
const teamStripes={
  "Carlton":"repeating-linear-gradient(90deg,#001A3D 0 24px,#ffffff 24px 48px,#001A3D 48px 72px,#ffffff 72px 96px)",
  "Fremantle":"repeating-linear-gradient(90deg,#2A004F 0 24px,#ffffff 24px 48px,#2A004F 48px 72px,#ffffff 72px 96px)",
  "Collingwood":"repeating-linear-gradient(90deg,#000000 0 20px,#ffffff 20px 40px,#000000 40px 60px)",
  "Richmond":"repeating-linear-gradient(90deg,#FFD200 0 20px,#000000 20px 40px,#FFD200 40px 60px)",
  "Essendon":"repeating-linear-gradient(90deg,#CC2031 0 24px,#000000 24px 48px,#CC2031 48px 72px)",
  "St Kilda":"repeating-linear-gradient(90deg,#000000 0 20px,#ffffff 20px 40px,#CC2031 40px 60px)",
  "Geelong":"repeating-linear-gradient(90deg,#1C3C63 0 24px,#ffffff 24px 48px,#1C3C63 48px 72px)",
  "Sydney":"repeating-linear-gradient(90deg,#ED171F 0 24px,#ffffff 24px 48px,#ED171F 48px 72px)",
  "West Coast":"repeating-linear-gradient(90deg,#002B5C 0 24px,#FFD200 24px 48px,#002B5C 48px 72px)",
  "Adelaide":"repeating-linear-gradient(90deg,#002B5C 0 24px,#FFD200 24px 48px,#CC2031 48px 72px)",
  "Port Adelaide":"repeating-linear-gradient(90deg,#1C1C1C 0 24px,#00B2A9 24px 48px,#ffffff 48px 72px)",
  "Brisbane":"repeating-linear-gradient(90deg,#7C003E 0 24px,#FFD200 24px 48px,#005BAC 48px 72px)",
  "Hawthorn":"repeating-linear-gradient(90deg,#4D2004 0 24px,#FFD200 24px 48px,#4D2004 48px 72px)",
  "Melbourne":"repeating-linear-gradient(90deg,#002B5C 0 24px,#ED171F 24px 48px,#002B5C 48px 72px)",
  "Western Bulldogs":"repeating-linear-gradient(90deg,#1E3A8A 0 24px,#ED171F 24px 48px,#ffffff 48px 72px)",
  "Gold Coast":"repeating-linear-gradient(90deg,#B90A32 0 24px,#FFD200 24px 48px,#005BAC 48px 72px)",
  "GWS":"repeating-linear-gradient(90deg,#F47920 0 24px,#000000 24px 48px,#ffffff 48px 72px)",
  "North Melbourne":"repeating-linear-gradient(90deg,#0A2E8A 0 24px,#ffffff 24px 48px,#0A2E8A 48px 72px)"
};

const startYear=1990;
const endYear=new Date().getFullYear();
let years=[];
for(let y=startYear;y<=endYear;y++)years.push(y);

Promise.all(years.map(y=>fetch(`/data/afl/afl_${y}.json`).then(r=>r.json()).catch(()=>[])))
.then(allData=>{
  const allPlayers=allData.flat();

  /* build search list */
  const names=[...new Set(allPlayers.map(p=>p.player))].sort();
  const datalist=document.getElementById("playerList");
  names.forEach(n=>{
    const o=document.createElement("option");
    o.value=n;
    datalist.appendChild(o);
  });

  const games=allPlayers.filter(p=>p.player===playerName);

  if(games.length){
    const latest=games.reduce((a,b)=>a.season>b.season?a:b);
    document.getElementById("teamStripe").style.background=
      teamStripes[latest.played_for]||"#999";

    renderCareer(games);
    renderTable(games);
  }
});

/* CAREER STATS */
function renderCareer(games){
  const totalGames=games.length;
  const totalD=games.reduce((s,g)=>s+(g.D||0),0);
  const totalG=games.reduce((s,g)=>s+(g.G||0),0);

  const bestD=Math.max(...games.map(g=>g.D||0));
  const bestG=Math.max(...games.map(g=>g.G||0));

  const avgD=(totalD/totalGames).toFixed(1);
  const avgG=(totalG/totalGames).toFixed(2);

  document.getElementById("careerStats").innerHTML=`
    <div class="stat-box"><strong>${totalGames}</strong><span>Games</span></div>
    <div class="stat-box"><strong>${bestD}</strong><span>Career Best Disposals</span></div>
    <div class="stat-box"><strong>${bestG}</strong><span>Career Best Goals</span></div>
    <div class="stat-box"><strong>${avgD}</strong><span>Avg Disposals</span></div>
    <div class="stat-box"><strong>${avgG}</strong><span>Avg Goals</span></div>
  `;
}

/* TABLE */
function renderTable(games){
  const tbody=document.getElementById("rows");
  tbody.innerHTML="";
  games.forEach(p=>{
    tbody.innerHTML+=`
    <tr>
      <td>${p.season}</td>
      <td>${p.round}</td>
      <td class="left">${p.played_for}</td>
      <td>${p.played_against}</td>
      <td>${p.D||0}</td>
      <td>${p.G||0}</td>
      <td>${p.B||0}</td>
    </tr>`;
  });
}

/* SEARCH */
document.getElementById("playerSearch").addEventListener("change",e=>{
  const name=e.target.value;
  if(name){
    window.location.href=
      window.location.pathname+"?name="+encodeURIComponent(name);
  }
});
</script>

</body>
</html>
