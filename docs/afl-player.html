<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AFL Player Profile</title>

<style>
body{
  font-family:system-ui, Arial, sans-serif;
  margin:0;
  background:#f4f6f8;
}

.page{
  max-width:1200px;
  margin:0 auto;
  padding:25px;
}

.name-wrap{
  display:flex;
  align-items:center;
  gap:12px;
}

.team-color{
  width:18px;
  height:18px;
  border-radius:4px;
  border:1px solid #ccc;
}

h1{
  font-size:38px;
  margin:0;
}

#summary{
  background:white;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  padding:25px 30px;
  margin-bottom:35px;
}

.summary-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
}

.summary-header select{
  padding:8px 12px;
  font-size:15px;
  border-radius:6px;
}

.section-title{
  margin-top:22px;
  margin-bottom:6px;
  font-weight:700;
  color:#666;
  text-transform:uppercase;
  font-size:13px;
  letter-spacing:0.6px;
}

.stats{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
}

.stat-box{
  background:linear-gradient(180deg,#f9fbff,#eef3fb);
  border-radius:12px;
  padding:16px 10px;
  text-align:center;
  box-shadow:inset 0 0 0 1px #dde3ec;
}

.stat-box strong{
  display:block;
  font-size:26px;
  margin-bottom:6px;
}

.stat-box span{
  font-size:14px;
  color:#555;
}

hr{
  margin:40px 0 20px;
  border:none;
  border-top:1px solid #ddd;
}

.table-controls{
  margin-bottom:10px;
}

button{
  padding:6px 12px;
  border-radius:6px;
  border:1px solid #ccc;
  background:#fff;
  cursor:pointer;
}
button:hover{
  background:#eef3fb;
}

table{
  border-collapse:collapse;
  width:100%;
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.06);
}
th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}
th{
  background:#f0f0f0;
  cursor:pointer;
}
th.sortable:hover{
  background:#e6eefc;
}
td.left{
  text-align:left;
  font-weight:600;
}

tbody tr:nth-child(even){
  background:#f2f7ff;
}
</style>
</head>

<body>
<div class="page">

<div class="name-wrap">
  <div id="teamColor" class="team-color"></div>
  <h1 id="playerName"></h1>
</div>

<div id="summary">
  <div class="summary-header">
    <div>
      <strong>Opponent:</strong>
      <select id="opponentSelect">
        <option value="all">All opponents</option>
      </select>
    </div>
  </div>

  <div class="section-title">Career Summary</div>
  <div class="stats" id="careerStats"></div>

  <div class="section-title" id="opponentTitle" style="display:none;">Vs Opponent</div>
  <div class="stats" id="opponentStats"></div>
</div>

<hr>

<div class="table-controls">
  <button id="resetSort">Reset order</button>
</div>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Round</th>
  <th>Team</th>
  <th class="sortable" data-key="played_against">Opponent</th>
  <th class="sortable" data-key="D">D</th>
  <th class="sortable" data-key="G">G</th>
  <th class="sortable" data-key="B">B</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerName = params.get("name");

document.getElementById("playerName").textContent = playerName;

/* Official AFL primary colours */
const teamColors = {
  "Adelaide":"#002B5C",
  "Brisbane":"#7C003E",
  "Carlton":"#001A3D",
  "Collingwood":"#000000",
  "Essendon":"#CC2031",
  "Fremantle":"#2A004F",
  "Geelong":"#1C3C63",
  "Gold Coast":"#B90A32",
  "GWS":"#F47920",
  "Hawthorn":"#4D2004",
  "Melbourne":"#002B5C",
  "North Melbourne":"#003A8F",
  "Port Adelaide":"#1C1C1C",
  "Richmond":"#FFD200",
  "St Kilda":"#000000",
  "Sydney":"#ED171F",
  "West Coast":"#002B5C",
  "Western Bulldogs":"#1E3A8A"
};

const startYear = 1990;
const endYear = new Date().getFullYear();

let years = [];
for(let y=startYear; y<=endYear; y++){
  years.push(y);
}

let playerGames = [];
let originalOrder = [];
let currentSort = {key:null, desc:true};

Promise.all(
  years.map(y =>
    fetch(`/data/afl/afl_${y}.json`)
      .then(r => r.json())
      .catch(() => [])
  )
).then(allData => {

  const allPlayers = allData.flat();
  playerGames = allPlayers.filter(p => p.player === playerName);
  originalOrder = [...playerGames];

  if(playerGames.length){
    const team = playerGames[0].played_for;
    document.getElementById("teamColor").style.background = teamColors[team] || "#999";
  }

  renderTable(playerGames);

  const opponentSelect = document.getElementById("opponentSelect");
  const careerStatsDiv = document.getElementById("careerStats");
  const opponentStatsDiv = document.getElementById("opponentStats");
  const opponentTitle = document.getElementById("opponentTitle");

  const opponents = [...new Set(playerGames.map(g => g.played_against))].sort();
  opponents.forEach(o => {
    const opt = document.createElement("option");
    opt.value = o;
    opt.textContent = o;
    opponentSelect.appendChild(opt);
  });

  function calcStats(games){
    const totalGames = games.length;
    const totalD = games.reduce((s,g)=>s+(g.D||0),0);
    const totalG = games.reduce((s,g)=>s+(g.G||0),0);

    const bestD = Math.max(...games.map(g=>g.D||0));
    const bestG = Math.max(...games.map(g=>g.G||0));

    const avgD = totalGames ? (totalD/totalGames).toFixed(1) : 0;
    const avgG = totalGames ? (totalG/totalGames).toFixed(2) : 0;

    return {totalGames, bestD, bestG, avgD, avgG};
  }

  function renderCareer(){
    const s = calcStats(playerGames);
    careerStatsDiv.innerHTML = `
      <div class="stat-box"><strong>${s.totalGames}</strong><span>Games</span></div>
      <div class="stat-box"><strong>${s.bestD}</strong><span>Career Best Disposals</span></div>
      <div class="stat-box"><strong>${s.bestG}</strong><span>Career Best Goals</span></div>
      <div class="stat-box"><strong>${s.avgD}</strong><span>Avg Disposals</span></div>
      <div class="stat-box"><strong>${s.avgG}</strong><span>Avg Goals</span></div>
    `;
  }

  function renderOpponent(opponent){
    if(opponent==="all"){
      opponentStatsDiv.innerHTML = "";
      opponentTitle.style.display="none";
      return;
    }
    const filtered = playerGames.filter(g=>g.played_against===opponent);
    const s = calcStats(filtered);

    opponentTitle.style.display="block";
    opponentStatsDiv.innerHTML = `
      <div class="stat-box"><strong>${s.totalGames}</strong><span>Games vs ${opponent}</span></div>
      <div class="stat-box"><strong>${s.bestD}</strong><span>Best Disposals</span></div>
      <div class="stat-box"><strong>${s.bestG}</strong><span>Best Goals</span></div>
      <div class="stat-box"><strong>${s.avgD}</strong><span>Avg Disposals</span></div>
      <div class="stat-box"><strong>${s.avgG}</strong><span>Avg Goals</span></div>
    `;
  }

  renderCareer();

  opponentSelect.addEventListener("change", e=>{
    renderOpponent(e.target.value);
  });

  document.querySelectorAll("th.sortable").forEach(th=>{
    th.addEventListener("click", ()=>{
      const key = th.dataset.key;
      if(currentSort.key===key){
        currentSort.desc = !currentSort.desc;
      }else{
        currentSort.key = key;
        currentSort.desc = true;
      }

      playerGames.sort((a,b)=>{
        const av = a[key] || 0;
        const bv = b[key] || 0;
        if(typeof av === "string"){
          return currentSort.desc ? bv.localeCompare(av) : av.localeCompare(bv);
        }
        return currentSort.desc ? bv-av : av-bv;
      });

      renderTable(playerGames);
    });
  });

  document.getElementById("resetSort").addEventListener("click", ()=>{
    playerGames = [...originalOrder];
    renderTable(playerGames);
  });

});

function renderTable(games){
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  games.forEach(p => {
    tbody.innerHTML += `
      <tr>
        <td>${p.season}</td>
        <td>${p.round}</td>
        <td class="left">${p.played_for}</td>
        <td>${p.played_against}</td>
        <td>${p.D || 0}</td>
        <td>${p.G || 0}</td>
        <td>${p.B || 0}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
