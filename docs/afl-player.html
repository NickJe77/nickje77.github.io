<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AFL Player Profile</title>

<style>
body{
  font-family:system-ui, Arial, sans-serif;
  margin:0;
  background:#f4f6f8;
}
.page{max-width:1200px;margin:0 auto;padding:25px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.name-wrap{display:flex;align-items:center;gap:14px;}
.team-stripes{height:22px;width:180px;border-radius:6px;border:1px solid #ccc;}
.player-search input,.opponent-select{
  padding:8px 12px;border-radius:8px;border:1px solid #ccc;
  font-size:15px;width:240px;
}
h1{font-size:38px;margin:0;}

#summary{
  background:white;border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  padding:25px 30px;margin-bottom:20px;
}

.section-title{
  margin-top:16px;margin-bottom:6px;
  font-weight:700;color:#666;
  text-transform:uppercase;font-size:13px;
  letter-spacing:0.6px;
}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;}
.stat-box{
  background:linear-gradient(180deg,#f9fbff,#eef3fb);
  border-radius:12px;padding:16px 10px;text-align:center;
  box-shadow:inset 0 0 0 1px #dde3ec;
}
.stat-box strong{display:block;font-size:26px;margin-bottom:6px;}
.stat-box span{font-size:14px;color:#555;}

table{
  border-collapse:collapse;width:100%;background:white;
  border-radius:10px;overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.06);
}
th,td{border:1px solid #ddd;padding:8px;text-align:center;}
th{cursor:pointer;background:#eef3fb;}
td.left{text-align:left;font-weight:600;}
tbody tr:nth-child(even){background:#f2f7ff;}

.reset-sort{margin-top:10px;padding:6px 12px;border-radius:6px;border:1px solid #aaa;cursor:pointer;}
</style>
</head>

<body>
<div class="page">

<div class="top-bar">
  <div class="name-wrap">
    <h1 id="playerName"></h1>
    <div id="teamStripe" class="team-stripes"></div>
  </div>

  <div class="player-search">
    <input id="playerSearch" list="playerList" placeholder="Search player...">
    <datalist id="playerList"></datalist>
  </div>
</div>

<div id="summary">
  <select id="opponentSelect" class="opponent-select">
    <option value="all">All Opponents</option>
  </select>

  <div class="section-title">Career Summary</div>
  <div class="stats" id="careerStats"></div>

  <div class="section-title">Vs Selected Opponent</div>
  <div class="stats" id="opponentStats"></div>
</div>

<button class="reset-sort" onclick="resetSort()">Reset Sort</button>

<table>
<thead>
<tr>
  <th onclick="sortTable('season')">Season</th>
  <th onclick="sortTable('round')">Round</th>
  <th>Team</th>
  <th onclick="sortTable('played_against')">Opponent</th>
  <th onclick="sortTable('D')">D</th>
  <th onclick="sortTable('G')">G</th>
  <th onclick="sortTable('B')">B</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

</div>

<script>
const params=new URLSearchParams(window.location.search);
const playerName=params.get("name")||"";
document.getElementById("playerName").textContent=playerName||"Select a player";

let allGames=[], currentGames=[], sortDir=-1, sortKey=null;

const teamColours={
  "Carlton":["#001A3D","#ffffff"],
  "Collingwood":["#000000","#ffffff"],
  "Richmond":["#FFD200","#000000"],
  "Essendon":["#CC2031","#000000"],
  "Geelong":["#1C3C63","#ffffff"],
  "Sydney":["#ED171F","#ffffff"],
  "West Coast":["#002B5C","#FFD200"],
  "Adelaide":["#002B5C","#FFD200","#CC2031"],
  "Port Adelaide":["#1C1C1C","#00B2A9","#ffffff"],
  "Brisbane":["#7C003E","#FFD200","#005BAC"],
  "Hawthorn":["#4D2004","#FFD200"],
  "Melbourne":["#002B5C","#ED171F"],
  "Western Bulldogs":["#1E3A8A","#ED171F","#ffffff"],
  "Gold Coast":["#B90A32","#FFD200","#005BAC"],
  "GWS":["#F47920","#000000","#ffffff"],
  "North Melbourne":["#0A2E8A","#ffffff"]
};

function makeStripe(colours){
  let seq=[];
  if(colours.length===3){
    seq=[...colours,...colours];
  }else{
    seq=[...colours,...colours,...colours];
  }
  const step=100/seq.length;
  let parts=[];
  seq.forEach((c,i)=>{
    parts.push(`${c} ${i*step}% ${(i+1)*step}%`);
  });
  return `repeating-linear-gradient(90deg,${parts.join(",")})`;
}

const years=[];
for(let y=1990;y<=new Date().getFullYear();y++) years.push(y);

Promise.all(years.map(y=>fetch(`data/afl/afl_${y}.json`).then(r=>r.json()).catch(()=>[])))
.then(data=>{
  allGames=data.flat();

  const names=[...new Set(allGames.map(p=>p.player))].sort();
  const list=document.getElementById("playerList");
  names.forEach(n=>{
    const o=document.createElement("option");
    o.value=n;
    list.appendChild(o);
  });

  currentGames=allGames.filter(p=>p.player===playerName);

  if(currentGames.length){
    const latest=currentGames.reduce((a,b)=>a.season>b.season?a:b);
    const colours=teamColours[latest.played_for];
    if(colours){
      document.getElementById("teamStripe").style.background=makeStripe(colours);
    }
    setupOpponents(currentGames);
    renderCareer(currentGames);
    renderOpponent([]);
    renderTable(currentGames);
  }
});

function setupOpponents(games){
  const sel=document.getElementById("opponentSelect");
  [...new Set(games.map(g=>g.played_against))].sort().forEach(o=>{
    const opt=document.createElement("option");
    opt.value=o;
    opt.textContent=o;
    sel.appendChild(opt);
  });

  sel.onchange=()=>{
    let f=games;
    if(sel.value!=="all") f=games.filter(g=>g.played_against===sel.value);
    renderOpponent(f);
    renderTable(f);
  };
}

function renderCareer(g){ renderStats(g,"careerStats"); }
function renderOpponent(g){ renderStats(g,"opponentStats"); }

function renderStats(g,id){
  if(!g.length){
    document.getElementById(id).innerHTML="";
    return;
  }
  const games=g.length;
  const d=g.reduce((s,x)=>s+(x.D||0),0);
  const goals=g.reduce((s,x)=>s+(x.G||0),0);

  document.getElementById(id).innerHTML=`
    <div class="stat-box"><strong>${games}</strong><span>Games</span></div>
    <div class="stat-box"><strong>${Math.max(...g.map(x=>x.D||0))}</strong><span>Best Disposals</span></div>
    <div class="stat-box"><strong>${Math.max(...g.map(x=>x.G||0))}</strong><span>Best Goals</span></div>
    <div class="stat-box"><strong>${(d/games).toFixed(1)}</strong><span>Avg Disposals</span></div>
    <div class="stat-box"><strong>${(goals/games).toFixed(2)}</strong><span>Avg Goals</span></div>
  `;
}

function renderTable(g){
  const tbody=document.getElementById("rows");
  tbody.innerHTML="";
  g.forEach(p=>{
    tbody.innerHTML+=`
      <tr>
        <td>${p.season}</td>
        <td>${p.round}</td>
        <td class="left">${p.played_for}</td>
        <td>${p.played_against}</td>
        <td>${p.D||0}</td>
        <td>${p.G||0}</td>
        <td>${p.B||0}</td>
      </tr>`;
  });
}

function sortTable(key){
  if(sortKey===key){
    sortDir*=-1;
  }else{
    sortKey=key;
    sortDir=-1; // FIRST CLICK = DESCENDING
  }
  currentGames.sort((a,b)=>(b[key]||0)-(a[key]||0));
  if(sortDir===1){
    currentGames.reverse();
  }
  renderTable(currentGames);
}

function resetSort(){
  currentGames=allGames.filter(p=>p.player===playerName);
  renderTable(currentGames);
}

document.getElementById("playerSearch").onchange=e=>{
  window.location.href="afl-player.html?name="+encodeURIComponent(e.target.value);
};
</script>

</body>
</html>
