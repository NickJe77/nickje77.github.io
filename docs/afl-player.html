<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AFL Player Profile</title>

<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:22px;padding:14px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:17px;}
.navbar a:hover{text-decoration:underline;}
.page{max-width:1200px;margin:0 auto;padding:25px;}
.team-stripes{height:22px;width:140px;border-radius:6px;border:1px solid #ccc;}
table{border-collapse:collapse;width:100%;background:#fff;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;}
td.left{text-align:left;font-weight:600;}
tbody tr:hover{background:#e8f0ff;cursor:pointer;}
</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/afl.html">AFL</a>
  <a href="/afl-seasons.html">Seasons</a>
  <a href="/afl-players.html">Players</a>
</div>

<div class="page">
<h1 id="playerName"></h1>
<div id="teamStripe" class="team-stripes"></div>

<table>
<thead><tr><th>Season</th><th>Round</th><th>Team</th><th>Opponent</th><th>D</th><th>G</th><th>B</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>

<script>
const params=new URLSearchParams(location.search);
const name=params.get("name");
document.getElementById("playerName").textContent=name;

const teamStripes={
  "Carlton":"repeating-linear-gradient(90deg,#001A3D 0 24px,#fff 24px 48px,#001A3D 48px 72px)",
  "Collingwood":"repeating-linear-gradient(90deg,#000 0 24px,#fff 24px 48px,#000 48px 72px)",
  "Richmond":"repeating-linear-gradient(90deg,#FFD200 0 24px,#000 24px 48px,#FFD200 48px 72px)",
  "Essendon":"repeating-linear-gradient(90deg,#CC2031 0 24px,#000 24px 48px,#CC2031 48px 72px)",
  "Geelong":"repeating-linear-gradient(90deg,#1C3C63 0 24px,#fff 24px 48px,#1C3C63 48px 72px)",
  "Sydney":"repeating-linear-gradient(90deg,#ED171F 0 24px,#fff 24px 48px,#ED171F 48px 72px)",
  "West Coast":"repeating-linear-gradient(90deg,#002B5C 0 24px,#FFD200 24px 48px,#002B5C 48px 72px)",
  "Adelaide":"repeating-linear-gradient(90deg,#002B5C 0 24px,#FFD200 24px 48px,#CC2031 48px 72px)",
  "Port Adelaide":"repeating-linear-gradient(90deg,#1C1C1C 0 24px,#00B2A9 24px 48px,#fff 48px 72px)",
  "Brisbane":"repeating-linear-gradient(90deg,#7C003E 0 24px,#FFD200 24px 48px,#005BAC 48px 72px)",
  "Hawthorn":"repeating-linear-gradient(90deg,#4D2004 0 24px,#FFD200 24px 48px,#4D2004 48px 72px)",
  "Melbourne":"repeating-linear-gradient(90deg,#002B5C 0 24px,#ED171F 24px 48px,#002B5C 48px 72px)",
  "Western Bulldogs":"repeating-linear-gradient(90deg,#1E3A8A 0 24px,#ED171F 24px 48px,#fff 48px 72px)",
  "Gold Coast":"repeating-linear-gradient(90deg,#B90A32 0 24px,#FFD200 24px 48px,#B90A32 48px 72px)",
  "GWS":"repeating-linear-gradient(90deg,#F47920 0 24px,#000 24px 48px,#fff 48px 72px)",
  "St Kilda":"repeating-linear-gradient(90deg,#000 0 24px,#ED171F 24px 48px,#fff 48px 72px)",
  "Fremantle":"repeating-linear-gradient(90deg,#2B004F 0 24px,#fff 24px 48px,#2B004F 48px 72px)",
  "North Melbourne":"repeating-linear-gradient(90deg,#0A2E8A 0 24px,#fff 24px 48px,#0A2E8A 48px 72px)"
};

const years=[];
for(let y=1990;y<=new Date().getFullYear();y++) years.push(y);

Promise.all(years.map(y=>fetch(`/data/afl/afl_${y}.json`).then(r=>r.json()).catch(()=>[])))
.then(data=>{
  const games=data.flat().filter(p=>p.player===name);
  if(!games.length) return;

  const latest=games.reduce((a,b)=>a.season>b.season?a:b);
  teamStripe.style.background=teamStripes[latest.played_for];

  games.forEach(p=>{
    rows.innerHTML+=`<tr onclick="location.href='afl-game.html?season=${p.season}&round=${encodeURIComponent(p.round)}&team=${encodeURIComponent(p.played_for)}&opp=${encodeURIComponent(p.played_against)}'">
      <td>${p.season}</td><td>${p.round}</td><td class="left">${p.played_for}</td><td>${p.played_against}</td><td>${p.D||0}</td><td>${p.G||0}</td><td>${p.B||0}</td></tr>`;
  });
});
</script>
</body>
</html>
