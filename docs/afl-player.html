<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Player Performance | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:900px;
  margin:0 auto;
  padding:30px 20px;
}

.search-box{
  max-width:420px;
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
}

.stats-table{
  width:100%;
  border-collapse:collapse;
  margin-top:30px;
}

.stats-table th{
  background:#f0f0f0;
  text-align:left;
  padding:10px;
  font-size:15px;
  font-weight:700;
}

.stats-table td{
  border-bottom:1px solid #ddd;
  padding:10px;
  font-size:15px;
}

.stats-table tr:nth-child(even) td{
  background:#f3f7ff;
}

.placeholder{
  color:#666;
  font-style:italic;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>AFL Player Performance</h1>

<p>Search a player and an opponent to view performance comparisons.</p>

<div class="search-box">
  <input id="playerSearch" list="playerList" placeholder="Enter player name...">
  <datalist id="playerList"></datalist>
</div>

<div class="search-box">
  <input id="opponentSearch" list="teamList" placeholder="Enter opponent team...">
  <datalist id="teamList"></datalist>
</div>

<table class="stats-table">

<tr><th colspan="2">PLAYER</th></tr>
<tr><td>Best Game Disposals</td><td id="pBestDisp" class="placeholder">—</td></tr>
<tr><td>Best Game Goals</td><td id="pBestGoals" class="placeholder">—</td></tr>
<tr><td>Average Disposals</td><td id="pAvgDisp" class="placeholder">—</td></tr>
<tr><td>Average Goals</td><td id="pAvgGoals" class="placeholder">—</td></tr>

<tr><th colspan="2">OPPONENT</th></tr>
<tr><td>Best Game Disposals</td><td id="oBestDisp" class="placeholder">—</td></tr>
<tr><td>Best Game Goals</td><td id="oBestGoals" class="placeholder">—</td></tr>
<tr><td>Average Disposals</td><td id="oAvgDisp" class="placeholder">—</td></tr>
<tr><td>Average Goals</td><td id="oAvgGoals" class="placeholder">—</td></tr>

</table>

</div>

<script>
const pInput = document.getElementById("playerSearch");
const oInput = document.getElementById("opponentSearch");
const playerList = document.getElementById("playerList");
const teamList = document.getElementById("teamList");

let allData = [];

/* LOAD AFL DATA */
async function loadAllSeasons(){
  const startYear = 1990;
  const endYear = new Date().getFullYear();
  const players = new Set();
  const teams = new Set();

  for(let y=startYear; y<=endYear; y++){
    try{
      const res = await fetch(`/data/afl/afl_${y}.json`);
      if(!res.ok) continue;
      const seasonData = await res.json();
      seasonData.forEach(r=>{
        allData.push(r);
        if(r.player) players.add(r.player);
        if(r.played_for) teams.add(r.played_for);
        if(r.played_against) teams.add(r.played_against);
      });
    }catch(e){}
  }

  [...players].sort().forEach(p=>{
    const opt=document.createElement("option");
    opt.value=p;
    playerList.appendChild(opt);
  });

  [...teams].sort().forEach(t=>{
    const opt=document.createElement("option");
    opt.value=t;
    teamList.appendChild(opt);
  });
}

loadAllSeasons();

pInput.addEventListener("input", updateStats);
oInput.addEventListener("input", updateStats);

function updateStats(){
  const player = pInput.value.trim();
  const opponent = oInput.value.trim();

  if(player){
    const playerGames = allData.filter(r => r.player === player);
    updateBlock(playerGames,"p");
  }

  if(player && opponent){
    const oppGames = allData.filter(r =>
      r.player === player &&
      r.played_against === opponent
    );
    updateBlock(oppGames,"o");
  } else {
    clearOpponent();
  }
}

function updateBlock(rows,prefix){
  if(rows.length===0){
    ["BestDisp","BestGoals","AvgDisp","AvgGoals"].forEach(id=>{
      document.getElementById(prefix+id).innerText="—";
    });
    return;
  }

  const maxDisp = Math.max(...rows.map(r=>+r.D||0));
  const maxGoals = Math.max(...rows.map(r=>+r.G||0));

  const bestDispGames = rows.filter(r => (+r.D||0) === maxDisp);
  const bestGoalsGames = rows.filter(r => (+r.G||0) === maxGoals);

  const bestDispRow = bestDispGames[0];
  const bestGoalsRow = bestGoalsGames[0];

  const dispCount = bestDispGames.length;
  const goalsCount = bestGoalsGames.length;

  const avgDisp = (rows.reduce((s,r)=>s+(+r.D||0),0)/rows.length).toFixed(1);
  const avgGoals = (rows.reduce((s,r)=>s+(+r.G||0),0)/rows.length).toFixed(2);

  const dispYear = bestDispRow.season || bestDispRow.year || "";
  const goalsYear = bestGoalsRow.season || bestGoalsRow.year || "";

  if(prefix === "p"){
    document.getElementById(prefix+"BestDisp").innerText =
      `${maxDisp} vs ${bestDispRow.played_against} (Round ${bestDispRow.round}, ${dispYear}) — ${dispCount} time${dispCount>1?"s":""}`;

    document.getElementById(prefix+"BestGoals").innerText =
      `${maxGoals} vs ${bestGoalsRow.played_against} (Round ${bestGoalsRow.round}, ${goalsYear}) — ${goalsCount} time${goalsCount>1?"s":""}`;
  } else {
    document.getElementById(prefix+"BestDisp").innerText =
      `${maxDisp} (Round ${bestDispRow.round}, ${dispYear}) — ${dispCount} time${dispCount>1?"s":""}`;

    document.getElementById(prefix+"BestGoals").innerText =
      `${maxGoals} (Round ${bestGoalsRow.round}, ${goalsYear}) — ${goalsCount} time${goalsCount>1?"s":""}`;
  }

  document.getElementById(prefix+"AvgDisp").innerText = avgDisp;
  document.getElementById(prefix+"AvgGoals").innerText = avgGoals;
}

function clearOpponent(){
  ["BestDisp","BestGoals","AvgDisp","AvgGoals"].forEach(id=>{
    document.getElementById("o"+id).innerText="—";
  });
}
</script>

</body>
</html>
