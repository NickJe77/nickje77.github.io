<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Racing | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    /* HEADER IMAGE (MAIN SITE HEADER ALREADY ABOVE THIS PAGE) */
    header {
      width: 100%;
    }

    /* NAV */
    nav {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 24px;
    }

    nav a {
      margin-right: 20px;
      font-weight: 600;
      text-decoration: none;
      color: #0066cc;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* MAIN CONTENT */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }

    /* G1 HERO */
    .g1-hero {
      margin: 20px 0 40px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .g1-hero img {
      width: 100%;
      height: auto;          /* keeps full image */
      max-height: 420px;     /* THIS controls the size */
      object-fit: contain;   /* no cropping */
      display: block;
      background: #000;      /* neat letterboxing if needed */
    }

    h1 {
      margin-top: 0;
    }

    /* CARNIVAL GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 28px;
    }

    .card {
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .card-title {
      margin-top: 12px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="racing.html">Racing</a>
  </nav>

  <main>

    <!-- G1 HERO -->
    <div class="g1-hero">
      <img src="images/g1-hero.jpg" alt="Group 1 Racing">
    </div>

    <h1>Major Carnivals</h1>

    <div class="grid">
      <div class="card">
        <img src="images/carnival-breeders-cup.jpg" alt="Breeders' Cup">
        <div class="card-title">Breeders’ Cup</div>
      </div>

      <div class="card">
        <img src="images/carnival-royal-ascot.jpg" alt="Royal Ascot">
        <div class="card-title">Royal Ascot</div>
      </div>

      <div class="card">
        <img src="images/carnival-arc.jpg" alt="Arc de Triomphe">
        <div class="card-title">Arc de Triomphe</div>
      </div>

      <div class="card">
        <img src="images/carnival-hong-kong.jpg" alt="Hong Kong International">
        <div class="card-title">Hong Kong International</div>
      </div>

      <div class="card">
        <img src="images/carnival-dubai.jpg" alt="Dubai World Cup">
        <div class="card-title">Dubai World Cup</div>
      </div>
    </div>

  </main>

</body>
</html>
