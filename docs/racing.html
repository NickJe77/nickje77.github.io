<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group 1 Racing | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    /* GLOBAL WRAPPER */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* NAV */
    nav {
      margin-bottom: 24px;
    }

    nav a {
      margin-right: 18px;
      font-weight: 600;
      text-decoration: none;
      color: #0066cc;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* G1 HERO BANNER */
    .g1-hero {
      margin-bottom: 32px;
    }

    .g1-hero img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    /* SECTION HEADINGS */
    h1 {
      margin-top: 0;
      margin-bottom: 16px;
    }

    h2 {
      margin-top: 40px;
      margin-bottom: 16px;
    }

    /* MAJOR CARNIVALS GRID */
    .carnivals {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .carnival-card {
      text-align: center;
    }

    .carnival-card img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      margin-bottom: 10px;
    }

    .carnival-card a {
      text-decoration: none;
      color: #111;
      font-weight: 600;
    }

    .carnival-card a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main>

    <nav>
      <a href="index.html">Home</a>
      <a href="racing.html">Racing</a>
    </nav>

    <h1>Group 1 Racing</h1>

    <!-- G1 HERO -->
    <a href="#">
      <div class="g1-hero">
        <img src="./images/g1-hero.jpg" alt="Group 1 Racing">
      </div>
    </a>

    <h2>Major Carnivals</h2>

    <div class="carnivals">

      <div class="carnival-card">
        <a href="breeders-cup.html">
          <img src="./images/carnival-breeders-cup.jpg" alt="Breeders’ Cup">
          Breeders’ Cup
        </a>
      </div>

      <div class="carnival-card">
        <a href="#">
          <img src="./images/carnival-royal-ascot.jpg" alt="Royal Ascot">
          Royal Ascot
        </a>
      </div>

      <div class="carnival-card">
        <a href="#">
          <img src="./images/carnival-arc.jpg" alt="Arc de Triomphe">
          Arc de Triomphe
        </a>
      </div>

      <div class="carnival-card">
        <a href="#">
          <img src="./images/carnival-hong-kong.jpg" alt="Hong Kong International">
          Hong Kong International
        </a>
      </div>

      <div class="carnival-card">
        <a href="#">
          <img src="./images/carnival-dubai.jpg" alt="Dubai World Cup">
          Dubai World Cup
        </a>
      </div>

    </div>

  </main>

</body>
</html>
