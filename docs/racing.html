<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Racing | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Global site styles -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================
       RACING PAGE (LOCAL ONLY)
       ========================= */

    .racing-hero {
      max-width: 1200px;
      margin: 36px auto 24px;
      padding: 0 24px;
    }

    .racing-hero img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .racing-intro {
      max-width: 900px;
      margin: 40px auto 60px;
      padding: 0 24px;
      text-align: center;
    }

    .racing-intro h1 {
      font-size: 34px;
      margin-bottom: 14px;
    }

    .racing-intro p {
      font-size: 18px;
      color: #444;
    }

    /* =========================
       TILE GRID (MATCH HOME)
       ========================= */

    .racing-grid {
      max-width: 1200px;
      margin: 0 auto 90px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 28px;
    }

    .racing-tile {
      grid-column: span 2;
      text-decoration: none;
      color: #fff;
    }

    .tile-wrap {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .tile-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tile-wrap:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.18);
    }

    .racing-label {
      position: absolute;
      bottom: 14px;
      left: 16px;
      font-size: 18px;
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 900px) {
      .racing-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .racing-tile {
        grid-column: span 1;
      }
    }

    @media (max-width: 550px) {
      .racing-grid {
        grid-template-columns: 1fr;
      }

      .racing-hero img {
        height: 220px;
      }

      .racing-intro h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <!-- GLOBAL NAV -->
  <nav class="home-nav">
    <a href="index.html">Home</a>
    <a href="racing.html" class="active">Racing</a>
    <a href="afl.html">AFL</a>
    <a href="football.html">Football</a>
    <a href="cricket.html">Cricket</a>
    <a href="f1.html">F1</a>
  </nav>

  <!-- HERO -->
  <section class="racing-hero">
    <img src="images/racing-hero.jpg" alt="Racing">
  </section>

  <!-- INTRO -->
  <section class="racing-intro">
    <h1>Racing</h1>
    <p>
      A global archive of elite thoroughbred racing — spanning historic Group 1s,
      international carnivals, and the champions that defined them.
    </p>
  </section>

  <!-- TILES -->
  <section class="racing-grid">

    <!-- 1. G1 ARCHIVE -->
    <a class="racing-tile" href="g1-archive.html">
      <div class="tile-wrap">
        <img src="images/g1-hero.jpg" alt="G1 Archive">
        <div class="racing-label">G1 Archive</div>
      </div>
    </a>

    <!-- 2. BREEDERS CUP -->
    <a class="racing-tile" href="breeders-cup.html">
      <div class="tile-wrap">
        <img src="images/carnival-breeders-cup.jpg" alt="Breeders’ Cup">
        <div class="racing-label">Breeders’ Cup</div>
      </div>
    </a>

    <!-- 3. DUBAI -->
    <a class="racing-tile" href="dubai.html">
      <div class="tile-wrap">
        <img src="images/carnival-dubai.jpg" alt="Dubai">
        <div class="racing-label">Dubai</div>
      </div>
    </a>

    <!-- 4. HONG KONG -->
    <a class="racing-tile" href="hong-kong.html">
      <div class="tile-wrap">
        <img src="images/carnival-hong-kong.jpg" alt="Hong Kong">
        <div class="racing-label">Hong Kong</div>
      </div>
    </a>

    <!-- 5. ARC -->
    <a class="racing-tile" href="arc.html">
      <div class="tile-wrap">
        <img src="images/carnival-arc.jpg" alt="Prix de l’Arc de Triomphe">
        <div class="racing-label">Prix de l’Arc de Triomphe</div>
      </div>
    </a>

    <!-- 6. ROYAL ASCOT -->
    <a class="racing-tile" href="royal-ascot.html">
      <div class="tile-wrap">
        <img src="images/carnival-royal-ascot.jpg" alt="Royal Ascot">
        <div class="racing-label">Royal Ascot</div>
      </div>
    </a>

  </section>

</body>
</html>
