<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Racing | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    /* TOP NAV */
    nav {
      padding: 16px 24px;
    }

    nav a {
      margin-right: 18px;
      font-weight: 600;
      text-decoration: none;
      color: #0066cc;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* HERO */
    .hero {
      max-width: 1200px;
      margin: 0 auto 32px;
      padding: 0 24px;
    }

    .hero a {
      display: block;
      border-radius: 14px;
      overflow: hidden;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* PAGE CONTENT */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }

    h1 {
      margin: 24px 0;
    }

    /* CARNIVAL GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    .card {
      text-decoration: none;
      color: #111;
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .card h3 {
      margin: 12px 0 0;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="racing.html">Racing</a>
  </nav>

  <!-- G1 HERO -->
  <section class="hero">
    <a href="#">
      <img src="images/g1-hero.jpg" alt="Group 1 Racing">
    </a>
  </section>

  <main>
    <h1>Major Carnivals</h1>

    <div class="grid">
      <a class="card" href="#">
        <img src="images/carnival-breeders-cup.jpg" alt="Breeders’ Cup">
        <h3>Breeders’ Cup</h3>
      </a>

      <a class="card" href="#">
        <img src="images/carnival-royal-ascot.jpg" alt="Royal Ascot">
        <h3>Royal Ascot</h3>
      </a>

      <a class="card" href="#">
        <img src="images/carnival-arc.jpg" alt="Arc de Triomphe">
        <h3>Arc de Triomphe</h3>
      </a>

      <a class="card" href="#">
        <img src="images/carnival-hong-kong.jpg" alt="Hong Kong International">
        <h3>Hong Kong International</h3>
      </a>

      <a class="card" href="#">
        <img src="images/carnival-dubai.jpg" alt="Dubai World Cup">
        <h3>Dubai World Cup</h3>
      </a>
    </div>
  </main>

</body>
</html>
