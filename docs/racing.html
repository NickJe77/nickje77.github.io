<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Racing | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Global styles (nav, font reset, etc) -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================
       RACING PAGE – LOCAL ONLY
       ========================= */

    .racing-hero {
      max-width: 1200px;
      margin: 36px auto 24px;
      padding: 0 24px;
    }

    .racing-hero img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .racing-intro {
      max-width: 900px;
      margin: 48px auto 20px;
      padding: 0 24px;
      text-align: center;
    }

    .racing-intro h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .racing-intro p {
      font-size: 18px;
      color: #444;
    }

    /* =========================
       TILE GRID (MATCH HOME)
       ========================= */

    .racing-grid {
      max-width: 1200px;
      margin: 60px auto 90px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 28px;
    }

    .racing-tile {
      grid-column: span 2;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .racing-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .racing-tile:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.18);
    }

    .racing-label {
      position: absolute;
      bottom: 14px;
      left: 14px;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    .tile-wrap {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 900px) {
      .racing-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .racing-tile {
        grid-column: span 1;
      }
    }

    @media (max-width: 550px) {
      .racing-grid {
        grid-template-columns: 1fr;
      }
      .racing-hero img {
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <section class="racing-hero">
    <img src="images/racing-hero.jpg" alt="Racing">
  </section>

  <!-- INTRO -->
  <section class="racing-intro">
    <h1>Racing</h1>
    <p>
      A global archive of elite thoroughbred racing — spanning historic Group 1s,
      international carnivals, and the champions that defined them.
    </p>
  </section>

  <!-- TILES -->
  <section class="racing-grid">

    <a class="racing-tile" href="g1-archive.html">
      <div class="tile-wrap">
        <img src="images/carnival-arc.jpg" alt="G1 Archive">
        <div class="racing-label">G1 Archive</div>
      </div>
    </a>

    <a class="racing-tile" href="#">
      <div class="tile-wrap">
        <img src="images/carnival-breeders-cup.jpg" alt="Breeders Cup">
        <div class="racing-label">Breeders’ Cup</div>
      </div>
    </a>

    <a class="racing-tile" href="#">
      <div class="tile-wrap">
        <img src="images/carnival-royal-ascot.jpg" alt="Royal Ascot">
        <div class="racing-label">Royal Ascot</div>
      </div>
    </a>

    <a class="racing-tile" href="#">
      <div class="tile-wrap">
        <img src="images/carnival-dubai.jpg" alt="Dubai Carnival">
        <div class="racing-label">Dubai Carnival</div>
      </div>
    </a>

    <a class="racing-tile" href="#">
      <div class="tile-wrap">
        <img src="images/carnival-hong-kong.jpg" alt="Hong Kong">
        <div class="racing-label">Hong Kong</div>
      </div>
    </a>

  </section>

</body>
</html>
