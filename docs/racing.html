<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Racing | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    /* HEADER */
    header {
      width: 100%;
      background: #000;
    }

    header img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* MAIN */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    /* NAV */
    nav {
      margin-bottom: 36px;
    }

    nav a {
      margin-right: 22px;
      font-weight: 600;
      text-decoration: none;
      color: #0066cc;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* SECTION */
    h2 {
      margin: 0 0 24px 0;
      font-size: 28px;
    }

    /* CARNIVAL GRID */
    .carnival-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 28px;
    }

    .carnival-card {
      display: block;
      text-decoration: none;
      color: #111;
      border-radius: 14px;
      overflow: hidden;
      background: #f4f4f4;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .carnival-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
    }

    .carnival-card span {
      display: block;
      padding: 16px;
      font-weight: 700;
      text-align: center;
      background: #ffffff;
    }

    .carnival-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>

  <!-- HEADER BANNER -->
  <header>
    <img src="header-banner.png" alt="The Sporting Almanac">
  </header>

  <!-- CONTENT -->
  <main>

    <!-- GLOBAL NAV -->
    <nav>
      <a href="index.html">Home</a>
      <a href="racing.html">Racing</a>
    </nav>

    <!-- MAJOR CARNIVALS -->
    <section>
      <h2>Major Carnivals</h2>

      <div class="carnival-grid">

        <a class="carnival-card" href="breeders-cup.html">
          <img src="carnival-breeders-cup-v2.jpg" alt="Breeders’ Cup">
          <span>Breeders’ Cup</span>
        </a>

        <a class="carnival-card" href="royal-ascot.html">
          <img src="carnival-royal-ascot.jpg" alt="Royal Ascot">
          <span>Royal Ascot</span>
        </a>

        <a class="carnival-card" href="arc-de-triomphe.html">
          <img src="carnival-arc.jpg" alt="Prix de l’Arc de Triomphe">
          <span>Arc de Triomphe</span>
        </a>

        <a class="carnival-card" href="hong-kong.html">
          <img src="carnival-hong-kong-v2.jpg" alt="Hong Kong International">
          <span>Hong Kong International</span>
        </a>

        <a class="carnival-card" href="dubai-world-cup.html">
          <img src="carnival-dubai.jpg" alt="Dubai World Cup">
          <span>Dubai World Cup</span>
        </a>

      </div>
    </section>

  </main>

</body>
</html>
