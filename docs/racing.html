<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Racing | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    /* SITE HEADER */
    header img {
      width: 100%;
      height: auto;
      display: block;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    nav {
      margin-bottom: 28px;
    }

    nav a {
      margin-right: 20px;
      font-weight: 600;
      text-decoration: none;
      color: #0066cc;
    }

    nav a:hover {
      text-decoration: underline;
    }

    h1, h2 {
      margin-top: 0;
    }

    /* G1 HERO */
    .g1-hero {
      margin-bottom: 40px;
    }

    .g1-hero a {
      display: block;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .g1-hero a:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    }

    .g1-hero img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* CARNIVAL GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 28px;
    }

    .tile {
      text-align: center;
    }

    .tile a {
      display: block;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .tile a:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.22);
    }

    .tile img {
      width: 100%;
      height: auto;
      display: block;
    }

    .tile h3 {
      margin: 12px 0 0;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <!-- GLOBAL HEADER -->
  <header>
    <img src="header-banner.png" alt="The Sporting Almanac">
  </header>

  <main>

    <!-- NAV -->
    <nav>
      <a href="index.html">Home</a>
      <a href="racing.html">Racing</a>
    </nav>

    <!-- G1 HERO -->
    <section class="g1-hero">
      <a href="#">
        <img src="images/g1-hero.jpg" alt="Group 1 Racing">
      </a>
    </section>

    <!-- MAJOR CARNIVALS -->
    <h2>Major Carnivals</h2>

    <section class="grid">

      <div class="tile">
        <a href="#">
          <img src="images/carnival-breeders-cup.jpg" alt="Breeders' Cup">
        </a>
        <h3>Breeders’ Cup</h3>
      </div>

      <div class="tile">
        <a href="#">
          <img src="images/carnival-royal-ascot.jpg" alt="Royal Ascot">
        </a>
        <h3>Royal Ascot</h3>
      </div>

      <div class="tile">
        <a href="#">
          <img src="images/carnival-arc.jpg" alt="Arc de Triomphe">
        </a>
        <h3>Arc de Triomphe</h3>
      </div>

      <div class="tile">
        <a href="#">
          <img src="images/carnival-hong-kong.jpg" alt="Hong Kong International">
        </a>
        <h3>Hong Kong International</h3>
      </div>

      <div class="tile">
        <a href="#">
          <img src="images/carnival-dubai.jpg" alt="Dubai World Cup">
        </a>
        <h3>Dubai World Cup</h3>
      </div>

    </section>

  </main>

</body>
</html>
