<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Racing | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Global styles -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* ---------- RACING PAGE ONLY ---------- */

    .racing-hero {
      margin: 40px auto 60px;
      max-width: 1200px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }

    .racing-hero img {
      width: 100%;
      display: block;
    }

    .racing-intro {
      text-align: center;
      margin-bottom: 60px;
    }

    .racing-intro h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .racing-intro p {
      font-size: 18px;
      color: #555;
    }

    .carnival-grid {
      max-width: 1200px;
      margin: 0 auto 80px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
      padding: 0 20px;
    }

    .carnival-card {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
      background: #fff;
      text-align: center;
      transition: transform 0.25s ease;
    }

    .carnival-card:hover {
      transform: translateY(-6px);
    }

    .carnival-card img {
      width: 100%;
      display: block;
    }

    .carnival-card h3 {
      margin: 16px 0 20px;
      font-size: 18px;
    }

    .carnival-card a {
      text-decoration: none;
      color: #000;
      font-weight: 600;
    }

    .breadcrumbs {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
      font-size: 14px;
    }

    .breadcrumbs a {
      color: #0066cc;
      text-decoration: none;
      margin-right: 6px;
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="racing.html"><strong>Racing</strong></a>
    <a href="g1-archive.html">G1 Archive</a>
  </nav>

  <!-- BREADCRUMBS -->
  <div class="breadcrumbs">
    <a href="index.html">Home</a> › Racing
  </div>

  <!-- HERO -->
  <section class="racing-hero">
    <img src="images/g1-hero.jpg" alt="Group 1 Racing">
  </section>

  <!-- INTRO -->
  <section class="racing-intro">
    <h1>Group 1 Racing Archive</h1>
    <p>Explore over 250 years of elite thoroughbred racing from around the world.</p>
  </section>

  <!-- CARNIVALS -->
  <section class="carnival-grid">

    <div class="carnival-card">
      <a href="breeders-cup.html">
        <img src="images/carnival-breeders-cup.jpg" alt="Breeders' Cup">
        <h3>Breeders’ Cup</h3>
      </a>
    </div>

    <div class="carnival-card">
      <a href="royal-ascot.html">
        <img src="images/carnival-royal-ascot.jpg" alt="Royal Ascot">
        <h3>Royal Ascot</h3>
      </a>
    </div>

    <div class="carnival-card">
      <a href="arc-de-triomphe.html">
        <img src="images/carnival-arc.jpg" alt="Prix de l’Arc de Triomphe">
        <h3>Arc de Triomphe</h3>
      </a>
    </div>

    <div class="carnival-card">
      <a href="hong-kong.html">
        <img src="images/carnival-hong-kong.jpg" alt="Hong Kong International Races">
        <h3>Hong Kong International</h3>
      </a>
    </div>

  </section>

</body>
</html>
