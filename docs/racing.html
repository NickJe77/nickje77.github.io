<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Racing | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    header img {
      width: 100%;
      height: auto;
      display: block;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    nav {
      margin-bottom: 24px;
    }

    nav a {
      margin-right: 20px;
      font-weight: 600;
      text-decoration: none;
      color: #0066cc;
    }

    nav a:hover {
      text-decoration: underline;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .hero-box {
      margin-bottom: 40px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 28px;
    }

    .card {
      text-decoration: none;
      color: #111;
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .card-title {
      margin-top: 10px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- GLOBAL HEADER IMAGE -->
  <header>
    <img src="images/header-banner.png" alt="The Sporting Almanac">
  </header>

  <main>

    <!-- GLOBAL NAV -->
    <nav>
      <a href="index.html">Home</a>
      <a href="racing.html">Racing</a>
    </nav>

    <!-- G1 HERO -->
    <section class="hero-box">
      <img src="images/g1-hero.jpg" alt="Group 1 Racing">
    </section>

    <h1>Major Carnivals</h1>

    <!-- MAJOR CARNIVALS GRID -->
    <section class="grid">

      <a class="card" href="#">
        <img src="images/carnival-breeders-cup.jpg" alt="Breeders' Cup">
        <div class="card-title">Breeders’ Cup</div>
      </a>

      <a class="card" href="#">
        <img src="images/carnival-royal-ascot.jpg" alt="Royal Ascot">
        <div class="card-title">Royal Ascot</div>
      </a>

      <a class="card" href="#">
        <img src="images/carnival-arc.jpg" alt="Arc de Triomphe">
        <div class="card-title">Arc de Triomphe</div>
      </a>

      <a class="card" href="#">
        <img src="images/carnival-hong-kong.jpg" alt="Hong Kong International">
        <div class="card-title">Hong Kong International</div>
      </a>

      <a class="card" href="#">
        <img src="images/carnival-dubai.jpg" alt="Dubai World Cup">
        <div class="card-title">Dubai World Cup</div>
      </a>

    </section>

  </main>

</body>
</html>
