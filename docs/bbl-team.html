<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f8fc;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1200px;
margin:auto;
padding:24px;
}

.hero{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:40px;
border-radius:22px;
margin-bottom:20px;
}

.hero h1{
margin:0;
font-size:40px;
}

/* CONTROLS */
.controls{
margin-bottom:16px;
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

select{
padding:8px 14px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
}

/* TABLE */
.table-wrap{
background:#fff;
border-radius:14px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

td.num{
text-align:right;
}

tr:nth-child(even){
background:#f4f8fc;
}

tr.game-row{
cursor:pointer;
}

tr.game-row:hover{
background:#dbeafe;
}

</style>
</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/cricket.html">Cricket</a>
<a href="/bbl.html">BBL</a>
</div>

<div class="page">

<div class="hero">
<h1 id="teamName">Loading…</h1>
</div>

<div class="controls">
Opposition:
<select id="oppSelect"></select>
</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Season</th>
<th>Opponent</th>
<th>Venue</th>
<th class="num">Runs</th>
<th class="num">Opp Runs</th>
<th>Result</th>
</tr>
</thead>

<tbody id="gamesTable"></tbody>

</table>

</div>

</div>

<script>

(async function(){

const params=new URLSearchParams(location.search);
const team=params.get("team");

if(!team){
document.getElementById("teamName").textContent="Team not specified";
return;
}

document.getElementById("teamName").textContent=team;

const oppSelect=document.getElementById("oppSelect");

const index=await fetch("/data/bbl/index.json").then(r=>r.json());

const files=await Promise.all(
index.map(file=>
fetch("/data/bbl/"+file)
.then(r=>r.json())
.then(data=>({file,data}))
)
);

let allGames=[];

files.forEach(({file,data})=>{

data.forEach(match=>{

const info=match.info;

const home=info.teams[0];
const away=info.teams[1];

if(home!==team && away!==team)return;

let teamRuns=0;
let oppRuns=0;

match.innings.forEach(inn=>{

let runs=0;

inn.overs.forEach(over=>{
over.deliveries.forEach(d=>{
runs+=d.runs.total;
});
});

if(inn.team===team)
teamRuns=runs;
else
oppRuns=runs;

});

let result="";

if(info.outcome?.winner){
result = info.outcome.winner===team ? "Won" : "Lost";
}else if(info.outcome?.result){
result = info.outcome.result;
}

allGames.push({
file,
season:info.season,
opp:home===team?away:home,
venue:info.venue,
runs:teamRuns,
oppRuns,
result
});

});

});

/* SORT */
allGames.sort((a,b)=>b.season-a.season);

/* BUILD OPPONENT DROPDOWN */
const oppSet=new Set(["All"]);

allGames.forEach(g=>oppSet.add(g.opp));

oppSet.forEach(o=>{
const opt=document.createElement("option");
opt.value=o;
opt.textContent=o;
oppSelect.appendChild(opt);
});

/* RENDER FUNCTION */
function render(){

const opp=oppSelect.value;

const games = opp==="All"
? allGames
: allGames.filter(g=>g.opp===opp);

gamesTable.innerHTML=games.map(g=>`
<tr class="game-row"
onclick="location.href='/bbl-match.html?file=${g.file}'">

<td>${g.season}</td>
<td>${g.opp}</td>
<td>${g.venue}</td>
<td class="num">${g.runs}</td>
<td class="num">${g.oppRuns}</td>
<td>${g.result}</td>

</tr>
`).join("");

}

oppSelect.onchange=render;

render();

})();
</script>

</body>
</html>
