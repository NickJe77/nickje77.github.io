<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>BBL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f8fc;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1200px;
margin:auto;
padding:24px;
}

.hero{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:40px;
border-radius:22px;
margin-bottom:20px;
}

.hero h1{
margin:0;
font-size:40px;
}

.controls{
display:flex;
gap:14px;
flex-wrap:wrap;
margin-bottom:18px;
align-items:center;
}

select{
padding:8px 12px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
}

/* STAT BOXES */

.section-title{
margin:22px 0 8px;
font-weight:700;
color:#003566;
text-align:center;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:14px;
margin-bottom:20px;
}

.stat{
background:#fff;
padding:18px;
border-radius:14px;
text-align:center;
}

.stat h3{
margin:0;
font-size:28px;
color:#003566;
}

.stat span{
font-size:14px;
color:#666;
}

/* TABLE */

.table-wrap{
background:#fff;
border-radius:14px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

td.num{
text-align:right;
}

tr:nth-child(even){
background:#f4f8fc;
}

tr.game-row{
cursor:pointer;
}

tr.game-row:hover{
background:#dbeafe;
}

</style>
</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/cricket.html">Cricket</a>
<a href="/bbl.html">BBL</a>
</div>

<div class="page">

<div class="hero">
<h1 id="teamName">Loading…</h1>
</div>

<div class="controls">

Opposition:
<select id="oppSelect"></select>

Season:
<select id="seasonSelect"></select>

Venue:
<select id="venueSelect">
<option value="All">All</option>
<option value="Home">Home</option>
<option value="Away">Away</option>
</select>

</div>

<div class="section-title">CAREER RECORD</div>
<div class="stats" id="careerStats"></div>

<div class="section-title">FILTERED RECORD</div>
<div class="stats" id="filterStats"></div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Season</th>
<th>Opponent</th>
<th>Venue</th>
<th class="num">Runs</th>
<th class="num">Opp Runs</th>
<th>Result</th>
</tr>
</thead>

<tbody id="gamesTable"></tbody>

</table>

</div>

</div>

<script>

(async function(){

const params=new URLSearchParams(location.search);
const team=params.get("team");

if(!team)return;

document.getElementById("teamName").textContent=team;

const oppSel=document.getElementById("oppSelect");
const seasonSel=document.getElementById("seasonSelect");
const venueSel=document.getElementById("venueSelect");

const careerStats=document.getElementById("careerStats");
const filterStats=document.getElementById("filterStats");
const gamesTable=document.getElementById("gamesTable");

const index=await fetch("/data/bbl/index.json").then(r=>r.json());

const files=await Promise.all(
index.map(file=>
fetch("/data/bbl/"+file)
.then(r=>r.json())
.then(data=>({file,data}))
)
);

let allGames=[];

files.forEach(({file,data})=>{

data.forEach(match=>{

const info=match.info;
const home=info.teams[0];
const away=info.teams[1];

if(home!==team && away!==team)return;

let teamRuns=0;
let oppRuns=0;

match.innings.forEach(inn=>{

let runs=0;

inn.overs.forEach(o=>{
o.deliveries.forEach(d=>{
runs+=d.runs.total;
});
});

if(inn.team===team)
teamRuns=runs;
else
oppRuns=runs;

});

let result="";

if(info.outcome?.winner)
result=info.outcome.winner===team?"Won":"Lost";
else
result="NR";

allGames.push({

file,
season:info.season,
opp:home===team?away:home,
venue:info.venue,
isHome:home===team,
runs:teamRuns,
oppRuns,
result

});

});

});

allGames.sort((a,b)=>b.season-a.season);

/* BUILD DROPDOWNS */

const oppSet=new Set(["All"]);
const seasonSet=new Set(["All"]);

allGames.forEach(g=>{
oppSet.add(g.opp);
seasonSet.add(g.season);
});

oppSet.forEach(o=>{
const opt=document.createElement("option");
opt.value=o;
opt.textContent=o;
oppSel.appendChild(opt);
});

seasonSet.forEach(s=>{
const opt=document.createElement("option");
opt.value=s;
opt.textContent=s;
seasonSel.appendChild(opt);
});

/* STAT FUNCTION */

function calcStats(list){

const matches=list.length;
const wins=list.filter(g=>g.result==="Won").length;
const losses=list.filter(g=>g.result==="Lost").length;
const winPct=matches?((wins/matches)*100).toFixed(1):"0.0";

return {matches,wins,losses,winPct};

}

/* RENDER */

function render(){

const opp=oppSel.value;
const season=seasonSel.value;
const venue=venueSel.value;

let filtered=allGames;

if(opp!=="All")
filtered=filtered.filter(g=>g.opp===opp);

if(season!=="All")
filtered=filtered.filter(g=>g.season==season);

if(venue==="Home")
filtered=filtered.filter(g=>g.isHome);

if(venue==="Away")
filtered=filtered.filter(g=>!g.isHome);

/* CAREER STATS */

const career=calcStats(allGames);

careerStats.innerHTML=`
<div class="stat"><h3>${career.matches}</h3><span>Matches</span></div>
<div class="stat"><h3>${career.wins}</h3><span>Wins</span></div>
<div class="stat"><h3>${career.losses}</h3><span>Losses</span></div>
<div class="stat"><h3>${career.winPct}%</h3><span>Win %</span></div>
`;

/* FILTER STATS */

const filt=calcStats(filtered);

filterStats.innerHTML=`
<div class="stat"><h3>${filt.matches}</h3><span>Matches</span></div>
<div class="stat"><h3>${filt.wins}</h3><span>Wins</span></div>
<div class="stat"><h3>${filt.losses}</h3><span>Losses</span></div>
<div class="stat"><h3>${filt.winPct}%</h3><span>Win %</span></div>
`;

/* TABLE */

gamesTable.innerHTML=filtered.map(g=>`
<tr class="game-row"
onclick="location.href='/bbl-match.html?file=${g.file}'">

<td>${g.season}</td>
<td>${g.opp}</td>
<td>${g.venue}</td>
<td class="num">${g.runs}</td>
<td class="num">${g.oppRuns}</td>
<td>${g.result}</td>

</tr>
`).join("");

}

oppSel.onchange=render;
seasonSel.onchange=render;
venueSel.onchange=render;

render();

})();
</script>

</body>
</html>
