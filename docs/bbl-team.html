<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#003566,#0077b6);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

.year-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:12px;
  margin-bottom:25px;
}
.year-btn{
  background:#003566;
  color:white;
  border:none;
  padding:12px 0;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
}
.year-btn:hover{background:#00509d;}
.year-btn.active{background:#00b4d8;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  margin-bottom:30px;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}

th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}

.notice{
  padding:14px 16px;
  border-radius:12px;
  margin:14px 0 18px 0;
  border:1px solid #ddd;
  background:#f7f7f7;
  font-size:14px;
}

.notice strong{display:block;margin-bottom:6px;}

.debug{
  white-space:pre-wrap;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size:12px;
  line-height:1.35;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1 id="teamName">BBL Team</h1>
    <p>Season-by-season performance.</p>
  </div>

  <div id="yearGrid" class="year-grid"></div>

  <!-- DEBUG / STATUS (we can remove once it’s fixed) -->
  <div id="statusBox" class="notice" style="display:none;">
    <strong>Status</strong>
    <div id="statusText" class="debug"></div>
  </div>

  <h2>Matches</h2>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Match</th>
        <th>Venue</th>
        <th>Result</th>
      </tr>
    </thead>
    <tbody id="matchesTable"></tbody>
  </table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const teamParamRaw = params.get("team");

// If your URLs are like ?team=Melbourne%20Stars, URLSearchParams decodes automatically.
// But this also trims accidental spaces.
const teamParam = teamParamRaw ? teamParamRaw.trim() : null;

const indexUrl = "data/bbl/index.json";
const basePath = "data/bbl/";

const yearGrid = document.getElementById("yearGrid");
const tableBody = document.getElementById("matchesTable");
const teamNameEl = document.getElementById("teamName");

const statusBox = document.getElementById("statusBox");
const statusText = document.getElementById("statusText");

let allMatches = [];
let seasons = [];

function showStatus(obj){
  statusBox.style.display = "block";
  statusText.textContent = JSON.stringify(obj, null, 2);
}

function getMatchDateStr(match){
  const d = match?.info?.dates;
  if(Array.isArray(d) && d.length) return d[0];
  if(typeof d === "string" && d.trim()) return d.trim();
  // Some datasets use "date" instead of "dates"
  const d2 = match?.info?.date;
  if(typeof d2 === "string" && d2.trim()) return d2.trim();
  return null;
}

function parseMatchDate(match){
  const s = getMatchDateStr(match);
  if(!s) return null;
  const dt = new Date(s);
  if(!isNaN(dt.getTime())) return dt;

  // Fallback: try swapping common formats (very safe)
  // e.g. "19/12/2017" -> "2017-12-19"
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){
    const dd = m[1].padStart(2,"0");
    const mm = m[2].padStart(2,"0");
    const yyyy = m[3];
    const dt2 = new Date(`${yyyy}-${mm}-${dd}`);
    if(!isNaN(dt2.getTime())) return dt2;
  }
  return null;
}

function teamMatchCheck(match){
  const t = match?.info?.teams;
  if(Array.isArray(t)) return t.includes(teamParam);
  if(typeof t === "string") return t.includes(teamParam);
  return false;
}

function seasonLabel(y){
  return `${y}–${String(y+1).slice(-2)}`;
}

async function main(){
  if(!teamParam){
    teamNameEl.textContent = "BBL Team";
    showStatus({
      error: "Missing team in URL",
      fix: "Use: bbl-team.html?team=Melbourne%20Stars"
    });
    return;
  }

  teamNameEl.textContent = teamParam;

  let files;
  try{
    const r = await fetch(indexUrl);
    files = await r.json();
  }catch(e){
    showStatus({ error: "Failed to load index.json", indexUrl, details: String(e) });
    return;
  }

  // Load all calendar-year files
  const yearData = [];
  for(const f of files){
    try{
      const r = await fetch(basePath + f);
      const data = await r.json();
      yearData.push({ file: f, data });
    }catch(e){
      // Don’t hard-fail—show in status
      yearData.push({ file: f, data: null, error: String(e) });
    }
  }

  // Flatten matches; support either: [matches...] OR {matches:[...]} OR {games:[...]}
  allMatches = [];
  const loadIssues = [];

  for(const y of yearData){
    if(!y.data){
      loadIssues.push({ file: y.file, error: y.error || "Unknown error" });
      continue;
    }

    let arr = null;
    if(Array.isArray(y.data)) arr = y.data;
    else if(Array.isArray(y.data.matches)) arr = y.data.matches;
    else if(Array.isArray(y.data.games)) arr = y.data.games;

    if(!arr){
      loadIssues.push({ file: y.file, error: "Unrecognized JSON shape (not array / matches[] / games[])" });
      continue;
    }

    // Ensure each match has a .file (some datasets don’t)
    arr.forEach(m=>{
      if(!m.file) m.file = y.file; // fallback, so links at least exist
      allMatches.push(m);
    });
  }

  const teamMatches = allMatches.filter(teamMatchCheck);

  // Collect a few samples to diagnose date/teams shape
  const sample = teamMatches.slice(0, 5).map(m=>({
    teams: m?.info?.teams,
    dates: m?.info?.dates,
    dateFallback: m?.info?.date,
    parsedDate: (parseMatchDate(m) ? parseMatchDate(m).toISOString().slice(0,10) : null)
  }));

  showStatus({
    teamParam,
    indexFilesCount: Array.isArray(files) ? files.length : null,
    loadedCalendarFiles: yearData.length,
    loadIssuesCount: loadIssues.length,
    loadIssues: loadIssues.slice(0, 8),
    allMatchesLoaded: allMatches.length,
    teamMatchesFound: teamMatches.length,
    sampleTeamMatches: sample
  });

  // If zero team matches, stop here (so you can adjust teamParam / data)
  if(teamMatches.length === 0){
    yearGrid.innerHTML = "";
    tableBody.innerHTML = "";
    return;
  }

  // Build seasons based on team matches only (faster + accurate)
  const datedTeamMatches = teamMatches
    .map(m=>({ m, d: parseMatchDate(m) }))
    .filter(x=>x.d);

  if(datedTeamMatches.length === 0){
    yearGrid.innerHTML = "";
    tableBody.innerHTML = "";
    showStatus({
      teamParam,
      error: "Team matches exist, but none of their dates parsed into real dates.",
      hint: "Look at sampleTeamMatches.dates in the status panel and we’ll add a parser for that exact format."
    });
    return;
  }

  const years = datedTeamMatches.map(x=>x.d.getFullYear());
  const minYear = Math.min(...years);
  const maxYear = Math.max(...years);

  seasons = [];
  for(let y=minYear; y<=maxYear; y++){
    const start = new Date(y, 10, 1);      // Nov 1 (month is 0-based: 10=Nov)
    const end   = new Date(y+1, 2, 31, 23, 59, 59); // Mar 31

    const seasonMatches = datedTeamMatches
      .filter(x=>x.d >= start && x.d <= end)
      .map(x=>x.m);

    if(seasonMatches.length){
      seasons.push({ label: seasonLabel(y), start, end, matches: seasonMatches });
    }
  }

  buildSeasonButtons(teamMatches);

  // Default: latest season if available
  if(seasons.length){
    showSeason(seasons[seasons.length - 1]);
  }else{
    // If no seasons built, show all team matches (still better than blank)
    renderTable(teamMatches);
  }
}

function buildSeasonButtons(teamMatches){
  yearGrid.innerHTML = "";

  seasons.forEach((season,i)=>{
    const btn = document.createElement("button");
    btn.className = "year-btn";
    btn.textContent = season.label;
    btn.onclick = ()=>{
      document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      showSeason(season);
    };
    yearGrid.appendChild(btn);
    if(i === seasons.length - 1) btn.classList.add("active");
  });

  const allBtn = document.createElement("button");
  allBtn.className = "year-btn";
  allBtn.textContent = "ALL";
  allBtn.onclick = ()=>{
    document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
    allBtn.classList.add("active");
    renderTable(teamMatches);
  };
  yearGrid.appendChild(allBtn);
}

function showSeason(season){
  renderTable(season.matches);
}

function renderTable(matches){
  tableBody.innerHTML = "";

  const rows = matches
    .map(m=>({ m, d: parseMatchDate(m) }))
    .sort((a,b)=>{
      const at = a.d ? a.d.getTime() : 0;
      const bt = b.d ? b.d.getTime() : 0;
      return at - bt;
    });

  rows.forEach(({m, d})=>{
    const dateStr = d ? formatDate(d) : (getMatchDateStr(m) || "—");
    const teams = Array.isArray(m?.info?.teams) ? m.info.teams.join(" vs ") : (m?.info?.teams || "—");
    const venue = m?.info?.venue || "—";

    let result="—";
    if(m?.info?.outcome?.winner){
      if(m.info.outcome.by?.runs){
        result = m.info.outcome.winner + " won by " + m.info.outcome.by.runs + " runs";
      } else if(m.info.outcome.by?.wickets){
        result = m.info.outcome.winner + " won by " + m.info.outcome.by.wickets + " wickets";
      } else {
        result = m.info.outcome.winner + " won";
      }
    }

    const file = m.file ? m.file : "";
    const link = file
      ? `<a href="bbl-match.html?file=${encodeURIComponent(file)}">${teams}</a>`
      : teams;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${dateStr}</td>
      <td>${link}</td>
      <td>${venue}</td>
      <td>${result}</td>
    `;
    tableBody.appendChild(tr);
  });
}

function formatDate(dt){
  return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

// run
main();
</script>

</body>
</html>
