<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>AFL Squad Records | The Sporting Almanac</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:14px 0;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:17px;
}

.page{
max-width:1300px;
margin:0 auto;
padding:25px;
}

h1{
margin:0 0 18px 0;
font-size:34px;
}

.controls{
display:flex;
gap:20px;
margin-bottom:22px;
flex-wrap:wrap;
align-items:center;
}

select{
padding:10px 14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
background:white;
}

table{
border-collapse:collapse;
width:100%;
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,.06);
}

th,td{
border:1px solid #ddd;
padding:9px;
text-align:center;
}

th{
background:#eef3fb;
font-weight:600;
}

td.left{
text-align:left;
font-weight:600;
}

tbody tr:nth-child(even){
background:#f2f7ff;
}

</style>

</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/afl.html">AFL</a>
</div>

<div class="page">

<h1>AFL Squad Records</h1>

<div class="controls">

<label>
Team:
<select id="teamSelect"></select>
</label>

<label>
Opponent:
<select id="opponentSelect">
<option value="all">All Opponents</option>
</select>
</label>

</div>

<table>

<thead>

<tr>

<th rowspan="2">Player</th>

<th colspan="3">Career Best Disposals</th>
<th colspan="3">Career Best Goals</th>

<th colspan="3">Vs Opponent Disposals</th>
<th colspan="3">Vs Opponent Goals</th>

</tr>

<tr>

<th>D</th><th>Rnd</th><th>Yr</th>
<th>G</th><th>Rnd</th><th>Yr</th>

<th>D</th><th>Rnd</th><th>Yr</th>
<th>G</th><th>Rnd</th><th>Yr</th>

</tr>

</thead>

<tbody id="rows"></tbody>

</table>

</div>

<script>

let allGames=[]
let playerIndex={}
let roster=[]
let csvData=[]

const years=[]
for(let y=1990;y<=new Date().getFullYear();y++) years.push(y)

Promise.all(
years.map(y=>fetch(`/data/afl/afl_${y}.json`)
.then(r=>r.json())
.catch(()=>[]))
).then(data=>{

allGames=data.flat()

/* build fast player index */
allGames.forEach(g=>{
if(!playerIndex[g.player]) playerIndex[g.player]=[]
playerIndex[g.player].push(g)
})

loadRoster()

})

async function loadRoster(){

const res=await fetch("/docs/data/afl/afl-team-lists.csv")
const text=await res.text()

const rows=text.trim().split("\n")
rows.shift()

csvData=rows.map(r=>{
const v=r.split(",")
return {player:v[0],team:v[1]}
})

buildTeams()
buildOpponents()

}

function buildTeams(){

const teams=[...new Set(csvData.map(r=>r.team))].sort()

teams.forEach(t=>{
const opt=document.createElement("option")
opt.value=t
opt.textContent=t
teamSelect.appendChild(opt)
})

teamSelect.onchange=loadTeam

loadTeam()

}

function buildOpponents(){

const opp=[...new Set(allGames.map(g=>g.played_against))].sort()

opp.forEach(o=>{
const opt=document.createElement("option")
opt.value=o
opt.textContent=o
opponentSelect.appendChild(opt)
})

opponentSelect.onchange=renderTable

}

function loadTeam(){

const team=teamSelect.value

roster=csvData
.filter(r=>r.team===team)
.map(r=>r.player)

renderTable()

}

function bestGame(games,stat){

let best=null
let max=0

games.forEach(g=>{
if(g[stat]>max){
max=g[stat]
best=g
}
})

if(!best) return ["","",""]

return [max,best.round,best.season]

}

function renderTable(){

rows.innerHTML=""

const opp=opponentSelect.value

roster.forEach(player=>{

const playerGames=playerIndex[player]||[]

if(!playerGames.length) return

const bestD=bestGame(playerGames,"D")
const bestG=bestGame(playerGames,"G")

let vsGames=playerGames

if(opp!=="all")
vsGames=playerGames.filter(g=>g.played_against===opp)

const oppD=bestGame(vsGames,"D")
const oppG=bestGame(vsGames,"G")

const tr=document.createElement("tr")

tr.innerHTML=`

<td class="left">${player}</td>

<td>${bestD[0]}</td>
<td>${bestD[1]}</td>
<td>${bestD[2]}</td>

<td>${bestG[0]}</td>
<td>${bestG[1]}</td>
<td>${bestG[2]}</td>

<td>${oppD[0]}</td>
<td>${oppD[1]}</td>
<td>${oppD[2]}</td>

<td>${oppG[0]}</td>
<td>${oppG[1]}</td>
<td>${oppG[2]}</td>

`

rows.appendChild(tr)

})

}

</script>

</body>
</html>
