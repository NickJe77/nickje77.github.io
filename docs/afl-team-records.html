<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Squad Records | The Sporting Almanac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --board-line:rgba(255,255,255,.10);
  --accent:#e0b94a;
  --accent-soft:rgba(224,185,74,.18);
  --gold:#c89000;
  --silver:#8a94a0;
  --bronze:#a0522d;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

.page{max-width:1400px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:22px 26px 26px;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:8px;
}
h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

/* ── Tabs ─────────────────────────────────────────────── */
.tabs.segment{
  display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px;gap:2px;margin-bottom:22px;
}
.tab-btn{
  border:none;background:transparent;font-family:var(--body);font-size:13px;font-weight:600;
  color:var(--muted);padding:9px 20px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{background:var(--ink);color:#fff;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

/* ── Controls ─────────────────────────────────────────── */
.controls,.records-controls{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.controls label,.records-controls label{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}
button{
  padding:10px 18px;border:none;border-radius:999px;background:var(--ink);color:#fff;
  font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;
}
button:hover{opacity:.85;}

/* ── Table ────────────────────────────────────────────── */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{border-bottom:1px solid var(--line);padding:10px 9px;text-align:center;white-space:nowrap;}
th{
  background:#f7f9fb;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
}
td.left{text-align:left;font-weight:700;color:var(--ink);}
td{color:#27313c;font-variant-numeric:tabular-nums;}
tbody tr:hover td{background:#f0f6ff;}
.smallnote{font-size:12.5px;color:var(--muted);margin-top:12px;}

/* ── Records grid ─────────────────────────────────────── */
.records-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:900px){.records-grid{grid-template-columns:1fr;}}
.record-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.record-card h3{
  margin:0;padding:14px 18px;font-family:var(--display);font-weight:600;font-size:14px;
  letter-spacing:.04em;text-transform:uppercase;background:#f7f9fb;border-bottom:1px solid var(--line);
  color:var(--muted);
}
.record-card table{border-radius:0;}
.record-card th{font-size:11px;padding:8px 10px;}
.record-card td{font-size:13.5px;padding:8px 10px;}
.rank{font-weight:700;color:var(--faint);width:28px;}
.gold{color:var(--gold);font-weight:700;}
.silver{color:var(--silver);font-weight:700;}
.bronze{color:var(--bronze);font-weight:700;}
.loading-msg{color:var(--muted);font-style:italic;font-size:13px;padding:8px 0;}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/index.html">Home</a>
  <a href="/afl.html" class="current">AFL</a>
</nav>
<div class="page">

<div class="hero">
  <div class="eyebrow">AFL</div>
  <h1>Squad Records</h1>
</div>

<div class="tabs segment">
  <button class="tab-btn active" onclick="switchTab('squad',this)">Squad</button>
  <button class="tab-btn" onclick="switchTab('records',this)">Records</button>
</div>

<!-- SQUAD TAB -->
<div id="tab-squad" class="tab-pane active">
  <div class="controls">
    <label>Team <select id="teamSelect"></select></label>
    <label>Opponent <select id="opponentSelect"><option value="all">All Opponents</option></select></label>
    <button onclick="exportExcel()">Export Excel</button>
    <button onclick="exportPDF()">Export PDF</button>
  </div>
  <div class="table-wrap">
  <table id="recordsTable">
    <thead>
      <tr>
        <th rowspan="2">Player</th>
        <th colspan="8">Career Best</th>
        <th colspan="6">Vs Opponent</th>
      </tr>
      <tr>
        <th>D</th><th>Opp</th><th>Rnd</th><th>Yr</th>
        <th>G</th><th>Opp</th><th>Rnd</th><th>Yr</th>
        <th>D</th><th>Rnd</th><th>Yr</th>
        <th>G</th><th>Rnd</th><th>Yr</th>
      </tr>
    </thead>
    <tbody id="squadRows"></tbody>
  </table>
  </div>
  <div class="smallnote">If a career-best occurs multiple times it shows like <b>32 (x2)</b> and Opp/Rnd/Yr are left blank.</div>
</div>

<!-- RECORDS TAB -->
<div id="tab-records" class="tab-pane">
  <div class="records-controls">
    <label>Team <select id="recTeamSelect"></select></label>
    <span id="recLoadingMsg" class="loading-msg"></span>
  </div>
  <div class="records-grid" id="recordsGrid"></div>
</div>

</div>

<script>
let allGames=[], playerIndex={}, squadRoster=[], csvData=[];
const teamSelect    = document.getElementById("teamSelect");
const opponentSelect= document.getElementById("opponentSelect");
const recTeamSelect = document.getElementById("recTeamSelect");
const squadRows     = document.getElementById("squadRows");
const recLoadingMsg = document.getElementById("recLoadingMsg");
let dataLoaded = false;

function switchTab(name, btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='records' && dataLoaded) renderRecords();
}

function cleanRound(r){
  return String(r||"").replace(/round\s*/i,"").trim();
}

// ── Data normalization ──────────────────────────────────────
// Same fixes already proven on afl-player.html, applied here too. This
// page was loading raw afl_YYYY.json data directly with none of this,
// which is why game tallies were coming out wrong: finals rounds that
// appear under two labels ("Round EF" and "Elimination Final") were
// being counted as two separate games, and a handful of players whose
// name is truncated inconsistently in the source data ("Cooper D-Tytler"
// vs "Cooper Duff-Tytler") were being split into two different people.
function normalizeDashes(str){
  return str ? str.replace(/[\u2013\u2014]/g, '-') : str;
}
const TEAM_NAME_CANONICAL = {
  'footscray': 'Western Bulldogs',
  'south melbourne': 'Sydney',
  'brisbane bears': 'Brisbane',
  'kangaroos': 'North Melbourne',
};
function normalizeTeam(t){
  if(!t) return t;
  const dashed = normalizeDashes(t).trim();
  return TEAM_NAME_CANONICAL[dashed.toLowerCase()] || dashed;
}
function normalizeName(str){
  if(!str) return str;
  str = normalizeDashes(str);
  str = str.replace(/\u2019/g, "'");
  str = str.replace(/\bO([A-Z][a-z])/g, "O'$1");
  return str;
}
const ROUND_NAME_CANONICAL = {
  'ef': 'Elimination Final', 'round ef': 'Elimination Final', 'elimination final': 'Elimination Final',
  'sf': 'Semi Final',        'round sf': 'Semi Final',        'semi final': 'Semi Final',
  'qf': 'Qualifying Final',  'round qf': 'Qualifying Final',  'qualifying final': 'Qualifying Final',
  'pf': 'Preliminary Final', 'round pf': 'Preliminary Final', 'preliminary final': 'Preliminary Final',
  'gf': 'Grand Final',       'round gf': 'Grand Final',       'grand final': 'Grand Final',
};
function normalizeRoundName(r){
  if(!r) return r;
  const key = r.trim().toLowerCase();
  return ROUND_NAME_CANONICAL[key] || r.trim();
}
const PLAYER_NAME_ALIASES = {
  "Luke D-Uniacke": "Luke Davies-Uniacke",
  "Cooper D-Tytler": "Cooper Duff-Tytler",
  "Bailey Williams": "Bailey J. Williams",
};
function normalizeGame(g){
  if(g.player)         g.player         = normalizeName(g.player);
  if(g.played_for)     g.played_for     = normalizeTeam(g.played_for);
  if(g.played_against) g.played_against = normalizeTeam(g.played_against);
  if(g.home_team)      g.home_team      = normalizeTeam(g.home_team);
  if(g.away_team)      g.away_team      = normalizeTeam(g.away_team);
  if(g.round)           g.round          = normalizeRoundName(g.round);
  if(g.player === 'Gary Ablett' && g.season >= 2000) g.player = 'Gary Ablett Jnr';
  if(g.player && PLAYER_NAME_ALIASES[g.player]) g.player = PLAYER_NAME_ALIASES[g.player];
  return g;
}
function dedupeAllGames(games){
  const seen = new Set();
  const out = [];
  games.forEach(g=>{
    const key = g.player+'__'+g.season+'__'+g.round+'__'+g.played_for+'__'+g.played_against;
    if(seen.has(key)) return;
    seen.add(key);
    out.push(g);
  });
  return out;
}

const years=[];
for(let y=1965;y<=new Date().getFullYear();y++) years.push(y);

recLoadingMsg.textContent="Loading data...";

Promise.all(
  years.map(y=>fetch('/data/afl/afl_'+y+'.json').then(r=>r.json()).catch(()=>[]))
).then(data=>{
  allGames=dedupeAllGames(data.flat().map(normalizeGame));
  playerIndex={};
  allGames.forEach(g=>{
    if(!playerIndex[g.player]) playerIndex[g.player]=[];
    playerIndex[g.player].push(g);
  });
  dataLoaded=true;
  recLoadingMsg.textContent="";
  loadRoster();
});

async function loadRoster(){
  const res  = await fetch("/data/afl/afl-team-lists.csv");
  const text = await res.text();
  csvData=[];
  text.trim().split(/\r?\n/).forEach(line=>{
    const parts=line.split(",");
    if(parts.length<2) return;
    const player=parts[0].replace(/"/g,"").trim();
    const team  =parts[1].replace(/"/g,"").trim();
    if(player.toLowerCase()==="player") return;
    if(player&&team) csvData.push({player,team});
  });
  buildSquadTeams();
  buildOpponents();
  buildRecTeams();
}

// ── SQUAD TAB ──────────────────────────────────────────────────────────────

function buildSquadTeams(){
  teamSelect.innerHTML="";
  [...new Set(csvData.map(r=>r.team))].sort().forEach(t=>{
    const o=document.createElement("option");
    o.value=t; o.textContent=t;
    teamSelect.appendChild(o);
  });
  teamSelect.onchange=loadSquadTeam;
  loadSquadTeam();
}

function buildOpponents(){
  const keepAll=opponentSelect.querySelector('option[value="all"]');
  opponentSelect.innerHTML="";
  opponentSelect.appendChild(keepAll);
  [...new Set(allGames.map(g=>g.played_against).filter(Boolean))].sort().forEach(o=>{
    const opt=document.createElement("option");
    opt.value=o; opt.textContent=o;
    opponentSelect.appendChild(opt);
  });
  opponentSelect.onchange=renderSquadTable;
}

function loadSquadTeam(){
  squadRoster=csvData.filter(r=>r.team===teamSelect.value).map(r=>r.player);
  renderSquadTable();
}

function bestWithOpp(games,stat){
  let max=0,best=[];
  games.forEach(g=>{ const v=Number(g[stat]||0); if(v>max){max=v;best=[g];}else if(v===max&&v) best.push(g); });
  if(!max) return ["0","","",""];
  if(best.length>1) return [max+' (x'+best.length+')',"","",""];
  return [String(max),best[0].played_against||"",cleanRound(best[0].round),best[0].season||""];
}

function bestSimple(games,stat){
  let max=0,best=[];
  games.forEach(g=>{ const v=Number(g[stat]||0); if(v>max){max=v;best=[g];}else if(v===max&&v) best.push(g); });
  if(!max) return ["0","",""];
  if(best.length>1) return [max+' (x'+best.length+')',"",""];
  return [String(max),cleanRound(best[0].round),best[0].season||""];
}

function renderSquadTable(){
  squadRows.innerHTML="";
  const opp=opponentSelect.value;
  squadRoster.forEach(player=>{
    const pg=playerIndex[player]||[];
    const bD=bestWithOpp(pg,"D");
    const bG=bestWithOpp(pg,"G");
    const vg=opp==="all"?pg:pg.filter(g=>g.played_against===opp);
    const oD=bestSimple(vg,"D");
    const oG=bestSimple(vg,"G");
    const tr=document.createElement("tr");
    tr.innerHTML='<td class="left">'+player+'</td>'+
      '<td>'+bD[0]+'</td><td>'+bD[1]+'</td><td>'+bD[2]+'</td><td>'+bD[3]+'</td>'+
      '<td>'+bG[0]+'</td><td>'+bG[1]+'</td><td>'+bG[2]+'</td><td>'+bG[3]+'</td>'+
      '<td>'+oD[0]+'</td><td>'+oD[1]+'</td><td>'+oD[2]+'</td>'+
      '<td>'+oG[0]+'</td><td>'+oG[1]+'</td><td>'+oG[2]+'</td>';
    squadRows.appendChild(tr);
  });
}

// ── RECORDS TAB ──────────────────────────────────────────────────────────────

const TEAM_ALIASES={
  "North Melbourne":["North Melbourne","Kangaroos","North Melb"],
  "Kangaroos":["North Melbourne","Kangaroos","North Melb"],
  "Brisbane":["Brisbane","Brisbane Lions","Brisbane Bears"],
  "Brisbane Lions":["Brisbane","Brisbane Lions","Brisbane Bears"],
  "Brisbane Bears":["Brisbane","Brisbane Lions","Brisbane Bears"],
  "GWS":["GWS","Greater Western Sydney"],
  "Greater Western Sydney":["GWS","Greater Western Sydney"],
  "Footscray":["Footscray","Western Bulldogs"],
  "Western Bulldogs":["Footscray","Western Bulldogs"],
  "South Melbourne":["South Melbourne","Sydney","Sydney Swans"],
  "Sydney":["South Melbourne","Sydney","Sydney Swans"],
  "Sydney Swans":["South Melbourne","Sydney","Sydney Swans"],
};

function buildRecTeams(){
  recTeamSelect.innerHTML="";
  [...new Set(csvData.map(r=>r.team))].sort().forEach(t=>{
    const o=document.createElement("option");
    o.value=t; o.textContent=t;
    recTeamSelect.appendChild(o);
  });
  recTeamSelect.onchange=renderRecords;
}

function getTeamGames(team){
  const names=new Set(TEAM_ALIASES[team]||[team]);
  const games=[];
  allGames.forEach(g=>{ if(names.has(g.played_for)&&g.player) games.push({...g,_player:g.player}); });
  return games;
}

function gameWon(g){
  const myPts = g.played_for===g.home_team ? +(g.home_points||0) : +(g.away_points||0);
  const theirPts = g.played_for===g.home_team ? +(g.away_points||0) : +(g.home_points||0);
  return myPts > theirPts;
}

function topNTotal(games,stat,n){
  const totals={};
  games.forEach(g=>{ totals[g._player]=(totals[g._player]||0)+Number(g[stat]||0); });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,n)
    .map(([p,v],i)=>({rank:i+1,player:p,value:v}));
}

function topNGames(games,n){
  const counts={};
  games.forEach(g=>{ counts[g._player]=(counts[g._player]||0)+1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n)
    .map(([p,v],i)=>({rank:i+1,player:p,value:v}));
}

function topNTeammates(games,n){
  const gameMap={};
  games.forEach(g=>{
    const k=[g.season,g.round,g.home_team,g.away_team].join('|');
    if(!gameMap[k]) gameMap[k]={players:new Set(),won:gameWon(g)};
    gameMap[k].players.add(g._player);
  });
  const pairStats={};
  Object.values(gameMap).forEach(({players,won})=>{
    const arr=[...players].sort();
    for(let i=0;i<arr.length;i++){
      for(let j=i+1;j<arr.length;j++){
        const key=arr[i]+'|||'+arr[j];
        if(!pairStats[key]) pairStats[key]={games:0,wins:0};
        pairStats[key].games++;
        if(won) pairStats[key].wins++;
      }
    }
  });
  return Object.entries(pairStats).sort((a,b)=>b[1].games-a[1].games).slice(0,n)
    .map(([key,{games,wins}],i)=>{
      const [p1,p2]=key.split('|||');
      return {rank:i+1,player:p1+' & '+p2,games,wins,winPct:games?(wins/games*100).toFixed(1):'0.0'};
    });
}

function rankClass(r){ return r===1?'gold':r===2?'silver':r===3?'bronze':''; }

function makeCard(title,thead,tbody){
  return '<div class="record-card"><h3>'+title+'</h3><table><thead><tr>'+thead+'</tr></thead><tbody>'+tbody+'</tbody></table></div>';
}

function renderRecords(){
  if(!dataLoaded) return;
  const team=recTeamSelect.value;
  if(!team) return;
  const games=getTeamGames(team);
  if(!games.length){
    document.getElementById('recordsGrid').innerHTML='<p style="color:#888">No games found.</p>';
    return;
  }

  function simpleRows(data){
    return data.map(r=>'<tr><td class="rank '+rankClass(r.rank)+'">'+r.rank+'</td><td class="left">'+r.player+'</td><td><b>'+r.value+'</b></td></tr>').join('');
  }

  const tmRows=topNTeammates(games,10).map(r=>
    '<tr><td class="rank '+rankClass(r.rank)+'">'+r.rank+'</td>'+
    '<td class="left" style="font-size:13px">'+r.player+'</td>'+
    '<td><b>'+r.games+'</b></td><td><b>'+r.wins+'</b></td><td><b>'+r.winPct+'%</b></td></tr>'
  ).join('');

  document.getElementById('recordsGrid').innerHTML=
    makeCard('🏆 Most Goals (Career Total)','<th>#</th><th style="text-align:left">Player</th><th>Total</th>',simpleRows(topNTotal(games,'G',10)))+
    makeCard('📊 Most Disposals (Career Total)','<th>#</th><th style="text-align:left">Player</th><th>Total</th>',simpleRows(topNTotal(games,'D',10)))+
    makeCard('👟 Most Kicks (Career Total)','<th>#</th><th style="text-align:left">Player</th><th>Total</th>',simpleRows(topNTotal(games,'K',10)))+
    makeCard('🤝 Most Handballs (Career Total)','<th>#</th><th style="text-align:left">Player</th><th>Total</th>',simpleRows(topNTotal(games,'HB',10)))+
    makeCard('🎮 Most Games Played','<th>#</th><th style="text-align:left">Player</th><th>Games</th>',simpleRows(topNGames(games,10)))+
    makeCard('👥 Most Games as Teammates','<th>#</th><th style="text-align:left">Players</th><th>Games</th><th>Wins</th><th>Win %</th>',tmRows);
}

function exportExcel(){
  const wb=XLSX.utils.table_to_book(document.getElementById("recordsTable"),{sheet:"AFL Records"});
  XLSX.writeFile(wb,"afl_squad_records.xlsx");
}
function exportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"landscape"});
  doc.text("AFL Squad Records",14,15);
  doc.autoTable({html:"#recordsTable",startY:20,theme:"grid",styles:{fontSize:7,cellPadding:2}});
  doc.save("afl_squad_records.pdf");
}
</script>
</body>
</html>
