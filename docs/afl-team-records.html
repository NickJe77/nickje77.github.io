<!DOCTYPE html>
<html>
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Squad Records | The Sporting Almanac</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
<style>
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:22px;padding:14px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:17px;}
.navbar a:hover{text-decoration:underline;}
.page{max-width:1400px;margin:0 auto;padding:25px;}
h1{margin:0 0 18px 0;font-size:34px;}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid #dde3ec;}
.tab-btn{padding:11px 28px;border:none;background:none;font-size:16px;font-weight:600;color:#666;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s;}
.tab-btn.active{color:#0056d6;border-bottom-color:#0056d6;}
.tab-btn:hover:not(.active){color:#333;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

/* Controls */
.controls{display:flex;gap:20px;margin-bottom:22px;flex-wrap:wrap;align-items:center;}
select{padding:10px 14px;border-radius:10px;border:1px solid #ccc;font-size:16px;background:white;}
button{padding:10px 14px;border:none;border-radius:8px;background:#0056d6;color:white;font-weight:600;cursor:pointer;}
button:hover{background:#003f9a;}

/* Tables */
table{border-collapse:collapse;width:100%;background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.06);}
th,td{border:1px solid #ddd;padding:9px;text-align:center;}
th{background:#eef3fb;font-weight:600;}
td.left{text-align:left;font-weight:600;}
tbody tr:nth-child(even){background:#f2f7ff;}
tbody tr:hover{background:#e8f0ff;}
.smallnote{font-size:13px;color:#5c6f8c;margin-top:10px;}

/* Records tab */
.records-controls{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;align-items:center;}
.records-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:900px){.records-grid{grid-template-columns:1fr;}}
.record-card{background:white;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.07);overflow:hidden;}
.record-card h3{margin:0;padding:14px 18px;font-size:16px;font-weight:700;background:#eef3fb;border-bottom:1px solid #dde3ec;color:#1a2a4a;}
.record-card table{border-radius:0;box-shadow:none;}
.record-card th{font-size:13px;padding:7px 10px;}
.record-card td{font-size:14px;padding:7px 10px;}
.rank{font-weight:700;color:#888;width:32px;}
.gold{color:#c89000;font-weight:700;}
.silver{color:#7a8a9a;font-weight:700;}
.bronze{color:#a0522d;font-weight:700;}
.loading-msg{color:#888;font-style:italic;padding:20px 0;}
.records-full{margin-top:0;}
</style>
</head>
<body>
<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/afl.html">AFL</a>
</div>
<div class="page">
<h1>AFL Squad Records</h1>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('squad',this)">Squad</button>
  <button class="tab-btn" onclick="switchTab('records',this)">Records</button>
</div>

<!-- SQUAD TAB -->
<div id="tab-squad" class="tab-pane active">
  <div class="controls">
    <label>Team: <select id="teamSelect"></select></label>
    <label>Opponent: <select id="opponentSelect"><option value="all">All Opponents</option></select></label>
    <button onclick="exportExcel()">Export Excel</button>
    <button onclick="exportPDF()">Export PDF</button>
  </div>
  <table id="recordsTable">
    <thead>
      <tr>
        <th rowspan="2">Player</th>
        <th colspan="8">Career Best</th>
        <th colspan="6">Vs Opponent</th>
      </tr>
      <tr>
        <th>D</th><th>Opp</th><th>Rnd</th><th>Yr</th>
        <th>G</th><th>Opp</th><th>Rnd</th><th>Yr</th>
        <th>D</th><th>Rnd</th><th>Yr</th>
        <th>G</th><th>Rnd</th><th>Yr</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="smallnote">If a career-best occurs multiple times it shows like <b>32 (x2)</b> and Opp/Rnd/Yr are left blank.</div>
</div>

<!-- RECORDS TAB -->
<div id="tab-records" class="tab-pane">
  <div class="records-controls">
    <label>Team: <select id="recTeamSelect"></select></label>
    <span id="recLoadingMsg" class="loading-msg"></span>
  </div>
  <div class="records-grid" id="recordsGrid">
    <!-- filled by JS -->
  </div>
</div>

</div><!-- .page -->

<script>
let allGames=[], playerIndex={}, roster=[], csvData=[];
const teamSelect=document.getElementById("teamSelect");
const opponentSelect=document.getElementById("opponentSelect");
const recTeamSelect=document.getElementById("recTeamSelect");
const rows=document.getElementById("rows");
let dataLoaded=false;

function switchTab(name,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='records' && dataLoaded) renderRecords();
}

function tokenizeName(name){
  return String(name||"").toLowerCase().replace(/['']/g,"").replace(/\./g,"").replace(/-/g," ").replace(/\s+/g," ").trim().split(" ").filter(Boolean);
}
function cleanRound(r){
  return String(r||"").replace(/round/i,"").replace(/r/i,"").trim();
}
function gameDedupKey(g){
  return [g.season??"",g.round??"",g.played_against??"",g.player??"",g.D??"",g.G??""].join("|");
}

const years=[];
for(let y=1965;y<=new Date().getFullYear();y++) years.push(y);

const recLoadingMsg=document.getElementById("recLoadingMsg");
recLoadingMsg.textContent="Loading data...";

Promise.all(
  years.map(y=>fetch(`/data/afl/afl_${y}.json`).then(r=>r.json()).catch(()=>[]))
).then(data=>{
  allGames=data.flat();
  playerIndex={};
  allGames.forEach(g=>{
    const key=g.player;
    if(!playerIndex[key]) playerIndex[key]=[];
    playerIndex[key].push(g);
  });
  dataLoaded=true;
  recLoadingMsg.textContent="";
  loadRoster();
});

async function loadRoster(){
  const res=await fetch("/data/afl/afl-team-lists.csv");
  const text=await res.text();
  csvData=[];
  text.trim().split(/\r?\n/).forEach(line=>{
    const parts=line.split(",");
    if(parts.length<2) return;
    const player=parts[0].replace(/"/g,"").trim();
    const team=parts[1].replace(/"/g,"").trim();
    if(player.toLowerCase()==="player") return;
    if(player&&team) csvData.push({player,team});
  });
  buildTeams();
  buildOpponents();
  buildRecTeams();
}

function buildTeams(){
  teamSelect.innerHTML="";
  [...new Set(csvData.map(r=>r.team))].sort().forEach(t=>{
    const opt=document.createElement("option");
    opt.value=t; opt.textContent=t;
    teamSelect.appendChild(opt);
  });
  teamSelect.onchange=loadTeam;
  loadTeam();
}

function buildRecTeams(){
  recTeamSelect.innerHTML="";
  [...new Set(csvData.map(r=>r.team))].sort().forEach(t=>{
    const opt=document.createElement("option");
    opt.value=t; opt.textContent=t;
    recTeamSelect.appendChild(opt);
  });
  recTeamSelect.onchange=renderRecords;
}

function buildOpponents(){
  const keepAll=opponentSelect.querySelector('option[value="all"]');
  opponentSelect.innerHTML="";
  opponentSelect.appendChild(keepAll);
  [...new Set(allGames.map(g=>g.played_against).filter(Boolean))].sort().forEach(o=>{
    const opt=document.createElement("option");
    opt.value=o; opt.textContent=o;
    opponentSelect.appendChild(opt);
  });
  opponentSelect.onchange=renderTable;
}

function loadTeam(){
  roster=csvData.filter(r=>r.team===teamSelect.value).map(r=>r.player);
  renderTable();
}

function bestGameWithOpponent(games,stat){
  let max=0,bestGames=[];
  games.forEach(g=>{
    const val=Number(g[stat]||0);
    if(val>max){max=val;bestGames=[g];}
    else if(val===max&&val!==0) bestGames.push(g);
  });
  if(max===0) return ["0","","",""];
  if(bestGames.length>1) return [`${max} (x${bestGames.length})`,"","",""];
  const g=bestGames[0];
  return [String(max),g.played_against??"",cleanRound(g.round),g.season??""];
}

function bestGameSimple(games,stat){
  let max=0,bestGames=[];
  games.forEach(g=>{
    const val=Number(g[stat]||0);
    if(val>max){max=val;bestGames=[g];}
    else if(val===max&&val!==0) bestGames.push(g);
  });
  if(max===0) return ["0","",""];
  if(bestGames.length>1) return [`${max} (x${bestGames.length})`,"",""];
  const g=bestGames[0];
  return [String(max),cleanRound(g.round),g.season??""];
}

function gamesForRosterName(player){
  return playerIndex[player]||[];
}

function renderTable(){
  rows.innerHTML="";
  const opp=opponentSelect.value;
  roster.forEach(player=>{
    const playerGames=gamesForRosterName(player);
    const bestD=bestGameWithOpponent(playerGames,"D");
    const bestG=bestGameWithOpponent(playerGames,"G");
    const vsGames=opp==="all"?playerGames:playerGames.filter(g=>g.played_against===opp);
    const oppD=bestGameSimple(vsGames,"D");
    const oppG=bestGameSimple(vsGames,"G");
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td class="left">${player}</td>
      <td>${bestD[0]}</td><td>${bestD[1]}</td><td>${bestD[2]}</td><td>${bestD[3]}</td>
      <td>${bestG[0]}</td><td>${bestG[1]}</td><td>${bestG[2]}</td><td>${bestG[3]}</td>
      <td>${oppD[0]}</td><td>${oppD[1]}</td><td>${oppD[2]}</td>
      <td>${oppG[0]}</td><td>${oppG[1]}</td><td>${oppG[2]}</td>`;
    rows.appendChild(tr);
  });
}

// ── RECORDS TAB ─────────────────────────────────────────────────────────────

const TEAM_ALIASES={
  "North Melbourne":["North Melbourne","Kangaroos","North Melb"],
  "Kangaroos":["North Melbourne","Kangaroos","North Melb"],
  "Brisbane":["Brisbane","Brisbane Lions","Brisbane Bears"],
  "Brisbane Lions":["Brisbane","Brisbane Lions","Brisbane Bears"],
  "Brisbane Bears":["Brisbane","Brisbane Lions","Brisbane Bears"],
  "GWS":["GWS","Greater Western Sydney"],
  "Greater Western Sydney":["GWS","Greater Western Sydney"],
  "Footscray":["Footscray","Western Bulldogs"],
  "Western Bulldogs":["Footscray","Western Bulldogs"],
  "South Melbourne":["South Melbourne","Sydney","Sydney Swans"],
  "Sydney":["South Melbourne","Sydney","Sydney Swans"],
  "Sydney Swans":["South Melbourne","Sydney","Sydney Swans"],
};

function getTeamNames(team){
  return TEAM_ALIASES[team] || [team];
}

function getRosterGames(team){
  const teamNames=new Set(getTeamNames(team));
  const games=[];
  allGames.forEach(g=>{
    if(teamNames.has(g.played_for) && g.player){
      games.push({...g,_player:g.player});
    }
  });
  const players=[...new Set(games.map(g=>g._player))];
  return {players,games};
}

function topN(games,stat,n,labelFn){
  // Sum stat per player
  const totals={};
  const bests={};  // for single-game bests
  games.forEach(g=>{
    const p=g._player;
    const val=Number(g[stat]||0);
    totals[p]=(totals[p]||0)+val;
    if(!bests[p]||val>bests[p].val) bests[p]={val,g};
  });
  return Object.entries(totals)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,n)
    .map(([p,total],i)=>({rank:i+1,player:p,value:total}));
}

function topNSingleGame(games,stat,n){
  // Best single game
  const best={};
  games.forEach(g=>{
    const p=g._player;
    const val=Number(g[stat]||0);
    if(!best[p]||val>best[p].val) best[p]={val,g};
  });
  return Object.entries(best)
    .sort((a,b)=>b[1].val-a[1].val)
    .slice(0,n)
    .map(([p,{val,g}],i)=>({rank:i+1,player:p,value:val,opp:g.played_against,season:g.season,round:cleanRound(g.round)}));
}

function topNGames(games,n){
  // Most games played (count of rows per player)
  const counts={};
  games.forEach(g=>{ counts[g._player]=(counts[g._player]||0)+1; });
  return Object.entries(counts)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,n)
    .map(([p,count],i)=>({rank:i+1,player:p,value:count}));
}

function topNTeammates(games,n){
  // Most games as teammates: for each unique game, record which players played
  // Then count pairs
  const gameMap={};
  games.forEach(g=>{
    const k=[g.season,g.round,g.home_team,g.away_team].join('|');
    if(!gameMap[k]) gameMap[k]=new Set();
    gameMap[k].add(g._player);
  });
  const pairCounts={};
  Object.values(gameMap).forEach(playerSet=>{
    const arr=[...playerSet].sort();
    for(let i=0;i<arr.length;i++){
      for(let j=i+1;j<arr.length;j++){
        const key=arr[i]+'|||'+arr[j];
        pairCounts[key]=(pairCounts[key]||0)+1;
      }
    }
  });
  return Object.entries(pairCounts)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,n)
    .map(([key,count],i)=>{
      const [p1,p2]=key.split('|||');
      return {rank:i+1,player:p1+' & '+p2,value:count};
    });
}

function rankClass(r){
  if(r===1) return 'gold';
  if(r===2) return 'silver';
  if(r===3) return 'bronze';
  return '';
}

function makeCard(title,rows){
  return `<div class="record-card">
    <h3>${title}</h3>
    <table>
      <thead><tr><th>#</th><th style="text-align:left">Player</th><th>Total</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function makeCardWithDetail(title,rows){
  return `<div class="record-card">
    <h3>${title}</h3>
    <table>
      <thead><tr><th>#</th><th style="text-align:left">Player</th><th>Best</th><th>vs</th><th>Rnd</th><th>Yr</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderRecords(){
  if(!dataLoaded) return;
  const team=recTeamSelect.value;
  if(!team) return;
  const {players,games}=getRosterGames(team);
  if(!games.length){
    document.getElementById('recordsGrid').innerHTML='<p style="color:#888">No games found for this team.</p>';
    return;
  }

  // Most Goals - total career goals for this team
  const goalsRows=topN(games,'G',10).map(r=>`<tr>
    <td class="rank ${rankClass(r.rank)}">${r.rank}</td>
    <td class="left">${r.player}</td>
    <td><b>${r.value}</b></td></tr>`).join('');

  // Most Disposals - total career disposals for this team  
  const dispRows=topN(games,'D',10).map(r=>`<tr>
    <td class="rank ${rankClass(r.rank)}">${r.rank}</td>
    <td class="left">${r.player}</td>
    <td><b>${r.value}</b></td></tr>`).join('');

  // Most Kicks - total
  const kickRows=topN(games,'K',10).map(r=>`<tr>
    <td class="rank ${rankClass(r.rank)}">${r.rank}</td>
    <td class="left">${r.player}</td>
    <td><b>${r.value}</b></td></tr>`).join('');

  // Most Handballs - total
  const hbRows=topN(games,'HB',10).map(r=>`<tr>
    <td class="rank ${rankClass(r.rank)}">${r.rank}</td>
    <td class="left">${r.player}</td>
    <td><b>${r.value}</b></td></tr>`).join('');

  // Most games played
  const gamesRows=topNGames(games,10).map(r=>`<tr>
    <td class="rank ${rankClass(r.rank)}">${r.rank}</td>
    <td class="left">${r.player}</td>
    <td><b>${r.value}</b></td></tr>`).join('');

  // Most games as teammates
  const tmRows=topNTeammates(games,10).map(r=>`<tr>
    <td class="rank ${rankClass(r.rank)}">${r.rank}</td>
    <td class="left" style="font-size:13px">${r.player}</td>
    <td><b>${r.value}</b></td></tr>`).join('');

  document.getElementById('recordsGrid').innerHTML=
    makeCard('🏆 Most Goals (Career Total)',goalsRows)+
    makeCard('📊 Most Disposals (Career Total)',dispRows)+
    makeCard('👟 Most Kicks (Career Total)',kickRows)+
    makeCard('🤝 Most Handballs (Career Total)',hbRows)+
    makeCard('🎮 Most Games Played',gamesRows)+
    makeCard('👥 Most Games as Teammates',tmRows);
}

function exportExcel(){
  const wb=XLSX.utils.table_to_book(document.getElementById("recordsTable"),{sheet:"AFL Records"});
  XLSX.writeFile(wb,"afl_squad_records.xlsx");
}
function exportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"landscape"});
  doc.text("AFL Squad Records",14,15);
  doc.autoTable({html:"#recordsTable",startY:20,theme:"grid",styles:{fontSize:7,cellPadding:2}});
  doc.save("afl_squad_records.pdf");
}
</script>
</body>
</html>
