<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Australian Group 1 Results | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="racing.css">
<link rel="stylesheet" href="archive.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{ font-size:15px; font-family:var(--body); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }

/* ── Global nav (fetched separately; style defensively to match) ── */
#global-nav nav{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;}
#global-nav nav a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
#global-nav nav a:hover{opacity:1;}

/* ── Hero (overrides archive.css's .page-hero/.hero-text) ───────── */
.page-hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:0;overflow:hidden;color:#fff;min-height:180px;
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.page-hero img{display:none;}
.hero-text{
  position:static;padding:44px 20px;font-family:var(--display);font-weight:600;
  font-size:clamp(22px,4vw,36px);letter-spacing:.02em;text-transform:uppercase;color:#fff;
}

/* ── Filters ──────────────────────────────────────────── */
.filters-wrapper{max-width:1300px;margin:22px auto;padding:0 20px;}
.filters-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.jockey-row{grid-column:1/-1;display:flex;justify-content:center;gap:10px;margin-top:8px;}
.jockey-row input{width:100%;max-width:260px;font-size:14px;}

.filters-row select,
.filters-row input{
  font-family:var(--body);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;
}
.filters-row select:hover,
.filters-row input:hover{border-color:var(--faint);}
.filters-row select:focus,
.filters-row input:focus{outline:none;border-color:var(--accent);}

#resultCount{
  text-align:center;font-weight:600;margin-top:14px;font-size:13px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;
}

/* ── Table ────────────────────────────────────────────── */
.table-container{
  max-width:1300px;margin:20px auto 70px;padding:0 20px;overflow-x:auto;
}
.results-table{
  width:100%;border-collapse:collapse;min-width:1100px;font-size:13.5px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
}
.results-table th,
.results-table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
.results-table th{
  background:#f7f9fb;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
}
.results-table td{color:#27313c;font-variant-numeric:tabular-nums;}
.results-table tbody tr:hover td{background:#f0f6ff;}
.results-table td.finish-1{font-weight:700;color:var(--accent);}

/* MOBILE */
@media (max-width: 768px) {
  body{ font-size:14px; }

  .filters-row{ grid-template-columns:1fr 1fr; }
  .jockey-row{ grid-column:1/-1; flex-direction:column; align-items:center; }

  .jockey-row input{ max-width:100%; font-size:14px; }

  .filters-row select,
  .filters-row input{ font-size:14px; }

  .results-table{ font-size:13px; }

  .results-table th,
  .results-table td{ padding:10px; }

  #resultCount{ font-size:12.5px; }
}
</style>
</head>

<body class="archive-page">

<!-- NAV BAR -->
<div id="global-nav"></div>

<div class="page-hero">
  <div class="hero-text">AUSTRALIAN GROUP 1 RESULTS 1997 - CURRENT DAY</div>
</div>

<div style="text-align:center;margin-top:18px;">
  <a href="australia-g1s-horse.html" style="display:inline-block;padding:10px 22px;border-radius:999px;background:#0c130f;color:#fff;text-decoration:none;font-family:var(--body);font-weight:600;font-size:13.5px;">Search by Horse →</a>
</div>

<div class="filters-wrapper">
  <div class="filters-row">
    <select id="yearFilter" onchange="applyFilters()">
      <option value="">Year</option>
    </select>

    <select id="venueFilter" onchange="applyFilters()">
      <option value="">Venue</option>
    </select>

    <input list="raceList" id="raceSearch" placeholder="Race" oninput="applyFilters()">
    <datalist id="raceList"></datalist>

    <input list="horseList" id="horseSearch" placeholder="Horse" oninput="applyFilters()">
    <datalist id="horseList"></datalist>

    <input list="trainerList" id="trainerSearch" placeholder="Trainer" oninput="applyFilters()">
    <datalist id="trainerList"></datalist>

    <!-- jockey on its own centred row -->
    <div class="jockey-row">
      <input list="jockeyList" id="jockeySearch" placeholder="Jockey" oninput="applyFilters()">
      <datalist id="jockeyList"></datalist>

      <label style="display:flex;align-items:center;gap:6px;font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted);">
        <input type="checkbox" id="winnersOnly" onchange="applyFilters()" style="width:auto;padding:0;">
        Winners only
      </label>
    </div>
  </div>

  <div id="resultCount">Results: 0</div>
</div>

<div class="table-container">
  <table class="results-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Race</th>
        <th>Venue</th>
        <th>Fin</th>
        <th>Runners</th>
        <th>Horse</th>
        <th>Wgt</th>
        <th>Dist</th>
        <th>Marg</th>
        <th>SP</th>
        <th>Jockey</th>
        <th>Trainer</th>
        <th>Age</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>
</div>

<script>
const yearFilter = document.getElementById("yearFilter");
const venueFilter = document.getElementById("venueFilter");
const raceSearch = document.getElementById("raceSearch");
const horseSearch = document.getElementById("horseSearch");
const trainerSearch = document.getElementById("trainerSearch");
const jockeySearch = document.getElementById("jockeySearch");
const winnersOnly = document.getElementById("winnersOnly");

const raceList = document.getElementById("raceList");
const horseList = document.getElementById("horseList");
const trainerList = document.getElementById("trainerList");
const jockeyList = document.getElementById("jockeyList");

const tableBody = document.getElementById("results-body");
const resultCount = document.getElementById("resultCount");

let allData = [];

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const lines = text.trim().replace(/\r/g,"").split("\n");
  const headers = lines[0].split(",").map(h=>h.trim());

  return lines.slice(1).map(line=>{
    const values = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    let obj = {};
    headers.forEach((h,i)=>{
      obj[h] = (values[i]||"").replace(/^"|"$/g,"").trim();
    });
    return obj;
  });
}

fetch("/data/australia-g1s.csv")
  .then(res => res.text())
  .then(text => {
    allData = parseCSV(text);

    allData.forEach(r=>{
      if(r.DATE && r.DATE.includes("/")){
        r.Year = r.DATE.split("/")[2];
      } else {
        r.Year = "";
      }
    });

    populateFilters(allData);
    renderTable(allData);
  });

function populateFilters(data){
  const years = new Set();
  const venues = new Set();
  const races = new Set();
  const horses = new Set();
  const trainers = new Set();
  const jockeys = new Set();

  data.forEach(r=>{
    if(r.Year) years.add(r.Year);
    if(r.VENUE) venues.add(r.VENUE);
    if(r.RACE) races.add(r.RACE);
    if(r.HORSE) horses.add(r.HORSE);
    if(r.TRAINER) trainers.add(r.TRAINER);
    if(r.JOCKEY) jockeys.add(r.JOCKEY);
  });

  [...years].sort((a,b)=>b-a).forEach(y=>{
    yearFilter.appendChild(new Option(y,y));
  });

  [...venues].sort().forEach(v=>{
    venueFilter.appendChild(new Option(v,v));
  });

  [...races].sort().forEach(v=>{
    raceList.appendChild(new Option(v,v));
  });

  [...horses].sort().forEach(v=>{
    horseList.appendChild(new Option(v,v));
  });

  [...trainers].sort().forEach(v=>{
    trainerList.appendChild(new Option(v,v));
  });

  [...jockeys].sort().forEach(v=>{
    jockeyList.appendChild(new Option(v,v));
  });
}

function applyFilters(){
  const y = yearFilter.value;
  const v = venueFilter.value;
  const r = raceSearch.value.toLowerCase();
  const h = horseSearch.value.toLowerCase();
  const t = trainerSearch.value.toLowerCase();
  const j = jockeySearch.value.toLowerCase();
  const w = winnersOnly.checked;

  const filtered = allData.filter(row=>{
    return (
      (!y || row.Year === y) &&
      (!v || row.VENUE === v) &&
      (!r || (row.RACE||"").toLowerCase().includes(r)) &&
      (!h || (row.HORSE||"").toLowerCase().includes(h)) &&
      (!t || (row.TRAINER||"").toLowerCase().includes(t)) &&
      (!j || (row.JOCKEY||"").toLowerCase().includes(j)) &&
      (!w || row.FINISH === "1")
    );
  });

  renderTable(filtered);
}

function horseLink(name){
  if(!name) return "";
  return `<a href="australia-g1s-horse.html?horse=${encodeURIComponent(name)}" style="color:inherit;">${name}</a>`;
}

function renderTable(data){
  tableBody.innerHTML="";

  data.forEach(r=>{
    const tr=document.createElement("tr");
    const finishClass = r.FINISH === "1" ? ' class="finish-1"' : "";
    tr.innerHTML=`
      <td>${r.DATE||""}</td>
      <td>${r.RACE||""}</td>
      <td>${r.VENUE||""}</td>
      <td${finishClass}>${r.FINISH||""}</td>
      <td>${r.RUNNERS||""}</td>
      <td>${horseLink(r.HORSE)}</td>
      <td>${r.WGT||""}</td>
      <td>${r.DIST||""}</td>
      <td>${r.MARG||""}</td>
      <td>${r.SP||""}</td>
      <td>${r.JOCKEY||""}</td>
      <td>${r.TRAINER||""}</td>
      <td>${r.AGE||""}</td>
    `;
    tr.style.cursor = "pointer";
    tr.onclick = (e) => {
      if(e.target.tagName !== "A"){
        window.location.href = `australia-g1s-race.html?race=${encodeURIComponent(r.RACE)}&date=${encodeURIComponent(r.DATE)}`;
      }
    };
    tableBody.appendChild(tr);
  });

  resultCount.textContent = "Results: " + data.length;
}

/* LOAD NAV BAR */
fetch("g1-archive.html")
  .then(res => res.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const nav = doc.querySelector("nav");
    if(nav){
      document.getElementById("global-nav").innerHTML = nav.outerHTML;
    }
  });
</script>

</body>
</html>
