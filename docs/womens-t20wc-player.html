<!DOCTYPE html>

<html lang="en">
<head>
  <script src="/js/analytics.js"></script>

<meta charset="UTF-8">
<title>Women's T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.page{
max-width:1200px;
margin:30px auto;
padding:0 20px;
}

/* UNIFIED HERO */

.hero{
background:linear-gradient(90deg,#7b1fa2,#e91e63);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
}

/* CONTROLS */

.controls{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

button{
padding:8px 16px;
border-radius:8px;
border:1px solid #ccc;
cursor:pointer;
}

/* UNIFIED ACTIVE BUTTON */

button.active{
background:#e91e63;
color:#fff;
border:none;
}

/* SUMMARY BOXES */

.summaryGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:14px;
margin-bottom:25px;
}

.box{
background:#fff;
padding:16px;
border-radius:12px;
text-align:center;
}

.box .value{
font-size:22px;
font-weight:700;
}

.box .label{
font-size:13px;
color:#666;
}

/* TABLE */

table{
width:100%;
background:#fff;
border-collapse:collapse;
}

th{
padding:10px;
border-bottom:2px solid #ddd;
text-align:center;
}

td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

/* UNIFIED ROW STRIPING */

tr:nth-child(even){
background:#eef3ff;
}

/* HOVER */

.clickableRow:hover{
background:#dbe6ff;
cursor:pointer;
}

</style>

</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="womens-t20-world-cup.html">Women's T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName"></h1>
</div>

<div class="controls">

<select id="oppSelect">
<option value="All">All opposition</option>
</select>

<button id="batBtn" class="active">Batting</button> <button id="bowlBtn">Bowling</button>

</div>

<h3>Career Summary</h3>
<div id="careerBoxes" class="summaryGrid"></div>

<h3>Vs Opposition</h3>
<div id="oppBoxes" class="summaryGrid"></div>

<table>

<thead id="thead"></thead>
<tbody id="tbody"></tbody>

</table>

</div>

<script>

const folder="data/womens-t20-world-cup/matches/";

const params=new URLSearchParams(location.search);

const player=params.get("player");

let nameMap={};

playerName.innerText=player;

let mode="bat";

const BOWLER_WKTS=["bowled","caught","lbw","stumped","caught and bowled","hit wicket"];

let matches=[];


/* BUTTONS */

batBtn.onclick=()=>{mode="bat";setActive();render();};
bowlBtn.onclick=()=>{mode="bowl";setActive();render();};

function setActive(){

batBtn.classList.toggle("active",mode==="bat");
bowlBtn.classList.toggle("active",mode==="bowl");

}


/* LOAD */

async function load(){

nameMap=await fetch(folder+"player-names.json?v="+Date.now()).then(r=>r.json()).catch(()=>({}));
playerName.innerText=nameMap[player]||player;

const files=await fetch(folder+"index.json").then(r=>r.json());

for(const file of files){

const season=await fetch(folder+file).then(r=>r.json());

season.forEach((match,idx)=>{

let team=null;

for(const t in match.info.players){

if(match.info.players[t].includes(player)){

team=t;
break;

}

}

if(!team) return;

const opponent=match.info.teams.find(t=>t!==team);

let batRuns=0,batBalls=0,out=false;

let bowlRuns=0,bowlBalls=0,bowlWickets=0;

match.innings.forEach(inn=>{

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

const legalBall=!d.extras?.wides&&!d.extras?.noballs;
const facedBall=!d.extras?.wides;

if(d.batter===player){

batRuns+=d.runs.batter;
if(facedBall) batBalls++;

if(d.wickets)
d.wickets.forEach(w=>{
if(w.player_out===player && !["retired hurt","retired not out","retired"].includes(w.kind)) out=true;
});

}

if(d.bowler===player){

bowlRuns+=d.runs.batter+(d.extras?.wides||0)+(d.extras?.noballs||0);
if(legalBall) bowlBalls++;

if(d.wickets)
d.wickets.forEach(w=>{
if(BOWLER_WKTS.includes(w.kind)) bowlWickets++;
});

}

});

});

});

matches.push({

date:match.info.dates[0],
opponent,
venue:match.info.venue,

batRuns,
batBalls,
out,

bowlRuns,
bowlBalls,
bowlWickets,

file,
matchIndex:idx

});

});

}

populateOpp();
render();

}

function populateOpp(){

const opps=[...new Set(matches.map(m=>m.opponent))];

opps.sort().forEach(o=>oppSelect.innerHTML+=`<option>${o}</option>`);

oppSelect.onchange=render;

}


/* RENDER */

function render(){

const opp=oppSelect.value;

const filtered=
opp==="All"?matches:matches.filter(m=>m.opponent===opp);

renderBoxes(matches,"careerBoxes");
renderBoxes(filtered,"oppBoxes");

renderTable(filtered);

}


/* SUMMARY */

function renderBoxes(data,target){

if(mode==="bat"){

const runs=sum(data,x=>x.batRuns);
const balls=sum(data,x=>x.batBalls);
const outs=data.filter(x=>x.out).length;

const best=Math.max(...data.map(x=>x.batRuns),0);

const fifties=data.filter(x=>x.batRuns>=50&&x.batRuns<100).length;
const hundreds=data.filter(x=>x.batRuns>=100).length;

document.getElementById(target).innerHTML=

box("Matches",data.length)+
box("Runs",runs)+
box("Average",outs?(runs/outs).toFixed(2):"—")+
box("Strike Rate",balls?(runs/balls*100).toFixed(1):"—")+
box("50s",fifties)+
box("100s",hundreds)+
box("Best",best);

}
else{

const wkts=sum(data,x=>x.bowlWickets);
const runs=sum(data,x=>x.bowlRuns);
const balls=sum(data,x=>x.bowlBalls);

const best=Math.max(...data.map(x=>x.bowlWickets),0);

document.getElementById(target).innerHTML=

box("Matches",data.length)+
box("Wickets",wkts)+
box("Average",wkts?(runs/wkts).toFixed(2):"—")+
box("Economy",balls?(runs/(balls/6)).toFixed(2):"—")+
box("Strike Rate",wkts?(balls/wkts).toFixed(1):"—")+
box("Best",best);

}

}


/* TABLE */

function renderTable(data){

if(mode==="bat"){

thead.innerHTML=
`<tr>
<th>Date</th><th>Opp</th><th>Venue</th>
<th>Runs</th><th>Balls</th><th>SR</th>
</tr>`;

tbody.innerHTML=data.map(m=>
`<tr class="clickableRow"
onclick="location.href='womens-t20wc-match.html?file=${folder}${m.file}&match=${m.matchIndex}'">
<td>${m.date}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.batRuns}</td>
<td>${m.batBalls}</td>
<td>${m.batBalls?(m.batRuns/m.batBalls*100).toFixed(1):""}</td>
</tr>`).join("");

}
else{

thead.innerHTML=
`<tr>
<th>Date</th><th>Opp</th><th>Venue</th>
<th>Overs</th><th>Runs</th><th>Wkts</th><th>Econ</th>
</tr>`;

tbody.innerHTML=data.map(m=>
`<tr class="clickableRow"
onclick="location.href='womens-t20wc-match.html?file=${folder}${m.file}&match=${m.matchIndex}'">
<td>${m.date}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${Math.floor(m.bowlBalls/6)}.${m.bowlBalls%6}</td>
<td>${m.bowlRuns}</td>
<td>${m.bowlWickets}</td>
<td>${m.bowlBalls?(m.bowlRuns/(m.bowlBalls/6)).toFixed(2):""}</td>
</tr>`).join("");

}

}


/* HELPERS */

function box(label,value){

return `<div class="box">
<div class="value">${value}</div>
<div class="label">${label}</div>
</div>`;

}

function sum(arr,fn){

return arr.reduce((a,b)=>a+fn(b),0);

}

load();

</script>

</body>
</html>
