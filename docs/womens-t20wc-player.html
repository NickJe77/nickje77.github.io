<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Women's T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

/* HERO */

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.hero-left h1{
  margin:0;
  font-size:32px;
}

.hero-left p{
  margin-top:8px;
}

.hero-right{
  position:relative;
}

.search{
  padding:10px;
  border-radius:8px;
  border:none;
  width:240px;
}

.dropdown{
  position:absolute;
  background:white;
  width:100%;
  border:1px solid #ccc;
  max-height:250px;
  overflow-y:auto;
  display:none;
  z-index:100;
}

.dropdown div{
  padding:8px;
  cursor:pointer;
}

.dropdown div:hover{
  background:#eee;
}

/* FILTERS */

.filters{
  margin-bottom:20px;
}

/* BOXES */

.box-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-bottom:20px;
}

.box{
  background:#f3f6fb;
  padding:12px;
  border-radius:10px;
  text-align:center;
}

.box .value{
  font-size:20px;
  font-weight:700;
}

.box .label{
  font-size:13px;
  color:#555;
}

/* TABLE */

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
}

th{
  background:#f3f6fb;
}

tr:nth-child(even){
  background:#eaf3ff;
}

.player-link{
  color:#6a040f;
  font-weight:600;
  text-decoration:none;
}

.player-link:hover{
  text-decoration:underline;
}

.match-row{
  cursor:pointer;
}

.match-row:hover{
  background:#ffe5e5 !important;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="womens-t20-world-cup.html">Women's T20 World Cup</a>
</div>

<div class="page">

<div class="hero">

<div class="hero-left">
<h1 id="playerName">Loading...</h1>
<p>Women's T20 World Cup batting & bowling performance</p>
</div>

<div class="hero-right">

<input class="search" id="playerSearch" placeholder="Search player">

<div id="searchDropdown" class="dropdown"></div>

</div>

</div>

<div class="filters">

<label>Opposition:</label>

<select id="oppositionFilter"></select>

</div>

<h3>CAREER SUMMARY</h3>
<div id="careerBoxes" class="box-grid"></div>

<h3>VS OPPOSITION</h3>
<div id="oppBoxes" class="box-grid"></div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Runs</th>
<th>Balls</th>
<th>SR</th>
<th>Wickets</th>
</tr>
</thead>

<tbody id="matchTable"></tbody>

</table>

</div>

<script>

const BASE="data/womens-t20-world-cup/matches/";

let nameMap={};
let allMatches=[];
let currentPlayer="";
let currentOpp="All";

init();

async function init(){

nameMap=await fetch(BASE+"player-names.json").then(r=>r.json());

const index=await fetch(BASE+"index.json").then(r=>r.json());

for(const file of index){

const matches=await fetch(BASE+file).then(r=>r.json());

matches.forEach((m,i)=>{

m._file=file;
m._index=i;

allMatches.push(m);

});

}

populateSearch();

const params=new URLSearchParams(location.search);

const player=params.get("player")||Object.keys(nameMap)[0];

loadPlayer(player);

}

/* SEARCH */

function populateSearch(){

const input=document.getElementById("playerSearch");

const drop=document.getElementById("searchDropdown");

const players=Object.keys(nameMap).sort();

input.oninput=()=>{

const text=input.value.toLowerCase();

drop.innerHTML="";

players
.filter(p=>nameMap[p].toLowerCase().includes(text))
.slice(0,20)
.forEach(p=>{

const div=document.createElement("div");

div.textContent=nameMap[p];

div.onclick=()=>{

location="?player="+encodeURIComponent(p);

};

drop.appendChild(div);

});

drop.style.display="block";

};

}

/* LOAD PLAYER */

function loadPlayer(player){

currentPlayer=player;

document.getElementById("playerName").textContent=nameMap[player];

buildOppFilter();

render();

}

function buildOppFilter(){

const select=document.getElementById("oppositionFilter");

const opps=new Set(["All"]);

allMatches.forEach(m=>{

if(matchHasPlayer(m,currentPlayer)){

const opp=m.info.teams.find(t=>!isPlayerTeam(m,t));

opps.add(opp);

}

});

select.innerHTML="";

opps.forEach(o=>{

const opt=document.createElement("option");

opt.value=o;

opt.textContent=o;

select.appendChild(opt);

});

select.onchange=()=>{

currentOpp=select.value;

render();

};

}

function render(){

const matches=allMatches.filter(m=>{

if(!matchHasPlayer(m,currentPlayer)) return false;

if(currentOpp==="All") return true;

const opp=m.info.teams.find(t=>!isPlayerTeam(m,t));

return opp===currentOpp;

});

renderBoxes(matches,"careerBoxes");

renderBoxes(matches,"oppBoxes");

renderTable(matches);

}

function renderBoxes(matches,id){

let runs=0,balls=0,wkts=0;

matches.forEach(m=>{

m.innings.forEach(inn=>{

inn.overs.forEach(o=>{

o.deliveries.forEach(d=>{

if(d.batter===currentPlayer){

runs+=d.runs.batter;

balls++;

}

if(d.bowler===currentPlayer && d.wickets){

wkts+=d.wickets.length;

}

});

});

});

});

const avg=(balls?runs/balls:0).toFixed(1);

const sr=(balls?runs/balls*100:0).toFixed(1);

document.getElementById(id).innerHTML=`

<div class="box"><div class="value">${matches.length}</div><div class="label">Matches</div></div>

<div class="box"><div class="value">${runs}</div><div class="label">Runs</div></div>

<div class="box"><div class="value">${balls}</div><div class="label">Balls</div></div>

<div class="box"><div class="value">${avg}</div><div class="label">Average</div></div>

<div class="box"><div class="value">${sr}</div><div class="label">Strike Rate</div></div>

<div class="box"><div class="value">${wkts}</div><div class="label">Wickets</div></div>

`;

}

function renderTable(matches){

const tbody=document.getElementById("matchTable");

tbody.innerHTML="";

matches.forEach(m=>{

let runs=0,balls=0,wkts=0;

m.innings.forEach(inn=>{

inn.overs.forEach(o=>{

o.deliveries.forEach(d=>{

if(d.batter===currentPlayer){

runs+=d.runs.batter;

balls++;

}

if(d.bowler===currentPlayer && d.wickets){

wkts+=d.wickets.length;

}

});

});

});

const sr=(balls?runs/balls*100:0).toFixed(1);

const opp=m.info.teams.find(t=>!isPlayerTeam(m,t));

const tr=document.createElement("tr");

tr.className="match-row";

tr.onclick=()=>{

location=`womens-t20wc-match.html?file=${m._file}&match=${m._index}`;

};

tr.innerHTML=`

<td>${formatDate(m.info.dates[0])}</td>

<td>${opp}</td>

<td>${m.info.venue}</td>

<td>${runs}</td>

<td>${balls}</td>

<td>${sr}</td>

<td>${wkts}</td>

`;

tbody.appendChild(tr);

});

}

function matchHasPlayer(m,p){

return m.info.players && Object.values(m.info.players).flat().includes(p);

}

function isPlayerTeam(m,team){

return m.info.players[team]?.includes(currentPlayer);

}

function formatDate(d){

return new Date(d).toLocaleDateString("en-GB",{

day:"2-digit",
month:"short",
year:"numeric"

});

}

</script>

</body>
</html>
