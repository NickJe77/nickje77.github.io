<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Australian Group 1 Races | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

/* HERO */
.hero{
  background:url("images/racing-hero.jpg") center/cover no-repeat;
  height:220px;
  position:relative;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.2));
}
.hero h1{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  margin:0;
  font-size:36px;
  letter-spacing:.5px;
}
.hero p{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  color:#eee;
  margin:0 0 10px 0;
  font-size:16px;
}

/* PAGE */
.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-bottom:25px;
}

.filters select{
  padding:8px 12px;
  font-size:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th, td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
  font-size:14px;
}

th{
  background:#f3f6ff;
}

tr:nth-child(even){
  background:#fafcff;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="cricket.html">Cricket</a>
  <a href="football.html">Football</a>
  <a href="f1.html">Formula 1</a>
</div>

<div class="hero">
  <h1>Australian Group 1 Races</h1>
  <p>Filter by race, year, jockey, trainer or finish</p>
</div>

<div class="page-wrap">

  <div class="filters">
    <select id="raceFilter">
      <option value="">All Races</option>
    </select>

    <select id="yearFilter">
      <option value="">All Years</option>
    </select>

    <select id="jockeyFilter">
      <option value="">All Jockeys</option>
    </select>

    <select id="trainerFilter">
      <option value="">All Trainers</option>
    </select>

    <select id="finishFilter">
      <option value="">All Finishes</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Race</th>
        <th>Year</th>
        <th>Horse</th>
        <th>Jockey</th>
        <th>Trainer</th>
        <th>Finish</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
</div>

<script>
let allData = [];

fetch("docs/data/racing/aus_g1_races.json")
  .then(res => res.json())
  .then(data => {
    allData = data;
    buildDropdowns(data);
    renderTable(data);
  });

function uniqueValues(data, key){
  return [...new Set(
    data
      .map(row => row[key])
      .filter(v => v !== "" && v !== null && v !== undefined && v !== "??")
  )].sort((a,b) => b - a || a.localeCompare?.(b));
}

function buildDropdowns(data){
  populateSelect("raceFilter", uniqueValues(data, "race"));
  populateSelect("yearFilter", uniqueValues(data, "year"));
  populateSelect("jockeyFilter", uniqueValues(data, "jockey"));
  populateSelect("trainerFilter", uniqueValues(data, "trainer"));
  populateSelect("finishFilter", uniqueValues(data, "finish"));
}

function populateSelect(id, values){
  const select = document.getElementById(id);
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  });
}

document.querySelectorAll(".filters select").forEach(sel => {
  sel.addEventListener("change", applyFilters);
});

function applyFilters(){
  const race = document.getElementById("raceFilter").value;
  const year = document.getElementById("yearFilter").value;
  const jockey = document.getElementById("jockeyFilter").value;
  const trainer = document.getElementById("trainerFilter").value;
  const finish = document.getElementById("finishFilter").value;

  const filtered = allData.filter(row => {
    return (!race || row.race === race) &&
           (!year || row.year == year) &&
           (!jockey || row.jockey === jockey) &&
           (!trainer || row.trainer === trainer) &&
           (!finish || row.finish == finish);
  });

  renderTable(filtered);
}

function renderTable(data){
  const tbody = document.getElementById("resultsBody");
  tbody.innerHTML = "";

  data
    .sort((a,b) => b.year - a.year)
    .forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.race}</td>
        <td>${row.year}</td>
        <td>${row.horse}</td>
        <td>${row.jockey}</td>
        <td>${row.trainer || ""}</td>
        <td>${row.finish || ""}</td>
      `;
      tbody.appendChild(tr);
    });
}
</script>

</body>
</html>
