<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Australian Group 1 Races | The Sporting Almanac</title>

<link rel="stylesheet" href="racing.css">

<style>
.g1-hub {
  max-width:1200px;
  margin:40px auto;
}

.g1-title {
  font-size:36px;
  font-weight:800;
  margin-bottom:30px;
}

.g1-tiles {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap:24px;
}

.g1-tile {
  border-radius:16px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.15);
  transition:transform 0.2s ease;
  text-decoration:none;
}

.g1-tile:hover {
  transform:translateY(-4px);
}

.g1-tile img {
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.g1-tile-title {
  position:absolute;
  bottom:0;
  width:100%;
  padding:14px;
  background:linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0));
  color:white;
  font-size:20px;
  font-weight:700;
  text-align:center;
}
</style>

</head>

<body>

<!-- GLOBAL NAV -->
<div id="global-nav"></div>

<div class="g1-hub">

  <div class="g1-title">AUSTRALIAN GROUP 1 RACES</div>

  <div class="g1-tiles">

    <a class="g1-tile" href="g1-victoria.html">
      <img src="images/g1-victoria.jpg" alt="Victoria">
      <div class="g1-tile-title">VICTORIA</div>
    </a>

    <a class="g1-tile" href="g1-nsw.html">
      <img src="images/g1-nsw.jpg" alt="New South Wales">
      <div class="g1-tile-title">NEW SOUTH WALES</div>
    </a>

    <a class="g1-tile" href="g1-sa.html">
      <img src="images/g1-sa.jpg" alt="South Australia">
      <div class="g1-tile-title">SOUTH AUSTRALIA</div>
    </a>

    <a class="g1-tile" href="g1-wa.html">
      <img src="images/g1-wa.jpg" alt="Western Australia">
      <div class="g1-tile-title">WESTERN AUSTRALIA</div>
    </a>

    <a class="g1-tile" href="g1-qld.html">
      <img src="images/g1-qld.jpg" alt="Queensland">
      <div class="g1-tile-title">QUEENSLAND</div>
    </a>

  </div>

</div>

<script>
/* Inject nav from g1-archive.html safely */
fetch("g1-archive.html")
  .then(res => res.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    const nav =
      doc.querySelector("nav") ||
      doc.querySelector("#nav") ||
      doc.querySelector(".nav") ||
      doc.querySelector(".top-nav") ||
      doc.querySelector(".main-nav");

    if (nav) {
      document.getElementById("global-nav").innerHTML = nav.outerHTML;
    }
  });
</script>

</body>
</html>
