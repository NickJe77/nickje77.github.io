<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Olympics | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: system-ui, Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}

/* NAV */
.navbar{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:#111;
}
.navbar a{
    color:white;
    text-decoration:none;
    font-weight:600;
}

/* HERO */
.hero{
    background:linear-gradient(90deg,#0085C7,#F4C300,#000000,#009F3D,#DF0024);
    color:white;
    text-align:center;
    padding:30px 10px;
}
.hero h1{
    margin:0;
    font-size:28px;
}

/* CONTENT */
.container{
    max-width:1100px;
    margin:20px auto;
    padding:10px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}
th, td{
    padding:10px;
    text-align:center;
}
th{
    background:#222;
    color:white;
}
tr:nth-child(even){
    background:#f2f2f2;
}
td.country{
    text-align:left;
    font-weight:600;
}

/* FILTER */
.controls{
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
}
select{
    padding:6px;
    font-size:14px;
}

/* MOBILE */
@media(max-width:700px){
    th, td{
        font-size:12px;
        padding:6px;
    }
}
</style>
</head>

<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/olympics.html">Olympics</a>
</div>

<div class="hero">
    <h1>Olympic Medal Table</h1>
    <p>All-Time Summer Olympics</p>
</div>

<div class="container">

<div class="controls">
    <div>
        <label>Sort:</label>
        <select id="sort">
            <option value="gold">Gold</option>
            <option value="total">Total</option>
        </select>
    </div>
</div>

<table id="table">
    <thead>
        <tr>
            <th>#</th>
            <th>Country</th>
            <th>Gold</th>
            <th>Silver</th>
            <th>Bronze</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

</div>

<script>

let data = [];

async function load(){
    const res = await fetch("data/olympics/olympic_country_table.json");
    data = await res.json();
    render();
}

function render(){
    const tbody = document.querySelector("#table tbody");
    tbody.innerHTML = "";

    const sort = document.getElementById("sort").value;

    let sorted = [...data];

    if(sort === "gold"){
        sorted.sort((a,b)=> b.GOLD - a.GOLD || b.SILVER - a.SILVER || b.BRONZE - a.BRONZE);
    } else {
        sorted.sort((a,b)=> b.total - a.total);
    }

    sorted.forEach((row,i)=>{
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${i+1}</td>
            <td class="country">${row.country}</td>
            <td>${row.GOLD || 0}</td>
            <td>${row.SILVER || 0}</td>
            <td>${row.BRONZE || 0}</td>
            <td>${row.total || 0}</td>
        `;

        tbody.appendChild(tr);
    });
}

document.getElementById("sort").addEventListener("change", render);

load();

</script>

</body>
</html>
