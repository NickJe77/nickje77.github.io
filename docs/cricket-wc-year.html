<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>ICC Cricket World Cup | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: #ffffff;
    }
    .navbar {
      display: flex;
      justify-content: center;
      gap: 22px;
      padding: 16px 0;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
    }
    .navbar a { color: #0056d6; text-decoration: none; font-size: 18px; }
    .page-wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    .hero {
      background: linear-gradient(90deg, #004d00, #006400);
      color: white;
      padding: 40px 50px;
      border-radius: 24px;
      margin-bottom: 25px;
    }
    .hero h1 { margin: 0; font-size: 46px; }
    .hero p { margin-top: 10px; font-size: 20px; opacity: 0.95; }
    .year-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }
    .year-btn {
      background: #003300;
      color: white;
      border: none;
      padding: 12px 0;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    .year-btn:hover { background: #005000; }
    .year-btn.active { background: #2e7d32; }
    .summary {
      border: 1px solid #ddd;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .summary h2 { margin-top: 0; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .summary-box {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 15px;
      background: #f4fbf4;
    }
    .summary-box strong { display: block; margin-bottom: 6px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 15px;
    }
    th, td {
      border-bottom: 1px solid #ddd;
      padding: 10px 12px;
      text-align: left;
    }
    th { background: #f3f6fb; position: sticky; top: 0; }
    tr:nth-child(even) { background: #f6fbf6; }
    tr:hover { background: #edf7ed; cursor: pointer; }
    .winner { font-weight: 600; color: #1a7f37; }
    @media(max-width:900px) {
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>
<div class="page-wrap">
  <div class="hero">
    <h1>ICC Cricket World Cup</h1>
    <p>Complete match history by tournament. Click any match for full scorecard.</p>
  </div>

  <div id="yearGrid" class="year-grid"></div>

  <div class="summary">
    <h2>Tournament Summary</h2>
    <div class="summary-grid">
      <div class="summary-box"><strong>Champion</strong><span id="winnerBox">—</span></div>
      <div class="summary-box"><strong>Runner-up</strong><span id="runnerBox">—</span></div>
      <div class="summary-box"><strong>Matches</strong><span id="matchCount">—</span></div>
      <div class="summary-box"><strong>Host</strong><span id="hostBox">—</span></div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Date</th>
        <th>Match</th>
        <th>Ground</th>
        <th>Result</th>
      </tr>
    </thead>
    <tbody id="matchTable"></tbody>
  </table>
</div>

<script>
const TOURNAMENTS = [
  { year: "1975",      file: "wc_1975",      champion: "West Indies", runner_up: "Australia",    host: "England" },
  { year: "1979",      file: "wc_1979",      champion: "West Indies", runner_up: "England",      host: "England" },
  { year: "1983",      file: "wc_1983",      champion: "India",       runner_up: "West Indies",  host: "England" },
  { year: "1987", file: "wc_1987_1988", champion: "Australia",   runner_up: "England",      host: "India & Pakistan" },
  { year: "1992", file: "wc_1991_1992", champion: "Pakistan",    runner_up: "England",      host: "Australia & New Zealand" },
  { year: "1996", file: "wc_1995_1996", champion: "Sri Lanka",   runner_up: "Australia",    host: "India, Pakistan & Sri Lanka" },
  { year: "1999",      file: "wc_1999",      champion: "Australia",   runner_up: "Pakistan",     host: "England" },
  { year: "2003", file: "wc_2002_2003", champion: "Australia",   runner_up: "India",        host: "South Africa, Zimbabwe & Kenya" },
  { year: "2007", file: "wc_2006_2007", champion: "Australia",   runner_up: "Sri Lanka",    host: "West Indies" },
  { year: "2011", file: "wc_2010_2011", champion: "India",       runner_up: "Sri Lanka",    host: "India, Sri Lanka & Bangladesh" },
  { year: "2015", file: "wc_2014_2015", champion: "Australia",   runner_up: "New Zealand",  host: "Australia & New Zealand" },
  { year: "2019",      file: "wc_2019",      champion: "England",     runner_up: "New Zealand",  host: "England & Wales" },
  { year: "2023",      file: "wc_2023",      champion: "Australia",   runner_up: "India",        host: "India" },
];

const basePath = "data/cricket/world-cup/scorecards/";
const yearGrid  = document.getElementById("yearGrid");
const tableBody = document.getElementById("matchTable");

let currentYear = null;

TOURNAMENTS.forEach((t, i) => {
  const btn = document.createElement("button");
  btn.className = "year-btn";
  btn.textContent = t.year;
  btn.onclick = () => selectTournament(t, btn);
  yearGrid.appendChild(btn);
  if (i === TOURNAMENTS.length - 1) {
    btn.classList.add("active");
    selectTournament(t, btn);
  }
});

function selectTournament(t, btn) {
  document.querySelectorAll(".year-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentYear = t.year;

  document.getElementById("winnerBox").textContent  = t.champion;
  document.getElementById("runnerBox").textContent  = t.runner_up;
  document.getElementById("hostBox").textContent    = t.host;
  document.getElementById("matchCount").textContent = "Loading…";
  tableBody.innerHTML = "";

  fetch(`${basePath}${t.file}.json`)
    .then(r => r.json())
    .then(data => {
      const matches = data.matches || [];
      document.getElementById("matchCount").textContent = matches.length;
      tableBody.innerHTML = "";
      matches.forEach((m, idx) => {
        const tr = document.createElement("tr");
        tr.onclick = () => {
          window.location.href = `cricket-wc-match.html?file=${encodeURIComponent(t.file)}&code=${m.match_code}`;
        };
        tr.innerHTML = `
          <td>${m.match_number}</td>
          <td>${formatDate(m.date)}</td>
          <td>${m.teams}</td>
          <td>${m.ground}</td>
          <td class="winner">${m.result}</td>
        `;
        tableBody.appendChild(tr);
      });
    })
    .catch(() => {
      document.getElementById("matchCount").textContent = "—";
      tableBody.innerHTML = '<tr><td colspan="5">Could not load data.</td></tr>';
    });
}

function formatDate(d) {
  const [day, mon, yr] = d.split("/");
  return new Date(`${yr}-${mon}-${day}`).toLocaleDateString("en-GB", {
    day: "2-digit", month: "short", year: "numeric"
  });
}
</script>
</body>
</html>
