<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Build Baseball Master</title>
</head>
<body>

<h2>Building master file...</h2>
<pre id="log"></pre>

<script>

const YEARS = [];

for(let y=1946;y<=2025;y++)
YEARS.push(y);

const BASE="data/baseball/boxscores/";

const log = msg => document.getElementById("log").textContent += msg+"\n";

let master=[];

async function build(){

for(const year of YEARS){

log("Checking "+year);

try{

const res = await fetch(BASE+year+"/");

if(!res.ok) continue;

}catch{
continue;
}

try{

const index = await fetch(BASE+year+"/index.json");

if(!index.ok) continue;

const files = await index.json();

for(const file of files){

const gameRes = await fetch(BASE+year+"/"+file);

if(!gameRes.ok) continue;

const game = await gameRes.json();

master.push(game);

log("Added "+file);

}

}catch{}

}

log("DONE");

download();

}

function download(){

const blob=new Blob(
[JSON.stringify(master)],
{type:"application/json"}
);

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="games_master.json";

a.click();

}

build();

</script>

</body>
</html>
