<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Test Cricket by Country | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f8fc;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:24px;
}

.hero{
  background:linear-gradient(135deg,#0d3320,#1a6b3c);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:24px;
}

.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:10px;font-size:18px;opacity:.9;}

.selector-wrap{
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:24px;
}

.selector-wrap select{
  padding:10px 16px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
  font-weight:600;
  background:#fff;
  min-width:220px;
}

.selector-wrap select:focus{outline:2px solid #1a6b3c;border-color:#1a6b3c;}

.go-btn{
  padding:10px 24px;
  background:#1a6b3c;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

.go-btn:hover{background:#145c32;transform:translateY(-1px);}

.record-banner{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:24px;
}

.record-card{
  background:#fff;
  border:1px solid #d0e8da;
  border-radius:14px;
  padding:20px;
  text-align:center;
}

.record-card .big{font-size:42px;font-weight:800;color:#0d3320;line-height:1;}
.record-card .lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#aaa;margin-top:6px;}

.split-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:24px;
}

.split-card{
  background:#fff;
  border:1px solid #d0e8da;
  border-radius:14px;
  padding:20px 24px;
}

.split-card h3{margin:0 0 14px;font-size:15px;font-weight:700;color:#0d3320;}

.split-stats{display:flex;gap:0;}

.split-stat{
  flex:1;
  text-align:center;
  border-right:1px solid #eee;
  padding:0 12px;
}

.split-stat:last-child{border-right:none;}
.split-stat .n{font-size:28px;font-weight:800;color:#1a6b3c;}
.split-stat .l{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#aaa;margin-top:2px;}

.section-title{
  margin:28px 0 12px;
  font-weight:700;
  color:#0d3320;
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.table-wrap{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  margin-bottom:28px;
}

table{width:100%;border-collapse:collapse;font-size:14px;}

th{
  background:linear-gradient(135deg,#0d3320,#1a6b3c);
  color:#fff;
  padding:12px;
  text-align:left;
}

th.num{text-align:right;}
td{padding:12px;border-bottom:1px solid #eee;}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:'SF Mono',Consolas,monospace;}
tr:nth-child(even){background:#f4f8fc;}
tr:hover td{background:#d6ede0;}

.empty-msg{
  padding:60px;
  text-align:center;
  color:#bbb;
  font-size:15px;
}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{
  display:inline-block;
  width:24px;height:24px;
  border:3px solid #e0e0e0;
  border-top-color:#1a6b3c;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
  margin-right:8px;
}

.loading{padding:40px;text-align:center;color:#aaa;font-size:15px;}

.win{color:#1a6b3c;font-weight:700;}
.loss{color:#b91c1c;font-weight:700;}
.draw{color:#92400e;font-weight:700;}

footer{
  text-align:center;
  padding:24px 20px;
  font-size:12px;
  color:#aaa;
  border-top:1px solid #eee;
  margin-top:40px;
}
footer a{color:#888;text-decoration:none;}
footer a:hover{text-decoration:underline;}

</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="test-cricket.html">Test Cricket</a>
</div>

<div class="page">

  <div class="hero">
    <h1>By Country</h1>
    <p>Complete Test match record for any nation.</p>
  </div>

  <div class="selector-wrap">
    <select id="countrySelect"><option value="">Select a country</option></select>
    <button class="go-btn" onclick="loadCountry()">View Record</button>
  </div>

  <div id="results">
    <div class="empty-msg">Select a country above to view their full Test record.</div>
  </div>

</div>

<footer>
  Scorecard data sourced from <a href="https://www.howstat.com" target="_blank">howstat.com</a>
</footer>

<script>
const BASE = '/data/test_cricket';

let allMatches = [];
let allTeams = new Set();
let dataLoaded = false;

async function init() {
  const years = [];
  for (let y = 1970; y <= 2026; y++) years.push(y);

  await Promise.all(years.map(async year => {
    try {
      const res = await fetch(`${BASE}/tests_${year}.json`);
      if (!res.ok) return;
      const data = await res.json();
      (data.matches || []).forEach(match => {
        const innings = match.scorecard?.innings || [];
        const teams = [...new Set(innings.map(i => i.team))];
        teams.forEach(t => allTeams.add(t));
        if (teams.length >= 2) allMatches.push(match);
      });
    } catch {}
  }));

  dataLoaded = true;

  const sorted = [...allTeams].sort();
  const sel = document.getElementById('countrySelect');
  sel.innerHTML = '<option value="">Select a country</option>' +
    sorted.map(t => `<option value="${t}">${t}</option>`).join('');

  document.getElementById('results').innerHTML =
    '<div class="empty-msg">Select a country above to view their full Test record.</div>';
}

function getTeams(match) {
  return [...new Set((match.scorecard?.innings || []).map(i => i.team))];
}

function resultForTeam(match, team) {
  const r = (match.result || '').toLowerCase();
  if (r.includes('abandoned') || r.includes('no result')) return 'abandoned';
  if (r.includes('drawn') || r.includes('draw')) return 'draw';
  if (r.startsWith(team.toLowerCase()) || r.includes(`${team.toLowerCase()} won`)) return 'win';
  return 'loss';
}

function isHome(match, team) {
  const series = (match.scorecard?.match_info?.Series || match.teams || '').toLowerCase();
  const parts = series.split(' v ');
  if (parts.length >= 2) {
    return parts[0].trim().toLowerCase().includes(team.toLowerCase().split(' ')[0]);
  }
  return null;
}

function loadCountry() {
  const team = document.getElementById('countrySelect').value;
  if (!team) { alert('Please select a country.'); return; }
  if (!dataLoaded) return;

  const matches = allMatches.filter(m => getTeams(m).includes(team));

  if (!matches.length) {
    document.getElementById('results').innerHTML =
      `<div class="empty-msg">No matches found for ${team}.</div>`;
    return;
  }

  // Overall record
  let wins = 0, losses = 0, draws = 0, abandoned = 0;
  matches.forEach(m => {
    const r = resultForTeam(m, team);
    if (r === 'win') wins++;
    else if (r === 'loss') losses++;
    else if (r === 'draw') draws++;
    else abandoned++;
  });

  // Home/away splits
  let homeW=0,homeL=0,homeD=0,homeTotal=0;
  let awayW=0,awayL=0,awayD=0,awayTotal=0;
  matches.forEach(m => {
    const home = isHome(m, team);
    const r = resultForTeam(m, team);
    if (home === true) {
      homeTotal++;
      if (r==='win') homeW++; else if (r==='loss') homeL++; else homeD++;
    } else if (home === false) {
      awayTotal++;
      if (r==='win') awayW++; else if (r==='loss') awayL++; else awayD++;
    }
  });

  // Records by opponent
  const byOpp = {};
  matches.forEach(m => {
    const teams = getTeams(m);
    const opp = teams.find(t => t !== team) || '—';
    if (!byOpp[opp]) byOpp[opp] = {w:0,l:0,d:0,total:0};
    const r = resultForTeam(m, team);
    byOpp[opp].total++;
    if (r==='win') byOpp[opp].w++;
    else if (r==='loss') byOpp[opp].l++;
    else byOpp[opp].d++;
  });
  const oppList = Object.entries(byOpp).sort((a,b) => b[1].total - a[1].total);

  // Batting, bowling, fielding
  let highScores = [];
  let bestBowling = [];
  let fielding = {};

  matches.forEach(m => {
    const innings = m.scorecard?.innings || [];
    const info = m.scorecard?.match_info || {};
    const series = info.Series || m.teams || '';
    const date = m.date || '';
    const testNo = info['Match No.'] || `#${m.match_number}`;
    const teams = getTeams(m);
    const opp = teams.find(t => t !== team) || '—';

    innings.forEach(inn => {
      // Batting — only innings where the selected team is batting
      if (inn.team === team) {
        (inn.batting || []).forEach(b => {
          highScores.push({
            player: b.batsman, opp,
            runs: b.runs, balls: b.balls_faced,
            notOut: (b.dismissal||'').toLowerCase().includes('not out'),
            date, series, testNo
          });
        });

        // Fielding — parse dismissals from the OPPONENT's batting innings
        // (selected team's fielders take catches when opponent bats)
      }

      // Bowling — only innings where the selected team is bowling
      // i.e. the opponent is batting, so inn.team !== team
      if (inn.team !== team) {
        const bowlSeen = new Set();
        (inn.bowling || []).forEach(b => {
          const k = `${b.bowler}-${b.overs}-${b.runs}-${b.wickets}`;
          if (bowlSeen.has(k)) return;
          bowlSeen.add(k);
          bestBowling.push({
            player: b.bowler, opp,
            wickets: b.wickets, runs: b.runs,
            overs: b.overs, economy: b.economy,
            date, series, testNo
          });
        });

        // Fielding — selected team fields when opponent bats
        (inn.batting || []).forEach(b => {
          const d = (b.dismissal||'').toLowerCase();
          const catchMatch = d.match(/^c\s+[†]?([^b]+?)\s+b\s+/);
          if (catchMatch) {
            const f = catchMatch[1].trim();
            if (!fielding[f]) fielding[f] = {catches:0,stumpings:0};
            fielding[f].catches++;
          }
          const stumpMatch = d.match(/^st\s+[†]?([^b]+?)\s+b\s+/);
          if (stumpMatch) {
            const f = stumpMatch[1].trim();
            if (!fielding[f]) fielding[f] = {catches:0,stumpings:0};
            fielding[f].stumpings++;
          }
        });
      }
    });
  });

  highScores.sort((a,b) => b.runs - a.runs);
  bestBowling.sort((a,b) => b.wickets - a.wickets || a.runs - b.runs);

  const fieldingList = Object.entries(fielding)
    .map(([name,f]) => ({name,...f,total:f.catches+f.stumpings}))
    .sort((a,b) => b.total - a.total);

  function resultBadge(r) {
    const cl = r==='win'?'win':r==='loss'?'loss':'draw';
    return `<span class="${cl}">${r.charAt(0).toUpperCase()+r.slice(1)}</span>`;
  }

  document.getElementById('results').innerHTML = `

    <div class="record-banner">
      <div class="record-card">
        <div class="big">${matches.length}</div>
        <div class="lbl">Tests Played</div>
      </div>
      <div class="record-card">
        <div class="big" style="color:#1a6b3c">${wins}</div>
        <div class="lbl">Wins</div>
      </div>
      <div class="record-card">
        <div class="big" style="color:#b91c1c">${losses}</div>
        <div class="lbl">Losses</div>
      </div>
      <div class="record-card">
        <div class="big" style="color:#92400e">${draws}</div>
        <div class="lbl">Draws</div>
      </div>
    </div>

    <div class="split-grid">
      <div class="split-card">
        <h3>🏠 Home Record (${homeTotal} Tests)</h3>
        <div class="split-stats">
          <div class="split-stat"><div class="n" style="color:#1a6b3c">${homeW}</div><div class="l">Wins</div></div>
          <div class="split-stat"><div class="n" style="color:#b91c1c">${homeL}</div><div class="l">Losses</div></div>
          <div class="split-stat"><div class="n" style="color:#92400e">${homeD}</div><div class="l">Draws</div></div>
        </div>
      </div>
      <div class="split-card">
        <h3>✈️ Away Record (${awayTotal} Tests)</h3>
        <div class="split-stats">
          <div class="split-stat"><div class="n" style="color:#1a6b3c">${awayW}</div><div class="l">Wins</div></div>
          <div class="split-stat"><div class="n" style="color:#b91c1c">${awayL}</div><div class="l">Losses</div></div>
          <div class="split-stat"><div class="n" style="color:#92400e">${awayD}</div><div class="l">Draws</div></div>
        </div>
      </div>
    </div>

    <div class="section-title">Highest Individual Scores</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Player</th><th>Opponent</th>
          <th class="num">Runs</th><th class="num">Balls</th>
          <th>Date</th><th>Series</th>
        </tr></thead>
        <tbody>${highScores.slice(0,20).map(s => `<tr>
          <td>${s.player}</td>
          <td>${s.opp}</td>
          <td class="num"><strong>${s.runs}${s.notOut?'*':''}</strong></td>
          <td class="num">${s.balls??'—'}</td>
          <td>${s.date}</td>
          <td>${s.series}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="section-title">Best Bowling Figures</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Player</th><th>Opponent</th>
          <th class="num">W</th><th class="num">R</th>
          <th class="num">O</th><th class="num">Econ</th>
          <th>Date</th><th>Series</th>
        </tr></thead>
        <tbody>${bestBowling.filter(b=>b.wickets>0).slice(0,20).map(b => `<tr>
          <td>${b.player}</td>
          <td>${b.opp}</td>
          <td class="num"><strong>${b.wickets}/${b.runs}</strong></td>
          <td class="num">${b.runs}</td>
          <td class="num">${b.overs}</td>
          <td class="num">${b.economy!=null?Number(b.economy).toFixed(2):'—'}</td>
          <td>${b.date}</td>
          <td>${b.series}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="section-title">Best Fielding</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Player</th>
          <th class="num">Catches</th>
          <th class="num">Stumpings</th>
          <th class="num">Total</th>
        </tr></thead>
        <tbody>${fieldingList.slice(0,20).map(f => `<tr>
          <td>${f.name}</td>
          <td class="num">${f.catches}</td>
          <td class="num">${f.stumpings}</td>
          <td class="num"><strong>${f.total}</strong></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="section-title">Record by Opponent</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Opponent</th>
          <th class="num">Tests</th>
          <th class="num">Won</th>
          <th class="num">Lost</th>
          <th class="num">Drawn</th>
        </tr></thead>
        <tbody>${oppList.map(([opp,r]) => `<tr>
          <td>${opp}</td>
          <td class="num">${r.total}</td>
          <td class="num win">${r.w}</td>
          <td class="num loss">${r.l}</td>
          <td class="num draw">${r.d}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="section-title">All Matches</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Test #</th><th>Date</th><th>Opponent</th><th>Venue</th><th>Result</th>
        </tr></thead>
        <tbody>${matches.map(m => {
          const info = m.scorecard?.match_info || {};
          const teams = getTeams(m);
          const opp = teams.find(t => t !== team) || '—';
          const r = resultForTeam(m, team);
          return `<tr>
            <td>${info['Match No.'] || '#'+m.match_number}</td>
            <td>${m.date||''}</td>
            <td>${opp}</td>
            <td>${m.ground || info.Venue || ''}</td>
            <td>${resultBadge(r)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>

  `;
}

document.getElementById('results').innerHTML =
  '<div class="loading"><span class="spinner"></span>Loading country data…</div>';

init();
</script>

</body>
</html>
