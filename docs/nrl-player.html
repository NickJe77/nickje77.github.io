<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NRL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e5e7eb;
  --stripe:#f5f8ff;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1300px;
  margin:auto;
  padding:30px 20px 60px;
}

.player-header{
  margin-bottom:30px;
}

.player-header h1{
  margin:0;
  font-size:40px;
}

.team-bar{
  height:10px;
  border-radius:6px;
  margin-top:10px;
  margin-bottom:20px;
}

.filters{
  display:flex;
  gap:15px;
  margin-bottom:25px;
}

select{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

.summary-section{
  margin-bottom:40px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:20px;
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:25px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.card h2{
  margin:0;
  font-size:28px;
}

.card p{
  margin:5px 0 0 0;
  color:#666;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

th{
  text-align:left;
  font-weight:700;
}

.numeric{
  text-align:center;
}

tbody tr:nth-child(even){
  background:var(--stripe);
}

tbody tr:hover{
  background:#e8f0ff;
}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">

  <div class="player-header">
    <h1 id="playerName">Loading...</h1>
    <div class="team-bar" id="teamBar"></div>
  </div>

  <div class="filters">
    <select id="teamFilter"></select>
    <select id="opponentFilter"></select>
  </div>

  <div class="summary-section">
    <div class="summary-grid">
      <div class="card">
        <h2 id="gamesTotal"></h2>
        <p>Games</p>
      </div>
      <div class="card">
        <h2 id="triesTotal"></h2>
        <p>Total Tries</p>
      </div>
      <div class="card">
        <h2 id="goalsTotal"></h2>
        <p>Total Goals</p>
      </div>
      <div class="card">
        <h2 id="pointsTotal"></h2>
        <p>Total Points</p>
      </div>
      <div class="card">
        <h2 id="avgPoints"></h2>
        <p>Avg Points</p>
      </div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>Team</th>
        <th>Opponent</th>
        <th class="numeric">Tries</th>
        <th class="numeric">Goals</th>
        <th class="numeric">Points</th>
      </tr>
    </thead>
    <tbody id="gamesTable"></tbody>
  </table>

</div>

<script>

const teamColours = {
  "Canberra":"#0054A6",
  "Penrith":"#000000",
  "Brisbane":"#6F2C91",
  "Melbourne":"#5A2D81",
  "Souths":"#00643C",
  "Sydney":"#002B5C",
  "Manly":"#800000",
  "Parramatta":"#003DA5",
  "Canterbury":"#0033A0",
  "Cronulla":"#00A3E0",
  "Warriors":"#111111",
  "Gold Coast":"#FFDD00",
  "North Queensland":"#00205B",
  "Newcastle":"#003E7E",
  "Wests":"#F04E23",
  "Dragons":"#E2231A"
};

const params = new URLSearchParams(window.location.search);
const playerName = params.get("player");

let allRows = [];

async function loadPlayer(){

  document.getElementById("playerName").innerText = playerName;

  const currentYear = new Date().getFullYear();

  for(let y=1998; y<=currentYear; y++){
    try{
      const res = await fetch(`/data/nrl/seasons/${y}.json`);
      const data = await res.json();
      data.forEach(row=>{
        if(row.player === playerName){
          allRows.push(row);
        }
      });
    }catch(e){}
  }

  if(allRows.length === 0) return;

  applyTeamColour();
  populateFilters();
  renderTable();
  updateSummary(allRows);
}

function applyTeamColour(){

  const teamCount = {};
  allRows.forEach(r=>{
    teamCount[r.played_for] = (teamCount[r.played_for] || 0) + 1;
  });

  const mainTeam = Object.keys(teamCount)
    .sort((a,b)=>teamCount[b]-teamCount[a])[0];

  document.getElementById("teamBar").style.background =
    teamColours[mainTeam] || "#333";
}

function populateFilters(){

  const teams = [...new Set(allRows.map(r=>r.played_for))];
  const opponents = [...new Set(allRows.map(r=>r.played_against))];

  const teamSelect = document.getElementById("teamFilter");
  const oppSelect = document.getElementById("opponentFilter");

  teamSelect.innerHTML = `<option value="all">All Teams</option>`;
  oppSelect.innerHTML = `<option value="all">All Opponents</option>`;

  teams.forEach(t=>{
    teamSelect.innerHTML += `<option value="${t}">${t}</option>`;
  });

  opponents.forEach(o=>{
    oppSelect.innerHTML += `<option value="${o}">${o}</option>`;
  });

  teamSelect.onchange = oppSelect.onchange = renderTable;
}

function renderTable(){

  const teamVal = document.getElementById("teamFilter").value;
  const oppVal = document.getElementById("opponentFilter").value;

  const filtered = allRows.filter(r=>
    (teamVal==="all" || r.played_for===teamVal) &&
    (oppVal==="all" || r.played_against===oppVal)
  );

  const tbody = document.getElementById("gamesTable");
  tbody.innerHTML="";

  filtered.forEach(r=>{
    tbody.innerHTML += `
      <tr>
        <td>${r.season}</td>
        <td>${r.played_for}</td>
        <td>${r.played_against}</td>
        <td class="numeric">${r.tries}</td>
        <td class="numeric">${r.goals_made}</td>
        <td class="numeric"><strong>${r.points}</strong></td>
      </tr>
    `;
  });

  updateSummary(filtered);
}

function updateSummary(rows){

  const games = rows.length;
  const tries = rows.reduce((a,b)=>a+b.tries,0);
  const goals = rows.reduce((a,b)=>a+b.goals_made,0);
  const points = rows.reduce((a,b)=>a+b.points,0);

  document.getElementById("gamesTotal").innerText = games;
  document.getElementById("triesTotal").innerText = tries;
  document.getElementById("goalsTotal").innerText = goals;
  document.getElementById("pointsTotal").innerText = points;
  document.getElementById("avgPoints").innerText =
    games ? (points/games).toFixed(2) : "0.00";
}

loadPlayer();

</script>

</body>
</html>
