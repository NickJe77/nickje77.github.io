<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NRL Match</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1100px;margin:auto;padding:30px;}
.hero{background:linear-gradient(90deg,#0055A4,#00A651);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.row{background:white;padding:10px;border-radius:8px;margin-bottom:6px;}
</style>
</head>
<body>
<div class="page">
<div class="hero"><h1 id="title"></h1></div>
<div id="players"></div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
const season=params.get("season");
const match=params.get("match");

fetch("data/nrl/matches/"+season+".json")
.then(r=>r.json())
.then(d=>{
  const game=d.find(g=>g.match_id===match);
  document.getElementById("title").textContent=game.home_team+" vs "+game.away_team;
  const container=document.getElementById("players");
  game.players.forEach(p=>{
    const div=document.createElement("div");
    div.className="row";
    div.textContent=p.player+" ("+p.played_for+") - "+p.points+" pts";
    container.appendChild(div);
  });
});
</script>
</body>
</html>
