<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1300px;
  margin:auto;
  padding:30px 20px 60px;
}

.player-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:20px;
}

h1{
  margin:0;
  font-size:40px;
  line-height:1.1;
}

.search-container{
  position:relative;
}

#searchBox{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
  width:220px;
}

.suggestions{
  position:absolute;
  top:40px;
  left:0;
  right:0;
  background:#fff;
  border:1px solid #ddd;
  border-radius:8px;
  max-height:200px;
  overflow-y:auto;
  display:none;
  z-index:100;
}

.suggestions div{
  padding:8px;
  cursor:pointer;
}

.suggestions div:hover{
  background:#eef1f6;
}

.team-bar{
  height:12px;
  border-radius:6px;
  margin-top:12px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.select{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
  margin-top:10px;
  margin-right:10px;
}

.section-title{
  margin-top:25px;
  margin-bottom:12px;
  font-weight:700;
  font-size:14px;
  letter-spacing:1px;
  color:#666;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:25px;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.card h2{
  margin:0;
  font-size:28px;
}

.reset{
  margin-top:20px;
  padding:6px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  background:#eee;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th, td{
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

th{
  background:#eef1f6;
  font-weight:700;
  cursor:pointer;
}

tbody tr:nth-child(even){
  background:#f5f8ff;
}

tbody tr:hover{
  background:#e8f0ff;
}

.numeric{
  text-align:center;
}

.status{margin:10px 0;color:#666;}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">

<div class="player-header">
  <h1 id="playerName">Loading...</h1>
  <div class="search-container">
    <input type="text" id="searchBox" placeholder="Search player...">
    <div id="suggestions" class="suggestions"></div>
  </div>
</div>

<div class="team-bar" id="teamBar"></div>
<div class="status" id="status"></div>

<div>
  <select id="teamSelect" class="select"></select>
  <select id="oppSelect" class="select"></select>
</div>

<div class="section-title">CAREER SUMMARY</div>
<div class="cards" id="careerCards"></div>

<div class="section-title">VS SELECTED OPPONENT</div>
<div class="cards" id="oppCards"></div>

<button class="reset" onclick="resetSort()">Reset Sort</button>

<table>
<thead>
<tr>
<th onclick="sortTable('season')">Season</th>
<th onclick="sortTable('team')">Team</th>
<th onclick="sortTable('opp')">Opponent</th>
<th onclick="sortTable('tries')">Tries</th>
<th onclick="sortTable('goals')">Goals</th>
<th onclick="sortTable('points')">Points</th>
</tr>
</thead>
<tbody id="gameTable"></tbody>
</table>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const player = params.get("player");

const playerNameEl = document.getElementById("playerName");
const teamBar      = document.getElementById("teamBar");
const teamSelect   = document.getElementById("teamSelect");
const oppSelect    = document.getElementById("oppSelect");
const careerCards  = document.getElementById("careerCards");
const oppCards     = document.getElementById("oppCards");
const searchBox    = document.getElementById("searchBox");
const suggestions  = document.getElementById("suggestions");
const statusEl     = document.getElementById("status");

let games = [];
let allPlayers = new Set();
let currentSort = null;
let sortAsc = false;

if(player) playerNameEl.textContent = player;

const teamColours = {
  "Brisbane Broncos":"linear-gradient(90deg,#6F2C91,#FDBB30)",
  "Melbourne Storm":"linear-gradient(90deg,#5A2D81,#002B5C)",
  "Canberra Raiders":"linear-gradient(90deg,#00643C,#0054A6)",
  "Penrith Panthers":"linear-gradient(90deg,#000000,#00A3E0,#D50032)",
  "South Sydney Rabbitohs":"linear-gradient(90deg,#00643C,#C8102E)",
  "Sydney Roosters":"linear-gradient(90deg,#002B5C,#C8102E)",
  "Manly-Warringah Sea Eagles":"linear-gradient(90deg,#800000,#ffffff)",
  "Parramatta Eels":"linear-gradient(90deg,#003DA5,#FDBB30)",
  "Canterbury-Bankstown Bulldogs":"linear-gradient(90deg,#0033A0,#ffffff)",
  "Cronulla-Sutherland Sharks":"linear-gradient(90deg,#00A3E0,#000000)",
  "New Zealand Warriors":"linear-gradient(90deg,#111111,#8A1538)",
  "Gold Coast Titans":"linear-gradient(90deg,#00205B,#FFDD00)",
  "North Queensland Cowboys":"linear-gradient(90deg,#00205B,#FDBB30)",
  "Newcastle Knights":"linear-gradient(90deg,#003E7E,#C8102E)",
  "Wests Tigers":"linear-gradient(90deg,#F04E23,#000000)",
  "St. George Illawarra Dragons":"linear-gradient(90deg,#E2231A,#ffffff)"
};

fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{
  statusEl.textContent = "Loading player data...";
  return Promise.all(
    index.seasons.map(y=>
      fetch("data/nrl/seasons/"+y+".json")
      .then(r=>r.json())
      .then(matches=>{
        matches.forEach(match=>{
          const opp_home = match.away_team;
          const opp_away = match.home_team;
          (match.players || []).forEach(p=>{
            allPlayers.add(p.player);
            if(p.player === player){
              const opp = p.played_for === match.home_team ? opp_home : opp_away;
              games.push({
                season: match.season || y,
                team: p.played_for,
                opp: opp,
                tries: p.tries || 0,
                goals: (p.conversions || 0) + (p.penalty_goals || 0),
                points: p.points || 0
              });
            }
          });
        });
      })
    )
  );
})
.then(()=>{
  statusEl.textContent = "";

  if(!games.length){
    playerNameEl.textContent = player || "Player not found";
    return;
  }

  const teamCount = {};
  games.forEach(g=>{
    teamCount[g.team] = (teamCount[g.team]||0)+1;
  });
  const mainTeam = Object.keys(teamCount).sort((a,b)=>teamCount[b]-teamCount[a])[0];
  teamBar.style.background = teamColours[mainTeam] || "#ccc";

  const teams = [...new Set(games.map(g=>g.team))];
  const opps  = [...new Set(games.map(g=>g.opp))];

  teamSelect.innerHTML =
    `<option value="all">All Teams</option>` +
    teams.map(t=>`<option>${t}</option>`).join("");

  oppSelect.innerHTML =
    `<option value="all">All Opponents</option>` +
    opps.map(o=>`<option>${o}</option>`).join("");

  teamSelect.onchange = render;
  oppSelect.onchange  = render;

  render();
});

function render(){
  let filtered = games;
  if(teamSelect.value !== "all") filtered = filtered.filter(g=>g.team===teamSelect.value);
  if(oppSelect.value !== "all")  filtered = filtered.filter(g=>g.opp===oppSelect.value);
  renderCareer(games);
  renderOpp(filtered);
  renderTable(filtered);
}

function renderCareer(data){
  const totalGames  = data.length;
  const totalTries  = data.reduce((a,b)=>a+b.tries,0);
  const totalGoals  = data.reduce((a,b)=>a+b.goals,0);
  const totalPoints = data.reduce((a,b)=>a+b.points,0);
  const avgPoints   = totalGames ? (totalPoints/totalGames).toFixed(2) : 0;
  careerCards.innerHTML = `
  <div class="card"><h2>${totalGames}</h2><div>Games</div></div>
  <div class="card"><h2>${totalTries}</h2><div>Total Tries</div></div>
  <div class="card"><h2>${totalGoals}</h2><div>Total Goals</div></div>
  <div class="card"><h2>${totalPoints}</h2><div>Total Points</div></div>
  <div class="card"><h2>${avgPoints}</h2><div>Avg Points</div></div>
  `;
}

function renderOpp(data){
  const gamesCount  = data.length;
  const bestPoints  = data.length ? Math.max(...data.map(g=>g.points)) : 0;
  const totalPoints = data.reduce((a,b)=>a+b.points,0);
  const avgPoints   = gamesCount ? (totalPoints/gamesCount).toFixed(2) : 0;
  oppCards.innerHTML = `
  <div class="card"><h2>${gamesCount}</h2><div>Games</div></div>
  <div class="card"><h2>${bestPoints}</h2><div>Best Points</div></div>
  <div class="card"><h2>${avgPoints}</h2><div>Avg Points</div></div>
  `;
}

function renderTable(data){
  document.getElementById("gameTable").innerHTML = data.map(g=>`
    <tr>
      <td>${g.season}</td>
      <td>${g.team}</td>
      <td>${g.opp}</td>
      <td class="numeric">${g.tries}</td>
      <td class="numeric">${g.goals}</td>
      <td class="numeric">${g.points}</td>
    </tr>
  `).join("");
}

function sortTable(key){
  sortAsc = currentSort === key ? !sortAsc : false;
  currentSort = key;
  games.sort((a,b)=>{
    if(a[key]<b[key]) return sortAsc?-1:1;
    if(a[key]>b[key]) return sortAsc?1:-1;
    return 0;
  });
  render();
}

function resetSort(){
  currentSort = null;
  sortAsc = false;
  render();
}

let searchTimeout = null;
searchBox.addEventListener("input", function(){
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(()=>{
    const value = this.value.trim().toLowerCase();
    suggestions.innerHTML = "";
    if(value.length < 2){ suggestions.style.display="none"; return; }
    const all = [...allPlayers];
    const startsWith = all.filter(n=>n.toLowerCase().startsWith(value));
    const contains   = all.filter(n=>!n.toLowerCase().startsWith(value)&&n.toLowerCase().includes(value));
    const matches    = [...startsWith,...contains].slice(0,10);
    matches.forEach(name=>{
      const div = document.createElement("div");
      div.textContent = name;
      div.onclick = ()=>{ window.location="nrl-player.html?player="+encodeURIComponent(name); };
      suggestions.appendChild(div);
    });
    suggestions.style.display = matches.length?"block":"none";
  }, 120);
});

searchBox.addEventListener("keydown", function(e){
  if(e.key==="Enter"){
    const value = this.value.trim();
    if(!value) return;
    window.location = "nrl-player.html?player="+encodeURIComponent(value);
  }
});

document.addEventListener("click", function(e){
  if(!e.target.closest(".search-container")) suggestions.style.display="none";
});

</script>
</body>
</html>
