<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NRL Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1100px;margin:auto;padding:30px;}
.hero{background:linear-gradient(90deg,#0055A4,#00A651);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.stats{display:flex;gap:20px;margin-bottom:20px;}
.stat{background:white;padding:20px;border-radius:12px;flex:1;text-align:center;}
.stat h2{margin:0;font-size:28px;}
.row{background:white;padding:10px;border-radius:8px;margin-bottom:6px;}
</style>
</head>
<body>
<div class="page">
<div class="hero">
  <h1 id="playerName">Loading...</h1>
</div>

<div class="stats">
  <div class="stat">
    <h2 id="games">0</h2>
    <div>Games</div>
  </div>
  <div class="stat">
    <h2 id="points">0</h2>
    <div>Total Points</div>
  </div>
</div>

<div id="matches"></div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
const player=params.get("player");

if(!player){
  document.getElementById("playerName").textContent="No player selected";
}else{
  document.getElementById("playerName").textContent=player;

  fetch("data/nrl/index.json")
  .then(r=>r.json())
  .then(index=>{

    const seasons=index.seasons;
    let allRows=[];

    const fetches=seasons.map(season=>
      fetch("data/nrl/seasons/"+season+".json")
      .then(r=>r.json())
    );

    Promise.all(fetches).then(results=>{

      results.forEach(seasonData=>{
        seasonData.forEach(row=>{
          if(row.player===player){
            allRows.push(row);
          }
        });
      });

      document.getElementById("games").textContent=allRows.length;

      const totalPoints=allRows.reduce((sum,r)=>sum+(r.points||0),0);
      document.getElementById("points").textContent=totalPoints;

      const container=document.getElementById("matches");

      allRows.forEach(r=>{
        const div=document.createElement("div");
        div.className="row";
        div.textContent=
          r.season+" - "+
          r.played_for+" vs "+
          r.played_against+" - "+
          (r.points||0)+" pts";
        container.appendChild(div);
      });

    });

  });
}
</script>
</body>
</html>
