<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NRL Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}

.page{max-width:1200px;margin:auto;padding:30px;}

h1{margin:0 0 20px;font-size:40px;}

.cards{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.card{
  flex:1;
  min-width:160px;
  background:#e9edf3;
  border-radius:14px;
  padding:20px;
  text-align:center;
}

.card h2{
  margin:0;
  font-size:30px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #ddd;
}

th{background:#e2e6ec;}
</style>
</head>
<body>

<div class="page">

<h1 id="playerName">Loading...</h1>

<div class="cards" id="summary"></div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Team</th>
<th>Opponent</th>
<th>Points</th>
<th>Tries</th>
</tr>
</thead>
<tbody id="games"></tbody>
</table>

</div>

<script>

const params=new URLSearchParams(window.location.search);
const player=params.get("player");

if(!player){
  document.getElementById("playerName").textContent="No player selected";
}else{

document.getElementById("playerName").textContent=player;

fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{

  const fetches=index.seasons.map(s=>
    fetch("data/nrl/seasons/"+s+".json").then(r=>r.json())
  );

  Promise.all(fetches).then(seasons=>{

    let games=[];

    seasons.forEach(matches=>{
      matches.forEach(match=>{
        if(match.players){
          match.players.forEach(p=>{
            if(p.player === player){
              games.push({
                season: match.season,
                team: p.played_for || match.home_team,
                opponent: (match.home_team===p.played_for)
                  ? match.away_team
                  : match.home_team,
                points: p.points || 0,
                tries: p.tries || 0
              });
            }
          });
        }
      });
    });

    buildPage(games);
  });
});
}

function buildPage(games){

  const totalGames=games.length;
  const totalPoints=games.reduce((a,b)=>a+b.points,0);
  const totalTries=games.reduce((a,b)=>a+b.tries,0);
  const avgPoints=(totalPoints/totalGames||0).toFixed(1);
  const avgTries=(totalTries/totalGames||0).toFixed(2);
  const bestPoints=Math.max(...games.map(g=>g.points),0);
  const bestTries=Math.max(...games.map(g=>g.tries),0);

  document.getElementById("summary").innerHTML=`
    <div class="card"><h2>${totalGames}</h2>Games</div>
    <div class="card"><h2>${bestPoints}</h2>Best Points</div>
    <div class="card"><h2>${bestTries}</h2>Best Tries</div>
    <div class="card"><h2>${avgPoints}</h2>Avg Points</div>
    <div class="card"><h2>${avgTries}</h2>Avg Tries</div>
  `;

  const tbody=document.getElementById("games");
  tbody.innerHTML="";

  games.forEach(g=>{
    tbody.innerHTML+=`
      <tr>
        <td>${g.season}</td>
        <td>${g.team}</td>
        <td>${g.opponent}</td>
        <td>${g.points}</td>
        <td>${g.tries}</td>
      </tr>
    `;
  });
}

</script>

</body>
</html>
