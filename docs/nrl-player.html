<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c1118;
  --board-2:#141c26;
  --board-line:rgba(255,255,255,.10);
  --win:#ffffff;
  --lose:rgba(255,255,255,.42);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

.page{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero header (matches game/season pages) ─────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:22px 26px 26px;
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;}
.hero .eyebrow{
  display:flex;align-items:center;gap:8px;
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);
  margin-bottom:8px;
}
.hero .eyebrow .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,40px);
  letter-spacing:.01em;text-transform:uppercase;line-height:1.05;color:#fff;
}

.search-container{position:relative;}
#searchBox{
  padding:10px 16px;border-radius:999px;border:1px solid var(--board-line);
  background:rgba(255,255,255,.08);font-family:var(--body);font-size:13.5px;font-weight:500;
  width:220px;color:#fff;
}
#searchBox::placeholder{color:rgba(255,255,255,.45);}
#searchBox:focus{outline:none;border-color:rgba(255,255,255,.35);}
.suggestions{
  position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;max-height:220px;overflow-y:auto;display:none;z-index:100;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.suggestions div{padding:10px 14px;cursor:pointer;font-size:13.5px;color:var(--ink);}
.suggestions div:hover{background:#f0f6ff;}

.status{color:var(--muted);font-size:13px;font-weight:600;margin:8px 0;}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}

.section-title{
  margin-top:28px;margin-bottom:12px;font-family:var(--display);font-weight:600;
  font-size:13px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;
}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 16px;text-align:center;
}
.card h2{margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:.01em;}
.card p{margin:0;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}

.tabs.segment{
  display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px;gap:2px;margin-bottom:14px;max-width:100%;
  overflow-x:auto;scrollbar-width:none;
}
.tabs.segment::-webkit-scrollbar{display:none;}
.tab{
  padding:8px 16px;border-radius:999px;background:transparent;cursor:pointer;font-size:13px;
  font-weight:600;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s;
}
.tab:hover{color:var(--ink);}
.tab.active{background:var(--ink);color:#fff;}

.table-wrap{
  overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px;}
th,td{padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center;}
th{
  background:#f7f9fb;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none;
}
th:first-child,td:first-child{text-align:left;}
th:hover{color:var(--ink);}
td{color:#27313c;font-variant-numeric:tabular-nums;}
tbody tr:hover{background:#f0f6ff;cursor:pointer;}
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="eyebrow" id="heroEyebrow"><span class="swatch" id="teamSwatch"></span><span id="teamLabel">Loading…</span></div>
        <h1 id="playerName">Loading...</h1>
      </div>
      <div class="search-container">
        <input type="text" id="searchBox" placeholder="Search player...">
        <div id="suggestions" class="suggestions"></div>
      </div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="filters">
    <select id="teamSelect"></select>
    <select id="oppSelect"></select>
    <select id="seasonSelect"></select>
  </div>

  <div class="section-title">Career Summary</div>
  <div class="cards" id="careerCards"></div>

  <div class="section-title">Filtered Stats</div>
  <div class="cards" id="filteredCards"></div>

  <div class="tabs segment" id="statTabs"></div>
  <div class="table-wrap">
    <table id="gameTable">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const STAT_GROUPS = {
  "Scoring": [
    {key:"tries",         label:"Tries"},
    {key:"penalty_tries", label:"Pen Tries"},
    {key:"conversions",   label:"Conv"},
    {key:"penalty_goals", label:"PGs"},
    {key:"field_goals",   label:"FGs"},
    {key:"points",        label:"Points"},
  ],
  "Attack": [
    {key:"runs",               label:"Runs"},
    {key:"metres_gained",      label:"Metres"},
    {key:"post_contact_metres",label:"PCM"},
    {key:"line_breaks",        label:"LBs"},
    {key:"line_break_assists", label:"LB Ass"},
    {key:"tackle_breaks",      label:"TB"},
    {key:"offloads",           label:"Offloads"},
    {key:"try_assists",        label:"Try Ass"},
    {key:"passes",             label:"Passes"},
  ],
  "Running": [
    {key:"hitups",            label:"Hitups"},
    {key:"hitup_metres",      label:"HU Metres"},
    {key:"dummy_half_runs",   label:"DH Runs"},
    {key:"dummy_half_metres", label:"DH Metres"},
    {key:"kick_return_runs",  label:"KR Runs"},
    {key:"kick_return_metres",label:"KR Metres"},
    {key:"normal_runs",       label:"Norm Runs"},
    {key:"normal_run_metres", label:"Norm Metres"},
  ],
  "Kicking": [
    {key:"kicks_general_play",label:"Kicks"},
    {key:"kick_metres",       label:"Kick M"},
    {key:"forty_twenties",    label:"40/20"},
    {key:"goal_line_dropouts",label:"GLDs"},
  ],
  "Defence": [
    {key:"tackles",            label:"Tackles"},
    {key:"missed_tackles",     label:"Miss Tkl"},
    {key:"ineffective_tackles",label:"Ineff Tkl"},
    {key:"try_saves",          label:"Try Saves"},
    {key:"intercepts",         label:"Intercepts"},
    {key:"kicks_caught",       label:"Kicks Ct"},
  ],
  "Discipline": [
    {key:"errors",             label:"Errors"},
    {key:"handling_errors",    label:"Hand Err"},
    {key:"penalties_conceded", label:"Penalties"},
    {key:"sin_bins_10min",     label:"10 Min SB"},
    {key:"send_offs",          label:"Send Offs"},
    {key:"on_reports",         label:"On Reports"},
  ],
};

const teamColours = {
  "Brisbane Broncos":"#6F1A78","Melbourne Storm":"#5A2D81","Canberra Raiders":"#0054A6",
  "Penrith Panthers":"#111111","South Sydney Rabbitohs":"#00643C","Sydney Roosters":"#002B5C",
  "Manly-Warringah Sea Eagles":"#800000","Parramatta Eels":"#003DA5","Canterbury-Bankstown Bulldogs":"#0033A0",
  "Cronulla-Sutherland Sharks":"#00A3E0","New Zealand Warriors":"#1A1A1A","Gold Coast Titans":"#0085CA",
  "North Queensland Cowboys":"#002B5C","Newcastle Knights":"#003E7E","Wests Tigers":"#F04E23",
  "St. George Illawarra Dragons":"#E2231A",
};

const params   = new URLSearchParams(window.location.search);
const player   = params.get("player");
let games      = [];
let allPlayers = new Set();
let activeGroup= "Scoring";
let currentSort= null;
let sortAsc    = false;

document.getElementById("playerName").textContent = player || "Player";

fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{
  document.getElementById("status").textContent = "Loading...";
  return Promise.all(
    index.seasons.map(y=>
      fetch("data/nrl/seasons/"+y+".json")
      .then(r=>r.json())
      .then(matches=>{
        matches.forEach(match=>{

          // CHANGED: whatever process uploads season JSON (the old
          // zip pipeline, or season files uploaded directly, as
          // 2026.json has been since) has repeatedly produced matches
          // where the same player_id appears more than once in
          // "players" - identical duplicate rows, not different
          // players. This inflates every stat and the game count for
          // anyone affected, and it's happened more than once with
          // different upload methods, so rather than relying on a fix
          // living in one particular upload pipeline, it's deduped
          // right here at load time - safe regardless of how the data
          // arrives. This only removes EXACT duplicate rows for the
          // same player_id within the same match; it does not try to
          // guess which rows are "real" games (see the KNOWN_BAD_ROWS
          // exclusion below for that - a different, evidence-checked
          // problem, not a duplicate-row one).
          const seenIds = new Set();
          const dedupedPlayers = [];
          for(const p of (match.players||[])){
            const idKey = p.player_id || (p.player+"|"+p.played_for);
            if(seenIds.has(idKey)) continue;
            seenIds.add(idKey);
            dedupedPlayers.push(p);
          }

          dedupedPlayers.forEach(p=>{
            allPlayers.add(p.player);
            if(p.player === player){

              // CHANGED: docs/data/nrl/seasons/2021.json contains one
              // row that never actually happened - Jai Arrow listed
              // for South Sydney in a "Round 25" 2021 match
              // (match_id 113552506) that doesn't exist in his real
              // career log; he was named in the squad (jersey 18) but
              // never took the field. That single row was inflating
              // his career game count by one (101 with an earlier
              // duplicate-row bug already fixed elsewhere, then 100
              // even after that fix, when it should be 99).
              //
              // An earlier version of this filter tried to catch this
              // generally (any row with jersey > 17 and every stat at
              // zero), on the theory that jersey 18+ means an unused
              // extended-squad player. That turned out to be wrong: a
              // verified real game - his 2026 Round 26 appearance,
              // jersey 23, also all-zero stats, but confirmed as
              // career game #179 in his official log - has exactly
              // the same shape and would have been wrongly excluded
              // too. So this is a specific, evidence-checked
              // exclusion for the one row confirmed to be wrong, not
              // a general rule - the same "jersey 18+/all-zero"
              // pattern elsewhere on the site has NOT been verified
              // and should not be assumed to be a phantom row without
              // checking it the same way this one was checked.
              const KNOWN_BAD_ROWS = new Set([
                "113552506|991249", // Jai Arrow, 2021 "Round 25" - never happened, not in his real career log
              ]);
              const rowKey = (match.match_id||"") + "|" + (p.player_id||"");
              if(KNOWN_BAD_ROWS.has(rowKey)) return;

              const isHome = p.played_for === match.home_team;
              games.push({
                season:   match.season || y,
                match_id: match.match_id,
                team:     p.played_for,
                opp:      isHome ? match.away_team : match.home_team,
                round:    match.round || "",
                date:     match.date  || "",
                venue:    match.venue || "",
                // all stats
                tries:              p.tries||0,
                penalty_tries:      p.penalty_tries||0,
                conversions:        p.conversions||0,
                penalty_goals:      p.penalty_goals||0,
                field_goals:        p.field_goals||0,
                points:             p.points||0,
                runs:               p.runs||0,
                metres_gained:      p.metres_gained||0,
                post_contact_metres:p.post_contact_metres||0,
                line_breaks:        p.line_breaks||0,
                line_break_assists: p.line_break_assists||0,
                tackle_breaks:      p.tackle_breaks||0,
                offloads:           p.offloads||0,
                try_assists:        p.try_assists||0,
                passes:             p.passes||0,
                hitups:             p.hitups||0,
                hitup_metres:       p.hitup_metres||0,
                dummy_half_runs:    p.dummy_half_runs||0,
                dummy_half_metres:  p.dummy_half_metres||0,
                kick_return_runs:   p.kick_return_runs||0,
                kick_return_metres: p.kick_return_metres||0,
                normal_runs:        p.normal_runs||0,
                normal_run_metres:  p.normal_run_metres||0,
                kicks_general_play: p.kicks_general_play||0,
                kick_metres:        p.kick_metres||0,
                forty_twenties:     p.forty_twenties||0,
                goal_line_dropouts: p.goal_line_dropouts||0,
                tackles:            p.tackles||0,
                missed_tackles:     p.missed_tackles||0,
                ineffective_tackles:p.ineffective_tackles||0,
                try_saves:          p.try_saves||0,
                intercepts:         p.intercepts||0,
                kicks_caught:       p.kicks_caught||0,
                errors:             p.errors||0,
                handling_errors:    p.handling_errors||0,
                penalties_conceded: p.penalties_conceded||0,
                sin_bins_10min:     p.sin_bins_10min||0,
                send_offs:          p.send_offs||0,
                on_reports:         p.on_reports||0,
              });
            }
          });
        });
      })
    )
  );
})
.then(()=>{
  document.getElementById("status").textContent = "";
  if(!games.length) return;

  // Team swatch + label
  const teamCount = {};
  games.forEach(g=>{ teamCount[g.team]=(teamCount[g.team]||0)+1; });
  const mainTeam = Object.keys(teamCount).sort((a,b)=>teamCount[b]-teamCount[a])[0];
  document.getElementById("teamSwatch").style.background = teamColours[mainTeam]||"#5a6472";
  document.getElementById("teamLabel").textContent = mainTeam+"  ·  "+games.length+" games";

  // Filters
  const teams   = [...new Set(games.map(g=>g.team))].sort();
  const opps    = [...new Set(games.map(g=>g.opp))].sort();
  const seasons = [...new Set(games.map(g=>String(g.season)))].sort();

  buildSelect("teamSelect",   teams,   "All Teams");
  buildSelect("oppSelect",    opps,    "All Opponents");
  buildSelect("seasonSelect", seasons, "All Seasons");

  document.getElementById("teamSelect").onchange   = render;
  document.getElementById("oppSelect").onchange    = render;
  document.getElementById("seasonSelect").onchange = render;

  buildTabs();
  render();
});

function buildSelect(id, options, placeholder){
  const sel = document.getElementById(id);
  sel.innerHTML = `<option value="all">${placeholder}</option>` +
    options.map(o=>`<option value="${o}">${o}</option>`).join("");
}

function buildTabs(){
  const div = document.getElementById("statTabs");
  div.innerHTML = "";
  Object.keys(STAT_GROUPS).forEach(group=>{
    const tab = document.createElement("div");
    tab.className = "tab"+(group===activeGroup?" active":"");
    tab.textContent = group;
    tab.onclick = ()=>{ activeGroup=group; buildTabs(); renderTable(getFiltered()); };
    div.appendChild(tab);
  });
}

function getFiltered(){
  const team   = document.getElementById("teamSelect").value;
  const opp    = document.getElementById("oppSelect").value;
  const season = document.getElementById("seasonSelect").value;
  return games.filter(g=>
    (team==="all"  || g.team===team) &&
    (opp==="all"   || g.opp===opp) &&
    (season==="all"|| String(g.season)===season)
  );
}

function sum(data, key){ return data.reduce((a,g)=>a+(g[key]||0),0); }
function avg(data, key){ return data.length?(sum(data,key)/data.length).toFixed(1):0; }
function best(data, key){ return data.length?Math.max(...data.map(g=>g[key]||0)):0; }

function render(){
  const filtered = getFiltered();
  renderCareer();
  renderFiltered(filtered);
  renderTable(filtered);
}

function renderCareer(){
  document.getElementById("careerCards").innerHTML = `
    <div class="card"><h2>${games.length}</h2><p>Games</p></div>
    <div class="card"><h2>${sum(games,"tries")}</h2><p>Tries</p></div>
    <div class="card"><h2>${sum(games,"points")}</h2><p>Points</p></div>
    <div class="card"><h2>${avg(games,"points")}</h2><p>Avg Points</p></div>
    <div class="card"><h2>${sum(games,"runs")}</h2><p>Runs</p></div>
    <div class="card"><h2>${sum(games,"metres_gained")}</h2><p>Metres</p></div>
    <div class="card"><h2>${sum(games,"tackles")}</h2><p>Tackles</p></div>
    <div class="card"><h2>${sum(games,"offloads")}</h2><p>Offloads</p></div>
  `;
}

function renderFiltered(data){
  document.getElementById("filteredCards").innerHTML = `
    <div class="card"><h2>${data.length}</h2><p>Games</p></div>
    <div class="card"><h2>${sum(data,"tries")}</h2><p>Tries</p></div>
    <div class="card"><h2>${sum(data,"points")}</h2><p>Points</p></div>
    <div class="card"><h2>${avg(data,"points")}</h2><p>Avg Points</p></div>
    <div class="card"><h2>${best(data,"points")}</h2><p>Best Points</p></div>
    <div class="card"><h2>${sum(data,"runs")}</h2><p>Runs</p></div>
    <div class="card"><h2>${avg(data,"metres_gained")}</h2><p>Avg Metres</p></div>
    <div class="card"><h2>${sum(data,"tackles")}</h2><p>Tackles</p></div>
  `;
}

function renderTable(data){
  const cols  = STAT_GROUPS[activeGroup];
  const table = document.getElementById("gameTable");

  table.querySelector("thead").innerHTML = `<tr>
    <th onclick="sortBy('season')">Season</th>
    <th onclick="sortBy('round')">Rnd</th>
    <th onclick="sortBy('team')">Team</th>
    <th onclick="sortBy('opp')">Opponent</th>
    ${cols.map(c=>`<th onclick="sortBy('${c.key}')">${c.label}</th>`).join("")}
  </tr>`;

  table.querySelector("tbody").innerHTML = data.map(g=>`
    <tr onclick="window.location='nrl-game.html?season=${g.season}&match=${g.match_id}'">
      <td>${g.season}</td>
      <td>${g.round}</td>
      <td>${g.team}</td>
      <td>${g.opp}</td>
      ${cols.map(c=>`<td>${g[c.key]}</td>`).join("")}
    </tr>
  `).join("");
}

function sortBy(key){
  sortAsc = currentSort===key ? !sortAsc : false;
  currentSort = key;
  games.sort((a,b)=>{
    const av = isNaN(a[key]) ? (a[key]||"") : Number(a[key]);
    const bv = isNaN(b[key]) ? (b[key]||"") : Number(b[key]);
    if(av<bv) return sortAsc?-1:1;
    if(av>bv) return sortAsc?1:-1;
    return 0;
  });
  renderTable(getFiltered());
}

// Search
let searchTimeout = null;
document.getElementById("searchBox").addEventListener("input", function(){
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(()=>{
    const val = this.value.trim().toLowerCase();
    const sug = document.getElementById("suggestions");
    sug.innerHTML = "";
    if(val.length < 2){ sug.style.display="none"; return; }
    const all = [...allPlayers];
    const matches = [
      ...all.filter(n=>n.toLowerCase().startsWith(val)),
      ...all.filter(n=>!n.toLowerCase().startsWith(val)&&n.toLowerCase().includes(val))
    ].slice(0,10);
    matches.forEach(name=>{
      const div = document.createElement("div");
      div.textContent = name;
      div.onclick = ()=>{ window.location="nrl-player.html?player="+encodeURIComponent(name); };
      sug.appendChild(div);
    });
    sug.style.display = matches.length?"block":"none";
  }, 120);
});

document.getElementById("searchBox").addEventListener("keydown", function(e){
  if(e.key==="Enter" && this.value.trim())
    window.location = "nrl-player.html?player="+encodeURIComponent(this.value.trim());
});

document.addEventListener("click", function(e){
  if(!e.target.closest(".search-container"))
    document.getElementById("suggestions").style.display="none";
});
</script>
</body>
</html>
