<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NRL Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1100px;margin:auto;padding:30px;}

.top-nav{
  text-align:center;
  margin-bottom:20px;
}
.top-nav a{
  text-decoration:none;
  color:#0056d6;
  font-weight:600;
  margin:0 10px;
}

.hero{
  background:linear-gradient(90deg,#0055A4,#00A651);
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:30px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:20px;
}

.stat{
  background:white;
  padding:15px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.stat h2{
  margin:0;
  font-size:22px;
}

.stat span{
  color:#666;
  font-size:13px;
}

.section-title{
  font-weight:800;
  margin:30px 0 10px;
}

.game-row{
  background:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:6px;
  display:flex;
  justify-content:space-between;
  font-size:14px;
}
</style>
</head>
<body>

<div class="page">

<div class="top-nav">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</div>

<div class="hero">
  <h1 id="playerName"></h1>
  <div id="careerStats" class="stats"></div>
</div>

<div class="section-title">Games</div>
<div id="games"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerName = params.get("player");

if(!playerName){
  document.body.innerHTML = "No player selected.";
}

document.getElementById("playerName").textContent = playerName;

let totalGames = 0;
let totalTries = 0;
let totalGoals = 0;
let totalPoints = 0;
let allGames = [];

fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{
  const seasons = index.seasons || [];

  const seasonPromises = seasons.map(season =>
    fetch("data/nrl/seasons/" + season + ".json")
      .then(r=>r.json())
      .then(rows=>{
        rows.forEach(row=>{
          if(row.player === playerName){
            totalGames++;
            totalTries += row.tries || 0;
            totalGoals += row.goals_made || 0;
            totalPoints += row.points || 0;

            allGames.push({
              season: season,
              match_id: row.match_id,
              team: row.played_for,
              opponent: row.played_against,
              tries: row.tries || 0,
              goals: row.goals_made || 0,
              points: row.points || 0
            });
          }
        });
      })
  );

  return Promise.all(seasonPromises);
})
.then(()=>{

  document.getElementById("careerStats").innerHTML = `
    <div class="stat"><h2>${totalGames}</h2><span>Games</span></div>
    <div class="stat"><h2>${totalTries}</h2><span>Total Tries</span></div>
    <div class="stat"><h2>${totalGoals}</h2><span>Total Goals</span></div>
    <div class="stat"><h2>${totalPoints}</h2><span>Total Points</span></div>
  `;

  const gamesDiv = document.getElementById("games");

  allGames.sort((a,b)=>b.season - a.season);

  allGames.forEach(g=>{
    gamesDiv.innerHTML += `
      <div class="game-row">
        <div>
          ${g.season} – ${g.team} vs ${g.opponent}
        </div>
        <div>
          ${g.points} pts
        </div>
      </div>
    `;
  });

})
.catch(err=>{
  document.body.innerHTML = "Error loading player data.";
  console.error(err);
});
</script>

</body>
</html>
