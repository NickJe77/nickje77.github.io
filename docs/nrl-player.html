<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NRL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

h1{
  margin:0;
  font-size:40px;
}

.team-bar{
  height:14px;
  border-radius:8px;
  margin:15px 0 25px 0;
  background:#ddd;
}

.search-wrap{
  position:relative;
}

.search{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
  width:260px;
}

.suggestions{
  position:absolute;
  top:42px;
  width:100%;
  background:white;
  border:1px solid #ddd;
  border-radius:8px;
  max-height:220px;
  overflow-y:auto;
  display:none;
  z-index:999;
}

.suggestion{
  padding:8px 12px;
  cursor:pointer;
}

.suggestion:hover{
  background:#eef1f6;
}

.section-title{
  margin-top:20px;
  margin-bottom:10px;
  font-weight:700;
  font-size:14px;
  letter-spacing:1px;
  color:#666;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
}

.card{
  background:#fff;
  padding:24px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,0.05);
}

.card h2{
  margin:0;
  font-size:30px;
}

.card div{
  margin-top:6px;
  font-size:14px;
  color:#666;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  background:white;
  border-radius:14px;
  overflow:hidden;
}

th{
  background:#eef1f6;
  padding:10px;
  font-weight:700;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
  text-align:center;
}

td:first-child,
td:nth-child(2),
td:nth-child(3),
td:nth-child(4){
  text-align:left;
}

tr:hover{
  background:#f9fbff;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</div>

<div class="page">

<div class="top-row">
  <h1 id="playerName"></h1>

  <div class="search-wrap">
    <input type="text" class="search" placeholder="Search player..." id="searchBox">
    <div class="suggestions" id="suggestions"></div>
  </div>
</div>

<div class="team-bar" id="teamBar"></div>

<div class="section-title">CAREER SUMMARY</div>
<div class="cards" id="careerCards"></div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Round</th>
<th>Team</th>
<th>Opponent</th>
<th>Tries</th>
<th>Goals</th>
<th>Points</th>
</tr>
</thead>
<tbody id="gameTable"></tbody>
</table>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const player = params.get("player");
const playerNameEl = document.getElementById("playerName");
const teamBar = document.getElementById("teamBar");
const searchBox = document.getElementById("searchBox");
const suggestionsBox = document.getElementById("suggestions");

let games = [];
let allPlayers = new Set();

/* TEAM COLOUR MAP */
const teamColours = {
  "Brisbane":"linear-gradient(90deg,#6F2C91,#FDBB30)",
  "Canberra":"linear-gradient(90deg,#00A651,#00471B)",
  "Souths":"linear-gradient(90deg,#006341,#D50032)",
  "Roosters":"linear-gradient(90deg,#00205B,#C8102E)",
  "Bulldogs":"linear-gradient(90deg,#003DA5,#FFFFFF)",
  "Storm":"linear-gradient(90deg,#4B2E83,#FFD100)",
  "Eels":"linear-gradient(90deg,#0033A0,#FDBB30)",
  "Cowboys":"linear-gradient(90deg,#00205B,#A6192E)",
  "Warriors":"linear-gradient(90deg,#000000,#FFFFFF)",
  "Sharks":"linear-gradient(90deg,#008C95,#000000)"
};

if(player){
  playerNameEl.textContent = player;
}

fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{
  const seasons = index.seasons;

  return Promise.all(
    seasons.map(y=>
      fetch("data/nrl/seasons/"+y+".json")
      .then(r=>r.json())
      .then(rows=>{
        rows.forEach(row=>{
          allPlayers.add(row.player);
          if(row.player === player){
            games.push({
              season:y,
              round:row.round || "",
              team:row.played_for,
              opp:row.played_against,
              tries:row.tries || 0,
              goals:row.goals_made || 0,
              points:row.points || 0
            });
          }
        });
      })
    )
  );
})
.then(initPage);

function initPage(){

  if(games.length){
    const team = games[0].team;
    if(teamColours[team]){
      teamBar.style.background = teamColours[team];
    }
  }

  renderCareer();
  renderTable(games);

  /* SEARCH AUTOCOMPLETE */
  searchBox.addEventListener("input", function(){
    const value = this.value.toLowerCase();
    suggestionsBox.innerHTML = "";

    if(value.length < 2){
      suggestionsBox.style.display = "none";
      return;
    }

    const matches = [...allPlayers]
      .filter(p=>p.toLowerCase().includes(value))
      .slice(0,8);

    matches.forEach(name=>{
      const div = document.createElement("div");
      div.className="suggestion";
      div.textContent=name;
      div.onclick=()=>{
        window.location = "nrl-player.html?player=" + encodeURIComponent(name);
      };
      suggestionsBox.appendChild(div);
    });

    suggestionsBox.style.display = matches.length ? "block" : "none";
  });

  searchBox.addEventListener("keydown", function(e){
    if(e.key==="Enter"){
      window.location = "nrl-player.html?player=" + encodeURIComponent(this.value.trim());
    }
  });

}

function renderCareer(){
  const totalGames = games.length;
  const totalTries = games.reduce((a,b)=>a+b.tries,0);
  const totalGoals = games.reduce((a,b)=>a+b.goals,0);
  const totalPoints = games.reduce((a,b)=>a+b.points,0);

  careerCards.innerHTML = `
  <div class="card"><h2>${totalGames}</h2><div>Games</div></div>
  <div class="card"><h2>${totalTries}</h2><div>Total Tries</div></div>
  <div class="card"><h2>${totalGoals}</h2><div>Total Goals</div></div>
  <div class="card"><h2>${totalPoints}</h2><div>Total Points</div></div>
  `;
}

function renderTable(data){
  gameTable.innerHTML = data.map(g=>`
  <tr>
    <td>${g.season}</td>
    <td>${g.round}</td>
    <td>${g.team}</td>
    <td>${g.opp}</td>
    <td>${g.tries}</td>
    <td>${g.goals}</td>
    <td>${g.points}</td>
  </tr>
  `).join("");
}

</script>

</body>
</html>
