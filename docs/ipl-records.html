<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Best Individual Performances | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.tab{
  background:#2b004f;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
}
.tab.active{background:#9d4edd;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>IPL Best Individual Performances</h1>
  <p>Top 25 batting and bowling performances in a single IPL match.</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('batting',event)">Batting</button>
  <button class="tab" onclick="showTab('bowling',event)">Bowling</button>
</div>

<table>
<thead>
<tr>
  <th>Rank</th>
  <th>Player</th>
  <th>Figure</th>
  <th>Season</th>
  <th>Match</th>
</tr>
</thead>
<tbody id="recordsTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";

let battingInnings = [];
let bowlingFigures = [];
let currentTab = "batting";

fetch(indexUrl)
  .then(r=>r.json())
  .then(files=>Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json()))))
  .then(seasons=>{
    seasons.forEach(matches=>{
      matches.forEach(match=>{
        const date = match.info?.dates?.[0] || "";
        const teams = match.info?.teams?.join(" vs ") || "";

        let batterRuns = {};
        let bowlerWickets = {};

        match.innings?.forEach(inn=>{
          inn.overs?.forEach(over=>{
            over.deliveries?.forEach(ball=>{
              const batter = ball.batter;
              const bowler = ball.bowler;
              const runs = ball.runs?.batter || 0;

              if(!batterRuns[batter]) batterRuns[batter]=0;
              batterRuns[batter]+=runs;

              if(ball.wickets){
                ball.wickets.forEach(w=>{
                  const kind = w.kind;
                  if(kind !== "run out"){
                    if(!bowlerWickets[bowler]) bowlerWickets[bowler]=0;
                    bowlerWickets[bowler]+=1;
                  }
                });
              }
            });
          });
        });

        for(const batter in batterRuns){
          battingInnings.push({
            player:batter,
            runs:batterRuns[batter],
            date,
            match:teams
          });
        }

        for(const bowler in bowlerWickets){
          bowlingFigures.push({
            player:bowler,
            wickets:bowlerWickets[bowler],
            date,
            match:teams
          });
        }

      });
    });

    renderTable("batting");
  });

function showTab(tab,e){
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active");
  renderTable(tab);
}

function renderTable(type){
  const tbody = document.getElementById("recordsTable");
  tbody.innerHTML="";

  let rows=[];

  if(type==="batting"){
    rows = battingInnings.sort((a,b)=>b.runs-a.runs).slice(0,25);
    rows.forEach((r,i)=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${i+1}</td>
        <td>${r.player}</td>
        <td>${r.runs}</td>
        <td>${r.date}</td>
        <td>${r.match}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  if(type==="bowling"){
    rows = bowlingFigures.sort((a,b)=>b.wickets-a.wickets).slice(0,25);
    rows.forEach((r,i)=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${i+1}</td>
        <td>${r.player}</td>
        <td>${r.wickets} wickets</td>
        <td>${r.date}</td>
        <td>${r.match}</td>
      `;
      tbody.appendChild(tr);
    });
  }
}
</script>

</body>
</html>
