<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>IPL Best Individual Performances | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:26px 20px 70px;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:32px 34px;
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.eyebrow{
  display:block;
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(26px,4.5vw,38px);
  letter-spacing:.01em;
  text-transform:uppercase;
}
.hero p{
  margin-top:10px;
  font-size:14px;
  color:rgba(255,255,255,.75);
  font-weight:600;
}

/* ── Tabs ─────────────────────────────────────────────── */
.tabs{
  display:inline-flex;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px;
  gap:4px;
  margin-bottom:20px;
}
.tab{
  padding:8px 18px;
  border-radius:999px;
  font-family:var(--body);
  font-weight:600;
  font-size:13px;
  color:var(--muted);
  border:none;
  background:transparent;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.tab:hover{ color:var(--ink); }
.tab.active{
  background:var(--accent-soft);
  color:var(--ink);
}

/* ── Table ────────────────────────────────────────────── */
table{
  width:100%;
  border-collapse:collapse;
  font-size:13.5px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}
th,td{
  border-bottom:1px solid var(--line);
  padding:11px 14px;
  text-align:left;
}
th{
  background:#f7f9fb;
  color:var(--muted);
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
}
td{
  color:#27313c;
  font-variant-numeric:tabular-nums;
}
td:first-child{
  font-weight:700;
  color:var(--accent);
  text-align:center;
  width:40px;
}
td:nth-child(2){
  font-weight:700;
  color:var(--ink);
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f0f6ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <span class="eyebrow">Cricket · IPL</span>
  <h1>Best Individual Performances</h1>
  <p>Top 25 batting and bowling performances in a single IPL match.</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('batting',event)">Batting</button>
  <button class="tab" onclick="showTab('bowling',event)">Bowling</button>
</div>

<table>
<thead>
<tr>
  <th>Rank</th>
  <th>Player</th>
  <th>Figure</th>
  <th>Season</th>
  <th>Match</th>
</tr>
</thead>
<tbody id="recordsTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const nameMapUrl = "data/ipl/player-names.json";

let nameMap = {};
let battingInnings = [];
let bowlingFigures = [];
let currentTab = "batting";

/* Load names + data together */
Promise.all([
  fetch(nameMapUrl).then(r => r.json()),
  fetch(indexUrl).then(r => r.json())
])
.then(([names, files]) => {
  nameMap = names;
  return Promise.all(files.map(f => fetch(basePath + f).then(r => r.json())));
})
.then(seasons=>{
  seasons.forEach(matches=>{
    matches.forEach(match=>{
      const date = match.info?.dates?.[0] || "";
      const teams = match.info?.teams?.join(" vs ") || "";

      let batterRuns = {};
      let bowlerWickets = {};

      let inningsList = [];
      if(Array.isArray(match.innings)){
        inningsList = match.innings;
      } else if(typeof match.innings === "object"){
        inningsList = Object.values(match.innings);
      }

      inningsList.forEach(inn=>{
        inn.overs?.forEach(over=>{
          over.deliveries?.forEach(ball=>{
            const batter = ball.batter;
            const bowler = ball.bowler;
            const runs = ball.runs?.batter || 0;

            batterRuns[batter] = (batterRuns[batter] || 0) + runs;

            if(ball.wickets){
              ball.wickets.forEach(w=>{
                if(w.kind !== "run out"){
                  bowlerWickets[bowler] = (bowlerWickets[bowler] || 0) + 1;
                }
              });
            }
          });
        });
      });

      for(const batter in batterRuns){
        battingInnings.push({
          player: batter,
          runs: batterRuns[batter],
          date,
          match: teams
        });
      }

      for(const bowler in bowlerWickets){
        bowlingFigures.push({
          player: bowler,
          wickets: bowlerWickets[bowler],
          date,
          match: teams
        });
      }
    });
  });

  renderTable("batting");
});

function fullName(name){
  return nameMap[name] || name;
}

function showTab(tab,e){
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active");
  renderTable(tab);
}

function renderTable(type){
  const tbody = document.getElementById("recordsTable");
  tbody.innerHTML="";

  let rows=[];

  if(type==="batting"){
    rows = battingInnings.sort((a,b)=>b.runs-a.runs).slice(0,25);
    rows.forEach((r,i)=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${i+1}</td>
        <td>${fullName(r.player)}</td>
        <td>${r.runs}</td>
        <td>${r.date}</td>
        <td>${r.match}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  if(type==="bowling"){
    rows = bowlingFigures.sort((a,b)=>b.wickets-a.wickets).slice(0,25);
    rows.forEach((r,i)=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${i+1}</td>
        <td>${fullName(r.player)}</td>
        <td>${r.wickets} wickets</td>
        <td>${r.date}</td>
        <td>${r.match}</td>
      `;
      tbody.appendChild(tr);
    });
  }
}
</script>

</body>
</html>
