<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>UFC Fighters | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;position:sticky;top:0;z-index:100;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));color:#fff;
  padding:52px 20px 42px;text-align:center;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(38px,7vw,54px);
  letter-spacing:.01em;text-transform:uppercase;
}
.hero p{margin:12px 0 0;font-size:15px;color:rgba(255,255,255,.68);}

.page-wrap{max-width:1400px;margin:0 auto;padding:26px 20px 70px;}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:center;}
.controls input{
  padding:11px 18px;border-radius:999px;border:1px solid var(--line);font-size:14px;
  font-family:var(--body);font-weight:600;flex:1;min-width:220px;background:var(--surface);color:var(--ink);
}
.controls input:hover{border-color:var(--faint);}
.controls input:focus{outline:none;border-color:var(--accent);}
.controls select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;
  font-weight:600;background:var(--surface);cursor:pointer;font-family:var(--body);color:var(--ink);
}
.controls select:hover{border-color:var(--faint);}
.controls select:focus{outline:none;border-color:var(--accent);}
.count{font-size:13px;font-weight:600;color:var(--muted);}
.fighters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.fighter-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;text-decoration:none;color:var(--ink);transition:.2s;text-align:center;display:block;
}
.fighter-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 26px -14px rgba(10,16,24,.3);}
.fighter-name{font-family:var(--display);font-size:15px;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.01em;}
.fighter-nickname{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:6px;}
.fighter-meta{font-size:11.5px;color:var(--muted);}
.loading{text-align:center;padding:60px;font-size:15px;font-weight:600;color:var(--muted);}
</style>
</head>
<body>
<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
  <a href="ufc-events.html">Events</a>
  <a href="ufc-records.html">Records</a>
</div>
<div class="hero">
  <h1>UFC Fighters</h1>
  <p>Every fighter in UFC history</p>
</div>
<div class="page-wrap">
  <div class="controls">
    <input type="text" id="search" placeholder="Search fighters..." oninput="render()">
    <select id="weightFilter" onchange="render()">
      <option value="">All Weight Classes</option>
      <option>Strawweight</option>
      <option>Flyweight</option>
      <option>Bantamweight</option>
      <option>Featherweight</option>
      <option>Lightweight</option>
      <option>Welterweight</option>
      <option>Middleweight</option>
      <option>Light Heavyweight</option>
      <option>Heavyweight</option>
    </select>
    <div class="count" id="count"></div>
  </div>
  <div class="fighters-grid" id="grid"><div class="loading">Loading fighters...</div></div>
</div>
<script>
var allFighters = [];

fetch('/data/ufc/fighters.json')
  .then(function(r){ return r.json(); })
  .then(function(data){
    allFighters = data;
    render();
  });

function render(){
  var q  = document.getElementById('search').value.toLowerCase().trim();
  var wc = document.getElementById('weightFilter').value.toLowerCase();

  var filtered = allFighters.filter(function(f){
    if(q && !(f.name||'').toLowerCase().includes(q) && !(f.nickname||'').toLowerCase().includes(q)) return false;
    if(wc && !(f.weight_class||'').toLowerCase().includes(wc)) return false;
    return true;
  }).slice(0,200);

  document.getElementById('count').innerText = filtered.length.toLocaleString()+' fighters';

  document.getElementById('grid').innerHTML = filtered.map(function(f){
    return '<a class="fighter-card" href="/ufc-fighter.html?id='+f.id+'">'+
      '<div class="fighter-name">'+f.name+'</div>'+
      (f.nickname?'<div class="fighter-nickname">"'+f.nickname+'"</div>':'')+
      '<div class="fighter-meta">'+(f.weight_class||'')+(f.nationality?' · '+f.nationality:'')+'</div>'+
      '</a>';
  }).join('') || '<div class="loading">No fighters found</div>';
}
</script>
</body>
</html>
