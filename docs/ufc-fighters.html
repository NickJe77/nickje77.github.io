<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>UFC Fighters | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
  body{font-family:Inter,system-ui,-apple-system,sans-serif;margin:0;background:#f4f6f8;color:#111;}
  .navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;position:sticky;top:0;z-index:100;}
  .navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
  .navbar a:hover{text-decoration:underline;}
  .hero{background:linear-gradient(135deg,#1a1a1a,#c8102e);color:white;padding:56px 20px 44px;text-align:center;}
  .hero h1{margin:0;font-size:60px;font-weight:900;letter-spacing:-2px;}
  .hero p{margin:12px 0 0;font-size:18px;opacity:.88;}
  .page-wrap{max-width:1400px;margin:0 auto;padding:28px 20px 60px;}
  .controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center;}
  .controls input{padding:12px 16px;border-radius:12px;border:1px solid #ddd;font-size:16px;font-weight:600;flex:1;min-width:220px;}
  .controls select{padding:11px 14px;border-radius:12px;border:1px solid #ddd;font-size:14px;font-weight:700;background:white;}
  .count{font-size:14px;font-weight:700;color:#888;}
  .fighters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .fighter-card{background:white;border-radius:16px;padding:20px;text-decoration:none;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.2s;text-align:center;display:block;}
  .fighter-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.12);}
  .fighter-headshot{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:12px;background:#eee;}
  .fighter-headshot-placeholder{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#1a1a1a,#c8102e);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;}
  .fighter-name{font-size:16px;font-weight:900;margin-bottom:4px;}
  .fighter-nickname{font-size:13px;color:#c8102e;font-weight:700;margin-bottom:6px;}
  .fighter-meta{font-size:12px;color:#888;}
  .loading{text-align:center;padding:60px;font-size:18px;font-weight:700;color:#888;}
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="ufc.html">UFC</a>
  <a href="ufc-events.html">Events</a>
  <a href="ufc-records.html">Records</a>
</div>
<div class="hero">
  <h1>UFC Fighters</h1>
  <p>Every fighter in UFC history</p>
</div>
<div class="page-wrap">
  <div class="controls">
    <input type="text" id="search" placeholder="Search fighters..." oninput="render()">
    <select id="weightFilter" onchange="render()">
      <option value="">All Weight Classes</option>
      <option>Strawweight</option>
      <option>Flyweight</option>
      <option>Bantamweight</option>
      <option>Featherweight</option>
      <option>Lightweight</option>
      <option>Welterweight</option>
      <option>Middleweight</option>
      <option>Light Heavyweight</option>
      <option>Heavyweight</option>
    </select>
    <div class="count" id="count"></div>
  </div>
  <div class="fighters-grid" id="grid"><div class="loading">Loading fighters...</div></div>
</div>
<script>
var allFighters = [];

fetch('/data/ufc/fighters.json')
  .then(function(r){ return r.json(); })
  .then(function(data){
    allFighters = data;
    render();
  });

function render(){
  var q  = document.getElementById('search').value.toLowerCase().trim();
  var wc = document.getElementById('weightFilter').value.toLowerCase();

  var filtered = allFighters.filter(function(f){
    if(q && !(f.name||'').toLowerCase().includes(q) && !(f.nickname||'').toLowerCase().includes(q)) return false;
    if(wc && !(f.weight_class||'').toLowerCase().includes(wc)) return false;
    return true;
  }).slice(0,200);

  document.getElementById('count').innerText = filtered.length.toLocaleString()+' fighters';

  document.getElementById('grid').innerHTML = filtered.map(function(f){
    var img = f.headshot
      ? '<img class="fighter-headshot" src="'+f.headshot+'" alt="'+f.name+'" onerror="this.style.display=\'none\'">'
      : '<div class="fighter-headshot-placeholder">🥊</div>';
    return '<a class="fighter-card" href="/ufc-fighter.html?id='+f.id+'">'+
      img+
      '<div class="fighter-name">'+f.name+'</div>'+
      (f.nickname?'<div class="fighter-nickname">"'+f.nickname+'"</div>':'')+
      '<div class="fighter-meta">'+(f.weight_class||'')+(f.nationality?' · '+f.nationality:'')+'</div>'+
      '</a>';
  }).join('') || '<div class="loading">No fighters found</div>';
}
</script>
</body>
</html>
