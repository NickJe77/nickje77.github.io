<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>BBL Seasons | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f8fc;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(135deg,#003566,#0077b6);
color:white;
padding:40px;
border-radius:26px;
margin-bottom:22px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero p{
margin-top:10px;
font-size:18px;
opacity:.95;
}

/* SEASON BUTTONS */

.season-grid{
display:flex;
flex-wrap:wrap;
gap:14px;
margin:10px 0 22px;
}

.season-btn{

background:linear-gradient(135deg,#003566,#0077b6);
color:white;

padding:12px 22px;
border-radius:12px;

font-weight:800;
font-size:18px;

cursor:pointer;
transition:.15s;

}

.season-btn:hover{
transform:translateY(-2px);
box-shadow:0 6px 16px rgba(0,0,0,.15);
}

.season-btn.active{
background:linear-gradient(135deg,#3a86ff,#00bbf9);
}

/* MATCH TABLE */

.table-wrap{
background:#fff;
border-radius:14px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th{
background:linear-gradient(135deg,#003566,#0077b6);
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #e5e7eb;
}

tr:nth-child(even){
background:#f4f8fc;
}

tr.game-row{
cursor:pointer;
}

tr.game-row:hover{
background:#dbeafe;
}

.note{
margin-top:10px;
font-size:13px;
color:#666;
}

</style>
</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/cricket.html">Cricket</a>
<a href="/bbl.html">BBL</a>
</div>

<div class="page">

<div class="hero">

<h1>Big Bash League</h1>
<p>Complete BBL match history by season</p>

</div>

<div id="seasonGrid" class="season-grid"></div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Venue</th>
<th>Winner</th>
</tr>
</thead>

<tbody id="matchTable">
<tr><td colspan="4">Loading...</td></tr>
</tbody>

</table>

</div>

<div id="note" class="note"></div>

</div>

<script>

let seasonsMap = {};
let seasonButtons = {};
let currentSeason = null;

function getSeasonStartYear(date){

const y = date.getFullYear();
const m = date.getMonth()+1;

return (m>=11)?y:y-1;

}

function seasonLabel(startYear){

return startYear + "/" + String(startYear+1).slice(-2);

}

function setActiveSeason(startYear){

currentSeason=startYear;

Object.values(seasonButtons)
.forEach(btn=>btn.classList.remove("active"));

seasonButtons[startYear].classList.add("active");

renderMatches(startYear);

}

function renderMatches(startYear){

const matches=seasonsMap[startYear] || [];

matches.sort((a,b)=> new Date(a.date)-new Date(b.date));

const tbody=document.getElementById("matchTable");

tbody.innerHTML = matches.map(m=>`

<tr class="game-row"
onclick="location.href='/bbl-match.html?file=${encodeURIComponent(m.file)}&match=${m.matchIndex}'">

<td>${new Date(m.date).toDateString()}</td>

<td>${m.teams[0]} vs ${m.teams[1]}</td>

<td>${m.venue}</td>

<td>${m.winner}</td>

</tr>

`).join("");

document.getElementById("note").textContent =
seasonLabel(startYear) + " • " + matches.length + " matches";

}

(async function(){

const index = await fetch("/data/bbl/index.json").then(r=>r.json());

const files = await Promise.all(

index.map(async file=>{

const data = await fetch("/data/bbl/"+file).then(r=>r.json());

return {file,data};

})

);

files.forEach(({file,data})=>{

data.forEach((match,i)=>{

const info=match.info;

if(!info || !info.dates) return;

const date=new Date(info.dates[0]);

const startYear=getSeasonStartYear(date);

if(!seasonsMap[startYear])
seasonsMap[startYear]=[];

seasonsMap[startYear].push({

date:info.dates[0],
teams:info.teams,
venue:info.venue||"—",
winner:info.outcome?.winner||"—",

file:file,             // CORRECT FILE
matchIndex:i           // CORRECT MATCH INDEX

});

});

});

/* BUILD BUTTONS */

const grid=document.getElementById("seasonGrid");

const seasons=Object.keys(seasonsMap)
.map(Number)
.sort((a,b)=>a-b);

grid.innerHTML="";

seasons.forEach(startYear=>{

const btn=document.createElement("div");

btn.className="season-btn";

btn.textContent=seasonLabel(startYear);

btn.onclick=()=>setActiveSeason(startYear);

grid.appendChild(btn);

seasonButtons[startYear]=btn;

});

/* LOAD LATEST SEASON */

const latest=Math.max(...seasons);

setActiveSeason(latest);

})();

</script>

</body>
</html>
