<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Seasons | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;}
.navbar{
  display:flex;justify-content:center;gap:22px;
  padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1100px;margin:0 auto;padding:30px 20px 60px;}

.hero{
  background:linear-gradient(90deg,#003366,#00a3cc);
  color:white;padding:36px 40px;border-radius:24px;margin-bottom:20px;
}
.hero h1{margin:0;font-size:42px;}

table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{padding:10px;border-bottom:1px solid #e2e8f0;}
th{background:#f3f6fb;font-weight:800;}
tr:nth-child(even){background:#f8fbff;}

a.view{color:#003366;font-weight:800;text-decoration:none;}
a.view:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl-season.html">BBL Seasons</a>
</div>

<div class="page-wrap">
  <div class="hero">
    <h1>Big Bash League</h1>
  </div>

  <table id="tbl">
    <tr><th>Date</th><th>Match</th><th>Venue</th><th>Winner</th><th></th></tr>
  </table>
</div>

<script>
fetch("data/bbl/bbl_2013.json")
.then(r=>r.json())
.then(data=>{
  const matches = Array.isArray(data)?data:[];
  const tbl=document.getElementById("tbl");

  matches.forEach((m,i)=>{
    const info=m.info;
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${new Date(info.dates[0]).toDateString()}</td>
      <td>${info.teams.join(" vs ")}</td>
      <td>${info.venue}</td>
      <td>${info.outcome?.winner||"—"}</td>
      <td><a class="view" href="bbl-match.html?file=bbl_2013.json&match=${i}">View</a></td>
    `;
    tbl.appendChild(tr);
  });
});
</script>

</body>
</html>
