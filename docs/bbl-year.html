<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Seasons | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f8fc;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}

/* HERO */

.hero{
  background:linear-gradient(135deg,#003566,#0077b6);
  color:#fff;
  padding:40px;
  border-radius:26px;
  margin-bottom:22px;
}

.hero h1{
  margin:0;
  font-size:42px;
}

.hero p{
  margin-top:10px;
  font-size:18px;
  opacity:.95;
}

/* SEASON BUTTONS */

.season-grid{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin:10px 0 22px;
}

.season-btn{
  background:linear-gradient(135deg,#003566,#0077b6);
  color:#fff;
  padding:12px 22px;
  border-radius:12px;
  font-weight:800;
  font-size:18px;
  cursor:pointer;
  transition:.15s;
  user-select:none;
}

.season-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(0,0,0,.12);
}

.season-btn.active{
  background:linear-gradient(135deg,#3a86ff,#00bbf9);
}

/* TABLE */

.table-wrap{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th{
  background:linear-gradient(135deg,#003566,#0077b6);
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
}

tr:nth-child(even){
  background:#f4f8fc;
}

tr.game-row{
  cursor:pointer;
}

tr.game-row:hover{
  background:#dbeafe;
}

.small-note{
  margin:10px 2px 0;
  font-size:13px;
  color:#51606f;
}

</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/cricket.html">Cricket</a>
  <a href="/bbl.html">BBL</a>
</div>

<div class="page">

  <div class="hero">
    <h1>Big Bash League</h1>
    <p>Complete BBL match history by season. Seasons run Nov/Dec through Jan/Feb.</p>
  </div>

  <div id="seasonGrid" class="season-grid">Loading seasons…</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Match</th>
          <th>Venue</th>
          <th>Winner</th>
        </tr>
      </thead>
      <tbody id="matchTable">
        <tr><td colspan="4">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="small-note" id="note"></div>

</div>

<script>
(function(){

const seasonGrid = document.getElementById("seasonGrid");
const matchTable = document.getElementById("matchTable");
const note = document.getElementById("note");

let seasonsMap = {};   // { 2015: [ {date, teams, venue, winner, file, matchIndex}, ... ] }
let seasonButtons = {}; // {2015: element}
let currentSeason = null;

function pad2(n){ return String(n).padStart(2,"0"); }

function seasonLabel(startYear){
  const yy = String(startYear + 1).slice(-2);
  return `${startYear}/${yy}`;
}

/* Determine season start year from match date:
   - Nov/Dec => start year = that year
   - Jan..Oct => start year = year-1
*/
function seasonStartYearFromDate(d){
  const y = d.getFullYear();
  const m = d.getMonth() + 1; // 1-12
  return (m >= 11) ? y : (y - 1);
}

function setActiveSeason(seasonStartYear){
  currentSeason = seasonStartYear;

  Object.values(seasonButtons).forEach(btn => btn.classList.remove("active"));
  if(seasonButtons[seasonStartYear]) seasonButtons[seasonStartYear].classList.add("active");

  renderMatches(seasonStartYear);
}

function renderMatches(seasonStartYear){
  const list = seasonsMap[seasonStartYear] || [];

  // Sort by actual date ascending (like IPL page typically does)
  list.sort((a,b)=> new Date(a.date) - new Date(b.date));

  matchTable.innerHTML = list.map(m => `
    <tr class="game-row" onclick="location.href='/bbl-match.html?file=${encodeURIComponent(m.file)}&match=${m.matchIndex}'">
      <td>${new Date(m.date).toDateString()}</td>
      <td>${m.teams[0]} vs ${m.teams[1]}</td>
      <td>${m.venue || "—"}</td>
      <td>${m.winner || "—"}</td>
    </tr>
  `).join("");

  note.textContent = `${seasonLabel(seasonStartYear)} • ${list.length} matches`;
}

async function init(){

  // Load index.json
  const index = await fetch("/data/bbl/index.json").then(r=>{
    if(!r.ok) throw new Error("Failed to load /data/bbl/index.json");
    return r.json();
  });

  // Load all season files in parallel
  const files = await Promise.all(
    index.map(file =>
      fetch("/data/bbl/" + file).then(r=>{
        if(!r.ok) throw new Error("Failed to load " + file);
        return r.json();
      }).then(data => ({file, data}))
    )
  );

  // Build seasonsMap by DATE logic
  files.forEach(({file, data})=>{
    const matches = Array.isArray(data) ? data : [];
    matches.forEach((match, i)=>{
      const info = match && match.info ? match.info : null;
      if(!info || !info.dates || !info.dates[0] || !info.teams) return;

      const d = new Date(info.dates[0]);
      if(isNaN(d.getTime())) return;

      const startYear = seasonStartYearFromDate(d);

      if(!seasonsMap[startYear]) seasonsMap[startYear] = [];

      seasonsMap[startYear].push({
        date: info.dates[0],
        teams: info.teams,
        venue: info.venue || "—",
        winner: (info.outcome && info.outcome.winner) ? info.outcome.winner : "—",
        file: file,          // IMPORTANT: actual source file (bbl_2016.json etc)
        matchIndex: i        // IMPORTANT: match index within that file
      });
    });
  });

  // Build season buttons (sorted)
  const seasonStarts = Object.keys(seasonsMap).map(Number).sort((a,b)=>a-b);

  seasonGrid.innerHTML = "";
  seasonButtons = {};

  seasonStarts.forEach(startYear=>{
    const btn = document.createElement("div");
    btn.className = "season-btn";
    btn.textContent = seasonLabel(startYear);
    btn.onclick = ()=> setActiveSeason(startYear);
    seasonGrid.appendChild(btn);
    seasonButtons[startYear] = btn;
  });

  // Auto-select latest season that has matches
  const latest = Math.max(...seasonStarts);
  setActiveSeason(latest);
}

init().catch(err=>{
  seasonGrid.textContent = "ERROR loading seasons";
  matchTable.innerHTML = `<tr><td colspan="4">${err.message}</td></tr>`;
});

})();
</script>

</body>
</html>
