<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Seasons | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f8fc;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(135deg,#003566,#0077b6);
color:white;
padding:42px;
border-radius:26px;
margin-bottom:26px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero p{
margin-top:10px;
font-size:18px;
opacity:.95;
}

/* SEASON GRID */

.season-grid{
display:flex;
flex-wrap:wrap;
gap:14px;
margin-top:10px;
}

.season-btn{

background:linear-gradient(135deg,#003566,#0077b6);
color:white;

padding:14px 26px;
border-radius:12px;

font-weight:700;
font-size:18px;

cursor:pointer;

transition:.2s;

}

.season-btn:hover{
transform:translateY(-2px);
box-shadow:0 6px 18px rgba(0,0,0,.15);
}

.season-btn.current{
background:linear-gradient(135deg,#3a86ff,#00bbf9);
}

</style>
</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/cricket.html">Cricket</a>
<a href="/bbl.html">BBL</a>
</div>

<div class="page">

<div class="hero">

<h1>Big Bash League</h1>

<p>
Complete BBL match history by season. Click any season to view matches and full scorecards.
</p>

</div>

<div id="seasonGrid" class="season-grid">

Loading seasons...

</div>

</div>

<script>

(async function(){

const grid=document.getElementById("seasonGrid");

/* LOAD INDEX */

const index=await fetch("/data/bbl/index.json")
.then(r=>r.json());

/* EXTRACT SEASONS */

let seasons=new Set();

index.forEach(file=>{

const year=parseInt(file.match(/\d+/)[0]);

seasons.add(year);

});

/* SORT */

seasons=[...seasons].sort((a,b)=>a-b);

/* BUILD BUTTONS */

grid.innerHTML="";

seasons.forEach(season=>{

const nextYear=(season+1).toString().slice(-2);

const div=document.createElement("div");

div.className="season-btn";

div.textContent=season+" / "+nextYear;

div.onclick=()=>{

location.href="/bbl-season-view.html?season="+season;

};

grid.appendChild(div);

});

})();
</script>

</body>
</html>
