<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Seasons | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f8fc;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(135deg,#003566,#0077b6);
color:white;
padding:40px;
border-radius:26px;
margin-bottom:26px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero p{
margin-top:10px;
font-size:18px;
opacity:.95;
}

/* SEASON BUTTONS */

.season-grid{
display:flex;
flex-wrap:wrap;
gap:14px;
margin-bottom:26px;
}

.season-btn{

background:linear-gradient(135deg,#003566,#0077b6);
color:white;

padding:12px 22px;
border-radius:12px;

font-weight:700;
font-size:18px;

cursor:pointer;
transition:.2s;

}

.season-btn:hover{
transform:translateY(-2px);
}

.season-btn.active{
background:linear-gradient(135deg,#3a86ff,#00bbf9);
}

/* MATCH TABLE */

.table-wrap{
background:#fff;
border-radius:14px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:linear-gradient(135deg,#003566,#0077b6);
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f4f8fc;
}

tr.game-row{
cursor:pointer;
}

tr.game-row:hover{
background:#dbeafe;
}

</style>
</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/cricket.html">Cricket</a>
<a href="/bbl.html">BBL</a>
</div>

<div class="page">

<div class="hero">

<h1>Big Bash League</h1>
<p>Complete BBL match history by season. Click a season to view matches.</p>

</div>

<div id="seasonGrid" class="season-grid"></div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Venue</th>
<th>Winner</th>
</tr>
</thead>

<tbody id="matchTable">
<tr><td colspan="4">Select a season above</td></tr>
</tbody>

</table>

</div>

</div>

<script>

let seasonData={};
let currentSeason=null;

(async function(){

/* LOAD INDEX */

const index=await fetch("/data/bbl/index.json")
.then(r=>r.json());

/* LOAD FILES */

await Promise.all(

index.map(async file=>{

const season=parseInt(file.match(/\d+/)[0]);

const data=await fetch("/data/bbl/"+file)
.then(r=>r.json());

seasonData[season]=data;

})

);

/* BUILD SEASON BUTTONS */

const grid=document.getElementById("seasonGrid");

const seasons=Object.keys(seasonData)
.map(Number)
.sort((a,b)=>a-b);

seasons.forEach(season=>{

const nextYear=(season+1).toString().slice(-2);

const btn=document.createElement("div");

btn.className="season-btn";

btn.textContent=season+" / "+nextYear;

btn.onclick=()=>selectSeason(season,btn);

grid.appendChild(btn);

});

/* AUTO LOAD LATEST SEASON */

const latest=Math.max(...seasons);

selectSeason(latest,grid.lastChild);

})();

/* SELECT SEASON */

function selectSeason(season,btn){

currentSeason=season;

/* BUTTON ACTIVE STATE */

document.querySelectorAll(".season-btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

/* RENDER MATCHES */

const matches=seasonData[season];

const tbody=document.getElementById("matchTable");

tbody.innerHTML=matches.map((m,i)=>`

<tr class="game-row"
onclick="location.href='/bbl-match.html?file=bbl_${season}.json&match=${i}'">

<td>${new Date(m.info.dates[0]).toDateString()}</td>

<td>
${m.info.teams[0]}
vs
${m.info.teams[1]}
</td>

<td>${m.info.venue}</td>

<td>${m.info.outcome?.winner||"—"}</td>

</tr>

`).join("");

}

</script>

</body>
</html>
