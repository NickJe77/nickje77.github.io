<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1000px;margin:0 auto;padding:26px 20px 70px;}

h1{
  font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);
  letter-spacing:.01em;text-transform:uppercase;margin:0;
}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:22px 26px 26px;text-align:center;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:8px;
}
.hero h1{color:#fff;}
.hero .sub{margin-top:10px;font-size:14px;color:rgba(255,255,255,.7);font-weight:600;}

/* ── Calendar ─────────────────────────────────────────── */
.calendar{
  max-width:420px;margin:0 auto 24px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;
}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.cal-header button{
  background:transparent;color:var(--ink);border:1px solid var(--line);
  width:32px;height:32px;border-radius:999px;cursor:pointer;font-size:15px;
  transition:border-color .15s,color .15s;
}
.cal-header button:hover{border-color:var(--accent);color:var(--accent);}
#monthLabel{font-family:var(--display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.03em;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-day{
  padding:10px 0;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
  color:var(--ink);transition:background .15s;
}
.cal-day:hover{background:var(--bg);}
.cal-today{border:1px solid var(--accent);}
.cal-selected{background:var(--ink);color:#fff;}
.cal-has-events:not(.cal-selected){background:var(--accent-soft);}

/* ── Sport tabs ───────────────────────────────────────── */
.sport-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 auto 28px;max-width:900px;}
.sport-tab{
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:8px 16px;font-family:var(--body);font-size:12.5px;font-weight:600;
  cursor:pointer;transition:.15s ease;
}
.sport-tab:hover{border-color:var(--faint);color:var(--ink);}
.sport-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ── Events ───────────────────────────────────────────── */
.section{margin-bottom:32px;}
.section h2{
  font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;
  letter-spacing:.03em;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:4px;
}
.event{padding:12px 0;border-bottom:1px solid var(--line);}
.event a{text-decoration:none;color:var(--ink);}
.event a:hover{color:var(--accent);}
.event span.year{
  font-family:var(--display);font-weight:600;color:var(--accent);margin-right:8px;
}
.event .connections{
  margin-top:4px;font-size:12.5px;color:var(--muted);
}
.event .connections strong{color:var(--ink);font-weight:600;}
.grade-badge{
  display:inline-block;font-family:var(--display);font-size:10.5px;font-weight:600;
  letter-spacing:.03em;color:var(--accent);border:1px solid var(--accent);
  border-radius:4px;padding:1px 6px;vertical-align:middle;
}
.empty{color:var(--muted);font-style:italic;text-align:center;padding:24px;font-size:14px;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="f1.html">F1</a>
  <a href="cricket.html">Cricket</a>
  <a href="racing.html">Racing</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <div class="eyebrow">The Sporting Almanac</div>
    <h1>On This Day in Sport</h1>
    <div class="sub" id="subtitle"></div>
  </div>

  <div class="calendar">
    <div class="cal-header">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <div id="monthLabel"></div>
      <button id="nextMonth" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid" id="calendarGrid"></div>
  </div>

  <div class="sport-tabs" id="sportTabs"></div>

  <div id="content"></div>

</div>

<script>
const DATA_URL = "data/on_this_day.json";

let DATA = {};
let currentDate = new Date();
let selectedDate = new Date();
let selectedSport = "ALL";

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function formatDateLong(d){
  return d.toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"});
}

function getKey(d){
  return String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function renderSportTabs(date){
  const key = getKey(date);
  const dayData = DATA[key] || {};
  const tabs = document.getElementById("sportTabs");
  const sports = Object.keys(dayData).sort();
  let html = `<button class="sport-tab ${selectedSport==="ALL"?"active":""}" data-sport="ALL">All Sports</button>`;
  sports.forEach(sport=>{
    html += `<button class="sport-tab ${selectedSport===sport?"active":""}" data-sport="${esc(sport)}">${esc(sport)}</button>`;
  });
  tabs.innerHTML = html;
  tabs.querySelectorAll(".sport-tab").forEach(btn=>{
    btn.onclick = ()=>{
      selectedSport = btn.dataset.sport;
      renderSportTabs(selectedDate);
      renderPage(selectedDate);
    };
  });
}

// Renders the "connections" line for events that carry jockey/trainer
// info (racing) - or any other optional structured fields down the line.
// Only shows fields that are actually present, so non-racing sports are
// unaffected.
function renderConnections(e){
  const jockey = e.jockey ?? e.Jockey;
  const trainer = e.trainer ?? e.Trainer;
  const parts = [];
  if(jockey) parts.push(`<strong>Jockey:</strong> ${esc(jockey)}`);
  if(trainer) parts.push(`<strong>Trainer:</strong> ${esc(trainer)}`);
  if(!parts.length) return "";
  return `<div class="connections">${parts.join(" &middot; ")}</div>`;
}

function renderGradeBadge(e){
  const grade = e.grade ?? e.Grade ?? e["Race Grade"];
  if(!grade) return "";
  return ` <span class="grade-badge">${esc(grade)}</span>`;
}

function renderPage(date){
  const key = getKey(date);
  const dayData = DATA[key];
  document.getElementById("subtitle").textContent = formatDateLong(date);
  if(!dayData){
    document.getElementById("content").innerHTML = `<div class="empty">No events</div>`;
    renderSportTabs(date);
    return;
  }
  let html="";
  Object.keys(dayData).sort().forEach(sport=>{
    if(selectedSport !== "ALL" && sport !== selectedSport) return;
    html += `<div class="section"><h2>${esc(sport)}</h2>`;
    dayData[sport].forEach(e=>{
      html += `<div class="event"><span class="year">${esc(e.year)}</span>${esc(e.text)}${renderGradeBadge(e)}${renderConnections(e)}</div>`;
    });
    html += `</div>`;
  });
  document.getElementById("content").innerHTML = html || `<div class="empty">No events</div>`;
  renderSportTabs(date);
}

function renderCalendar(){
  const grid = document.getElementById("calendarGrid");
  grid.innerHTML="";
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  document.getElementById("monthLabel").textContent =
    currentDate.toLocaleDateString("en-AU",{month:"long",year:"numeric"});
  const firstDay = new Date(year,month,1).getDay();
  const days = new Date(year,month+1,0).getDate();
  for(let i=0;i<firstDay;i++) grid.innerHTML+="<div></div>";
  for(let d=1; d<=days; d++){
    const date = new Date(year,month,d);
    const key = getKey(date);
    const div = document.createElement("div");
    div.className="cal-day";
    div.textContent=d;
    if(date.toDateString()===new Date().toDateString()) div.classList.add("cal-today");
    if(date.toDateString()===selectedDate.toDateString()) div.classList.add("cal-selected");
    if(DATA[key]) div.classList.add("cal-has-events");
    div.onclick=()=>{
      selectedDate=date;
      selectedSport="ALL";
      renderCalendar();
      renderPage(date);
    };
    grid.appendChild(div);
  }
}

fetch(DATA_URL)
  .then(r=>r.json())
  .then(d=>{
    DATA=d;
    renderCalendar();
    renderPage(selectedDate);
  });

document.getElementById("prevMonth").onclick=()=>{
  currentDate.setMonth(currentDate.getMonth()-1);
  renderCalendar();
};

document.getElementById("nextMonth").onclick=()=>{
  currentDate.setMonth(currentDate.getMonth()+1);
  renderCalendar();
};
</script>

</body>
