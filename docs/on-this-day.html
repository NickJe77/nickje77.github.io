<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>On This Day in Sport | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;color:#111;}

.navbar{
  display:flex;justify-content:center;gap:22px;
  padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1000px;margin:0 auto;padding:30px 20px;}
h1{text-align:center;margin-bottom:6px;}
.subtitle{text-align:center;color:#555;margin-bottom:10px;}

/* FILTER */
.filter-bar{
  display:flex;
  justify-content:center;
  margin-bottom:20px;
}

select{
  padding:10px 14px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* CALENDAR */
.calendar{
  max-width:420px;
  margin:0 auto 30px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
}

.cal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.cal-header button{
  background:#0056d6;color:#fff;border:none;
  padding:6px 10px;border-radius:6px;cursor:pointer;
}

.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;text-align:center;
}

.cal-day{
  padding:12px 0;
  border-radius:6px;
  cursor:pointer;
}

.cal-day:hover{background:#eee;}

.cal-today{
  background:#0056d6;color:#fff;
}

.cal-selected{
  outline:2px solid #0056d6;
}

/* 🔥 NEW: highlight days with events */
.cal-has-events{
  background:#dbeafe;
  font-weight:600;
}

/* EVENTS */
.section{margin-bottom:40px;}
.section h2{
  border-bottom:2px solid #eee;
  padding-bottom:6px;margin-bottom:12px;
}

.event{
  padding:8px 0;border-bottom:1px solid #f0f0f0;
}

.event a{text-decoration:none;color:#111;}
.event a:hover{color:#0056d6;}

.event span.year{
  font-weight:600;margin-right:6px;
}

.empty{
  color:#888;font-style:italic;text-align:center;padding:20px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="f1.html">F1</a>
  <a href="cricket.html">Cricket</a>
  <a href="racing.html">Racing</a>
</div>

<div class="page-wrap">
  <h1>On This Day in Sport</h1>
  <div class="subtitle" id="subtitle"></div>

  <!-- FILTER -->
  <div class="filter-bar">
    <select id="sportFilter">
      <option value="ALL">All Sports</option>
      <option value="NBA">NBA</option>
      <option value="AFL">AFL</option>
      <option value="Football">NRL</option>
    </select>
  </div>

  <!-- CALENDAR -->
  <div class="calendar">
    <div class="cal-header">
      <button id="prevMonth">‹</button>
      <div id="monthLabel"></div>
      <button id="nextMonth">›</button>
    </div>
    <div class="cal-grid" id="calendarGrid"></div>
  </div>

  <div id="content"></div>
</div>

<script>
const DATA_URL = "data/on_this_day.json";

let DATA = {};
let currentDate = new Date();
let selectedDate = new Date();
let selectedSport = "ALL";

// ---------------- DATE ----------------
function formatDateLong(d){
  return d.toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"});
}

function getKey(d){
  return String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

// ---------------- RENDER EVENTS ----------------
function renderPage(date){

  const key = getKey(date);
  const dayData = DATA[key];

  document.getElementById("subtitle").textContent = formatDateLong(date);

  if(!dayData){
    document.getElementById("content").innerHTML =
      `<div class="empty">No events</div>`;
    return;
  }

  let html="";

  Object.keys(dayData).forEach(sport=>{

    if(selectedSport !== "ALL" && sport !== selectedSport) return;

    html += `<div class="section"><h2>${sport}</h2>`;

    dayData[sport].forEach(e=>{
      html += `
        <div class="event">
          <span class="year">${e.year}</span>
          ${e.text}
        </div>
      `;
    });

    html += `</div>`;
  });

  document.getElementById("content").innerHTML = html || `<div class="empty">No events</div>`;
}

// ---------------- CALENDAR ----------------
function renderCalendar(){

  const grid = document.getElementById("calendarGrid");
  grid.innerHTML="";

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  document.getElementById("monthLabel").textContent =
    currentDate.toLocaleDateString("en-AU",{month:"long",year:"numeric"});

  const firstDay = new Date(year,month,1).getDay();
  const days = new Date(year,month+1,0).getDate();

  for(let i=0;i<firstDay;i++) grid.innerHTML+="<div></div>";

  for(let d=1; d<=days; d++){

    const date = new Date(year,month,d);
    const key = getKey(date);

    const div = document.createElement("div");
    div.className="cal-day";
    div.textContent=d;

    if(date.toDateString()===new Date().toDateString()){
      div.classList.add("cal-today");
    }

    if(date.toDateString()===selectedDate.toDateString()){
      div.classList.add("cal-selected");
    }

    // 🔥 highlight if data exists
    if(DATA[key]){
      div.classList.add("cal-has-events");
    }

    div.onclick=()=>{
      selectedDate=date;
      renderCalendar();
      renderPage(date);
    };

    grid.appendChild(div);
  }
}

// ---------------- FILTER ----------------
document.getElementById("sportFilter").onchange = (e)=>{
  selectedSport = e.target.value;
  renderPage(selectedDate);
};

// ---------------- INIT ----------------
fetch(DATA_URL)
  .then(r=>r.json())
  .then(d=>{
    DATA=d;
    renderCalendar();
    renderPage(selectedDate);
  });

document.getElementById("prevMonth").onclick=()=>{
  currentDate.setMonth(currentDate.getMonth()-1);
  renderCalendar();
};

document.getElementById("nextMonth").onclick=()=>{
  currentDate.setMonth(currentDate.getMonth()+1);
  renderCalendar();
};
</script>

</body>
</html>
