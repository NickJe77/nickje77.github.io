<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Records | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:30px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

.section{
  margin-bottom:40px;
}

.section h2{
  margin-bottom:10px;
  color:#3b007a;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>IPL Records</h1>
  <p>All-time and season-based IPL records.</p>
</div>

<div class="section">
  <h2>Highest Individual Score (All Time)</h2>
  <table>
    <thead>
      <tr><th>Player</th><th>Runs</th><th>Season</th><th>Match</th></tr>
    </thead>
    <tbody id="highestScoreTable"></tbody>
  </table>
</div>

<div class="section">
  <h2>Best Bowling Figures (All Time)</h2>
  <table>
    <thead>
      <tr><th>Player</th><th>Figures</th><th>Season</th><th>Match</th></tr>
    </thead>
    <tbody id="bestBowlingTable"></tbody>
  </table>
</div>

<div class="section">
  <h2>Most Runs in a Season</h2>
  <table>
    <thead>
      <tr><th>Player</th><th>Runs</th><th>Season</th></tr>
    </thead>
    <tbody id="mostRunsSeasonTable"></tbody>
  </table>
</div>

<div class="section">
  <h2>Most Wickets in a Season</h2>
  <table>
    <thead>
      <tr><th>Player</th><th>Wickets</th><th>Season</th></tr>
    </thead>
    <tbody id="mostWicketsSeasonTable"></tbody>
  </table>
</div>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";

const highestScoreTable = document.getElementById("highestScoreTable");
const bestBowlingTable = document.getElementById("bestBowlingTable");
const mostRunsSeasonTable = document.getElementById("mostRunsSeasonTable");
const mostWicketsSeasonTable = document.getElementById("mostWicketsSeasonTable");

fetch(indexUrl)
.then(r=>r.json())
.then(files=>{
  const fullFiles = files.filter(f=>f.includes("_FULL.json"));
  return Promise.all(fullFiles.map(f=>fetch(basePath+f).then(r=>r.json())));
})
.then(seasons=>{
  let bestInnings = [];
  let bestBowling = [];
  let seasonRuns = {};
  let seasonWickets = {};

  seasons.forEach((seasonData, i)=>{
    const seasonFile = seasons[i];
    const seasonYear = seasonData[0]?.info?.season || "Unknown";

    seasonRuns[seasonYear] = seasonRuns[seasonYear] || {};
    seasonWickets[seasonYear] = seasonWickets[seasonYear] || {};

    seasonData.forEach(match=>{
      let batMap = {};
      let bowlMap = {};

      match.innings.forEach(inn=>{
        inn.overs.forEach(over=>{
          over.deliveries.forEach(d=>{
            if(d.batter){
              batMap[d.batter] = (batMap[d.batter]||0) + d.runs.batter;
              seasonRuns[seasonYear][d.batter] = (seasonRuns[seasonYear][d.batter]||0) + d.runs.batter;
            }
            if(d.bowler){
              if(!d.extras?.byes && !d.extras?.legbyes){
                bowlMap[d.bowler] = bowlMap[d.bowler] || {wkts:0,runs:0};
                bowlMap[d.bowler].runs += d.runs.total;
              }
              if(d.wickets){
                d.wickets.forEach(w=>{
                  if(w.kind !== "run out"){
                    bowlMap[d.bowler] = bowlMap[d.bowler] || {wkts:0,runs:0};
                    bowlMap[d.bowler].wkts++;
                    seasonWickets[seasonYear][d.bowler] = (seasonWickets[seasonYear][d.bowler]||0) + 1;
                  }
                });
              }
            }
          });
        });
      });

      Object.entries(batMap).forEach(([p,r])=>{
        bestInnings.push({
          player:p,
          runs:r,
          season:seasonYear,
          match:match.info.teams.join(" vs ")
        });
      });

      Object.entries(bowlMap).forEach(([p,obj])=>{
        bestBowling.push({
          player:p,
          wkts:obj.wkts,
          runs:obj.runs,
          season:seasonYear,
          match:match.info.teams.join(" vs ")
        });
      });
    });
  });

  bestInnings.sort((a,b)=>b.runs-a.runs);
  bestBowling.sort((a,b)=>b.wkts-a.wkts || a.runs-b.runs);

  bestInnings.slice(0,10).forEach(r=>{
    highestScoreTable.innerHTML += `<tr><td>${r.player}</td><td>${r.runs}</td><td>${r.season}</td><td>${r.match}</td></tr>`;
  });

  bestBowling.slice(0,10).forEach(r=>{
    bestBowlingTable.innerHTML += `<tr><td>${r.player}</td><td>${r.wkts} / ${r.runs}</td><td>${r.season}</td><td>${r.match}</td></tr>`;
  });

  const runsList = [];
  Object.entries(seasonRuns).forEach(([season,players])=>{
    Object.entries(players).forEach(([p,r])=>{
      runsList.push({player:p,runs:r,season});
    });
  });

  runsList.sort((a,b)=>b.runs-a.runs);
  runsList.slice(0,10).forEach(r=>{
    mostRunsSeasonTable.innerHTML += `<tr><td>${r.player}</td><td>${r.runs}</td><td>${r.season}</td></tr>`;
  });

  const wicketList = [];
  Object.entries(seasonWickets).forEach(([season,players])=>{
    Object.entries(players).forEach(([p,w])=>{
      wicketList.push({player:p,wkts:w,season});
    });
  });

  wicketList.sort((a,b)=>b.wkts-a.wkts);
  wicketList.slice(0,10).forEach(r=>{
    mostWicketsSeasonTable.innerHTML += `<tr><td>${r.player}</td><td>${r.wkts}</td><td>${r.season}</td></tr>`;
  });
});
</script>

</body>
</html>
