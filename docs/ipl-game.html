<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:10px;font-size:18px;opacity:0.95;}

.section{
  margin-top:30px;
}

.section h2{
  margin-bottom:6px;
  color:#3b007a;
}

.total-line{
  font-weight:700;
  margin-bottom:8px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}

a.player-link{
  color:#3b007a;
  font-weight:600;
  text-decoration:none;
}
a.player-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="ipl-player.html">IPL Players</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="matchTitle">Loading match…</h1>
  <p id="matchMeta"></p>
</div>

<div id="scorecard"></div>

</div>

<script>
const params = new URLSearchParams(location.search);
const file = params.get("file");
const index = parseInt(params.get("i"));

if(!file || isNaN(index)){
  document.getElementById("matchTitle").textContent = "No match selected";
  throw "Bad link";
}

function playerLink(name){
  return `<a class="player-link" href="ipl-player.html?player=${encodeURIComponent(name)}">${name}</a>`;
}

fetch("data/ipl/"+file)
.then(r=>r.json())
.then(season=>{
  const match = season[index];
  if(!match){
    document.getElementById("matchTitle").textContent = "Match not found";
    return;
  }

  const info = match.info;
  const innings = Array.isArray(match.innings) ? match.innings : Object.values(match.innings);
  const inn = innings[0]; // T20 = 1 innings per team

  document.getElementById("matchTitle").textContent = info.teams.join(" vs ");
  document.getElementById("matchMeta").textContent =
    (info.venue||"") + " • " + new Date(info.dates[0]).toDateString() +
    " • Winner: " + (info.outcome?.winner || "—");

  const team = inn.team;
  const batMap = {};
  const bowlMap = {};

  let teamRuns = 0;
  let teamWkts = 0;
  let teamBalls = 0;

  inn.overs.forEach(over=>{
    over.deliveries.forEach(d=>{
      teamRuns += d.runs.total;
      if(!d.extras?.wides) teamBalls++;

      if(d.batter){
        batMap[d.batter] = batMap[d.batter] || {runs:0, balls:0, out:"not out"};
        batMap[d.batter].runs += d.runs.batter;
        if(!d.extras?.wides) batMap[d.batter].balls++;
      }

      if(d.bowler){
        bowlMap[d.bowler] = bowlMap[d.bowler] || {runs:0, balls:0, wkts:0};
        bowlMap[d.bowler].balls++;
        if(!d.extras?.byes && !d.extras?.legbyes){
          bowlMap[d.bowler].runs += d.runs.total;
        }
      }

      if(d.wickets){
        d.wickets.forEach(w=>{
          teamWkts++;

          const batter = w.player_out;
          const bowler = d.bowler;
          const fielders = w.fielders?.map(f=>playerLink(f.name)).join(", ");

          let howOut = w.kind;

          if(w.kind === "caught"){
            howOut = `c ${fielders} b ${playerLink(bowler)}`;
          }
          else if(w.kind === "lbw"){
            howOut = `lbw b ${playerLink(bowler)}`;
          }
          else if(w.kind === "bowled"){
            howOut = `b ${playerLink(bowler)}`;
          }
          else if(w.kind === "run out"){
            howOut = `run out (${fielders})`;
          }
          else{
            howOut = `${w.kind} b ${playerLink(bowler)}`;
          }

          if(batMap[batter]){
            batMap[batter].out = howOut;
          }

          if(bowler){
            bowlMap[bowler].wkts++;
          }
        });
      }
    });
  });

  let html = `
    <div class="section">
      <h2>${team} Innings</h2>
      <div class="total-line">Total: ${teamRuns}/${teamWkts} (${(teamBalls/6).toFixed(1)} ov)</div>

      <table>
        <tr>
          <th>Batter</th>
          <th>How out</th>
          <th>R</th>
          <th>B</th>
          <th>SR</th>
        </tr>
        ${Object.entries(batMap).map(([p,s])=>{
          const sr = s.balls ? ((s.runs/s.balls)*100).toFixed(1) : "—";
          return `
            <tr>
              <td>${playerLink(p)}</td>
              <td>${s.out}</td>
              <td>${s.runs}</td>
              <td>${s.balls}</td>
              <td>${sr}</td>
            </tr>
          `;
        }).join("")}
      </table>
    </div>

    <div class="section">
      <h2>Bowling</h2>
      <table>
        <tr>
          <th>Bowler</th>
          <th>O</th>
          <th>R</th>
          <th>W</th>
        </tr>
        ${Object.entries(bowlMap).map(([p,s])=>`
          <tr>
            <td>${playerLink(p)}</td>
            <td>${(s.balls/6).toFixed(1)}</td>
            <td>${s.runs}</td>
            <td>${s.wkts||0}</td>
          </tr>
        `).join("")}
      </table>
    </div>
  `;

  document.getElementById("scorecard").innerHTML = html;
});
</script>

</body>
</html>
