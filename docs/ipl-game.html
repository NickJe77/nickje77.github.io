<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui;margin:0}
.hero{background:linear-gradient(90deg,#3b007a,#7b2cbf);color:#fff;padding:40px;border-radius:20px;margin:20px}
.box{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px}
</style>
</head>

<body>

<div class="hero">
  <h1 id="title">Loading match…</h1>
  <p id="meta"></p>
</div>

<div id="data"></div>

<script>
const params=new URLSearchParams(location.search);
const file=params.get("file");
const i=params.get("i");

if(!file||i===null){
  document.getElementById("title").textContent="No match selected";
  throw "no match";
}

fetch("data/ipl/"+file)
.then(r=>r.json())
.then(season=>{
  const match=season[i];
  if(!match){
    document.getElementById("title").textContent="Match not found";
    return;
  }

  document.getElementById("title").textContent=match.info.teams.join(" vs ");
  document.getElementById("meta").textContent=
    match.info.venue+" • "+new Date(match.info.dates[0]).toDateString();

  document.getElementById("data").innerHTML=`
    <div class="box"><strong>Teams:</strong> ${match.info.teams.join(" vs ")}</div>
    <div class="box"><strong>Venue:</strong> ${match.info.venue}</div>
    <div class="box"><strong>Date:</strong> ${new Date(match.info.dates[0]).toLocaleDateString()}</div>
    <div class="box"><strong>Winner:</strong> ${match.info.outcome?.winner||"—"}</div>
  `;
});
</script>

</body>
</html>
