<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.page{
max-width:1000px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

.innings-title{
color:#5b2ca0;
font-size:26px;
font-weight:800;
margin-bottom:5px;
}

.score{
font-size:20px;
font-weight:700;
margin-bottom:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:25px;
}

th{
text-align:left;
padding:10px;
border-bottom:2px solid #ddd;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

tbody tr:nth-child(even){
background:#f4f8ff;
}

.player{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div id="matchContainer">
<div class="hero">Loading match...</div>
</div>

</div>

<script>

const file=new URLSearchParams(location.search).get("file");

if(!file){

document.getElementById("matchContainer").innerHTML=
"<div class='hero'>Invalid match link</div>";

throw new Error();

}

loadMatch();

async function loadMatch(){

const res=await fetch(file);
const matches=await res.json();

const match =
matches.find(m=>m.info?.event?.stage==="Final")
||matches[matches.length-1];

renderMatch(match);

}

function renderMatch(match){

const container=document.getElementById("matchContainer");

container.innerHTML=`
<div class="hero">
<h1>${match.info.teams.join(" vs ")}</h1>
<div>${match.info.venue}</div>
<div>${match.info.dates.join(", ")}</div>
</div>
`;

match.innings.forEach(inn=>{

const innings=inn.team?inn:Object.values(inn)[0];

const stats=parseInnings(innings);

const div=document.createElement("div");

div.className="card";

div.innerHTML=`

<div class="innings-title">
${innings.team} Innings
</div>

<div class="score">
${stats.runs}/${stats.wickets} (${stats.overs} overs)
</div>

<h3>Batting</h3>

${battingTable(stats.batting)}

<h3>Bowling</h3>

${bowlingTable(stats.bowling)}

`;

container.appendChild(div);

});

}

function parseInnings(innings){

const deliveries=
innings.deliveries
||innings.overs.flatMap(o=>o.deliveries);

let runs=0;
let wickets=0;
let balls=0;

const batting={};
const bowling={};

deliveries.forEach(d=>{

runs+=d.runs.total;

if(!d.extras?.wides) balls++;

const batter=d.batter;
const bowler=d.bowler;

if(!batting[batter])
batting[batter]={runs:0,balls:0,out:"not out"};

batting[batter].runs+=d.runs.batter;

if(!d.extras?.wides)
batting[batter].balls++;

if(d.wickets){

d.wickets.forEach(w=>{

wickets++;

batting[w.player_out].out=
buildDismissal(w,bowler);

if(!bowling[bowler])
bowling[bowler]={runs:0,balls:0,wickets:0};

bowling[bowler].wickets++;

});

}

if(!bowling[bowler])
bowling[bowler]={runs:0,balls:0,wickets:0};

bowling[bowler].runs+=d.runs.total;

if(!d.extras?.wides)
bowling[bowler].balls++;

});

return{

runs,
wickets,
overs:Math.floor(balls/6)+"."+(balls%6),

batting:Object.entries(batting),
bowling:Object.entries(bowling)

};

}

function buildDismissal(w,bowler){

if(w.kind==="bowled")
return `b ${bowler}`;

if(w.kind==="caught")
return `c ${w.fielders?.[0]?.name || ""} b ${bowler}`;

if(w.kind==="lbw")
return `lbw b ${bowler}`;

return w.kind;

}

function battingTable(rows){

let html=`
<table>
<thead>
<tr>
<th>Batter</th>
<th>How out</th>
<th>R</th>
<th>B</th>
<th>SR</th>
</tr>
</thead>
<tbody>
`;

rows.forEach(([name,s])=>{

const sr=s.balls?((s.runs/s.balls)*100).toFixed(1):"";

html+=`
<tr>
<td>
<a class="player" href="t20-player.html?name=${encodeURIComponent(name)}">
${name}
</a>
</td>
<td>${s.out}</td>
<td>${s.runs}</td>
<td>${s.balls}</td>
<td>${sr}</td>
</tr>
`;

});

html+="</tbody></table>";

return html;

}

function bowlingTable(rows){

let html=`
<table>
<thead>
<tr>
<th>Bowler</th>
<th>O</th>
<th>R</th>
<th>W</th>
</tr>
</thead>
<tbody>
`;

rows.forEach(([name,s])=>{

html+=`
<tr>
<td>
<a class="player" href="t20-player.html?name=${encodeURIComponent(name)}">
${name}
</a>
</td>
<td>${Math.floor(s.balls/6)+"."+(s.balls%6)}</td>
<td>${s.runs}</td>
<td>${s.wickets}</td>
</tr>
`;

});

html+="</tbody></table>";

return html;

}

</script>

</body>
</html>
