<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1100px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

/* RED TEAM BOX */
.team-box{
background:#e10600;
color:white;
padding:12px 18px;
border-radius:10px;
display:inline-block;
font-weight:800;
font-size:18px;
margin-bottom:10px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:18px;
}

.scoreline{
font-size:22px;
font-weight:800;
margin-bottom:10px;
}

.section-title{
font-weight:800;
margin:12px 0 8px;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:14px;
}

th{
text-align:left;
border-bottom:2px solid #ddd;
padding:8px;
}

td{
padding:8px;
}

tbody tr:nth-child(even){
background:#f4f8ff;
}

/* CLICKABLE PLAYER */
.player-link{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

.player-link:hover{
text-decoration:underline;
}

.small{
font-size:14px;
opacity:0.9;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div id="matchContainer">
<div class="hero">Loading match...</div>
</div>

</div>

<script>

const params=new URLSearchParams(window.location.search);
const file=params.get("file");

if(!file){

document.getElementById("matchContainer").innerHTML=
"<div class='hero'>Invalid match link</div>";

throw new Error("Missing file");

}

loadMatch();

async function loadMatch(){

const res=await fetch(file,{cache:"no-store"});
const matches=await res.json();

const match=
matches.find(m=>m.info?.event?.stage==="Final")
||matches[matches.length-1];

renderMatch(match);

}

function renderMatch(match){

const c=document.getElementById("matchContainer");

c.innerHTML=`
<div class="hero">
<h1>${match.info.teams.join(" vs ")}</h1>
<div>${match.info.venue}</div>
<div>${match.info.dates.join(", ")}</div>
</div>
`;

match.innings.forEach(innObj=>{

const inn=Object.values(innObj)[0];

const parsed=parseInnings(inn);

const div=document.createElement("div");
div.className="card";

div.innerHTML=`

<div class="team-box">${parsed.team}</div>

<div class="scoreline">
${parsed.runs}/${parsed.wkts} (${parsed.overs})
</div>

<div class="section-title">Batting</div>
${battingTable(parsed.batting)}

<div class="section-title">Fall of wickets</div>
${fallTable(parsed.fall)}

<div class="section-title">Bowling</div>
${bowlingTable(parsed.bowling)}

<div class="small"><strong>Extras:</strong> ${parsed.extras}</div>
`;

c.appendChild(div);

});

}

function parseInnings(innings){

const deliveries=getDeliveries(innings);

let runs=0;
let wkts=0;
let balls=0;
let extras=0;

const batting={};
const bowling={};
const fall=[];

for(const d of deliveries){

const batter=d.batter;
const bowler=d.bowler;

const rB=d.runs?.batter||0;
const rT=d.runs?.total||0;
const rE=d.runs?.extras||0;

runs+=rT;
extras+=rE;

if(!isWide(d)) balls++;

if(!batting[batter])
batting[batter]={runs:0,balls:0};

batting[batter].runs+=rB;
if(!isWide(d)) batting[batter].balls++;

if(!bowling[bowler])
bowling[bowler]={runs:0,balls:0,wkts:0};

bowling[bowler].runs+=rT;
if(!isWide(d)) bowling[bowler].balls++;

if(d.wickets){

d.wickets.forEach(w=>{

wkts++;
bowling[bowler].wkts++;

fall.push({
score:runs,
player:w.player_out
});

});

}

}

return{

team:innings.team,
runs,
wkts,
overs:formatOvers(balls),
extras,

batting:Object.entries(batting),
bowling:Object.entries(bowling),
fall

};

}

function battingTable(rows){

let html=`<table><tr><th>Batter</th><th>R</th><th>B</th><th>SR</th></tr>`;

rows.forEach(([name,s])=>{

const sr=s.balls?((s.runs/s.balls)*100).toFixed(1):"";

html+=`
<tr>
<td><a class="player-link" href="t20-player.html?name=${encodeURIComponent(name)}">${name}</a></td>
<td>${s.runs}</td>
<td>${s.balls}</td>
<td>${sr}</td>
</tr>`;

});

html+="</table>";
return html;

}

function bowlingTable(rows){

let html=`<table><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>`;

rows.forEach(([name,s])=>{

const overs=formatOvers(s.balls);
const econ=(s.runs/(s.balls/6)).toFixed(1);

html+=`
<tr>
<td><a class="player-link" href="t20-player.html?name=${encodeURIComponent(name)}">${name}</a></td>
<td>${overs}</td>
<td>${s.runs}</td>
<td>${s.wkts}</td>
<td>${econ}</td>
</tr>`;

});

html+="</table>";
return html;

}

function fallTable(fall){

if(!fall.length) return "<div class='small'>None</div>";

let html="<table><tr><th>Score</th><th>Player</th></tr>";

fall.forEach(f=>{

html+=`
<tr>
<td>${f.score}</td>
<td>${f.player_out}</td>
</tr>`;

});

html+="</table>";
return html;

}

function getDeliveries(innings){

if(innings.overs)
return innings.overs.flatMap(o=>o.deliveries);

return innings.deliveries||[];

}

function isWide(d){

return d.extras?.wides;

}

function formatOvers(balls){

return Math.floor(balls/6)+"."+(balls%6);

}

</script>

</body>
</html>
