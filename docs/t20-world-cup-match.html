<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

.container{
width:90%;
margin:40px auto;
background:white;
padding:30px;
border-radius:16px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

h1{
margin-top:0;
color:#6a040f;
}

.score{
font-size:24px;
font-weight:700;
margin:10px 0;
}

.info{
color:#555;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container">

<h1 id="title">Loading...</h1>

<div id="score" class="score"></div>

<div id="info" class="info"></div>

</div>

<script>


const params =
new URLSearchParams(window.location.search);

const file =
params.get("file");

const date =
params.get("date");


const path =
"data/t20-world-cup/matches/" + file;


function getScore(match,team){

for(const inn of match.innings){

const name=
Object.keys(inn)[0];

if(name===team){

return inn[name].runs+"-"+inn[name].wickets;

}

}

return "";

}


async function load(){

const res=
await fetch(path);

const matches=
await res.json();


/* FIND MATCH BY DATE */

const match=
matches.find(m=>
m.info.dates[0]===date
);


if(!match){

document.getElementById("title")
.innerText="Match not found";

return;

}


const info=
match.info;

const winner=
info.outcome.winner;

const runner=
info.teams.find(t=>t!==winner);

const winnerScore=
getScore(match,winner);

const runnerScore=
getScore(match,runner);


document.getElementById("title")
.innerText=
`${winner} vs ${runner}`;


document.getElementById("score")
.innerText=
`${winner} ${winnerScore} def ${runner} ${runnerScore}`;


document.getElementById("info")
.innerText=
`${info.venue} • ${info.dates[0]}`;

}


load();


</script>

</body>
</html>
