<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:28px;
  padding:18px;
  background:#ffffff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.container{
  width:90%;
  margin:30px auto;
}

.card{
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

h1{
  margin-top:0;
  color:#6a040f;
}

.score{
  font-size:22px;
  font-weight:700;
  margin:10px 0;
}

.info{
  color:#555;
  margin-bottom:20px;
}

.innings{
  margin-top:20px;
}

.innings h2{
  color:#6a040f;
  margin-bottom:10px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#6a040f;
  color:white;
  padding:10px;
  text-align:left;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="container">

<div class="card">

<h1 id="title">Loading match...</h1>

<div id="score" class="score"></div>

<div id="info" class="info"></div>

<div id="innings"></div>

</div>

</div>

<script>


const params =
new URLSearchParams(window.location.search);

const file =
params.get("file");

const matchIndex =
parseInt(params.get("matchIndex"),10);


if(!file || isNaN(matchIndex)){

document.getElementById("title").innerText =
"Invalid match link";

throw new Error("Missing parameters");

}


const path =
"data/t20-world-cup/matches/" + file;


function getScore(match,team){

for(const inn of match.innings){

const name =
Object.keys(inn)[0];

if(name===team){

return inn[name].runs +
"-" +
inn[name].wickets;

}

}

return "";

}


async function load(){

const res =
await fetch(path);

const matches =
await res.json();


const match =
matches[matchIndex];


if(!match){

document.getElementById("title").innerText =
"Match not found";

return;

}


const info =
match.info;

const winner =
info.outcome.winner;

const runner =
info.teams.find(t=>t!==winner);


const winnerScore =
getScore(match,winner);

const runnerScore =
getScore(match,runner);


document.getElementById("title").innerText =
winner + " vs " + runner;


document.getElementById("score").innerText =
winner + " " + winnerScore +
" def " +
runner + " " + runnerScore;


document.getElementById("info").innerText =
info.venue + " • " + info.dates[0];



/* FULL INNINGS */

const inningsDiv =
document.getElementById("innings");

inningsDiv.innerHTML = "";


for(const inn of match.innings){

const team =
Object.keys(inn)[0];

const data =
inn[team];


let html =
`<div class="innings">
<h2>${team} ${data.runs}-${data.wickets}</h2>

<table>
<tr>
<th>Batter</th>
<th>Runs</th>
<th>Balls</th>
</tr>`;


for(const over of data.overs){

for(const ball of over.deliveries){

const batter =
Object.keys(ball)[0];

const runs =
ball[batter].runs.batter;

html +=
`<tr>
<td>${batter}</td>
<td>${runs}</td>
<td>1</td>
</tr>`;

}

}


html += "</table></div>";

inningsDiv.innerHTML += html;

}


}


load();


</script>

</body>
</html>
