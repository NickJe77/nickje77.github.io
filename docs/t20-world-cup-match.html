<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1000px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

.innings{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.score{
font-size:22px;
font-weight:700;
margin-bottom:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:15px;
}

th{
text-align:left;
border-bottom:2px solid #ddd;
padding:8px;
}

td{
padding:8px;
}

tbody tr:nth-child(even){
background:#f4f8ff;
}

.section-title{
font-weight:700;
margin:10px 0 5px;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div id="matchContainer">
<div class="hero">Loading match...</div>
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const file = params.get("file");

if(!file){

document.getElementById("matchContainer").innerHTML =
"<div class='hero'>Invalid match link</div>";

throw new Error("Missing file");

}

loadMatch();

async function loadMatch(){

const res = await fetch(file,{cache:"no-store"});
const matches = await res.json();

let match =
matches.find(m => m.info?.event?.stage==="Final")
|| matches[matches.length-1];

renderMatch(match);

}

function renderMatch(match){

const container=document.getElementById("matchContainer");

container.innerHTML=`
<div class="hero">
<h1>${match.info.teams.join(" vs ")}</h1>
<div>${match.info.venue}</div>
<div>${match.info.dates.join(", ")}</div>
</div>
`;

match.innings.forEach(innObj=>{

const innings=Object.values(innObj)[0];

const stats=parseInnings(innings);

const div=document.createElement("div");
div.className="innings";

div.innerHTML=`
<h2>${innings.team}</h2>

<div class="score">
${stats.runs}/${stats.wickets} (${stats.overs})
</div>

<div class="section-title">Batting</div>
${battingTable(stats.batting)}

<div class="section-title">Bowling</div>
${bowlingTable(stats.bowling)}

<div><strong>Extras:</strong> ${stats.extras}</div>
`;

container.appendChild(div);

});

}

function parseInnings(innings){

let runs=0;
let wickets=0;
let balls=0;
let extras=0;

const batting={};
const bowling={};

innings.overs.forEach(over=>{

over.deliveries.forEach(delivery=>{

const batter=delivery.batter;
const bowler=delivery.bowler;

const batterRuns=delivery.runs?.batter||0;
const totalRuns=delivery.runs?.total||0;
const extraRuns=delivery.runs?.extras||0;

runs+=totalRuns;
extras+=extraRuns;
balls++;

if(!batting[batter])
batting[batter]={runs:0,balls:0};

batting[batter].runs+=batterRuns;
batting[batter].balls++;

if(!bowling[bowler])
bowling[bowler]={runs:0,balls:0,wickets:0};

bowling[bowler].runs+=totalRuns;
bowling[bowler].balls++;

if(delivery.wickets){

wickets+=delivery.wickets.length;
bowling[bowler].wickets+=delivery.wickets.length;

}

});

});

const overs=Math.floor(balls/6)+"."+(balls%6);

return{
runs,
wickets,
overs,
extras,
batting:Object.entries(batting),
bowling:Object.entries(bowling)
};

}

function battingTable(batting){

let html=`
<table>
<tr>
<th>Batter</th>
<th>R</th>
<th>B</th>
<th>SR</th>
</tr>
`;

batting.forEach(([name,s])=>{

const sr=s.balls?((s.runs/s.balls)*100).toFixed(1):"0";

html+=`
<tr>
<td>${name}</td>
<td>${s.runs}</td>
<td>${s.balls}</td>
<td>${sr}</td>
</tr>
`;

});

html+="</table>";

return html;

}

function bowlingTable(bowling){

let html=`
<table>
<tr>
<th>Bowler</th>
<th>O</th>
<th>R</th>
<th>W</th>
<th>Econ</th>
</tr>
`;

bowling.forEach(([name,s])=>{

const overs=(s.balls/6).toFixed(1);
const econ=(s.runs/(s.balls/6)).toFixed(1);

html+=`
<tr>
<td>${name}</td>
<td>${overs}</td>
<td>${s.runs}</td>
<td>${s.wickets}</td>
<td>${econ}</td>
</tr>
`;

});

html+="</table>";

return html;

}

</script>

</body>
</html>
