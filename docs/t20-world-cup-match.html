<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.page{
max-width:1000px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.innings-title{
color:#e10600;
font-size:24px;
font-weight:800;
margin-bottom:6px;
}

.score{
font-size:18px;
font-weight:700;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:18px;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
border-bottom:2px solid #ddd;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.player{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

.player:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">
<div id="matchContainer">
<div class="hero">Loading match...</div>
</div>
</div>

<script>

const file=new URLSearchParams(location.search).get("file");

loadMatch();

async function loadMatch(){

const res=await fetch(file);
const matches=await res.json();

const match=
matches.find(m=>m.info?.event?.stage==="Final")
||matches[matches.length-1];

renderMatch(match);

}

function renderMatch(match){

const container=document.getElementById("matchContainer");

container.innerHTML=`
<div class="hero">
<h1>${match.info.teams.join(" vs ")}</h1>
<div>${match.info.venue}</div>
<div>${match.info.dates.join(", ")}</div>
</div>
`;

match.innings.forEach(innings=>{

const stats=parseInnings(innings);

const div=document.createElement("div");

div.className="card";

div.innerHTML=`

<div class="innings-title">
${innings.team} Innings
</div>

<div class="score">
${stats.runs}/${stats.wickets} (${stats.overs} overs)
</div>

<h3>Batting</h3>

${battingTable(stats.batting)}

<h3>Bowling</h3>

${bowlingTable(stats.bowling)}

`;

container.appendChild(div);

});

}

function parseInnings(innings){

const deliveries=innings.overs.flatMap(o=>o.deliveries);

let runs=0;
let wickets=0;
let legalBalls=0;

const batting={};
const bowling={};

deliveries.forEach(d=>{

runs+=d.runs.total;

const legal=!d.extras?.wides && !d.extras?.noballs;

if(legal) legalBalls++;

const batter=d.batter;
const bowler=d.bowler;

if(!batting[batter])
batting[batter]={runs:0,balls:0,out:"not out"};

batting[batter].runs+=d.runs.batter;

if(legal) batting[batter].balls++;

if(!bowling[bowler])
bowling[bowler]={runs:0,balls:0,wickets:0};

bowling[bowler].runs+=d.runs.total;

if(legal) bowling[bowler].balls++;

if(d.wickets){

d.wickets.forEach(w=>{

wickets++;

batting[w.player_out].out=getDismissalText(w,bowler);

bowling[bowler].wickets++;

});

}

});

return{

runs,
wickets,
overs:`${Math.floor(legalBalls/6)}.${legalBalls%6}`,
batting:Object.entries(batting),
bowling:Object.entries(bowling)

};

}

/* PROPER DISMISSAL TEXT */

function getDismissalText(w,bowler){

const kind=w.kind;

if(kind==="bowled")
return `b ${bowler}`;

if(kind==="caught")
return `c ${w.fielders?.[0]?.name||""} b ${bowler}`;

if(kind==="lbw")
return `lbw b ${bowler}`;

if(kind==="run out")
return `run out (${w.fielders?.map(f=>f.name).join(", ")||""})`;

return kind;

}

/* PLAYER LINK WITH DIRECT ANCHOR */

function playerLink(name){

const encoded=encodeURIComponent(name);

return `t20-world-cup-player.html?name=${encoded}#${encoded}`;

}

function battingTable(rows){

let html=`
<table>
<thead>
<tr>
<th>Batter</th>
<th>How out</th>
<th>R</th>
<th>B</th>
<th>SR</th>
</tr>
</thead>
<tbody>
`;

rows.forEach(([name,s])=>{

const sr=s.balls?((s.runs/s.balls)*100).toFixed(1):"";

html+=`
<tr>
<td>
<a class="player" href="${playerLink(name)}">
${name}
</a>
</td>
<td>${s.out}</td>
<td>${s.runs}</td>
<td>${s.balls}</td>
<td>${sr}</td>
</tr>
`;

});

html+="</tbody></table>";

return html;

}

function bowlingTable(rows){

let html=`
<table>
<thead>
<tr>
<th>Bowler</th>
<th>O</th>
<th>R</th>
<th>W</th>
<th>Econ</th>
</tr>
</thead>
<tbody>
`;

rows.forEach(([name,s])=>{

const overs=`${Math.floor(s.balls/6)}.${s.balls%6}`;

const econ=(s.runs/(s.balls/6)).toFixed(1);

html+=`
<tr>
<td>
<a class="player" href="${playerLink(name)}">
${name}
</a>
</td>
<td>${overs}</td>
<td>${s.runs}</td>
<td>${s.wickets}</td>
<td>${econ}</td>
</tr>
`;

});

html+="</tbody></table>";

return html;

}

</script>

</body>
</html>
