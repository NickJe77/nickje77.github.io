<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}
.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1100px;
margin:30px auto;
padding:0 20px;
}

.matchHeader{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.matchHeader h1{
margin:0 0 6px 0;
}

.matchMeta{
margin-top:4px;
opacity:0.95;
}

.innings{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.teamHeader{
display:inline-block;
background:#e10600;
color:#fff;
padding:6px 12px;
border-radius:6px;
font-weight:700;
margin-bottom:10px;
}

.score{
font-size:22px;
font-weight:700;
margin-bottom:12px;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:15px;
table-layout:fixed;
}

th{
padding:8px;
border-bottom:2px solid #ddd;
font-weight:700;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

.left{ text-align:left; }
.num{ text-align:right; font-variant-numeric:tabular-nums; }

tr:nth-child(even){
background:#f8fbff;
}

.playerLink{
color:#0056d6;
font-weight:600;
text-decoration:none;
}
.playerLink:hover{ text-decoration:underline; }

.sectionTitle{
font-weight:700;
margin-top:10px;
margin-bottom:6px;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">
<div id="matchContainer">
<div class="matchHeader">Loading match...</div>
</div>
</div>

<script>

const params=new URLSearchParams(window.location.search);
const season=params.get("season");
const id=params.get("id");

const MATCH_PATH="data/t20-world-cup/matches/";

loadMatch();

function getMatchesArray(data){
if(Array.isArray(data)) return data;
if(data && Array.isArray(data.matches)) return data.matches;
return [];
}

function getMatchStableId(m){
const info=m?.info || {};
return (
info.event?.match_number ||
info.match_type_number ||
info.match_number ||
info.match_id ||
null
);
}

function deriveTeams(match){
const info=match.info || {};

// 1) Use info.teams if valid
if(Array.isArray(info.teams) && info.teams.length===2)
return info.teams;

// 2) Derive from innings
if(Array.isArray(match.innings)){
const uniqueTeams=[...new Set(match.innings.map(i=>i.team))];
if(uniqueTeams.length>=2)
return [uniqueTeams[0], uniqueTeams[1]];
}

// 3) Fallback
return ["Unknown", "Unknown"];
}

async function loadMatch(){

const container=document.getElementById("matchContainer");

if(!season || !id){
container.innerHTML=`<div class="matchHeader"><h1>Match not found</h1></div>`;
return;
}

const file=`${MATCH_PATH}t20wc_${season}_FULL.json`;

let data;

try{
const res=await fetch(file);
if(!res.ok) throw new Error();
data=await res.json();
}catch{
container.innerHTML=`<div class="matchHeader"><h1>Match file not found</h1></div>`;
return;
}

const matches=getMatchesArray(data);

const match=matches.find(m=>String(getMatchStableId(m))===String(id));

if(!match){
container.innerHTML=`<div class="matchHeader"><h1>Match not found</h1></div>`;
return;
}

renderMatch(match);
}

function playerLink(name){
return `<a href="t20-world-cup-player.html?player=${encodeURIComponent(name)}" class="playerLink">${name}</a>`;
}

function dismissalText(w,bowler){

const fielder =
w.fielders && w.fielders.length
? playerLink(w.fielders[0].name)
: "";

const bowlerLink = playerLink(bowler);

if(w.kind==="caught") return `c ${fielder} b ${bowlerLink}`;
if(w.kind==="bowled") return `b ${bowlerLink}`;
if(w.kind==="lbw") return `lbw b ${bowlerLink}`;
if(w.kind==="stumped") return `st ${fielder} b ${bowlerLink}`;
if(w.kind==="run out") return fielder ? `run out (${fielder})` : "run out";
if(w.kind==="caught and bowled") return `c & b ${bowlerLink}`;
if(w.kind==="hit wicket") return `hit wicket b ${bowlerLink}`;

return w.kind;
}

function renderMatch(match){

const container=document.getElementById("matchContainer");
const info=match.info || {};
const outcome=info.outcome;
const toss=info.toss;

const teams=deriveTeams(match);

document.title=`${teams.join(" vs ")} (${season}) | The Sporting Almanac`;

let resultText="";
if(outcome?.winner){
if(outcome.by?.runs)
resultText=`${outcome.winner} won by ${outcome.by.runs} runs`;
else if(outcome.by?.wickets)
resultText=`${outcome.winner} won by ${outcome.by.wickets} wickets`;
else
resultText=`${outcome.winner} won`;
}

container.innerHTML=`
<div class="matchHeader">
<h1>${teams.join(" vs ")}</h1>
<div class="matchMeta">${info.venue || ""}</div>
<div class="matchMeta">${info.dates?.join(", ") || ""}</div>
<div class="matchMeta">${resultText}</div>
<div class="matchMeta">Toss: ${toss?.winner || ""} (${toss?.decision || ""})</div>
<div class="matchMeta">
Player of the match:
${info.player_of_match?.map(playerLink).join(", ") || ""}
</div>
</div>
`;

if(!Array.isArray(match.innings)) return;

match.innings.forEach(inn=>{

let runs=0;
let wickets=0;
let legalBalls=0;

let extrasTotal=0;
const extrasBreakdown={w:0,nb:0,b:0,lb:0,p:0};

const batting={};
const bowling={};
const fow=[];

if(!Array.isArray(inn.overs)) return;

inn.overs.forEach(over=>{
if(!Array.isArray(over.deliveries)) return;

over.deliveries.forEach(d=>{

const batter=d.batter;
const bowler=d.bowler;

if(!batter || !bowler) return;

const wides=d.extras?.wides||0;
const noballs=d.extras?.noballs||0;
const byes=d.extras?.byes||0;
const legbyes=d.extras?.legbyes||0;
const penalty=d.extras?.penalty||0;

extrasBreakdown.w+=wides;
extrasBreakdown.nb+=noballs;
extrasBreakdown.b+=byes;
extrasBreakdown.lb+=legbyes;
extrasBreakdown.p+=penalty;
extrasTotal+=wides+noballs+byes+legbyes+penalty;

const legal=!wides&&!noballs;

if(!batting[batter])
batting[batter]={runs:0,balls:0,fours:0,sixes:0,out:null};

batting[batter].runs+=d.runs?.batter||0;

if(d.runs?.batter===4) batting[batter].fours++;
if(d.runs?.batter===6) batting[batter].sixes++;

if(legal){
batting[batter].balls++;
legalBalls++;
}

if(!bowling[bowler])
bowling[bowler]={runs:0,balls:0,wickets:0};

if(legal) bowling[bowler].balls++;

bowling[bowler].runs+=d.runs?.total||0;
runs+=d.runs?.total||0;

if(d.wickets){
d.wickets.forEach(w=>{
wickets++;
batting[w.player_out].out=dismissalText(w,bowler);
bowling[bowler].wickets++;
fow.push(`${runs}/${wickets} (${playerLink(w.player_out)})`);
});
}

});
});

const overs=Math.floor(legalBalls/6)+"."+(legalBalls%6);

const div=document.createElement("div");
div.className="innings";

div.innerHTML=`
<div class="teamHeader">${inn.team}</div>
<div class="score">${runs}/${wickets} (${overs} overs)</div>
`;

container.appendChild(div);

});

}

</script>

</body>
</html>
