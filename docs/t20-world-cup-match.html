<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1000px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

.innings{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

h2{
margin:0 0 10px 0;
}
</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div id="matchContainer">

<div class="hero">
Loading match...
</div>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const file = params.get("file");
const matchId = params.get("match"); // optional now

if(!file){

document.getElementById("matchContainer").innerHTML =
"<div class='hero'>Invalid match link</div>";

throw new Error("Missing file parameter");

}

loadMatch();

async function loadMatch(){

const res = await fetch(file, {cache:"no-store"});

if(!res.ok){

document.getElementById("matchContainer").innerHTML =
"<div class='hero'>Match file not found</div>";

return;

}

const matches = await res.json();

let match = null;

// PRIORITY 1: use match_id if provided
if(matchId){

match = matches.find(m =>
String(m.info?.match_id) === String(matchId)
);

}

// PRIORITY 2: find FINAL automatically
if(!match){

match = matches.find(m =>
m.info?.event?.stage === "Final"
);

}

// PRIORITY 3: fallback — last match in file
if(!match && matches.length){

match = matches[matches.length - 1];

}

if(!match){

document.getElementById("matchContainer").innerHTML =
"<div class='hero'>Match not found</div>";

return;

}

renderMatch(match);

}

function renderMatch(match){

const container = document.getElementById("matchContainer");

const teams = match.info.teams.join(" vs ");

const venue = match.info.venue || "";

const date = match.info.dates?.join(", ") || "";

container.innerHTML = `
<div class="hero">
<h1>${teams}</h1>
<div>${venue}</div>
<div>${date}</div>
</div>
`;

for(const innings of match.innings){

const inn = Object.values(innings)[0];

const team = inn.team;

const runs =
typeof inn.runs === "object"
? inn.runs.total
: inn.runs;

const wickets = inn.wickets ?? "";

const div = document.createElement("div");

div.className = "innings";

div.innerHTML = `
<h2>${team}</h2>
<div><strong>${runs}/${wickets}</strong></div>
`;

container.appendChild(div);

}

}

</script>

</body>
</html>
