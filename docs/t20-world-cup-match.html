<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1000px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

.innings{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.score{
font-size:22px;
font-weight:700;
margin-bottom:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
text-align:left;
border-bottom:2px solid #ddd;
padding:8px;
}

td{
padding:8px;
}

tbody tr:nth-child(even){
background:#f4f8ff;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div id="matchContainer">
<div class="hero">Loading match...</div>
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const file = params.get("file");
const matchId = params.get("match");

if(!file){

document.getElementById("matchContainer").innerHTML =
"<div class='hero'>Invalid match link</div>";

throw new Error("Missing file");

}

loadMatch();

async function loadMatch(){

const res = await fetch(file);
const matches = await res.json();

let match = null;

if(matchId){

match = matches.find(m =>
String(m.info?.match_id) === String(matchId)
);

}

if(!match){

match = matches.find(m =>
m.info?.event?.stage === "Final"
);

}

if(!match){

match = matches[matches.length-1];

}

renderMatch(match);

}

function renderMatch(match){

const container = document.getElementById("matchContainer");

const teams = match.info.teams.join(" vs ");
const venue = match.info.venue;
const date = match.info.dates.join(", ");

container.innerHTML = `
<div class="hero">
<h1>${teams}</h1>
<div>${venue}</div>
<div>${date}</div>
</div>
`;

match.innings.forEach(inningsObj => {

const innings = Object.values(inningsObj)[0];

const team = innings.team;

const stats = calculateInnings(innings);

const div = document.createElement("div");
div.className="innings";

div.innerHTML = `
<h2>${team}</h2>
<div class="score">
${stats.runs}/${stats.wickets} (${stats.overs})
</div>
${buildBattingTable(stats.batting)}
`;

container.appendChild(div);

});

}

function calculateInnings(innings){

let runs = 0;
let wickets = 0;
let balls = 0;

const batting = {};

innings.overs.forEach(over => {

over.deliveries.forEach(delivery => {

const batter = delivery.batter;

if(!batting[batter])
batting[batter] = {runs:0,balls:0};

const r = delivery.runs.batter;

batting[batter].runs += r;
batting[batter].balls++;

runs += delivery.runs.total;

if(delivery.wickets)
wickets += delivery.wickets.length;

balls++;

});

});

const overs = Math.floor(balls/6) + "." + (balls%6);

return {
runs,
wickets,
overs,
batting:Object.entries(batting)
};

}

function buildBattingTable(batting){

let html = `
<table>
<thead>
<tr>
<th>Batter</th>
<th>Runs</th>
<th>Balls</th>
<th>SR</th>
</tr>
</thead>
<tbody>
`;

batting.forEach(([name,stats])=>{

const sr = stats.balls
? ((stats.runs/stats.balls)*100).toFixed(1)
: "0.0";

html += `
<tr>
<td>${name}</td>
<td>${stats.runs}</td>
<td>${stats.balls}</td>
<td>${sr}</td>
</tr>
`;

});

html += "</tbody></table>";

return html;

}

</script>

</body>
</html>
