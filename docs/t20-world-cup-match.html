<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#8b0000,#e10600);
  color:#fff;
  padding:30px;
  border-radius:18px;
  margin-bottom:20px;
}

.section{
  background:#fff;
  padding:20px;
  border-radius:12px;
}

.error{
  color:red;
  font-weight:700;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div id="content">Loading match...</div>

</div>

<script>

// READ FILE PARAMETER
const params = new URLSearchParams(window.location.search);

let file = params.get("file") || params.get("match");

// STOP IF MISSING
if(!file){

document.getElementById("content").innerHTML =
"<div class='error'>Invalid match link</div>";

throw "No file parameter";

}

// DECODE URL
file = decodeURIComponent(file);

// LOAD MATCH
loadMatch(file);

async function loadMatch(file){

try{

const response = await fetch(file);

if(!response.ok)
throw "Fetch failed";

const match = await response.json();

renderMatch(match);

}catch(err){

document.getElementById("content").innerHTML =
"<div class='error'>Invalid match link</div>";

}

}

// RENDER MATCH HEADER
function renderMatch(match){

const teams = match.info.teams || ["Team 1","Team 2"];

const venue = match.info.venue || "";

const date = match.info.dates ? match.info.dates[0] : "";

document.getElementById("content").innerHTML =

`
<div class="hero">

<h1>${teams[0]} vs ${teams[1]}</h1>

<div>${venue}</div>

<div>${date}</div>

</div>

<div class="section">

Match loaded successfully

</div>
`;

}

</script>

</body>
</html>
