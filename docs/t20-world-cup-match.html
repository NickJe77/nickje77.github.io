<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1100px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

.innings{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.teamHeader{
display:inline-block;
background:#e10600;
color:#fff;
padding:8px 14px;
border-radius:8px;
font-weight:700;
margin-bottom:10px;
}

.score{
font-size:22px;
font-weight:700;
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:15px;
}

th{
text-align:left;
padding:8px;
border-bottom:2px solid #ddd;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f8fbff;
}

.playerLink{
color:#e10600;
font-weight:600;
text-decoration:none;
cursor:pointer;
}

.playerLink:hover{
text-decoration:underline;
}

.sectionTitle{
font-weight:700;
margin-top:10px;
margin-bottom:5px;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div id="matchContainer">

<div class="hero">
Loading match...
</div>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const file = params.get("file");
const matchId = params.get("match");

if(!file || !matchId){

document.getElementById("matchContainer").innerHTML =
"<div class='hero'>Invalid match link</div>";

throw new Error("Missing parameters");

}

loadMatch();

async function loadMatch(){

const res = await fetch(file);

if(!res.ok){

document.getElementById("matchContainer").innerHTML =
"<div class='hero'>Match file not found</div>";

return;

}

const matches = await res.json();

const match = matches.find(m =>
String(m.info.match_id) === String(matchId)
);

if(!match){

document.getElementById("matchContainer").innerHTML =
"<div class='hero'>Match not found</div>";

return;

}

renderMatch(match);

}

function playerLink(name){

return `
<a href="t20-world-cup-player.html?player=${encodeURIComponent(name)}"
class="playerLink">
${name}
</a>
`;

}

function renderMatch(match){

const container = document.getElementById("matchContainer");

const teams = match.info.teams.join(" vs ");
const venue = match.info.venue;
const date = match.info.dates.join(", ");

container.innerHTML = `
<div class="hero">
<h1>${teams}</h1>
<div>${venue}</div>
<div>${date}</div>
</div>
`;

for(const innings of match.innings){

const inn = Object.values(innings)[0];

const team = inn.team;

let runs = 0;
let wickets = 0;
let balls = 0;

const batting = {};
const bowling = {};
const fallOfWickets = [];

for(const over of inn.overs){

for(const delivery of over.deliveries){

const batter = delivery.batter;
const bowler = delivery.bowler;

if(!batting[batter])
batting[batter] = {runs:0,balls:0,out:null};

if(!bowling[bowler])
bowling[bowler] = {balls:0,runs:0,wickets:0};

const batterRuns = delivery.runs.batter;
const extraRuns = delivery.runs.extras || 0;

batting[batter].runs += batterRuns;
batting[batter].balls += 1;

bowling[bowler].runs += batterRuns + extraRuns;
bowling[bowler].balls += 1;

runs += batterRuns + extraRuns;
balls += 1;

if(delivery.wickets){

for(const w of delivery.wickets){

wickets++;

batting[w.player_out].out =
w.kind + " b " + bowler;

bowling[bowler].wickets++;

fallOfWickets.push(
`${runs}/${wickets} (${w.player_out})`
);

}

}

}

}

const overs = Math.floor(balls/6) + "." + (balls%6);

const div = document.createElement("div");
div.className = "innings";

div.innerHTML += `
<div class="teamHeader">${team}</div>
<div class="score">${runs}/${wickets} (${overs} overs)</div>
<div class="sectionTitle">Batting</div>
<table>
<tr>
<th>Batter</th>
<th>How out</th>
<th>R</th>
<th>B</th>
<th>SR</th>
</tr>
`;

for(const name in batting){

const b = batting[name];

const sr = b.balls ? ((b.runs/b.balls)*100).toFixed(1) : "";

div.innerHTML += `
<tr>
<td>${playerLink(name)}</td>
<td>${b.out || "not out"}</td>
<td>${b.runs}</td>
<td>${b.balls}</td>
<td>${sr}</td>
</tr>
`;

}

div.innerHTML += `</table>`;

div.innerHTML += `
<div class="sectionTitle">Fall of wickets</div>
<div>${fallOfWickets.join(", ") || "None"}</div>
`;

div.innerHTML += `
<div class="sectionTitle">Bowling</div>
<table>
<tr>
<th>Bowler</th>
<th>O</th>
<th>R</th>
<th>W</th>
<th>Econ</th>
</tr>
`;

for(const name in bowling){

const b = bowling[name];

const o = Math.floor(b.balls/6)+"."+(b.balls%6);

const econ = (b.runs/(b.balls/6)).toFixed(2);

div.innerHTML += `
<tr>
<td>${playerLink(name)}</td>
<td>${o}</td>
<td>${b.runs}</td>
<td>${b.wickets}</td>
<td>${econ}</td>
</tr>
`;

}

div.innerHTML += "</table>";

container.appendChild(div);

}

}

</script>

</body>
</html>
