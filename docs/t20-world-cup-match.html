<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;border-bottom:1px solid #ddd;background:#fff;font-weight:600;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1100px;margin:30px auto;padding:0 20px;}
.matchHeader{background:linear-gradient(90deg,#8b0000,#e10600);color:#fff;padding:25px;border-radius:16px;margin-bottom:20px;}
.matchHeader h1{margin:0 0 6px 0;}
.matchMeta{margin-top:4px;opacity:0.95;}
.innings{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;}
.teamHeader{display:inline-block;background:#e10600;color:#fff;padding:6px 12px;border-radius:6px;font-weight:700;margin-bottom:10px;}
.score{font-size:22px;font-weight:700;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;margin-bottom:15px;table-layout:fixed;}
th{padding:8px;border-bottom:2px solid #ddd;font-weight:700;}
td{padding:8px;border-bottom:1px solid #eee;}
.left{text-align:left;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
tr:nth-child(even){background:#f8fbff;}
.playerLink{color:#0056d6;font-weight:600;text-decoration:none;}
.playerLink:hover{text-decoration:underline;}
.sectionTitle{font-weight:700;margin-top:10px;margin-bottom:6px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">
<div id="matchContainer">
<div class="matchHeader">Loading match...</div>
</div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
const season=params.get("season");
const id=params.get("id");

const MATCH_PATH="data/t20-world-cup/matches/";
const NAME_MAP_PATH="data/t20-world-cup/matches/player-names.json";

// dismissals credited to the bowler (run outs etc. are NOT)
const BOWLER_WKTS=new Set(["bowled","caught","lbw","stumped","caught and bowled","hit wicket"]);

let NAME_MAP=null;

init();

async function init(){
  await loadNameMap();
  await loadMatch();
}

async function loadNameMap(){
  try{
    const res=await fetch(NAME_MAP_PATH);
    if(!res.ok) throw new Error();
    NAME_MAP=await res.json();
  }catch{
    NAME_MAP=null;
  }
}

function canon(name){
  if(!name) return "";
  if(NAME_MAP && NAME_MAP[name]) return NAME_MAP[name];
  return name;
}

function playerLink(name){
  const c=canon(name);
  return `<a href="t20-world-cup-player.html?player=${encodeURIComponent(c)}" class="playerLink">${c}</a>`;
}

function getMatchesArray(data){
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.matches)) return data.matches;
  return [];
}

function deriveTeams(match){
  const info=match?.info || {};
  if(Array.isArray(info.teams) && info.teams.length>=2) return [info.teams[0],info.teams[1]];
  if(info.players){
    const keys=Object.keys(info.players);
    if(keys.length>=2) return [keys[0],keys[1]];
  }
  return ["Unknown","Unknown"];
}

async function loadMatch(){
  const container=document.getElementById("matchContainer");

  if(!season || !id){
    container.innerHTML=`<div class="matchHeader"><h1>Match not found</h1></div>`;
    return;
  }

  const file=`${MATCH_PATH}t20wc_${season}_FULL.json`;

  let data;
  try{
    const res=await fetch(file);
    if(!res.ok) throw new Error();
    data=await res.json();
  }catch{
    container.innerHTML=`<div class="matchHeader"><h1>Match file not found</h1></div>`;
    return;
  }

  const matches=getMatchesArray(data);
  const match=matches.find(m=>String(m?.info?.match_type_number)===String(id));

  if(!match){
    container.innerHTML=`<div class="matchHeader"><h1>Match not found</h1></div>`;
    return;
  }

  renderMatch(match);
}

function dismissalText(w,bowler){
  const fielder =
    w.fielders && w.fielders.length
    ? playerLink(w.fielders[0].name)
    : "";
  const bowlerLink = playerLink(bowler);

  if(w.kind==="caught") return `c ${fielder} b ${bowlerLink}`;
  if(w.kind==="bowled") return `b ${bowlerLink}`;
  if(w.kind==="lbw") return `lbw b ${bowlerLink}`;
  if(w.kind==="stumped") return `st ${fielder} b ${bowlerLink}`;
  if(w.kind==="run out") return fielder ? `run out (${fielder})` : "run out";
  if(w.kind==="caught and bowled") return `c & b ${bowlerLink}`;
  if(w.kind==="hit wicket") return `hit wicket b ${bowlerLink}`;
  return w.kind || "";
}

function renderMatch(match){
  const container=document.getElementById("matchContainer");
  const info=match.info || {};
  const outcome=info.outcome;
  const toss=info.toss;
  const teams=deriveTeams(match);

  let resultText="";
  if(outcome?.winner){
    if(outcome.by?.runs) resultText=`${outcome.winner} won by ${outcome.by.runs} runs`;
    else if(outcome.by?.wickets) resultText=`${outcome.winner} won by ${outcome.by.wickets} wickets`;
    else resultText=`${outcome.winner} won`;
  }else if(outcome?.result){
    resultText=outcome.result.charAt(0).toUpperCase()+outcome.result.slice(1);
    if(outcome.eliminator) resultText+=` (${outcome.eliminator} won super over)`;
  }

  container.innerHTML=`
    <div class="matchHeader">
      <h1>${teams.join(" vs ")}</h1>
      <div class="matchMeta">${info.venue || info.city || ""}</div>
      <div class="matchMeta">${(info.dates||[]).join(", ")}</div>
      <div class="matchMeta">${resultText}</div>
      <div class="matchMeta">Toss: ${toss?.winner || ""}${toss?.decision ? ` (${toss.decision})` : ""}</div>
      <div class="matchMeta">
        Player of the match: ${(info.player_of_match||[]).map(playerLink).join(", ") || ""}
      </div>
    </div>
  `;

  const inningsArr=Array.isArray(match.innings)?match.innings:[];

  inningsArr.forEach((inn,innIndex)=>{
    let runs=0;
    let wickets=0;
    let legalBalls=0;

    let extrasTotal=0;
    const extrasBreakdown={w:0,nb:0,b:0,lb:0,p:0};

    const batting={};
    const bowling={};
    const fow=[];

    inn.overs?.forEach(over=>{
      over.deliveries?.forEach(d=>{
        const batter=d.batter;
        const bowler=d.bowler;

        const wides=d.extras?.wides||0;
        const noballs=d.extras?.noballs||0;
        const byes=d.extras?.byes||0;
        const legbyes=d.extras?.legbyes||0;
        const penalty=d.extras?.penalty||0;

        extrasBreakdown.w+=wides;
        extrasBreakdown.nb+=noballs;
        extrasBreakdown.b+=byes;
        extrasBreakdown.lb+=legbyes;
        extrasBreakdown.p+=penalty;
        extrasTotal+=wides+noballs+byes+legbyes+penalty;

        const legal=!wides&&!noballs;   // counts towards the over / bowler
        const faced=!wides;             // batter faces everything except a wide

        if(!batting[batter]) batting[batter]={runs:0,balls:0,fours:0,sixes:0,out:null};
        batting[batter].runs+=d.runs?.batter||0;
        if((d.runs?.batter||0)===4) batting[batter].fours++;
        if((d.runs?.batter||0)===6) batting[batter].sixes++;
        if(faced) batting[batter].balls++;
        if(legal) legalBalls++;

        if(!bowling[bowler]) bowling[bowler]={runs:0,balls:0,wickets:0};
        if(legal) bowling[bowler].balls++;
        // byes and leg-byes are NOT charged to the bowler
        bowling[bowler].runs+=(d.runs?.total||0)-byes-legbyes;
        runs+=d.runs?.total||0;

        if(d.wickets){
          d.wickets.forEach(w=>{
            wickets++;
            if(!batting[w.player_out]) batting[w.player_out]={runs:0,balls:0,fours:0,sixes:0,out:null};
            batting[w.player_out].out=dismissalText(w,bowler);
            // only credit the bowler for bowler-type dismissals (not run outs)
            if(BOWLER_WKTS.has(w.kind)) bowling[bowler].wickets++;
            fow.push(`${runs}/${wickets} (${playerLink(w.player_out)})`);
          });
        }
      });
    });

    const overs=Math.floor(legalBalls/6)+"."+(legalBalls%6);

    const extrasText=[
      extrasBreakdown.w?`${extrasBreakdown.w}w`:"",
      extrasBreakdown.nb?`${extrasBreakdown.nb}nb`:"",
      extrasBreakdown.lb?`${extrasBreakdown.lb}lb`:"",
      extrasBreakdown.b?`${extrasBreakdown.b}b`:"",
      extrasBreakdown.p?`${extrasBreakdown.p}p`:""
    ].filter(Boolean).join(", ");

    const div=document.createElement("div");
    div.className="innings";

    const isSuperOver = inningsArr.length>2 && innIndex>=2;
    const inningLabel = `${inn.team}${isSuperOver ? " (Super Over)" : ""}`;

    div.innerHTML=`
      <div class="teamHeader">${inningLabel}</div>
      <div class="score">${runs}/${wickets} (${overs} overs)</div>

      <div class="sectionTitle">Batting</div>
      <table>
        <colgroup>
          <col style="width:22%">
          <col style="width:36%">
          <col style="width:8%">
          <col style="width:8%">
          <col style="width:8%">
          <col style="width:8%">
          <col style="width:10%">
        </colgroup>

        <tr>
          <th class="left">Batter</th>
          <th class="left">How out</th>
          <th class="num">R</th>
          <th class="num">B</th>
          <th class="num">4s</th>
          <th class="num">6s</th>
          <th class="num">SR</th>
        </tr>

        ${Object.entries(batting).map(([name,b])=>`
          <tr>
            <td class="left">${playerLink(name)}</td>
            <td class="left">${b.out||"not out"}</td>
            <td class="num">${b.runs}</td>
            <td class="num">${b.balls}</td>
            <td class="num">${b.fours}</td>
            <td class="num">${b.sixes}</td>
            <td class="num">${b.balls?((b.runs/b.balls)*100).toFixed(1):""}</td>
          </tr>
        `).join("")}

        <tr>
          <td class="left"><b>Extras</b></td>
          <td class="left">${extrasText}</td>
          <td class="num"><b>${extrasTotal}</b></td>
          <td></td><td></td><td></td><td></td>
        </tr>

        <tr>
          <td class="left"><b>Total</b></td>
          <td></td>
          <td class="num"><b>${runs}</b></td>
          <td></td><td></td><td></td><td></td>
        </tr>
      </table>

      <div class="sectionTitle">Fall of wickets</div>
      <div>${fow.join(", ")||"None"}</div>

      <div class="sectionTitle">Bowling</div>
      <table>
        <tr>
          <th class="left">Bowler</th>
          <th class="num">O</th>
          <th class="num">R</th>
          <th class="num">W</th>
          <th class="num">Econ</th>
        </tr>

        ${Object.entries(bowling).map(([name,b])=>`
          <tr>
            <td class="left">${playerLink(name)}</td>
            <td class="num">${Math.floor(b.balls/6)}.${b.balls%6}</td>
            <td class="num">${b.runs}</td>
            <td class="num">${b.wickets}</td>
            <td class="num">${b.balls?(b.runs/(b.balls/6)).toFixed(2):""}</td>
          </tr>
        `).join("")}
      </table>
    `;

    container.appendChild(div);
  });
}
</script>

</body>
</html>
