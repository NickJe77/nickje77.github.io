<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.hero{
background:linear-gradient(90deg,#013369,#d50a0a);
color:white;
padding:40px;
font-size:32px;
font-weight:700;
}

.container{
max-width:1000px;
margin:30px auto;
background:white;
padding:20px;
border-radius:12px;
}

.season{
padding:12px;
border-bottom:1px solid #ddd;
cursor:pointer;
}

.season:hover{
background:#f0f4f8;
}

</style>
</head>
<body>

<div class="hero">
NFL Seasons
</div>

<div class="container" id="seasons">
Loading seasons...
</div>

<script>

fetch("data/nfl/index.json")
.then(r=>r.json())
.then(files=>{

const container=document.getElementById("seasons");

container.innerHTML="";

files.reverse().forEach(file=>{

const year=file.match(/\d+/)[0];

const div=document.createElement("div");

div.className="season";

div.innerHTML=year;

div.onclick=()=>{
location.href=`nfl-season.html?year=${year}`;
};

container.appendChild(div);

});

});

</script>

</body>
</html>
