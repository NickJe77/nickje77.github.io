<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
color:#111;
}

.hero{
position:relative;
height:340px;
background:url('/images/nfl-header.jpg') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(rgba(1,51,105,.75),rgba(213,10,10,.75));
}

.hero-content{
position:relative;
z-index:2;
text-align:center;
color:white;
padding:20px;
}

.hero-content h1{
margin:0;
font-size:56px;
font-weight:800;
letter-spacing:.5px;
}

.hero-content p{
margin-top:12px;
font-size:20px;
opacity:.95;
}

.container{
max-width:1100px;
margin:30px auto;
padding:0 20px;
}

.search-wrap{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:30px;
}

.search{
width:100%;
padding:14px;
font-size:16px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
}

.section-title{
font-size:28px;
font-weight:800;
margin:25px 0 18px;
}

.seasons-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
gap:14px;
}

.season{
background:white;
border-radius:12px;
padding:20px;
text-align:center;
font-size:24px;
font-weight:800;
cursor:pointer;
transition:.2s;
box-shadow:0 2px 8px rgba(0,0,0,.08);
border:2px solid transparent;
}

.season:hover{
transform:translateY(-3px);
border-color:#013369;
background:#f8fbff;
}

.player-results{
margin-top:15px;
max-height:400px;
overflow-y:auto;
}

.player{
padding:14px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.player:hover{
background:#f5f8fc;
}

.player-name{
font-weight:700;
font-size:16px;
}

.player-meta{
font-size:13px;
color:#666;
margin-top:4px;
}

@media(max-width:700px){

.hero{
height:260px;
}

.hero-content h1{
font-size:40px;
}

.hero-content p{
font-size:16px;
}

.season{
font-size:20px;
padding:18px;
}

}

</style>
</head>
<body>

<div class="hero">

  <div class="hero-content">
    <h1>NFL</h1>
    <p>The Sporting Almanac</p>
  </div>

</div>

<div class="container">

  <div class="search-wrap">

    <input
      type="text"
      id="playerSearch"
      class="search"
      placeholder="Search NFL players..."
      list="playersList"
    >

    <datalist id="playersList"></datalist>

    <div class="player-results" id="playerResults"></div>

  </div>

  <div class="section-title">
    Seasons
  </div>

  <div class="seasons-grid" id="seasons"></div>

</div>

<script>

const seasonsContainer = document.getElementById("seasons");
const playerSearch = document.getElementById("playerSearch");
const playersList = document.getElementById("playersList");
const playerResults = document.getElementById("playerResults");

// --------------------------------------------------
// SEASONS
// --------------------------------------------------

const startYear = 1970;
const endYear = 2025;

for(let year = endYear; year >= startYear; year--){

  const div = document.createElement("div");

  div.className = "season";
  div.innerHTML = year;

  div.onclick = () => {

    // FIXED
    location.href = `nfl-season.html?season=${year}`;

  };

  seasonsContainer.appendChild(div);
}

// --------------------------------------------------
// PLAYERS
// --------------------------------------------------

let players = [];

fetch("/data/nfl/players/index.json")
.then(r => r.json())
.then(data => {

  players = data;

  data.forEach(player => {

    const option = document.createElement("option");
    option.value = player.name;

    playersList.appendChild(option);

  });

});

// --------------------------------------------------
// SEARCH
// --------------------------------------------------

playerSearch.addEventListener("input", () => {

  const q = playerSearch.value.trim().toLowerCase();

  playerResults.innerHTML = "";

  if(q.length < 2) return;

  const matches = players
    .filter(p => p.name.toLowerCase().includes(q))
    .slice(0,25);

  matches.forEach(player => {

    const div = document.createElement("div");

    div.className = "player";

    div.innerHTML = `
      <div class="player-name">
        ${player.name}
      </div>

      <div class="player-meta">
        ${player.teams.join(", ")}
      </div>
    `;

    div.onclick = () => {
      location.href = `nfl-player.html?player=${player.player_id}`;
    };

    playerResults.appendChild(div);

  });

});

</script>

</body>
</html>
