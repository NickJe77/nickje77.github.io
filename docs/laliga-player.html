<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>La Liga Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:20px;padding:15px;background:var(--surface);border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover{opacity:1;color:var(--accent);}

/* Hero background set dynamically per-player via JS (team colours) */
.hero{padding:44px 20px 38px;text-align:center;color:#fff;position:relative;}
.hero h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1.1;text-transform:uppercase;letter-spacing:.01em;}
.hero p{margin-top:10px;font-size:14px;font-weight:600;opacity:.85;}

.search-wrap{max-width:460px;margin:22px auto 0;position:relative;}
.search-input{
  width:100%;padding:12px 18px;border-radius:999px;border:none;font-size:14px;
  font-weight:600;box-sizing:border-box;outline:none;font-family:var(--body);
}
.search-results{
  position:absolute;top:100%;left:0;right:0;background:var(--surface);border-radius:14px;
  margin-top:8px;overflow:hidden;box-shadow:0 14px 30px -12px rgba(10,16,24,.4);z-index:999;display:none;
}
.search-item{padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600;color:var(--ink);font-size:13.5px;}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:var(--accent-soft);}
.search-item small{color:var(--muted);font-weight:500;margin-left:8px;}

.container{max-width:1300px;margin:0 auto;padding:26px 20px 70px;}

.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:22px;}
.section-title{
  font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:18px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px;
}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.stat-card{background:var(--accent-soft);border-radius:14px;padding:18px;text-align:center;}
.stat-value{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;margin-bottom:8px;color:var(--ink);}
.stat-label{font-size:12px;font-weight:600;color:var(--muted);}

table{width:100%;border-collapse:collapse;}
th{background:#f7f9fb;padding:11px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.04em;color:var(--muted);font-family:var(--body);border-bottom:1px solid var(--line);}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.team-link{text-decoration:none;font-weight:700;color:var(--ink);}
.team-link:hover{color:var(--accent);}

.loading,.error{padding:100px 20px;text-align:center;font-size:16px;font-weight:600;color:var(--muted);}
.error{color:#c0362c;}

@media(max-width:900px){table{display:block;overflow-x:auto;white-space:nowrap;}}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
  <a href="laliga.html">La Liga</a>
  <a href="laliga-teams.html">Teams</a>
  <a href="laliga-players.html">Players</a>
</div>

<div id="page">
<div class="loading">Loading Player...</div>
</div>

<script>

const TEAM_COLOURS = {
"Alaves":                   "linear-gradient(160deg,#0047AB,#FFFFFF)",
"Albacete":                 "linear-gradient(160deg,#FFFFFF,#111111)",
"Almeria":                  "linear-gradient(160deg,#E2001A,#FFFFFF)",
"Athletic Club":             "linear-gradient(160deg,#EE2523,#FFFFFF)",
"Atletico Madrid":          "linear-gradient(160deg,#CB3524,#27348B)",
"Barcelona":                "linear-gradient(160deg,#A50044,#004D98)",
"Betis":                    "linear-gradient(160deg,#00954C,#FFFFFF)",
"Cadiz":                    "linear-gradient(160deg,#FDD000,#111111)",
"Celta Vigo":                "linear-gradient(160deg,#8AC3EE,#111111)",
"Cordoba":                  "linear-gradient(160deg,#FFFFFF,#111111)",
"Deportivo La Coruna":      "linear-gradient(160deg,#0066B3,#FFFFFF)",
"Eibar":                    "linear-gradient(160deg,#1B1B1B,#7B2D26)",
"Elche":                    "linear-gradient(160deg,#117A38,#FFFFFF)",
"Espanyol":                 "linear-gradient(160deg,#0A4DA1,#FFFFFF)",
"Extremadura UD":           "linear-gradient(160deg,#111111,#3E8E41)",
"Getafe":                   "linear-gradient(160deg,#0A5BA1,#111111)",
"Girona":                   "linear-gradient(160deg,#CC0000,#FFFFFF)",
"Granada":                  "linear-gradient(160deg,#C8102E,#FFFFFF)",
"Huesca":                   "linear-gradient(160deg,#0A5BA1,#FFFFFF)",
"Las Palmas":                "linear-gradient(160deg,#FFE600,#111111)",
"Leganes":                  "linear-gradient(160deg,#0A5BA1,#FFFFFF)",
"Levante":                  "linear-gradient(160deg,#0A5BA1,#B71234)",
"Malaga":                   "linear-gradient(160deg,#0A5BA1,#FFFFFF)",
"Mallorca":                 "linear-gradient(160deg,#CC0000,#FFE600)",
"Numancia":                 "linear-gradient(160deg,#CC0000,#FFFFFF)",
"Osasuna":                  "linear-gradient(160deg,#D81920,#0A2A5E)",
"Rayo Vallecano":           "linear-gradient(160deg,#CC0000,#FFFFFF)",
"Real Betis":                "linear-gradient(160deg,#00954C,#FFFFFF)",
"Real Madrid":              "linear-gradient(160deg,#0c130f,#161f16)",
"Real Sociedad":            "linear-gradient(160deg,#0067B1,#FFFFFF)",
"Real Valladolid":          "linear-gradient(160deg,#702A8C,#FFFFFF)",
"Real Zaragoza":            "linear-gradient(160deg,#0A5BA1,#FFFFFF)",
"Recreativo Huelva":        "linear-gradient(160deg,#0A2A5E,#FFFFFF)",
"Sevilla":                  "linear-gradient(160deg,#D81920,#FFFFFF)",
"Sporting Gijon":           "linear-gradient(160deg,#CC0000,#FFFFFF)",
"Tenerife":                 "linear-gradient(160deg,#0A5BA1,#FFFFFF)",
"Valencia":                 "linear-gradient(160deg,#EE7A23,#000F5C)",
"Valladolid":               "linear-gradient(160deg,#702A8C,#FFFFFF)",
"Villarreal":               "linear-gradient(160deg,#FFE600,#0A2A5E)",
"Xerez":                    "linear-gradient(160deg,#0A5BA1,#FFFFFF)"
};

function slugify(str){
    return (str || '')
        .toLowerCase()
        .replace(/&/g,'and')
        .replace(/[^a-z0-9]+/g,'-')
        .replace(/^-|-$/g,'');
}

function playerSlug(p){
    const name      = slugify(p.name || '');
    const firstTeam = slugify((p.teams && p.teams[0]) || '');
    return firstTeam ? `${name}--${firstTeam}` : name;
}

const params    = new URLSearchParams(window.location.search);
const slugParam = params.get("player") || '';
const page      = document.getElementById("page");

async function loadPlayer(){

    try{

        page.innerHTML = '<div class="loading">Loading player data...</div>';

        const res = await fetch("/data/la_liga/players.json");
        if(!res.ok) throw new Error(`players.json returned ${res.status}`);
        const players = await res.json();

        let player = players.find(p => playerSlug(p) === slugParam);
        if(!player){
            player = players.find(p => slugify(p.name) === slugParam);
        }
        if(!player){
            const namePart = slugParam.split('--')[0];
            player = players.find(p => slugify(p.name) === namePart);
        }

        if(!player){
            page.innerHTML = `<div class="error">Player Not Found</div>`;
            return;
        }

        const playerDisplayName = player.name;
        const currentTeam       = (player.teams && player.teams[player.teams.length - 1]) || "Unknown";
        const heroGradient      = TEAM_COLOURS[currentTeam] || 'linear-gradient(160deg,#0c130f,#161f16)';

        page.innerHTML = `
            <div class="hero" style="background:${heroGradient};">
                <h1>${playerDisplayName}</h1>
                <p>La Liga Player Profile</p>
                <div class="search-wrap">
                    <input type="text" class="search-input" id="playerSearch"
                           placeholder="Search player..." autocomplete="off">
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>

            <div class="container">

                <div class="section">
                    <div class="section-title">Career Summary</div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" style="font-size:18px;">${currentTeam}</div>
                            <div class="stat-label">Club</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.seasons ? player.seasons.length : 0}</div>
                            <div class="stat-label">Seasons</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.goals || 0}</div>
                            <div class="stat-label">Goals</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.penalties || 0}</div>
                            <div class="stat-label">Penalties</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.yellow_cards || 0}</div>
                            <div class="stat-label">Yellow Cards</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.red_cards || 0}</div>
                            <div class="stat-label">Red Cards</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Season by Season</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Season</th>
                                <th>Team</th>
                                <th>Goals</th>
                                <th>Penalties</th>
                                <th>Yellow Cards</th>
                                <th>Red Cards</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(player.season_stats || []).map(s => `
                                <tr>
                                    <td><a class="team-link" href="/laliga-season.html?season=${s.season}">${s.season}</a></td>
                                    <td><a class="team-link" href="/laliga-team.html?team=${encodeURIComponent(s.team)}">${s.team || ''}</a></td>
                                    <td>${s.goals || 0}</td>
                                    <td>${s.penalties || 0}</td>
                                    <td>${s.yellow_cards || 0}</td>
                                    <td>${s.red_cards || 0}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

            </div>
        `;

        const playerSearch  = document.getElementById("playerSearch");
        const searchResults = document.getElementById("searchResults");

        playerSearch.addEventListener("input", () => {
            const value = playerSearch.value.toLowerCase().trim();
            if(!value){ searchResults.style.display = "none"; return; }

            const matches = players
                .filter(p => (p.name || '').toLowerCase().includes(value))
                .slice(0, 8);

            if(!matches.length){ searchResults.style.display = "none"; return; }

            searchResults.innerHTML = matches.map(p => `
                <div class="search-item"
                     onclick="window.location.href='/laliga-player.html?player=${encodeURIComponent(playerSlug(p))}'">
                    ${p.name}
                    <small>${(p.teams && p.teams[0]) || ''}</small>
                </div>
            `).join('');

            searchResults.style.display = "block";
        });

        document.addEventListener("click", e => {
            if(!e.target.closest(".search-wrap")) searchResults.style.display = "none";
        });

    }catch(err){
        console.error(err);
        page.innerHTML = `<div class="error">Failed To Load Player Data</div>`;
    }

}

loadPlayer();

</script>

</body>
</html>
