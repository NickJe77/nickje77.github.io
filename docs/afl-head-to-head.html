<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.selector-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:30px;
}

.selector-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
}

.selector-box h3{
  margin:0 0 10px;
}

.selector-box select{
  width:100%;
  padding:10px;
  font-size:16px;
}

.compare-btn{
  margin-top:20px;
  padding:12px 24px;
  font-size:16px;
  font-weight:700;
  background:#0056d6;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.compare-btn:hover{
  background:#003f9e;
}

.results-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
  margin-top:20px;
}

.placeholder{
  color:#666;
  font-style:italic;
  padding:10px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:left;
}
th{background:#f4f6f8;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>AFL Head to Head</h1>
<p>Compare two AFL teams across all matches, seasons, and venues.</p>

<div class="selector-grid">
  <div class="selector-box">
    <h3>Team One</h3>
    <select id="team1">
      <option value="">Select team</option>
    </select>
  </div>

  <div class="selector-box">
    <h3>Team Two</h3>
    <select id="team2">
      <option value="">Select team</option>
    </select>
  </div>
</div>

<button class="compare-btn" onclick="compare()">Compare</button>

<div id="results" class="results-box">
  <div class="placeholder">Loading AFL match database…</div>
</div>

</div>

<script>
let data = [];

/* CHANGE THIS PATH IF NEEDED */
const DATA_FILE = "afl_all_in_one.csv";

fetch(DATA_FILE)
.then(r=>{
  if(!r.ok) throw new Error("CSV not found");
  return r.text();
})
.then(text=>{
  const lines=text.trim().split("\n");
  const headers=lines[0].split(",");
  const rows=lines.slice(1);

  rows.forEach(l=>{
    const parts=l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    let obj={};
    headers.forEach((h,i)=>obj[h]=parts[i]?.replace(/^"|"$/g,""));
    data.push(obj);
  });

  populateTeams();
  document.getElementById("results").innerHTML =
    "<div class='placeholder'>Select two teams and click Compare.</div>";
})
.catch(err=>{
  document.getElementById("results").innerHTML =
    "<b style='color:red'>ERROR: Could not load afl_all_in_one.csv</b><br>" +
    "Make sure this file is in the same folder as this HTML page.";
});

function populateTeams(){
  const teams=new Set();
  data.forEach(r=>{
    if(r.Team1) teams.add(r.Team1);
    if(r.Team2) teams.add(r.Team2);
  });

  const sorted=[...teams].sort();
  const t1=document.getElementById("team1");
  const t2=document.getElementById("team2");

  sorted.forEach(t=>{
    const o1=document.createElement("option");
    o1.value=t; o1.textContent=t;
    t1.appendChild(o1);

    const o2=document.createElement("option");
    o2.value=t; o2.textContent=t;
    t2.appendChild(o2);
  });
}

function compare(){
  const a=document.getElementById("team1").value;
  const b=document.getElementById("team2").value;
  const box=document.getElementById("results");

  if(!a || !b){
    box.innerHTML="<b>Please select two teams.</b>";
    return;
  }

  if(a===b){
    box.innerHTML="<b>Please select two different teams.</b>";
    return;
  }

  const games=data.filter(r=>
    (r.Team1===a && r.Team2===b) ||
    (r.Team1===b && r.Team2===a)
  );

  if(games.length===0){
    box.innerHTML="<b>No matches found.</b>";
    return;
  }

  box.innerHTML = `<h3>${a} vs ${b}</h3><p>${games.length} games found.</p>`;
}
</script>

</body>
</html>
