<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.selector-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:30px;
}

.selector-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
}

.selector-box h3{margin:0 0 10px;}

.selector-box select{
  width:100%;
  padding:10px;
  font-size:16px;
}

.compare-btn{
  margin-top:20px;
  padding:12px 24px;
  font-size:16px;
  font-weight:700;
  background:#0056d6;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.compare-btn:hover{background:#003f9e;}

.results-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
  margin-top:20px;
}

.placeholder{
  color:#666;
  font-style:italic;
  padding:10px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:left;
}
th{background:#f4f6f8;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>AFL Head to Head</h1>
<p>Compare two AFL teams across all matches since 1990.</p>

<div class="selector-grid">
  <div class="selector-box">
    <h3>Team One</h3>
    <select id="team1">
      <option value="">Select team</option>
    </select>
  </div>

  <div class="selector-box">
    <h3>Team Two</h3>
    <select id="team2">
      <option value="">Select team</option>
    </select>
  </div>
</div>

<button class="compare-btn" onclick="compare()">Compare</button>

<div id="results" class="results-box">
  <div class="placeholder">Loading AFL database…</div>
</div>

</div>

<script>
let allMatches = [];

function canonicalRound(r){
  const t=(r||"").toLowerCase();
  if(t.includes("elimination")) return "Elimination Final";
  if(t.includes("qualifying")) return "Qualifying Final";
  if(t.includes("semi")) return "Semi Final";
  if(t.includes("preliminary")) return "Preliminary Final";
  if(t.includes("grand")) return "Grand Final";
  return (r||"").trim();
}

async function loadAllSeasons(){
  const startYear = 1990;
  const endYear = new Date().getFullYear();
  const teamSet = new Set();

  for(let y=startYear; y<=endYear; y++){
    try{
      const res = await fetch(`/data/afl/players_${y}.json`);
      if(!res.ok) continue;
      const raw = await res.json();

      const map = {};

      raw.forEach(p=>{
        const key = p.match_id + "|" + canonicalRound(p.round);

        if(!map[key]){
          map[key] = {
            season: p.season,
            round: canonicalRound(p.round),
            venue: p.venue || "",
            teams: {}
          };
        }

        // ✅ FIX: capture venue even if first row was blank
        if(!map[key].venue && p.venue){
          map[key].venue = p.venue;
        }

        const team = p.played_for;
        const goals = Number(p.G||0);
        const behinds = Number(p.B||0);
        const points = goals*6 + behinds;

        if(!map[key].teams[team]) map[key].teams[team]=0;
        map[key].teams[team]+=points;
      });

      Object.values(map).forEach(m=>{
        const teams = Object.keys(m.teams);
        if(teams.length!==2) return;

        const home=teams[0];
        const away=teams[1];
        const hp=m.teams[home];
        const ap=m.teams[away];

        allMatches.push({
          season:m.season,
          round:m.round,
          venue:m.venue,
          home,
          away,
          hp,
          ap,
          total: hp+ap,
          margin: Math.abs(hp-ap)
        });

        teamSet.add(home);
        teamSet.add(away);
      });

    }catch(e){}
  }

  const teams=[...teamSet].sort();
  const t1=document.getElementById("team1");
  const t2=document.getElementById("team2");

  teams.forEach(t=>{
    t1.innerHTML+=`<option value="${t}">${t}</option>`;
    t2.innerHTML+=`<option value="${t}">${t}</option>`;
  });

  document.getElementById("results").innerHTML =
    "<div class='placeholder'>Select two teams and click Compare.</div>";
}

loadAllSeasons();

function compare(){
  const a=document.getElementById("team1").value;
  const b=document.getElementById("team2").value;
  const box=document.getElementById("results");

  if(!a||!b){ box.innerHTML="<b>Select two teams.</b>"; return; }
  if(a===b){ box.innerHTML="<b>Select different teams.</b>"; return; }

  const games = allMatches.filter(g =>
    (g.home===a && g.away===b) || (g.home===b && g.away===a)
  ).sort((x,y)=> y.season-x.season);

  if(!games.length){
    box.innerHTML="<b>No matches found.</b>";
    return;
  }

  let aWins=0,bWins=0,draws=0;

  games.forEach(g=>{
    if(g.hp===g.ap) draws++;
    else if((g.home===a && g.hp>g.ap) || (g.away===a && g.ap>g.hp)) aWins++;
    else bWins++;
  });

  let html=`
    <h3>${a} vs ${b}</h3>
    <p>Games: ${games.length} | ${a} wins: ${aWins} | Draws: ${draws} | ${b} wins: ${bWins}</p>

    <table>
    <tr>
      <th>Season</th>
      <th>Round</th>
      <th>Venue</th>
      <th>Match</th>
      <th>Score</th>
      <th>Total</th>
      <th>Margin</th>
    </tr>
  `;

  games.forEach(g=>{
    html+=`
      <tr>
        <td>${g.season}</td>
        <td>${g.round}</td>
        <td>${g.venue}</td>
        <td>${g.home} v ${g.away}</td>
        <td>${g.hp} - ${g.ap}</td>
        <td>${g.total}</td>
        <td>${g.margin}</td>
      </tr>
    `;
  });

  html+="</table>";
  box.innerHTML=html;
}
</script>

</body>
</html>
