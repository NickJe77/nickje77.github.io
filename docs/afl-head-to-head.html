<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --board-line:rgba(255,255,255,.10);
  --accent:#e0b94a;
  --accent-soft:rgba(224,185,74,.18);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

.page-wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:22px 26px 26px;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:8px;
}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,38px);letter-spacing:.01em;text-transform:uppercase;color:#fff;}

/* ── Selectors ────────────────────────────────────────── */
.selector-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px;}
@media(max-width:800px){.selector-grid{grid-template-columns:1fr;}}
.selector-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.selector-box select{
  width:100%;padding:10px 4px;font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink);
  border:none;background:transparent;cursor:pointer;
}
.selector-box select:focus{outline:none;}

.filter-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.filter-row label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.last-n-btn{
  padding:9px 18px;font-family:var(--body);font-size:13px;font-weight:600;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,color .15s;
}
.last-n-btn:hover{border-color:var(--faint);}
.last-n-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.compare-btn{
  padding:11px 24px;font-family:var(--body);font-size:13.5px;font-weight:600;background:var(--ink);
  color:#fff;border:none;border-radius:999px;cursor:pointer;transition:opacity .15s;
}
.compare-btn:hover{opacity:.85;}

/* ── Results ──────────────────────────────────────────── */
.results-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-top:22px;color:var(--muted);font-size:13.5px;}
.results-box h3{
  margin:0 0 16px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.01em;
  text-transform:uppercase;color:var(--ink);
}
.results-box p{color:var(--muted);font-size:13px;font-weight:600;margin:0 0 10px;}
.summary{display:flex;gap:14px;margin-bottom:6px;}
.summary div{
  flex:1;text-align:center;padding:16px 12px;background:#f7f9fb;border:1px solid var(--line);
  border-radius:var(--radius);cursor:pointer;font-family:var(--display);font-weight:600;font-size:22px;
  color:var(--ink);transition:background .15s,border-color .15s;
}
.summary div:hover{background:var(--accent-soft);border-color:var(--accent);}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);margin-top:16px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left;}
th{
  background:#f7f9fb;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
}
td{color:#27313c;font-variant-numeric:tabular-nums;}
td.numeric,th.numeric{text-align:center;}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:#f0f6ff;}
</style>
</head>
<body>
<nav class="navbar">
<a href="index.html">Home</a>
<a href="afl.html" class="current">AFL</a>
</nav>
<div class="page-wrap">

<div class="hero">
  <div class="eyebrow">AFL</div>
  <h1>Head to Head</h1>
</div>

<div class="selector-grid">
<div class="selector-box"><select id="team1"></select></div>
<div class="selector-box"><select id="team2"></select></div>
<div class="selector-box"><select id="venue"><option value="">All Venues</option></select></div>
</div>
<div class="filter-row">
  <label>Last:</label>
  <button class="last-n-btn" data-n="5" onclick="setLastN(5)">5</button>
  <button class="last-n-btn" data-n="10" onclick="setLastN(10)">10</button>
  <button class="last-n-btn" data-n="20" onclick="setLastN(20)">20</button>
  <button class="last-n-btn active" data-n="0" onclick="setLastN(0)">All</button>
</div>
<button class="compare-btn" onclick="compare()">Compare</button>
<div id="results" class="results-box">Loading AFL database…</div>
</div>
<script>
const team1=document.getElementById("team1");
const team2=document.getElementById("team2");
const venueSelect=document.getElementById("venue");
const results=document.getElementById("results");
let allMatches=[];
let teamMap={};
let currentGames=[];
let lastN=0;

function setLastN(n){
  lastN=n;
  document.querySelectorAll('.last-n-btn').forEach(b=>{
    b.classList.toggle('active', Number(b.dataset.n)===n);
  });
  if(currentGames.length) renderTable(currentGames, team1.value, team2.value, null);
}

function norm(s){return (s||"").trim().toLowerCase();}
function displayName(k){return teamMap[k]||k;}

// Several AFL venues have been renamed multiple times through
// sponsorship deals while remaining the same physical ground -- left
// unmapped, head-to-head stats "at this venue" fragment across what
// looks like several different grounds. Same approach as the club-rename
// fix on afl-player.html, applied to venues instead of teams.
const VENUE_NAME_CANONICAL = {
  "docklands stadium": "Marvel Stadium",
  "etihad stadium": "Marvel Stadium",
  "telstra dome": "Marvel Stadium",
  "kardinia park": "GMHBA Stadium",
  "skilled stadium": "GMHBA Stadium",
  "simonds stadium": "GMHBA Stadium",
  "football park": "AAMI Stadium",
  "carrara stadium": "Heritage Bank Stadium",
  "metricon stadium": "Heritage Bank Stadium",
  "people first stadium": "Heritage Bank Stadium",
  "sydney showground stadium": "Engie Stadium",
  "spotless stadium": "Engie Stadium",
  "giants stadium": "Engie Stadium",
  "york park": "UTAS Stadium",
  "aurora stadium": "UTAS Stadium",
  "bellerive oval": "Blundstone Arena",
  "princes park": "Ikon Park",
  "optus oval": "Ikon Park",
  "western oval": "Whitten Oval",
  "vfl park": "Waverley Park",
  "stadium australia": "Accor Stadium",
  "anz stadium": "Accor Stadium",
  "marrara oval": "TIO Stadium",
  "traeger park": "TIO Traeger Park",
};
function canonicalVenue(v){
  if(!v) return v;
  const key = norm(v);
  return VENUE_NAME_CANONICAL[key] || v;
}

async function loadAllSeasons(){
  const startYear=2017;
  const LAST_YEAR=2026;
  const teamSet=new Set();
  const venueSet=new Set();
  allMatches=[];
  for(let y=startYear;y<=LAST_YEAR;y++){
    try{
      const res=await fetch(`/data/afl/afl_${y}.json`);
      if(!res.ok) continue;
      const raw=await res.json();
      if(!Array.isArray(raw)) continue;
      const matchMap={};
      raw.forEach(r=>{
        const mid = r.match_id && typeof r.match_id === 'number' ? String(r.match_id) : null;
        const key = mid ? mid : `${r.round}|${r.home_team}|${r.away_team}`;
        if(!matchMap[key]){
          matchMap[key]={
            match_id: key,
            season: Number(r.season)||y,
            round: r.round,
            venue: r.venue,
            teamA: r.home_team,
            teamB: r.away_team,
            scoreA: Number(r.home_points),
            scoreB: Number(r.away_points)
          };
        }
      });
      Object.values(matchMap).forEach(m=>{
        const a=m.teamA;
        const b=m.teamB;
        let cleanVenue=m.venue?m.venue.split(",")[0].trim():"";
        cleanVenue=canonicalVenue(cleanVenue);
        allMatches.push({
          match_id: m.match_id,
          season: m.season,
          round: m.round,
          venue: cleanVenue,
          home: a,
          away: b,
          scoreA: m.scoreA,
          scoreB: m.scoreB
        });
        teamSet.add(a);
        teamSet.add(b);
        if(cleanVenue) venueSet.add(cleanVenue);
      });
    }catch(e){console.log("Failed year",y,e);}
  }
  const teams=[...teamSet].sort();
  team1.innerHTML=`<option value="">Select team</option>`;
  team2.innerHTML=`<option value="">Select team</option>`;
  teams.forEach(t=>{
    team1.innerHTML+=`<option value="${t}">${t}</option>`;
    team2.innerHTML+=`<option value="${t}">${t}</option>`;
  });
  const venues=[...venueSet].sort();
  venueSelect.innerHTML=`<option value="">All Venues</option>`;
  venues.forEach(v=>{ venueSelect.innerHTML+=`<option value="${v}">${v}</option>`; });
  results.innerHTML="Select two teams and click Compare.";
}

loadAllSeasons();

function compare(){
  const a=team1.value, b=team2.value;
  const selectedVenue=venueSelect.value;
  if(!a||!b) return;
  let games=allMatches.filter(g=>(g.home===a&&g.away===b)||(g.home===b&&g.away===a));
  if(selectedVenue) games=games.filter(g=>g.venue===selectedVenue);
  games.sort((x,y)=>y.season-x.season);
  currentGames=games;
  renderTable(games,a,b,null);
}

function filterWins(team){
  renderTable(currentGames,team1.value,team2.value,team);
}

function renderTable(games,a,b,filterTeam){
  const displayGames = lastN > 0 ? games.slice(0, lastN) : games;

  let totalPoints=0, count=0, winsA=0, winsB=0;
  displayGames.forEach(g=>{
    if(g.scoreA==null||g.scoreB==null) return;
    totalPoints+=(g.scoreA+g.scoreB); count++;
    if(g.home===a){ if(g.scoreA>g.scoreB) winsA++; else if(g.scoreB>g.scoreA) winsB++; }
    else{ if(g.scoreA>g.scoreB) winsB++; else if(g.scoreB>g.scoreA) winsA++; }
  });
  let avg=count?(totalPoints/count).toFixed(1):"-";

  let filteredGames=displayGames;
  if(filterTeam==="A") filteredGames=displayGames.filter(g=>g.home===a?g.scoreA>g.scoreB:g.scoreB>g.scoreA);
  if(filterTeam==="B") filteredGames=displayGames.filter(g=>g.home===a?g.scoreB>g.scoreA:g.scoreA>g.scoreB);

  function gLink(g){
    const raw=g.match_id;
    if(raw && !raw.includes("|")){
      return `afl-game.html?match=${encodeURIComponent(raw)}&year=${g.season}`;
    }
    return `afl-game.html?year=${g.season}&round=${encodeURIComponent(g.round)}&home=${encodeURIComponent(g.home)}&away=${encodeURIComponent(g.away)}`;
  }

  const rangeLabel = lastN > 0 ? ` (last ${lastN} games)` : "";
  let html=`
    <h3>${a} vs ${b}${rangeLabel}</h3>
    <div class="summary">
      <div onclick="filterWins('A')">${a} Wins<br>${winsA}</div>
      <div>Average Score<br>${avg}</div>
      <div onclick="filterWins('B')">${b} Wins<br>${winsB}</div>
    </div>
    <p>Total games: ${filteredGames.length}</p>
    <div class="table-wrap">
    <table><thead><tr>
      <th>Season</th><th>Round</th><th>Venue</th><th>Match</th>
      <th class="numeric">Score</th><th class="numeric">Margin</th>
    </tr></thead><tbody>`;
  filteredGames.forEach(g=>{
    const margin=g.scoreA!=null&&g.scoreB!=null?Math.abs(g.scoreA-g.scoreB):"";
    html+=`<tr onclick="window.location='${gLink(g)}'">
      <td>${g.season}</td><td>${g.round}</td><td>${g.venue}</td>
      <td>${g.home} v ${g.away}</td>
      <td class="numeric">${g.scoreA} - ${g.scoreB}</td>
      <td class="numeric">${margin}</td>
    </tr>`;
  });
  html+=`</tbody></table>
    </div>`;
  results.innerHTML=html;
}
</script>
</body>
</html>
