<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.selector-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:30px;
}

.selector-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
}

.selector-box h3{
  margin:0 0 10px;
}

.selector-box select{
  width:100%;
  padding:10px;
  font-size:16px;
}

.compare-btn{
  margin-top:20px;
  padding:12px 24px;
  font-size:16px;
  font-weight:700;
  background:#0056d6;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.compare-btn:hover{
  background:#003f9e;
}

.results-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
  margin-top:20px;
}

.placeholder{
  color:#666;
  font-style:italic;
  padding:10px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:left;
}
th{background:#f4f6f8;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>AFL Head to Head</h1>
<p>Compare two AFL teams across all matches, seasons, and venues.</p>

<div class="selector-grid">
  <div class="selector-box">
    <h3>Team One</h3>
    <select id="team1">
      <option value="">Select team</option>
    </select>
  </div>

  <div class="selector-box">
    <h3>Team Two</h3>
    <select id="team2">
      <option value="">Select team</option>
    </select>
  </div>
</div>

<button class="compare-btn" onclick="compare()">Compare</button>

<div id="results" class="results-box">
  <div class="placeholder">Loading AFL match database…</div>
</div>

</div>

<script>
let allData = [];

async function loadAllSeasons(){
  const startYear = 1990;
  const endYear = new Date().getFullYear();
  const teams = new Set();

  for(let y=startYear; y<=endYear; y++){
    try{
      const res = await fetch(`data/afl/afl_${y}.json`);
      if(!res.ok) continue;
      const seasonData = await res.json();

      seasonData.forEach(r=>{
        allData.push(r);
        if(r.Team1) teams.add(r.Team1);
        if(r.Team2) teams.add(r.Team2);
      });
    }catch(e){}
  }

  const sorted=[...teams].sort();
  const t1=document.getElementById("team1");
  const t2=document.getElementById("team2");

  sorted.forEach(t=>{
    t1.innerHTML+=`<option>${t}</option>`;
    t2.innerHTML+=`<option>${t}</option>`;
  });

  document.getElementById("results").innerHTML =
    "<div class='placeholder'>Select two teams and click Compare.</div>";
}

loadAllSeasons();

function compare(){
  const a=document.getElementById("team1").value;
  const b=document.getElementById("team2").value;
  const box=document.getElementById("results");

  if(!a || !b){
    box.innerHTML="<b>Please select two teams.</b>";
    return;
  }

  if(a===b){
    box.innerHTML="<b>Please select two different teams.</b>";
    return;
  }

  let games = allData.filter(r=>
    (r.Team1===a && r.Team2===b) ||
    (r.Team1===b && r.Team2===a)
  );

  if(games.length===0){
    box.innerHTML="<b>No matches found.</b>";
    return;
  }

  games.sort((x,y)=>{
    if(y.Season!==x.Season) return y.Season-x.Season;
    return y.Round-x.Round;
  });

  let aWins=0,bWins=0,draws=0;

  games.forEach(g=>{
    const s1=+g.Team1Score;
    const s2=+g.Team2Score;

    if(s1===s2) draws++;
    else if((g.Team1===a && s1>s2) || (g.Team2===a && s2>s1)) aWins++;
    else bWins++;
  });

  const last10 = games.slice(0,10);
  let last10Results=[];
  let aPts10=0,bPts10=0;

  last10.forEach(g=>{
    const s1=+g.Team1Score;
    const s2=+g.Team2Score;

    if(g.Team1===a){
      aPts10+=s1; bPts10+=s2;
      if(s1>s2) last10Results.push("W");
      else if(s1<s2) last10Results.push("L");
      else last10Results.push("D");
    } else {
      aPts10+=s2; bPts10+=s1;
      if(s2>s1) last10Results.push("W");
      else if(s2<s1) last10Results.push("L");
      else last10Results.push("D");
    }
  });

  let html=`
  <h3>${a} vs ${b}</h3>
  <p>
    Games: ${games.length} |
    ${a} wins: ${aWins} |
    Draws: ${draws} |
    ${b} wins: ${bWins}
  </p>
  <p>
    Last 10: ${last10Results.join(" ")} |
    Points: ${aPts10} – ${bPts10}
  </p>

  <table>
    <tr>
      <th>Season</th>
      <th>Round</th>
      <th>Match</th>
      <th>Venue</th>
      <th>Score</th>
      <th>Winner</th>
    </tr>
  `;

  games.forEach(g=>{
    html+=`
      <tr>
        <td>${g.Season}</td>
        <td>${g.Round}</td>
        <td>${g.Team1} (${g.Team1Pos}) v ${g.Team2} (${g.Team2Pos})</td>
        <td>${g.Venue}</td>
        <td>${g.Team1Score} - ${g.Team2Score}</td>
        <td>${g.Winner}</td>
      </tr>
    `;
  });

  html+="</table>";
  box.innerHTML=html;
}
</script>

</body>
</html>
