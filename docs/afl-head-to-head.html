<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
body{font-family:system-ui,Arial,sans-serif;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
.selector-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:30px;}
.selector-box{border:1px solid #ddd;border-radius:10px;padding:20px;}
.selector-box select{width:100%;padding:10px;font-size:16px;}
.compare-btn{padding:12px 24px;font-size:16px;font-weight:700;background:#0056d6;color:#fff;border:none;border-radius:8px;cursor:pointer;}
.results-box{border:1px solid #ddd;border-radius:10px;padding:20px;margin-top:20px;}
.summary{display:flex;justify-content:space-between;gap:20px;margin-bottom:15px;font-weight:700;}
.summary div{flex:1;text-align:center;padding:12px;background:#f4f6f8;border-radius:8px;cursor:pointer;}
.summary div:hover{background:#e0ebff;}
table{width:100%;border-collapse:collapse;margin-top:15px;}
th,td{border-bottom:1px solid #ddd;padding:12px 10px;}
th{background:#f4f6f8;text-align:left;font-weight:700;}
td{text-align:left;}
td.numeric,th.numeric{text-align:center;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#eef4ff;}
tbody tr:nth-child(even){background:#eef4ff;}
</style>
</head>
<body>
<div class="navbar">
<a href="index.html">Home</a>
<a href="afl.html">AFL</a>
</div>
<div class="page-wrap">
<h1>AFL Head to Head</h1>
<div class="selector-grid">
<div class="selector-box"><select id="team1"></select></div>
<div class="selector-box"><select id="team2"></select></div>
<div class="selector-box"><select id="venue"><option value="">All Venues</option></select></div>
</div>
<button class="compare-btn" onclick="compare()">Compare</button>
<div id="results" class="results-box">Loading AFL database…</div>
</div>

<script>
const team1=document.getElementById("team1");
const team2=document.getElementById("team2");
const venueSelect=document.getElementById("venue");
const results=document.getElementById("results");

let allMatches=[];
let teamMap={};
let currentGames=[];

function norm(s){return (s||"").trim().toLowerCase();}
function displayName(k){return teamMap[k]||k;}

async function loadAllSeasons(){
  const startYear=2017;
  const LAST_YEAR=2026;
  const teamSet=new Set();
  const venueSet=new Set();
  allMatches=[];

  for(let y=startYear;y<=LAST_YEAR;y++){
    try{
      const res=await fetch(`/data/afl/afl_${y}.json`);
      if(!res.ok) continue;
      const raw=await res.json();
      if(!Array.isArray(raw)) continue;

      const matchMap={};
      raw.forEach(r=>{
        const key = r.match_id
          ? String(r.match_id)
          : `${r.round}|${r.home_team}|${r.away_team}`;

        if(!matchMap[key]){
          matchMap[key]={
            match_id: key,
            season: Number(r.season)||y,
            round: r.round,
            venue: r.venue,
            teamA: r.home_team,
            teamB: r.away_team,
            scoreA: Number(r.home_points),
            scoreB: Number(r.away_points)
          };
        }
      });

      Object.values(matchMap).forEach(m=>{
        const a=norm(m.teamA);
        const b=norm(m.teamB);
        teamMap[a]=m.teamA;
        teamMap[b]=m.teamB;
        let cleanVenue=m.venue?m.venue.split(",")[0].trim():"";
        allMatches.push({
          match_id: m.match_id,
          season: m.season,
          round: m.round,
          venue: cleanVenue,
          home: a,
          away: b,
          scoreA: m.scoreA,
          scoreB: m.scoreB
        });
        teamSet.add(a);
        teamSet.add(b);
        if(cleanVenue) venueSet.add(cleanVenue);
      });
    }catch(e){console.log("Failed year",y,e);}
  }

  const teams=[...teamSet].sort((a,b)=>displayName(a).localeCompare(displayName(b)));
  team1.innerHTML=`<option value="">Select team</option>`;
  team2.innerHTML=`<option value="">Select team</option>`;
  teams.forEach(t=>{
    team1.innerHTML+=`<option value="${t}">${displayName(t)}</option>`;
    team2.innerHTML+=`<option value="${t}">${displayName(t)}</option>`;
  });

  const venues=[...venueSet].sort();
  venueSelect.innerHTML=`<option value="">All Venues</option>`;
  venues.forEach(v=>{ venueSelect.innerHTML+=`<option value="${v}">${v}</option>`; });

  results.innerHTML="Select two teams and click Compare.";
}

loadAllSeasons();

function compare(){
  const a=team1.value, b=team2.value;
  const selectedVenue=venueSelect.value;
  if(!a||!b) return;
  let games=allMatches.filter(g=>(g.home===a&&g.away===b)||(g.home===b&&g.away===a));
  if(selectedVenue) games=games.filter(g=>g.venue===selectedVenue);
  games.sort((x,y)=>y.season-x.season);
  currentGames=games;
  renderTable(games,a,b,null);
}

function filterWins(team){
  renderTable(currentGames,team1.value,team2.value,team);
}

function renderTable(games,a,b,filterTeam){
  let totalPoints=0, count=0, winsA=0, winsB=0;
  games.forEach(g=>{
    if(g.scoreA==null||g.scoreB==null) return;
    totalPoints+=(g.scoreA+g.scoreB); count++;
    if(g.home===a){ if(g.scoreA>g.scoreB) winsA++; else if(g.scoreB>g.scoreA) winsB++; }
    else{ if(g.scoreA>g.scoreB) winsB++; else if(g.scoreB>g.scoreA) winsA++; }
  });

  let avg=count?(totalPoints/count).toFixed(1):"-";
  let filteredGames=games;

  if(filterTeam==="A") filteredGames=games.filter(g=>g.home===a?g.scoreA>g.scoreB:g.scoreB>g.scoreA);
  if(filterTeam==="B") filteredGames=games.filter(g=>g.home===a?g.scoreB>g.scoreA:g.scoreA>g.scoreB);

  // Build game link
  function gLink(g){
    const raw=g.match_id;
    if(raw && !raw.includes("|")){
      return `afl-game.html?match=${encodeURIComponent(raw)}&year=${g.season}`;
    }
    const parts=raw.split("|");
    return `afl-game.html?year=${g.season}&round=${encodeURIComponent(parts[0])}&home=${encodeURIComponent(g.home===a?displayName(a):displayName(b))}&away=${encodeURIComponent(g.home===a?displayName(b):displayName(a))}`;
  }

  let html=`
    <h3>${displayName(a)} vs ${displayName(b)}</h3>
    <div class="summary">
      <div onclick="filterWins('A')">${displayName(a)} Wins<br>${winsA}</div>
      <div>Average Score<br>${avg}</div>
      <div onclick="filterWins('B')">${displayName(b)} Wins<br>${winsB}</div>
    </div>
    <p>Total games: ${filteredGames.length}</p>
    <table><thead><tr>
      <th>Season</th><th>Round</th><th>Venue</th><th>Match</th>
      <th class="numeric">Score</th><th class="numeric">Margin</th>
    </tr></thead><tbody>`;

  filteredGames.forEach(g=>{
    const margin=g.scoreA!=null&&g.scoreB!=null?Math.abs(g.scoreA-g.scoreB):"";
    html+=`<tr onclick="window.location='${gLink(g)}'">
      <td>${g.season}</td><td>${g.round}</td><td>${g.venue}</td>
      <td>${displayName(g.home)} v ${displayName(g.away)}</td>
      <td class="numeric">${g.scoreA} - ${g.scoreB}</td>
      <td class="numeric">${margin}</td>
    </tr>`;
  });

  html+=`</tbody></table>`;
  results.innerHTML=html;
}
</script>
</body>
</html>
