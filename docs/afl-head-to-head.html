<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.selector-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:30px;
}

.selector-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
}

.selector-box h3{
  margin:0 0 10px;
}

.selector-box select{
  width:100%;
  padding:10px;
  font-size:16px;
}

.compare-btn{
  margin-top:20px;
  padding:12px 24px;
  font-size:16px;
  font-weight:700;
  background:#0056d6;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.compare-btn:hover{
  background:#003f9e;
}

.results-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
  margin-top:20px;
}

.placeholder{
  color:#666;
  font-style:italic;
  padding:10px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:left;
}
th{background:#f4f6f8;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>AFL Head to Head</h1>
<p>Compare two AFL teams across all matches, seasons, and venues.</p>

<div class="selector-grid">
  <div class="selector-box">
    <h3>Team One</h3>
    <select id="team1">
      <option value="">Select team</option>
    </select>
  </div>

  <div class="selector-box">
    <h3>Team Two</h3>
    <select id="team2">
      <option value="">Select team</option>
    </select>
  </div>
</div>

<button class="compare-btn" onclick="compare()">Compare</button>

<div id="results" class="results-box">
  <div class="placeholder">Loading AFL match database…</div>
</div>

</div>

<script>
let allData = [];

/* TEAM NORMALISATION MAP */
const teamMap = {
  "kangaroos": "north melbourne",
  "north melb": "north melbourne",

  "footscray": "western bulldogs",

  "gws": "greater western sydney",
  "greater western sydney giants": "greater western sydney",

  "brisbane bears": "brisbane lions",
  "fitzroy": "brisbane lions"
};

function norm(s){
  let t = (s||"").trim().toLowerCase();
  return teamMap[t] || t;
}

function titleCase(s){
  return s.replace(/\b\w/g, c => c.toUpperCase());
}

async function loadAllSeasons(){
  const startYear = 1990;
  const endYear = new Date().getFullYear();
  const teams = new Set();

  for(let y=startYear; y<=endYear; y++){
    try{
      const res = await fetch(`data/afl/afl_${y}.json`);
      if(!res.ok) continue;
      const seasonData = await res.json();

      seasonData.forEach(r=>{
        if(!r.home_team || !r.away_team) return;

        // normalised names
        r._home = norm(r.home_team);
        r._away = norm(r.away_team);

        allData.push(r);

        teams.add(r._home);
        teams.add(r._away);
      });
    }catch(e){}
  }

  const sorted=[...teams].sort();
  const t1=document.getElementById("team1");
  const t2=document.getElementById("team2");

  sorted.forEach(t=>{
    const name = titleCase(t);
    t1.innerHTML+=`<option value="${t}">${name}</option>`;
    t2.innerHTML+=`<option value="${t}">${name}</option>`;
  });

  document.getElementById("results").innerHTML =
    "<div class='placeholder'>Select two teams and click Compare.</div>";
}

loadAllSeasons();

function compare(){
  const a=document.getElementById("team1").value;
  const b=document.getElementById("team2").value;
  const box=document.getElementById("results");

  if(!a || !b){
    box.innerHTML="<b>Please select two teams.</b>";
    return;
  }

  if(a===b){
    box.innerHTML="<b>Please select two different teams.</b>";
    return;
  }

  const rawGames = allData.filter(r =>
    (r._home===a && r._away===b) ||
    (r._home===b && r._away===a)
  );

  if(rawGames.length===0){
    box.innerHTML="<b>No matches found for this pairing.</b>";
    return;
  }

  /* DEDUPE BY MATCH */
  const gameMap = {};
  rawGames.forEach(r=>{
    if(!gameMap[r.match_id]){
      gameMap[r.match_id] = r;
    }
  });
  let games = Object.values(gameMap);

  /* SORT NEWEST FIRST */
  games.sort((x,y)=>{
    if(y.season!==x.season) return y.season-x.season;
    return parseInt(y.round.replace("Round ","")) -
           parseInt(x.round.replace("Round ",""));
  });

  let aWins=0,bWins=0,draws=0;

  games.forEach(g=>{
    const s1=g.home_points;
    const s2=g.away_points;

    if(s1===s2) draws++;
    else if((g._home===a && s1>s2) || (g._away===a && s2>s1)) aWins++;
    else bWins++;
  });

  const last10 = games.slice(0,10);
  let totalPoints10 = 0;

  last10.forEach(g=>{
    totalPoints10 += g.total_points;
  });

  const avgPoints10 = (totalPoints10 / last10.length).toFixed(1);

  let html=`
  <h3>${titleCase(a)} vs ${titleCase(b)}</h3>
  <p>
    Games: ${games.length} |
    ${titleCase(a)} wins: ${aWins} |
    Draws: ${draws} |
    ${titleCase(b)} wins: ${bWins}
  </p>
  <p>
    Last 10 Avg Points per Game: ${avgPoints10}
  </p>

  <table>
    <tr>
      <th>Season</th>
      <th>Round</th>
      <th>Venue</th>
      <th>Match</th>
      <th>Winner</th>
      <th>Score</th>
      <th>Total Points</th>
      <th>Margin</th>
    </tr>
  `;

  games.forEach(g=>{
    const winner =
      g.home_points > g.away_points ? titleCase(g._home) :
      g.away_points > g.home_points ? titleCase(g._away) :
      "Draw";

    html+=`
      <tr>
        <td>${g.season}</td>
        <td>${g.round}</td>
        <td>${g.venue || ""}</td>
        <td>${titleCase(g._home)} v ${titleCase(g._away)}</td>
        <td>${winner}</td>
        <td>${g.home_points} - ${g.away_points}</td>
        <td>${g.total_points}</td>
        <td>${g.margin}</td>
      </tr>
    `;
  });

  html+="</table>";
  box.innerHTML=html;
}
</script>

</body>
</html>
