<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.selector-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:30px;
}

.selector-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
}

.selector-box h3{
  margin:0 0 10px;
}

.selector-box select{
  width:100%;
  padding:10px;
  font-size:16px;
}

.compare-btn{
  margin-top:20px;
  padding:12px 24px;
  font-size:16px;
  font-weight:700;
  background:#0056d6;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.compare-btn:hover{
  background:#003f9e;
}

.results-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
  margin-top:20px;
}

.placeholder{
  color:#666;
  font-style:italic;
  padding:10px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:left;
}
th{background:#f4f6f8;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>AFL Head to Head</h1>
<p>Compare two AFL teams across all matches since 1990.</p>

<div class="selector-grid">
  <div class="selector-box">
    <h3>Team One</h3>
    <select id="team1">
      <option value="">Select team</option>
    </select>
  </div>

  <div class="selector-box">
    <h3>Team Two</h3>
    <select id="team2">
      <option value="">Select team</option>
    </select>
  </div>
</div>

<button class="compare-btn" onclick="compare()">Compare</button>

<div id="results" class="results-box">
  <div class="placeholder">Loading AFL database…</div>
</div>

</div>

<script>
let allMatches = [];

function norm(s){
  return (s||"").trim().toLowerCase();
}

function displayName(s){
  const t = (s||"").trim();
  if(!t) return "";
  if(t.toLowerCase()==="gws") return "GWS";
  return t.replace(/\b\w/g, c => c.toUpperCase());
}

function canonicalRound(r){
  const t=(r||"").toLowerCase();
  if(t.includes("elimination")) return "Elimination Final";
  if(t.includes("qualifying")) return "Qualifying Final";
  if(t.includes("semi")) return "Semi Final";
  if(t.includes("preliminary")) return "Preliminary Final";
  if(t.includes("grand")) return "Grand Final";
  return (r||"").trim();
}

function roundSortKey(r){
  const rr = canonicalRound(r);
  const m = rr.match(/^Round\s*(\d+)/i);
  if(m) return 1000 + parseInt(m[1],10);
  if(rr==="Elimination Final") return 2001;
  if(rr==="Qualifying Final") return 2002;
  if(rr==="Semi Final") return 2003;
  if(rr==="Preliminary Final") return 2004;
  if(rr==="Grand Final") return 2005;
  return 9999;
}

function sleep0(){
  return new Promise(res => setTimeout(res, 0));
}

async function loadAllSeasons(){
  const startYear = 1990;
  const endYear = new Date().getFullYear();
  const teamSet = new Set();
  const box = document.getElementById("results");

  allMatches = [];
  box.innerHTML = `<div class="placeholder">Loading AFL database… (0/${endYear-startYear+1})</div>`;

  for(let y=startYear; y<=endYear; y++){
    // update UI each year so it never looks "stuck"
    box.innerHTML = `<div class="placeholder">Loading AFL database… (${y-startYear+1}/${endYear-startYear+1})</div>`;
    await sleep0();

    try{
      const res = await fetch(`/data/afl/players_${y}.json?cb=${Date.now()}`);
      if(!res.ok) continue;

      const raw = await res.json();
      if(!Array.isArray(raw) || raw.length===0) continue;

      const map = {};

      raw.forEach(p=>{
        const key = p.match_id + "|" + canonicalRound(p.round);

        if(!map[key]){
          map[key] = {
            season: p.season,
            round: canonicalRound(p.round),
            venue: p.venue || "",
            teams: {}
          };
        }

        // If venue is blank on first record but exists later, fill it
        if(!map[key].venue && p.venue){
          map[key].venue = p.venue;
        }

        const team = (p.played_for || "").trim();
        if(!team) return;

        const goals = Number(p.G||0);
        const behinds = Number(p.B||0);
        const points = goals*6 + behinds;

        if(!map[key].teams[team]) map[key].teams[team]=0;
        map[key].teams[team]+=points;
      });

      Object.values(map).forEach(m=>{
        const teams = Object.keys(m.teams);
        if(teams.length!==2) return;

        const homeRaw = teams[0];
        const awayRaw = teams[1];

        const home = norm(homeRaw);
        const away = norm(awayRaw);

        const hp = Number(m.teams[homeRaw] || 0);
        const ap = Number(m.teams[awayRaw] || 0);

        allMatches.push({
          season: Number(m.season) || y,
          round: m.round,
          round_key: roundSortKey(m.round),
          venue: m.venue || "",
          home,
          away,
          hp,
          ap,
          total_points: hp + ap,
          margin: Math.abs(hp - ap)
        });

        teamSet.add(home);
        teamSet.add(away);
      });

    }catch(e){
      // skip year, keep going
      console.warn("Skipped year", y, e);
    }
  }

  const teams=[...teamSet].sort();
  const t1=document.getElementById("team1");
  const t2=document.getElementById("team2");

  t1.innerHTML = `<option value="">Select team</option>`;
  t2.innerHTML = `<option value="">Select team</option>`;

  teams.forEach(t=>{
    const name = displayName(t);
    t1.innerHTML += `<option value="${t}">${name}</option>`;
    t2.innerHTML += `<option value="${t}">${name}</option>`;
  });

  document.getElementById("results").innerHTML =
    "<div class='placeholder'>Select two teams and click Compare.</div>";
}

loadAllSeasons();

function compare(){
  const a=document.getElementById("team1").value;
  const b=document.getElementById("team2").value;
  const box=document.getElementById("results");

  if(!a || !b){
    box.innerHTML="<b>Please select two teams.</b>";
    return;
  }
  if(a===b){
    box.innerHTML="<b>Please select two different teams.</b>";
    return;
  }

  const games = allMatches
    .filter(g => (g.home===a && g.away===b) || (g.home===b && g.away===a))
    .sort((x,y)=>{
      if(y.season!==x.season) return y.season-x.season;
      return (y.round_key||0) - (x.round_key||0);
    });

  if(!games.length){
    box.innerHTML="<b>No matches found for this pairing.</b>";
    return;
  }

  let aWins=0,bWins=0,draws=0;

  games.forEach(g=>{
    if(g.hp===g.ap) draws++;
    else if((g.home===a && g.hp>g.ap) || (g.away===a && g.ap>g.hp)) aWins++;
    else bWins++;
  });

  const lastN = Math.min(10, games.length);
  const lastGames = games.slice(0, lastN);
  const totalPointsN = lastGames.reduce((sum,g)=>sum + (Number(g.total_points)||0), 0);
  const avgPointsN = (totalPointsN / lastGames.length).toFixed(1);

  const A = displayName(a);
  const B = displayName(b);

  let html=`
  <h3>${A} vs ${B}</h3>
  <p>
    Games: ${games.length} |
    ${A} wins: ${aWins} |
    Draws: ${draws} |
    ${B} wins: ${bWins}
  </p>
  <p>
    Last ${lastN} Avg Points per Game: ${avgPointsN}
  </p>

  <table>
    <tr>
      <th>Season</th>
      <th>Round</th>
      <th>Venue</th>
      <th>Match</th>
      <th>Winner</th>
      <th>Score</th>
      <th>Total Points</th>
      <th>Margin</th>
    </tr>
  `;

  games.forEach(g=>{
    const winner =
      g.hp > g.ap ? displayName(g.home) :
      g.ap > g.hp ? displayName(g.away) :
      "Draw";

    html+=`
      <tr>
        <td>${g.season}</td>
        <td>${g.round}</td>
        <td>${g.venue || ""}</td>
        <td>${displayName(g.home)} v ${displayName(g.away)}</td>
        <td>${winner}</td>
        <td>${g.hp} - ${g.ap}</td>
        <td>${g.total_points}</td>
        <td>${g.margin}</td>
      </tr>
    `;
  });

  html+="</table>";
  box.innerHTML=html;
}
</script>

</body>
</html>
