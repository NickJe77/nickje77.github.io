<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.selector-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:30px;
}

.selector-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
}

.selector-box h3{margin:0 0 10px;}

.selector-box select{
  width:100%;
  padding:10px;
  font-size:16px;
}

.compare-btn{
  margin-top:20px;
  padding:12px 24px;
  font-size:16px;
  font-weight:700;
  background:#0056d6;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.compare-btn:hover{background:#003f9e;}

.results-box{
  border:1px solid #ddd;
  border-radius:10px;
  padding:20px;
  margin-top:20px;
}

.placeholder{
  color:#666;
  font-style:italic;
  padding:10px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:left;
}
th{background:#f4f6f8;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="afl.html">AFL</a>
</div>

<div class="page-wrap">

<h1>AFL Head to Head</h1>
<p>Compare two AFL teams across the last 6 seasons.</p>

<div class="selector-grid">
  <div class="selector-box">
    <h3>Team One</h3>
    <select id="team1">
      <option value="">Select team</option>
    </select>
  </div>

  <div class="selector-box">
    <h3>Team Two</h3>
    <select id="team2">
      <option value="">Select team</option>
    </select>
  </div>
</div>

<button class="compare-btn" onclick="compare()">Compare</button>

<div id="results" class="results-box">
  <div class="placeholder">Loading AFL database…</div>
</div>

</div>

<script>
let allMatches = [];

function norm(s){
  return (s||"").trim().toLowerCase();
}

function displayName(s){
  if(!s) return "";
  if(s.toLowerCase()==="gws") return "GWS";
  return s.replace(/\b\w/g,c=>c.toUpperCase());
}

async function loadAllSeasons(){
  const LAST_YEAR = 2025;
  const startYear = LAST_YEAR - 5;
  const teamSet = new Set();
  allMatches = [];

  for(let y=startYear; y<=LAST_YEAR; y++){
    try{
      const res = await fetch(`./data/afl/players_${y}.json`);
      if(!res.ok) continue;

      const raw = await res.json();
      if(!Array.isArray(raw)) continue;

      const matchMap = {};

      raw.forEach(p=>{
        if(!p.match_id) return;

        const key = p.match_id;

        if(!matchMap[key]){
          matchMap[key] = {
            season: p.season,
            round: p.round,
            venue: "",
            teams: {}
          };
        }

        // ✅ FIX: always attempt to fill venue
        if(!matchMap[key].venue){
          matchMap[key].venue = p.venue || p.ground_name_full || "";
        }

        const team = p.played_for;
        if(!team) return;

        const goals = Number(p.G || 0);
        const behinds = Number(p.B || 0);
        const points = goals * 6 + behinds;

        if(!matchMap[key].teams[team]) matchMap[key].teams[team] = 0;
        matchMap[key].teams[team] += points;
      });

      Object.values(matchMap).forEach(m=>{
        const teams = Object.keys(m.teams);
        if(teams.length !== 2) return;

        const homeTeam = teams[0];
        const awayTeam = teams[1];

        const home = norm(homeTeam);
        const away = norm(awayTeam);

        const hp = m.teams[homeTeam];
        const ap = m.teams[awayTeam];

        allMatches.push({
          season: Number(m.season),
          round: m.round,
          venue: m.venue,
          home,
          away,
          hp,
          ap,
          total: hp + ap,
          margin: Math.abs(hp - ap)
        });

        teamSet.add(home);
        teamSet.add(away);
      });

    }catch(e){
      console.log("Failed year", y, e);
    }
  }

  const teams=[...teamSet].sort();
  const t1=document.getElementById("team1");
  const t2=document.getElementById("team2");

  t1.innerHTML=`<option value="">Select team</option>`;
  t2.innerHTML=`<option value="">Select team</option>`;

  teams.forEach(t=>{
    t1.innerHTML+=`<option value="${t}">${displayName(t)}</option>`;
    t2.innerHTML+=`<option value="${t}">${displayName(t)}</option>`;
  });

  document.getElementById("results").innerHTML =
    "<div class='placeholder'>Select two teams and click Compare.</div>";
}

loadAllSeasons();

function compare(){
  const a=document.getElementById("team1").value;
  const b=document.getElementById("team2").value;
  const box=document.getElementById("results");

  if(!a||!b){ box.innerHTML="<b>Select two teams.</b>"; return; }
  if(a===b){ box.innerHTML="<b>Select different teams.</b>"; return; }

  const games = allMatches.filter(g =>
    (g.home===a && g.away===b) || (g.home===b && g.away===a)
  ).sort((x,y)=>y.season-x.season);

  let aWins=0,bWins=0,draws=0;

  games.forEach(g=>{
    if(g.hp===g.ap) draws++;
    else if((g.home===a && g.hp>g.ap) || (g.away===a && g.ap>g.hp)) aWins++;
    else bWins++;
  });

  const A=displayName(a);
  const B=displayName(b);

  let html=`
    <h3>${A} vs ${B}</h3>
    <p>Games: ${games.length} | ${A} wins: ${aWins} | Draws: ${draws} | ${B} wins: ${bWins}</p>

    <table>
    <tr>
      <th>Season</th>
      <th>Round</th>
      <th>Venue</th>
      <th>Match</th>
      <th>Score</th>
      <th>Total</th>
      <th>Margin</th>
    </tr>
  `;

  games.forEach(g=>{
    html+=`
      <tr>
        <td>${g.season}</td>
        <td>${g.round}</td>
        <td>${g.venue}</td>
        <td>${displayName(g.home)} v ${displayName(g.away)}</td>
        <td>${g.hp} - ${g.ap}</td>
        <td>${g.total}</td>
        <td>${g.margin}</td>
      </tr>
    `;
  });

  html+="</table>";
  box.innerHTML=html;
}
</script>

</body>
</html>
