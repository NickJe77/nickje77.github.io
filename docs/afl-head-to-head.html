<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:system-ui,Arial,sans-serif;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
.selector-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px;}
.selector-box{border:1px solid #ddd;border-radius:10px;padding:20px;}
.selector-box select{width:100%;padding:10px;font-size:16px;}
.compare-btn{padding:12px 24px;font-size:16px;font-weight:700;background:#0056d6;color:#fff;border:none;border-radius:8px;cursor:pointer;}
.results-box{border:1px solid #ddd;border-radius:10px;padding:20px;margin-top:20px;}

.summary{
display:flex;
justify-content:space-between;
gap:20px;
margin-bottom:15px;
font-weight:700;
}

.summary div{
flex:1;
text-align:center;
padding:12px;
background:#f4f6f8;
border-radius:8px;
}

table{width:100%;border-collapse:collapse;margin-top:15px;}
th,td{border-bottom:1px solid #ddd;padding:8px;}
th{background:#f4f6f8;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="afl.html">AFL</a>
</div>

<div class="page-wrap">
<h1>AFL Head to Head</h1>

<div class="selector-grid">
<div class="selector-box"><select id="team1"></select></div>
<div class="selector-box"><select id="team2"></select></div>
</div>

<button class="compare-btn" onclick="compare()">Compare</button>

<div id="results" class="results-box">Loading AFL database…</div>
</div>

<script>

const team1=document.getElementById("team1");
const team2=document.getElementById("team2");
const results=document.getElementById("results");

let allMatches=[];
let teamMap={};

function norm(s){return (s||"").trim().toLowerCase();}
function displayName(k){return teamMap[k]||k;}

async function loadAllSeasons(){

const startYear=2021;
const LAST_YEAR=2026;

const teamSet=new Set();
allMatches=[];

for(let y=startYear;y<=LAST_YEAR;y++){

try{

const res=await fetch(`/data/afl/afl_${y}.json`);
if(!res.ok) continue;

const raw=await res.json();
if(!Array.isArray(raw)) continue;

const matchMap={};

raw.forEach(r=>{
if(!r.match_id) return;

if(!matchMap[r.match_id]){
matchMap[r.match_id]={
season:Number(r.season)||y,
round:r.round,
venue:r.venue,
teamA:r.played_for,
teamB:r.played_against,
scoreA:Number(r.score_for),
scoreB:Number(r.score_against)
};
}
});

Object.values(matchMap).forEach(m=>{
const a=norm(m.teamA);
const b=norm(m.teamB);

teamMap[a]=m.teamA;
teamMap[b]=m.teamB;

allMatches.push({
season:m.season,
round:m.round,
venue:m.venue,
home:a,
away:b,
scoreA:m.scoreA,
scoreB:m.scoreB
});

teamSet.add(a);
teamSet.add(b);
});

}catch(e){
console.log("Failed year",y,e);
}

}

const teams=[...teamSet].sort((a,b)=>displayName(a).localeCompare(displayName(b)));

team1.innerHTML=`<option value="">Select team</option>`;
team2.innerHTML=`<option value="">Select team</option>`;

teams.forEach(t=>{
team1.innerHTML+=`<option value="${t}">${displayName(t)}</option>`;
team2.innerHTML+=`<option value="${t}">${displayName(t)}</option>`;
});

results.innerHTML="Select two teams and click Compare.";
}

loadAllSeasons();

function compare(){

const a=team1.value;
const b=team2.value;

if(!a||!b) return;

const games=allMatches.filter(g=>
(g.home===a&&g.away===b)||
(g.home===b&&g.away===a)
).sort((x,y)=>y.season-x.season);

let totalPoints=0;
let count=0;
let winsA=0;
let winsB=0;

games.forEach(g=>{

if(isNaN(g.scoreA) || isNaN(g.scoreB)) return;

totalPoints += (g.scoreA + g.scoreB);
count++;

// FIXED WIN LOGIC (handles home/away properly)
if(g.home===a){
  if(g.scoreA > g.scoreB) winsA++;
  else if(g.scoreB > g.scoreA) winsB++;
}else{
  if(g.scoreA > g.scoreB) winsB++;
  else if(g.scoreB > g.scoreA) winsA++;
}

});

let avg = count ? (totalPoints / count).toFixed(1) : "-";

let html=`
<h3>${displayName(a)} vs ${displayName(b)}</h3>

<div class="summary">
<div>${displayName(a)} Wins<br>${winsA}</div>
<div>Average Score<br>${avg}</div>
<div>${displayName(b)} Wins<br>${winsB}</div>
</div>

<p>Total games: ${games.length}</p>

<table>
<thead>
<tr>
<th>Season</th>
<th>Round</th>
<th>Venue</th>
<th>Match</th>
<th>Score</th>
</tr>
</thead>
<tbody>
`;

games.forEach(g=>{
html+=`
<tr>
<td>${g.season}</td>
<td>${g.round}</td>
<td>${g.venue}</td>
<td>${displayName(g.home)} v ${displayName(g.away)}</td>
<td>${g.scoreA} - ${g.scoreB}</td>
</tr>
`;
});

html+=`</tbody></table>`;

results.innerHTML=html;

}

</script>

</body>
</html>
