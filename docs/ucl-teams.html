<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>UCL Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:700;
color:#0056d6;
}

.hero{
background:linear-gradient(135deg,#001489,#0a3ccc);
color:white;
padding:70px 20px;
text-align:center;
}

.hero h1{
margin:0;
font-size:64px;
font-weight:900;
}

.hero p{
margin-top:14px;
font-size:22px;
font-weight:600;
opacity:.95;
}

.container{
max-width:1600px;
margin:40px auto;
padding:0 20px;
}

.search-wrap{
margin-bottom:28px;
display:flex;
justify-content:center;
}

#teamSearch{
width:100%;
max-width:520px;
padding:16px 18px;
font-size:18px;
border-radius:14px;
border:1px solid #d7dbe3;
outline:none;
font-family:Inter,system-ui,Arial,sans-serif;
font-weight:600;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

#teamSearch:focus{
border-color:#0a3ccc;
box-shadow:0 0 0 4px rgba(10,60,204,.15);
}

.team-count{
margin-bottom:24px;
font-size:18px;
font-weight:700;
color:#555;
text-align:center;
}

.teams-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:24px;
}

.team-card{
background:white;
border-radius:18px;
overflow:hidden;
text-decoration:none;
color:#111;
box-shadow:0 2px 10px rgba(0,0,0,.08);
transition:.2s ease;
display:block;
}

.team-card:hover{
transform:translateY(-4px);
box-shadow:0 8px 24px rgba(0,0,0,.14);
}

.team-band{
height:10px;
width:100%;
}

.team-content{
padding:28px 22px;
}

.team-name{
font-size:30px;
font-weight:900;
margin-bottom:10px;
line-height:1.15;
}

.team-meta{
font-size:16px;
color:#666;
font-weight:600;
}

.no-results{
text-align:center;
font-size:22px;
font-weight:800;
padding:60px 20px;
color:#666;
display:none;
}

@media(max-width:900px){

.hero h1{
font-size:42px;
}

.hero p{
font-size:18px;
}

.team-name{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
<a href="/baseball.html">Baseball</a>
<a href="/ucl.html">UCL</a>
</div>

<div class="hero">
<h1>Champions League Teams</h1>
<p>Every club to play in the UEFA Champions League</p>
</div>

<div class="container">

<div class="search-wrap">
<input type="text" id="teamSearch" placeholder="Search teams...">
</div>

<div class="team-count" id="teamCount"></div>
<div class="teams-grid" id="teamsGrid"></div>
<div class="no-results" id="noResults">No teams found</div>

</div>

<script>

const TEAMS = [
{name:"AC Milan",colour:"linear-gradient(90deg,#FB090B,#000000)"},
{name:"Ajax",colour:"linear-gradient(90deg,#D2122E,#FFFFFF)"},
{name:"Anderlecht",colour:"linear-gradient(90deg,#6B2D8B,#FFFFFF)"},
{name:"Arsenal",colour:"linear-gradient(90deg,#EF0107,#FFFFFF)"},
{name:"Atletico Madrid",colour:"linear-gradient(90deg,#CB3524,#FFFFFF)"},
{name:"Barcelona",colour:"linear-gradient(90deg,#A50044,#004D98)"},
{name:"Basel",colour:"linear-gradient(90deg,#E4002B,#0033A0)"},
{name:"Bayern Munich",colour:"linear-gradient(90deg,#DC052D,#FFFFFF)"},
{name:"Benfica",colour:"linear-gradient(90deg,#D4001A,#FFFFFF)"},
{name:"Borussia Dortmund",colour:"linear-gradient(90deg,#FDE100,#000000)"},
{name:"Borussia Mönchengladbach",colour:"linear-gradient(90deg,#000000,#FFFFFF)"},
{name:"Celtic",colour:"linear-gradient(90deg,#16973B,#FFFFFF)"},
{name:"Chelsea",colour:"linear-gradient(90deg,#034694,#FFFFFF)"},
{name:"Club Brugge",colour:"linear-gradient(90deg,#1A3E6C,#000000)"},
{name:"CSKA Moscow",colour:"linear-gradient(90deg,#D4002D,#003DA5)"},
{name:"Deportivo La Coruña",colour:"linear-gradient(90deg,#FFFFFF,#005CA9)"},
{name:"Dynamo Kyiv",colour:"linear-gradient(90deg,#003087,#FFFFFF)"},
{name:"Eintracht Frankfurt",colour:"linear-gradient(90deg,#E1000F,#000000)"},
{name:"Feyenoord",colour:"linear-gradient(90deg,#C8102E,#000000)"},
{name:"Fiorentina",colour:"linear-gradient(90deg,#4B0082,#FFFFFF)"},
{name:"Galatasaray",colour:"linear-gradient(90deg,#FFC300,#C8102E)"},
{name:"Internazionale",colour:"linear-gradient(90deg,#010E80,#000000)"},
{name:"Juventus",colour:"linear-gradient(90deg,#000000,#FFFFFF)"},
{name:"Kaiserslautern",colour:"linear-gradient(90deg,#E4001C,#FFFFFF)"},
{name:"Lazio",colour:"linear-gradient(90deg,#87CEEB,#FFFFFF)"},
{name:"Leeds United",colour:"linear-gradient(90deg,#FFCD00,#1D428A)"},
{name:"Leicester City",colour:"linear-gradient(90deg,#003090,#FDBE11)"},
{name:"Leverkusen",colour:"linear-gradient(90deg,#E32221,#000000)"},
{name:"Liverpool",colour:"linear-gradient(90deg,#C8102E,#00B2A9)"},
{name:"Lyon",colour:"linear-gradient(90deg,#D4001A,#003DA5)"},
{name:"Manchester City",colour:"linear-gradient(90deg,#6CABDD,#1C2C5B)"},
{name:"Manchester United",colour:"linear-gradient(90deg,#DA291C,#FBE122)"},
{name:"Marseille",colour:"linear-gradient(90deg,#009BDE,#FFFFFF)"},
{name:"Monaco",colour:"linear-gradient(90deg,#D4002D,#FFFFFF)"},
{name:"Napoli",colour:"linear-gradient(90deg,#12A0C7,#FFFFFF)"},
{name:"Olympiakos",colour:"linear-gradient(90deg,#D4002D,#FFFFFF)"},
{name:"Paris Saint-Germain",colour:"linear-gradient(90deg,#003170,#DA291C)"},
{name:"Porto",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"PSV Eindhoven",colour:"linear-gradient(90deg,#E4002B,#FFFFFF)"},
{name:"Rangers",colour:"linear-gradient(90deg,#003087,#FFFFFF)"},
{name:"Real Madrid",colour:"linear-gradient(90deg,#FEBE10,#FFFFFF)"},
{name:"Red Bull Salzburg",colour:"linear-gradient(90deg,#D4002D,#FFFFFF)"},
{name:"Roma",colour:"linear-gradient(90deg,#8B0000,#F5C518)"},
{name:"Schalke 04",colour:"linear-gradient(90deg,#004D9D,#FFFFFF)"},
{name:"Sevilla",colour:"linear-gradient(90deg,#C8102E,#FFFFFF)"},
{name:"Shakhtar Donetsk",colour:"linear-gradient(90deg,#F4A100,#000000)"},
{name:"Sparta Prague",colour:"linear-gradient(90deg,#AC2025,#FFFFFF)"},
{name:"Sporting CP",colour:"linear-gradient(90deg,#006600,#FFFFFF)"},
{name:"Tottenham Hotspur",colour:"linear-gradient(90deg,#132257,#FFFFFF)"},
{name:"Valencia",colour:"linear-gradient(90deg,#000000,#F5A623)"},
{name:"Villarreal",colour:"linear-gradient(90deg,#FFD700,#005BAC)"},
{name:"Werder Bremen",colour:"linear-gradient(90deg,#1D6F42,#FFFFFF)"},
{name:"Zenit St. Petersburg",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"}
];

const grid = document.getElementById("teamsGrid");
const search = document.getElementById("teamSearch");
const count = document.getElementById("teamCount");
const noResults = document.getElementById("noResults");

function renderTeams(filter=""){
    grid.innerHTML = "";
    const filtered = TEAMS
        .sort((a,b) => a.name.localeCompare(b.name))
        .filter(team => team.name.toLowerCase().includes(filter.toLowerCase()));

    count.innerHTML = `${filtered.length} Teams`;

    if(filtered.length === 0){
        noResults.style.display = "block";
        return;
    }

    noResults.style.display = "none";

    filtered.forEach(team => {
        grid.innerHTML += `<a class="team-card" href="ucl-team.html?team=${encodeURIComponent(team.name)}"><div class="team-band" style="background:${team.colour};"></div><div class="team-content"><div class="team-name">${team.name}</div><div class="team-meta">View club stats, results and players</div></div></a>`;
    });
}

search.addEventListener("input", e => {
    renderTeams(e.target.value);
});

renderTeams();

</script>

</body>
</html>
