<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Rising Star | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}

.page-wrap{
  max-width:1000px;
  margin:0 auto;
  padding:26px 20px 70px;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:32px 34px;
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.eyebrow{
  display:block;
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(28px,5vw,40px);
  letter-spacing:.01em;
  text-transform:uppercase;
}
.hero p{
  margin-top:10px;
  font-size:14px;
  color:rgba(255,255,255,.75);
  font-weight:600;
}

/* ── Controls ─────────────────────────────────────────── */
.controls{
  margin-bottom:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.controls select{
  padding:10px 18px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  font-family:var(--body);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.controls select:hover{ border-color:var(--faint); }
.controls select:focus{ outline:none;border-color:var(--accent); }

/* ── Winner spotlight ─────────────────────────────────── */
.winner-card{
  background:var(--surface);
  border:1px solid var(--accent);
  border-radius:var(--radius);
  padding:20px 24px;
  margin-bottom:22px;
  display:flex;
  align-items:center;
  gap:16px;
}
.winner-card .trophy{
  font-family:var(--display);
  font-size:11px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--accent);
  background:var(--accent-soft);
  padding:6px 14px;
  border-radius:999px;
  white-space:nowrap;
}
.winner-card .name{
  font-family:var(--display);
  font-weight:600;
  font-size:20px;
  text-transform:uppercase;
  color:var(--ink);
}
.winner-card .team{
  font-size:13px;
  color:var(--muted);
  margin-top:2px;
}
.winner-card.empty{
  color:var(--muted);
  font-size:13.5px;
  font-weight:600;
  border-color:var(--line);
}

/* ── Table ────────────────────────────────────────────── */
table{
  width:100%;
  border-collapse:collapse;
  font-size:13.5px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}
th,td{
  border-bottom:1px solid var(--line);
  padding:11px 14px;
  text-align:left;
}
th{
  background:#f7f9fb;
  color:var(--muted);
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
}
td{
  color:#27313c;
  font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover td{ background:#f0f6ff; }
tbody tr.is-winner td{
  background:var(--accent-soft);
  font-weight:700;
  color:var(--ink);
}
.badge{
  display:inline-block;
  margin-left:8px;
  padding:2px 10px;
  border-radius:999px;
  background:var(--accent);
  color:#fff;
  font-family:var(--display);
  font-size:10px;
  font-weight:600;
  letter-spacing:.05em;
  text-transform:uppercase;
  vertical-align:middle;
}
.loading{
  text-align:center;
  padding:40px;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="afl.html">AFL</a>
  <a href="afl-all-australian.html">All-Australian</a>
  <a href="afl-rising-star.html" aria-current="page">Rising Star</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <span class="eyebrow">AFL</span>
    <h1>Rising Star</h1>
    <p>Every round nominee and season winner of the AFL Rising Star award.</p>
  </div>

  <div class="controls">
    <select id="yearSelect"><option>Loading…</option></select>
    <select id="clubSelect"><option value="">All Clubs</option></select>
  </div>

  <div id="winnerCard"></div>

  <table>
    <thead>
      <tr>
        <th>Round</th>
        <th>Player</th>
        <th>Team</th>
      </tr>
    </thead>
    <tbody id="nomineesTable">
      <tr><td colspan="3" class="loading">Loading nominees…</td></tr>
    </tbody>
  </table>

</div>

<script>
const NOMINEES_URL = "data/afl/afl_rising_star.csv";
const WINNERS_URL = "data/afl/Rising%20Star.csv";

// Simple CSV parser handling quoted fields with embedded commas
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ",") { row.push(field); field = ""; }
      else if(c === "\r") { /* skip */ }
      else if(c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0] !== "");
}

function csvToObjects(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const header = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const obj = {};
    header.forEach((h, i) => { obj[h] = (r[i] || "").trim(); });
    return obj;
  });
}

let nomineesByYear = {};
let winnersByYear = {};
let years = [];

const yearSelect = document.getElementById("yearSelect");
const clubSelect = document.getElementById("clubSelect");
const winnerCard = document.getElementById("winnerCard");
const nomineesTable = document.getElementById("nomineesTable");

Promise.all([
  fetch(NOMINEES_URL).then(r => r.text()),
  fetch(WINNERS_URL).then(r => r.text())
])
.then(([nomineesCSV, winnersCSV]) => {
  const nominees = csvToObjects(nomineesCSV);
  const winners = csvToObjects(winnersCSV);

  nominees.forEach(n => {
    const y = n.Year;
    if(!y) return;
    (nomineesByYear[y] = nomineesByYear[y] || []).push(n);
  });

  winners.forEach(w => {
    if(w.Year) winnersByYear[w.Year] = w;
  });

  years = Object.keys(nomineesByYear).sort((a,b) => b - a);

  if(!years.length){
    nomineesTable.innerHTML = `<tr><td colspan="3" class="loading">No nominee data found.</td></tr>`;
    return;
  }

  yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join("");
  yearSelect.value = years[0];
  yearSelect.onchange = () => render(yearSelect.value);

  const clubs = [...new Set(nominees.map(n => n.Team).filter(Boolean))].sort();
  clubSelect.innerHTML = `<option value="">All Clubs</option>` +
    clubs.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  clubSelect.onchange = () => render(yearSelect.value);

  render(years[0]);
})
.catch(err => {
  nomineesTable.innerHTML = `<tr><td colspan="3" class="loading">Couldn't load Rising Star data.</td></tr>`;
  console.error(err);
});

function render(year){
  const winner = winnersByYear[year];
  const club = clubSelect.value;
  let nominees = (nomineesByYear[year] || []).slice()
    .sort((a,b) => Number(b.Round) - Number(a.Round));

  if(club){
    nominees = nominees.filter(n => n.Team === club);
  }

  if(winner){
    winnerCard.innerHTML = `
      <div class="winner-card">
        <span class="trophy">${year} Winner</span>
        <div>
          <div class="name">${esc(winner.Player)}</div>
          <div class="team">${esc(winner.Team)}</div>
        </div>
      </div>`;
  } else {
    winnerCard.innerHTML = `<div class="winner-card empty">Winner not yet recorded for ${esc(year)}.</div>`;
  }

  if(!nominees.length){
    nomineesTable.innerHTML = `<tr><td colspan="3" class="loading">No nominees found for ${esc(year)}.</td></tr>`;
    return;
  }

  nomineesTable.innerHTML = nominees.map(n => {
    const isWinner = winner && winner.Player === n.Player;
    return `
      <tr class="${isWinner ? "is-winner" : ""}">
        <td>${esc(n.Round)}</td>
        <td>${esc(n.Player)}${isWinner ? '<span class="badge">Winner</span>' : ""}</td>
        <td>${esc(n.Team)}</td>
      </tr>`;
  }).join("");
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c]));
}
</script>

</body>
</html>
