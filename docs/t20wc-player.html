<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter;margin:0;background:#f6f7f9;}
.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px;
margin:20px;
border-radius:16px;
}
table{width:100%;border-collapse:collapse;background:#fff;}
td,th{padding:10px;border-bottom:1px solid #ddd;}
tr:nth-child(even){background:#eaf3ff;}
</style>

</head>
<body>

<div id="hero" class="hero">Loading...</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Runs</th>
<th>Wickets</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>

const BASE="/data/t20-world-cup/matches/";

const params=new URLSearchParams(location.search);

const player=params.get("player");

if(!player) throw "";

document.getElementById("hero").innerHTML=player;

load();

async function load(){

const index=await fetch(BASE+"index.json").then(r=>r.json());

for(const file of index){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{

let runs=0,wkts=0,played=false;

match.innings.forEach(inn=>{

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

if(d.batter===player){
runs+=d.runs.batter;
played=true;
}

d.wickets?.forEach(w=>{
if(w.bowler===player){
wkts++;
played=true;
}
});

});

});

});

if(played){

tbody.innerHTML+=`
<tr>
<td>${match.info.dates[0]}</td>
<td>${match.info.teams.join(" vs ")}</td>
<td>${runs}</td>
<td>${wkts}</td>
</tr>
`;

}

});

}

}

</script>

</body>
</html>
