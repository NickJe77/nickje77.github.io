<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f6f7f9;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:40px;
  border-radius:24px;
}

.hero h1{
  margin:0;
}

.controls{
  margin:20px 0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
}

.stat h3{
  margin:0;
  font-size:28px;
}

.table-wrap{
  margin-top:30px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{
  background:#f1f4f8;
}

tr:nth-child(even){
  background:#eaf3ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading…</h1>
</div>

<div class="stats" id="careerStats"></div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Runs</th>
<th>Balls</th>
<th>SR</th>
<th>Overs</th>
<th>Runs</th>
<th>Wkts</th>
<th>Econ</th>
</tr>
</thead>

<tbody id="gamesTable"></tbody>

</table>

</div>

</div>

<script>

const FILES=[

"t20wc_2007_FULL.json",
"t20wc_2008_FULL.json",
"t20wc_2009_FULL.json",
"t20wc_2010_FULL.json",
"t20wc_2012_FULL.json",
"t20wc_2013_FULL.json",
"t20wc_2014_FULL.json",
"t20wc_2015_FULL.json",
"t20wc_2016_FULL.json",
"t20wc_2019_FULL.json",
"t20wc_2021_FULL.json",
"t20wc_2022_FULL.json",
"t20wc_2024_FULL.json"

];

const BASE="data/t20-world-cup/matches/";

let playerMap={};
let reverseMap={};

const params=new URLSearchParams(location.search);

const full=params.get("name");

document.getElementById("playerName").textContent=full;


function ballsToOvers(b){

return Math.floor(b/6)+"."+(b%6);

}


async function init(){

playerMap=await fetch("data/players-name.json")
.then(r=>r.json());

Object.entries(playerMap).forEach(([short,long])=>{
reverseMap[long.toLowerCase()]=short;
});

const short=reverseMap[full.toLowerCase()]||full;

let batRuns=0;
let batBalls=0;
let batMatches=0;

let bowlBalls=0;
let bowlRuns=0;
let bowlWkts=0;

const table=document.getElementById("gamesTable");

for(const file of FILES){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{

const opponent=match.info.teams.find(t=>!match.info.teams.includes(full));

let mRuns=0;
let mBalls=0;

let mBowlBalls=0;
let mBowlRuns=0;
let mBowlWkts=0;

match.innings.forEach(inn=>{

inn.overs.forEach(o=>{

o.deliveries.forEach(d=>{

if(d.batter===short){

mRuns+=d.runs.batter;

if(!d.extras?.wides)
mBalls++;

}

if(d.bowler===short){

if(!d.extras?.wides && !d.extras?.noballs)
mBowlBalls++;

mBowlRuns+=d.runs.total;

}

d.wickets?.forEach(w=>{

if(w.bowler===short)
mBowlWkts++;

});

});

});

});

if(mRuns||mBowlBalls){

batRuns+=mRuns;
batBalls+=mBalls;

bowlBalls+=mBowlBalls;
bowlRuns+=mBowlRuns;
bowlWkts+=mBowlWkts;

batMatches++;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${match.info.dates[0]}</td>

<td>${match.info.teams.join(" vs ")}</td>

<td>${mRuns}</td>

<td>${mBalls}</td>

<td>${mBalls?((mRuns/mBalls)*100).toFixed(1):"-"}</td>

<td>${ballsToOvers(mBowlBalls)}</td>

<td>${mBowlRuns}</td>

<td>${mBowlWkts}</td>

<td>${mBowlBalls?(mBowlRuns/(mBowlBalls/6)).toFixed(2):"-"}</td>

`;

table.appendChild(tr);

}

});

}

document.getElementById("careerStats").innerHTML=`

<div class="stat">
<h3>${batMatches}</h3>
<span>Matches</span>
</div>

<div class="stat">
<h3>${batRuns}</h3>
<span>Runs</span>
</div>

<div class="stat">
<h3>${batBalls?((batRuns/batBalls)*100).toFixed(1):"-"}</h3>
<span>Strike Rate</span>
</div>

<div class="stat">
<h3>${bowlWkts}</h3>
<span>Wickets</span>
</div>

<div class="stat">
<h3>${ballsToOvers(bowlBalls)}</h3>
<span>Overs</span>
</div>

<div class="stat">
<h3>${bowlBalls?(bowlRuns/(bowlBalls/6)).toFixed(2):"-"}</h3>
<span>Economy</span>
</div>

`;

}

init();

</script>

</body>
</html>
