<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f6f7f9;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:40px;
  border-radius:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
  margin-top:20px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.table-wrap{
  margin-top:30px;
  background:white;
  border-radius:12px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

th{
  background:#f1f4f8;
}

tr:nth-child(even){
  background:#eaf3ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading...</h1>
</div>

<div class="stats" id="careerStats"></div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Date</th>
<th>Team</th>
<th>Opponent</th>
<th>Runs</th>
<th>Balls</th>
<th>SR</th>
<th>Overs</th>
<th>Runs</th>
<th>Wkts</th>
<th>Econ</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

</div>

</div>

<script>

const INDEX="data/t20-world-cup/index.json";
const BASE="data/t20-world-cup/matches/";
const PLAYER_MAP_FILE="data/players-name.json";

let playerMap={};
let reverseMap={};

const params=new URLSearchParams(location.search);

const fullName=params.get("name");

document.getElementById("playerName").textContent=fullName;


init();


async function init(){

/* LOAD PLAYER MAP */

playerMap=await fetch(PLAYER_MAP_FILE).then(r=>r.json());

Object.entries(playerMap).forEach(([short,long])=>{
reverseMap[long.toLowerCase()]=short;
});

/* Determine both versions */

const shortName=reverseMap[fullName.toLowerCase()] || fullName;
const shortLower=shortName.toLowerCase();
const fullLower=fullName.toLowerCase();


/* LOAD FILE LIST */

const files=await fetch(INDEX).then(r=>r.json());

let totalRuns=0;
let totalBalls=0;
let totalWkts=0;
let totalBowlBalls=0;
let totalBowlRuns=0;
let matches=0;


for(const file of files){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{

let batRuns=0;
let batBalls=0;
let bowlBalls=0;
let bowlRuns=0;
let bowlWkts=0;
let played=false;

match.innings.forEach(inn=>{

const team=inn.team;
const opponent=match.info.teams.find(t=>t!==team);

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

const batter=d.batter?.toLowerCase();
const bowler=d.bowler?.toLowerCase();

const isWide=d.extras?.wides;
const isNoBall=d.extras?.noballs;

/* BAT */

if(batter===shortLower || batter===fullLower){

played=true;

batRuns+=d.runs.batter;

if(!isWide)
batBalls++;

}

/* BOWL */

if(bowler===shortLower || bowler===fullLower){

played=true;

if(!isWide && !isNoBall)
bowlBalls++;

bowlRuns+=d.runs.total;

}

/* WICKETS */

d.wickets?.forEach(w=>{

if(w.bowler?.toLowerCase()===shortLower ||
   w.bowler?.toLowerCase()===fullLower){

bowlWkts++;

}

});

});

});

});

if(played){

matches++;

totalRuns+=batRuns;
totalBalls+=batBalls;

totalWkts+=bowlWkts;
totalBowlBalls+=bowlBalls;
totalBowlRuns+=bowlRuns;

addRow(match,batRuns,batBalls,bowlBalls,bowlRuns,bowlWkts);

}

});

}

renderCareer();

}


function ballsToOvers(b){

return Math.floor(b/6)+"."+(b%6);

}


function addRow(match,runs,balls,bowlBalls,bowlRuns,wkts){

const tr=document.createElement("tr");

const teams=match.info.teams;

tr.innerHTML=`

<td>${match.info.dates[0]}</td>

<td>${teams[0]}</td>

<td>${teams[1]}</td>

<td>${runs}</td>

<td>${balls}</td>

<td>${balls?((runs/balls)*100).toFixed(1):"-"}</td>

<td>${ballsToOvers(bowlBalls)}</td>

<td>${bowlRuns}</td>

<td>${wkts}</td>

<td>${bowlBalls?(bowlRuns/(bowlBalls/6)).toFixed(2):"-"}</td>

`;

tbody.appendChild(tr);

}


function renderCareer(){

careerStats.innerHTML=`

<div class="stat">
<h3>${matches}</h3>
<span>Matches</span>
</div>

<div class="stat">
<h3>${totalRuns}</h3>
<span>Runs</span>
</div>

<div class="stat">
<h3>${totalBalls?((totalRuns/totalBalls)*100).toFixed(1):"-"}</h3>
<span>Strike Rate</span>
</div>

<div class="stat">
<h3>${totalWkts}</h3>
<span>Wickets</span>
</div>

<div class="stat">
<h3>${ballsToOvers(totalBowlBalls)}</h3>
<span>Overs</span>
</div>

<div class="stat">
<h3>${totalBowlBalls?(totalBowlRuns/(totalBowlBalls/6)).toFixed(2):"-"}</h3>
<span>Economy</span>
</div>

`;

}

</script>

</body>
</html>
