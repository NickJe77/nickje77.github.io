<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f6f7f9;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:40px;
  border-radius:20px;
}

.controls{
  margin:20px 0;
}

select,button{
  padding:10px;
  margin-right:10px;
}

button.active{
  background:#6a040f;
  color:white;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
  margin-top:20px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.table-wrap{
  margin-top:30px;
  background:white;
  border-radius:12px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

th{
  background:#f1f4f8;
}

tr:nth-child(even){
  background:#eaf3ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading...</h1>
<p>T20 World Cup career statistics</p>
</div>

<div class="controls">

<select id="oppSelect"></select>

<button id="batBtn">Batting</button>
<button id="bowlBtn">Bowling</button>

</div>

<div class="stats" id="careerStats"></div>

<div class="table-wrap">

<table>

<thead id="thead"></thead>

<tbody id="tbody"></tbody>

</table>

</div>

</div>

<script>

const INDEX="data/t20-world-cup/index.json";
const BASE="data/t20-world-cup/matches/";
const PLAYER_MAP_FILE="data/players-name.json";

let playerMap={};
let reverseMap={};

let batting=[];
let bowling=[];

let tab="bat";

const params=new URLSearchParams(location.search);

const fullName=params.get("name");

document.getElementById("playerName").textContent=fullName;


init();


async function init(){

playerMap=await fetch(PLAYER_MAP_FILE).then(r=>r.json());

Object.entries(playerMap).forEach(([short,long])=>{
reverseMap[long.toLowerCase()]=short;
});

const short=reverseMap[fullName.toLowerCase()]||fullName;

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{

const opponent=match.info.teams.find(t=>t!==match.info.teams[0]);

let batRuns=0,batBalls=0,out="not out",batted=false;
let bowlBalls=0,bowlRuns=0,bowlWkts=0;

match.innings.forEach(inn=>{

const opp=match.info.teams.find(t=>t!==inn.team);

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

const isWide=d.extras?.wides;
const isNoBall=d.extras?.noballs;

if(d.batter===short){

batted=true;

batRuns+=d.runs.batter;

if(!isWide) batBalls++;

}

if(d.bowler===short){

if(!isWide && !isNoBall) bowlBalls++;

bowlRuns+=d.runs.total;

}

d.wickets?.forEach(w=>{

if(w.player_out===short)
out=w.kind;

if(w.bowler===short)
bowlWkts++;

});

});

});

if(batted){

batting.push({

date:match.info.dates[0],
opp:opp,
runs:batRuns,
balls:batBalls,
sr:batBalls?((batRuns/batBalls)*100).toFixed(1):"-",
out:out

});

}

if(bowlBalls){

bowling.push({

date:match.info.dates[0],
opp:opp,
balls:bowlBalls,
runs:bowlRuns,
wkts:bowlWkts,
overs:ballsToOvers(bowlBalls),
econ:(bowlRuns/(bowlBalls/6)).toFixed(2)

});

}

});

});

}

buildOpponentList();

render();

}


function ballsToOvers(b){

return Math.floor(b/6)+"."+(b%6);

}


function buildOpponentList(){

const set=new Set();

[...batting,...bowling].forEach(g=>set.add(g.opp));

const sel=document.getElementById("oppSelect");

sel.innerHTML="<option>All</option>";

[...set].sort().forEach(o=>{

const opt=document.createElement("option");
opt.value=o;
opt.textContent=o;

sel.appendChild(opt);

});

sel.onchange=render;

}


batBtn.onclick=()=>{

tab="bat";
batBtn.classList.add("active");
bowlBtn.classList.remove("active");

render();

};

bowlBtn.onclick=()=>{

tab="bowl";
bowlBtn.classList.add("active");
batBtn.classList.remove("active");

render();

};


function render(){

const opp=oppSelect.value;

const list=(tab==="bat"?batting:bowling)
.filter(g=>opp==="All"||g.opp===opp);

renderStats(list);

renderTable(list);

}


function renderStats(list){

let html="";

if(tab==="bat"){

const runs=list.reduce((a,b)=>a+b.runs,0);
const balls=list.reduce((a,b)=>a+b.balls,0);
const outs=list.filter(g=>g.out!=="not out").length;

html=`

<div class="stat"><h3>${list.length}</h3><span>Matches</span></div>
<div class="stat"><h3>${runs}</h3><span>Runs</span></div>
<div class="stat"><h3>${outs?(runs/outs).toFixed(2):"-"}</h3><span>Average</span></div>
<div class="stat"><h3>${balls?((runs/balls)*100).toFixed(1):"-"}</h3><span>Strike Rate</span></div>

`;

}else{

const balls=list.reduce((a,b)=>a+b.balls,0);
const runs=list.reduce((a,b)=>a+b.runs,0);
const wkts=list.reduce((a,b)=>a+b.wkts,0);

html=`

<div class="stat"><h3>${list.length}</h3><span>Matches</span></div>
<div class="stat"><h3>${ballsToOvers(balls)}</h3><span>Overs</span></div>
<div class="stat"><h3>${wkts}</h3><span>Wickets</span></div>
<div class="stat"><h3>${wkts?(runs/wkts).toFixed(2):"-"}</h3><span>Average</span></div>
<div class="stat"><h3>${balls?(runs/(balls/6)).toFixed(2):"-"}</h3><span>Economy</span></div>

`;

}

careerStats.innerHTML=html;

}


function renderTable(list){

const thead=document.getElementById("thead");
const tbody=document.getElementById("tbody");

thead.innerHTML="";
tbody.innerHTML="";

if(tab==="bat"){

thead.innerHTML=`
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Runs</th>
<th>Balls</th>
<th>SR</th>
<th>Dismissal</th>
</tr>`;

list.forEach(g=>{

tbody.innerHTML+=`
<tr>
<td>${g.date}</td>
<td>${g.opp}</td>
<td>${g.runs}</td>
<td>${g.balls}</td>
<td>${g.sr}</td>
<td>${g.out}</td>
</tr>`;

});

}else{

thead.innerHTML=`
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Overs</th>
<th>Runs</th>
<th>Wkts</th>
<th>Econ</th>
</tr>`;

list.forEach(g=>{

tbody.innerHTML+=`
<tr>
<td>${g.date}</td>
<td>${g.opp}</td>
<td>${g.overs}</td>
<td>${g.runs}</td>
<td>${g.wkts}</td>
<td>${g.econ}</td>
</tr>`;

});

}

}

</script>

</body>
</html>
