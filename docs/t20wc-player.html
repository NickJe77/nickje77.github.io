<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f6f7f9;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:40px;
  border-radius:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
  margin-top:20px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:14px;
  text-align:center;
}

.table-wrap{
  margin-top:30px;
  background:white;
  border-radius:14px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

th{
  background:#f1f4f8;
}

tr:nth-child(even){
  background:#eaf3ff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading player…</h1>
</div>

<div class="stats" id="careerStats"></div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Date</th>
  <th>Match</th>
  <th>Runs</th>
  <th>Balls</th>
  <th>SR</th>
  <th>Overs</th>
  <th>Runs</th>
  <th>Wkts</th>
  <th>Econ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>
/* EVERYTHING LIVES HERE */
const BASE = "/docs/data/t20-world-cup/matches/";

const params = new URLSearchParams(location.search);
const fullName = params.get("name");

document.getElementById("playerName").textContent = fullName;

let shortName = fullName;

let matches = 0;
let batRuns = 0;
let batBalls = 0;
let bowlBalls = 0;
let bowlRuns = 0;
let bowlWkts = 0;

init();

async function init(){

  /* LOAD PLAYER NAME MAP (SAME FOLDER) */
  const nameMap = await fetch(BASE + "players-name.json").then(r=>r.json());

  for(const short in nameMap){
    if(nameMap[short].toLowerCase() === fullName.toLowerCase()){
      shortName = short;
      break;
    }
  }

  /* LOAD INDEX */
  const files = await fetch(BASE + "index.json").then(r=>r.json());

  for(const file of files){
    const matchesData = await fetch(BASE + file).then(r=>r.json());
    matchesData.forEach(processMatch);
  }

  renderCareer();
}

function processMatch(match){

  let r = 0, b = 0;
  let bb = 0, br = 0, bw = 0;
  let played = false;

  match.innings.forEach(inn=>{
    inn.overs.forEach(over=>{
      over.deliveries.forEach(d=>{

        const isWide = d.extras?.wides;
        const isNoBall = d.extras?.noballs;

        if(d.batter === shortName){
          played = true;
          r += d.runs.batter;
          if(!isWide) b++;
        }

        if(d.bowler === shortName){
          played = true;
          if(!isWide && !isNoBall) bb++;
          br += d.runs.total;
        }

        d.wickets?.forEach(w=>{
          if(w.bowler === shortName) bw++;
        });

      });
    });
  });

  if(played){
    matches++;
    batRuns += r;
    batBalls += b;
    bowlBalls += bb;
    bowlRuns += br;
    bowlWkts += bw;
    addRow(match, r, b, bb, br, bw);
  }
}

function addRow(match,r,b,bb,br,bw){
  tbody.innerHTML += `
  <tr>
    <td>${match.info.dates[0]}</td>
    <td>${match.info.teams.join(" vs ")}</td>
    <td>${r}</td>
    <td>${b}</td>
    <td>${b?((r/b)*100).toFixed(1):"-"}</td>
    <td>${overs(bb)}</td>
    <td>${br}</td>
    <td>${bw}</td>
    <td>${bb?(br/(bb/6)).toFixed(2):"-"}</td>
  </tr>`;
}

function renderCareer(){
  careerStats.innerHTML = `
  <div class="stat"><h3>${matches}</h3><span>Matches</span></div>
  <div class="stat"><h3>${batRuns}</h3><span>Runs</span></div>
  <div class="stat"><h3>${batBalls?((batRuns/batBalls)*100).toFixed(1):"-"}</h3><span>Strike Rate</span></div>
  <div class="stat"><h3>${bowlWkts}</h3><span>Wickets</span></div>
  <div class="stat"><h3>${overs(bowlBalls)}</h3><span>Overs</span></div>
  <div class="stat"><h3>${bowlBalls?(bowlRuns/(bowlBalls/6)).toFixed(2):"-"}</h3><span>Economy</span></div>
  `;
}

function overs(b){ return Math.floor(b/6)+"."+(b%6); }
</script>

</body>
</html>
