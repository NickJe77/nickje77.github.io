<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA League Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:20px;}

.controls{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.controls select, .controls button{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  background:#f5f5f5;
  cursor:pointer;
  font-size:14px;
}
.controls button.active{
  background:#222;
  color:white;
  border-color:#222;
}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<h1>NBA League Leaders</h1>
<p>Top 10 statistical leaders by season (1976–77 to present).</p>

<div class="controls">
  <select id="seasonSelect"></select>
  <button data-stat="points" class="active">Points</button>
  <button data-stat="rebounds">Rebounds</button>
  <button data-stat="assists">Assists</button>
  <button data-stat="steals">Steals</button>
  <button data-stat="blocks">Blocks</button>
</div>

<table>
  <thead>
    <tr>
      <th>Rank</th>
      <th>Player</th>
      <th>Team</th>
      <th id="statHeader">Value</th>
    </tr>
  </thead>
  <tbody id="leaderTable"></tbody>
</table>

</div>

<script>
let leadersData = [];
let currentStat = "points";

const seasonSelect = document.getElementById("seasonSelect");
const tableBody = document.getElementById("leaderTable");
const statHeader = document.getElementById("statHeader");
const buttons = document.querySelectorAll(".controls button");

fetch("data/nba/leaders.json")
  .then(r => r.json())
  .then(data => {
    leadersData = data;

    data.forEach((s, i) => {
      const opt = document.createElement("option");
      opt.value = s.season;
      opt.textContent = s.season;
      if(i === data.length - 1) opt.selected = true;
      seasonSelect.appendChild(opt);
    });

    renderTable();
  });

seasonSelect.addEventListener("change", renderTable);

buttons.forEach(btn => {
  btn.addEventListener("click", () => {
    buttons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentStat = btn.dataset.stat;
    renderTable();
  });
});

function renderTable(){
  const season = seasonSelect.value;
  const seasonData = leadersData.find(s => s.season === season);

  tableBody.innerHTML = "";

  if(!seasonData || !seasonData[currentStat]){
    tableBody.innerHTML = "<tr><td colspan='4'>No data available.</td></tr>";
    return;
  }

  statHeader.textContent = currentStat.charAt(0).toUpperCase() + currentStat.slice(1);

  seasonData[currentStat].slice(0,10).forEach((row, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i+1}</td>
      <td>${row.player}</td>
      <td>${row.team || ""}</td>
      <td>${row.value}</td>
    `;
    tableBody.appendChild(tr);
  });
}
</script>

</body>
</html>
