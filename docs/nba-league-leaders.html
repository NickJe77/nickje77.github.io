<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA League Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1100px;margin:0 auto;padding:30px 20px;}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.controls select,.controls button,input{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}
.controls button.active{background:#222;color:white;}

table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}

.player-link{color:#0056d6;text-decoration:none;font-weight:600;}
.player-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">
<h1>NBA League Leaders</h1>

<div class="controls">
<select id="seasonSelect"></select>
<input type="text" id="playerSearch" placeholder="Search player…">
<button data-stat="points" class="active">Points</button>
<button data-stat="rebounds">Rebounds</button>
<button data-stat="assists">Assists</button>
<button data-stat="steals">Steals</button>
<button data-stat="blocks">Blocks</button>
</div>

<table>
<thead>
<tr><th>#</th><th>Player</th><th>Team</th><th id="statHeader">Value</th></tr>
</thead>
<tbody id="leaderTable"></tbody>
</table>
</div>

<script>
let leadersData=[],currentStat="points";
const seasonSelect=document.getElementById("seasonSelect");
const tableBody=document.getElementById("leaderTable");
const statHeader=document.getElementById("statHeader");
const buttons=document.querySelectorAll("button");
const searchInput=document.getElementById("playerSearch");

fetch("data/nba/leaders.json").then(r=>r.json()).then(data=>{
leadersData=data;
data.forEach((s,i)=>{
let o=document.createElement("option");
o.value=s.season;o.textContent=s.season;
if(i===data.length-1)o.selected=true;
seasonSelect.appendChild(o);
});
render();
});

seasonSelect.onchange=render;
searchInput.oninput=render;
buttons.forEach(b=>b.onclick=()=>{
buttons.forEach(x=>x.classList.remove("active"));
b.classList.add("active");
currentStat=b.dataset.stat;
render();
});

function render(){
const season=seasonSelect.value;
const filter=searchInput.value.toLowerCase();
const seasonData=leadersData.find(s=>s.season===season);
tableBody.innerHTML="";
if(!seasonData)return;
statHeader.textContent=currentStat.toUpperCase();
seasonData[currentStat].filter(r=>r.player.toLowerCase().includes(filter)).slice(0,10).forEach((r,i)=>{
const tr=document.createElement("tr");
tr.innerHTML=`<td>${i+1}</td>
<td><a class="player-link" href="nba-player.html?player=${encodeURIComponent(r.player)}">${r.player}</a></td>
<td>${r.team||""}</td>
<td>${r.value}</td>`;
tableBody.appendChild(tr);
});
}
</script>
</body>
</html>
