<!DOCTYPE html>
<html>
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Game</title>
<style>
body{font-family:system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:22px;padding:14px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:17px;}
.navbar a:hover{text-decoration:underline;}
.page{max-width:1200px;margin:auto;padding:25px;}
h1{text-align:center;margin-bottom:6px;}
.meta{text-align:center;color:#555;margin-bottom:12px;}
.final-score{text-align:center;font-size:22px;font-weight:700;margin-bottom:10px;}
.qtr-scores{text-align:center;margin-bottom:20px;font-size:14px;color:#333;}
.qtr-scores table{margin:0 auto;border-collapse:collapse;}
.qtr-scores th,.qtr-scores td{padding:5px 14px;border:1px solid #ddd;text-align:center;}
.qtr-scores th{background:#f3f6fb;font-weight:600;}
.qtr-scores td.team-name{text-align:left;font-weight:600;}
.teams-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:800px){.teams-wrap{grid-template-columns:1fr;}}
.team-box{background:#fff;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.08);overflow:hidden;}
.team-header{padding:12px;text-align:center;font-weight:700;font-size:18px;}
.team-stripe{height:16px;margin:0 12px 12px;border-radius:6px;border:1px solid #ccc;}
.brownlow{padding:6px 12px 12px;font-size:13px;color:#555;text-align:center;min-height:22px;}
.brownlow strong{color:#333;}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #ddd;padding:6px 8px;text-align:center;font-size:14px;}
th{background:#f3f6fb;cursor:pointer;user-select:none;}
td.left{text-align:left;font-weight:600;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#e8f0ff;}
.sort-indicator{font-size:11px;margin-left:4px;}
</style>
</head>
<body>
<div class="navbar">
<a href="index.html">Home</a>
<a href="afl.html">AFL</a>
</div>
<div class="page">
<h1 id="title"></h1>
<div class="meta" id="venueLine"></div>
<div class="final-score" id="finalScore"></div>
<div class="qtr-scores">
  <table id="qtrTable">
    <thead>
      <tr><th>Team</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Total</th></tr>
    </thead>
    <tbody id="qtrRows"></tbody>
  </table>
</div>
<div class="teams-wrap">
<div class="team-box">
<div class="team-header" id="teamAName"></div>
<div class="team-stripe" id="teamAStripe"></div>
<div class="brownlow" id="teamABrownlow"></div>
<table id="teamATable">
<thead><tr>
<th data-col="player">Player</th>
<th data-col="K">K</th><th data-col="HB">H</th><th data-col="D">D</th>
<th data-col="G">G</th><th data-col="B">B</th>
</tr></thead>
<tbody id="teamARows"></tbody>
</table>
</div>
<div class="team-box">
<div class="team-header" id="teamBName"></div>
<div class="team-stripe" id="teamBStripe"></div>
<div class="brownlow" id="teamBBrownlow"></div>
<table id="teamBTable">
<thead><tr>
<th data-col="player">Player</th>
<th data-col="K">K</th><th data-col="HB">H</th><th data-col="D">D</th>
<th data-col="G">G</th><th data-col="B">B</th>
</tr></thead>
<tbody id="teamBRows"></tbody>
</table>
</div>
</div>
</div>

<script>
// Must match afl.html exactly
const TEAM_ALIASES = {
  "Brisbane":               "Brisbane Lions",
  "GWS":                    "GWS GIANTS",
  "Greater Western Sydney": "GWS GIANTS",
  "Footscray":              "Western Bulldogs",
  "West Coast":             "West Coast Eagles",
  "Gold Coast":             "Gold Coast SUNS",
  "Sydney":                 "Sydney Swans",
  "Kangaroos":              "North Melbourne",
};

function normaliseTeam(name) {
  return TEAM_ALIASES[(name || "").trim()] ?? (name || "").trim();
}

function canonicalRound(r){
  const t=(r??"").toLowerCase();
  if(t.includes("elimination")) return "Elimination Final";
  if(t.includes("qualifying"))  return "Qualifying Final";
  if(t.includes("semi"))        return "Semi Final";
  if(t.includes("preliminary")) return "Preliminary Final";
  if(t.includes("grand"))       return "Grand Final";
  return (r??"").trim();
}

const teamStripes={
  "Carlton":           "repeating-linear-gradient(90deg,#001A3D 0 24px,#ffffff 24px 48px,#001A3D 48px 72px)",
  "Collingwood":       "repeating-linear-gradient(90deg,#000000 0 24px,#ffffff 24px 48px,#000000 48px 72px)",
  "Richmond":          "repeating-linear-gradient(90deg,#FFD200 0 24px,#000 24px 48px,#FFD200 48px 72px)",
  "Essendon":          "repeating-linear-gradient(90deg,#CC2031 0 24px,#000 24px 48px,#CC2031 48px 72px)",
  "Geelong Cats":      "repeating-linear-gradient(90deg,#1C3C63 0 24px,#ffffff 24px 48px,#1C3C63 48px 72px)",
  "Sydney Swans":      "repeating-linear-gradient(90deg,#ED171F 0 24px,#ffffff 24px 48px,#ED171F 48px 72px)",
  "West Coast Eagles": "repeating-linear-gradient(90deg,#002B5C 0 24px,#FFD200 24px 48px,#002B5C 48px 72px)",
  "Adelaide Crows":    "repeating-linear-gradient(90deg,#002B5C 0 24px,#FFD200 24px 48px,#CC2031 48px 72px)",
  "Port Adelaide":     "repeating-linear-gradient(90deg,#1C1C1C 0 24px,#00B2A9 24px 48px,#ffffff 48px 72px)",
  "Brisbane Lions":    "repeating-linear-gradient(90deg,#7C003E 0 24px,#FFD200 24px 48px,#005BAC 48px 72px)",
  "Hawthorn":          "repeating-linear-gradient(90deg,#4D2004 0 24px,#FFD200 24px 48px,#4D2004 48px 72px)",
  "Melbourne":         "repeating-linear-gradient(90deg,#002B5C 0 24px,#ED171F 24px 48px,#002B5C 48px 72px)",
  "Western Bulldogs":  "repeating-linear-gradient(90deg,#1E3A8A 0 24px,#ED171F 24px 48px,#ffffff 48px 72px)",
  "Gold Coast SUNS":   "repeating-linear-gradient(90deg,#B90A32 0 24px,#FFD200 24px 48px,#B90A32 48px 72px)",
  "GWS GIANTS":        "repeating-linear-gradient(90deg,#F47920 0 24px,#000 24px 48px,#ffffff 48px 72px)",
  "St Kilda":          "repeating-linear-gradient(90deg,#000 0 24px,#ED171F 24px 48px,#ffffff 48px 72px)",
  "Fremantle":         "repeating-linear-gradient(90deg,#2B004F 0 24px,#ffffff 24px 48px,#2B004F 48px 72px)",
  "North Melbourne":   "repeating-linear-gradient(90deg,#0A2E8A 0 24px,#ffffff 24px 48px,#0A2E8A 48px 72px)",
  "Geelong":           "repeating-linear-gradient(90deg,#1C3C63 0 24px,#ffffff 24px 48px,#1C3C63 48px 72px)",
  "Adelaide":          "repeating-linear-gradient(90deg,#002B5C 0 24px,#FFD200 24px 48px,#CC2031 48px 72px)",
};

const params     = new URLSearchParams(location.search);
const yearParam  = params.get("year");
const homeParam  = normaliseTeam(params.get("home"));
const awayParam  = normaliseTeam(params.get("away"));
const roundParam = canonicalRound(params.get("round"));

async function loadGame(){
  if(!yearParam || !homeParam || !awayParam || !roundParam){
    document.getElementById("title").textContent = "Game not found";
    return;
  }
  try{
    const res  = await fetch(`/data/afl/afl_${yearParam}.json`);
    if(!res.ok){ document.getElementById("title").textContent = "Data not found"; return; }
    const data = await res.json();

    // Normalise the raw data's team names and round before comparing
    const game = data.filter(x =>
      normaliseTeam(x.home_team) === homeParam &&
      normaliseTeam(x.away_team) === awayParam &&
      canonicalRound(x.round)    === roundParam
    );

    if(game.length){
      buildGame(yearParam, game);
    } else {
      document.getElementById("title").textContent = "Game not found";
      document.getElementById("venueLine").textContent =
        `${roundParam}: ${homeParam} vs ${awayParam} (${yearParam})`;
    }
  }catch(e){
    console.error(e);
    document.getElementById("title").textContent = "Error loading game data";
  }
}

function formatQtr(val){
  if(!val && val!==0) return "-";
  const s=String(val), parts=s.split(".");
  const g=parseInt(parts[0]||0), b=parseInt(parts[1]||0);
  return `${g}.${b} (${g*6+b})`;
}

function buildGame(season, game){
  const info  = game[0];
  const teamA = normaliseTeam(info.home_team);
  const teamB = normaliseTeam(info.away_team);

  const teamAPlayers = game.filter(p => normaliseTeam(p.played_for) === teamA);
  const teamBPlayers = game.filter(p => normaliseTeam(p.played_for) === teamB);

  const teamAQ = {q1:info.home_q1, q2:info.home_q2, q3:info.home_q3, q4:info.home_q4, total:info.home_points};
  const teamBQ = {q1:info.away_q1, q2:info.away_q2, q3:info.away_q3, q4:info.away_q4, total:info.away_points};

  document.getElementById("title").textContent = `${season} – ${canonicalRound(info.round)}: ${teamA} vs ${teamB}`;
  const att = info.crowd ? ` · Attendance: ${Number(info.crowd).toLocaleString()}` : "";
  document.getElementById("venueLine").textContent = `${info.venue}${att} · ${info.date}`;

  const winner = +teamAQ.total > +teamBQ.total ? teamA
               : +teamBQ.total > +teamAQ.total ? teamB
               : null;
  document.getElementById("finalScore").textContent =
    `${teamA} ${teamAQ.total} – ${teamBQ.total} ${teamB}${winner ? ` (${winner} won)` : " (Draw)"}`;

  document.getElementById("qtrRows").innerHTML = `
    <tr>
      <td class="team-name">${teamA}</td>
      <td>${formatQtr(teamAQ.q1)}</td><td>${formatQtr(teamAQ.q2)}</td>
      <td>${formatQtr(teamAQ.q3)}</td><td>${formatQtr(teamAQ.q4)}</td>
      <td><strong>${teamAQ.total}</strong></td>
    </tr>
    <tr>
      <td class="team-name">${teamB}</td>
      <td>${formatQtr(teamBQ.q1)}</td><td>${formatQtr(teamBQ.q2)}</td>
      <td>${formatQtr(teamBQ.q3)}</td><td>${formatQtr(teamBQ.q4)}</td>
      <td><strong>${teamBQ.total}</strong></td>
    </tr>`;

  document.getElementById("teamAName").textContent = teamA;
  document.getElementById("teamBName").textContent = teamB;
  document.getElementById("teamAStripe").style.background = teamStripes[teamA] || "#999";
  document.getElementById("teamBStripe").style.background = teamStripes[teamB] || "#999";

  function brownlowText(players){
    const voted = players.filter(p => +p.BR > 0).sort((a,b) => +b.BR - +a.BR);
    if(!voted.length) return "";
    return "<strong>Brownlow Votes:</strong> " + voted.map(p => `${p.BR}: ${p.player}`).join(", ");
  }
  document.getElementById("teamABrownlow").innerHTML = brownlowText(teamAPlayers);
  document.getElementById("teamBBrownlow").innerHTML = brownlowText(teamBPlayers);

  renderTable("teamARows", teamAPlayers, "teamATable");
  renderTable("teamBRows", teamBPlayers, "teamBTable");
}

function renderTable(tbodyId, players, tableId){
  players.sort((a,b) => (+b.D||0) - (+a.D||0));
  const tbody = document.getElementById(tbodyId);
  tbody.innerHTML = "";
  players.forEach(p=>{
    const tr = document.createElement("tr");
    tr.onclick = () => location.href = `afl-player.html?name=${encodeURIComponent(p.player)}`;
    tr.innerHTML = `
      <td class="left">${p.player}</td>
      <td>${p.K||0}</td><td>${p.HB||0}</td><td>${p.D||0}</td>
      <td>${p.G||0}</td><td>${p.B||0}</td>`;
    tbody.appendChild(tr);
  });
  enableSorting(tableId, players);
}

function enableSorting(tableId, players){
  const table   = document.getElementById(tableId);
  const headers = table.querySelectorAll("th");
  let sortState = {};
  headers.forEach(th=>{
    th.onclick = () => {
      const col = th.dataset.col;
      if(!col) return;
      const asc = sortState[col] === true;
      sortState = {};
      sortState[col] = !asc;
      players.sort((a,b)=>{
        if(col==="player") return asc ? a.player.localeCompare(b.player) : b.player.localeCompare(a.player);
        return asc ? (+a[col]||0)-(+b[col]||0) : (+b[col]||0)-(+a[col]||0);
      });
      headers.forEach(h => h.querySelector(".sort-indicator")?.remove());
      const ind = document.createElement("span");
      ind.className = "sort-indicator";
      ind.textContent = !asc ? "▼" : "▲";
      th.appendChild(ind);
      renderTable(table.querySelector("tbody").id, players, tableId);
    };
  });
}

loadGame();
</script>
</body>
</html>
