<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:36px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,5vw,38px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;
}
.stat{
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  text-align:center;background:var(--surface);
}
.stat h3{
  margin:0 0 6px;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
}
.stat div{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);}

.controls{display:flex;justify-content:center;margin-bottom:18px;}
.controls input{
  padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink);width:280px;max-width:100%;
}
.controls input:hover{border-color:var(--faint);}
.controls input:focus{outline:none;border-color:var(--accent);}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:center;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>

  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
  <a href="f1-drivers.html">Drivers</a>
</div>

<div class="page-wrap">

<div class="hero">
  <span class="eyebrow">Formula 1</span>
  <h1 id="driverName">Driver</h1>
</div>

<div class="stats">
  <div class="stat"><h3>Races</h3><div id="totalRaces">0</div></div>
  <div class="stat"><h3>Wins</h3><div id="totalWins">0</div></div>
  <div class="stat"><h3>Championships</h3><div id="totalTitles">0</div></div>
  <div class="stat"><h3>Poles</h3><div id="totalPoles">0</div></div>
  <div class="stat"><h3>Points</h3><div id="totalPoints">0</div></div>
</div>

<div class="controls">
  <input id="raceFilter" placeholder="Search race…">
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Season</th>
  <th>Race</th>
  <th>Grid</th>
  <th>Finish</th>
  <th>Points</th>
</tr>
</thead>
<tbody id="raceTable"></tbody>
</table>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);

function cleanDriver(name){
  return String(name||"").replace(/\s[A-Z]{3}$/,"").trim();
}

/* -------- COUNTRY + FLAGS -------- */

const COUNTRY_ALIASES = {
  "United States of America": "United States",
  "Great Britain": "United Kingdom",
  "People's Republic of China": "China",
  "United Arab Emirates": "UAE"
};

const FLAG_MAP = {
  "Australia":"🇦🇺","China":"🇨🇳","Japan":"🇯🇵","Bahrain":"🇧🇭","Saudi Arabia":"🇸🇦",
  "Qatar":"🇶🇦","United States":"🇺🇸","Mexico":"🇲🇽","Brazil":"🇧🇷","Monaco":"🇲🇨",
  "Spain":"🇪🇸","France":"🇫🇷","Italy":"🇮🇹","United Kingdom":"🇬🇧","Austria":"🇦🇹",
  "Hungary":"🇭🇺","Belgium":"🇧🇪","Netherlands":"🇳🇱","Singapore":"🇸🇬",
  "Azerbaijan":"🇦🇿","Canada":"🇨🇦","UAE":"🇦🇪"
};

const COUNTRY_PREFIXES = Array.from(
  new Set([...Object.keys(COUNTRY_ALIASES), ...Object.keys(FLAG_MAP)])
).sort((a,b)=> b.split(" ").length - a.split(" ").length);

function normalizeSpaces(s){
  return String(s||"")
    .replace(/[’‘]/g,"'")
    .replace(/\s+/g," ")
    .trim();
}

function dedupeFullPhrase(n){
  const words = n.split(" ");
  if(words.length >= 2 && words.length % 2 === 0){
    const half = words.length/2;
    const first = words.slice(0, half).join(" ");
    const second = words.slice(half).join(" ");
    if(first === second) return first;
  }
  return n;
}

function extractCountryFromRace(raw){
  let n = normalizeSpaces(String(raw||"").replace(/^Flag of\s+/,""));
  n = dedupeFullPhrase(n);

  if(n.startsWith("People")) return "China";

  let matched = "";
  for(const c of COUNTRY_PREFIXES){
    if(n === c || n.startsWith(c + " ")){
      matched = c;
      break;
    }
  }

  if(!matched){
    matched = n.split(" ")[0] || "";
  }

  return COUNTRY_ALIASES[matched] || matched;
}

function formatRaceWithFlag(raw){
  const country = extractCountryFromRace(raw);
  const flag = FLAG_MAP[country] || "";
  return flag ? `${country} ${flag}` : country;
}

/* -------- PAGE LOGIC -------- */

const driver = cleanDriver(decodeURIComponent(params.get("driver")||""));
document.getElementById("driverName").textContent = driver;

const startYear = 1950;
const endYear = new Date().getFullYear();

const totalRaces=document.getElementById("totalRaces");
const totalWins=document.getElementById("totalWins");
const totalTitles=document.getElementById("totalTitles");
const totalPoles=document.getElementById("totalPoles");
const totalPoints=document.getElementById("totalPoints");
const raceTable=document.getElementById("raceTable");
const raceFilter=document.getElementById("raceFilter");

let seasonsData=[];
let allRows=[];

async function loadAll(){
  for(let y=startYear;y<=endYear;y++){
    try{
      const r = await fetch(`data/f1/${y}.json`);
      if(!r.ok) continue;
      seasonsData.push(await r.json());
    }catch(e){}
  }
  build();
}

/* 🔥 FIXED CHAMPIONS (ONLY CHANGE) */
const F1_CHAMPIONS = {
  1988:"Ayrton Senna",1989:"Alain Prost",1990:"Ayrton Senna",
  1991:"Ayrton Senna",1992:"Nigel Mansell",1993:"Alain Prost",
  1994:"Michael Schumacher",1995:"Michael Schumacher",
  1996:"Damon Hill",1997:"Jacques Villeneuve",
  1998:"Mika Hakkinen",1999:"Mika Hakkinen",
  2000:"Michael Schumacher",2001:"Michael Schumacher",
  2002:"Michael Schumacher",2003:"Michael Schumacher",
  2004:"Michael Schumacher",2005:"Fernando Alonso",
  2006:"Fernando Alonso",2007:"Kimi Raikkonen",
  2008:"Lewis Hamilton",2009:"Jenson Button",
  2010:"Sebastian Vettel",2011:"Sebastian Vettel",
  2012:"Sebastian Vettel",2013:"Sebastian Vettel",
  2014:"Lewis Hamilton",2015:"Lewis Hamilton",
  2016:"Nico Rosberg",2017:"Lewis Hamilton",
  2018:"Lewis Hamilton",2019:"Lewis Hamilton",
  2020:"Lewis Hamilton",2021:"Max Verstappen",
  2022:"Max Verstappen",2023:"Max Verstappen",
  2024:"Max Verstappen",2025:"Lando Norris"
};

function getChampion(season){
  return F1_CHAMPIONS[Number(season.season)] || null;
}

function build(){
  let races=0,wins=0,poles=0,points=0;
  const titleSeasons=new Set();
  allRows=[];

  seasonsData.forEach(season=>{
    const champ=getChampion(season);

    (season.races||[]).forEach(race=>{
      const raceLabel = formatRaceWithFlag(race.grand_prix || "");

      (race.results||[]).forEach(r=>{
        const d=cleanDriver(r.driver);
        if(d!==driver) return;

        races++;
        if(Number(r.position)===1) wins++;
        if(Number(r.grid)===1) poles++;
        points += Number(r.points)||0;

        allRows.push({
          season:season.season,
          race:raceLabel,
          grid:r.grid,
          finish:r.position,
          points:r.points
        });
      });
    });

    if(champ===driver) titleSeasons.add(season.season);
  });

  totalRaces.textContent=races;
  totalWins.textContent=wins;
  totalPoles.textContent=poles;
  totalTitles.textContent=titleSeasons.size;
  totalPoints.textContent=points.toFixed(1);

  renderTable();
}

function renderTable(){
  const f=raceFilter.value.toLowerCase();
  raceTable.innerHTML="";

  allRows
    .filter(r=>r.race.toLowerCase().includes(f))
    .sort((a,b)=>b.season-a.season)
    .forEach(r=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${r.season}</td>
        <td>${r.race}</td>
        <td>${r.grid}</td>
        <td>${r.finish}</td>
        <td>${r.points}</td>
      `;
      raceTable.appendChild(tr);
    });
}

raceFilter.addEventListener("input", renderTable);
loadAll();
</script>

</body>
