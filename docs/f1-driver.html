<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Formula 1 Driver | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
}

.hero{width:100%;height:260px;overflow:hidden;}
.hero img{width:100%;height:100%;object-fit:cover;}

.navbar{
  display:flex;justify-content:center;gap:22px;
  padding:16px 0;border-bottom:1px solid #ddd;
  font-weight:600;background:#fff;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;margin-bottom:20px;}

.stat-boxes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:30px;
}
.stat{
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
  text-align:center;
  background:#f6f9ff;
}
.stat h3{margin:0 0 6px;font-size:14px;color:#555;}
.stat div{font-size:22px;font-weight:700;}

.year-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-bottom:20px;
}
.year-btn{
  padding:6px 12px;
  border-radius:10px;
  border:1px solid #ccc;
  background:#eee;
  cursor:pointer;
}
.year-btn.active{
  background:#222;
  color:#fff;
  border-color:#222;
}

table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:center;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
</style>
</head>

<body>

<div class="hero">
  <img src="images/f1-header.jpg" alt="Formula 1">
</div>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">
<h1 id="driverName">Driver</h1>

<div class="stat-boxes">
  <div class="stat"><h3>Races</h3><div id="totalRaces">—</div></div>
  <div class="stat"><h3>Wins</h3><div id="totalWins">—</div></div>
  <div class="stat"><h3>Championships</h3><div id="totalTitles">—</div></div>
  <div class="stat"><h3>Poles</h3><div id="totalPoles">—</div></div>
  <div class="stat"><h3>Wins from Pole</h3><div id="totalWinsFromPole">—</div></div>
  <div class="stat"><h3>Points</h3><div id="totalPoints">—</div></div>
</div>

<div class="year-grid" id="yearGrid"></div>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Team</th>
  <th>Wins</th>
  <th>Poles</th>
  <th>Wins from Pole</th>
  <th>Points</th>
</tr>
</thead>
<tbody id="seasonTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const driver = decodeURIComponent(params.get("driver") || "");

document.getElementById("driverName").textContent = driver;

const seasonTable = document.getElementById("seasonTable");
const yearGrid = document.getElementById("yearGrid");

const totalRaces = document.getElementById("totalRaces");
const totalWins = document.getElementById("totalWins");
const totalTitles = document.getElementById("totalTitles");
const totalPoles = document.getElementById("totalPoles");
const totalWinsFromPole = document.getElementById("totalWinsFromPole");
const totalPoints = document.getElementById("totalPoints");

const startYear = 1950;
const endYear = new Date().getFullYear();

let allData = [];
let currentYear = "all";

function cleanDriver(name){
  return String(name||"").replace(/\s[A-Z]{3}$/,"");
}

/* YEAR BUTTONS */
const allBtn=document.createElement("button");
allBtn.textContent="All Seasons";
allBtn.className="year-btn active";
allBtn.onclick=()=>selectYear("all");
yearGrid.appendChild(allBtn);

for(let y=startYear;y<=endYear;y++){
  const btn=document.createElement("button");
  btn.textContent=y;
  btn.className="year-btn";
  btn.onclick=()=>selectYear(y);
  btn.id="year-"+y;
  yearGrid.appendChild(btn);
}

function setActiveYear(y){
  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  if(y==="all") allBtn.classList.add("active");
  else document.getElementById("year-"+y)?.classList.add("active");
}

async function loadAll(){
  const promises=[];
  for(let y=startYear;y<=endYear;y++){
    promises.push(fetch(`data/f1/${y}.json`).then(r=>r.ok?r.json():null));
  }
  allData=(await Promise.all(promises)).filter(x=>x);
  render();
}

function selectYear(y){
  currentYear=y;
  setActiveYear(y);
  render();
}

function getSeasonChampion(seasonData){
  const totals={};
  (seasonData.races||[]).forEach(race=>{
    (race.results||[]).forEach(r=>{
      const d=cleanDriver(r.driver);
      if(!totals[d]) totals[d]=0;
      totals[d]+=Number(r.points)||0;
    });
  });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1])[0]?.[0]||"";
}

function render(){
  let seasons=allData;
  if(currentYear!=="all"){
    seasons=allData.filter(d=>String(d.season)===String(currentYear));
  }

  let races=0,wins=0,points=0,poles=0,winsFromPole=0,titles=0;
  const bySeason={};

  seasons.forEach(data=>{
    const champion = getSeasonChampion(data);

    (data.races||[]).forEach(race=>{
      (race.results||[]).forEach(r=>{
        const d = cleanDriver(r.driver);
        if(d!==driver) return;

        if(!bySeason[data.season]){
          bySeason[data.season]={team:r.team,wins:0,poles:0,winsFromPole:0,points:0};
        }

        races++;
        points+=Number(r.points)||0;
        bySeason[data.season].points+=Number(r.points)||0;

        if(Number(r.grid)===1){
          poles++;
          bySeason[data.season].poles++;
        }

        if(Number(r.position)===1){
          wins++;
          bySeason[data.season].wins++;
          if(Number(r.grid)===1){
            winsFromPole++;
            bySeason[data.season].winsFromPole++;
          }
        }

        if(d===champion){
          titles++;
        }
      });
    });
  });

  totalRaces.textContent=races;
  totalWins.textContent=wins;
  totalTitles.textContent=titles;
  totalPoles.textContent=poles;
  totalWinsFromPole.textContent=winsFromPole;
  totalPoints.textContent=points.toFixed(1);

  seasonTable.innerHTML="";
  Object.entries(bySeason)
    .sort((a,b)=>a[0]-b[0])
    .forEach(([year,s])=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${year}</td>
        <td>${s.team}</td>
        <td>${s.wins}</td>
        <td>${s.poles}</td>
        <td>${s.winsFromPole}</td>
        <td>${s.points.toFixed(1)}</td>
      `;
      seasonTable.appendChild(tr);
    });
}

loadAll();
</script>

</body>
</html>
