<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F1 Drivers Championship | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px;
}

h1{
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  background:#fafafa;
}

</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>F1 Drivers Championship</h1>

<select id="seasonSelect"></select>

<table id="table">
<thead>
<tr>
  <th>#</th>
  <th>Driver</th>
  <th>Points</th>
  <th>Wins</th>
  <th>Titles</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

// -----------------------------
// REAL CHAMPIONS (FIXES SENNA)
// -----------------------------
const CHAMPIONS = {
  1988: "Ayrton Senna",
  1989: "Alain Prost",
  1990: "Ayrton Senna",
  1991: "Ayrton Senna",
  1992: "Nigel Mansell",
  1993: "Alain Prost",
  1994: "Michael Schumacher",
  1995: "Michael Schumacher",
  1996: "Damon Hill",
  1997: "Jacques Villeneuve",
  1998: "Mika Hakkinen",
  1999: "Mika Hakkinen",
  2000: "Michael Schumacher",
  2001: "Michael Schumacher",
  2002: "Michael Schumacher",
  2003: "Michael Schumacher",
  2004: "Michael Schumacher",
  2005: "Fernando Alonso",
  2006: "Fernando Alonso",
  2007: "Kimi Raikkonen",
  2008: "Lewis Hamilton",
  2009: "Jenson Button",
  2010: "Sebastian Vettel",
  2011: "Sebastian Vettel",
  2012: "Sebastian Vettel",
  2013: "Sebastian Vettel",
  2014: "Lewis Hamilton",
  2015: "Lewis Hamilton",
  2016: "Nico Rosberg",
  2017: "Lewis Hamilton",
  2018: "Lewis Hamilton",
  2019: "Lewis Hamilton",
  2020: "Lewis Hamilton",
  2021: "Max Verstappen",
  2022: "Max Verstappen",
  2023: "Max Verstappen",
  2024: "Max Verstappen"
};

// -----------------------------
// LOAD SEASONS
// -----------------------------
const seasonSelect = document.getElementById("seasonSelect");

for(let y=1988;y<=2026;y++){
  const opt=document.createElement("option");
  opt.value=y;
  opt.textContent=y;
  if(y===2026) opt.selected=true;
  seasonSelect.appendChild(opt);
}

seasonSelect.addEventListener("change", loadSeason);

// -----------------------------
// LOAD DATA
// -----------------------------
async function loadSeason(){

  const year = seasonSelect.value;

  const res = await fetch(`data/f1/${year}.json`);
  const data = await res.json();

  const standings = {};

  data.races.forEach(race=>{
    race.results.forEach(r=>{

      const name = r.driver;

      if(!standings[name]){
        standings[name]={
          driver:name,
          points:0,
          wins:0
        };
      }

      const pts = Number(r.points)||0;
      standings[name].points += pts;

      if(r.position === 1){
        standings[name].wins++;
      }

    });
  });

  // -----------------------------
  // ADD TITLES
  // -----------------------------
  const titles = {};

  for(const yr in CHAMPIONS){
    const d = CHAMPIONS[yr];
    titles[d] = (titles[d]||0)+1;
  }

  const list = Object.values(standings).map(d=>({
    ...d,
    titles: titles[d.driver] || 0
  }));

  // sort
  list.sort((a,b)=>{
    if(b.points!==a.points) return b.points-a.points;
    return b.wins-a.wins;
  });

  render(list);
}


// -----------------------------
// RENDER
// -----------------------------
function render(list){

  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  list.forEach((d,i)=>{

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${i+1}</td>
      <td>${d.driver}</td>
      <td>${d.points}</td>
      <td>${d.wins}</td>
      <td>${d.titles}</td>
    `;

    tbody.appendChild(tr);

  });

}

// init
loadSeason();

</script>

</body>
</html>
