<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Women's T20 World Cup Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

/* UNIFIED HERO */

.hero{
  background:linear-gradient(90deg,#7b1fa2,#e91e63);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:25px;
}

.hero h1{
  margin:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:18px;
}

.team-card{
  background:#fff;
  padding:18px;
  border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.2s;
}

/* UNIFIED HOVER */

.team-card:hover{
  transform:translateY(-4px);
  box-shadow:0 6px 16px rgba(0,0,0,0.12);
  background:#f7f2fb;
}

.team-name{
  font-size:20px;
  font-weight:700;
  color:#7b1fa2;
}

</style>

</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="womens-t20-world-cup.html">Women's T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
  <h1>Women's T20 World Cup Teams</h1>
</div>

<div id="teamsGrid" class="grid"></div>

</div>

<script>

const DATA_PATH="data/womens-t20-world-cup/matches/";

const FILES=[
"wt20wc_2014_FULL.json",
"wt20wc_2016_FULL.json",
"wt20wc_2018_FULL.json",
"wt20wc_2020_FULL.json",
"wt20wc_2023_FULL.json",
"wt20wc_2024_FULL.json"
];

async function loadTeams()
{

const teams=new Set();

for(const file of FILES)
{

  const res=await fetch(DATA_PATH+file);

  if(!res.ok) continue;

  const data=await res.json();

  const matches=Array.isArray(data)?data:data.matches;

  matches.forEach(match=>
  {
    match.info.teams.forEach(team=>
    teams.add(team)
    );
  });

}

const sorted=[...teams].sort();

const grid=document.getElementById("teamsGrid");

sorted.forEach(team=>
{

  const card=document.createElement("div");

  card.className="team-card";

  card.innerHTML=
  `<div class="team-name">${team}</div>`;

  card.onclick=()=>
  {
    window.location=
    "womens-t20wc-team.html?team="+encodeURIComponent(team);
  };

  grid.appendChild(card);

});

}

loadTeams();

</script>

</body>
</html>
