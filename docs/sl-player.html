<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Super League Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c1118;
  --board-2:#141c26;
  --board-line:rgba(255,255,255,.10);
  --win:#ffffff;
  --lose:rgba(255,255,255,.42);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

.page{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

h1{
  font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);
  letter-spacing:.01em;text-transform:uppercase;margin:0;
}

/* ── Hero header (matches the game page's scorebug) ──────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:22px 26px 26px;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);
  margin-bottom:8px;
}
.hero h1{color:#fff;}

/* ── Controls ─────────────────────────────────────────── */
.controls{
  display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap;
}

.segment{
  display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px;gap:2px;max-width:100%;
  overflow-x:auto;scrollbar-width:none;
}
.segment::-webkit-scrollbar{display:none;}
.seg-btn{
  border:none;background:transparent;font-family:var(--body);font-size:13px;font-weight:600;
  color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s;
}
.seg-btn:hover{color:var(--ink);}
.seg-btn.active{background:var(--ink);color:#fff;}

select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);min-width:220px;
  cursor:pointer;
}
select:hover{border-color:var(--faint);}

.status{margin:2px 2px 18px;color:var(--muted);font-size:12.5px;font-weight:600;}

/* ── Layout ───────────────────────────────────────────── */
.content{
  display:grid;grid-template-columns:360px 1fr;gap:20px;
}
@media(max-width:820px){
  .content{grid-template-columns:1fr;}
}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
.card-head{
  display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);
}
.card-head h2{
  margin:0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;}
thead th{
  background:#f7f9fb;font-family:var(--body);font-weight:600;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  text-align:center;
}
td{text-align:center;font-variant-numeric:tabular-nums;color:#27313c;}
td.team{text-align:left;font-weight:700;color:var(--ink);}
tbody tr:hover td{background:#f0f6ff;}

/* ── Match list ───────────────────────────────────────── */
.matches{display:flex;flex-direction:column;gap:10px;}
.match{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 18px;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s;
}
.match:hover{
  transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,16,24,.18);border-color:var(--faint);
}
.match .line1{
  font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.01em;color:var(--ink);
}
.match .line2{color:var(--muted);font-size:12px;margin-top:4px;font-weight:600;letter-spacing:.02em;}

.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;}
</style>
</head>

<body>

<nav class="navbar">
<a href="/">Home</a>
<a href="/rugby-league.html">Rugby League</a>
<a href="/sl.html">Super League</a>
<div class="page">

<div class="hero">
<div class="eyebrow" id="heroEyebrow">Super League</div>
<h1 id="heroTitle">Player Stats</h1>
</div>

<div class="controls">
<input id="searchBox" type="text" placeholder="Search for a player..." style="padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);min-width:280px;">
</div>

<div class="status" id="status">Type a player's name to search.</div>

<div class="card">
<div class="card-head"><h2 id="playerName">&nbsp;</h2></div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Season</th>
<th style="text-align:left;">Team(s)</th>
<th>APP</th>
<th>T</th>
<th>G</th>
<th>FG</th>
<th>Pts</th>
</tr>
</thead>
<tbody id="statsBody"></tbody>
</table>
</div>
</div>

</div>

<script>

const YEARS = Array.from({length: 2026-1996+1}, (_, i) => 1996+i)

let allPlayers = [];

Promise.all(
  YEARS.map(y=>
    fetch("data/sl/players/"+y+".json").then(r=> r.ok ? r.json() : []).catch(()=>[])
      .then(players=>players.map(p=>({...p, season:y})))
  )
).then(results=>{
  results.forEach(season => allPlayers.push(...season));
  document.getElementById("status").textContent = allPlayers.length + " player-seasons loaded across " + YEARS.length + " seasons.";
});

document.getElementById("searchBox").addEventListener("input", function(){
  const q = this.value.trim().toLowerCase();
  if(q.length < 3){
    document.getElementById("statsBody").innerHTML = "";
    document.getElementById("playerName").textContent = "\u00A0";
    return;
  }

  const matches = allPlayers.filter(p => p.name.toLowerCase().includes(q));
  if(!matches.length){
    document.getElementById("playerName").textContent = "No players found";
    document.getElementById("statsBody").innerHTML = "";
    return;
  }

  // Group all season-rows for the FIRST matching player name exactly
  // (by id, since the same real person keeps the same player ID
  // across every season they appear in).
  const firstId = matches[0].id;
  const careerRows = allPlayers
    .filter(p => p.id === firstId)
    .sort((a,b) => a.season - b.season);

  document.getElementById("playerName").textContent = careerRows[0].name;

  document.getElementById("statsBody").innerHTML = careerRows.map(p => {
    const teamsText = p.teams.map(t => t.code + (t.games!=null ? " ("+t.games+")" : "")).join(", ");
    return `
      <tr>
        <td>${p.season}</td>
        <td class="team">${teamsText}</td>
        <td>${p.total_appearances}</td>
        <td>${p.tries}</td>
        <td>${p.goals}</td>
        <td>${p.field_goals}</td>
        <td>${p.points}</td>
      </tr>
    `;
  }).join("");
});

</script>
</body>
</html>
