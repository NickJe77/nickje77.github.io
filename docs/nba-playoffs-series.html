<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Playoff Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}

h1{text-align:center;}
p{text-align:center;color:#555;margin-bottom:20px;}

select{
padding:8px 12px;border-radius:8px;border:1px solid #ccc;
margin-bottom:20px;
}

details{
border:1px solid #ddd;
border-radius:8px;
padding:10px;
margin-bottom:12px;
}

summary{
font-weight:700;
font-size:17px;
cursor:pointer;
}

table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">
<h1>NBA Playoff Series</h1>
<p>Every playoff series by season (1976–present).</p>

<select id="seasonSelect"></select>
<div id="seriesContainer"></div>
</div>

<script>
let data=[];
const seasonSelect=document.getElementById("seasonSelect");
const container=document.getElementById("seriesContainer");

fetch("data/nba/playoff-series.json")
.then(r=>r.json())
.then(d=>{
data=d;
d.forEach((s,i)=>{
const o=document.createElement("option");
o.value=s.season;
o.textContent=s.season;
if(i===d.length-1)o.selected=true;
seasonSelect.appendChild(o);
});
render();
});

seasonSelect.onchange=render;

function render(){
const season=seasonSelect.value;
const seasonData=data.find(s=>s.season===season);
container.innerHTML="";
if(!seasonData)return;

seasonData.rounds.forEach(round=>{
const details=document.createElement("details");
const summary=document.createElement("summary");
summary.textContent=round.round;
details.appendChild(summary);

const table=document.createElement("table");
table.innerHTML=`<thead>
<tr><th>Matchup</th><th>Result</th></tr>
</thead><tbody></tbody>`;
const tbody=table.querySelector("tbody");

round.series.forEach(s=>{
const tr=document.createElement("tr");
tr.innerHTML=`<td>${s.team1} vs ${s.team2}</td><td>${s.result}</td>`;
tbody.appendChild(tr);
});

details.appendChild(table);
container.appendChild(details);
});
}
</script>

</body>
</html>
