<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Playoff Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* PAGE */

.page-wrap{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#1D428A,#C8102E);
color:white;
padding:26px 30px;
border-radius:14px;
margin-bottom:25px;
box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.hero h1{
margin:0;
font-size:34px;
font-weight:800;
}

.hero p{
margin:6px 0 0;
opacity:.9;
}

/* CONTROLS */

.controls{
text-align:center;
margin-bottom:20px;
}

select{
padding:10px 14px;
border-radius:10px;
border:1px solid #ccc;
font-size:14px;
background:#fff;
}

/* ROUND CARDS */

details{
background:#fff;
border-radius:14px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
padding:12px 18px;
margin-bottom:16px;
}

summary{
font-weight:800;
font-size:18px;
cursor:pointer;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
margin-top:12px;
font-size:14px;
}

th,td{
padding:10px 12px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#eef3ff;
font-weight:800;
}

tr:nth-child(even){
background:#f8faff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Playoff Series</h1>
<p>Every NBA playoff series by season (1976–present).</p>
</div>

<div class="controls">
<select id="seasonSelect"></select>
</div>

<div id="seriesContainer"></div>

</div>

<script>

let data=[];

const seasonSelect=document.getElementById("seasonSelect");
const container=document.getElementById("seriesContainer");

/* LOAD DATA */

fetch("data/nba/playoff-series.json")

.then(r=>r.json())

.then(d=>{

data=d;

/* populate season selector */

d.forEach((s,i)=>{

const o=document.createElement("option");

o.value=s.season;
o.textContent=s.season;

if(i===d.length-1)o.selected=true;

seasonSelect.appendChild(o);

});

render();

})

.catch(()=>{

container.innerHTML="<p>Could not load playoff series.</p>";

});

/* change season */

seasonSelect.onchange=render;

/* render */

function render(){

const season=seasonSelect.value;

const seasonData=data.find(s=>s.season===season);

container.innerHTML="";

if(!seasonData)return;

/* rounds */

seasonData.rounds.forEach(round=>{

const details=document.createElement("details");

const summary=document.createElement("summary");

summary.textContent=round.round;

details.appendChild(summary);

/* table */

const table=document.createElement("table");

table.innerHTML=`
<thead>
<tr>
<th>Matchup</th>
<th>Result</th>
</tr>
</thead>
<tbody></tbody>
`;

const tbody=table.querySelector("tbody");

/* series rows */

round.series.forEach(s=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${s.team1} vs ${s.team2}</td>
<td>${s.result}</td>
`;

tbody.appendChild(tr);

});

details.appendChild(table);

container.appendChild(details);

});

}

</script>

</body>
</html>
