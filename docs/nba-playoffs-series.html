<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Playoff Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:28px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero p{margin:8px 0 0;color:rgba(255,255,255,.68);font-size:13.5px;}

.controls{text-align:center;margin-bottom:20px;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

details{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 20px;margin-bottom:16px;
}
summary{
  font-family:var(--display);font-weight:600;font-size:17px;cursor:pointer;
  letter-spacing:.01em;color:var(--ink);
}

table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px;}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;}
th{
  background:#f7f9fb;color:var(--muted);font-weight:600;font-family:var(--body);
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;
}
td{color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div class="page-wrap">

<div class="hero">
  <span class="eyebrow">NBA</span>
  <h1>NBA Playoff Series</h1>
  <p>Every NBA playoff series by season (1976–present).</p>
</div>

<div class="controls">
<select id="seasonSelect"></select>
</div>

<div id="seriesContainer"></div>

</div>

<script>

let data=[];

const seasonSelect=document.getElementById("seasonSelect");
const container=document.getElementById("seriesContainer");

/* LOAD DATA */

fetch("data/nba/playoff-series.json")

.then(r=>r.json())

.then(d=>{

data=d;

/* populate season selector */

d.forEach((s,i)=>{

const o=document.createElement("option");

o.value=s.season;
o.textContent=s.season;

if(i===d.length-1)o.selected=true;

seasonSelect.appendChild(o);

});

render();

})

.catch(()=>{

container.innerHTML="<p>Could not load playoff series.</p>";

});

/* change season */

seasonSelect.onchange=render;

/* render */

function render(){

const season=seasonSelect.value;

const seasonData=data.find(s=>s.season===season);

container.innerHTML="";

if(!seasonData)return;

/* rounds */

seasonData.rounds.forEach(round=>{

const details=document.createElement("details");

const summary=document.createElement("summary");

summary.textContent=round.round;

details.appendChild(summary);

/* table */

const table=document.createElement("table");

table.innerHTML=`
<thead>
<tr>
<th>Matchup</th>
<th>Result</th>
</tr>
</thead>
<tbody></tbody>
`;

const tbody=table.querySelector("tbody");

/* series rows */

round.series.forEach(s=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${s.team1} vs ${s.team2}</td>
<td>${s.result}</td>
`;

tbody.appendChild(tr);

});

details.appendChild(table);

container.appendChild(details);

});

}

</script>

</body>
</html>
