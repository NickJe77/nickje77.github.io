<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title id="pageTitle">Field Hockey World Cup Results | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://thesportingalmanac.com/fieldhockey-tournament.html">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8J9ZPKDDH"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N8J9ZPKDDH');</script>
  <link rel="stylesheet" href="style.css">
  <style>
  body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f4f6f8;}
  .navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;}
  .navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
  .navbar a:hover{text-decoration:underline;}
  .page-wrap{max-width:900px;margin:0 auto;padding:0 20px 60px;}
  .breadcrumb{margin:22px 0 6px;font-size:14px;}
  .breadcrumb a{color:#0056d6;text-decoration:none;}
  .breadcrumb a:hover{text-decoration:underline;}
  .intro{margin:10px 0 30px;}
  .intro h1{margin:0 0 8px;font-size:30px;font-weight:800;color:#111;}
  .intro p{color:#555;margin:0;font-size:15px;}
  .matches-list{display:flex;flex-direction:column;gap:10px;}
  .match-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid #041E42;border-radius:12px;padding:14px 18px;box-shadow:0 2px 6px rgba(0,0,0,.05);}
  .match-teams{display:flex;align-items:center;gap:14px;font-weight:700;font-size:16px;color:#111;flex:1;}
  .match-teams .team{min-width:120px;}
  .match-teams .team.away{text-align:right;}
  .match-score{font-size:18px;font-weight:800;color:#041E42;min-width:70px;text-align:center;}
  .match-score.tbd{color:#999;font-size:13px;font-weight:600;}
  .match-date{font-size:13px;color:#777;min-width:150px;text-align:right;}
  .match-row.tbd{opacity:.6;}
  .loading,.error{text-align:center;color:#777;padding:40px 0;}
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="nba.html">NBA</a>
  <a href="nhl.html">NHL</a>
  <a href="fieldhockey.html">Field Hockey</a>
</div>
<div class="page-wrap">
  <div class="breadcrumb"><a href="fieldhockey.html">Field Hockey</a> &rsaquo; <span id="breadcrumbName">Tournament</span></div>
  <section class="intro">
    <h1 id="tournamentTitle">Loading&hellip;</h1>
    <p id="tournamentSub"></p>
  </section>
  <div id="matchesContainer" class="loading">Loading matches&hellip;</div>
</div>
<script>
function getParam(name){
  var params = new URLSearchParams(window.location.search);
  return params.get(name);
}

var slug = getParam('tournament');
var container = document.getElementById('matchesContainer');

if (!slug) {
  container.className = 'error';
  container.textContent = 'No tournament specified.';
} else {
  fetch('data/fieldhockey/tournaments/' + slug + '.json')
    .then(function(r){
      if (!r.ok) throw new Error('Not found');
      return r.json();
    })
    .then(function(data){
      document.title = data.competition + ' Results | The Sporting Almanac';
      document.getElementById('pageTitle').textContent = data.competition + ' Results | The Sporting Almanac';
      document.getElementById('tournamentTitle').textContent = data.competition;
      document.getElementById('breadcrumbName').textContent = data.competition;
      document.getElementById('tournamentSub').textContent = data.match_count + ' matches';

      container.className = 'matches-list';
      container.innerHTML = '';

      data.matches.forEach(function(m){
        var row = document.createElement('div');
        row.className = 'match-row' + (m.status === 'tbd' ? ' tbd' : '');

        var scoreHtml;
        if (m.home_score !== null && m.away_score !== null) {
          scoreHtml = '<div class="match-score">' + m.home_score + ' &ndash; ' + m.away_score + '</div>';
        } else {
          scoreHtml = '<div class="match-score tbd">' + (m.status === 'tbd' ? 'TBD' : 'Scheduled') + '</div>';
        }

        row.innerHTML =
          '<div class="match-teams">' +
            '<div class="team home">' + m.home_team + '</div>' +
            scoreHtml +
            '<div class="team away">' + m.away_team + '</div>' +
          '</div>' +
          '<div class="match-date">' + (m.date || '') + '</div>';

        container.appendChild(row);
      });
    })
    .catch(function(){
      container.className = 'error';
      container.textContent = 'Could not load this tournament\'s results.';
    });
}
</script>
</body>
</html>
