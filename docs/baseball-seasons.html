<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Seasons | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#f7f5f0;
  --surface:#fff;
  --ink:#1a1a1a;
  --muted:#6b6b6b;
  --line:#e3ded4;
  --accent:#8a1f2d;
  --accent-soft:#f6e6e8;
  --display:'Georgia',serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
}
.navbar{
  display:flex;
  gap:20px;
  padding:16px 24px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.navbar a{
  color:var(--ink);
  text-decoration:none;
  font-weight:600;
  font-size:14px;
}
.navbar a[aria-current="page"]{
  color:var(--accent);
}
.page{
  max-width:900px;
  margin:0 auto;
  padding:32px 24px 64px;
}
.hero{
  margin-bottom:28px;
}
.eyebrow{
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--accent);
  text-transform:uppercase;
}
h1{
  font-family:var(--display);
  font-size:32px;
  margin:4px 0 0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:12px;
}
.tile{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  text-align:center;
  font-family:var(--display);
  font-weight:600;
  font-size:17px;
  letter-spacing:.02em;
  color:var(--ink);
  cursor:pointer;
  transition:background .15s,border-color .15s,color .15s,transform .15s;
}
.tile:hover{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent);
  transform:translateY(-2px);
}
.loading{
  text-align:center;
  padding:40px;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
}
</style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html" aria-current="page">Seasons</a>
  <a href="baseball-player.html">Players</a>
</div>
<div class="page">
<div class="hero">
<div class="eyebrow">MLB</div>
<h1>Seasons</h1>
</div>
<div id="grid" class="grid">
<div class="loading">Loading seasons...</div>
</div>
</div>
<script>
const owner="nickje77";
const repo="nickje77.github.io";
const branch="main";

// CHANGED: this used to list docs/data/baseball/boxscores, a folder
// with 150,000+ per-game files that (a) makes this one API call slow
// for no reason, since only the top-level year folder names are
// needed, and (b) was one of the two folders removed from the repo
// because their sheer file count was breaking the GitHub Pages
// deploy (the per-game data now lives on R2 instead). docs/data/
// baseball/seasons/ has the exact same set of years, one small json
// file per year, so it's a safe drop-in replacement that keeps this
// page working after boxscores/ is gone.
async function loadSeasons(){
const api=
`https://api.github.com/repos/${owner}/${repo}/contents/docs/data/baseball/seasons?ref=${branch}`;
const res=await fetch(api);
if(!res.ok){
document.getElementById("grid").textContent="Failed to load seasons";
return;
}
const files=await res.json();
const grid=document.getElementById("grid");
grid.innerHTML="";
files
.filter(f=>f.type==="file" && f.name.endsWith(".json"))
.map(f=>f.name.replace(/\.json$/,""))
.sort((a,b)=>b.localeCompare(a))
.forEach(season=>{
const div=document.createElement("div");
div.className="tile";
div.textContent=season;
div.onclick=()=>{
window.location.href=
`https://thesportingalmanac.com/baseball-season.html?season=${season}`;
};
grid.appendChild(div);
});
}
loadSeasons();
</script>
</body>
</html>
