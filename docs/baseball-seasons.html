<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Seasons | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Arial;
 margin:0;
 background:#f4f6f8;
 color:#111;
}

/* NAVBAR */

.navbar{
 display:flex;
 justify-content:center;
 gap:28px;
 padding:18px 0;
 background:white;
 border-bottom:1px solid #ddd;
 font-weight:600;
}

.navbar a{
 text-decoration:none;
 color:#0056d6;
 font-size:18px;
}

.navbar a:hover{
 text-decoration:underline;
}

/* HERO */

.hero{
 background:linear-gradient(90deg,#002D72,#BA0C2F);
 color:white;
 padding:60px 20px;
 text-align:center;
 box-shadow:0 3px 10px rgba(0,0,0,0.15);
}

.hero h1{
 margin:0;
 font-size:52px;
 font-weight:800;
}

.hero p{
 margin-top:12px;
 font-size:20px;
 opacity:0.95;
}

/* CONTENT */

.container{
 max-width:1200px;
 margin:auto;
 padding:40px 20px 60px;
}

/* GRID */

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
 gap:20px;
}

/* TILE */

.tile{
 background:linear-gradient(180deg,#ffffff,#e6ebf1);
 border-radius:14px;
 padding:26px 0;
 text-align:center;
 font-size:24px;
 font-weight:700;
 cursor:pointer;

 box-shadow:
 0 4px 10px rgba(0,0,0,0.12),
 inset 0 1px 0 rgba(255,255,255,0.7);

 transition:all 0.18s ease;
 user-select:none;
}

.tile:hover{
 transform:translateY(-5px);
 background:linear-gradient(90deg,#002D72,#BA0C2F);
 color:white;
 box-shadow:0 12px 24px rgba(0,0,0,0.25);
}

/* STATES */

.loading{
 text-align:center;
 font-size:22px;
 color:#666;
 padding:40px;
}

.error{
 text-align:center;
 font-size:22px;
 color:#c62828;
 padding:40px;
 font-weight:600;
}

/* FOOTER */

.footer{
 text-align:center;
 padding:30px;
 color:#777;
 font-size:14px;
 border-top:1px solid #ddd;
 background:white;
}

</style>
</head>

<body>

<div class="navbar">
 <a href="index.html">Home</a>
 <a href="baseball.html">Baseball</a>
 <a href="baseball-seasons.html">Seasons</a>
 <a href="baseball-player.html">Players</a>
</div>

<div class="hero">
 <h1>MLB Seasons</h1>
 <p>Complete archive of Major League Baseball seasons since 1947</p>
</div>

<div class="container">

 <div id="grid" class="grid">
  <div class="loading">Loading seasons...</div>
 </div>

</div>

<div class="footer">
 The Sporting Almanac ©
</div>

<script>

async function loadSeasons(){

 const grid = document.getElementById("grid");

 try{

  const response =
   await fetch("data/baseball/index.json?cache=" + Date.now());

  const json = await response.json();

  let seasons=[];

  if(Array.isArray(json))
   seasons=json;

  else if(json.seasons)
   seasons=json.seasons;

  else
   throw "Invalid index format";

  seasons = seasons
   .map(Number)
   .filter(year=>year>=1947)
   .sort((a,b)=>b-a);

  grid.innerHTML="";

  seasons.forEach(year=>{

   const tile=document.createElement("div");

   tile.className="tile";

   tile.textContent=year;

   tile.onclick=function(){

    window.location.href =
     "baseball-season.html?year=" + year;

   };

   grid.appendChild(tile);

  });

 }
 catch(err){

  console.error(err);

  grid.innerHTML =
   "<div class='error'>Failed to load seasons</div>";

 }

}

loadSeasons();

</script>

</body>
</html>
