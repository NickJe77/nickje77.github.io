<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Seasons | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
 font-family:Inter,system-ui,Arial;
 margin:0;
 background:#f4f6f8;
}

/* NAVBAR */

.navbar{
 display:flex;
 justify-content:center;
 gap:28px;
 padding:18px 0;
 background:white;
 border-bottom:1px solid #ddd;
 font-weight:600;
}

.navbar a{
 text-decoration:none;
 color:#0056d6;
 font-size:18px;
}

.navbar a:hover{
 text-decoration:underline;
}

/* HERO */

.hero{
 background:linear-gradient(90deg,#002D72,#BA0C2F);
 color:white;
 padding:50px 40px;
 text-align:center;
}

.hero h1{
 margin:0;
 font-size:48px;
 font-weight:800;
}

.hero p{
 margin-top:10px;
 font-size:20px;
 opacity:0.9;
}

/* CONTENT */

.container{
 max-width:1200px;
 margin:auto;
 padding:40px 20px;
}

/* GRID */

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
 gap:22px;
}

/* TILE */

.tile{
 background:linear-gradient(145deg,#ffffff,#dfe3e8);
 border-radius:14px;
 padding:22px 0;
 text-align:center;
 font-size:22px;
 font-weight:700;
 cursor:pointer;

 box-shadow:
 0 4px 10px rgba(0,0,0,0.15),
 inset 0 1px 0 rgba(255,255,255,0.7);

 transition:all 0.2s ease;
}

.tile:hover{

 transform:translateY(-4px);

 background:linear-gradient(145deg,#002D72,#BA0C2F);

 color:white;

 box-shadow:
 0 10px 20px rgba(0,0,0,0.25);

}

.footer{
 text-align:center;
 padding:30px;
 color:#777;
 font-size:14px;
}

</style>
</head>

<body>

<div class="navbar">
 <a href="./index.html">Home</a>
 <a href="./baseball.html">Baseball</a>
 <a href="./baseball-seasons.html">Seasons</a>
 <a href="./baseball-players.html">Players</a>
</div>

<div class="hero">
 <h1>MLB Seasons</h1>
 <p>Complete archive of Major League Baseball seasons</p>
</div>

<div class="container">

 <div id="grid" class="grid">
 Loading seasons...
 </div>

</div>

<div class="footer">
 The Sporting Almanac ©
</div>

<script>

async function loadSeasons(){

 const grid = document.getElementById("grid");

 try{

  const res =
   await fetch("/data/baseball/index.json?cache=" + Date.now());

  const years = await res.json();

  grid.innerHTML="";

  years.forEach(year=>{

   const tile=document.createElement("div");

   tile.className="tile";

   tile.textContent=year;

   tile.onclick=function(){

    window.location.href=
     "/baseball-season.html?year="+year;

   };

   grid.appendChild(tile);

  });

 }
 catch(err){

  grid.innerHTML=
   "<div style='color:red;font-size:22px'>Failed to load seasons</div>";

 }

}

loadSeasons();

</script>

</body>
</html>
