<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MLB Seasons</title>

<style>
body{
 font-family:Inter, system-ui, Arial;
 background:#f4f6f8;
 margin:0;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
 gap:20px;
 padding:40px;
 max-width:1000px;
 margin:auto;
}

.tile{
 background:linear-gradient(#bdbdbd,#7a7a7a);
 color:white;
 padding:20px;
 border-radius:12px;
 text-align:center;
 font-size:22px;
 font-weight:700;
 cursor:pointer;
}
</style>

</head>

<body>

<div id="grid" class="grid">
Loading seasons...
</div>

<script>

async function loadSeasons(){

 const grid = document.getElementById("grid");

 try{

  const response =
   await fetch("/data/baseball/index.json?cache=" + Date.now());

  if(!response.ok){
   throw new Error("HTTP " + response.status);
  }

  const years = await response.json();

  grid.innerHTML = "";

  for(const year of years){

   const tile = document.createElement("div");

   tile.className = "tile";
   tile.textContent = year;

   tile.onclick = function(){
    window.location.href =
     "/baseball-season.html?year=" + year;
   };

   grid.appendChild(tile);

  }

 }
 catch(error){

  console.error("LOAD ERROR:", error);

  grid.innerHTML =
   "<div style='color:red;font-size:22px'>" +
   "FAILED TO LOAD SEASONS<br>" +
   error.message +
   "</div>";

 }

}

loadSeasons();

</script>

</body>
</html>
