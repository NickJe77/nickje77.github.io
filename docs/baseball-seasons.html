<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Seasons | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:Inter, system-ui, Arial;
  margin:0;
  background:#f4f6f8;
}

/* NAVBAR */

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

/* HERO */

.hero{
  max-width:1200px;
  margin:30px auto 20px auto;
  height:200px;
  border-radius:20px;
  background:
    linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),
    url("./images/baseball-hero.jpg");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  padding-left:40px;
  color:white;
}

.hero h1{
  font-size:42px;
  margin:0;
}

.hero p{
  font-size:18px;
  margin-top:6px;
}

/* GRID */

.season-grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:18px;
  padding:20px;
}

.season-tile{
  background:linear-gradient(180deg,#bdbdbd,#7a7a7a);
  border-radius:14px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:700;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

.season-tile:hover{
  transform:translateY(-3px);
}

.loading{
  text-align:center;
  font-size:20px;
  padding:40px;
}

</style>

</head>

<body>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
<a href="baseball.html">Baseball</a>
<a href="f1.html">F1</a>
<a href="nba.html">NBA</a>
<a href="nfl.html">NFL</a>
</nav>

<div class="hero">
  <div>
    <h1>MLB Seasons</h1>
    <p>Complete season archive from 1947 to present</p>
  </div>
</div>

<div id="grid" class="season-grid">
  <div class="loading">Loading seasons...</div>
</div>

<script>

async function loadSeasons(){

  const grid = document.getElementById("grid")

  const res = await fetch("data/baseball/index.json")
  const years = await res.json()

  grid.innerHTML = ""

  years.forEach(year => {

    const tile = document.createElement("div")
    tile.className = "season-tile"
    tile.textContent = year

    tile.onclick = () => {
      window.location = `baseball-season.html?year=${year}`
    }

    grid.appendChild(tile)

  })

}

loadSeasons()

</script>

</body>
</html>
