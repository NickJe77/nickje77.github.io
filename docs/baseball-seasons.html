<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>MLB Seasons | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  text-decoration:none;
  color:var(--ink);
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}
.page{
  max-width:1200px;
  margin:0 auto;
  padding:26px 20px 70px;
}
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:32px 34px;
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(28px,5vw,40px);
  letter-spacing:.01em;
  text-transform:uppercase;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:12px;
}
.tile{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  text-align:center;
  font-family:var(--display);
  font-weight:600;
  font-size:17px;
  letter-spacing:.02em;
  color:var(--ink);
  cursor:pointer;
  transition:background .15s,border-color .15s,color .15s,transform .15s;
}
.tile:hover{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent);
  transform:translateY(-2px);
}
.loading{
  text-align:center;
  padding:40px;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
}
</style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html" aria-current="page">Seasons</a>
  <a href="baseball-player.html">Players</a>
</div>
<div class="page">
<div class="hero">
<div class="eyebrow">MLB</div>
<h1>Seasons</h1>
</div>
<div id="grid" class="grid">
<div class="loading">Loading seasons...</div>
</div>
</div>
<script>
const owner="nickje77";
const repo="nickje77.github.io";
const branch="main";
async function loadSeasons(){
const api=
`https://api.github.com/repos/${owner}/${repo}/contents/docs/data/baseball/boxscores?ref=${branch}`;
const res=await fetch(api);
if(!res.ok){
document.getElementById("grid").textContent="Failed to load seasons";
return;
}
const folders=await res.json();
const grid=document.getElementById("grid");
grid.innerHTML="";
folders
.filter(f=>f.type==="dir")
.sort((a,b)=>b.name.localeCompare(a.name))
.forEach(folder=>{
const season=folder.name;
const div=document.createElement("div");
div.className="tile";
div.textContent=season;
div.onclick=()=>{
window.location.href=
`https://thesportingalmanac.com/baseball-season.html?season=${season}`;
};
grid.appendChild(div);
});
}
loadSeasons();
</script>
</body>
</html>
