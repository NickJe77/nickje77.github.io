<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MLB Seasons</title>

<style>
body{
 font-family:Inter;
 background:#f4f6f8;
 margin:0;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
 gap:20px;
 padding:40px;
 max-width:1000px;
 margin:auto;
}

.tile{
 background:linear-gradient(#bdbdbd,#7a7a7a);
 color:white;
 padding:20px;
 border-radius:12px;
 text-align:center;
 font-size:22px;
 font-weight:700;
 cursor:pointer;
}

.error{
 text-align:center;
 color:red;
 padding:40px;
 font-size:20px;
}
</style>

</head>

<body>

<div id="grid" class="grid">
Loading seasons...
</div>

<script>

async function loadSeasons(){

 try{

  const res = await fetch(
   "https://nickje77.github.io/docs/data/baseball/index.json"
  );

  if(!res.ok)
   throw new Error("Fetch failed");

  const years = await res.json();

  const grid = document.getElementById("grid");

  grid.innerHTML = "";

  years.forEach(year => {

   const tile = document.createElement("div");

   tile.className = "tile";
   tile.textContent = year;

   tile.onclick = () => {
     window.location.href =
       "baseball-season.html?year=" + year;
   };

   grid.appendChild(tile);

  });

 }
 catch(e){

  document.getElementById("grid").innerHTML =
   "<div class='error'>Failed to load seasons</div>";

 }

}

loadSeasons();

</script>

</body>
</html>
