<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races – Winners | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Global styles -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../racing.css">

  <style>
    /* ---------- HERO ---------- */

    .hk-hero {
      max-width: 1200px;
      margin: 36px auto 50px;
      padding: 0 24px;
    }

    .hk-hero img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    /* ---------- PAGE INTRO ---------- */

    .page-intro {
      max-width: 900px;
      margin: 0 auto 40px;
      padding: 0 24px;
      text-align: center;
    }

    .page-intro h1 {
      font-size: 36px;
      margin-bottom: 14px;
    }

    .page-intro p {
      font-size: 18px;
      color: #444;
      line-height: 1.6;
    }

    /* ---------- FILTERS ---------- */

    .filters {
      max-width: 1200px;
      margin: 0 auto 30px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 22px;
      align-items: end;
    }

    .filters label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .filters select,
    .filters input {
      width: 100%;
      height: 48px;
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 10px;
      box-sizing: border-box;
      font-family: inherit;
    }

    /* ---------- TABLE ---------- */

    .archive-table {
      max-width: 1200px;
      margin: 0 auto 90px;
      padding: 0 24px;
      overflow-x: auto;
      border: 1px solid #d6e4f2;
      border-radius: 14px;
    }

    .archive-table table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
    }

    .archive-table thead {
      background: #f3f7fc;
    }

    .archive-table th,
    .archive-table td {
      padding: 14px 12px;
      border-bottom: 1px solid #e1e8f0;
      text-align: left;
      vertical-align: top;
    }

    .archive-table th {
      font-weight: 600;
    }

    .archive-table tbody tr:nth-child(even) {
      background: #f5f9ff;
    }

    /* Column widths */
    .archive-table th:nth-child(1),
    .archive-table td:nth-child(1) { width: 80px; }

    .archive-table th:nth-child(2),
    .archive-table td:nth-child(2) { width: 260px; }

    .archive-table th:nth-child(3),
    .archive-table td:nth-child(3) { width: 200px; }

    .archive-table th:nth-child(4),
    .archive-table td:nth-child(4) { width: 180px; }

    .archive-table th:nth-child(5),
    .archive-table td:nth-child(5) { width: 160px; }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 900px) {
      .filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<!-- NAV -->
<nav class="home-nav">
  <a href="../index.html">Home</a>
  <a href="../racing.html">Racing</a>
  <a href="hong-kong.html">Hong Kong</a>
  <a href="hong-kong-winners.html" class="active">Winners</a>
</nav>

<!-- HERO -->
<div class="hk-hero">
  <img src="../hong-kong-hero.jpg" alt="Hong Kong International Races">
</div>

<!-- INTRO -->
<div class="page-intro">
  <h1>Hong Kong International Races – Winners</h1>
  <p>
    A complete record of winners from the Hong Kong International Races,
    showcasing the horses, jockeys and trainers who have triumphed on one
    of world racing’s most prestigious stages.
  </p>
</div>

<!-- FILTERS -->
<div class="filters">
  <div>
    <label for="yearFilter">Year</label>
    <select id="yearFilter">
      <option value="">All</option>
    </select>
  </div>

  <div>
    <label for="raceFilter">Race</label>
    <input id="raceFilter" type="text" list="raceList" placeholder="Type race name">
    <datalist id="raceList"></datalist>
  </div>

  <div>
    <label for="winnerFilter">Winner</label>
    <input id="winnerFilter" type="text" list="winnerList" placeholder="Type horse name">
    <datalist id="winnerList"></datalist>
  </div>
</div>

<!-- TABLE -->
<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- DATA SCRIPT -->
<script src="../data/hong-kong-results.json" type="application/json"></script>
<script src="hong-kong-winners.js" defer></script>

</body>
</html>
