<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8" />
<title>MLB All-Star Game | The Sporting Almanac</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --al:#002d72;
  --nl:#c8102e;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1000px;margin:0 auto;padding:26px 20px 70px;}

h1{
  font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);
  letter-spacing:.01em;text-transform:uppercase;margin:0;
}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:22px 26px 26px;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:8px;
}
.hero h1{color:#fff;}
.hero .sub{margin-top:10px;font-size:14px;color:rgba(255,255,255,.7);font-weight:600;}

.segmented{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:20px;}
.seg-item{padding:8px 20px;border-radius:999px;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);text-decoration:none;transition:background .15s,color .15s;}
.seg-item:hover{color:var(--ink);}
.seg-item.active{background:var(--accent-soft);color:var(--ink);}

.controls{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);min-width:120px;
  cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

.game-header{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:20px 24px;margin-bottom:20px;}
.game-date{font-family:var(--body);font-size:12px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;}
.game-score{font-family:var(--display);font-size:clamp(24px,4.5vw,32px);text-transform:uppercase;margin:6px 0 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.game-score .nl{color:var(--nl);}
.game-score .al{color:var(--al);}
.game-score .dash{color:var(--faint);font-size:.6em;}
.meta-row{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;}
.meta-row strong{color:var(--ink);}

.linescore-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;margin-bottom:20px;max-width:520px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
thead th{background:#f7f9fb;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;}
th.center,td.center{text-align:center;}
td{color:#27313c;font-variant-numeric:tabular-nums;}
td.total{font-weight:700;}

.card-title{font-family:var(--display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
.card-title.nl{color:var(--nl);}
.card-title.al{color:var(--al);}
.card-title .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
.card-title.nl .dot{background:var(--nl);}
.card-title.al .dot{background:var(--al);}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;margin-bottom:24px;}
td.player{font-weight:700;color:var(--ink);}
td.player small{font-weight:400;color:var(--faint);margin-left:4px;}
tbody tr:hover td{background:#f9fbfd;}
tbody tr.totals td{border-top:2px solid var(--line);font-weight:700;}

.section-label{font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.02em;margin:8px 0 14px;color:var(--ink);}

.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;}
</style>
</head>
<body>
<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-world-series.html">World Series</a>
  <a href="baseball-all-star-games.html" aria-current="page">All-Star</a>
  <a href="baseball-all-star-leaders.html">All-Star Leaders</a>
</nav>

<div class="page-wrap">

<div class="hero">
  <div class="eyebrow">MLB</div>
  <h1 id="heroTitle">All-Star Game</h1>
  <div class="sub" id="subLine"></div>
</div>

<div class="segmented">
  <a href="baseball-all-star-games.html" class="seg-item active">Games</a>
  <a href="baseball-all-star-leaders.html" class="seg-item">Leaders</a>
</div>

<div class="controls">
  <select id="yearSelect"><option>Loading…</option></select>
  <select id="gameSelect" hidden></select>
</div>

<div id="content"><div class="loading">Loading All-Star data…</div></div>

</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
const DATA_URL = `${R2}/baseball/allstar.json`;

const BATTING_COLS = ["AB","R","H","RBI","BB","SO","PO","A"];
const PITCHING_COLS = ["IP","H","R","ER","BB","SO","HR","BFP"];

const yearSelect = document.getElementById("yearSelect");
const gameSelect = document.getElementById("gameSelect");
const heroTitle = document.getElementById("heroTitle");
const subLine = document.getElementById("subLine");
const content = document.getElementById("content");

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

let DATA = null;
let currentYear = null;
let currentGameNumber = null;

fetch(DATA_URL)
  .then(r => { if(!r.ok) throw new Error("no data"); return r.json(); })
  .then(data => {
    DATA = data || {};
    const years = Object.keys(DATA).sort((a,b) => Number(b) - Number(a));
    if(!years.length){
      content.innerHTML = `<div class="loading">No All-Star data found in ${DATA_URL}.</div>`;
      return;
    }
    yearSelect.innerHTML = "";
    years.forEach(y => {
      const opt = document.createElement("option");
      opt.value = y; opt.textContent = y;
      yearSelect.appendChild(opt);
    });
    yearSelect.onchange = () => { currentYear = yearSelect.value; currentGameNumber = null; render(); };
    currentYear = years[0];
    render();
  })
  .catch(() => {
    content.innerHTML = `<div class="loading">Couldn't load ${DATA_URL}.</div>`;
  });

gameSelect.addEventListener("change", () => {
  currentGameNumber = Number(gameSelect.value);
  render();
});

function scoreFor(lineScore, code){
  const row = (lineScore || []).find(r => r.team === code);
  return row ? row.R : null;
}

function renderLineScore(lineScore){
  if(!lineScore || !lineScore.length) return "";
  const innCount = Math.max(...lineScore.map(r => (r.innings || []).length));
  const cols = Array.from({length: innCount}, (_, i) => i + 1);
  const headerRow = `<tr><th></th>${cols.map(c => `<th class="center">${c}</th>`).join("")}<th class="center">R</th><th class="center">H</th><th class="center">E</th></tr>`;
  const bodyRows = lineScore.map(r => `
    <tr>
      <td>${esc(r.team)}</td>
      ${cols.map((_, i) => `<td class="center">${esc((r.innings || [])[i] ?? "")}</td>`).join("")}
      <td class="center total">${esc(r.R)}</td>
      <td class="center">${esc(r.H)}</td>
      <td class="center">${esc(r.E)}</td>
    </tr>`).join("");
  return `<div class="linescore-wrap"><table><thead>${headerRow}</thead><tbody>${bodyRows}</tbody></table></div>`;
}

function renderStatTable(rows, cols){
  if(!rows || !rows.length){
    return `<div class="table-wrap"><table><tbody><tr><td class="loading">No data available</td></tr></tbody></table></div>`;
  }
  const players = rows.filter(r => r.player !== "Totals");
  const totals = rows.find(r => r.player === "Totals");

  const bodyRows = players.map(p => `
    <tr>
      <td class="player">${esc(p.full_name || p.player)}${p.decision ? `<small>${esc(p.decision)}</small>` : (p.position ? `<small>${esc(p.position)}</small>` : "")}</td>
      ${cols.map(c => `<td class="center">${esc(p[c] ?? "")}</td>`).join("")}
    </tr>`).join("");

  const totalsHtml = totals ? `
    <tr class="totals">
      <td class="player">Totals</td>
      ${cols.map(c => `<td class="center">${esc(totals[c] ?? "")}</td>`).join("")}
    </tr>` : "";

  return `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Player</th>${cols.map(c => `<th class="center">${c}</th>`).join("")}</tr></thead>
        <tbody>${bodyRows}${totalsHtml}</tbody>
      </table>
    </div>`;
}

function render(){
  if(currentYear == null || !DATA) return;
  const yearObj = DATA[currentYear];
  yearSelect.value = currentYear;

  if(!yearObj || !yearObj.games || !yearObj.games.length){
    content.innerHTML = `<div class="loading">No data found for ${esc(currentYear)}.</div>`;
    heroTitle.textContent = "All-Star Game";
    subLine.textContent = "";
    gameSelect.hidden = true;
    return;
  }

  if(yearObj.games.length > 1){
    gameSelect.hidden = false;
    gameSelect.innerHTML = yearObj.games.map(g =>
      `<option value="${g.game_number}">Game ${g.game_number}</option>`
    ).join("");
    if(currentGameNumber == null || !yearObj.games.some(g => g.game_number === currentGameNumber)){
      currentGameNumber = yearObj.games[0].game_number;
    }
    gameSelect.value = currentGameNumber;
  } else {
    gameSelect.hidden = true;
    currentGameNumber = yearObj.games[0].game_number;
  }

  const game = yearObj.games.find(g => g.game_number === currentGameNumber) || yearObj.games[0];
  const gi = game.game_info || {};

  heroTitle.textContent = `${currentYear} All-Star Game`;

  const nlScore = scoreFor(game.line_score, "NL");
  const alScore = scoreFor(game.line_score, "AL");
  const scoreText = (nlScore != null && alScore != null)
    ? `NL ${nlScore} – AL ${alScore}`
    : (gi.final_score_line || "");
  const metaParts = [scoreText, gi.date, gi.location].filter(Boolean);
  subLine.textContent = metaParts.join(" · ");

  const metaFields = [
    ["Attendance", gi.attendance],
    ["Time of Game", gi.time_of_game],
    ["Day/Night", gi.day_night],
    ["Umpires", gi.umpires],
  ].filter(([, v]) => v);

  const batting = game.batting || {};
  const pitching = game.pitching || {};

  content.innerHTML = `
    <div class="game-header">
      <div class="game-date">${esc(currentYear)} ALL-STAR GAME${yearObj.games.length > 1 ? ` · GAME ${game.game_number}` : ""}</div>
      <div class="game-score">
        <span class="nl">NL ${esc(nlScore ?? "–")}</span>
        <span class="dash">&ndash;</span>
        <span class="al">AL ${esc(alScore ?? "–")}</span>
      </div>
      <div class="meta-row">
        ${metaFields.map(([label, val]) => `<div><strong>${esc(label)}:</strong> ${esc(val)}</div>`).join("")}
      </div>
    </div>

    ${renderLineScore(game.line_score)}

    <div class="section-label">Batting</div>
    <div class="card-title nl"><span class="dot"></span>National League</div>
    ${renderStatTable(batting["National League"], BATTING_COLS)}
    <div class="card-title al"><span class="dot"></span>American League</div>
    ${renderStatTable(batting["American League"], BATTING_COLS)}

    <div class="section-label">Pitching</div>
    <div class="card-title nl"><span class="dot"></span>National League</div>
    ${renderStatTable(pitching["National League"], PITCHING_COLS)}
    <div class="card-title al"><span class="dot"></span>American League</div>
    ${renderStatTable(pitching["American League"], PITCHING_COLS)}
  `;
}
</script>
</body>
</html>
