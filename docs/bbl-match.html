<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#003366,#00a3cc);
  color:white;
  padding:36px 40px;
  border-radius:24px;
  margin-bottom:24px;
}
.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:10px;font-size:17px;opacity:0.95;}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
}
@media(min-width:980px){
  .grid{grid-template-columns:1fr 1fr;}
}

.card{
  border:1px solid #e2e8f0;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 18px rgba(0,0,0,.06);
}

.card-header{
  padding:14px 16px;
  background:#f3f6fb;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800;
  color:#003366;
}

.card-body{padding:14px 16px;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  padding:8px 10px;
  border-bottom:1px solid #e2e8f0;
}
th{background:#f8fbff;font-weight:800;}

tr:nth-child(even){background:#f8fbff;}

.small{font-size:13px;color:#475569;margin-top:10px;}

a.player{
  color:#003366;
  font-weight:700;
  text-decoration:none;
}
a.player:hover{text-decoration:underline;}

.error{
  background:#fff1f2;
  border:1px solid #fecdd3;
  color:#7f1d1d;
  padding:16px;
  border-radius:12px;
  font-weight:700;
}
</style>
</head>
