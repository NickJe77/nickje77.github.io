<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
.hero{background:linear-gradient(90deg,#003566,#0077b6);color:white;padding:40px 50px;border-radius:24px;margin-bottom:25px;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:30px;}
.summary-box{border:1px solid #ddd;border-radius:14px;padding:14px;background:#f8fbff;}
h2{margin-top:35px;color:#003566;}
table{width:100%;border-collapse:collapse;margin-bottom:25px;font-size:14px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;}
th{background:#f3f6fb;}
</style>
</head>

<body>
<div class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">
<div class="hero">
<h1>BBL Match</h1>
<p id="statusText">Loading match…</p>
</div>

<div class="summary-grid">
<div class="summary-box"><strong>Date</strong><span id="dateBox">—</span></div>
<div class="summary-box"><strong>Teams</strong><span id="teamsBox">—</span></div>
<div class="summary-box"><strong>Venue</strong><span id="venueBox">—</span></div>
<div class="summary-box"><strong>Winner</strong><span id="winnerBox">—</span></div>
<div class="summary-box"><strong>Result</strong><span id="resultBox">—</span></div>
</div>

<div id="inningsContainer"></div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
const fileParam=params.get("file");

const indexUrl="data/bbl/index.json";
const basePath="data/bbl/";
const nameMapUrl="data/bbl/player-names.json";

let nameMap={};

Promise.all([
  fetch(nameMapUrl).then(r=>r.json()),
  fetch(indexUrl).then(r=>r.json())
])
.then(([names,files])=>{
  nameMap=names;
  return Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json())));
})
.then(seasons=>{
  let match=null;
  seasons.forEach(season=>{
    season.forEach(m=>{
      if(m.file===fileParam) match=m;
    });
  });

  if(!match){document.getElementById("statusText").textContent="Match not found";return;}

  const info=match.info;
  document.getElementById("dateBox").textContent=formatDate(info.dates[0]);
  document.getElementById("teamsBox").textContent=info.teams.join(" vs ");
  document.getElementById("venueBox").textContent=info.venue||"—";
  document.getElementById("winnerBox").textContent=info.outcome?.winner||"—";

  let result="—";
  if(info.outcome?.by){
    if(info.outcome.by.runs) result="won by "+info.outcome.by.runs+" runs";
    if(info.outcome.by.wickets) result="won by "+info.outcome.by.wickets+" wickets";
  }
  document.getElementById("resultBox").textContent=result;

  renderInnings(match.innings);
});

function fullName(n){return nameMap[n]||n;}

function renderInnings(innings){
  const container=document.getElementById("inningsContainer");
  innings.forEach(inn=>{
    const batStats={},bowlStats={},outs={};
    let runs=0,wkts=0,balls=0;

    inn.overs.forEach(o=>{
      o.deliveries.forEach(d=>{
        const bat=d.batter, bowl=d.bowler;
        const batRuns=d.runs.batter;
        if(!batStats[bat]) batStats[bat]={runs:0,balls:0};
        batStats[bat].runs+=batRuns;
        if(!d.extras?.wides) batStats[bat].balls++;

        if(!bowlStats[bowl]) bowlStats[bowl]={runs:0,balls:0,wkts:0};
        bowlStats[bowl].runs+=d.runs.total;
        if(!d.extras?.wides && !d.extras?.noballs) bowlStats[bowl].balls++;

        if(d.wickets){
          d.wickets.forEach(w=>{
            if(w.kind!=="run out") bowlStats[bowl].wkts++;
            wkts++;
            outs[w.player_out]=w.kind+" b "+bowl;
          });
        }
        runs+=d.runs.total;
        balls++;
      });
    });

    let html=`<h2>${inn.team} Innings</h2>
    <p><strong>${runs}/${wkts}</strong></p>
    <table><tr><th>Batter</th><th>How out</th><th>R</th><th>B</th></tr>`;
    Object.entries(batStats).forEach(([p,s])=>{
      html+=`<tr><td>${fullName(p)}</td><td>${outs[p]||"not out"}</td><td>${s.runs}</td><td>${s.balls}</td></tr>`;
    });
    html+=`</table><table><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th></tr>`;
    Object.entries(bowlStats).forEach(([p,s])=>{
      html+=`<tr><td>${fullName(p)}</td><td>${Math.floor(s.balls/6)}.${s.balls%6}</td><td>${s.runs}</td><td>${s.wkts}</td></tr>`;
    });
    html+=`</table>`;
    container.innerHTML+=html;
  });
}

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
</script>
</body>
</html>
