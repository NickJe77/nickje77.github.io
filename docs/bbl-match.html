<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue1:#003366;
  --blue2:#00a3cc;
  --bg:#ffffff;
  --text:#0f172a;
  --muted:#475569;
  --border:#e2e8f0;
  --card:#ffffff;
  --row:#f8fbff;
}

body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 18px 60px;
}

.hero{
  background:linear-gradient(90deg,var(--blue1),var(--blue2));
  color:white;
  padding:34px 38px;
  border-radius:22px;
  margin-bottom:22px;
}
.hero h1{margin:0;font-size:42px;letter-spacing:-0.5px;}
.hero p{margin:10px 0 0;font-size:17px;opacity:0.95;line-height:1.35;}

.grid{
  display:grid;
  grid-template-columns: 1fr;
  gap:18px;
}
@media (min-width: 980px){
  .grid{ grid-template-columns: 1fr 1fr; }
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow: 0 8px 18px rgba(0,0,0,0.06);
}
.card-header{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  background: #f7fbff;
}
.card-header h2{
  margin:0;
  font-size:20px;
  color:var(--blue1);
}
.card-header .total{
  font-weight:800;
  color:var(--text);
}
.card-body{ padding:14px 16px; }

.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:14px; min-width: 560px; }
th, td{ padding:9px 10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
th{ background:#f3f6fb; font-weight:800; color:#0b2a55; }
tr:nth-child(even){ background:var(--row); }

.meta-line{
  margin-top:10px;
  color:rgba(255,255,255,0.95);
}
.small{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
  line-height:1.4;
}
