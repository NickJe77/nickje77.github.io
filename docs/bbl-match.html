<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --brand:#003566;
  --brand-light:#0077b6;
  --bg-alt:#f8fbff;
}

body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:var(--brand);
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,var(--brand),var(--brand-light));
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:10px;font-size:18px;opacity:.95}

.section{margin-top:34px;}
.section h2{
  color:var(--brand);
  margin-bottom:6px;
}

.total-line{
  font-weight:700;
  margin-bottom:10px;
}

/* TABLES */
table{
  width:100%;
  border-collapse:collapse;
