<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#003366,#00a3cc);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:10px;font-size:18px;opacity:0.95;}

.section{margin-top:30px;}
.section h2{margin-bottom:6px;color:#003366;}
.total-line{font-weight:700;margin-bottom:8px;}
.small-note{margin-top:6px;font-size:13px;}

.superover-title{
  margin-top:40px;
  padding:14px;
  background:#003366;
  color:white;
  text-align:center;
  border-radius:12px;
  font-size:20px;
  font-weight:700;
}

table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}

a.player-link{
  color:#003366;
  font-weight:600;
  text-decoration:none;
}
a.player-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl-player.html">BBL Players</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="matchTitle">Loading match…</h1>
  <p id="matchMeta"></p>
</div>

<div id="scorecard"></div>

</div>

<script>
const params = new URLSearchParams(location.search);
const file = params.get("file");
const index = parseInt(params.get("i"));

if(!file || isNaN(index)){
  document.getElementById("matchTitle").textContent = "No match selected";
  throw "Bad link";
}

let nameMap = {};

function displayName(name){
  return nameMap[name] || name;
}

function playerLink(name){
  const n = displayName(name);
  return `<a class="player-link" href="bbl-player.html?player=${encodeURIComponent(n)}">${n}</a>`;
}

Promise.all([
  fetch("data/bbl/"+file).then(r=>r.json()),
  fetch("data/bbl/player-names.json").then(r=>r.json())
])
.then(([season, names])=>{
  nameMap = names;

  // ✅ CORRECT STRUCTURE
  const match = season[index];

  if(!match){
    document.getElementById("matchTitle").textContent = "Match not found";
    return;
  }

  const info = match.info;
  const allInnings = match.innings;

  const normalInnings = allInnings.slice(0,2);
  const superOverInnings = allInnings.slice(2);

  document.getElementById("matchTitle").textContent = info.teams.join(" vs ");
  document.getElementById("matchMeta").textContent =
    (info.venue||"") + " • " + new Date(info.dates[0]).toDateString() +
    " • Winner: " + (info.outcome?.winner || "—") +
    (info.player_of_match ? " • Player of the Match: " + info.player_of_match.map(displayName).join(", ") : "");

  let html = "";

  function renderInnings(inn){
    const team = inn.team;
    const batMap = {};
    const bowlMap = {};
    const fall = [];
    const extras = {b:0, lb:0, w:0, nb:0, p:0};

    let teamRuns = 0;
    let teamWkts = 0;
    let legalBalls = 0;

    inn.overs.forEach((over,overIndex)=>{
      over.deliveries.forEach((d,ballIndex)=>{
        teamRuns += d.runs.total;
        if(!d.extras?.wides) legalBalls++;

        if(d.extras){
          if(d.extras.byes) extras.b += d.extras.byes;
          if(d.extras.legbyes) extras.lb += d.extras.legbyes;
          if(d.extras.wides) extras.w += d.extras.wides;
          if(d.extras.noballs) extras.nb += d.extras.noballs;
          if(d.extras.penalty) extras.p += d.extras.penalty;
        }

        if(d.batter){
          const batter = displayName(d.batter);
          batMap[batter] = batMap[batter] || {runs:0, balls:0, out:"not out"};
          batMap[batter].runs += d.runs.batter;
          if(!d.extras?.wides) batMap[batter].balls++;
        }

        if(d.bowler){
          const bowler = displayName(d.bowler);
          bowlMap[bowler] = bowlMap[bowler] || {runs:0, balls:0, wkts:0};
          bowlMap[bowler].balls++;
          if(!d.extras?.byes && !d.extras?.legbyes){
            bowlMap[bowler].runs += d.runs.total;
          }
        }

        if(d.wickets){
          d.wickets.forEach(w=>{
            teamWkts++;

            const batter = displayName(w.player_out);
            const bowler = displayName(d.bowler);
            const fielders = w.fielders?.map(f=>playerLink(displayName(f.name))).join(", ");

            let howOut = w.kind;
            if(w.kind==="caught") howOut = `c ${fielders} b ${playerLink(bowler)}`;
            else if(w.kind==="lbw") howOut = `lbw b ${playerLink(bowler)}`;
            else if(w.kind==="bowled") howOut = `b ${playerLink(bowler)}`;
            else if(w.kind==="run out") howOut = `run out (${fielders})`;
            else howOut = `${w.kind} b ${playerLink(bowler)}`;

            if(batMap[batter]) batMap[batter].out = howOut;
            if(bowlMap[bowler]) bowlMap[bowler].wkts++;

            const ballNo = ballIndex + 1;
            fall.push(`${teamRuns}/${teamWkts} (${batter}, ${overIndex}.${ballNo})`);
          });
        }
      });
    });

    const overs = (legalBalls/6).toFixed(1);
    const extrasTotal = extras.b+extras.lb+extras.w+extras.nb+extras.p;

    return `
    <div class="section">
      <h2>${team} Innings</h2>
      <div class="total-line">Total: ${teamRuns}/${teamWkts} (${overs} ov)</div>

      <table>
        <tr><th>Batter</th><th>How out</th><th>R</th><th>B</th><th>SR</th></tr>
        ${Object.entries(batMap).map(([p,s])=>{
          const sr = s.balls?((s.runs/s.balls)*100).toFixed(1):"—";
          return `<tr>
            <td>${playerLink(p)}</td>
            <td>${s.out}</td>
            <td>${s.runs}</td>
            <td>${s.balls}</td>
            <td>${sr}</td>
          </tr>`;
        }).join("")}
      </table>

      <div class="small-note">
        Extras: ${extrasTotal} (b ${extras.b}, lb ${extras.lb}, w ${extras.w}, nb ${extras.nb}, p ${extras.p})
      </div>

      <div class="small-note">
        Fall of wickets: ${fall.join(", ")}
      </div>
    </div>

    <div class="section">
      <h2>Bowling vs ${team}</h2>
      <table>
        <tr><th>Bowler</th><th>O</th><th>R</th><th>W</th></tr>
        ${Object.entries(bowlMap).map(([p,s])=>`
          <tr>
            <td>${playerLink(p)}</td>
            <td>${(s.balls/6).toFixed(1)}</td>
            <td>${s.runs}</td>
            <td>${s.wkts}</td>
          </tr>`).join("")}
      </table>
    </div>`;
  }

  normalInnings.forEach(inn=> html += renderInnings(inn));

  if(superOverInnings.length){
    html += `<div class="superover-title">SUPER OVER</div>`;
    superOverInnings.forEach(inn=> html += renderInnings(inn));
  }

  document.getElementById("scorecard").innerHTML = html;
});
</script>

</body>
</html>
