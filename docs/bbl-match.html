<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#003566,#0077b6);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:10px;font-size:18px;opacity:0.95;}

.section{margin-top:30px;}
.section h2{color:#003566;margin-bottom:6px;}
.total-line{font-weight:700;margin-bottom:8px;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}

.superover{
  margin-top:40px;
  padding:14px;
  background:#003566;
  color:white;
  text-align:center;
  border-radius:12px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="title">BBL Match</h1>
  <p id="meta">Loading match…</p>
</div>

<div id="scorecard"></div>

</div>

<script>
/* ================================
   DATA ROOT
================================ */
const DATA_ROOT = location.origin + "/data/bbl/";

/* ================================
   PARAMS
================================ */
const params = new URLSearchParams(window.location.search);
const file = params.get("file");

const titleEl = document.getElementById("title");
const metaEl = document.getElementById("meta");
const scorecard = document.getElementById("scorecard");

if (!file) {
  metaEl.textContent = "No match specified.";
  throw new Error("Missing file");
}

/* ================================
   LOAD MATCH (ONE MATCH PER FILE)
================================ */
fetch(DATA_ROOT + file)
  .then(r => r.json())
  .then(data => {
    const match = Array.isArray(data) ? data[0] : data;

    if (!match || !match.info) {
      metaEl.textContent = "Match data invalid.";
      return;
    }

    const info = match.info;

    titleEl.textContent = info.teams.join(" vs ");
    metaEl.textContent =
      `${info.venue || ""} • ${new Date(info.dates[0]).toDateString()} • Winner: ${info.outcome?.winner || "—"}`;

    let html = "";

    function renderInnings(inn){
      let runs=0,wkts=0,balls=0;
      const bat={}, bowl={};

      inn.overs.forEach(over=>{
        over.deliveries.forEach(d=>{
          runs += d.runs.total;
          if (!d.extras?.wides) balls++;

          if (d.batter){
            bat[d.batter] ??= {r:0,b:0,out:"not out"};
            bat[d.batter].r += d.runs.batter;
            if (!d.extras?.wides) bat[d.batter].b++;
          }

          if (d.bowler){
            bowl[d.bowler] ??= {r:0,b:0,w:0};
            bowl[d.bowler].b++;
            if (!d.extras?.byes && !d.extras?.legbyes){
              bowl[d.bowler].r += d.runs.total;
            }
          }

          if (d.wickets){
            d.wickets.forEach(w=>{
              wkts++;
              if (bat[w.player_out]) bat[w.player_out].out = w.kind;
              if (w.kind !== "run out" && bowl[d.bowler]) bowl[d.bowler].w++;
            });
          }
        });
      });

      html += `
      <div class="section">
        <h2>${inn.team} Innings</h2>
        <div class="total-line">${runs}/${wkts} (${(balls/6).toFixed(1)} ov)</div>
      </div>`;
    }

    match.innings.slice(0,2).forEach(renderInnings);

    if (match.innings.length > 2){
      html += `<div class="superover">SUPER OVER</div>`;
      match.innings.slice(2).forEach(renderInnings);
    }

    scorecard.innerHTML = html;
  })
  .catch(err=>{
    metaEl.textContent = "Failed to load match data.";
    console.error(err);
  });
</script>

</body>
</html>
