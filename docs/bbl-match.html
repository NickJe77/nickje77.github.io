<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#ffffff;
}

.navbar{
display:flex;
justify-content:center;
gap:26px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1200px;
margin:0 auto;
padding:30px 20px 60px;
}

.hero{
background:linear-gradient(90deg,#003366,#00a3cc);
color:#fff;
padding:34px 40px;
border-radius:24px;
margin-bottom:30px;
}

.hero h1{
margin:0;
font-size:40px;
}

.hero p{
margin-top:10px;
font-size:16px;
opacity:.95;
}

.error{
background:#fff1f2;
border:1px solid #fecdd3;
color:#7f1d1d;
padding:18px;
border-radius:12px;
font-weight:700;
}

/* INNINGS TITLE MATCH HERO */
.innings{
margin-bottom:36px;
}

.innings h2{
margin:0 0 10px;
font-size:28px;
font-weight:800;
background:linear-gradient(90deg,#003366,#00a3cc);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.total{
font-weight:700;
margin-bottom:10px;
font-size:16px;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
font-size:15px;
background:#ffffff;
border-radius:14px;
overflow:hidden;
margin-top:8px;
}

/* HEADER */
th{
background:linear-gradient(90deg,#003366,#00a3cc);
color:#ffffff;
padding:10px 12px;
font-weight:700;
text-align:left;
}

/* NUMERIC HEADERS */
th.num{
text-align:right;
}

/* CELLS */
td{
padding:10px 12px;
border-bottom:1px solid #e5e7eb;
}

/* NUMERIC CELLS */
td.num{
text-align:right;
font-variant-numeric:tabular-nums;
}

/* ZEBRA STRIPES */
tr:nth-child(even){
background:#f4f8fc;
}

/* PLAYER LINKS */
a.player{
color:#4b0082;
font-weight:700;
text-decoration:none;
}

a.player:hover{
text-decoration:underline;
}

.meta-line{
margin-top:8px;
font-size:14px;
}

.superover{
margin:30px 0;
padding:14px;
text-align:center;
font-weight:900;
letter-spacing:1px;
background:#0b2a55;
color:#fff;
border-radius:14px;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="bbl-season.html">BBL Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading match…</h1>
<p id="meta"></p>
</div>

<div id="content"></div>

</div>

<script>
(function(){

const title=document.getElementById("title");
const meta=document.getElementById("meta");
const out=document.getElementById("content");

let PLAYER_NAMES={};

function fail(msg){
title.textContent="ERROR";
out.innerHTML=`<div class="error">${msg}</div>`;
throw new Error(msg);
}

const params=new URLSearchParams(location.search);
const file=params.get("file");

if(!file) fail("Missing ?file parameter");

Promise.all([

fetch("data/bbl/"+file).then(r=>{
if(!r.ok) fail("Failed loading "+file);
return r.json();
}),

fetch("data/bbl/player-names.json").then(r=>{
if(!r.ok) return {};
return r.json();
})

])

.then(([data,names])=>{

PLAYER_NAMES=names||{};

let match=Array.isArray(data)?data[0]:data;

function full(n){
return PLAYER_NAMES[n]||n;
}

function pl(n){
return `<a class="player" href="bbl-player.html?player=${encodeURIComponent(n)}">${full(n)}</a>`;
}

function legal(d){
return !(d.extras&&(d.extras.wides||d.extras.noballs));
}

function overs(b){
return Math.floor(b/6)+"."+(b%6);
}

function dismiss(w,bowler){

const f=w.fielders?.map(x=>full(x.name)).join(", ");

switch(w.kind){

case "caught":return`c ${f} b ${full(bowler)}`;
case "bowled":return`b ${full(bowler)}`;
case "lbw":return`lbw b ${full(bowler)}`;
case "stumped":return`st ${f} b ${full(bowler)}`;
case "run out":return`run out (${f})`;
case "caught and bowled":return`c & b ${full(bowler)}`;
default:return w.kind;

}
}

function inningsTotal(inn){

let runs=0,wkts=0;

inn.overs.forEach(o=>{
o.deliveries.forEach(d=>{
runs+=d.runs.total;
if(d.wickets) wkts+=d.wickets.length;
});
});

return{runs,wkts};

}

let totals=match.innings.map(inn=>{
const t=inningsTotal(inn);
return{team:inn.team,runs:t.runs,wkts:t.wkts};
});

let resultLine="";

if(match.info.outcome?.winner){

const winner=match.info.outcome.winner;
const loser=match.info.teams.find(t=>t!==winner);

const w=totals.find(x=>x.team===winner);
const l=totals.find(x=>x.team===loser);

resultLine=`${winner} ${w.runs}/${w.wkts} defeated ${loser} ${l.runs}/${l.wkts}`;

}else{

resultLine=totals.map(x=>`${x.team} ${x.runs}/${x.wkts}`).join(" vs ");

}

title.textContent=resultLine;

meta.textContent=
match.info.venue+
" • "+
new Date(match.info.dates[0]).toDateString();

let html="";

match.innings.forEach((inn,i)=>{

let bat={},bowl={},fall=[];
let runs=0,wkts=0,balls=0;
let ex={b:0,lb:0,w:0,nb:0,p:0};

inn.overs.forEach(o=>{

let bi=0;

o.deliveries.forEach(d=>{

runs+=d.runs.total;

if(d.batter){

bat[d.batter]??={R:0,B:0,F4:0,F6:0,out:"not out"};

bat[d.batter].R+=d.runs.batter;

if(d.runs.batter===4)bat[d.batter].F4++;
if(d.runs.batter===6)bat[d.batter].F6++;

if(legal(d))bat[d.batter].B++;

}

if(d.extras){

ex.b+=d.extras.byes||0;
ex.lb+=d.extras.legbyes||0;
ex.w+=d.extras.wides||0;
ex.nb+=d.extras.noballs||0;

}

if(d.bowler){

bowl[d.bowler]??={balls:0,R:0,W:0};

if(legal(d))bowl[d.bowler].balls++;

bowl[d.bowler].R+=d.runs.total-
((d.extras?.byes||0)+(d.extras?.legbyes||0));

}

if(legal(d)){balls++;bi++;}

if(d.wickets){

d.wickets.forEach(w=>{

wkts++;

bat[w.player_out].out=dismiss(w,d.bowler);
bowl[d.bowler].W++;

fall.push(`${runs}/${wkts} (${full(w.player_out)}, ${o.over}.${bi})`);

});

}

});

});

html+=`

<div class="innings">

<h2>${inn.team} Innings</h2>

<div class="total">
Total: ${runs}/${wkts} (${overs(balls)} ov)
</div>

<table>

<tr>
<th>Batter</th>
<th>How out</th>
<th class="num">R</th>
<th class="num">B</th>
<th class="num">4s</th>
<th class="num">6s</th>
<th class="num">SR</th>
</tr>

${Object.entries(bat).map(([p,s])=>{

const sr=s.B?((s.R/s.B)*100).toFixed(1):"—";

return`<tr>
<td>${pl(p)}</td>
<td>${s.out}</td>
<td class="num">${s.R}</td>
<td class="num">${s.B}</td>
<td class="num">${s.F4}</td>
<td class="num">${s.F6}</td>
<td class="num">${sr}</td>
</tr>`;

}).join("")}

</table>

<div class="meta-line">
Extras: ${ex.b+ex.lb+ex.w+ex.nb}
</div>

<div class="meta-line">
Fall of wickets: ${fall.join(", ")}
</div>

<h3 style="margin-top:18px">Bowling vs ${inn.team}</h3>

<table>

<tr>
<th>Bowler</th>
<th class="num">O</th>
<th class="num">R</th>
<th class="num">W</th>
<th class="num">Econ</th>
</tr>

${Object.entries(bowl).map(([p,s])=>{

const econ=s.balls?(s.R/(s.balls/6)).toFixed(2):"—";

return`<tr>
<td>${pl(p)}</td>
<td class="num">${overs(s.balls)}</td>
<td class="num">${s.R}</td>
<td class="num">${s.W}</td>
<td class="num">${econ}</td>
</tr>`;

}).join("")}

</table>

</div>`;

});

out.innerHTML=html;

})

.catch(e=>fail(e.message));

})();
</script>

</body>
</html>
