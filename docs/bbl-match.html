<script>
const params = new URLSearchParams(location.search);
const file = params.get("file");
const matchIndex = parseInt(params.get("match"));

function legalBall(d){
  return !(d.extras && (d.extras.wides || d.extras.noballs));
}
function overs(balls){
  return Math.floor(balls/6)+"."+(balls%6);
}
function pl(n){
  return `<a class="player" href="bbl-player.html?player=${encodeURIComponent(n)}">${n}</a>`;
}
function dismissal(w, bowler){
  const f = w.fielders?.map(x=>x.name).join(", ");
  switch(w.kind){
    case "caught": return `c ${f} b ${bowler}`;
    case "bowled": return `b ${bowler}`;
    case "lbw": return `lbw b ${bowler}`;
    case "stumped": return `st ${f} b ${bowler}`;
    case "run out": return `run out (${f})`;
    default: return w.kind;
  }
}

fetch("data/bbl/"+file)
.then(r=>r.json())
.then(data=>{
  const match = Array.isArray(data)
    ? (isNaN(matchIndex)?data[0]:data[matchIndex])
    : data;

  const info = match.info;
  document.getElementById("title").textContent =
    info.teams.join(" vs ");
  document.getElementById("meta").textContent =
    info.venue+" • "+
    new Date(info.dates[0]).toDateString()+
    " • Winner: "+(info.outcome?.winner||"—");

  let html = "";

  match.innings.forEach((inn,i)=>{
