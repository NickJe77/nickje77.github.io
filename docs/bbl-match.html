<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#fff;
}

.navbar{
display:flex;
justify-content:center;
gap:26px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

.hero{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:34px 40px;
border-radius:24px;
margin-bottom:30px;
}

.hero h1{
margin:0;
font-size:40px;
}

.hero p{
margin-top:10px;
font-size:16px;
opacity:.95;
}

.error{
background:#fff1f2;
border:1px solid #fecdd3;
color:#7f1d1d;
padding:18px;
border-radius:12px;
font-weight:700;
}

.innings{
margin-bottom:36px;
}

.innings h2{
margin:0 0 6px;
color:#003566;
font-size:26px;
}

.total{
font-weight:700;
margin-bottom:10px;
}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th,td{
padding:8px 10px;
border-bottom:1px solid #e5e7eb;
}

th{
background:#f6f7fb;
text-align:left;
font-weight:800;
}

td.num{
text-align:right;
}

tr:nth-child(even){
background:#fbfcff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/cricket.html">Cricket</a>
<a href="/bbl.html">BBL</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading match…</h1>
<p id="meta"></p>
</div>

<div id="content"></div>

</div>

<script>

(function(){

const title=document.getElementById("title");
const meta=document.getElementById("meta");
const out=document.getElementById("content");

function fail(msg){
title.textContent="ERROR";
out.innerHTML=`<div class="error">${msg}</div>`;
throw new Error(msg);
}

const params=new URLSearchParams(location.search);

const file=params.get("file");
const matchIndex=parseInt(params.get("match")||"0");

if(!file) fail("Missing file parameter");

fetch("/data/bbl/"+file)

.then(r=>{
if(!r.ok) fail("Failed loading "+file);
return r.json();
})

.then(data=>{

if(!Array.isArray(data))
fail("Invalid match file");

if(matchIndex<0 || matchIndex>=data.length)
fail("Match index out of range");

const match=data[matchIndex];

if(!match.info)
fail("Match info missing");

title.textContent=match.info.teams.join(" vs ");

meta.textContent=
match.info.venue+" • "+
new Date(match.info.dates[0]).toDateString()+" • Winner: "+
(match.info.outcome?.winner || "—");

let html="";

match.innings.forEach(inn=>{

let runs=0, wkts=0, balls=0;

let bat={};

inn.overs.forEach(o=>{

o.deliveries.forEach(d=>{

runs+=d.runs.total;

if(d.batter){

bat[d.batter] ??= {R:0,B:0};

bat[d.batter].R+=d.runs.batter;

if(!(d.extras?.wides))
bat[d.batter].B++;

}

if(!(d.extras?.wides))
balls++;

if(d.wickets)
wkts+=d.wickets.length;

});

});

html+=`

<div class="innings">

<h2>${inn.team} Innings</h2>

<div class="total">
${runs}/${wkts} (${Math.floor(balls/6)}.${balls%6} ov)
</div>

<table>

<tr>
<th>Batter</th>
<th class="num">R</th>
<th class="num">B</th>
</tr>

${Object.entries(bat).map(([p,s])=>`
<tr>
<td>${p}</td>
<td class="num">${s.R}</td>
<td class="num">${s.B}</td>
</tr>
`).join("")}

</table>

</div>

`;

});

out.innerHTML=html;

})

.catch(e=>{
fail(e.message);
});

})();

</script>

</body>
</html>
