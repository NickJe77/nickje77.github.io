<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#003366;
  --secondary:#005b8f;
  --muted:#3b82b8;
}

body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#fff;
  color:var(--primary);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:26px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:var(--primary);
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#003366,#00a3cc);
  color:white;
  padding:36px 40px;
  border-radius:24px;
  margin-bottom:30px;
}
.hero h1{margin:0;font-size:40px;}
.hero p{margin-top:10px;font-size:16px;opacity:.95;}

.innings{margin-bottom:40px;}
.innings h2{margin:0 0 6px;font-size:26px;}
.total{font-weight:700;margin-bottom:10px;color:var(--secondary);}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  padding:8px 10px;
  border-bottom:1px solid #e5e7eb;
}
th{
  background:#f0f6fb;
  font-weight:800;
}
tr:nth-child(even){background:#f7fbff;}

a.player{
  color:var(--secondary);
  font-weight:700;
  text-decoration:none;
}
a.player:hover{color:var(--primary);text-decoration:underline;}

.meta-line{margin-top:8px;font-size:14px;color:var(--muted);}

.superover{
  margin:30px 0;
  padding:14px;
  text-align:center;
  font-weight:900;
  letter-spacing:1px;
  background:#0b2a55;
  color:white;
  border-radius:14px;
}

.error{
  background:#fff1f2;
  border:1px solid #fecdd3;
  color:#7f1d1d;
  padding:16px;
  border-radius:12px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl-season.html">BBL Seasons</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="title">BBL Match</h1>
  <p id="meta">Loading match…</p>
</div>

<div id="content">
  <p>Waiting for match data…</p>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  try {
    const params = new URLSearchParams(location.search);
    const file = params.get("file");
    const matchIndex = params.has("match") ? parseInt(params.get("match")) : 0;

    const titleEl = document.getElementById("title");
    const metaEl  = document.getElementById("meta");
    const content = document.getElementById("content");

    if(!file) throw new Error("Missing ?file= parameter");

    let NAME_MAP = {};

    function name(n){
      return NAME_MAP[n] || n;
    }

    function pl(n){
      return `<a class="player" href="bbl-player.html?player=${encodeURIComponent(name(n))}">${name(n)}</a>`;
    }

    function legalBall(d){
      return !(d.extras && (d.extras.wides || d.extras.noballs));
    }

    function overs(b){ return Math.floor(b/6)+"."+(b%6); }

    function dismissal(w,bowler){
      const f = w.fielders?.map(x=>name(x.name)).join(", ");
      const bw = name(bowler);
      switch(w.kind){
        case "caught": return `c ${f} b ${bw}`;
        case "bowled": return `b ${bw}`;
        case "lbw": return `lbw b ${bw}`;
        case "stumped": return `st ${f} b ${bw}`;
        case "run out": return `run out (${f})`;
        default: return w.kind;
      }
    }

    Promise.all([
      fetch("data/bbl/"+file).then(r=>r.json()),
      fetch("data/bbl/player-names.json").then(r=>r.json())
    ])
    .then(([data,names])=>{
      NAME_MAP = names || {};

      const match = Array.isArray(data) ? data[matchIndex] : data;
      if(!match || !match.innings) throw new Error("Invalid match data");

      const info = match.info;
      titleEl.textContent = info.teams.join(" vs ");
      metaEl.textContent =
        info.venue+" • "+
        new Date(info.dates[0]).toDateString()+
        " • Winner: "+(info.outcome?.winner||"—");

      let html = "";

      match.innings.forEach((inn,i)=>{
        if(i===2) html += `<div class="superover">SUPER OVER</div>`;

        let bat={}, bowl={}, fall=[];
        let runs=0, wkts=0, balls=0;
        let ex={b:0,lb:0,w:0,nb:0,p:0};

        inn.overs.forEach(o=>{
          let bo=0;
          o.deliveries.forEach(d=>{
            runs+=d.runs.total;

            if(d.extras){
              ex.b+=d.extras.byes||0;
              ex.lb+=d.extras.legbyes||0;
              ex.w+=d.extras.wides||0;
              ex.nb+=d.extras.noballs||0;
              ex.p+=d.extras.penalt
