<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#fff;
}

.navbar{
display:flex;
justify-content:center;
gap:26px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

.hero{
background:linear-gradient(90deg,#003566,#0077b6);
color:#fff;
padding:34px 40px;
border-radius:24px;
margin-bottom:30px;
}

.hero h1{
margin:0;
font-size:40px;
}

.hero p{
margin-top:10px;
font-size:16px;
opacity:.95;
}

.error{
background:#fff1f2;
border:1px solid #fecdd3;
color:#7f1d1d;
padding:18px;
border-radius:12px;
font-weight:700;
}

.innings{
margin-bottom:36px;
}

.innings h2{
margin:0 0 6px;
color:#003566;
font-size:26px;
}

.total{
font-weight:700;
margin-bottom:10px;
}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th,td{
padding:8px 10px;
border-bottom:1px solid #e5e7eb;
}

th{
background:#f6f7fb;
text-align:left;
font-weight:800;
}

td.num{
text-align:right;
}

tr:nth-child(even){
background:#fbfcff;
}

a.player{
color:#003566;
font-weight:700;
text-decoration:none;
}

a.player:hover{
text-decoration:underline;
}

.meta{
margin-top:8px;
font-size:14px;
}

</style>
</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/cricket.html">Cricket</a>
<a href="/bbl.html">BBL</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading match…</h1>
<p id="meta"></p>
</div>

<div id="content"></div>

</div>

<script>

(async function(){

const title=document.getElementById("title");
const meta=document.getElementById("meta");
const out=document.getElementById("content");

function fail(msg){
title.textContent="ERROR";
out.innerHTML=`<div class="error">${msg}</div>`;
throw new Error(msg);
}

const params=new URLSearchParams(location.search);

const file=params.get("file");
const matchIndex=parseInt(params.get("match")||"0");

if(!file) fail("Missing file parameter");

/* LOAD MATCH + PLAYER NAMES */

const [data, playerNames]=await Promise.all([

fetch("/data/bbl/"+file).then(r=>{
if(!r.ok) fail("Failed loading "+file);
return r.json();
}),

fetch("/data/bbl/player-names.json")
.then(r=>r.ok?r.json():{})

]);

if(!Array.isArray(data))
fail("Invalid match file");

if(matchIndex<0 || matchIndex>=data.length)
fail("Match index invalid");

const match=data[matchIndex];

title.textContent=match.info.teams.join(" vs ");

meta.textContent=
match.info.venue+" • "+
new Date(match.info.dates[0]).toDateString()+" • Winner: "+
(match.info.outcome?.winner || "—");

/* HELPERS */

function name(n){
return playerNames[n] || n;
}

function playerLink(n){
return `<a class="player" href="/bbl-player.html?player=${encodeURIComponent(n)}">${name(n)}</a>`;
}

function overs(balls){
return Math.floor(balls/6)+"."+(balls%6);
}

function legal(d){
return !(d.extras?.wides || d.extras?.noballs);
}

/* BUILD SCORECARD */

let html="";

match.innings.forEach(inn=>{

let bat={}, bowl={}, fall=[];
let runs=0,wkts=0,balls=0;

let ex={b:0,lb:0,w:0,nb:0,p:0};

inn.overs.forEach(o=>{

let ballInOver=0;

o.deliveries.forEach(d=>{

runs+=d.runs.total;

if(d.batter){

bat[d.batter]??={R:0,B:0,4:0,6:0,out:"not out"};

bat[d.batter].R+=d.runs.batter;

if(d.runs.batter===4) bat[d.batter][4]++;
if(d.runs.batter===6) bat[d.batter][6]++;

if(legal(d)) bat[d.batter].B++;

}

if(d.extras){

ex.b+=d.extras.byes||0;
ex.lb+=d.extras.legbyes||0;
ex.w+=d.extras.wides||0;
ex.nb+=d.extras.noballs||0;
ex.p+=d.extras.penalty||0;

}

if(d.bowler){

bowl[d.bowler]??={balls:0,R:0,W:0};

if(legal(d)) bowl[d.bowler].balls++;

bowl[d.bowler].R+=d.runs.total -
((d.extras?.byes||0)+(d.extras?.legbyes||0));

}

if(legal(d)){
balls++;
ballInOver++;
}

if(d.wickets){

d.wickets.forEach(w=>{

wkts++;

if(bat[w.player_out])
bat[w.player_out].out=w.kind;

if(bowl[d.bowler])
bowl[d.bowler].W++;

fall.push(`${runs}/${wkts} (${name(w.player_out)}, ${o.over}.${ballInOver})`);

});

}

});

});

/* RENDER */

html+=`

<div class="innings">

<h2>${inn.team} Innings</h2>

<div class="total">
${runs}/${wkts} (${overs(balls)} ov)
</div>

<table>

<tr>
<th>Batter</th>
<th>How out</th>
<th class="num">R</th>
<th class="num">B</th>
<th class="num">4s</th>
<th class="num">6s</th>
<th class="num">SR</th>
</tr>

${Object.entries(bat).map(([p,s])=>{

const sr=s.B?((s.R/s.B)*100).toFixed(1):"—";

return `
<tr>
<td>${playerLink(p)}</td>
<td>${s.out}</td>
<td class="num">${s.R}</td>
<td class="num">${s.B}</td>
<td class="num">${s[4]}</td>
<td class="num">${s[6]}</td>
<td class="num">${sr}</td>
</tr>
`;

}).join("")}

</table>

<div class="meta">
Extras: ${ex.b+ex.lb+ex.w+ex.nb+ex.p}
(b ${ex.b}, lb ${ex.lb}, w ${ex.w}, nb ${ex.nb})
</div>

<div class="meta">
Fall of wickets: ${fall.join(", ")}
</div>

<h3>Bowling vs ${inn.team}</h3>

<table>

<tr>
<th>Bowler</th>
<th class="num">O</th>
<th class="num">R</th>
<th class="num">W</th>
<th class="num">Econ</th>
</tr>

${Object.entries(bowl).map(([p,s])=>{

const econ=s.balls?(s.R/(s.balls/6)).toFixed(2):"—";

return `
<tr>
<td>${playerLink(p)}</td>
<td class="num">${overs(s.balls)}</td>
<td class="num">${s.R}</td>
<td class="num">${s.W}</td>
<td class="num">${econ}</td>
</tr>
`;

}).join("")}

</table>

</div>
`;

});

out.innerHTML=html;

})();

</script>

</body>
</html>
