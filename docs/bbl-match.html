<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#003366,#00a3cc);
  color:white;
  padding:36px 40px;
  border-radius:24px;
  margin-bottom:24px;
}
.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:10px;font-size:17px;opacity:0.95;}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
}
@media(min-width:980px){
  .grid{grid-template-columns:1fr 1fr;}
}

.card{
  border:1px solid #e2e8f0;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 8px 18px rgba(0,0,0,.06);
}

.card-header{
  padding:14px 16px;
  background:#f3f6fb;
  display:flex;
  justify-content:space-between;
  font-weight:800;
  color:#003366;
}

.card-body{padding:14px 16px;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  padding:8px 10px;
  border-bottom:1px solid #e2e8f0;
}
th{background:#f8fbff;font-weight:800;}

tr:nth-child(even){background:#f8fbff;}

.small{font-size:13px;color:#475569;margin-top:10px;}

a.player{
  color:#003366;
  font-weight:700;
  text-decoration:none;
}
a.player:hover{text-decoration:underline;}

.error{
  background:#fff1f2;
  border:1px solid #fecdd3;
  color:#7f1d1d;
  padding:16px;
  border-radius:12px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="bbl-season.html">BBL Seasons</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="title">Loading match…</h1>
  <p id="meta"></p>
</div>

<div id="content"></div>

</div>

<script>
const params = new URLSearchParams(location.search);
const file = params.get("file");
const matchIndex = parseInt(params.get("match"));

const titleEl = document.getElementById("title");
const metaEl = document.getElementById("meta");
const contentEl = document.getElementById("content");

if(!file){
  titleEl.textContent = "No match selected";
  throw new Error("Missing file parameter");
}

function legalBall(d){
  return !(d.extras && (d.extras.wides || d.extras.noballs));
}

function ballsToOvers(b){
  return Math.floor(b/6)+"."+(b%6);
}

function playerLink(name){
  return `<a class="player" href="bbl-player.html?player=${encodeURIComponent(name)}&file=${encodeURIComponent(file)}">${name}</a>`;
}

fetch("data/bbl/"+file)
.then(r=>{
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
})
.then(data=>{
  const match = Array.isArray(data)
    ? (isNaN(matchIndex)?data[0]:data[matchIndex])
    : data;

  if(!match || !match.innings) throw new Error("Invalid match data");

  const info = match.info;
  titleEl.textContent = info.teams.join(" vs ");
  metaEl.textContent =
    info.venue+" • "+
    new Date(info.dates[0]).toDateString()+
    " • Winner: "+(info.outcome?.winner||"—");

  let html = `<div class="grid">`;

  match.innings.forEach(inn=>{
    let bat={}, bowl={}, fall=[];
    let runs=0, wkts=0, balls=0;
    let extras={b:0,lb:0,w:0,nb:0,p:0};

    inn.overs.forEach(o=>{
      let ballInOver=0;

      o.deliveries.forEach(d=>{
        runs += d.runs.total;

        if(d.extras){
          extras.b += d.extras.byes||0;
          extras.lb += d.extras.legbyes||0;
          extras.w += d.extras.wides||0;
          extras.nb += d.extras.noballs||0;
          extras.p += d.extras.penalty||0;
        }

        if(d.batter){
          bat[d.batter] ??= {R:0,B:0,out:"not out"};
          bat[d.batter].R += d.runs.batter;
          if(legalBall(d)) bat[d.batter].B++;
        }

        if(d.bowler){
          bowl[d.bowler] ??= {balls:0,R:0,W:0};
          if(legalBall(d)) bowl[d.bowler].balls++;
          const byes = (d.extras?.byes||0)+(d.extras?.legbyes||0);
          bowl[d.bowler].R += d.runs.total - byes;
        }

        if(legalBall(d)){ balls++; ballInOver++; }

        if(d.wickets){
          d.wickets.forEach(w=>{
            wkts++;
            if(bat[w.player_out]) bat[w.player_out].out = w.kind;
            if(bowl[d.bowler]) bowl[d.bowler].W++;
            fall.push(`${runs}/${wkts} (${w.player_out}, ${o.over}.${ballInOver})`);
          });
        }
      });
    });

    html += `
    <div class="card">
      <div class="card-header">
        <div>${inn.team} Innings</div>
        <div>${runs}/${wkts} (${(balls/6).toFixed(1)} ov)</div>
      </div>
      <div class="card-body">
        <table>
          <tr><th>Batter</th><th>How out</th><th>R</th><th>B</th><th>SR</th></tr>
          ${Object.entries(bat).map(([p,s])=>{
            const sr=s.B?((s.R/s.B)*100).toFixed(1):"—";
            return `<tr>
              <td>${playerLink(p)}</td>
              <td>${s.out}</td>
              <td>${s.R}</td>
              <td>${s.B}</td>
              <td>${sr}</td>
            </tr>`;
          }).join("")}
        </table>

        <div class="small">
          Extras: ${extras.b+extras.lb+extras.w+extras.nb+extras.p}
        </div>

        <div class="small">
          Fall of wickets: ${fall.join(", ")}
        </div>

        <table style="margin-top:12px">
          <tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>
          ${Object.entries(bowl).map(([p,s])=>{
            const ov=s.balls/6;
            return `<tr>
              <td>${playerLink(p)}</td>
              <td>${ballsToOvers(s.balls)}</td>
              <td>${s.R}</td>
              <td>${s.W}</td>
              <td>${ov?(s.R/ov).toFixed(2):"—"}</td>
            </tr>`;
          }).join("")}
        </table>
      </div>
    </div>`;
  });

  html += `</div>`;
  contentEl.innerHTML = html;
})
.catch(err=>{
  titleEl.textContent = "ERROR";
  contentEl.innerHTML = `<div class="error">${err.message}</div>`;
});
</script>

</body>
</html>
