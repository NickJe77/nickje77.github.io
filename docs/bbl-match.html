<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --brand:#003566;
  --brand-light:#0077b6;
  --bg-alt:#f8fbff;
}

body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:var(--brand);
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,var(--brand),var(--brand-light));
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:10px;font-size:18px;opacity:.95}

.section{margin-top:34px;}
.section h2{
  color:var(--brand);
  margin-bottom:6px;
}

.total-line{
  font-weight:700;
  margin-bottom:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  margin-bottom:10px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:var(--bg-alt);}

.small-note{
  font-size:13px;
  margin-top:6px;
}

.superover{
  margin-top:40px;
  padding:14px;
  background:var(--brand);
  color:white;
  text-align:center;
  border-radius:12px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="title">BBL Match</h1>
  <p id="meta">Loading match…</p>
</div>

<div id="scorecard"></div>

</div>

<script>
const DATA_ROOT = location.origin + "/data/bbl/";
const params = new URLSearchParams(location.search);
const file = params.get("file");

const titleEl = document.getElementById("title");
const metaEl = document.getElementById("meta");
const scorecard = document.getElementById("scorecard");

if(!file){
  metaEl.textContent = "No match specified.";
  throw new Error("Missing file");
}

fetch(DATA_ROOT + file)
  .then(r=>r.json())
  .then(data=>{
    const match = Array.isArray(data) ? data[0] : data;
    const info = match.info;

    /* ---------- HEADER ---------- */
    titleEl.textContent = info.teams.join(" vs ");

    let resultText = "No result";
    if(info.outcome?.winner){
      if(info.outcome.by?.runs)
        resultText = `${info.outcome.winner} won by ${info.outcome.by.runs} runs`;
      else if(info.outcome.by?.wickets)
        resultText = `${info.outcome.winner} won by ${info.outcome.by.wickets} wickets`;
    }

    metaEl.textContent =
      `${info.venue} • ${new Date(info.dates[0]).toDateString()} • ${resultText}` +
      (info.player_of_match ? ` • Player of the Match: ${info.player_of_match.join(", ")}` : "") +
      (info.toss ? ` • Toss: ${info.toss.winner} (${info.toss.decision})` : "");

    let html = "";

    function dismissalText(w, bowler){
      if(w.kind==="bowled") return `b ${bowler}`;
      if(w.kind==="lbw") return `lbw b ${bowler}`;
      if(w.kind==="caught"){
        const f = w.fielders?.map(f=>f.name).join(", ");
        return `c ${f} b ${bowler}`;
      }
      if(w.kind==="stumped"){
        const f = w.fielders?.[0]?.name || "";
        return `st ${f} b ${bowler}`;
      }
      if(w.kind==="run out"){
        const f = w.fielders?.map(f=>f.name).join(", ");
        return `run out (${f})`;
      }
      return w.kind;
    }

    function renderInnings(inn){
      let runs=0,wkts=0,balls=0;
      const bat={}, bowl={};
      const extras={b:0,lb:0,w:0,nb:0,p:0};
      const fall=[];

      inn.overs.forEach((over,oi)=>{
        over.deliveries.forEach((d,bi)=>{
          runs+=d.runs.total;
          if(!d.extras?.wides) balls++;

          if(d.extras){
            if(d.extras.byes) extras.b+=d.extras.byes;
            if(d.extras.legbyes) extras.lb+=d.extras.legbyes;
            if(d.extras.wides) extras.w+=d.extras.wides;
            if(d.extras.noballs) extras.nb+=d.extras.noballs;
            if(d.extras.penalty) extras.p+=d.extras.penalty;
          }

          if(d.batter){
            bat[d.batter] ??= {r:0,b:0,f4:0,f6:0,out:"not out"};
            bat[d.batter].r+=d.runs.batter;
            if(!d.extras?.wides) bat[d.batter].b++;
            if(d.runs.batter===4) bat[d.batter].f4++;
            if(d.runs.batter===6) bat[d.batter].f6++;
          }

          if(d.bowler){
            bowl[d.bowler] ??= {r:0,b:0,w:0};
            bowl[d.bowler].b++;
            if(!d.extras?.byes && !d.extras?.legbyes)
              bowl[d.bowler].r+=d.runs.total;
          }

          if(d.wickets){
            d.wickets.forEach(w=>{
              wkts++;
              bat[w.player_out].out = dismissalText(w,d.bowler);
              if(w.kind!=="run out") bowl[d.bowler].w++;
              fall.push(`${runs}/${wkts} (${w.player_out}, ${oi}.${bi+1})`);
            });
          }
        });
      });

      const overs=(balls/6).toFixed(1);
      const extrasTotal=extras.b+extras.lb+extras.w+extras.nb+extras.p;

      html+=`
      <div class="section">
        <h2>${inn.team} Innings</h2>
        <div class="total-line">${runs}/${wkts} (${overs} ov)</div>

        <table>
          <tr><th>Batter</th><th>How out</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
          ${Object.entries(bat).map(([p,s])=>`
            <tr>
              <td>${p}</td>
              <td>${s.out}</td>
              <td>${s.r}</td>
              <td>${s.b}</td>
              <td>${s.f4}</td>
              <td>${s.f6}</td>
              <td>${s.b?((s.r/s.b)*100).toFixed(1):"—"}</td>
            </tr>`).join("")}
        </table>

        <div class="small-note">Extras: ${extrasTotal}</div>
        <div class="small-note">Fall of wickets: ${fall.join(", ")}</div>

        <table>
          <tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>
          ${Object.entries(bowl).map(([p,s])=>`
            <tr>
              <td>${p}</td>
              <td>${(s.b/6).toFixed(1)}</td>
              <td>${s.r}</td>
              <td>${s.w}</td>
              <td>${(s.r/(s.b/6)).toFixed(2)}</td>
            </tr>`).join("")}
        </table>
      </div>`;
    }

    match.innings.slice(0,2).forEach(renderInnings);

    if(match.innings.length>2){
      html+=`<div class="superover">SUPER OVER</div>`;
      match.innings.slice(2).forEach(renderInnings);
    }

    scorecard.innerHTML=html;
  })
  .catch(e=>{
    metaEl.textContent="Failed to load match.";
    console.error(e);
  });
</script>

</body>
</html>
