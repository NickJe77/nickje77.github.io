<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

/* NAVBAR */
.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* HERO */
.hero{
position:relative;
height:280px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
overflow:hidden;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
top:0;
left:0;
z-index:0;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(180deg,rgba(0,0,0,0.55),rgba(0,0,0,0.65));
z-index:1;
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero p{
margin-top:10px;
font-size:18px;
opacity:0.95;
}

/* WRAP */
.wrap{
max-width:1100px;
margin:0 auto;
padding:40px 20px;
}

/* TILE GRID */
.tiles{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:22px;
}

/* TILE STYLE */
.tile{
background:#fff;
border-radius:18px;
padding:28px;
text-align:center;
font-weight:700;
font-size:20px;
cursor:pointer;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
transition:0.2s;
}

.tile:hover{
transform:translateY(-4px);
box-shadow:0 12px 28px rgba(0,0,0,0.12);
}

.tile span{
display:block;
margin-top:8px;
font-size:14px;
font-weight:500;
color:#666;
}

/* MOBILE */
@media(max-width:900px){
.tiles{grid-template-columns:1fr;}
.hero{height:220px;}
.hero h1{font-size:32px;}
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html">Tennis</a>
</div>

<!-- HERO WITH YOUR IMAGE -->
<div class="hero">

<img src="/images/tennis-hero.jpg" alt="Tennis">

<div class="hero-content">
<h1>Tennis</h1>
<p>ATP & WTA Results, Players & Head-to-Head</p>
</div>

</div>

<div class="wrap">

<div class="tiles">

<div class="tile" onclick="location.href='tennis-tournaments.html'">
Tournaments
<span>All events by year</span>
</div>

<div class="tile" onclick="location.href='tennis-players.html'">
Players
<span>Profiles & match history</span>
</div>

<div class="tile" onclick="location.href='tennis-h2h.html'">
Head to Head
<span>Compare any two players</span>
</div>

</div>

</div>

</body>
</html>
