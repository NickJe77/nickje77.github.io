<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tennis | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui,Arial;margin:0;background:#f5f5f5;}
.navbar{display:flex;justify-content:center;gap:20px;padding:15px;background:#fff;border-bottom:1px solid #ddd;}
.wrap{max-width:1100px;margin:auto;padding:20px;}
select,input{padding:10px;border-radius:8px;border:1px solid #ccc;margin:5px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;}
.card{background:#fff;padding:15px;border-radius:12px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1);}
.card:hover{transform:translateY(-2px);}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}
</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html">Tennis</a>
</div>

<div class="wrap">

<h1>Tennis</h1>

<select id="yearSelect"></select> <input id="searchInput" placeholder="Search tournaments">

<div id="grid" class="grid"></div>

</div>

<script>

const yearSelect = document.getElementById("yearSelect");
const grid = document.getElementById("grid");

for(let y=new Date().getFullYear(); y>=1968; y--){
  let o=document.createElement("option");
  o.value=y; o.textContent=y;
  yearSelect.appendChild(o);
}

async function loadYear(year){

  const res = await fetch(`data/tennis/matches/${year}.json`);
  const data = await res.json();

  const map = {};

  data.forEach(m=>{
    if(!map[m.tournament]){
      map[m.tournament] = m.surface;
    }
  });

  render(Object.entries(map), year);
}

function render(events, year){

  const q = document.getElementById("searchInput").value.toLowerCase();

  const filtered = events.filter(([name]) =>
    name.toLowerCase().includes(q)
  );

  grid.innerHTML = filtered.map(([name,surface])=>`
    <div class="card" onclick="openEvent('${name}','${year}')">
      <h3>${name}</h3>
      <div>${surface || ""}</div>
    </div>
  `).join("");
}

function openEvent(name,year){
  window.location = `tennis-event.html?year=${year}&event=${encodeURIComponent(name)}`;
}

yearSelect.onchange = ()=>loadYear(yearSelect.value);
document.getElementById("searchInput").oninput = ()=>loadYear(yearSelect.value);

loadYear(new Date().getFullYear());

</script>

</body>
</html>
