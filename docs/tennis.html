<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

/* HERO */
.hero{
  background:linear-gradient(120deg,#1b5e20,#2e7d32,#43a047);
  color:white;
  padding:60px 20px;
  text-align:center;
}

.hero h1{
  margin:0;
  font-size:44px;
  letter-spacing:-1px;
}

.hero p{
  margin-top:12px;
  font-size:18px;
  opacity:0.95;
}

/* WRAP */
.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:40px 20px;
}

/* 🔥 TILES (UPGRADED) */
.tiles{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:24px;
}

/* CARD STYLE */
.tile{
  position:relative;
  border-radius:20px;
  padding:40px 20px;
  text-align:center;
  font-weight:800;
  font-size:20px;
  cursor:pointer;
  color:white;
  overflow:hidden;
  transition:.25s;
}

/* gradients per tile */
.tile.tournaments{
  background:linear-gradient(135deg,#1565c0,#42a5f5);
}

.tile.players{
  background:linear-gradient(135deg,#6a1b9a,#ab47bc);
}

.tile.h2h{
  background:linear-gradient(135deg,#ef6c00,#ffa726);
}

.tile.davis{
  background:linear-gradient(135deg,#2e7d32,#66bb6a);
}

.tile:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 14px 40px rgba(0,0,0,0.2);
}

/* subtle overlay */
.tile::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,255,255,0.05);
}

/* subtitle */
.tile span{
  display:block;
  margin-top:10px;
  font-size:13px;
  font-weight:600;
  opacity:0.9;
}

/* MOBILE */
@media(max-width:900px){
  .tiles{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html">Tennis</a>
</div>

<div class="hero">
<h1>Tennis</h1>
<p>ATP & WTA Results, Players & Head-to-Head</p>
</div>

<div class="wrap">

<div class="tiles">

  <div class="tile tournaments"
    onclick="location.href='tennis-tournaments.html'">
    Tournaments
    <span>All events by year</span>
  </div>

  <div class="tile players"
    onclick="location.href='tennis-players.html'">
    Players
    <span>Profiles & match history</span>
  </div>

  <div class="tile h2h"
    onclick="location.href='tennis-h2h.html'">
    Head to Head
    <span>Compare any two players</span>
  </div>

  <div class="tile davis"
    onclick="location.href='davis-cup.html'">
    Davis Cup
    <span>International competition</span>
  </div>

</div>

</div>

</body>
</html>
