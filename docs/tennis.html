<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#1b5e20;
  --green-2:#2e7d32;
  --green-3:#43a047;
  --light:#f5f7f5;
  --card:#ffffff;
  --border:#d9e2d9;
  --text:#172117;
  --muted:#5f6b5f;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#f7faf7 0%,#eef5ef 100%);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:18px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #e3e8e3;
  font-weight:700;
}

.navbar a{color:#1e4ed8;text-decoration:none;}
.navbar a.active{color:var(--green);}

.hero{
  background:linear-gradient(90deg,#1b5e20,#2e7d32,#43a047);
  color:#fff;
  padding:48px 20px;
  text-align:center;
  box-shadow:var(--shadow);
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:20px;
}

select,input{
  padding:12px;
  border-radius:12px;
  border:1px solid #cfd8cf;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 34px rgba(0,0,0,.1);
}

.event-name{
  font-size:20px;
  font-weight:900;
  margin-bottom:10px;
}

.pill{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:#e9f5ea;
  font-size:12px;
  font-weight:800;
}

.empty-state{
  grid-column:1 / -1;
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:var(--shadow);
  color:var(--muted);
  text-align:center;
  font-weight:700;
}

.h2h-box{
  grid-column:1 / -1;
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:var(--shadow);
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr;}
  .controls{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html" class="active">Tennis</a>
</nav>

<header class="hero">
<h1>Tennis</h1>
<p>Full match database (ATP + WTA)</p>
</header>

<div class="wrap">

<div class="controls">
<select id="yearSelect"></select>
<input id="searchInput" placeholder="Search tournaments">
<select id="surfaceSelect">
<option value="all">All Surfaces</option>
</select>
</div>

<!-- 🔥 HEAD TO HEAD -->
<div class="h2h-box">
  <h2 style="margin-top:0;">Head to Head</h2>
  <div style="display:flex; gap:10px; margin-bottom:10px;">
    <input id="p1" placeholder="Player 1">
    <input id="p2" placeholder="Player 2">
    <button onclick="runH2H()" style="padding:10px 16px;border-radius:10px;border:none;background:#1e4ed8;color:#fff;font-weight:700;cursor:pointer;">
      Compare
    </button>
  </div>
  <div id="h2hResult"></div>
</div>

<div id="grid" class="grid"></div>

</div>

<script>
const yearSelect = document.getElementById("yearSelect");
const grid = document.getElementById("grid");

let rawEvents = [];

// YEARS
for(let y=new Date().getFullYear(); y>=1968; y--){
  let o=document.createElement("option");
  o.value=y;
  o.textContent=y;
  yearSelect.appendChild(o);
}

// LOAD YEAR
async function loadYear(year){
  let data = [];

  try{
    let res = await fetch(`/data/tennis/seasons/${year}.json`);
    if(!res.ok){
      res = await fetch(`/docs/data/tennis/seasons/${year}.json`);
    }
    if(!res.ok){
      rawEvents = [];
      populateSurface();
      applyFilters();
      return;
    }
    data = await res.json();
  }catch(err){
    rawEvents = [];
    populateSurface();
    applyFilters();
    return;
  }

  const matches = Array.isArray(data) ? data : (data.matches || []);
  const map = {};

  matches.forEach(m=>{
    if(!m.score || !m.score.includes("-")) return;

    const name = (m.tournament || m.event || "Unknown").trim();

    if(name.toLowerCase().includes("davis cup")) return;

    const surface = (m.surface || "").trim();
    const date = m.date || "";

    if(!map[name]){
      map[name] = {name, surface, year, date};
    }else{
      if(date && (!map[name].date || date < map[name].date)){
        map[name].date = date;
      }
    }
  });

  rawEvents = Object.values(map).sort((a,b)=>{
    if(!a.date) return 1;
    if(!b.date) return -1;
    return new Date(a.date) - new Date(b.date);
  });

  populateSurface();
  applyFilters();
}

// SURFACE FILTER
function populateSurface(){
  const surfaces = [...new Set(rawEvents.map(e=>e.surface).filter(Boolean))].sort();

  const select = document.getElementById("surfaceSelect");
  select.innerHTML = '<option value="all">All Surfaces</option>';

  surfaces.forEach(s=>{
    const opt=document.createElement("option");
    opt.value=s;
    opt.textContent=s;
    select.appendChild(opt);
  });
}

// FILTERS
function applyFilters(){
  const q = document.getElementById("searchInput").value.toLowerCase();
  const surface = document.getElementById("surfaceSelect").value;

  const filtered = rawEvents.filter(e=>{
    const matchSearch = !q || e.name.toLowerCase().includes(q);
    const matchSurface = surface==="all" || e.surface===surface;
    return matchSearch && matchSurface;
  });

  render(filtered);
}

// RENDER
function render(events){
  grid.innerHTML = "";

  if(!events.length){
    grid.innerHTML = `<div class="empty-state">No tournaments found for this year.</div>`;
    return;
  }

  events.forEach(e => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="event-name">${e.name}</div>
      <div class="pill">${e.surface || ""}</div>
    `;

    card.onclick = () => {
      window.location = `tennis-event.html?tournament=${encodeURIComponent(e.name)}&year=${e.year}`;
    };

    grid.appendChild(card);
  });
}

// 🔥 HEAD TO HEAD
async function runH2H(){

  const p1 = document.getElementById("p1").value.toLowerCase().trim();
  const p2 = document.getElementById("p2").value.toLowerCase().trim();
  const year = yearSelect.value;

  if(!p1 || !p2){
    alert("Enter two players");
    return;
  }

  let data = [];

  try{
    let res = await fetch(`/data/tennis/seasons/${year}.json`);
    if(!res.ok){
      res = await fetch(`/docs/data/tennis/seasons/${year}.json`);
    }
    data = await res.json();
  }catch(e){
    document.getElementById("h2hResult").innerHTML = "Error loading data";
    return;
  }

  const matches = Array.isArray(data) ? data : (data.matches || []);

  const h2hMatches = matches.filter(m => {
    const a = (m.player1 || m.winner || "").toLowerCase();
    const b = (m.player2 || m.loser || "").toLowerCase();

    return (
      (a.includes(p1) && b.includes(p2)) ||
      (a.includes(p2) && b.includes(p1))
    );
  });

  if(!h2hMatches.length){
    document.getElementById("h2hResult").innerHTML =
      `<div class="empty-state">No head-to-head matches found</div>`;
    return;
  }

  let p1Wins = 0;
  let p2Wins = 0;

  h2hMatches.forEach(m => {
    const score = m.score || "";
    if(!score.includes("-")) return;

    let p1Sets = 0;
    let p2Sets = 0;

    score.split(" ").forEach(set=>{
      const [x,y] = set.split("-");
      if(parseInt(x) > parseInt(y)) p1Sets++;
      else p2Sets++;
    });

    const a = (m.player1 || m.winner || "").toLowerCase();

    if(a.includes(p1)){
      if(p1Sets > p2Sets) p1Wins++;
      else p2Wins++;
    }else{
      if(p1Sets > p2Sets) p2Wins++;
      else p1Wins++;
    }
  });

  h2hMatches.sort((a,b)=> new Date(b.date) - new Date(a.date));

  let html = `
    <div style="font-weight:900;margin-bottom:10px;">
      ${p1.toUpperCase()} ${p1Wins} - ${p2Wins} ${p2.toUpperCase()}
    </div>

    <table style="width:100%;border-collapse:collapse;">
      <thead>
        <tr>
          <th>Date</th>
          <th>Tournament</th>
          <th>Player 1</th>
          <th>Player 2</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
  `;

  h2hMatches.forEach(m=>{
    html += `
      <tr>
        <td>${m.date || ""}</td>
        <td>${m.tournament || m.event || ""}</td>
        <td>${m.player1 || m.winner || ""}</td>
        <td>${m.player2 || m.loser || ""}</td>
        <td>${m.score || ""}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;

  document.getElementById("h2hResult").innerHTML = html;
}

// EVENTS
yearSelect.onchange = ()=>loadYear(yearSelect.value);
document.getElementById("searchInput").oninput = applyFilters;
document.getElementById("surfaceSelect").onchange = applyFilters;

// INIT
yearSelect.value = new Date().getFullYear();
loadYear(yearSelect.value);
</script>

</body>
</html>
