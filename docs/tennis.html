<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
margin:0;
font-family:var(--body);
background:var(--bg);
color:var(--ink);
-webkit-font-smoothing:antialiased;
}
.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:15px;
border-bottom:1px solid var(--line);
background:var(--surface);
font-weight:600;
font-size:13.5px;
}
.navbar a{
color:var(--ink);
text-decoration:none;
opacity:.7;
transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
opacity:1;
color:var(--accent);
}
.hero{
position:relative;
height:260px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#fff;
overflow:hidden;
}
.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
top:0;
left:0;
z-index:0;
}
.hero::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(160deg,rgba(12,19,15,.72),rgba(12,19,15,.85));
z-index:1;
}
.hero-content{
position:relative;
z-index:2;
}
.eyebrow{
font-family:var(--body);
font-size:11.5px;
font-weight:600;
letter-spacing:.16em;
text-transform:uppercase;
color:var(--accent);
margin-bottom:10px;
display:block;
}
.hero h1{
margin:0;
font-family:var(--display);
font-weight:600;
font-size:clamp(28px,5vw,42px);
letter-spacing:.01em;
text-transform:uppercase;
}
.hero p{
margin-top:10px;
font-size:14px;
color:rgba(255,255,255,.68);
}
.wrap{
max-width:1100px;
margin:0 auto;
padding:34px 20px 70px;
}
.tiles{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
gap:18px;
max-width:900px;
margin:0 auto;
justify-content:center;
}
.tile{
background:var(--surface);
border:1px solid var(--line);
border-radius:var(--radius);
padding:26px;
text-align:center;
font-family:var(--display);
font-weight:600;
font-size:18px;
letter-spacing:.01em;
text-transform:uppercase;
color:var(--ink);
cursor:pointer;
transition:.2s;
}
.tile:hover{
transform:translateY(-3px);
border-color:var(--accent);
background:var(--accent-soft);
}
.tile span{
display:block;
margin-top:8px;
font-family:var(--body);
font-size:13px;
font-weight:500;
text-transform:none;
letter-spacing:normal;
color:var(--muted);
}
@media(max-width:900px){
.tiles{grid-template-columns:1fr;}
.hero{height:220px;}
}
</style>
