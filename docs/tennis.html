<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

/* HERO */
.hero{
  background:linear-gradient(90deg,#1b5e20,#2e7d32);
  color:white;
  padding:50px 20px;
  text-align:center;
}

.hero h1{
  margin:0;
  font-size:42px;
}

.hero p{
  margin-top:10px;
  font-size:18px;
  opacity:0.9;
}

/* WRAP */
.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px;
}

/* TILES */
.tiles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-bottom:30px;
}

.tile{
  background:#fff;
  border-radius:18px;
  padding:30px;
  text-align:center;
  font-weight:800;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,0.08);
  transition:0.2s;
}

.tile:hover{
  transform:translateY(-4px);
}

/* H2H BOX */
.h2h-box{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,0.08);
}

.h2h-inputs{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.h2h-inputs input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

.h2h-inputs button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:#0056d6;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.result{
  margin-top:15px;
  font-weight:700;
}

/* MOBILE */
@media(max-width:900px){
  .tiles{grid-template-columns:1fr;}
  .h2h-inputs{flex-direction:column;}
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="tennis.html">Tennis</a>
</div>

<div class="hero">
  <h1>Tennis</h1>
  <p>ATP & WTA Results, Players & Head-to-Head</p>
</div>

<div class="wrap">

  <!-- 🔥 MAIN NAVIGATION -->
  <div class="tiles">
    <div class="tile" onclick="location.href='tennis-tournaments.html'">
      Tournaments
    </div>

    <div class="tile" onclick="location.href='tennis-players.html'">
      Players
    </div>

    <div class="tile" onclick="location.href='tennis-h2h.html'">
      Head to Head
    </div>
  </div>

  <!-- 🔥 QUICK H2H TOOL -->
  <div class="h2h-box">
    <h2 style="margin:0;">Quick Head-to-Head</h2>

    <div class="h2h-inputs">
      <input id="p1" placeholder="Player 1">
      <input id="p2" placeholder="Player 2">
      <button onclick="quickH2H()">Compare</button>
    </div>

    <div id="result" class="result"></div>
  </div>

</div>

<script>

// 🔥 QUICK H2H (light version)
async function quickH2H(){

  const p1 = document.getElementById("p1").value.toLowerCase().trim();
  const p2 = document.getElementById("p2").value.toLowerCase().trim();

  if(!p1 || !p2){
    alert("Enter two players");
    return;
  }

  let totalMatches = 0;

  // check last few years quickly (fast load)
  const years = [2026,2025,2024];

  for(const y of years){
    try{
      let res = await fetch(`/data/tennis/seasons/${y}.json`);
      if(!res.ok) continue;

      let data = await res.json();
      const matches = Array.isArray(data) ? data : (data.matches || []);

      matches.forEach(m=>{
        const a = (m.player1 || m.winner || "").toLowerCase();
        const b = (m.player2 || m.loser || "").toLowerCase();

        if(
          (a.includes(p1) && b.includes(p2)) ||
          (a.includes(p2) && b.includes(p1))
        ){
          totalMatches++;
        }
      });

    }catch(e){}
  }

  document.getElementById("result").innerHTML =
    totalMatches
      ? `${p1.toUpperCase()} vs ${p2.toUpperCase()} — ${totalMatches} recent matches`
      : "No recent matches found";
}

</script>

</body>
</html>
