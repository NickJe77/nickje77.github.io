<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Bundesliga Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --league:#c99a3d;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

/* ── Hero (club-colour identity, kept per-player's current club) ─ */
.hero{padding:44px 20px 56px;text-align:center;color:#fff;position:relative;box-shadow:0 18px 40px -18px rgba(10,16,24,.4);}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:10px;
  text-shadow:0 1px 3px rgba(0,0,0,.3);
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,5.5vw,50px);
  line-height:1.05;letter-spacing:.01em;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.25);
}
.hero p{margin-top:10px;font-size:14px;font-weight:600;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.25);}

.search-wrap{max-width:480px;margin:24px auto 0;position:relative;}
.search-input{
  width:100%;padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);font-size:14px;font-weight:600;box-sizing:border-box;outline:none;color:#fff;
  font-family:var(--body);
}
.search-input::placeholder{color:rgba(255,255,255,.6);}
.search-input:focus{border-color:#fff;background:rgba(255,255,255,.18);}

.search-results{
  position:absolute;top:100%;left:0;right:0;background:var(--surface);border-radius:12px;
  overflow:hidden;box-shadow:0 18px 40px -18px rgba(10,16,24,.4);z-index:999;display:none;margin-top:8px;
}
.search-item{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600;color:var(--ink);font-size:13.5px;}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:#f0f6ff;}
.search-item small{color:var(--muted);font-weight:600;margin-left:8px;}

.container{max-width:1500px;margin:0 auto;padding:26px 20px 70px;}

.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
.section-title{
  font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:20px;color:var(--muted);
}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;text-align:center;}
.stat-value{font-family:var(--display);font-weight:600;font-size:32px;line-height:1;margin-bottom:8px;color:var(--ink);}
.stat-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}

select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;
  background:var(--surface);color:var(--ink);min-width:220px;
}

table{width:100%;border-collapse:collapse;}
th{background:#f7f9fb;padding:12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);}
td{padding:12px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;color:#27313c;}
tr:last-child td{border-bottom:none;}
.team-link{text-decoration:none;font-weight:700;color:var(--league);}
.team-link:hover{color:var(--accent);text-decoration:underline;}

.loading,.error{padding:100px 20px;text-align:center;font-family:var(--display);font-size:24px;font-weight:600;text-transform:uppercase;letter-spacing:.01em;color:var(--muted);}
.error{color:#c0362c;}

@media(max-width:900px){
  .hero h1{font-size:32px;}
  .hero p{font-size:14px;}
  .stat-value{font-size:26px;}
  table{display:block;overflow-x:auto;white-space:nowrap;}
}
</style>
</head>
<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/bundesliga.html">Bundesliga</a>
<a href="/bundesliga-teams.html">Teams</a>
<a href="/bundesliga-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div id="page">
<div class="loading">Loading Player...</div>
</div>

<script>

const TEAM_COLOURS = {
  "Bayern Munich":            "linear-gradient(135deg,#DC052D,#0066B2)",
  "Borussia Dortmund":        "linear-gradient(135deg,#FDE100,#000000)",
  "Bayer Leverkusen":         "linear-gradient(135deg,#E32221,#000000)",
  "RB Leipzig":               "linear-gradient(135deg,#DD0741,#001A3C)",
  "Borussia Mönchengladbach": "linear-gradient(135deg,#000000,#FFFFFF)",
  "Eintracht Frankfurt":      "linear-gradient(135deg,#E1000F,#000000)",
  "VfB Stuttgart":            "linear-gradient(135deg,#E32219,#FFFFFF)",
  "SC Freiburg":              "linear-gradient(135deg,#E8000D,#000000)",
  "Union Berlin":             "linear-gradient(135deg,#EB1923,#005CA9)",
  "Werder Bremen":            "linear-gradient(135deg,#1D9053,#FFFFFF)",
  "Hoffenheim":               "linear-gradient(135deg,#1961AC,#FFFFFF)",
  "Wolfsburg":                "linear-gradient(135deg,#65B32E,#003F2D)",
  "Augsburg":                 "linear-gradient(135deg,#BA3733,#007A3D)",
  "Mainz 05":                 "linear-gradient(135deg,#C3001E,#FFFFFF)",
  "Köln":                     "linear-gradient(135deg,#FF0000,#FFFFFF)",
  "Hertha Berlin":            "linear-gradient(135deg,#003CA6,#FFFFFF)",
  "Hamburger SV":             "linear-gradient(135deg,#0B4EA2,#FFFFFF)",
  "Schalke 04":               "linear-gradient(135deg,#004D9D,#FFFFFF)",
  "Hannover 96":              "linear-gradient(135deg,#009F4D,#000000)",
  "Darmstadt 98":             "linear-gradient(135deg,#003F86,#FFFFFF)",
  "Heidenheim":               "linear-gradient(135deg,#E8000D,#003F86)",
  "Holstein Kiel":            "linear-gradient(135deg,#D00B16,#003D8F)",
  "St. Pauli":                "linear-gradient(135deg,#5B1213,#FFFFFF)",
};

function slugify(str){
    return (str||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function playerSlug(p){
  if(p.player_id) return p.player_id;
  const name=slugify(p.name||'');
  const firstTeam=slugify((p.teams&&p.teams[0])||'');
  return firstTeam?`${name}--${firstTeam}`:name;
}

const params    = new URLSearchParams(window.location.search);
const slugParam = params.get("player") || '';
const page      = document.getElementById("page");

async function loadPlayer(){
    try{
        page.innerHTML = '<div class="loading">Loading player data...</div>';
        const res = await fetch("/data/bundesliga/players.json");
        if(!res.ok) throw new Error(`players.json returned ${res.status}`);
        const players = await res.json();

        // Try player_id first, then name-based slug fallbacks
        let player = players.find(p => p.player_id === slugParam);
        if(!player) player = players.find(p => playerSlug(p) === slugParam);
        if(!player) player = players.find(p => slugify(p.name) === slugParam);
        if(!player){
            const namePart = slugParam.split('--')[0];
            player = players.find(p => slugify(p.name) === namePart);
        }

        if(!player){
            page.innerHTML = `<div class="error">Player Not Found</div>`;
            return;
        }

        const playerDisplayName = player.name;
        const currentTeam       = (player.teams && player.teams[player.teams.length-1]) || "Unknown";
        const heroGradient      = TEAM_COLOURS[currentTeam] || 'linear-gradient(135deg,#111,#444)';

        page.innerHTML = `
            <div class="hero" style="background:${heroGradient};">
                <div class="eyebrow">Bundesliga Player</div>
                <h1>${playerDisplayName}</h1>
                <p>Bundesliga Player Profile</p>
                <div class="search-wrap">
                    <input type="text" class="search-input" id="playerSearch"
                           placeholder="Search player..." autocomplete="off">
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>

            <div class="container">
                <div class="section">
                    <div class="section-title">Career Summary</div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" style="font-size:22px;">${currentTeam}</div>
                            <div class="stat-label">Club</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.seasons?player.seasons.length:0}</div>
                            <div class="stat-label">Seasons</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.goals||0}</div>
                            <div class="stat-label">Goals</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.penalties||0}</div>
                            <div class="stat-label">Penalties</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.yellow_cards||0}</div>
                            <div class="stat-label">Yellow Cards</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.red_cards||0}</div>
                            <div class="stat-label">Red Cards</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Season by Season</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Season</th>
                                <th>Team</th>
                                <th>Goals</th>
                                <th>Penalties</th>
                                <th>Yellow Cards</th>
                                <th>Red Cards</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(player.season_stats||[]).map(s => `
                                <tr>
                                    <td><a class="team-link" href="/bundesliga-season.html?season=${s.season}">${s.season}</a></td>
                                    <td><a class="team-link" href="/bundesliga-team.html?team=${encodeURIComponent(s.team||'')}">${s.team||''}</a></td>
                                    <td>${s.goals||0}</td>
                                    <td>${s.penalties||0}</td>
                                    <td>${s.yellow_cards||0}</td>
                                    <td>${s.red_cards||0}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        const playerSearch  = document.getElementById("playerSearch");
        const searchResults = document.getElementById("searchResults");

        playerSearch.addEventListener("input", () => {
            const value = playerSearch.value.toLowerCase().trim();
            if(!value){ searchResults.style.display="none"; return; }
            const matches = players.filter(p=>(p.name||'').toLowerCase().includes(value)).slice(0,8);
            if(!matches.length){ searchResults.style.display="none"; return; }
            searchResults.innerHTML = matches.map(p=>`
                <div class="search-item"
                     onclick="window.location.href='/bundesliga-player.html?player=${encodeURIComponent(playerSlug(p))}'">
                    ${p.name}
                    <small>${(p.teams&&p.teams[0])||''}</small>
                </div>
            `).join('');
            searchResults.style.display="block";
        });

        document.addEventListener("click", e=>{
            if(!e.target.closest(".search-wrap")) searchResults.style.display="none";
        });

    }catch(err){
        console.error(err);
        page.innerHTML=`<div class="error">Failed To Load Player Data</div>`;
    }
}

loadPlayer();
</script>
</body>
</html>
