<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Football World Cup – Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
h1{text-align:center;margin-bottom:25px;}

.selector{display:flex;gap:14px;justify-content:center;margin-bottom:30px;flex-wrap:wrap;}

select{
padding:10px;
font-size:16px;
border-radius:6px;
border:1px solid #ccc;
min-width:200px;
}

button{
padding:10px 18px;
font-size:16px;
border:none;
border-radius:6px;
cursor:pointer;
background:#0056d6;
color:white;
font-weight:600;
}
button:hover{background:#003f9e;}

.summary{
border:1px solid #ddd;
border-radius:10px;
padding:14px;
background:#fafafa;
margin-bottom:20px;
font-weight:600;
text-align:center;
}

.leaders{
border:1px solid #ddd;
border-radius:10px;
padding:14px;
background:#f9fbff;
margin-bottom:24px;
font-weight:600;
}
.leaders h3{text-align:center;margin:0 0 10px 0;}
.leader-line{font-size:14px;padding:4px 0;border-bottom:1px solid #eee;}
.leader-line:last-child{border-bottom:none;}

.match{
border:1px solid #ddd;
border-radius:10px;
padding:14px;
margin-bottom:16px;
background:white;
}
.match h3{margin:0 0 6px 0;}
.small{font-size:13px;color:#555;}

.team-link{color:#0056d6;text-decoration:none;font-weight:600;}
.team-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="world-cup-countries.html">Countries</a>
<a href="world-cup-year.html">By Year</a>
</div>

<div class="page-wrap">

<h1>World Cup – Head to Head</h1>

<div class="selector">
<select id="teamA"></select>
<select id="teamB"></select>
<button onclick="compare()">Compare</button>
</div>

<div id="summary"></div>
<div id="scorers"></div>
<div id="results"></div>

</div>

<script>
const COUNTRY_PAGE="world-cup-country.html";

let allMatches=[];
let countrySet=new Set();

/* ---------- NORMALISE ---------- */
function normalizeTeam(name){
 if(!name) return "";
 let n=String(name).replace(/\u00A0/g," ").trim();
 let k=n.toLowerCase();
 if(k.includes("west germany")) return "Germany";
 if(k==="frg") return "Germany";
 return n;
}

/* ---------- HELPERS ---------- */
function parseEvent(str){
 if(!str) return null;
 const s=str.trim();
 if(!s) return null;
 const m=s.match(/^(.*?)\s*\(([^)]+)\)$/);
 if(m) return {name:m[1].trim(),tag:m[2].trim()};
 return {name:s,tag:null};
}

/* ---------- LOAD ---------- */
fetch("data/world-cup.json",{cache:"no-store"})
.then(r=>r.json())
.then(rows=>{
 normalise(rows);
 buildSelectors();
});

function normalise(rows){
 let cur=null;

 rows.forEach(r=>{
  if(r.Team){
   cur={
    year:r.Year,
    round:r.Round,
    team1:normalizeTeam(r.Team),
    team2:normalizeTeam(r.Team__1),
    score:r["Final Score"],
    winner:normalizeTeam(r["Winnning Team"]),
    events:[]
   };
   allMatches.push(cur);
   countrySet.add(cur.team1);
   countrySet.add(cur.team2);
  }

  if(cur && r.Scorers){
   cur.events.push(r.Scorers);
  }
 });
}

function buildSelectors(){
 const a=document.getElementById("teamA");
 const b=document.getElementById("teamB");

 Array.from(countrySet)
  .filter(c=>c)
  .sort((x,y)=>x.localeCompare(y))
  .forEach(c=>{
   a.add(new Option(c,c));
   b.add(new Option(c,c));
  });
}

function compare(){
 const a=document.getElementById("teamA").value;
 const b=document.getElementById("teamB").value;

 if(!a||!b||a===b) return;

 const matches=allMatches.filter(m=>
  (m.team1===a && m.team2===b) ||
  (m.team1===b && m.team2===a)
 );

 render(a,b,matches);
}

function render(a,b,matches){

 let winsA=0,winsB=0,draws=0;
 let scorers={};

 matches.forEach(m=>{
  if(m.winner===a) winsA++;
  else if(m.winner===b) winsB++;
  else draws++;

  m.events.forEach(e=>{
   const p=parseEvent(e);
   if(p && p.name){
    scorers[p.name]=(scorers[p.name]||0)+1;
   }
  });
 });

 const topScorers=Object.entries(scorers)
  .sort((x,y)=>y[1]-x[1])
  .slice(0,5);

 document.getElementById("summary").innerHTML=`
  <div class="summary">
   <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(a)}">${a}</a>
   vs
   <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(b)}">${b}</a><br>
   ${winsA} Wins – ${winsB} Wins – ${draws} Draws
  </div>
 `;

 document.getElementById("scorers").innerHTML=`
  <div class="leaders">
   <h3>Top Scorers in this Match-Up</h3>
   ${topScorers.length
     ? topScorers.map(s=>`<div class="leader-line">${s[0]} – ${s[1]}</div>`).join("")
     : "<div class='leader-line'>No goals recorded</div>"}
  </div>
 `;

 const out=document.getElementById("results");
 out.innerHTML="";

 matches.sort((x,y)=>x.year-y.year).forEach(m=>{
  const div=document.createElement("div");
  div.className="match";

  div.innerHTML=`
   <h3>
    <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.team1)}">${m.team1}</a>
    ${m.score}
    <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.team2)}">${m.team2}</a>
   </h3>
   <div class="small">${m.year} – ${m.round}</div>
   <div class="small">Winner:
    ${m.winner
      ? `<a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.winner)}">${m.winner}</a>`
      : "Draw"}
   </div>
  `;
  out.appendChild(div);
 });
}
</script>

</body>
</html>
