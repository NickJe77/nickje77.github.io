<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Australia Stakes Debug</title>
<style>
body{font-family:Arial;background:#111;color:#0f0;padding:20px;}
pre{white-space:pre-wrap;word-break:break-all;background:#000;padding:10px;border-radius:6px;}
</style>
</head>
<body>

<h2>Australia Stakes JSON Loader</h2>

<div id="log"></div>
<pre id="dump"></pre>

<script>
const log = msg => document.getElementById("log").innerHTML += msg+"<br>";
const dump = document.getElementById("dump");

const paths = [
  "/data/australia-stakes.json",
  "data/australia-stakes.json",
  "docs/data/australia-stakes.json",
  "/docs/data/australia-stakes.json"
];

async function run(){
  for(const p of paths){
    try{
      log("Trying: "+p);
      const r = await fetch(p,{cache:"no-store"});
      log("Status: "+r.status);

      const t = await r.text();
      log("Length: "+t.length);

      dump.innerText = t.slice(0,1000);

      const j = JSON.parse(t);
      log("PARSED OK. Records: "+j.length);
      return;
    }catch(e){
      log("FAILED: "+e.message);
    }
  }
  log("NO PATH WORKED");
}

run();
</script>

</body>
</html>
