<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Australia Stakes Results | The Sporting Almanac</title>
<link rel="stylesheet" href="racing.css">
<link rel="stylesheet" href="archive.css">
</head>

<body class="archive-page">

<div class="page-hero">
  <img src="images/breeders-cup-hero.jpg" alt="Australia Stakes">
  <div class="page-hero-title">AUSTRALIA STAKES</div>
</div>

<div class="filters-row">

  <select id="yearFilter" onchange="applyFilters()">
    <option value="">Year</option>
  </select>

  <input list="raceList" id="raceSearch" placeholder="Race" oninput="applyFilters()">
  <datalist id="raceList"></datalist>

  <input list="trainerList" id="trainerSearch" placeholder="Trainer" oninput="applyFilters()">
  <datalist id="trainerList"></datalist>

  <input list="jockeyList" id="jockeySearch" placeholder="Jockey" oninput="applyFilters()">
  <datalist id="jockeyList"></datalist>

</div>

<div class="table-container">
  <table class="results-table">
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Track</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>
</div>

<script src="australia-stakes.js"></script>

</body>
</html>
