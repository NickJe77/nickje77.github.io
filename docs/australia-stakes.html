<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Australia Stakes Results | The Sporting Almanac</title>
<link rel="stylesheet" href="racing.css">
</head>

<body>

<div class="hero-banner">
  <img src="images/breeders-cup-hero.jpg" alt="Australia Stakes">
  <div class="hero-title">AUSTRALIA STAKES</div>
</div>

<div class="filter-bar">

  <select id="yearFilter" onchange="applyFilters()">
    <option value="">All Years</option>
  </select>

  <input list="raceList" id="raceSearch" placeholder="Type race name" oninput="applyFilters()">
  <datalist id="raceList"></datalist>

  <input list="trainerList" id="trainerSearch" placeholder="Type trainer name" oninput="applyFilters()">
  <datalist id="trainerList"></datalist>

  <input list="jockeyList" id="jockeySearch" placeholder="Type jockey name" oninput="applyFilters()">
  <datalist id="jockeyList"></datalist>

</div>

<div class="table-card">
  <table class="results-table">
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Track</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>
</div>

<script src="australia-stakes.js"></script>

</body>
</html>
