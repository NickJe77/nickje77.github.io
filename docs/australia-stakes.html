<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Australia — Stakes Racing | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="racing.css">

<style>
.wrap{max-width:1200px;margin:auto;padding:16px;}
.status{padding:14px;font-weight:700;color:#ffb000;}
pre{white-space:pre-wrap;word-break:break-all;background:#111;color:#0f0;padding:12px;border-radius:10px;margin-top:10px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{padding:8px;border-top:1px solid #333;color:white;}
</style>
</head>

<body>

<div class="wrap">
<h2>Australia — Stakes Racing (Debug Mode)</h2>

<div id="status" class="status">Starting…</div>
<pre id="dump"></pre>

<table>
<thead>
<tr>
<th>Track</th><th>Date</th><th>Race</th><th>Distance</th>
<th>Winner</th><th>Margin</th><th>SP</th>
<th>Grade</th><th>Jockey</th><th>Trainer</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
const URL = "data/australia-stakes.json";
const status = document.getElementById("status");
const dump = document.getElementById("dump");
const tbody = document.getElementById("tbody");

async function run(){
  try{
    status.innerText = "Fetching: " + URL;

    const res = await fetch(URL,{cache:"no-store"});
    status.innerText = "HTTP status: " + res.status;

    const text = await res.text();

    dump.innerText = text.slice(0,1000);

    let data;
    try{
      data = JSON.parse(text);
    }catch(e){
      status.innerText = "JSON PARSE ERROR: " + e.message;
      return;
    }

    status.innerText = "Parsed records: " + data.length;

    tbody.innerHTML="";
    data.slice(0,20).forEach(r=>{
      tbody.innerHTML+=`
<tr>
<td>${r.track}</td>
<td>${r.date}</td>
<td>${r.race}</td>
<td>${r.distance}</td>
<td>${r.winner}</td>
<td>${r.margin}</td>
<td>${r.sp}</td>
<td>${r["race grade"] || r.grade}</td>
<td>${r.jockey}</td>
<td>${r.trainer}</td>
</tr>`;
    });

  }catch(err){
    status.innerText = "SCRIPT ERROR: " + err.message;
  }
}

run();
</script>

</body>
</html>
