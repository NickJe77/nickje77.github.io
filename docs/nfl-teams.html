<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Inter,system-ui,Arial,sans-serif;
background:#edf1f5;
color:#111827;
}

.navbar{
display:flex;
justify-content:center;
gap:30px;
padding:14px;
background:white;
border-bottom:1px solid #dbe2ea;
font-weight:700;
position:sticky;
top:0;
z-index:1000;
}

.navbar a{
text-decoration:none;
color:#013369;
font-size:15px;
transition:.2s;
}

.navbar a:hover{
color:#d50a0a;
}

.hero{
background:
radial-gradient(circle at top right, rgba(255,255,255,.08), transparent 35%),
linear-gradient(135deg,#013369 0%,#d50a0a 100%);
padding:70px 20px 60px;
text-align:center;
color:white;
}

.hero h1{
margin:0;
font-size:64px;
font-weight:900;
letter-spacing:-2px;
}

.hero p{
margin-top:14px;
font-size:18px;
font-weight:600;
opacity:.95;
}

.container{
max-width:1300px;
margin:-35px auto 40px;
padding:0 20px;
position:relative;
z-index:5;
}

.teams-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:24px;
}

.team-card{
background:white;
border-radius:24px;
overflow:hidden;
text-decoration:none;
color:#111827;
box-shadow:0 10px 30px rgba(0,0,0,.08);
transition:.25s ease;
border:1px solid #e5eaf1;
}

.team-card:hover{
transform:translateY(-6px);
box-shadow:0 18px 40px rgba(0,0,0,.14);
}

.team-header{
padding:34px 24px;
color:white;
position:relative;
overflow:hidden;
}

.team-header::after{
content:"";
position:absolute;
width:220px;
height:220px;
background:rgba(255,255,255,.08);
border-radius:50%;
top:-100px;
right:-60px;
}

.team-name{
font-size:30px;
font-weight:900;
line-height:1.1;
position:relative;
z-index:2;
}

.team-sub{
margin-top:10px;
font-size:14px;
font-weight:700;
opacity:.92;
position:relative;
z-index:2;
text-transform:uppercase;
letter-spacing:1px;
}

.team-body{
padding:24px;
}

.team-stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.stat-box{
background:#f8fbff;
border-radius:16px;
padding:18px;
text-align:center;
border:1px solid #e4ebf3;
}

.stat-label{
font-size:12px;
font-weight:800;
text-transform:uppercase;
letter-spacing:1px;
color:#013369;
margin-bottom:8px;
}

.stat-value{
font-size:28px;
font-weight:900;
color:#111827;
}

@media(max-width:700px){

.hero h1{
font-size:42px;
}

.container{
padding:0 14px;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/nfl.html">NFL</a>
<a href="/nfl-seasons.html">Seasons</a>
</div>

<div class="hero">
<h1>NFL Teams</h1>
<p>Select a franchise to view all-time leaders, records and statistics</p>
</div>

<div class="container">

<div class="teams-grid" id="teamsGrid"></div>

</div>
