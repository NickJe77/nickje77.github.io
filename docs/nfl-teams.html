<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
margin:0;
font-family:var(--body);
background:var(--bg);
color:var(--ink);
-webkit-font-smoothing:antialiased;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:15px;
background:var(--surface);
border-bottom:1px solid var(--line);
font-weight:600;
font-size:13.5px;
position:sticky;
top:0;
z-index:1000;
}

.navbar a{
text-decoration:none;
color:var(--ink);
opacity:.7;
transition:opacity .15s,color .15s;
}

.navbar a:hover,.navbar a[aria-current="page"]{
opacity:1;
color:var(--accent);
}

.hero{
background:linear-gradient(160deg,var(--board-2),var(--board));
padding:52px 20px 44px;
text-align:center;
color:#fff;
}

.hero h1{
margin:0;
font-family:var(--display);
font-weight:600;
font-size:clamp(38px,7vw,54px);
letter-spacing:.01em;
text-transform:uppercase;
}

.hero p{
margin-top:12px;
font-size:14.5px;
color:rgba(255,255,255,.68);
}

.container{
max-width:1300px;
margin:0 auto 70px;
padding:26px 20px 0;
}

.teams-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.team-card{
background:var(--surface);
border-radius:var(--radius);
overflow:hidden;
text-decoration:none;
color:var(--ink);
transition:.25s ease;
border:1px solid var(--line);
}

.team-card:hover{
transform:translateY(-5px);
box-shadow:0 16px 32px -16px rgba(10,16,24,.3);
}

.team-header{
padding:30px 22px;
color:#fff;
position:relative;
overflow:hidden;
}

.team-header::after{
content:"";
position:absolute;
width:220px;
height:220px;
background:rgba(255,255,255,.08);
border-radius:50%;
top:-100px;
right:-60px;
}

.team-name{
font-family:var(--display);
font-size:24px;
font-weight:600;
line-height:1.15;
position:relative;
z-index:2;
text-transform:uppercase;
letter-spacing:.01em;
}

.team-sub{
margin-top:8px;
font-size:12px;
font-weight:700;
opacity:.9;
position:relative;
z-index:2;
text-transform:uppercase;
letter-spacing:.06em;
}

.team-body{
padding:20px;
}

.team-stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.stat-box{
background:var(--accent-soft);
border-radius:14px;
padding:16px;
text-align:center;
}

.stat-label{
font-size:10.5px;
font-weight:600;
text-transform:uppercase;
letter-spacing:.06em;
color:var(--ink);
margin-bottom:8px;
}

.stat-value{
font-family:var(--display);
font-size:22px;
font-weight:600;
color:var(--ink);
}

@media(max-width:700px){

.container{
padding:20px 14px 0;
}

}

</style>

</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>

  <a href="./tennis.html">Tennis</a>

</html>
