<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NRL | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.page{
  max-width:1000px;
  margin:auto;
  padding:30px 20px 60px;
}
.hero{
  background:linear-gradient(90deg,#0055A4,#00A651);
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}
.hero h1{
  margin:0;
  font-size:40px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}
.card{
  background:white;
  padding:20px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.05);
}
.card h2{
  margin:0;
  font-size:28px;
}
.button{
  display:inline-block;
  margin-top:20px;
  padding:10px 18px;
  border-radius:10px;
  background:#0056d6;
  color:white;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="afl.html">AFL</a>
  <a href="nrl.html" style="color:#000;">NRL</a>
</nav>

<div class="page">

  <div class="hero">
    <h1>National Rugby League</h1>
    <div id="range"></div>
  </div>

  <div class="cards">
    <div class="card">
      <h2 id="seasons">-</h2>
      <div>Seasons</div>
    </div>
    <div class="card">
      <h2 id="matches">-</h2>
      <div>Matches</div>
    </div>
    <div class="card">
      <h2 id="rows">-</h2>
      <div>Player Games</div>
    </div>
  </div>

  <a class="button" href="nrl-year.html">Browse Seasons</a>

</div>

<script>
fetch("data/nrl/index.json")
.then(r=>r.json())
.then(d=>{
  document.getElementById("seasons").textContent=d.season_count;
  document.getElementById("matches").textContent=d.total_matches;
  document.getElementById("rows").textContent=d.total_player_rows;
  document.getElementById("range").textContent=d.first_season+" - "+d.last_season;
});
</script>

</body>
</html>
