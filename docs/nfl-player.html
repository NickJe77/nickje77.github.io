<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#edf1f5;
color:#111827;
}

.navbar{
display:flex;
justify-content:center;
gap:30px;
padding:14px;
background:white;
border-bottom:1px solid #dbe2ea;
font-weight:700;
position:sticky;
top:0;
z-index:1000;
}

.navbar a{
text-decoration:none;
color:#013369;
font-size:15px;
transition:.2s;
}

.navbar a:hover{
color:#d50a0a;
}

.hero{
background:
radial-gradient(circle at top right, rgba(255,255,255,.08), transparent 35%),
linear-gradient(135deg,#013369 0%,#d50a0a 100%);
padding:70px 20px 55px;
text-align:center;
position:relative;
overflow:hidden;
box-shadow:0 4px 20px rgba(0,0,0,.15);
transition:background .4s ease;
}

.hero h1{
margin:0;
font-size:68px;
font-weight:900;
letter-spacing:-2px;
color:white;
position:relative;
z-index:2;
line-height:1;
}

.hero-sub{
margin-top:14px;
font-size:18px;
font-weight:700;
color:rgba(255,255,255,.92);
position:relative;
z-index:2;
text-transform:uppercase;
}

.container{
max-width:1220px;
margin:-35px auto 40px;
background:white;
padding:34px;
border-radius:30px;
box-shadow:0 10px 35px rgba(0,0,0,.12);
position:relative;
z-index:5;
}

.search-row{
display:flex;
justify-content:center;
gap:14px;
flex-wrap:wrap;
margin-bottom:28px;
}

input,select{
padding:14px 16px;
font-size:15px;
border-radius:14px;
border:1px solid #d7dee8;
background:#f8fafc;
min-width:210px;
font-weight:600;
transition:.2s;
outline:none;
}

input:focus,
select:focus{
border-color:#2563eb;
background:white;
box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

.section-title{
font-size:18px;
font-weight:900;
margin-top:28px;
margin-bottom:18px;
color:#0f172a;
text-transform:uppercase;
letter-spacing:1.2px;
border-left:5px solid #013369;
padding-left:12px;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:18px;
margin-bottom:10px;
}

.box{
background:linear-gradient(180deg,#ffffff,#f8fbff);
padding:24px 18px;
border-radius:18px;
border:1px solid #e8edf4;
box-shadow:
0 2px 6px rgba(0,0,0,.04),
0 8px 24px rgba(0,0,0,.05);
transition:.2s ease;
}

.box:hover{
transform:translateY(-3px);
}

.box b{
display:block;
font-size:13px;
margin-bottom:12px;
color:#013369;
text-transform:uppercase;
letter-spacing:1px;
font-weight:800;
}

.big-stat{
font-size:52px;
font-weight:900;
line-height:1;
letter-spacing:-2px;
color:#111827;
}

.sub-stat{
margin-top:10px;
font-size:14px;
line-height:1.5;
color:#64748b;
font-weight:600;
}

.table-wrap{
overflow-x:auto;
margin-top:28px;
border-radius:18px;
border:1px solid #dce3ec;
}

table{
width:100%;
border-collapse:collapse;
min-width:1100px;
background:white;
}

th{
background:#013369;
color:white;
padding:16px 10px;
font-size:13px;
text-transform:uppercase;
letter-spacing:1px;
font-weight:800;
white-space:nowrap;
}

td{
padding:16px 12px;
border-bottom:1px solid #edf2f7;
font-size:15px;
font-weight:500;
text-align:center;
}

tbody tr:nth-child(even){
background:#f4f8fd;
}

tbody tr:hover{
background:#e7f0ff;
}

.team-link{
color:#013369;
font-weight:800;
text-decoration:none;
}

.team-link:hover{
text-decoration:underline;
}

.loading{
text-align:center;
font-size:28px;
font-weight:900;
padding:80px;
color:#013369;
}

@media(max-width:900px){

.hero{
padding:50px 16px 40px;
}

.hero h1{
font-size:42px;
}

.container{
margin:-20px 12px 20px;
padding:20px;
border-radius:18px;
}

.summary{
grid-template-columns:repeat(2,1fr);
}

.big-stat{
font-size:38px;
}

input,
select{
width:100%;
min-width:unset;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/nfl.html">NFL</a>
<a href="/nfl-seasons.html">Seasons</a>
</div>

<div class="hero" id="hero">
<h1 id="playerName">Loading Player...</h1>
<div class="hero-sub" id="heroSub">
NFL Career Statistics
</div>
</div>

<div class="container">

<div class="search-row">

<input list="players" id="playerInput" placeholder="Search player...">
<datalist id="players"></datalist>

<select id="teamFilter">
<option value="">All Teams</option>
</select>

<select id="oppFilter">
<option value="">All Opponents</option>
</select>

</div>

<div id="loading" class="loading">
Loading player data...
</div>

<div id="content" style="display:none;">

<div class="section-title">Career Summary</div>
<div class="summary" id="summary"></div>

<div class="section-title">Career Highs</div>
<div class="summary" id="highs"></div>

<div class="section-title">Records</div>
<div class="summary" id="records"></div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Team</th>
<th>Opponent</th>
<th>Pass Yds</th>
<th>Pass TD</th>
<th>INT</th>
<th>Rush Yds</th>
<th>Rush TD</th>
<th>Rec Yds</th>
<th>Rec TD</th>
</tr>
</thead>

<tbody id="gamesTable"></tbody>

</table>

</div>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const rawPlayer =
decodeURIComponent(params.get("player") || "");

const playerSlug =
String(rawPlayer)
.trim()
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");

const slugify = name =>
String(name || "")
.trim()
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");

let allGames = [];
let playerData = {};

const TEAM_NAMES = {

"ARI":"Arizona Cardinals",
"ATL":"Atlanta Falcons",
"BAL":"Baltimore Ravens",
"BUF":"Buffalo Bills",
"CAR":"Carolina Panthers",
"CHI":"Chicago Bears",
"CIN":"Cincinnati Bengals",
"CLE":"Cleveland Browns",
"DAL":"Dallas Cowboys",
"DEN":"Denver Broncos",
"DET":"Detroit Lions",
"GB":"Green Bay Packers",
"GNB":"Green Bay Packers",
"HOU":"Houston Texans",
"IND":"Indianapolis Colts",
"JAX":"Jacksonville Jaguars",
"JAC":"Jacksonville Jaguars",
"KAN":"Kansas City Chiefs",
"KC":"Kansas City Chiefs",
"LV":"Las Vegas Raiders",
"RAI":"Las Vegas Raiders",
"LAC":"Los Angeles Chargers",
"SDG":"San Diego Chargers",
"LAR":"Los Angeles Rams",
"STL":"St Louis Rams",
"MIA":"Miami Dolphins",
"MIN":"Minnesota Vikings",
"NE":"New England Patriots",
"NWE":"New England Patriots",
"NO":"New Orleans Saints",
"NOR":"New Orleans Saints",
"NYG":"New York Giants",
"NYJ":"New York Jets",
"PHI":"Philadelphia Eagles",
"PIT":"Pittsburgh Steelers",
"SF":"San Francisco 49ers",
"SFO":"San Francisco 49ers",
"SEA":"Seattle Seahawks",
"TB":"Tampa Bay Buccaneers",
"TAM":"Tampa Bay Buccaneers",
"TEN":"Tennessee Titans",
"WAS":"Washington Commanders"

};

const TEAM_COLOURS = {

"ARI":["#97233F","#000000"],
"ATL":["#A71930","#000000"],
"BAL":["#241773","#000000"],
"BUF":["#00338D","#C60C30"],
"CAR":["#0085CA","#101820"],
"CHI":["#0B162A","#C83803"],
"CIN":["#FB4F14","#000000"],
"CLE":["#311D00","#FF3C00"],
"DAL":["#041E42","#0C2340"],
"DEN":["#FB4F14","#002244"],
"DET":["#0076B6","#B0B7BC"],
"GB":["#203731","#FFB612"],
"HOU":["#03202F","#A71930"],
"IND":["#002C5F","#A2AAAD"],
"JAX":["#006778","#101820"],
"KC":["#E31837","#FFB81C"],
"LV":["#000000","#A5ACAF"],
"LAC":["#0080C6","#FFC20E"],
"LAR":["#003594","#FFA300"],
"MIA":["#008E97","#FC4C02"],
"MIN":["#4F2683","#FFC62F"],
"NE":["#002244","#C60C30"],
"NO":["#101820","#D3BC8D"],
"NYG":["#0B2265","#A71930"],
"NYJ":["#125740","#000000"],
"PHI":["#004C54","#A5ACAF"],
"PIT":["#FFB612","#101820"],
"SF":["#AA0000","#B3995D"],
"SEA":["#002244","#69BE28"],
"TB":["#D50A0A","#34302B"],
"TEN":["#0C2340","#4B92DB"],
"WAS":["#5A1414","#FFB612"]

};

function getTeamName(team){

team =
String(team || "")
.trim()
.toUpperCase();

return TEAM_NAMES[team] || team;

}

function normalizeTeamCode(team){

team =
String(team || "")
.trim()
.toUpperCase();

if(team.includes("DALLAS")) return "DAL";
if(team === "NWE") return "NE";
if(team === "KAN") return "KC";
if(team === "NOR") return "NO";
if(team === "SFO") return "SF";
if(team === "TAM") return "TB";
if(team === "SDG") return "LAC";
if(team === "STL") return "LAR";
if(team === "RAI") return "LV";
if(team === "GNB") return "GB";

return team;

}

function applyTeamTheme(){

let latestTeam = "";

for(let i = allGames.length - 1; i >= 0; i--){

if(allGames[i].team){

latestTeam =
normalizeTeamCode(allGames[i].team);

break;

}

}

const colours =
TEAM_COLOURS[latestTeam] || ["#013369","#d50a0a"];

document.getElementById("hero").style.background = `
radial-gradient(circle at top right, rgba(255,255,255,.08), transparent 35%),
linear-gradient(135deg, ${colours[0]} 0%, ${colours[1]} 100%)
`;

document.getElementById("heroSub").innerHTML =
`${getTeamName(latestTeam)} Career Statistics`;

}

async function loadPlayers(){

const res =
await fetch("/data/nfl/players/index.json?v="+Date.now());

const data =
await res.json();

const dl =
document.getElementById("players");

data.forEach(p=>{

const opt =
document.createElement("option");

opt.value = p;

dl.appendChild(opt);

});

}

document.getElementById("playerInput")
.addEventListener("change",()=>{

const val =
document.getElementById("playerInput").value;

window.location =
"?player="+slugify(val);

});

async function loadPlayer(){

const res =
await fetch(`/data/nfl/players/${playerSlug}.json?v=${Date.now()}`);

playerData =
await res.json();

allGames =
playerData.games || [];

buildPage();

}

function buildPage(){

document.getElementById("loading").style.display =
"none";

document.getElementById("content").style.display =
"block";

document.getElementById("playerName").innerText =
playerData.name || "Player";

applyTeamTheme();

setupFilters();

render();

}

function setupFilters(){

const teams =
[...new Set(allGames.map(g=>g.team).filter(Boolean))];

const opps =
[...new Set(allGames.map(g=>g.opponent).filter(Boolean))];

teams.forEach(t=>{

document.getElementById("teamFilter").innerHTML +=
`<option value="${t}">${getTeamName(t)}</option>`;

});

opps.forEach(t=>{

document.getElementById("oppFilter").innerHTML +=
`<option value="${t}">${getTeamName(t)}</option>`;

});

document.getElementById("teamFilter").onchange =
render;

document.getElementById("oppFilter").onchange =
render;

}

function render(){

const teamVal =
document.getElementById("teamFilter").value;

const oppVal =
document.getElementById("oppFilter").value;

const table =
document.getElementById("gamesTable");

table.innerHTML = "";

let totals = {
games:0,
passY:0,
passTD:0,
ints:0,
rushY:0,
rushTD:0,
recY:0,
recTD:0
};

let highs = {
passY:0,
passYGame:null,
rushY:0,
rushYGame:null,
recY:0,
recYGame:null
};

allGames.forEach(g=>{

if(teamVal && g.team !== teamVal) return;
if(oppVal && g.opponent !== oppVal) return;

const stats =
g.stats || {};

totals.games++;

totals.passY += Number(stats.pass_yds || 0);
totals.passTD += Number(stats.pass_td || 0);
totals.ints += Number(stats.pass_int || 0);
totals.rushY += Number(stats.rush_yds || 0);
totals.rushTD += Number(stats.rush_td || 0);
totals.recY += Number(stats.rec_yds || 0);
totals.recTD += Number(stats.rec_td || 0);

if(Number(stats.pass_yds || 0) > highs.passY){
highs.passY = Number(stats.pass_yds || 0);
highs.passYGame = g;
}

if(Number(stats.rush_yds || 0) > highs.rushY){
highs.rushY = Number(stats.rush_yds || 0);
highs.rushYGame = g;
}

if(Number(stats.rec_yds || 0) > highs.recY){
highs.recY = Number(stats.rec_yds || 0);
highs.recYGame = g;
}

table.innerHTML += `
<tr>
<td>${g.date || ""}</td>
<td>${g.season || ""}</td>
<td>
<a class="team-link"
href="/nfl-team.html?team=${encodeURIComponent(g.team || "")}">
${getTeamName(g.team || "")}
</a>
</td>
<td>${getTeamName(g.opponent || "")}</td>
<td>${stats.pass_yds || 0}</td>
<td>${stats.pass_td || 0}</td>
<td>${stats.pass_int || 0}</td>
<td>${stats.rush_yds || 0}</td>
<td>${stats.rush_td || 0}</td>
<td>${stats.rec_yds || 0}</td>
<td>${stats.rec_td || 0}</td>
</tr>
`;

});

document.getElementById("summary").innerHTML = `

<div class="box">
<b>Games</b>
<div class="big-stat">${totals.games}</div>
</div>

<div class="box">
<b>Pass Yards</b>
<div class="big-stat">${totals.passY}</div>
</div>

<div class="box">
<b>Pass TD</b>
<div class="big-stat">${totals.passTD}</div>
</div>

<div class="box">
<b>INT</b>
<div class="big-stat">${totals.ints}</div>
</div>

<div class="box">
<b>Rush Yards</b>
<div class="big-stat">${totals.rushY}</div>
</div>

`;

document.getElementById("highs").innerHTML = `

<div class="box">
<b>Pass Yards</b>
<div class="big-stat">${highs.passY}</div>
<div class="sub-stat">
${getTeamName(highs.passYGame?.opponent || "")}<br>
${highs.passYGame?.date || ""}
</div>
</div>

<div class="box">
<b>Rush Yards</b>
<div class="big-stat">${highs.rushY}</div>
<div class="sub-stat">
${getTeamName(highs.rushYGame?.opponent || "")}<br>
${highs.rushYGame?.date || ""}
</div>
</div>

<div class="box">
<b>Rec Yards</b>
<div class="big-stat">${highs.recY}</div>
<div class="sub-stat">
${getTeamName(highs.recYGame?.opponent || "")}<br>
${highs.recYGame?.date || ""}
</div>
</div>

`;

document.getElementById("records").innerHTML = `

<div class="box">
<b>300+ Passing Games</b>
<div class="big-stat">
${allGames.filter(g =>
Number((g.stats || {}).pass_yds || 0) >= 300
).length}
</div>
</div>

<div class="box">
<b>3+ Passing TD Games</b>
<div class="big-stat">
${allGames.filter(g =>
Number((g.stats || {}).pass_td || 0) >= 3
).length}
</div>
</div>

<div class="box">
<b>100+ Rush Yard Games</b>
<div class="big-stat">
${allGames.filter(g =>
Number((g.stats || {}).rush_yds || 0) >= 100
).length}
</div>
</div>

`;

}

loadPlayers();
loadPlayer();

</script>

</body>
</html>
