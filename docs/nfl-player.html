<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#013369;
}

.hero{
background:linear-gradient(90deg,#013369,#d50a0a);
color:white;
padding:50px 20px;
text-align:center;
}

.hero h1{
margin:0;
font-size:42px;
font-weight:900;
}

.container{
max-width:1300px;
margin:30px auto;
background:white;
padding:24px;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.search{
text-align:center;
margin-bottom:24px;
}

input,select{
padding:10px;
font-size:15px;
margin:6px;
border-radius:8px;
border:1px solid #ccc;
}

.section-title{
font-size:24px;
font-weight:800;
margin-top:30px;
margin-bottom:16px;
text-align:center;
}

.summary{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:18px;
margin-bottom:24px;
}

.box{
background:white;
padding:18px;
border-radius:12px;
min-width:190px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.box b{
display:block;
font-size:16px;
margin-bottom:8px;
color:#013369;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:center;
font-size:15px;
}

th{
background:#013369;
color:white;
}

tbody tr:nth-child(even){
background:#eef5ff;
}

tbody tr:hover{
background:#dbeafe;
}

@media(max-width:700px){

.hero h1{
font-size:28px;
}

.container{
padding:14px;
overflow-x:auto;
}

table{
min-width:1000px;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/nfl.html">NFL</a>
<a href="/nfl-seasons.html">Seasons</a>
</div>

<div class="hero">
<h1 id="playerName">NFL Player</h1>
</div>

<div class="container">

<div class="search">

<input list="players" id="playerInput" placeholder="Search player...">
<datalist id="players"></datalist>

<br>

<select id="teamFilter">
<option value="">All Teams</option>
</select>

<select id="oppFilter">
<option value="">All Opponents</option>
</select>

</div>

<div class="section-title">Career Summary</div>
<div class="summary" id="summary"></div>

<div class="section-title">Career Highs</div>
<div class="summary" id="highs"></div>

<div class="section-title">Records</div>
<div class="summary" id="records"></div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>Type</th>
<th>Pass Yds</th>
<th>Pass TD</th>
<th>INT</th>
<th>Rush Yds</th>
<th>Rush TD</th>
<th>Rec Yds</th>
<th>Rec TD</th>
</tr>
</thead>

<tbody id="gamesTable"></tbody>

</table>

</div>

<script>

const params = new URLSearchParams(window.location.search);

let player = params.get("player");

const slugify = name =>
String(name || "")
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");

let allGames = [];

const TEAM_MAP = {
"ARI":"Arizona Cardinals",
"ATL":"Atlanta Falcons",
"BAL":"Baltimore Ravens",
"BUF":"Buffalo Bills",
"CAR":"Carolina Panthers",
"CHI":"Chicago Bears",
"CIN":"Cincinnati Bengals",
"CLE":"Cleveland Browns",
"DAL":"Dallas Cowboys",
"DEN":"Denver Broncos",
"DET":"Detroit Lions",
"GB":"Green Bay Packers",
"HOU":"Houston Texans",
"IND":"Indianapolis Colts",
"JAX":"Jacksonville Jaguars",
"KAN":"Kansas City Chiefs",
"KC":"Kansas City Chiefs",
"LAC":"Los Angeles Chargers",
"LAR":"Los Angeles Rams",
"LV":"Las Vegas Raiders",
"MIA":"Miami Dolphins",
"MIN":"Minnesota Vikings",
"NE":"New England Patriots",
"NO":"New Orleans Saints",
"NYG":"New York Giants",
"NYJ":"New York Jets",
"PHI":"Philadelphia Eagles",
"PIT":"Pittsburgh Steelers",
"SEA":"Seattle Seahawks",
"SF":"San Francisco 49ers",
"TB":"Tampa Bay Buccaneers",
"TEN":"Tennessee Titans",
"WAS":"Washington Commanders"
};

/* PLAYER LIST */

async function loadPlayers(){

try{

const res =
await fetch("/data/nfl/players/index.json?v="+Date.now());

const data = await res.json();

const dl =
document.getElementById("players");

data.forEach(p=>{

const opt =
document.createElement("option");

opt.value = p;

dl.appendChild(opt);

});

}catch{}

}

/* SEARCH */

document.getElementById("playerInput")
.addEventListener("change",()=>{

const val =
document.getElementById("playerInput").value;

window.location =
"?player="+slugify(val);

});

/* LOAD ALL DATA */

async function loadAllGames(){

const startYear = 1970;
const endYear = new Date().getFullYear();

for(let y=startYear;y<=endYear;y++){

try{

const seasonRes =
await fetch(`/data/nfl/seasons/${y}.json?v=${Date.now()}`);

const seasonData =
await seasonRes.json();

const games =
seasonData.games ||
seasonData ||
[];

for(const g of games){

try{

const gameId =
g.game_id ||
g.id;

if(!gameId) continue;

const boxRes =
await fetch(`/data/nfl/boxscores/${y}/${gameId}.json?v=${Date.now()}`);

const box =
await boxRes.json();

const players =
box.passing ||
[];

const teams = [
...new Set(
players
.map(p => (p.stats || {}).team)
.filter(Boolean)
)
];

players.forEach(p=>{

const s = p.stats || {};

const team =
s.team || "";

const opponent =
teams.find(t => t !== team) || "";

allGames.push({

date:
g.date || "",

team:
TEAM_MAP[team] || team,

opponent:
TEAM_MAP[opponent] || opponent,

game_type:
g.game_type ||
g.type ||
"Regular Season",

player:
p.player || "",

passing:{
yards:Number(s.pass_yds || 0),
td:Number(s.pass_td || 0),
int:Number(s.pass_int || 0)
},

rushing:{
yards:Number(s.rush_yds || 0),
td:Number(s.rush_td || 0)
},

receiving:{
yards:Number(s.rec_yds || 0),
td:Number(s.rec_td || 0)
}

});

});

}catch{}

}

}catch{}

}

buildPlayer();

}

/* BUILD PLAYER */

function buildPlayer(){

if(!player) return;

const nameMatch =
n => slugify(n) === player;

let games = [];

allGames.forEach(g=>{

if(nameMatch(g.player)){

games.push(g);

}

});

if(!games.length){

document.getElementById("playerName").innerText =
"Player Not Found";

return;

}

document.getElementById("playerName").innerText =
games[0].player;

setupFilters(games);

render(games);

}

/* FILTERS */

function setupFilters(games){

const teamSet = new Set();
const oppSet = new Set();

games.forEach(g=>{

teamSet.add(g.team);
oppSet.add(g.opponent);

});

const teamFilter =
document.getElementById("teamFilter");

const oppFilter =
document.getElementById("oppFilter");

teamFilter.innerHTML =
`<option value="">All Teams</option>`;

oppFilter.innerHTML =
`<option value="">All Opponents</option>`;

teamSet.forEach(t=>{

teamFilter.innerHTML +=
`<option>${t}</option>`;

});

oppSet.forEach(t=>{

oppFilter.innerHTML +=
`<option>${t}</option>`;

});

teamFilter.onchange =
()=>render(games);

oppFilter.onchange =
()=>render(games);

}

/* RENDER */

function render(games){

const teamVal =
document.getElementById("teamFilter").value;

const oppVal =
document.getElementById("oppFilter").value;

const table =
document.getElementById("gamesTable");

table.innerHTML="";

let totals = {
games:0,
passY:0,
passTD:0,
int:0,
rushY:0,
rushTD:0,
recY:0,
recTD:0
};

let highs = {
passY:{v:0},
passTD:{v:0},
rushY:{v:0},
recY:{v:0}
};

let records = {
g300:0,
multiPassTD:0,
rush100:0,
rec100:0
};

games.forEach(g=>{

if(teamVal && g.team !== teamVal) return;
if(oppVal && g.opponent !== oppVal) return;

totals.games++;

totals.passY += g.passing.yards;
totals.passTD += g.passing.td;
totals.int += g.passing.int;

totals.rushY += g.rushing.yards;
totals.rushTD += g.rushing.td;

totals.recY += g.receiving.yards;
totals.recTD += g.receiving.td;

if(g.passing.yards > highs.passY.v)
highs.passY={v:g.passing.yards,g};

if(g.passing.td > highs.passTD.v)
highs.passTD={v:g.passing.td,g};

if(g.rushing.yards > highs.rushY.v)
highs.rushY={v:g.rushing.yards,g};

if(g.receiving.yards > highs.recY.v)
highs.recY={v:g.receiving.yards,g};

if(g.passing.yards >= 300)
records.g300++;

if(g.passing.td >= 3)
records.multiPassTD++;

if(g.rushing.yards >= 100)
records.rush100++;

if(g.receiving.yards >= 100)
records.rec100++;

const tr =
document.createElement("tr");

tr.innerHTML = `
<td>${g.date}</td>
<td>${g.team}</td>
<td>${g.opponent}</td>
<td>${g.game_type}</td>
<td>${g.passing.yards}</td>
<td>${g.passing.td}</td>
<td>${g.passing.int}</td>
<td>${g.rushing.yards}</td>
<td>${g.rushing.td}</td>
<td>${g.receiving.yards}</td>
<td>${g.receiving.td}</td>
`;

table.appendChild(tr);

});

renderSummary(totals);
renderHighs(highs);
renderRecords(records);

}

/* SUMMARY */

function renderSummary(t){

const avg =
v => t.games ?
(v/t.games).toFixed(1) :
0;

document.getElementById("summary").innerHTML = `

<div class="box">
<b>Games</b>
${t.games}
</div>

<div class="box">
<b>Pass Yards</b>
${t.passY}<br>
${avg(t.passY)} avg
</div>

<div class="box">
<b>Pass TD</b>
${t.passTD}
</div>

<div class="box">
<b>INT</b>
${t.int}
</div>

<div class="box">
<b>Rush Yards</b>
${t.rushY}
</div>

<div class="box">
<b>Rec Yards</b>
${t.recY}
</div>

`;

}

/* HIGHS */

function highBox(title,obj){

if(!obj.g) return "";

return `

<div class="box">

<b>${title}</b>

${obj.v}

<br>

vs ${obj.g.opponent}

<br>

${obj.g.date}

</div>

`;

}

function renderHighs(h){

document.getElementById("highs").innerHTML = `

${highBox("Pass Yards",h.passY)}

${highBox("Pass TD",h.passTD)}

${highBox("Rush Yards",h.rushY)}

${highBox("Rec Yards",h.recY)}

`;

}

/* RECORDS */

function renderRecords(r){

document.getElementById("records").innerHTML = `

<div class="box">
<b>300+ Passing</b>
${r.g300}
</div>

<div class="box">
<b>3+ Pass TD</b>
${r.multiPassTD}
</div>

<div class="box">
<b>100 Rush</b>
${r.rush100}
</div>

<div class="box">
<b>100 Rec</b>
${r.rec100}
</div>

`;

}

loadPlayers();
loadAllGames();

</script>

</body>
</html>
