<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;position:sticky;top:0;z-index:1000;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover{opacity:1;color:var(--accent);}

/* Hero background set dynamically per-player via JS (team colours) */
.hero{padding:44px 20px 38px;text-align:center;position:relative;overflow:hidden;transition:background .4s ease;}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(30px,6vw,46px);
  letter-spacing:.01em;color:#fff;position:relative;z-index:2;line-height:1.1;text-transform:uppercase;
}
.hero-sub{
  margin-top:10px;font-size:13px;font-weight:600;color:rgba(255,255,255,.75);
  position:relative;z-index:2;text-transform:uppercase;letter-spacing:.04em;
}
.container{
  max-width:1220px;margin:0 auto 70px;background:var(--surface);border:1px solid var(--line);
  padding:28px;border-radius:var(--radius);position:relative;z-index:5;
}
.search-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
input,select{
  padding:12px 16px;font-size:13.5px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);min-width:200px;font-weight:600;transition:.2s;outline:none;
  font-family:var(--body);color:var(--ink);
}
input:hover,select:hover{border-color:var(--faint);}
input:focus,select:focus{border-color:var(--accent);}
.section-title{
  font-family:var(--display);font-size:15px;font-weight:600;margin-top:26px;margin-bottom:16px;
  color:var(--ink);text-transform:uppercase;letter-spacing:.02em;border-left:4px solid var(--accent);padding-left:12px;
}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:10px;}
.box{
  background:var(--accent-soft);padding:18px 16px;border-radius:14px;transition:.2s ease;
}
.box b{
  display:block;font-size:10.5px;margin-bottom:10px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-family:var(--body);
}
.big-stat{font-family:var(--display);font-size:32px;font-weight:600;line-height:1;color:var(--ink);}
.sub-stat{margin-top:8px;font-size:12px;line-height:1.5;color:var(--muted);font-weight:500;}
.table-wrap{overflow-x:auto;margin-top:24px;border-radius:12px;border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;min-width:900px;background:var(--surface);}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 12px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.03em;font-weight:600;white-space:nowrap;font-family:var(--body);border-bottom:1px solid var(--line);
}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;text-align:center;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.team-link{color:var(--ink);font-weight:700;text-decoration:none;}
.team-link:hover{color:var(--accent);}
.loading{text-align:center;font-size:16px;font-weight:600;padding:80px;color:var(--muted);}
.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.tab{
  padding:9px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;
  text-transform:uppercase;letter-spacing:.02em;font-family:var(--body);
}
.tab.active{background:var(--board);color:#fff;border-color:var(--board);}
.tab:hover:not(.active){border-color:var(--faint);}
@media(max-width:900px){
  .container{margin:0 12px 40px;padding:20px;}
  .summary{grid-template-columns:repeat(2,1fr);}
  .big-stat{font-size:26px;}
  input,select{width:100%;min-width:unset;}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
  <a href="nfl-seasons.html">Seasons</a>
</div>

<div class="hero" id="hero">
  <h1 id="playerName">Loading Player...</h1>
  <div class="hero-sub" id="heroSub">NFL Career Statistics</div>
</div>

<div class="container">
  <div class="search-row">
    <input list="players" id="playerInput" placeholder="Search player...">
    <datalist id="players"></datalist>
    <select id="teamFilter"><option value="">All Teams</option></select>
    <select id="oppFilter"><option value="">All Opponents</option></select>
  </div>

  <div id="loading" class="loading">Loading player data...</div>

  <div id="content" style="display:none;">
    <div class="section-title">Career Summary</div>
    <div class="summary" id="summary"></div>

    <div class="section-title">Career Highs</div>
    <div class="summary" id="highs"></div>

    <div class="section-title">Records</div>
    <div class="summary" id="records"></div>

    <div class="tabs" id="tabs">
      <button class="tab active" onclick="setTab('all',this)">All</button>
      <button class="tab" onclick="setTab('passing',this)">Passing</button>
      <button class="tab" onclick="setTab('rushing',this)">Rushing</button>
      <button class="tab" onclick="setTab('receiving',this)">Receiving</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="gamesTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var rawPlayer = decodeURIComponent(params.get("player") || "");
var playerSlug = rawPlayer.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

var allGames = [];
var playerData = {};

// Deduplicated game records keyed by game_id
var gameMap = {};

var TEAM_NAMES = {
  "ARI":"Arizona Cardinals","ATL":"Atlanta Falcons","BAL":"Baltimore Ravens",
  "BUF":"Buffalo Bills","CAR":"Carolina Panthers","CHI":"Chicago Bears",
  "CIN":"Cincinnati Bengals","CLE":"Cleveland Browns","DAL":"Dallas Cowboys",
  "DEN":"Denver Broncos","DET":"Detroit Lions","GB":"Green Bay Packers",
  "GNB":"Green Bay Packers","HOU":"Houston Texans","IND":"Indianapolis Colts",
  "JAX":"Jacksonville Jaguars","JAC":"Jacksonville Jaguars","KC":"Kansas City Chiefs",
  "KAN":"Kansas City Chiefs","LV":"Las Vegas Raiders","RAI":"Las Vegas Raiders",
  "OAK":"Las Vegas Raiders","LAC":"Los Angeles Chargers","SDG":"Los Angeles Chargers",
  "LAR":"Los Angeles Rams","STL":"Los Angeles Rams","RAM":"Los Angeles Rams",
  "MIA":"Miami Dolphins","MIN":"Minnesota Vikings","NE":"New England Patriots",
  "NWE":"New England Patriots","NO":"New Orleans Saints","NOR":"New Orleans Saints",
  "NYG":"New York Giants","NYJ":"New York Jets","PHI":"Philadelphia Eagles",
  "PIT":"Pittsburgh Steelers","SF":"San Francisco 49ers","SFO":"San Francisco 49ers",
  "SEA":"Seattle Seahawks","TB":"Tampa Bay Buccaneers","TAM":"Tampa Bay Buccaneers",
  "TEN":"Tennessee Titans","WAS":"Washington Commanders","PHO":"Arizona Cardinals",
  "HTX":"Houston Texans","CLT":"Indianapolis Colts"
};

var TEAM_COLOURS = {
  "ARI":["#97233F","#000000"],"ATL":["#A71930","#000000"],"BAL":["#241773","#000000"],
  "BUF":["#00338D","#C60C30"],"CAR":["#0085CA","#101820"],"CHI":["#0B162A","#C83803"],
  "CIN":["#FB4F14","#000000"],"CLE":["#311D00","#FF3C00"],"DAL":["#041E42","#0C2340"],
  "DEN":["#FB4F14","#002244"],"DET":["#0076B6","#B0B7BC"],"GB":["#203731","#FFB612"],
  "HOU":["#03202F","#A71930"],"IND":["#002C5F","#A2AAAD"],"JAX":["#006778","#101820"],
  "KC":["#E31837","#FFB81C"],"LV":["#000000","#A5ACAF"],"LAC":["#0080C6","#FFC20E"],
  "LAR":["#003594","#FFA300"],"MIA":["#008E97","#FC4C02"],"MIN":["#4F2683","#FFC62F"],
  "NE":["#002244","#C60C30"],"NO":["#101820","#D3BC8D"],"NYG":["#0B2265","#A71930"],
  "NYJ":["#125740","#000000"],"PHI":["#004C54","#A5ACAF"],"PIT":["#FFB612","#101820"],
  "SF":["#AA0000","#B3995D"],"SEA":["#002244","#69BE28"],"TB":["#D50A0A","#34302B"],
  "TEN":["#0C2340","#4B92DB"],"WAS":["#5A1414","#FFB612"]
};

function getTeamName(t){
  t = String(t||"").trim().toUpperCase();
  return TEAM_NAMES[t] || t;
}

function normalizeCode(t){
  t = String(t||"").trim().toUpperCase();
  var map = {"NWE":"NE","KAN":"KC","NOR":"NO","SFO":"SF","TAM":"TB","SDG":"LAC",
             "STL":"LAR","RAI":"LV","GNB":"GB","OAK":"LV","JAC":"JAX","PHO":"ARI",
             "HTX":"HOU","CLT":"IND","RAM":"LAR"};
  return map[t] || t;
}

function applyTeamTheme(){
  var latestTeam = "";
  for(var i = allGames.length-1; i >= 0; i--){
    if(allGames[i].team){ latestTeam = normalizeCode(allGames[i].team); break; }
  }
  var colours = TEAM_COLOURS[latestTeam] || ["#013369","#d50a0a"];
  document.getElementById("hero").style.background =
    "radial-gradient(circle at top right,rgba(255,255,255,.08),transparent 35%)," +
    "linear-gradient(135deg," + colours[0] + " 0%," + colours[1] + " 100%)";
  document.getElementById("heroSub").innerHTML = getTeamName(latestTeam) + " Career Statistics";
}

function slugify(name){
  return String(name||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

// Build deduplicated game map from raw game entries
// Each game_id appears multiple times (passing/rushing/receiving sections)
// We merge all stats for the same game_id into one record
function buildGameMap(games){
  gameMap = {};
  games.forEach(function(g){
    var id = g.game_id;
    if(!id) return;
    if(!gameMap[id]){
      gameMap[id] = {
        game_id: id,
        date: g.date || "",
        season: g.season || "",
        team: g.team || (g.stats && g.stats.team) || "",
        opponent: g.opponent || "",
        pass_yds:0, pass_td:0, pass_int:0, pass_cmp:0, pass_att:0,
        rush_yds:0, rush_td:0, rush_att:0,
        rec_yds:0,  rec_td:0,  rec:0
      };
    }
    var s = g.stats || {};
    var r = gameMap[id];
    // Only add stats if they are non-zero to avoid double-counting
    // Use the section field to know which stats to trust
    var sec = String(g.section||"").toLowerCase();
    if(sec === "passing" || Number(s.pass_yds||0) !== 0 || Number(s.pass_td||0) !== 0){
      // Only update passing stats if this entry has passing data
      if(Number(s.pass_yds||0) !== 0) r.pass_yds = Number(s.pass_yds||0);
      if(Number(s.pass_td||0) !== 0)  r.pass_td  = Number(s.pass_td||0);
      if(Number(s.pass_int||0) !== 0) r.pass_int = Number(s.pass_int||0);
      if(Number(s.pass_cmp||0) !== 0) r.pass_cmp = Number(s.pass_cmp||0);
      if(Number(s.pass_att||0) !== 0) r.pass_att = Number(s.pass_att||0);
    }
    if(Number(s.rush_yds||0) !== 0) r.rush_yds = Number(s.rush_yds||0);
    if(Number(s.rush_td||0)  !== 0) r.rush_td  = Number(s.rush_td||0);
    if(Number(s.rush_att||0) !== 0) r.rush_att = Number(s.rush_att||0);
    if(Number(s.rec_yds||0)  !== 0) r.rec_yds  = Number(s.rec_yds||0);
    if(Number(s.rec_td||0)   !== 0) r.rec_td   = Number(s.rec_td||0);
    if(Number(s.rec||0)      !== 0) r.rec       = Number(s.rec||0);
    // Keep team from stats if missing at game level
    if(!r.team && s.team) r.team = s.team;
  });

  // Sort by date
  return Object.values(gameMap).sort(function(a,b){
    return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  });
}

fetch("/data/nfl/players.json")
  .then(function(r){ return r.json(); })
  .then(function(data){
    var dl = document.getElementById("players");
    data.forEach(function(p){
      var opt = document.createElement("option");
      opt.value = p.player_id || p;
      opt.label = p.name || p;
      dl.appendChild(opt);
    });
  }).catch(function(){});

document.getElementById("playerInput").addEventListener("change", function(){
  var val = this.value;
  window.location = "?player=" + slugify(val);
});

fetch("/data/nfl/players/" + playerSlug + ".json")
  .then(function(r){ return r.json(); })
  .then(function(data){
    playerData = data;
    allGames = buildGameMap(data.games || []);
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    document.getElementById("playerName").innerText = data.name || "Player";
    applyTeamTheme();
    setupFilters();
    render();
  })
  .catch(function(e){
    document.getElementById("loading").innerHTML = "Could not load player data.";
  });

function setupFilters(){
  var teams = {}, opps = {};
  allGames.forEach(function(g){
    if(g.team) teams[g.team] = 1;
    if(g.opponent) opps[g.opponent] = 1;
  });
  var tf = document.getElementById("teamFilter");
  var of = document.getElementById("oppFilter");
  Object.keys(teams).sort().forEach(function(t){
    tf.innerHTML += '<option value="'+t+'">'+getTeamName(t)+'</option>';
  });
  Object.keys(opps).sort().forEach(function(o){
    of.innerHTML += '<option value="'+o+'">'+getTeamName(o)+'</option>';
  });
  tf.onchange = render;
  of.onchange = render;
}

var currentTab = 'all';

function setTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  render();
}

var HEADS = {
  all:
    '<tr><th>Date</th><th>Season</th><th>Team</th><th>Opponent</th>' +
    '<th>Pass Yds</th><th>Pass TD</th><th>INT</th><th>Cmp</th><th>Att</th>' +
    '<th>Rush Yds</th><th>Rush TD</th><th>Rush Att</th>' +
    '<th>Rec Yds</th><th>Rec TD</th><th>Rec</th></tr>',
  passing:
    '<tr><th>Date</th><th>Season</th><th>Team</th><th>Opponent</th>' +
    '<th>Pass Yds</th><th>Pass TD</th><th>INT</th><th>Cmp</th><th>Att</th><th>Rating</th></tr>',
  rushing:
    '<tr><th>Date</th><th>Season</th><th>Team</th><th>Opponent</th>' +
    '<th>Rush Yds</th><th>Rush TD</th><th>Att</th><th>Avg</th></tr>',
  receiving:
    '<tr><th>Date</th><th>Season</th><th>Team</th><th>Opponent</th>' +
    '<th>Rec Yds</th><th>Rec TD</th><th>Rec</th><th>Avg</th></tr>'
};

function passer_rating(cmp,att,yds,td,int_){
  if(!att) return 0;
  var a = Math.min(Math.max((cmp/att-.3)*5,0),2.375);
  var b = Math.min(Math.max((yds/att-3)*.25,0),2.375);
  var c = Math.min(Math.max((td/att)*20,0),2.375);
  var d = Math.min(Math.max(2.375-(int_/att)*25,0),2.375);
  return ((a+b+c+d)/6*100).toFixed(1);
}

function render(){
  var teamVal = document.getElementById("teamFilter").value;
  var oppVal  = document.getElementById("oppFilter").value;

  // Always compute totals from full filtered set (ignoring tab)
  var filtered = allGames.filter(function(g){
    if(teamVal && g.team !== teamVal) return false;
    if(oppVal  && g.opponent !== oppVal) return false;
    return true;
  });

  // Totals
  var t = {games:0,passY:0,passTD:0,passInt:0,passAtt:0,passCmp:0,
            rushY:0,rushTD:0,rushAtt:0,recY:0,recTD:0,rec:0};

  // Highs
  var h = {
    passY:0, passYGame:null,
    passTD:0, passTDGame:null,
    rushY:0, rushYGame:null,
    rushTD:0, rushTDGame:null,
    recY:0,  recYGame:null,
    recTD:0, recTDGame:null
  };

  var tbody = "";

  // For tab filtering: only show rows with relevant stats
  var tabFiltered = filtered.filter(function(g){
    if(currentTab === 'passing')   return g.pass_yds > 0 || g.pass_att > 0;
    if(currentTab === 'rushing')   return g.rush_yds > 0 || g.rush_att > 0;
    if(currentTab === 'receiving') return g.rec > 0 || g.rec_yds > 0;
    return true;
  });

  // Totals and highs from full filtered set
  filtered.forEach(function(g){
    t.games++;
    t.passY   += g.pass_yds; t.passTD  += g.pass_td;
    t.passInt += g.pass_int; t.passAtt += g.pass_att; t.passCmp += g.pass_cmp;
    t.rushY   += g.rush_yds; t.rushTD  += g.rush_td; t.rushAtt += g.rush_att;
    t.recY    += g.rec_yds;  t.recTD   += g.rec_td;  t.rec     += g.rec;
    if(g.pass_yds > h.passY)  { h.passY  = g.pass_yds; h.passYGame  = g; }
    if(g.pass_td  > h.passTD) { h.passTD = g.pass_td;  h.passTDGame = g; }
    if(g.rush_yds > h.rushY)  { h.rushY  = g.rush_yds; h.rushYGame  = g; }
    if(g.rush_td  > h.rushTD) { h.rushTD = g.rush_td;  h.rushTDGame = g; }
    if(g.rec_yds  > h.recY)   { h.recY   = g.rec_yds;  h.recYGame   = g; }
    if(g.rec_td   > h.recTD)  { h.recTD  = g.rec_td;   h.recTDGame  = g; }
  });

  // Table rows from tab-filtered set
  tabFiltered.forEach(function(g){
    var baseCell =
      '<td>' + g.date + '</td>' +
      '<td>' + g.season + '</td>' +
      '<td><a class="team-link" href="/nfl-team.html?team=' + encodeURIComponent(g.team) + '">' + getTeamName(g.team) + '</a></td>' +
      '<td>' + getTeamName(g.opponent) + '</td>';

    var statCell = "";
    if(currentTab === 'passing' || currentTab === 'all'){
      var rating = passer_rating(g.pass_cmp,g.pass_att,g.pass_yds,g.pass_td,g.pass_int);
      statCell +=
        '<td>' + (g.pass_yds||0) + '</td>' +
        '<td>' + (g.pass_td||0)  + '</td>' +
        '<td>' + (g.pass_int||0) + '</td>' +
        '<td>' + (g.pass_cmp||0) + '</td>' +
        '<td>' + (g.pass_att||0) + '</td>';
      if(currentTab === 'passing') statCell += '<td>' + (g.pass_att ? rating : '–') + '</td>';
    }
    if(currentTab === 'rushing' || currentTab === 'all'){
      var avg = g.rush_att ? (g.rush_yds/g.rush_att).toFixed(1) : '–';
      statCell +=
        '<td>' + (g.rush_yds||0) + '</td>' +
        '<td>' + (g.rush_td||0)  + '</td>' +
        '<td>' + (g.rush_att||0) + '</td>';
      if(currentTab === 'rushing') statCell += '<td>' + avg + '</td>';
    }
    if(currentTab === 'receiving' || currentTab === 'all'){
      var ypr = g.rec ? (g.rec_yds/g.rec).toFixed(1) : '–';
      statCell +=
        '<td>' + (g.rec_yds||0) + '</td>' +
        '<td>' + (g.rec_td||0)  + '</td>' +
        '<td>' + (g.rec||0)     + '</td>';
      if(currentTab === 'receiving') statCell += '<td>' + ypr + '</td>';
    }

    tbody += '<tr>' + baseCell + statCell + '</tr>';
  });

  document.getElementById("tableHead").innerHTML = HEADS[currentTab];
  document.getElementById("gamesTable").innerHTML = tbody;

  function highSub(g){
    if(!g) return "";
    return getTeamName(g.opponent) + "<br>" + g.date;
  }

  // Only show summary boxes that have data
  var summaryBoxes = '<div class="box"><b>Games</b><div class="big-stat">' + t.games + '</div></div>';
  if(t.passY || t.passTD){
    summaryBoxes +=
      '<div class="box"><b>Pass Yards</b><div class="big-stat">' + t.passY.toLocaleString() + '</div></div>' +
      '<div class="box"><b>Pass TD</b><div class="big-stat">' + t.passTD + '</div></div>' +
      '<div class="box"><b>INT</b><div class="big-stat">' + t.passInt + '</div></div>';
  }
  if(t.rushY || t.rushTD){
    summaryBoxes +=
      '<div class="box"><b>Rush Yards</b><div class="big-stat">' + t.rushY.toLocaleString() + '</div></div>' +
      '<div class="box"><b>Rush TD</b><div class="big-stat">' + t.rushTD + '</div></div>' +
      '<div class="box"><b>Rush Att</b><div class="big-stat">' + t.rushAtt + '</div></div>';
  }
  if(t.recY || t.rec){
    summaryBoxes +=
      '<div class="box"><b>Rec Yards</b><div class="big-stat">' + t.recY.toLocaleString() + '</div></div>' +
      '<div class="box"><b>Rec TD</b><div class="big-stat">' + t.recTD + '</div></div>' +
      '<div class="box"><b>Receptions</b><div class="big-stat">' + t.rec + '</div></div>';
  }
  document.getElementById("summary").innerHTML = summaryBoxes;

  // Career highs — only show relevant ones
  var highBoxes = "";
  if(h.passY > 0)
    highBoxes += '<div class="box"><b>Pass Yards</b><div class="big-stat">' + h.passY + '</div><div class="sub-stat">' + highSub(h.passYGame) + '</div></div>';
  if(h.passTD > 0)
    highBoxes += '<div class="box"><b>Pass TD</b><div class="big-stat">' + h.passTD + '</div><div class="sub-stat">' + highSub(h.passTDGame) + '</div></div>';
  if(h.rushY > 0)
    highBoxes += '<div class="box"><b>Rush Yards</b><div class="big-stat">' + h.rushY + '</div><div class="sub-stat">' + highSub(h.rushYGame) + '</div></div>';
  if(h.rushTD > 0)
    highBoxes += '<div class="box"><b>Rush TD</b><div class="big-stat">' + h.rushTD + '</div><div class="sub-stat">' + highSub(h.rushTDGame) + '</div></div>';
  if(h.recY > 0)
    highBoxes += '<div class="box"><b>Rec Yards</b><div class="big-stat">' + h.recY + '</div><div class="sub-stat">' + highSub(h.recYGame) + '</div></div>';
  if(h.recTD > 0)
    highBoxes += '<div class="box"><b>Rec TD</b><div class="big-stat">' + h.recTD + '</div><div class="sub-stat">' + highSub(h.recTDGame) + '</div></div>';
  document.getElementById("highs").innerHTML = highBoxes || "<div style='color:#888'>No data</div>";

  // Records
  var g300pass  = filtered.filter(function(g){ return g.pass_yds >= 300; }).length;
  var g3passTD  = filtered.filter(function(g){ return g.pass_td  >= 3;   }).length;
  var g100rush  = filtered.filter(function(g){ return g.rush_yds >= 100; }).length;
  var g2rushTD  = filtered.filter(function(g){ return g.rush_td  >= 2;   }).length;
  var g100rec   = filtered.filter(function(g){ return g.rec_yds  >= 100; }).length;
  var g2recTD   = filtered.filter(function(g){ return g.rec_td   >= 2;   }).length;

  var recBoxes = "";
  if(t.passY || t.passTD){
    recBoxes +=
      '<div class="box"><b>300+ Pass Yard Games</b><div class="big-stat">' + g300pass + '</div></div>' +
      '<div class="box"><b>3+ Pass TD Games</b><div class="big-stat">' + g3passTD + '</div></div>';
  }
  if(t.rushY || t.rushTD){
    recBoxes +=
      '<div class="box"><b>100+ Rush Yard Games</b><div class="big-stat">' + g100rush + '</div></div>' +
      '<div class="box"><b>2+ Rush TD Games</b><div class="big-stat">' + g2rushTD + '</div></div>';
  }
  if(t.recY || t.rec){
    recBoxes +=
      '<div class="box"><b>100+ Rec Yard Games</b><div class="big-stat">' + g100rec + '</div></div>' +
      '<div class="box"><b>2+ Rec TD Games</b><div class="big-stat">' + g2recTD + '</div></div>';
  }
  document.getElementById("records").innerHTML = recBoxes || "<div style='color:#888'>No data</div>";
}
</script>
</body>
</html>
