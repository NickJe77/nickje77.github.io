<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:20px;background:#f8f9fa;}
.navbar{display:flex;justify-content:center;gap:20px;padding:14px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{text-decoration:none;color:#0056d6;}

h1{text-align:center;margin:20px 0;}

.search{
  text-align:center;
  margin-bottom:20px;
}

input, select{
  padding:8px;
  font-size:14px;
  margin:5px;
}

.summary{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  margin:20px 0;
}

.box{
  background:white;
  padding:15px;
  border-radius:10px;
  min-width:200px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

th{
  background:#eee;
}

tr:hover{
  background:#f1f1f1;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nfl">NFL</a>
  <a href="/nfl-seasons.html">Seasons</a>
</div>

<h1 id="playerName">NFL Player</h1>

<div class="search">
  <input list="players" id="playerInput" placeholder="Search player...">
  <datalist id="players"></datalist>

  <br>

  <select id="teamFilter">
    <option value="">All Teams</option>
  </select>

  <select id="oppFilter">
    <option value="">All Opponents</option>
  </select>
</div>

<div class="summary" id="summary"></div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Team</th>
  <th>Opp</th>
  <th>Type</th>
  <th>Pass Yds</th>
  <th>Pass TD</th>
  <th>INT</th>
  <th>Rush Yds</th>
  <th>Rush TD</th>
  <th>Rec Yds</th>
  <th>Rec TD</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

<script>
const params = new URLSearchParams(window.location.search);
let player = params.get("player");

const slugify = name =>
  name.toLowerCase().replace(/[^a-z0-9]+/g,"-");

async function loadPlayers(){
  const res = await fetch("data/nfl/players/index.json");
  const data = await res.json();

  const dl = document.getElementById("players");
  data.forEach(p=>{
    const opt = document.createElement("option");
    opt.value = p;
    dl.appendChild(opt);
  });
}

document.getElementById("playerInput").addEventListener("change",()=>{
  const val = document.getElementById("playerInput").value;
  window.location = "?player="+slugify(val);
});

async function loadPlayer(){

  if(!player) return;

  const res = await fetch(`data/nfl/players/${player}.json`);
  const data = await res.json();

  document.getElementById("playerName").innerText = data.name;

  const teamSet = new Set();
  const oppSet = new Set();

  data.games.forEach(g=>{
    teamSet.add(g.team);
    oppSet.add(g.opponent);
  });

  const teamFilter = document.getElementById("teamFilter");
  const oppFilter = document.getElementById("oppFilter");

  teamSet.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    teamFilter.appendChild(o);
  });

  oppSet.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    oppFilter.appendChild(o);
  });

  render(data.games);

  teamFilter.onchange = ()=>render(data.games);
  oppFilter.onchange = ()=>render(data.games);
}

function render(games){

  const teamVal = document.getElementById("teamFilter").value;
  const oppVal = document.getElementById("oppFilter").value;

  const table = document.getElementById("gamesTable");
  table.innerHTML = "";

  let totals = {
    games:0,
    passY:0, passTD:0, int:0,
    rushY:0, rushTD:0,
    recY:0, recTD:0
  };

  games.forEach(g=>{

    if(teamVal && g.team !== teamVal) return;
    if(oppVal && g.opponent !== oppVal) return;

    totals.games++;

    totals.passY += g.passing.yards;
    totals.passTD += g.passing.td;
    totals.int += g.passing.int;

    totals.rushY += g.rushing.yards;
    totals.rushTD += g.rushing.td;

    totals.recY += g.receiving.yards;
    totals.recTD += g.receiving.td;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${g.date}</td>
      <td>${g.team}</td>
      <td>${g.opponent}</td>
      <td>${g.game_type}</td>
      <td>${g.passing.yards}</td>
      <td>${g.passing.td}</td>
      <td>${g.passing.int}</td>
      <td>${g.rushing.yards}</td>
      <td>${g.rushing.td}</td>
      <td>${g.receiving.yards}</td>
      <td>${g.receiving.td}</td>
    `;

    table.appendChild(tr);
  });

  renderSummary(totals);
}

function renderSummary(t){

  const div = document.getElementById("summary");

  const avg = (v)=> t.games ? (v/t.games).toFixed(1) : 0;

  div.innerHTML = `
    <div class="box"><b>Games</b><br>${t.games}</div>
    <div class="box"><b>Pass Yards</b><br>${t.passY} (${avg(t.passY)})</div>
    <div class="box"><b>Pass TD</b><br>${t.passTD}</div>
    <div class="box"><b>INT</b><br>${t.int}</div>
    <div class="box"><b>Rush Yards</b><br>${t.rushY}</div>
    <div class="box"><b>Rush TD</b><br>${t.rushTD}</div>
    <div class="box"><b>Rec Yards</b><br>${t.recY}</div>
    <div class="box"><b>Rec TD</b><br>${t.recTD}</div>
  `;
}

loadPlayers();
loadPlayer();
</script>

</body>
</html>
