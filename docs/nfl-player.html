<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#013369;
}

.hero{
background:linear-gradient(90deg,#013369,#d50a0a);
color:white;
padding:50px 20px;
text-align:center;
}

.hero h1{
margin:0;
font-size:42px;
font-weight:900;
}

.container{
max-width:1300px;
margin:30px auto;
background:white;
padding:24px;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.search{
text-align:center;
margin-bottom:24px;
}

input,select{
padding:10px;
font-size:15px;
margin:6px;
border-radius:8px;
border:1px solid #ccc;
}

.section-title{
font-size:24px;
font-weight:800;
margin-top:30px;
margin-bottom:16px;
text-align:center;
}

.summary{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:18px;
margin-bottom:24px;
}

.box{
background:white;
padding:18px;
border-radius:12px;
min-width:190px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.box b{
display:block;
font-size:16px;
margin-bottom:8px;
color:#013369;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:center;
font-size:15px;
}

th{
background:#013369;
color:white;
}

tbody tr:nth-child(even){
background:#eef5ff;
}

tbody tr:hover{
background:#dbeafe;
}

.loading{
text-align:center;
font-size:22px;
font-weight:700;
padding:50px;
color:#013369;
}

@media(max-width:700px){

.hero h1{
font-size:28px;
}

.container{
padding:14px;
overflow-x:auto;
}

table{
min-width:1000px;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/nfl.html">NFL</a>
<a href="/nfl-seasons.html">Seasons</a>
</div>

<div class="hero">
<h1 id="playerName">Loading Player...</h1>
</div>

<div class="container">

<div class="search">

<input list="players" id="playerInput" placeholder="Search player...">
<datalist id="players"></datalist>

<br>

<select id="teamFilter">
<option value="">All Teams</option>
</select>

<select id="oppFilter">
<option value="">All Opponents</option>
</select>

</div>

<div id="loading" class="loading">
Loading player data...
</div>

<div id="content" style="display:none;">

<div class="section-title">Career Summary</div>
<div class="summary" id="summary"></div>

<div class="section-title">Career Highs</div>
<div class="summary" id="highs"></div>

<div class="section-title">Records</div>
<div class="summary" id="records"></div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>Type</th>
<th>Pass Yds</th>
<th>Pass TD</th>
<th>INT</th>
<th>Rush Yds</th>
<th>Rush TD</th>
<th>Rec Yds</th>
<th>Rec TD</th>
</tr>
</thead>

<tbody id="gamesTable"></tbody>

</table>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const rawPlayer =
decodeURIComponent(
params.get("player") || ""
);

const player =
String(rawPlayer)
.trim()
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");

const slugify = name =>
String(name || "")
.trim()
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");

const TEAM_MAP = {
"ARI":"Arizona Cardinals",
"ATL":"Atlanta Falcons",
"BAL":"Baltimore Ravens",
"BUF":"Buffalo Bills",
"CAR":"Carolina Panthers",
"CHI":"Chicago Bears",
"CIN":"Cincinnati Bengals",
"CLE":"Cleveland Browns",
"DAL":"Dallas Cowboys",
"DEN":"Denver Broncos",
"DET":"Detroit Lions",
"GB":"Green Bay Packers",
"HOU":"Houston Texans",
"IND":"Indianapolis Colts",
"JAX":"Jacksonville Jaguars",
"KAN":"Kansas City Chiefs",
"KC":"Kansas City Chiefs",
"LAC":"Los Angeles Chargers",
"LAR":"Los Angeles Rams",
"LV":"Las Vegas Raiders",
"MIA":"Miami Dolphins",
"MIN":"Minnesota Vikings",
"NE":"New England Patriots",
"NO":"New Orleans Saints",
"NYG":"New York Giants",
"NYJ":"New York Jets",
"PHI":"Philadelphia Eagles",
"PIT":"Pittsburgh Steelers",
"SEA":"Seattle Seahawks",
"SF":"San Francisco 49ers",
"TB":"Tampa Bay Buccaneers",
"TEN":"Tennessee Titans",
"WAS":"Washington Commanders"
};

let allGames = [];

/* PLAYER LIST */

async function loadPlayers(){

try{

const res =
await fetch("/data/nfl/players/index.json");

const data =
await res.json();

const dl =
document.getElementById("players");

data.forEach(p=>{

const opt =
document.createElement("option");

opt.value = p;

dl.appendChild(opt);

});

}catch(err){

console.log(err);

}

}

document.getElementById("playerInput")
.addEventListener("change",()=>{

const val =
document.getElementById("playerInput").value;

window.location =
"?player="+slugify(val);

});

/* LOAD PLAYER */

async function loadPlayer(){

if(!player){

document.getElementById("loading").innerHTML =
"Player not found";

return;

}

const currentYear =
new Date().getFullYear();

/* MASSIVE SPEED FIX */

const years = [];

for(let y=currentYear;y>=2020;y--){

years.push(y);

}

for(const y of years){

try{

const seasonRes =
await fetch(`/data/nfl/seasons/${y}.json`);

if(!seasonRes.ok) continue;

const seasonData =
await seasonRes.json();

const games =
seasonData.games ||
seasonData ||
[];

for(const g of games){

try{

const gameId =
g.game_id ||
g.id;

if(!gameId) continue;

const boxRes =
await fetch(`/data/nfl/boxscores/${y}/${gameId}.json`);

if(!boxRes.ok) continue;

const box =
await boxRes.json();

const players = [

...(box.passing || []),
...(box.rushing || []),
...(box.receiving || [])

];

const teams = [
...new Set(
players
.map(p => (p.stats || {}).team)
.filter(Boolean)
)
];

players.forEach(p=>{

const slug =
slugify(p.player || "");

if(slug !== player) return;

const s = p.stats || {};

const team =
s.team || "";

const opponent =
teams.find(t => t !== team) || "";

allGames.push({

date:
g.date || "",

team:
TEAM_MAP[team] || team,

opponent:
TEAM_MAP[opponent] || opponent,

game_type:
g.game_type ||
g.type ||
"Regular Season",

player:
p.player || "",

passing:{
yards:Number(s.pass_yds || 0),
td:Number(s.pass_td || 0),
int:Number(s.pass_int || 0)
},

rushing:{
yards:Number(s.rush_yds || 0),
td:Number(s.rush_td || 0)
},

receiving:{
yards:Number(s.rec_yds || 0),
td:Number(s.rec_td || 0)
}

});

});

}catch(err){

console.log(err);

}

}

}catch(err){

console.log(err);

}

}

buildPage();

}

/* BUILD PAGE */

function buildPage(){

document.getElementById("loading").style.display =
"none";

if(!allGames.length){

document.getElementById("playerName").innerText =
"Player Not Found";

return;

}

document.getElementById("content").style.display =
"block";

document.getElementById("playerName").innerText =
allGames[0].player;

setupFilters();
render();

}

/* FILTERS */

function setupFilters(){

const teams =
[...new Set(allGames.map(g=>g.team))];

const opps =
[...new Set(allGames.map(g=>g.opponent))];

const teamFilter =
document.getElementById("teamFilter");

const oppFilter =
document.getElementById("oppFilter");

teams.forEach(t=>{

teamFilter.innerHTML +=
`<option value="${t}">${t}</option>`;

});

opps.forEach(t=>{

oppFilter.innerHTML +=
`<option value="${t}">${t}</option>`;

});

teamFilter.onchange = render;
oppFilter.onchange = render;

}

/* RENDER */

function render(){

const teamVal =
document.getElementById("teamFilter").value;

const oppVal =
document.getElementById("oppFilter").value;

const table =
document.getElementById("gamesTable");

table.innerHTML = "";

let totals = {
games:0,
passY:0,
passTD:0,
ints:0,
rushY:0,
rushTD:0,
recY:0,
recTD:0
};

let highs = {
passY:0,
passYGame:null,
rushY:0,
rushYGame:null,
recY:0,
recYGame:null
};

allGames.forEach(g=>{

if(teamVal && g.team !== teamVal) return;
if(oppVal && g.opponent !== oppVal) return;

totals.games++;
totals.passY += g.passing.yards;
totals.passTD += g.passing.td;
totals.ints += g.passing.int;
totals.rushY += g.rushing.yards;
totals.rushTD += g.rushing.td;
totals.recY += g.receiving.yards;
totals.recTD += g.receiving.td;

if(g.passing.yards > highs.passY){
highs.passY = g.passing.yards;
highs.passYGame = g;
}

if(g.rushing.yards > highs.rushY){
highs.rushY = g.rushing.yards;
highs.rushYGame = g;
}

if(g.receiving.yards > highs.recY){
highs.recY = g.receiving.yards;
highs.recYGame = g;
}

table.innerHTML += `
<tr>
<td>${g.date}</td>
<td>${g.team}</td>
<td>${g.opponent}</td>
<td>${g.game_type}</td>
<td>${g.passing.yards}</td>
<td>${g.passing.td}</td>
<td>${g.passing.int}</td>
<td>${g.rushing.yards}</td>
<td>${g.rushing.td}</td>
<td>${g.receiving.yards}</td>
<td>${g.receiving.td}</td>
</tr>
`;

});

document.getElementById("summary").innerHTML = `

<div class="box">
<b>Games</b>
${totals.games}
</div>

<div class="box">
<b>Pass Yards</b>
${totals.passY}
</div>

<div class="box">
<b>Pass TD</b>
${totals.passTD}
</div>

<div class="box">
<b>INT</b>
${totals.ints}
</div>

<div class="box">
<b>Rush Yards</b>
${totals.rushY}
</div>

<div class="box">
<b>Rec Yards</b>
${totals.recY}
</div>

`;

document.getElementById("highs").innerHTML = `

<div class="box">
<b>Pass Yards</b>
${highs.passY}
${highs.passYGame ? `<br>vs ${highs.passYGame.opponent}<br>${highs.passYGame.date}` : ""}
</div>

<div class="box">
<b>Rush Yards</b>
${highs.rushY}
${highs.rushYGame ? `<br>vs ${highs.rushYGame.opponent}<br>${highs.rushYGame.date}` : ""}
</div>

<div class="box">
<b>Rec Yards</b>
${highs.recY}
${highs.recYGame ? `<br>vs ${highs.recYGame.opponent}<br>${highs.recYGame.date}` : ""}
</div>

`;

document.getElementById("records").innerHTML = `

<div class="box">
<b>300+ Passing Games</b>
${allGames.filter(g=>g.passing.yards >= 300).length}
</div>

<div class="box">
<b>100+ Rushing Games</b>
${allGames.filter(g=>g.rushing.yards >= 100).length}
</div>

<div class="box">
<b>100+ Receiving Games</b>
${allGames.filter(g=>g.receiving.yards >= 100).length}
</div>

`;

}

loadPlayers();
loadPlayer();

</script>

</body>
</html>
