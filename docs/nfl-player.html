<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#013369;
}

.hero{
background:linear-gradient(90deg,#013369,#d50a0a);
color:white;
padding:38px 20px 30px;
text-align:center;
position:relative;
overflow:hidden;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(135deg,rgba(255,255,255,.08),transparent);
pointer-events:none;
}

.hero h1{
margin:0;
font-size:54px;
font-weight:900;
letter-spacing:-1px;
position:relative;
z-index:2;
}

.hero-sub{
margin-top:10px;
font-size:15px;
opacity:.9;
position:relative;
z-index:2;
}

.container{
max-width:1500px;
margin:24px auto;
background:white;
padding:28px;
border-radius:16px;
box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.search-row{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:26px;
}

input,select{
padding:12px 14px;
font-size:15px;
border-radius:10px;
border:1px solid #cfd6df;
background:white;
min-width:220px;
}

.section-title{
font-size:34px;
font-weight:900;
margin-top:34px;
margin-bottom:20px;
text-align:center;
color:#111827;
letter-spacing:-0.5px;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:18px;
margin-bottom:20px;
}

.box{
background:white;
padding:24px 16px;
border-radius:16px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
border:1px solid #edf0f5;
transition:.2s ease;
}

.box:hover{
transform:translateY(-2px);
}

.box b{
display:block;
font-size:15px;
margin-bottom:10px;
color:#013369;
text-transform:uppercase;
letter-spacing:.4px;
}

.big-stat{
font-size:34px;
font-weight:900;
line-height:1;
margin-bottom:8px;
}

.sub-stat{
font-size:13px;
color:#555;
line-height:1.5;
}

.table-wrap{
overflow-x:auto;
margin-top:28px;
border-radius:14px;
}

table{
width:100%;
border-collapse:collapse;
min-width:1100px;
}

th,td{
padding:14px 12px;
border-bottom:1px solid #e6ebf2;
text-align:center;
font-size:15px;
}

th{
background:#013369;
color:white;
font-size:14px;
text-transform:uppercase;
letter-spacing:.4px;
position:sticky;
top:0;
z-index:5;
}

tbody tr:nth-child(even){
background:#edf4ff;
}

tbody tr:hover{
background:#dbeafe;
}

.player-link,
.team-link{
color:#013369;
font-weight:700;
text-decoration:none;
}

.loading{
text-align:center;
font-size:24px;
font-weight:800;
padding:70px;
color:#013369;
}

@media(max-width:900px){

.hero h1{
font-size:38px;
}

.container{
padding:16px;
margin:12px;
}

.section-title{
font-size:28px;
}

.summary{
grid-template-columns:repeat(2,1fr);
}

input,select{
width:100%;
min-width:unset;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/nfl.html">NFL</a>
<a href="/nfl-seasons.html">Seasons</a>
</div>

<div class="hero">
<h1 id="playerName">Loading Player...</h1>
<div class="hero-sub" id="heroSub">
NFL Career Statistics
</div>
</div>

<div class="container">

<div class="search-row">

<input list="players" id="playerInput" placeholder="Search player...">
<datalist id="players"></datalist>

<select id="teamFilter">
<option value="">All Teams</option>
</select>

<select id="oppFilter">
<option value="">All Opponents</option>
</select>

</div>

<div id="loading" class="loading">
Loading player data...
</div>

<div id="content" style="display:none;">

<div class="section-title">Career Summary</div>
<div class="summary" id="summary"></div>

<div class="section-title">Career Highs</div>
<div class="summary" id="highs"></div>

<div class="section-title">Records</div>
<div class="summary" id="records"></div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Team</th>
<th>Opponent</th>
<th>Pass Yds</th>
<th>Pass TD</th>
<th>INT</th>
<th>Rush Yds</th>
<th>Rush TD</th>
<th>Rec Yds</th>
<th>Rec TD</th>
</tr>
</thead>

<tbody id="gamesTable"></tbody>

</table>

</div>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const rawPlayer =
decodeURIComponent(params.get("player") || "");

const playerSlug =
String(rawPlayer)
.trim()
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");

const slugify = name =>
String(name || "")
.trim()
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");

let allGames = [];
let playerData = {};

async function loadPlayers(){

try{

const res =
await fetch("/data/nfl/players/index.json?v="+Date.now());

if(!res.ok) return;

const data = await res.json();

const dl = document.getElementById("players");

data.forEach(p=>{

const opt = document.createElement("option");
opt.value = p;
dl.appendChild(opt);

});

}catch(err){

console.log(err);

}

}

document.getElementById("playerInput")
.addEventListener("change",()=>{

const val =
document.getElementById("playerInput").value;

window.location =
"?player="+slugify(val);

});

async function loadPlayer(){

if(!playerSlug){

document.getElementById("loading").innerHTML =
"Player not found";

return;

}

try{

const res =
await fetch(`/data/nfl/players/${playerSlug}.json?v=${Date.now()}`);

if(!res.ok){

document.getElementById("loading").style.display = "none";

document.getElementById("playerName").innerText =
"Player Not Found";

return;

}

playerData = await res.json();

allGames = playerData.games || [];

buildPage();

}catch(err){

console.log(err);

document.getElementById("playerName").innerText =
"Player Not Found";

}

}

function buildPage(){

document.getElementById("loading").style.display = "none";

if(!allGames.length){

document.getElementById("playerName").innerText =
"Player Not Found";

return;

}

document.getElementById("content").style.display = "block";

document.getElementById("playerName").innerText =
playerData.name || "Player";

setupFilters();
render();

}

function setupFilters(){

const teams =
[...new Set(allGames.map(g=>g.team).filter(Boolean))];

const opps =
[...new Set(allGames.map(g=>g.opponent).filter(Boolean))];

const teamFilter =
document.getElementById("teamFilter");

const oppFilter =
document.getElementById("oppFilter");

teams.forEach(t=>{

teamFilter.innerHTML +=
`<option value="${t}">${t}</option>`;

});

opps.forEach(t=>{

oppFilter.innerHTML +=
`<option value="${t}">${t}</option>`;

});

teamFilter.onchange = render;
oppFilter.onchange = render;

}

function render(){

const teamVal =
document.getElementById("teamFilter").value;

const oppVal =
document.getElementById("oppFilter").value;

const table =
document.getElementById("gamesTable");

table.innerHTML = "";

let totals = {
games:0,
passY:0,
passTD:0,
ints:0,
rushY:0,
rushTD:0,
recY:0,
recTD:0
};

let highs = {
passY:0,
passYGame:null,
rushY:0,
rushYGame:null,
recY:0,
recYGame:null
};

allGames.forEach(g=>{

if(teamVal && g.team !== teamVal) return;
if(oppVal && g.opponent !== oppVal) return;

const stats = g.stats || {};

totals.games++;

totals.passY += Number(stats.pass_yds || 0);
totals.passTD += Number(stats.pass_td || 0);
totals.ints += Number(stats.pass_int || 0);

totals.rushY += Number(stats.rush_yds || 0);
totals.rushTD += Number(stats.rush_td || 0);

totals.recY += Number(stats.rec_yds || 0);
totals.recTD += Number(stats.rec_td || 0);

if(Number(stats.pass_yds || 0) > highs.passY){
highs.passY = Number(stats.pass_yds || 0);
highs.passYGame = g;
}

if(Number(stats.rush_yds || 0) > highs.rushY){
highs.rushY = Number(stats.rush_yds || 0);
highs.rushYGame = g;
}

if(Number(stats.rec_yds || 0) > highs.recY){
highs.recY = Number(stats.rec_yds || 0);
highs.recYGame = g;
}

table.innerHTML += `
<tr>
<td>${g.date || ""}</td>
<td>${g.season || ""}</td>
<td>
<a class="team-link" href="/nfl-team.html?team=${encodeURIComponent(g.team || "")}">
${g.team || ""}
</a>
</td>
<td>${g.opponent || ""}</td>
<td>${stats.pass_yds || 0}</td>
<td>${stats.pass_td || 0}</td>
<td>${stats.pass_int || 0}</td>
<td>${stats.rush_yds || 0}</td>
<td>${stats.rush_td || 0}</td>
<td>${stats.rec_yds || 0}</td>
<td>${stats.rec_td || 0}</td>
</tr>
`;

});

document.getElementById("summary").innerHTML = `

<div class="box">
<b>Games</b>
<div class="big-stat">${totals.games}</div>
</div>

<div class="box">
<b>Pass Yards</b>
<div class="big-stat">${totals.passY}</div>
</div>

<div class="box">
<b>Pass TD</b>
<div class="big-stat">${totals.passTD}</div>
</div>

<div class="box">
<b>INT</b>
<div class="big-stat">${totals.ints}</div>
</div>

<div class="box">
<b>Rush Yards</b>
<div class="big-stat">${totals.rushY}</div>
</div>

`;

document.getElementById("highs").innerHTML = `

<div class="box">
<b>Pass Yards</b>
<div class="big-stat">${highs.passY}</div>
<div class="sub-stat">
${highs.passYGame?.opponent || ""}<br>
${highs.passYGame?.date || ""}
</div>
</div>

<div class="box">
<b>Rush Yards</b>
<div class="big-stat">${highs.rushY}</div>
<div class="sub-stat">
${highs.rushYGame?.opponent || ""}<br>
${highs.rushYGame?.date || ""}
</div>
</div>

<div class="box">
<b>Rec Yards</b>
<div class="big-stat">${highs.recY}</div>
<div class="sub-stat">
${highs.recYGame?.opponent || ""}<br>
${highs.recYGame?.date || ""}
</div>
</div>

`;

document.getElementById("records").innerHTML = `

<div class="box">
<b>300+ Passing Games</b>
<div class="big-stat">
${allGames.filter(g=>Number((g.stats || {}).pass_yds || 0) >= 300).length}
</div>
</div>

<div class="box">
<b>3+ Passing TD Games</b>
<div class="big-stat">
${allGames.filter(g=>Number((g.stats || {}).pass_td || 0) >= 3).length}
</div>
</div>

<div class="box">
<b>100+ Passer Rating Games</b>
<div class="big-stat">
${allGames.filter(g=>Number((g.stats || {}).rating || 0) >= 100).length}
</div>
</div>

`;

}

loadPlayers();
loadPlayer();

</script>

</body>
</html>
