<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NRL Season</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  font-family:Inter,Arial;
  margin:0;
  background:#f4f6f8;
}
.page{
  max-width:1200px;
  margin:auto;
  padding:30px;
}
h1{
  margin-bottom:20px;
}
.years{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}
.year-btn{
  padding:8px 14px;
  border-radius:10px;
  background:#ddd;
  cursor:pointer;
  font-weight:600;
}
.year-btn.active{
  background:#222;
  color:white;
}
.layout{
  display:grid;
  grid-template-columns:350px 1fr;
  gap:20px;
}
.table-card{
  background:white;
  padding:14px;
  border-radius:14px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:6px;
  text-align:left;
}
th{
  background:#f0f0f0;
}
.match{
  background:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}
</style>
</head>
<body>

<div class="page">

<h1>NRL Season</h1>

<div id="years" class="years"></div>

<div class="layout">
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Team</th>
          <th>W</th>
          <th>L</th>
        </tr>
      </thead>
      <tbody id="ladder"></tbody>
    </table>
  </div>

  <div id="matches"></div>
</div>

</div>

<script>

let currentSeason = null

// Load available seasons
fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{
  const container=document.getElementById("years")

  index.seasons.sort((a,b)=>a-b).forEach(year=>{
    const btn=document.createElement("div")
    btn.className="year-btn"
    btn.textContent=year
    btn.onclick=()=>loadSeason(year)
    container.appendChild(btn)
  })

  // Auto load first season
  loadSeason(index.seasons[0])
})

function loadSeason(year){

  currentSeason = year

  // Highlight active button
  document.querySelectorAll(".year-btn").forEach(b=>{
    b.classList.remove("active")
    if(b.textContent==year) b.classList.add("active")
  })

  fetch("data/nrl/seasons/"+year+".json")
  .then(r=>{
    if(!r.ok) throw new Error("Season file not found")
    return r.json()
  })
  .then(data=>{

    // ===== LADDER BUILD =====
    const ladderMap = {}

    data.forEach(game=>{
      if(!ladderMap[game.home_team]) ladderMap[game.home_team]={team:game.home_team,w:0,l:0}
      if(!ladderMap[game.away_team]) ladderMap[game.away_team]={team:game.away_team,w:0,l:0}

      if(game.home_points > game.away_points){
        ladderMap[game.home_team].w++
        ladderMap[game.away_team].l++
      } else {
        ladderMap[game.away_team].w++
        ladderMap[game.home_team].l++
      }
    })

    const ladderArr = Object.values(ladderMap)
    ladderArr.sort((a,b)=>b.w-a.w)

    const ladderBody=document.getElementById("ladder")
    ladderBody.innerHTML=""

    ladderArr.forEach((team,i)=>{
      ladderBody.innerHTML+=`
        <tr>
          <td>${i+1}</td>
          <td>${team.team}</td>
          <td>${team.w}</td>
          <td>${team.l}</td>
        </tr>
      `
    })

    // ===== MATCH LIST =====
    const matchesDiv=document.getElementById("matches")
    matchesDiv.innerHTML=""

    data.forEach(game=>{
      matchesDiv.innerHTML+=`
        <div class="match">
          ${game.date_iso} — ${game.home_team} ${game.home_points}
          def ${game.away_team} ${game.away_points}
        </div>
      `
    })

  })
  .catch(err=>{
    console.error("SEASON ERROR:",err)
  })
}

</script>

</body>
</html>
