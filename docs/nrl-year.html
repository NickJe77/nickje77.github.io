<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c1118;
  --board-2:#141c26;
  --board-line:rgba(255,255,255,.10);
  --win:#ffffff;
  --lose:rgba(255,255,255,.42);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

.page{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

h1{
  font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);
  letter-spacing:.01em;text-transform:uppercase;margin:0 0 20px;
}

/* ── Controls ─────────────────────────────────────────── */
.controls{
  display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap;
}

.segment{
  display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px;gap:2px;max-width:100%;
  overflow-x:auto;scrollbar-width:none;
}
.segment::-webkit-scrollbar{display:none;}
.seg-btn{
  border:none;background:transparent;font-family:var(--body);font-size:13px;font-weight:600;
  color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s;
}
.seg-btn:hover{color:var(--ink);}
.seg-btn.active{background:var(--ink);color:#fff;}

select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);min-width:220px;
  cursor:pointer;
}
select:hover{border-color:var(--faint);}

.status{margin:2px 2px 18px;color:var(--muted);font-size:12.5px;font-weight:600;}

/* ── Layout ───────────────────────────────────────────── */
.content{
  display:grid;grid-template-columns:360px 1fr;gap:20px;
}
@media(max-width:820px){
  .content{grid-template-columns:1fr;}
}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
.card-head{
  display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);
}
.card-head h2{
  margin:0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;}
thead th{
  background:#f7f9fb;font-family:var(--body);font-weight:600;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  text-align:center;
}
td{text-align:center;font-variant-numeric:tabular-nums;color:#27313c;}
td.team{text-align:left;font-weight:700;color:var(--ink);}
tbody tr:hover td{background:#f0f6ff;}

/* ── Match list ───────────────────────────────────────── */
.matches{display:flex;flex-direction:column;gap:10px;}
.match{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 18px;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s;
}
.match:hover{
  transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,16,24,.18);border-color:var(--faint);
}
.match .line1{
  font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.01em;color:var(--ink);
}
.match .line2{color:var(--muted);font-size:12px;margin-top:4px;font-weight:600;letter-spacing:.02em;}

.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;}
</style>
</head>

<body>

<nav class="navbar">
<a href="/">Home</a>
<a href="/nrl.html">NRL</a>
</nav>

<div class="page">

<h1>NRL Season</h1>

<div class="controls">
<div class="segment year-bar" id="years"></div>

<select id="roundFilter">
<option value="">All Rounds</option>
</select>

<select id="teamFilter">
<option value="">All Teams</option>
</select>
</div>

<div class="status" id="status">Loading seasons…</div>

<div class="content">
<div class="card">
<div class="card-head"><h2>Ladder</h2></div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>#</th>
<th style="text-align:left;">Team</th>
<th>W</th>
<th>L</th>
</tr>
</thead>

<tbody id="ladderBody"></tbody>
</table>
</div>
</div>

<div class="matches" id="matches"></div>
</div>
</div>

<script>

let seasonRows=[]
let currentSeason=null
let isNewStructure=false

function toNum(v){
const n=Number(v)
return Number.isFinite(n)?n:0
}

fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{

const years=index.seasons.slice().sort((a,b)=>a-b)

const yearsDiv=document.getElementById("years")

years.forEach(y=>{
const btn=document.createElement("button")
btn.className="seg-btn"
btn.textContent=y
btn.onclick=()=>loadSeason(y)
yearsDiv.appendChild(btn)
})

loadSeason(years[years.length-1])

})

function setActiveYear(y){
document.querySelectorAll(".seg-btn").forEach(b=>{
b.classList.toggle("active",b.textContent==y)
})
}

function loadSeason(year){

currentSeason=year
setActiveYear(year)

document.getElementById("status").textContent="Loading "+year+"..."

fetch("data/nrl/seasons/"+year+".json")
.then(r=>r.json())
.then(data=>{

isNewStructure = data.length && data[0].home_score !== undefined

seasonRows=data
buildTeamSelector()
buildRoundSelector()
render()

})

}

function buildTeamSelector(){

const sel=document.getElementById("teamFilter")
const teams=new Set()

seasonRows.forEach(r=>{
teams.add(r.home_team)
teams.add(r.away_team)
})

sel.innerHTML='<option value="">All Teams</option>'

Array.from(teams).sort().forEach(t=>{
const opt=document.createElement("option")
opt.value=t
opt.textContent=t
sel.appendChild(opt)
})

sel.onchange=render

}

function buildRoundSelector(){

const sel=document.getElementById("roundFilter")
const rounds=new Set()

seasonRows.forEach(r=>{
if(r.is_finals){
rounds.add("Finals")
}else if(r.round!==undefined && r.round!==null && r.round!==""){
rounds.add(String(r.round))
}
})

const sortedRounds=Array.from(rounds).sort((a,b)=>{
if(a==="Finals") return 1
if(b==="Finals") return -1
return toNum(a)-toNum(b)
})

sel.innerHTML='<option value="">All Rounds</option>'

sortedRounds.forEach(r=>{
const opt=document.createElement("option")
opt.value=r
opt.textContent=r==="Finals"?"Finals":"Round "+r
sel.appendChild(opt)
})

sel.onchange=render

}

function render(){

const team=document.getElementById("teamFilter").value
const round=document.getElementById("roundFilter").value

let matches=[]

if(isNewStructure){

matches = seasonRows
.filter(m=>{
if(team && m.home_team!==team && m.away_team!==team) return false
if(round){
const rLabel = m.is_finals ? "Finals" : String(m.round)
if(rLabel!==round) return false
}
return true
})
.map(m=>({
match_id:m.match_id || m.game_id,
date_iso:m.date || m.date_iso,
venue:m.venue,
home_team:m.home_team,
away_team:m.away_team,
home_points:toNum(m.home_score),
away_points:toNum(m.away_score)
}))

}else{

const matchMap=new Map()

seasonRows.forEach(r=>{

if(team && r.home_team!==team && r.away_team!==team) return

if(round){
const rLabel = r.is_finals ? "Finals" : String(r.round)
if(rLabel!==round) return
}

if(!matchMap.has(r.match_id)){
matchMap.set(r.match_id,r)
}

})

matches=Array.from(matchMap.values())

}

matches.sort((a,b)=>String(a.match_id).localeCompare(String(b.match_id)))

renderMatches(matches)
renderLadder(matches)

document.getElementById("status").textContent=currentSeason+" loaded: "+matches.length+" matches"

}

function renderMatches(matches){

const div=document.getElementById("matches")

div.innerHTML=matches.map(m=>{

const line1=`${m.home_team} ${m.home_points} - ${m.away_points} ${m.away_team}`
const meta=`${m.date_iso}${m.venue?" • "+m.venue:""}`

const link = `nrl-game.html?season=${currentSeason}&match=${m.match_id}`

return `
<div class="match" onclick="window.location.href='${link}'">
<div class="line1">${line1}</div>
<div class="line2">${meta}</div>
</div>
`

}).join("")

}

function renderLadder(matches){

const ladder={}

matches.forEach(m=>{

if(!ladder[m.home_team]) ladder[m.home_team]={team:m.home_team,W:0,L:0}
if(!ladder[m.away_team]) ladder[m.away_team]={team:m.away_team,W:0,L:0}

if(m.home_points>m.away_points){
ladder[m.home_team].W++
ladder[m.away_team].L++
}else if(m.away_points>m.home_points){
ladder[m.away_team].W++
ladder[m.home_team].L++
}

})

const arr=Object.values(ladder).sort((a,b)=>b.W-a.W)

document.getElementById("ladderBody").innerHTML=
arr.map((t,i)=>`
<tr>
<td>${i+1}</td>
<td class="team">${t.team}</td>
<td>${t.W}</td>
<td>${t.L}</td>
</tr>
`).join("")

}

</script>

</body>
</html>
