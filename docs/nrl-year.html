<!DOCTYPE html>
<html>
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Season</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{max-width:1200px;margin:auto;padding:30px;}

.controls{
display:flex;
gap:14px;
align-items:center;
margin-bottom:18px;
flex-wrap:wrap;
}

select{
padding:12px 16px;
border-radius:10px;
border:1px solid #bbb;
font-size:16px;
font-weight:600;
min-width:260px;
}

.year-bar{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:18px;
}

.year-btn{
padding:8px 14px;
border-radius:10px;
background:#ddd;
cursor:pointer;
font-weight:700;
}

.year-btn.active{
background:#222;
color:#fff;
}

.status{margin:10px 0 18px;color:#444;font-weight:600;}

.content{
display:grid;
grid-template-columns:360px 1fr;
gap:20px;
}

.card{
background:#fff;
border-radius:14px;
padding:14px;
box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

table{width:100%;border-collapse:collapse;font-size:14px;}

th,td{
border-bottom:1px solid #eee;
padding:8px;
text-align:center;
}

th{background:#f3f5f7;}

td.team{text-align:left;font-weight:700;}

.match{
background:#fff;
border-radius:12px;
padding:12px;
margin-bottom:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.04);
cursor:pointer;
}

.match:hover{
transform:translateY(-2px);
box-shadow:0 4px 14px rgba(0,0,0,0.08);
}

.match .line1{font-weight:800;}
.match .line2{color:#666;font-size:13px;margin-top:4px;}
</style>
</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/nrl.html">NRL</a>
</div>

<div class="page">

<h1>NRL Season</h1>

<div class="controls">
<div class="year-bar" id="years"></div>

<select id="teamFilter">
<option value="">All Teams</option>
</select>
</div>

<div class="status" id="status">Loading seasons…</div>

<div class="content">
<div class="card">

<table>
<thead>
<tr>
<th>#</th>
<th>Team</th>
<th>W</th>
<th>L</th>
</tr>
</thead>

<tbody id="ladderBody"></tbody>
</table>

</div>

<div id="matches"></div>
</div>
</div>

<script>

let seasonRows=[]
let currentSeason=null
let isNewStructure=false

function toNum(v){
const n=Number(v)
return Number.isFinite(n)?n:0
}

fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{

const years=index.seasons.slice().sort((a,b)=>a-b)

const yearsDiv=document.getElementById("years")

years.forEach(y=>{
const btn=document.createElement("div")
btn.className="year-btn"
btn.textContent=y
btn.onclick=()=>loadSeason(y)
yearsDiv.appendChild(btn)
})

loadSeason(years[years.length-1])

})

function setActiveYear(y){
document.querySelectorAll(".year-btn").forEach(b=>{
b.classList.toggle("active",b.textContent==y)
})
}

function loadSeason(year){

currentSeason=year
setActiveYear(year)

document.getElementById("status").textContent="Loading "+year+"..."

fetch("data/nrl/seasons/"+year+".json")
.then(r=>r.json())
.then(data=>{

isNewStructure = data.length && data[0].home_score !== undefined

seasonRows=data
buildTeamSelector()
render()

})

}

function buildTeamSelector(){

const sel=document.getElementById("teamFilter")
const teams=new Set()

seasonRows.forEach(r=>{
teams.add(r.home_team)
teams.add(r.away_team)
})

sel.innerHTML='<option value="">All Teams</option>'

Array.from(teams).sort().forEach(t=>{
const opt=document.createElement("option")
opt.value=t
opt.textContent=t
sel.appendChild(opt)
})

sel.onchange=render

}

function render(){

const team=document.getElementById("teamFilter").value

let matches=[]

if(isNewStructure){

matches = seasonRows
.filter(m=>{
if(!team) return true
return m.home_team===team || m.away_team===team
})
.map(m=>({
match_id:m.match_id || m.game_id,
date_iso:m.date || m.date_iso,
venue:m.venue,
home_team:m.home_team,
away_team:m.away_team,
home_points:toNum(m.home_score),
away_points:toNum(m.away_score)
}))

}else{

const matchMap=new Map()

seasonRows.forEach(r=>{

if(team && r.home_team!==team && r.away_team!==team) return

if(!matchMap.has(r.match_id)){
matchMap.set(r.match_id,r)
}

})

matches=Array.from(matchMap.values())

}

matches.sort((a,b)=>String(a.match_id).localeCompare(String(b.match_id)))

renderMatches(matches)
renderLadder(matches)

document.getElementById("status").textContent=currentSeason+" loaded: "+matches.length+" matches"

}

function renderMatches(matches){

const div=document.getElementById("matches")

div.innerHTML=matches.map(m=>{

const line1=`${m.home_team} ${m.home_points} - ${m.away_points} ${m.away_team}`
const meta=`${m.date_iso}${m.venue?" • "+m.venue:""}`

const link = `nrl-game.html?season=${currentSeason}&match=${m.match_id}`

return `
<div class="match" onclick="window.location.href='${link}'">
<div class="line1">${line1}</div>
<div class="line2">${meta}</div>
</div>
`

}).join("")

}

function renderLadder(matches){

const ladder={}

matches.forEach(m=>{

if(!ladder[m.home_team]) ladder[m.home_team]={team:m.home_team,W:0,L:0}
if(!ladder[m.away_team]) ladder[m.away_team]={team:m.away_team,W:0,L:0}

if(m.home_points>m.away_points){
ladder[m.home_team].W++
ladder[m.away_team].L++
}else if(m.away_points>m.home_points){
ladder[m.away_team].W++
ladder[m.home_team].L++
}

})

const arr=Object.values(ladder).sort((a,b)=>b.W-a.W)

document.getElementById("ladderBody").innerHTML=
arr.map((t,i)=>`
<tr>
<td>${i+1}</td>
<td class="team">${t.team}</td>
<td>${t.W}</td>
<td>${t.L}</td>
</tr>
`).join("")

}

</script>

</body>
</html>
