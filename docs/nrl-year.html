<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NRL Season</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}

.page{max-width:1200px;margin:auto;padding:30px;}

h1{margin:0 0 20px;}

.year-bar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}

.year-btn{
  padding:8px 14px;
  background:#ddd;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.year-btn.active{
  background:#222;
  color:white;
}

.filters{
  margin-bottom:20px;
}

select{
  padding:8px;
  border-radius:6px;
}

.content{
  display:flex;
  gap:30px;
}

.ladder{
  width:35%;
  background:white;
  border-radius:10px;
  padding:10px;
}

.ladder table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

.ladder th,.ladder td{
  border:1px solid #eee;
  padding:6px;
  text-align:center;
}

.matches{
  width:65%;
}

.match{
  background:white;
  padding:12px;
  border-radius:8px;
  margin-bottom:10px;
}
</style>
</head>
<body>

<div class="page">

<h1>NRL Season</h1>

<div class="year-bar" id="years"></div>

<div class="filters">
<select id="teamFilter">
<option value="">All Teams</option>
</select>
</div>

<div class="content">
  <div class="ladder">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Team</th>
          <th>W</th>
          <th>L</th>
        </tr>
      </thead>
      <tbody id="ladderBody"></tbody>
    </table>
  </div>

  <div class="matches" id="matches"></div>
</div>

</div>

<script>

let allMatches=[];
let currentSeason=null;

fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{

  const yearBar=document.getElementById("years");

  index.seasons.forEach(y=>{
    const btn=document.createElement("div");
    btn.className="year-btn";
    btn.textContent=y;
    btn.onclick=()=>loadSeason(y);
    yearBar.appendChild(btn);
  });

  loadSeason(index.seasons[0]);
});

function loadSeason(year){

  currentSeason=year;

  document.querySelectorAll(".year-btn").forEach(b=>{
    b.classList.toggle("active",b.textContent==year);
  });

  fetch("data/nrl/seasons/"+year+".json")
  .then(r=>r.json())
  .then(data=>{
    allMatches=data;
    buildLadder(data);
    buildMatches(data);
    buildTeamFilter(data);
  });
}

function buildLadder(matches){

  const ladder={};

  matches.forEach(m=>{

    if(!ladder[m.home_team]) ladder[m.home_team]={W:0,L:0};
    if(!ladder[m.away_team]) ladder[m.away_team]={W:0,L:0};

    if(m.home_points > m.away_points){
      ladder[m.home_team].W++;
      ladder[m.away_team].L++;
    } else if(m.away_points > m.home_points){
      ladder[m.away_team].W++;
      ladder[m.home_team].L++;
    }

  });

  const sorted=Object.entries(ladder)
    .sort((a,b)=>b[1].W - a[1].W);

  const body=document.getElementById("ladderBody");
  body.innerHTML="";

  sorted.forEach((t,i)=>{
    body.innerHTML+=`
      <tr>
        <td>${i+1}</td>
        <td>${t[0]}</td>
        <td>${t[1].W}</td>
        <td>${t[1].L}</td>
      </tr>
    `;
  });
}

function buildMatches(matches){

  const container=document.getElementById("matches");
  container.innerHTML="";

  matches.forEach(m=>{
    container.innerHTML+=`
      <div class="match">
        ${m.home_team} ${m.home_points} - ${m.away_points} ${m.away_team}
      </div>
    `;
  });
}

function buildTeamFilter(matches){

  const teams=[...new Set(
    matches.flatMap(m=>[m.home_team,m.away_team])
  )].sort();

  const select=document.getElementById("teamFilter");

  select.innerHTML="<option value=''>All Teams</option>";

  teams.forEach(t=>{
    select.innerHTML+=`<option value="${t}">${t}</option>`;
  });

  select.onchange=()=>{
    const val=select.value;
    if(!val){
      buildMatches(allMatches);
      return;
    }

    const filtered=allMatches.filter(m=>
      m.home_team===val || m.away_team===val
    );

    buildMatches(filtered);
  };
}

</script>

</body>
</html>
