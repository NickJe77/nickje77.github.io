<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NRL Season</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1200px;margin:auto;padding:30px;}
h1{margin:0 0 18px;}

.year-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.year-btn{padding:8px 14px;border-radius:10px;background:#ddd;cursor:pointer;font-weight:700;user-select:none;}
.year-btn.active{background:#222;color:#fff;}

.status{margin:10px 0 18px;color:#444;font-weight:600;}

.content{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start;}

.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 3px 10px rgba(0,0,0,0.05);}

table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{border-bottom:1px solid #eee;padding:8px;text-align:center;}
th{background:#f3f5f7;}
td.team{text-align:left;font-weight:700;}

.match{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
  cursor:pointer;
  transition:all .15s ease;
}
.match:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 14px rgba(0,0,0,0.08);
}
.match .line1{font-weight:800;}
.match .line2{color:#666;font-size:13px;margin-top:4px;}
.small{font-size:12px;color:#777;}
</style>
</head>
<body>

<div class="page">
  <h1>NRL Season</h1>

  <div class="year-bar" id="years"></div>
  <div class="status" id="status">Loading seasons…</div>

  <div class="content">
    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width:42px;">#</th>
            <th>Team</th>
            <th style="width:60px;">W</th>
            <th style="width:60px;">L</th>
          </tr>
        </thead>
        <tbody id="ladderBody"></tbody>
      </table>
    </div>

    <div id="matches"></div>
  </div>
</div>

<script>
let currentYear = null;
let loadToken = 0;

function toNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{
  const yearsDiv = document.getElementById("years");
  const status = document.getElementById("status");

  let years = [];

  if(Array.isArray(index.seasons) && index.seasons.length){
    years = index.seasons.slice().sort((a,b)=>a-b);
  } else if(index.first_season && index.last_season){
    for(let y=index.first_season; y<=index.last_season; y++){
      years.push(y);
    }
  } else {
    status.textContent = "Index.json missing seasons.";
    return;
  }

  years.forEach(y=>{
    const btn=document.createElement("div");
    btn.className="year-btn";
    btn.textContent=String(y);
    btn.onclick=()=>loadSeason(y);
    yearsDiv.appendChild(btn);
  });

  status.textContent = "Select a season.";
  loadSeason(years[0]);
})
.catch(err=>{
  document.getElementById("status").textContent = "Index load failed.";
  console.error(err);
});

function setActiveYear(y){
  document.querySelectorAll(".year-btn").forEach(b=>{
    b.classList.toggle("active", b.textContent == String(y));
  });
}

function loadSeason(year){
  currentYear = year;
  const myToken = ++loadToken;
  setActiveYear(year);

  document.getElementById("status").textContent = "Loading " + year + "…";
  document.getElementById("ladderBody").innerHTML = "";
  document.getElementById("matches").innerHTML = "";

  fetch("data/nrl/seasons/" + year + ".json")
  .then(r=>{
    if(!r.ok) throw new Error("Season file not found");
    return r.json();
  })
  .then(rows=>{
    if(myToken !== loadToken) return;

    if(!Array.isArray(rows) || !rows.length){
      document.getElementById("status").textContent = "No data for " + year;
      return;
    }

    const matchMap = new Map();

    rows.forEach(r=>{
      const id = String(r.match_id || "");
      if(!id) return;

      if(!matchMap.has(id)){
        matchMap.set(id,{
          match_id:id,
          date_iso:r.date_iso || "",
          venue:r.venue || "",
          home_team:r.home_team || "",
          away_team:r.away_team || "",
          home_points:toNum(r.home_points),
          away_points:toNum(r.away_points)
        });
      }
    });

    const matches = Array.from(matchMap.values());

    // Ladder
    const ladder = {};
    matches.forEach(m=>{
      if(!m.home_team || !m.away_team) return;

      if(!ladder[m.home_team]) ladder[m.home_team]={team:m.home_team,W:0,L:0};
      if(!ladder[m.away_team]) ladder[m.away_team]={team:m.away_team,W:0,L:0};

      if(m.home_points > m.away_points){
        ladder[m.home_team].W++;
        ladder[m.away_team].L++;
      } else if(m.away_points > m.home_points){
        ladder[m.away_team].W++;
        ladder[m.home_team].L++;
      }
    });

    const ladderArr = Object.values(ladder).sort((a,b)=>b.W-a.W);

    document.getElementById("ladderBody").innerHTML =
      ladderArr.map((t,i)=>`
        <tr>
          <td>${i+1}</td>
          <td class="team">${t.team}</td>
          <td>${t.W}</td>
          <td>${t.L}</td>
        </tr>
      `).join("");

    const matchesDiv = document.getElementById("matches");

    matchesDiv.innerHTML = matches.map(m=>{
      const line1 = `${m.home_team} ${m.home_points} - ${m.away_points} ${m.away_team}`;
      const meta = `${m.date_iso}${m.venue ? " • " + m.venue : ""}`;

      return `
        <div class="match"
             onclick="window.location.href='nrl-match.html?season=${year}&match=${m.match_id}'">
          <div class="line1">${line1}</div>
          <div class="line2">${meta}</div>
        </div>
      `;
    }).join("");

    document.getElementById("status").textContent =
      year + " loaded: " + matches.length + " matches";
  })
  .catch(err=>{
    if(myToken !== loadToken) return;
    document.getElementById("status").textContent = "Load error.";
    console.error(err);
  });
}
</script>

</body>
</html>
