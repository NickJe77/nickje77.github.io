<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NRL Seasons</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1000px;margin:auto;padding:30px;}
.hero{background:linear-gradient(90deg,#0055A4,#00A651);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.year{background:white;padding:14px;border-radius:12px;margin-bottom:10px;font-weight:600;cursor:pointer;}
.year:hover{background:#eaf3ff;}
</style>
</head>
<body>
<div class="page">
<div class="hero"><h1>NRL Seasons</h1></div>
<div id="list"></div>
</div>

<script>
fetch("data/nrl/index.json")
.then(r=>r.json())
.then(d=>{
  const list=document.getElementById("list");
  d.seasons.reverse().forEach(y=>{
    const div=document.createElement("div");
    div.className="year";
    div.textContent=y;
    div.onclick=()=>window.location="nrl-match.html?season="+y;
    list.appendChild(div);
  });
});
</script>
</body>
</html>
