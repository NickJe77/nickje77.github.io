<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Formula 1 Constructors | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.hero{width:100%;height:220px;position:relative;overflow:hidden;}
.hero img{width:100%;height:100%;object-fit:cover;display:block;}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(12,19,15,.55),rgba(12,19,15,.75));
}
.hero-caption{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;z-index:2;color:#fff;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero-caption h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}
p.lead{text-align:center;color:var(--muted);margin:0 0 22px;font-size:14.5px;}

.controls{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
select,input{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);
}
select{cursor:pointer;}
input{width:240px;}
select:hover,input:hover{border-color:var(--faint);}
select:focus,input:focus{outline:none;border-color:var(--accent);}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:center;cursor:pointer;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);user-select:none;
}
th:hover{color:var(--ink);}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}

a.team-link{color:var(--ink);text-decoration:none;font-weight:700;}
a.team-link:hover{color:var(--accent);}
</style>
</head>

<body>

<div class="hero">
  <img src="images/f1-header.jpg" alt="Formula 1">
  <div class="hero-caption">
    <span class="eyebrow">Formula 1</span>
    <h1>Constructors</h1>
  </div>
</div>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">
<p class="lead">Constructor performance by season or across all seasons.</p>

<div class="controls">
  <select id="seasonSelect"></select>
  <input id="filterBox" type="text" placeholder="Filter constructor…">
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th data-key="constructor">Constructor</th>
  <th data-key="races">Races</th>
  <th data-key="wins">Wins</th>
  <th data-key="championships">Championships</th>
  <th data-key="points">Points</th>
</tr>
</thead>
<tbody id="constructorTable"></tbody>
</table>
</div>
</div>

<script>
const startYear = 1950;
const endYear = new Date().getFullYear();

const seasonSelect = document.getElementById("seasonSelect");
const filterBox = document.getElementById("filterBox");
const tableBody = document.getElementById("constructorTable");

let allSeasonData = [];
let currentStats = {};
let sortKey = "points";
let sortDir = -1;

/* NORMALIZE CONSTRUCTOR NAMES */
function cleanConstructor(name){
  if(!name) return "";
  let n = String(name).trim();
  n = n.replace(/-.*$/,"").replace(/\s+/g," ").trim();
  const low = n.toLowerCase();

  if(low.includes("red bull")) return "Red Bull";
  if(low.startsWith("mclaren")) return "McLaren";
  if(low.startsWith("lotus")) return "Lotus";
  if(low.startsWith("brabham")) return "Brabham";
  if(low.startsWith("benetton")) return "Benetton";
  if(low.startsWith("toro rosso")) return "Toro Rosso";
  if(low.startsWith("alphatauri")) return "AlphaTauri";
  if(low.startsWith("sauber") || low.startsWith("bmw sauber")) return "Sauber";
  if(low.startsWith("alfa romeo")) return "Alfa Romeo";
  if(low.startsWith("williams")) return "Williams";
  if(low.startsWith("ferrari")) return "Ferrari";
  if(low.startsWith("renault")) return "Renault";
  if(low.startsWith("mercedes")) return "Mercedes";
  if(low.startsWith("aston")) return "Aston Martin";

  return n;
}

/* SEASON DROPDOWN */
seasonSelect.innerHTML = `<option value="all">All Time</option>`;
for(let y=startYear;y<=endYear;y++){
  const opt=document.createElement("option");
  opt.value=y;
  opt.textContent=y;
  seasonSelect.appendChild(opt);
}

seasonSelect.addEventListener("change", loadSeason);
filterBox.addEventListener("input", renderTable);

document.querySelectorAll("th").forEach(th=>{
  th.addEventListener("click", ()=>{
    const key = th.dataset.key;
    if(sortKey===key){
      sortDir*=-1;
    }else{
      sortKey=key;
      sortDir=-1;
    }
    renderTable();
  });
});

/* FAST BATCH LOADER */
async function loadAllSeasons(){
  tableBody.innerHTML = "Loading all seasons…";

  let years=[];
  for(let y=startYear;y<=endYear;y++) years.push(y);

  const batchSize = 10;

  for(let i=0;i<years.length;i+=batchSize){
    const batch = years.slice(i,i+batchSize);

    const promises = batch.map(y =>
      fetch(`data/f1/${y}.json`).then(r=>r.ok?r.json():null)
    );

    const results = await Promise.all(promises);
    results.filter(x=>x).forEach(d=>allSeasonData.push(d));

    buildStats(allSeasonData);
  }
}

async function loadSeason(){
  const season = seasonSelect.value;

  if(season==="all"){
    if(allSeasonData.length===0){
      loadAllSeasons();
    }else{
      buildStats(allSeasonData);
    }
  }else{
    tableBody.innerHTML="Loading…";
    try{
      const r = await fetch(`data/f1/${season}.json`);
      if(!r.ok){tableBody.innerHTML="";return;}
      const d = await r.json();
      buildStats([d]);
    }catch(e){
      tableBody.innerHTML="";
    }
  }
}

function buildStats(seasons){
  const stats = {};
  const seasonChampions = {};

  seasons.forEach(data=>{
    const seasonTotals = {};

    (data.races||[]).forEach(race=>{
      (race.results||[]).forEach(r=>{
        const team = cleanConstructor(r.team);
        if(!team) return;

        if(!stats[team]){
          stats[team]={races:0,wins:0,points:0,championships:0};
        }

        stats[team].races++;
        if(Number(r.position)===1) stats[team].wins++;
        stats[team].points += Number(r.points)||0;

        if(!seasonTotals[team]) seasonTotals[team]=0;
        seasonTotals[team] += Number(r.points)||0;
      });
    });

    const champion = Object.entries(seasonTotals)
      .sort((a,b)=>b[1]-a[1])[0]?.[0];

    if(champion){
      seasonChampions[champion] = (seasonChampions[champion]||0)+1;
    }
  });

  Object.keys(seasonChampions).forEach(team=>{
    if(stats[team]){
      stats[team].championships = seasonChampions[team];
    }
  });

  currentStats = stats;
  renderTable();
}

function renderTable(){
  const filter = filterBox.value.toLowerCase();
  tableBody.innerHTML="";

  let rows = Object.entries(currentStats)
    .filter(([name])=>name.toLowerCase().includes(filter));

  rows.sort((a,b)=>{
    return (a[1][sortKey] - b[1][sortKey]) * sortDir;
  });

  rows.forEach(([name,s])=>{
    const safeName = encodeURIComponent(name);
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><a class="team-link" href="f1-constructor.html?team=${safeName}">${name}</a></td>
      <td>${s.races}</td>
      <td>${s.wins}</td>
      <td>${s.championships}</td>
      <td>${s.points.toFixed(1)}</td>
    `;
    tableBody.appendChild(tr);
  });
}

loadSeason();
</script>

</body>
</html>
