<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Formula 1 Constructors | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
}

.hero{width:100%;height:260px;overflow:hidden;}
.hero img{width:100%;height:100%;object-fit:cover;}

.navbar{
  display:flex;justify-content:center;gap:22px;
  padding:16px 0;border-bottom:1px solid #ddd;
  font-weight:600;background:#fff;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}

h1{text-align:center;margin-bottom:6px;}
p{text-align:center;color:#555;margin-bottom:20px;}

.controls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:20px;
}

select,input{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}

table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:center;cursor:pointer;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}

a.team-link{color:#0056d6;text-decoration:none;font-weight:600;}
a.team-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="hero">
  <img src="images/f1-header.jpg" alt="Formula 1">
</div>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">
<h1>Formula 1 Constructors</h1>
<p>Constructor performance by season or across all seasons.</p>

<div class="controls">
  <select id="seasonSelect"></select>
  <input id="filterBox" type="text" placeholder="Filter constructor…">
</div>

<table>
<thead>
<tr>
  <th data-key="constructor">Constructor</th>
  <th data-key="races">Races</th>
  <th data-key="wins">Wins</th>
  <th data-key="points">Points</th>
</tr>
</thead>
<tbody id="constructorTable"></tbody>
</table>
</div>

<script>
const startYear = 1950;
const endYear = new Date().getFullYear();

const seasonSelect = document.getElementById("seasonSelect");
const filterBox = document.getElementById("filterBox");
const tableBody = document.getElementById("constructorTable");

let allSeasonData = [];
let currentStats = {};
let sortKey = "points";
let sortDir = -1;

/* NORMALIZE CONSTRUCTOR NAMES */
function cleanConstructor(name){
  if(!name) return "";
  let n = String(name).trim();
  n = n.replace(/-.*$/,"").replace(/\s+/g," ").trim();
  const low = n.toLowerCase();

  if(low.includes("red bull")) return "Red Bull";
  if(low.startsWith("mclaren")) return "McLaren";
  if(low.startsWith("lotus")) return "Lotus";
  if(low.startsWith("brabham")) return "Brabham";
  if(low.startsWith("benetton")) return "Benetton";
  if(low.startsWith("toro rosso")) return "Toro Rosso";
  if(low.startsWith("alphatauri")) return "AlphaTauri";
  if(low.startsWith("sauber") || low.startsWith("bmw sauber")) return "Sauber";
  if(low.startsWith("alfa romeo")) return "Alfa Romeo";
  if(low.startsWith("williams")) return "Williams";
  if(low.startsWith("ferrari")) return "Ferrari";
  if(low.startsWith("renault")) return "Renault";
  if(low.startsWith("mercedes")) return "Mercedes";
  if(low.startsWith("aston")) return "Aston Martin";

  return n;
}

/* SEASON DROPDOWN */
seasonSelect.innerHTML = `<option value="all">All Time</option>`;
for(let y=startYear;y<=endYear;y++){
  const opt=document.createElement("option");
  opt.value=y;
  opt.textContent=y;
  seasonSelect.appendChild(opt);
}

seasonSelect.addEventListener("change", loadSeason);
filterBox.addEventListener("input", renderTable);

document.querySelectorAll("th").forEach(th=>{
  th.addEventListener("click", ()=>{
    const key = th.dataset.key;
    if(sortKey===key){
      sortDir*=-1;
    }else{
      sortKey=key;
      sortDir=-1;
    }
    renderTable();
  });
});

/* FAST BATCH LOADER */
async function loadAllSeasons(){
  tableBody.innerHTML = "Loading all seasons…";

  let years=[];
  for(let y=startYear;y<=endYear;y++) years.push(y);

  const batchSize = 10;

  for(let i=0;i<years.length;i+=batchSize){
    const batch = years.slice(i,i+batchSize);

    const promises = batch.map(y =>
      fetch(`data/f1/${y}.json`).then(r=>r.ok?r.json():null)
    );

    const results = await Promise.all(promises);
    results.filter(x=>x).forEach(d=>allSeasonData.push(d));

    buildStats(allSeasonData);
  }
}

async function loadSeason(){
  const season = seasonSelect.value;

  if(season==="all"){
    if(allSeasonData.length===0){
      loadAllSeasons();
    }else{
      buildStats(allSeasonData);
    }
  }else{
    tableBody.innerHTML="Loading…";
    try{
      const r = await fetch(`data/f1/${season}.json`);
      if(!r.ok){tableBody.innerHTML="";return;}
      const d = await r.json();
      buildStats([d]);
    }catch(e){
      tableBody.innerHTML="";
    }
  }
}

function buildStats(seasons){
  const stats={};

  seasons.forEach(data=>{
    (data.races||[]).forEach(race=>{
      (race.results||[]).forEach(r=>{
        const team = cleanConstructor(r.team);
        if(!team) return;

        if(!stats[team]){
          stats[team]={races:0,wins:0,points:0};
        }
        stats[team].races++;
        if(Number(r.position)===1) stats[team].wins++;
        stats[team].points += Number(r.points)||0;
      });
    });
  });

  currentStats = stats;
  renderTable();
}

function renderTable(){
  const filter = filterBox.value.toLowerCase();
  tableBody.innerHTML="";

  let rows = Object.entries(currentStats)
    .filter(([name])=>name.toLowerCase().includes(filter));

  rows.sort((a,b)=>{
    return (a[1][sortKey] - b[1][sortKey]) * sortDir;
  });

  rows.forEach(([name,s])=>{
    const safeName = encodeURIComponent(name);
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><a class="team-link" href="f1-constructor.html?team=${safeName}">${name}</a></td>
      <td>${s.races}</td>
      <td>${s.wins}</td>
      <td>${s.points.toFixed(1)}</td>
    `;
    tableBody.appendChild(tr);
  });
}

loadSeason();
</script>

</body>
</html>
