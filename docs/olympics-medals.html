<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Olympics | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
    font-family:var(--body);
    margin:0;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
}

/* NAV */
.navbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    font-weight:600;
    font-size:13.5px;
}
.navbar a{
    color:var(--ink);
    text-decoration:none;
    opacity:.7;
    transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
    opacity:1;
    color:var(--accent);
}

/* HERO */
.hero{
    background:linear-gradient(160deg,var(--board-2),var(--board));
    color:#fff;
    text-align:center;
    padding:36px 20px;
}
.hero h1{
    margin:0;
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(22px,4.5vw,34px);
    letter-spacing:.01em;
    text-transform:uppercase;
}
.hero p{
    margin-top:8px;
    font-size:13.5px;
    color:rgba(255,255,255,.68);
}

/* CONTENT */
.container{
    max-width:1100px;
    margin:0 auto;
    padding:26px 20px 70px;
}

/* TABLE */
.table-wrap{
    overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
}
table{
    width:100%;
    border-collapse:collapse;
}
th, td{
    padding:11px 14px;
    text-align:center;
    font-size:13.5px;
}
th{
    background:#f7f9fb;
    color:var(--muted);
    font-family:var(--body);
    font-weight:600;
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    border-bottom:1px solid var(--line);
}
td{
    border-bottom:1px solid var(--line);
    color:#27313c;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
td.country{
    text-align:left;
    font-weight:700;
    color:var(--ink);
}

/* FILTER */
.controls{
    margin-bottom:18px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}
.controls label{
    font-weight:600;
    font-size:13px;
    color:var(--muted);
    margin-right:8px;
}
select{
    padding:10px 16px;
    font-size:13.5px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    font-family:var(--body);
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

/* MOBILE */
@media(max-width:700px){
    th, td{
        font-size:12px;
        padding:8px;
    }
}
</style>
</head>

<body>

<nav class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</nav>

<div class="hero">
    <h1>Olympic Medal Table</h1>
    <p>All-Time Summer Olympics</p>
</div>

<div class="container">

<div class="controls">
    <div>
        <label>Sort:</label>
        <select id="sort">
            <option value="gold">Gold</option>
            <option value="total">Total</option>
        </select>
    </div>
</div>

<div class="table-wrap">
<table id="table">
    <thead>
        <tr>
            <th>#</th>
            <th>Country</th>
            <th>Gold</th>
            <th>Silver</th>
            <th>Bronze</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
</div>

</div>

<script>

let data = [];

async function load(){
    const res = await fetch("data/olympics/olympic_country_table.json");
    data = await res.json();
    render();
}

function render(){
    const tbody = document.querySelector("#table tbody");
    tbody.innerHTML = "";

    const sort = document.getElementById("sort").value;

    let sorted = [...data];

    if(sort === "gold"){
        sorted.sort((a,b)=> b.GOLD - a.GOLD || b.SILVER - a.SILVER || b.BRONZE - a.BRONZE);
    } else {
        sorted.sort((a,b)=> b.total - a.total);
    }

    sorted.forEach((row,i)=>{
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${i+1}</td>
            <td class="country">${row.country}</td>
            <td>${row.GOLD || 0}</td>
            <td>${row.SILVER || 0}</td>
            <td>${row.BRONZE || 0}</td>
            <td>${row.total || 0}</td>
        `;

        tbody.appendChild(tr);
    });
}

document.getElementById("sort").addEventListener("change", render);

load();

</script>

</body>
</html>
