<!DOCTYPE html>
<html>
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Generate Finals</title>
<style>
body{font-family:Arial;padding:20px;}
</style>
</head>

<body>

<h2>Generating finals.json…</h2>
<pre id="log"></pre>

<script>

const log = (msg) => {
  document.getElementById("log").textContent += msg + "\n";
};

function norm(s){
  return (s||"").toLowerCase().replace(/[^a-z]/g,"");
}

function getWinner(g){
  const hs = Number(g.home_score);
  const as = Number(g.away_score);
  if(isNaN(hs) || isNaN(as)) return null;
  return hs > as ? g.home_team : g.away_team;
}

async function run(){

log("Starting...");

const finals = [];

for(let year=1976; year<=2025; year++){

log("Processing " + year);

let index;

try{
  index = await fetch("/data/nba/"+year+"/index.json").then(r=>r.ok?r.json():null);
}catch{
  log("No season "+year);
  continue;
}

if(!index || !index.games) continue;

const playoffGames=[];

for(const id of index.games){

let g;

try{
  g = await fetch("/data/nba/"+year+"/"+id+".json").then(r=>r.ok?r.json():null);
}catch{
  continue;
}

if(!g) continue;

const gt=(g.game_type||"").toLowerCase();

if(!gt.includes("regular") && !gt.includes("pre")){
playoffGames.push(g);
}

}

if(!playoffGames.length) continue;

const seriesMap={};

playoffGames.forEach(g=>{
const key=[norm(g.home_team),norm(g.away_team)].sort().join("|");
if(!seriesMap[key]) seriesMap[key]=[];
seriesMap[key].push(g);
});

let finalsSeries=null;
let latestEnd=null;

for(const series of Object.values(seriesMap)){

const valid=series.filter(g=>g.date);
if(!valid.length) continue;

valid.sort((a,b)=>new Date(a.date)-new Date(b.date));

const end=new Date(valid[valid.length-1].date);

if(!latestEnd || end>latestEnd){
latestEnd=end;
finalsSeries=valid;
}

}

if(!finalsSeries) continue;

const wins={};

finalsSeries.forEach(g=>{
const w=getWinner(g);
if(!w) return;
if(!wins[w]) wins[w]=0;
wins[w]++;
});

const maxWins=Math.max(...Object.values(wins));
if(maxWins<4) continue;

const champion=Object.keys(wins).sort((a,b)=>wins[b]-wins[a])[0];
const runnerUp=Object.keys(wins).find(t=>t!==champion);

finals.push({
season:year,
champion,
runner_up:runnerUp,
series:wins[champion]+"-"+wins[runnerUp],
games:finalsSeries.map(g=>g.game_id)
});

}

log("DONE — downloading finals.json");

const blob=new Blob([JSON.stringify(finals,null,2)],{type:"application/json"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="finals.json";
a.click();

}

run();

</script>

</body>
</html>
