<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --board-line:rgba(255,255,255,.10);
  --accent:#1fa25c;
  --league:#a8790a;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{color:var(--ink);text-decoration:none;opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

.page-wrap{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.back-link{
  display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;color:var(--muted);
  font-weight:600;text-decoration:none;font-size:13px;
}
.back-link:hover{color:var(--ink);}

/* ── Scorebug ─────────────────────────────────────────── */
.scorebug{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;
}
.scorebug .eyebrow{
  text-align:center;font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--league);
  padding:20px 16px 0;
}
.bug-grid{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:14px;padding:14px 30px 20px;
}
.bug-team{display:flex;align-items:center;gap:14px;min-width:0;}
.bug-team.home{justify-content:flex-end;text-align:right;}
.bug-team.away{justify-content:flex-start;text-align:left;}
.bug-team a.tname{
  font-family:var(--display);font-weight:600;font-size:clamp(15px,2.4vw,24px);
  line-height:1.04;letter-spacing:.01em;text-transform:uppercase;color:#fff;text-decoration:none;
}
.bug-team a.tname:hover{color:var(--league);}
.bug-flag{font-size:clamp(24px,3.6vw,38px);line-height:1;flex:0 0 auto;}
.bug-score{
  display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:600;
  font-size:clamp(32px,6vw,56px);line-height:1;letter-spacing:.01em;white-space:nowrap;
}
.bug-score .sc.lose{color:rgba(255,255,255,.42);font-weight:500;}
.bug-score .dash{color:rgba(255,255,255,.3);font-weight:400;}
.bug-score .raw{font-size:clamp(24px,4vw,36px);}
.winner-line{
  text-align:center;padding:0 16px 22px;font-size:13px;font-weight:600;color:rgba(255,255,255,.65);
}

@media(max-width:820px){
  .bug-grid{grid-template-columns:1fr;gap:14px;padding:10px 18px 20px;}
  .bug-team.home,.bug-team.away{justify-content:center;text-align:center;}
}

/* ── Sections ─────────────────────────────────────────── */
.section-title{
  font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  margin:26px 0 12px;color:var(--muted);
}
.match{
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;
  background:var(--surface);
}
.match h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink);}
.small{font-size:12.5px;color:var(--muted);font-weight:600;}
.og-tag{color:var(--league);font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;margin-left:6px;}

.team-link{color:var(--league);text-decoration:none;font-weight:700;}
.team-link:hover{color:var(--accent);text-decoration:underline;}
</style>
</head>

<body>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="world-cup-countries.html">Countries</a>
</nav>

<div class="page-wrap">
<a class="back-link" href="javascript:history.back()">← Back</a>
<div id="output"></div>
</div>

<script>
const COUNTRY_PAGE="world-cup-country.html";

const params=new URLSearchParams(location.search);
const yearQ =params.get("year")  ||"";
const roundQ=params.get("round") ||"";
const team1Q=params.get("team1") ||"";
const team2Q=params.get("team2") ||"";

const countryCodes={
"Brazil":"BR","Germany":"DE","West Germany":"DE","FRG":"DE",
"Italy":"IT","Argentina":"AR","France":"FR",
"England":"GB","Spain":"ES","Netherlands":"NL","Uruguay":"UY","Portugal":"PT",
"Belgium":"BE","Croatia":"HR","Mexico":"MX","USA":"US","United States":"US",
"Japan":"JP","South Korea":"KR","Korea Republic":"KR","Australia":"AU",
"Austria":"AT","Switzerland":"CH","Sweden":"SE","Norway":"NO","Denmark":"DK",
"Poland":"PL","Czech Republic":"CZ","Czechia":"CZ","Russia":"RU",
"Ukraine":"UA","Turkey":"TR","Greece":"GR","Scotland":"GB","Wales":"GB",
"Ireland":"IE","Northern Ireland":"GB","Morocco":"MA","Cameroon":"CM",
"Nigeria":"NG","Ghana":"GH","Senegal":"SN","Tunisia":"TN","Algeria":"DZ",
"Iran":"IR","Iraq":"IQ","Saudi Arabia":"SA","Qatar":"QA","China":"CN",
"South Africa":"ZA","New Zealand":"NZ","Canada":"CA",
"Costa Rica":"CR","Honduras":"HN","Panama":"PA","Jamaica":"JM",
"Trinidad and Tobago":"TT","Colombia":"CO","Chile":"CL","Peru":"PE",
"Paraguay":"PY","Ecuador":"EC","Bolivia":"BO","Venezuela":"VE",
"Serbia":"RS","Ivory Coast":"CI","Cape Verde":"CV","DR Congo":"CD",
"Uzbekistan":"UZ","Jordan":"JO","Curaçao":"CW","Egypt":"EG","Georgia":"GE",
"Albania":"AL","Bosnia and Herzegovina":"BA","Bosnia & Herzegovina":"BA",
"Haiti":"HT","Mali":"ML","Finland":"FI","Iceland":"IS","Hungary":"HU",
};

function flagEmoji(code){
 if(!code) return "";
 return code.replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt()));
}
function getFlag(name){ return flagEmoji(countryCodes[name]||""); }

function parseScore(score){
 const raw = (score||"").trim();
 if(!raw) return null;

 const shootoutMatch = raw.match(/^\((\d+)\)\s*(\d+)\s*[-–]\s*(\d+)\s*\((\d+)\)$/);
 if(shootoutMatch){
  return {
   reg: [parseInt(shootoutMatch[2],10), parseInt(shootoutMatch[3],10)],
   shootout: [parseInt(shootoutMatch[1],10), parseInt(shootoutMatch[4],10)]
  };
 }

 const plainMatch = raw.match(/(\d+)\s*[-–]\s*(\d+)/);
 if(plainMatch){
  return { reg: [parseInt(plainMatch[1],10), parseInt(plainMatch[2],10)], shootout: null };
 }

 return null;
}

// Parses a raw scorer string like "Mohamed Hany (OG) (AUS)" into its
// parts, separating the own-goal marker from the player's name so the
// Goals section can render it cleanly instead of dumping the raw string
// with "(OG)" stuck in the middle of the name.
function parseScorerDisplay(str){
 if(!str) return {name:"",isOwnGoal:false};
 let s=String(str).trim();
 let isOwnGoal=false;
 if(/\(\s*OG\s*\)/i.test(s)){
  isOwnGoal=true;
  s=s.replace(/\s*\(\s*OG\s*\)\s*/i, " ").replace(/\s+/g," ").trim();
 }
 return {name:s, isOwnGoal};
}

fetch("data/world-cup.json",{cache:"no-store"})
.then(r=>r.json())
.then(data=>render(data));

function render(data){
 const anchor=data.find(r=>
  r.Team===team1Q && r.Team__1===team2Q &&
  String(r.Year)===yearQ && r.Round===roundQ
 );

 const out=document.getElementById("output");

 if(!anchor){
  out.innerHTML=`
    <div class="scorebug">
      <div class="eyebrow">World Cup</div>
      <div class="winner-line" style="padding-top:20px;">Match not found.</div>
    </div>`;
  return;
 }

 const anchorIdx=data.indexOf(anchor);
 const rows=[anchor];
 for(let i=anchorIdx+1;i<data.length;i++){
  if(data[i].Team!=="") break;
  rows.push(data[i]);
 }

 const team1 =anchor.Team;
 const team2 =anchor.Team__1;
 const score =anchor["Final Score"]||"";
 const winner=anchor["Winnning Team"]||"";
 const round =anchor.Round||"";

 document.title=`${team1} vs ${team2} ${yearQ} | The Sporting Almanac`;

 const parsed = parseScore(score);

 let resolvedWinner = winner;
 let penaltyNote = "";
 if(parsed && parsed.shootout){
  const [p1, p2] = parsed.shootout;
  if(!resolvedWinner){
   if(p1 > p2) resolvedWinner = team1;
   else if(p2 > p1) resolvedWinner = team2;
  }
  penaltyNote = ` — won ${Math.max(p1,p2)}–${Math.min(p1,p2)} on penalties`;
 }

 const team1Lost = resolvedWinner && resolvedWinner !== team1;
 const team2Lost = resolvedWinner && resolvedWinner !== team2;

 const scoreHTML = parsed
   ? `<span class="sc ${team1Lost?'lose':''}">${parsed.reg[0]}</span><span class="dash">–</span><span class="sc ${team2Lost?'lose':''}">${parsed.reg[1]}</span>`
   : `<span class="raw">${score || 'vs'}</span>`;

 const winnerLine = resolvedWinner
   ? `Winner: ${resolvedWinner} ${getFlag(resolvedWinner)}${penaltyNote}`
   : (parsed && parsed.reg[0] === parsed.reg[1]) ? "Draw"
   : score ? "Draw" : "Result pending";

 out.innerHTML=`
  <div class="scorebug">
    <div class="eyebrow">${yearQ} FIFA World Cup · ${round}</div>
    <div class="bug-grid">
      <div class="bug-team home">
        <a class="tname" href="${COUNTRY_PAGE}?team=${encodeURIComponent(team1)}">${team1}</a>
        <span class="bug-flag">${getFlag(team1)}</span>
      </div>
      <div class="bug-score">${scoreHTML}</div>
      <div class="bug-team away">
        <span class="bug-flag">${getFlag(team2)}</span>
        <a class="tname" href="${COUNTRY_PAGE}?team=${encodeURIComponent(team2)}">${team2}</a>
      </div>
    </div>
    <div class="winner-line">${winnerLine}</div>
  </div>`;

 // ── Goals ─────────────────────────────────────────────────────────────────
 const goalRows=rows.filter(r=>r.Scorers);
 if(goalRows.length){
  out.innerHTML+=`<div class="section-title">Goals</div>`;
  goalRows.forEach(r=>{
   const parsedScorer=parseScorerDisplay(r.Scorers);
   out.innerHTML+=`
    <div class="match">
     <h3>${parsedScorer.name}${parsedScorer.isOwnGoal ? '<span class="og-tag">OG</span>' : ''}</h3>
     <div class="small">Minute: ${r["Time scored"]||"–"} &nbsp;·&nbsp; Score: ${r["Progess Score"]||"–"}</div>
    </div>`;
  });
 }

 // ── Cards ─────────────────────────────────────────────────────────────────
 const yellow=anchor["Yellow Cards"]||"";
 const red   =anchor["Red Cards"]   ||"";
 if(yellow||red){
  out.innerHTML+=`<div class="section-title">Cards</div>`;
  if(yellow){
   out.innerHTML+=`<div class="match"><h3>🟨 Yellow Cards</h3><div class="small">${yellow}</div></div>`;
  }
  if(red){
   out.innerHTML+=`<div class="match"><h3>🟥 Red Cards</h3><div class="small">${red}</div></div>`;
  }
 }

 // ── Referee ───────────────────────────────────────────────────────────────
 if(anchor.Referee){
  out.innerHTML+=`
   <div class="section-title">Referee</div>
   <div class="match"><h3>${anchor.Referee}</h3></div>`;
 }
}
</script>

</body>
</html>
