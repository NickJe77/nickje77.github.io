<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>World Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  text-decoration:none;
  color:var(--ink);
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}
.page{
  max-width:1200px;
  margin:0 auto;
  padding:26px 20px 70px;
}
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:32px 34px;
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(28px,5vw,40px);
  letter-spacing:.01em;
  text-transform:uppercase;
}
.table-wrap{
  background:var(--surface);
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--line);
}
table{
  width:100%;
  border-collapse:collapse;
}
th{
  background:#f7f9fb;
  color:var(--muted);
  padding:11px 14px;
  text-align:left;
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  border-bottom:1px solid var(--line);
}
td{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  font-size:14px;
  color:#27313c;
  font-variant-numeric:tabular-nums;
}
td:first-child{
  font-weight:700;
  color:var(--ink);
}
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover td{ background:#f0f6ff; }
</style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
</div>
<div class="page">
  <div class="hero">
    <div class="eyebrow">MLB</div>
    <h1>World Series</h1>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Year</th>
          <th>Champion</th>
          <th>Runner-up</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody id="wsBody"></tbody>
    </table>
  </div>
</div>
<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
async function safeFetch(url){
  try{
    const r = await fetch(url);
    if(!r.ok) return null;
    return await r.json();
  }catch{
    return null;
  }
}
(async function(){
  const wsData = await safeFetch(`${R2}/baseball/world_series.json`);
  const teams = await safeFetch(`${R2}/baseball/teams.json`);
  if(!wsData || !teams){
    document.getElementById("wsBody").innerHTML =
      `<tr><td colspan="4">Data not available</td></tr>`;
    return;
  }
  function getTeamName(code){
    const team = teams.find(t => t.codes.includes(code));
    return team ? team.name : code;
  }
  const tbody = document.getElementById("wsBody");
  wsData
    .sort((a,b) => b.year - a.year)
    .forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.year}</td>
        <td>${getTeamName(row.champion_code)}</td>
        <td>${getTeamName(row.runner_up_code)}</td>
        <td>${row.result}</td>
      `;
      tbody.appendChild(tr);
    });
})();
</script>
</body>
</html>
