<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --alt:#dbe8ff;
}

body{font-family:Inter,system-ui,Arial;margin:0;background:var(--bg);}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}

.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}

.section{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  border:1px solid var(--line);
}

table{width:100%;border-collapse:collapse;}
th{background:var(--blue);color:#fff;padding:12px;text-align:left;}
td{padding:12px;border-bottom:1px solid #eee;}
tbody tr:nth-child(even){background:var(--alt);}
tbody tr:hover{background:#c5dbff;cursor:pointer;}

.games{
  margin-top:15px;
  border-top:1px solid var(--line);
  padding-top:15px;
}

.game{
  padding:8px 0;
}

.game a{
  color:#0056d6;
  font-weight:700;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
  <h1>World Series</h1>
</div>

<div class="section">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Champion</th>
        <th>Runner-up</th>
        <th>Result</th>
      </tr>
    </thead>
    <tbody id="wsBody"></tbody>
  </table>
</div>

<div class="section" id="seriesDetail" style="display:none;">
  <h2 id="detailTitle"></h2>
  <div id="gamesList" class="games"></div>
</div>

</div>

<script>

let TEAM_LOOKUP = {};

async function loadTeams(){
  const res = await fetch("/data/baseball/teams.json");
  const data = await res.json();

  data.forEach(team=>{
    team.codes.forEach(code=>{
      TEAM_LOOKUP[code] = team.name;
    });
  });
}

function teamName(code){
  return TEAM_LOOKUP[code] || code;
}

async function init(){

  await loadTeams();

  const res = await fetch("/data/baseball/world_series.json");
  const wsData = await res.json();

  const tbody = document.getElementById("wsBody");

  wsData.forEach(series=>{

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${series.year}</td>
      <td>${teamName(series.champion_code)}</td>
      <td>${teamName(series.runner_up_code)}</td>
      <td>${series.series_score}</td>
    `;

    tr.onclick = ()=>{
      showSeries(series);
    };

    tbody.appendChild(tr);

  });

}

function showSeries(series){

  const detail = document.getElementById("seriesDetail");
  const title = document.getElementById("detailTitle");
  const gamesDiv = document.getElementById("gamesList");

  title.textContent = `World Series ${series.year} — ${teamName(series.champion_code)} defeated ${teamName(series.runner_up_code)} ${series.series_score}`;

  gamesDiv.innerHTML = series.games.map(g=>{

    const score = `${g.away_score} - ${g.home_score}`;
    const matchup = `${teamName(g.away_code)} @ ${teamName(g.home_code)}`;

    return `
      <div class="game">
        <a href="baseball-game.html?game=${g.game_id}">
          ${g.date} — ${matchup} — ${score}
        </a>
      </div>
    `;
  }).join("");

  detail.style.display = "block";
  window.scrollTo({top: detail.offsetTop - 10, behavior:"smooth"});
}

init();

</script>

</body>
</html>
