<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>World Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
  --alt:#dbe8ff;
  --hover:#c5dbff;
}

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}

.table-wrap{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--blue);
  color:#fff;
  padding:14px;
  text-align:left;
  font-size:16px;
}

td{
  padding:14px;
  border-bottom:1px solid #eee;
  font-size:16px;
}

tbody tr:nth-child(even){
  background:var(--alt);
}

tbody tr:hover{
  background:var(--hover);
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

  <div class="hero">
    <h1>World Series</h1>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Year</th>
          <th>Champion</th>
          <th>Runner-up</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody id="wsBody"></tbody>
    </table>
  </div>

</div>

<script>
async function safeFetch(url){
  try{
    const r = await fetch(url);
    if(!r.ok) return null;
    return await r.json();
  }catch{
    return null;
  }
}

(async function(){

  const wsData = await safeFetch("/data/baseball/world_series.json");
  const teams = await safeFetch("/data/baseball/teams.json");

  if(!wsData || !teams){
    document.getElementById("wsBody").innerHTML =
      `<tr><td colspan="4">Data not available</td></tr>`;
    return;
  }

  function getTeamName(code){
    const team = teams.find(t => t.codes.includes(code));
    return team ? team.name : code;
  }

  const tbody = document.getElementById("wsBody");

  wsData
    .sort((a,b) => b.year - a.year)
    .forEach(row => {

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${row.year}</td>
        <td>${getTeamName(row.champion_code)}</td>
        <td>${getTeamName(row.runner_up_code)}</td>
        <td>${row.result}</td>
      `;

      tbody.appendChild(tr);
    });

})();
</script>

</body>
</html>
