<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>UEFA Euro – Leaders | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#eceff3;
      --surface:#ffffff;
      --ink:#0f141a;
      --muted:#69727c;
      --faint:#9aa3ad;
      --line:#e3e8ee;
      --board:#0a0a0a;
      --board-2:#1a1a1a;
      --accent:#1fa25c;
      --league:#a8790a;
      --gold:#c9a200;
      --silver:#8a94a0;
      --bronze:#a0522d;
      --display:'Oswald',system-ui,sans-serif;
      --body:'Inter',system-ui,sans-serif;
      --radius:16px;
    }
    *{box-sizing:border-box;}
    body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
    .navbar a{color:var(--ink);text-decoration:none;opacity:.7;transition:opacity .15s;}
    .navbar a:hover{opacity:1;}

    /* ── Hero ─────────────────────────────────────────── */
    .hero{
      position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
      color:#fff;padding:44px 20px;text-align:center;
    }
    .hero .eyebrow{
      font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
      text-transform:uppercase;color:var(--accent);margin-bottom:10px;
    }
    .hero h1{
      margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,4.5vw,40px);
      letter-spacing:.01em;text-transform:uppercase;color:#fff;
    }

    .page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

    h2{
      font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em;text-transform:uppercase;
      margin:0 0 14px;color:var(--league);display:flex;align-items:center;gap:8px;
    }
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
    .stat-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}

    .leaders-table{width:100%;border-collapse:collapse;}
    .leaders-table td{padding:7px 8px;vertical-align:middle;border-bottom:1px solid var(--line);}
    .leaders-table tr:last-child td{border-bottom:none;}
    .leaders-table tr:hover td{background:#f0f6ff;}
    .rank{font-weight:700;color:var(--faint);width:26px;text-align:center;font-size:12.5px;}
    .rank.gold{color:var(--gold);}
    .rank.silver{color:var(--silver);}
    .rank.bronze{color:var(--bronze);}
    .player-name{font-weight:700;font-size:13.5px;color:var(--ink);}
    .player-cc{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;}
    .count{font-weight:700;font-size:14.5px;text-align:right;white-space:nowrap;font-family:var(--display);}
    .count-goals{color:var(--league);}
    .count-yellow{color:#b38a00;}
    .count-red{color:#c0362c;}
    .card-icon{display:inline-block;width:11px;height:15px;border-radius:2px;vertical-align:middle;}
    .card-yellow{background:#e6b800;}
    .card-red{background:#c0362c;}
    .red-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}

    .match-table{width:100%;border-collapse:collapse;}
    .match-table th{
      text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
      padding:8px 10px;border-bottom:2px solid var(--line);font-weight:600;
    }
    .match-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px;}
    .match-table tr:last-child td{border-bottom:none;}
    .match-table tr:hover td{background:#f0f6ff;}
    .match-teams{font-weight:700;font-size:13.5px;color:var(--ink);}
    .match-meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
    .round-badge{display:inline-block;font-size:10.5px;padding:2px 8px;background:#f0f2f5;border-radius:999px;color:var(--muted);font-weight:600;}
    .year-col{font-family:var(--display);font-weight:600;color:var(--ink);white-space:nowrap;font-size:13.5px;}
    .margin-col{font-family:var(--display);font-weight:600;font-size:14.5px;color:#c0362c;white-space:nowrap;}
    .total-col{font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--league);white-space:nowrap;}
    .ht-goals-cell{font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--league);text-align:center;width:50px;}

    @media (max-width: 700px) {
      .stats-grid{grid-template-columns:1fr;}
      .red-cols{grid-template-columns:1fr;}
      .navbar{gap:12px;font-size:12.5px;}
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="football.html">Football</a>
  <a href="euro.html">Euro</a>
  <a href="euro-countries.html">Countries</a>
</nav>

<div class="hero">
  <div class="eyebrow">Football</div>
  <h1>Euro Leaders</h1>
</div>

<div class="page-wrap">

  <div class="stats-grid">
    <div class="stat-box">
      <h2>Top 15 All-Time Goal Scorers</h2>
      <table class="leaders-table"><tbody id="scorers-body"></tbody></table>
    </div>
    <div class="stat-box">
      <h2><span class="card-icon card-yellow"></span> Most Yellow Cards</h2>
      <table class="leaders-table"><tbody id="yellow-body"></tbody></table>
    </div>
  </div>

  <div class="stat-box" style="margin-bottom:18px">
    <h2><span class="card-icon card-red"></span> Most Red Cards</h2>
    <div class="red-cols">
      <table class="leaders-table"><tbody id="red-body-1"></tbody></table>
      <table class="leaders-table"><tbody id="red-body-2"></tbody></table>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <h2>Highest Scoring Games</h2>
      <table class="match-table">
        <thead><tr><th>Total</th><th>Match</th><th>Year</th></tr></thead>
        <tbody id="high-scoring-body"></tbody>
      </table>
    </div>
    <div class="stat-box">
      <h2>Biggest Wins</h2>
      <table class="match-table">
        <thead><tr><th>Margin</th><th>Match</th><th>Year</th></tr></thead>
        <tbody id="biggest-wins-body"></tbody>
      </table>
    </div>
  </div>

  <div class="stat-box" style="margin-top:18px">
    <h2>Most Goals in a Single Game (3+)</h2>
    <table class="match-table">
      <thead><tr><th style="text-align:center">Goals</th><th>Player</th><th>Match</th><th>Year</th></tr></thead>
      <tbody id="ht-body"></tbody>
    </table>
  </div>
</div>

<script>
function rankClass(i) {
  return i===0?'gold':i===1?'silver':i===2?'bronze':'';
}
function leaderRow(i, player, country, value, cls) {
  return `<tr><td class="rank ${rankClass(i)}">${i+1}</td><td><div class="player-name">${player}</div><div class="player-cc">${country}</div></td><td class="count ${cls}">${value}</td></tr>`;
}
function matchRow(i, totalOrMargin, prefix, team1, score, team2, year, roundLabel){
  return `<tr><td class="rank ${rankClass(i)}">${i+1}</td><td class="${prefix==='+'?'margin-col':'total-col'}">${prefix}${totalOrMargin}</td><td><div class="match-teams">${team1} <strong>${score}</strong> ${team2}</div><div class="match-meta">${roundLabel?`<span class="round-badge">${roundLabel}</span>`:''}</div></td><td class="year-col">${year}</td></tr>`;
}

const YEARS = [1960,1964,1968,1972,1976,1980,1984,1988,1992,1996,2000,2004,2008,2012,2016,2020,2024];

Promise.all([
  fetch("data/uefaeuro/players.json").then(r=>r.json()),
  fetch("data/uefaeuro/match-records.json").then(r=>r.json()),
]).then(([players, matchRecords])=>{

  // ── Top scorers / cards, computed live from players.json ──────────
  const scorers = players
    .filter(p=>p.goals>0)
    .map(p=>({player:p.name, country:p.teams[0]||"", value:p.goals}))
    .sort((a,b)=>b.value-a.value).slice(0,15);

  const yellows = players
    .filter(p=>p.yellow_cards>0)
    .map(p=>({player:p.name, country:p.teams[0]||"", value:p.yellow_cards}))
    .sort((a,b)=>b.value-a.value).slice(0,15);

  const reds = players
    .filter(p=>p.red_cards>0)
    .map(p=>({player:p.name, country:p.teams[0]||"", value:p.red_cards}))
    .sort((a,b)=>b.value-a.value);

  document.getElementById('scorers-body').innerHTML = scorers.map((s,i)=>leaderRow(i,s.player,s.country,s.value,'count-goals')).join('');
  document.getElementById('yellow-body').innerHTML = yellows.map((s,i)=>leaderRow(i,s.player,s.country,s.value,'count-yellow')).join('');

  const half = Math.ceil(reds.length/2);
  document.getElementById('red-body-1').innerHTML = reds.slice(0,half).map((c,i)=>leaderRow(i,c.player,c.country,c.value,'count-red')).join('');
  document.getElementById('red-body-2').innerHTML = reds.slice(half).map((c,i)=>leaderRow(i+half,c.player,c.country,c.value,'count-red')).join('');

  // ── Biggest wins / highest scoring, already precomputed in match-records.json ──
  const highScoring = (matchRecords.highest_scoring||[]).slice(0,15).map(m=>({
    total: m.home_score+m.away_score, team1: m.home_team, team2: m.away_team,
    score: `${m.home_score}-${m.away_score}`, year: m.season,
  }));
  const biggestWins = (matchRecords.biggest_wins||[]).slice(0,15).map(m=>{
    const winner = m.home_score>m.away_score ? m.home_team : m.away_team;
    const loser  = m.home_score>m.away_score ? m.away_team : m.home_team;
    const margin = Math.abs(m.home_score-m.away_score);
    return { margin, team1: winner, team2: loser, score: `${Math.max(m.home_score,m.away_score)}-${Math.min(m.home_score,m.away_score)}`, year: m.season };
  });

  document.getElementById('high-scoring-body').innerHTML = highScoring.map((m,i)=>matchRow(i,m.total,'',m.team1,m.score,m.team2,m.year)).join('');
  document.getElementById('biggest-wins-body').innerHTML = biggestWins.map((m,i)=>matchRow(i,m.margin,'+',m.team1,m.score,m.team2,m.year)).join('');

  // ── Hat-tricks: not precomputed anywhere, so found by scanning every
  // real match file directly (385 total, ~6.4MB combined -- small
  // enough for Euro's dataset size to fetch client-side in one go,
  // unlike a full domestic league season).
  document.getElementById('ht-body').innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:16px;">Scanning matches for hat-tricks...</td></tr>`;

  Promise.all(YEARS.map(year=>
    fetch(`data/uefaeuro/seasons/${year}.json`).then(r=>r.json()).then(d=>({year, games:d.games||d}))
  )).then(allSeasons=>{
    const matchRefs = [];
    allSeasons.forEach(({year, games})=>{
      games.forEach(g=>matchRefs.push({year, gameId:g.game_id, home:g.home_team, away:g.away_team}));
    });

    Promise.all(matchRefs.map(m=>
      fetch(`data/uefaeuro/matches/${m.year}/${m.gameId}.json`)
        .then(r=> r.ok ? r.json() : null)
        .then(d=> d ? {...m, data:d} : null)
        .catch(()=>null)
    )).then(results=>{
      const hatTricks = [];
      results.filter(Boolean).forEach(({year, home, away, data})=>{
        const counts = {};
        (data.events||[]).forEach(e=>{
          if(e.type!=='goal' || !e.scorer) return;
          // Exclude shootout kicks (minute="120" with no running_score --
          // confirmed real pattern, see build_uefaeuro_data.py).
          if(e.minute==='120' && !e.running_score) return;
          counts[e.scorer] = (counts[e.scorer]||0) + 1;
        });
        Object.entries(counts).forEach(([player, goals])=>{
          if(goals>=3) hatTricks.push({player, goals, team1:home, team2:away, year});
        });
      });
      hatTricks.sort((a,b)=>b.goals-a.goals);
      document.getElementById('ht-body').innerHTML = hatTricks.length
        ? hatTricks.map(h=>`<tr><td class="ht-goals-cell">${h.goals}</td><td><div class="player-name">${h.player}</div></td><td>${h.team1} vs ${h.team2}</td><td class="year-col">${h.year}</td></tr>`).join('')
        : `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:16px;">None on record</td></tr>`;
    });
  });
});

</script>
</body>
</html>
