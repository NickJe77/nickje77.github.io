<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 font-family:Inter,system-ui,Arial;
 margin:0;
 background:#f4f6f8;
}

.navbar{
 display:flex;
 justify-content:center;
 gap:24px;
 padding:16px;
 background:#fff;
 border-bottom:1px solid #ddd;
 font-weight:700;
}

.navbar a{
 text-decoration:none;
 color:#0056d6;
}

.page{
 max-width:1200px;
 margin:auto;
 padding:20px;
}

.hero{
 background:linear-gradient(90deg,#002D72,#C8102E);
 color:#fff;
 padding:28px;
 border-radius:20px;
 margin-bottom:14px;
}

.hero h1{
 margin:0;
 font-size:42px;
}

.infoRow{
 display:flex;
 gap:12px;
 margin-bottom:14px;
}

.infoBox{
 background:#fff;
 padding:10px 14px;
 border-radius:12px;
 font-weight:700;
}

.card{
 background:#fff;
 border-radius:16px;
 padding:12px;
 margin-bottom:14px;
}

.card h2{
 margin:4px 4px 10px 4px;
}

table{
 width:100%;
 border-collapse:collapse;
}

th{
 background:#002D72;
 color:#fff;
 padding:10px;
 text-align:left;
}

td{
 padding:8px;
 border-bottom:1px solid #eee;
}

tr:nth-child(even){
 background:#f0f6ff;
}

.split{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:14px;
}

.error{
 background:#ffd6d6;
 color:#8a0000;
 padding:12px;
 border-radius:10px;
 margin-bottom:12px;
 font-weight:700;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div id="error" class="error" style="display:none;"></div>

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="date"></div>
</div>

<div class="infoRow">
<div class="infoBox" id="venue">Venue: Unknown</div>
<div class="infoBox" id="attendance">Attendance: —</div>
</div>

<div class="card">

<h2>Batting</h2>

<div class="split">

<div>
<h3>Away</h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div>
<h3>Home</h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

</div>

</div>


<div class="card">

<h2>Pitching</h2>

<div class="split">

<div>
<h3>Away Pitching</h3>
<table>
<thead>
<tr>
<th>Pitcher</th>
<th>Outs</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="awayPitch"></tbody>
</table>
</div>

<div>
<h3>Home Pitching</h3>
<table>
<thead>
<tr>
<th>Pitcher</th>
<th>Outs</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="homePitch"></tbody>
</table>
</div>

</div>

</div>

</div>


<script>

const qs=new URLSearchParams(location.search);
const id=qs.get("id");

if(!id){

document.getElementById("error").style.display="block";
document.getElementById("error").textContent="Missing game id";

throw "";

}

const year=id.substring(0,4);

const path=`data/baseball/boxscores/${year}/${id}.json`;


let PLAYER_MAP={};
let TEAM_MAP={};
let PARK_MAP={};

async function loadMaps(){

PLAYER_MAP=await fetch("data/baseball/players.json").then(r=>r.json());

TEAM_MAP=await fetch("data/baseball/teams.json").then(r=>r.json());

const parkCSV=await fetch("data/baseball/ballparks.csv").then(r=>r.text());

parkCSV.split("\n").forEach(line=>{

const parts=line.split(",");

if(parts.length>1){

PARK_MAP[parts[0]]=parts[1];

}

});

}

function pname(id){

return PLAYER_MAP[id]||id;

}

function tname(code){

return TEAM_MAP[code]||code;

}

function ensureBat(map,id){

if(!map[id]){

map[id]={pa:0,h:0,bb:0,so:0,hr:0};

}

return map[id];

}

function ensurePitch(map,id){

if(!map[id]){

map[id]={outs:0,h:0,bb:0,so:0,hr:0};

}

return map[id];

}

function isHit(e){

return e.startsWith("S")||e.startsWith("D")||e.startsWith("T")||e.startsWith("HR");

}

function isHR(e){

return e.startsWith("HR");

}

function isBB(e){

return e.startsWith("W");

}

function isSO(e){

return e.startsWith("K");

}

function outs(e){

if(isSO(e))return 1;

if(isHit(e)||isBB(e))return 0;

return 1;

}


function renderBat(id,map){

const tbody=document.getElementById(id);

tbody.innerHTML="";

Object.entries(map).forEach(([pid,s])=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${pname(pid)}</td>
<td>${s.pa}</td>
<td>${s.h}</td>
<td>${s.bb}</td>
<td>${s.so}</td>
<td>${s.hr}</td>
`;

tbody.appendChild(tr);

});

}

function renderPitch(id,map){

const tbody=document.getElementById(id);

tbody.innerHTML="";

Object.entries(map).forEach(([pid,s])=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${pname(pid)}</td>
<td>${s.outs}</td>
<td>${s.h}</td>
<td>${s.bb}</td>
<td>${s.so}</td>
<td>${s.hr}</td>
`;

tbody.appendChild(tr);

});

}

async function loadGame(){

await loadMaps();

const game=await fetch(path).then(r=>{

if(!r.ok){

document.getElementById("error").style.display="block";
document.getElementById("error").textContent="Game file not found";

throw "";

}

return r.json();

});


document.getElementById("title").textContent=
`${tname(game.away_code)} @ ${tname(game.home_code)}`;

document.getElementById("date").textContent=game.date;


let awayBat={};
let homeBat={};

let awayPitch={};
let homePitch={};

let curAwayPitcher=null;
let curHomePitcher=null;


game.events.forEach(e=>{

if(e[0]=="info"){

if(e[1]=="site"){

document.getElementById("venue").textContent=
"Venue: "+(PARK_MAP[e[2]]||e[2]);

}

if(e[1]=="attendance"){

document.getElementById("attendance").textContent=
"Attendance: "+e[2];

}

}


if(e[0]=="start"||e[0]=="sub"){

if(e[5]=="1"){

if(e[3]=="0")curAwayPitcher=e[1];

if(e[3]=="1")curHomePitcher=e[1];

}

}


if(e[0]=="play"){

const team=e[2];

const batter=e[3];

const ev=e[6];


if(team=="0"){

const s=ensureBat(awayBat,batter);

s.pa++;

if(isHit(ev))s.h++;

if(isBB(ev))s.bb++;

if(isSO(ev))s.so++;

if(isHR(ev))s.hr++;

if(curHomePitcher){

const p=ensurePitch(homePitch,curHomePitcher);

p.outs+=outs(ev);

if(isHit(ev))p.h++;

if(isBB(ev))p.bb++;

if(isSO(ev))p.so++;

if(isHR(ev))p.hr++;

}

}

else{

const s=ensureBat(homeBat,batter);

s.pa++;

if(isHit(ev))s.h++;

if(isBB(ev))s.bb++;

if(isSO(ev))s.so++;

if(isHR(ev))s.hr++;

if(curAwayPitcher){

const p=ensurePitch(awayPitch,curAwayPitcher);

p.outs+=outs(ev);

if(isHit(ev))p.h++;

if(isBB(ev))p.bb++;

if(isSO(ev))p.so++;

if(isHR(ev))p.hr++;

}

}

}

});


renderBat("awayBat",awayBat);
renderBat("homeBat",homeBat);

renderPitch("awayPitch",awayPitch);
renderPitch("homePitch",homePitch);

}


loadGame();

</script>

</body>
</html>
