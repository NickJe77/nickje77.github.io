<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:28px;
border-radius:20px;
margin-bottom:14px;
}

.section{
background:#fff;
padding:16px;
border-radius:16px;
margin-bottom:14px;
}

.split{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.teamTitle{
font-weight:700;
font-size:18px;
margin-bottom:6px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#002D72;
color:#fff;
padding:10px;
text-align:left;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f0f6ff;
}

.playerLink{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

.playerLink:hover{
text-decoration:underline;
}

.venue{
font-weight:700;
margin-top:6px;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title"></h1>
<div id="date"></div>
<div id="venue" class="venue"></div>
</div>

<div class="section">

<h2>Batting</h2>

<div class="split">

<div>
<div id="awayName" class="teamTitle"></div>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div>
<div id="homeName" class="teamTitle"></div>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

</div>

</div>

</div>

<script>

const params=new URLSearchParams(location.search)
const id=params.get("id")

if(!id){
document.body.innerHTML="<h2>Missing game id</h2>"
throw ""
}

const year=id.substring(0,4)
const GAME_PATH=`data/baseball/boxscores/${year}/${id}.json`

let players={},teams={},parks={}

async function loadLookups(){

players=await fetch("data/baseball/players.json").then(r=>r.json())
teams=await fetch("data/baseball/teams.json").then(r=>r.json())

const csv=await fetch("data/baseball/ballparks.csv").then(r=>r.text())

csv.split("\n").forEach(line=>{
const p=line.split(",")
if(p.length>1) parks[p[0]]=p[1]
})

}

function pname(id){

const p=players[id]

if(!p) return id

if(typeof p==="string") return p
if(p.name) return p.name
if(p.full_name) return p.full_name
if(p.nameFirst) return p.nameFirst+" "+p.nameLast

return id

}

function tname(code){

const t=teams[code]

if(!t) return code

if(typeof t==="string") return t
if(t.name) return t.name
if(t.full_name) return t.full_name

return code

}

function plink(id){
return `<a class="playerLink" href="baseball-player.html?id=${id}">${pname(id)}</a>`
}

async function loadGame(){

await loadLookups()

const game=await fetch(GAME_PATH).then(r=>r.json())

const away=tname(game.away_code)
const home=tname(game.home_code)

document.getElementById("title").textContent=`${away} @ ${home}`
document.getElementById("date").textContent=game.date

document.getElementById("awayName").textContent=away
document.getElementById("homeName").textContent=home

const parkCode=game.game_id.substring(0,3)
document.getElementById("venue").textContent="Venue: "+(parks[parkCode]||parkCode)

const awayBat={},homeBat={}

game.events.forEach(e=>{

if(e[0]!=="play") return

const team=e[2]
const batter=e[3]
const ev=e[6]||""

const bat=team==="0"?awayBat:homeBat

if(!bat[batter])
bat[batter]={pa:0,h:0,bb:0,so:0,hr:0}

bat[batter].pa++

if(ev.startsWith("S")||ev.startsWith("D")||ev.startsWith("T")||ev.startsWith("HR"))
bat[batter].h++

if(ev.startsWith("W"))
bat[batter].bb++

if(ev.startsWith("K"))
bat[batter].so++

if(ev.startsWith("HR"))
bat[batter].hr++

})

function render(id,data){

const tbody=document.getElementById(id)

tbody.innerHTML=""

Object.entries(data).forEach(([pid,s])=>{

tbody.innerHTML+=`
<tr>
<td>${plink(pid)}</td>
<td>${s.pa}</td>
<td>${s.h}</td>
<td>${s.bb}</td>
<td>${s.so}</td>
<td>${s.hr}</td>
</tr>
`

})

}

render("awayBat",awayBat)
render("homeBat",homeBat)

}

loadGame()

</script>

</body>
</html>
