<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.page{
  max-width:1400px;
  margin:auto;
  padding:20px;
}
.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}
.hero h1{
  margin:0;
  font-size:36px;
}
.scoreline{
  font-size:22px;
  font-weight:700;
  margin-top:10px;
}
.meta-line{
  margin-top:8px;
  font-size:16px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.section{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:20px;
}
.section h2{
  margin:0 0 14px 0;
  font-size:22px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th{
  background:#002D72;
  color:white;
  padding:10px;
  text-align:center;
}
td{
  padding:9px 10px;
  border-bottom:1px solid #eee;
  text-align:center;
}
td:first-child{
  text-align:left;
}
tr:nth-child(even){
  background:#f0f6ff;
}
.notice{
  color:#555;
  font-size:14px;
  line-height:1.45;
}
@media (max-width: 900px){
  .grid{
    grid-template-columns:1fr;
  }
  .hero h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./baseball-seasons.html">Seasons</a>
  <a href="./baseball-teams.html">Teams</a>
  <a href="./baseball-players.html">Players</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="title">Loading...</h1>
    <div id="scoreline" class="scoreline"></div>
    <div id="subtitle" class="meta-line"></div>
    <div id="venueLine" class="meta-line"></div>
  </div>

  <div class="grid">
    <div class="section">
      <h2>Away Batting</h2>
      <div id="awayBatting"></div>
    </div>

    <div class="section">
      <h2>Home Batting</h2>
      <div id="homeBatting"></div>
    </div>

    <div class="section">
      <h2>Away Pitching</h2>
      <div id="awayPitching"></div>
    </div>

    <div class="section">
      <h2>Home Pitching</h2>
      <div id="homePitching"></div>
    </div>
  </div>

</div>

<script>
function param(name){
  return new URLSearchParams(window.location.search).get(name);
}

const TEAM_NAMES = {
  ANA:"Los Angeles Angels",
  ARI:"Arizona Diamondbacks",
  ATL:"Atlanta Braves",
  ATH:"Athletics",
  BAL:"Baltimore Orioles",
  BOS:"Boston Red Sox",
  CHA:"Chicago White Sox",
  CHN:"Chicago Cubs",
  CIN:"Cincinnati Reds",
  CLE:"Cleveland Guardians",
  COL:"Colorado Rockies",
  DET:"Detroit Tigers",
  HOU:"Houston Astros",
  KCA:"Kansas City Royals",
  LAN:"Los Angeles Dodgers",
  MIA:"Miami Marlins",
  MIL:"Milwaukee Brewers",
  MIN:"Minnesota Twins",
  NYA:"New York Yankees",
  NYN:"New York Mets",
  OAK:"Athletics",
  PHI:"Philadelphia Phillies",
  PIT:"Pittsburgh Pirates",
  SDN:"San Diego Padres",
  SEA:"Seattle Mariners",
  SFN:"San Francisco Giants",
  SLN:"St. Louis Cardinals",
  TBA:"Tampa Bay Rays",
  TEX:"Texas Rangers",
  TOR:"Toronto Blue Jays",
  WAS:"Washington Nationals",
  NEW:"New York Yankees"
};

const ALL_TEAM_CODES = Object.keys(TEAM_NAMES);

function codeToName(code){
  return TEAM_NAMES[code] || code || "";
}

function safeArray(v){
  return Array.isArray(v) ? v : [];
}

function formatDate(yyyyMmDd){
  if(!yyyyMmDd) return "";
  return yyyyMmDd;
}

function prettifyRetroId(id){
  if(!id) return "";
  const clean = String(id).replace(/\d+/g, "");
  if (clean.length <= 3) return clean.toUpperCase();
  const first = clean.slice(5, 8);
  const last = clean.slice(0, 5);
  return (
    first.charAt(0).toUpperCase() + first.slice(1) + " " +
    last.charAt(0).toUpperCase() + last.slice(1)
  );
}

async function tryFetchJson(url){
  try{
    const res = await fetch(url);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    return null;
  }
}

async function loadPlayerLookup(){
  const candidatePaths = [
    "/data/baseball/players/index.json",
    "/data/baseball/players.json",
    "/data/baseball/player_lookup.json"
  ];

  for(const path of candidatePaths){
    const data = await tryFetchJson(path);
    if(!data) continue;

    const map = {};

    const items = Array.isArray(data)
      ? data
      : Array.isArray(data.players)
        ? data.players
        : Array.isArray(data.index)
          ? data.index
          : [];

    for(const p of items){
      const keys = [
        p.retro_id, p.retroID, p.player_id, p.id, p.code, p.key
      ].filter(Boolean);

      const name =
        p.full_name ||
        p.fullName ||
        p.name ||
        p.player ||
        "";

      if(name){
        keys.forEach(k => {
          map[String(k).toLowerCase()] = name;
        });
      }
    }

    return map;
  }

  return {};
}

function getMetaGames(seasonData){
  if(Array.isArray(seasonData)) return seasonData;
  if(Array.isArray(seasonData.games)) return seasonData.games;
  return [];
}

function extractMetaFields(meta){
  return {
    date: meta?.date || meta?.game_date || "",
    homeCode: meta?.home_code || meta?.home_team || meta?.home || "",
    awayCode: meta?.away_code || meta?.away_team || meta?.away || "",
    venue: meta?.venue || meta?.ballpark || "",
    homeScore: meta?.home_score ?? meta?.score?.home ?? "",
    awayScore: meta?.away_score ?? meta?.score?.away ?? ""
  };
}

function buildFilenameFromMeta(meta){
  const f = extractMetaFields(meta);
  if(!f.date || !f.homeCode || !f.awayCode) return null;
  return `${f.date}_${f.awayCode}_${f.homeCode}.json`;
}

function parseGameId(gameId){
  const id = String(gameId || "");
  if(id.length < 11) return null;
  return {
    homeCode: id.slice(0,3),
    date: `${id.slice(3,7)}-${id.slice(7,9)}-${id.slice(9,11)}`
  };
}

function resultIsHit(result){
  return ["1B","2B","3B","HR"].includes(result);
}

function resultIsOut(result){
  return ["K","GO","FO","LO","PO","DP"].includes(result);
}

function outsFromResult(result){
  if(result === "DP") return 2;
  if(resultIsOut(result)) return 1;
  return 0;
}

function formatIP(outs){
  const whole = Math.floor(outs / 3);
  const rem = outs % 3;
  return `${whole}.${rem}`;
}

function buildStatsFromEvents(events, homeCode, awayCode, playerLookup){
  const batting = {};
  const pitching = {};

  for(const row of safeArray(events)){
    if(!Array.isArray(row) || row[0] !== "play") continue;

    const half = String(row[2] ?? "");
    const batterId = String(row[3] ?? "").toLowerCase();
    const result = String(row[6] ?? "").toUpperCase();

    const battingTeam = half === "0" ? awayCode : homeCode;
    const pitchingTeam = half === "0" ? homeCode : awayCode;

    if(!batting[batterId]){
      batting[batterId] = {
        player: playerLookup[batterId] || prettifyRetroId(batterId),
        team: codeToName(battingTeam),
        AB: 0,
        H: 0,
        BB: 0,
        SO: 0,
        HR: 0
      };
    }

    if(!pitching[pitchingTeam]){
      pitching[pitchingTeam] = {
        player: `${codeToName(pitchingTeam)} Staff`,
        team: codeToName(pitchingTeam),
        IP: "0.0",
        BF: 0,
        H: 0,
        BB: 0,
        SO: 0,
        HR: 0
      };
    }

    pitching[pitchingTeam].BF += 1;

    if(result !== "BB" && result !== "HBP" && result !== "IBB"){
      batting[batterId].AB += 1;
    }

    if(resultIsHit(result)){
      batting[batterId].H += 1;
      pitching[pitchingTeam].H += 1;
    }

    if(result === "BB" || result === "IBB"){
      batting[batterId].BB += 1;
      pitching[pitchingTeam].BB += 1;
    }

    if(result === "K"){
      batting[batterId].SO += 1;
      pitching[pitchingTeam].SO += 1;
    }

    if(result === "HR"){
      batting[batterId].HR += 1;
      pitching[pitchingTeam].HR += 1;
    }

    const outs = outsFromResult(result);
    if(outs > 0){
      const currentOuts = (pitching[pitchingTeam]._outs || 0) + outs;
      pitching[pitchingTeam]._outs = currentOuts;
      pitching[pitchingTeam].IP = formatIP(currentOuts);
    }
  }

  const battingRows = Object.values(batting);
  const pitchingRows = Object.values(pitching).map(p => {
    const copy = {...p};
    delete copy._outs;
    return copy;
  });

  return { battingRows, pitchingRows };
}

function sortBatting(rows){
  return [...rows].sort((a,b) => {
    if((b.AB || 0) !== (a.AB || 0)) return (b.AB || 0) - (a.AB || 0);
    return String(a.player).localeCompare(String(b.player));
  });
}

function buildTable(rows, columns){
  if(!rows || !rows.length){
    return `<div class="notice">No data available.</div>`;
  }

  let html = "<table><thead><tr>";
  columns.forEach(c => { html += `<th>${c.label}</th>`; });
  html += "</tr></thead><tbody>";

  rows.forEach(row => {
    html += "<tr>";
    columns.forEach(c => {
      html += `<td>${row[c.key] ?? ""}</td>`;
    });
    html += "</tr>";
  });

  html += "</tbody></table>";
  return html;
}

async function loadSeasonMeta(season, id){
  const seasonData = await tryFetchJson(`/data/baseball/seasons/${season}.json`);
  if(!seasonData) return null;

  const games = getMetaGames(seasonData);

  let meta = games.find(g => String(g.game_id || "") === String(id));
  if(meta) return meta;

  const parsed = parseGameId(id);
  if(!parsed) return null;

  meta = games.find(g => {
    const f = extractMetaFields(g);
    return f.date === parsed.date && f.homeCode === parsed.homeCode;
  });

  return meta || null;
}

async function loadGameJson(season, id, meta){
  const direct = await tryFetchJson(`/data/baseball/boxscores/${season}/${id}.json`);
  if(direct) return direct;

  const fromMeta = buildFilenameFromMeta(meta);
  if(fromMeta){
    const byMeta = await tryFetchJson(`/data/baseball/boxscores/${season}/${fromMeta}`);
    if(byMeta) return byMeta;
  }

  const parsed = parseGameId(id);
  if(parsed){
    for(const away of ALL_TEAM_CODES){
      const candidate = `${parsed.date}_${away}_${parsed.homeCode}.json`;
      const data = await tryFetchJson(`/data/baseball/boxscores/${season}/${candidate}`);
      if(data) return data;
    }
  }

  return null;
}

async function loadGame(){
  const id = param("game");
  const season = param("season");

  if(!id || !season){
    document.getElementById("title").innerText = "Game not found";
    return;
  }

  const [meta, playerLookup] = await Promise.all([
    loadSeasonMeta(season, id),
    loadPlayerLookup()
  ]);

  const game = await loadGameJson(season, id, meta);

  if(!game){
    document.getElementById("title").innerText = "Game not found";
    return;
  }

  const metaFields = extractMetaFields(meta || game);

  const homeCode = game.home_code || metaFields.homeCode || "";
  const awayCode = game.away_code || metaFields.awayCode || "";
  const date = game.date || metaFields.date || "";
  const venue = metaFields.venue || "";
  const homeScore = metaFields.homeScore;
  const awayScore = metaFields.awayScore;

  const homeName = codeToName(homeCode);
  const awayName = codeToName(awayCode);

  document.getElementById("title").innerText = `${awayName} @ ${homeName}`;
  document.getElementById("subtitle").innerText = formatDate(date);
  document.getElementById("scoreline").innerText =
    (awayScore !== "" && homeScore !== "")
      ? `${awayName} ${awayScore} - ${homeName} ${homeScore}`
      : "";
  document.getElementById("venueLine").innerText =
    venue ? `Venue: ${venue}` : "";

  const { battingRows, pitchingRows } = buildStatsFromEvents(
    game.events || [],
    homeCode,
    awayCode,
    playerLookup
  );

  const awayBatting = sortBatting(battingRows.filter(r => r.team === awayName));
  const homeBatting = sortBatting(battingRows.filter(r => r.team === homeName));
  const awayPitching = pitchingRows.filter(r => r.team === awayName);
  const homePitching = pitchingRows.filter(r => r.team === homeName);

  const battingColumns = [
    { key:"player", label:"Player" },
    { key:"team", label:"Team" },
    { key:"AB", label:"AB" },
    { key:"H", label:"H" },
    { key:"BB", label:"BB" },
    { key:"SO", label:"SO" },
    { key:"HR", label:"HR" }
  ];

  const pitchingColumns = [
    { key:"player", label:"Player" },
    { key:"team", label:"Team" },
    { key:"IP", label:"IP" },
    { key:"BF", label:"BF" },
    { key:"H", label:"H" },
    { key:"BB", label:"BB" },
    { key:"SO", label:"SO" },
    { key:"HR", label:"HR" }
  ];

  document.getElementById("awayBatting").innerHTML = buildTable(awayBatting, battingColumns);
  document.getElementById("homeBatting").innerHTML = buildTable(homeBatting, battingColumns);
  document.getElementById("awayPitching").innerHTML = buildTable(awayPitching, pitchingColumns);
  document.getElementById("homePitching").innerHTML = buildTable(homePitching, pitchingColumns);
}

loadGame();
</script>

</body>
</html>
