<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:36px;
border-radius:22px;
text-align:center;
margin-bottom:20px;
}

.matchup{
font-size:42px;
font-weight:900;
}

.score{
font-size:72px;
font-weight:900;
}

.date{
font-size:18px;
font-weight:700;
}

.card{
background:#fff;
padding:18px;
border-radius:16px;
box-shadow:0 4px 14px rgba(0,0,0,0.12);
margin-bottom:18px;
}

.meta span{
display:inline-block;
background:#eef4ff;
border:1px solid #d6e4ff;
padding:8px 14px;
border-radius:12px;
margin-right:10px;
font-weight:700;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#002D72;
color:#fff;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

td:first-child{
text-align:left;
font-weight:700;
}

tr:nth-child(even){
background:#f0f6ff;
}

.player-link{
color:#0056d6;
text-decoration:none;
}

.player-link:hover{
text-decoration:underline;
}
</style>

</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<div id="matchup" class="matchup"></div>
<div id="score" class="score"></div>
<div id="date" class="date"></div>
</div>

<div class="card">
<h3>Game Info</h3>
<div class="meta">
<span id="venue"></span>
<span id="attendance"></span>
</div>
</div>

<div class="card">
<h3>Linescore</h3>
<table>
<thead id="linescoreHead"></thead>
<tbody id="linescoreBody"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayBatTitle"></h3>
<table>
<thead>
<tr>
<th>Player</th><th>AB</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>HR</th>
</tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div class="card">
<h3 id="homeBatTitle"></h3>
<table>
<thead>
<tr>
<th>Player</th><th>AB</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>HR</th>
</tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayPitchTitle"></h3>
<table>
<thead>
<tr>
<th>Pitcher</th><th>IP</th><th>H</th><th>R</th><th>BB</th><th>SO</th><th>HR</th>
</tr>
</thead>
<tbody id="awayPitch"></tbody>
</table>
</div>

<div class="card">
<h3 id="homePitchTitle"></h3>
<table>
<thead>
<tr>
<th>Pitcher</th><th>IP</th><th>H</th><th>R</th><th>BB</th><th>SO</th><th>HR</th>
</tr>
</thead>
<tbody id="homePitch"></tbody>
</table>
</div>

</div>

<script>

const TEAM_NAMES={
NYA:"New York Yankees",
BOS:"Boston Red Sox"
};

let PLAYER_MAP={};

async function loadPlayers(){

const res=await fetch("data/baseball/players.json");
const data=await res.json();

data.forEach(p=>{
PLAYER_MAP[p.player_id]=p.name;
});

}

function playerName(id){

if(!id) return "Unknown";

return PLAYER_MAP[id] || id;

}

function playerLink(id){

return `<a class="player-link" href="baseball-player.html?id=${id}">
${playerName(id)}
</a>`;

}

function processGame(events){

const awayBat={},homeBat={};
const awayPitch={},homePitch={};
const linescore={};

let awayTotal=0,homeTotal=0;

let awayPitcher=null;
let homePitcher=null;

events.forEach(e=>{

if(e[0]==="start"||e[0]==="sub"){

const player=e[1];
const team=e[2];
const pos=e[4];

if(pos==="1"){

if(team==="0"){
awayPitcher=player;
if(!awayPitch[player])
awayPitch[player]={outs:0,H:0,R:0,BB:0,SO:0,HR:0};
}

else{
homePitcher=player;
if(!homePitch[player])
homePitch[player]={outs:0,H:0,R:0,BB:0,SO:0,HR:0};
}

}

}

if(e[0]!=="play") return;

const inning=parseInt(e[1]);
const team=e[2];
const batter=e[3];
const desc=e[6]||"";

const batTeam=team==="0"?awayBat:homeBat;
const pitTeam=team==="0"?homePitch:awayPitch;
const pitcher=team==="0"?homePitcher:awayPitcher;

if(!batTeam[batter])
batTeam[batter]={AB:0,H:0,RBI:0,BB:0,SO:0,HR:0};

batTeam[batter].AB++;

if(pitcher){

if(!pitTeam[pitcher])
pitTeam[pitcher]={outs:0,H:0,R:0,BB:0,SO:0,HR:0};

pitTeam[pitcher].outs++;

}

if(desc.includes("HR")){
batTeam[batter].H++;
batTeam[batter].HR++;
if(pitcher) pitTeam[pitcher].HR++;
}

else if(desc.startsWith("S")||desc.startsWith("D")||desc.startsWith("T")){
batTeam[batter].H++;
if(pitcher) pitTeam[pitcher].H++;
}

if(desc.startsWith("K")){
batTeam[batter].SO++;
if(pitcher) pitTeam[pitcher].SO++;
}

if(desc.startsWith("W")){
batTeam[batter].BB++;
if(pitcher) pitTeam[pitcher].BB++;
}

const rbi=(desc.match(/\.[123]-H/g)||[]).length+(desc.includes("HR")?1:0);

batTeam[batter].RBI+=rbi;

if(!linescore[inning])
linescore[inning]={away:0,home:0};

if(team==="0"){
linescore[inning].away+=rbi;
awayTotal+=rbi;
}
else{
linescore[inning].home+=rbi;
homeTotal+=rbi;
if(pitcher) pitTeam[pitcher].R+=rbi;
}

});

return{
awayBat,homeBat,
awayPitch,homePitch,
linescore,
awayTotal,homeTotal
};

}

function renderLinescore(linescore,away,home,awayTotal,homeTotal){

let head="<tr><th></th>";

for(let i=1;i<=9;i++)
head+=`<th>${i}</th>`;

head+="<th>R</th></tr>";

let awayRow=`<tr><td>${away}</td>`;
let homeRow=`<tr><td>${home}</td>`;

for(let i=1;i<=9;i++){

awayRow+=`<td>${linescore[i]?.away||0}</td>`;
homeRow+=`<td>${linescore[i]?.home||0}</td>`;

}

awayRow+=`<td>${awayTotal}</td></tr>`;
homeRow+=`<td>${homeTotal}</td></tr>`;

document.getElementById("linescoreHead").innerHTML=head;
document.getElementById("linescoreBody").innerHTML=awayRow+homeRow;

}

function renderBat(id,data){

let html="";

Object.entries(data).forEach(([pid,p])=>{

html+=`
<tr>
<td>${playerLink(pid)}</td>
<td>${p.AB}</td>
<td>${p.H}</td>
<td>${p.RBI}</td>
<td>${p.BB}</td>
<td>${p.SO}</td>
<td>${p.HR}</td>
</tr>
`;

});

document.getElementById(id).innerHTML=html;

}

function renderPitch(id,data){

let html="";

Object.entries(data).forEach(([pid,p])=>{

html+=`
<tr>
<td>${playerLink(pid)}</td>
<td>${(p.outs/3).toFixed(1)}</td>
<td>${p.H}</td>
<td>${p.R}</td>
<td>${p.BB}</td>
<td>${p.SO}</td>
<td>${p.HR}</td>
</tr>
`;

});

document.getElementById(id).innerHTML=html;

}

async function loadGame(){

await loadPlayers();

const params=new URLSearchParams(location.search);
const id=params.get("id");

const year=id.substring(0,4);

const res=await fetch(`data/baseball/boxscores/${year}/${id}.json`);
const game=await res.json();

const away=TEAM_NAMES[game.away_code]||game.away_code;
const home=TEAM_NAMES[game.home_code]||game.home_code;

document.getElementById("matchup").textContent=`${away} @ ${home}`;
document.getElementById("date").textContent=game.date;

document.getElementById("venue").textContent=
"Venue: "+(game.venue || game.site || game.park || "Unknown");

document.getElementById("attendance").textContent=
"Attendance: "+(game.attendance || "—");

const stats=processGame(game.events);

document.getElementById("score").textContent=
`${stats.awayTotal} - ${stats.homeTotal}`;

document.getElementById("awayBatTitle").textContent=
away+" Batting";

document.getElementById("homeBatTitle").textContent=
home+" Batting";

document.getElementById("awayPitchTitle").textContent=
away+" Pitching";

document.getElementById("homePitchTitle").textContent=
home+" Pitching";

renderLinescore(stats.linescore,away,home,stats.awayTotal,stats.homeTotal);

renderBat("awayBat",stats.awayBat);
renderBat("homeBat",stats.homeBat);

renderPitch("awayPitch",stats.awayPitch);
renderPitch("homePitch",stats.homePitch);

}

loadGame();

</script>

</body>
</html>
