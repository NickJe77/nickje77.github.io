<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.hero h1{margin:0;font-size:36px;}
.hero .sub{margin-top:10px;font-size:18px;opacity:.95;}
.scoreline{font-size:20px;font-weight:700;margin-top:8px;}
.meta-line{margin-top:6px;}
.section{background:white;padding:18px;border-radius:16px;margin-bottom:20px;}
.section h2{margin:0 0 12px 0;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:white;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
a{color:#0056d6;text-decoration:none;font-weight:700;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}
</style>
</head>

<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
<a href="./baseball-teams.html">Teams</a>
<a href="./baseball-players.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="scoreline" class="scoreline"></div>
<div id="subtitle" class="sub"></div>
<div id="venueLine" class="meta-line"></div>
<div id="crowdLine" class="meta-line"></div>
</div>

<div class="section">
<h2>Game Details</h2>
<div id="meta"></div>
</div>

<div class="grid">
<div class="section"><h2>Away Batting</h2><div id="awayBatting"></div></div>
<div class="section"><h2>Home Batting</h2><div id="homeBatting"></div></div>
<div class="section"><h2>Away Pitching</h2><div id="awayPitching"></div></div>
<div class="section"><h2>Home Pitching</h2><div id="homePitching"></div></div>
</div>

</div>

<script>

let PLAYERS={}, TEAMS={}, PARKS={}

function param(n){return new URLSearchParams(window.location.search).get(n)}
function playerName(id){return PLAYERS[id]||id}
function teamName(code){return TEAMS[code]||code}
function parkName(code){return PARKS[code]||code}

async function loadLookups(){

const p=await fetch("/data/baseball/players.json")
if(p.ok){
const d=await p.json()
d.forEach(pl=>PLAYERS[pl.player_id]=pl.name)
}

const t=await fetch("/data/baseball/teams.json")
if(t.ok){
const d=await t.json()
d.forEach(team=>{
team.codes.forEach(c=>TEAMS[c]=team.name)
})
}

const b=await fetch("/data/baseball/ballparks.csv")
if(b.ok){
const text=await b.text()
text.split("\n").slice(1).forEach(l=>{
const parts=l.split(",")
if(parts.length>1) PARKS[parts[0].trim()]=parts[1].trim()
})
}
}

async function loadGame(){

const rawId = param("game")
const seasonParam = param("season")

if(!rawId){
document.getElementById("title").innerText="Game not found"
return
}

const id = String(rawId).trim()
const season = seasonParam || id.match(/(\d{4})/)[1]

let game = null

// 2026 (index system)
try{
  const indexRes = await fetch(`/data/baseball/boxscores/${season}/index.json`)
  if(indexRes.ok){
    const index = await indexRes.json()
    const file = index[id]

    if(file){
      const res = await fetch(`/data/baseball/boxscores/${season}/${file}`)
      if(res.ok){
        game = await res.json()
      }
    }
  }
}catch(e){}

// fallback (2025 and older)
if(!game){
  try{
    const res = await fetch(`/data/baseball/games/${season}/${id}.json`)
    if(res.ok){
      game = await res.json()
    }
  }catch(e){}
}

if(!game){
document.getElementById("title").innerText="Game not found"
return
}

// load season meta (score + venue)
const seasonRes=await fetch(`/data/baseball/seasons/${season}.json`)
let meta=null

if(seasonRes.ok){
const seasonData=await seasonRes.json()
const m=id.match(/(\d{4})(\d{2})(\d{2})/)
if(m){
const formatted=`${m[1]}-${m[2]}-${m[3]}`
meta=seasonData.find(g=>
g.home_code===game.home_code &&
g.date===formatted
)
}
}

render(game,meta)
}

function render(game,meta){

const homeFull = game.home_team || teamName(game.home_code)
const awayFull = game.away_team || teamName(game.away_code)

// TITLE
document.getElementById("title").innerText =
`${awayFull} @ ${homeFull}`

// SCORE + VENUE
if(meta){

  const score =
    (meta.away_score != null && meta.home_score != null)
    ? `${awayFull} ${meta.away_score} – ${homeFull} ${meta.home_score}`
    : ""

  document.getElementById("scoreline").innerText = score
  document.getElementById("subtitle").innerText = meta.date

  document.getElementById("venueLine").innerText =
    meta.venue ? `Venue: ${parkName(meta.venue)}` : ""

  document.getElementById("crowdLine").innerText =
    meta.attendance ? `Attendance: ${meta.attendance.toLocaleString()}` : ""
}

// tables
renderTable("awayBatting",game.batters_away)
renderTable("homeBatting",game.batters_home)
renderTable("awayPitching",game.pitchers_away)
renderTable("homePitching",game.pitchers_home)
}

function renderTable(id,data){
if(!data||data.length===0){
document.getElementById(id).innerHTML="No detailed data available."
return
}
const keys=Object.keys(data[0]).filter(k=>k!=="player_id")
let html="<table><thead><tr><th>Player</th>"
keys.forEach(k=>html+=`<th>${k}</th>`)
html+="</tr></thead><tbody>"
data.forEach(p=>{
html+=`<tr>
<td><a href="./baseball-player.html?player=${p.player_id}">${playerName(p.player_id)}</a></td>`
keys.forEach(k=>html+=`<td>${p[k]}</td>`)
html+="</tr>"
})
html+="</tbody></table>"
document.getElementById(id).innerHTML=html
}

async function init(){
await loadLookups()
await loadGame()
}

init()

</script>

</body>
</html>
