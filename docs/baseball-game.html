<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baseball Game | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --board-line:rgba(255,255,255,.10);
  --accent:#c8102e;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.nav{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;}
.nav a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.nav a:hover{opacity:1;}

.layout{display:flex;gap:20px;max-width:1800px;margin:0 auto;padding:26px 20px 70px;align-items:flex-start;}

.ad-col{width:160px;min-width:160px;position:sticky;top:80px;}
.ad-slot{
  width:160px;min-height:600px;background:var(--surface);border-radius:var(--radius);
  border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--faint);font-size:11px;font-weight:600;text-align:center;letter-spacing:.04em;text-transform:uppercase;
}

.page{flex:1;min-width:0;}

/* ── Scorebug ─────────────────────────────────────────── */
.scorebug{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:22px;
}
.scorebug .eyebrow{
  text-align:center;font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  padding:20px 16px 0;
}
.bug-grid{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:10px;padding:14px 30px 30px;
}
.bug-team{display:flex;align-items:center;gap:16px;min-width:0;}
.bug-team.left{justify-content:flex-end;text-align:right;}
.bug-team.right{justify-content:flex-start;text-align:left;}
.bug-team .tname{
  font-family:var(--display);font-weight:600;font-size:clamp(17px,2.8vw,28px);
  line-height:1.04;letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.bug-score{
  display:flex;align-items:center;gap:14px;font-family:var(--display);font-weight:600;
  font-size:clamp(38px,8vw,66px);line-height:1;letter-spacing:.01em;
}
.bug-score .sc{font-variant-numeric:tabular-nums;}
.bug-score .sc.lose{color:rgba(255,255,255,.42);font-weight:500;}
.bug-score .dash{color:rgba(255,255,255,.3);font-weight:400;}

@media(max-width:820px){
  .bug-grid{grid-template-columns:1fr;gap:16px;padding:10px 18px 26px;}
  .bug-team.left,.bug-team.right{justify-content:center;text-align:center;}
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.card h2{
  margin:0 0 14px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;
  text-transform:uppercase;color:var(--muted);
}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;padding:10px;font-size:11px;font-weight:600;text-align:left;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);
}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f0f6ff;}

td a{color:var(--ink);text-decoration:none;font-weight:700;}
td a:hover{color:var(--accent);text-decoration:underline;}

.no-stats{padding:20px;color:var(--muted);font-size:13px;text-align:center;}

@media(max-width:900px){

.layout{padding:8px;gap:0;}
.ad-col{display:none;}
.grid{gap:10px;}
.card{padding:12px;}
.card h2{font-size:15px;margin-bottom:10px;}
.nav{gap:14px;padding:12px;font-size:12.5px;}
th{font-size:11px;padding:8px 6px;}
td{font-size:12.5px;padding:7px 6px;}

}

</style>
</head>

<body>

<nav class="nav">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="baseball-seasons.html">Seasons</a>
    <a href="baseball-players.html">Players</a>
</nav>

<div class="layout">

    <div class="ad-col">
        <div class="ad-slot">Ad</div>
    </div>

    <div class="page">

        <div class="scorebug" id="scorebug">
          <div class="eyebrow" id="heroEyebrow">Loading…</div>
          <div class="bug-grid">
            <div class="bug-team left">
              <span class="tname" id="awayTeamName"></span>
            </div>
            <div class="bug-score">
              <span class="sc" id="awayScoreEl"></span>
              <span class="dash">–</span>
              <span class="sc" id="homeScoreEl"></span>
            </div>
            <div class="bug-team right">
              <span class="tname" id="homeTeamName"></span>
            </div>
          </div>
        </div>

        <div class="grid">

            <div class="card">
                <h2>Away Batting</h2>
                <div class="table-wrap">
                    <table id="awayBatting">
                        <thead>
                            <tr>
                                <th>Player</th>
                                <th>AB</th>
                                <th>R</th>
                                <th>H</th>
                                <th>RBI</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2>Home Batting</h2>
                <div class="table-wrap">
                    <table id="homeBatting">
                        <thead>
                            <tr>
                                <th>Player</th>
                                <th>AB</th>
                                <th>R</th>
                                <th>H</th>
                                <th>RBI</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2>Away Pitching</h2>
                <div class="table-wrap">
                    <table id="awayPitching">
                        <thead>
                            <tr>
                                <th>Pitcher</th>
                                <th>IP</th>
                                <th>H</th>
                                <th>ER</th>
                                <th>SO</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2>Home Pitching</h2>
                <div class="table-wrap">
                    <table id="homePitching">
                        <thead>
                            <tr>
                                <th>Pitcher</th>
                                <th>IP</th>
                                <th>H</th>
                                <th>ER</th>
                                <th>SO</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <div class="ad-col">
        <div class="ad-slot">Ad</div>
    </div>

</div>

<script>

const TEAM_NAMES = {
    "ARI": "Arizona Diamondbacks",
    "ATL": "Atlanta Braves",
    "BAL": "Baltimore Orioles",
    "BOS": "Boston Red Sox",
    "CHC": "Chicago Cubs",
    "CHN": "Chicago Cubs",
    "CHW": "Chicago White Sox",
    "CHA": "Chicago White Sox",
    "CIN": "Cincinnati Reds",
    "CLE": "Cleveland Guardians",
    "COL": "Colorado Rockies",
    "DET": "Detroit Tigers",
    "HOU": "Houston Astros",
    "KAN": "Kansas City Royals",
    "KCA": "Kansas City Royals",
    "LAA": "Los Angeles Angels",
    "ANA": "Los Angeles Angels",
    "CAL": "California Angels",
    "LAD": "Los Angeles Dodgers",
    "LAN": "Los Angeles Dodgers",
    "MIA": "Miami Marlins",
    "FLA": "Florida Marlins",
    "FLO": "Florida Marlins",
    "MIL": "Milwaukee Brewers",
    "MIN": "Minnesota Twins",
    "NYM": "New York Mets",
    "NYN": "New York Mets",
    "NYY": "New York Yankees",
    "NYA": "New York Yankees",
    "ATH": "Athletics",
    "OAK": "Oakland Athletics",
    "PHI": "Philadelphia Phillies",
    "PIT": "Pittsburgh Pirates",
    "SD":  "San Diego Padres",
    "SDN": "San Diego Padres",
    "SEA": "Seattle Mariners",
    "SF":  "San Francisco Giants",
    "SFN": "San Francisco Giants",
    "STL": "St. Louis Cardinals",
    "SLN": "St. Louis Cardinals",
    "TB":  "Tampa Bay Rays",
    "TBA": "Tampa Bay Rays",
    "TEX": "Texas Rangers",
    "TOR": "Toronto Blue Jays",
    "WSH": "Washington Nationals",
    "WAS": "Washington Nationals",
    "MON": "Montreal Expos",
    "WS1": "Washington Senators",
    "WS2": "Washington Senators",
    "BRO": "Brooklyn Dodgers",
    "BSN": "Boston Braves",
    "PHA": "Philadelphia Athletics",
    "SLA": "St. Louis Browns",
    "MLN": "Milwaukee Braves"
};

function resolveName(val){
    if(!val) return "";
    if(typeof val === "object" && val !== null){
        return val.name || "";
    }
    if(val.includes(" ")) return val;
    return TEAM_NAMES[val] || val;
}

const params   = new URLSearchParams(window.location.search);
const season   = params.get("season");
const gameFile = params.get("game");
const url      = `/data/baseball/boxscores/${season}/${gameFile}`;

function showError(msg){
    document.getElementById("heroEyebrow").textContent = msg;
    document.querySelector(".bug-grid").style.display = "none";
}

async function loadGame(){
    try{
        const res = await fetch(url);
        if(!res.ok) throw new Error("Game not found");
        const game = await res.json();
        renderGame(game);
    } catch(err){
        showError("Game not found");
        console.error(err);
    }
}

function renderGame(game){

    const awayRaw = game.away_team;
    const homeRaw = game.home_team;

    const awayName  = resolveName(typeof awayRaw === "object" ? awayRaw?.name || awayRaw?.code : awayRaw);
    const homeName  = resolveName(typeof homeRaw === "object" ? homeRaw?.name || homeRaw?.code : homeRaw);
    const awayScore = typeof awayRaw === "object" ? (awayRaw?.score ?? game.away_score ?? 0) : (game.away_score ?? 0);
    const homeScore = typeof homeRaw === "object" ? (homeRaw?.score ?? game.home_score ?? 0) : (game.home_score ?? 0);
    const venue     = game.venue || "";
    const date      = game.date  || "";

    document.getElementById("heroEyebrow").textContent = [date, venue].filter(Boolean).join(" · ");
    document.getElementById("awayTeamName").textContent = awayName;
    document.getElementById("homeTeamName").textContent = homeName;

    const awayWin = Number(awayScore) > Number(homeScore);
    const homeWin = Number(homeScore) > Number(awayScore);
    const awayScoreEl = document.getElementById("awayScoreEl");
    const homeScoreEl = document.getElementById("homeScoreEl");
    awayScoreEl.textContent = awayScore;
    homeScoreEl.textContent = homeScore;
    awayScoreEl.classList.toggle("lose", homeWin);
    homeScoreEl.classList.toggle("lose", awayWin);

    document.title = `${awayName} @ ${homeName} | The Sporting Almanac`;

    const box = game.liveData?.boxscore;

    if(box && box.teams){
        renderBatting(box.teams.away.players, document.querySelector("#awayBatting tbody"));
        renderBatting(box.teams.home.players, document.querySelector("#homeBatting tbody"));
        renderPitching(box.teams.away.players, document.querySelector("#awayPitching tbody"));
        renderPitching(box.teams.home.players, document.querySelector("#homePitching tbody"));
    } else {
        const msg = `<tr><td colspan="5" class="no-stats">Box score stats not available for this game.</td></tr>`;
        document.querySelector("#awayBatting tbody").innerHTML  = msg;
        document.querySelector("#homeBatting tbody").innerHTML  = msg;
        document.querySelector("#awayPitching tbody").innerHTML = msg;
        document.querySelector("#homePitching tbody").innerHTML = msg;
    }
}

function renderBatting(players, tbody){
    tbody.innerHTML = "";
    Object.values(players).forEach(player => {
        if(!player.stats || !player.stats.batting) return;
        const b = player.stats.batting;
        if(
            (b.atBats    || 0) === 0 &&
            (b.walks     || 0) === 0 &&
            (b.hitByPitch|| 0) === 0 &&
            (b.sacFlies  || 0) === 0
        ) return;
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><a href="baseball-player.html?player=${encodeURIComponent(player.person.fullName)}">${player.person.fullName}</a></td>
            <td>${b.atBats || 0}</td>
            <td>${b.runs   || 0}</td>
            <td>${b.hits   || 0}</td>
            <td>${b.rbi    || 0}</td>
        `;
        tbody.appendChild(tr);
    });
}

function renderPitching(players, tbody){
    tbody.innerHTML = "";
    Object.values(players).forEach(player => {
        if(!player.stats || !player.stats.pitching) return;
        const p = player.stats.pitching;
        if(!p.inningsPitched || p.inningsPitched === "0.0") return;
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><a href="baseball-player.html?player=${encodeURIComponent(player.person.fullName)}">${player.person.fullName}</a></td>
            <td>${p.inningsPitched || 0}</td>
            <td>${p.hits          || 0}</td>
            <td>${p.earnedRuns    || 0}</td>
            <td>${p.strikeOuts    || 0}</td>
        `;
        tbody.appendChild(tr);
    });
}

loadGame();

</script>

</body>
</html>
