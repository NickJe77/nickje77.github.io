<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:24px auto;
padding:0 16px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:28px;
border-radius:16px;
text-align:center;
margin-bottom:16px;
}

.matchup{
font-size:34px;
font-weight:900;
}

.score{
font-size:64px;
font-weight:900;
}

.date{
font-size:18px;
}

.card{
background:#fff;
border-radius:14px;
padding:16px;
margin-bottom:16px;
box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.pill{
display:inline-block;
padding:8px 12px;
border-radius:10px;
background:#eef4ff;
border:1px solid #cfe0ff;
margin-right:8px;
font-weight:800;
}

table{
width:100%;
border-collapse:collapse;
}

thead th{
background:#002D72;
color:#fff;
padding:10px;
text-align:center;
}

thead th:first-child{
text-align:left;
}

tbody td{
padding:8px;
text-align:center;
border-bottom:1px solid #eee;
font-weight:700;
}

tbody td:first-child{
text-align:left;
}

tbody tr:nth-child(even){
background:#f0f6ff;
}

.player{
color:#0056d6;
font-weight:900;
text-decoration:none;
}
</style>

</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<div id="matchup" class="matchup"></div>
<div id="score" class="score"></div>
<div id="date" class="date"></div>
</div>

<div class="card">
<span id="venue" class="pill"></span>
<span id="attendance" class="pill"></span>
</div>

<div class="card">
<h3>Linescore</h3>
<div id="linescore"></div>
</div>

<div class="card">
<h3 id="awayBatTitle"></h3>
<div id="awayBat"></div>
</div>

<div class="card">
<h3 id="homeBatTitle"></h3>
<div id="homeBat"></div>
</div>

<div class="card">
<h3 id="awayPitchTitle"></h3>
<div id="awayPitch"></div>
</div>

<div class="card">
<h3 id="homePitchTitle"></h3>
<div id="homePitch"></div>
</div>

</div>

<script>

(async function(){

const params=new URLSearchParams(location.search);
const id=params.get("id");
const year=id.substring(0,4);

const game=
await fetch(`data/baseball/boxscores/${year}/${id}.json`)
.then(r=>r.json());

const players=
await fetch(`data/baseball/players.json`)
.then(r=>r.json());

function name(id){
if(players[id]) return players[id].name;
return id;
}

let venue="Unknown";
let attendance="—";

const awayBat={};
const homeBat={};

const awayPitch={};
const homePitch={};

let awayPitcher=null;
let homePitcher=null;

const lines={};

let awayRuns=0;
let homeRuns=0;

for(const e of game.events){

if(e[0]=="info"){

if(e[1]=="site") venue=e[2];
if(e[1]=="attendance") attendance=e[2];

}

if(e[0]=="start" && e[4]=="1"){

if(e[2]=="0") awayPitcher=e[1];
if(e[2]=="1") homePitcher=e[1];

}

if(e[0]!="play") continue;

const inning=parseInt(e[1]);
const team=e[2];
const batter=e[3];
const desc=e[6];

let bat;
let pit;

if(team=="0"){
bat=awayBat;
pit=homePitch;
}else{
bat=homeBat;
pit=awayPitch;
}

if(!bat[batter])
bat[batter]={AB:0,H:0,RBI:0,BB:0,SO:0,HR:0};

bat[batter].AB++;

if(desc.startsWith("S")||desc.startsWith("D")||desc.startsWith("T")){
bat[batter].H++;
}

if(desc.includes("HR")){
bat[batter].H++;
bat[batter].HR++;
}

if(desc.startsWith("K")){
bat[batter].SO++;
}

if(desc.startsWith("W")){
bat[batter].BB++;
}

const runs=(desc.match(/\.H/g)||[]).length;

if(runs){

bat[batter].RBI+=runs;

if(!lines[inning])
lines[inning]={away:0,home:0};

if(team=="0"){
lines[inning].away+=runs;
awayRuns+=runs;
}else{
lines[inning].home+=runs;
homeRuns+=runs;
}

}

}

document.getElementById("matchup").innerHTML=
`${game.away_code} @ ${game.home_code}`;

document.getElementById("date").innerHTML=game.date;

document.getElementById("score").innerHTML=
`${awayRuns} - ${homeRuns}`;

document.getElementById("venue").innerHTML=
`Venue: ${venue}`;

document.getElementById("attendance").innerHTML=
`Attendance: ${attendance}`;

function renderBat(div,title,data){

document.getElementById(title).innerHTML=title;

let html="<table><thead><tr>";
html+="<th>Player</th><th>AB</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>HR</th>";
html+="</tr></thead><tbody>";

for(const p in data){

const s=data[p];

html+="<tr>";
html+=`<td class="player">${name(p)}</td>`;
html+=`<td>${s.AB}</td>`;
html+=`<td>${s.H}</td>`;
html+=`<td>${s.RBI}</td>`;
html+=`<td>${s.BB}</td>`;
html+=`<td>${s.SO}</td>`;
html+=`<td>${s.HR}</td>`;
html+="</tr>";

}

html+="</tbody></table>";

document.getElementById(div).innerHTML=html;

}

renderBat("awayBat","awayBatTitle",awayBat);
renderBat("homeBat","homeBatTitle",homeBat);

function renderPitch(div,title,pitcher){

document.getElementById(title).innerHTML=title;

if(!pitcher){

document.getElementById(div).innerHTML="No pitcher data";
return;

}

let html="<table><thead><tr>";
html+="<th>Pitcher</th></tr></thead><tbody>";

html+=`<tr><td class="player">${name(pitcher)}</td></tr>`;

html+="</tbody></table>";

document.getElementById(div).innerHTML=html;

}

renderPitch("awayPitch","awayPitchTitle",awayPitcher);
renderPitch("homePitch","homePitchTitle",homePitcher);

})();
</script>

</body>
</html>
