<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: system-ui, Arial, sans-serif;
  margin:0;
  padding:20px;
  background:#f5f6fa;
}

h1 { text-align:center; }

.header {
  padding:30px;
  border-radius:16px;
  color:#fff;
  font-size:28px;
  font-weight:700;
  background: linear-gradient(90deg,#1e3c72,#c31432);
}

.section {
  background:#fff;
  padding:20px;
  margin-top:20px;
  border-radius:12px;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th, td {
  padding:6px;
  text-align:left;
  border-bottom:1px solid #ddd;
  font-size:14px;
}

th {
  background:#eee;
}
</style>
</head>

<body>

<div id="title" class="header"></div>

<div class="section">
  <h2>Game Details</h2>
  <div id="details"></div>
</div>

<div class="grid">

  <div class="section">
    <h3>Away Batting</h3>
    <div id="awayBatting"></div>
  </div>

  <div class="section">
    <h3>Home Batting</h3>
    <div id="homeBatting"></div>
  </div>

  <div class="section">
    <h3>Away Pitching</h3>
    <div id="awayPitching"></div>
  </div>

  <div class="section">
    <h3>Home Pitching</h3>
    <div id="homePitching"></div>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const gameId = params.get("game");
const season = params.get("season");

const url = `/data/baseball/boxscores/${season}/${gameId}.json`;

fetch(url)
  .then(res => res.json())
  .then(game => {

    console.log("GAME DATA:", game);

    // -------------------------
    // TITLE
    // -------------------------
    const away = game.away_team || game.teams?.away?.team?.name || "Away";
    const home = game.home_team || game.teams?.home?.team?.name || "Home";

    document.getElementById("title").innerText =
      `${away} @ ${home}`;

    // -------------------------
    // DETAILS
    // -------------------------
    document.getElementById("details").innerHTML = `
      <b>Date:</b> ${game.date || ""}<br>
      <b>Venue:</b> ${game.venue || game.venue?.name || ""}<br>
      <b>Score:</b> ${game.away_score ?? game.teams?.away?.runs ?? ""} - ${game.home_score ?? game.teams?.home?.runs ?? ""}
    `;

    // -------------------------
    // NORMALISE DATA
    // -------------------------
    function getBatting(side) {

      // OLD FORMAT
      if (game.batting) {
        return game.batting.filter(p => p.team === side);
      }

      // NEW MLB FORMAT
      const players = game.liveData?.boxscore?.teams?.[side]?.players;

      if (!players) return [];

      return Object.values(players)
        .map(p => p.stats?.batting ? {
          name: p.person.fullName,
          ...p.stats.batting
        } : null)
        .filter(Boolean);
    }

    function getPitching(side) {

      if (game.pitching) {
        return game.pitching.filter(p => p.team === side);
      }

      const players = game.liveData?.boxscore?.teams?.[side]?.players;

      if (!players) return [];

      return Object.values(players)
        .map(p => p.stats?.pitching ? {
          name: p.person.fullName,
          ...p.stats.pitching
        } : null)
        .filter(Boolean);
    }

    // -------------------------
    // RENDER TABLE
    // -------------------------
    function renderTable(data, elId) {

      if (!data || data.length === 0) {
        document.getElementById(elId).innerText = "No detailed data available.";
        return;
      }

      let html = "<table><tr>";

      Object.keys(data[0]).forEach(k => {
        html += `<th>${k}</th>`;
      });

      html += "</tr>";

      data.forEach(row => {
        html += "<tr>";
        Object.values(row).forEach(v => {
          html += `<td>${v ?? ""}</td>`;
        });
        html += "</tr>";
      });

      html += "</table>";

      document.getElementById(elId).innerHTML = html;
    }

    // -------------------------
    // OUTPUT
    // -------------------------
    renderTable(getBatting("away"), "awayBatting");
    renderTable(getBatting("home"), "homeBatting");
    renderTable(getPitching("away"), "awayPitching");
    renderTable(getPitching("home"), "homePitching");

  });
</script>

</body>
</html>
