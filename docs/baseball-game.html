<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:30px;border-radius:20px;margin-bottom:20px;}
.error{background:#fff3f3;border:1px solid #ffb3b3;padding:20px;border-radius:12px;color:#a10000;font-weight:700;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="mlb.html">MLB</a>
</div>

<div class="page">
<div class="hero">
<h1 id="title">MLB Game</h1>
</div>

<div id="errorBox"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
let gameId = params.get("game");
let season = params.get("season");

const errorBox = document.getElementById("errorBox");

// Auto-correct broken links
if (!gameId || gameId === "undefined") {
    errorBox.innerHTML = `
        <div class="error">
        This link was generated incorrectly (game=undefined).<br><br>
        Returning to current MLB season page.
        </div>
    `;
    setTimeout(() => {
        window.location.href = "baseball-season.html?season=" + new Date().getFullYear();
    }, 1500);
    throw new Error("Broken link intercepted");
}

// Auto-correct missing season
if (!season) {
    season = gameId.substring(3,7); // extract year from game_id
}

fetch(`docs/data/baseball/games/${season}/${gameId}.json`)
.then(res => {
    if (!res.ok) throw new Error("Game file not found");
    return res.json();
})
.then(data => {
    document.getElementById("title").textContent =
        data.away_code + " @ " + data.home_code;
})
.catch(err => {
    errorBox.innerHTML = `
        <div class="error">
        Could not load game file:<br>
        docs/data/baseball/games/${season}/${gameId}.json
        </div>
    `;
});
</script>

</body>
</html>
