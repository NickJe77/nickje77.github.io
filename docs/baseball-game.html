<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.hero h1{margin:0;font-size:36px;}
.hero .sub{margin-top:10px;font-size:18px;opacity:.95;}
.section{background:white;padding:18px;border-radius:16px;margin-bottom:20px;}
.section h2{margin:0 0 12px 0;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:white;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
a{color:#0056d6;text-decoration:none;font-weight:700;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}
</style>
</head>

<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
<a href="./baseball-teams.html">Teams</a>
<a href="./baseball-players.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
<div class="sub" id="subtitle"></div>
</div>

<div class="section">
<h2>Game Details</h2>
<div id="meta"></div>
</div>

<div class="grid">
<div class="section">
<h2>Away Batting</h2>
<div id="awayBatting"></div>
</div>

<div class="section">
<h2>Home Batting</h2>
<div id="homeBatting"></div>
</div>

<div class="section">
<h2>Away Pitching</h2>
<div id="awayPitching"></div>
</div>

<div class="section">
<h2>Home Pitching</h2>
<div id="homePitching"></div>
</div>
</div>

</div>

<script>

let PLAYERS = {}
let TEAMS = {}

function param(name){
return new URLSearchParams(window.location.search).get(name)
}

function seasonFromGameId(id){
const m=id.match(/(\d{4})/)
return m?m[1]:""
}

function playerName(id){
return PLAYERS[id] || id
}

function teamName(code){
return TEAMS[code] || code
}

async function loadLookups(){

// Players lookup
try{
const res = await fetch("/data/baseball/players.json")
if(res.ok){
const data = await res.json()
if(Array.isArray(data)){
data.forEach(p=>{
if(p.player_id && p.name){
PLAYERS[p.player_id] = p.name
}
})
}
}
}catch(e){}

// Teams lookup (map each code)
try{
const res = await fetch("/data/baseball/teams.json")
if(res.ok){
const data = await res.json()
if(Array.isArray(data)){
data.forEach(team=>{
if(Array.isArray(team.codes)){
team.codes.forEach(code=>{
TEAMS[code] = team.name
})
}
})
}
}
}catch(e){}

}

async function loadGame(){

const id = param("game")
if(!id) return

const season = seasonFromGameId(id)

const res = await fetch(`/data/baseball/games/${season}/${id}.json`)

if(!res.ok){
document.getElementById("meta").innerHTML="<b>Game file not found.</b>"
return
}

const game = await res.json()

render(game)

}

function render(game){

const homeFull = teamName(game.home_code)
const awayFull = teamName(game.away_code)

document.getElementById("title").innerText = `${awayFull} @ ${homeFull}`
document.getElementById("subtitle").innerText = `Season ${game.season}`

document.getElementById("meta").innerHTML = `
<b>Game ID:</b> ${game.game_id}
`

renderTable("awayBatting",game.batters_away)
renderTable("homeBatting",game.batters_home)
renderTable("awayPitching",game.pitchers_away)
renderTable("homePitching",game.pitchers_home)

}

function renderTable(id,data){

if(!data || data.length===0){
document.getElementById(id).innerHTML="No data available."
return
}

const keys = Object.keys(data[0]).filter(k=>k!=="player_id")

let html="<table><thead><tr><th>Player</th>"

keys.forEach(k=>html+=`<th>${k}</th>`)

html+="</tr></thead><tbody>"

data.forEach(p=>{
html+=`<tr>
<td><a href="./baseball-player.html?player=${p.player_id}">${playerName(p.player_id)}</a></td>`
keys.forEach(k=>html+=`<td>${p[k]}</td>`)
html+="</tr>"
})

html+="</tbody></table>"

document.getElementById(id).innerHTML=html

}

async function init(){
await loadGame()
await loadLookups()
await loadGame()
}

init()

</script>

</body>
</html>
