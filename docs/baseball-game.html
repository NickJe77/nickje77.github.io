<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:34px;
border-radius:20px;
margin-bottom:18px;
text-align:center;
}

.hero .matchup{
font-size:42px;
font-weight:900;
}

.hero .score{
font-size:72px;
margin-top:8px;
font-weight:900;
}

.hero .date{
margin-top:6px;
font-size:18px;
font-weight:700;
}

.card{
background:#fff;
padding:18px;
border-radius:16px;
box-shadow:0 4px 14px rgba(0,0,0,0.12);
margin-bottom:18px;
}

.card h3{
margin-top:0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th{
background:#002D72;
color:#fff;
padding:8px;
text-align:left;
}

td{
padding:6px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f0f6ff;
}

.linescore td{
text-align:center;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<div class="matchup" id="matchup"></div>
<div class="score" id="score"></div>
<div class="date" id="date"></div>
</div>

<div class="card">
<h3>Game Info</h3>
<div id="venue"></div>
<div id="attendance"></div>
</div>

<div class="card">
<h3>Linescore</h3>
<table class="linescore">
<thead id="linescoreHead"></thead>
<tbody id="linescoreBody"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayBattingTitle"></h3>
<table>
<thead><tr><th>Player</th></tr></thead>
<tbody id="awayBatting"></tbody>
</table>
</div>

<div class="card">
<h3 id="homeBattingTitle"></h3>
<table>
<thead><tr><th>Player</th></tr></thead>
<tbody id="homeBatting"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayPitchTitle"></h3>
<table>
<thead><tr><th>Pitcher</th></tr></thead>
<tbody id="awayPitching"></tbody>
</table>
</div>

<div class="card">
<h3 id="homePitchTitle"></h3>
<table>
<thead><tr><th>Pitcher</th></tr></thead>
<tbody id="homePitching"></tbody>
</table>
</div>

</div>

<script>

const TEAM_NAMES={
NYA:"New York Yankees",
BOS:"Boston Red Sox"
};

function getName(code){
return TEAM_NAMES[code]||code;
}

function calculateLinescore(events){

const innings=[];
let awayTotal=0;
let homeTotal=0;

for(const e of events){

if(e[0]!=="play") continue;

const inning=parseInt(e[1]);
const half=parseInt(e[2]);
const desc=e[6]||"";

const runs=(desc.match(/\.[123]-H/g)||[]).length
+(desc.includes("HR")?1:0);

if(!innings[inning]) innings[inning]={away:0,home:0};

if(half===0){
innings[inning].away+=runs;
awayTotal+=runs;
}
else{
innings[inning].home+=runs;
homeTotal+=runs;
}

}

return {innings,awayTotal,homeTotal};

}

function extractPlayers(events){

const awayBat=new Set();
const homeBat=new Set();

for(const e of events){

if(e[0]!=="play") continue;

const half=parseInt(e[2]);
const player=e[3];

if(half===0) awayBat.add(player);
else homeBat.add(player);

}

return{
awayBat:[...awayBat],
homeBat:[...homeBat],
awayPitch:["Multiple"],
homePitch:["Multiple"]
};

}

function extractInfo(events){

const info={};

for(const e of events){

if(e[0]!=="info") continue;

info[e[1]]=e[2];

}

return info;

}

async function loadGame(){

const params=new URLSearchParams(location.search);
const id=params.get("id");
const year=id.substring(0,4);

const res=await fetch(`data/baseball/boxscores/${year}/${id}.json`);
const game=await res.json();

const awayName=getName(game.away_code);
const homeName=getName(game.home_code);

const linescore=calculateLinescore(game.events);

document.getElementById("matchup").textContent=
`${awayName} @ ${homeName}`;

document.getElementById("score").textContent=
`${linescore.awayTotal} - ${linescore.homeTotal}`;

document.getElementById("date").textContent=game.date;

const info=extractInfo(game.events);

document.getElementById("venue").textContent=
"Venue: "+(info.site||"");

document.getElementById("attendance").textContent=
"Attendance: "+(info.attendance||"");

buildLinescore(linescore,awayName,homeName);

const players=extractPlayers(game.events);

fillList("awayBatting",players.awayBat);
fillList("homeBatting",players.homeBat);

fillList("awayPitching",players.awayPitch);
fillList("homePitching",players.homePitch);

document.getElementById("awayBattingTitle").textContent=
awayName+" Batting";

document.getElementById("homeBattingTitle").textContent=
homeName+" Batting";

document.getElementById("awayPitchTitle").textContent=
awayName+" Pitching";

document.getElementById("homePitchTitle").textContent=
homeName+" Pitching";

}

function buildLinescore(ls,away,home){

let head="<tr><th></th>";

for(let i=1;i<ls.innings.length;i++)
head+="<th>"+i+"</th>";

head+="<th>R</th></tr>";

document.getElementById("linescoreHead").innerHTML=head;

let awayRow="<tr><td>"+away+"</td>";
let homeRow="<tr><td>"+home+"</td>";

for(let i=1;i<ls.innings.length;i++){

awayRow+="<td>"+(ls.innings[i]?.away||0)+"</td>";
homeRow+="<td>"+(ls.innings[i]?.home||0)+"</td>";

}

awayRow+="<td>"+ls.awayTotal+"</td></tr>";
homeRow+="<td>"+ls.homeTotal+"</td></tr>";

document.getElementById("linescoreBody").innerHTML=
awayRow+homeRow;

}

function fillList(id,list){

const tbody=document.getElementById(id);

list.forEach(p=>{
tbody.innerHTML+=`<tr><td>${p}</td></tr>`;
});

}

loadGame();

</script>

</body>
</html>
