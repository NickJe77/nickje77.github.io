<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baseball Game | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Inter,system-ui,sans-serif;
    background:#eef2f7;
}

.nav{
    background:white;
    padding:18px;
    text-align:center;
    border-bottom:1px solid #d9dee5;
}

.nav a{
    text-decoration:none;
    color:#0056d6;
    font-weight:700;
    margin:0 18px;
    font-size:16px;
}

.page{
    max-width:1600px;
    margin:auto;
    padding:28px;
}

.hero{
    background:linear-gradient(135deg,#002f87,#e4002b);
    color:white;
    border-radius:30px;
    padding:40px;
    margin-bottom:30px;
}

.hero h1{
    margin:0;
    font-size:58px;
    line-height:1.1;
}

.sub{
    margin-top:10px;
    font-size:22px;
    opacity:.9;
}

.scoreline{
    margin-top:25px;
    font-size:34px;
    font-weight:800;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.card{
    background:white;
    border-radius:24px;
    padding:24px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.card h2{
    margin-top:0;
    font-size:26px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0056d6;
    color:white;
    padding:10px;
    text-align:left;
    font-size:14px;
}

td{
    padding:10px;
    border-bottom:1px solid #e6ebf2;
    font-size:14px;
}

tr:nth-child(even){
    background:#f5f8fc;
}

.error{
    background:white;
    padding:20px;
    border-radius:18px;
    font-size:22px;
    font-weight:700;
    color:#c4002f;
}

@media(max-width:1000px){

.grid{
    grid-template-columns:1fr;
}

.hero h1{
    font-size:38px;
}

}

</style>
</head>

<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="baseball-seasons.html">Seasons</a>
    <a href="baseball-teams.html">Teams</a>
    <a href="baseball-players.html">Players</a>
</div>

<div class="page">

    <div id="hero" class="hero">
        <h1>Loading...</h1>
    </div>

    <div class="grid">

        <div class="card">
            <h2>Away Batting</h2>

            <table id="awayBatting">
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>AB</th>
                        <th>R</th>
                        <th>H</th>
                        <th>RBI</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="card">
            <h2>Home Batting</h2>

            <table id="homeBatting">
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>AB</th>
                        <th>R</th>
                        <th>H</th>
                        <th>RBI</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="card">
            <h2>Away Pitching</h2>

            <table id="awayPitching">
                <thead>
                    <tr>
                        <th>Pitcher</th>
                        <th>IP</th>
                        <th>H</th>
                        <th>ER</th>
                        <th>SO</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="card">
            <h2>Home Pitching</h2>

            <table id="homePitching">
                <thead>
                    <tr>
                        <th>Pitcher</th>
                        <th>IP</th>
                        <th>H</th>
                        <th>ER</th>
                        <th>SO</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const season = params.get("season");
const gameFile = params.get("game");

const url = `/data/baseball/boxscores/${season}/${gameFile}`;

async function loadGame(){

    try{

        const res = await fetch(url);

        if(!res.ok){
            throw new Error("Game not found");
        }

        const game = await res.json();

        renderGame(game);

    }catch(err){

        document.getElementById("hero").innerHTML = `
            <h1>Game not found</h1>
        `;

        console.error(err);
    }

}

function renderGame(game){

    const away = game.away_team;
    const home = game.home_team;

    document.getElementById("hero").innerHTML = `
        <h1>${away.name} @ ${home.name}</h1>

        <div class="sub">
            ${game.date} • ${game.venue}
        </div>

        <div class="scoreline">
            ${away.score} - ${home.score}
        </div>
    `;

    const box = game.liveData.boxscore;

    if(!box || !box.teams){
        return;
    }

    renderBatting(
        box.teams.away.players,
        document.querySelector("#awayBatting tbody")
    );

    renderBatting(
        box.teams.home.players,
        document.querySelector("#homeBatting tbody")
    );

    renderPitching(
        box.teams.away.players,
        document.querySelector("#awayPitching tbody")
    );

    renderPitching(
        box.teams.home.players,
        document.querySelector("#homePitching tbody")
    );

}

function renderBatting(players, tbody){

    tbody.innerHTML = "";

    Object.values(players).forEach(player=>{

        if(!player.stats || !player.stats.batting) return;

        const b = player.stats.batting;

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${player.person.fullName}</td>
            <td>${b.atBats || 0}</td>
            <td>${b.runs || 0}</td>
            <td>${b.hits || 0}</td>
            <td>${b.rbi || 0}</td>
        `;

        tbody.appendChild(tr);

    });

}

function renderPitching(players, tbody){

    tbody.innerHTML = "";

    Object.values(players).forEach(player=>{

        if(!player.stats || !player.stats.pitching) return;

        const p = player.stats.pitching;

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${player.person.fullName}</td>
            <td>${p.inningsPitched || 0}</td>
            <td>${p.hits || 0}</td>
            <td>${p.earnedRuns || 0}</td>
            <td>${p.strikeOuts || 0}</td>
        `;

        tbody.appendChild(tr);

    });

}

loadGame();

</script>

</body>
</html>
