<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.section{
background:#fff;
padding:16px;
border-radius:16px;
margin-bottom:16px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#002D72;
color:#fff;
padding:10px;
text-align:left;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f0f6ff;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading game...</h1>
<div id="date"></div>
<div id="venue"></div>
</div>

<div class="section">
<h2>Batting</h2>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="batting"></tbody>
</table>
</div>

<div class="section">
<h2>Pitching</h2>
<table>
<thead>
<tr>
<th>Pitcher</th>
<th>Outs</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="pitching"></tbody>
</table>
</div>

</div>

<script>

let PLAYERS={}
let TEAMS={}
let PARKS={}

function getParam(name){
return new URLSearchParams(location.search).get(name)
}

async function loadPlayers(){
const r=await fetch("data/baseball/players.json")
const j=await r.json()

if(Array.isArray(j)){
j.forEach(p=>PLAYERS[p.id]=p.name)
}else{
PLAYERS=j
}
}

async function loadTeams(){
const r=await fetch("data/baseball/teams.json")
TEAMS=await r.json()
}

async function loadParks(){
const r=await fetch("data/baseball/ballparks.csv")
const t=await r.text()

t.split("\n").forEach(line=>{
const parts=line.split(",")
PARKS[parts[0]]=parts[1]
})
}

function nameOf(id){
return PLAYERS[id] || id
}

function teamName(code){
return TEAMS[code] || code
}

function parseBatting(events){

const stats={}

events.forEach(e=>{

if(e[0]!=="play") return

const player=e[3]
const result=e[6]

if(!stats[player]){
stats[player]={pa:0,h:0,bb:0,so:0}
}

stats[player].pa++

if(result.startsWith("S") || result.startsWith("D") || result.startsWith("T") || result.startsWith("HR"))
stats[player].h++

if(result.startsWith("W"))
stats[player].bb++

if(result.startsWith("K"))
stats[player].so++

})

return stats
}

function renderBatting(stats){

const tbody=document.getElementById("batting")

Object.entries(stats).forEach(([id,s])=>{

const tr=document.createElement("tr")

tr.innerHTML=`
<td>${nameOf(id)}</td>
<td>${s.pa}</td>
<td>${s.h}</td>
<td>${s.bb}</td>
<td>${s.so}</td>
`

tbody.appendChild(tr)

})
}

async function loadGame(){

const id=getParam("id")

if(!id){
document.getElementById("title").textContent="Missing game id"
return
}

const year=id.substring(0,4)

const path=`data/baseball/boxscores/${year}/${id}.json`

const r=await fetch(path)

if(!r.ok){
document.getElementById("title").textContent="Game file not found"
return
}

const game=await r.json()

document.getElementById("title").textContent=
teamName(game.away_code)+" @ "+teamName(game.home_code)

document.getElementById("date").textContent=game.date

const stats=parseBatting(game.events)

renderBatting(stats)

}

async function init(){

await loadPlayers()
await loadTeams()
await loadParks()
await loadGame()

}

init()

</script>

</body>
</html>
