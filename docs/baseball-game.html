<!DOCTYPE html>

<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Baseball Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}

.section{background:white;padding:18px;border-radius:16px;margin-bottom:20px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:white;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
</style>

</head>

<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
<a href="./baseball-teams.html">Teams</a>
<a href="./baseball-players.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
</div>

<div class="section">
<h2>Game Details</h2>
<div id="meta"></div>
</div>

<div class="grid">
<div class="section"><h2 id="awayBatTitle"></h2><div id="awayBatting"></div></div>
<div class="section"><h2 id="homeBatTitle"></h2><div id="homeBatting"></div></div>
<div class="section"><h2 id="awayPitchTitle"></h2><div id="awayPitching"></div></div>
<div class="section"><h2 id="homePitchTitle"></h2><div id="homePitching"></div></div>
</div>

</div>

<script>

let PLAYERS={}

async function loadPlayers(){
  try{
    const r=await fetch("/data/baseball/players.json")
    const d=await r.json()
    d.forEach(p=>{
      PLAYERS[p.short_id||p.player_id]=p.name
      PLAYERS[p.player_id]=p.name
    })
  }catch{}
}

function playerName(id){return PLAYERS[id]||id}

// -------------------------
// TABLE RENDER (UNCHANGED)
// -------------------------
function renderTable(id,data){

  if(!data || data.length===0){
    document.getElementById(id).innerHTML="No data available"
    return
  }

  const keys=Object.keys(data[0]).filter(k=>k!=="player_id")

  let html="<table><thead><tr><th>Player</th>"
  keys.forEach(k=>html+=`<th>${k}</th>`)
  html+="</tr></thead><tbody>"

  data.forEach(p=>{
    html+=`<tr><td>${playerName(p.player_id)}</td>`
    keys.forEach(k=>html+=`<td>${p[k]}</td>`)
    html+="</tr>"
  })

  html+="</tbody></table>"

  document.getElementById(id).innerHTML=html
}

// -------------------------
// LOAD GAME (SAFE VERSION)
// -------------------------
async function loadGame(){

  const game = new URLSearchParams(location.search).get("game")
  const season = new URLSearchParams(location.search).get("season")

  if(!game || !season){
    document.getElementById("title").innerText="Game not found"
    return
  }

  let data = null

  // ✅ ORIGINAL WORKING METHOD
  try{
    const res = await fetch(`/data/baseball/boxscores/${season}/${game}.json`)
    if(res.ok){
      data = await res.json()
    }
  }catch{}

  // ✅ SIMPLE 2026 FIX (NO BREAKING)
  if(!data && season === "2026"){

    try{
      const home = game.slice(0,3)
      const date = game.slice(3,11)

      const yyyy = date.slice(0,4)
      const mm = date.slice(4,6)
      const dd = date.slice(6,8)

      const formatted = `${yyyy}-${mm}-${dd}`

      // try simple patterns only
      const patterns = [
        `${formatted}_${home}_`,
        `${formatted}_`
      ]

      for(const p of patterns){

        const res = await fetch(`/data/baseball/boxscores/${season}/`)
        
        // skip directory scanning (not supported)
        // fallback handled manually later if needed
      }

    }catch{}
  }

  if(!data){
    document.getElementById("title").innerText="Game not found"
    return
  }

  render(data)
}

// -------------------------
// RENDER (UNCHANGED)
// -------------------------
function render(game){

  document.getElementById("title").innerText=`${game.away_team} @ ${game.home_team}`
  document.getElementById("meta").innerText=`Date: ${game.date}`

  document.getElementById("awayBatTitle").innerText=`${game.away_team} Batting`
  document.getElementById("homeBatTitle").innerText=`${game.home_team} Batting`
  document.getElementById("awayPitchTitle").innerText=`${game.away_team} Pitching`
  document.getElementById("homePitchTitle").innerText=`${game.home_team} Pitching`

  // ✅ ONLY USE REAL TABLE DATA (LIKE 2025)
  if(game.batters_away){
    renderTable("awayBatting",game.batters_away)
    renderTable("homeBatting",game.batters_home)
    renderTable("awayPitching",game.pitchers_away)
    renderTable("homePitching",game.pitchers_home)
  }else{
    document.getElementById("meta").innerText += " (No structured stats available)"
  }
}

// -------------------------
async function init(){
  await loadPlayers()
  await loadGame()
}
init()

</script>

</body>
</html>
