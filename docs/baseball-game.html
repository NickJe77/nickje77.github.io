<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#0b2a6f,#c8102e);
color:white;
padding:30px;
border-radius:16px;
margin-bottom:20px;
text-align:center;
}

.hero .match{
font-size:28px;
font-weight:700;
}

.hero .score{
font-size:48px;
font-weight:800;
margin-top:4px;
}

.hero .date{
margin-top:6px;
opacity:0.9;
}

.meta{
display:flex;
gap:20px;
margin-bottom:20px;
}

.meta div{
background:#e9eef5;
padding:10px 14px;
border-radius:10px;
font-weight:600;
}

.section{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:20px;
}

.section h2{
margin-top:0;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#123a7a;
color:white;
padding:8px;
text-align:left;
}

td{
padding:8px;
}

tr:nth-child(even){
background:#eef3fb;
}

.error{
font-size:22px;
color:red;
text-align:center;
padding:40px;
}
</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-players.html">Players</a>
</div>

<div class="page" id="content">
Loading game...
</div>

<script>

function getGameID(){
const p=new URLSearchParams(location.search);
return p.get("id")||p.get("game")||p.get("gid");
}

async function loadGame(){

const id=getGameID();

if(!id){
showError("Invalid game link");
return;
}

const year=id.substring(0,4);

const possiblePaths=[

"data/baseball/games/"+year+"/"+id+".json",
"./data/baseball/games/"+year+"/"+id+".json",
"data/baseball/"+year+"/"+id+".json",
"./data/baseball/"+year+"/"+id+".json",
"data/baseball/games/"+id+".json",
"./data/baseball/games/"+id+".json"

];

let game=null;

for(const path of possiblePaths){

try{
const r=await fetch(path);
if(r.ok){
game=await r.json();
break;
}
}catch{}

}

if(!game){
showError("Game file not found");
return;
}

render(game);

}

function render(game){

const away=game.away_code||game.away||game.away_team||"";
const home=game.home_code||game.home||game.home_team||"";

const awayScore=game.away_score??game.awayScore??"";
const homeScore=game.home_score??game.homeScore??"";

const date=game.date||game.game_date||"";

let html=`
<div class="hero">
<div class="match">${away} @ ${home}</div>
<div class="score">${awayScore} - ${homeScore}</div>
<div class="date">${date}</div>
</div>

<div class="meta">
<div>Venue: ${game.venue??"Unknown"}</div>
<div>Attendance: ${game.attendance??"-"}</div>
</div>
`;

html+=renderTable(game.awayBatTitle||"Away Batting",game.awayBatting);
html+=renderTable(game.homeBatTitle||"Home Batting",game.homeBatting);
html+=renderTable(game.awayPitchTitle||"Away Pitching",game.awayPitching);
html+=renderTable(game.homePitchTitle||"Home Pitching",game.homePitching);

content.innerHTML=html;

}

function renderTable(title,data){

if(!data||!data.length)
return `<div class="section"><h2>${title}</h2>No data</div>`;

const cols=Object.keys(data[0]);

let html=`<div class="section"><h2>${title}</h2><table><tr>`;

cols.forEach(c=>html+="<th>"+c+"</th>");

html+="</tr>";

data.forEach(r=>{
html+="<tr>";
cols.forEach(c=>html+="<td>"+(r[c]??"")+"</td>");
html+="</tr>";
});

html+="</table></div>";

return html;

}

function showError(msg){
content.innerHTML='<div class="error">'+msg+"</div>";
}

loadGame();

</script>

</body>
</html>
