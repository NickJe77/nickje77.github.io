<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1100px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:28px;
border-radius:18px;
margin-bottom:18px;
}

.hero h1{
margin:0;
font-size:32px;
}

.card{
background:white;
padding:18px;
border-radius:14px;
margin-bottom:16px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">
<h1 id="title">Loading game...</h1>
</div>

<div class="card">

<h3>Batting</h3>

<table>

<thead>

<tr>
<th>Player</th>
<th>Team</th>
<th>AB</th>
<th>R</th>
<th>H</th>
<th>RBI</th>
</tr>

</thead>

<tbody id="batting"></tbody>

</table>

</div>

<div class="card">

<h3>Pitching</h3>

<table>

<thead>

<tr>
<th>Player</th>
<th>Team</th>
<th>IP</th>
<th>H</th>
<th>ER</th>
<th>K</th>
</tr>

</thead>

<tbody id="pitching"></tbody>

</table>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

if(!id){

alert("Missing game id");

throw new Error("Missing game id");

}

async function loadGame(){

const res =
await fetch(`data/baseball/boxscores/${id}.json?cache=${Date.now()}`);

if(!res.ok){

alert("Game file not found: "+id);

return;

}

const game = await res.json();

document.getElementById("title").textContent =
`${game.away_team} ${game.away_score} - ${game.home_score} ${game.home_team}`;

const battingBody =
document.getElementById("batting");

battingBody.innerHTML="";

game.batting.forEach(p=>{

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${p.player}</td>
<td>${p.team}</td>
<td>${p.AB}</td>
<td>${p.R}</td>
<td>${p.H}</td>
<td>${p.RBI}</td>

`;

battingBody.appendChild(tr);

});

const pitchingBody =
document.getElementById("pitching");

pitchingBody.innerHTML="";

game.pitching.forEach(p=>{

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${p.player}</td>
<td>${p.team}</td>
<td>${p.IP}</td>
<td>${p.H}</td>
<td>${p.ER}</td>
<td>${p.K}</td>

`;

pitchingBody.appendChild(tr);

});

}

loadGame();

</script>

</body>
</html>
