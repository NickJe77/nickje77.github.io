<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui;
  background:#f4f6f8;
  margin:0;
}

.page{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:white;
  padding:30px;
  border-radius:20px;
}

.score{
  font-size:28px;
  margin-top:10px;
}

.info{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

</style>
</head>

<body>

<div class="page">

<div class="hero">
<h1 id="teams"></h1>
<div id="score" class="score"></div>
</div>

<div class="info" id="info"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const year = params.get("year");
const gameIndex = params.get("game");

async function loadGame(){

  const res = await fetch(`data/baseball/seasons/${year}.json`);
  const games = await res.json();

  const game = games[gameIndex];

  document.getElementById("teams").textContent =
    game.away_team + " @ " + game.home_team;

  document.getElementById("score").textContent =
    game.away_score + " - " + game.home_score;

  document.getElementById("info").innerHTML = `
    <b>Date:</b> ${game.date}<br>
    <b>Venue:</b> ${game.venue}<br>
    <b>Attendance:</b> ${game.attendance ?? "Unknown"}<br>
    <b>Game Length:</b> ${game.game_length_minutes ?? "Unknown"} minutes
  `;

}

loadGame();

</script>

</body>
</html>
