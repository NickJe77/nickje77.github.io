<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}

.page{max-width:1200px;margin:auto;padding:20px;}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:28px;
border-radius:20px;
margin-bottom:14px;
}

.card{
background:#fff;
border-radius:16px;
padding:14px;
margin-bottom:14px;
}

.split{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

th{
background:#002D72;
color:#fff;
padding:10px;
text-align:left;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){background:#f0f6ff;}

.playerLink{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

.playerLink:hover{text-decoration:underline;}

.teamTitle{
font-weight:700;
margin-bottom:6px;
font-size:18px;
}

.info{
font-weight:700;
margin-bottom:10px;
}
</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title"></h1>
<div id="date"></div>
</div>

<div class="info" id="venue">Venue: —</div>

<div class="card">

<h2>Batting</h2>

<div class="split">

<div>
<div class="teamTitle" id="awayName"></div>
<table><tbody id="awayBat"></tbody></table>
</div>

<div>
<div class="teamTitle" id="homeName"></div>
<table><tbody id="homeBat"></tbody></table>
</div>

</div>
</div>

<div class="card">

<h2>Pitching</h2>

<div class="split">

<div>
<div class="teamTitle" id="awayPitchName"></div>
<table><tbody id="awayPitch"></tbody></table>
</div>

<div>
<div class="teamTitle" id="homePitchName"></div>
<table><tbody id="homePitch"></tbody></table>
</div>

</div>
</div>

</div>

<script>

const id=new URLSearchParams(location.search).get("id");
const year=id.substring(0,4);

const GAME=`data/baseball/boxscores/${year}/${id}.json`;

let PLAYERS={},TEAMS={},PARKS={};

async function loadRefs(){

PLAYERS=await fetch("data/baseball/players.json").then(r=>r.json());
TEAMS=await fetch("data/baseball/teams.json").then(r=>r.json());

/* ballparks */

const csv=await fetch("data/baseball/ballparks.csv").then(r=>r.text());

csv.split("\n").forEach(row=>{
const c=row.split(",");
if(c.length>1) PARKS[c[0]]=c[1];
});

}

function pname(id){return PLAYERS[id]||id;}
function tname(id){return TEAMS[id]||id;}

function plink(id){
return `<a class="playerLink" href="baseball-player.html?id=${id}">${pname(id)}</a>`;
}

function ip(outs){
return Math.floor(outs/3)+"."+(outs%3);
}

async function loadGame(){

await loadRefs();

const g=await fetch(GAME).then(r=>r.json());

const away=tname(g.away_code);
const home=tname(g.home_code);

document.getElementById("title").textContent=`${away} @ ${home}`;
document.getElementById("date").textContent=g.date;

document.getElementById("awayName").textContent=away;
document.getElementById("homeName").textContent=home;

document.getElementById("awayPitchName").textContent=away;
document.getElementById("homePitchName").textContent=home;

/* VENUE FROM BALLPARK CODE IN GAME_ID */

const park=g.game_id.substring(0,3);

document.getElementById("venue").textContent=
"Venue: "+(PARKS[park]||park);

/* stats */

const awayBat={},homeBat={},awayPitch={},homePitch={};

let homePitcher=null;
let awayPitcher=null;

/* infer pitchers:
first defensive player appearing on opposite team */

for(const e of g.events){

if(e[0]!=="play") continue;

const battingTeam=e[2];
const batter=e[3];

const bat=battingTeam==="0"?awayBat:homeBat;

if(!bat[batter])
bat[batter]={pa:0};

bat[batter].pa++;

/* pitcher inference */

if(battingTeam==="0"){

if(!homePitcher) homePitcher="PITCHER";
if(!homePitch[homePitcher]) homePitch[homePitcher]={outs:0};

homePitch[homePitcher].outs++;

}else{

if(!awayPitcher) awayPitcher="PITCHER";
if(!awayPitch[awayPitcher]) awayPitch[awayPitcher]={outs:0};

awayPitch[awayPitcher].outs++;

}

}

/* render batting */

function renderBat(id,data){

const tbody=document.getElementById(id);

tbody.innerHTML="<tr><th>Player</th><th>PA</th></tr>";

for(const p in data){

tbody.innerHTML+=`
<tr>
<td>${plink(p)}</td>
<td>${data[p].pa}</td>
</tr>
`;

}

}

/* render pitching */

function renderPitch(id,data){

const tbody=document.getElementById(id);

tbody.innerHTML="<tr><th>Pitcher</th><th>IP</th></tr>";

for(const p in data){

tbody.innerHTML+=`
<tr>
<td>${p}</td>
<td>${ip(data[p].outs)}</td>
</tr>
`;

}

}

renderBat("awayBat",awayBat);
renderBat("homeBat",homeBat);

renderPitch("awayPitch",awayPitch);
renderPitch("homePitch",homePitch);

}

loadGame();

</script>

</body>
</html>
