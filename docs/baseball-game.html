<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game</title>

<style>

body{
font-family:Inter;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
}

.navbar a{
text-decoration:none;
color:#0056d6;
font-weight:600;
}

.page{
max-width:1000px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#BA0C2F);
color:white;
padding:40px;
border-radius:18px;
text-align:center;
}

.hero .teams{
font-size:34px;
font-weight:700;
}

.hero .score{
font-size:64px;
font-weight:800;
margin-top:10px;
}

.hero .date{
margin-top:10px;
font-size:18px;
}

.error{
background:white;
padding:40px;
border-radius:18px;
text-align:center;
font-size:24px;
color:red;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div id="content"></div>

</div>

<script>

const params = new URLSearchParams(location.search);
const id = params.get("id");

if(!id){

document.getElementById("content").innerHTML =
"<div class='error'>Game ID missing</div>";

throw new Error();

}

const year = id.substring(0,4);

async function load(){

try{

const res =
await fetch(`/data/baseball/boxscores/${year}/${id}.json`);

if(!res.ok) throw new Error();

const game = await res.json();

render(game);

}catch{

document.getElementById("content").innerHTML =
"<div class='error'>Game not found</div>";

}

}

function render(g){

document.getElementById("content").innerHTML = `

<div class="hero">

<div class="teams">
${g.away_code} @ ${g.home_code}
</div>

<div class="score">
${g.away_score} - ${g.home_score}
</div>

<div class="date">
${g.date}
</div>

</div>

`;

}

load();

</script>

</body>
</html>
