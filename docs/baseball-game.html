<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;

}

.navbar a{

}

.page{

}

.matchup{font-size:42px;font-weight:900;}
.score{font-size:72px;font-weight:900;margin-top:10px;}
.date{font-size:18px;margin-top:6px;font-weight:700;}

.card{

padding:18px;

}

table{

}

th{

color:#fff;

td{
padding:10px;
border-bottom:1px solid #eee;

}

td:first-child{

}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<div class="matchup" id="matchup"></div>
<div class="score" id="score"></div>
<div class="date" id="date"></div>
</div>

<div class="card">
<h3>Linescore</h3>
<table>
<thead id="linescoreHead"></thead>
<tbody id="linescoreBody"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayBatTitle"></h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>AB</th>
<th>H</th>
<th>R</th>
<th>RBI</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div class="card">
<h3 id="homeBatTitle"></h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>AB</th>
<th>H</th>
<th>R</th>
<th>RBI</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayPitchTitle"></h3>
<table>
<thead>
<tr>
<th>Pitcher</th>
<th>IP</th>
<th>H</th>
<th>R</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="awayPitch"></tbody>
</table>
</div>

<div class="card">
<h3 id="homePitchTitle"></h3>
<table>
<thead>
<tr>
<th>Pitcher</th>
<th>IP</th>
<th>H</th>
<th>R</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="homePitch"></tbody>
</table>
</div>

</div>

<script>

async function loadPlayers(){

const res=await fetch("data/baseball/players.json");

const data=await res.json();

const map=new Map();

for(const p of data){

map.set(
p.retrosheet_id,
p.name||p.full_name||p.player_name
);

}

return map;

}

function statObj(){

return{
AB:0,H:0,R:0,RBI:0,BB:0,SO:0,HR:0
};

}

function pitchObj(){

return{
IP:0,H:0,R:0,BB:0,SO:0,HR:0
};

}

function process(events,map){

const awayBat={};
const homeBat={};

const awayPitch={};
const homePitch={};

let awayPitcher=null;
let homePitcher=null;

let inningOuts=0;

let linescore={};

let awayTotal=0;
let homeTotal=0;

for(const e of events){

if(e[0]=="start"){

const team=e[2];
const pos=e[4];

if(pos=="1"){

if(team=="0")awayPitcher=e[1];
else homePitcher=e[1];

}

}

if(e[0]!="play")continue;

const inning=parseInt(e[1]);
const team=e[2];
const batter=e[3];
const desc=e[6];

const batTeam=team=="0"?awayBat:homeBat;
const pitchTeam=team=="0"?homePitch:awayPitch;

if(!batTeam[batter])batTeam[batter]=statObj();

const b=batTeam[batter];

b.AB++;

if(desc.includes("S")||desc.includes("D")||desc.includes("T")||desc.includes("HR"))b.H++;

if(desc.includes("HR"))b.HR++;

if(desc.includes("W"))b.BB++;

if(desc.includes("K"))b.SO++;

const runs=(desc.match(/\.[123]-H/g)||[]).length+(desc.includes("HR")?1:0);

b.RBI+=runs;

if(team=="0")awayTotal+=runs;
else homeTotal+=runs;

if(!linescore[inning])linescore[inning]={away:0,home:0};

if(team=="0")linescore[inning].away+=runs;
else linescore[inning].home+=runs;

}

return{
awayBat,
homeBat,
awayPitch,
homePitch,
linescore,
awayTotal,
homeTotal
};

}

function renderBat(id,data,map){

const el=document.getElementById(id);

el.innerHTML="";

for(const pid in data){

const p=data[pid];

el.innerHTML+=`
<tr>
<td>${map.get(pid)||pid}</td>
<td>${p.AB}</td>
<td>${p.H}</td>
<td>${p.R}</td>
<td>${p.RBI}</td>
<td>${p.BB}</td>
<td>${p.SO}</td>
<td>${p.HR}</td>
</tr>`;

}

}

function renderLinescore(ls,away,home){

let head="<tr><th></th>";

const max=Math.max(...Object.keys(ls).map(Number),9);

for(let i=1;i<=max;i++)head+="<th>"+i+"</th>";

head+="<th>R</th></tr>";

document.getElementById("linescoreHead").innerHTML=head;

let awayRow="<tr><td>"+away+"</td>";
let homeRow="<tr><td>"+home+"</td>";

let awayTotal=0;
let homeTotal=0;

for(let i=1;i<=max;i++){

const a=ls[i]?.away||0;
const h=ls[i]?.home||0;

awayRow+="<td>"+a+"</td>";
homeRow+="<td>"+h+"</td>";

awayTotal+=a;
homeTotal+=h;

}

awayRow+="<td>"+awayTotal+"</td></tr>";
homeRow+="<td>"+homeTotal+"</td></tr>";

document.getElementById("linescoreBody").innerHTML=awayRow+homeRow;

}

async function loadGame(){

const params=new URLSearchParams(location.search);
const id=params.get("id");

const year=id.substring(0,4);

const res=await fetch("data/baseball/boxscores/"+year+"/"+id+".json");

const game=await res.json();

const map=await loadPlayers();

document.getElementById("matchup").textContent=
map.get(game.away_code)||game.away_code
+" @ "+
map.get(game.home_code)||game.home_code;

document.getElementById("date").textContent=game.date;

const stats=process(game.events,map);

renderLinescore(stats.linescore,game.away_code,game.home_code);

renderBat("awayBat",stats.awayBat,map);
renderBat("homeBat",stats.homeBat,map);

document.getElementById("score").textContent=
stats.awayTotal+" - "+stats.homeTotal;

}

loadGame();

</script>

</body>
</html>
