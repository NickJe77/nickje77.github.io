<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>

<style>

body{
font-family:Inter,system-ui;
background:#f4f6f8;
margin:0;
}

.page{
max-width:1000px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:16px;
text-align:center;
}

.score{
font-size:48px;
font-weight:800;
margin-top:10px;
}

.error{
color:red;
text-align:center;
padding:40px;
font-weight:700;
}

</style>

</head>
<body>

<div class="page">

<div class="hero">

<div id="teams">Loading...</div>

<div id="score" class="score"></div>

</div>

</div>

<script>

const params = new URLSearchParams(location.search);

const gameId = params.get("id");

if(!gameId){

document.body.innerHTML =
"<div class='error'>Missing game ID</div>";

throw new Error();

}

async function loadGame(){

try{

/* absolute path — THIS FIXES IT */
const path =
"/data/baseball/boxscores/" + gameId + ".json";

console.log("Loading:", path);

const res =
await fetch(path);

if(!res.ok)
throw new Error("Not found");

const game =
await res.json();

document.getElementById("teams").textContent =
game.away_team + " @ " + game.home_team;

document.getElementById("score").textContent =
game.away_score + " - " + game.home_score;

}
catch(e){

document.body.innerHTML =
"<div class='error'>Game not found<br>"+gameId+"</div>";

console.error(e);

}

}

loadGame();

</script>

</body>
</html>
