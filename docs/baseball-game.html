<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
margin-bottom:20px;
border-radius:12px;
overflow:hidden;
}

th{
background:#002D72;
color:#fff;
padding:10px;
text-align:left;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f0f6ff;
}

.section{
font-weight:700;
font-size:20px;
margin:20px 0 10px;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="date"></div>
</div>

<div class="section">Batting</div>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
</tr>
</thead>
<tbody id="batting"></tbody>
</table>

</div>

<script>

let players = {};

async function loadPlayers(){

const res =
await fetch("data/baseball/players.json");

if(res.ok)
players = await res.json();

}

function getPlayerName(id){

return players[id] || id;

}

async function loadGame(){

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

if(!id){

document.getElementById("title").textContent =
"Missing game id";

return;

}

const year = id.substring(0,4);

const path =
`data/baseball/boxscores/${year}/${id}.json`;

const res = await fetch(path);

if(!res.ok){

document.getElementById("title").textContent =
"Game file not found";

return;

}

const game = await res.json();

document.getElementById("title").textContent =
game.away_code + " @ " + game.home_code;

document.getElementById("date").textContent =
game.date;

renderBatting(game);

}

function renderBatting(game){

const stats = {};

game.events.forEach(e=>{

if(e[0] !== "play") return;

const player = e[3];

if(!stats[player])
stats[player] = 0;

stats[player]++;

});

const tbody =
document.getElementById("batting");

tbody.innerHTML = "";

Object.entries(stats)
.forEach(([player,pa])=>{

const tr = document.createElement("tr");

tr.innerHTML =
"<td>"+getPlayerName(player)+"</td>"+
"<td>"+pa+"</td>";

tbody.appendChild(tr);

});

}

async function init(){

await loadPlayers();

await loadGame();

}

init();

</script>

</body>
</html>
