<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui;margin:0;background:#f4f6f8;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.section{background:white;padding:18px;border-radius:16px;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:white;padding:10px;}
td{padding:8px;border-bottom:1px solid #eee;}
</style>
</head>

<body>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
</div>

<div class="grid">
<div class="section"><h3>Away Batting</h3><div id="awayBatting"></div></div>
<div class="section"><h3>Home Batting</h3><div id="homeBatting"></div></div>
<div class="section"><h3>Away Pitching</h3><div id="awayPitching"></div></div>
<div class="section"><h3>Home Pitching</h3><div id="homePitching"></div></div>
</div>

</div>

<script>

function param(n){
  return new URLSearchParams(window.location.search).get(n);
}

// ---------------- TABLE ----------------
function table(data){
if(!data.length) return "No data";

let keys = Object.keys(data[0]);

let html = "<table><tr>";
keys.forEach(k=> html += `<th>${k}</th>`);
html += "</tr>";

data.forEach(r=>{
html += "<tr>";
keys.forEach(k=> html += `<td>${r[k]}</td>`);
html += "</tr>";
});

html += "</table>";
return html;
}

// ---------------- BUILD STATS ----------------
function buildStats(events, home, away){

const batting = {};
const pitching = {};

events.forEach(e=>{

const batter = e[3];
const result = e[6];
const team = e[2] === "0" ? away : home;

if(!batting[batter]){
batting[batter] = {player:batter,team,AB:0,H:0,BB:0,SO:0};
}

if(!pitching[team]){
pitching[team] = {player:team,team,SO:0,BB:0};
}

if(result !== "BB") batting[batter].AB++;

if(["1B","2B","3B","HR"].includes(result)) batting[batter].H++;

if(result === "BB"){
batting[batter].BB++;
pitching[team].BB++;
}

if(result === "K"){
batting[batter].SO++;
pitching[team].SO++;
}

});

return {
batting:Object.values(batting),
pitching:Object.values(pitching)
};
}

// ---------------- LOAD GAME ----------------
async function loadGame(){

const id = param("game");
const season = param("season");

if(!id || !season){
document.getElementById("title").innerText="Missing params";
return;
}

// 🔥 BUILD FROM GAME_ID
const home = id.slice(0,3);
const date = id.slice(3,11);

const formattedDate = `${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6,8)}`;

// try BOTH possible filename orders
const tryFiles = [
`${formattedDate}_${home}_${home}.json`, // fallback (unlikely)
];

// we don't know away team → try both possibilities
let game = null;

// brute force: try every team combo from common codes
const teams = ["LAN","CHN","TOR","ATH","NYA","BOS","ATL","HOU","SEA","SDN","SFN"];

for(let t of teams){

let file1 = `${formattedDate}_${t}_${home}.json`;
let file2 = `${formattedDate}_${home}_${t}.json`;

let res = await fetch(`/data/baseball/boxscores/${season}/${file1}`);
if(res.ok){
game = await res.json();
break;
}

res = await fetch(`/data/baseball/boxscores/${season}/${file2}`);
if(res.ok){
game = await res.json();
break;
}

}

if(!game){
document.getElementById("title").innerText="Game not found";
return;
}

// header
document.getElementById("title").innerText =
`${game.away_team} @ ${game.home_team}`;

// build stats
const stats = buildStats(game.events, game.home_team, game.away_team);

// render
document.getElementById("awayBatting").innerHTML =
table(stats.batting.filter(p=>p.team===game.away_team));

document.getElementById("homeBatting").innerHTML =
table(stats.batting.filter(p=>p.team===game.home_team));

document.getElementById("awayPitching").innerHTML =
table(stats.pitching.filter(p=>p.team===game.away_team));

document.getElementById("homePitching").innerHTML =
table(stats.pitching.filter(p=>p.team===game.home_team));

}

loadGame();

</script>

</body>
</html>
