<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}
.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}
.navbar a{
text-decoration:none;
color:#0056d6;
}
.page{
max-width:1100px;
margin:auto;
padding:20px;
}
.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}
.section{
background:#fff;
padding:16px;
border-radius:16px;
margin-bottom:16px;
}
table{
width:100%;
border-collapse:collapse;
}
th,td{
padding:6px;
border-bottom:1px solid #eee;
text-align:left;
}
th{
background:#002D72;
color:#fff;
}
</style>

</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/baseball.html">Baseball</a>
<a href="/baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
</div>

<div class="section">
<h2>Score</h2>
<div id="score"></div>
</div>

<div class="section">
<h2>Game Details</h2>
<table>
<tbody id="details"></tbody>
</table>
</div>

<div class="section">
<h2>Home Batting</h2>
<table>
<thead>
<tr>
<th>Player</th>
<th>AB</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="homeBatting"></tbody>
</table>
</div>

<div class="section">
<h2>Away Batting</h2>
<table>
<thead>
<tr>
<th>Player</th>
<th>AB</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="awayBatting"></tbody>
</table>
</div>

</div>

<script>

let PLAYERS = {};

function getGameId(){
return new URLSearchParams(window.location.search).get("game");
}

function getSeason(gameId){
return gameId.substring(3,7);
}

async function loadPlayers(){

const res = await fetch("/data/baseball/players.json");
const data = await res.json();

data.forEach(p=>{
PLAYERS[p.player_id] = p.name;
});

}

function playerName(id){
return PLAYERS[id] || id;
}

async function loadGame(){

await loadPlayers();

const gameId=getGameId();

const season=getSeason(gameId);

const res=await fetch(`/data/baseball/games/${season}/${gameId}.json`);

const game=await res.json();

renderGame(game);

}

function sumStat(players,stat){

if(!players) return 0;

let total=0;

players.forEach(p=>{
total += p[stat] || 0;
});

return total;

}

function renderGame(game){

const away=game.away_code;
const home=game.home_code;

document.getElementById("title").textContent =
away + " @ " + home;

const awayRuns = sumStat(game.batters_away,"H");
const homeRuns = sumStat(game.batters_home,"H");

document.getElementById("score").textContent =
awayRuns + " - " + homeRuns;

addRow("Game ID",game.game_id);
addRow("Season",game.season);

renderBatting("homeBatting",game.batters_home);
renderBatting("awayBatting",game.batters_away);

}

function renderBatting(id,players){

const tbody=document.getElementById(id);

tbody.innerHTML="";

players.forEach(p=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${playerName(p.player_id)}</td>
<td>${p.AB||0}</td>
<td>${p.H||0}</td>
<td>${p.BB||0}</td>
<td>${p.SO||0}</td>
`;

tbody.appendChild(tr);

});

}

function addRow(label,value){

const tr=document.createElement("tr");

tr.innerHTML=
`<td><strong>${label}</strong></td><td>${value}</td>`;

document.getElementById("details").appendChild(tr);

}

loadGame();

</script>

</body>
</html>
