<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Arial;
    margin:0;
    background:#f4f6f8;
    color:#111;
  }

  .navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px 0;
    background:#fff;
    border-bottom:1px solid #ddd;
    font-weight:700;
  }
  .navbar a{ text-decoration:none; color:#0056d6; }
  .navbar a:hover{ text-decoration:underline; }

  .page{ max-width:1200px; margin:22px auto; padding:0 18px 40px; }

  .hero{
    background:linear-gradient(90deg,#002D72,#C8102E);
    color:#fff;
    padding:34px 26px;
    border-radius:22px;
    box-shadow:0 10px 26px rgba(0,0,0,0.18);
    margin-bottom:16px;
    text-align:center;
  }
  .hero .matchup{ font-size:44px; font-weight:900; letter-spacing:0.2px; }
  .hero .score{ font-size:78px; font-weight:900; margin-top:10px; }
  .hero .date{ margin-top:8px; opacity:0.95; font-size:20px; font-weight:700; }

  .grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:14px;
    margin-top:14px;
  }
  .card{
    background:#fff;
    border-radius:18px;
    padding:16px 18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.10);
  }
  .card h3{ margin:0 0 8px; font-size:16px; color:#444; }
  .kv{ display:grid; grid-template-columns:140px 1fr; gap:8px 12px; }
  .k{ font-weight:800; color:#111; }
  .v{ color:#333; }

  .full{ grid-column:1 / -1; }

  .errorBox{
    background:#fff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.10);
    border:2px solid #e53935;
    color:#b71c1c;
    font-weight:900;
    text-align:center;
    font-size:22px;
  }

  .debug{
    margin-top:12px;
    font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size:13px;
    background:#0b1020;
    color:#d7e3ff;
    padding:12px 14px;
    border-radius:14px;
    overflow:auto;
    line-height:1.45;
  }

  @media (max-width: 820px){
    .grid{ grid-template-columns:1fr; }
    .hero .matchup{ font-size:32px; }
    .hero .score{ font-size:60px; }
  }
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-player.html">Players</a>
</div>

<div class="page">

  <div class="hero" id="hero">
    <div class="matchup" id="matchup">Loading…</div>
    <div class="score" id="score">—</div>
    <div class="date" id="dateLine"></div>
  </div>

  <div id="content" class="grid" style="display:none;">
    <div class="card">
      <h3>Game Info</h3>
      <div class="kv">
        <div class="k">Date</div><div class="v" id="infoDate">—</div>
        <div class="k">Season</div><div class="v" id="infoSeason">—</div>
        <div class="k">Venue</div><div class="v" id="infoVenue">—</div>
        <div class="k">Attendance</div><div class="v" id="infoAtt">—</div>
        <div class="k">Length</div><div class="v" id="infoLen">—</div>
      </div>
    </div>

    <div class="card">
      <h3>Teams</h3>
      <div class="kv">
        <div class="k">Away</div><div class="v" id="awayTeam">—</div>
        <div class="k">Home</div><div class="v" id="homeTeam">—</div>
        <div class="k">Away Code</div><div class="v" id="awayCode">—</div>
        <div class="k">Home Code</div><div class="v" id="homeCode">—</div>
      </div>
    </div>

    <div class="card full">
      <h3>Debug</h3>
      <div class="debug" id="debug">—</div>
    </div>
  </div>

  <div id="error" style="display:none;"></div>

</div>

<script>
(function(){

  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  const $ = (x)=>document.getElementById(x);

  function showError(msg, debugText){
    $("content").style.display = "none";
    const box = document.createElement("div");
    box.className = "errorBox";
    box.textContent = msg;
    $("error").innerHTML = "";
    $("error").appendChild(box);

    if(debugText){
      const dbg = document.createElement("div");
      dbg.className = "debug";
      dbg.textContent = debugText;
      $("error").appendChild(dbg);
    }

    $("error").style.display = "block";
    $("matchup").textContent = "Game not found";
    $("score").textContent = "—";
    $("dateLine").textContent = "";
  }

  function parseId(gameId){
    // Expected: YYYY-MM-DD_AAA_BBB
    if(!gameId) return null;
    const m = gameId.match(/^(\d{4})-(\d{2})-(\d{2})_([A-Z0-9]{2,4})_([A-Z0-9]{2,4})$/);
    if(!m) return null;
    return {
      year: Number(m[1]),
      date: `${m[1]}-${m[2]}-${m[3]}`,
      away: m[4],
      home: m[5]
    };
  }

  async function fetchJson(url){
    const res = await fetch(url, { cache: "no-store" });
    if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return await res.json();
  }

  async function load(){
    if(!id){
      showError("Game not found", "Missing ?id= parameter.");
      return;
    }

    const parsed = parseId(id);
    if(!parsed){
      showError("Game not found", `Bad id format.\nExpected: YYYY-MM-DD_AWAY_HOME\nGot: ${id}`);
      return;
    }

    // 1947+ only per your rule
    if(parsed.year < 1947){
      showError("Game not found", `This site supports MLB boxscores from 1947 onwards.\nRequested year: ${parsed.year}`);
      return;
    }

    // Try both possible storage layouts
    const candidates = [
      `data/baseball/boxscores/${parsed.year}/${id}.json`,
      `data/baseball/boxscores/${id}.json`
    ];

    let game = null;
    let debug = `Looking for: ${id}\n\nTried:\n`;
    for(const url of candidates){
      try{
        debug += `- ${url} … `;
        game = await fetchJson(url);
        debug += `OK\n`;
        break;
      }catch(e){
        debug += `FAILED (${e.message})\n`;
      }
    }

    if(!game){
      showError("Game not found", debug);
      return;
    }

    // Render minimal but correct info (we can expand once data is confirmed)
    const awayName = game.away_team || game.away || parsed.away;
    const homeName = game.home_team || game.home || parsed.home;

    const awayScore = (game.away_score ?? game.runs_away ?? game.score_away);
    const homeScore = (game.home_score ?? game.runs_home ?? game.score_home);

    $("matchup").textContent = `${awayName} @ ${homeName}`;
    $("score").textContent = (awayScore != null && homeScore != null) ? `${awayScore} - ${homeScore}` : "—";
    $("dateLine").textContent = game.date || parsed.date;

    $("infoDate").textContent = game.date || parsed.date;
    $("infoSeason").textContent = game.season || parsed.year;
    $("infoVenue").textContent = game.venue || game.park || "Unknown";
    $("infoAtt").textContent = game.attendance != null ? String(game.attendance) : "—";
    $("infoLen").textContent = game.game_length_minutes != null ? `${game.game_length_minutes} min` : "—";

    $("awayTeam").textContent = awayName;
    $("homeTeam").textContent = homeName;
    $("awayCode").textContent = game.away_code || parsed.away;
    $("homeCode").textContent = game.home_code || parsed.home;

    $("debug").textContent = debug;

    $("error").style.display = "none";
    $("content").style.display = "grid";
  }

  load();

})();
</script>

</body>
</html>
