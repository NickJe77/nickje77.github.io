<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Baseball Game</title>

<style>
body{font-family:Inter,Arial;margin:0;background:#eef2f7}
.page{max-width:1200px;margin:auto;padding:20px}
.hero{
background:linear-gradient(90deg,#0b2a6f,#c8102e);
color:white;padding:30px;border-radius:18px;text-align:center;margin-bottom:20px
}
.score{font-size:56px;font-weight:bold}
.card{
background:white;padding:18px;margin-bottom:18px;border-radius:14px;
box-shadow:0 2px 6px rgba(0,0,0,.08)
}
table{width:100%;border-collapse:collapse}
th{background:#123a7a;color:white;padding:10px;text-align:left}
td{padding:10px}
tr:nth-child(even){background:#eef3fb}
.error{background:#ffdede;padding:15px;border-radius:10px;font-weight:bold}
</style>

</head>
<body>

<div class="page">
<div id="content">Loading game...</div>
</div>

<script>

let PLAYERS={};

function getGameId(){

const p=new URLSearchParams(location.search);

return p.get("id")||p.get("file")||p.get("game");

}

async function loadPlayers(){

try{
const r=await fetch("data/baseball/players.json");
if(r.ok) PLAYERS=await r.json();
}catch{}

}

function nameOf(id){

if(typeof PLAYERS[id]=="string") return PLAYERS[id];

if(PLAYERS[id]?.name) return PLAYERS[id].name;

if(PLAYERS[id]?.full_name) return PLAYERS[id].full_name;

return id;

}

async function loadGame(){

try{

await loadPlayers();

const id=getGameId();

if(!id) throw "Missing id";

const year=id.substring(0,4);

const path="data/baseball/boxscores/"+year+"/"+id+".json";

const r=await fetch(path);

if(!r.ok) throw "File not found";

const game=await r.json();

render(game);

}catch(e){

content.innerHTML="<div class='error'>"+e+"</div>";

}

}

function render(game){

let batting={home:{},away:{}};
let pitching={home:{},away:{}};

let score={home:0,away:0};

for(const e of game.events){

if(e[0]!="play") continue;

const inning=e[1];
const side=e[2]=="0"?"away":"home";

const batter=e[3];
const pitcher=e[5];
const result=e[6];

if(!batting[side][batter])
batting[side][batter]={name:nameOf(batter),AB:0,H:0,BB:0,SO:0};

const b=batting[side][batter];

if(!result.startsWith("W"))
b.AB++;

if(result.startsWith("S")||result.startsWith("D")||result.startsWith("T")||result.startsWith("HR"))
b.H++;

if(result.startsWith("W"))
b.BB++;

if(result.startsWith("K"))
b.SO++;

if(result.includes("-H"))
score[side]++;

if(pitcher){

const pside=side=="home"?"away":"home";

if(!pitching[pside][pitcher])
pitching[pside][pitcher]={name:nameOf(pitcher),BF:0};

pitching[pside][pitcher].BF++;

}

}

let html="<div class='hero'>";
html+="<h1>"+game.away_team+" @ "+game.home_team+"</h1>";
html+="<div class='score'>"+score.away+" - "+score.home+"</div>";
html+="<div>"+game.date+"</div>";
html+="</div>";

html+=table("Away Batting",batting.away);
html+=table("Home Batting",batting.home);

html+=pitchTable("Away Pitching",pitching.away);
html+=pitchTable("Home Pitching",pitching.home);

content.innerHTML=html;

}

function table(title,data){

let html="<div class='card'><h3>"+title+"</h3><table>";
html+="<tr><th>Player</th><th>AB</th><th>H</th><th>BB</th><th>SO</th></tr>";

for(const k in data){

const r=data[k];

html+="<tr>";
html+="<td>"+r.name+"</td>";
html+="<td>"+r.AB+"</td>";
html+="<td>"+r.H+"</td>";
html+="<td>"+r.BB+"</td>";
html+="<td>"+r.SO+"</td>";
html+="</tr>";

}

html+="</table></div>";

return html;

}

function pitchTable(title,data){

let html="<div class='card'><h3>"+title+"</h3><table>";
html+="<tr><th>Pitcher</th><th>BF</th></tr>";

for(const k in data){

const r=data[k];

html+="<tr>";
html+="<td>"+r.name+"</td>";
html+="<td>"+r.BF+"</td>";
html+="</tr>";

}

html+="</table></div>";

return html;

}

loadGame();

</script>

</body>
</html>
