<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:28px;
border-radius:20px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:36px;
}

.meta{
margin-top:10px;
font-size:15px;
opacity:.95;
}

.meta span{
display:inline-block;
margin-right:16px;
font-weight:600;
}

/* CARDS */

.card{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:16px;
}

.card h3{
margin:0 0 12px;
}

/* TABLES */

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.right{
text-align:right;
}

.center{
text-align:center;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">

<h1 id="title">Loading...</h1>

<div class="meta" id="meta"></div>

</div>

<!-- LINESCORE -->

<div class="card">

<h3>Linescore</h3>

<table>

<thead id="linescoreHead"></thead>
<tbody id="linescoreBody"></tbody>

</table>

</div>

<!-- TEAM TOTALS -->

<div class="card">

<h3>Team Totals</h3>

<table>

<thead>
<tr>
<th>Team</th>
<th class="right">R</th>
<th class="right">H</th>
<th class="right">E</th>
</tr>
</thead>

<tbody id="totalsBody"></tbody>

</table>

</div>

<!-- BATTING -->

<div class="card">

<h3>Batting</h3>

<table>

<thead>
<tr>
<th>Player</th>
<th>Team</th>
<th class="right">AB</th>
<th class="right">R</th>
<th class="right">H</th>
<th class="right">RBI</th>
<th class="right">HR</th>
</tr>
</thead>

<tbody id="battingBody"></tbody>

</table>

</div>

<!-- PITCHING -->

<div class="card">

<h3>Pitching</h3>

<table>

<thead>
<tr>
<th>Pitcher</th>
<th>Team</th>
<th class="right">IP</th>
<th class="right">ER</th>
<th class="right">K</th>
<th class="right">BB</th>
</tr>
</thead>

<tbody id="pitchingBody"></tbody>

</table>

</div>

</div>

<script>

const params=new URLSearchParams(location.search);
const id=params.get("id");

let PARKS={};

/* LOAD BALLPARK CSV */

async function loadParks(){

const res=await fetch("data/baseball/ballpark.csv");
const text=await res.text();

const rows=text.split("\n");

const headers=rows[0].split(",");

const parkIndex=headers.indexOf("PARKID");
const nameIndex=headers.indexOf("NAME");
const cityIndex=headers.indexOf("CITY");
const stateIndex=headers.indexOf("STATE");

rows.slice(1).forEach(r=>{

const cols=r.split(",");

const id=cols[parkIndex];

if(!id)return;

PARKS[id]={

name:cols[nameIndex],
city:cols[cityIndex],
state:cols[stateIndex]

};

});

}

function parkName(id){

if(PARKS[id])
return PARKS[id].name;

return id;

}

function parkFull(id){

if(!PARKS[id])return id;

return `${PARKS[id].name} (${PARKS[id].city}, ${PARKS[id].state})`;

}

/* LOAD GAME */

async function loadGame(){

await loadParks();

const game=await fetch(`data/baseball/boxscores/${id}.json`)
.then(r=>r.json());

const away=game.away_team;
const home=game.home_team;

const awayScore=game.away_score;
const homeScore=game.home_score;

document.getElementById("title").innerHTML=`
<span class="click" onclick="location.href='baseball-team.html?team=${game.away_code}'">${away}</span>
${awayScore}
–
${homeScore}
<span class="click" onclick="location.href='baseball-team.html?team=${game.home_code}'">${home}</span>
`;

document.getElementById("meta").innerHTML=`
<span>${game.date}</span>
<span>${parkFull(game.venue)}</span>
<span>Attendance: ${game.attendance?.toLocaleString()||""}</span>
`;

/* LINESCORE */

if(game.linescore){

const innings=game.linescore.innings;

let head="<tr><th>Team</th>";

innings.forEach((_,i)=>{
head+=`<th class="center">${i+1}</th>`;
});

head+="<th class='center'>R</th></tr>";

document.getElementById("linescoreHead").innerHTML=head;

let body="";

body+=`<tr><td>${away}</td>`;
innings.forEach(i=>body+=`<td class='center'>${i.away}</td>`);
body+=`<td class='center'>${awayScore}</td></tr>`;

body+=`<tr><td>${home}</td>`;
innings.forEach(i=>body+=`<td class='center'>${i.home}</td>`);
body+=`<td class='center'>${homeScore}</td></tr>`;

document.getElementById("linescoreBody").innerHTML=body;

}

/* TEAM TOTALS */

let awayH=0,homeH=0;

game.batting.forEach(p=>{

if(p.team==game.away_code)
awayH+=p.H||0;

if(p.team==game.home_code)
homeH+=p.H||0;

});

document.getElementById("totalsBody").innerHTML=`

<tr>
<td>${away}</td>
<td class="right">${awayScore}</td>
<td class="right">${awayH}</td>
<td class="right">0</td>
</tr>

<tr>
<td>${home}</td>
<td class="right">${homeScore}</td>
<td class="right">${homeH}</td>
<td class="right">0</td>
</tr>

`;

/* BATTING */

const bat=document.getElementById("battingBody");
bat.innerHTML="";

game.batting.forEach(p=>{

bat.innerHTML+=`

<tr>

<td class="click"
onclick="location.href='baseball-player.html?player=${encodeURIComponent(p.player)}'">
${p.player}
</td>

<td>${p.team}</td>

<td class="right">${p.AB||0}</td>
<td class="right">${p.R||0}</td>
<td class="right">${p.H||0}</td>
<td class="right">${p.RBI||0}</td>
<td class="right">${p.HR||0}</td>

</tr>

`;

});

/* PITCHING */

const pit=document.getElementById("pitchingBody");
pit.innerHTML="";

game.pitching.forEach(p=>{

pit.innerHTML+=`

<tr>

<td class="click"
onclick="location.href='baseball-player.html?player=${encodeURIComponent(p.player)}'">
${p.player}
</td>

<td>${p.team}</td>

<td class="right">${p.IP||0}</td>
<td class="right">${p.ER||0}</td>
<td class="right">${p.K||0}</td>
<td class="right">${p.BB||0}</td>

</tr>

`;

});

}

loadGame();

</script>

</body>
</html>
