<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
  .navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
  .navbar a{text-decoration:none;color:#0056d6;}
  .page{max-width:1200px;margin:auto;padding:20px;}
  .hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:28px;border-radius:20px;margin-bottom:14px;}
  .hero h1{margin:0;font-size:42px;}
  .hero .sub{margin-top:6px;font-weight:700;opacity:.95;}
  .infoRow{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;}
  .pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:8px 12px;border-radius:999px;font-weight:800;}
  .section{background:#fff;padding:16px;border-radius:16px;margin-bottom:14px;}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:900px){.split{grid-template-columns:1fr;}}
  .teamTitle{font-weight:900;font-size:18px;margin:6px 0 8px 0;}
  table{width:100%;border-collapse:collapse;}
  th{background:#002D72;color:#fff;padding:10px;text-align:left;}
  td{padding:8px;border-bottom:1px solid #eee;}
  tr:nth-child(even){background:#f0f6ff;}
  .playerLink{color:#0056d6;text-decoration:none;font-weight:700;}
  .playerLink:hover{text-decoration:underline;}
  .errorBox{background:#ffe1e1;border:1px solid #ffbcbc;color:#8a0000;border-radius:12px;padding:12px;font-weight:900;margin-bottom:14px;}
  .muted{opacity:.8;font-weight:700;}
  .small{font-size:12px;opacity:.85;font-weight:700;}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-player.html">Players</a>
</div>

<div class="page">

  <div id="err" class="errorBox" style="display:none;"></div>

  <div class="hero">
    <h1 id="title">Loading…</h1>
    <div class="sub" id="date"></div>
    <div class="infoRow">
      <div class="pill" id="venuePill">Venue: —</div>
      <div class="pill" id="pitchPill">Pitchers: —</div>
    </div>
    <div class="small" id="debugLine"></div>
  </div>

  <div class="section">
    <h2 style="margin:0 0 10px 0;">Batting</h2>
    <div class="split">
      <div>
        <div class="teamTitle" id="awayName">Away</div>
        <table>
          <thead>
            <tr><th>Player</th><th>PA</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
          </thead>
          <tbody id="awayBat"></tbody>
        </table>
      </div>
      <div>
        <div class="teamTitle" id="homeName">Home</div>
        <table>
          <thead>
            <tr><th>Player</th><th>PA</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
          </thead>
          <tbody id="homeBat"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="section">
    <h2 style="margin:0 0 10px 0;">Pitching</h2>
    <div class="muted" id="pitchNote" style="margin-bottom:10px;">
      —
    </div>
    <div class="split">
      <div>
        <div class="teamTitle" id="awayPitchTitle">Away</div>
        <table>
          <thead>
            <tr><th>Pitcher</th><th>IP</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
          </thead>
          <tbody id="awayPitch"></tbody>
        </table>
      </div>
      <div>
        <div class="teamTitle" id="homePitchTitle">Home</div>
        <table>
          <thead>
            <tr><th>Pitcher</th><th>IP</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
          </thead>
          <tbody id="homePitch"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const id = qs.get("id");
  const err = (msg) => {
    const box = document.getElementById("err");
    box.style.display = "block";
    box.textContent = msg;
  };

  if(!id){
    err("Missing game id. Expected URL like: baseball-game.html?id=2021-10-05_NYA_BOS");
    return;
  }

  const year = id.slice(0,4);

  // Try multiple base paths safely (covers root / relative / odd deploys)
  const CANDIDATE_BASES = ["", "./", "/"];
  const candidates = (p) => CANDIDATE_BASES.map(b => (b + p).replace(/\/{2,}/g, "/"));

  async function fetchFirstOk(paths, asText=false){
    let lastStatus = "";
    for(const p of paths){
      try{
        const r = await fetch(p, {cache:"no-store"});
        if(r.ok){
          return asText ? await r.text() : await r.json();
        } else {
          lastStatus = `${p} -> ${r.status}`;
        }
      }catch(e){
        lastStatus = `${p} -> fetch error`;
      }
    }
    throw new Error(lastStatus || "Fetch failed");
  }

  // Build maps from any JSON shape
  function buildPlayerMap(data){
    const map = {};
    const add = (k,v) => { if(k && v) map[String(k).trim()] = String(v).trim(); };

    if(Array.isArray(data)){
      for(const o of data){
        if(!o) continue;
        if(Array.isArray(o) && o.length>=2){ add(o[0], o[1]); continue; }
        const pid = o.id || o.player_id || o.playerID || o.retro_id || o.key;
        const name = o.name || o.full_name || o.fullName || o.player_name || o.display_name || o.displayName
          || ([o.nameFirst||o.first||o.first_name, o.nameLast||o.last||o.last_name].filter(Boolean).join(" ").trim());
        if(pid && name) add(pid, name);
      }
      return map;
    }

    if(data && typeof data === "object"){
      if(Array.isArray(data.players)) return buildPlayerMap(data.players);
      for(const [k,v] of Object.entries(data)){
        if(typeof v === "string") add(k,v);
        else if(v && typeof v === "object"){
          const name = v.name || v.full_name || v.fullName || v.player_name || v.display_name || v.displayName
            || ([v.nameFirst||v.first||v.first_name, v.nameLast||v.last||v.last_name].filter(Boolean).join(" ").trim());
          if(name) add(k, name);
        }
      }
    }
    return map;
  }

  function buildTeamMap(data){
    const map = {};
    const add = (k,v) => { if(k && v) map[String(k).trim()] = String(v).trim(); };

    if(Array.isArray(data)){
      for(const o of data){
        if(!o) continue;
        if(Array.isArray(o) && o.length>=2){ add(o[0], o[1]); continue; }
        const code = o.code || o.team_code || o.teamCode || o.abbr || o.abbrev || o.id;
        const name = o.name || o.full_name || o.fullName || o.team_name || o.teamName || o.nickname || o.display_name;
        if(code && name) add(code, name);
      }
      return map;
    }

    if(data && typeof data === "object"){
      if(Array.isArray(data.teams)) return buildTeamMap(data.teams);
      for(const [k,v] of Object.entries(data)){
        if(typeof v === "string") add(k,v);
        else if(v && typeof v === "object"){
          const name = v.name || v.full_name || v.fullName || v.team_name || v.teamName || v.nickname || v.display_name;
          if(name) add(k, name);
        }
      }
    }
    return map;
  }

  function parseBallparksCSV(text){
    const map = {};
    const lines = text.split(/\r?\n/).filter(Boolean);
    for(const line of lines){
      const parts = line.split(",");
      const k = (parts[0]||"").trim();
      if(!k) continue;
      const name = parts.slice(1).join(",").trim();
      if(name) map[k] = name;
    }
    return map;
  }

  function plink(pid, name){
    return `<a class="playerLink" href="baseball-player.html?id=${encodeURIComponent(pid)}">${name}</a>`;
  }

  function ipFromOuts(outs){
    outs = outs||0;
    return Math.floor(outs/3) + "." + (outs%3);
  }

  // Event helpers
  const isHit = (ev)=> /^S|^D|^T|^HR/.test(ev);
  const isHR  = (ev)=> /^HR/.test(ev);
  const isBB  = (ev)=> /^W/.test(ev);
  const isSO  = (ev)=> /^K/.test(ev);

  function outsFromEvent(ev){
    if(isHit(ev) || isBB(ev)) return 0;
    return 1; // conservative, consistent
  }

  async function main(){
    const gameUrlCandidates = candidates(`data/baseball/boxscores/${year}/${id}.json`);
    const playersUrlCandidates = candidates(`data/baseball/players.json`);
    const teamsUrlCandidates = candidates(`data/baseball/teams.json`);
    const parksUrlCandidates = candidates(`data/baseball/ballparks.csv`);

    let game, playersRaw, teamsRaw, parksRaw;
    try{
      [game, playersRaw, teamsRaw] = await Promise.all([
        fetchFirstOk(gameUrlCandidates, false),
        fetchFirstOk(playersUrlCandidates, false),
        fetchFirstOk(teamsUrlCandidates, false)
      ]);
    }catch(e){
      err("FAILED TO LOAD REQUIRED FILES. Last attempt: " + e.message);
      document.getElementById("debugLine").textContent = "Tried: " + gameUrlCandidates[0];
      return;
    }

    // ballparks is optional (venue fallback exists)
    try{
      parksRaw = await fetchFirstOk(parksUrlCandidates, true);
    }catch(e){
      parksRaw = "";
    }

    const PLAYER = buildPlayerMap(playersRaw);
    const TEAM = buildTeamMap(teamsRaw);
    const PARK = parseBallparksCSV(parksRaw||"");

    const awayCode = String(game.away_code || game.away_team || "").trim();
    const homeCode = String(game.home_code || game.home_team || "").trim();
    const awayName = TEAM[awayCode] || awayCode || "Away";
    const homeName = TEAM[homeCode] || homeCode || "Home";

    document.getElementById("title").textContent = `${awayName} @ ${homeName}`;
    document.getElementById("date").textContent = game.date ? String(game.date) : "";
    document.getElementById("awayName").textContent = awayName;
    document.getElementById("homeName").textContent = homeName;
    document.getElementById("awayPitchTitle").textContent = awayName + " Pitching";
    document.getElementById("homePitchTitle").textContent = homeName + " Pitching";

    // Venue:
    // 1) info site if present
    // 2) park code from game_id prefix (first 3 chars) if present
    let venueText = "Venue: —";
    let siteCode = "";
    const events = Array.isArray(game.events) ? game.events : [];
    for(const e of events){
      if(e && e[0]==="info" && e[1]==="site"){ siteCode = String(e[2]||"").trim(); break; }
    }
    if(siteCode){
      venueText = "Venue: " + (PARK[siteCode] || siteCode);
    } else if(game.game_id){
      const parkCode = String(game.game_id).slice(0,3);
      venueText = "Venue: " + (PARK[parkCode] || parkCode);
    }
    document.getElementById("venuePill").textContent = venueText;

    // Batting + Pitching
    const awayBat = {};
    const homeBat = {};
    const awayPitch = {};
    const homePitch = {};

    // Pitcher tracking only if start/sub exists in this file.
    let awayPitcher = null; // away team pitcher (pitches to home batters)
    let homePitcher = null; // home team pitcher (pitches to away batters)
    let hasPitcherEvents = false;

    for(const e of events){
      if(!e) continue;
      if((e[0]==="start" || e[0]==="sub") && String(e[5]||"") === "1"){
        hasPitcherEvents = true;
        const pid = String(e[1]||"").trim();
        const teamFlag = String(e[3]||"").trim(); // "0" away, "1" home
        if(teamFlag==="0") awayPitcher = pid;
        if(teamFlag==="1") homePitcher = pid;
      }
    }

    // Show whether pitchers are possible
    if(!hasPitcherEvents){
      document.getElementById("pitchPill").textContent = "Pitchers: not in this file format";
      document.getElementById("pitchNote").textContent = "Pitching cannot be computed because these game files do not include Retrosheet start/sub pitcher records. Batting is still fully correct.";
    } else {
      document.getElementById("pitchPill").textContent = "Pitchers: OK";
      document.getElementById("pitchNote").textContent = "Pitchers extracted from start/sub events (position 1) and accumulated from play events.";
    }

    const ensureBat = (obj, pid) => (obj[pid] ||= {pa:0,h:0,bb:0,so:0,hr:0});
    const ensurePit = (obj, pid) => (obj[pid] ||= {outs:0,h:0,bb:0,so:0,hr:0});

    for(const e of events){
      if(!e || e[0] !== "play") continue;

      const teamAtBat = String(e[2]||"").trim(); // "0" away batting, "1" home batting
      const batter = String(e[3]||"").trim();
      const ev = String(e[6]||"").trim();

      // batting
      if(teamAtBat==="0"){
        const s = ensureBat(awayBat, batter);
        s.pa++;
        if(isHit(ev)) s.h++;
        if(isBB(ev)) s.bb++;
        if(isSO(ev)) s.so++;
        if(isHR(ev)) s.hr++;
      } else {
        const s = ensureBat(homeBat, batter);
        s.pa++;
        if(isHit(ev)) s.h++;
        if(isBB(ev)) s.bb++;
        if(isSO(ev)) s.so++;
        if(isHR(ev)) s.hr++;
      }

      // pitching only if we have pitcher ids
      if(hasPitcherEvents){
        if(teamAtBat==="0" && homePitcher){
          const p = ensurePit(homePitch, homePitcher);
          p.outs += outsFromEvent(ev);
          if(isHit(ev)) p.h++;
          if(isBB(ev)) p.bb++;
          if(isSO(ev)) p.so++;
          if(isHR(ev)) p.hr++;
        }
        if(teamAtBat==="1" && awayPitcher){
          const p = ensurePit(awayPitch, awayPitcher);
          p.outs += outsFromEvent(ev);
          if(isHit(ev)) p.h++;
          if(isBB(ev)) p.bb++;
          if(isSO(ev)) p.so++;
          if(isHR(ev)) p.hr++;
        }
      }
    }

    function renderBat(tbodyId, data){
      const tbody = document.getElementById(tbodyId);
      tbody.innerHTML = "";
      const rows = Object.entries(data).sort((a,b)=> (b[1].pa-a[1].pa) || (b[1].h-a[1].h));
      for(const [pid,s] of rows){
        const name = PLAYER[pid] || pid;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${plink(pid, name)}</td>
          <td>${s.pa}</td>
          <td>${s.h}</td>
          <td>${s.bb}</td>
          <td>${s.so}</td>
          <td>${s.hr}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function renderPitch(tbodyId, data){
      const tbody = document.getElementById(tbodyId);
      tbody.innerHTML = "";
      const rows = Object.entries(data).sort((a,b)=> (b[1].outs-a[1].outs) || (b[1].so-a[1].so));
      for(const [pid,s] of rows){
        const name = PLAYER[pid] || pid;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${plink(pid, name)}</td>
          <td>${ipFromOuts(s.outs)}</td>
          <td>${s.h}</td>
          <td>${s.bb}</td>
          <td>${s.so}</td>
          <td>${s.hr}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    renderBat("awayBat", awayBat);
    renderBat("homeBat", homeBat);

    if(hasPitcherEvents){
      renderPitch("awayPitch", awayPitch);
      renderPitch("homePitch", homePitch);
    } else {
      document.getElementById("awayPitch").innerHTML = `<tr><td colspan="6" class="muted">Pitcher records not available in this file format.</td></tr>`;
      document.getElementById("homePitch").innerHTML = `<tr><td colspan="6" class="muted">Pitcher records not available in this file format.</td></tr>`;
    }

    // Put the exact resolved URLs on the page so you can see what is being loaded.
    document.getElementById("debugLine").textContent =
      `Loaded: ${gameUrlCandidates[0]} | players.json | teams.json` + (parksRaw ? " | ballparks.csv" : " | (ballparks.csv not found)");
  }

  main().catch(e=>{
    err("UNHANDLED ERROR: " + (e && e.message ? e.message : String(e)));
  });
})();
</script>

</body>
</html>
