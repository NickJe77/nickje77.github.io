<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}
.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:14px;
  text-align:center;
}
.score{
  font-size:56px;
  font-weight:700;
}
.error{
  background:#ffdede;
  padding:15px;
  border-radius:10px;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="page">
<div id="content">Loading game...</div>
</div>

<script>

function getGameId(){

  const params=new URLSearchParams(window.location.search);
  return params.get("id");

}

async function loadGame(){

  try{

    const id=getGameId();

    if(!id)
      throw "Missing game id parameter";

    const year=id.substring(0,4);

    const path=`data/baseball/boxscores/${year}/${id}.json`;

    const res=await fetch(path);

    if(!res.ok)
      throw "Game file not found: "+path;

    const game=await res.json();

    render(game);

  }
  catch(err){

    document.getElementById("content").innerHTML=
      `<div class="error">${err}</div>`;

  }

}

function render(game){

  document.getElementById("content").innerHTML=`
  <div class="hero">
    <h1>${game.away_team} @ ${game.home_team}</h1>
    <div class="score">${game.away_score ?? ""} - ${game.home_score ?? ""}</div>
    <div>${game.date ?? ""}</div>
  </div>
  `;

}

loadGame();

</script>

</body>
</html>
