<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:28px;border-radius:20px;margin-bottom:14px;}
.hero h1{margin:0;font-size:42px;}
#date{opacity:.95;margin-top:6px;font-weight:600;}
.infoRow{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.infoBox{background:#fff;padding:10px 14px;border-radius:12px;font-weight:700;}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:14px;}
.card h2{margin:4px 4px 10px 4px;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:900px){.split{grid-template-columns:1fr;}}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:#fff;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
.error{background:#ffd6d6;color:#8a0000;padding:12px;border-radius:10px;margin-bottom:12px;font-weight:800;}
.small{font-size:12px;opacity:.75;margin-top:6px;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-player.html">Players</a>
</div>

<div class="page">

  <div id="error" class="error" style="display:none;"></div>

  <div class="hero">
    <h1 id="title">Loading...</h1>
    <div id="date"></div>
    <div id="subtitle" class="small"></div>
  </div>

  <div class="infoRow">
    <div class="infoBox" id="venue">Venue: Unknown</div>
    <div class="infoBox" id="attendance">Attendance: —</div>
  </div>

  <div class="card">
    <h2>Batting</h2>
    <div class="split">
      <div>
        <h3 style="margin:6px 4px 10px 4px;">Away</h3>
        <table>
          <thead>
            <tr><th>Player</th><th>PA</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
          </thead>
          <tbody id="awayBat"></tbody>
        </table>
      </div>
      <div>
        <h3 style="margin:6px 4px 10px 4px;">Home</h3>
        <table>
          <thead>
            <tr><th>Player</th><th>PA</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
          </thead>
          <tbody id="homeBat"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Pitching</h2>
    <div class="split">
      <div>
        <h3 style="margin:6px 4px 10px 4px;">Away Pitching</h3>
        <table>
          <thead>
            <tr><th>Pitcher</th><th>IP (outs)</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
          </thead>
          <tbody id="awayPitch"></tbody>
        </table>
      </div>
      <div>
        <h3 style="margin:6px 4px 10px 4px;">Home Pitching</h3>
        <table>
          <thead>
            <tr><th>Pitcher</th><th>IP (outs)</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
          </thead>
          <tbody id="homePitch"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
const qs = new URLSearchParams(location.search);
const id = qs.get("id");

function showError(msg){
  const el=document.getElementById("error");
  el.style.display="block";
  el.textContent=msg;
}

if(!id){
  showError("Missing game id (expected ?id=YYYY-MM-DD_AWAY_HOME)");
  throw new Error("Missing id");
}

const year = id.substring(0,4);
const gamePath = `data/baseball/boxscores/${year}/${id}.json`;

let PLAYER_MAP = {}; // id -> name
let TEAM_MAP = {};   // code -> full_name
let PARK_MAP = {};   // park_id -> park_name

async function fetchJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error(`Failed to load ${url} (${r.status})`);
  return await r.json();
}

function clean(s){
  return String(s||"").trim().replace(/^"(.*)"$/,"$1");
}

/* --------- BUILD PLAYER MAP FROM ANY SHAPE --------- */
function buildPlayerMap(data){
  const map = {};

  function add(id, name){
    id = clean(id);
    name = clean(name);
    if(!id) return;
    if(!name) return;
    // don't overwrite a better name with junk
    if(!map[id] || map[id]===id) map[id]=name;
  }

  function nameFromObj(o){
    if(!o || typeof o!=="object") return "";
    // common keys
    if(o.name) return o.name;
    if(o.full_name) return o.full_name;
    if(o.fullName) return o.fullName;
    if(o.player_name) return o.player_name;
    if(o.display_name) return o.display_name;
    if(o.displayName) return o.displayName;

    // Lahman style
    const first = o.nameFirst || o.first || o.first_name || o.firstname || o.givenName;
    const last  = o.nameLast  || o.last  || o.last_name  || o.lastname  || o.surname;
    const combined = [first,last].filter(Boolean).join(" ").trim();
    if(combined) return combined;

    // fallback: sometimes it's "Last, First"
    if(o.lastFirst) return o.lastFirst;

    return "";
  }

  // case 1: plain map { "id":"Name", ... }
  if(data && typeof data==="object" && !Array.isArray(data)){
    if(Array.isArray(data.players)) data = data.players;

    if(!Array.isArray(data)){
      // maybe {id:{...}}
      for(const [k,v] of Object.entries(data)){
        if(typeof v==="string") add(k,v);
        else if(v && typeof v==="object"){
          const n = nameFromObj(v);
          add(k, n || v.id || v.player_id || v.playerID || v.key);
        }
      }
      return map;
    }
  }

  // case 2: array of objects
  if(Array.isArray(data)){
    for(const o of data){
      if(!o) continue;
      if(typeof o==="string") continue;

      const pid = o.id || o.player_id || o.playerID || o.playerId || o.key || o.mlbid || o.retro_id || o.retroID;
      const n = nameFromObj(o);

      if(pid && n) add(pid, n);

      // sometimes array entry is ["id","Name"]
      if(Array.isArray(o) && o.length>=2){
        add(o[0], o[1]);
      }
    }
  }

  return map;
}

/* --------- BUILD TEAM MAP FROM ANY SHAPE --------- */
function buildTeamMap(data){
  const map = {};

  function add(code, name){
    code = clean(code);
    name = clean(name);
    if(!code) return;
    if(!name) return;
    if(!map[code] || map[code]===code) map[code]=name;
  }

  if(data && typeof data==="object" && !Array.isArray(data)){
    if(Array.isArray(data.teams)) data = data.teams;

    if(!Array.isArray(data)){
      // plain map
      for(const [k,v] of Object.entries(data)){
        if(typeof v==="string") add(k,v);
        else if(v && typeof v==="object"){
          add(k, v.name || v.team || v.full_name || v.fullName || v.nickname || v.display_name || v.displayName);
        }
      }
      return map;
    }
  }

  if(Array.isArray(data)){
    for(const o of data){
      if(!o) continue;
      const code = o.code || o.team_code || o.teamCode || o.abbr || o.abbrev || o.id || o.team_id;
      const name = o.name || o.full_name || o.fullName || o.team_name || o.teamName || o.nickname || o.display_name || o.displayName;
      if(code && name) add(code,name);
      if(Array.isArray(o) && o.length>=2) add(o[0],o[1]);
    }
  }

  return map;
}

function pname(pid){
  pid = clean(pid);
  return PLAYER_MAP[pid] || pid;
}

function tname(code){
  code = clean(code);
  return TEAM_MAP[code] || code;
}

/* --------- CSV BALLPARKS --------- */
function parseBallparksCSV(text){
  const map = {};
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  for(const line of lines){
    const parts = line.split(",");
    const key = clean(parts[0]);
    if(!key) continue;
    // name might be 2nd column, but some csvs have more - join rest
    const name = clean(parts.slice(1).join(","));
    if(name) map[key]=name;
  }
  return map;
}

/* --------- STAT HELPERS --------- */
function ensure(map, id, init){
  if(!map[id]) map[id]=init();
  return map[id];
}

function isHit(ev){ return /^S|^D|^T|^HR/.test(ev); }
function isHR(ev){ return /^HR/.test(ev); }
function isBB(ev){ return /^W/.test(ev); }
function isSO(ev){ return /^K/.test(ev); }

function outsFromEvent(ev){
  // conservative but consistent: count an out for non-hit, non-walk events
  if(isSO(ev)) return 1;
  if(isHit(ev) || isBB(ev)) return 0;
  return 1;
}

/* --------- RENDER --------- */
function renderBat(tbodyId, map){
  const tbody=document.getElementById(tbodyId);
  tbody.innerHTML="";
  const rows = Object.entries(map)
    .sort((a,b)=> (b[1].pa - a[1].pa) || (b[1].h - a[1].h));
  for(const [pid,s] of rows){
    const tr=document.createElement("tr");
    tr.innerHTML = `
      <td>${pname(pid)}</td>
      <td>${s.pa}</td>
      <td>${s.h}</td>
      <td>${s.bb}</td>
      <td>${s.so}</td>
      <td>${s.hr}</td>
    `;
    tbody.appendChild(tr);
  }
}

function renderPitch(tbodyId, map){
  const tbody=document.getElementById(tbodyId);
  tbody.innerHTML="";
  const rows = Object.entries(map)
    .sort((a,b)=> (b[1].outs - a[1].outs) || (b[1].so - a[1].so));
  for(const [pid,s] of rows){
    const tr=document.createElement("tr");
    tr.innerHTML = `
      <td>${pname(pid)}</td>
      <td>${s.outs}</td>
      <td>${s.h}</td>
      <td>${s.bb}</td>
      <td>${s.so}</td>
      <td>${s.hr}</td>
    `;
    tbody.appendChild(tr);
  }
}

/* --------- MAIN --------- */
async function loadAll(){
  // load reference data
  const [playersData, teamsData, parksCSV] = await Promise.all([
    fetchJSON("data/baseball/players.json"),
    fetchJSON("data/baseball/teams.json"),
    fetch("data/baseball/ballparks.csv", {cache:"no-store"}).then(r=>r.ok?r.text():"")
  ]);

  PLAYER_MAP = buildPlayerMap(playersData);
  TEAM_MAP = buildTeamMap(teamsData);
  PARK_MAP = parseBallparksCSV(parksCSV);

  // load game
  const game = await fetchJSON(gamePath);

  // header
  const awayLabel = tname(game.away_code || game.away_team);
  const homeLabel = tname(game.home_code || game.home_team);

  document.getElementById("title").textContent = `${awayLabel} @ ${homeLabel}`;
  document.getElementById("date").textContent = clean(game.date || "");

  // optional debug subtitle (won't break anything)
  document.getElementById("subtitle").textContent =
    (Object.keys(PLAYER_MAP).length ? "" : "⚠ players.json loaded but mapping is empty") +
    (Object.keys(TEAM_MAP).length ? "" : (Object.keys(PLAYER_MAP).length ? " • " : "") + "⚠ teams.json mapping is empty");

  // stats
  const awayBat = {};
  const homeBat = {};
  const awayPitch = {};
  const homePitch = {};

  // current pitcher tracking (retrosheet event format)
  let curAwayPitcher = null; // pitcher for AWAY team (pitches to HOME batters)
  let curHomePitcher = null; // pitcher for HOME team (pitches to AWAY batters)

  const events = game.events || [];

  for(const e of events){

    // info lines
    if(e[0] === "info"){
      if(e[1] === "site"){
        const parkId = clean(e[2]);
        document.getElementById("venue").textContent = "Venue: " + (PARK_MAP[parkId] || parkId || "Unknown");
      }
      if(e[1] === "attendance"){
        document.getElementById("attendance").textContent = "Attendance: " + clean(e[2] || "—");
      }
      continue;
    }

    // start/sub: identify pitchers
    // retrosheet: [type, playerid, name?, team, battingOrder, fieldPos]
    // pitcher fieldPos = "1"
    if(e[0] === "start" || e[0] === "sub"){
      const playerId = clean(e[1]);
      const teamFlag = clean(e[3]);     // "0" away, "1" home (retrosheet)
      const fieldPos = clean(e[5]);     // "1" pitcher
      if(fieldPos === "1"){
        if(teamFlag === "0") curAwayPitcher = playerId;
        if(teamFlag === "1") curHomePitcher = playerId;
      }
      continue;
    }

    // play: [play, inning, team, batter, count, pitches, event]
    if(e[0] === "play"){
      const teamAtBat = clean(e[2]); // "0" away batting, "1" home batting
      const batter = clean(e[3]);
      const ev = clean(e[6]);

      if(teamAtBat === "0"){
        // AWAY batting
        const bs = ensure(awayBat, batter, ()=>({pa:0,h:0,bb:0,so:0,hr:0}));
        bs.pa++;
        if(isHit(ev)) bs.h++;
        if(isBB(ev)) bs.bb++;
        if(isSO(ev)) bs.so++;
        if(isHR(ev)) bs.hr++;

        // pitcher is HOME pitcher
        if(curHomePitcher){
          const ps = ensure(homePitch, curHomePitcher, ()=>({outs:0,h:0,bb:0,so:0,hr:0}));
          ps.outs += outsFromEvent(ev);
          if(isHit(ev)) ps.h++;
          if(isBB(ev)) ps.bb++;
          if(isSO(ev)) ps.so++;
          if(isHR(ev)) ps.hr++;
        }
      } else {
        // HOME batting
        const bs = ensure(homeBat, batter, ()=>({pa:0,h:0,bb:0,so:0,hr:0}));
        bs.pa++;
        if(isHit(ev)) bs.h++;
        if(isBB(ev)) bs.bb++;
        if(isSO(ev)) bs.so++;
        if(isHR(ev)) bs.hr++;

        // pitcher is AWAY pitcher
        if(curAwayPitcher){
          const ps = ensure(awayPitch, curAwayPitcher, ()=>({outs:0,h:0,bb:0,so:0,hr:0}));
          ps.outs += outsFromEvent(ev);
          if(isHit(ev)) ps.h++;
          if(isBB(ev)) ps.bb++;
          if(isSO(ev)) ps.so++;
          if(isHR(ev)) ps.hr++;
        }
      }
    }
  }

  renderBat("awayBat", awayBat);
  renderBat("homeBat", homeBat);
  renderPitch("awayPitch", awayPitch);
  renderPitch("homePitch", homePitch);
}

loadAll().catch(err=>{
  showError(err.message || String(err));
});
</script>

</body>
</html>
