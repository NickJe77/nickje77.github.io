<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Baseball Game</title>

<style>
body{font-family:Arial;margin:20px;background:#eef2f7}
.hero{
background:linear-gradient(90deg,#0b2a6f,#c8102e);
color:white;padding:30px;border-radius:16px;text-align:center;
}
.score{font-size:48px;font-weight:bold}
.debug{font-size:12px;color:#666;margin-top:10px}
.card{
background:white;margin-top:20px;padding:15px;border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1)
}
table{width:100%;border-collapse:collapse}
th{background:#123a7a;color:white;padding:8px;text-align:left}
td{padding:8px}
tr:nth-child(even){background:#eef3fb}
</style>

</head>
<body>

<div id="content">Loading game...</div>

<script>

const content=document.getElementById("content");

function getFile(){

const p=new URLSearchParams(location.search);

return p.get("file")||p.get("id")||p.get("game");

}

async function load(){

const file=getFile();

if(!file){

content.innerHTML="Invalid game link";

return;

}

const year=file.substring(0,4);

const path="data/baseball/boxscores/"+year+"/"+file+".json";

const res=await fetch(path);

const game=await res.json();

render(game,path);

}

function teamAway(g){

return g.away_name
|| g.away_team
|| g.away
|| g.teams?.away?.name
|| "";

}

function teamHome(g){

return g.home_name
|| g.home_team
|| g.home
|| g.teams?.home?.name
|| "";

}

function scoreAway(g){

return g.linescore?.away
|| g.score?.away
|| g.away_score
|| "";

}

function scoreHome(g){

return g.linescore?.home
|| g.score?.home
|| g.home_score
|| "";

}

function render(g,path){

let html="";

html+=`
<div class="hero">
<h1>${teamAway(g)} @ ${teamHome(g)}</h1>
<div class="score">${scoreAway(g)} - ${scoreHome(g)}</div>
<div>${g.date}</div>
</div>
`;

html+=`<div class="debug">Loaded: ${path}</div>`;

html+=table(g.awayBatTitle,g.awayBatting);
html+=table(g.homeBatTitle,g.homeBatting);
html+=table(g.awayPitchTitle,g.awayPitching);
html+=table(g.homePitchTitle,g.homePitching);

content.innerHTML=html;

}

function table(title,data){

if(!data)return "";

let cols=Object.keys(data[0]);

let html=`<div class="card"><h3>${title}</h3><table><tr>`;

cols.forEach(c=>html+="<th>"+c+"</th>");

html+="</tr>";

data.forEach(r=>{

html+="<tr>";

cols.forEach(c=>html+="<td>"+(r[c]??"")+"</td>");

html+="</tr>";

});

html+="</table></div>";

return html;

}

load();

</script>

</body>
</html>
