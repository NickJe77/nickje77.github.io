<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.page{
  max-width:1000px;
  margin:auto;
  padding:30px;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:24px;
  border:1px solid #e6e8ee;
}
h1{
  margin-top:0;
}
.error{
  background:#fff3f3;
  border:1px solid #ffb3b3;
  padding:16px;
  border-radius:10px;
  color:#a10000;
  font-weight:700;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="mlb.html">MLB</a>
</div>

<div class="page">
  <div id="content"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const season = params.get("season");
const game = params.get("game");

if(!season || !game){
  document.getElementById("content").innerHTML =
    `<div class="error">Missing season or game parameter</div>`;
  throw new Error("Missing params");
}

fetch(`/data/baseball/games/${season}/${game}.json`)
.then(r=>{
  if(!r.ok) throw new Error("Game file not found");
  return r.json();
})
.then(data=>{

  const html = `
    <div class="card">
      <h1>${data.away_code} @ ${data.home_code}</h1>
      <p><strong>Date:</strong> ${data.date}</p>
      <p><strong>Score:</strong> ${data.away_score} - ${data.home_score}</p>
      <p><strong>Venue:</strong> ${data.venue || ""}</p>
      <p><strong>Attendance:</strong> ${data.attendance ? Number(data.attendance).toLocaleString() : ""}</p>
    </div>
  `;

  document.getElementById("content").innerHTML = html;

})
.catch(()=>{
  document.getElementById("content").innerHTML =
    `<div class="error">Game not found</div>`;
});
</script>

</body>
</html>
