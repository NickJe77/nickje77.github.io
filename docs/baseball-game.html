<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.hero h1{margin:0;font-size:36px;}
.hero .sub{margin-top:10px;font-size:18px;opacity:.95;line-height:1.4;}
.section{background:white;padding:18px;border-radius:16px;margin-bottom:20px;}
.section h2{margin:0 0 12px 0;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:white;padding:10px;text-align:left;cursor:help;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
a{color:#0056d6;text-decoration:none;font-weight:700;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}
</style>

</head>
<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="subtitle" class="sub"></div>
</div>

<div class="grid">

<div class="section">
<h2>Away Batting</h2>
<div id="awayBatting"></div>
</div>

<div class="section">
<h2>Home Batting</h2>
<div id="homeBatting"></div>
</div>

<div class="section">
<h2>Away Pitching</h2>
<div id="awayPitching"></div>
</div>

<div class="section">
<h2>Home Pitching</h2>
<div id="homePitching"></div>
</div>

</div>
</div>

<script>

const TOOLTIPS={
AB:"At Bats",
R:"Runs",
H:"Hits",
RBI:"Runs Batted In",
BB:"Walks",
SO:"Strikeouts",
IP:"Innings Pitched",
ER:"Earned Runs",
ERA:"Earned Run Average"
}

let PLAYERS={}
let TEAMS={}
let PARKS={}

function param(name){
return new URLSearchParams(location.search).get(name)
}

function seasonFromGameId(id){
return id.substring(3,7)
}

function gameDateFromId(id){
return `${id.substring(3,7)}-${id.substring(7,9)}-${id.substring(9,11)}`
}

function playerName(id){
return PLAYERS[id]||id
}

function teamName(code){
return TEAMS[code]||code
}

function parkName(code){
return PARKS[code]||code
}

async function loadPlayers(){
const res=await fetch("./data/baseball/players.json")
const data=await res.json()
data.forEach(p=>PLAYERS[p.player_id]=p.name)
}

async function loadTeams(){
const res=await fetch("./data/baseball/teams.json")
const data=await res.json()
data.forEach(t=>TEAMS[t.code]=t.name)
}

async function loadParks(){
const res=await fetch("./data/baseball/ballparks.csv")
const text=await res.text()
text.split("\n").slice(1).forEach(row=>{
const cols=row.split(",")
if(cols.length>1) PARKS[cols[0]]=cols[1]
})
}

async function loadGame(){

const id=param("game")
const season=seasonFromGameId(id)

const game=
await fetch(`./data/baseball/games/${season}/${id}.json`)
.then(r=>r.json())

const seasonGames=
await fetch(`./data/baseball/seasons/${season}.json`)
.then(r=>r.json())

const meta=seasonGames.find(g=>
g.date===gameDateFromId(id) &&
g.home_code===game.home_code &&
g.away_code===game.away_code
)

render(game,meta)
}

function render(game,meta){

const away=teamName(game.away_code)
const home=teamName(game.home_code)

document.getElementById("title").textContent=
`${away} @ ${home}`

if(meta){

document.getElementById("subtitle").innerHTML=
`${away} ${meta.away_score} — ${home} ${meta.home_score}<br>
${meta.date}<br>
${parkName(meta.venue)}`

}

renderTable("awayBatting",game.batters_away)
renderTable("homeBatting",game.batters_home)
renderTable("awayPitching",game.pitchers_away)
renderTable("homePitching",game.pitchers_home)
}

function renderTable(id,data){

if(!data)return

const cols=Object.keys(data[0]).filter(k=>k!="player_id")

const table=document.createElement("table")

table.innerHTML=
`<thead>
<tr>
<th>Player</th>
${cols.map(c=>`<th title="${TOOLTIPS[c]||c}">${c}</th>`).join("")}
</tr>
</thead>
<tbody>
${data.map(p=>`
<tr>
<td>
<a href="./player.html?player=${p.player_id}">
${playerName(p.player_id)}
</a>
</td>
${cols.map(c=>`<td>${p[c]||""}</td>`).join("")}
</tr>
`).join("")}
</tbody>`

document.getElementById(id).appendChild(table)
}

async function init(){
await loadPlayers()
await loadTeams()
await loadParks()
await loadGame()
}

init()

</script>

</body>
</html>
