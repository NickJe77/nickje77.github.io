<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002d72,#d50032);
color:#fff;
padding:30px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
}

.hero h1{
margin:0;
font-size:36px;
}

.hero .score{
font-size:48px;
font-weight:700;
margin:10px 0;
}

.hero .date{
opacity:0.9;
}

.card{
background:#fff;
padding:16px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.card h2{
margin-top:0;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0a2f6b;
color:#fff;
padding:10px;
text-align:center;
}

td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

td:first-child{
text-align:left;
}

tr:nth-child(even){
background:#e7f0ff;
}

.player-link{
color:#0056d6;
font-weight:600;
text-decoration:none;
}

.player-link:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-players.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="matchup">Loading...</h1>
<div class="score" id="score"></div>
<div class="date" id="date"></div>
</div>

<div class="card">
<h2>Game Info</h2>
<div id="venue">Venue: —</div>
<div id="attendance">Attendance: —</div>
</div>

<div class="card">
<h2>Linescore</h2>
<table id="linescore"></table>
</div>

<div class="card">
<h2 id="awayBatTitle"></h2>
<table id="awayBat"></table>
</div>

<div class="card">
<h2 id="homeBatTitle"></h2>
<table id="homeBat"></table>
</div>

<div class="card">
<h2 id="awayPitchTitle"></h2>
<table id="awayPitch"></table>
</div>

<div class="card">
<h2 id="homePitchTitle"></h2>
<table id="homePitch"></table>
</div>

</div>

<script>

const TEAM_NAMES={
NYA:"New York Yankees",
BOS:"Boston Red Sox"
};

let PLAYER_MAP={};

async function loadPlayers(){

const res=await fetch("data/baseball/players.json");
const data=await res.json();

data.forEach(p=>{
PLAYER_MAP[p.player_id]=p.name;
});

}

function playerName(id){

return PLAYER_MAP[id] || id;

}

function playerLink(id){

return `<a class="player-link" href="baseball-player.html?id=${id}">
${playerName(id)}
</a>`;

}

function extractVenue(events){

for(const e of events){

if(e[0]==="info" && e[1]==="site")
return e[2];

}

return "Unknown";

}

function processGame(events){

const awayBat={},homeBat={};
const awayPitch={},homePitch={};
const linescore={};

let awayTotal=0,homeTotal=0;

let awayPitcher=null;
let homePitcher=null;

events.forEach(e=>{

if(e[0]==="start"){

const player=e[1];
const team=e[2];
const pos=e[4];

if(pos==="1"){

if(team==="0"){
awayPitcher=player;
awayPitch[player]={outs:0,H:0,R:0,BB:0,SO:0,HR:0};
}
else{
homePitcher=player;
homePitch[player]={outs:0,H:0,R:0,BB:0,SO:0,HR:0};
}

}

}

});

events.forEach(e=>{

if(e[0]!=="play") return;

const inning=parseInt(e[1]);
const team=e[2];
const batter=e[3];
const desc=e[6]||"";

const batTeam=team==="0"?awayBat:homeBat;
const pitTeam=team==="0"?homePitch:awayPitch;
const pitcher=team==="0"?homePitcher:awayPitcher;

if(!batTeam[batter])
batTeam[batter]={AB:0,H:0,RBI:0,BB:0,SO:0,HR:0};

batTeam[batter].AB++;

if(desc.includes("HR")){
batTeam[batter].H++;
batTeam[batter].HR++;
if(pitcher) pitTeam[pitcher].HR++;
}

else if(desc.startsWith("S")||desc.startsWith("D")||desc.startsWith("T")){
batTeam[batter].H++;
if(pitcher) pitTeam[pitcher].H++;
}

if(desc.startsWith("K")){
batTeam[batter].SO++;
if(pitcher) pitTeam[pitcher].SO++;
}

if(desc.startsWith("W")){
batTeam[batter].BB++;
if(pitcher) pitTeam[pitcher].BB++;
}

const rbi=(desc.match(/\.[123]-H/g)||[]).length+(desc.includes("HR")?1:0);

batTeam[batter].RBI+=rbi;

if(!linescore[inning])
linescore[inning]={away:0,home:0};

if(team==="0"){
linescore[inning].away+=rbi;
awayTotal+=rbi;
}
else{
linescore[inning].home+=rbi;
homeTotal+=rbi;
pitTeam[pitcher].R+=rbi;
}

pitTeam[pitcher].outs++;

});

return{
awayBat,homeBat,
awayPitch,homePitch,
linescore,
awayTotal,homeTotal
};

}

function renderLinescore(linescore,away,home,awayTotal,homeTotal){

let html="<tr><th></th>";

for(let i=1;i<=9;i++)
html+=`<th>${i}</th>`;

html+="<th>R</th></tr>";

html+=`<tr><td>${away}</td>`;

for(let i=1;i<=9;i++)
html+=`<td>${linescore[i]?.away||0}</td>`;

html+=`<td>${awayTotal}</td></tr>`;

html+=`<tr><td>${home}</td>`;

for(let i=1;i<=9;i++)
html+=`<td>${linescore[i]?.home||0}</td>`;

html+=`<td>${homeTotal}</td></tr>`;

document.getElementById("linescore").innerHTML=html;

}

function renderBat(id,data){

let html="<tr><th>Player</th><th>AB</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>HR</th></tr>";

for(const p in data){

html+=`
<tr>
<td>${playerLink(p)}</td>
<td>${data[p].AB}</td>
<td>${data[p].H}</td>
<td>${data[p].RBI}</td>
<td>${data[p].BB}</td>
<td>${data[p].SO}</td>
<td>${data[p].HR}</td>
</tr>
`;

}

document.getElementById(id).innerHTML=html;

}

function renderPitch(id,data){

let html="<tr><th>Pitcher</th><th>IP</th><th>H</th><th>R</th><th>BB</th><th>SO</th><th>HR</th></tr>";

for(const p in data){

const ip=(data[p].outs/3).toFixed(1);

html+=`
<tr>
<td>${playerLink(p)}</td>
<td>${ip}</td>
<td>${data[p].H}</td>
<td>${data[p].R}</td>
<td>${data[p].BB}</td>
<td>${data[p].SO}</td>
<td>${data[p].HR}</td>
</tr>
`;

}

document.getElementById(id).innerHTML=html;

}

async function loadGame(){

await loadPlayers();

const params=new URLSearchParams(location.search);
const id=params.get("id");

const year=id.substring(0,4);

const res=await fetch(`data/baseball/boxscores/${year}/${id}.json`);
const game=await res.json();

const away=TEAM_NAMES[game.away_code];
const home=TEAM_NAMES[game.home_code];

document.getElementById("matchup").textContent=`${away} @ ${home}`;
document.getElementById("date").textContent=game.date;

document.getElementById("venue").textContent=
"Venue: "+extractVenue(game.events);

const stats=processGame(game.events);

document.getElementById("score").textContent=
`${stats.awayTotal} - ${stats.homeTotal}`;

document.getElementById("awayBatTitle").textContent=
away+" Batting";

document.getElementById("homeBatTitle").textContent=
home+" Batting";

document.getElementById("awayPitchTitle").textContent=
away+" Pitching";

document.getElementById("homePitchTitle").textContent=
home+" Pitching";

renderLinescore(stats.linescore,away,home,stats.awayTotal,stats.homeTotal);

renderBat("awayBat",stats.awayBat);
renderBat("homeBat",stats.homeBat);

renderPitch("awayPitch",stats.awayPitch);
renderPitch("homePitch",stats.homePitch);

}

loadGame();

</script>

</body>
</html>
