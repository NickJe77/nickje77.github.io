<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
font-size:28px;
font-weight:700;
}

.section{
background:white;
padding:20px;
border-radius:16px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#002D72;
color:white;
}

a{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/baseball.html">Baseball</a>
<a href="/baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div id="hero" class="hero">Loading...</div>

<div class="section">
<h2>Game Details</h2>
<div id="details"></div>
</div>

<div class="section">
<h2>Away Batting</h2>
<table>
<thead>
<tr>
<th>Player</th>
<th>AB</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="awayBatting"></tbody>
</table>
</div>

<div class="section">
<h2>Home Batting</h2>
<table>
<thead>
<tr>
<th>Player</th>
<th>AB</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="homeBatting"></tbody>
</table>
</div>

</div>

<script>

let PLAYERS={}
let TEAMS={}

function getGameId(){

return new URLSearchParams(window.location.search).get("game")

}

function getSeason(gameId){

return gameId.substring(3,7)

}

async function loadPlayers(){

const res=await fetch("/data/baseball/players.json")
const data=await res.json()

data.forEach(p=>{
PLAYERS[p.player_id]=p.name
})

}

async function loadTeams(){

const res=await fetch("/data/baseball/teams.json")
const data=await res.json()

data.forEach(t=>{
TEAMS[t.code]=t.name
})

}

function playerName(id){

return PLAYERS[id] || id

}

function teamName(code){

return TEAMS[code] || code

}

async function loadGame(){

const gameId=getGameId()

if(!gameId){

document.getElementById("hero").textContent="Game not found"
return

}

const season=getSeason(gameId)

const path=`/data/baseball/games/${season}/${gameId}.json`

const res=await fetch(path)

if(!res.ok){

document.getElementById("hero").textContent="Game not found"
return

}

const game=await res.json()

renderGame(game)

}

function renderGame(game){

const away=teamName(game.away_code)
const home=teamName(game.home_code)

document.getElementById("hero").textContent=
`${away} @ ${home}`

document.getElementById("details").innerHTML=
`
Game ID: ${game.game_id}<br>
Season: ${game.season}
`

renderBatting("awayBatting",game.batters_away)
renderBatting("homeBatting",game.batters_home)

}

function renderBatting(elementId,players){

const tbody=document.getElementById(elementId)

tbody.innerHTML=""

if(!players) return

players.forEach(p=>{

const tr=document.createElement("tr")

tr.innerHTML=`
<td>
<a href="/player.html?player=${p.player_id}">
${playerName(p.player_id)}
</a>
</td>
<td>${p.AB || 0}</td>
<td>${p.H || 0}</td>
<td>${p.BB || 0}</td>
<td>${p.SO || 0}</td>
`

tbody.appendChild(tr)

})

}

async function init(){

await loadPlayers()
await loadTeams()
await loadGame()

}

init()

</script>

</body>
</html>
