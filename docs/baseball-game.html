<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Arial;
margin:0;
background:#f4f6f8;
color:#111;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:28px;
border-radius:20px;
margin-bottom:16px;
box-shadow:0 3px 10px rgba(0,0,0,0.15);
}

.hero h1{
margin:0;
font-size:36px;
}

.meta{
margin-top:10px;
font-size:15px;
}

.meta span{
margin-right:16px;
font-weight:600;
}

/* CARD */

.card{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:16px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.card h3{
margin:0 0 12px;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.right{text-align:right;}
.center{text-align:center;}

.loading{
font-size:18px;
color:#666;
}

.error{
font-size:18px;
color:red;
font-weight:700;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">

<h1 id="title" class="loading">Loading game...</h1>

<div class="meta" id="meta"></div>

</div>

<div class="card">

<h3>Linescore</h3>

<table>
<thead id="linescoreHead"></thead>
<tbody id="linescoreBody"></tbody>
</table>

</div>

<div class="card">

<h3>Batting</h3>

<table>

<thead>
<tr>
<th>Player</th>
<th>Team</th>
<th class="right">AB</th>
<th class="right">H</th>
<th class="right">RBI</th>
<th class="right">HR</th>
</tr>
</thead>

<tbody id="battingBody"></tbody>

</table>

</div>

<div class="card">

<h3>Pitching</h3>

<table>

<thead>
<tr>
<th>Pitcher</th>
<th>Team</th>
<th class="right">IP</th>
<th class="right">ER</th>
<th class="right">K</th>
<th class="right">BB</th>
</tr>
</thead>

<tbody id="pitchingBody"></tbody>

</table>

</div>

</div>

<script>

/* GET GAME ID */

const params = new URLSearchParams(location.search);
const id = params.get("id");

if(!id){

document.getElementById("title").className="error";
document.getElementById("title").textContent="Invalid Game ID";
throw new Error("Missing ID");

}

/* BALLPARKS */

let PARKS={};

async function loadBallparks(){

try{

const res=await fetch("data/baseball/ballparks.csv?cache="+Date.now());

const text=await res.text();

const rows=text.split("\n");

const headers=rows[0].split(",");

const parkIndex=headers.indexOf("PARKID");
const nameIndex=headers.indexOf("NAME");
const cityIndex=headers.indexOf("CITY");
const stateIndex=headers.indexOf("STATE");

rows.slice(1).forEach(r=>{

const cols=r.split(",");

if(!cols[parkIndex])return;

PARKS[cols[parkIndex]]={
name:cols[nameIndex],
city:cols[cityIndex],
state:cols[stateIndex]
};

});

}catch{}

}

function parkFull(code){

if(!PARKS[code]) return code || "";

const p=PARKS[code];

return `${p.name} (${p.city}, ${p.state})`;

}

/* SAFE VALUE */

function safe(v){

return v===undefined||v===null?"":v;

}

/* LOAD GAME */

async function loadGame(){

await loadBallparks();

let game;

try{

game=await fetch(
`data/baseball/boxscores/${id}.json?cache=`+Date.now()
).then(r=>r.json());

}catch{

document.getElementById("title").className="error";
document.getElementById("title").textContent="Game not found";
return;

}

/* TITLE */

document.getElementById("title").innerHTML=`

<span class="click"
onclick="location.href='baseball-team.html?team=${game.away_code}'">
${game.away_team}
</span>

${safe(game.away_score)}

–

${safe(game.home_score)}

<span class="click"
onclick="location.href='baseball-team.html?team=${game.home_code}'">
${game.home_team}
</span>

`;

/* META */

document.getElementById("meta").innerHTML=`

<span>${safe(game.date)}</span>

<span>${parkFull(game.venue)}</span>

<span>Attendance: ${game.attendance?game.attendance.toLocaleString():""}</span>

`;

/* LINESCORE */

if(game.linescore && game.linescore.innings){

let head="<tr><th>Team</th>";

game.linescore.innings.forEach((_,i)=>{
head+=`<th class="center">${i+1}</th>`;
});

head+="<th class='center'>R</th></tr>";

linescoreHead.innerHTML=head;

let body="";

body+=`<tr><td>${game.away_team}</td>`;

game.linescore.innings.forEach(i=>{
body+=`<td class="center">${safe(i.away)}</td>`;
});

body+=`<td class="center">${safe(game.away_score)}</td></tr>`;

body+=`<tr><td>${game.home_team}</td>`;

game.linescore.innings.forEach(i=>{
body+=`<td class="center">${safe(i.home)}</td>`;
});

body+=`<td class="center">${safe(game.home_score)}</td></tr>`;

linescoreBody.innerHTML=body;

}

/* BATTING */

const bat=document.getElementById("battingBody");

bat.innerHTML="";

(game.batting||[]).forEach(p=>{

bat.innerHTML+=`

<tr>

<td class="click"
onclick="location.href='baseball-player.html?player=${encodeURIComponent(p.player)}'">
${safe(p.player)}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${safe(p.team)}'">
${safe(p.team)}
</td>

<td class="right">${safe(p.AB)}</td>
<td class="right">${safe(p.H)}</td>
<td class="right">${safe(p.RBI)}</td>
<td class="right">${safe(p.HR)}</td>

</tr>

`;

});

/* PITCHING */

const pit=document.getElementById("pitchingBody");

pit.innerHTML="";

(game.pitching||[]).forEach(p=>{

pit.innerHTML+=`

<tr>

<td class="click"
onclick="location.href='baseball-player.html?player=${encodeURIComponent(p.player)}'">
${safe(p.player)}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${safe(p.team)}'">
${safe(p.team)}
</td>

<td class="right">${safe(p.IP)}</td>
<td class="right">${safe(p.ER)}</td>
<td class="right">${safe(p.K)}</td>
<td class="right">${safe(p.BB)}</td>

</tr>

`;

});

}

loadGame();

</script>

</body>
</html>
