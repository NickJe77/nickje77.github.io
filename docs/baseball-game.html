<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:30px;border-radius:20px;margin-bottom:16px;}
.hero h1{margin:0;font-size:36px;letter-spacing:0.2px;}
.hero .sub{margin-top:10px;opacity:0.95;font-size:16px;line-height:1.35;}
.pillrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.pill{background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.18);padding:7px 10px;border-radius:999px;font-size:14px;}
.section{background:#fff;padding:18px;border-radius:16px;margin-bottom:16px;}
.section h2{margin:0 0 12px 0;font-size:24px;}
.small{font-size:14px;color:#333;opacity:0.9;}
table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:14px;}
th{background:#002D72;color:#fff;padding:10px;text-align:left;font-size:14px;white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid #eee;font-size:14px;}
tr:nth-child(even){background:#f0f6ff;}
tfoot td{background:#f7f7f7;font-weight:800;border-top:2px solid #e6e6e6;}
a{color:#0056d6;text-decoration:none;font-weight:700;}
a:hover{text-decoration:underline;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width: 900px){.grid2{grid-template-columns:1fr;}}
.note{margin-top:8px;font-size:13px;color:#555;}
</style>
</head>

<body>
<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
</div>

<div class="page">
  <div class="hero">
    <h1 id="heroTitle">Loading...</h1>
    <div class="sub" id="heroSub"></div>
    <div class="pillrow" id="heroPills"></div>
  </div>

  <div class="section">
    <h2>Score</h2>
    <div id="scoreLine" style="font-size:18px;font-weight:800;">-</div>
    <div class="note" id="scoreNote"></div>
  </div>

  <div class="section" id="linescoreSection" style="display:none;">
    <h2>Linescore</h2>
    <div id="linescoreWrap"></div>
  </div>

  <div class="grid2">
    <div class="section">
      <h2>Away Batting</h2>
      <div id="awayBattingWrap"></div>
    </div>

    <div class="section">
      <h2>Home Batting</h2>
      <div id="homeBattingWrap"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="section">
      <h2>Away Pitching</h2>
      <div id="awayPitchingWrap"></div>
    </div>

    <div class="section">
      <h2>Home Pitching</h2>
      <div id="homePitchingWrap"></div>
    </div>
  </div>

  <div class="section">
    <h2>Game Details</h2>
    <table>
      <tbody id="detailsBody"></tbody>
    </table>
  </div>
</div>

<script>
/* -------------------- DATA LOOKUPS -------------------- */
let PLAYERS = {};
let TEAMS = {};
let PARKS = {}; // park_id -> {name, city, state}

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function getSeasonFromGameId(gameId){
  // game_id like BOS194604200 -> season is chars 3..6
  return (gameId || "").substring(3,7);
}

function safeText(v){
  return (v === null || v === undefined) ? "" : String(v);
}

function isNum(x){
  return typeof x === "number" && isFinite(x);
}

function toInt(x){
  const n = Number(x);
  return isFinite(n) ? n : 0;
}

function playerName(id){
  return PLAYERS[id] || id || "";
}

function teamName(code){
  return TEAMS[code] || code || "";
}

function parkLabel(parkId){
  if(!parkId) return "";
  const p = PARKS[parkId];
  if(!p) return parkId;
  const bits = [p.name].filter(Boolean);
  const loc = [p.city, p.state].filter(Boolean).join(", ");
  if(loc) bits.push(loc);
  return bits.join(" — ");
}

/* -------------------- CSV PARSER (ballparks.csv) -------------------- */
function parseCSV(text){
  // Minimal, robust CSV parser with quote support
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;

  for(let i=0;i<text.length;i++){
    const c = text[i];
    const next = text[i+1];

    if(inQuotes){
      if(c === '"' && next === '"'){
        field += '"';
        i++;
      }else if(c === '"'){
        inQuotes = false;
      }else{
        field += c;
      }
    }else{
      if(c === '"'){
        inQuotes = true;
      }else if(c === ","){
        row.push(field);
        field = "";
      }else if(c === "\n"){
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      }else if(c === "\r"){
        // ignore
      }else{
        field += c;
      }
    }
  }
  // last field
  if(field.length || row.length){
    row.push(field);
    rows.push(row);
  }
  return rows;
}

async function loadPlayers(){
  const res = await fetch("/data/baseball/players.json", {cache:"no-store"});
  if(!res.ok) return;
  const arr = await res.json();
  // supports [{player_id,name,...}] or [{id,name}]
  arr.forEach(p=>{
    const id = p.player_id || p.id;
    const name = p.name || p.full_name || p.player_name;
    if(id && name) PLAYERS[id] = name;
  });
}

async function loadTeams(){
  const res = await fetch("/data/baseball/teams.json", {cache:"no-store"});
  if(!res.ok) return;
  const data = await res.json();
  if(Array.isArray(data)){
    data.forEach(t=>{
      const code = t.code || t.team_code || t.abbreviation;
      const name = t.name || t.full_name || t.team_name;
      if(code && name) TEAMS[code] = name;
    });
  }else{
    Object.keys(data).forEach(code=>{
      const t = data[code];
      TEAMS[code] = t.name || t.full_name || code;
    });
  }
}

async function loadBallparks(){
  const res = await fetch("/data/baseball/ballparks.csv", {cache:"no-store"});
  if(!res.ok) return;
  const text = await res.text();
  const rows = parseCSV(text);
  if(rows.length < 2) return;

  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = (name)=> header.indexOf(name);

  const idIdx = idx("park_id") >= 0 ? idx("park_id") : idx("parkid");
  const nameIdx = idx("park_name") >= 0 ? idx("park_name") : (idx("name") >= 0 ? idx("name") : idx("park"));
  const cityIdx = idx("city");
  const stateIdx = idx("state");

  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    const park_id = (idIdx>=0 ? r[idIdx] : r[0])?.trim();
    if(!park_id) continue;
    PARKS[park_id] = {
      name: (nameIdx>=0 ? r[nameIdx] : "")?.trim(),
      city: (cityIdx>=0 ? r[cityIdx] : "")?.trim(),
      state: (stateIdx>=0 ? r[stateIdx] : "")?.trim()
    };
  }
}

/* -------------------- GAME LOADING (supports optional boxscores/) -------------------- */
async function fetchJSON(path){
  try{
    const res = await fetch(path, {cache:"no-store"});
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    return null;
  }
}

async function loadGameData(gameId){
  const season = getSeasonFromGameId(gameId);
  const gamePath = `/data/baseball/games/${season}/${gameId}.json`;
  const boxPath  = `/data/baseball/boxscores/${season}/${gameId}.json`;

  const [game, box] = await Promise.all([fetchJSON(gamePath), fetchJSON(boxPath)]);
  if(!game && !box) return {game:null, box:null, season, gamePath, boxPath};
  return {game: game || {}, box: box || null, season, gamePath, boxPath};
}

/* -------------------- RENDER HELPERS -------------------- */
function addDetailRow(label, value){
  if(value === null || value === undefined || value === "") return;
  const tr = document.createElement("tr");
  tr.innerHTML = `<td style="width:220px;"><strong>${label}</strong></td><td>${value}</td>`;
  document.getElementById("detailsBody").appendChild(tr);
}

function makePlayerCell(player_id){
  const name = playerName(player_id);
  return `<a href="/player.html?player=${encodeURIComponent(player_id)}">${name}</a>`;
}

function makeTeamCell(code){
  const name = teamName(code);
  // team page will be created next; link anyway
  return `<a href="/baseball-team.html?team=${encodeURIComponent(code)}">${name}</a>`;
}

function detectColumns(rows, preferredOrder){
  // Build column list from preferredOrder that exist + any extra numeric keys
  const keys = new Set();
  rows.forEach(r=>{
    Object.keys(r || {}).forEach(k=>{
      if(k !== "player_id") keys.add(k);
    });
  });

  const cols = [];
  preferredOrder.forEach(k=>{
    if(keys.has(k)) cols.push(k);
  });

  // add remaining keys (numeric only) in stable alphabetical order
  const extras = [...keys].filter(k=>!cols.includes(k)).sort((a,b)=>a.localeCompare(b));
  extras.forEach(k=>{
    // only include if at least one value is number-like
    let ok = false;
    for(const r of rows){
      const v = r?.[k];
      if(typeof v === "number" || (typeof v === "string" && v.trim() !== "" && !isNaN(Number(v)))){
        ok = true; break;
      }
    }
    if(ok) cols.push(k);
  });

  return cols;
}

function buildStatTable(containerId, rows, preferredCols, titleLabel){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = "";

  if(!rows || !rows.length){
    wrap.innerHTML = `<div class="small">No data.</div>`;
    return;
  }

  const cols = detectColumns(rows, preferredCols);

  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const tbody = document.createElement("tbody");
  const tfoot = document.createElement("tfoot");

  thead.innerHTML = `
    <tr>
      <th>${titleLabel}</th>
      ${cols.map(c=>`<th>${c}</th>`).join("")}
    </tr>
  `;

  // totals
  const totals = {};
  cols.forEach(c=>totals[c]=0);

  rows.forEach(r=>{
    const tr = document.createElement("tr");
    const pid = r.player_id || "";
    tr.innerHTML = `
      <td>${pid ? makePlayerCell(pid) : ""}</td>
      ${cols.map(c=>{
        const v = r[c];
        const show = (v === null || v === undefined) ? "" : v;
        // totals for numeric
        const n = Number(v);
        if(isFinite(n)) totals[c] += n;
        return `<td>${show}</td>`;
      }).join("")}
    `;
    tbody.appendChild(tr);
  });

  // totals row only if at least one total > 0
  const anyTotal = cols.some(c=>totals[c] !== 0);
  if(anyTotal){
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><strong>Totals</strong></td>
      ${cols.map(c=>`<td>${totals[c] ? totals[c] : ""}</td>`).join("")}
    `;
    tfoot.appendChild(tr);
  }

  table.appendChild(thead);
  table.appendChild(tbody);
  if(anyTotal) table.appendChild(tfoot);

  wrap.appendChild(table);
}

function renderLinescore(linescore){
  // Supports a few possible shapes:
  // 1) { away: [..], home: [..], away_total, home_total, away_hits, home_hits, away_errors, home_errors }
  // 2) { innings: [{inning:1, away:0, home:1}, ...] }
  // 3) { away_innings:[], home_innings:[] }
  if(!linescore) return false;

  let awayIn = null, homeIn = null;
  let awayR = null, homeR = null, awayH=null, homeH=null, awayE=null, homeE=null;

  if(Array.isArray(linescore.innings)){
    awayIn = linescore.innings.map(x=>x.away ?? x.away_runs ?? x.a ?? "");
    homeIn = linescore.innings.map(x=>x.home ?? x.home_runs ?? x.h ?? "");
  }else if(Array.isArray(linescore.away) && Array.isArray(linescore.home)){
    awayIn = linescore.away;
    homeIn = linescore.home;
  }else if(Array.isArray(linescore.away_innings) && Array.isArray(linescore.home_innings)){
    awayIn = linescore.away_innings;
    homeIn = linescore.home_innings;
  }

  awayR = linescore.away_total ?? linescore.away_r ?? linescore.R_away ?? null;
  homeR = linescore.home_total ?? linescore.home_r ?? linescore.R_home ?? null;
  awayH = linescore.away_hits ?? linescore.away_h ?? null;
  homeH = linescore.home_hits ?? linescore.home_h ?? null;
  awayE = linescore.away_errors ?? linescore.away_e ?? null;
  homeE = linescore.home_errors ?? linescore.home_e ?? null;

  if(!awayIn || !homeIn) return false;

  const inningsCount = Math.max(awayIn.length, homeIn.length);
  const cols = [];
  for(let i=1;i<=inningsCount;i++) cols.push(i);

  const table = document.createElement("table");
  const thead = document.createElement("thead");
  thead.innerHTML = `
    <tr>
      <th>Team</th>
      ${cols.map(n=>`<th>${n}</th>`).join("")}
      <th>R</th><th>H</th><th>E</th>
    </tr>
  `;
  const tbody = document.createElement("tbody");

  function row(teamLabel, arr, R, H, E){
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><strong>${teamLabel}</strong></td>
      ${cols.map((_,i)=>`<td>${safeText(arr[i] ?? "")}</td>`).join("")}
      <td>${safeText(R ?? "")}</td>
      <td>${safeText(H ?? "")}</td>
      <td>${safeText(E ?? "")}</td>
    `;
    tbody.appendChild(tr);
  }

  table.appendChild(thead);
  table.appendChild(tbody);
  document.getElementById("linescoreWrap").innerHTML = "";
  document.getElementById("linescoreWrap").appendChild(table);
  return true;
}

/* -------------------- MAIN RENDER -------------------- */
function setHero(title, subLines, pills){
  document.getElementById("heroTitle").textContent = title;
  document.getElementById("heroSub").innerHTML = subLines.filter(Boolean).join("<br>");
  const pillWrap = document.getElementById("heroPills");
  pillWrap.innerHTML = "";
  pills.filter(Boolean).forEach(t=>{
    const div = document.createElement("div");
    div.className = "pill";
    div.textContent = t;
    pillWrap.appendChild(div);
  });
}

function setScoreLine(text, note){
  document.getElementById("scoreLine").textContent = text || "-";
  document.getElementById("scoreNote").textContent = note || "";
}

async function init(){
  const gameId = getParam("game");
  if(!gameId){
    setHero("Game not found", ["Missing game id"], []);
    return;
  }

  await Promise.all([loadPlayers(), loadTeams(), loadBallparks()]);

  const {game, box, season, gamePath, boxPath} = await loadGameData(gameId);

  if(!game || Object.keys(game).length === 0){
    setHero("Game not found", [`${gamePath}`], []);
    return;
  }

  // Team codes / names
  const awayCode = game.away_code || box?.away_code || "";
  const homeCode = game.home_code || box?.home_code || "";
  const awayName = teamName(awayCode);
  const homeName = teamName(homeCode);

  // Date / meta
  const date = game.date || box?.date || "";
  const venueId = game.venue || box?.venue || game.park_id || box?.park_id || "";
  const attendance = game.attendance ?? box?.attendance ?? "";
  const minutes = game.game_length_minutes ?? box?.game_length_minutes ?? "";

  // Hero
  const title = `${awayName || awayCode} @ ${homeName || homeCode}`;
  const sub = [
    date ? `<strong>${date}</strong>` : "",
    venueId ? `${parkLabel(venueId)}` : ""
  ];

  const pills = [
    gameId ? `Game ID: ${gameId}` : "",
    attendance ? `Attendance: ${Number(attendance).toLocaleString()}` : "",
    minutes ? `Length: ${minutes} min` : "",
    season ? `Season: ${season}` : ""
  ];

  setHero(title, sub, pills);

  // Details
  document.getElementById("detailsBody").innerHTML = "";
  addDetailRow("Game ID", safeText(game.game_id || gameId));
  addDetailRow("Season", safeText(game.season || season));
  addDetailRow("Date", safeText(date));
  addDetailRow("Away", awayCode ? `${makeTeamCell(awayCode)} (${awayCode})` : "");
  addDetailRow("Home", homeCode ? `${makeTeamCell(homeCode)} (${homeCode})` : "");
  addDetailRow("Venue", venueId ? parkLabel(venueId) : "");
  addDetailRow("Attendance", attendance ? Number(attendance).toLocaleString() : "");
  addDetailRow("Game length", minutes ? `${minutes} minutes` : "");

  // Score: prefer explicit fields if present in either game or boxscore
  const awayScore = game.away_score ?? box?.away_score ?? box?.away_runs ?? null;
  const homeScore = game.home_score ?? box?.home_score ?? box?.home_runs ?? null;

  if(awayScore !== null && awayScore !== undefined && homeScore !== null && homeScore !== undefined){
    setScoreLine(`${awayName || awayCode} ${awayScore} — ${homeName || homeCode} ${homeScore}`, "");
  }else{
    setScoreLine("-", "Score not available in this JSON (no away_score/home_score found).");
  }

  // Linescore: if exists
  const lines = game.linescore || box?.linescore || game.innings || box?.innings || null;
  let rendered = false;

  // normalize if innings provided as array of objects
  if(Array.isArray(lines)){
    // try interpret as [{inning, away, home}]
    const maybe = {innings: lines};
    rendered = renderLinescore(maybe);
  }else{
    rendered = renderLinescore(lines);
  }

  document.getElementById("linescoreSection").style.display = rendered ? "block" : "none";

  // Batting tables
  buildStatTable(
    "awayBattingWrap",
    game.batters_away || box?.batters_away || [],
    ["AB","R","H","RBI","BB","SO","SB","CS","2B","3B","HR","GIDP","SF","HBP"],
    "Player"
  );

  buildStatTable(
    "homeBattingWrap",
    game.batters_home || box?.batters_home || [],
    ["AB","R","H","RBI","BB","SO","SB","CS","2B","3B","HR","GIDP","SF","HBP"],
    "Player"
  );

  // Pitching tables
  buildStatTable(
    "awayPitchingWrap",
    game.pitchers_away || box?.pitchers_away || [],
    ["IP","H","R","ER","BB","SO","HR","BF","P","S","ERA","HBP","IBB","WP","BK"],
    "Player"
  );

  buildStatTable(
    "homePitchingWrap",
    game.pitchers_home || box?.pitchers_home || [],
    ["IP","H","R","ER","BB","SO","HR","BF","P","S","ERA","HBP","IBB","WP","BK"],
    "Player"
  );
}

init();
</script>
</body>
</html>
