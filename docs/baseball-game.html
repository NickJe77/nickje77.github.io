<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MLB Boxscore</title>

<style>

body{
 font-family:Inter;
 background:#f4f6f8;
 margin:0;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:20px;
}

.hero{
 background:linear-gradient(90deg,#002D72,#C8102E);
 color:white;
 padding:30px;
 border-radius:20px;
}

.linescore{
 margin-top:20px;
 background:white;
 border-radius:10px;
 padding:15px;
}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:15px;
}

th{
 background:#002D72;
 color:white;
 padding:8px;
}

td{
 padding:8px;
}

tr:nth-child(even){
 background:#eaf3ff;
}

.section{
 background:white;
 margin-top:20px;
 padding:15px;
 border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="hero">
<h1 id="teams"></h1>
<h2 id="score"></h2>
</div>

<div class="linescore">
<h3>Linescore</h3>
<table id="linescore"></table>
</div>

<div class="section">
<h3>Batting</h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
<th>H</th>
<th>HR</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="batting"></tbody>
</table>
</div>

<div class="section">
<h3>Pitching</h3>
<table>
<thead>
<tr>
<th>Pitcher</th>
<th>IP</th>
<th>H</th>
<th>R</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="pitching"></tbody>
</table>
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search)

const year = params.get("year")
const id = params.get("id")

async function load(){

 const season = await fetch(`data/baseball/seasons/${year}.json`)
 const games = await season.json()

 const game = games.find(g=>g.id===id)

 document.getElementById("teams").innerText =
 game.away_team + " @ " + game.home_team

 document.getElementById("score").innerText =
 game.away_score + " - " + game.home_score

 const box = await fetch(`data/baseball/boxscores/${year}.json`)
 const boxscores = await box.json()

 const boxscore = boxscores[game.retro_id]

 buildBatting(boxscore)
 buildPitching(boxscore)

}

function buildBatting(box){

 const tbody = document.getElementById("batting")

 box.batting.forEach(p=>{

  const tr = document.createElement("tr")

  tr.innerHTML = `
   <td>${p.player}</td>
   <td>${p.PA}</td>
   <td>${p.H}</td>
   <td>${p.HR}</td>
   <td>${p.BB}</td>
   <td>${p.SO}</td>
  `

  tbody.appendChild(tr)

 })

}

function buildPitching(box){

 const tbody = document.getElementById("pitching")

 box.pitching.forEach(p=>{

  const tr = document.createElement("tr")

  tr.innerHTML = `
   <td>${p.player}</td>
   <td>${p.IP}</td>
   <td>${p.H}</td>
   <td>${p.R}</td>
   <td>${p.BB}</td>
   <td>${p.SO}</td>
  `

  tbody.appendChild(tr)

 })

}

load()

</script>

</body>
</html>
