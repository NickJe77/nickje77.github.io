<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLB Season | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Inter,system-ui,sans-serif;
    background:#eef2f7;
}

.nav{
    background:white;
    padding:18px;
    text-align:center;
    border-bottom:1px solid #d9dee5;
}

.nav a{
    text-decoration:none;
    color:#0056d6;
    font-weight:700;
    margin:0 18px;
    font-size:16px;
}

.page{
    max-width:1500px;
    margin:auto;
    padding:28px;
}

.hero{
    background:linear-gradient(135deg,#002f87,#e4002b);
    color:white;
    border-radius:30px;
    padding:40px;
    margin-bottom:30px;
}

.hero h1{
    margin:0;
    font-size:58px;
}

.table-wrap{
    background:white;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0056d6;
    color:white;
    padding:14px;
    text-align:left;
    font-size:15px;
}

td{
    padding:14px;
    border-bottom:1px solid #e6ebf2;
    font-size:15px;
}

tr:nth-child(even){
    background:#f5f8fc;
}

a.game-link{
    color:#0056d6;
    font-weight:700;
    text-decoration:none;
}

a.game-link:hover{
    text-decoration:underline;
}

@media(max-width:1000px){

.hero h1{
    font-size:38px;
}

table{
    font-size:13px;
}

th,td{
    padding:10px;
}

}

</style>
</head>

<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="baseball-seasons.html">Seasons</a>
    <a href="baseball-teams.html">Teams</a>
    <a href="baseball-players.html">Players</a>
</div>

<div class="page">

    <div class="hero">
        <h1 id="title">MLB Season</h1>
    </div>

    <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Away Team</th>
                    <th>Home Team</th>
                    <th>Score</th>
                    <th>Venue</th>
                </tr>
            </thead>

            <tbody id="gamesBody"></tbody>

        </table>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const season = params.get("season") || "2026";

document.getElementById("title").innerText =
    `MLB ${season} Season`;

async function loadSeason(){

    try{

        const res = await fetch(
            `/data/baseball/seasons/${season}.json`
        );

        const games = await res.json();

        renderGames(games);

    }catch(err){

        console.error(err);

    }

}

function renderGames(games){

    const body = document.getElementById("gamesBody");

    body.innerHTML = "";

    games.forEach(game=>{

        const row = document.createElement("tr");

        const score = (
            `${game.away_score ?? 0}-${game.home_score ?? 0}`
        );

        const gameFile = game.game_file;

        row.innerHTML = `
            <td>${game.date}</td>

            <td>
                <a class="game-link"
                href="baseball-game.html?season=${season}&game=${encodeURIComponent(gameFile)}">
                    ${game.away_team}
                </a>
            </td>

            <td>${game.home_team}</td>

            <td>${score}</td>

            <td>${game.venue || ""}</td>
        `;

        body.appendChild(row);

    });

}

loadSeason();

</script>

</body>
</html>
