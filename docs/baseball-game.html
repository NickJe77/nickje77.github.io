<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baseball Game | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Inter,system-ui,sans-serif;
    background:#eef2f7;
}

/* ---------------- NAV ---------------- */

.nav{
    background:white;
    padding:14px 8px;
    text-align:center;
    border-bottom:1px solid #d9dee5;
    position:sticky;
    top:0;
    z-index:1000;
}

.nav a{
    text-decoration:none;
    color:#0056d6;
    font-weight:700;
    margin:0 12px;
    font-size:14px;
}

/* ---------------- PAGE ---------------- */

.page{
    max-width:1600px;
    margin:auto;
    padding:10px;
}

/* ---------------- HERO ---------------- */

.hero{
    background:linear-gradient(135deg,#002f87,#d90429);
    color:white;
    border-radius:20px;
    padding:22px 26px;
    margin-bottom:12px;
}

.hero h1{
    margin:0;
    font-size:32px;
    line-height:1.05;
}

.sub{
    margin-top:8px;
    font-size:15px;
    opacity:.95;
}

.scoreline{
    margin-top:10px;
    font-size:34px;
    font-weight:900;
}

/* ---------------- GRID ---------------- */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

/* ---------------- CARD ---------------- */

.card{
    background:white;
    border-radius:16px;
    padding:12px;
    box-shadow:0 1px 5px rgba(0,0,0,.05);
}

.card h2{
    margin:0 0 10px 0;
    font-size:18px;
}

/* ---------------- TABLE ---------------- */

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0056d6;
    color:white;
    padding:7px 8px;
    text-align:left;
    font-size:12px;
}

td{
    padding:6px 8px;
    border-bottom:1px solid #e7edf5;
    font-size:13px;
    line-height:1.2;
}

tr:nth-child(even){
    background:#f7fbff;
}

td a{
    color:#0056d6;
    text-decoration:none;
    font-weight:700;
}

td a:hover{
    text-decoration:underline;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:900px){

.page{
    padding:6px;
}

.hero{
    padding:16px;
    border-radius:16px;
    margin-bottom:8px;
}

.hero h1{
    font-size:22px;
}

.sub{
    font-size:12px;
}

.scoreline{
    font-size:24px;
}

.grid{
    grid-template-columns:1fr;
    gap:8px;
}

.card{
    padding:8px;
    border-radius:12px;
}

.card h2{
    font-size:15px;
    margin-bottom:8px;
}

.nav{
    padding:10px 4px;
}

.nav a{
    margin:0 5px;
    font-size:11px;
}

th{
    font-size:10px;
    padding:6px 5px;
}

td{
    font-size:11px;
    padding:5px;
}

}

</style>
</head>

<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="baseball-seasons.html">Seasons</a>
    <a href="baseball-players.html">Players</a>
</div>

<div class="page">

    <div id="hero" class="hero">
        <h1>Loading...</h1>
    </div>

    <div class="grid">

        <!-- AWAY BATTING -->

        <div class="card">

            <h2>Away Batting</h2>

            <table id="awayBatting">

                <thead>
                    <tr>
                        <th>Player</th>
                        <th>AB</th>
                        <th>R</th>
                        <th>H</th>
                        <th>RBI</th>
                    </tr>
                </thead>

                <tbody></tbody>

            </table>

        </div>

        <!-- HOME BATTING -->

        <div class="card">

            <h2>Home Batting</h2>

            <table id="homeBatting">

                <thead>
                    <tr>
                        <th>Player</th>
                        <th>AB</th>
                        <th>R</th>
                        <th>H</th>
                        <th>RBI</th>
                    </tr>
                </thead>

                <tbody></tbody>

            </table>

        </div>

        <!-- AWAY PITCHING -->

        <div class="card">

            <h2>Away Pitching</h2>

            <table id="awayPitching">

                <thead>
                    <tr>
                        <th>Pitcher</th>
                        <th>IP</th>
                        <th>H</th>
                        <th>ER</th>
                        <th>SO</th>
                    </tr>
                </thead>

                <tbody></tbody>

            </table>

        </div>

        <!-- HOME PITCHING -->

        <div class="card">

            <h2>Home Pitching</h2>

            <table id="homePitching">

                <thead>
                    <tr>
                        <th>Pitcher</th>
                        <th>IP</th>
                        <th>H</th>
                        <th>ER</th>
                        <th>SO</th>
                    </tr>
                </thead>

                <tbody></tbody>

            </table>

        </div>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const season = params.get("season");
const gameFile = params.get("game");

const url =
    `/data/baseball/boxscores/${season}/${gameFile}`;

async function loadGame(){

    try{

        const res = await fetch(url);

        if(!res.ok){
            throw new Error("Game not found");
        }

        const game = await res.json();

        renderGame(game);

    }catch(err){

        document.getElementById("hero").innerHTML = `
            <h1>Game not found</h1>
        `;

        console.error(err);

    }

}

function renderGame(game){

    const away = game.away_team;
    const home = game.home_team;

    document.getElementById("hero").innerHTML = `
        <h1>${away.name} @ ${home.name}</h1>

        <div class="sub">
            ${game.date} • ${game.venue}
        </div>

        <div class="scoreline">
            ${away.score} - ${home.score}
        </div>
    `;

    const box = game.liveData.boxscore;

    if(!box || !box.teams){
        return;
    }

    renderBatting(
        box.teams.away.players,
        document.querySelector("#awayBatting tbody")
    );

    renderBatting(
        box.teams.home.players,
        document.querySelector("#homeBatting tbody")
    );

    renderPitching(
        box.teams.away.players,
        document.querySelector("#awayPitching tbody")
    );

    renderPitching(
        box.teams.home.players,
        document.querySelector("#homePitching tbody")
    );

}

function renderBatting(players, tbody){

    tbody.innerHTML = "";

    Object.values(players).forEach(player=>{

        if(!player.stats || !player.stats.batting)
            return;

        const b = player.stats.batting;

        if(
            (b.atBats || 0) === 0 &&
            (b.walks || 0) === 0 &&
            (b.hitByPitch || 0) === 0 &&
            (b.sacFlies || 0) === 0
        ){
            return;
        }

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>
                <a href="baseball-player.html?player=${encodeURIComponent(player.person.fullName)}">
                    ${player.person.fullName}
                </a>
            </td>

            <td>${b.atBats || 0}</td>
            <td>${b.runs || 0}</td>
            <td>${b.hits || 0}</td>
            <td>${b.rbi || 0}</td>
        `;

        tbody.appendChild(tr);

    });

}

function renderPitching(players, tbody){

    tbody.innerHTML = "";

    Object.values(players).forEach(player=>{

        if(!player.stats || !player.stats.pitching)
            return;

        const p = player.stats.pitching;

        if(
            !p.inningsPitched ||
            p.inningsPitched === "0.0"
        ){
            return;
        }

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>
                <a href="baseball-player.html?player=${encodeURIComponent(player.person.fullName)}">
                    ${player.person.fullName}
                </a>
            </td>

            <td>${p.inningsPitched || 0}</td>
            <td>${p.hits || 0}</td>
            <td>${p.earnedRuns || 0}</td>
            <td>${p.strikeOuts || 0}</td>
        `;

        tbody.appendChild(tr);

    });

}

loadGame();

</script>

</body>
</html>
