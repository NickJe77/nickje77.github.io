<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1100px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.error{
background:#ffd6d6;
padding:14px;
border-radius:10px;
color:#900;
font-weight:700;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div id="errorBox"></div>

<div class="hero">

<h1 id="title">Loading game...</h1>

<div id="date"></div>

</div>

<pre id="output"></pre>

</div>

<script>

async function loadGame(){

const params=new URLSearchParams(window.location.search);

const id=params.get("id");

if(!id){

showError("Missing game ID");

return;

}

// extract year from id safely
const year=id.substring(0,4);

const path=
`data/baseball/boxscores/${year}/${id}.json`;

try{

const res=await fetch(path);

if(!res.ok){

showError(
`Game file not found: ${path}`
);

return;

}

const game=await res.json();

renderGame(game);

}catch(err){

showError(err.message);

}

}

function renderGame(game){

document.getElementById("title").textContent=
`${game.away_team} @ ${game.home_team}`;

document.getElementById("date").textContent=
game.date;

document.getElementById("output").textContent=
JSON.stringify(game,null,2);

}

function showError(msg){

document.getElementById("errorBox").innerHTML=
`<div class="error">${msg}</div>`;

}

loadGame();

</script>

</body>
</html>
