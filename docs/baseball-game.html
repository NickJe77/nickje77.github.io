<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family:Inter,system-ui,Arial;
    margin:0;
    background:#f4f6f8;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:28px;
    padding:18px;
    background:white;
    border-bottom:1px solid #ddd;
    font-weight:600;
}

.navbar a{
    text-decoration:none;
    color:#0056d6;
}

.page{
    max-width:1200px;
    margin:auto;
    padding:24px;
}

.hero{
    background:linear-gradient(90deg,#002D72,#C8102E);
    color:white;
    padding:30px;
    border-radius:16px;
    margin-bottom:20px;
}

.hero h1{
    margin:0;
    font-size:36px;
}

.hero p{
    margin:8px 0 0 0;
}

.section{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0b2d5c;
    color:white;
    padding:10px;
}

td{
    padding:8px;
}

tr:nth-child(even){
    background:#e9f2ff;
}

.error{
    background:#ffdede;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-players.html">Players</a>
</div>

<div class="page">

<div id="errorBox"></div>

<div class="hero">
<h1 id="title">Loading game...</h1>
<p id="date"></p>
<p id="venue"></p>
</div>

<div class="section">
<h2>Batting</h2>

<div style="display:flex; gap:40px">

<div style="flex:1">
<h3 id="awayName"></h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div style="flex:1">
<h3 id="homeName"></h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

</div>
</div>

<div class="section">
<h2>Pitching</h2>

<div style="display:flex; gap:40px">

<div style="flex:1">
<h3 id="awayPitchName"></h3>
<table>
<thead>
<tr>
<th>Pitcher</th>
<th>IP</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="awayPitch"></tbody>
</table>
</div>

<div style="flex:1">
<h3 id="homePitchName"></h3>
<table>
<thead>
<tr>
<th>Pitcher</th>
<th>IP</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="homePitch"></tbody>
</table>
</div>

</div>
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search)
const gameId = params.get("id")

loadGame()

async function loadGame()
{
    try
    {
        const year = gameId.substring(3,7)

        const url =
        `data/baseball/boxscores/${year}/${gameId}.json`

        const res = await fetch(url)

        if(!res.ok)
            throw new Error("Game file not found")

        const game = await res.json()

        renderGame(game)
    }
    catch(e)
    {
        document.getElementById("errorBox").innerHTML =
        `<div class="error">${e.message}</div>`
    }
}

function renderGame(game)
{
    document.getElementById("title").textContent =
        `${game.away_team} @ ${game.home_team}`

    document.getElementById("date").textContent =
        game.date

    document.getElementById("venue").textContent =
        "Venue: " + (game.venue || "Unknown")

    document.getElementById("awayName").textContent =
        game.away_team

    document.getElementById("homeName").textContent =
        game.home_team

    document.getElementById("awayPitchName").textContent =
        game.away_team

    document.getElementById("homePitchName").textContent =
        game.home_team

    renderBatting(game.away_batting,"awayBat")
    renderBatting(game.home_batting,"homeBat")

    renderPitching(game.away_pitching,"awayPitch")
    renderPitching(game.home_pitching,"homePitch")
}

function renderBatting(players,id)
{
    const tbody = document.getElementById(id)
    tbody.innerHTML=""

    if(!players) return

    players.forEach(p =>
    {
        tbody.innerHTML +=
        `<tr>
        <td>${p.name}</td>
        <td>${p.PA||""}</td>
        <td>${p.H||""}</td>
        <td>${p.BB||""}</td>
        <td>${p.SO||""}</td>
        <td>${p.HR||""}</td>
        </tr>`
    })
}

function renderPitching(players,id)
{
    const tbody = document.getElementById(id)
    tbody.innerHTML=""

    if(!players) return

    players.forEach(p =>
    {
        tbody.innerHTML +=
        `<tr>
        <td>${p.name}</td>
        <td>${p.IP||""}</td>
        <td>${p.H||""}</td>
        <td>${p.BB||""}</td>
        <td>${p.SO||""}</td>
        </tr>`
    })
}

</script>

</body>
</html>
