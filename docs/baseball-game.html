<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}

.page{max-width:1200px;margin:auto;padding:20px;}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:36px;
border-radius:22px;
text-align:center;
margin-bottom:20px;
}

.matchup{font-size:42px;font-weight:900;}
.score{font-size:72px;font-weight:900;margin-top:10px;}
.date{font-size:18px;margin-top:6px;font-weight:700;}

.card{
background:#fff;
padding:18px;
border-radius:16px;
box-shadow:0 4px 14px rgba(0,0,0,0.12);
margin-bottom:18px;
}

.meta span{
display:inline-block;
background:#eef4ff;
border:1px solid #d6e4ff;
padding:8px 14px;
border-radius:12px;
margin-right:10px;
font-weight:700;
}

table{width:100%;border-collapse:collapse;}

th{
background:#002D72;
color:#fff;
padding:10px;
text-align:center;
}

td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

td:first-child{
text-align:left;
font-weight:700;
}

tr:nth-child(even){
background:#f0f6ff;
}

.player-link{
color:#0056d6;
cursor:pointer;
text-decoration:none;
}

.player-link:hover{
text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<div class="matchup" id="matchup">Loading…</div>
<div class="score" id="score">—</div>
<div class="date" id="date"></div>
</div>

<div class="card">
<h3>Game Info</h3>
<div class="meta">
<span id="venue">Venue: —</span>
<span id="attendance">Attendance: —</span>
</div>
</div>

<div class="card">
<h3>Linescore</h3>
<table>
<thead id="linescoreHead"></thead>
<tbody id="linescoreBody"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayBatTitle"></h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>AB</th>
<th>H</th>
<th>RBI</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div class="card">
<h3 id="homeBatTitle"></h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>AB</th>
<th>H</th>
<th>RBI</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayPitchTitle"></h3>
<table>
<thead>
<tr>
<th>Pitcher</th>
<th>IP</th>
<th>H</th>
<th>R</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="awayPitch"></tbody>
</table>
</div>

<div class="card">
<h3 id="homePitchTitle"></h3>
<table>
<thead>
<tr>
<th>Pitcher</th>
<th>IP</th>
<th>H</th>
<th>R</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="homePitch"></tbody>
</table>
</div>

</div>

<script>
const TEAM_NAMES={
NYA:"New York Yankees",
BOS:"Boston Red Sox"
};

function teamName(code){
return TEAM_NAMES[code] || code;
}

async function loadPlayersMap(){

const res = await fetch("data/baseball/players.json");
const players = await res.json();

const map = new Map();

players.forEach(p=>{
const id = p.retrosheet_id || p.id;
const name = p.full_name || (p.first_name+" "+p.last_name);
map.set(id,name);
});

return map;
}

function extractInfo(events){

const info={};

events.forEach(e=>{
if(e[0]==="info"){
info[e[1]]=e[2];
}
});

return info;
}

function statBat(){
return {AB:0,H:0,RBI:0,BB:0,SO:0,HR:0};
}

function statPitch(){
return {outs:0,H:0,R:0,BB:0,SO:0,HR:0};
}

function process(events){

const awayBat={};
const homeBat={};

const awayPitch={};
const homePitch={};

const linescore={};

let awayTotal=0;
let homeTotal=0;

events.forEach(e=>{

if(e[0]!=="play") return;

const inning=parseInt(e[1]);
const team=e[2];
const batter=e[3];
const desc=e[6]||"";

const batTeam=(team==="0"?awayBat:homeBat);
const pitchTeam=(team==="0"?homePitch:awayPitch);

if(!batTeam[batter]) batTeam[batter]=statBat();
batTeam[batter].AB++;

let pitcher="unknown";

if(e[5]) pitcher=e[5];

if(!pitchTeam[pitcher]) pitchTeam[pitcher]=statPitch();

pitchTeam[pitcher].outs++;

if(desc.includes("HR")){
batTeam[batter].H++;
batTeam[batter].HR++;
pitchTeam[pitcher].HR++;
}

else if(desc.startsWith("S")||desc.startsWith("D")||desc.startsWith("T")){
batTeam[batter].H++;
pitchTeam[pitcher].H++;
}

if(desc==="K"||desc.startsWith("K")){
batTeam[batter].SO++;
pitchTeam[pitcher].SO++;
}

if(desc==="W"||desc.startsWith("W")){
batTeam[batter].BB++;
pitchTeam[pitcher].BB++;
}

const rbi=(desc.match(/\.[123]-H/g)||[]).length+(desc.includes("HR")?1:0);

batTeam[batter].RBI+=rbi;

if(!linescore[inning]) linescore[inning]={away:0,home:0};

if(team==="0"){
linescore[inning].away+=rbi;
awayTotal+=rbi;
}
else{
linescore[inning].home+=rbi;
homeTotal+=rbi;
pitchTeam[pitcher].R+=rbi;
}

});

return {awayBat,homeBat,awayPitch,homePitch,linescore,awayTotal,homeTotal};
}

function renderLinescore(ls,awayName,homeName){

let head="<tr><th></th>";

for(let i=1;i<=9;i++) head+="<th>"+i+"</th>";

head+="<th>R</th></tr>";

document.getElementById("linescoreHead").innerHTML=head;

let awayRow="<tr><td>"+awayName+"</td>";
let homeRow="<tr><td>"+homeName+"</td>";

let a=0,h=0;

for(let i=1;i<=9;i++){

const av=ls[i]?.away||0;
const hv=ls[i]?.home||0;

awayRow+="<td>"+av+"</td>";
homeRow+="<td>"+hv+"</td>";

a+=av;
h+=hv;
}

awayRow+="<td>"+a+"</td></tr>";
homeRow+="<td>"+h+"</td></tr>";

document.getElementById("linescoreBody").innerHTML=awayRow+homeRow;
}

function linkPlayer(id,name){

return '<a class="player-link" href="baseball-player.html?id='+id+'">'+name+'</a>';
}

function renderBat(id,data,map){

let html="";

Object.entries(data).forEach(([pid,p])=>{

const name=map.get(pid)||pid;

html+=
"<tr>"+
"<td>"+linkPlayer(pid,name)+"</td>"+
"<td>"+p.AB+"</td>"+
"<td>"+p.H+"</td>"+
"<td>"+p.RBI+"</td>"+
"<td>"+p.BB+"</td>"+
"<td>"+p.SO+"</td>"+
"<td>"+p.HR+"</td>"+
"</tr>";

});

document.getElementById(id).innerHTML=html;
}

function renderPitch(id,data,map){

let html="";

Object.entries(data).forEach(([pid,p])=>{

const name=map.get(pid)||pid;

const ip=(p.outs/3).toFixed(1);

html+=
"<tr>"+
"<td>"+linkPlayer(pid,name)+"</td>"+
"<td>"+ip+"</td>"+
"<td>"+p.H+"</td>"+
"<td>"+p.R+"</td>"+
"<td>"+p.BB+"</td>"+
"<td>"+p.SO+"</td>"+
"<td>"+p.HR+"</td>"+
"</tr>";

});

document.getElementById(id).innerHTML=html;
}

async function loadGame(){

const params=new URLSearchParams(location.search);

const id=params.get("id");

const year=id.substring(0,4);

const res=await fetch("data/baseball/boxscores/"+year+"/"+id+".json");

const game=await res.json();

const map=await loadPlayersMap();

const awayName=teamName(game.away_code);
const homeName=teamName(game.home_code);

document.getElementById("matchup").textContent=awayName+" @ "+homeName;

document.getElementById("date").textContent=game.date;

const info=extractInfo(game.events);

document.getElementById("venue").textContent="Venue: "+(info.site||"Unknown");

document.getElementById("attendance").textContent="Attendance: "+(info.attendance||"—");

const stats=process(game.events);

document.getElementById("score").textContent=stats.awayTotal+" - "+stats.homeTotal;

renderLinescore(stats.linescore,awayName,homeName);

document.getElementById("awayBatTitle").textContent=awayName+" Batting";
document.getElementById("homeBatTitle").textContent=homeName+" Batting";

document.getElementById("awayPitchTitle").textContent=awayName+" Pitching";
document.getElementById("homePitchTitle").textContent=homeName+" Pitching";

renderBat("awayBat",stats.awayBat,map);
renderBat("homeBat",stats.homeBat,map);

renderPitch("awayPitch",stats.awayPitch,map);
renderPitch("homePitch",stats.homePitch,map);

}

loadGame();
</script>

</body>
</html>
