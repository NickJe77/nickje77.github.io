<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  :root{
    --blue:#002D72;
    --red:#C8102E;
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#0b1220;
    --muted:#667085;
    --line:#e6e8ee;
    --link:#0056d6;
    --soft:#f0f6ff;
  }

  body{
    font-family: Inter, system-ui, Arial, sans-serif;
    margin:0;
    background:var(--bg);
    color:var(--text);
  }

  .navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px;
    background:#fff;
    border-bottom:1px solid #ddd;
    font-weight:700;
  }
  .navbar a{ text-decoration:none; color:var(--link); font-size:18px; }
  .navbar a:hover{ text-decoration:underline; }

  .page{
    max-width:1200px;
    margin:0 auto;
    padding:22px;
  }

  .hero{
    background:linear-gradient(90deg,var(--blue),var(--red));
    color:#fff;
    padding:24px 26px;
    border-radius:18px;
    margin-bottom:14px;
  }
  .hero h1{
    margin:0 0 6px 0;
    font-size:26px;
    letter-spacing:.2px;
  }
  .hero .sub{
    color:rgba(255,255,255,.92);
    font-weight:700;
    line-height:1.5;
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:14px;
  }
  @media (max-width: 900px){
    .grid{ grid-template-columns:1fr; }
  }

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
  }
  .card h2{
    margin:0;
    padding:12px 14px;
    font-size:16px;
    background:#fbfbfd;
    border-bottom:1px solid var(--line);
  }

  table{
    width:100%;
    border-collapse:collapse;
  }
  th, td{
    padding:10px 10px;
    border-bottom:1px solid #eef0f4;
    font-size:14px;
    text-align:left;
    white-space:nowrap;
  }
  tbody tr:nth-child(even){ background:#fafbfc; }

  th{
    background:var(--blue);
    color:#fff;
    font-weight:800;
    position:sticky;
    top:0;
    z-index:1;
  }

  .muted{ color:var(--muted); font-weight:800; }
  .error{
    background:#fff;
    border:1px solid #ffd4d4;
    color:#8a1f1f;
    border-radius:14px;
    padding:14px;
    font-weight:800;
  }
  .pill{
    display:inline-block;
    padding:5px 10px;
    border-radius:999px;
    border:1px solid #d7e6ff;
    background:var(--soft);
    color:#0b3d91;
    font-weight:900;
    margin-right:8px;
  }
  .link{
    color:var(--link);
    text-decoration:none;
    font-weight:900;
  }
  .link:hover{ text-decoration:underline; }
</style>
</head>

<body>
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="mlb.html">MLB</a>
  </div>

  <div class="page">
    <div class="hero">
      <h1 id="title">MLB Game</h1>
      <div class="sub" id="meta">Loading…</div>
    </div>

    <div id="status"></div>

    <div class="grid">
      <div class="card">
        <h2 id="homeBatTitle">Home Batting</h2>
        <div style="overflow:auto; max-height:520px;">
          <table>
            <thead>
              <tr>
                <th>Player</th>
                <th title="At Bats">AB</th>
                <th title="Hits">H</th>
                <th title="Walks">BB</th>
                <th title="Strikeouts">SO</th>
              </tr>
            </thead>
            <tbody id="batHome"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2 id="awayBatTitle">Away Batting</h2>
        <div style="overflow:auto; max-height:520px;">
          <table>
            <thead>
              <tr>
                <th>Player</th>
                <th title="At Bats">AB</th>
                <th title="Hits">H</th>
                <th title="Walks">BB</th>
                <th title="Strikeouts">SO</th>
              </tr>
            </thead>
            <tbody id="batAway"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2 id="homePitTitle">Home Pitching</h2>
        <div style="overflow:auto; max-height:520px;">
          <table>
            <thead>
              <tr>
                <th>Player</th>
                <th title="Innings Pitched">IP</th>
                <th title="Hits Allowed">H</th>
                <th title="Walks Allowed">BB</th>
                <th title="Strikeouts">SO</th>
              </tr>
            </thead>
            <tbody id="pitHome"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2 id="awayPitTitle">Away Pitching</h2>
        <div style="overflow:auto; max-height:520px;">
          <table>
            <thead>
              <tr>
                <th>Player</th>
                <th title="Innings Pitched">IP</th>
                <th title="Hits Allowed">H</th>
                <th title="Walks Allowed">BB</th>
                <th title="Strikeouts">SO</th>
              </tr>
            </thead>
            <tbody id="pitAway"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const gameParam = qs.get("game") || qs.get("game_id") || qs.get("id");
  const seasonParam = qs.get("season") || qs.get("year");

  const title = document.getElementById("title");
  const meta = document.getElementById("meta");
  const status = document.getElementById("status");

  const batHome = document.getElementById("batHome");
  const batAway = document.getElementById("batAway");
  const pitHome = document.getElementById("pitHome");
  const pitAway = document.getElementById("pitAway");

  const homeBatTitle = document.getElementById("homeBatTitle");
  const awayBatTitle = document.getElementById("awayBatTitle");
  const homePitTitle = document.getElementById("homePitTitle");
  const awayPitTitle = document.getElementById("awayPitTitle");

  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  async function fetchFirstJson(paths){
    let lastErr = null;
    for(const p of paths){
      try{
        const res = await fetch(p, { cache: "no-store" });
        if(!res.ok) { lastErr = new Error(`${res.status} ${res.statusText} (${p})`); continue; }
        return await res.json();
      }catch(e){
        lastErr = e;
      }
    }
    throw lastErr || new Error("Unable to load JSON");
  }

  function normalizeGames(data){
    if(Array.isArray(data)) return data;
    if(data && Array.isArray(data.games)) return data.games;
    if(data && Array.isArray(data.data)) return data.data;
    return [];
  }

  function getField(obj, keys){
    for(const k of keys){
      if(obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
    }
    return "";
  }

  function guessSeasonFromGameId(gameId){
    // your game_id looks like ANA202504040 (team + YYYYMMDD? + game#)
    // safest: read first 4 digits after team code if present
    const m = String(gameId || "").match(/(\d{4})/);
    return m ? m[1] : "";
  }

  function playerLink(playerId){
    if(!playerId) return '<span class="muted">—</span>';
    return `<a class="link" href="baseball-player.html?player=${encodeURIComponent(playerId)}">${esc(playerId)}</a>`;
  }

  function renderBatting(tbody, rows){
    tbody.innerHTML = "";
    if(!Array.isArray(rows) || !rows.length){
      tbody.innerHTML = `<tr><td class="muted" colspan="5">No data</td></tr>`;
      return;
    }
    rows.forEach(r => {
      tbody.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${playerLink(r.player_id)}</td>
          <td>${esc(getField(r, ["AB"]))}</td>
          <td>${esc(getField(r, ["H"]))}</td>
          <td>${esc(getField(r, ["BB"]))}</td>
          <td>${esc(getField(r, ["SO"]))}</td>
        </tr>
      `);
    });
  }

  function renderPitching(tbody, rows){
    tbody.innerHTML = "";
    if(!Array.isArray(rows) || !rows.length){
      tbody.innerHTML = `<tr><td class="muted" colspan="5">No data</td></tr>`;
      return;
    }
    rows.forEach(r => {
      tbody.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${playerLink(r.player_id)}</td>
          <td>${esc(getField(r, ["IP"]))}</td>
          <td>${esc(getField(r, ["H"]))}</td>
          <td>${esc(getField(r, ["BB"]))}</td>
          <td>${esc(getField(r, ["SO"]))}</td>
        </tr>
      `);
    });
  }

  async function loadSeasonMeta(season, gameId){
    if(!season) return null;

    const candidates = [
      `docs/data/baseball/seasons/${season}.json`,
      `docs/data/baseball/season_${season}.json`,
      `docs/data/baseball/games_${season}.json`,
      `docs/data/baseball/${season}.json`,
      `docs/data/baseball/seasons/${season}/games.json`,
      `docs/data/baseball/seasons/${season}/index.json`,
      `data/baseball/seasons/${season}.json`,
      `data/baseball/games_${season}.json`,
    ];

    try{
      const seasonData = await fetchFirstJson(candidates);
      const games = normalizeGames(seasonData);

      const match = games.find(g => {
        const gid = getField(g, ["game_id","gameId","id","game"]);
        return String(gid) === String(gameId);
      });

      return match || null;
    }catch(e){
      return null;
    }
  }

  async function init(){
    if(!gameParam){
      status.innerHTML = `<div class="error">Missing game id in URL. Expected: baseball-game.html?game=ANA202504040</div>`;
      meta.textContent = "";
      return;
    }

    const seasonGuess = seasonParam || guessSeasonFromGameId(gameParam);

    // 1) Load the game JSON
    const gameJsonCandidates = [
      `docs/data/baseball/games/${seasonGuess}/${gameParam}.json`,
      `docs/data/baseball/games/${seasonGuess}/${gameParam}.JSON`,
      // fallback if season folder isn't used:
      `docs/data/baseball/games/${gameParam}.json`,
      // also try without "docs/" for alternate hosting:
      `data/baseball/games/${seasonGuess}/${gameParam}.json`,
      `data/baseball/games/${gameParam}.json`
    ];

    let gameData;
    try{
      gameData = await fetchFirstJson(gameJsonCandidates);
    }catch(e){
      status.innerHTML = `<div class="error">Couldn’t load game file for <b>${esc(gameParam)}</b>.<br><br>Looked for:<br><div class="muted" style="margin-top:8px; line-height:1.5;">${gameJsonCandidates.join("<br>")}</div></div>`;
      meta.textContent = "";
      return;
    }

    // 2) Pull core identifiers from the game JSON itself
    const gameId = getField(gameData, ["game_id","gameId","id"]);
    const season = String(getField(gameData, ["season"])) || seasonGuess || "";
    const homeCode = getField(gameData, ["home_code","homeCode"]);
    const awayCode = getField(gameData, ["away_code","awayCode"]);

    title.textContent = `${awayCode} @ ${homeCode}`;
    homeBatTitle.textContent = `${homeCode} Batting`;
    awayBatTitle.textContent = `${awayCode} Batting`;
    homePitTitle.textContent = `${homeCode} Pitching`;
    awayPitTitle.textContent = `${awayCode} Pitching`;

    // 3) Try to enrich meta (date/venue/score) from season index
    const seasonMeta = await loadSeasonMeta(season, gameId || gameParam);

    const date = seasonMeta ? getField(seasonMeta, ["date","game_date"]) : "";
    const venue = seasonMeta ? getField(seasonMeta, ["venue","park","stadium"]) : "";
    const awayScore = seasonMeta ? getField(seasonMeta, ["away_score","awayScore"]) : "";
    const homeScore = seasonMeta ? getField(seasonMeta, ["home_score","homeScore"]) : "";
    const attendance = seasonMeta ? getField(seasonMeta, ["attendance","att"]) : "";
    const lengthMin = seasonMeta ? getField(seasonMeta, ["game_length_minutes","minutes","length_minutes"]) : "";

    const scoreText = (awayScore !== "" && homeScore !== "") ? `${awayScore}-${homeScore}` : "";
    const bits = [];
    if(season) bits.push(`<span class="pill">Season ${esc(season)}</span>`);
    if(date) bits.push(`<span class="pill">${esc(date)}</span>`);
    if(scoreText) bits.push(`<span class="pill">Final ${esc(scoreText)}</span>`);
    if(venue) bits.push(`<span class="pill">Venue ${esc(venue)}</span>`);
    if(attendance) bits.push(`<span class="pill">Att ${Number(attendance).toLocaleString()}</span>`);
    if(lengthMin) bits.push(`<span class="pill">${esc(lengthMin)} min</span>`);
    bits.push(`<span class="pill">Game ${esc(gameId || gameParam)}</span>`);
    meta.innerHTML = bits.join(" ");

    // 4) Render tables
    renderBatting(batHome, getField(gameData, ["batters_home"]) || []);
    renderBatting(batAway, getField(gameData, ["batters_away"]) || []);
    renderPitching(pitHome, getField(gameData, ["pitchers_home"]) || []);
    renderPitching(pitAway, getField(gameData, ["pitchers_away"]) || []);
  }

  init();
})();
</script>
</body>
</html>
