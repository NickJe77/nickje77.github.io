<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:36px;
border-radius:22px;
text-align:center;
margin-bottom:20px;
}

.matchup{
font-size:42px;
font-weight:900;
}

.score{
font-size:72px;
font-weight:900;
margin-top:10px;
}

.date{
font-size:18px;
margin-top:6px;
font-weight:700;
}

.card{
background:#fff;
padding:18px;
border-radius:16px;
box-shadow:0 4px 14px rgba(0,0,0,0.12);
margin-bottom:18px;
}

.meta span{
display:inline-block;
background:#eef4ff;
border:1px solid #d6e4ff;
padding:8px 14px;
border-radius:12px;
margin-right:10px;
font-weight:700;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#002D72;
color:#fff;
padding:10px;
text-align:center;
}

td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

td:first-child{
text-align:left;
font-weight:700;
}

tr:nth-child(even){
background:#f0f6ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<div class="matchup" id="matchup"></div>
<div class="score" id="score"></div>
<div class="date" id="date"></div>
</div>

<div class="card">
<h3>Game Info</h3>
<div class="meta">
<span id="venue"></span>
<span id="attendance"></span>
</div>
</div>

<div class="card">
<h3>Linescore</h3>
<table>
<thead id="linescoreHead"></thead>
<tbody id="linescoreBody"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayBatTitle"></h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>AB</th>
<th>H</th>
<th>RBI</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div class="card">
<h3 id="homeBatTitle"></h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>AB</th>
<th>H</th>
<th>RBI</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

</div>

<script>


/* TEAM NAME MAP */

const TEAM_NAMES={

NYA:"New York Yankees",
BOS:"Boston Red Sox",
LAN:"Los Angeles Dodgers",
SFN:"San Francisco Giants",
CHN:"Chicago Cubs",
SLN:"St Louis Cardinals",
ATL:"Atlanta Braves",
NYN:"New York Mets"

};


function teamName(code){

return TEAM_NAMES[code] || code;

}


/* LOAD PLAYER MAP */

async function loadPlayers(){

const res=await fetch("data/baseball/players.json");

const data=await res.json();

const map=new Map();

for(const p of data){

const id=p.retrosheet_id || p.id;

const name=

p.full_name ||

p.name ||

p.player_name ||

(p.first_name && p.last_name
? p.first_name+" "+p.last_name
: null);

if(id && name){

map.set(id,name);

}

}

return map;

}


/* EXTRACT VENUE */

function extractInfo(events){

const info={};

for(const e of events){

if(e[0]=="info"){

info[e[1]]=e[2];

}

}

return info;

}


/* CALCULATE STATS */

function statObj(){

return{
AB:0,H:0,RBI:0,BB:0,SO:0,HR:0
};

}


function process(events){

const awayBat={};
const homeBat={};

const linescore={};

let awayTotal=0;
let homeTotal=0;

for(const e of events){

if(e[0]!="play") continue;

const inning=parseInt(e[1]);
const team=e[2];
const batter=e[3];
const desc=e[6]||"";


const batTeam=(team=="0"?awayBat:homeBat);

if(!batTeam[batter]){

batTeam[batter]=statObj();

}

const b=batTeam[batter];

b.AB++;

if(desc.includes("S") || desc.includes("D") || desc.includes("T") || desc.includes("HR")){

b.H++;

}

if(desc.includes("HR")) b.HR++;

if(desc.includes("W")) b.BB++;

if(desc.includes("K")) b.SO++;

const runs=(desc.match(/\.[123]-H/g)||[]).length+(desc.includes("HR")?1:0);

b.RBI+=runs;


if(!linescore[inning]){

linescore[inning]={away:0,home:0};

}

if(team=="0"){

linescore[inning].away+=runs;
awayTotal+=runs;

}else{

linescore[inning].home+=runs;
homeTotal+=runs;

}

}

return{
awayBat,
homeBat,
linescore,
awayTotal,
homeTotal
};

}


/* RENDER */

function renderBat(id,data,map){

const el=document.getElementById(id);

el.innerHTML="";

for(const pid in data){

const p=data[pid];

el.innerHTML+=`
<tr>
<td>${map.get(pid)||pid}</td>
<td>${p.AB}</td>
<td>${p.H}</td>
<td>${p.RBI}</td>
<td>${p.BB}</td>
<td>${p.SO}</td>
<td>${p.HR}</td>
</tr>`;

}

}


function renderLinescore(ls,away,home){

let head="<tr><th></th>";

const max=Math.max(...Object.keys(ls).map(Number),9);

for(let i=1;i<=max;i++){

head+="<th>"+i+"</th>";

}

head+="<th>R</th></tr>";

document.getElementById("linescoreHead").innerHTML=head;

let awayRow="<tr><td>"+away+"</td>";
let homeRow="<tr><td>"+home+"</td>";

let awayTotal=0;
let homeTotal=0;

for(let i=1;i<=max;i++){

const a=ls[i]?.away||0;
const h=ls[i]?.home||0;

awayRow+="<td>"+a+"</td>";
homeRow+="<td>"+h+"</td>";

awayTotal+=a;
homeTotal+=h;

}

awayRow+="<td>"+awayTotal+"</td></tr>";
homeRow+="<td>"+homeTotal+"</td></tr>";

document.getElementById("linescoreBody").innerHTML=awayRow+homeRow;

}


/* LOAD GAME */

async function loadGame(){

const params=new URLSearchParams(location.search);

const id=params.get("id");

const year=id.substring(0,4);

const res=await fetch("data/baseball/boxscores/"+year+"/"+id+".json");

const game=await res.json();

const players=await loadPlayers();


const awayName=teamName(game.away_code);
const homeName=teamName(game.home_code);


document.getElementById("matchup").textContent=
awayName+" @ "+homeName;


document.getElementById("date").textContent=
game.date;


const info=extractInfo(game.events);


document.getElementById("venue").textContent=
"Venue: "+(info.site || "Unknown");


document.getElementById("attendance").textContent=
"Attendance: "+(info.attendance || "Unknown");


const stats=process(game.events);


renderLinescore(stats.linescore,awayName,homeName);


renderBat("awayBat",stats.awayBat,players);
renderBat("homeBat",stats.homeBat,players);


document.getElementById("score").textContent=
stats.awayTotal+" - "+stats.homeTotal;


document.getElementById("awayBatTitle").textContent=
awayName+" Batting";


document.getElementById("homeBatTitle").textContent=
homeName+" Batting";

}


loadGame();


</script>

</body>
</html>
