<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Baseball Game</title>

<style>
body{font-family:Inter,Arial;margin:0;background:#eef2f7}
.page{max-width:1200px;margin:auto;padding:20px}
.hero{
background:linear-gradient(90deg,#0b2a6f,#c8102e);
color:white;padding:30px;border-radius:16px;text-align:center;margin-bottom:20px
}
.score{font-size:48px;font-weight:bold}
.meta{margin-top:6px;font-weight:600}
.card{
background:white;padding:16px;margin-bottom:20px;border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1)
}
.error{
background:#ffdddd;
padding:15px;
border-radius:10px;
font-weight:bold
}
</style>

</head>
<body>

<div class="page">
<div id="content">Loading game...</div>
</div>

<script>

let players = {};

function showError(msg){
document.getElementById("content").innerHTML =
"<div class='error'>" + msg + "</div>";
}

async function loadPlayers(){

try{

const res = await fetch("data/baseball/players.json");

if(!res.ok) throw "players.json not found";

players = await res.json();

}catch(e){

console.log(e);
players = {};

}

}

function playerName(id){

if(players[id]){

if(typeof players[id]=="string") return players[id];

if(players[id].name) return players[id].name;

if(players[id].full_name) return players[id].full_name;

}

return id;

}

function getFile(){

const p = new URLSearchParams(location.search);

return p.get("file");

}

async function loadGame(){

try{

await loadPlayers();

const file = getFile();

if(!file) throw "Missing file parameter";

const year = file.substring(0,4);

const path = "data/baseball/boxscores/" + year + "/" + file + ".json";

const res = await fetch(path);

if(!res.ok) throw "Game file not found: " + path;

const game = await res.json();

render(game);

}catch(e){

showError(e);

}

}

function render(game){

let score = {home:0, away:0};

let batting = {home:{}, away:{}};

for(const e of game.events || []){

if(e[0]!="play") continue;

const side = e[2]=="0"?"away":"home";

const batter = e[3];

const result = e[6] || "";

if(!batting[side][batter]){

batting[side][batter]={

Player:playerName(batter),
AB:0,
H:0

};

}

batting[side][batter].AB++;

if(result.startsWith("S") ||
result.startsWith("D") ||
result.startsWith("T") ||
result.startsWith("HR"))
batting[side][batter].H++;

if(result.includes("-H"))
score[side]++;

}

let html = "<div class='hero'>" +
"<h1>" + (game.away_team || game.away_code) +
" @ " +
(game.home_team || game.home_code) +
"</h1>" +
"<div class='score'>" +
score.away + " - " + score.home +
"</div>" +
"<div class='meta'>" + game.date + "</div>" +
"<div class='meta'>Venue: " + (game.venue || "Unknown") + "</div>" +
"</div>";

html += buildTable("Away Batting", batting.away);
html += buildTable("Home Batting", batting.home);

document.getElementById("content").innerHTML = html;

}

function buildTable(title, data){

let html = "<div class='card'><h3>" + title + "</h3><table>";

html += "<tr><th>Player</th><th>AB</th><th>H</th></tr>";

for(const p in data){

const r = data[p];

html += "<tr>" +
"<td>" + r.Player + "</td>" +
"<td>" + r.AB + "</td>" +
"<td>" + r.H + "</td>" +
"</tr>";

}

html += "</table></div>";

return html;

}

loadGame();

</script>

</body>
</html>
