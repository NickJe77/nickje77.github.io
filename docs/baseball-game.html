<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Baseball Game</title>
<style>
body{font-family:Arial;margin:20px}
.hero{
background:linear-gradient(90deg,#0b2a6f,#c8102e);
color:white;padding:20px;border-radius:12px;text-align:center;
}
.error{color:red;font-weight:bold;margin-top:20px}
.debug{font-size:12px;color:#666;margin-top:10px}
</style>
</head>
<body>

<div id="content">Loading game...</div>

<script>

const content = document.getElementById("content");

function getFile(){

const params = new URLSearchParams(window.location.search);

return params.get("file") || params.get("id") || params.get("game");

}

async function load(){

const file = getFile();

if(!file){

content.innerHTML = "<div class='error'>No file parameter</div>";

return;

}

const year = file.substring(0,4);

const path = "data/baseball/boxscores/" + year + "/" + file + ".json";

content.innerHTML =
"Loading game...<div class='debug'>Trying: " + path + "</div>";

try{

const response = await fetch(path);

if(!response.ok){

content.innerHTML =
"<div class='error'>File not found</div>" +
"<div class='debug'>" + path + "</div>";

return;

}

const game = await response.json();

render(game,path);

}
catch(err){

content.innerHTML =
"<div class='error'>Fetch failed</div>" +
"<div class='debug'>" + path + "</div>";

}

}

function render(game,path){

const away = game.away_name;
const home = game.home_name;

const awayScore = game.linescore?.away ?? "";
const homeScore = game.linescore?.home ?? "";

content.innerHTML =

"<div class='hero'>" +
"<h2>" + away + " @ " + home + "</h2>" +
"<div style='font-size:40px'>" + awayScore + " - " + homeScore + "</div>" +
"<div>" + game.date + "</div>" +
"</div>" +

"<div class='debug'>Loaded: " + path + "</div>";

}

load();

</script>

</body>
</html>
