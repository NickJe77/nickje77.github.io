<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#0b2a6f,#c8102e);
  color:white;
  padding:30px;
  border-radius:16px;
  margin-bottom:20px;
  text-align:center;
}

.hero h1{
  margin:0;
  font-size:32px;
}

.hero .score{
  font-size:48px;
  font-weight:700;
}

.meta{
  display:flex;
  gap:20px;
  margin-bottom:20px;
}

.meta div{
  background:#e9eef5;
  padding:10px 14px;
  border-radius:10px;
  font-weight:600;
}

.section{
  background:white;
  padding:16px;
  border-radius:14px;
  margin-bottom:20px;
}

.section h2{
  margin-top:0;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#123a7a;
  color:white;
  padding:8px;
  text-align:left;
}

td{
  padding:8px;
}

tr:nth-child(even){
  background:#eef3fb;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-players.html">Players</a>
</div>

<div class="page" id="content">
Loading game...
</div>

<script>

function param(name)
{
  return new URLSearchParams(location.search).get(name);
}

async function loadGame()
{
  const id = param("game");

  if(!id)
  {
    content.innerHTML="Invalid game link";
    return;
  }

  const year=id.substring(0,4);

  const path=`data/baseball/games/${year}/${id}.json`;

  const r=await fetch(path);

  const game=await r.json();

  render(game);
}

function render(game)
{
  const away=game.away_code || game.away || "";
  const home=game.home_code || game.home || "";

  const awayScore=game.away_score ?? "";
  const homeScore=game.home_score ?? "";

  const date=game.date || "";

  const venue=game.venue || "Unknown";
  const attendance=game.attendance || "-";

  let html=`

<div class="hero">
<h1>${away} @ ${home}</h1>
<div class="score">${awayScore} - ${homeScore}</div>
<div>${date}</div>
</div>

<div class="meta">
<div>Venue: ${venue}</div>
<div>Attendance: ${attendance}</div>
</div>

`;

  if(game.linescore)
  {
    html+=renderTable("Linescore",game.linescore);
  }

  if(game.awayBatting)
  {
    html+=renderTable(game.awayBatTitle || "Away Batting",game.awayBatting);
  }

  if(game.homeBatting)
  {
    html+=renderTable(game.homeBatTitle || "Home Batting",game.homeBatting);
  }

  if(game.awayPitching)
  {
    html+=renderTable(game.awayPitchTitle || "Away Pitching",game.awayPitching);
  }

  if(game.homePitching)
  {
    html+=renderTable(game.homePitchTitle || "Home Pitching",game.homePitching);
  }

  content.innerHTML=html;
}

function renderTable(title,data)
{
  if(!data || data.length===0)
  return `<div class="section"><h2>${title}</h2>No data</div>`;

  const cols=Object.keys(data[0]);

  let html=`<div class="section"><h2>${title}</h2><table><tr>`;

  cols.forEach(c=>html+=`<th>${c}</th>`);

  html+="</tr>";

  data.forEach(row=>{
    html+="<tr>";
    cols.forEach(c=>html+=`<td>${row[c]}</td>`);
    html+="</tr>";
  });

  html+="</table></div>";

  return html;
}

loadGame();

</script>

</body>
</html>
