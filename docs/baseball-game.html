<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baseball Game | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Inter,system-ui,Arial;
    background:#f4f6f8;
}

.nav{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px;
    background:#fff;
    border-bottom:1px solid #ddd;
    font-weight:700;
}

.nav a{
    text-decoration:none;
    color:#0056d6;
}

.layout{
    display:flex;
    gap:20px;
    max-width:1800px;
    margin:0 auto;
    padding:20px;
    align-items:flex-start;
}

.ad-col{
    width:160px;
    min-width:160px;
    position:sticky;
    top:80px;
}

.ad-slot{
    width:160px;
    min-height:600px;
    background:white;
    border-radius:16px;
    border:1px dashed #dce3eb;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#bbb;
    font-size:11px;
    text-align:center;
}

.page{
    flex:1;
    min-width:0;
}

.hero{
    background:linear-gradient(90deg,#002D72,#3a256e,#C8102E);
    color:white;
    padding:30px;
    border-radius:20px;
    margin-bottom:18px;
}

.hero h1{
    margin:0;
    font-size:40px;
    line-height:1.05;
}

.sub{
    margin-top:8px;
    font-size:18px;
    opacity:.95;
}

.scoreline{
    margin-top:14px;
    font-size:54px;
    font-weight:900;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.card{
    background:white;
    border-radius:18px;
    padding:14px;
}

.card h2{
    margin:0 0 12px 0;
    font-size:22px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0056d6;
    color:white;
    padding:10px;
    font-size:15px;
    text-align:left;
}

td{
    padding:9px 10px;
    border-bottom:1px solid #edf0f5;
    font-size:16px;
}

tr:nth-child(even){
    background:#f7fbff;
}

td a{
    color:#0056d6;
    text-decoration:none;
    font-weight:700;
}

td a:hover{
    text-decoration:underline;
}

.no-stats{
    padding:20px;
    color:#999;
    font-size:14px;
    text-align:center;
}

@media(max-width:900px){

.layout{
    padding:8px;
    gap:0;
}

.ad-col{
    display:none;
}

.hero{
    padding:18px;
    border-radius:16px;
    margin-bottom:10px;
}

.hero h1{
    font-size:28px;
}

.sub{
    font-size:14px;
}

.scoreline{
    font-size:34px;
}

.grid{
    grid-template-columns:1fr;
    gap:10px;
}

.card{
    padding:10px;
    border-radius:14px;
}

.card h2{
    font-size:18px;
    margin-bottom:10px;
}

.nav{
    gap:14px;
    padding:12px;
}

.nav a{
    font-size:13px;
}

th{
    font-size:12px;
    padding:8px 6px;
}

td{
    font-size:13px;
    padding:7px 6px;
}

}

</style>
</head>

<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="baseball-seasons.html">Seasons</a>
    <a href="baseball-players.html">Players</a>
</div>

<div class="layout">

    <div class="ad-col">
        <div class="ad-slot">Ad</div>
    </div>

    <div class="page">

        <div id="hero" class="hero">
            <h1>Loading...</h1>
        </div>

        <div class="grid">

            <div class="card">
                <h2>Away Batting</h2>
                <div class="table-wrap">
                    <table id="awayBatting">
                        <thead>
                            <tr>
                                <th>Player</th>
                                <th>AB</th>
                                <th>R</th>
                                <th>H</th>
                                <th>RBI</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2>Home Batting</h2>
                <div class="table-wrap">
                    <table id="homeBatting">
                        <thead>
                            <tr>
                                <th>Player</th>
                                <th>AB</th>
                                <th>R</th>
                                <th>H</th>
                                <th>RBI</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2>Away Pitching</h2>
                <div class="table-wrap">
                    <table id="awayPitching">
                        <thead>
                            <tr>
                                <th>Pitcher</th>
                                <th>IP</th>
                                <th>H</th>
                                <th>ER</th>
                                <th>SO</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2>Home Pitching</h2>
                <div class="table-wrap">
                    <table id="homePitching">
                        <thead>
                            <tr>
                                <th>Pitcher</th>
                                <th>IP</th>
                                <th>H</th>
                                <th>ER</th>
                                <th>SO</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <div class="ad-col">
        <div class="ad-slot">Ad</div>
    </div>

</div>

<script>

const TEAM_NAMES = {
    "ARI": "Arizona Diamondbacks",
    "ATL": "Atlanta Braves",
    "BAL": "Baltimore Orioles",
    "BOS": "Boston Red Sox",
    "CHC": "Chicago Cubs",
    "CHN": "Chicago Cubs",
    "CHW": "Chicago White Sox",
    "CHA": "Chicago White Sox",
    "CIN": "Cincinnati Reds",
    "CLE": "Cleveland Guardians",
    "COL": "Colorado Rockies",
    "DET": "Detroit Tigers",
    "HOU": "Houston Astros",
    "KAN": "Kansas City Royals",
    "KCA": "Kansas City Royals",
    "LAA": "Los Angeles Angels",
    "ANA": "Los Angeles Angels",
    "CAL": "California Angels",
    "LAD": "Los Angeles Dodgers",
    "LAN": "Los Angeles Dodgers",
    "MIA": "Miami Marlins",
    "FLA": "Florida Marlins",
    "FLO": "Florida Marlins",
    "MIL": "Milwaukee Brewers",
    "MIN": "Minnesota Twins",
    "NYM": "New York Mets",
    "NYN": "New York Mets",
    "NYY": "New York Yankees",
    "NYA": "New York Yankees",
    "ATH": "Athletics",
    "OAK": "Oakland Athletics",
    "PHI": "Philadelphia Phillies",
    "PIT": "Pittsburgh Pirates",
    "SD":  "San Diego Padres",
    "SDN": "San Diego Padres",
    "SEA": "Seattle Mariners",
    "SF":  "San Francisco Giants",
    "SFN": "San Francisco Giants",
    "STL": "St. Louis Cardinals",
    "SLN": "St. Louis Cardinals",
    "TB":  "Tampa Bay Rays",
    "TBA": "Tampa Bay Rays",
    "TEX": "Texas Rangers",
    "TOR": "Toronto Blue Jays",
    "WSH": "Washington Nationals",
    "WAS": "Washington Nationals",
    "MON": "Montreal Expos",
    "WS1": "Washington Senators",
    "WS2": "Washington Senators",
    "BRO": "Brooklyn Dodgers",
    "BSN": "Boston Braves",
    "PHA": "Philadelphia Athletics",
    "SLA": "St. Louis Browns",
    "MLN": "Milwaukee Braves"
};

function resolveName(val){
    if(!val) return "";
    if(typeof val === "object" && val !== null){
        return val.name || "";
    }
    if(val.includes(" ")) return val;
    return TEAM_NAMES[val] || val;
}

const params   = new URLSearchParams(window.location.search);
const season   = params.get("season");
const gameFile = params.get("game");
const url      = `/data/baseball/boxscores/${season}/${gameFile}`;

async function loadGame(){
    try{
        const res = await fetch(url);
        if(!res.ok) throw new Error("Game not found");
        const game = await res.json();
        renderGame(game);
    } catch(err){
        document.getElementById("hero").innerHTML = `<h1>Game not found</h1>`;
        console.error(err);
    }
}

function renderGame(game){

    const awayRaw = game.away_team;
    const homeRaw = game.home_team;

    const awayName  = resolveName(typeof awayRaw === "object" ? awayRaw?.name || awayRaw?.code : awayRaw);
    const homeName  = resolveName(typeof homeRaw === "object" ? homeRaw?.name || homeRaw?.code : homeRaw);
    const awayScore = typeof awayRaw === "object" ? (awayRaw?.score ?? game.away_score ?? 0) : (game.away_score ?? 0);
    const homeScore = typeof homeRaw === "object" ? (homeRaw?.score ?? game.home_score ?? 0) : (game.home_score ?? 0);
    const venue     = game.venue || "";
    const date      = game.date  || "";

    document.getElementById("hero").innerHTML = `
        <h1>${awayName} @ ${homeName}</h1>
        <div class="sub">${date}${venue ? " • " + venue : ""}</div>
        <div class="scoreline">${awayScore} - ${homeScore}</div>
    `;

    document.title = `${awayName} @ ${homeName} | The Sporting Almanac`;

    const box = game.liveData?.boxscore;

    if(box && box.teams){
        renderBatting(box.teams.away.players, document.querySelector("#awayBatting tbody"));
        renderBatting(box.teams.home.players, document.querySelector("#homeBatting tbody"));
        renderPitching(box.teams.away.players, document.querySelector("#awayPitching tbody"));
        renderPitching(box.teams.home.players, document.querySelector("#homePitching tbody"));
    } else {
        const msg = `<tr><td colspan="5" class="no-stats">Box score stats not available for this game.</td></tr>`;
        document.querySelector("#awayBatting tbody").innerHTML  = msg;
        document.querySelector("#homeBatting tbody").innerHTML  = msg;
        document.querySelector("#awayPitching tbody").innerHTML = msg;
        document.querySelector("#homePitching tbody").innerHTML = msg;
    }
}

function renderBatting(players, tbody){
    tbody.innerHTML = "";
    Object.values(players).forEach(player => {
        if(!player.stats || !player.stats.batting) return;
        const b = player.stats.batting;
        if(
            (b.atBats    || 0) === 0 &&
            (b.walks     || 0) === 0 &&
            (b.hitByPitch|| 0) === 0 &&
            (b.sacFlies  || 0) === 0
        ) return;
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><a href="baseball-player.html?player=${encodeURIComponent(player.person.fullName)}">${player.person.fullName}</a></td>
            <td>${b.atBats || 0}</td>
            <td>${b.runs   || 0}</td>
            <td>${b.hits   || 0}</td>
            <td>${b.rbi    || 0}</td>
        `;
        tbody.appendChild(tr);
    });
}

function renderPitching(players, tbody){
    tbody.innerHTML = "";
    Object.values(players).forEach(player => {
        if(!player.stats || !player.stats.pitching) return;
        const p = player.stats.pitching;
        if(!p.inningsPitched || p.inningsPitched === "0.0") return;
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><a href="baseball-player.html?player=${encodeURIComponent(player.person.fullName)}">${player.person.fullName}</a></td>
            <td>${p.inningsPitched || 0}</td>
            <td>${p.hits          || 0}</td>
            <td>${p.earnedRuns    || 0}</td>
            <td>${p.strikeOuts    || 0}</td>
        `;
        tbody.appendChild(tr);
    });
}

loadGame();

</script>

</body>
</html>
