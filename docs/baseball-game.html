<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:30px;
border-radius:20px;
margin-bottom:14px;
}

.section{
background:#fff;
padding:20px;
border-radius:16px;
margin-top:14px;
}

h2{
margin-top:0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#002D72;
color:#fff;
padding:10px;
text-align:left;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f0f6ff;
}

.player-link{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

.player-link:hover{
text-decoration:underline;
}

.venue{
font-weight:700;
margin-top:10px;
}

.error{
background:#ffd6d6;
padding:12px;
border-radius:8px;
margin-top:12px;
color:#900;
font-weight:700;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="date"></div>
<div id="venue" class="venue"></div>
</div>

<div id="error"></div>

<div class="section">
<h2>Batting</h2>

<div class="grid">

<div>
<h3 id="awayName"></h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
</tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div>
<h3 id="homeName"></h3>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
</tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

</div>

</div>

</div>

<script>

let players={}
let teams={}
let parks={}

async function loadLookups(){

players=await fetch("data/baseball/players.json").then(r=>r.json())
teams=await fetch("data/baseball/teams.json").then(r=>r.json())

const csv=await fetch("data/baseball/ballparks.csv").then(r=>r.text())

csv.split("\n").slice(1).forEach(line=>{
const parts=line.split(",")
parks[parts[0]]=parts[1]
})

}

function getPlayerName(id){

if(players[id]){

if(players[id].name) return players[id].name
if(players[id].full_name) return players[id].full_name

}

return id

}

function getTeamName(code){

if(teams[code]){

if(teams[code].name) return teams[code].name
if(teams[code].full_name) return teams[code].full_name

}

return code

}

function countBatting(events,side){

let stats={}

events.forEach(e=>{

if(e[0]!="play") return

const batter=e[3]

if(!stats[batter]) stats[batter]={pa:0}

stats[batter].pa++

})

return stats

}

function renderBatting(stats,element){

const tbody=document.getElementById(element)

tbody.innerHTML=""

Object.entries(stats).forEach(([id,s])=>{

const name=getPlayerName(id)

const tr=document.createElement("tr")

tr.innerHTML=`
<td><a class="player-link" href="baseball-player.html?id=${id}">${name}</a></td>
<td>${s.pa}</td>
`

tbody.appendChild(tr)

})

}

async function loadGame(){

const params=new URLSearchParams(location.search)

const id=params.get("id")

if(!id){

document.getElementById("error").innerHTML="<div class='error'>Missing game id</div>"
return

}

const year=id.substring(0,4)

const path=`data/baseball/boxscores/${year}/${id}.json`

let game

try{

game=await fetch(path).then(r=>{

if(!r.ok) throw new Error()

return r.json()

})

}catch{

document.getElementById("error").innerHTML=`<div class='error'>Game file not found</div>`
return

}

const away=getTeamName(game.away_code)
const home=getTeamName(game.home_code)

document.getElementById("title").textContent=`${away} @ ${home}`
document.getElementById("date").textContent=game.date

document.getElementById("awayName").textContent=away
document.getElementById("homeName").textContent=home

const park=parks[game.home_code]

if(park) document.getElementById("venue").textContent="Venue: "+park

const awayBat=countBatting(game.events,0)
const homeBat=countBatting(game.events,1)

renderBatting(awayBat,"awayBat")
renderBatting(homeBat,"homeBat")

}

async function init(){

await loadLookups()
await loadGame()

}

init()

</script>

</body>
</html>
