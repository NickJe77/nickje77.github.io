<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:28px;border-radius:20px;margin-bottom:14px;}
.hero h1{margin:0;font-size:42px;}
.infoRow{display:flex;gap:12px;margin-bottom:14px;}
.infoBox{background:#fff;padding:10px 14px;border-radius:12px;font-weight:700;}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:14px;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:#fff;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
.teamTitle{font-weight:700;margin-bottom:6px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="date"></div>
</div>

<div class="infoRow">
<div class="infoBox" id="venue">Venue: —</div>
</div>

<div class="card">
<h2>Batting</h2>

<div class="split">

<div>
<div class="teamTitle" id="awayName"></div>
<table>
<thead>
<tr><th>Player</th><th>PA</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div>
<div class="teamTitle" id="homeName"></div>
<table>
<thead>
<tr><th>Player</th><th>PA</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

</div>
</div>

<div class="card">
<h2>Pitching</h2>

<div class="split">

<div>
<div class="teamTitle" id="awayPitchTitle"></div>
<table>
<thead>
<tr><th>Pitcher</th><th>IP</th><th>H</th><th>BB</th><th>SO</th></tr>
</thead>
<tbody id="awayPitch"></tbody>
</table>
</div>

<div>
<div class="teamTitle" id="homePitchTitle"></div>
<table>
<thead>
<tr><th>Pitcher</th><th>IP</th><th>H</th><th>BB</th><th>SO</th></tr>
</thead>
<tbody id="homePitch"></tbody>
</table>
</div>

</div>

</div>

</div>

<script>

const id=new URLSearchParams(location.search).get("id");
const year=id.substring(0,4);

const GAME_PATH=`data/baseball/boxscores/${year}/${id}.json`;

let PLAYERS={},TEAMS={},PARKS={};

function pname(id){return PLAYERS[id]||id;}
function tname(id){return TEAMS[id]||id;}

function ip(outs){
return Math.floor(outs/3)+"."+(outs%3);
}

async function loadRefs(){

/* players */

const players=await fetch("data/baseball/players.json").then(r=>r.json());

if(Array.isArray(players)){
players.forEach(p=>{
PLAYERS[p.id||p.player_id]=p.name||p.full_name;
});
}else PLAYERS=players;

/* teams */

const teams=await fetch("data/baseball/teams.json").then(r=>r.json());

if(Array.isArray(teams)){
teams.forEach(t=>{
TEAMS[t.code||t.id]=t.name||t.full_name;
});
}else TEAMS=teams;

/* ballparks */

const csv=await fetch("data/baseball/ballparks.csv").then(r=>r.text());

csv.split("\n").forEach(line=>{
const parts=line.split(",");
if(parts.length>1) PARKS[parts[0]]=parts[1];
});

}

async function loadGame(){

await loadRefs();

const game=await fetch(GAME_PATH).then(r=>r.json());

const awayTeam=tname(game.away_code);
const homeTeam=tname(game.home_code);

document.getElementById("title").textContent=
awayTeam+" @ "+homeTeam;

document.getElementById("date").textContent=game.date;

document.getElementById("awayName").textContent=awayTeam;
document.getElementById("homeName").textContent=homeTeam;

document.getElementById("awayPitchTitle").textContent=awayTeam;
document.getElementById("homePitchTitle").textContent=homeTeam;


/* venue */

for(const e of game.events){

if(e[0]==="info" && e[1]==="site"){

document.getElementById("venue").textContent=
"Venue: "+(PARKS[e[2]]||e[2]);

}

}

/* stat containers */

const awayBat={},homeBat={},awayPitch={},homePitch={};

/* find pitchers via info records */

let awayPitcher=null;
let homePitcher=null;

for(const e of game.events){

if(e[0]==="info" && e[1]==="wp") homePitcher=e[2];
if(e[0]==="info" && e[1]==="lp") awayPitcher=e[2];

}

/* fallback pitcher detection */

for(const e of game.events){

if(e[0]==="sub"||e[0]==="start"){

if(e[5]==="1"){

if(e[3]==="0") awayPitcher=e[1];
else homePitcher=e[1];

}

}

}

/* parse plays */

for(const e of game.events){

if(e[0]!=="play") continue;

const team=e[2];
const batter=e[3];
const ev=e[6];

const bat=team==="0"?awayBat:homeBat;

if(!bat[batter])
bat[batter]={pa:0,h:0,bb:0,so:0,hr:0};

bat[batter].pa++;

if(/^S|^D|^T|^HR/.test(ev)) bat[batter].h++;
if(/^W/.test(ev)) bat[batter].bb++;
if(/^K/.test(ev)) bat[batter].so++;
if(/^HR/.test(ev)) bat[batter].hr++;

/* pitching */

const pid=team==="0"?homePitcher:awayPitcher;
const pitch=team==="0"?homePitch:awayPitch;

if(!pid) continue;

if(!pitch[pid])
pitch[pid]={outs:0,h:0,bb:0,so:0};

if(/^S|^D|^T|^HR/.test(ev)) pitch[pid].h++;
else if(/^W/.test(ev)) pitch[pid].bb++;
else if(/^K/.test(ev)){ pitch[pid].so++; pitch[pid].outs++; }
else pitch[pid].outs++;

}

/* render */

function renderBat(id,data){

const tbody=document.getElementById(id);

for(const pid in data){

const s=data[pid];

tbody.innerHTML+=`
<tr>
<td>${pname(pid)}</td>
<td>${s.pa}</td>
<td>${s.h}</td>
<td>${s.bb}</td>
<td>${s.so}</td>
<td>${s.hr}</td>
</tr>
`;

}

}

function renderPitch(id,data){

const tbody=document.getElementById(id);

for(const pid in data){

const s=data[pid];

tbody.innerHTML+=`
<tr>
<td>${pname(pid)}</td>
<td>${ip(s.outs)}</td>
<td>${s.h}</td>
<td>${s.bb}</td>
<td>${s.so}</td>
</tr>
`;

}

}

renderBat("awayBat",awayBat);
renderBat("homeBat",homeBat);

renderPitch("awayPitch",awayPitch);
renderPitch("homePitch",homePitch);

}

loadGame();

</script>

</body>
</html>
