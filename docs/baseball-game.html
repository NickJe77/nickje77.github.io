<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>

<div class="page">

<div class="hero">
<div class="matchup" id="matchup"></div>
<div class="score" id="score"></div>
<div class="date" id="date"></div>
</div>

<div class="card">
<h3>Game Info</h3>
<div id="venue"></div>
<div id="attendance"></div>
</div>

<div class="card">
<h3>Linescore</h3>
<table class="linescore">
<thead id="linescoreHead"></thead>
<tbody id="linescoreBody"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayBatTitle"></h3>
<table class="player-table">
<thead>
<tr><th style="text-align:left">Player</th></tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div class="card">
<h3 id="homeBatTitle"></h3>
<table class="player-table">
<thead>
<tr><th style="text-align:left">Player</th></tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayPitchTitle"></h3>
<table class="player-table">
<thead>
<tr><th style="text-align:left">Pitcher</th></tr>
</thead>
<tbody id="awayPitch"></tbody>
</table>
</div>

<div class="card">
<h3 id="homePitchTitle"></h3>
<table class="player-table">
<thead>
<tr><th style="text-align:left">Pitcher</th></tr>
</thead>
<tbody id="homePitch"></tbody>
</table>
</div>

</div>

<script>

const TEAM_NAMES={
NYA:"New York Yankees",
BOS:"Boston Red Sox"
};

function teamName(code){
return TEAM_NAMES[code]||code;
}


function playerName(id){

const last=id.substring(0,5);
const num=id.substring(5);

return last.charAt(0).toUpperCase()
+last.slice(1)
+" #"+num;

}


function extractLinescore(events){

const innings=[];
let awayTotal=0;
let homeTotal=0;

for(const e of events){

if(e[0]!=="play") continue;

const inning=parseInt(e[1]);
const half=parseInt(e[2]);
const desc=e[6]||"";

const runs=
(desc.match(/\.[123]-H/g)||[]).length
+(desc.includes("HR")?1:0);

if(!innings[inning])
innings[inning]={away:0,home:0};

if(half===0){

innings[inning].away+=runs;
awayTotal+=runs;

}else{

innings[inning].home+=runs;
homeTotal+=runs;

}

}

return{innings,awayTotal,homeTotal};

}


function extractPlayers(events){

const awayBat=new Set();
const homeBat=new Set();

const awayPitch=new Set();
const homePitch=new Set();

let currentPitcher=null;

for(const e of events){

if(e[0]==="play"){

const half=parseInt(e[2]);
const batter=e[3];

if(half===0)
awayBat.add(playerName(batter));
else
homeBat.add(playerName(batter));

}

if(e[0]==="sub"){

const player=e[3];
const pos=e[4];

if(pos==="1"){

const team=e[2];

if(team==="0")
awayPitch.add(playerName(player));
else
homePitch.add(playerName(player));

}

}

}

return{

awayBat:[...awayBat],
homeBat:[...homeBat],
awayPitch:[...awayPitch],
homePitch:[...homePitch]

};

}


function extractInfo(events){

const info={};

for(const e of events){

if(e[0]==="info")
info[e[1]]=e[2];

}

return info;

}


function buildLinescore(ls,away,home){

let head="<tr><th></th>";

for(let i=1;i<ls.innings.length;i++)
head+="<th>"+i+"</th>";

head+="<th>R</th></tr>";

document.getElementById("linescoreHead").innerHTML=head;

let awayRow="<tr><td>"+away+"</td>";
let homeRow="<tr><td>"+home+"</td>";

for(let i=1;i<ls.innings.length;i++){

awayRow+="<td>"+(ls.innings[i]?.away||0)+"</td>";
homeRow+="<td>"+(ls.innings[i]?.home||0)+"</td>";

}

awayRow+="<td>"+ls.awayTotal+"</td></tr>";
homeRow+="<td>"+ls.homeTotal+"</td></tr>";

document.getElementById("linescoreBody").innerHTML=
awayRow+homeRow;

}


function fill(id,list){

const el=document.getElementById(id);

list.forEach(p=>{
el.innerHTML+=`<tr><td>${p}</td></tr>`;
});

}


async function loadGame(){

const params=new URLSearchParams(location.search);
const id=params.get("id");
const year=id.substring(0,4);

const res=await fetch(`data/baseball/boxscores/${year}/${id}.json`);
const game=await res.json();

const away=teamName(game.away_code);
const home=teamName(game.home_code);

const ls=extractLinescore(game.events);

document.getElementById("matchup").textContent=
away+" @ "+home;

document.getElementById("score").textContent=
ls.awayTotal+" - "+ls.homeTotal;

document.getElementById("date").textContent=
game.date;

const info=extractInfo(game.events);

document.getElementById("venue").textContent=
"Venue: "+(info.site||"");

document.getElementById("attendance").textContent=
"Attendance: "+(info.attendance||"");

buildLinescore(ls,away,home);

const players=extractPlayers(game.events);

fill("awayBat",players.awayBat);
fill("homeBat",players.homeBat);

fill("awayPitch",players.awayPitch);
fill("homePitch",players.homePitch);

document.getElementById("awayBatTitle").textContent=
away+" Batting";

document.getElementById("homeBatTitle").textContent=
home+" Batting";

document.getElementById("awayPitchTitle").textContent=
away+" Pitching";

document.getElementById("homePitchTitle").textContent=
home+" Pitching";

}


loadGame();

</script>

</body>
</html>
