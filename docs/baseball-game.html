<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Baseball Game</title>

<style>

body{
 font-family:Inter;
 background:#f4f6f8;
}

.hero{
 background:linear-gradient(90deg,#002D72,#C8102E);
 color:white;
 padding:30px;
 border-radius:20px;
 margin-bottom:20px;
}

table{
 width:100%;
 border-collapse:collapse;
 background:white;
}

th{
 background:#002D72;
 color:white;
 padding:8px;
}

td{
 padding:8px;
}

tr:nth-child(even){
 background:#eaf3ff;
}

</style>

</head>

<body>

<div class="hero">
<h1 id="teams"></h1>
<h2 id="score"></h2>
</div>

<h3>Batting</h3>

<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
<th>H</th>
<th>HR</th>
<th>R</th>
<th>SO</th>
</tr>
</thead>

<tbody id="batting"></tbody>

</table>

<script>

const params = new URLSearchParams(window.location.search)

const year = params.get("year")
const id = params.get("id")

async function loadGame(){

 const season = await fetch(`data/baseball/seasons/${year}.json`)
 const games = await season.json()

 const game = games.find(g=>g.id===id)

 document.getElementById("teams").innerText =
 game.away_team + " @ " + game.home_team

 document.getElementById("score").innerText =
 game.away_score + " - " + game.home_score

 const box = await fetch(`data/baseball/boxscores/${year}.json`)
 const boxscores = await box.json()

 const retro_id = game.retro_id

 const boxscore = boxscores[retro_id]

 const tbody = document.getElementById("batting")

 boxscore.batting.forEach(p=>{

  const tr = document.createElement("tr")

  tr.innerHTML = `
   <td>${p.player_id}</td>
   <td>${p.PA}</td>
   <td>${p.H}</td>
   <td>${p.HR}</td>
   <td>${p.R}</td>
   <td>${p.SO}</td>
  `

  tbody.appendChild(tr)

 })

}

loadGame()

</script>

</body>
</html>
