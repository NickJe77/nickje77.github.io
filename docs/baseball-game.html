<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
color:#111;
}

/* NAV */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px 0;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
font-size:18px;
}

/* PAGE */

.page{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#002D72,#BA0C2F);
color:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 4px 14px rgba(0,0,0,0.2);
}

.teams{
font-size:34px;
font-weight:700;
}

.score{
font-size:64px;
font-weight:800;
margin-top:10px;
}

.subtitle{
font-size:18px;
opacity:0.9;
margin-top:10px;
}

/* META */

.meta{
background:white;
padding:20px;
border-radius:14px;
margin-top:20px;
font-size:18px;
box-shadow:0 2px 8px rgba(0,0,0,0.12);
}

.error{
background:white;
padding:40px;
border-radius:14px;
text-align:center;
color:#c62828;
font-size:22px;
font-weight:700;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div id="content">

<div class="hero">

<div id="teams" class="teams">Loading...</div>

<div id="score" class="score"></div>

<div id="subtitle" class="subtitle"></div>

</div>

<div id="meta" class="meta"></div>

</div>

</div>

<script>

/* ELEMENTS */

const teamsEl = document.getElementById("teams");
const scoreEl = document.getElementById("score");
const subtitleEl = document.getElementById("subtitle");
const metaEl = document.getElementById("meta");
const content = document.getElementById("content");

/* GET GAME ID */

const params = new URLSearchParams(location.search);

const gameId = params.get("id");

if(!gameId){

content.innerHTML =
"<div class='error'>Missing game ID</div>";

throw new Error();

}

/* LOAD TEAM NAMES */

async function loadTeams(){

const res =
await fetch("/data/baseball/teams.json");

const teams =
await res.json();

const map = {};

teams.forEach(t=>{
map[t.code] = t.name;
});

return map;

}

/* LOAD GAME */

async function loadGame(){

try{

const year = gameId.substring(0,4);

const path =
"/data/baseball/boxscores/" +
year + "/" +
gameId + ".json";

const res =
await fetch(path);

if(!res.ok)
throw new Error();

const game =
await res.json();

const teamMap =
await loadTeams();

const awayName =
teamMap[game.away_code] || game.away_team;

const homeName =
teamMap[game.home_code] || game.home_team;

/* DISPLAY */

teamsEl.textContent =
awayName + " @ " + homeName;

scoreEl.textContent =
game.away_score + " - " + game.home_score;

subtitleEl.textContent =
game.date;

metaEl.innerHTML =
"<b>Date:</b> " + game.date +
"<br><b>Season:</b> " + game.season +
"<br><b>Venue:</b> " + (game.venue || "Unknown");

}
catch{

content.innerHTML =
"<div class='error'>Game not found</div>";

}

}

loadGame();

</script>

</body>
</html>
