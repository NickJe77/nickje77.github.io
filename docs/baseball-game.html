<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Baseball Game</title>

<style>
body{font-family:Inter,Arial;margin:0;background:#eef2f7}
.page{max-width:1200px;margin:auto;padding:20px}
.hero{
background:linear-gradient(90deg,#0b2a6f,#c8102e);
color:white;padding:30px;border-radius:16px;text-align:center;margin-bottom:20px
}
.score{font-size:48px;font-weight:bold}
.card{
background:white;padding:16px;margin-bottom:20px;border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1)
}
table{width:100%;border-collapse:collapse}
th{background:#123a7a;color:white;padding:8px}
td{padding:8px}
tr:nth-child(even){background:#eef3fb}
</style>

</head>
<body>

<div class="page">
<div id="content">Loading game...</div>
</div>

<script>

function getFile(){

const p=new URLSearchParams(location.search);

return p.get("file")||p.get("id")||p.get("game");

}

async function load(){

const file=getFile();

if(!file){

content.innerHTML="Invalid link";

return;

}

const year=file.substring(0,4);

const path="data/baseball/boxscores/"+year+"/"+file+".json";

const res=await fetch(path);

const game=await res.json();

render(game);

}

function render(game){

const home=game.home_team;
const away=game.away_team;

const batting={
home:{},
away:{}
};

let score={home:0,away:0};

for(const e of game.events){

if(e[0]!=="play")continue;

const side=e[2]=="0"?"away":"home";
const batter=e[3];
const result=e[6];

if(!batting[side][batter]){

batting[side][batter]={Player:batter,AB:0,H:0,BB:0,SO:0};

}

const s=batting[side][batter];

s.AB++;

if(result.startsWith("S")||result.startsWith("D")||result.startsWith("T")||result.startsWith("HR")) s.H++;

if(result.startsWith("W")) s.BB++;

if(result.startsWith("K")) s.SO++;

if(result.includes("-H")) score[side]++;

}

let html=`
<div class="hero">
<h1>${away} @ ${home}</h1>
<div class="score">${score.away} - ${score.home}</div>
<div>${game.date}</div>
</div>
`;

html+=table("Away Batting",Object.values(batting.away));
html+=table("Home Batting",Object.values(batting.home));

content.innerHTML=html;

}

function table(title,data){

let html=`<div class="card"><h3>${title}</h3><table>
<tr><th>Player</th><th>AB</th><th>H</th><th>BB</th><th>SO</th></tr>`;

for(const r of data){

html+=`<tr>
<td>${r.Player}</td>
<td>${r.AB}</td>
<td>${r.H}</td>
<td>${r.BB}</td>
<td>${r.SO}</td>
</tr>`;

}

html+="</table></div>";

return html;

}

load();

</script>

</body>
</html>
