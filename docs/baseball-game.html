<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
margin:0;
font-size:36px;
}

.hero .sub{
margin-top:10px;
font-size:18px;
opacity:.95;
}

.section{
background:white;
padding:18px;
border-radius:16px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#002D72;
color:white;
padding:10px;
text-align:left;
cursor:help;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f0f6ff;
}

tfoot td{
font-weight:800;
background:#f7f7f7;
}

a{
color:#0056d6;
text-decoration:none;
font-weight:700;
}

</style>

</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/baseball.html">Baseball</a>
<a href="/baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="subtitle" class="sub"></div>
</div>

<div class="section">
<h2>Away Batting</h2>
<div id="awayBatting"></div>
</div>

<div class="section">
<h2>Home Batting</h2>
<div id="homeBatting"></div>
</div>

<div class="section">
<h2>Away Pitching</h2>
<div id="awayPitching"></div>
</div>

<div class="section">
<h2>Home Pitching</h2>
<div id="homePitching"></div>
</div>

</div>

<script>

/* STAT TOOLTIPS */

const TOOLTIPS={

AB:"At Bats",
R:"Runs",
H:"Hits",
RBI:"Runs Batted In",
BB:"Walks",
SO:"Strikeouts",
SB:"Stolen Bases",
CS:"Caught Stealing",
"2B":"Doubles",
"3B":"Triples",
HR:"Home Runs",
GIDP:"Grounded Into Double Play",
SF:"Sacrifice Fly",
HBP:"Hit By Pitch",

IP:"Innings Pitched",
ER:"Earned Runs",
BF:"Batters Faced",
ERA:"Earned Run Average",
WP:"Wild Pitch",
BK:"Balk"

}

/* GLOBAL DATA */

let PLAYERS={}
let TEAMS={}

/* HELPERS */

function param(name){

return new URLSearchParams(location.search).get(name)

}

function seasonFromGame(id){

return id.substring(3,7)

}

function playerName(id){

return PLAYERS[id] || id

}

function teamName(code){

return TEAMS[code] || code

}

/* LOADERS */

async function loadPlayers(){

const res=await fetch("/data/baseball/players.json")
const data=await res.json()

data.forEach(p=>PLAYERS[p.player_id]=p.name)

}

async function loadTeams(){

const res=await fetch("/data/baseball/teams.json")
const data=await res.json()

data.forEach(t=>TEAMS[t.code]=t.name)

}

/* LOAD GAME */

async function loadGame(){

const id=param("game")

const season=seasonFromGame(id)

const game=
await fetch(`/data/baseball/games/${season}/${id}.json`)
.then(r=>r.json())

const seasonGames=
await fetch(`/data/baseball/seasons/${season}.json`)
.then(r=>r.json())

const meta=seasonGames.find(g=>g.game_id===id)

render(game,meta)

}

/* RENDER HERO */

function render(game,meta){

const away=teamName(game.away_code)
const home=teamName(game.home_code)

let score=""
let venue=""
let date=""

if(meta){

score=`${away} ${meta.away_score} — ${home} ${meta.home_score}`

venue=meta.venue || ""

date=meta.date || ""

}

document.getElementById("title").textContent=
`${away} @ ${home}`

document.getElementById("subtitle").innerHTML=
`
${score}<br>
${date}<br>
${venue}
`

renderTable("awayBatting",game.batters_away)
renderTable("homeBatting",game.batters_home)
renderTable("awayPitching",game.pitchers_away)
renderTable("homePitching",game.pitchers_home)

}

/* TABLE RENDER */

function renderTable(id,data){

if(!data)return

const cols=Object.keys(data[0]).filter(k=>k!="player_id")

let totals={}

cols.forEach(c=>totals[c]=0)

const table=document.createElement("table")

table.innerHTML=
`
<thead>
<tr>
<th>Player</th>
${cols.map(c=>
`<th title="${TOOLTIPS[c]||c}">${c}</th>`
).join("")}
</tr>
</thead>
<tbody>
${data.map(p=>{

cols.forEach(c=>{

if(!isNaN(p[c]))
totals[c]+=Number(p[c])

})

return`
<tr>
<td>
<a href="/player.html?player=${p.player_id}">
${playerName(p.player_id)}
</a>
</td>
${cols.map(c=>`<td>${p[c]||""}</td>`).join("")}
</tr>
`

}).join("")}
</tbody>
<tfoot>
<tr>
<td>Totals</td>
${cols.map(c=>`<td>${totals[c]||""}</td>`).join("")}
</tr>
</tfoot>
`

document.getElementById(id).appendChild(table)

}

/* INIT */

async function init(){

await loadPlayers()
await loadTeams()
await loadGame()

}

init()

</script>

</body>
</html>
