<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
font-size:18px;
}

.page{
max-width:1200px;
margin:auto;
padding:25px;
}

.hero{
background:linear-gradient(90deg,#002D72,#BA0C2F);
color:white;
padding:35px;
border-radius:18px;
text-align:center;
box-shadow:0 4px 14px rgba(0,0,0,0.2);
}

.hero .teams{
font-size:34px;
font-weight:700;
}

.hero .score{
font-size:64px;
font-weight:800;
margin-top:10px;
}

.hero .date{
font-size:18px;
margin-top:10px;
opacity:0.9;
}

.card{
background:white;
padding:18px;
border-radius:14px;
margin-top:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
margin-top:0;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.sectionTitle{
font-size:22px;
font-weight:700;
margin-bottom:10px;
}

.error{
background:white;
padding:40px;
border-radius:14px;
text-align:center;
color:#c62828;
font-size:22px;
font-weight:700;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div id="content">

<div class="hero">
<div id="teams" class="teams"></div>
<div id="score" class="score"></div>
<div id="date" class="date"></div>
</div>

<div id="linescoreCard" class="card"></div>

<div class="grid2">

<div id="awayBattingCard" class="card"></div>
<div id="homeBattingCard" class="card"></div>

</div>

<div class="grid2">

<div id="awayPitchingCard" class="card"></div>
<div id="homePitchingCard" class="card"></div>

</div>

</div>

</div>

<script>

const params = new URLSearchParams(location.search);
const id = params.get("id");

const teamsEl = document.getElementById("teams");
const scoreEl = document.getElementById("score");
const dateEl = document.getElementById("date");

if(!id){

document.getElementById("content").innerHTML =
"<div class='error'>Game ID missing</div>";

throw new Error();

}

async function loadGame(){

try{

const year = id.substring(0,4);

const res =
await fetch(`/data/baseball/boxscores/${year}/${id}.json`);

if(!res.ok) throw new Error();

const game = await res.json();

render(game);

}catch{

document.getElementById("content").innerHTML =
"<div class='error'>Game not found</div>";

}

}

function render(game){

teamsEl.textContent =
game.away_team + " @ " + game.home_team;

scoreEl.textContent =
game.away_score + " - " + game.home_score;

dateEl.textContent =
game.date;

/* LINESCORE */

if(game.innings){

let html =
"<div class='sectionTitle'>Linescore</div>";

html += "<table><tr><th>Team</th>";

game.innings.forEach((_,i)=>{
html += "<th>"+(i+1)+"</th>";
});

html += "<th>R</th></tr>";

html += "<tr><td>"+game.away_team+"</td>";

game.innings.forEach(i=>{
html += "<td>"+i.away+"</td>";
});

html += "<td>"+game.away_score+"</td></tr>";

html += "<tr><td>"+game.home_team+"</td>";

game.innings.forEach(i=>{
html += "<td>"+i.home+"</td>";
});

html += "<td>"+game.home_score+"</td></tr>";

html += "</table>";

document.getElementById("linescoreCard").innerHTML = html;

}

/* SPLIT BATTING */

if(game.batters){

const away =
game.batters.filter(p=>p.team===game.away_code);

const home =
game.batters.filter(p=>p.team===game.home_code);

renderBatting("awayBattingCard",game.away_team,away);

renderBatting("homeBattingCard",game.home_team,home);

}

/* SPLIT PITCHING */

if(game.pitchers){

const away =
game.pitchers.filter(p=>p.team===game.away_code);

const home =
game.pitchers.filter(p=>p.team===game.home_code);

renderPitching("awayPitchingCard",game.away_team,away);

renderPitching("homePitchingCard",game.home_team,home);

}

}

function renderBatting(id,title,data){

let html =
"<div class='sectionTitle'>"+title+" Batting</div>";

html += "<table>";

html +=
"<tr><th>Player</th><th>AB</th><th>H</th><th>RBI</th></tr>";

data.forEach(p=>{

html +=
"<tr>"+
"<td>"+p.name+"</td>"+
"<td>"+(p.ab||"")+"</td>"+
"<td>"+(p.h||"")+"</td>"+
"<td>"+(p.rbi||"")+"</td>"+
"</tr>";

});

html += "</table>";

document.getElementById(id).innerHTML = html;

}

function renderPitching(id,title,data){

let html =
"<div class='sectionTitle'>"+title+" Pitching</div>";

html += "<table>";

html +=
"<tr><th>Pitcher</th><th>IP</th><th>H</th><th>R</th></tr>";

data.forEach(p=>{

html +=
"<tr>"+
"<td>"+p.name+"</td>"+
"<td>"+(p.ip||"")+"</td>"+
"<td>"+(p.h||"")+"</td>"+
"<td>"+(p.r||"")+"</td>"+
"</tr>";

});

html += "</table>";

document.getElementById(id).innerHTML = html;

}

loadGame();

</script>

</body>
</html>
