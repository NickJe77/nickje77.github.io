<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1100px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:28px;
}

.hero .meta{
margin-top:8px;
font-size:16px;
opacity:0.95;
}

.section{
background:#fff;
padding:16px;
border-radius:16px;
margin-bottom:16px;
}

.section h2{
margin-top:0;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#002D72;
color:#fff;
padding:10px;
text-align:left;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f0f6ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Game</h1>
<div class="meta" id="meta"></div>
</div>

<div class="section">
<h2>Score</h2>
<div id="score"></div>
</div>

<div class="section">
<h2>Game Details</h2>
<table>
<tbody id="details"></tbody>
</table>
</div>

</div>

<script>

async function loadGame(){

const params = new URLSearchParams(window.location.search);

const gameId = params.get("game");

// Extract season from game ID automatically
// Example: BOS194604200 → 1946
let season = null;

if(gameId && gameId.length >= 7){

season = gameId.substring(3,7);

}

if(!gameId || !season){

document.getElementById("title").textContent = "Game not found";
document.getElementById("meta").textContent = "Missing game id";

return;

}

// Correct path based on your GitHub folder structure
const path = "data/baseball/games/" + season + "/" + gameId + ".json";

try{

const res = await fetch(path, { cache:"no-store" });

if(!res.ok){

document.getElementById("title").textContent = "Game not found";
document.getElementById("meta").textContent = path;

return;

}

const game = await res.json();

renderGame(game);

}catch(err){

document.getElementById("title").textContent = "Error loading game";
document.getElementById("meta").textContent = err.message;

}

}

function renderGame(game){

// Title
const away = game.away_team || game.away_code || "";
const home = game.home_team || game.home_code || "";

document.getElementById("title").textContent =
away + " @ " + home;

// Meta
document.getElementById("meta").textContent =
(game.date || "") +
(game.venue ? " • " + game.venue : "") +
(game.attendance ? " • Attendance: " + game.attendance.toLocaleString() : "");

// Score
document.getElementById("score").textContent =
(game.away_score ?? "") + " - " + (game.home_score ?? "");

// Details table
const details = document.getElementById("details");

details.innerHTML = "";

addDetail("Season", game.season);
addDetail("Game ID", game.game_id);
addDetail("Date", game.date);
addDetail("Away Team", game.away_team || game.away_code);
addDetail("Home Team", game.home_team || game.home_code);
addDetail("Venue", game.venue);
addDetail("Attendance", game.attendance);

}

function addDetail(label, value){

if(!value) return;

const tr = document.createElement("tr");

tr.innerHTML =
"<td><strong>" + label + "</strong></td>" +
"<td>" + value + "</td>";

document.getElementById("details").appendChild(tr);

}

loadGame();

</script>

</body>
</html>
