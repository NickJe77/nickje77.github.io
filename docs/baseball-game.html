<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}
.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}
.navbar a{
text-decoration:none;
color:#0056d6;
}
.page{
max-width:1100px;
margin:auto;
padding:20px;
}
.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}
.section{
background:#fff;
padding:16px;
border-radius:16px;
margin-bottom:16px;
}
</style>
</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/baseball.html">Baseball</a>
<a href="/baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading game...</h1>
<div id="meta"></div>
</div>

<div class="section">
<h2>Score</h2>
<div id="score"></div>
</div>

<div class="section">
<h2>Game Details</h2>
<table>
<tbody id="details"></tbody>
</table>
</div>

</div>

<script>

function getGameId(){
const params=new URLSearchParams(window.location.search);
return params.get("game");
}

function getSeason(gameId){
return gameId.substring(3,7);
}

async function loadGame(){

const gameId=getGameId();

if(!gameId){
document.getElementById("title").textContent="Game not found";
return;
}

const season=getSeason(gameId);

// ABSOLUTE PATH FIX
const path="/data/baseball/games/"+season+"/"+gameId+".json";

const res=await fetch(path,{cache:"no-store"});

if(!res.ok){
document.getElementById("title").textContent="Game not found";
document.getElementById("meta").textContent=path;
return;
}

const game=await res.json();

renderGame(game);

}

function renderGame(game){

const away=game.away_team||game.away_code;
const home=game.home_team||game.home_code;

document.getElementById("title").textContent=away+" @ "+home;

document.getElementById("meta").textContent=
(game.date||"")+
(game.venue?" • "+game.venue:"");

document.getElementById("score").textContent=
(game.away_score??"")+" - "+(game.home_score??"");

const tbody=document.getElementById("details");

tbody.innerHTML="";

addRow("Game ID",game.game_id);
addRow("Date",game.date);
addRow("Venue",game.venue);
addRow("Attendance",game.attendance);

}

function addRow(label,value){
if(!value)return;
const tr=document.createElement("tr");
tr.innerHTML="<td><strong>"+label+"</strong></td><td>"+value+"</td>";
document.getElementById("details").appendChild(tr);
}

loadGame();

</script>

</body>
</html>
