<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:30px;border-radius:20px;margin-bottom:16px;}
.hero h1{margin:0;font-size:36px;}
.hero .sub{margin-top:10px;font-size:18px;opacity:.95;line-height:1.35;}
.section{background:#fff;padding:18px;border-radius:16px;margin-bottom:16px;}
.section h2{margin:0 0 12px 0;font-size:24px;}
table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:14px;}
th{background:#002D72;color:#fff;padding:10px;text-align:left;white-space:nowrap;cursor:help;}
td{padding:9px 10px;border-bottom:1px solid #eee;font-size:14px;}
tr:nth-child(even){background:#f0f6ff;}
a{color:#0056d6;text-decoration:none;font-weight:700;}
a:hover{text-decoration:underline;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width: 900px){.grid2{grid-template-columns:1fr;}}
.small{font-size:14px;color:#555;}
</style>
</head>

<body>
<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="title">Loading...</h1>
    <div id="subtitle" class="sub"></div>
  </div>

  <div class="grid2">
    <div class="section">
      <h2>Away Batting</h2>
      <div id="awayBattingWrap"></div>
    </div>

    <div class="section">
      <h2>Home Batting</h2>
      <div id="homeBattingWrap"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="section">
      <h2>Away Pitching</h2>
      <div id="awayPitchingWrap"></div>
    </div>

    <div class="section">
      <h2>Home Pitching</h2>
      <div id="homePitchingWrap"></div>
    </div>
  </div>

</div>

<script>
/* ----------------- TOOLTIPS ----------------- */
const TOOLTIPS = {
  // Batting
  AB:"At Bats",
  R:"Runs scored",
  H:"Hits",
  RBI:"Runs Batted In",
  BB:"Walks (Base on Balls)",
  SO:"Strikeouts",
  SB:"Stolen Bases",
  CS:"Caught Stealing",
  "2B":"Doubles",
  "3B":"Triples",
  HR:"Home Runs",
  GIDP:"Grounded Into Double Play",
  SF:"Sacrifice Fly",
  HBP:"Hit By Pitch",

  // Pitching
  IP:"Innings Pitched",
  H_p:"Hits allowed",
  R_p:"Runs allowed",
  ER:"Earned Runs",
  BB_p:"Walks allowed",
  SO_p:"Strikeouts",
  HR_p:"Home Runs allowed",
  BF:"Batters Faced",
  P:"Pitches",
  S:"Strikes",
  ERA:"Earned Run Average",
  HBP_p:"Hit Batters",
  IBB:"Intentional Walks",
  WP:"Wild Pitches",
  BK:"Balks"
};

/* ----------------- GLOBAL LOOKUPS ----------------- */
let PLAYERS = {};
let TEAMS = {};
let PARKS = {}; // park_id -> {name, city, state}

/* ----------------- HELPERS ----------------- */
function param(name){ return new URLSearchParams(location.search).get(name); }

function seasonFromGameId(id){ return (id||"").substring(3,7); }

// Your game_id format: HOME + YYYYMMDD + N
function dateFromGameId(id){
  // BOS194604200 -> 1946 04 20
  const y = (id||"").substring(3,7);
  const m = (id||"").substring(7,9);
  const d = (id||"").substring(9,11);
  if(!y || !m || !d) return "";
  return `${y}-${m}-${d}`;
}

function dhIndexFromGameId(id){
  // last character is 0/1/2 for DH etc
  const last = (id||"").slice(-1);
  const n = Number(last);
  return Number.isFinite(n) ? n : 0;
}

function playerName(id){ return PLAYERS[id] || id || ""; }
function teamName(code){ return TEAMS[code] || code || ""; }

function parkLabel(parkId){
  if(!parkId) return "";
  const p = PARKS[parkId];
  if(!p) return parkId;
  const loc = [p.city, p.state].filter(Boolean).join(", ");
  return loc ? `${p.name} — ${loc}` : (p.name || parkId);
}

function makePlayerCell(pid){
  const name = playerName(pid);
  return `<a href="/player.html?player=${encodeURIComponent(pid)}">${name}</a>`;
}

/* ----------------- CSV PARSER ----------------- */
function parseCSV(text){
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;

  for(let i=0;i<text.length;i++){
    const c = text[i];
    const next = text[i+1];

    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else{ field += c; }
    }else{
      if(c === '"'){ inQuotes = true; }
      else if(c === ","){ row.push(field); field=""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === "\r"){ /* ignore */ }
      else{ field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

/* ----------------- LOADERS ----------------- */
async function loadPlayers(){
  const res = await fetch("/data/baseball/players.json", {cache:"no-store"});
  if(!res.ok) return;
  const arr = await res.json();
  arr.forEach(p=>{
    const id = p.player_id || p.id;
    const name = p.name || p.full_name || p.player_name;
    if(id && name) PLAYERS[id] = name;
  });
}

async function loadTeams(){
  const res = await fetch("/data/baseball/teams.json", {cache:"no-store"});
  if(!res.ok) return;
  const data = await res.json();

  if(Array.isArray(data)){
    data.forEach(t=>{
      const code = t.code || t.team_code || t.abbreviation;
      const name = t.name || t.full_name || t.team_name;
      if(code && name) TEAMS[code] = name;
    });
  }else{
    Object.keys(data).forEach(code=>{
      const t = data[code];
      TEAMS[code] = t.name || t.full_name || code;
    });
  }
}

async function loadBallparks(){
  const res = await fetch("/data/baseball/ballparks.csv", {cache:"no-store"});
  if(!res.ok) return;
  const text = await res.text();
  const rows = parseCSV(text);
  if(rows.length < 2) return;

  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = n => header.indexOf(n);

  const idIdx = idx("park_id") >= 0 ? idx("park_id") : idx("parkid");
  const nameIdx = idx("park_name") >= 0 ? idx("park_name") : (idx("name") >= 0 ? idx("name") : idx("park"));
  const cityIdx = idx("city");
  const stateIdx = idx("state");

  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    const pid = (idIdx>=0 ? r[idIdx] : r[0])?.trim();
    if(!pid) continue;
    PARKS[pid] = {
      name: (nameIdx>=0 ? r[nameIdx] : "")?.trim(),
      city: (cityIdx>=0 ? r[cityIdx] : "")?.trim(),
      state:(stateIdx>=0 ? r[stateIdx] : "")?.trim()
    };
  }
}

/* ----------------- FETCH ----------------- */
async function fetchJSON(path){
  try{
    const res = await fetch(path, {cache:"no-store"});
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    return null;
  }
}

/* ----------------- FIND META (SCORE + VENUE) ----------------- */
/*
Your season files look like:
{ date, season, away_team, home_team, away_code, home_code, away_score, home_score, venue, ... }
NO game_id present.

So we match by:
- date derived from game_id
- home_code
- away_code
- doubleheader index = last digit of game_id, selecting nth match for (home_code,date)
*/
function findMetaForGame(seasonGames, gameId, homeCode, awayCode){
  if(!Array.isArray(seasonGames)) return null;

  const date = dateFromGameId(gameId);
  const dh = dhIndexFromGameId(gameId);

  // First filter: exact matchup + date
  const exact = seasonGames.filter(g =>
    g &&
    g.date === date &&
    g.home_code === homeCode &&
    g.away_code === awayCode
  );

  if(exact.length === 1) return exact[0];
  if(exact.length > 1) return exact[Math.min(dh, exact.length-1)];

  // Fallback: same home+date (for cases where away_code may differ in data)
  const sameHomeDate = seasonGames.filter(g =>
    g && g.date === date && g.home_code === homeCode
  );

  if(sameHomeDate.length === 1) return sameHomeDate[0];
  if(sameHomeDate.length > 1) return sameHomeDate[Math.min(dh, sameHomeDate.length-1)];

  return null;
}

/* ----------------- TABLE RENDER (NO TOTALS) ----------------- */
function buildHeader(cols){
  return `
    <tr>
      <th title="Player name">Player</th>
      ${cols.map(c=>{
        const tip = TOOLTIPS[c] || TOOLTIPS[c+"_p"] || c;
        return `<th title="${tip}">${c}</th>`;
      }).join("")}
    </tr>
  `;
}

function renderStatTable(containerId, rows){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = "";

  if(!rows || !rows.length){
    wrap.innerHTML = `<div class="small">No data.</div>`;
    return;
  }

  // Keep the order present in the JSON, minus player_id
  const cols = Object.keys(rows[0]).filter(k=>k !== "player_id");

  const table = document.createElement("table");
  table.innerHTML = `
    <thead>${buildHeader(cols)}</thead>
    <tbody></tbody>
  `;

  const tbody = table.querySelector("tbody");

  rows.forEach(r=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.player_id ? makePlayerCell(r.player_id) : ""}</td>
      ${cols.map(c=>{
        const v = r[c];
        return `<td>${(v===null || v===undefined) ? "" : v}</td>`;
      }).join("")}
    `;
    tbody.appendChild(tr);
  });

  wrap.appendChild(table);
}

/* ----------------- MAIN ----------------- */
async function init(){
  const gameId = param("game");
  if(!gameId){
    document.getElementById("title").textContent = "Game not found";
    document.getElementById("subtitle").textContent = "Missing game parameter.";
    return;
  }

  await Promise.all([loadPlayers(), loadTeams(), loadBallparks()]);

  const season = seasonFromGameId(gameId);
  const gamePath = `/data/baseball/games/${season}/${gameId}.json`;
  const seasonPath = `/data/baseball/seasons/${season}.json`;

  const [game, seasonGames] = await Promise.all([fetchJSON(gamePath), fetchJSON(seasonPath)]);

  if(!game){
    document.getElementById("title").textContent = "Game not found";
    document.getElementById("subtitle").textContent = gamePath;
    return;
  }

  const awayCode = game.away_code || "";
  const homeCode = game.home_code || "";

  const awayName = teamName(awayCode);
  const homeName = teamName(homeCode);

  // Title
  document.getElementById("title").textContent = `${awayName} @ ${homeName}`;

  // Meta (score + venue) from season file
  const meta = findMetaForGame(seasonGames, gameId, homeCode, awayCode);

  const date = meta?.date || dateFromGameId(gameId);
  const score = (meta && meta.away_score !== undefined && meta.home_score !== undefined)
    ? `${awayName} ${meta.away_score} — ${homeName} ${meta.home_score}`
    : "";

  const venueText = meta?.venue ? parkLabel(meta.venue) : "";

  // Subtitle: ONLY what you asked for (score + venue + date)
  const lines = [];
  if(score) lines.push(`<strong>${score}</strong>`);
  if(date) lines.push(date);
  if(venueText) lines.push(venueText);

  document.getElementById("subtitle").innerHTML = lines.join("<br>");

  // Tables
  renderStatTable("awayBattingWrap", game.batters_away || []);
  renderStatTable("homeBattingWrap", game.batters_home || []);
  renderStatTable("awayPitchingWrap", game.pitchers_away || []);
  renderStatTable("homePitchingWrap", game.pitchers_home || []);
}

init();
</script>
</body>
</html>
