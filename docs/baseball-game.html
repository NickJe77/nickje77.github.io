<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:28px;
border-radius:20px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:36px;
}

.meta{
margin-top:10px;
font-size:15px;
}

.meta span{
margin-right:16px;
font-weight:600;
}

/* CARDS */

.card{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:16px;
}

.card h3{
margin:0 0 12px;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.right{
text-align:right;
}

.center{
text-align:center;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">

<h1 id="title">Loading game...</h1>

<div class="meta" id="meta"></div>

</div>

<div class="card">

<h3>Linescore</h3>

<table>

<thead id="linescoreHead"></thead>
<tbody id="linescoreBody"></tbody>

</table>

</div>

<div class="card">

<h3>Batting</h3>

<table>

<thead>
<tr>
<th>Player</th>
<th>Team</th>
<th class="right">AB</th>
<th class="right">H</th>
<th class="right">RBI</th>
<th class="right">HR</th>
</tr>
</thead>

<tbody id="battingBody"></tbody>

</table>

</div>

<div class="card">

<h3>Pitching</h3>

<table>

<thead>
<tr>
<th>Pitcher</th>
<th>Team</th>
<th class="right">IP</th>
<th class="right">ER</th>
<th class="right">K</th>
<th class="right">BB</th>
</tr>
</thead>

<tbody id="pitchingBody"></tbody>

</table>

</div>

</div>

<script>

/* GET GAME ID */

const params=new URLSearchParams(location.search);

const id=params.get("id");

if(!id){

alert("Missing game ID");

throw new Error("Missing ID");

}

/* LOAD BALLPARKS */

let PARKS={};

async function loadBallparks(){

const res=await fetch("data/baseball/ballparks.csv");

const text=await res.text();

const rows=text.split("\n");

const headers=rows[0].split(",");

const parkIndex=headers.indexOf("PARKID");
const nameIndex=headers.indexOf("NAME");
const cityIndex=headers.indexOf("CITY");
const stateIndex=headers.indexOf("STATE");

rows.slice(1).forEach(r=>{

const cols=r.split(",");

if(!cols[parkIndex])return;

PARKS[cols[parkIndex]]={

name:cols[nameIndex],
city:cols[cityIndex],
state:cols[stateIndex]

};

});

}

function parkFull(code){

if(!PARKS[code])return code;

return `${PARKS[code].name} (${PARKS[code].city}, ${PARKS[code].state})`;

}

/* LOAD GAME */

async function loadGame(){

await loadBallparks();

const game=await fetch(
`data/baseball/boxscores/${id}.json`
).then(r=>r.json());

/* TITLE */

document.getElementById("title").innerHTML=`

<span class="click"
onclick="location.href='baseball-team.html?team=${game.away_code}'">
${game.away_team}
</span>

${game.away_score}

–

${game.home_score}

<span class="click"
onclick="location.href='baseball-team.html?team=${game.home_code}'">
${game.home_team}
</span>

`;

/* META */

document.getElementById("meta").innerHTML=`

<span>${game.date||""}</span>

<span>${parkFull(game.venue)}</span>

<span>Attendance: ${game.attendance?.toLocaleString()||""}</span>

`;

/* LINESCORE */

if(game.linescore){

let head="<tr><th>Team</th>";

game.linescore.innings.forEach((_,i)=>{
head+=`<th class="center">${i+1}</th>`;
});

head+="<th class='center'>R</th></tr>";

document.getElementById("linescoreHead").innerHTML=head;

let body="";

body+=`<tr><td>${game.away_team}</td>`;

game.linescore.innings.forEach(i=>{

body+=`<td class="center">${i.away}</td>`;

});

body+=`<td class="center">${game.away_score}</td></tr>`;

body+=`<tr><td>${game.home_team}</td>`;

game.linescore.innings.forEach(i=>{

body+=`<td class="center">${i.home}</td>`;

});

body+=`<td class="center">${game.home_score}</td></tr>`;

document.getElementById("linescoreBody").innerHTML=body;

}

/* BATTING */

const bat=document.getElementById("battingBody");

bat.innerHTML="";

game.batting.forEach(p=>{

bat.innerHTML+=`

<tr>

<td class="click"
onclick="location.href='baseball-player.html?player=${encodeURIComponent(p.player)}'">
${p.player}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${p.team}'">
${p.team}
</td>

<td class="right">${p.AB||0}</td>

<td class="right">${p.H||0}</td>

<td class="right">${p.RBI||0}</td>

<td class="right">${p.HR||0}</td>

</tr>

`;

});

/* PITCHING */

const pit=document.getElementById("pitchingBody");

pit.innerHTML="";

game.pitching.forEach(p=>{

pit.innerHTML+=`

<tr>

<td class="click"
onclick="location.href='baseball-player.html?player=${encodeURIComponent(p.player)}'">
${p.player}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${p.team}'">
${p.team}
</td>

<td class="right">${p.IP||0}</td>

<td class="right">${p.ER||0}</td>

<td class="right">${p.K||0}</td>

<td class="right">${p.BB||0}</td>

</tr>

`;

});

}

loadGame();

</script>

</body>
</html>
