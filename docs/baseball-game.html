<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>

<style>

body{
font-family:Inter,system-ui;
background:#f4f6f8;
margin:0;
}

.page{
max-width:1000px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:16px;
text-align:center;
}

.score{
font-size:42px;
font-weight:800;
}

.error{
color:red;
text-align:center;
padding:20px;
font-weight:700;
}

</style>

</head>
<body>

<div class="page">

<div class="hero">

<div id="teams">Loading...</div>

<div id="score" class="score"></div>

</div>

</div>

<script>

const params =
new URLSearchParams(location.search);

const id =
params.get("id");

const teams =
document.getElementById("teams");

const score =
document.getElementById("score");

if(!id){

teams.innerHTML =
"<div class='error'>Game ID missing</div>";

throw new Error();

}

/* split ID */

const parts =
id.split("_");

const date =
parts[0];

const away =
parts[1];

const home =
parts[2];

/* open home team file */

const teamFile =
"data/baseball/boxscores/0" + home + ".json";

async function loadGame(){

const res =
await fetch(teamFile);

if(!res.ok){

teams.innerHTML =
"<div class='error'>Team file not found</div>";

return;

}

const games =
await res.json();

/* find matching game */

const game =
games.find(g =>
g.date === date &&
g.away_code === away &&
g.home_code === home
);

if(!game){

teams.innerHTML =
"<div class='error'>Game not found</div>";

return;

}

/* display */

teams.textContent =
game.away_team +
" @ " +
game.home_team;

score.textContent =
game.away_score +
" - " +
game.home_score;

}

loadGame();

</script>

</body>
</html>
