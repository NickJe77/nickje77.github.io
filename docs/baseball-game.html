<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui;margin:0;background:#f4f6f8;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.section{background:white;padding:18px;border-radius:16px;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:white;padding:10px;}
td{padding:8px;border-bottom:1px solid #eee;}
</style>
</head>

<body>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
</div>

<div class="grid">
<div class="section"><h3>Away Batting</h3><div id="awayBatting"></div></div>
<div class="section"><h3>Home Batting</h3><div id="homeBatting"></div></div>
<div class="section"><h3>Away Pitching</h3><div id="awayPitching"></div></div>
<div class="section"><h3>Home Pitching</h3><div id="homePitching"></div></div>
</div>

</div>

<script>

function param(n){
  return new URLSearchParams(window.location.search).get(n);
}

// ---------------- TABLE ----------------
function table(data){
if(!data || !data.length) return "No data";

let keys = Object.keys(data[0]);

let html = "<table><tr>";
keys.forEach(k=> html += `<th>${k}</th>`);
html += "</tr>";

data.forEach(r=>{
html += "<tr>";
keys.forEach(k=> html += `<td>${r[k]}</td>`);
html += "</tr>";
});

html += "</table>";
return html;
}

// ---------------- BUILD 2026 ----------------
function buildFromEvents(events, home, away){

const batting = {};
const pitching = {};

events.forEach(e=>{

const batter = e[3];
const result = e[6];
const team = e[2] === "0" ? away : home;

if(!batting[batter]){
batting[batter] = {player:batter,team,AB:0,H:0,BB:0,SO:0};
}

if(!pitching[team]){
pitching[team] = {player:team,team,SO:0,BB:0};
}

if(result !== "BB") batting[batter].AB++;

if(["1B","2B","3B","HR"].includes(result)) batting[batter].H++;

if(result === "BB"){
batting[batter].BB++;
pitching[team].BB++;
}

if(result === "K"){
batting[batter].SO++;
pitching[team].SO++;
}

});

return {
batting:Object.values(batting),
pitching:Object.values(pitching)
};
}

// ---------------- LOAD ----------------
async function loadGame(){

const id = param("game");
const season = param("season");

if(!id || !season){
document.getElementById("title").innerText="Missing params";
return;
}

// 🔥 STEP 1: LOAD SEASON FILE
const seasonRes = await fetch(`/data/baseball/seasons/${season}.json`);
if(!seasonRes.ok){
document.getElementById("title").innerText="Season file missing";
return;
}

const seasonData = await seasonRes.json();
const games = seasonData.games || seasonData;

// 🔥 STEP 2: FIND GAME
let meta = games.find(g => String(g.game_id) === String(id));

if(!meta){
document.getElementById("title").innerText="Game not found in season";
return;
}

// 🔥 STEP 3: BUILD FILENAME (THIS IS THE FIX)
let file = `${meta.date}_${meta.away_team}_${meta.home_team}.json`;

// 🔥 STEP 4: LOAD GAME FILE
const res = await fetch(`/data/baseball/boxscores/${season}/${file}`);

if(!res.ok){
document.getElementById("title").innerText="Boxscore not found";
return;
}

const game = await res.json();

// HEADER
document.getElementById("title").innerText =
`${meta.away_team} @ ${meta.home_team}`;

// ---------------- OLD FORMAT ----------------
if(game.batters_away){

document.getElementById("awayBatting").innerHTML = table(game.batters_away);
document.getElementById("homeBatting").innerHTML = table(game.batters_home);
document.getElementById("awayPitching").innerHTML = table(game.pitchers_away);
document.getElementById("homePitching").innerHTML = table(game.pitchers_home);

return;
}

// ---------------- NEW FORMAT ----------------
if(game.events){

const stats = buildFromEvents(game.events, meta.home_team, meta.away_team);

document.getElementById("awayBatting").innerHTML =
table(stats.batting.filter(p=>p.team===meta.away_team));

document.getElementById("homeBatting").innerHTML =
table(stats.batting.filter(p=>p.team===meta.home_team));

document.getElementById("awayPitching").innerHTML =
table(stats.pitching.filter(p=>p.team===meta.away_team));

document.getElementById("homePitching").innerHTML =
table(stats.pitching.filter(p=>p.team===meta.home_team));

}

}

loadGame();

</script>

</body>
</html>
