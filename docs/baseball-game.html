<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#eef2f7;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#0b2a6f,#c8102e);
color:white;
padding:30px;
border-radius:18px;
text-align:center;
margin-bottom:20px;
}

.hero .teams{
font-size:34px;
font-weight:700;
}

.hero .score{
font-size:64px;
font-weight:800;
margin-top:8px;
}

.hero .date{
margin-top:6px;
opacity:.9;
}

.card{
background:white;
border-radius:14px;
padding:18px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#123a7a;
color:white;
padding:10px;
text-align:left;
}

td{
padding:10px;
}

tr:nth-child(even){
background:#f3f7fd;
}

.player{
color:#0056d6;
font-weight:600;
text-decoration:none;
}
</style>

</head>
<body>

<div class="page">
<div id="content">Loading game...</div>
</div>

<script>

function getFile(){
const p=new URLSearchParams(location.search);
return p.get("file") || p.get("id") || p.get("game");
}

async function loadGame(){

const file=getFile();

if(!file){
content.innerHTML="Invalid game link";
return;
}

const year=file.substring(0,4);

const path="data/baseball/boxscores/"+year+"/"+file+".json";

const res=await fetch(path);

if(!res.ok){
content.innerHTML="Game not found";
return;
}

const game=await res.json();

render(game);

}

function render(game){

let html=`

<div class="hero">
<div class="teams">${game.away_name} @ ${game.home_name}</div>
<div class="score">${game.linescore.away} - ${game.linescore.home}</div>
<div class="date">${game.date}</div>
</div>

<div class="card">
<b>Venue:</b> ${game.venue ?? "Unknown"} &nbsp;&nbsp;
<b>Attendance:</b> ${game.attendance ?? "—"}
</div>

<div class="card">
<h3>Linescore</h3>
${renderLinescore(game.linescore)}
</div>

`;

html+=renderTable(game.awayBatTitle,game.awayBatting);
html+=renderTable(game.homeBatTitle,game.homeBatting);
html+=renderTable(game.awayPitchTitle,game.awayPitching);
html+=renderTable(game.homePitchTitle,game.homePitching);

content.innerHTML=html;

}

function renderLinescore(linescore){

let html="<table><tr>";

Object.keys(linescore).forEach(k=>{
html+="<th>"+k+"</th>";
});

html+="</tr><tr>";

Object.values(linescore).forEach(v=>{
html+="<td>"+v+"</td>";
});

html+="</tr></table>";

return html;

}

function renderTable(title,data){

if(!data)return "";

let html=`<div class="card"><h3>${title}</h3><table><tr>`;

const cols=Object.keys(data[0]);

cols.forEach(c=>{
html+="<th>"+c+"</th>";
});

html+="</tr>";

data.forEach(row=>{
html+="<tr>";

cols.forEach(c=>{
html+="<td>"+row[c]+"</td>";
});

html+="</tr>";
});

html+="</table></div>";

return html;

}

loadGame();

</script>

</body>
</html>
