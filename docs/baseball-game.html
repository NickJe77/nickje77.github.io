<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;color:#0b1220;}
  .navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
  .navbar a{text-decoration:none;color:#0056d6;font-size:18px;}
  .navbar a:hover{text-decoration:underline;}
  .page{max-width:1200px;margin:0 auto;padding:20px;}
  .hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:28px 30px;border-radius:20px;margin-bottom:14px;}
  .hero h1{margin:0 0 6px 0;font-size:26px;}
  .sub{opacity:.92;font-weight:800;line-height:1.4;}
  .error{background:#fff;border:1px solid #ffd4d4;color:#8a1f1f;border-radius:14px;padding:14px;font-weight:900;margin:12px 0;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }
  .card{background:#fff;border:1px solid #e6e8ee;border-radius:16px;overflow:hidden;}
  .card h2{margin:0;padding:12px 14px;font-size:16px;background:#fbfbfd;border-bottom:1px solid #e6e8ee;}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:10px 10px;border-bottom:1px solid #eef0f4;font-size:14px;text-align:left;white-space:nowrap;}
  tbody tr:nth-child(even){background:#fafbfc;}
  th{background:#002D72;color:#fff;font-weight:900;position:sticky;top:0;z-index:1;}
  .link{color:#0056d6;text-decoration:none;font-weight:900;}
  .link:hover{text-decoration:underline;}
  .muted{color:#667085;font-weight:900;}
</style>
</head>

<body>
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="mlb.html">MLB</a>
  </div>

  <div class="page">
    <div class="hero">
      <h1 id="title">MLB Game</h1>
      <div class="sub" id="meta">Build: MLB-GAME-GUARD-2026-02-24-22:10</div>
    </div>

    <div id="status"></div>

    <div class="grid">
      <div class="card">
        <h2 id="hBat">Home Batting</h2>
        <div style="overflow:auto;max-height:560px;">
          <table>
            <thead>
              <tr>
                <th>Player</th>
                <th title="At Bats">AB</th>
                <th title="Hits">H</th>
                <th title="Walks">BB</th>
                <th title="Strikeouts">SO</th>
              </tr>
            </thead>
            <tbody id="batHome"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2 id="aBat">Away Batting</h2>
        <div style="overflow:auto;max-height:560px;">
          <table>
            <thead>
              <tr>
                <th>Player</th>
                <th title="At Bats">AB</th>
                <th title="Hits">H</th>
                <th title="Walks">BB</th>
                <th title="Strikeouts">SO</th>
              </tr>
            </thead>
            <tbody id="batAway"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2 id="hPit">Home Pitching</h2>
        <div style="overflow:auto;max-height:560px;">
          <table>
            <thead>
              <tr>
                <th>Player</th>
                <th title="Innings Pitched">IP</th>
                <th title="Hits Allowed">H</th>
                <th title="Walks Allowed">BB</th>
                <th title="Strikeouts">SO</th>
              </tr>
            </thead>
            <tbody id="pitHome"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2 id="aPit">Away Pitching</h2>
        <div style="overflow:auto;max-height:560px;">
          <table>
            <thead>
              <tr>
                <th>Player</th>
                <th title="Innings Pitched">IP</th>
                <th title="Hits Allowed">H</th>
                <th title="Walks Allowed">BB</th>
                <th title="Strikeouts">SO</th>
              </tr>
            </thead>
            <tbody id="pitAway"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const gameId = params.get("game");
  const season = params.get("season");

  const status = document.getElementById("status");
  const title = document.getElementById("title");
  const meta = document.getElementById("meta");

  const batHome = document.getElementById("batHome");
  const batAway = document.getElementById("batAway");
  const pitHome = document.getElementById("pitHome");
  const pitAway = document.getElementById("pitAway");

  const hBat = document.getElementById("hBat");
  const aBat = document.getElementById("aBat");
  const hPit = document.getElementById("hPit");
  const aPit = document.getElementById("aPit");

  function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function playerLink(pid){
    if(!pid) return '<span class="muted">—</span>';
    // DO NOT TOUCH your player.html logic; just link by id
    return `<a class="link" href="baseball-player.html?player=${encodeURIComponent(pid)}">${esc(pid)}</a>`;
  }

  function renderBat(tbody, rows){
    tbody.innerHTML = "";
    if(!Array.isArray(rows) || !rows.length){
      tbody.innerHTML = `<tr><td class="muted" colspan="5">No data</td></tr>`;
      return;
    }
    rows.forEach(r => {
      tbody.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${playerLink(r.player_id)}</td>
          <td>${esc(r.AB)}</td>
          <td>${esc(r.H)}</td>
          <td>${esc(r.BB)}</td>
          <td>${esc(r.SO)}</td>
        </tr>
      `);
    });
  }

  function renderPit(tbody, rows){
    tbody.innerHTML = "";
    if(!Array.isArray(rows) || !rows.length){
      tbody.innerHTML = `<tr><td class="muted" colspan="5">No data</td></tr>`;
      return;
    }
    rows.forEach(r => {
      tbody.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${playerLink(r.player_id)}</td>
          <td>${esc(r.IP)}</td>
          <td>${esc(r.H)}</td>
          <td>${esc(r.BB)}</td>
          <td>${esc(r.SO)}</td>
        </tr>
      `);
    });
  }

  // Hard stop if broken link (prevents undefined.json fetch forever)
  if(!gameId || gameId === "undefined" || !season){
    status.innerHTML = `
      <div class="error">
        Broken link detected.<br><br>
        Expected URL like:<br>
        <span class="muted">baseball-game.html?season=2025&game=ANA202504040</span>
      </div>
    `;
    meta.textContent = "";
    return;
  }

  const gamePathCandidates = [
    `docs/data/baseball/games/${season}/${gameId}.json`,
    `data/baseball/games/${season}/${gameId}.json`
  ];

  async function fetchFirstJson(paths){
    let lastErr = null;
    for(const p of paths){
      try{
        const res = await fetch(p, { cache:"no-store" });
        if(!res.ok){ lastErr = new Error(`${res.status} ${res.statusText} (${p})`); continue; }
        return await res.json();
      }catch(e){ lastErr = e; }
    }
    throw lastErr || new Error("Unable to load game JSON");
  }

  async function init(){
    try{
      const data = await fetchFirstJson(gamePathCandidates);

      const home = data.home_code || "";
      const away = data.away_code || "";

      title.textContent = `${away} @ ${home}`;
      meta.textContent = `Season ${season} • Game ${data.game_id || gameId}`;

      hBat.textContent = `${home} Batting`;
      aBat.textContent = `${away} Batting`;
      hPit.textContent = `${home} Pitching`;
      aPit.textContent = `${away} Pitching`;

      renderBat(batHome, data.batters_home || []);
      renderBat(batAway, data.batters_away || []);
      renderPit(pitHome, data.pitchers_home || []);
      renderPit(pitAway, data.pitchers_away || []);

    }catch(e){
      status.innerHTML = `
        <div class="error">
          Could not load game file.<br><br>
          Tried:<br>
          <span class="muted">${gamePathCandidates.map(p=>esc(p)).join("<br>")}</span>
        </div>
      `;
    }
  }

  init();
})();
</script>
</body>
</html>
