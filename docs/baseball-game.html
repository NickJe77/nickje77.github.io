<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#0b2a6f,#c8102e);
color:white;
padding:30px;
border-radius:16px;
margin-bottom:20px;
text-align:center;
}

.section{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#123a7a;
color:white;
padding:8px;
}

td{
padding:8px;
}

tr:nth-child(even){
background:#eef3fb;
}

.error{
font-size:22px;
color:red;
text-align:center;
padding:40px;
}
</style>

</head>
<body>

<div class="page">
<div id="content">Loading game...</div>
</div>

<script>

function getID(){
const p=new URLSearchParams(location.search);
return p.get("id")||p.get("game");
}

async function load(){

const id=getID();

if(!id){
content.innerHTML='<div class="error">Invalid game link</div>';
return;
}

const year=id.substring(0,4);

const path="data/baseball/games/"+year+"/"+id+".json";

const r=await fetch(path);

if(!r.ok){
content.innerHTML='<div class="error">Game not found</div>';
return;
}

const game=await r.json();

render(game);

}

function render(game){

let html="";

html+=`
<div class="hero">
<h1>${game.away_code} ${game.away_score} - ${game.home_score} ${game.home_code}</h1>
<div>${game.date}</div>
</div>
`;

html+=table(game.awayBatTitle,game.awayBatting);
html+=table(game.homeBatTitle,game.homeBatting);
html+=table(game.awayPitchTitle,game.awayPitching);
html+=table(game.homePitchTitle,game.homePitching);

content.innerHTML=html;

}

function table(title,data){

if(!data)return "";

const cols=Object.keys(data[0]);

let html=`<div class="section"><h2>${title}</h2><table><tr>`;

cols.forEach(c=>html+="<th>"+c+"</th>");

html+="</tr>";

data.forEach(row=>{
html+="<tr>";
cols.forEach(c=>html+="<td>"+row[c]+"</td>");
html+="</tr>";
});

html+="</table></div>";

return html;

}

load();

</script>

</body>
</html>
