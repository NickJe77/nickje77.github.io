<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Arial;
    margin:0;
    background:#f4f6f8;
    color:#111;
  }

  .navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px 0;
    background:#fff;
    border-bottom:1px solid #ddd;
    font-weight:700;
  }
  .navbar a{ text-decoration:none; color:#0056d6; }
  .navbar a:hover{ text-decoration:underline; }

  .page{ max-width:1200px; margin:22px auto; padding:0 18px 40px; }

  .hero{
    background:linear-gradient(90deg,#002D72,#C8102E);
    color:#fff;
    padding:34px 26px;
    border-radius:22px;
    box-shadow:0 10px 26px rgba(0,0,0,0.18);
    margin-bottom:16px;
    text-align:center;
  }
  .hero .matchup{ font-size:44px; font-weight:900; letter-spacing:0.2px; }
  .hero .score{ font-size:74px; font-weight:900; margin-top:10px; }
  .hero .date{ margin-top:8px; opacity:0.95; font-size:18px; font-weight:800; }

  .card{
    background:#fff;
    border-radius:18px;
    padding:16px 18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.10);
    margin-bottom:14px;
  }
  .card h3{ margin:0 0 12px; font-size:20px; }

  .pillRow{ display:flex; flex-wrap:wrap; gap:10px; }
  .pill{
    background:#eef4ff;
    border:1px solid #d6e4ff;
    padding:8px 12px;
    border-radius:12px;
    font-weight:800;
    color:#0a2f6b;
  }

  table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:14px;
  }
  thead th{
    background:#002D72;
    color:#fff;
    padding:10px;
    text-align:center;
    font-weight:900;
    letter-spacing:0.3px;
    font-size:14px;
  }
  tbody td{
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:center;
    font-weight:700;
  }
  tbody td:first-child{ text-align:left; }
  tbody tr:nth-child(even){ background:#f0f6ff; }

  .player-link{
    color:#0056d6;
    text-decoration:none;
    font-weight:900;
  }
  .player-link:hover{ text-decoration:underline; }

  .errorBox{
    background:#fff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.10);
    border:2px solid #e53935;
    color:#b71c1c;
    font-weight:900;
    text-align:center;
    font-size:18px;
  }

  .debug{
    margin-top:12px;
    font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size:12px;
    background:#0b1020;
    color:#d7e3ff;
    padding:12px 14px;
    border-radius:14px;
    overflow:auto;
    line-height:1.45;
  }

  @media (max-width: 820px){
    .hero .matchup{ font-size:30px; }
    .hero .score{ font-size:56px; }
  }
</style>
</head>

<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-player.html">Players</a>
</div>

<div class="page">

  <div class="hero">
    <div class="matchup" id="matchup">Loading…</div>
    <div class="score" id="score">—</div>
    <div class="date" id="dateLine"></div>
  </div>

  <div id="err" style="display:none;"></div>

  <div class="card">
    <h3>Game Info</h3>
    <div class="pillRow">
      <div class="pill" id="venuePill">Venue: —</div>
      <div class="pill" id="attPill">Attendance: —</div>
    </div>
  </div>

  <div class="card">
    <h3>Linescore</h3>
    <div id="linescoreWrap"></div>
  </div>

  <div class="card">
    <h3 id="awayBatTitle">Away Batting</h3>
    <div id="awayBatWrap"></div>
  </div>

  <div class="card">
    <h3 id="homeBatTitle">Home Batting</h3>
    <div id="homeBatWrap"></div>
  </div>

  <div class="card">
    <h3 id="awayPitchTitle">Away Pitching</h3>
    <div id="awayPitchWrap"></div>
  </div>

  <div class="card">
    <h3 id="homePitchTitle">Home Pitching</h3>
    <div id="homePitchWrap"></div>
  </div>

  <div class="card" style="display:none;" id="debugCard">
    <h3>Debug</h3>
    <div class="debug" id="debugBox"></div>
  </div>

</div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);

  // Full team names (add more codes any time)
  const TEAM_NAMES = {
    NYA:"New York Yankees",
    BOS:"Boston Red Sox",
    LAN:"Los Angeles Dodgers",
    CHN:"Chicago Cubs",
    CHA:"Chicago White Sox",
    NYN:"New York Mets",
    PHI:"Philadelphia Phillies",
    SLN:"St. Louis Cardinals",
    ATL:"Atlanta Braves",
    HOU:"Houston Astros",
    SFN:"San Francisco Giants",
    SDN:"San Diego Padres",
    SEA:"Seattle Mariners",
    TOR:"Toronto Blue Jays",
    MIN:"Minnesota Twins",
    DET:"Detroit Tigers",
    CLE:"Cleveland Guardians",
    KCA:"Kansas City Royals",
    TBA:"Tampa Bay Rays",
    BAL:"Baltimore Orioles",
    OAK:"Oakland Athletics",
    LAA:"Los Angeles Angels",
    ARI:"Arizona Diamondbacks",
    COL:"Colorado Rockies",
    MIL:"Milwaukee Brewers",
    CIN:"Cincinnati Reds",
    PIT:"Pittsburgh Pirates",
    WAS:"Washington Nationals",
    MIA:"Miami Marlins",
    TEX:"Texas Rangers"
  };

  // Fallback ballparks by HOME team (so you never see "Unknown" if info rows are missing)
  const HOME_PARK_FALLBACK = {
    BOS:"Fenway Park",
    NYA:"Yankee Stadium",
    NYN:"Citi Field",
    PHI:"Citizens Bank Park",
    SLN:"Busch Stadium",
    CHN:"Wrigley Field",
    CHA:"Guaranteed Rate Field",
    LAN:"Dodger Stadium",
    SFN:"Oracle Park",
    SDN:"Petco Park",
    SEA:"T-Mobile Park",
    TOR:"Rogers Centre",
    ATL:"Truist Park",
    HOU:"Minute Maid Park",
    TEX:"Globe Life Field",
    TBA:"Tropicana Field",
    BAL:"Oriole Park at Camden Yards",
    OAK:"Oakland Coliseum",
    LAA:"Angel Stadium",
    ARI:"Chase Field",
    COL:"Coors Field",
    MIL:"American Family Field",
    CIN:"Great American Ball Park",
    PIT:"PNC Park",
    WAS:"Nationals Park",
    MIA:"loanDepot park",
    DET:"Comerica Park",
    MIN:"Target Field",
    CLE:"Progressive Field",
    KCA:"Kauffman Stadium"
  };

  let PLAYER_MAP = {};
  async function loadPlayers(){
    const res = await fetch("data/baseball/players.json", {cache:"no-store"});
    if(!res.ok) throw new Error("players.json not found");
    const data = await res.json();
    // supports either array of objects or object map
    if(Array.isArray(data)){
      data.forEach(p=>{
        const id = p.player_id || p.id || p.key;
        const name = p.name || p.full_name || p.player_name;
        if(id && name) PLAYER_MAP[id] = name;
      });
    }else{
      Object.keys(data).forEach(k=>{
        PLAYER_MAP[k] = data[k];
      });
    }
  }

  function safeName(pid){
    return PLAYER_MAP[pid] || pid || "Unknown";
  }

  function playerLink(pid){
    if(!pid) return "Unknown";
    return `<a class="player-link" href="baseball-player.html?id=${encodeURIComponent(pid)}">${safeName(pid)}</a>`;
  }

  function parseId(gameId){
    // expected: YYYY-MM-DD_AAA_BBB
    const m = (gameId||"").match(/^(\d{4})-(\d{2})-(\d{2})_([A-Z0-9]{2,4})_([A-Z0-9]{2,4})$/);
    if(!m) return null;
    return { year:+m[1], date:`${m[1]}-${m[2]}-${m[3]}`, away:m[4], home:m[5] };
  }

  async function fetchJson(url){
    const res = await fetch(url, {cache:"no-store"});
    if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return await res.json();
  }

  function showError(msg, debug){
    $("err").style.display = "block";
    $("err").innerHTML = `<div class="errorBox">${msg}</div>` + (debug?`<div class="debug">${debug}</div>`:"");
  }

  function extractVenue(game, parsed){
    // Retrosheet info row:
    // ["info","site","BOS07"] or ["info","park","Fenway Park"] etc
    const ev = game.events || [];
    let siteCode = null;
    let parkName = null;

    for(const e of ev){
      if(e && e[0]==="info"){
        const k = (e[1]||"").toLowerCase();
        if(k==="site") siteCode = e[2];
        if(k==="park") parkName = e[2];
      }
    }

    if(parkName && String(parkName).trim()) return String(parkName).trim();

    // If only a site code exists and you don't have a parks lookup, at least show the code.
    // But we prefer a human fallback from home team:
    const home = game.home_code || game.home_team || (parsed?parsed.home:null);
    const fallback = HOME_PARK_FALLBACK[home];
    if(fallback) return fallback;

    if(siteCode && String(siteCode).trim()) return String(siteCode).trim();

    return "Unknown";
  }

  // Robust processing: never crashes if start/sub are missing.
  function processGame(game, parsed){
    const events = game.events || [];

    const awayCode = game.away_code || game.away_team || (parsed?parsed.away:null) || "AWY";
    const homeCode = game.home_code || game.home_team || (parsed?parsed.home:null) || "HOM";

    // batting: player_id -> stats
    const bat = { away:{}, home:{} };

    // pitching: pitcher_id -> stats
    const pit = { away:{}, home:{} };

    // current pitchers (defense). When away is batting (team "0"), home is pitching.
    let curAwayPitcher = null; // away team pitcher (when home bats)
    let curHomePitcher = null; // home team pitcher (when away bats)

    // linescore innings 1..9
    const lines = {};
    let awayR = 0, homeR = 0;

    function ensureBat(side, pid){
      if(!bat[side][pid]) bat[side][pid] = {AB:0,H:0,RBI:0,BB:0,SO:0,HR:0};
      return bat[side][pid];
    }
    function ensurePit(side, pid){
      if(!pit[side][pid]) pit[side][pid] = {OUT:0,H:0,R:0,BB:0,SO:0,HR:0};
      return pit[side][pid];
    }
    function addInning(inning){
      if(!lines[inning]) lines[inning] = {away:0, home:0};
      return lines[inning];
    }

    // First pass: set pitchers from start/sub rows if present
    for(const e of events){
      if(!e) continue;
      if(e[0]==="start" || e[0]==="sub"){
        const player = e[1];
        const team = e[2]; // "0" away, "1" home
        const pos  = e[4]; // "1" pitcher
        if(pos==="1"){
          if(team==="0"){
            curAwayPitcher = player;
            ensurePit("away", player);
          }else if(team==="1"){
            curHomePitcher = player;
            ensurePit("home", player);
          }
        }
      }
      // Some files can switch pitchers later with sub rows; we will update again during the main loop.
    }

    // Main pass: walk in order, updating pitchers on sub rows + recording play stats
    for(const e of events){
      if(!e) continue;

      if(e[0]==="sub"){
        const player = e[1];
        const team = e[2];
        const pos  = e[4];
        if(pos==="1"){
          if(team==="0"){
            curAwayPitcher = player;
            ensurePit("away", player);
          }else if(team==="1"){
            curHomePitcher = player;
            ensurePit("home", player);
          }
        }
        continue;
      }

      if(e[0]!=="play") continue;

      const inning = parseInt(e[1],10);
      const batTeamFlag = e[2]; // "0" away batting, "1" home batting
      const batter = e[3];
      const desc = e[6] || "";

      const sideBat = (batTeamFlag==="0") ? "away" : "home";
      const sideDef = (batTeamFlag==="0") ? "home" : "away"; // defense/pitching side

      // Determine current pitcher for defensive team
      let pitcher = (sideDef==="home") ? curHomePitcher : curAwayPitcher;

      // If pitcher is missing, use a stable placeholder so we don't crash
      if(!pitcher) pitcher = (sideDef==="home") ? "UNKNOWN_HOME_PITCHER" : "UNKNOWN_AWAY_PITCHER";

      const b = ensureBat(sideBat, batter);
      const p = ensurePit(sideDef, pitcher);

      // AB logic: walks do NOT count as AB
      const isWalk = desc.startsWith("W") || desc.startsWith("IW");
      const isStrikeout = desc.startsWith("K");
      const isHitSingle = desc.startsWith("S");
      const isHitDouble = desc.startsWith("D");
      const isHitTriple = desc.startsWith("T");
      const isHR = desc.includes("HR");

      if(!isWalk) b.AB++;

      if(isStrikeout){ b.SO++; p.SO++; }

      if(isWalk){ b.BB++; p.BB++; }

      if(isHR){
        b.H++; b.HR++; p.H++; p.HR++;
      }else if(isHitSingle || isHitDouble || isHitTriple){
        b.H++; p.H++;
      }

      // RBI heuristic from run-scoring markers
      const rbi = (desc.match(/\.[123]-H/g) || []).length + (isHR ? 1 : 0);
      if(rbi){
        b.RBI += rbi;
        const ln = addInning(inning);
        if(sideBat==="away"){ ln.away += rbi; awayR += rbi; }
        else { ln.home += rbi; homeR += rbi; }
        p.R += rbi;
      }

      // Outs pitched heuristic:
      // We can't perfectly decode every Retrosheet play result without a full parser.
      // But we CAN count one "out opportunity" only when the play is very likely an out.
      // This avoids IP exploding.
      const looksLikeOut =
        desc.startsWith("K") ||
        desc.includes("/G") || desc.includes("/F") || desc.includes("/L") ||
        desc.match(/^\d/) ||            // "6/G6" etc
        desc.includes("DP") || desc.includes("TP");

      if(looksLikeOut) p.OUT += 1;
    }

    return { awayCode, homeCode, bat, pit, lines, awayR, homeR };
  }

  function renderLinescore(lines, awayName, homeName, awayR, homeR){
    let html = `<table><thead><tr>
      <th></th>${[1,2,3,4,5,6,7,8,9].map(i=>`<th>${i}</th>`).join("")}
      <th>R</th></tr></thead><tbody>`;

    html += `<tr><td>${awayName}</td>` +
      [1,2,3,4,5,6,7,8,9].map(i=>`<td>${lines[i]?.away ?? 0}</td>`).join("") +
      `<td>${awayR}</td></tr>`;

    html += `<tr><td>${homeName}</td>` +
      [1,2,3,4,5,6,7,8,9].map(i=>`<td>${lines[i]?.home ?? 0}</td>`).join("") +
      `<td>${homeR}</td></tr>`;

    html += `</tbody></table>`;
    $("linescoreWrap").innerHTML = html;
  }

  function renderBatTable(sideBat, titleEl, wrapEl, teamName, batMap){
    titleEl.textContent = `${teamName} Batting`;

    const rows = Object.entries(batMap)
      .filter(([pid,st]) => st && (st.AB>0 || st.BB>0))
      .map(([pid,st]) => `
        <tr>
          <td>${playerLink(pid)}</td>
          <td>${st.AB}</td><td>${st.H}</td><td>${st.RBI}</td><td>${st.BB}</td><td>${st.SO}</td><td>${st.HR}</td>
        </tr>
      `).join("");

    wrapEl.innerHTML = `
      <table>
        <thead><tr>
          <th>Player</th><th>AB</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>HR</th>
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="7" style="text-align:left;">No batting data found</td></tr>`}</tbody>
      </table>`;
  }

  function renderPitchTable(titleEl, wrapEl, teamName, pitMap){
    titleEl.textContent = `${teamName} Pitching`;

    const rows = Object.entries(pitMap)
      .filter(([pid,st]) => st && (st.OUT>0 || st.H>0 || st.R>0 || st.BB>0 || st.SO>0))
      .map(([pid,st]) => {
        const ip = (st.OUT/3).toFixed(1);
        const label = (pid==="UNKNOWN_HOME_PITCHER" || pid==="UNKNOWN_AWAY_PITCHER")
          ? "Unknown (data missing)"
          : playerLink(pid);
        return `
          <tr>
            <td>${label}</td>
            <td>${ip}</td><td>${st.H}</td><td>${st.R}</td><td>${st.BB}</td><td>${st.SO}</td><td>${st.HR}</td>
          </tr>`;
      }).join("");

    wrapEl.innerHTML = `
      <table>
        <thead><tr>
          <th>Pitcher</th><th>IP</th><th>H</th><th>R</th><th>BB</th><th>SO</th><th>HR</th>
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="7" style="text-align:left;">No pitching data found in this file</td></tr>`}</tbody>
      </table>`;
  }

  async function load(){
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    if(!id){
      showError("Missing game id", "Expected: baseball-game.html?id=YYYY-MM-DD_AWAY_HOME");
      return;
    }

    const parsed = parseId(id);
    if(!parsed){
      showError("Bad game id format", `Got: ${id}\nExpected: YYYY-MM-DD_AWAY_HOME`);
      return;
    }

    let debug = `Game id: ${id}\n`;
    try{
      await loadPlayers();
      debug += "Loaded players.json OK\n";
    }catch(e){
      debug += `players.json FAILED: ${e.message}\n`;
      // still continue; names will fall back to ids
    }

    const candidates = [
      `data/baseball/boxscores/${parsed.year}/${id}.json`,
      `data/baseball/boxscores/${id}.json`,
      `data/baseball/games/${parsed.year}/${id}.json`,
      `data/baseball/games/${id}.json`
    ];

    let game = null;
    for(const url of candidates){
      try{
        debug += `Trying: ${url} ... `;
        game = await fetchJson(url);
        debug += "FOUND\n";
        break;
      }catch(e){
        debug += `FAIL (${e.message})\n`;
      }
    }

    if(!game){
      showError("Game not found", debug);
      $("debugCard").style.display = "block";
      $("debugBox").textContent = debug;
      return;
    }

    const awayCode = game.away_code || parsed.away;
    const homeCode = game.home_code || parsed.home;

    const awayName = TEAM_NAMES[awayCode] || awayCode;
    const homeName = TEAM_NAMES[homeCode] || homeCode;

    $("matchup").textContent = `${awayName} @ ${homeName}`;
    $("dateLine").textContent = game.date || parsed.date;

    const venue = extractVenue(game, parsed);
    $("venuePill").textContent = `Venue: ${venue}`;

    // Attendance is not in your sample JSON; keep it as —
    $("attPill").textContent = `Attendance: ${game.attendance ?? "—"}`;

    // Compute everything safely (NO crashes)
    const stats = processGame(game, parsed);

    $("score").textContent = `${stats.awayR} - ${stats.homeR}`;

    renderLinescore(stats.lines, awayName, homeName, stats.awayR, stats.homeR);

    renderBatTable("away", $("awayBatTitle"), $("awayBatWrap"), awayName, stats.bat.away);
    renderBatTable("home", $("homeBatTitle"), $("homeBatWrap"), homeName, stats.bat.home);

    renderPitchTable($("awayPitchTitle"), $("awayPitchWrap"), awayName, stats.pit.away);
    renderPitchTable($("homePitchTitle"), $("homePitchWrap"), homeName, stats.pit.home);

    // Uncomment this if you ever want the debug box visible:
    // $("debugCard").style.display = "block";
    // $("debugBox").textContent = debug;

  }

  load();

})();
</script>
</body>
</html>
