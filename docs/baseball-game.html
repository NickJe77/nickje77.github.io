<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:28px;border-radius:20px;margin-bottom:14px;}
.hero h1{margin:0;font-size:42px;}
.infoRow{display:flex;gap:12px;margin-bottom:14px;}
.infoBox{background:#fff;padding:10px 14px;border-radius:12px;font-weight:700;}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:14px;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:#fff;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="date"></div>
</div>

<div class="infoRow">
<div class="infoBox" id="venue">Venue: —</div>
</div>

<div class="card">
<h2>Batting</h2>
<div class="split">

<div>
<h3>Away</h3>
<table>
<thead>
<tr><th>Player</th><th>PA</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div>
<h3>Home</h3>
<table>
<thead>
<tr><th>Player</th><th>PA</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

</div>
</div>


<div class="card">
<h2>Pitching</h2>

<div class="split">

<div>
<h3>Away Pitching</h3>
<table>
<thead>
<tr><th>Pitcher</th><th>IP</th><th>H</th><th>BB</th><th>SO</th></tr>
</thead>
<tbody id="awayPitch"></tbody>
</table>
</div>

<div>
<h3>Home Pitching</h3>
<table>
<thead>
<tr><th>Pitcher</th><th>IP</th><th>H</th><th>BB</th><th>SO</th></tr>
</thead>
<tbody id="homePitch"></tbody>
</table>
</div>

</div>

</div>

</div>


<script>

const id=new URLSearchParams(location.search).get("id");
const year=id.substring(0,4);

const GAME_PATH=`data/baseball/boxscores/${year}/${id}.json`;

let PLAYERS={};
let TEAMS={};
let PARKS={};

function pname(id){return PLAYERS[id]||id;}
function tname(id){return TEAMS[id]||id;}

function ip(outs){
return Math.floor(outs/3)+"."+(outs%3);
}

async function loadRefs(){

/* PLAYERS */

const players=await fetch("data/baseball/players.json").then(r=>r.json());

if(Array.isArray(players)){
players.forEach(p=>{
const id=p.id||p.player_id||p.playerID;
const name=p.name||p.full_name||(p.nameFirst+" "+p.nameLast);
if(id&&name) PLAYERS[id]=name;
});
}else{
Object.assign(PLAYERS,players);
}

/* TEAMS */

const teams=await fetch("data/baseball/teams.json").then(r=>r.json());

if(Array.isArray(teams)){
teams.forEach(t=>{
const code=t.code||t.id||t.team_code;
const name=t.name||t.full_name||t.team_name;
if(code&&name) TEAMS[code]=name;
});
}else{
Object.assign(TEAMS,teams);
}

/* BALLPARKS */

const csv=await fetch("data/baseball/ballparks.csv").then(r=>r.text());

csv.split("\n").forEach(line=>{
const parts=line.split(",");
if(parts.length>=2) PARKS[parts[0]]=parts[1];
});

}

async function loadGame(){

await loadRefs();

const game=await fetch(GAME_PATH).then(r=>r.json());

document.getElementById("title").textContent=
tname(game.away_code)+" @ "+tname(game.home_code);

document.getElementById("date").textContent=game.date;


/* venue */

game.events.forEach(e=>{
if(e[0]==="info"&&e[1]==="site"){
document.getElementById("venue").textContent=
"Venue: "+(PARKS[e[2]]||e[2]);
}
});


const awayBat={},homeBat={};
const awayPitch={},homePitch={};

let awayPitcher=null;
let homePitcher=null;

/* detect pitchers properly */

game.events.forEach(e=>{

if(e[0]==="start"||e[0]==="sub"){

const player=e[1];
const team=e[3];
const pos=e[5];

if(pos==="1"){

if(team==="0") awayPitcher=player;
else homePitcher=player;

}

}

/* plays */

if(e[0]==="play"){

const team=e[2];
const batter=e[3];
const ev=e[6];

if(team==="0"){

if(!awayBat[batter]) awayBat[batter]={pa:0,h:0,bb:0,so:0,hr:0};
const b=awayBat[batter];

b.pa++;

if(ev.startsWith("S")||ev.startsWith("D")||ev.startsWith("T")||ev.startsWith("HR")) b.h++;
if(ev.startsWith("W")) b.bb++;
if(ev.startsWith("K")) b.so++;
if(ev.startsWith("HR")) b.hr++;

if(homePitcher){

if(!homePitch[homePitcher]) homePitch[homePitcher]={outs:0,h:0,bb:0,so:0};

const p=homePitch[homePitcher];

if(!ev.startsWith("S")&&!ev.startsWith("D")&&!ev.startsWith("T")&&!ev.startsWith("HR")&&!ev.startsWith("W"))
p.outs++;

if(ev.startsWith("S")||ev.startsWith("D")||ev.startsWith("T")||ev.startsWith("HR")) p.h++;
if(ev.startsWith("W")) p.bb++;
if(ev.startsWith("K")) p.so++;

}

}else{

if(!homeBat[batter]) homeBat[batter]={pa:0,h:0,bb:0,so:0,hr:0};
const b=homeBat[batter];

b.pa++;

if(ev.startsWith("S")||ev.startsWith("D")||ev.startsWith("T")||ev.startsWith("HR")) b.h++;
if(ev.startsWith("W")) b.bb++;
if(ev.startsWith("K")) b.so++;
if(ev.startsWith("HR")) b.hr++;

if(awayPitcher){

if(!awayPitch[awayPitcher]) awayPitch[awayPitcher]={outs:0,h:0,bb:0,so:0};

const p=awayPitch[awayPitcher];

if(!ev.startsWith("S")&&!ev.startsWith("D")&&!ev.startsWith("T")&&!ev.startsWith("HR")&&!ev.startsWith("W"))
p.outs++;

if(ev.startsWith("S")||ev.startsWith("D")||ev.startsWith("T")||ev.startsWith("HR")) p.h++;
if(ev.startsWith("W")) p.bb++;
if(ev.startsWith("K")) p.so++;

}

}

}

});


function renderBat(id,data){

const tbody=document.getElementById(id);

Object.entries(data).forEach(([pid,s])=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${pname(pid)}</td>
<td>${s.pa}</td>
<td>${s.h}</td>
<td>${s.bb}</td>
<td>${s.so}</td>
<td>${s.hr}</td>
`;

tbody.appendChild(tr);

});

}

function renderPitch(id,data){

const tbody=document.getElementById(id);

Object.entries(data).forEach(([pid,s])=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${pname(pid)}</td>
<td>${ip(s.outs)}</td>
<td>${s.h}</td>
<td>${s.bb}</td>
<td>${s.so}</td>
`;

tbody.appendChild(tr);

});

}

renderBat("awayBat",awayBat);
renderBat("homeBat",homeBat);

renderPitch("awayPitch",awayPitch);
renderPitch("homePitch",homePitch);

}

loadGame();

</script>

</body>
</html>
