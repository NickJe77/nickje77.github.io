<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:28px;border-radius:20px;margin-bottom:14px;}
.hero h1{margin:0;font-size:42px;}
.section{background:#fff;padding:16px;border-radius:16px;margin-bottom:14px;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.teamTitle{font-weight:900;font-size:18px;margin:6px 0 8px 0;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:#fff;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading…</h1>
<div id="date"></div>
<div id="venue">Venue: —</div>
</div>

<div class="section">
<h2>Batting</h2>

<div class="split">

<div>
<div class="teamTitle" id="awayName"></div>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div>
<div class="teamTitle" id="homeName"></div>
<table>
<thead>
<tr>
<th>Player</th>
<th>PA</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
<th>HR</th>
</tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>

</div>
</div>

</div>

<script>

const params=new URLSearchParams(location.search)
const gameId=params.get("id")

if(!gameId){
document.getElementById("title").textContent="No game id"
throw new Error("Missing id")
}

const year=gameId.substring(3,7)

const gameUrl=`data/baseball/boxscores/${year}/${gameId}.json`

Promise.all([
fetch(gameUrl).then(r=>r.json()),
fetch("data/baseball/players.json").then(r=>r.json()),
fetch("data/baseball/teams.json").then(r=>r.json())
])
.then(([game,players,teams])=>{

const PLAYER={}
for(const p of players){
PLAYER[p.id]=p.name
}

const TEAM={}
for(const t of teams){
TEAM[t.code]=t.name
}

const awayCode=game.away_code
const homeCode=game.home_code

const awayName=TEAM[awayCode]||awayCode
const homeName=TEAM[homeCode]||homeCode

document.getElementById("title").textContent=`${awayName} @ ${homeName}`
document.getElementById("date").textContent=game.date
document.getElementById("awayName").textContent=awayName
document.getElementById("homeName").textContent=homeName

const awayStats={}
const homeStats={}

for(const e of game.events){

if(e[0]!=="play") continue

const team=e[2]
const batter=e[3]
const ev=e[6]

const target=team==="0"?awayStats:homeStats

if(!target[batter]) target[batter]={pa:0,h:0,bb:0,so:0,hr:0}

target[batter].pa++

if(ev.startsWith("S")||ev.startsWith("D")||ev.startsWith("T")||ev.startsWith("HR"))
target[batter].h++

if(ev.startsWith("W"))
target[batter].bb++

if(ev.startsWith("K"))
target[batter].so++

if(ev.startsWith("HR"))
target[batter].hr++

}

function render(id,data){

const tbody=document.getElementById(id)

for(const pid in data){

const name=PLAYER[pid]||pid
const s=data[pid]

const tr=document.createElement("tr")

tr.innerHTML=`
<td>${name}</td>
<td>${s.pa}</td>
<td>${s.h}</td>
<td>${s.bb}</td>
<td>${s.so}</td>
<td>${s.hr}</td>
`

tbody.appendChild(tr)

}

}

render("awayBat",awayStats)
render("homeBat",homeStats)

})
.catch(err=>{

document.getElementById("title").textContent="FAILED TO LOAD GAME"
console.error(err)

})

</script>

</body>
</html>
