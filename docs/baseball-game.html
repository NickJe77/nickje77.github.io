<!DOCTYPE html>

<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Baseball Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}

.section{background:white;padding:18px;border-radius:16px;margin-bottom:20px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:white;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
</style>

</head>

<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
<a href="./baseball-teams.html">Teams</a>
<a href="./baseball-players.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title"></h1>
</div>

<div class="section">
<h2>Game Details</h2>
<div id="meta"></div>
</div>

<div class="grid">
<div class="section"><h2 id="awayBatTitle"></h2><div id="awayBatting"></div></div>
<div class="section"><h2 id="homeBatTitle"></h2><div id="homeBatting"></div></div>
<div class="section"><h2 id="awayPitchTitle"></h2><div id="awayPitching"></div></div>
<div class="section"><h2 id="homePitchTitle"></h2><div id="homePitching"></div></div>
</div>

</div>

<script>

let PLAYERS={}

async function loadPlayers(){
  try{
    const r=await fetch("/data/baseball/players.json")
    const d=await r.json()
    d.forEach(p=>{
      PLAYERS[p.short_id||p.player_id]=p.name
      PLAYERS[p.player_id]=p.name
    })
  }catch{}
}

function playerName(id){return PLAYERS[id]||id}

// -------------------------
// BUILD STATS FROM EVENTS
// -------------------------
function buildStats(events){

  const batting={}
  const pitching={}

  events.forEach(e=>{
    if(e[0]!=="play") return

    const player=e[3]
    const result=e[6]

    if(!batting[player]){
      batting[player]={player_id:player,AB:0,H:0,BB:0,SO:0}
    }

    if(!pitching[player]){
      pitching[player]={player_id:player,IP:0,H:0,BB:0,SO:0}
    }

    if(result==="S"||result==="D"||result==="T"||result==="HR"){
      batting[player].AB++
      batting[player].H++
    }
    else if(result==="K"){
      batting[player].AB++
      batting[player].SO++
    }
    else if(result==="W"){
      batting[player].BB++
    }
    else{
      batting[player].AB++
    }

    if(result==="K") pitching[player].SO++
    if(result==="W") pitching[player].BB++
    if(result==="S"||result==="D"||result==="T"||result==="HR") pitching[player].H++
  })

  return {
    batting:Object.values(batting),
    pitching:Object.values(pitching)
  }
}

// -------------------------
function renderTable(id,data){

  if(!data.length){
    document.getElementById(id).innerHTML="No data"
    return
  }

  const keys=Object.keys(data[0]).filter(k=>k!=="player_id")

  let html="<table><thead><tr><th>Player</th>"
  keys.forEach(k=>html+=`<th>${k}</th>`)
  html+="</tr></thead><tbody>"

  data.forEach(p=>{
    html+=`<tr><td>${playerName(p.player_id)}</td>`
    keys.forEach(k=>html+=`<td>${p[k]}</td>`)
    html+="</tr>"
  })

  html+="</tbody></table>"

  document.getElementById(id).innerHTML=html
}

// -------------------------
// LOAD GAME (FIXED)
// -------------------------
async function loadGame(){

  const gameParam = new URLSearchParams(location.search).get("game")
  const season = new URLSearchParams(location.search).get("season")

  if(!gameParam || !season){
    document.getElementById("title").innerText="Game not found"
    return
  }

  let game = null

  // ✅ TRY OLD FORMAT FIRST (2025)
  try{
    let res = await fetch(`/data/baseball/boxscores/${season}/${gameParam}.json`)
    if(res.ok) game = await res.json()
  }catch{}

  // ✅ IF FAIL → TRY 2026 FORMAT
  if(!game){

    try{
      const date = gameParam.slice(3,11)
      const yyyy = date.slice(0,4)
      const mm = date.slice(4,6)
      const dd = date.slice(6,8)

      const formatted = `${yyyy}-${mm}-${dd}`

      // brute guess filenames
      const teams = ["ARI","ATL","BAL","BOS","CHC","CIN","CLE","COL","DET","HOU","KC","LAD","MIA","MIL","MIN","NYM","NYY","OAK","PHI","PIT","SD","SEA","SF","STL","TB","TEX","TOR","WSH"]

      for(const away of teams){
        for(const home of teams){

          const fname = `${formatted}_${away}_${home}.json`

          try{
            let res = await fetch(`/data/baseball/boxscores/${season}/${fname}`)
            if(res.ok){
              game = await res.json()
              break
            }
          }catch{}

        }
        if(game) break
      }

    }catch{}
  }

  if(!game){
    document.getElementById("title").innerText="Game not found"
    return
  }

  render(game)
}

// -------------------------
function render(game){

  document.getElementById("title").innerText=`${game.away_team} @ ${game.home_team}`
  document.getElementById("meta").innerText=`Date: ${game.date}`

  document.getElementById("awayBatTitle").innerText=`${game.away_team} Batting`
  document.getElementById("homeBatTitle").innerText=`${game.home_team} Batting`
  document.getElementById("awayPitchTitle").innerText=`${game.away_team} Pitching`
  document.getElementById("homePitchTitle").innerText=`${game.home_team} Pitching`

  if(game.batters_away){
    renderTable("awayBatting",game.batters_away)
    renderTable("homeBatting",game.batters_home)
    renderTable("awayPitching",game.pitchers_away)
    renderTable("homePitching",game.pitchers_home)
  }
  else{
    const stats=buildStats(game.events)

    renderTable("awayBatting",stats.batting)
    renderTable("homeBatting",stats.batting)
    renderTable("awayPitching",stats.pitching)
    renderTable("homePitching",stats.pitching)
  }
}

// -------------------------
async function init(){
  await loadPlayers()
  await loadGame()
}
init()

</script>

</body>
</html>
