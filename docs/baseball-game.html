<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
font-size:18px;
}

.page{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#002D72,#BA0C2F);
color:white;
padding:40px;
border-radius:18px;
text-align:center;
box-shadow:0 4px 14px rgba(0,0,0,0.2);
}

.hero .teams{
font-size:34px;
font-weight:700;
}

.hero .score{
font-size:64px;
font-weight:800;
margin-top:10px;
}

.hero .date{
font-size:18px;
margin-top:10px;
opacity:0.9;
}

/* CARDS */

.card{
background:white;
padding:18px;
border-radius:14px;
margin-top:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
margin-top:0;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

/* ERROR */

.error{
background:white;
padding:40px;
border-radius:14px;
text-align:center;
color:#c62828;
font-size:22px;
font-weight:700;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div id="content">

<div class="hero">

<div id="teams" class="teams"></div>

<div id="score" class="score"></div>

<div id="date" class="date"></div>

</div>

<div id="linescoreCard" class="card"></div>

<div id="battingAwayCard" class="card"></div>

<div id="battingHomeCard" class="card"></div>

<div id="pitchingAwayCard" class="card"></div>

<div id="pitchingHomeCard" class="card"></div>

</div>

</div>

<script>

/* GET GAME ID */

const params = new URLSearchParams(location.search);
const gameId = params.get("id");

if(!gameId){

document.getElementById("content").innerHTML =
"<div class='error'>Missing Game ID</div>";

throw new Error();

}

/* ELEMENTS */

const teamsEl = document.getElementById("teams");
const scoreEl = document.getElementById("score");
const dateEl = document.getElementById("date");

const linescoreCard = document.getElementById("linescoreCard");

const battingAwayCard = document.getElementById("battingAwayCard");
const battingHomeCard = document.getElementById("battingHomeCard");

const pitchingAwayCard = document.getElementById("pitchingAwayCard");
const pitchingHomeCard = document.getElementById("pitchingHomeCard");

/* TEAM MAP */

let teamMap = {};

async function loadTeams(){

const res = await fetch("/data/baseball/teams.json");

const teams = await res.json();

teams.forEach(t=>{
teamMap[t.code] = t.name;
});

}

/* LOAD GAME */

async function loadGame(){

try{

await loadTeams();

const year = gameId.substring(0,4);

const path =
"/data/baseball/boxscores/" +
year + "/" +
gameId + ".json";

const res = await fetch(path);

if(!res.ok)
throw new Error();

const game = await res.json();

renderGame(game);

}catch{

document.getElementById("content").innerHTML =
"<div class='error'>Game not found</div>";

}

}

/* RENDER */

function renderGame(game){

const awayName =
teamMap[game.away_code] || game.away_code;

const homeName =
teamMap[game.home_code] || game.home_code;

/* HERO */

teamsEl.textContent =
awayName + " @ " + homeName;

scoreEl.textContent =
game.away_score + " - " + game.home_score;

dateEl.textContent =
game.date;

/* LINE SCORE */

if(game.linescore){

let html =
"<h2>Line Score</h2><table>";

html += "<tr><th></th>";

game.linescore.away.forEach((_,i)=>{
html += "<th>" + (i+1) + "</th>";
});

html += "<th>R</th></tr>";

html += "<tr><td>"+awayName+"</td>";

game.linescore.away.forEach(v=>{
html += "<td>"+v+"</td>";
});

html += "<td>"+game.away_score+"</td></tr>";

html += "<tr><td>"+homeName+"</td>";

game.linescore.home.forEach(v=>{
html += "<td>"+v+"</td>";
});

html += "<td>"+game.home_score+"</td></tr>";

html += "</table>";

linescoreCard.innerHTML = html;

}

/* BATTING */

renderBatting(
battingAwayCard,
awayName,
game.batting_away
);

renderBatting(
battingHomeCard,
homeName,
game.batting_home
);

/* PITCHING */

renderPitching(
pitchingAwayCard,
awayName,
game.pitching_away
);

renderPitching(
pitchingHomeCard,
homeName,
game.pitching_home
);

}

/* BATTING TABLE */

function renderBatting(card, team, data){

if(!data) return;

let html =
"<h2>"+team+" Batting</h2><table>";

html +=
"<tr><th>Player</th><th>AB</th><th>R</th><th>H</th><th>RBI</th></tr>";

data.forEach(p=>{

html += "<tr>";

html += "<td>"+p.player+"</td>";
html += "<td>"+p.ab+"</td>";
html += "<td>"+p.r+"</td>";
html += "<td>"+p.h+"</td>";
html += "<td>"+p.rbi+"</td>";

html += "</tr>";

});

html += "</table>";

card.innerHTML = html;

}

/* PITCHING TABLE */

function renderPitching(card, team, data){

if(!data) return;

let html =
"<h2>"+team+" Pitching</h2><table>";

html +=
"<tr><th>Pitcher</th><th>IP</th><th>H</th><th>R</th><th>SO</th></tr>";

data.forEach(p=>{

html += "<tr>";

html += "<td>"+p.pitcher+"</td>";
html += "<td>"+p.ip+"</td>";
html += "<td>"+p.h+"</td>";
html += "<td>"+p.r+"</td>";
html += "<td>"+p.so+"</td>";

html += "</tr>";

});

html += "</table>";

card.innerHTML = html;

}

loadGame();

</script>

</body>
</html>
