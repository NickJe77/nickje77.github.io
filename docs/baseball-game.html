<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1000px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
text-align:center;
}

.score{
font-size:48px;
font-weight:800;
margin-top:10px;
}

.meta{
background:white;
padding:16px;
border-radius:12px;
margin-top:16px;
font-size:18px;
}

.error{
color:red;
font-weight:700;
text-align:center;
padding:40px;
}

</style>

</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">

<div id="teams">Loading...</div>

<div id="score" class="score"></div>

</div>

<div id="meta" class="meta"></div>

</div>

<script>

const params = new URLSearchParams(location.search);

const gameId = params.get("id");

const teams = document.getElementById("teams");
const score = document.getElementById("score");
const meta = document.getElementById("meta");

if(!gameId){

teams.innerHTML =
"<div class='error'>Missing game ID</div>";

throw new Error("Missing ID");

}

async function loadGame(){

try{

const path =
"data/baseball/boxscores/" + gameId + ".json";

const res = await fetch(path);

if(!res.ok)
throw new Error("File not found: " + path);

const game = await res.json();

/* display */

teams.textContent =
game.away_team + " @ " + game.home_team;

score.textContent =
game.away_score + " - " + game.home_score;

meta.innerHTML =
"<b>Date:</b> " + game.date +
"<br><b>Season:</b> " + game.season +
"<br><b>Away:</b> " + game.away_team +
"<br><b>Home:</b> " + game.home_team;

}
catch(e){

console.error(e);

teams.innerHTML =
"<div class='error'>Game not found</div>";

}

}

loadGame();

</script>

</body>
</html>
