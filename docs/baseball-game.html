<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;padding:34px;border-radius:20px;margin-bottom:18px;text-align:center;
}

.matchup{font-size:42px;font-weight:900;}
.score{font-size:72px;font-weight:900;margin-top:8px;}
.date{font-size:18px;margin-top:6px;font-weight:700;}

.card{
background:#fff;padding:18px;border-radius:16px;
box-shadow:0 4px 14px rgba(0,0,0,0.12);margin-bottom:18px;
}

.card h3{margin:0 0 10px;}

.meta{
display:flex;gap:18px;flex-wrap:wrap;font-weight:700;
}

.meta span{
background:#f0f6ff;border:1px solid #d9e7ff;
padding:8px 12px;border-radius:12px;
}

table{width:100%;border-collapse:collapse;}

th{
background:#002D72;color:#fff;
padding:10px;text-align:center;
}

td{
padding:10px;border-bottom:1px solid #eee;
}

tr:nth-child(even){background:#f0f6ff;}

.linescore td{text-align:center;font-weight:600;}
.linescore td:first-child{text-align:left;font-weight:800;}

.player-table th{text-align:left;}
.player-table td{text-align:left;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<div class="matchup" id="matchup">Loading…</div>
<div class="score" id="score">—</div>
<div class="date" id="date"></div>
</div>

<div class="card">
<h3>Game Info</h3>
<div class="meta">
<span id="venue">Venue: —</span>
<span id="attendance">Attendance: —</span>
</div>
</div>

<div class="card">
<h3>Linescore</h3>
<table class="linescore">
<thead id="linescoreHead"></thead>
<tbody id="linescoreBody"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayBatTitle"></h3>
<table class="player-table">
<thead><tr><th>Player</th></tr></thead>
<tbody id="awayBat"></tbody>
</table>
</div>

<div class="card">
<h3 id="homeBatTitle"></h3>
<table class="player-table">
<thead><tr><th>Player</th></tr></thead>
<tbody id="homeBat"></tbody>
</table>
</div>

<div class="card">
<h3 id="awayPitchTitle"></h3>
<table class="player-table">
<thead><tr><th>Pitcher</th></tr></thead>
<tbody id="awayPitch"></tbody>
</table>
</div>

<div class="card">
<h3 id="homePitchTitle"></h3>
<table class="player-table">
<thead><tr><th>Pitcher</th></tr></thead>
<tbody id="homePitch"></tbody>
</table>
</div>

</div>

<script>

const TEAM_NAMES={
NYA:"New York Yankees",
BOS:"Boston Red Sox",
LAN:"Los Angeles Dodgers",
SFN:"San Francisco Giants",
CHN:"Chicago Cubs",
SLN:"St Louis Cardinals",
ATL:"Atlanta Braves",
NYN:"New York Mets"
};

function teamName(code){
return TEAM_NAMES[code]||code;
}


/* LOAD PLAYER MAP — YOUR EXACT FILE */
async function loadPlayerMap(){

const res=await fetch("data/baseball/players.json");

if(!res.ok)return new Map();

const data=await res.json();

const map=new Map();

for(const p of data){

const id=p.retrosheet_id||p.player_id||p.id;

const name=
p.name||
p.full_name||
p.fullName||
p.player_name||
(p.first_name&&p.last_name?p.first_name+" "+p.last_name:null);

if(id&&name)
map.set(id,name);

}

return map;
}


function extractInfo(events){

const info={};

for(const e of events)
if(e[0]=="info")
info[e[1]]=e[2];

return info;

}


function calcLinescore(events){

const innings=[];
let awayTotal=0;
let homeTotal=0;

for(const e of events){

if(e[0]!="play")continue;

const inning=parseInt(e[1]);
const half=parseInt(e[2]);
const desc=e[6]||"";

const runs=(desc.match(/\.[123]-H/g)||[]).length+(desc.includes("HR")?1:0);

if(!innings[inning])innings[inning]={away:0,home:0};

if(half==0){
innings[inning].away+=runs;
awayTotal+=runs;
}
else{
innings[inning].home+=runs;
homeTotal+=runs;
}

}

let max=9;

for(let i=innings.length-1;i>=1;i--)
if(innings[i]){
max=Math.max(9,i);
break;
}

return{innings,max,awayTotal,homeTotal};

}


function buildLinescore(ls,away,home){

let head="<tr><th></th>";

for(let i=1;i<=ls.max;i++)
head+="<th>"+i+"</th>";

head+="<th>R</th></tr>";

document.getElementById("linescoreHead").innerHTML=head;


let awayRow="<tr><td>"+away+"</td>";
let homeRow="<tr><td>"+home+"</td>";

for(let i=1;i<=ls.max;i++){

awayRow+="<td>"+(ls.innings[i]?.away||0)+"</td>";
homeRow+="<td>"+(ls.innings[i]?.home||0)+"</td>";

}

awayRow+="<td>"+ls.awayTotal+"</td></tr>";
homeRow+="<td>"+ls.homeTotal+"</td></tr>";

document.getElementById("linescoreBody").innerHTML=
awayRow+homeRow;

}


function extractPlayers(events,nameMap){

const awayBat=new Set();
const homeBat=new Set();
const awayPitch=new Set();
const homePitch=new Set();

for(const e of events){

const type=e[0];

if(type=="play"){

const half=e[2];
const id=e[3];
const name=nameMap.get(id)||id;

if(half==0)awayBat.add(name);
else homeBat.add(name);

}

if(type=="start"||type=="sub"){

const id=e[1];
const team=e[2];
const pos=e[4]||e[e.length-1];

if(pos=="1"){

const name=nameMap.get(id)||id;

if(team=="0")awayPitch.add(name);
else homePitch.add(name);

}

}

}

return{
awayBat:[...awayBat],
homeBat:[...homeBat],
awayPitch:[...awayPitch],
homePitch:[...homePitch]
};

}


function fill(id,list){

const el=document.getElementById(id);

el.innerHTML="";

for(const p of list)
el.innerHTML+="<tr><td>"+p+"</td></tr>";

}


async function loadGame(){

const params=new URLSearchParams(location.search);

const id=params.get("id");

if(!id)return;

const year=id.substring(0,4);

const res=await fetch("data/baseball/boxscores/"+year+"/"+id+".json");

const game=await res.json();

const playerMap=await loadPlayerMap();

const away=teamName(game.away_code);
const home=teamName(game.home_code);

document.getElementById("matchup").textContent=
away+" @ "+home;

document.getElementById("date").textContent=
game.date;


const info=extractInfo(game.events||[]);

document.getElementById("venue").textContent=
"Venue: "+(info.site||"—");

document.getElementById("attendance").textContent=
"Attendance: "+(info.attendance||"—");


const ls=calcLinescore(game.events||[]);

document.getElementById("score").textContent=
ls.awayTotal+" - "+ls.homeTotal;

buildLinescore(ls,away,home);


const ppl=extractPlayers(game.events||[],playerMap);

fill("awayBat",ppl.awayBat);
fill("homeBat",ppl.homeBat);

fill("awayPitch",ppl.awayPitch);
fill("homePitch",ppl.homePitch);


document.getElementById("awayBatTitle").textContent=
away+" Batting";

document.getElementById("homeBatTitle").textContent=
home+" Batting";

document.getElementById("awayPitchTitle").textContent=
away+" Pitching";

document.getElementById("homePitchTitle").textContent=
home+" Pitching";

}

loadGame();

</script>

</body>
</html>
