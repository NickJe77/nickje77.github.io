<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.hero h1{margin:0;font-size:36px;}
.hero .sub{margin-top:10px;font-size:18px;opacity:.95;}
.scoreline{font-size:20px;font-weight:700;margin-top:8px;}
.meta-line{margin-top:6px;}
.section{background:white;padding:18px;border-radius:16px;margin-bottom:20px;}
.section h2{margin:0 0 12px 0;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:white;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
a{color:#0056d6;text-decoration:none;font-weight:700;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}
</style>
</head>

<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
<a href="./baseball-teams.html">Teams</a>
<a href="./baseball-players.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="scoreline" class="scoreline"></div>
<div id="subtitle" class="sub"></div>
<div id="venueLine" class="meta-line"></div>
<div id="crowdLine" class="meta-line"></div>
</div>

<div class="section">
<h2>Game Details</h2>
<div id="meta"></div>
</div>

<div class="grid">
<div class="section"><h2>Away Batting</h2><div id="awayBatting"></div></div>
<div class="section"><h2>Home Batting</h2><div id="homeBatting"></div></div>
<div class="section"><h2>Away Pitching</h2><div id="awayPitching"></div></div>
<div class="section"><h2>Home Pitching</h2><div id="homePitching"></div></div>
</div>

</div>

<script>

let PLAYERS={}, TEAMS={}, PARKS={}

function param(n){return new URLSearchParams(window.location.search).get(n)}
function playerName(id){return PLAYERS[id]||id}
function teamName(code){return TEAMS[code]||code}
function parkName(code){return PARKS[code]||code}

// -------------------------
// LOAD LOOKUPS
// -------------------------
async function loadLookups(){

const p=await fetch("/data/baseball/players.json")
if(p.ok){
const d=await p.json()
d.forEach(pl=>PLAYERS[pl.player_id]=pl.name)
}

const t=await fetch("/data/baseball/teams.json")
if(t.ok){
const d=await t.json()
d.forEach(team=>{
team.codes.forEach(c=>TEAMS[c]=team.name)
})
}

const b=await fetch("/data/baseball/ballparks.csv")
if(b.ok){
const text=await b.text()
text.split("\n").slice(1).forEach(l=>{
const parts=l.split(",")
if(parts.length>1) PARKS[parts[0].trim()]=parts[1].trim()
})
}
}

// -------------------------
// SAFE JSON FETCH
// -------------------------
async function fetchJson(path){
try{
const res=await fetch(path)
if(!res.ok) return null
return await res.json()
}catch(e){return null}
}

// -------------------------
// LOAD GAME
// -------------------------
async function loadGame(){

const id=param("game")
const season=param("season")

if(!id||!season){
document.getElementById("title").innerText="Game not found"
return
}

// ✅ correct path
let game=await fetchJson(`/data/baseball/boxscores/${season}/${id}.json`)

if(!game){
document.getElementById("title").innerText="Game not found"
return
}

// -------------------------
// FIX FIELD DIFFERENCES
// -------------------------
const homeCode =
  game.home_code ||
  game.home_team ||
  game.home ||
  game.homeTeam ||
  ""

const awayCode =
  game.away_code ||
  game.away_team ||
  game.away ||
  game.awayTeam ||
  ""

// -------------------------
// LOAD SEASON META
// -------------------------
let meta=null
const seasonData=await fetchJson(`/data/baseball/seasons/${season}.json`)

if(seasonData){

let games = Array.isArray(seasonData)
  ? seasonData
  : seasonData.games || []

meta = games.find(g=>String(g.game_id)===String(id))
}

// -------------------------
render(game,meta,homeCode,awayCode)
}

// -------------------------
// RENDER
// -------------------------
function render(game,meta,homeCode,awayCode){

const homeFull=teamName(homeCode)
const awayFull=teamName(awayCode)

document.getElementById("title").innerText=`${awayFull} @ ${homeFull}`

// score + info
const awayScore = meta?.away_score ?? game.away_score ?? ""
const homeScore = meta?.home_score ?? game.home_score ?? ""
const date = meta?.date ?? game.date ?? ""
const venue = meta?.venue ?? game.venue ?? ""
const attendance = meta?.attendance ?? game.attendance ?? ""

if(awayScore!=="" || homeScore!==""){
document.getElementById("scoreline").innerText=
`${awayFull} ${awayScore} – ${homeFull} ${homeScore}`
}

document.getElementById("subtitle").innerText=date
document.getElementById("venueLine").innerText=
venue?`Venue: ${parkName(venue)}`:""
document.getElementById("crowdLine").innerText=
attendance?`Attendance: ${Number(attendance).toLocaleString()}`:""

// -------------------------
// FLEXIBLE STAT KEYS
// -------------------------
renderTable("awayBatting",
  game.batters_away ||
  game.away_batting ||
  game.awayBatting ||
  []
)

renderTable("homeBatting",
  game.batters_home ||
  game.home_batting ||
  game.homeBatting ||
  []
)

renderTable("awayPitching",
  game.pitchers_away ||
  game.away_pitching ||
  game.awayPitching ||
  []
)

renderTable("homePitching",
  game.pitchers_home ||
  game.home_pitching ||
  game.homePitching ||
  []
)

}

// -------------------------
function renderTable(id,data){
if(!data||data.length===0){
document.getElementById(id).innerHTML="No detailed data available."
return
}

const keys=Object.keys(data[0]).filter(k=>k!=="player_id")

let html="<table><thead><tr><th>Player</th>"
keys.forEach(k=>html+=`<th>${k}</th>`)
html+="</tr></thead><tbody>"

data.forEach(p=>{
html+=`<tr>
<td><a href="./baseball-player.html?player=${p.player_id}">
${playerName(p.player_id)}
</a></td>`

keys.forEach(k=>html+=`<td>${p[k]??""}</td>`)

html+="</tr>"
})

html+="</tbody></table>"

document.getElementById(id).innerHTML=html
}

// -------------------------
async function init(){
await loadLookups()
await loadGame()
}

init()

</script>

</body>
</html>
