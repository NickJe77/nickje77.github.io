<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1000px;margin:0 auto;padding:22px 18px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:30px;border-radius:22px;}
.hero h1{margin:0;font-size:28px;}
.score{font-size:36px;font-weight:900;margin-top:8px;}
.meta{margin-top:8px;opacity:0.95;}
.card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;}
.kv{display:grid;grid-template-columns:170px 1fr;gap:10px 14px;}
.k{font-weight:800;color:#333;}
.v{color:#222;}
.link{color:#0056d6;font-weight:800;cursor:pointer;text-decoration:none;}
</style>
</head>
<body>

<div class="page">
  <div class="hero">
    <h1 id="teams">Loading...</h1>
    <div id="score" class="score"></div>
    <div id="meta" class="meta"></div>
  </div>

  <div class="card">
    <div class="kv">
      <div class="k">Date</div><div id="date" class="v"></div>
      <div class="k">Venue</div><div id="venue" class="v"></div>
      <div class="k">Attendance</div><div id="att" class="v"></div>
      <div class="k">Game length</div><div id="len" class="v"></div>
      <div class="k">Retrosheet ID</div><div id="rid" class="v"></div>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:900;margin-bottom:8px;">Links</div>
    <div>
      <a class="link" id="backSeason" href="#">← Back to Season</a>
      <span style="padding:0 10px;opacity:0.5;">|</span>
      <a class="link" id="awayLink" href="#"></a>
      <span style="padding:0 10px;opacity:0.5;">|</span>
      <a class="link" id="homeLink" href="#"></a>
    </div>
    <div style="margin-top:10px;opacity:0.8;">
      Box score / play-by-play from Retrosheet events is the next upgrade (we’ll wire it to the event files by retro_id).
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const year = params.get("year");
const id = params.get("id");

function fmt(n){
  if(n===null || n===undefined) return "—";
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

async function loadGame(){
  const res = await fetch(`data/baseball/seasons/${year}.json`);
  const games = await res.json();
  const g = games.find(x => x.id === id);
  if(!g){ document.getElementById("teams").textContent = "Game not found"; return; }

  document.getElementById("teams").textContent = `${g.away_team} @ ${g.home_team}`;
  document.getElementById("score").textContent = `${g.away_score} - ${g.home_score}`;
  document.getElementById("meta").textContent = `${g.date} • ${g.venue || ""}`;

  document.getElementById("date").textContent = g.date;
  document.getElementById("venue").textContent = g.venue || "—";
  document.getElementById("att").textContent = fmt(g.attendance);
  document.getElementById("len").textContent = g.game_length_minutes ? `${g.game_length_minutes} minutes` : "—";
  document.getElementById("rid").textContent = g.retro_id || "—";

  document.getElementById("backSeason").href = `baseball-season.html?year=${year}`;
  document.getElementById("awayLink").textContent = g.away_team;
  document.getElementById("homeLink").textContent = g.home_team;
  document.getElementById("awayLink").href = `baseball-team.html?team=${g.away_code}`;
  document.getElementById("homeLink").href = `baseball-team.html?team=${g.home_code}`;
}

loadGame();
</script>

</body>
</html>
