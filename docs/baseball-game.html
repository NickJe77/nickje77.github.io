<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#1e3a8a,#dc2626);color:white;padding:30px;border-radius:18px;margin-bottom:20px;}
.meta-bar{display:flex;gap:12px;margin-bottom:20px;}
.meta-pill{background:white;padding:10px 16px;border-radius:12px;font-weight:600;}
.section{background:white;padding:20px;border-radius:16px;margin-bottom:20px;}
.tables{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
th{background:#0b3b7a;color:white;padding:8px;text-align:left;}
td{padding:8px;border-bottom:1px solid #ddd;}
.player-link{color:#0056d6;text-decoration:none;font-weight:600;}
.player-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="page">

<div id="hero" class="hero">Loading game...</div>

<div class="meta-bar">
<div id="venue" class="meta-pill">Venue: —</div>
<div id="attendance" class="meta-pill">Attendance: —</div>
</div>

<div class="section">
<h2>Batting</h2>
<div class="tables">
<div>
<h3 id="away-name"></h3>
<table id="away-batting"></table>
</div>
<div>
<h3 id="home-name"></h3>
<table id="home-batting"></table>
</div>
</div>
</div>

<div class="section">
<h2>Pitching</h2>
<div class="tables">
<div>
<h3 id="away-pitch-name"></h3>
<table id="away-pitching"></table>
</div>
<div>
<h3 id="home-pitch-name"></h3>
<table id="home-pitching"></table>
</div>
</div>
</div>

</div>

<script>

function qs(name){
 return new URLSearchParams(window.location.search).get(name);
}

function safe(v){
 return v===undefined||v===null||v===""?"—":v;
}

function playerLink(name){
 if(!name) return "—";
 return `<a class="player-link" href="player.html?player=${encodeURIComponent(name)}">${name}</a>`;
}

function renderBatting(id,data){

 const t=document.getElementById(id);

 if(!data){
   t.innerHTML="<tr><td>No data</td></tr>";
   return;
 }

 let html="<tr><th>Player</th><th>PA</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>";

 data.forEach(p=>{
  html+=`
  <tr>
   <td>${playerLink(p.player||p.name)}</td>
   <td>${safe(p.PA)}</td>
   <td>${safe(p.H)}</td>
   <td>${safe(p.BB)}</td>
   <td>${safe(p.SO)}</td>
   <td>${safe(p.HR)}</td>
  </tr>`;
 });

 t.innerHTML=html;
}

function renderPitching(id,data){

 const t=document.getElementById(id);

 if(!data){
  t.innerHTML="<tr><td>No data</td></tr>";
  return;
 }

 let html="<tr><th>Pitcher</th><th>IP</th><th>H</th><th>BB</th><th>SO</th></tr>";

 data.forEach(p=>{
  html+=`
  <tr>
   <td>${playerLink(p.pitcher||p.name)}</td>
   <td>${safe(p.IP)}</td>
   <td>${safe(p.H)}</td>
   <td>${safe(p.BB)}</td>
   <td>${safe(p.SO)}</td>
  </tr>`;
 });

 t.innerHTML=html;
}

async function lookupSeasonMeta(game){

 try{

  const res=await fetch(`../data/baseball/seasons/${game.season}.json`);

  if(!res.ok) return;

  const list=await res.json();

  const match=list.find(g=>
   g.date===game.date &&
   g.home_code===game.home_code &&
   g.away_code===game.away_code
  );

  if(match){

   document.getElementById("venue").innerText="Venue: "+safe(match.venue);
   document.getElementById("attendance").innerText="Attendance: "+safe(match.attendance);

  }

 }catch(e){}
}

async function loadGame(){

 const file=qs("game");

 if(!file){

  document.getElementById("hero").innerHTML="Missing game parameter";
  return;

 }

 try{

  const res=await fetch(file);

  if(!res.ok){

   document.getElementById("hero").innerHTML="Game file not found:<br>"+file;
   return;

  }

  const game=await res.json();

  document.getElementById("hero").innerHTML=
  `<h1>${game.away_team} @ ${game.home_team}</h1>
   <div>${game.date}</div>`;

  document.getElementById("away-name").innerText=game.away_team;
  document.getElementById("home-name").innerText=game.home_team;

  document.getElementById("away-pitch-name").innerText=game.away_team;
  document.getElementById("home-pitch-name").innerText=game.home_team;

  if(game.venue)
   document.getElementById("venue").innerText="Venue: "+game.venue;

  if(game.attendance)
   document.getElementById("attendance").innerText="Attendance: "+game.attendance;

  await lookupSeasonMeta(game);

  renderBatting("away-batting",game.away_batting);
  renderBatting("home-batting",game.home_batting);

  renderPitching("away-pitching",game.away_pitching);
  renderPitching("home-pitching",game.home_pitching);

 }
 catch(err){

  document.getElementById("hero").innerHTML="Error loading game";

 }

}

loadGame();

</script>

</body>
</html>
