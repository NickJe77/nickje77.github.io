<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:36px;border-radius:22px;text-align:center;margin-bottom:20px;}
.matchup{font-size:42px;font-weight:900;}
.score{font-size:72px;font-weight:900;margin-top:10px;}
.date{font-size:18px;margin-top:6px;font-weight:700;}
.card{background:#fff;padding:18px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,0.12);margin-bottom:18px;}
.meta span{display:inline-block;background:#eef4ff;border:1px solid #d6e4ff;padding:8px 14px;border-radius:12px;margin-right:10px;font-weight:700;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:#fff;padding:10px;text-align:center;}
td{padding:10px;border-bottom:1px solid #eee;text-align:center;}
td:first-child{text-align:left;font-weight:700;}
tr:nth-child(even){background:#f0f6ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-player.html">Players</a>
</div>

<div class="page">

  <div class="hero">
    <div class="matchup" id="matchup">Loading…</div>
    <div class="score" id="score">—</div>
    <div class="date" id="date"></div>
  </div>

  <div class="card">
    <h3>Game Info</h3>
    <div class="meta">
      <span id="venue">Venue: —</span>
      <span id="attendance">Attendance: —</span>
    </div>
  </div>

  <div class="card">
    <h3>Linescore</h3>
    <table>
      <thead id="linescoreHead"></thead>
      <tbody id="linescoreBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h3 id="awayBatTitle"></h3>
    <table>
      <thead>
        <tr>
          <th>Player</th><th>AB</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>HR</th>
        </tr>
      </thead>
      <tbody id="awayBat"></tbody>
    </table>
  </div>

  <div class="card">
    <h3 id="homeBatTitle"></h3>
    <table>
      <thead>
        <tr>
          <th>Player</th><th>AB</th><th>H</th><th>RBI</th><th>BB</th><th>SO</th><th>HR</th>
        </tr>
      </thead>
      <tbody id="homeBat"></tbody>
    </table>
  </div>

</div>

<script>
const TEAM_NAMES={
  NYA:"New York Yankees",
  BOS:"Boston Red Sox",
  LAN:"Los Angeles Dodgers",
  SFN:"San Francisco Giants",
  CHN:"Chicago Cubs",
  SLN:"St Louis Cardinals",
  ATL:"Atlanta Braves",
  NYN:"New York Mets"
};
function teamName(code){ return TEAM_NAMES[code] || code; }

async function loadPlayersMap(){
  const res = await fetch("data/baseball/players.json", {cache:"no-store"});
  if(!res.ok) return new Map();
  const data = await res.json();

  const map = new Map();

  const asString = (v)=> (v==null ? "" : String(v).trim());
  const firstNonEmpty = (...vals)=> {
    for(const v of vals){
      const s = asString(v);
      if(s) return s;
    }
    return "";
  };

  const add = (id, name)=>{
    id = asString(id);
    name = asString(name);
    if(!id || !name) return;
    // only set if not already set (keeps first hit)
    if(!map.has(id)) map.set(id, name);
  };

  const rows = Array.isArray(data) ? data : (data && Array.isArray(data.players) ? data.players : []);

  for(const p of rows){
    if(!p || typeof p !== "object") continue;

    // try ALL common id keys
    const ids = [
      p.retrosheet_id, p.retro_id, p.retroID, p.retro,
      p.player_id, p.playerId, p.playerID,
      p.id, p.key, p.key_retro, p.keyRetro,
      p.code, p.code_retro, p.codeRetro
    ].filter(v=>asString(v));

    // try ALL common name keys
    const name =
      firstNonEmpty(
        p.full_name, p.fullName, p.name, p.player_name, p.playerName,
        (asString(p.first_name) && asString(p.last_name)) ? `${p.first_name} ${p.last_name}` : "",
        (asString(p.given_name) && asString(p.surname)) ? `${p.given_name} ${p.surname}` : "",
        (asString(p.first) && asString(p.last)) ? `${p.first} ${p.last}` : ""
      );

    for(const id of ids) add(id, name);

    // also: some files store retrosheet id nested
    if(p.ids && typeof p.ids === "object"){
      add(p.ids.retrosheet, name);
      add(p.ids.retro, name);
      add(p.ids.retrosheet_id, name);
      add(p.ids.player_id, name);
      add(p.ids.id, name);
    }
  }

  return map;
}

function extractInfo(events){
  const info = {};
  for(const e of events){
    if(e[0]==="info") info[e[1]] = e[2];
  }
  return info;
}

function statObj(){ return {AB:0,H:0,RBI:0,BB:0,SO:0,HR:0}; }

function process(events){
  const awayBat = {};
  const homeBat = {};
  const linescore = {};
  let awayTotal=0, homeTotal=0;

  for(const e of events){
    if(e[0] !== "play") continue;

    const inning = parseInt(e[1],10);
    const team = e[2];      // "0" away batting, "1" home batting
    const batter = e[3];    // retrosheet batter id
    const desc = e[6] || "";

    const batTeam = (team==="0" ? awayBat : homeBat);
    if(!batTeam[batter]) batTeam[batter] = statObj();
    const b = batTeam[batter];

    // basic PA heuristics (good enough for now)
    b.AB++;

    if(desc.includes("HR")) { b.H++; b.HR++; }
    else if(desc.startsWith("S") || desc.startsWith("D") || desc.startsWith("T")) { b.H++; }

    if(desc === "K" || desc.startsWith("K")) b.SO++;
    if(desc === "W" || desc.startsWith("W")) b.BB++;

    // runs batted in approximation: count advances to home in play text + HR
    const rbi = (desc.match(/\.[123]-H/g) || []).length + (desc.includes("HR") ? 1 : 0);
    b.RBI += rbi;

    if(!linescore[inning]) linescore[inning] = {away:0, home:0};
    if(team==="0"){ linescore[inning].away += rbi; awayTotal += rbi; }
    else { linescore[inning].home += rbi; homeTotal += rbi; }
  }

  return {awayBat, homeBat, linescore, awayTotal, homeTotal};
}

function renderLinescore(ls, awayName, homeName){
  const innings = Object.keys(ls).map(n=>parseInt(n,10)).filter(n=>!isNaN(n));
  const max = Math.max(9, ...(innings.length? innings : [9]));

  let head = "<tr><th></th>";
  for(let i=1;i<=max;i++) head += `<th>${i}</th>`;
  head += "<th>R</th></tr>";
  document.getElementById("linescoreHead").innerHTML = head;

  let awayRow = `<tr><td>${awayName}</td>`;
  let homeRow = `<tr><td>${homeName}</td>`;
  let aTot=0, hTot=0;

  for(let i=1;i<=max;i++){
    const a = ls[i]?.away || 0;
    const h = ls[i]?.home || 0;
    awayRow += `<td>${a}</td>`;
    homeRow += `<td>${h}</td>`;
    aTot += a; hTot += h;
  }
  awayRow += `<td>${aTot}</td></tr>`;
  homeRow += `<td>${hTot}</td></tr>`;

  document.getElementById("linescoreBody").innerHTML = awayRow + homeRow;
}

function renderBat(id, data, playersMap){
  const el = document.getElementById(id);
  el.innerHTML = "";

  for(const pid of Object.keys(data)){
    const p = data[pid];
    const name = playersMap.get(pid) || pid;
    el.innerHTML += `
      <tr>
        <td>${name}</td>
        <td>${p.AB}</td>
        <td>${p.H}</td>
        <td>${p.RBI}</td>
        <td>${p.BB}</td>
        <td>${p.SO}</td>
        <td>${p.HR}</td>
      </tr>`;
  }
}

async function loadGame(){
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if(!id) return;

  const year = id.substring(0,4);
  const res = await fetch(`data/baseball/boxscores/${year}/${id}.json`, {cache:"no-store"});
  if(!res.ok) return;

  const game = await res.json();
  const playersMap = await loadPlayersMap();

  const awayName = teamName(game.away_code);
  const homeName = teamName(game.home_code);

  document.getElementById("matchup").textContent = `${awayName} @ ${homeName}`;
  document.getElementById("date").textContent = game.date || "";

  const info = extractInfo(game.events || []);
  document.getElementById("venue").textContent = "Venue: " + (info.site || info.park || "Unknown");
  document.getElementById("attendance").textContent = "Attendance: " + (info.attendance || "—");

  const stats = process(game.events || []);
  document.getElementById("score").textContent = `${stats.awayTotal} - ${stats.homeTotal}`;

  renderLinescore(stats.linescore, awayName, homeName);

  document.getElementById("awayBatTitle").textContent = `${awayName} Batting`;
  document.getElementById("homeBatTitle").textContent = `${homeName} Batting`;

  renderBat("awayBat", stats.awayBat, playersMap);
  renderBat("homeBat", stats.homeBat, playersMap);
}

loadGame();
</script>

</body>
</html>
