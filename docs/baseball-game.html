<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:36px;}
.scoreline{font-size:20px;font-weight:700;margin-top:8px;}
.meta-line{margin-top:6px;}

.section{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:20px;
}

.section h2{margin:0 0 12px 0;}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#002D72;
  color:white;
  padding:10px;
  text-align:left;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
}

tr:nth-child(even){
  background:#f0f6ff;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
<a href="./baseball-teams.html">Teams</a>
<a href="./baseball-players.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="scoreline" class="scoreline"></div>
<div id="subtitle"></div>
<div id="venueLine" class="meta-line"></div>
<div id="crowdLine" class="meta-line"></div>
</div>

<div class="section">
<h2>Game Details</h2>
<div id="meta"></div>
</div>

<div class="grid">
<div class="section"><h2 id="awayBatTitle"></h2><div id="awayBatting"></div></div>
<div class="section"><h2 id="homeBatTitle"></h2><div id="homeBatting"></div></div>
<div class="section"><h2 id="awayPitchTitle"></h2><div id="awayPitching"></div></div>
<div class="section"><h2 id="homePitchTitle"></h2><div id="homePitching"></div></div>
</div>

</div>

<script>

let PLAYERS={}, TEAMS={}, PARKS={}

function param(n){return new URLSearchParams(window.location.search).get(n)}
function playerName(id){return PLAYERS[id]||id}
function teamName(code){return TEAMS[code]||code}
function parkName(code){return PARKS[code]||code}

// -----------------------------
// LOAD LOOKUPS
// -----------------------------
async function loadLookups(){

  try{
    const p=await fetch("/data/baseball/players.json")
    if(p.ok){
      const d=await p.json()
      d.forEach(pl=>PLAYERS[pl.player_id]=pl.name)
    }
  }catch{}

  try{
    const t=await fetch("/data/baseball/teams.json")
    if(t.ok){
      const d=await t.json()
      d.forEach(team=>{
        team.codes.forEach(c=>TEAMS[c]=team.name)
      })
    }
  }catch{}

  try{
    const b=await fetch("/data/baseball/ballparks.csv")
    if(b.ok){
      const text=await b.text()
      text.split("\n").slice(1).forEach(l=>{
        const parts=l.split(",")
        if(parts.length>1) PARKS[parts[0].trim()]=parts[1].trim()
      })
    }
  }catch{}
}

// -----------------------------
// LOAD GAME (FIXED)
// -----------------------------
async function loadGame(){

  const id = param("game")
  const season = param("season") || id?.match(/(\d{4})/)?.[1]

  if(!id){
    document.getElementById("title").innerText="Game not found"
    return
  }

  let game = null

  // 1. OLD SYSTEM
  try{
    let res = await fetch(`/data/baseball/games/${season}/${id}.json`)
    if(res.ok) game = await res.json()
  }catch{}

  // 2. NEW SYSTEM
  if(!game){
    try{
      let res = await fetch(`/data/baseball/boxscores/${season}/${id}.json`)
      if(res.ok) game = await res.json()
    }catch{}
  }

  // 3. 🔥 FIX gamePk (YOUR CURRENT ISSUE)
  if(!game && /^\d+$/.test(id)){

    try{
      const schedule = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&gamePk=${id}`)
      const data = await schedule.json()

      const g = data.dates?.[0]?.games?.[0]

      if(g){
        const date = g.gameDate.slice(0,10)

        const yyyy = date.slice(0,4)
        const mm = date.slice(5,7)
        const dd = date.slice(8,10)

        const home = g.teams.home.team.abbreviation

        const newId = `${home}${yyyy}${mm}${dd}0`

        let res = await fetch(`/data/baseball/boxscores/${season}/${newId}.json`)
        if(res.ok) game = await res.json()
      }

    }catch(e){
      console.log("gamePk conversion failed", e)
    }
  }

  if(!game){
    document.getElementById("title").innerText="Game not found"
    return
  }

  render(game)
}

// -----------------------------
// RENDER
// -----------------------------
function render(game){

  const home = teamName(game.home_code)
  const away = teamName(game.away_code)

  document.getElementById("title").innerText = `${away} @ ${home}`

  document.getElementById("meta").innerHTML =
    `<strong>Date:</strong> ${game.date}`

  document.getElementById("awayBatTitle").innerText = `${away} Batting`
  document.getElementById("homeBatTitle").innerText = `${home} Batting`
  document.getElementById("awayPitchTitle").innerText = `${away} Pitching`
  document.getElementById("homePitchTitle").innerText = `${home} Pitching`

  renderTable("awayBatting", game.batters_away)
  renderTable("homeBatting", game.batters_home)
  renderTable("awayPitching", game.pitchers_away)
  renderTable("homePitching", game.pitchers_home)
}

// -----------------------------
// TABLE
// -----------------------------
function renderTable(id,data){

  if(!data||data.length===0){
    document.getElementById(id).innerHTML="No data available"
    return
  }

  const keys = Object.keys(data[0]).filter(k=>k!=="player_id")

  let html="<table><thead><tr><th>Player</th>"
  keys.forEach(k=>html+=`<th>${k}</th>`)
  html+="</tr></thead><tbody>"

  data.forEach(p=>{
    html+=`<tr>
    <td>${playerName(p.player_id)}</td>`
    keys.forEach(k=>html+=`<td>${p[k]}</td>`)
    html+="</tr>"
  })

  html+="</tbody></table>"

  document.getElementById(id).innerHTML=html
}

// -----------------------------
async function init(){
  await loadLookups()
  await loadGame()
}
init()

</script>

</body>
</html>
