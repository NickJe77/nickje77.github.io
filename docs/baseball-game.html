<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:28px;border-radius:20px;margin-bottom:14px;}
.hero h1{margin:0;font-size:42px;}
.infoRow{display:flex;gap:12px;margin-bottom:14px;}
.infoBox{background:#fff;padding:10px 14px;border-radius:12px;font-weight:700;}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:14px;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:#fff;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
.error{background:#ffd6d6;color:#8a0000;padding:12px;border-radius:10px;margin-bottom:12px;font-weight:800;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div id="error" class="error" style="display:none;"></div>

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="date"></div>
</div>

<div class="infoRow">
<div class="infoBox" id="venue">Venue: —</div>
<div class="infoBox" id="attendance">Attendance: —</div>
</div>

<div class="card">
<h2>Batting</h2>
<div class="split">
<div>
<h3>Away</h3>
<table>
<thead>
<tr><th>Player</th><th>PA</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
</thead>
<tbody id="awayBat"></tbody>
</table>
</div>
<div>
<h3>Home</h3>
<table>
<thead>
<tr><th>Player</th><th>PA</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
</thead>
<tbody id="homeBat"></tbody>
</table>
</div>
</div>
</div>

<div class="card">
<h2>Pitching</h2>
<div class="split">
<div>
<h3>Away Pitching</h3>
<table>
<thead>
<tr><th>Pitcher</th><th>IP</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
</thead>
<tbody id="awayPitch"></tbody>
</table>
</div>

<div>
<h3>Home Pitching</h3>
<table>
<thead>
<tr><th>Pitcher</th><th>IP</th><th>H</th><th>BB</th><th>SO</th><th>HR</th></tr>
</thead>
<tbody id="homePitch"></tbody>
</table>
</div>
</div>
</div>

</div>

<script>

const id = new URLSearchParams(location.search).get("id");
const year = id.substring(0,4);

const gamePath = `data/baseball/boxscores/${year}/${id}.json`;

let PLAYER_MAP={};
let TEAM_MAP={};
let PARK_MAP={};

function showError(msg){
document.getElementById("error").style.display="block";
document.getElementById("error").textContent=msg;
}

function ipFromOuts(outs){
const innings=Math.floor(outs/3);
const remainder=outs%3;
return innings+"."+remainder;
}

function pname(id){return PLAYER_MAP[id]||id;}
function tname(id){return TEAM_MAP[id]||id;}

function ensure(map,id){
if(!map[id]) map[id]={pa:0,h:0,bb:0,so:0,hr:0,outs:0};
return map[id];
}

function isHit(ev){return ev.startsWith("S")||ev.startsWith("D")||ev.startsWith("T")||ev.startsWith("HR");}
function isHR(ev){return ev.startsWith("HR");}
function isBB(ev){return ev.startsWith("W");}
function isSO(ev){return ev.startsWith("K");}

function outs(ev){
if(isHit(ev)||isBB(ev)) return 0;
return 1;
}

async function load(){

try{

const players=await fetch("data/baseball/players.json").then(r=>r.json());
const teams=await fetch("data/baseball/teams.json").then(r=>r.json());
const parks=await fetch("data/baseball/ballparks.csv").then(r=>r.text());

/* PLAYER MAP */
if(Array.isArray(players)){
players.forEach(p=>{
const id=p.id||p.player_id||p.playerID;
const name=p.name||p.full_name||(p.nameFirst+" "+p.nameLast);
if(id&&name) PLAYER_MAP[id]=name;
});
}else{
Object.assign(PLAYER_MAP,players);
}

/* TEAM MAP */
if(Array.isArray(teams)){
teams.forEach(t=>{
const code=t.code||t.team_code||t.id;
const name=t.name||t.full_name||t.team_name;
if(code&&name) TEAM_MAP[code]=name;
});
}else{
Object.assign(TEAM_MAP,teams);
}

/* PARK MAP */
parks.split("\n").forEach(line=>{
const parts=line.split(",");
if(parts.length>=2) PARK_MAP[parts[0]]=parts[1];
});

/* LOAD GAME */

const game=await fetch(gamePath).then(r=>{
if(!r.ok) throw new Error("Game file not found");
return r.json();
});

/* HEADER */

document.getElementById("title").textContent=
tname(game.away_code)+" @ "+tname(game.home_code);

document.getElementById("date").textContent=game.date;

/* STATS */

const awayBat={};
const homeBat={};

const awayPitch={};
const homePitch={};

let awayPitcher=null;
let homePitcher=null;

game.events.forEach(e=>{

if(e[0]==="info"){

if(e[1]==="site"){
document.getElementById("venue").textContent="Venue: "+(PARK_MAP[e[2]]||e[2]);
}

if(e[1]==="attendance"){
document.getElementById("attendance").textContent="Attendance: "+e[2];
}

}

/* detect pitchers */

if(e[0]==="start"||e[0]==="sub"){

const player=e[1];
const team=e[3];
const pos=e[5];

if(pos==="1"){

if(team==="0") awayPitcher=player;
else homePitcher=player;

}

}

/* plays */

if(e[0]==="play"){

const team=e[2];
const batter=e[3];
const ev=e[6];

if(team==="0"){

const b=ensure(awayBat,batter);

b.pa++;
if(isHit(ev)) b.h++;
if(isBB(ev)) b.bb++;
if(isSO(ev)) b.so++;
if(isHR(ev)) b.hr++;

if(homePitcher){
const p=ensure(homePitch,homePitcher);
p.outs+=outs(ev);
if(isHit(ev)) p.h++;
if(isBB(ev)) p.bb++;
if(isSO(ev)) p.so++;
if(isHR(ev)) p.hr++;
}

}else{

const b=ensure(homeBat,batter);

b.pa++;
if(isHit(ev)) b.h++;
if(isBB(ev)) b.bb++;
if(isSO(ev)) b.so++;
if(isHR(ev)) b.hr++;

if(awayPitcher){
const p=ensure(awayPitch,awayPitcher);
p.outs+=outs(ev);
if(isHit(ev)) p.h++;
if(isBB(ev)) p.bb++;
if(isSO(ev)) p.so++;
if(isHR(ev)) p.hr++;
}

}

}

});

/* render batting */

function renderBat(id,map){

const tbody=document.getElementById(id);

Object.entries(map).forEach(([pid,s])=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${pname(pid)}</td>
<td>${s.pa}</td>
<td>${s.h}</td>
<td>${s.bb}</td>
<td>${s.so}</td>
<td>${s.hr}</td>
`;

tbody.appendChild(tr);

});

}

renderBat("awayBat",awayBat);
renderBat("homeBat",homeBat);

/* render pitching */

function renderPitch(id,map){

const tbody=document.getElementById(id);

Object.entries(map).forEach(([pid,s])=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${pname(pid)}</td>
<td>${ipFromOuts(s.outs)}</td>
<td>${s.h}</td>
<td>${s.bb}</td>
<td>${s.so}</td>
<td>${s.hr}</td>
`;

tbody.appendChild(tr);

});

}

renderPitch("awayPitch",awayPitch);
renderPitch("homePitch",homePitch);

}catch(err){
showError(err.message);
}

}

load();

</script>

</body>
</html>
