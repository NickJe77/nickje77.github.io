<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
font-size:28px;
font-weight:700;
}

.section{
background:white;
border-radius:16px;
padding:20px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#002D72;
color:white;
padding:10px;
text-align:left;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div id="hero" class="hero">
Loading game...
</div>

<div id="content"></div>

</div>

<script>

async function loadGame(){

const params=new URLSearchParams(window.location.search);

const game_id=params.get("game");

if(!game_id){

document.getElementById("hero").textContent="Invalid game link";

return;

}

// extract season from game id
// example ANA202505030 → 2025

const season=game_id.substring(3,7);

const path=`data/baseball/games/${season}/${game_id}.json`;

try{

const res=await fetch(path);

if(!res.ok){

document.getElementById("hero").textContent="Game file not found";

return;

}

const game=await res.json();

renderGame(game);

}
catch(e){

document.getElementById("hero").textContent="Error loading game";

}

}

function renderGame(game){

document.getElementById("hero").textContent=
game.away_code+" @ "+game.home_code+" ("+game.season+")";

const content=document.getElementById("content");

content.innerHTML="";

content.appendChild(createBattingTable("Home Batting",game.batting_home));

content.appendChild(createBattingTable("Away Batting",game.batting_away));

content.appendChild(createPitchingTable("Home Pitching",game.pitching_home));

content.appendChild(createPitchingTable("Away Pitching",game.pitching_away));

}

function createBattingTable(title,data){

const section=document.createElement("div");

section.className="section";

let html=`<h2>${title}</h2>
<table>
<tr>
<th>Player</th>
<th>AB</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>`;

for(const player in data){

const s=data[player];

html+=`
<tr>
<td>${player}</td>
<td>${s.AB||0}</td>
<td>${s.H||0}</td>
<td>${s.BB||0}</td>
<td>${s.SO||0}</td>
</tr>`;

}

html+="</table>";

section.innerHTML=html;

return section;

}

function createPitchingTable(title,data){

const section=document.createElement("div");

section.className="section";

let html=`<h2>${title}</h2>
<table>
<tr>
<th>Player</th>
<th>IP Outs</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>`;

for(const player in data){

const s=data[player];

html+=`
<tr>
<td>${player}</td>
<td>${s.IP_outs||0}</td>
<td>${s.H||0}</td>
<td>${s.BB||0}</td>
<td>${s.SO||0}</td>
</tr>`;

}

html+="</table>";

section.innerHTML=html;

return section;

}

loadGame();

</script>

</body>
</html>
