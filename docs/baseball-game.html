<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.hero h1{margin:0;font-size:36px;}
.scoreline{font-size:20px;font-weight:700;margin-top:8px;}
.meta-line{margin-top:6px;}
.section{background:white;padding:18px;border-radius:16px;margin-bottom:20px;}
.section h2{margin:0 0 12px 0;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:white;padding:10px;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
</style>
</head>

<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
<a href="./baseball-teams.html">Teams</a>
<a href="./baseball-players.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
<div id="scoreline" class="scoreline"></div>
<div id="subtitle"></div>
<div id="venueLine" class="meta-line"></div>
</div>

<div class="grid">
<div class="section"><h2>Away Batting</h2><div id="awayBatting"></div></div>
<div class="section"><h2>Home Batting</h2><div id="homeBatting"></div></div>
<div class="section"><h2>Away Pitching</h2><div id="awayPitching"></div></div>
<div class="section"><h2>Home Pitching</h2><div id="homePitching"></div></div>
</div>

</div>

<script>

function param(n){
  return new URLSearchParams(window.location.search).get(n);
}

// ---------------- LOAD GAME ----------------
async function loadGame(){

const id = param("game");
const season = param("season");

if(!id || !season){
document.getElementById("title").innerText="Game not found";
return;
}

// TRY BOTH PATHS
let game = null;

let res = await fetch(`/data/baseball/boxscores/${season}/${id}.json`);
if(res.ok) game = await res.json();

if(!game){
res = await fetch(`/data/baseball/games/${season}/${id}.json`);
if(res.ok) game = await res.json();
}

if(!game){
document.getElementById("title").innerText="Game not found";
return;
}

// ---------------- LOAD SEASON ----------------
let meta = null;

try{
const res2 = await fetch(`/data/baseball/seasons/${season}.json`);
if(res2.ok){

const seasonData = await res2.json();
const games = Array.isArray(seasonData)
  ? seasonData
  : seasonData.games || [];

// 🔥 FIX: MULTI MATCH STRATEGY

// 1. try game_id
meta = games.find(g => String(g.game_id) === String(id));

// 2. fallback by date
if(!meta && game.date){
meta = games.find(g => g.date === game.date);
}

// 3. fallback by teams
if(!meta){
meta = games.find(g =>
(g.home_team && g.away_team)
);
}

}
}catch(e){}

// ---------------- HEADER ----------------
const away = meta?.away_team || "";
const home = meta?.home_team || "";

document.getElementById("title").innerText =
`${away} @ ${home}`;

if(meta){
document.getElementById("scoreline").innerText =
`${away} ${meta.away_score} – ${home} ${meta.home_score}`;
document.getElementById("subtitle").innerText = meta.date || "";
document.getElementById("venueLine").innerText =
meta.venue ? `Venue: ${meta.venue}` : "";
}

// ---------------- TABLE BUILDER ----------------
function buildTable(data){

if(!data || data.length === 0){
return "No detailed data available.";
}

let keys = Object.keys(data[0]);

let html = "<table><thead><tr><th>Player</th>";

keys.forEach(k=>{
if(k !== "player_id" && k !== "team") html += `<th>${k}</th>`;
});

html += "</tr></thead><tbody>";

data.forEach(p=>{
html += `<tr><td>${p.player || p.name || ""}</td>`;

keys.forEach(k=>{
if(k !== "player_id" && k !== "team"){
html += `<td>${p[k] ?? ""}</td>`;
}
});

html += "</tr>";
});

html += "</tbody></table>";

return html;
}

// ---------------- FORMAT HANDLING ----------------

let awayBatting = [];
let homeBatting = [];
let awayPitching = [];
let homePitching = [];

// OLD STRUCTURE
if(game && game.batters_away){
awayBatting = game.batters_away || [];
homeBatting = game.batters_home || [];
awayPitching = game.pitchers_away || [];
homePitching = game.pitchers_home || [];
}

// 2026 STRUCTURE
else if(Array.isArray(game)){
game.forEach(p=>{
if(p.team === away) awayBatting.push(p);
if(p.team === home) homeBatting.push(p);
});
}

// ---------------- RENDER ----------------
document.getElementById("awayBatting").innerHTML = buildTable(awayBatting);
document.getElementById("homeBatting").innerHTML = buildTable(homeBatting);
document.getElementById("awayPitching").innerHTML = buildTable(awayPitching);
document.getElementById("homePitching").innerHTML = buildTable(homePitching);

}

loadGame();

</script>

</body>
</html>
