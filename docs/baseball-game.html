<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.hero h1{margin:0;font-size:36px;}
.section{background:white;padding:18px;border-radius:16px;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:white;padding:10px;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
</style>
</head>

<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
<a href="./baseball-teams.html">Teams</a>
<a href="./baseball-players.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
</div>

<div class="grid">
<div class="section"><h2>Away Batting</h2><div id="awayBatting"></div></div>
<div class="section"><h2>Home Batting</h2><div id="homeBatting"></div></div>
<div class="section"><h2>Away Pitching</h2><div id="awayPitching"></div></div>
<div class="section"><h2>Home Pitching</h2><div id="homePitching"></div></div>
</div>

</div>

<script>

function param(n){
  return new URLSearchParams(window.location.search).get(n);
}

// ---------------- BUILD STATS FROM EVENTS ----------------
function buildStats(events, homeCode, awayCode){

const batting = {};
const pitching = {};

events.forEach(e=>{

const batter = e[3];
const result = e[6];

// determine team (top = away, bottom = home)
const team = e[2] === "0" ? awayCode : homeCode;

// init
if(!batting[batter]){
batting[batter] = {player:batter, team, AB:0, H:0, BB:0, SO:0};
}

if(!pitching[team]){
pitching[team] = {player:team, team, SO:0, BB:0};
}

// plate appearances
if(result !== "BB") batting[batter].AB++;

// outcomes
if(result === "1B" || result === "2B" || result === "3B" || result === "HR"){
batting[batter].H++;
}

if(result === "BB"){
batting[batter].BB++;
pitching[team].BB++;
}

if(result === "K"){
batting[batter].SO++;
pitching[team].SO++;
}

});

return {batting:Object.values(batting), pitching:Object.values(pitching)};
}

// ---------------- TABLE BUILDER ----------------
function table(data){

if(!data.length) return "No data";

let keys = Object.keys(data[0]);

let html = "<table><thead><tr>";

keys.forEach(k=> html += `<th>${k}</th>`);

html += "</tr></thead><tbody>";

data.forEach(r=>{
html += "<tr>";
keys.forEach(k=> html += `<td>${r[k]}</td>`);
html += "</tr>";
});

html += "</tbody></table>";
return html;
}

// ---------------- LOAD GAME ----------------
async function loadGame(){

const id = param("game");
const season = param("season");

const res = await fetch(`/data/baseball/boxscores/${season}/${id}.json`);
const game = await res.json();

document.getElementById("title").innerText =
`${game.away_team} @ ${game.home_team}`;

const stats = buildStats(
game.events,
game.home_team,
game.away_team
);

// split
const awayBat = stats.batting.filter(p=>p.team === game.away_team);
const homeBat = stats.batting.filter(p=>p.team === game.home_team);

const awayPitch = stats.pitching.filter(p=>p.team === game.home_team);
const homePitch = stats.pitching.filter(p=>p.team === game.away_team);

// render
document.getElementById("awayBatting").innerHTML = table(awayBat);
document.getElementById("homeBatting").innerHTML = table(homeBat);
document.getElementById("awayPitching").innerHTML = table(awayPitch);
document.getElementById("homePitching").innerHTML = table(homePitch);

}

loadGame();

</script>

</body>
</html>
