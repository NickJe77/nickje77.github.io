<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Australia | The Sporting Almanac</title>
<link rel="stylesheet" href="racing.css">
</head>

<body>

<!-- GLOBAL NAV -->
<div id="global-nav"></div>

<div class="page-hero">
  <img src="images/australia-hero.jpg" alt="Australia Racing">
</div>

<section class="country-intro">
  <h1>Australia</h1>
  <p>
    Home to some of the world's most iconic races and racing carnivals, Australian thoroughbred racing
    blends tradition, innovation, and global prestige.
  </p>
</section>

<div class="country-grid">

  <!-- AUSTRALIAN STAKES -->
  <a class="country-card" href="australia-stakes.html">
    <img src="images/australian-stakes.jpg" alt="Australian Stakes">
    <div class="country-card-title">AUSTRALIAN STAKES RACES</div>
  </a>

  <!-- AUSTRALIAN G1 -->
  <a class="country-card" href="australian-g1.html">
    <img src="images/g1-australia.jpg" alt="Australian Group 1 Races">
    <div class="country-card-title">GROUP 1 RACES</div>
  </a>

  <!-- TRACKS -->
  <a class="country-card" href="australia-tracks.html">
    <img src="images/australia-tracks.jpg" alt="Australian Race Tracks">
    <div class="country-card-title">RACE TRACKS</div>
  </a>

</div>

<script>
/* Inject nav from g1-archive.html */
fetch("g1-archive.html")
  .then(res => res.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    const nav =
      doc.querySelector("nav") ||
      doc.querySelector("#nav") ||
      doc.querySelector(".nav") ||
      doc.querySelector(".top-nav") ||
      doc.querySelector(".main-nav");

    if (nav) {
      document.getElementById("global-nav").innerHTML = nav.outerHTML;
    }
  });
</script>

</body>
</html>
