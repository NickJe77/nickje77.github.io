<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Australia | The Sporting Almanac</title>

<link rel="stylesheet" href="racing.css">

<style>

/* PAGE CONTAINER */
.australia-page {
  max-width:1200px;
  margin:0 auto 60px auto;
}

/* HERO */

.australia-hero {
  margin-top:20px;
  border-radius:20px;
  overflow:hidden;
}

.australia-hero img {
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}

/* INTRO */

.australia-intro {
  text-align:center;
  margin:30px auto 40px auto;
  max-width:900px;
}

.australia-intro h1 {
  font-size:36px;
  font-weight:800;
  margin-bottom:10px;
}

.australia-intro p {
  font-size:18px;
  color:#555;
  line-height:1.5;
}

/* TILE GRID */

.australia-grid {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:28px;
}

/* TILE CARD */

.australia-card {
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.12);
  text-decoration:none;
  transition:transform 0.2s ease, box-shadow 0.2s ease;

  /* LOCK SIZE */
  aspect-ratio: 16 / 9;
  position:relative;
}

.australia-card:hover {
  transform:translateY(-4px);
  box-shadow:0 10px 26px rgba(0,0,0,0.18);
}

/* IMAGE MUST FILL TILE */

.australia-card img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

@media (max-width:900px){
  .australia-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width:600px){
  .australia-grid {
    grid-template-columns: 1fr;
  }
}

</style>

</head>

<body>

<!-- GLOBAL NAV -->
<div id="global-nav"></div>

<div class="australia-page">

  <!-- HERO -->
  <div class="australia-hero">
    <img src="images/australia-hero.jpg" alt="Australia Racing">
  </div>

  <!-- INTRO -->
  <div class="australia-intro">
    <h1>Australia</h1>
    <p>
      Home to some of the world's most iconic races and racing carnivals, Australian thoroughbred racing
      blends tradition, innovation, and global prestige.
    </p>
  </div>

  <!-- TILES -->
  <div class="australia-grid">

    <a class="australia-card" href="australia-stakes.html">
      <img src="images/australian-stakes.jpg" alt="Australian Stakes">
    </a>

    <a class="australia-card" href="australian-g1.html">
      <img src="images/g1-australia.jpg" alt="Australian Group 1">
    </a>

    <a class="australia-card" href="australia-tracks.html">
      <img src="images/australia-tracks.jpg" alt="Australian Race Tracks">
    </a>

  </div>

</div>

<script>
/* Inject nav from g1-archive.html */
fetch("g1-archive.html")
  .then(res => res.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    const nav =
      doc.querySelector("nav") ||
      doc.querySelector("#nav") ||
      doc.querySelector(".nav") ||
      doc.querySelector(".top-nav") ||
      doc.querySelector(".main-nav");

    if (nav) {
      document.getElementById("global-nav").innerHTML = nav.outerHTML;
    }
  });
</script>

</body>
</html>
