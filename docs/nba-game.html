<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;margin:0 0 6px;}
.subtitle{text-align:center;color:#666;margin:0 0 18px;}
.summary{display:flex;justify-content:center;margin-bottom:20px;}
.card{background:#f4f6fb;padding:12px 18px;border-radius:10px;min-width:260px;text-align:center;}
.card b{display:block;font-size:18px;}
.team-title{text-align:center;margin:30px 0 8px;font-size:20px;font-weight:700;}
table{width:100%;border-collapse:collapse;margin-bottom:20px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:center;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
.player-link{color:#0056d6;text-decoration:none;font-weight:600;}
.bad{background:#fff3f3;border:1px solid #ffd0d0;color:#a40000;padding:10px;border-radius:10px;max-width:900px;margin:0 auto 18px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Game</h1>
<div class="subtitle" id="subtitle"></div>

<div id="errorBox" class="bad" style="display:none;"></div>

<div class="summary" id="summary" style="display:none;">
<div class="card">
<b id="scoreLine">-</b>
Final Score
</div>
</div>

<h2 class="team-title" id="homeTitle"></h2>
<table>
<thead>
<tr>
<th>Player</th>
<th>MIN</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody id="homeBody"></tbody>
</table>

<h2 class="team-title" id="awayTitle"></h2>
<table>
<thead>
<tr>
<th>Player</th>
<th>MIN</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody id="awayBody"></tbody>
</table>

</div>

<script>

const BASE = "data/nba/";

const params = new URLSearchParams(window.location.search);
const season = params.get("season");
const gameId = params.get("game");

const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");
const errorBox = document.getElementById("errorBox");
const summaryEl = document.getElementById("summary");
const scoreLine = document.getElementById("scoreLine");
const homeTitle = document.getElementById("homeTitle");
const awayTitle = document.getElementById("awayTitle");
const homeBody = document.getElementById("homeBody");
const awayBody = document.getElementById("awayBody");

function showError(msg){
errorBox.style.display="block";
errorBox.textContent=msg;
}

function renderPlayers(players, teamName, tbody){
const teamPlayers = players.filter(p=>p.team===teamName);
teamPlayers.forEach(p=>{
const tr=document.createElement("tr");
tr.innerHTML=`
<td><a class="player-link" href="nba-player.html?player=${encodeURIComponent(p.player_name)}">${p.player_name}</a></td>
<td>${p.minutes||""}</td>
<td>${p.points||0}</td>
<td>${p.rebounds||0}</td>
<td>${p.assists||0}</td>
<td>${p.steals||0}</td>
<td>${p.blocks||0}</td>
`;
tbody.appendChild(tr);
});
}

async function loadGame(){

if(!season || !gameId){
showError("Missing season or game id");
return;
}

try{

const res = await fetch(BASE + season + "/" + gameId + ".json");

if(!res.ok){
showError("Game file not found (404)");
return;
}

const game = await res.json();

if(game.game_type === "Preseason"){
showError("Preseason games are not included in official records.");
return;
}

titleEl.textContent = game.away_team + " @ " + game.home_team;
subtitleEl.textContent = "Season " + season + " — " + (game.date || "");

scoreLine.textContent =
game.home_team + " " + game.home_score +
" – " +
game.away_score + " " + game.away_team;

summaryEl.style.display="flex";

homeTitle.textContent = game.home_team;
awayTitle.textContent = game.away_team;

homeBody.innerHTML="";
awayBody.innerHTML="";

renderPlayers(game.players || [], game.home_team, homeBody);
renderPlayers(game.players || [], game.away_team, awayBody);

}
catch(err){
showError("Could not load game file");
}

}

window.addEventListener("pageshow",()=>{
loadGame();
});

loadGame();

</script>

</body>
</html>
