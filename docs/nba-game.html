<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
  color:#1f2937;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:700;
  background:#fff;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.navbar a:hover{
  text-decoration:underline;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#17408B,#C9082A);
  color:#fff;
  border-radius:18px;
  padding:28px 28px 24px;
  margin-bottom:24px;
  box-shadow:0 10px 24px rgba(0,0,0,0.10);
}

.hero h1{
  margin:0 0 8px;
  text-align:center;
  font-size:34px;
  line-height:1.15;
}

.subtitle{
  text-align:center;
  color:rgba(255,255,255,0.92);
  margin:0;
  font-size:16px;
}

.bad{
  background:#fff3f3;
  border:1px solid #ffd0d0;
  color:#a40000;
  padding:12px 14px;
  border-radius:12px;
  max-width:900px;
  margin:0 auto 18px;
}

.summary{
  display:flex;
  justify-content:center;
  margin-bottom:26px;
}

.score-card{
  background:#f4f7ff;
  border:1px solid #dbe7ff;
  border-radius:16px;
  padding:18px 24px;
  min-width:320px;
  text-align:center;
  box-shadow:0 6px 18px rgba(23,64,139,0.08);
}

.score-label{
  font-size:13px;
  color:#5b6475;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:8px;
  font-weight:700;
}

.score-line{
  font-size:28px;
  font-weight:800;
  color:#111827;
  line-height:1.2;
}

.section{
  margin-bottom:28px;
}

.team-block{
  background:#fff;
  border:1px solid #e6ebf2;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.06);
}

.team-header{
  background:linear-gradient(90deg,#f7faff,#eef4ff);
  border-bottom:1px solid #dde6f5;
  padding:14px 18px;
  text-align:center;
}

.team-title{
  margin:0;
  font-size:22px;
  font-weight:800;
  color:#17408B;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  margin:0;
}

th,td{
  border-bottom:1px solid #e5e7eb;
  padding:10px 12px;
  text-align:center;
  white-space:nowrap;
}

th{
  background:#17408B;
  color:#fff;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
  position:relative;
}

th:hover{
  background:#12346f;
}

td{
  font-size:15px;
}

tbody tr:nth-child(even){
  background:#f7faff;
}

tbody tr:hover{
  background:#e9f0ff;
  cursor:pointer;
}

td:first-child, th:first-child{
  text-align:left;
}

.player-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:700;
}

.player-link:hover{
  text-decoration:underline;
}

th.asc::after{
  content:" ▲";
  font-size:11px;
}

th.desc::after{
  content:" ▼";
  font-size:11px;
}

@media (max-width: 700px){
  .hero h1{
    font-size:28px;
  }

  .score-line{
    font-size:22px;
  }

  .score-card{
    min-width:unset;
    width:100%;
  }

  .navbar{
    gap:16px;
    flex-wrap:wrap;
    padding:14px 12px;
  }

  .navbar a{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1 id="title">NBA Game</h1>
    <p class="subtitle" id="subtitle"></p>
  </div>

  <div id="errorBox" class="bad" style="display:none;"></div>

  <div class="summary" id="summary" style="display:none;">
    <div class="score-card">
      <div class="score-label">Final Score</div>
      <div class="score-line" id="scoreLine">-</div>
    </div>
  </div>

  <div class="section">
    <div class="team-block">
      <div class="team-header">
        <h2 class="team-title" id="homeTitle"></h2>
      </div>
      <div class="table-wrap">
        <table id="homeTable">
          <thead>
            <tr>
              <th data-key="player_name">Player</th>
              <th data-key="minutes">MIN</th>
              <th data-key="points">PTS</th>
              <th data-key="rebounds">REB</th>
              <th data-key="assists">AST</th>
              <th data-key="steals">STL</th>
              <th data-key="blocks">BLK</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="team-block">
      <div class="team-header">
        <h2 class="team-title" id="awayTitle"></h2>
      </div>
      <div class="table-wrap">
        <table id="awayTable">
          <thead>
            <tr>
              <th data-key="player_name">Player</th>
              <th data-key="minutes">MIN</th>
              <th data-key="points">PTS</th>
              <th data-key="rebounds">REB</th>
              <th data-key="assists">AST</th>
              <th data-key="steals">STL</th>
              <th data-key="blocks">BLK</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>

const BASE="/data/nba/";

const params=new URLSearchParams(window.location.search);
const season=params.get("season");
const gameId=params.get("game");

let homePlayers=[];
let awayPlayers=[];

const titleEl=document.getElementById("title");
const subtitleEl=document.getElementById("subtitle");
const errorBox=document.getElementById("errorBox");
const summaryEl=document.getElementById("summary");
const scoreLine=document.getElementById("scoreLine");
const homeTitle=document.getElementById("homeTitle");
const awayTitle=document.getElementById("awayTitle");

function showError(msg){
  errorBox.style.display="block";
  errorBox.textContent=msg;
}

function getName(p){
  return p.player_name || p.name || p.player || p.full_name || p.playerName || "";
}

function getMinutesValue(p){
  const m = p.minutes ?? p.min ?? p.mins ?? 0;
  if(typeof m === "number") return m;
  const s = String(m).trim();
  if(!s) return 0;
  if(s.includes(":")){
    const parts=s.split(":");
    const mins=parseInt(parts[0],10);
    return isNaN(mins) ? 0 : mins;
  }
  const n=parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function statValue(p, keys){
  for(const key of keys){
    if(p[key] !== undefined && p[key] !== null && p[key] !== "") return p[key];
  }
  return 0;
}

function renderTable(players,tableId){
  const tbody=document.querySelector(`#${tableId} tbody`);
  tbody.innerHTML="";

  players.forEach(p=>{
    const name=getName(p);

    const minutes=statValue(p,["minutes","min","mins"]);
    const points=statValue(p,["points","pts"]);
    const rebounds=statValue(p,["rebounds","reb","total_rebounds"]);
    const assists=statValue(p,["assists","ast"]);
    const steals=statValue(p,["steals","stl"]);
    const blocks=statValue(p,["blocks","blk"]);

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td><span class="player-link">${name}</span></td>
      <td>${minutes}</td>
      <td>${points}</td>
      <td>${rebounds}</td>
      <td>${assists}</td>
      <td>${steals}</td>
      <td>${blocks}</td>
    `;

    tr.addEventListener("click",()=>{
      location.href="nba-player.html?player="+encodeURIComponent(name);
    });

    tbody.appendChild(tr);
  });
}

function filterPlayedPlayers(players){
  return (players || []).filter(p=>getMinutesValue(p)>0);
}

function extractPlayers(game){
  let hp=[];
  let ap=[];

  if(Array.isArray(game.players)){
    hp = game.players.filter(p=>p.team===game.home_team);
    ap = game.players.filter(p=>p.team===game.away_team);
  }

  return {
    home: filterPlayedPlayers(hp),
    away: filterPlayedPlayers(ap)
  };
}

async function loadGame(){

  if(!gameId){
    showError("Missing game id");
    return;
  }

  let game=null;

  // try season first
  if(season){
    try{
      const res=await fetch(BASE+season+"/"+gameId+".json");
      if(res.ok) game=await res.json();
    }catch{}
  }

  // fallback scan
  if(!game){
    for(let y=1970;y<=2030;y++){
      try{
        const res=await fetch(BASE+y+"/"+gameId+".json");
        if(res.ok){
          game=await res.json();
          break;
        }
      }catch{}
    }
  }

  if(!game){
    showError("Game not found");
    return;
  }

  titleEl.textContent=(game.away_team || "")+" @ "+(game.home_team || "");
  subtitleEl.textContent=(game.date || "");

  scoreLine.textContent=
    (game.home_team || "")+" "+(game.home_score ?? "")+
    " – "+
    (game.away_score ?? "")+" "+(game.away_team || "");

  summaryEl.style.display="flex";

  homeTitle.textContent=game.home_team || "Home";
  awayTitle.textContent=game.away_team || "Away";

  const extracted=extractPlayers(game);
  homePlayers=extracted.home;
  awayPlayers=extracted.away;

  renderTable(homePlayers,"homeTable");
  renderTable(awayPlayers,"awayTable");
}

loadGame();

</script>

</body>
</html>
