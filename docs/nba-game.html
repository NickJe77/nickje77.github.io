<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;margin:0 0 6px;}
.subtitle{text-align:center;color:#666;margin:0 0 18px;}
.summary{display:flex;justify-content:center;margin-bottom:20px;}
.card{background:#f4f6fb;padding:12px 18px;border-radius:10px;min-width:260px;text-align:center;}
.card b{display:block;font-size:18px;}
.team-title{text-align:center;margin:30px 0 8px;font-size:20px;font-weight:700;}
table{width:100%;border-collapse:collapse;margin-bottom:20px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:center;}
th{background:#f0f0f0;cursor:pointer;}
th:hover{background:#e5ecff;}
tr:nth-child(even){background:#f6f9ff;}
tr:hover{background:#e9f0ff;cursor:pointer;}
.player-link{color:#0056d6;text-decoration:none;font-weight:600;}
.bad{background:#fff3f3;border:1px solid #ffd0d0;color:#a40000;padding:10px;border-radius:10px;max-width:900px;margin:0 auto 18px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Game</h1>
<div class="subtitle" id="subtitle"></div>

<div id="errorBox" class="bad" style="display:none;"></div>

<div class="summary" id="summary" style="display:none;">
<div class="card">
<b id="scoreLine">-</b>
Final Score
</div>
</div>

<h2 class="team-title" id="homeTitle"></h2>
<table id="homeTable">
<thead>
<tr>
<th data-key="player_name">Player</th>
<th data-key="minutes">MIN</th>
<th data-key="points">PTS</th>
<th data-key="rebounds">REB</th>
<th data-key="assists">AST</th>
<th data-key="steals">STL</th>
<th data-key="blocks">BLK</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2 class="team-title" id="awayTitle"></h2>
<table id="awayTable">
<thead>
<tr>
<th data-key="player_name">Player</th>
<th data-key="minutes">MIN</th>
<th data-key="points">PTS</th>
<th data-key="rebounds">REB</th>
<th data-key="assists">AST</th>
<th data-key="steals">STL</th>
<th data-key="blocks">BLK</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

/* ✅ ABSOLUTE PATH */
const BASE = "/data/nba/";

const params = new URLSearchParams(window.location.search);
const season = params.get("season");
const gameId = params.get("game");

let homePlayers = [];
let awayPlayers = [];

const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");
const errorBox = document.getElementById("errorBox");
const summaryEl = document.getElementById("summary");
const scoreLine = document.getElementById("scoreLine");
const homeTitle = document.getElementById("homeTitle");
const awayTitle = document.getElementById("awayTitle");

function showError(msg){
  errorBox.style.display="block";
  errorBox.textContent=msg;
}

function renderTable(players, tableId){
  const tbody = document.querySelector(`#${tableId} tbody`);
  tbody.innerHTML="";

  players.forEach(p=>{
    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${p.player_name}</td>
      <td>${p.minutes || 0}</td>
      <td>${p.points || 0}</td>
      <td>${p.rebounds || 0}</td>
      <td>${p.assists || 0}</td>
      <td>${p.steals || 0}</td>
      <td>${p.blocks || 0}</td>
    `;

    tr.addEventListener("click", ()=>{
      location.href="nba-player.html?player=" + encodeURIComponent(p.player_name);
    });

    tbody.appendChild(tr);
  });
}

function sortTable(players, key, tableId, headerEl){
  let asc = headerEl.classList.toggle("asc");
  headerEl.classList.toggle("desc", !asc);

  document.querySelectorAll(`#${tableId} th`).forEach(th=>{
    if(th!==headerEl) th.classList.remove("asc","desc");
  });

  players.sort((a,b)=>{
    if(key==="player_name"){
      return asc 
        ? a[key].localeCompare(b[key])
        : b[key].localeCompare(a[key]);
    }
    return asc 
      ? (a[key]||0)-(b[key]||0)
      : (b[key]||0)-(a[key]||0);
  });

  renderTable(players, tableId);
}

function enableSorting(tableId, players){
  document.querySelectorAll(`#${tableId} th`).forEach(th=>{
    th.addEventListener("click",()=>{
      const key = th.dataset.key;
      sortTable(players, key, tableId, th);
    });
  });
}

async function loadGame(){

  if(!season || !gameId){
    showError("Missing season or game id");
    return;
  }

  try{

    const res = await fetch(BASE + season + "/" + gameId + ".json");

    if(!res.ok){
      showError("Game file not found (404)");
      return;
    }

    const game = await res.json();

    if((game.game_type||"").toLowerCase().includes("pre")){
      showError("Preseason games are not included in official records.");
      return;
    }

    titleEl.textContent = game.away_team + " @ " + game.home_team;
    subtitleEl.textContent = "Season " + season + " — " + (game.date || "");

    scoreLine.textContent =
      game.home_team + " " + game.home_score +
      " – " +
      game.away_score + " " + game.away_team;

    summaryEl.style.display="flex";

    homeTitle.textContent = game.home_team;
    awayTitle.textContent = game.away_team;

    homePlayers = (game.players || []).filter(p=>p.team===game.home_team);
    awayPlayers = (game.players || []).filter(p=>p.team===game.away_team);

    renderTable(homePlayers, "homeTable");
    renderTable(awayPlayers, "awayTable");

    enableSorting("homeTable", homePlayers);
    enableSorting("awayTable", awayPlayers);

  }
  catch(err){
    showError("Could not load game file");
  }
}

window.addEventListener("pageshow", loadGame);
loadGame();

</script>

</body>
</html>
