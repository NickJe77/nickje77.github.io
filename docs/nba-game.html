<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:center;}
th{background:#f0f0f0;position:sticky;top:0;}
tr:nth-child(even){background:#f6f9ff;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title"></h1>
<table>
<thead>
<tr>
<th>Player</th><th>Team</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th>
</tr>
</thead>
<tbody id="boxBody"></tbody>
</table>

</div>

<script>
const params=new URLSearchParams(location.search);
const season=params.get("season");
const gameStr=params.get("game");

function seasonToFile(s){return "data/nba/nba_season_"+s.replace("-","_")+".json";}

fetch(seasonToFile(season)).then(r=>r.json()).then(data=>{
  const g=data.games.find(x=>`${x.home_team} vs ${x.away_team}`===gameStr);
  document.getElementById("title").textContent=gameStr;
  g.players.forEach(p=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
    <td><a href="nba-player.html?player=${encodeURIComponent(p.player)}">${p.player}</a></td>
    <td><a href="nba-team.html?team=${encodeURIComponent(p.team)}">${p.team}</a></td>
    <td>${p.min||""}</td><td>${p.pts||0}</td><td>${p.reb||0}</td><td>${p.ast||0}</td>
    <td>${p.stl||0}</td><td>${p.blk||0}</td>`;
    boxBody.appendChild(tr);
  });
});
</script>

</body>
</html>
