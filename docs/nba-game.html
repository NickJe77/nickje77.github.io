<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --ink-2:#27313c;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --head:#f7f9fb;
  --board:#0b0f14;
  --board-2:#151c25;
  --board-line:rgba(255,255,255,.10);
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.12);
  --pos:#1a7f4b;
  --neg:#b4262c;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
/* Everything on this page is upright text — overrides any italics from the shared stylesheet */
.ng, .ng *{font-style:normal !important;}

.navbar{
  display:flex;justify-content:center;flex-wrap:wrap;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;font-style:normal;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;font-style:normal;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.ng-page{max-width:1240px;margin:0 auto;padding:26px 20px 70px;}

/* ── Scoreboard ───────────────────────────────────────── */
.ng-board{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);color:#fff;overflow:hidden;
  box-shadow:0 18px 40px -20px rgba(10,16,24,.6);margin-bottom:20px;
}
.ng-eyebrow{
  text-align:center;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.55);padding:20px 16px 0;
}
.ng-final{
  position:absolute;top:16px;right:18px;font-size:10.5px;font-weight:700;letter-spacing:.12em;
  color:rgba(255,255,255,.85);border:1px solid var(--board-line);border-radius:999px;padding:4px 10px;
}
.ng-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px 32px 32px;}
.ng-team{display:flex;align-items:center;gap:16px;min-width:0;}
.ng-team.away{justify-content:flex-end;text-align:right;}
.ng-team .nm{font-family:var(--display);font-weight:600;font-size:clamp(18px,2.8vw,28px);line-height:1.05;text-transform:uppercase;letter-spacing:.01em;}
.ng-team .sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:4px;letter-spacing:.06em;text-transform:uppercase;}
.ng-crest{width:8px;align-self:stretch;min-height:56px;border-radius:6px;flex:0 0 auto;}
.ng-score{display:flex;align-items:center;gap:16px;font-family:var(--display);font-weight:600;font-size:clamp(44px,8vw,72px);line-height:1;}
.ng-score .sc{font-variant-numeric:tabular-nums;}
.ng-score .sc.lose{color:rgba(255,255,255,.42);font-weight:500;}
.ng-score .dash{color:rgba(255,255,255,.28);font-weight:400;}

/* ── Cards ────────────────────────────────────────────── */
.ng-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
.ng-card-head{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--line);}
.ng-card-head h2{margin:0;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;text-transform:uppercase;}
.ng-card-head .swatch{width:14px;height:14px;border-radius:4px;flex:0 0 auto;}
.ng-card-head .right{margin-left:auto;font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink);}
.ng-section-title{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 2px 10px;}

/* Linescore */
.ng-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px;margin-bottom:6px;}
.ng-line{width:100%;border-collapse:collapse;font-size:13.5px;}
.ng-line th,.ng-line td{padding:11px 12px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
.ng-line th{background:var(--head);color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
.ng-line tr:last-child td{border-bottom:none;}
.ng-line td.tm{text-align:left;font-weight:700;white-space:nowrap;}
.ng-line td.tm .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:9px;vertical-align:0;}
.ng-line td.tot{font-weight:700;font-size:15px;color:var(--ink);}
.ng-line td.win{color:var(--ink);}

/* Leaders */
.ng-leaders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;}
.ng-leader{padding:14px 16px;border-right:1px solid var(--line);min-width:0;}
.ng-leader:last-child{border-right:none;}
.ng-leader .lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.ng-leader .val{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;margin-top:6px;color:var(--ink);}
.ng-leader.fp .val{color:var(--accent);}
.ng-leader .who{font-size:13px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ng-leader .who a{color:var(--ink);text-decoration:none;}
.ng-leader .who a:hover{color:var(--accent);}
.ng-leader .tm{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.04em;margin-top:2px;}

/* Box score */
.ng-wrap{overflow-x:auto;}
.ng-box{width:100%;border-collapse:collapse;font-size:13px;min-width:980px;}
.ng-box th,.ng-box td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.ng-box thead th{
  background:var(--head);color:var(--muted);font-weight:600;font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;cursor:pointer;user-select:none;position:sticky;top:0;
}
.ng-box thead th:hover{color:var(--ink);}
.ng-box thead th.sorted::after{content:" ↓";color:var(--faint);}
.ng-box thead th.sorted.asc::after{content:" ↑";}
.ng-box th:first-child,.ng-box td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px;}
.ng-box thead th:first-child{background:var(--head);z-index:2;}
.ng-box td{color:var(--ink-2);}
.ng-box td.pts{font-weight:700;color:var(--ink);}
.ng-box td.fp,.ng-box th.fp{background:var(--accent-soft);}
.ng-box td.fp{font-weight:700;color:var(--ink);}
.ng-box td.pos{color:var(--pos);}
.ng-box td.neg{color:var(--neg);}
.ng-box tbody tr:hover td{background:#f4f8fd;}
.ng-box tbody tr:hover td.fp{background:rgba(201,154,61,.2);}
.ng-box tr.group td{
  background:#fbfcfd;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:7px 10px;text-align:left;
}
.ng-box tr.group td:first-child{background:#fbfcfd;}
.ng-box tr.totals td{font-weight:700;color:var(--ink);background:var(--head);border-bottom:none;}
.ng-box tr.totals td:first-child{background:var(--head);}
.ng-box tr.totals td.fp{background:rgba(201,154,61,.18);}
.player-link{color:var(--ink);text-decoration:none;font-weight:600;}
.player-link:hover{color:var(--accent);}
.ng-pos{display:inline-block;min-width:16px;color:var(--faint);font-size:11px;font-weight:600;margin-left:6px;}
.ng-dnp{padding:12px 18px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);}
.ng-dnp b{color:var(--ink-2);font-weight:600;}
.ng-note{font-size:12px;color:var(--muted);margin:4px 2px 0;}

.ng-loading{text-align:center;padding:70px 20px;color:var(--muted);font-size:15px;}

@media(max-width:900px){
  .ng-top{grid-template-columns:1fr;}
  .ng-leaders{grid-template-columns:repeat(2,minmax(0,1fr));}
  .ng-leader:nth-child(2){border-right:none;}
  .ng-leader:nth-child(-n+2){border-bottom:1px solid var(--line);}
}
@media(max-width:640px){
  .ng-grid{grid-template-columns:1fr;gap:14px;padding:12px 18px 26px;}
  .ng-team.away,.ng-team.home{justify-content:center;text-align:center;}
  .ng-score{justify-content:center;}
  .ng-crest{min-height:30px;}
}
</style>
</head>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>

</div>

<div class="ng ng-page">
  <div id="content"><div class="ng-loading">Loading game…</div></div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

const params = new URLSearchParams(location.search);
const season = params.get("season");
const gameId = params.get("game");
const contentEl = document.getElementById("content");

/* Team colours by Basketball-Reference abbreviation (incl. older franchises) */
const TEAM_COLOURS = {
  ATL:"#E03A3E", BOS:"#007A33", BRK:"#111111", NJN:"#002A60", CHO:"#1D1160", CHA:"#1D1160", CHH:"#00788C",
  CHI:"#CE1141", CLE:"#860038", DAL:"#00538C", DEN:"#0E2240", DET:"#C8102E", GSW:"#1D428A",
  HOU:"#CE1141", IND:"#002D62", LAC:"#C8102E", LAL:"#552583", MEM:"#5D76A9", VAN:"#00B2A9",
  MIA:"#98002E", MIL:"#00471B", MIN:"#0C2340", NOP:"#0C2340", NOH:"#0C2340", NOK:"#0C2340",
  NYK:"#F58426", OKC:"#007AC1", SEA:"#00653A", ORL:"#0077C0", PHI:"#006BB6", PHO:"#1D1160",
  POR:"#E03A3E", SAC:"#5A2D81", SAS:"#8A8D8F", TOR:"#CE1141", UTA:"#002B5C", WAS:"#002B5C", WSB:"#002B5C",
};
const colour = abbr => TEAM_COLOURS[abbr] || "#5a6472";

/* Fix UTF-8 names that were stored with the wrong encoding */
function fixName(str){
  if(!str) return str;
  try{
    const bytes = new Uint8Array(str.length);
    for(let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const decoded = new TextDecoder('utf-8').decode(bytes);
    return decoded.includes('�') ? str : decoded;
  }catch(e){ return str; }
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n = (p,k) => Number(p[k]) || 0;
const secs = mp => { const m = String(mp||"").match(/^(\d+):(\d+)/); return m ? (+m[1])*60 + (+m[2]) : 0; };

/* NBA fantasy points (NBA official scoring, same as Yahoo default):
   PTS + 1.2×REB + 1.5×AST + 3×STL + 3×BLK − TOV */
function fantasyPoints(p){
  const fp = n(p,"pts") + 1.2*n(p,"trb") + 1.5*n(p,"ast") + 3*n(p,"stl") + 3*n(p,"blk") - n(p,"tov");
  return Math.round(fp*10)/10;
}
const fmtFP = v => (Math.round(v*10)/10).toFixed(1);
const pct = (m,a) => a ? (100*m/a).toFixed(1)+"%" : "–";

/* Box score columns. sort = value used when the header is clicked. */
const COLS = [
  {key:"mp",   label:"Min",  get:p=>p.mp||"–",                     sort:p=>secs(p.mp)},
  {key:"pts",  label:"Pts",  get:p=>n(p,"pts"),                    sort:p=>n(p,"pts"), cls:"pts"},
  {key:"fp",   label:"FP",   get:p=>fmtFP(fantasyPoints(p)),       sort:p=>fantasyPoints(p), cls:"fp", title:"Fantasy points"},
  {key:"trb",  label:"Reb",  get:p=>n(p,"trb"),                    sort:p=>n(p,"trb")},
  {key:"ast",  label:"Ast",  get:p=>n(p,"ast"),                    sort:p=>n(p,"ast")},
  {key:"stl",  label:"Stl",  get:p=>n(p,"stl"),                    sort:p=>n(p,"stl")},
  {key:"blk",  label:"Blk",  get:p=>n(p,"blk"),                    sort:p=>n(p,"blk")},
  {key:"tov",  label:"TO",   get:p=>n(p,"tov"),                    sort:p=>n(p,"tov")},
  {key:"fg",   label:"FG",   get:p=>`${n(p,"fg")}-${n(p,"fga")}`,  sort:p=>n(p,"fg"),  title:"Field goals made-attempted"},
  {key:"fgp",  label:"FG%",  get:p=>pct(n(p,"fg"),n(p,"fga")),     sort:p=>n(p,"fga")?n(p,"fg")/n(p,"fga"):-1},
  {key:"fg3",  label:"3PT",  get:p=>`${n(p,"fg3")}-${n(p,"fg3a")}`,sort:p=>n(p,"fg3"), title:"Three-pointers made-attempted"},
  {key:"ft",   label:"FT",   get:p=>`${n(p,"ft")}-${n(p,"fta")}`,  sort:p=>n(p,"ft"),  title:"Free throws made-attempted"},
  {key:"orb",  label:"OReb", get:p=>n(p,"orb"),                    sort:p=>n(p,"orb")},
  {key:"drb",  label:"DReb", get:p=>n(p,"drb"),                    sort:p=>n(p,"drb")},
  {key:"pf",   label:"PF",   get:p=>n(p,"pf"),                     sort:p=>n(p,"pf")},
  {key:"pm",   label:"+/-",  get:p=>{const v=p.plus_minus; return v==null?"–":(v>0?"+"+v:v);},
                             sort:p=>Number(p.plus_minus)||0,
                             tint:p=>{const v=Number(p.plus_minus)||0; return v>0?"pos":v<0?"neg":"";}},
];

let GAME = null;
const sides = {};          // abbr -> {players, sortKey, asc}

async function loadGame(){
  try{
    const res = await fetch(`${R2}/basketball/boxscores/${season}/${gameId}.json`);
    if(!res.ok) throw new Error("Game not found");
    GAME = await res.json();
    render();
  }catch(err){
    console.error(err);
    contentEl.innerHTML = `<div class="ng-loading">Couldn’t load this game.</div>`;
  }
}

function render(){
  const d = GAME;
  const ls = d.linescore || {};
  const gid = d.game_id || "";
  const abbrs = Object.keys(ls);
  const homeAbbr = abbrs.find(a => gid.endsWith(a)) || abbrs[1];
  const awayAbbr = abbrs.find(a => a !== homeAbbr) || abbrs[0];
  const homeScore = homeAbbr ? (ls[homeAbbr].T ?? "–") : "–";
  const awayScore = awayAbbr ? (ls[awayAbbr].T ?? "–") : "–";
  const hWin = Number(homeScore) > Number(awayScore), aWin = Number(awayScore) > Number(homeScore);
  const periods = abbrs.length ? Object.keys(ls[abbrs[0]]).filter(k => k !== "T") : [];
  const teams = d.teams || {};

  document.title = `${d.away} @ ${d.home} | NBA | The Sporting Almanac`;

  [awayAbbr, homeAbbr].forEach(a => {
    sides[a] = { players: (teams[a] || []).map((p,i) => ({...p, _order:i})), sortKey:null, asc:false };
  });

  /* leaders across both teams */
  const all = [awayAbbr, homeAbbr].flatMap(a => sides[a].players.filter(p => !p.dnp).map(p => ({...p, _team:a})));
  const leader = (fn) => all.reduce((best,p) => (!best || fn(p) > fn(best)) ? p : best, null);
  const leaders = [
    {lbl:"Points",   p:leader(p=>n(p,"pts")),       v:p=>n(p,"pts")},
    {lbl:"Rebounds", p:leader(p=>n(p,"trb")),       v:p=>n(p,"trb")},
    {lbl:"Assists",  p:leader(p=>n(p,"ast")),       v:p=>n(p,"ast")},
    {lbl:"Fantasy",  p:leader(p=>fantasyPoints(p)), v:p=>fmtFP(fantasyPoints(p)), cls:"fp"},
  ];

  const periodLabel = (k,i) => /^\d+$/.test(k) ? (Number(k) <= 4 ? "Q"+k : "OT"+(Number(k)-4 > 1 ? Number(k)-4 : "")) : k;
  const lineRow = (abbr, name, win) => `
    <tr>
      <td class="tm"><span class="dot" style="background:${colour(abbr)}"></span>${esc(name)}</td>
      ${periods.map(q => `<td>${esc(ls[abbr]?.[q] ?? "–")}</td>`).join("")}
      <td class="tot ${win?"win":""}">${esc(ls[abbr]?.T ?? "–")}</td>
    </tr>`;

  contentEl.innerHTML = `
    <div class="ng-board">
      <span class="ng-final">FINAL</span>
      <div class="ng-eyebrow">${esc([d.date, d.arena].filter(Boolean).join("  ·  "))}</div>
      <div class="ng-grid">
        <div class="ng-team away">
          <div><div class="nm">${esc(d.away)}</div><div class="sub">Away · ${esc(awayAbbr||"")}</div></div>
          <div class="ng-crest" style="background:${colour(awayAbbr)}"></div>
        </div>
        <div class="ng-score">
          <span class="sc ${aWin?"":"lose"}">${esc(awayScore)}</span>
          <span class="dash">–</span>
          <span class="sc ${hWin?"":"lose"}">${esc(homeScore)}</span>
        </div>
        <div class="ng-team home">
          <div class="ng-crest" style="background:${colour(homeAbbr)}"></div>
          <div><div class="nm">${esc(d.home)}</div><div class="sub">Home · ${esc(homeAbbr||"")}</div></div>
        </div>
      </div>
    </div>

    <div class="ng-top">
      <div class="ng-card">
        <div class="ng-card-head"><h2>Scoring by Quarter</h2></div>
        <table class="ng-line">
          <thead><tr><th style="text-align:left">Team</th>${periods.map((q,i)=>`<th>${periodLabel(q,i)}</th>`).join("")}<th>Total</th></tr></thead>
          <tbody>${lineRow(awayAbbr, d.away, aWin)}${lineRow(homeAbbr, d.home, hWin)}</tbody>
        </table>
      </div>
      <div class="ng-card">
        <div class="ng-card-head"><h2>Game Leaders</h2></div>
        <div class="ng-leaders">
          ${leaders.map(l => l.p ? `
            <div class="ng-leader ${l.cls||""}">
              <div class="lbl">${l.lbl}</div>
              <div class="val">${l.v(l.p)}</div>
              <div class="who"><a href="/nba-player.html?id=${encodeURIComponent(l.p.player_id||"")}">${esc(fixName(l.p.player))}</a></div>
              <div class="tm">${esc(l.p._team)}</div>
            </div>` : "").join("")}
        </div>
      </div>
    </div>

    <div class="ng-section-title">Box Score</div>
    ${[ [awayAbbr, d.away, awayScore], [homeAbbr, d.home, homeScore] ].map(([a,name,score]) => `
      <div class="ng-card">
        <div class="ng-card-head">
          <span class="swatch" style="background:${colour(a)}"></span>
          <h2>${esc(name)}</h2>
          <span class="right">${esc(score)}</span>
        </div>
        <div class="ng-wrap"><table class="ng-box" id="box-${a}"><thead></thead><tbody></tbody></table></div>
        <div id="dnp-${a}"></div>
      </div>`).join("")}
    <div class="ng-note">FP = fantasy points (NBA scoring): Pts + 1.2 × Reb + 1.5 × Ast + 3 × Stl + 3 × Blk − TO. Click any column to sort.</div>
  `;

  [awayAbbr, homeAbbr].forEach(renderBox);
}

function renderBox(abbr){
  const s = sides[abbr];
  if(!s) return;
  const table = document.getElementById("box-"+abbr);
  const active = s.players.filter(p => !p.dnp);
  const dnp = s.players.filter(p => p.dnp);

  table.querySelector("thead").innerHTML = `<tr>
    <th data-k="player" class="${s.sortKey==="player"?"sorted "+(s.asc?"asc":""):""}">Player</th>
    ${COLS.map(c => `<th data-k="${c.key}" class="${c.cls==="fp"?"fp ":""}${s.sortKey===c.key?"sorted "+(s.asc?"asc":""):""}"${c.title?` title="${c.title}"`:""}>${c.label}</th>`).join("")}
  </tr>`;
  table.querySelectorAll("thead th").forEach(th => th.onclick = () => sortSide(abbr, th.dataset.k));

  const row = p => `<tr>
    <td><a class="player-link" href="/nba-player.html?id=${encodeURIComponent(p.player_id||"")}">${esc(fixName(p.player||""))}</a></td>
    ${COLS.map(c => `<td class="${[c.cls||"", c.tint?c.tint(p):""].join(" ").trim()}">${esc(c.get(p))}</td>`).join("")}
  </tr>`;

  let body;
  if(!s.sortKey){
    /* original order: Basketball-Reference lists the five starters first */
    const starters = active.slice(0,5), bench = active.slice(5);
    const span = COLS.length + 1;
    body = `<tr class="group"><td colspan="${span}">Starters</td></tr>` + starters.map(row).join("")
         + (bench.length ? `<tr class="group"><td colspan="${span}">Bench</td></tr>` + bench.map(row).join("") : "");
  } else {
    const c = COLS.find(c => c.key === s.sortKey);
    const sorted = [...active].sort((a,b) => {
      if(s.sortKey === "player"){
        const x = fixName(a.player||"").toLowerCase(), y = fixName(b.player||"").toLowerCase();
        return x < y ? (s.asc?-1:1) : x > y ? (s.asc?1:-1) : 0;
      }
      return s.asc ? c.sort(a)-c.sort(b) : c.sort(b)-c.sort(a);
    });
    body = sorted.map(row).join("");
  }

  /* team totals */
  const t = k => active.reduce((sum,p) => sum + n(p,k), 0);
  const totFP = active.reduce((sum,p) => sum + fantasyPoints(p), 0);
  const totals = {
    mp:"", pts:t("pts"), fp:fmtFP(totFP), trb:t("trb"), ast:t("ast"), stl:t("stl"), blk:t("blk"), tov:t("tov"),
    fg:`${t("fg")}-${t("fga")}`, fgp:pct(t("fg"),t("fga")), fg3:`${t("fg3")}-${t("fg3a")}`, ft:`${t("ft")}-${t("fta")}`,
    orb:t("orb"), drb:t("drb"), pf:t("pf"), pm:"",
  };
  body += `<tr class="totals"><td>Team totals</td>${COLS.map(c => `<td class="${c.cls||""}">${esc(totals[c.key])}</td>`).join("")}</tr>`;
  table.querySelector("tbody").innerHTML = body;

  document.getElementById("dnp-"+abbr).innerHTML = dnp.length
    ? `<div class="ng-dnp"><b>Did not play:</b> ${dnp.map(p => esc(fixName(p.player||""))).join(", ")}</div>` : "";
}

function sortSide(abbr, key){
  const s = sides[abbr];
  if(s.sortKey === key){
    if(!s.asc) s.asc = true;                       // 2nd click: ascending
    else { s.sortKey = null; s.asc = false; }      // 3rd click: back to starters/bench
  } else { s.sortKey = key; s.asc = (key === "player"); }
  renderBox(abbr);
}

loadGame();
</script>
</body>
</html>
