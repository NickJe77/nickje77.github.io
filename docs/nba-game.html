<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin:0 0 6px;}
.subtitle{
  text-align:center;
  color:#666;
  margin:0 0 18px;
}

.summary{
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
  margin:0 0 18px;
}
.card{
  background:#f4f6fb;
  padding:12px 18px;
  border-radius:10px;
  min-width:180px;
  text-align:center;
}
.card b{display:block;font-size:18px;}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:center;
  white-space:nowrap;
}
th{
  background:#f0f0f0;
  cursor:pointer;
  position:sticky;
  top:0;
  z-index:2;
}
tr:nth-child(even){background:#f6f9ff;}
tr:hover{background:#e9f0ff;}
.player-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
.team-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
.note{
  text-align:center;
  color:#888;
  margin-top:12px;
  font-size:14px;
}
.bad{
  background:#fff3f3;
  border:1px solid #ffd0d0;
  color:#a40000;
  padding:10px 12px;
  border-radius:10px;
  max-width:900px;
  margin:0 auto 18px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Game</h1>
<div class="subtitle" id="subtitle"></div>

<div id="errorBox" class="bad" style="display:none;"></div>

<div class="summary" id="summary" style="display:none;">
  <div class="card"><b id="scoreLine">-</b>Final Score</div>
  <div class="card"><b id="metaLine">-</b>Date / Venue</div>
</div>

<table id="boxTable" style="display:none;">
  <thead>
    <tr>
      <th onclick="sortBy('player')">Player</th>
      <th onclick="sortBy('team')">Team</th>
      <th onclick="sortBy('min')">MIN</th>
      <th onclick="sortBy('pts')">PTS</th>
      <th onclick="sortBy('reb')">REB</th>
      <th onclick="sortBy('ast')">AST</th>
      <th onclick="sortBy('stl')">STL</th>
      <th onclick="sortBy('blk')">BLK</th>
      <th onclick="sortBy('to')">TO</th>
      <th onclick="sortBy('pf')">PF</th>
    </tr>
  </thead>
  <tbody id="boxBody"></tbody>
</table>

<div class="note" id="hint"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const season = params.get("season");
const gameStr = params.get("game");

const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");
const errorBox = document.getElementById("errorBox");

const summaryEl = document.getElementById("summary");
const scoreLine = document.getElementById("scoreLine");
const metaLine = document.getElementById("metaLine");

const boxTable = document.getElementById("boxTable");
const boxBody = document.getElementById("boxBody");
const hint = document.getElementById("hint");

let rows = [];
let sortKey = null;
let sortAsc = true;

// Convert "1976-77" -> "nba_season_1976_77.json"
function seasonToFile(seasonStr){
  if(!seasonStr) return null;
  const m = seasonStr.match(/^(\d{4})-(\d{2})$/);
  if(!m) return null;
  return `nba_season_${m[1]}_${m[1].slice(0,2)}${m[2]}.json`;
}

function showError(msg){
  errorBox.style.display = "block";
  errorBox.textContent = msg;
}

function safeNum(v){
  const n = Number(v);
  return isNaN(n) ? 0 : n;
}

function playerHref(name){
  return `nba-player.html?player=${encodeURIComponent(name)}`;
}

function teamHref(name){
  return `nba-team.html?team=${encodeURIComponent(name)}`;
}

function sortBy(key){
  if(sortKey === key){
    sortAsc = !sortAsc;
  }else{
    sortKey = key;
    sortAsc = false; // highest first
  }
  renderBox();
}

function renderBox(){
  boxBody.innerHTML = "";

  let sorted = [...rows];
  if(sortKey){
    sorted.sort((a,b)=>{
      const av = a[sortKey];
      const bv = b[sortKey];

      if(typeof av === "string"){
        return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
      }else{
        return sortAsc ? (av-bv) : (bv-av);
      }
    });
  }else{
    sorted.sort((a,b)=>b.pts - a.pts);
  }

  sorted.forEach(r=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><a class="player-link" href="${playerHref(r.player)}">${r.player}</a></td>
      <td><a class="team-link" href="${teamHref(r.team)}">${r.team}</a></td>
      <td>${r.min}</td>
      <td>${r.pts}</td>
      <td>${r.reb}</td>
      <td>${r.ast}</td>
      <td>${r.stl}</td>
      <td>${r.blk}</td>
      <td>${r.to}</td>
      <td>${r.pf}</td>
    `;
    boxBody.appendChild(tr);
  });
}

async function loadGame(){
  if(!season || !gameStr){
    showError("Missing URL parameters.");
    return;
  }

  const file = seasonToFile(season);
  if(!file){
    showError(`Season format not recognised: "${season}".`);
    return;
  }

  titleEl.textContent = gameStr;
  subtitleEl.textContent = `Season ${season}`;

  try{
    const res = await fetch("data/nba/" + file);
    if(!res.ok) throw new Error("fetch failed");
    const data = await res.json();

    const match = (data.games || []).find(g => {
      return `${g.home_team} vs ${g.away_team}` === gameStr;
    });

    if(!match){
      showError(`Couldn't find this game.`);
      return;
    }

    summaryEl.style.display = "flex";

    const scoreText =
      `${match.home_team} ${match.home_points} – ${match.away_points} ${match.away_team}`;

    scoreLine.innerHTML = `
      <a class="team-link" href="${teamHref(match.home_team)}">${match.home_team}</a>
      ${match.home_points} – ${match.away_points}
      <a class="team-link" href="${teamHref(match.away_team)}">${match.away_team}</a>
    `;

    const date = match.date || "";
    const venue = match.venue || "";
    metaLine.textContent = [date, venue].filter(Boolean).join(" • ") || "—";

    rows = (match.players || []).map(p=>({
      player: p.player || "",
      team: p.team || "",
      min: p.min || "",
      pts: safeNum(p.pts),
      reb: safeNum(p.reb),
      ast: safeNum(p.ast),
      stl: safeNum(p.stl),
      blk: safeNum(p.blk),
      to: safeNum(p.to),
      pf: safeNum(p.pf)
    }));

    boxTable.style.display = "table";
    hint.textContent = "Click a column header to sort (highest first).";
    renderBox();

  }catch(e){
    showError("Could not load season file: data/nba/" + file);
  }
}

loadGame();
</script>

</body>
</html>
