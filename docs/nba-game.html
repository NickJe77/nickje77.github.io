<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));color:#fff;
  padding:44px 20px;text-align:center;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(20px,4vw,30px);
  letter-spacing:.01em;text-transform:uppercase;
}
.hero .score{
  font-family:var(--display);font-size:clamp(44px,8vw,68px);font-weight:600;margin:10px 0;
}
.hero .meta{font-size:13.5px;color:rgba(255,255,255,.65);margin-top:6px;}

.page-wrap{max-width:1400px;margin:0 auto;padding:26px 20px 70px;}

.linescore{
  width:100%;border-collapse:collapse;margin-bottom:24px;font-size:13.5px;
  background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
}
.linescore th,.linescore td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:center;}
.linescore th{
  background:#f7f9fb;color:var(--muted);font-family:var(--body);font-weight:600;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;
}
.linescore tbody tr:last-child td{border-bottom:none;}
.linescore .team-name{text-align:left;font-weight:700;color:var(--ink);}
.linescore .total{font-weight:700;font-size:15px;color:var(--ink);}

.team-section{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;margin-bottom:20px;
}
.team-section h2{
  margin:0 0 14px;font-family:var(--display);font-weight:600;font-size:18px;
  letter-spacing:.01em;text-transform:uppercase;color:var(--ink);
}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{
  background:#f7f9fb;color:var(--muted);padding:9px 8px;font-weight:600;text-align:center;
  font-family:var(--body);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;
  border-bottom:1px solid var(--line);
}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.player-name{text-align:left;font-weight:700;}
.player-link{color:var(--ink);text-decoration:none;font-weight:700;}
.player-link:hover{color:var(--accent);}
.dnp{color:var(--faint);font-style:italic;}
.loading{text-align:center;padding:60px;font-size:15px;color:var(--muted);font-style:italic;}
@media(max-width:900px){
  .hero .score{font-size:44px;}
  table{display:block;overflow-x:auto;}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div id="hero" class="hero">
  <div class="loading">Loading game...</div>
</div>

<div class="page-wrap">
  <div id="content" class="loading">Loading game data...</div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

const params = new URLSearchParams(location.search);
const season = params.get("season");
const gameId = params.get("game");

const heroEl    = document.getElementById("hero");
const contentEl = document.getElementById("content");

// Fix UTF-8 names that were stored with wrong encoding
function fixName(str){
  if(!str) return str;
  try{
    const bytes = new Uint8Array(str.length);
    for(let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const decoded = new TextDecoder('utf-8').decode(bytes);
    // If decoding produced replacement chars, return original
    if(decoded.includes('\ufffd')) return str;
    return decoded;
  }catch(e){
    return str;
  }
}

const STAT_LABELS = {
  mp:         "MIN",
  pts:        "PTS",
  ast:        "AST",
  reb:        "REB",
  stl:        "STL",
  blk:        "BLK",
  tov:        "TOV",
  fg:         "FG",
  fga:        "FGA",
  fg_pct:     "FG%",
  fg3:        "3P",
  fg3a:       "3PA",
  fg3_pct:    "3P%",
  ft:         "FT",
  fta:        "FTA",
  ft_pct:     "FT%",
  orb:        "ORB",
  drb:        "DRB",
  pf:         "PF",
  plus_minus: "+/-",
};

const STAT_KEYS = Object.keys(STAT_LABELS);

async function loadGame(){
  try{
    const res = await fetch(`${R2}/basketball/boxscores/${season}/${gameId}.json`);
    if(!res.ok) throw new Error("Game not found");
    const data = await res.json();
    renderGame(data);
  }catch(err){
    console.error(err);
    heroEl.innerHTML    = `<div class="loading">Failed to load game</div>`;
    contentEl.innerHTML = "";
  }
}

function renderGame(data){
  const linescore = data.linescore || {};
  const gameId    = data.game_id   || "";
  const homeTeam  = data.home      || "";
  const awayTeam  = data.away      || "";
  const teams     = data.teams     || {};
  const abbrs     = Object.keys(linescore);

  let homeScore = "–";
  let awayScore = "–";
  abbrs.forEach(abbr => {
    const total = linescore[abbr].T || "–";
    if(gameId.endsWith(abbr)) homeScore = total;
    else awayScore = total;
  });

  const quarters = abbrs.length > 0
    ? Object.keys(linescore[abbrs[0]]).filter(k => k !== "T")
    : [];

  const homeAbbr = abbrs.find(a =>  gameId.endsWith(a));
  const awayAbbr = abbrs.find(a => !gameId.endsWith(a));

  document.title = `${awayTeam} @ ${homeTeam} | NBA`;

  heroEl.innerHTML = `
    <h1>${awayTeam} @ ${homeTeam}</h1>
    <div class="score">${awayScore} – ${homeScore}</div>
    <div class="meta">${data.date || ""}${data.arena ? " • " + data.arena : ""}</div>
  `;

  const linescoreHtml = `
    <table class="linescore">
      <thead>
        <tr>
          <th style="text-align:left;">Team</th>
          ${quarters.map(q => `<th>${q}</th>`).join("")}
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="team-name">${awayTeam}</td>
          ${quarters.map(q => `<td>${awayAbbr ? (linescore[awayAbbr][q] || "–") : "–"}</td>`).join("")}
          <td class="total">${awayScore}</td>
        </tr>
        <tr>
          <td class="team-name">${homeTeam}</td>
          ${quarters.map(q => `<td>${homeAbbr ? (linescore[homeAbbr][q] || "–") : "–"}</td>`).join("")}
          <td class="total">${homeScore}</td>
        </tr>
      </tbody>
    </table>
  `;

  const teamOrder = [
    { name: awayTeam, abbr: awayAbbr },
    { name: homeTeam, abbr: homeAbbr },
  ];

  const teamTables = teamOrder.map(({ name, abbr }) => {
    const players = (abbr && teams[abbr]) ? teams[abbr] : [];
    const active  = players.filter(p => !p.dnp);
    const dnp     = players.filter(p =>  p.dnp);

    const rows = active.map(p => `
      <tr>
        <td class="player-name">
          <a class="player-link" href="/nba-player.html?id=${encodeURIComponent(p.player_id || '')}">
            ${fixName(p.player || "")}
          </a>
        </td>
        ${STAT_KEYS.map(k => {
          const val = k === "reb" ? p["trb"] : p[k];
          return `<td>${val != null ? val : "–"}</td>`;
        }).join("")}
      </tr>
    `).join("");

    const dnpRows = dnp.map(p => `
      <tr>
        <td class="player-name dnp">${fixName(p.player || "")}</td>
        <td colspan="${STAT_KEYS.length}" style="text-align:left;" class="dnp">${p.dnp}</td>
      </tr>
    `).join("");

    return `
      <div class="team-section">
        <h2>${name}</h2>
        <table>
          <thead>
            <tr>
              <th style="text-align:left;">Player</th>
              ${STAT_KEYS.map(k => `<th>${STAT_LABELS[k]}</th>`).join("")}
            </tr>
          </thead>
          <tbody>${rows}${dnpRows}</tbody>
        </table>
      </div>
    `;
  }).join("");

  contentEl.innerHTML = linescoreHtml + teamTables;
}

loadGame();
</script>
</body>
</html>
