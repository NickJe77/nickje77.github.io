<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;}
.score{text-align:center;font-size:22px;font-weight:700;margin:10px 0 20px;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:center;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
.reserves{font-weight:700;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title"></h1>
<div class="score" id="score"></div>

<table>
<thead>
<tr>
  <th>Player</th>
  <th>Team</th>
  <th>MIN</th>
  <th>PTS</th>
  <th>REB</th>
  <th>AST</th>
  <th>STL</th>
  <th>BLK</th>
  <th>TO</th>
  <th>PF</th>
</tr>
</thead>
<tbody id="playerTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const season = params.get("season");
const gameIndex = parseInt(params.get("game"), 10);

const file = "data/nba/nba_season_" + season + ".json";
const titleEl = document.getElementById("title");
const scoreEl = document.getElementById("score");
const table = document.getElementById("playerTable");

/* TEAM CODE → NICKNAME MAP */
const teamMap = {
  "NJN": "New Jersey Nets",
  "DET": "Detroit Pistons",
  "BOS": "Boston Celtics",
  "NYK": "New York Knicks",
  "PHI": "Philadelphia 76ers",
  "CHI": "Chicago Bulls",
  "LAL": "Los Angeles Lakers",
  "GSW": "Golden State Warriors",
  "MIL": "Milwaukee Bucks",
  "ATL": "Atlanta Hawks",
  "CLE": "Cleveland Cavaliers",
  "IND": "Indiana Pacers",
  "SEA": "Seattle SuperSonics",
  "POR": "Portland Trail Blazers",
  "PHO": "Phoenix Suns",
  "SAS": "San Antonio Spurs",
  "UTA": "Utah Jazz",
  "DEN": "Denver Nuggets",
  "HOU": "Houston Rockets",
  "DAL": "Dallas Mavericks",
  "LAC": "Los Angeles Clippers",
  "WAS": "Washington Bullets"
};

function teamName(code){
  return teamMap[code] || code;
}

fetch(file)
.then(r => r.json())
.then(data => {
  const game = data.games[gameIndex];

  const home = game.home_team;
  const away = game.away_team;
  const hp = game.home_points;
  const ap = game.away_points;

  titleEl.textContent = home + " vs " + away;
  scoreEl.textContent = hp + " – " + ap;

  game.players.forEach(p => {
    const tr = document.createElement("tr");

    const isReserves = p.player.toLowerCase() === "reserves";
    const playerCell = isReserves
      ? `<span class="reserves">${p.player}</span>`
      : p.player;

    tr.innerHTML = `
      <td>${playerCell}</td>
      <td>${teamName(p.team)}</td>
      <td>${p.min || ""}</td>
      <td>${p.pts || 0}</td>
      <td>${p.reb || 0}</td>
      <td>${p.ast || 0}</td>
      <td>${p.stl || 0}</td>
      <td>${p.blk || 0}</td>
      <td>${p.to || 0}</td>
      <td>${p.pf || 0}</td>
    `;

    table.appendChild(tr);
  });
});
</script>

</body>
</html>
