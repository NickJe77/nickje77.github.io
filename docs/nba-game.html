<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;color:#111;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.hero{background:linear-gradient(90deg,#1D428A,#C8102E);color:white;padding:50px 20px;text-align:center;}
.hero h1{margin:0;font-size:36px;font-weight:900;}
.hero .score{font-size:72px;font-weight:900;margin:10px 0;}
.hero .meta{font-size:16px;opacity:.85;margin-top:8px;}
.page-wrap{max-width:1400px;margin:30px auto;padding:0 20px 60px;}
.linescore{width:100%;border-collapse:collapse;margin-bottom:24px;font-size:14px;}
.linescore th,.linescore td{padding:10px 12px;border:1px solid #ddd;text-align:center;}
.linescore th{background:#1D428A;color:white;font-weight:800;}
.linescore .team-name{text-align:left;font-weight:800;}
.linescore .total{font-weight:900;font-size:16px;}
.team-section{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:24px;}
.team-section h2{margin:0 0 16px;font-size:22px;font-weight:800;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#eef3ff;padding:10px 8px;font-weight:800;text-align:center;}
td{padding:10px 8px;border-bottom:1px solid #eee;text-align:center;}
tr:nth-child(even){background:#f8faff;}
.player-name{text-align:left;font-weight:700;}
.player-link{color:#0056d6;text-decoration:none;font-weight:700;}
.player-link:hover{text-decoration:underline;}
.dnp{color:#999;font-style:italic;}
.loading{text-align:center;padding:60px;font-size:18px;color:#666;}
@media(max-width:900px){
  .hero h1{font-size:24px;}
  .hero .score{font-size:48px;}
  table{display:block;overflow-x:auto;}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div id="hero" class="hero">
  <div class="loading">Loading game...</div>
</div>

<div class="page-wrap">
  <div id="content" class="loading">Loading game data...</div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

const params = new URLSearchParams(location.search);
const season = params.get("season");
const gameId = params.get("game");

const heroEl    = document.getElementById("hero");
const contentEl = document.getElementById("content");

const STAT_LABELS = {
  mp:         "MIN",
  pts:        "PTS",
  ast:        "AST",
  reb:        "REB",
  stl:        "STL",
  blk:        "BLK",
  tov:        "TOV",
  fg:         "FG",
  fga:        "FGA",
  fg_pct:     "FG%",
  fg3:        "3P",
  fg3a:       "3PA",
  fg3_pct:    "3P%",
  ft:         "FT",
  fta:        "FTA",
  ft_pct:     "FT%",
  orb:        "ORB",
  drb:        "DRB",
  pf:         "PF",
  plus_minus: "+/-",
};

const STAT_KEYS = Object.keys(STAT_LABELS);

async function loadGame(){
  try{
    const res = await fetch(`${R2}/basketball/boxscores/${season}/${gameId}.json`);
    if(!res.ok) throw new Error("Game not found");
    const data = await res.json();
    renderGame(data);
  }catch(err){
    console.error(err);
    heroEl.innerHTML    = `<div class="loading">Failed to load game</div>`;
    contentEl.innerHTML = "";
  }
}

function renderGame(data){
  const linescore = data.linescore || {};
  const gameId    = data.game_id   || "";
  const homeTeam  = data.home      || "";
  const awayTeam  = data.away      || "";
  const teams     = data.teams     || {};
  const abbrs     = Object.keys(linescore);

  let homeScore = "–";
  let awayScore = "–";
  abbrs.forEach(abbr => {
    const total = linescore[abbr].T || "–";
    if(gameId.endsWith(abbr)) homeScore = total;
    else awayScore = total;
  });

  const quarters = abbrs.length > 0
    ? Object.keys(linescore[abbrs[0]]).filter(k => k !== "T")
    : [];

  const homeAbbr = abbrs.find(a =>  gameId.endsWith(a));
  const awayAbbr = abbrs.find(a => !gameId.endsWith(a));

  document.title = `${awayTeam} @ ${homeTeam} | NBA`;

  heroEl.innerHTML = `
    <h1>${awayTeam} @ ${homeTeam}</h1>
    <div class="score">${awayScore} – ${homeScore}</div>
    <div class="meta">${data.date || ""}${data.arena ? " • " + data.arena : ""}</div>
  `;

  const linescoreHtml = `
    <table class="linescore">
      <thead>
        <tr>
          <th style="text-align:left;">Team</th>
          ${quarters.map(q => `<th>${q}</th>`).join("")}
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="team-name">${awayTeam}</td>
          ${quarters.map(q => `<td>${awayAbbr ? (linescore[awayAbbr][q] || "–") : "–"}</td>`).join("")}
          <td class="total">${awayScore}</td>
        </tr>
        <tr>
          <td class="team-name">${homeTeam}</td>
          ${quarters.map(q => `<td>${homeAbbr ? (linescore[homeAbbr][q] || "–") : "–"}</td>`).join("")}
          <td class="total">${homeScore}</td>
        </tr>
      </tbody>
    </table>
  `;

  const teamOrder = [
    { name: awayTeam, abbr: awayAbbr },
    { name: homeTeam, abbr: homeAbbr },
  ];

  const teamTables = teamOrder.map(({ name, abbr }) => {
    const players = (abbr && teams[abbr]) ? teams[abbr] : [];
    const active  = players.filter(p => !p.dnp);
    const dnp     = players.filter(p =>  p.dnp);

    const rows = active.map(p => `
      <tr>
        <td class="player-name">
          <a class="player-link" href="/nba-player.html?id=${encodeURIComponent(p.player_id || '')}">
            ${p.player || ""}
          </a>
        </td>
        ${STAT_KEYS.map(k => {
          const val = k === "reb" ? p["trb"] : p[k];
          return `<td>${val != null ? val : "–"}</td>`;
        }).join("")}
      </tr>
    `).join("");

    const dnpRows = dnp.map(p => `
      <tr>
        <td class="player-name dnp">${p.player || ""}</td>
        <td colspan="${STAT_KEYS.length}" style="text-align:left;" class="dnp">${p.dnp}</td>
      </tr>
    `).join("");

    return `
      <div class="team-section">
        <h2>${name}</h2>
        <table>
          <thead>
            <tr>
              <th style="text-align:left;">Player</th>
              ${STAT_KEYS.map(k => `<th>${STAT_LABELS[k]}</th>`).join("")}
            </tr>
          </thead>
          <tbody>${rows}${dnpRows}</tbody>
        </table>
      </div>
    `;
  }).join("");

  contentEl.innerHTML = linescoreHtml + teamTables;
}

loadGame();
</script>
</body>
</html>
