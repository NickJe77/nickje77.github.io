<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
  color:#1f2937;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:700;
  background:#fff;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.navbar a:hover{
  text-decoration:underline;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#17408B,#C9082A);
  color:#fff;
  border-radius:18px;
  padding:28px 28px 24px;
  margin-bottom:24px;
  box-shadow:0 10px 24px rgba(0,0,0,0.10);
}

.hero h1{
  margin:0 0 8px;
  text-align:center;
  font-size:34px;
  line-height:1.15;
}

.subtitle{
  text-align:center;
  color:rgba(255,255,255,0.92);
  margin:0;
  font-size:16px;
}

.bad{
  background:#fff3f3;
  border:1px solid #ffd0d0;
  color:#a40000;
  padding:12px 14px;
  border-radius:12px;
  max-width:900px;
  margin:0 auto 18px;
}

.summary{
  display:flex;
  justify-content:center;
  margin-bottom:26px;
}

.score-card{
  background:#f4f7ff;
  border:1px solid #dbe7ff;
  border-radius:16px;
  padding:18px 24px;
  min-width:320px;
  text-align:center;
  box-shadow:0 6px 18px rgba(23,64,139,0.08);
}

.score-label{
  font-size:13px;
  color:#5b6475;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:8px;
  font-weight:700;
}

.score-line{
  font-size:28px;
  font-weight:800;
  color:#111827;
  line-height:1.2;
}

.section{
  margin-bottom:28px;
}

.team-block{
  background:#fff;
  border:1px solid #e6ebf2;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.06);
}

.team-header{
  background:linear-gradient(90deg,#f7faff,#eef4ff);
  border-bottom:1px solid #dde6f5;
  padding:14px 18px;
  text-align:center;
}

.team-title{
  margin:0;
  font-size:22px;
  font-weight:800;
  color:#17408B;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  margin:0;
}

th,td{
  border-bottom:1px solid #e5e7eb;
  padding:10px 12px;
  text-align:center;
  white-space:nowrap;
}

th{
  background:#17408B;
  color:#fff;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
}

td{
  font-size:15px;
}

tbody tr:nth-child(even){
  background:#f7faff;
}

tbody tr:hover{
  background:#e9f0ff;
  cursor:pointer;
}

td:first-child, th:first-child{
  text-align:left;
}

.player-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:700;
}

.player-link:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1 id="title">NBA Game</h1>
    <p class="subtitle" id="subtitle"></p>
  </div>

  <div id="errorBox" class="bad" style="display:none;"></div>

  <div class="summary" id="summary" style="display:none;">
    <div class="score-card">
      <div class="score-label">Final Score</div>
      <div class="score-line" id="scoreLine">-</div>
    </div>
  </div>

  <div class="section">
    <div class="team-block">
      <div class="team-header">
        <h2 class="team-title" id="homeTitle"></h2>
      </div>
      <div class="table-wrap">
        <table id="homeTable">
          <thead>
            <tr>
              <th>Player</th>
              <th>MIN</th>
              <th>PTS</th>
              <th>REB</th>
              <th>AST</th>
              <th>STL</th>
              <th>BLK</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="team-block">
      <div class="team-header">
        <h2 class="team-title" id="awayTitle"></h2>
      </div>
      <div class="table-wrap">
        <table id="awayTable">
          <thead>
            <tr>
              <th>Player</th>
              <th>MIN</th>
              <th>PTS</th>
              <th>REB</th>
              <th>AST</th>
              <th>STL</th>
              <th>BLK</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>

// 🔥 FIXED PATH
const BASE = "docs/data/nba/";

const params = new URLSearchParams(window.location.search);
const gameId = params.get("game");

function showError(msg){
  document.getElementById("errorBox").style.display="block";
  document.getElementById("errorBox").textContent=msg;
}

function renderTable(players,tableId){
  const tbody=document.querySelector(`#${tableId} tbody`);
  tbody.innerHTML="";

  players.forEach(p=>{
    const name=p.player_name || p.name || p.player || "";

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td class="player-link">${name}</td>
      <td>${p.minutes || ""}</td>
      <td>${p.points || 0}</td>
      <td>${p.rebounds || 0}</td>
      <td>${p.assists || 0}</td>
      <td>${p.steals || 0}</td>
      <td>${p.blocks || 0}</td>
    `;

    tr.onclick=()=>{
      location.href="nba-player.html?player="+encodeURIComponent(name);
    };

    tbody.appendChild(tr);
  });
}

async function loadGame(){

  if(!gameId){
    showError("Missing game ID");
    return;
  }

  let game=null;

  // 🔥 SCAN ALL SEASONS (WORKS WITHOUT INDEX)
  for(let y=1970;y<=2030;y++){
    try{
      const res=await fetch(BASE+y+"/"+gameId+".json");
      if(res.ok){
        game=await res.json();
        break;
      }
    }catch{}
  }

  if(!game){
    showError("Game not found");
    return;
  }

  document.getElementById("title").textContent =
    game.away_team + " @ " + game.home_team;

  document.getElementById("subtitle").textContent = game.date;

  document.getElementById("scoreLine").textContent =
    `${game.home_team} ${game.home_score} - ${game.away_score} ${game.away_team}`;

  document.getElementById("summary").style.display="flex";

  document.getElementById("homeTitle").textContent = game.home_team;
  document.getElementById("awayTitle").textContent = game.away_team;

  const home = game.players.filter(p=>p.team===game.home_team);
  const away = game.players.filter(p=>p.team===game.away_team);

  renderTable(home,"homeTable");
  renderTable(away,"awayTable");
}

loadGame();

</script>

</body>
</html>
