<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;color:#111;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.hero{background:linear-gradient(90deg,#1D428A,#C8102E);color:white;padding:50px 20px;text-align:center;}
.hero h1{margin:0;font-size:36px;font-weight:900;}
.hero .score{font-size:72px;font-weight:900;margin:10px 0;}
.hero .meta{font-size:16px;opacity:.85;margin-top:8px;}
.page-wrap{max-width:1400px;margin:30px auto;padding:0 20px 60px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 12px rgba(0,0,0,.05);}
.card h2{margin:0 0 16px;font-size:22px;font-weight:800;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#eef3ff;padding:10px 8px;font-weight:800;text-align:center;}
td{padding:10px 8px;border-bottom:1px solid #eee;text-align:center;}
tr:nth-child(even){background:#f8faff;}
.player-name{text-align:left;font-weight:700;}
.loading{text-align:center;padding:60px;font-size:18px;color:#666;}
.linescore{width:100%;border-collapse:collapse;margin-bottom:24px;font-size:14px;}
.linescore th,.linescore td{padding:10px 12px;border:1px solid #ddd;text-align:center;}
.linescore th{background:#1D428A;color:white;font-weight:800;}
.linescore tr:nth-child(even){background:#f8faff;}
.team-total{font-weight:900;background:#eef3ff !important;}
@media(max-width:900px){
  .grid{grid-template-columns:1fr;}
  .hero h1{font-size:24px;}
  .hero .score{font-size:48px;}
  table{display:block;overflow-x:auto;}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div id="hero" class="hero">
  <div class="loading">Loading game...</div>
</div>

<div class="page-wrap">
  <div id="content" class="loading">Loading game data...</div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

const params = new URLSearchParams(location.search);
const season = params.get("season");
const gameId = params.get("game");

const heroEl   = document.getElementById("hero");
const contentEl = document.getElementById("content");

const STAT_LABELS = {
  mp:         "MIN",
  pts:        "PTS",
  ast:        "AST",
  trb:        "REB",
  stl:        "STL",
  blk:        "BLK",
  tov:        "TOV",
  fg:         "FG",
  fga:        "FGA",
  fg_pct:     "FG%",
  fg3:        "3P",
  fg3a:       "3PA",
  fg3_pct:    "3P%",
  ft:         "FT",
  fta:        "FTA",
  ft_pct:     "FT%",
  orb:        "ORB",
  drb:        "DRB",
  pf:         "PF",
  plus_minus: "+/-",
};

const STAT_KEYS = Object.keys(STAT_LABELS);

async function loadGame(){
  try{
    const res = await fetch(`${R2}/basketball/boxscores/${season}/${gameId}.json`);
    if(!res.ok) throw new Error("Game not found");
    const data = await res.json();
    renderGame(data);
  }catch(err){
    console.error(err);
    heroEl.innerHTML   = `<div class="loading">Failed to load game</div>`;
    contentEl.innerHTML = "";
  }
}

function getScore(data){
  const linescore = data.linescore || {};
  const homeTeam  = data.home || "";
  const awayTeam  = data.away || "";
  const homeData  = linescore[homeTeam] || {};
  const awayData  = linescore[awayTeam] || {};
  return {
    home: homeData.T || "–",
    away: awayData.T || "–",
  };
}

function renderGame(data){
  const score    = getScore(data);
  const homeTeam = data.home || "";
  const awayTeam = data.away || "";

  document.title = `${awayTeam} @ ${homeTeam} | NBA`;

  heroEl.innerHTML = `
    <h1>${awayTeam} @ ${homeTeam}</h1>
    <div class="score">${score.away} – ${score.home}</div>
    <div class="meta">${data.date || ""}${data.arena ? " • " + data.arena : ""}</div>
  `;

  // Linescore table
  const linescore  = data.linescore || {};
  const homeData   = linescore[homeTeam] || {};
  const awayData   = linescore[awayTeam] || {};
  const quarters   = Object.keys(homeData).filter(k => k !== "T");

  let linescoreHtml = `
    <table class="linescore">
      <thead>
        <tr>
          <th>Team</th>
          ${quarters.map(q => `<th>${q}</th>`).join("")}
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="text-align:left;font-weight:800;">${awayTeam}</td>
          ${quarters.map(q => `<td>${awayData[q] || "–"}</td>`).join("")}
          <td class="team-total">${score.away}</td>
        </tr>
        <tr>
          <td style="text-align:left;font-weight:800;">${homeTeam}</td>
          ${quarters.map(q => `<td>${homeData[q] || "–"}</td>`).join("")}
          <td class="team-total">${score.home}</td>
        </tr>
      </tbody>
    </table>
  `;

  // Player stats tables
  const teams      = data.teams || {};
  const teamAbbrs  = Object.keys(teams);

  const teamTables = teamAbbrs.map(abbr => {
    const players = teams[abbr] || [];
    const active  = players.filter(p => !p.dnp);
    const dnp     = players.filter(p => p.dnp);

    const rows = active.map(p => `
      <tr>
        <td class="player-name">${p.player || ""}</td>
        ${STAT_KEYS.map(k => `<td>${p[k] != null ? p[k] : "–"}</td>`).join("")}
      </tr>
    `).join("");

    const dnpRows = dnp.map(p => `
      <tr>
        <td class="player-name">${p.player || ""}</td>
        <td colspan="${STAT_KEYS.length}" style="text-align:left;color:#999;">${p.dnp}</td>
      </tr>
    `).join("");

    return `
      <div class="card">
        <h2>${abbr}</h2>
        <table>
          <thead>
            <tr>
              <th style="text-align:left;">Player</th>
              ${STAT_KEYS.map(k => `<th>${STAT_LABELS[k]}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
            ${rows}
            ${dnpRows}
          </tbody>
        </table>
      </div>
    `;
  }).join("");

  contentEl.innerHTML = `
    ${linescoreHtml}
    <div class="grid">
      ${teamTables}
    </div>
  `;
}

loadGame();
</script>
</body>
</html>
