<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:0 auto;padding:22px 18px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:38px;border-radius:22px;margin-bottom:18px;}
.hero h1{margin:0;font-size:44px;}
.hero p{margin:10px 0 0;font-size:18px;opacity:0.95;}
.grid-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.card{background:#fff;border-radius:16px;padding:16px;}
.card h2{margin:0 0 10px;font-size:18px;}
.season-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;}
.season{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:10px;text-align:center;font-weight:700;cursor:pointer;}
.season:hover{background:#eaf3ff;}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.team{border:1px solid #e5e5e5;border-radius:12px;padding:10px;font-weight:700;cursor:pointer;background:#fff;}
.team:hover{background:#eaf3ff;}
.search{display:flex;gap:10px;align-items:center;}
.search input{flex:1;padding:10px 12px;border:1px solid #ccc;border-radius:10px;font-size:15px;}
.results{margin-top:10px;max-height:320px;overflow:auto;border:1px solid #eee;border-radius:12px;}
.result{padding:10px 12px;border-bottom:1px solid #f1f1f1;cursor:pointer;}
.result:hover{background:#eaf3ff;}
@media(max-width:900px){.grid-wrap{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="afl.html">AFL</a>
  <a href="nfl.html">NFL</a>
  <a href="nba.html">NBA</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page">
  <div class="hero">
    <h1>Baseball</h1>
    <p>MLB seasons, teams, standings and players — 1947 to present</p>
  </div>

  <div class="grid-wrap">
    <div class="card">
      <h2>Seasons</h2>
      <div id="seasonGrid" class="season-grid"></div>
    </div>

    <div class="card">
      <h2>Players</h2>
      <div class="search">
        <input id="playerSearch" placeholder="Search player name..." autocomplete="off">
      </div>
      <div id="playerResults" class="results" style="display:none;"></div>
    </div>

    <div class="card" style="grid-column:1 / -1;">
      <h2>Teams</h2>
      <div id="teamGrid" class="team-grid"></div>
    </div>
  </div>
</div>

<script>
let PLAYERS = [];

async function loadSeasons(){
  const res = await fetch("data/baseball/index.json");
  const years = await res.json();
  const grid = document.getElementById("seasonGrid");
  grid.innerHTML = "";
  years.forEach(y=>{
    const d = document.createElement("div");
    d.className = "season";
    d.textContent = y;
    d.onclick = ()=> window.location = `baseball-season.html?year=${y}`;
    grid.appendChild(d);
  });
}

async function loadTeams(){
  const res = await fetch("data/baseball/teams.json");
  const teams = await res.json();
  const grid = document.getElementById("teamGrid");
  grid.innerHTML = "";
  teams.forEach(t=>{
    const d = document.createElement("div");
    d.className = "team";
    d.textContent = t.name;
    d.onclick = ()=> window.location = `baseball-team.html?team=${t.code}`;
    grid.appendChild(d);
  });
}

async function loadPlayers(){
  const res = await fetch("data/baseball/players.json");
  PLAYERS = await res.json();
}

function setupPlayerSearch(){
  const input = document.getElementById("playerSearch");
  const results = document.getElementById("playerResults");

  input.addEventListener("input", ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){
      results.style.display="none";
      results.innerHTML="";
      return;
    }
    const hits = PLAYERS
      .filter(p => p.name.toLowerCase().includes(q))
      .slice(0, 50);

    results.innerHTML = hits.map(p =>
      `<div class="result" data-id="${p.player_id}">${p.name}</div>`
    ).join("");

    results.style.display = hits.length ? "block" : "none";

    results.querySelectorAll(".result").forEach(el=>{
      el.onclick = ()=> window.location = `baseball-player.html?player=${el.dataset.id}`;
    });
  });
}

(async function init(){
  await loadSeasons();
  await loadTeams();
  await loadPlayers();
  setupPlayerSearch();
})();
</script>

</body>
</html>
