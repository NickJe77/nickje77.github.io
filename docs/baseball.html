<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:white;
  padding:40px;
  border-radius:20px;
  margin-bottom:30px;
}

.hero h1{
  margin:0;
  font-size:42px;
}

.hero p{
  margin-top:10px;
  font-size:18px;
}

.season-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:12px;
}

.season{
  background:white;
  padding:16px;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.season:hover{
  background:#e6f0ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="afl.html">AFL</a>
<a href="nfl.html">NFL</a>
<a href="nba.html">NBA</a>
<a href="cricket.html">Cricket</a>
</div>

<div class="page">

<div class="hero">
<h1>Baseball</h1>
<p>Major League Baseball results, seasons, and games from 1947 onwards</p>
</div>

<div id="seasonGrid" class="season-grid"></div>

</div>

<script>

async function loadSeasons(){

  const res = await fetch("data/baseball/index.json");
  const seasons = await res.json();

  const grid = document.getElementById("seasonGrid");

  seasons.forEach(year=>{

    const div = document.createElement("div");
    div.className="season";
    div.textContent=year;

    div.onclick=()=>{
      window.location=`baseball-season.html?year=${year}`;
    }

    grid.appendChild(div);

  });

}

loadSeasons();

</script>

</body>
</html>
