<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Star Mile Winners | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./css/racing.css">

<style>
body{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;margin:0;}

.navbar{text-align:center;padding:16px 0;border-bottom:1px solid #ddd;}
.navbar a{margin:0 18px;text-decoration:none;font-size:18px;font-weight:600;color:#0056d6;}

.header-hero{
height:260px;
background:url("./images/all-star-mile-header.jpg") center/cover no-repeat;
position:relative;
}
.header-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.6),rgba(0,0,0,.1));}
.page-title{position:absolute;bottom:28px;left:40px;font-size:40px;font-weight:bold;color:white;}

.wrap{max-width:1200px;margin:auto;padding:30px;}

.status{font-size:14px;margin-bottom:12px;color:#444;}

table{width:100%;border-collapse:collapse;font-size:15px;}
thead th{
background:#f2f4f8;
padding:10px;
border-bottom:2px solid #ccc;
text-align:left;
}
tbody td{
padding:10px;
border-bottom:1px solid #ddd;
}
tbody tr:nth-child(even){background:#fafafa;}
tbody tr:hover{background:#f1f6ff;}
</style>
</head>

<body>

<div class="navbar">
 <a href="index.html">Home</a>
 <a href="racing.html">Racing</a>
 <a href="afl.html">AFL</a>
 <a href="football.html">Football</a>
 <a href="cricket.html">Cricket</a>
 <a href="f1.html">F1</a>
</div>

<div class="header-hero">
 <div class="header-overlay"></div>
 <div class="page-title">ALL STAR MILE – WINNERS</div>
</div>

<div class="wrap">

<div id="status" class="status">Loading vic-g1.json…</div>

<table>
<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Jockey</th>
<th>Trainer</th>
<th>Track</th>
<th>Date</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const DATA_URL="./data/vic-g1.json";

const status=document.getElementById("status");
const tbody=document.getElementById("tbody");

fetch(DATA_URL,{cache:"no-store"})
.then(r=>{
 if(!r.ok) throw new Error("Fetch failed");
 return r.json();
})
.then(data=>{
 if(!Array.isArray(data)) throw new Error("JSON not array");

 // All Star Mile rows
 let raceRows=data.filter(o=>{
   let race=o.race||o.Race||"";
   return race.toString().toLowerCase().includes("all star mile");
 });

 // Winners only
 let winners=raceRows.filter(o=>{
   let p=o.pos||o.Pos||o.position||o.Position||o.placing||o.Placing||o.finish||o.Finish;
   if(!p) return true;
   p=p.toString().toLowerCase();
   return p==="1"||p==="1st"||p==="first"||p==="winner"||p==="win";
 });

 status.textContent="Loaded "+winners.length+" All Star Mile winners";

 winners.forEach(o=>{
   tbody.innerHTML+=`
   <tr>
     <td>${o.year||o.Year||""}</td>
     <td>${o.horse||o.Horse||o.winner||o.Winner||""}</td>
     <td>${o.jockey||o.Jockey||""}</td>
     <td>${o.trainer||o.Trainer||""}</td>
     <td>${o.track||o.Track||""}</td>
     <td>${o.date||o.Date||""}</td>
   </tr>`;
 });

 if(winners.length===0){
   status.textContent="vic-g1.json loaded, but no All Star Mile winners found";
 }

})
.catch(e=>{
 status.textContent="vic-g1.json NOT LOADING";
 console.error(e);
});

});
</script>

</body>
</html>
