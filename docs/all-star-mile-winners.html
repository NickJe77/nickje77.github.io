<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Star Mile – Jockeys & Trainers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./css/racing.css">
<style>
body{background:#fff;font-family:Arial;margin:0;}
.filter-bar{max-width:900px;margin:20px auto;display:grid;grid-template-columns:1fr 2fr 2fr 2fr;gap:16px;}
.filter-bar input,select{height:36px;padding:6px 10px;border-radius:6px;border:1px solid #ccc;width:100%;}
table{max-width:900px;margin:auto;border-collapse:collapse;width:100%;}
th,td{padding:9px 10px;border-bottom:1px solid #e1ecfa;}
th{background:#f3f8ff;}
tr:nth-child(even){background:#f7fbff;}
</style>
</head>
<body>

<h1 style="text-align:center;">All Star Mile – Jockeys & Trainers</h1>

<div class="filter-bar">
<select id="yearFilter"><option value="">All</option></select>
<input id="jockeyFilter" list="jockeyList" placeholder="Jockey">
<input id="trainerFilter" list="trainerList" placeholder="Trainer">
<input id="horseFilter" list="horseList" placeholder="Horse">
</div>

<datalist id="jockeyList"></datalist>
<datalist id="trainerList"></datalist>
<datalist id="horseList"></datalist>

<table>
<thead><tr><th>Year</th><th>Horse</th><th>Jockey</th><th>Trainer</th><th>Finish</th></tr></thead>
<tbody id="body"></tbody>
</table>

<script>
const safe=v=>(v||"").toLowerCase();
let all=[];

fetch("./data/vic-g1.json").then(r=>r.json()).then(d=>{
all=d.filter(r=>safe(r.race).includes("all star")).sort((a,b)=>b.year-a.year);

[...new Set(all.map(r=>r.year))].forEach(y=>yearFilter.innerHTML+=`<option>${y}</option>`);
jockeyList.innerHTML=[...new Set(all.map(r=>r.jockey))].map(v=>`<option value="${v}">`).join("");
trainerList.innerHTML=[...new Set(all.map(r=>r.trainer))].map(v=>`<option value="${v}">`).join("");
horseList.innerHTML=[...new Set(all.map(r=>r.horse))].map(v=>`<option value="${v}">`).join("");

render(all);
});

function render(rows){
body.innerHTML=rows.map(r=>`<tr><td>${r.year}</td><td>${r.horse}</td><td>${r.jockey}</td><td>${r.trainer}</td><td>${r.finish}</td></tr>`).join("");
}

function apply(){
render(all.filter(r=>
(!yearFilter.value||r.year==yearFilter.value)&&
(!jockeyFilter.value||safe(r.jockey).includes(safe(jockeyFilter.value)))&&
(!trainerFilter.value||safe(r.trainer).includes(safe(trainerFilter.value)))&&
(!horseFilter.value||safe(r.horse).includes(safe(horseFilter.value)))
));
}

yearFilter.onchange=jockeyFilter.oninput=trainerFilter.oninput=horseFilter.oninput=apply;
</script>
</body>
</html>
