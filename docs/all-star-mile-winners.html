<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Star Mile Winners</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;margin:0;background:#fff;color:#111;}
h1{padding:20px;margin:0;}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px;border-bottom:1px solid #ccc;text-align:left;}
th{background:#f2f2f2;}
tr:nth-child(even){background:#fafafa;}
#status{padding:15px;font-weight:bold;}
</style>
</head>

<body>

<h1>All Star Mile – Winners</h1>
<div id="status">Loading…</div>

<table>
<thead>
<tr>
<th>Year</th>
<th>Horse</th>
<th>Jockey</th>
<th>Trainer</th>
<th>Track</th>
<th>Date</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const DATA_URL = "./data/all-star-mile.json";

const status=document.getElementById("status");
const tbody=document.getElementById("tbody");

fetch(DATA_URL,{cache:"no-store"})
.then(r=>{
 if(!r.ok) throw new Error("Fetch failed");
 return r.json();
})
.then(data=>{
 if(!Array.isArray(data)) throw new Error("JSON is not an array");

 let winners=data.filter(o=>{
   let p=o.pos||o.Pos||o.position||o.Position||o.placing||o.Placing||o.finish||o.Finish;
   if(!p) return true;
   p=p.toString().toLowerCase();
   return p==="1"||p==="1st"||p==="first"||p==="winner"||p==="win";
 });

 status.textContent="Loaded "+winners.length+" winners";

 winners.forEach(o=>{
   let year=o.year||o.Year||"";
   let horse=o.horse||o.Horse||o.winner||o.Winner||"";
   let jockey=o.jockey||o.Jockey||"";
   let trainer=o.trainer||o.Trainer||"";
   let track=o.track||o.Track||"";
   let date=o.date||o.Date||"";

   tbody.innerHTML+=`
   <tr>
     <td>${year}</td>
     <td>${horse}</td>
     <td>${jockey}</td>
     <td>${trainer}</td>
     <td>${track}</td>
     <td>${date}</td>
   </tr>`;
 });
})
.catch(e=>{
 status.textContent="JSON NOT LOADING";
 console.error(e);
});
});
</script>

</body>
</html>
