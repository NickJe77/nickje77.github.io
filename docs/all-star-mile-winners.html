<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Star Mile Winners</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;margin:0;background:#fff;color:#111;}
h1{padding:20px;margin:0;}
#status{padding:15px;font-weight:bold;}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px;border-bottom:1px solid #ccc;text-align:left;}
th{background:#f2f2f2;}
tr:nth-child(even){background:#fafafa;}
</style>
</head>

<body>

<h1>All Star Mile – Winners</h1>
<div id="status">Loading vic-g1.json…</div>

<table>
<thead>
<tr>
<th>Year</th>
<th>Horse</th>
<th>Jockey</th>
<th>Trainer</th>
<th>Track</th>
<th>Date</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const DATA_URL = "./data/vic-g1.json";

const status=document.getElementById("status");
const tbody=document.getElementById("tbody");

fetch(DATA_URL,{cache:"no-store"})
.then(r=>{
 if(!r.ok) throw new Error("Fetch failed");
 return r.json();
})
.then(data=>{
 if(!Array.isArray(data)) throw new Error("JSON not array");

 // FILTER TO ALL STAR MILE
 let raceRows = data.filter(o=>{
   let race=o.race||o.Race||"";
   return race.toString().toLowerCase().includes("all star mile");
 });

 // FILTER TO WINNERS
 let winners = raceRows.filter(o=>{
   let p=o.pos||o.Pos||o.position||o.Position||o.placing||o.Placing||o.finish||o.Finish;
   if(!p) return true;
   p=p.toString().toLowerCase();
   return p==="1"||p==="1st"||p==="first"||p==="winner"||p==="win";
 });

 status.textContent="Loaded "+winners.length+" All Star Mile winners";

 winners.forEach(o=>{
   tbody.innerHTML+=`
   <tr>
     <td>${o.year||o.Year||""}</td>
     <td>${o.horse||o.Horse||o.winner||o.Winner||""}</td>
     <td>${o.jockey||o.Jockey||""}</td>
     <td>${o.trainer||o.Trainer||""}</td>
     <td>${o.track||o.Track||""}</td>
     <td>${o.date||o.Date||""}</td>
   </tr>`;
 });

 if(winners.length===0){
   status.textContent="JSON loaded, but no All Star Mile winners found";
 }

})
.catch(e=>{
 status.textContent="vic-g1.json NOT LOADING";
 console.error(e);
});

});
</script>

</body>
</html>
