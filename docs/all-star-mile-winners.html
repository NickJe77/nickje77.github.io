<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Star Mile – Winners</title>

<link rel="stylesheet" href="./css/racing.css">

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#fff;
  color:#111;
}

.wrap{
  max-width:1400px;
  margin:0 auto;
  padding:24px 26px 40px;
}

h1{
  text-align:center;
  font-size:56px;
  font-weight:900;
  margin:10px 0 30px;
}

/* FILTERS */
.filters{
  display:flex;
  justify-content:center;
  gap:26px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.filters-row-2{
  display:flex;
  justify-content:center;
  margin-bottom:30px;
}

.ctrl{
  width:420px;
  height:64px;
  border:2px solid #d6d6d6;
  border-radius:10px;
  padding:0 18px;
  font-size:22px;
  box-sizing:border-box;
  background:#fff;
}

.ctrl::placeholder{color:#9b9b9b;}

select.ctrl{
  appearance:auto;
}

/* TABLE */
.table-wrap{overflow-x:auto;}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

thead th{
  background:#eef6ff;
  font-size:28px;
  padding:18px;
  border-bottom:2px solid #d7e6fb;
  text-align:left;
}

tbody td{
  font-size:30px;
  padding:18px;
  border-bottom:2px solid #d7e6fb;
}

tbody tr:nth-child(even){
  background:#f7fbff;
}
</style>
</head>

<body>
<div class="wrap">

<h1>All Star Mile – Winners</h1>

<div class="filters">
  <select id="yearSelect" class="ctrl"></select>

  <input id="jockeyInput" class="ctrl" placeholder="Jockey" list="jockeyList" autocomplete="off">
  <datalist id="jockeyList"></datalist>

  <input id="trainerInput" class="ctrl" placeholder="Trainer" list="trainerList" autocomplete="off">
  <datalist id="trainerList"></datalist>
</div>

<div class="filters-row-2">
  <input id="horseInput" class="ctrl" placeholder="Horse" list="horseList" autocomplete="off">
  <datalist id="horseList"></datalist>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Year</th>
  <th>Horse</th>
  <th>Jockey</th>
  <th>Trainer</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const DATA_URL="./data/vic-g1.json";
const RACE_MATCH="all star mile";

const yearSelect=document.getElementById("yearSelect");
const jockeyInput=document.getElementById("jockeyInput");
const trainerInput=document.getElementById("trainerInput");
const horseInput=document.getElementById("horseInput");

const jockeyList=document.getElementById("jockeyList");
const trainerList=document.getElementById("trainerList");
const horseList=document.getElementById("horseList");

const tbody=document.getElementById("tbody");

let rows=[];

const norm=v=>(v??"").toString().trim();
const lower=v=>norm(v).toLowerCase();

function pick(o,keys){
 for(const k of keys){
   if(o && o[k]!=null && norm(o[k])!=="") return o[k];
 }
 return "";
}

function getYear(o){
 let y=pick(o,["year","Year","YEAR"]);
 if(y) return parseInt(y,10);
 let d=norm(pick(o,["date","Date","DATE"]));
 let m=d.match(/(19|20)\d{2}/);
 return m?parseInt(m[0],10):"";
}

function uniqueSorted(arr){
 return Array.from(new Set(arr.filter(Boolean))).sort((a,b)=>String(a).localeCompare(String(b)));
}

function buildYear(){
 let years=[...new Set(rows.map(r=>r.year).filter(Boolean))].sort((a,b)=>b-a);
 yearSelect.innerHTML="<option value=''>Year</option>";
 years.forEach(y=>{
   let o=document.createElement("option");
   o.value=y;o.textContent=y;
   yearSelect.appendChild(o);
 });
}

function buildLists(){
 jockeyList.innerHTML="";
 trainerList.innerHTML="";
 horseList.innerHTML="";

 uniqueSorted(rows.map(r=>r.jockey)).forEach(v=>{
   let o=document.createElement("option");o.value=v;jockeyList.appendChild(o);
 });
 uniqueSorted(rows.map(r=>r.trainer)).forEach(v=>{
   let o=document.createElement("option");o.value=v;trainerList.appendChild(o);
 });
 uniqueSorted(rows.map(r=>r.horse)).forEach(v=>{
   let o=document.createElement("option");o.value=v;horseList.appendChild(o);
 });
}

function render(list){
 tbody.innerHTML="";
 list.forEach(r=>{
   tbody.innerHTML+=`
   <tr>
     <td>${r.year||""}</td>
     <td>${r.horse||""}</td>
     <td>${r.jockey||""}</td>
     <td>${r.trainer||""}</td>
   </tr>`;
 });
}

function apply(){
 let y=yearSelect.value;
 let jq=lower(jockeyInput.value);
 let tq=lower(trainerInput.value);
 let hq=lower(horseInput.value);

 let out=rows.slice();

 if(y) out=out.filter(r=>r.year==y);
 if(jq) out=out.filter(r=>lower(r.jockey).includes(jq));
 if(tq) out=out.filter(r=>lower(r.trainer).includes(tq));
 if(hq) out=out.filter(r=>lower(r.horse).includes(hq));

 render(out);
}

fetch(DATA_URL,{cache:"no-store"})
.then(r=>r.json())
.then(data=>{

 rows=data
 .filter(o=>lower(pick(o,["race","Race","RACE"])).includes(RACE_MATCH))
 .filter(o=>{
   let f=lower(pick(o,["finish","Finish","pos","Pos","position","Position","placing","Placing"]));
   return f==="1"||f==="1st"||f==="first"||f==="winner"||f==="win";
 })
 .map(o=>({
   year:getYear(o),
   horse:norm(pick(o,["horse","Horse","winner","Winner"])),
   jockey:norm(pick(o,["jockey","Jockey"])),
   trainer:norm(pick(o,["trainer","Trainer"]))
 }))
 .sort((a,b)=>(b.year||0)-(a.year||0));

 buildYear();
 buildLists();
 render(rows);

 yearSelect.onchange=apply;
 jockeyInput.oninput=apply;
 trainerInput.oninput=apply;
 horseInput.oninput=apply;

})
.catch(e=>{
 tbody.innerHTML="<tr><td colspan='4'>Data not loading</td></tr>";
 console.error(e);
});

});
</script>
</body>
</html>
