<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Star Mile Winners | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./css/racing.css">

<style>
body{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;margin:0;}

.navbar{text-align:center;padding:16px 0;border-bottom:1px solid #ddd;}
.navbar a{margin:0 18px;text-decoration:none;font-size:18px;font-weight:600;color:#0056d6;}

.header-hero{
height:260px;
background:url("./images/all-star-mile-header.jpg") center/cover no-repeat;
position:relative;
}
.header-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.6),rgba(0,0,0,.1));}
.page-title{position:absolute;bottom:28px;left:40px;font-size:40px;font-weight:bold;color:white;}

.wrap{max-width:1200px;margin:auto;padding:30px;}

.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.filters select,.filters input,.filters button{
width:260px;height:44px;
border:1px solid #ccc;
border-radius:8px;
padding:8px;font-size:15px;
}

table{width:100%;border-collapse:collapse;font-size:15px;}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;}
th{background:#f2f4f8;}
tr:nth-child(even){background:#fafafa;}
tr:hover{background:#f1f6ff;}

.status{margin-bottom:10px;font-size:14px;color:#444;}
</style>
</head>

<body>

<div class="navbar">
 <a href="index.html">Home</a>
 <a href="racing.html">Racing</a>
 <a href="afl.html">AFL</a>
 <a href="football.html">Football</a>
 <a href="cricket.html">Cricket</a>
 <a href="f1.html">F1</a>
</div>

<div class="header-hero">
 <div class="header-overlay"></div>
 <div class="page-title">ALL STAR MILE – WINNERS</div>
</div>

<div class="wrap">

<div class="filters">
  <select id="yearSelect"></select>

  <input id="queryInput" list="nameSuggestions" placeholder="Search horse, jockey or trainer">
  <datalist id="nameSuggestions"></datalist>

  <button id="clearBtn">Clear</button>
</div>

<div id="status" class="status"></div>

<table>
<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Jockey</th>
<th>Trainer</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const DATA_URL="./data/vic-g1.json";

const yearSelect=document.getElementById("yearSelect");
const queryInput=document.getElementById("queryInput");
const nameSuggestions=document.getElementById("nameSuggestions");
const clearBtn=document.getElementById("clearBtn");
const tbody=document.getElementById("tbody");
const status=document.getElementById("status");

let winners=[];

const norm=v=>(v??"").toString().trim();
const lower=v=>norm(v).toLowerCase();

function pick(o,arr){
 for(const k of arr){
   if(o[k]!=null && norm(o[k])!=="") return o[k];
 }
 return "";
}

function getYear(o){
 let y=pick(o,["year","Year"]);
 if(y) return parseInt(y,10);
 let d=pick(o,["date","Date"]);
 let m=d.match(/(19|20)\d{2}/);
 return m?parseInt(m[0],10):"";
}

function isWinner(o){
 let p=pick(o,["pos","Pos","position","Position","placing","Placing","finish","Finish"]);
 if(!p) return true;
 p=lower(p);
 return p==="1"||p==="1st"||p==="first"||p==="winner"||p==="win";
}

fetch(DATA_URL,{cache:"no-store"})
.then(r=>r.json())
.then(data=>{
 let raceRows=data.filter(o=>{
   let race=o.race||o.Race||"";
   return race.toLowerCase().includes("all star mile");
 });

 winners=raceRows.filter(isWinner).map(o=>({
   year:getYear(o),
   horse:norm(pick(o,["horse","Horse","winner","Winner"])),
   jockey:norm(pick(o,["jockey","Jockey"])),
   trainer:norm(pick(o,["trainer","Trainer"]))
 }));

 buildFilters();
 render(winners);
 status.textContent="Loaded "+winners.length+" winners";
})
.catch(e=>{
 status.textContent="vic-g1.json not loading";
 console.error(e);
});

function buildFilters(){
 let years=[...new Set(winners.map(r=>r.year).filter(Boolean))].sort((a,b)=>b-a);
 yearSelect.innerHTML="<option value='ALL'>All Years</option>";
 years.forEach(y=>yearSelect.innerHTML+=`<option>${y}</option>`);

 let names=[];
 winners.forEach(r=>{
   if(r.horse)names.push(r.horse);
   if(r.jockey)names.push(r.jockey);
   if(r.trainer)names.push(r.trainer);
 });
 names=[...new Set(names)].sort();
 nameSuggestions.innerHTML="";
 names.forEach(n=>nameSuggestions.innerHTML+=`<option value="${n}">`);
}

function apply(){
 let y=yearSelect.value;
 let q=lower(queryInput.value);

 let rows=winners.filter(r=>{
   return (y==="ALL"||r.year==y)&&
   (lower(r.horse)+lower(r.jockey)+lower(r.trainer)).includes(q);
 });

 render(rows);
}

function render(rows){
 tbody.innerHTML="";
 rows.forEach(r=>{
   tbody.innerHTML+=`
   <tr>
     <td>${r.year||""}</td>
     <td>${r.horse||""}</td>
     <td>${r.jockey||""}</td>
     <td>${r.trainer||""}</td>
   </tr>`;
 });
}

yearSelect.onchange=apply;
queryInput.oninput=apply;
clearBtn.onclick=()=>{
 yearSelect.value="ALL";
 queryInput.value="";
 render(winners);
};

});
</script>

</body>
</html>
