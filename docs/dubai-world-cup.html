<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dubai World Cup Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="racing.css">

  <style>
    .hero-wrap {
      max-width: 1200px;
      margin: 24px auto 10px;
      padding: 0 24px;
    }

    .hero-card {
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }

    .hero-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .filters {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .archive-table {
      max-width: 1200px;
      margin: 0 auto 80px;
      padding: 0 24px;
      border: 1px solid #d6e4f2;
      border-radius: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #e1e8f0;
    }

    thead { background: #f3f7fc; }
    tbody tr:nth-child(even) { background: #f5f9ff; }
  </style>
</head>

<body>

<nav class="home-nav">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="major-carnivals.html">Major Carnivals</a>
  <a href="dubai-world-cup.html" class="active">Dubai World Cup</a>
</nav>

<div class="hero-wrap">
  <div class="hero-card">
    <img src="images/dubai-world-cup-hero.jpg" alt="Dubai World Cup">
  </div>
</div>

<div class="filters">
  <div>
    <label>Year</label>
    <select id="yearFilter">
      <option value="">All</option>
    </select>
  </div>

  <div>
    <label>Race</label>
    <input id="raceFilter" list="raceList" placeholder="Race">
    <datalist id="raceList"></datalist>
  </div>

  <div>
    <label>Winner</label>
    <input id="winnerFilter" list="winnerList" placeholder="Horse">
    <datalist id="winnerList"></datalist>
  </div>

  <div>
    <label>Jockey</label>
    <input id="jockeyFilter" list="jockeyList" placeholder="Jockey">
    <datalist id="jockeyList"></datalist>
  </div>
</div>

<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="dubai-world-cup.js"></script>

</body>
</html>
