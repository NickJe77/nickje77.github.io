<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NHL Players | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N8J9ZPKDDH"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N8J9ZPKDDH');</script>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}
.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));color:#fff;
  padding:60px 20px;text-align:center;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(36px,7vw,56px);
  letter-spacing:.01em;text-transform:uppercase;
}
.hero p{margin-top:12px;font-size:16px;font-weight:500;color:rgba(255,255,255,.68);}
.container{max-width:1600px;margin:0 auto;padding:26px 20px 70px;}
.search-wrap{margin-bottom:26px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
#playerSearch{
  width:100%;max-width:440px;padding:13px 18px;font-size:14.5px;border-radius:999px;
  border:1px solid var(--line);outline:none;font-family:var(--body);font-weight:600;background:var(--surface);
}
#playerSearch:focus{border-color:var(--accent);}
#posFilter{
  padding:12px 16px;font-size:13.5px;border-radius:999px;border:1px solid var(--line);
  font-weight:600;background:var(--surface);cursor:pointer;font-family:var(--body);color:var(--ink);
}
#posFilter:hover{border-color:var(--faint);}
#posFilter:focus{outline:none;border-color:var(--accent);}
.player-count{margin-bottom:22px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;}
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.player-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;text-decoration:none;color:var(--ink);transition:.2s ease;display:block;
}
.player-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 26px -14px rgba(10,16,24,.3);}
.player-name{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.01em;}
.player-meta{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:12px;}
.player-stats{display:flex;gap:14px;flex-wrap:wrap;}
.player-stat{text-align:center;}
.player-stat-value{font-family:var(--display);font-size:18px;font-weight:600;color:var(--ink);}
.player-stat-label{font-size:9.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.no-results{text-align:center;font-size:18px;font-weight:600;padding:60px 20px;color:var(--muted);display:none;}
.loading{text-align:center;padding:60px;font-size:15px;color:var(--muted);font-style:italic;}
</style>
</head>
<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div class="hero">
  <h1>NHL Players</h1>
  <p>Every player in NHL history from 1967 to present</p>
</div>

<div class="container">
  <div class="search-wrap">
    <input type="text" id="playerSearch" placeholder="Search players...">
    <select id="posFilter">
      <option value="">All Positions</option>
      <option value="C">Centre</option>
      <option value="L">Left Wing</option>
      <option value="R">Right Wing</option>
      <option value="D">Defence</option>
      <option value="G">Goalie</option>
    </select>
  </div>
  <div class="player-count" id="playerCount"></div>
  <div class="players-grid" id="playersGrid">
    <div class="loading">Loading players...</div>
  </div>
  <div class="no-results" id="noResults">No players found</div>
</div>

<script>
var TEAM_NAMES = {
  "ANA":"Anaheim Ducks","ARI":"Arizona Coyotes","BOS":"Boston Bruins",
  "BUF":"Buffalo Sabres","CGY":"Calgary Flames","CAR":"Carolina Hurricanes",
  "CHI":"Chicago Blackhawks","COL":"Colorado Avalanche","CBJ":"Columbus Blue Jackets",
  "DAL":"Dallas Stars","DET":"Detroit Red Wings","EDM":"Edmonton Oilers",
  "FLA":"Florida Panthers","LAK":"Los Angeles Kings","MIN":"Minnesota Wild",
  "MTL":"Montreal Canadiens","NSH":"Nashville Predators","NJD":"New Jersey Devils",
  "NYI":"New York Islanders","NYR":"New York Rangers","OTT":"Ottawa Senators",
  "PHI":"Philadelphia Flyers","PIT":"Pittsburgh Penguins","SJS":"San Jose Sharks",
  "SEA":"Seattle Kraken","STL":"St. Louis Blues","TBL":"Tampa Bay Lightning",
  "TOR":"Toronto Maple Leafs","UTA":"Utah Hockey Club","VAN":"Vancouver Canucks",
  "VGK":"Vegas Golden Knights","WSH":"Washington Capitals","WPG":"Winnipeg Jets"
};
function tn(code){ return TEAM_NAMES[code] || code; }

var grid      = document.getElementById('playersGrid');
var search    = document.getElementById('playerSearch');
var posFilter = document.getElementById('posFilter');
var countEl   = document.getElementById('playerCount');
var noResults = document.getElementById('noResults');

var allPlayers = [];

fetch('/data/nhl/players.json')
  .then(function(r){ return r.json(); })
  .then(function(data){
    allPlayers = data;
    render();
  })
  .catch(function(){
    grid.innerHTML = '<div class="loading">Failed to load players. Make sure the player builder has run.</div>';
  });

search.addEventListener('input', render);
posFilter.addEventListener('change', render);

function render(){
  var q   = search.value.toLowerCase().trim();
  var pos = posFilter.value;

  var filtered = allPlayers.filter(function(p){
    if(q && !(p.name||'').toLowerCase().includes(q) &&
       !(p.teams||[]).some(function(t){ return tn(t).toLowerCase().includes(q); })) return false;
    if(pos && (p.position||'').toUpperCase() !== pos) return false;
    return true;
  });

  countEl.textContent = filtered.length.toLocaleString() + ' Players';

  if(!filtered.length){
    noResults.style.display = 'block';
    grid.innerHTML = '';
    return;
  }
  noResults.style.display = 'none';

  // Show top 200 for performance — search narrows it down
  var show = filtered.slice(0, 200);

  grid.innerHTML = show.map(function(p){
    var lastTeam = (p.teams && p.teams.length) ? tn(p.teams[p.teams.length-1]) : '';
    var pos = p.position || '';
    var seasons = (p.seasons || []).length;
    var goals   = p.career_goals   || 0;
    var assists = p.career_assists || 0;
    var points  = p.career_points  || 0;
    var gp      = p.career_gp     || 0;

    return '<a class="player-card" href="/nhl-player.html?player='+encodeURIComponent(p.id)+'">' +
      '<div class="player-name">'+p.name+'</div>' +
      '<div class="player-meta">'+(pos ? pos+' · ' : '')+lastTeam+'</div>' +
      '<div class="player-stats">' +
        '<div class="player-stat"><div class="player-stat-value">'+gp+'</div><div class="player-stat-label">GP</div></div>' +
        (goals > 0 ? '<div class="player-stat"><div class="player-stat-value">'+goals+'</div><div class="player-stat-label">Goals</div></div>' : '') +
        (assists > 0 ? '<div class="player-stat"><div class="player-stat-value">'+assists+'</div><div class="player-stat-label">Assists</div></div>' : '') +
        (points > 0 ? '<div class="player-stat"><div class="player-stat-value">'+points+'</div><div class="player-stat-label">Points</div></div>' : '') +
        '<div class="player-stat"><div class="player-stat-value">'+seasons+'</div><div class="player-stat-label">Seasons</div></div>' +
      '</div>' +
    '</a>';
  }).join('');

  if(filtered.length > 200){
    grid.innerHTML += '<div style="text-align:center;padding:20px;color:#888;font-weight:700;">Showing 200 of '+filtered.length.toLocaleString()+' — search to narrow results</div>';
  }
}
</script>
</body>
</html>
