<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Formula 1 Track | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

/* NAV */
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

/* HERO */
.hero{width:100%;height:220px;position:relative;overflow:hidden;}
.hero img{width:100%;height:100%;object-fit:cover;display:block;}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(12,19,15,.55),rgba(12,19,15,.75));
}
.hero-caption{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;z-index:2;color:#fff;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero-caption h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero-caption p{
  margin:6px 0 0;color:rgba(255,255,255,.75);font-size:13px;
}

.page-wrap{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.track-layout{display:flex;justify-content:center;margin-bottom:26px;}
.track-layout img{
  max-width:600px;width:100%;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--line);padding:10px;
}

.stat-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:26px;
}
.stat{
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  text-align:center;background:var(--surface);
}
.stat h3{
  margin:0 0 6px;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
}
.stat div{font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink);}

h2{
  margin:0 0 12px;font-family:var(--display);font-weight:600;font-size:16px;
  text-transform:uppercase;letter-spacing:.02em;color:var(--ink);
}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
</style>
</head>

<body>

<div class="hero">
  <img src="images/f1-header.jpg" alt="Formula 1">
  <div class="hero-caption">
    <span class="eyebrow">Formula 1</span>
    <h1 id="trackName">Track</h1>
    <p id="trackCountry"></p>
  </div>
</div>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div class="page-wrap">

<div class="track-layout">
  <img id="trackImage" src="" alt="Track layout">
</div>

<div class="stat-grid">
  <div class="stat"><h3>Fastest Lap</h3><div id="fastestLap">—</div></div>
  <div class="stat"><h3>Most Wins (Driver)</h3><div id="topDriver">—</div></div>
  <div class="stat"><h3>Total Races</h3><div id="totalRaces">—</div></div>
  <div class="stat"><h3>Total Points</h3><div id="totalPoints">—</div></div>
</div>

<h2>Race Winners</h2>
<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Season</th>
  <th>Winner</th>
  <th>Team</th>
</tr>
</thead>
<tbody id="resultsTable"></tbody>
</table>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const track = params.get("track");

const trackNameEl = document.getElementById("trackName");
const trackCountryEl = document.getElementById("trackCountry");
const trackImageEl = document.getElementById("trackImage");

const fastestLapEl = document.getElementById("fastestLap");
const topDriverEl = document.getElementById("topDriver");
const totalRacesEl = document.getElementById("totalRaces");
const totalPointsEl = document.getElementById("totalPoints");
const resultsTable = document.getElementById("resultsTable");

const startYear = 1950;
const endYear = new Date().getFullYear();

let fastestLapData = [];
let raceStats = {races:0,points:0,winsByDriver:{}};

function slugify(name){
  return name.toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/(^-|-$)/g,"");
}

function cleanDriver(name){
  return String(name||"").replace(/\s[A-Z]{3}$/,"").trim();
}

function normalizeTrack(name){
  let n = String(name||"").trim();
  n = n.replace(/^Flag of\s+/i,"");
  n = n.replace(/People’?s Republic of\s+/i,"");
  n = n.replace(/Republic of\s+/i,"");
  n = n.replace(/Grand Prix/i,"");
  n = n.replace(/\s+/g," ").trim();
  n = n.replace(/\b(\w+)\s+\1\b/gi,"$1");
  return n;
}

async function loadFastestLaps(){
  const res = await fetch("data/f1/f1-fastest-laps.json");
  fastestLapData = await res.json();
}

async function loadSeasons(){
  const promises=[];
  for(let y=startYear;y<=endYear;y++){
    promises.push(fetch(`data/f1/${y}.json`).then(r=>r.ok?r.json():null));
  }
  const seasons=(await Promise.all(promises)).filter(x=>x);
  processSeasons(seasons);
}

function processSeasons(seasons){
  seasons.forEach(season=>{
    (season.races||[]).forEach(race=>{
      const raceTrack = normalizeTrack(race.grand_prix);
      if(raceTrack!==track) return;

      raceStats.races++;

      (race.results||[]).forEach(r=>{
        const driver=cleanDriver(r.driver);
        const pts=Number(r.points)||0;
        const pos=String(r.position||"");

        raceStats.points+=pts;

        if(pos==="1"){
          raceStats.winsByDriver[driver]=(raceStats.winsByDriver[driver]||0)+1;

          const tr=document.createElement("tr");
          tr.innerHTML=`
            <td>${season.season}</td>
            <td>${driver}</td>
            <td>${r.team}</td>
          `;
          resultsTable.appendChild(tr);
        }
      });
    });
  });

  let topDriver="—", topWins=0;
  Object.entries(raceStats.winsByDriver).forEach(([d,w])=>{
    if(w>topWins){
      topWins=w;
      topDriver=d;
    }
  });

  totalRacesEl.textContent=raceStats.races;
  totalPointsEl.textContent=raceStats.points.toFixed(1);
  topDriverEl.textContent=topDriver;
}

function applyFastestLap(){
  const rec = fastestLapData.find(f=>f.circuit===track);
  if(rec){
    fastestLapEl.textContent = `${rec.time} – ${rec.driver} (${rec.year})`;
    trackCountryEl.textContent = rec.country;
  }
}

async function init(){
  trackNameEl.textContent = track;
  trackImageEl.src = `images/tracks/${slugify(track)}.png`;

  await loadFastestLaps();
  applyFastestLap();
  await loadSeasons();
}

init();
</script>

</body>
</html>
