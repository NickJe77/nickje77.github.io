<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>T20 World Cup All-Time Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family: Inter, system-ui, Arial, sans-serif;margin:0;background:#ffffff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
.hero{background:linear-gradient(90deg,#6a040f,#d00000);color:white;padding:40px 50px;border-radius:24px;margin-bottom:25px;}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:10px 16px;border-radius:10px;border:none;cursor:pointer;background:#6a040f;color:white;font-weight:600;}
.tab.active{background:#d00000;}
table{width:100%;border-collapse:collapse;font-size:16px;}
th{background:#f3f6fb;padding:12px;border-bottom:2px solid #ddd;}
td{padding:12px;border-bottom:1px solid #ddd;}
tr:nth-child(even){background:#f8fbff;}
.rank-col{width:80px;text-align:center;}
.player-col{text-align:left;}
.stat-col{width:150px;text-align:right;font-weight:600;}
.player-link{color:#6a040f;font-weight:600;text-decoration:none;}
.player-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>T20 World Cup All-Time Leaders</h1>
<p>Top players in major statistical categories.</p>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('runs',this)">Run Scorers</button>
<button class="tab" onclick="showTab('wickets',this)">Wicket Takers</button>
<button class="tab" onclick="showTab('sixes',this)">Most Sixes</button>
<button class="tab" onclick="showTab('fielding',this)">Fielders</button>
<button class="tab" onclick="showTab('sr',this)">Strike Rate (10+ matches)</button>
</div>

<table>
<thead>
<tr>
<th class="rank-col">Rank</th>
<th class="player-col">Player</th>
<th class="stat-col" id="statHeader">Runs</th>
</tr>
</thead>
<tbody id="leaderTable"></tbody>
</table>

</div>

<script>

const headerLabels={runs:"Runs",wickets:"Wickets",sixes:"Sixes",fielding:"Dismissals",sr:"Strike Rate"};

const INDEX="/data/t20-world-cup/matches/index.json";
const BASE="/data/t20-world-cup/matches/";
const NAME_MAP="/data/t20-world-cup/matches/player-names.json";

// dismissals credited to the bowler (run outs, obstructing, retired etc. are not)
const BOWLER_WKTS=new Set(["bowled","caught","lbw","stumped","caught and bowled","hit wicket"]);

const batting={}, bowling={}, fielding={}, sixes={}, matchesPlayed={};
let leaders={}, nameMap={};

load();

async function load(){
  nameMap = await fetch(NAME_MAP).then(r=>r.json()).catch(()=>({}));
  const files = await fetch(INDEX).then(r=>r.json());
  for(const file of files){
    const matches = await fetch(BASE+file).then(r=>r.json());
    processMatches(matches,file);
  }
  buildLeaders();
  render("runs");
}

function processMatches(matches,file){
  matches.forEach((match,index)=>{
    const key=file+"_"+index;
    match.innings.forEach(inn=>{
      inn.overs.forEach(over=>{
        over.deliveries.forEach(d=>{
          const batter=d.batter;
          const bowler=d.bowler;

          if(!batting[batter]) batting[batter]={runs:0,balls:0};
          batting[batter].runs+=d.runs.batter;
          if(!d.extras?.wides) batting[batter].balls++;   // wides aren't balls faced (no-balls are)

          if(d.runs.batter===6) sixes[batter]=(sixes[batter]||0)+1;

          matchesPlayed[batter]=matchesPlayed[batter]||new Set();
          matchesPlayed[batter].add(key);

          if(d.wickets){
            d.wickets.forEach(w=>{
              if(BOWLER_WKTS.has(w.kind)) bowling[bowler]=(bowling[bowler]||0)+1;

              // fielding dismissals: catches, stumpings, run-out involvement
              if(w.kind==="caught"||w.kind==="stumped"||w.kind==="run out"){
                const f=w.fielders?.[0]?.name;
                if(f) fielding[f]=(fielding[f]||0)+1;
              }else if(w.kind==="caught and bowled"){
                fielding[bowler]=(fielding[bowler]||0)+1;   // bowler took the catch
              }
            });
          }
        });
      });
    });
  });
}

function buildLeaders(){
  leaders.runs=Object.entries(batting).sort((a,b)=>b[1].runs-a[1].runs).slice(0,10).map((x,i)=>[i+1,x[0],x[1].runs]);
  leaders.wickets=Object.entries(bowling).sort((a,b)=>b[1]-a[1]).slice(0,10).map((x,i)=>[i+1,x[0],x[1]]);
  leaders.sixes=Object.entries(sixes).sort((a,b)=>b[1]-a[1]).slice(0,10).map((x,i)=>[i+1,x[0],x[1]]);
  leaders.fielding=Object.entries(fielding).sort((a,b)=>b[1]-a[1]).slice(0,10).map((x,i)=>[i+1,x[0],x[1]]);

  const srList=[];
  Object.keys(batting).forEach(p=>{
    const games=matchesPlayed[p]?.size||0;
    if(games>=10 && batting[p].balls>0){
      srList.push([p,(batting[p].runs/batting[p].balls)*100]);
    }
  });
  srList.sort((a,b)=>b[1]-a[1]);
  leaders.sr=srList.slice(0,10).map((x,i)=>[i+1,x[0],x[1].toFixed(1)]);
}

function playerLink(name){
  return `<a class="player-link" href="t20-world-cup-player.html?player=${encodeURIComponent(name)}">${nameMap[name]||name}</a>`;
}

function render(type){
  document.getElementById("statHeader").innerText=headerLabels[type];
  const tbody=document.getElementById("leaderTable");
  tbody.innerHTML="";
  leaders[type].forEach(row=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td class="rank-col">${row[0]}</td>
      <td class="player-col">${playerLink(row[1])}</td>
      <td class="stat-col">${row[2]}</td>`;
    tbody.appendChild(tr);
  });
}

function showTab(type,btn){
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render(type);
}

</script>

</body>
</html>
