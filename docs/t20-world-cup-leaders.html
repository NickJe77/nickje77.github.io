<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup All-Time Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}

.hero h1{
  margin:0;
  font-size:46px;
}

.hero p{
  margin-top:10px;
  font-size:20px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.tab{
  padding:10px 16px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:#6a040f;
  color:white;
  font-weight:600;
}

.tab.active{
  background:#d00000;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
}

th{
  background:#f3f6fb;
}

tr:nth-child(even){
  background:#f8fbff;
}

.player-link{
  color:#6a040f;
  font-weight:600;
  text-decoration:none;
}

.player-link:hover{
  text-decoration:underline;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>T20 World Cup All-Time Leaders</h1>
<p>Top players in major statistical categories.</p>
</div>

<div class="tabs">

<button class="tab active" onclick="showTab('runs',this)">
Run Scorers
</button>

<button class="tab" onclick="showTab('wickets',this)">
Wicket Takers
</button>

<button class="tab" onclick="showTab('fielding',this)">
Fielders
</button>

<button class="tab" onclick="showTab('sr',this)">
Strike Rate (10+ matches)
</button>

</div>

<table>

<thead>
<tr>
<th>Rank</th>
<th>Player</th>
<th>Stat</th>
</tr>
</thead>

<tbody id="leaderTable"></tbody>

</table>

</div>

<script>

const INDEX="/data/t20-world-cup/matches/index.json";
const BASE="/data/t20-world-cup/matches/";
const NAME_MAP="/data/t20-world-cup/matches/player-names.json";

const batting={};
const bowling={};
const fielding={};
const matchesPlayed={};

let leaders={};
let nameMap={};

load();

async function load(){

nameMap =
await fetch(NAME_MAP)
.then(r=>r.json())
.catch(()=>({}));

const files =
await fetch(INDEX)
.then(r=>r.json());

for(const file of files){

const matches =
await fetch(BASE+file)
.then(r=>r.json());

processMatches(matches,file);

}

buildLeaders();

render("runs");

}

function processMatches(matches,file){

matches.forEach((match,index)=>{

/* guaranteed unique match key */

const matchKey =
file+"_"+index;

match.innings.forEach(inn=>{

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

const batter=d.batter;
const bowler=d.bowler;

/* batting */

if(!batting[batter])
batting[batter]={runs:0,balls:0};

batting[batter].runs+=d.runs.batter;

if(!d.extras?.wides && !d.extras?.noballs)
batting[batter].balls++;

/* matches played */

matchesPlayed[batter] =
matchesPlayed[batter] || new Set();

matchesPlayed[batter]
.add(matchKey);

/* bowling */

if(d.wickets){

d.wickets.forEach(w=>{

if(w.kind!=="run out"){

bowling[bowler] =
(bowling[bowler]||0)+1;

}

if(w.kind==="caught"||w.kind==="run out"){

const f=w.fielders?.[0]?.name;

if(f)
fielding[f]=(fielding[f]||0)+1;

}

});

}

});

});

});

});

}

function buildLeaders(){

leaders.runs=
Object.entries(batting)
.sort((a,b)=>b[1].runs-a[1].runs)
.slice(0,10)
.map((x,i)=>[
i+1,
playerLink(x[0]),
x[1].runs
]);

leaders.wickets=
Object.entries(bowling)
.sort((a,b)=>b[1]-a[1])
.slice(0,10)
.map((x,i)=>[
i+1,
playerLink(x[0]),
x[1]
]);

leaders.fielding=
Object.entries(fielding)
.sort((a,b)=>b[1]-a[1])
.slice(0,10)
.map((x,i)=>[
i+1,
playerLink(x[0]),
x[1]
]);

/* STRIKE RATE FIX */

leaders.sr=[];

Object.keys(batting).forEach(player=>{

const games=
matchesPlayed[player]?.size || 0;

if(games>=10 && batting[player].balls>0){

const sr=
(batting[player].runs /
batting[player].balls)*100;

leaders.sr.push([
player,
sr
]);

}

});

leaders.sr
.sort((a,b)=>b[1]-a[1]);

leaders.sr=
leaders.sr.slice(0,10)
.map((x,i)=>[
i+1,
playerLink(x[0]),
x[1].toFixed(1)
]);

}

function playerLink(name){

const display=
nameMap[name]||name;

return `<a class="player-link"
href="t20-world-cup-player.html?player=${encodeURIComponent(name)}">
${display}
</a>`;

}

function showTab(type,btn){

document.querySelectorAll(".tab")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

render(type);

}

function render(type){

const tbody=document.getElementById("leaderTable");

tbody.innerHTML="";

leaders[type].forEach(r=>{

const tr=document.createElement("tr");

tr.innerHTML=
`<td>${r[0]}</td>
<td>${r[1]}</td>
<td>${r[2]}</td>`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
