<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Standings | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.navbar a:hover{
text-decoration:underline;
}

/* PAGE */

.page{
max-width:1200px;
margin:0 auto;
padding:22px 18px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:30px;
border-radius:22px;
margin-bottom:14px;
}

.hero h1{
margin:0;
font-size:40px;
}

/* CONTROLS */

.controls{
display:flex;
gap:12px;
align-items:center;
background:#fff;
border-radius:16px;
padding:12px;
margin-bottom:16px;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:16px;
overflow:hidden;
margin-bottom:20px;
}

th,td{
padding:10px;
text-align:left;
border-bottom:1px solid #f1f1f1;
}

th{
background:#002D72;
color:#fff;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

tbody tr:hover{
background:#d6e6ff;
}

.link{
color:#0056d6;
font-weight:800;
cursor:pointer;
}

/* LEAGUE HEADERS */

.leagueTitle{
font-size:26px;
font-weight:900;
margin:18px 0 8px;
}

</style>
</head>
<body>

<div class="navbar">

<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-players.html">Players</a>
<a href="baseball-standings.html">Standings</a>

</div>

<div class="page">

<div class="hero">
<h1>Standings</h1>
</div>

<div class="controls">
<div style="font-weight:900;">Season</div>
<select id="yearSel"></select>
</div>

<div class="leagueTitle">American League</div>

<table>
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>PCT</th>
<th>RS</th>
<th>RA</th>
<th>DIFF</th>
</tr>
</thead>
<tbody id="tbAL"></tbody>
</table>

<div class="leagueTitle">National League</div>

<table>
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>PCT</th>
<th>RS</th>
<th>RA</th>
<th>DIFF</th>
</tr>
</thead>
<tbody id="tbNL"></tbody>
</table>

</div>

<script>

/* LEAGUE MAP */

const AL=[
"BAL","BOS","NYY","TB","TOR",
"CWS","CLE","DET","KC","MIN",
"HOU","LAA","OAK","SEA","TEX"
];

function league(code){
return AL.includes(code) ? "AL" : "NL";
}

async function init(){

const years =
await fetch("data/baseball/index.json")
.then(r=>r.json());

const sel=document.getElementById("yearSel");

years.sort((a,b)=>b-a);

sel.innerHTML=
years.map(y=>`<option>${y}</option>`).join("");

sel.onchange=()=>loadYear(sel.value);

loadYear(years[0]);

}

async function loadYear(y){

const rows =
await fetch(`data/baseball/standings/${y}.json`)
.then(r=>r.json());

const tbAL=document.getElementById("tbAL");
const tbNL=document.getElementById("tbNL");

tbAL.innerHTML="";
tbNL.innerHTML="";

rows.forEach(r=>{

const tr=document.createElement("tr");

tr.innerHTML=`

<td>
<span class="link" data-team="${r.team_code}">
${r.team_name}
</span>
</td>

<td>${r.W}</td>
<td>${r.L}</td>
<td>${r.PCT}</td>
<td>${r.RS}</td>
<td>${r.RA}</td>
<td>${r.DIFF}</td>

`;

tr.querySelector("[data-team]").onclick=
()=>location.href=
`baseball-team.html?team=${r.team_code}`;

if(league(r.team_code)=="AL")
tbAL.appendChild(tr);
else
tbNL.appendChild(tr);

});

}

init();

</script>

</body>
</html>
