<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Standings | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:22px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:40px;
}

.controls{
background:#fff;
padding:12px;
border-radius:16px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:16px;
overflow:hidden;
margin-bottom:30px;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:#fff;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.leagueTitle{
font-size:26px;
font-weight:900;
margin:20px 0 10px;
}
</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-players.html">Players</a>
<a href="baseball-standings.html">Standings</a>
</div>

<div class="page">

<div class="hero">
<h1>Standings</h1>
</div>

<div class="controls">
<select id="yearSel"></select>
</div>

<div class="leagueTitle">American League</div>
<table>
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>PCT</th>
<th>RS</th>
<th>RA</th>
<th>DIFF</th>
</tr>
</thead>
<tbody id="tbAL"></tbody>
</table>

<div class="leagueTitle">National League</div>
<table>
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>PCT</th>
<th>RS</th>
<th>RA</th>
<th>DIFF</th>
</tr>
</thead>
<tbody id="tbNL"></tbody>
</table>

</div>

<script>

async function init(){

const years =
await fetch("data/baseball/index.json")
.then(r=>r.json());

years.sort((a,b)=>b-a);

const sel=document.getElementById("yearSel");
sel.innerHTML = years.map(y=>`<option>${y}</option>`).join("");

sel.onchange = ()=> loadYear(parseInt(sel.value));

loadYear(years[0]);
}

async function loadYear(year){

const games =
await fetch(`data/baseball/seasons/${year}.json`)
.then(r=>r.json());

let standings = {};

games.forEach(g=>{

const home = g.home_code;
const away = g.away_code;

if(!standings[home])
standings[home] = {W:0,L:0,RS:0,RA:0};

if(!standings[away])
standings[away] = {W:0,L:0,RS:0,RA:0};

standings[home].RS += g.home_score;
standings[home].RA += g.away_score;

standings[away].RS += g.away_score;
standings[away].RA += g.home_score;

if(g.home_score > g.away_score){
standings[home].W++;
standings[away].L++;
}else{
standings[away].W++;
standings[home].L++;
}

});

renderStandings(standings, year);
}

function renderStandings(data, year){

const tbAL=document.getElementById("tbAL");
const tbNL=document.getElementById("tbNL");

tbAL.innerHTML="";
tbNL.innerHTML="";

let teams = Object.keys(data);

teams.sort((a,b)=>{
const pctA = data[a].W / (data[a].W + data[a].L);
const pctB = data[b].W / (data[b].W + data[b].L);
return pctB - pctA;
});

/* HISTORICAL LEAGUE SPLIT LOGIC */

let alCount;

if(year >= 2013) alCount = 15;
else if(year >= 1998) alCount = 14;
else if(year >= 1977) alCount = 14;
else if(year >= 1969) alCount = 12;
else alCount = teams.length / 2;

const ALteams = teams.slice(0, alCount);
const NLteams = teams.slice(alCount);

function addRows(teamList, tbody){

teamList.forEach(team=>{

const s = data[team];
const pct = (s.W / (s.W + s.L)).toFixed(3);
const diff = s.RS - s.RA;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${team}</td>
<td>${s.W}</td>
<td>${s.L}</td>
<td>${pct}</td>
<td>${s.RS}</td>
<td>${s.RA}</td>
<td>${diff}</td>
`;

tbody.appendChild(tr);

});

}

addRows(ALteams, tbAL);
addRows(NLteams, tbNL);

}

init();

</script>

</body>
</html>
