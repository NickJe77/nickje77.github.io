<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Baseball Standings | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
font-family:var(--body);
margin:0;
background:var(--bg);
color:var(--ink);
-webkit-font-smoothing:antialiased;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:15px;
background:var(--surface);
border-bottom:1px solid var(--line);
font-weight:600;
font-size:13.5px;
}

.navbar a{
text-decoration:none;
color:var(--ink);
opacity:.7;
transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
opacity:1;
color:var(--accent);
}

.page{
max-width:1200px;
margin:0 auto;
padding:26px 20px 70px;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
position:relative;
background:linear-gradient(160deg,var(--board-2),var(--board));
color:#fff;
padding:32px 34px;
border-radius:var(--radius);
margin-bottom:22px;
box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
font-family:var(--body);
font-size:11.5px;
font-weight:600;
letter-spacing:.16em;
text-transform:uppercase;
color:var(--accent);
margin-bottom:10px;
}
.hero h1{
margin:0;
font-family:var(--display);
font-weight:600;
font-size:clamp(28px,5vw,40px);
letter-spacing:.01em;
text-transform:uppercase;
}

/* ── Controls ─────────────────────────────────────────── */
.controls{
background:var(--surface);
border:1px solid var(--line);
padding:16px;
border-radius:var(--radius);
margin-bottom:26px;
display:flex;
justify-content:center;
}

.controls select{
font-family:var(--body);
font-size:14px;
font-weight:600;
padding:10px 18px;
border-radius:999px;
border:1px solid var(--line);
min-width:160px;
cursor:pointer;
background:var(--surface);
color:var(--ink);
}
.controls select:hover{ border-color:var(--faint); }
.controls select:focus{ outline:none;border-color:var(--accent); }

/* ── Tables ───────────────────────────────────────────── */
table{
width:100%;
border-collapse:collapse;
background:var(--surface);
border:1px solid var(--line);
border-radius:var(--radius);
overflow:hidden;
margin-bottom:28px;
}

th,td{
padding:11px 12px;
border-bottom:1px solid var(--line);
text-align:center;
font-size:13.5px;
}

th{
background:#f7f9fb;
color:var(--muted);
font-family:var(--body);
font-weight:600;
font-size:11px;
letter-spacing:.04em;
text-transform:uppercase;
}

td{
color:#27313c;
font-variant-numeric:tabular-nums;
}
td:first-child{
text-align:left;
font-weight:700;
color:var(--ink);
}

tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover td{ background:#f0f6ff; }

.leagueTitle{
font-family:var(--display);
font-weight:600;
font-size:19px;
letter-spacing:.01em;
text-transform:uppercase;
margin:28px 0 12px;
text-align:center;
color:var(--ink);
}
.leagueTitle:first-of-type{ margin-top:0; }
</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-players.html">Players</a>
<a href="baseball-standings.html" aria-current="page">Standings</a>
</div>

<div class="page">

<div class="hero">
<div class="eyebrow">MLB</div>
<h1>Standings</h1>
</div>

<div class="controls">
<select id="yearSel"></select>
</div>

<div class="leagueTitle">American League</div>
<table>
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>PCT</th>
<th>RS</th>
<th>RA</th>
<th>DIFF</th>
</tr>
</thead>
<tbody id="tbAL"></tbody>
</table>

<div class="leagueTitle">National League</div>
<table>
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>PCT</th>
<th>RS</th>
<th>RA</th>
<th>DIFF</th>
</tr>
</thead>
<tbody id="tbNL"></tbody>
</table>

</div>

<script>

let TEAM_MAP = {};

async function init(){

// Load franchise master file
const franchises =
await fetch("data/baseball/teams.json")
.then(r=>r.json());

franchises.forEach(franchise=>{
franchise.codes.forEach(code=>{
TEAM_MAP[code] = franchise.name;
});
});

// Load seasons
const years =
await fetch("data/baseball/index.json")
.then(r=>r.json());

years.sort((a,b)=>b-a);

const sel=document.getElementById("yearSel");
sel.innerHTML = years.map(y=>`<option>${y}</option>`).join("");

sel.onchange = ()=> loadYear(parseInt(sel.value));

loadYear(years[0]);
}

async function loadYear(year){

const games =
await fetch(`data/baseball/seasons/${year}.json`)
.then(r=>r.json());

let standings = {};

games.forEach(g=>{

// Remove All-Star games
if(g.home_code === "ALS" || g.home_code === "NLS" ||
   g.away_code === "ALS" || g.away_code === "NLS") return;

const home = g.home_code;
const away = g.away_code;

if(!standings[home])
standings[home] = {W:0,L:0,RS:0,RA:0};

if(!standings[away])
standings[away] = {W:0,L:0,RS:0,RA:0};

standings[home].RS += g.home_score;
standings[home].RA += g.away_score;

standings[away].RS += g.away_score;
standings[away].RA += g.home_score;

if(g.home_score > g.away_score){
standings[home].W++;
standings[away].L++;
}else{
standings[away].W++;
standings[home].L++;
}

});

renderStandings(standings, year);
}

function renderStandings(data, year){

const tbAL=document.getElementById("tbAL");
const tbNL=document.getElementById("tbNL");

tbAL.innerHTML="";
tbNL.innerHTML="";

let teams = Object.keys(data);

// Sort by win %
teams.sort((a,b)=>{
const pctA = data[a].W / (data[a].W + data[a].L);
const pctB = data[b].W / (data[b].W + data[b].L);
return pctB - pctA;
});

// Historical split
let alCount;

if(year >= 2013) alCount = 15;
else if(year >= 1998) alCount = 14;
else if(year >= 1977) alCount = 14;
else if(year >= 1969) alCount = 12;
else alCount = teams.length / 2;

const ALteams = teams.slice(0, alCount);
const NLteams = teams.slice(alCount);

function addRows(teamList, tbody){

teamList.forEach(team=>{

const s = data[team];
const pct = (s.W / (s.W + s.L)).toFixed(3);
const diff = s.RS - s.RA;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${TEAM_MAP[team] || team}</td>
<td>${s.W}</td>
<td>${s.L}</td>
<td>${pct}</td>
<td>${s.RS}</td>
<td>${s.RA}</td>
<td>${diff}</td>
`;

tbody.appendChild(tr);

});
}

addRows(ALteams, tbAL);
addRows(NLteams, tbNL);

}

init();

</script>

</body>
</html>
