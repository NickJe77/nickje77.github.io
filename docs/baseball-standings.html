<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Standings | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1200px;margin:0 auto;padding:22px 18px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:30px;border-radius:22px;margin-bottom:14px;}
.hero h1{margin:0;font-size:40px;}
.controls{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;}
select{padding:10px 12px;border:1px solid #ccc;border-radius:10px;font-size:15px;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid #f1f1f1;}
th{background:#002D72;color:#fff;}
tbody tr:nth-child(even){background:#eaf3ff;}
tbody tr:hover{background:#d6e6ff;}
.link{color:#0056d6;font-weight:800;cursor:pointer;}
</style>
</head>
<body>

<div class="page">
  <div class="hero">
    <h1>Standings</h1>
  </div>

  <div class="controls">
    <div style="font-weight:900;">Season</div>
    <select id="yearSel"></select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Team</th>
        <th style="width:70px;">W</th>
        <th style="width:70px;">L</th>
        <th style="width:90px;">PCT</th>
        <th style="width:90px;">RS</th>
        <th style="width:90px;">RA</th>
        <th style="width:90px;">DIFF</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>
</div>

<script>
async function init(){
  const years = await (await fetch("data/baseball/index.json")).json();
  const sel = document.getElementById("yearSel");
  sel.innerHTML = years.map(y=>`<option value="${y}">${y}</option>`).join("");
  sel.onchange = ()=> loadYear(sel.value);
  await loadYear(years[0]);
}

async function loadYear(y){
  const rows = await (await fetch(`data/baseball/standings/${y}.json`)).json();
  const tb = document.getElementById("tb");
  tb.innerHTML = "";
  rows.forEach(r=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="link" data-team="${r.team_code}">${r.team_name}</span></td>
      <td>${r.W}</td><td>${r.L}</td><td>${r.PCT}</td>
      <td>${r.RS}</td><td>${r.RA}</td><td>${r.DIFF}</td>
    `;
    tr.querySelector("[data-team]").onclick = ()=> location.href=`baseball-team.html?team=${r.team_code}`;
    tb.appendChild(tr);
  });
}

init();
</script>

</body>
</html>
