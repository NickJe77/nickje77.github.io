<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Formula 1 Records | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

/* NAV */
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

/* HERO */
.hero{width:100%;height:220px;position:relative;overflow:hidden;}
.hero img{width:100%;height:100%;object-fit:cover;display:block;}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(12,19,15,.55),rgba(12,19,15,.75));
}
.hero-caption{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;z-index:2;color:#fff;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero-caption h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}
p.lead{text-align:center;color:var(--muted);margin:0 0 26px;font-size:14.5px;}

h2{
  margin:0 0 12px;font-family:var(--display);font-weight:600;font-size:16px;
  text-transform:uppercase;letter-spacing:.02em;color:var(--ink);
}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
</style>
</head>

<body>

<div class="hero">
  <img src="images/f1-header.jpg" alt="Formula 1">
  <div class="hero-caption">
    <span class="eyebrow">Formula 1</span>
    <h1>Records</h1>
  </div>
</div>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<p class="lead">Official fastest race laps by circuit.</p>

<h2>Fastest Laps by Circuit</h2>

<div class="table-wrap">
<table id="fastestLapTable">
<thead>
<tr>
  <th>Circuit</th>
  <th>Country</th>
  <th>Fastest Lap</th>
  <th>Driver</th>
  <th>Season</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script>
async function loadFastestLaps(){
  try{
    const res = await fetch("data/f1/f1-fastest-laps.json");
    if(!res.ok) throw new Error("No fastest lap file");
    const data = await res.json();
    renderTable(data);
  }catch(e){
    document.querySelector("#fastestLapTable tbody").innerHTML =
      "<tr><td colspan='5'>Fastest lap data not found.</td></tr>";
  }
}

function renderTable(data){
  const tbody = document.querySelector("#fastestLapTable tbody");
  tbody.innerHTML="";

  data
    .sort((a,b)=>a.circuit.localeCompare(b.circuit))
    .forEach(row=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${row.circuit}</td>
        <td>${row.country}</td>
        <td>${row.time}</td>
        <td>${row.driver}</td>
        <td>${row.year}</td>
      `;
      tbody.appendChild(tr);
    });
}

loadFastestLaps();
</script>

</body>
</html>
