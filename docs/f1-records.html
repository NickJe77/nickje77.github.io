<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Formula 1 Records | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
  background:#fff;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

/* HERO */
.hero{
  width:100%;
  height:260px;
  position:relative;
  overflow:hidden;
}
.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.45));
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:6px;}
p{text-align:center;color:#555;margin-bottom:25px;}

h2{
  margin-top:40px;
  border-bottom:2px solid #ddd;
  padding-bottom:6px;
}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
</style>
</head>

<body>

<div class="hero">
  <img src="images/f1-header.jpg" alt="Formula 1">
</div>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>Formula 1 Records</h1>
<p>Official fastest race laps by circuit.</p>

<h2>Fastest Laps by Circuit</h2>

<table id="fastestLapTable">
<thead>
<tr>
  <th>Circuit</th>
  <th>Country</th>
  <th>Fastest Lap</th>
  <th>Driver</th>
  <th>Season</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>
async function loadFastestLaps(){
  try{
    const res = await fetch("data/f1/f1-fastest-laps.json");
    if(!res.ok) throw new Error("No fastest lap file");
    const data = await res.json();
    renderTable(data);
  }catch(e){
    document.querySelector("#fastestLapTable tbody").innerHTML =
      "<tr><td colspan='5'>Fastest lap data not found.</td></tr>";
  }
}

function renderTable(data){
  const tbody = document.querySelector("#fastestLapTable tbody");
  tbody.innerHTML="";

  data
    .sort((a,b)=>a.circuit.localeCompare(b.circuit))
    .forEach(row=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${row.circuit}</td>
        <td>${row.country}</td>
        <td>${row.time}</td>
        <td>${row.driver}</td>
        <td>${row.year}</td>
      `;
      tbody.appendChild(tr);
    });
}

loadFastestLaps();
</script>

</body>
</html>
