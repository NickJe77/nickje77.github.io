<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>UFC Events | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;position:sticky;top:0;z-index:100;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));color:#fff;
  padding:44px 20px;text-align:center;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,42px);
  letter-spacing:.01em;text-transform:uppercase;
}
.hero p{margin:10px 0 0;font-size:14px;color:rgba(255,255,255,.68);}

.page-wrap{max-width:1000px;margin:0 auto;padding:26px 20px 70px;}

.controls{display:flex;justify-content:center;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
input,select{
  padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);
}
input{min-width:260px;}
select{cursor:pointer;}
input:hover,select:hover{border-color:var(--faint);}
input:focus,select:focus{outline:none;border-color:var(--accent);}

.event-list{display:flex;flex-direction:column;gap:8px;}
.event-row{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border-radius:12px;background:var(--surface);border:1px solid var(--line);
  text-decoration:none;color:var(--ink);transition:.15s;
}
.event-row:hover{background:var(--accent-soft);border-color:var(--accent);}
.event-name{font-weight:700;font-size:14.5px;}
.event-meta{font-size:12.5px;color:var(--muted);margin-top:3px;}
.event-date{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap;}
.loading{text-align:center;padding:40px;color:var(--muted);font-weight:600;font-style:italic;}
</style>
</head>
<body>
<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
  <a href="ufc-events.html">Events</a>
  <a href="ufc-fighters.html">Fighters</a>
  <a href="ufc-records.html">Records</a>
</div>

<div class="hero">
  <h1>UFC Events</h1>
  <p>Browse every UFC event from 1993 to present</p>
</div>

<div class="page-wrap">
  <div class="controls">
    <input id="search" placeholder="Search events...">
    <select id="yearFilter"><option value="">All Years</option></select>
  </div>
  <div class="event-list" id="events"><div class="loading">Loading...</div></div>
</div>

<script>
let allEvents = [];

fetch('/data/ufc/events.json')
  .then(function(r){ return r.json(); })
  .then(function(events){
    allEvents = events.filter(function(e){ return e.date; })
      .sort(function(a,b){ return b.date.localeCompare(a.date); });

    const years = [...new Set(allEvents.map(function(e){ return e.date.slice(0,4); }))].sort().reverse();
    const yearSel = document.getElementById('yearFilter');
    years.forEach(function(y){
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      yearSel.appendChild(opt);
    });

    render();
  })
  .catch(function(){
    document.getElementById('events').innerHTML =
      '<div class="loading">Data not yet available — run the UFC scraper first.</div>';
  });

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const year = document.getElementById('yearFilter').value;

  const filtered = allEvents.filter(function(e){
    const matchesSearch = !q || (e.name || '').toLowerCase().includes(q);
    const matchesYear = !year || e.date.slice(0,4) === year;
    return matchesSearch && matchesYear;
  });

  const container = document.getElementById('events');

  if(!filtered.length){
    container.innerHTML = '<div class="loading">No events found.</div>';
    return;
  }

  container.innerHTML = filtered.map(function(e){
    return '<a class="event-row" href="/ufc-event.html?id='+e.id+'">'+
      '<div><div class="event-name">'+e.name+'</div>'+
      '<div class="event-meta">'+(e.venue||'')+(e.fights?' · '+e.fights+' fights':'')+'</div></div>'+
      '<div class="event-date">'+e.date+'</div>'+
      '</a>';
  }).join('');
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('yearFilter').addEventListener('change', render);
</script>
</body>
</html>
