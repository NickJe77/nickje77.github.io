<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1250px;margin:auto;padding:30px 20px 60px;}
h1{text-align:center;margin-bottom:20px;}
.filters{text-align:center;margin-bottom:20px;}
select{padding:8px 12px;font-size:15px;margin:0 6px;}
table{width:100%;border-collapse:collapse;margin-top:15px;background:#fff;border-radius:12px;overflow:hidden;}
th,td{border-bottom:1px solid #eee;padding:10px;text-align:center;}
th{background:#f0f0f0;font-weight:700;}
tr:nth-child(even){background:#f9fbff;}
tr:hover{background:#eef4ff;cursor:pointer;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Season</h1>

<div class="filters">
Season:
<select id="seasonSelect"></select>

Game Type:
<select id="typeSelect">
<option value="All">All</option>
<option value="Regular">Regular Season</option>
<option value="Playoffs">Playoffs</option>
</select>

Team:
<select id="teamSelect">
<option value="All">All Teams</option>
</select>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Type</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

</div>

<script>
const BASE="/data/nba/";

const seasonSelect=document.getElementById("seasonSelect");
const typeSelect=document.getElementById("typeSelect");
const teamSelect=document.getElementById("teamSelect");
const gamesTable=document.getElementById("gamesTable");
const title=document.getElementById("title");

const params=new URLSearchParams(location.search);
let season=params.get("season") || "2025";
let allGames=[];

seasonSelect.onchange=()=>location.href="nba-season.html?season="+seasonSelect.value;
typeSelect.onchange=renderGames;
teamSelect.onchange=renderGames;

function cacheBust(url){
  return url + (url.includes("?") ? "&" : "?") + "_ts=" + Date.now();
}

function gamePrefix(game){
  const gid=String(game?.game_id || "").trim();
  return gid.slice(0,3);
}

function isAllowedGame(game){
  const prefix=gamePrefix(game);
  return prefix==="002" || prefix==="004";
}

function gameTypeLabel(game){
  const prefix=gamePrefix(game);
  if(prefix==="002") return "Regular Season";
  if(prefix==="004") return "Playoffs";
  return game.game_type || "";
}

function safeDateValue(d){
  const t=new Date(d).getTime();
  return Number.isFinite(t) ? t : 0;
}

function displayDate(d){
  if(!d) return "";
  const dt=new Date(d);
  if(Number.isNaN(dt.getTime())) return String(d).substring(0,10);
  return dt.toISOString().substring(0,10);
}

async function fetchJson(url){
  try{
    const res=await fetch(cacheBust(url), {cache:"no-store"});
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    return null;
  }
}

async function fetchGameFlexible(id){
  const raw=String(id).trim();
  const stripped=raw.replace(/^0+/,"");
  const candidates=[raw];

  if(stripped && stripped!==raw) candidates.push(stripped);
  if(raw && raw!==raw.padStart(10,"0")) candidates.push(raw.padStart(10,"0"));

  for(const candidate of [...new Set(candidates)]){
    const game=await fetchJson(`${BASE}${season}/${candidate}.json`);
    if(game){
      return game;
    }
  }
  return null;
}

async function init(){
  for(let y=1976;y<=2025;y++){
    let opt=document.createElement("option");
    opt.value=y;
    opt.textContent=y;
    seasonSelect.appendChild(opt);
  }

  seasonSelect.value=season;
  await loadSeason(season);
}

async function loadSeason(season){
  title.textContent="NBA Season "+season;
  gamesTable.innerHTML="<tr><td colspan='5'>Loading games...</td></tr>";
  teamSelect.innerHTML='<option value="All">All Teams</option>';

  try{
    const index=await fetchJson(`${BASE}${season}/index.json`);

    if(!index || !Array.isArray(index.games)){
      gamesTable.innerHTML="<tr><td colspan='5'>Season not found.</td></tr>";
      return;
    }

    const requests=index.games.map(id=>fetchGameFlexible(id));
    const rawGames=await Promise.all(requests);

    allGames=rawGames.filter(g=>
      g &&
      g.date &&
      g.home_team &&
      g.away_team &&
      isAllowedGame(g)
    );

    allGames.sort((a,b)=>safeDateValue(b.date)-safeDateValue(a.date));

    let teams=new Set();
    allGames.forEach(g=>{
      teams.add(g.home_team);
      teams.add(g.away_team);
    });

    Array.from(teams).sort().forEach(t=>{
      let opt=document.createElement("option");
      opt.value=t;
      opt.textContent=t;
      teamSelect.appendChild(opt);
    });

    renderGames();

  }catch(err){
    gamesTable.innerHTML="<tr><td colspan='5'>Error loading season.</td></tr>";
  }
}

function renderGames(){
  gamesTable.innerHTML="";

  const typeFilter=typeSelect.value;
  const teamFilter=teamSelect.value;

  let filtered=allGames.filter(g=>{
    const prefix=gamePrefix(g);

    if(typeFilter==="Regular" && prefix!=="002") return false;
    if(typeFilter==="Playoffs" && prefix!=="004") return false;

    if(teamFilter!=="All" && g.home_team!==teamFilter && g.away_team!==teamFilter) return false;

    return true;
  });

  if(!filtered.length){
    gamesTable.innerHTML="<tr><td colspan='5'>No games found.</td></tr>";
    return;
  }

  filtered.forEach(g=>{
    let winner="";

    if(g.home_score!=null && g.away_score!=null){
      if(g.home_score>g.away_score) winner=g.home_team;
      else if(g.away_score>g.home_score) winner=g.away_team;
    }

    let tr=document.createElement("tr");

    tr.onclick=()=>{
      window.location.href=`/nba-game.html?season=${season}&game=${encodeURIComponent(g.game_id)}`;
    };

    tr.innerHTML=`
      <td>${displayDate(g.date)}</td>
      <td>${g.home_team} vs ${g.away_team}</td>
      <td>${gameTypeLabel(g)}</td>
      <td>${winner}</td>
      <td>${g.home_score ?? ""} – ${g.away_score ?? ""}</td>
    `;

    gamesTable.appendChild(tr);
  });
}

init();
</script>

</body>
</html>
