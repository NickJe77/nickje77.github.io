<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;margin-bottom:10px;}
select{padding:8px 12px;font-size:15px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:center;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
tr:hover{background:#e9f0ff;}
.standings{margin-top:40px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Season</h1>

<div style="text-align:center;">
Season:
<select id="seasonSelect"></select>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesTable">
<tr><td colspan="4">Loading...</td></tr>
</tbody>
</table>

<div class="standings">
<h2>Standings</h2>
<table>
<thead>
<tr>
<th>Team</th>
<th>Wins</th>
<th>Losses</th>
</tr>
</thead>
<tbody id="standingsTable"></tbody>
</table>
</div>

</div>

<script>

const BASE = "data/nba/";

const seasonSelect=document.getElementById("seasonSelect");
const gamesTable=document.getElementById("gamesTable");
const standingsTable=document.getElementById("standingsTable");
const titleEl=document.getElementById("title");

function populateSeasons(){

for(let y=2026;y>=1976;y--){

let opt=document.createElement("option");
opt.value=y;
opt.textContent=y;
seasonSelect.appendChild(opt);

}

}

seasonSelect.addEventListener("change",()=>{
loadSeason(seasonSelect.value);
});

async function loadSeason(season){

titleEl.textContent="NBA Season "+season;
gamesTable.innerHTML="<tr><td colspan='4'>Loading...</td></tr>";
standingsTable.innerHTML="";

try{

let res=await fetch(BASE+season+"/index.json");
let index=await res.json();

let ids=index.games;

gamesTable.innerHTML="";
let standings={};

for(let id of ids){

let gRes=await fetch(BASE+season+"/"+id+".json");
let g=await gRes.json();

let winner=g.home_score>g.away_score?g.home_team:g.away_team;
let loser=g.home_score>g.away_score?g.away_team:g.home_team;

if(!standings[winner])standings[winner]={w:0,l:0};
if(!standings[loser])standings[loser]={w:0,l:0};

standings[winner].w++;
standings[loser].l++;

let tr=document.createElement("tr");

tr.innerHTML=`
<td>${g.date||""}</td>
<td>
<a href="nba-game.html?season=${season}&game=${g.game_id}">
${g.away_team} @ ${g.home_team}
</a>
</td>
<td>${winner}</td>
<td>${g.away_score}-${g.home_score}</td>
`;

gamesTable.appendChild(tr);

}

Object.entries(standings)
.sort((a,b)=>b[1].w-a[1].w)
.forEach(([team,rec])=>{

let tr=document.createElement("tr");
tr.innerHTML=`<td>${team}</td><td>${rec.w}</td><td>${rec.l}</td>`;
standingsTable.appendChild(tr);

});

}catch{

gamesTable.innerHTML="<tr><td colspan='4'>No season files found</td></tr>";

}

}

populateSeasons();
loadSeason(1976);

</script>

</body>
</html>
