<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f6f8;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1250px;
margin:auto;
padding:30px 20px 60px;
}

.hero{
background:linear-gradient(90deg,#1D428A,#C8102E);
color:white;
padding:26px 30px;
border-radius:14px;
margin-bottom:25px;
box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.hero h1{
margin:0;
font-size:34px;
font-weight:800;
}

.hero p{
margin:6px 0 0;
opacity:.9;
}

.filters{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:20px;
}

select{
padding:10px 14px;
border-radius:10px;
border:1px solid #ccc;
font-size:14px;
background:#fff;
}

.table-card{
background:#fff;
border-radius:14px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th,td{
padding:10px 12px;
border-bottom:1px solid #eee;
text-align:center;
}

th{
background:#eef3ff;
font-weight:800;
}

tr:nth-child(even){
background:#f8faff;
}

tbody tr{
cursor:pointer;
}

tbody tr:hover{
background:#eaf0ff;
}

.loading{
text-align:center;
padding:40px;
color:#666;
font-size:16px;
}

</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1 id="title">NBA Season</h1>
    <p>All NBA games for the selected season.</p>
  </div>

  <div class="filters">
    <select id="seasonSelect"></select>
    <select id="teamSelect">
      <option value="All">All Teams</option>
    </select>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Away</th>
          <th>Home</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="gamesTable">
        <tr><td colspan="4" class="loading">Loading games...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>

const SCHEDULE_BASE = "/data/basketball/schedules";

const seasonSelect = document.getElementById("seasonSelect");
const teamSelect   = document.getElementById("teamSelect");
const gamesTable   = document.getElementById("gamesTable");
const title        = document.getElementById("title");

const params = new URLSearchParams(location.search);
let season   = params.get("season") || "2024";

let allGames = [];

// Build season dropdown 1976-2024
// Season "2024" = 2024-25 season
for(let y = 2024; y >= 1976; y--){
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = `${y}-${y + 1}`;
  if(y == season) opt.selected = true;
  seasonSelect.appendChild(opt);
}

seasonSelect.onchange = () => {
  location.href = "/nba-season.html?season=" + seasonSelect.value;
};

teamSelect.onchange = renderGames;

async function loadSeason(){

  title.textContent = `NBA ${season}-${parseInt(season) + 1} Season`;
  gamesTable.innerHTML = `<tr><td colspan="4" class="loading">Loading games...</td></tr>`;
  teamSelect.innerHTML = '<option value="All">All Teams</option>';

  try{

    const res = await fetch(`${SCHEDULE_BASE}/${season}.json`);
    if(!res.ok) throw new Error("Schedule not found");
    allGames = await res.json();

    const teams = new Set();
    allGames.forEach(g => {
      if(g.home) teams.add(g.home);
      if(g.away) teams.add(g.away);
    });
    [...teams].sort().forEach(t => {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = t;
      teamSelect.appendChild(opt);
    });

    renderGames();

  }catch(err){
    console.error(err);
    gamesTable.innerHTML = `<tr><td colspan="4" class="loading">Failed to load season.</td></tr>`;
  }

}

function renderGames(){

  gamesTable.innerHTML = "";

  const teamFilter = teamSelect.value;

  let filtered = allGames;

  if(teamFilter !== "All"){
    filtered = allGames.filter(g => g.home === teamFilter || g.away === teamFilter);
  }

  if(!filtered.length){
    gamesTable.innerHTML = `<tr><td colspan="4" class="loading">No games found.</td></tr>`;
    return;
  }

  filtered.forEach(g => {

    const gameId = g.url ? g.url.split("/").pop().replace(".html", "") : "";

    const tr = document.createElement("tr");

    tr.onclick = () => {
      window.location.href = `/nba-game.html?season=${season}&game=${gameId}`;
    };

    tr.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${g.away || ""}</td>
      <td>${g.home || ""}</td>
      <td>${g.score || "–"}</td>
    `;

    gamesTable.appendChild(tr);

  });

}

loadSeason();

</script>

</body>
</html>
