<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season</title>

<style>
body{font-family:Arial;margin:40px;background:#f4f6f8;}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:center}
</style>
</head>

<body>

<h1 id="title"></h1>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Score</th>
</tr>
</thead>
<tbody id="games"></tbody>
</table>

<script>

const season="2025";
const base="/data/nba/"+season+"/";

const table=document.getElementById("games");
const title=document.getElementById("title");

title.textContent="NBA "+season;

async function load(){

const index=await fetch(base+"index.json?"+Date.now()).then(r=>r.json());

const games=await Promise.all(
index.games.map(id=>{
let file=id.replace(/^0+/,''); // remove leading zeros
return fetch(base+file+".json?"+Date.now())
.then(r=>r.ok?r.json():null)
})
);

let valid=games.filter(g=>
g &&
g.game_id &&
(g.game_id.startsWith("002") || g.game_id.startsWith("004"))
);

valid.sort((a,b)=>new Date(b.date)-new Date(a.date));

valid.forEach(g=>{

let tr=document.createElement("tr");

tr.innerHTML=`
<td>${g.date.slice(0,10)}</td>
<td>${g.home_team} vs ${g.away_team}</td>
<td>${g.home_score} - ${g.away_score}</td>
`;

table.appendChild(tr);

});

}

load();

</script>

</body>
</html>
