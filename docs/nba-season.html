<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;margin-bottom:10px;}
select{padding:8px 12px;font-size:15px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:center;}
th{background:#f0f0f0;position:sticky;top:0;}
tr:nth-child(even){background:#f6f9ff;}
tr:hover{background:#e9f0ff;}
.filter-bar{text-align:center;margin-bottom:15px;}
.standings{margin-top:40px;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Season</h1>

<div class="filter-bar">
Season:
<select id="seasonSelect"></select>
Game Type:
<select id="typeFilter">
  <option value="all">All</option>
  <option value="regular">Regular Season</option>
  <option value="playoffs">Playoffs</option>
</select>
</div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Game</th>
  <th>Winner</th>
  <th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

<div class="standings">
<h2>Standings</h2>
<table>
<thead>
<tr>
  <th>Team</th>
  <th>Wins</th>
  <th>Losses</th>
</tr>
</thead>
<tbody id="standingsTable"></tbody>
</table>
</div>

</div>

<script>
const BASE_PATH = "data/nba/";

const params = new URLSearchParams(window.location.search);
let seasonParam = params.get("season");

const seasonSelect = document.getElementById("seasonSelect");
const gamesTable = document.getElementById("gamesTable");
const standingsTable = document.getElementById("standingsTable");
const titleEl = document.getElementById("title");
const typeFilter = document.getElementById("typeFilter");

function seasonToFile(season){
  return BASE_PATH + "nba_season_" + season.replace("-","_") + ".json";
}

/* FAST auto season detection */
async function detectSeasons(){
  const years = [];
  for(let y=1976; y<=2030; y++){
    years.push(`${y}-${String(y+1).slice(2)}`);
  }

  const checks = years.map(season =>
    fetch(seasonToFile(season))
      .then(r => r.ok ? season : null)
      .catch(()=>null)
  );

  const results = await Promise.all(checks);
  return results.filter(Boolean).sort((a,b)=>b.localeCompare(a));
}

seasonSelect.addEventListener("change",()=>{
  location.href = "nba-season.html?season=" + seasonSelect.value;
});

typeFilter.addEventListener("change",()=>{
  loadSeason(seasonSelect.value);
});

init();

async function init(){
  const seasonFiles = await detectSeasons();

  if(seasonFiles.length === 0){
    gamesTable.innerHTML = `<tr><td colspan="4">No season files found</td></tr>`;
    return;
  }

  seasonFiles.forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    seasonSelect.appendChild(opt);
  });

  if(!seasonParam || !seasonFiles.includes(seasonParam)){
    seasonParam = seasonFiles[0];
  }

  seasonSelect.value = seasonParam;
  loadSeason(seasonParam);
}

/* FIX DATE BUG — add correct year based on season */
function parseGameDate(dateStr, season){
  if(!dateStr) return new Date(0);

  const [startYear,endShort] = season.split("-");
  const endYear = parseInt(startYear) + 1;

  const earlyMonths = ["Jan","Feb","Mar","Apr","May","Jun"];
  const useYear = earlyMonths.some(m => dateStr.includes(m)) ? endYear : startYear;

  return new Date(dateStr + " " + useYear);
}

async function loadSeason(season){
  const file = seasonToFile(season);
  titleEl.textContent = "NBA Season " + season;
  gamesTable.innerHTML = "";
  standingsTable.innerHTML = "";

  try{
    const res = await fetch(file);
    const data = await res.json();

    const standings = {};

    const games = (data.games || []).slice().sort((a,b)=>{
      return parseGameDate(b.date||"",season) - parseGameDate(a.date||"",season);
    });

    games.forEach(g=>{
      const isPlayoff = g.round && g.round.toLowerCase().includes("playoff");

      if(typeFilter.value==="playoffs" && !isPlayoff) return;
      if(typeFilter.value==="regular" && isPlayoff) return;

      const winner = g.home_points > g.away_points ? g.home_team : g.away_team;
      const loser  = g.home_points > g.away_points ? g.away_team : g.home_team;

      standings[winner] = standings[winner] || {w:0,l:0};
      standings[loser]  = standings[loser]  || {w:0,l:0};
      standings[winner].w++;
      standings[loser].l++;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${g.date || ""}</td>
        <td>
          <a href="nba-team.html?team=${encodeURIComponent(g.home_team)}">${g.home_team}</a>
          vs
          <a href="nba-team.html?team=${encodeURIComponent(g.away_team)}">${g.away_team}</a>
        </td>
        <td>${winner}</td>
        <td>${g.home_points} – ${g.away_points}</td>
      `;

      tr.onclick = () =>
        location.href =
          "nba-game.html?season=" + encodeURIComponent(season) +
          "&game=" + encodeURIComponent(g.home_team + " vs " + g.away_team);

      gamesTable.appendChild(tr);
    });

    Object.entries(standings)
      .sort((a,b)=>b[1].w - a[1].w)
      .forEach(([team,rec])=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${team}</td><td>${rec.w}</td><td>${rec.l}</td>`;
        standingsTable.appendChild(tr);
      });

  }catch(e){
    gamesTable.innerHTML = `<tr><td colspan="4">Could not load ${file}</td></tr>`;
  }
}
</script>

</body>
</html>
