<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:auto;padding:30px 20px 60px;}
h1{text-align:center;margin-bottom:15px;}
.filters{text-align:center;margin-bottom:20px;}
select{padding:8px 12px;font-size:15px;margin:0 6px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:center;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
tr:hover{background:#e9f0ff;cursor:pointer;}
.standings{margin-top:40px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Season</h1>

<div class="filters">
Season:
<select id="seasonSelect"></select>

Game Type:
<select id="typeSelect">
<option value="All">All</option>
<option value="Regular Season">Regular Season</option>
<option value="Playoffs">Playoffs</option>
</select>

Team:
<select id="teamSelect">
<option value="All">All Teams</option>
</select>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Type</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

<div class="standings">
<h2>Regular Season Standings</h2>
<table>
<thead>
<tr>
<th>Team</th>
<th>Wins</th>
<th>Losses</th>
</tr>
</thead>
<tbody id="standingsTable"></tbody>
</table>
</div>

</div>

<script>

const BASE="data/nba/";

const gamesTable=document.getElementById("gamesTable");
const standingsTable=document.getElementById("standingsTable");
const seasonSelect=document.getElementById("seasonSelect");
const typeSelect=document.getElementById("typeSelect");
const teamSelect=document.getElementById("teamSelect");
const title=document.getElementById("title");

const params=new URLSearchParams(location.search);
let season=params.get("season") || "2025";

let allGames=[];

seasonSelect.onchange=()=>{
location.href="nba-season.html?season="+seasonSelect.value;
};

typeSelect.onchange=renderGames;
teamSelect.onchange=renderGames;

/* FILTER OUT PRESEASON + ALL STAR */
function isExcludedGame(game){

if(!game) return true;

if(!game.game_type) return false;

const type = game.game_type.toLowerCase();

if(type.includes("preseason")) return true;
if(type.includes("all")) return true;

return false;
}

async function init(){

for(let y=1976;y<=2026;y++){
const opt=document.createElement("option");
opt.value=y;
opt.textContent=y;
seasonSelect.appendChild(opt);
}

seasonSelect.value=season;
await loadSeason(season);

}

async function loadSeason(season){

title.textContent="NBA Season " + season;
gamesTable.innerHTML="";
standingsTable.innerHTML="";
teamSelect.innerHTML='<option value="All">All Teams</option>';

let standings={};
let teams=new Set();

try{

const indexRes=await fetch(BASE+season+"/index.json");
if(!indexRes.ok) throw new Error("No index");

const index=await indexRes.json();

const gameFiles=index.games.map(id =>
fetch(BASE+season+"/"+id+".json").then(r=>r.json())
);

allGames=await Promise.all(gameFiles);

/* REMOVE PRESEASON + ALL STAR */
allGames = allGames.filter(g => !isExcludedGame(g));

allGames.forEach(g=>{

teams.add(g.home_team);
teams.add(g.away_team);

/* Standings = Regular Season ONLY */
if(g.game_type === "Regular Season"){

if(!standings[g.home_team]) standings[g.home_team]={w:0,l:0};
if(!standings[g.away_team]) standings[g.away_team]={w:0,l:0};

if(g.home_score > g.away_score){
standings[g.home_team].w++;
standings[g.away_team].l++;
}else{
standings[g.away_team].w++;
standings[g.home_team].l++;
}

}

});

/* Populate team dropdown */
Array.from(teams).sort().forEach(team=>{
const opt=document.createElement("option");
opt.value=team;
opt.textContent=team;
teamSelect.appendChild(opt);
});

/* Render standings */
Object.entries(standings)
.sort((a,b)=>b[1].w-a[1].w)
.forEach(([team,rec])=>{
const tr=document.createElement("tr");
tr.innerHTML=`
<td>${team}</td>
<td>${rec.w}</td>
<td>${rec.l}</td>
`;
standingsTable.appendChild(tr);
});

renderGames();

}catch(e){
gamesTable.innerHTML="<tr><td colspan='5'>No season files found</td></tr>";
}

}

function renderGames(){

gamesTable.innerHTML="";

const typeFilter=typeSelect.value;
const teamFilter=teamSelect.value;

allGames.forEach(g=>{

if(typeFilter!=="All" && g.game_type!==typeFilter) return;
if(teamFilter!=="All" && g.home_team!==teamFilter && g.away_team!==teamFilter) return;

const winner=g.home_score>g.away_score?g.home_team:g.away_team;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${g.date}</td>
<td>
<a href="nba-team.html?team=${encodeURIComponent(g.home_team)}">${g.home_team}</a>
vs
<a href="nba-team.html?team=${encodeURIComponent(g.away_team)}">${g.away_team}</a>
</td>
<td>${g.game_type}</td>
<td>${winner}</td>
<td>${g.home_score} – ${g.away_score}</td>
`;

tr.onclick=()=>{
location.href="nba-game.html?season="+season+"&game="+g.game_id;
};

gamesTable.appendChild(tr);

});

}

window.addEventListener("pageshow",()=>{
loadSeason(season);
});

init();

</script>

</body>
</html>
