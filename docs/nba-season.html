<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{
  text-align:center;
  margin-bottom:10px;
}

select{
  padding:8px 12px;
  font-size:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:center;
}

th{
  background:#f0f0f0;
}

tr:nth-child(even){
  background:#f6f9ff;
}

tr:hover{
  background:#e9f0ff;
  cursor:pointer;
}

.filter-bar{
  text-align:center;
  margin-bottom:15px;
}

.standings{
  margin-top:40px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Season</h1>

<div class="filter-bar">
Season:
<select id="seasonSelect"></select>
Game Type:
<select id="typeFilter">
<option value="all">All</option>
<option value="regular">Regular Season</option>
<option value="playoffs">Playoffs</option>
</select>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

<div class="standings">

<h2>Standings</h2>

<table>
<thead>
<tr>
<th>Team</th>
<th>Wins</th>
<th>Losses</th>
</tr>
</thead>
<tbody id="standingsTable"></tbody>
</table>

</div>

</div>

<script>

const BASE = "data/nba/";

const seasonSelect = document.getElementById("seasonSelect");
const gamesTable = document.getElementById("gamesTable");
const standingsTable = document.getElementById("standingsTable");
const titleEl = document.getElementById("title");
const typeFilter = document.getElementById("typeFilter");

const params = new URLSearchParams(window.location.search);
let season = params.get("season") || "1976";

function seasonFolder(season){
return BASE + season;
}

seasonSelect.onchange = () =>
location.href = "nba-season.html?season=" + seasonSelect.value;

typeFilter.onchange = () =>
loadSeason(seasonSelect.value);

init();

async function init(){

for(let y=1976;y<=2026;y++){

const opt=document.createElement("option");
opt.value=y;
opt.textContent=y;

seasonSelect.appendChild(opt);

}

seasonSelect.value=season;

loadSeason(season);

}

async function loadSeason(season){

titleEl.textContent = "NBA Season " + season;

gamesTable.innerHTML = "";
standingsTable.innerHTML = "";

let standings = {};

try{

const res = await fetch(seasonFolder(season) + "/index.json");

if(!res.ok) throw new Error();

const index = await res.json();

const ids = index.games;

for(const id of ids){

const gameRes =
await fetch(seasonFolder(season) + "/" + id + ".json");

if(!gameRes.ok) continue;

const g = await gameRes.json();

const home =
g.home_team ||
g.homeTeam ||
g.home ||
"";

const away =
g.away_team ||
g.awayTeam ||
g.away ||
"";

const home_score =
Number(
g.home_score ??
g.homeScore ??
g.home_points ??
g.homePoints ??
0
);

const away_score =
Number(
g.away_score ??
g.awayScore ??
g.away_points ??
g.awayPoints ??
0
);

const date =
g.date ||
g.game_date ||
g.gameDate ||
"";

if(typeFilter.value==="playoffs" && !g.is_playoffs) continue;
if(typeFilter.value==="regular" && g.is_playoffs) continue;

const winner =
home_score > away_score ? home : away;

const loser =
home_score > away_score ? away : home;

if(!standings[home])
standings[home]={w:0,l:0};

if(!standings[away])
standings[away]={w:0,l:0};

if(home_score>away_score){

standings[home].w++;
standings[away].l++;

}else{

standings[away].w++;
standings[home].l++;

}

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${date.split(" ")[0]}</td>

<td>
<a href="nba-team.html?team=${encodeURIComponent(home)}">${home}</a>
vs
<a href="nba-team.html?team=${encodeURIComponent(away)}">${away}</a>
</td>

<td>${winner}</td>

<td>${home_score} – ${away_score}</td>

`;

tr.onclick=()=>
location.href=
"nba-game.html?season="+season+
"&game="+encodeURIComponent(home+" vs "+away);

gamesTable.appendChild(tr);

}

Object.entries(standings)
.sort((a,b)=>b[1].w-a[1].w)
.forEach(([team,rec])=>{

const tr=document.createElement("tr");

tr.innerHTML=
`<td>${team}</td>
<td>${rec.w}</td>
<td>${rec.l}</td>`;

standingsTable.appendChild(tr);

});

}catch{

gamesTable.innerHTML=
`<tr>
<td colspan="4">
No season files found
</td>
</tr>`;

}

}

</script>

</body>
</html>
