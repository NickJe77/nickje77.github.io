<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}
.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:10px;}

select{
  padding:8px 12px;
  font-size:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:center;
}
th{
  background:#f0f0f0;
  position:sticky;
  top:0;
}
tr:nth-child(even){background:#f6f9ff;}
tr:hover{background:#e9f0ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Seasons</h1>

<div style="text-align:center;margin-bottom:20px;">
  Season:
  <select id="seasonSelect"></select>
</div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Game</th>
  <th>Winner</th>
  <th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
let seasonParam = params.get("season");

const seasonSelect = document.getElementById("seasonSelect");
const gamesTable = document.getElementById("gamesTable");
const titleEl = document.getElementById("title");

/* 🔥 ADD NEW SEASONS HERE */
const seasonFiles = [
  "1976-77",
  "1977-78",
  "1978-79",
  "1979-80",
  "1981-82",
  "2023-24"
];

function seasonToFile(season){
  return "data/nba/nba_season_" + season.replace("-","_") + ".json";
}

/* populate dropdown */
seasonFiles.forEach(s=>{
  const opt = document.createElement("option");
  opt.value = s;
  opt.textContent = s;
  seasonSelect.appendChild(opt);
});

/* default season */
if(!seasonParam){
  seasonParam = seasonFiles[0];
}

seasonSelect.value = seasonParam;

seasonSelect.addEventListener("change", ()=>{
  window.location.href = "nba-season.html?season=" + seasonSelect.value;
});

loadSeason(seasonParam);

async function loadSeason(season){
  const file = seasonToFile(season);
  titleEl.textContent = "NBA Season " + season;
  gamesTable.innerHTML = "";

  try{
    const res = await fetch(file);
    if(!res.ok) throw new Error("Fetch failed");
    const data = await res.json();

    data.games.forEach(g=>{
      const winner =
        g.home_points > g.away_points ? g.home_team : g.away_team;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${g.date || ""}</td>
        <td>${g.home_team} vs ${g.away_team}</td>
        <td>${winner}</td>
        <td>${g.home_points} – ${g.away_points}</td>
      `;

      tr.onclick = () => {
        window.location.href =
          "nba-game.html?season=" +
          encodeURIComponent(season) +
          "&game=" +
          encodeURIComponent(g.home_team + " vs " + g.away_team);
      };

      gamesTable.appendChild(tr);
    });

  }catch(e){
    gamesTable.innerHTML =
      `<tr><td colspan="4">Could not load season file: ${file}</td></tr>`;
  }
}
</script>

</body>
</html>
