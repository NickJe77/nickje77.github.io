<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1250px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:28px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero p{margin:8px 0 0;color:rgba(255,255,255,.68);font-size:13.5px;}

.filters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:center;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
tbody tr{cursor:pointer;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.loading{text-align:center;padding:40px;color:var(--muted);font-style:italic;}
.score{font-weight:700;color:var(--ink);}
</style>
</head>
<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div class="page-wrap">
  <div class="hero">
    <span class="eyebrow">NBA</span>
    <h1 id="title">NBA Season</h1>
    <p>All NBA games for the selected season.</p>
  </div>

  <div class="filters">
    <select id="seasonSelect"></select>
    <select id="teamSelect"><option value="All">All Teams</option></select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Away</th>
          <th>Score</th>
          <th>Home</th>
        </tr>
      </thead>
      <tbody id="gamesTable">
        <tr><td colspan="4" class="loading">Loading games...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

const seasonSelect = document.getElementById("seasonSelect");
const teamSelect   = document.getElementById("teamSelect");
const gamesTable   = document.getElementById("gamesTable");
const title        = document.getElementById("title");

const params = new URLSearchParams(location.search);
let season = params.get("season") || "2026";

let allGames = [];

for(let y = 2026; y >= 1977; y--){
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = `${y-1}-${y}`;
  if(y == season) opt.selected = true;
  seasonSelect.appendChild(opt);
}

seasonSelect.onchange = () => {
  location.href = "/nba-season.html?season=" + seasonSelect.value;
};

teamSelect.onchange = renderGames;

function parseDate(str){
  if(!str) return 0;
  try{ return new Date(str).getTime(); }
  catch(e){ return 0; }
}

async function loadSeason(){
  title.textContent = `NBA ${parseInt(season)-1}-${season} Season`;
  gamesTable.innerHTML = `<tr><td colspan="4" class="loading">Loading games...</td></tr>`;
  teamSelect.innerHTML = '<option value="All">All Teams</option>';

  try{
    const res = await fetch(`${R2}/basketball/indexes/${season}.json`);
    if(!res.ok) throw new Error("Index not found");
    allGames = await res.json();

    allGames.sort((a, b) => parseDate(b.date) - parseDate(a.date));

    const teams = new Set();
    allGames.forEach(g => {
      if(g.home) teams.add(g.home);
      if(g.away) teams.add(g.away);
    });
    [...teams].sort().forEach(t => {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = t;
      teamSelect.appendChild(opt);
    });

    renderGames();
  }catch(err){
    console.error(err);
    gamesTable.innerHTML = `<tr><td colspan="4" class="loading">Failed to load season.</td></tr>`;
  }
}

function renderGames(){
  gamesTable.innerHTML = "";
  const teamFilter = teamSelect.value;
  let filtered = allGames;
  if(teamFilter !== "All"){
    filtered = allGames.filter(g => g.home === teamFilter || g.away === teamFilter);
  }
  if(!filtered.length){
    gamesTable.innerHTML = `<tr><td colspan="4" class="loading">No games found.</td></tr>`;
    return;
  }
  filtered.forEach(g => {
    const tr = document.createElement("tr");
    tr.onclick = () => {
      window.location.href = `/nba-game.html?season=${season}&game=${g.game_id}`;
    };
    const score = g.home_score != null && g.away_score != null
      ? `<span class="score">${g.away_score} - ${g.home_score}</span>`
      : "–";
    tr.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${g.away || ""}</td>
      <td>${score}</td>
      <td>${g.home || ""}</td>
    `;
    gamesTable.appendChild(tr);
  });
}

loadSeason();
</script>
</body>
</html>
