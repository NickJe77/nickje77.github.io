<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Seasons (1976–Present) | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}
.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}
h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:30px;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:10px 12px;text-align:left;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
a.season-link{color:#0056d6;text-decoration:none;font-weight:600;}
a.season-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<h1>NBA Seasons</h1>
<p>Championship seasons from 1976–77 to the present day.</p>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Champion</th>
  <th>Runner-up</th>
  <th>Finals MVP</th>
</tr>
</thead>
<tbody id="seasonTable"></tbody>
</table>

</div>

<script>
const tableBody = document.getElementById("seasonTable");

const seasonFiles = [
  "nba_season_1976_77.json",
  "nba_season_1977_78.json",
  "nba_season_1978_79.json",
  "nba_season_1979_80.json",
  "nba_season_2023_24.json"
];

async function loadSeasons(){
  const seasons = [];

  for(const file of seasonFiles){
    try{
      const res = await fetch("data/nba/" + file);
      if(!res.ok) continue;
      const json = await res.json();
      json.__file = file;
      seasons.push(json);
    }catch(e){}
  }

  seasons.sort((a,b)=>a.season.localeCompare(b.season));

  seasons.forEach(season=>{
    const tr=document.createElement("tr");

    const seasonKey = season.season.replace("-","_");

    tr.innerHTML=`
      <td>
        <a class="season-link" href="nba-season-view.html?season=${seasonKey}">
          ${season.season}
        </a>
      </td>
      <td>${season.champion||""}</td>
      <td>${season.runner_up||""}</td>
      <td>${season.finals_mvp||""}</td>
    `;
    tableBody.appendChild(tr);
  });
}

loadSeasons();
</script>

</body>
</html>
