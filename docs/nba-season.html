<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{
  text-align:center;
  margin-bottom:10px;
}

select{
  padding:8px 12px;
  font-size:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:center;
}

th{
  background:#f0f0f0;
}

tr:nth-child(even){
  background:#f6f9ff;
}

tr:hover{
  background:#e9f0ff;
}

.filter-bar{
  text-align:center;
  margin-bottom:15px;
}

.standings{
  margin-top:40px;
}

.game-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Season</h1>

<div class="filter-bar">
Season:
<select id="seasonSelect"></select>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

<div class="standings">
<h2>Standings</h2>

<table>
<thead>
<tr>
<th>Team</th>
<th>Wins</th>
<th>Losses</th>
</tr>
</thead>

<tbody id="standingsTable"></tbody>
</table>

</div>

</div>

<script>

const BASE = "data/nba/";

const seasonSelect = document.getElementById("seasonSelect");
const gamesTable = document.getElementById("gamesTable");
const standingsTable = document.getElementById("standingsTable");
const titleEl = document.getElementById("title");

const params = new URLSearchParams(window.location.search);
let season = params.get("season") || "1976";


function seasonPath(season){
  return BASE + season + "/";
}


async function detectSeasons(){

  const seasons=[];

  for(let y=1976;y<=2026;y++){

    try{

      const res = await fetch(BASE + y + "/index.json");

      if(res.ok) seasons.push(String(y));

    }catch{}

  }

  seasons.sort((a,b)=>b-a);

  return seasons;

}


seasonSelect.onchange=()=>{
  location.href="nba-season.html?season="+seasonSelect.value;
};


async function loadSeason(season){

  titleEl.textContent="NBA Season "+season;

  gamesTable.innerHTML="";
  standingsTable.innerHTML="";

  const indexPath = seasonPath(season) + "index.json";

  try{

    const res = await fetch(indexPath);

    const index = await res.json();

    const standings={};

    for(const game_id of index.games){

      const gamePath = seasonPath(season) + game_id + ".json";

      const gameRes = await fetch(gamePath);

      if(!gameRes.ok) continue;

      const game = await gameRes.json();

      const home = game.home_team;
      const away = game.away_team;

      const homePts = game.home_score;
      const awayPts = game.away_score;

      const winner = homePts > awayPts ? home : away;
      const loser  = homePts > awayPts ? away : home;

      standings[winner] ||= {w:0,l:0};
      standings[loser]  ||= {w:0,l:0};

      standings[winner].w++;
      standings[loser].l++;

      const tr=document.createElement("tr");

      tr.innerHTML=`

      <td>${game.date?.split(" ")[0] || ""}</td>

      <td>

      <a class="game-link"

      href="nba-game.html?season=${season}&game=${game_id}">

      ${home} vs ${away}

      </a>

      </td>

      <td>${winner}</td>

      <td>${homePts} – ${awayPts}</td>

      `;

      gamesTable.appendChild(tr);

    }


    Object.entries(standings)

    .sort((a,b)=>b[1].w-a[1].w)

    .forEach(([team,rec])=>{

      const tr=document.createElement("tr");

      tr.innerHTML=`

      <td>${team}</td>

      <td>${rec.w}</td>

      <td>${rec.l}</td>

      `;

      standingsTable.appendChild(tr);

    });


  }catch(e){

    gamesTable.innerHTML="<tr><td colspan=4>Failed to load season</td></tr>";

  }

}


async function init(){

  const seasons=await detectSeasons();

  seasons.forEach(s=>{

    const opt=document.createElement("option");

    opt.value=s;

    opt.textContent=s;

    seasonSelect.appendChild(opt);

  });

  seasonSelect.value=season;

  loadSeason(season);

}


init();

</script>

</body>
</html>
