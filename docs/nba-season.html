<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1250px;margin:auto;padding:30px 20px 60px;}
h1{text-align:center;margin-bottom:20px;}
.filters{text-align:center;margin-bottom:20px;}
select{padding:8px 12px;font-size:15px;margin:0 6px;}
table{width:100%;border-collapse:collapse;margin-top:15px;background:#fff;border-radius:12px;overflow:hidden;}
th,td{border-bottom:1px solid #eee;padding:10px;text-align:center;}
th{background:#f0f0f0;font-weight:700;}
tr:nth-child(even){background:#f9fbff;}
tr:hover{background:#eef4ff;cursor:pointer;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Season</h1>

<div class="filters">
Season:
<select id="seasonSelect"></select>

Game Type:
<select id="typeSelect">
<option value="All">All</option>
<option value="Regular Season">Regular Season</option>
<option value="Playoffs">Playoffs</option>
</select>

Team:
<select id="teamSelect">
<option value="All">All Teams</option>
</select>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Type</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

</div>

<script>

const BASE="/data/nba/";

const seasonSelect=document.getElementById("seasonSelect");
const typeSelect=document.getElementById("typeSelect");
const teamSelect=document.getElementById("teamSelect");
const gamesTable=document.getElementById("gamesTable");
const title=document.getElementById("title");

const params=new URLSearchParams(location.search);
let season=params.get("season") || "2025";
let allGames=[];

seasonSelect.onchange=()=>location.href="nba-season.html?season="+seasonSelect.value;
typeSelect.onchange=renderGames;
teamSelect.onchange=renderGames;

async function init(){

for(let y=1976;y<=2026;y++){
  let opt=document.createElement("option");
  opt.value=y;
  opt.textContent=y;
  seasonSelect.appendChild(opt);
}

seasonSelect.value=season;
await loadSeason(season);
}

async function loadSeason(season){

title.textContent="NBA Season " + season;
gamesTable.innerHTML="";
teamSelect.innerHTML='<option value="All">All Teams</option>';

try{

const indexRes = await fetch(BASE+season+"/index.json");

if(!indexRes.ok){
  gamesTable.innerHTML="<tr><td colspan='5'>Season not found.</td></tr>";
  return;
}

const index=await indexRes.json();

const gameFiles=index.games.map(id =>
  fetch(BASE+season+"/"+id+".json")
  .then(r=>r.ok?r.json():null)
);

/* FIX: load ALL games instead of filtering them out */
allGames = (await Promise.all(gameFiles)).filter(g=>g);

let teams=new Set();

allGames.forEach(g=>{
  teams.add(g.home_team);
  teams.add(g.away_team);
});

Array.from(teams).sort().forEach(t=>{
  let opt=document.createElement("option");
  opt.value=t;
  opt.textContent=t;
  teamSelect.appendChild(opt);
});

renderGames();

}catch(err){
gamesTable.innerHTML="<tr><td colspan='5'>Error loading season.</td></tr>";
}

}

function renderGames(){

gamesTable.innerHTML="";
const typeFilter=typeSelect.value;
const teamFilter=teamSelect.value;

allGames.forEach(g=>{

if(typeFilter!=="All" && g.game_type!==typeFilter) return;
if(teamFilter!=="All" && g.home_team!==teamFilter && g.away_team!==teamFilter) return;

let winner=g.home_score>g.away_score?g.home_team:g.away_team;

let tr=document.createElement("tr");

tr.onclick=()=>{
  if(!g.game_id) return;
  window.location.href=`/nba-game.html?season=${season}&game=${g.game_id}`;
};

tr.innerHTML=`
<td>${g.date.substring(0,10)}</td>
<td>${g.home_team} vs ${g.away_team}</td>
<td>${g.game_type}</td>
<td>${winner}</td>
<td>${g.home_score} – ${g.away_score}</td>
`;

gamesTable.appendChild(tr);

});

}

init();

</script>

</body>
</html>
