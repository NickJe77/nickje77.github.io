<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:auto;padding:30px 20px 60px;}
h1{text-align:center;}
select{padding:8px 12px;font-size:15px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:center;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
tr:hover{background:#e9f0ff;cursor:pointer;}
.standings{margin-top:40px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Season</h1>

<div style="text-align:center">
Season:
<select id="seasonSelect"></select>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

<div class="standings">
<h2>Standings</h2>
<table>
<thead>
<tr>
<th>Team</th>
<th>Wins</th>
<th>Losses</th>
</tr>
</thead>
<tbody id="standingsTable"></tbody>
</table>
</div>

</div>

<script>

const BASE="data/nba/";

const gamesTable=document.getElementById("gamesTable");
const standingsTable=document.getElementById("standingsTable");
const seasonSelect=document.getElementById("seasonSelect");
const title=document.getElementById("title");

const params=new URLSearchParams(location.search);
let season=params.get("season") || "2025";

seasonSelect.onchange=()=>{
location.href="nba-season.html?season="+seasonSelect.value;
};

async function init(){

for(let y=1976;y<=2026;y++){
const opt=document.createElement("option");
opt.value=y;
opt.textContent=y;
seasonSelect.appendChild(opt);
}

seasonSelect.value=season;
await loadSeason(season);

}

async function loadSeason(season){

title.textContent="NBA Season " + season;

/* HARD RESET TABLES */
gamesTable.innerHTML="";
standingsTable.innerHTML="";

let standings={};

try{

const indexRes=await fetch(BASE+season+"/index.json");
if(!indexRes.ok) throw new Error("No index");

const index=await indexRes.json();

/* LOAD ALL GAMES IN PARALLEL */
const gameFiles=index.games.map(id =>
fetch(BASE+season+"/"+id+".json").then(r=>r.json())
);

const games=await Promise.all(gameFiles);

games.forEach(g=>{

if(g.game_type==="Preseason") return;

const home=g.home_team;
const away=g.away_team;

const homeScore=g.home_score||0;
const awayScore=g.away_score||0;

const winner=homeScore>awayScore?home:away;

if(!standings[home]) standings[home]={w:0,l:0};
if(!standings[away]) standings[away]={w:0,l:0};

if(homeScore>awayScore){
standings[home].w++;
standings[away].l++;
}else{
standings[away].w++;
standings[home].l++;
}

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${g.date}</td>
<td>
<a href="nba-team.html?team=${encodeURIComponent(home)}">${home}</a>
vs
<a href="nba-team.html?team=${encodeURIComponent(away)}">${away}</a>
</td>
<td>${winner}</td>
<td>${homeScore} – ${awayScore}</td>
`;

tr.onclick=()=>{
location.href="nba-game.html?season="+season+"&game="+g.game_id;
};

gamesTable.appendChild(tr);

});

/* RENDER STANDINGS */
Object.entries(standings)
.sort((a,b)=>b[1].w-a[1].w)
.forEach(([team,rec])=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${team}</td>
<td>${rec.w}</td>
<td>${rec.l}</td>
`;

standingsTable.appendChild(tr);

});

}catch(e){

gamesTable.innerHTML="<tr><td colspan='4'>No season files found</td></tr>";

}

}

window.addEventListener("pageshow",()=>{
loadSeason(season);
});

init();

</script>

</body>
</html>
