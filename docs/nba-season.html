<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

h1{text-align:center;}

select{
padding:8px 12px;
font-size:15px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border-bottom:1px solid #ddd;
padding:8px 10px;
text-align:center;
}

th{background:#f0f0f0;}

tr:nth-child(even){background:#f6f9ff;}

tr:hover{
background:#e9f0ff;
cursor:pointer;
}

.standings{margin-top:40px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Season</h1>

<div style="text-align:center">

Season:
<select id="seasonSelect"></select>

Game Type:
<select>
<option>All</option>
</select>

</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

<div class="standings">
<h2>Standings</h2>

<table>
<thead>
<tr>
<th>Team</th>
<th>Wins</th>
<th>Losses</th>
</tr>
</thead>
<tbody id="standingsTable"></tbody>
</table>

</div>
</div>

<script>

const BASE="data/nba/";

const gamesTable=document.getElementById("gamesTable");
const standingsTable=document.getElementById("standingsTable");
const seasonSelect=document.getElementById("seasonSelect");
const title=document.getElementById("title");

const params=new URLSearchParams(location.search);
let season=params.get("season") || "2025";

function folder(season){
return BASE + season;
}

seasonSelect.onchange=()=>{
location.href="nba-season.html?season="+seasonSelect.value;
};

init();

async function init(){

for(let y=1976;y<=2025;y++){
const opt=document.createElement("option");
opt.value=y;
opt.textContent=y;
seasonSelect.appendChild(opt);
}

seasonSelect.value=season;
loadSeason(season);

}

function pick(obj,...keys){
for(const k of keys){
if(obj[k]!=null && obj[k]!="") return obj[k];
}
return "";
}

async function loadSeason(season){

title.textContent="NBA Season " + season;

gamesTable.innerHTML="";
standingsTable.innerHTML="";

let standings={};

try{

const indexRes=await fetch(folder(season)+"/index.json");
if(!indexRes.ok) throw new Error("No index");

const index=await indexRes.json();

for(const id of index.games){

const res=await fetch(folder(season)+"/"+id+".json");
if(!res.ok) continue;

const g=await res.json();

/* Handle multiple historical formats */

const home=pick(g,"home_team","HOME_TEAM_NAME","TEAM_NAME_HOME");
const away=pick(g,"away_team","VISITOR_TEAM_NAME","TEAM_NAME_AWAY");

const homeScore=parseInt(pick(g,"home_score","PTS_HOME","HOME_PTS"))||0;
const awayScore=parseInt(pick(g,"away_score","PTS_AWAY","VISITOR_PTS"))||0;

const rawDate=pick(g,"date","GAME_DATE_EST","game_date");
const date=rawDate ? rawDate.split(" ")[0] : "";

const winner=homeScore>awayScore?home:away;

/* Build standings */

if(!standings[home]) standings[home]={w:0,l:0};
if(!standings[away]) standings[away]={w:0,l:0};

if(homeScore>awayScore){
standings[home].w++;
standings[away].l++;
}else{
standings[away].w++;
standings[home].l++;
}

/* Build row */

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${date}</td>
<td>
<a href="nba-team.html?team=${encodeURIComponent(home)}">${home}</a>
vs
<a href="nba-team.html?team=${encodeURIComponent(away)}">${away}</a>
</td>
<td>${winner}</td>
<td>${homeScore} – ${awayScore}</td>
`;

tr.onclick=()=>{
location.href=
"nba-game.html?season="+season+
"&game="+id;
};

gamesTable.appendChild(tr);

}

/* Render standings */

Object.entries(standings)
.sort((a,b)=>b[1].w-a[1].w)
.forEach(([team,rec])=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${team}</td>
<td>${rec.w}</td>
<td>${rec.l}</td>
`;

standingsTable.appendChild(tr);

});

}catch(e){

gamesTable.innerHTML=
"<tr><td colspan='4'>No season files found</td></tr>";

}

}

</script>

</body>
</html>
