<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1250px;margin:auto;padding:30px 20px 60px;}
h1{text-align:center;margin-bottom:20px;}

.filters{text-align:center;margin-bottom:20px;}
select{padding:8px 12px;font-size:15px;margin:0 6px;}

table{width:100%;border-collapse:collapse;margin-top:15px;background:#fff;border-radius:12px;overflow:hidden;}
th,td{border-bottom:1px solid #eee;padding:10px;text-align:center;}
th{background:#f0f0f0;font-weight:700;}
tr:nth-child(even){background:#f9fbff;}
tr:hover{background:#eef4ff;cursor:pointer;}

.section-title{
margin-top:40px;
font-size:22px;
font-weight:700;
padding:10px;
border-radius:8px;
color:#fff;
}

.east-header{background:linear-gradient(90deg,#003366,#0056d6);}
.west-header{background:linear-gradient(90deg,#8b0000,#d00000);}

.team-link{
text-decoration:none;
font-weight:700;
color:#111;
display:flex;
align-items:center;
gap:8px;
}

.team-stripe{
width:6px;
height:18px;
border-radius:3px;
display:inline-block;
}

.win-good{color:#008000;font-weight:700;}
.win-mid{color:#333;font-weight:700;}
.win-bad{color:#c00000;font-weight:700;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Season</h1>

<div class="filters">
Season:
<select id="seasonSelect"></select>

Game Type:
<select id="typeSelect">
<option value="All">All</option>
<option value="Regular Season">Regular Season</option>
<option value="Playoffs">Playoffs</option>
</select>

Team:
<select id="teamSelect">
<option value="All">All Teams</option>
</select>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Type</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

<div class="section-title east-header">Eastern Conference</div>
<table>
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>Win %</th>
</tr>
</thead>
<tbody id="eastTable"></tbody>
</table>

<div class="section-title west-header">Western Conference</div>
<table>
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>Win %</th>
</tr>
</thead>
<tbody id="westTable"></tbody>
</table>

</div>

<script>

const BASE="data/nba/";
const seasonSelect=document.getElementById("seasonSelect");
const typeSelect=document.getElementById("typeSelect");
const teamSelect=document.getElementById("teamSelect");
const gamesTable=document.getElementById("gamesTable");
const eastTable=document.getElementById("eastTable");
const westTable=document.getElementById("westTable");
const title=document.getElementById("title");

const params=new URLSearchParams(location.search);
let season=params.get("season") || "2025";
let allGames=[];

/* TEAM COLOURS */
const teamColours={
"Boston Celtics":"#007A33",
"Los Angeles Lakers":"#552583",
"Chicago Bulls":"#CE1141",
"Golden State Warriors":"#1D428A",
"Miami Heat":"#98002E",
"New York Knicks":"#F58426",
"Dallas Mavericks":"#00538C",
"Phoenix Suns":"#E56020",
"Denver Nuggets":"#0E2240",
"Milwaukee Bucks":"#00471B",
"Philadelphia 76ers":"#006BB6",
"Brooklyn Nets":"#000000",
"Toronto Raptors":"#CE1141",
"Atlanta Hawks":"#E03A3E",
"Charlotte Hornets":"#1D1160",
"Detroit Pistons":"#C8102E",
"Indiana Pacers":"#002D62",
"Cleveland Cavaliers":"#860038",
"Orlando Magic":"#0077C0",
"Washington Wizards":"#002B5C",
"Minnesota Timberwolves":"#0C2340",
"Oklahoma City Thunder":"#007AC1",
"Portland Trail Blazers":"#E03A3E",
"Utah Jazz":"#002B5C",
"LA Clippers":"#C8102E",
"Sacramento Kings":"#5A2D81",
"Houston Rockets":"#CE1141",
"Memphis Grizzlies":"#5D76A9",
"New Orleans Pelicans":"#0C2340",
"San Antonio Spurs":"#C4CED4"
};

const conferenceMap={ /* same as before */
"Boston Celtics":"East","Brooklyn Nets":"East","New York Knicks":"East","Philadelphia 76ers":"East","Toronto Raptors":"East",
"Chicago Bulls":"East","Cleveland Cavaliers":"East","Detroit Pistons":"East","Indiana Pacers":"East","Milwaukee Bucks":"East",
"Atlanta Hawks":"East","Charlotte Hornets":"East","Miami Heat":"East","Orlando Magic":"East","Washington Wizards":"East",
"Denver Nuggets":"West","Minnesota Timberwolves":"West","Oklahoma City Thunder":"West","Portland Trail Blazers":"West",
"Utah Jazz":"West","Golden State Warriors":"West","LA Clippers":"West","Los Angeles Lakers":"West","Phoenix Suns":"West",
"Sacramento Kings":"West","Dallas Mavericks":"West","Houston Rockets":"West","Memphis Grizzlies":"West",
"New Orleans Pelicans":"West","San Antonio Spurs":"West"
};

function isExcludedGame(g){
if(!g || !g.game_type) return false;
const t=g.game_type.toLowerCase();
return t.includes("preseason") || t.includes("all");
}

seasonSelect.onchange=()=>location.href="nba-season.html?season="+seasonSelect.value;
typeSelect.onchange=renderGames;
teamSelect.onchange=renderGames;

async function init(){
for(let y=1976;y<=2026;y++){
let opt=document.createElement("option");
opt.value=y; opt.textContent=y;
seasonSelect.appendChild(opt);
}
seasonSelect.value=season;
await loadSeason(season);
}

async function loadSeason(season){

title.textContent="NBA Season " + season;
eastTable.innerHTML="";
westTable.innerHTML="";
gamesTable.innerHTML="";
teamSelect.innerHTML='<option value="All">All Teams</option>';

let standings={}, teams=new Set();

const index=await fetch(BASE+season+"/index.json").then(r=>r.json());
const gameFiles=index.games.map(id=>fetch(BASE+season+"/"+id+".json").then(r=>r.json()));
allGames=(await Promise.all(gameFiles)).filter(g=>!isExcludedGame(g));

allGames.forEach(g=>{
teams.add(g.home_team); teams.add(g.away_team);

if(g.game_type==="Regular Season"){
if(!standings[g.home_team]) standings[g.home_team]={w:0,l:0};
if(!standings[g.away_team]) standings[g.away_team]={w:0,l:0};

if(g.home_score>g.away_score){
standings[g.home_team].w++; standings[g.away_team].l++;
}else{
standings[g.away_team].w++; standings[g.home_team].l++;
}
}
});

Array.from(teams).sort().forEach(t=>{
let opt=document.createElement("option");
opt.value=t; opt.textContent=t;
teamSelect.appendChild(opt);
});

renderStandings(standings);
renderGames();
}

function renderStandings(standings){

Object.entries(standings)
.sort((a,b)=>b[1].w-a[1].w)
.forEach(([team,rec])=>{

let total=rec.w+rec.l;
let pct=total?(rec.w/total):0;
let pctText=total?(rec.w/total).toFixed(3):"0.000";

let winClass=pct>=0.6?"win-good":pct<=0.4?"win-bad":"win-mid";

let tr=document.createElement("tr");
tr.innerHTML=`
<td>
<a class="team-link" href="nba-team.html?team=${encodeURIComponent(team)}">
<span class="team-stripe" style="background:${teamColours[team]||'#999'}"></span>
${team}
</a>
</td>
<td>${rec.w}</td>
<td>${rec.l}</td>
<td class="${winClass}">${pctText}</td>
`;

if(conferenceMap[team]==="East") eastTable.appendChild(tr);
else westTable.appendChild(tr);

});
}

function renderGames(){
gamesTable.innerHTML="";
const typeFilter=typeSelect.value;
const teamFilter=teamSelect.value;

allGames.forEach(g=>{
if(typeFilter!=="All" && g.game_type!==typeFilter) return;
if(teamFilter!=="All" && g.home_team!==teamFilter && g.away_team!==teamFilter) return;

let winner=g.home_score>g.away_score?g.home_team:g.away_team;

let tr=document.createElement("tr");
tr.innerHTML=`
<td>${g.date}</td>
<td>${g.home_team} vs ${g.away_team}</td>
<td>${g.game_type}</td>
<td>${winner}</td>
<td>${g.home_score} – ${g.away_score}</td>
`;

tr.onclick=()=>location.href="nba-game.html?season="+season+"&game="+g.game_id;
gamesTable.appendChild(tr);
});
}

init();
</script>

</body>
</html>
