<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}
.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:10px;}

.filters{
  display:flex;
  justify-content:center;
  gap:16px;
  margin:20px 0 30px;
}
select{
  padding:8px 12px;
  font-size:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:center;
}
th{
  background:#f0f0f0;
  cursor:pointer;
  position:sticky;
  top:0;
}
tr:nth-child(even){background:#f6f9ff;}
tr:hover{background:#e9f0ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title"></h1>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Game</th>
  <th>Winner</th>
  <th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const seasonParam = params.get("season"); // eg 1976_77
const file = "data/nba/nba_season_" + seasonParam + ".json";

const gamesTable = document.getElementById("gamesTable");

let gamesData = [];

fetch(file)
.then(r => r.json())
.then(data => {
  document.getElementById("title").textContent =
    "NBA Season " + data.season;

  gamesData = data.games || [];
  render();
});

function render(){
  gamesTable.innerHTML = "";

  gamesData.forEach((g, index) => {
    const winner =
      g.home_points > g.away_points ? g.home_team : g.away_team;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${g.home_team} vs ${g.away_team}</td>
      <td>${winner}</td>
      <td>${g.home_points} – ${g.away_points}</td>
    `;

    tr.onclick = () => {
      window.location.href =
        "nba-game.html?season=" +
        encodeURIComponent(seasonParam) +
        "&game=" + index;
    };

    gamesTable.appendChild(tr);
  });
}
</script>

</body>
</html>
