<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Single Game Records | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;flex-wrap:wrap;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover{opacity:1;color:var(--accent);}
.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));color:#fff;
  padding:36px 20px;text-align:center;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,4.5vw,36px);
  letter-spacing:.01em;text-transform:uppercase;
}
.hero p{margin-top:8px;font-size:13.5px;color:rgba(255,255,255,.68);}
.controls{
  background:var(--surface);padding:14px 20px;display:flex;justify-content:center;align-items:center;
  gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;
}
.controls label{font-weight:600;font-size:13px;color:var(--muted);}
.controls select{
  font-size:13.5px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);
  font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink);font-family:var(--body);
}
.controls select:hover{border-color:var(--faint);}
.controls select:focus{outline:none;border-color:var(--accent);}
.container{max-width:1300px;margin:0 auto;padding:26px 20px 70px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px;}
.section{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;
}
.section-title{
  font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:14px;color:var(--ink);
  text-transform:uppercase;letter-spacing:.01em;border-left:4px solid var(--accent);padding-left:12px;
}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
th{
  background:#f7f9fb;color:var(--muted);padding:9px 12px;font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;text-align:left;font-family:var(--body);
  border-bottom:1px solid var(--line);
}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:500;vertical-align:middle;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;cursor:pointer;}
.rank{color:var(--faint);font-weight:700;text-align:center;width:24px;font-size:12.5px;}
.stat-val{font-weight:700;text-align:right;font-size:16px;color:var(--ink);white-space:nowrap;padding-left:16px;}
.plink{color:var(--ink);font-weight:700;text-decoration:none;font-size:13.5px;}
.plink:hover{color:var(--accent);}
.meta{color:var(--muted);font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge{
  display:inline-block;padding:1px 8px;border-radius:999px;font-size:9.5px;font-weight:700;
  text-transform:uppercase;background:var(--board);color:#fff;vertical-align:middle;margin-left:4px;
}
.badge.po{background:var(--accent);color:var(--ink);}
.loading{text-align:center;padding:80px;font-size:16px;font-weight:600;color:var(--muted);}
.error{text-align:center;padding:60px;font-size:14px;color:#c0362c;font-weight:600;}
@media(max-width:700px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
  <a href="nfl-teams.html">Teams</a>
  <a href="nfl-leaders.html">Leaders</a>
  <a href="nfl-records.html">Records</a>
</div>
<div class="hero">
  <h1>Single Game Records</h1>
  <p>The greatest individual performances in NFL history</p>
</div>
<div class="controls">
  <label>Filter:</label>
  <select id="gameTypeSel" onchange="render()">
    <option value="all">All Games</option>
    <option value="regular">Regular Season Only</option>
    <option value="playoff">Playoffs Only</option>
  </select>
</div>
<div class="container">
  <div id="out"><div class="loading">Loading...</div></div>
</div>
<script>
var DATA = {};

fetch('/data/nfl/game-records.json')
  .then(function(r){ return r.json(); })
  .then(function(d){
    DATA = d.records || {};
    render();
  })
  .catch(function(e){
    document.getElementById('out').innerHTML = '<div class="error">Failed to load game-records.json<br>' + e + '</div>';
  });

function filter(list) {
  var gt = document.getElementById('gameTypeSel').value;
  var out = [];
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    if (gt === 'regular' && r.playoff) continue;
    if (gt === 'playoff' && !r.playoff) continue;
    out.push(r);
    if (out.length >= 10) break;
  }
  return out;
}

function badge(r) {
  if (r.playoff) return '<span class="badge po">' + (r.week || 'PO') + '</span>';
  return '<span class="badge">Wk ' + r.week + '</span>';
}

function section(title, key, statFn, colLabel) {
  var list = DATA[key];
  if (!list || !list.length) return '';
  var rows = filter(list);
  if (!rows.length) return '';
  var html = '<div class="section"><div class="section-title">' + title + '</div><table>';
  html += '<colgroup><col style="width:32px"><col><col style="width:64px"></colgroup><thead><tr><th>#</th><th>Player</th><th style="text-align:right">' + colLabel + '</th></tr></thead><tbody>';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    html += '<tr onclick="location.href=\'/nfl-player.html?player=' + encodeURIComponent(r.player_id) + '\'">';
    html += '<td class="rank">' + (i+1) + '</td>';
    html += '<td><a class="plink" href="/nfl-player.html?player=' + encodeURIComponent(r.player_id) + '">' + r.name + '</a>';
    html += '<div class="meta">' + r.team + ' vs ' + r.opponent + ' &middot; ' + r.season + ' ' + badge(r) + '</div></td>';
    html += '<td class="stat-val">' + statFn(r) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function render() {
  if (!Object.keys(DATA).length) return;
  var html = '<div class="grid">'
    + section('Most Passing Yards',        'pass_yds',  function(r){return r.pass_yds.toLocaleString();}, 'Yards')
    + section('Most Passing Touchdowns',   'pass_td',   function(r){return r.pass_td;},                   'TD')
    + section('Most Passing Attempts',     'pass_att',  function(r){return r.pass_att;},                  'Att')
    + section('Most Interceptions Thrown', 'pass_int',  function(r){return r.pass_int;},                  'INT')
    + section('Most Rushing Yards',        'rush_yds',  function(r){return r.rush_yds.toLocaleString();}, 'Yards')
    + section('Most Rushing Touchdowns',   'rush_td',   function(r){return r.rush_td;},                   'TD')
    + section('Most Rushing Attempts',     'rush_att',  function(r){return r.rush_att;},                  'Att')
    + section('Most Receiving Yards',      'rec_yds',   function(r){return r.rec_yds.toLocaleString();},  'Yards')
    + section('Most Receiving Touchdowns', 'rec_td',    function(r){return r.rec_td;},                    'TD')
    + section('Most Receptions',           'rec',       function(r){return r.rec;},                       'Rec')
    + section('Most Total Yards',          'total_yds', function(r){return r.total_yds.toLocaleString();},'Yards')
    + section('Most Total Touchdowns',     'total_td',  function(r){return r.total_td;},                  'TD')
    + '</div>';
  document.getElementById('out').innerHTML = html || '<div class="error">No records match this filter.</div>';
}
</script>
</body>
</html>
