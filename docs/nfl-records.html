<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Single Game Records | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#edf1f5;color:#111827;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:white;border-bottom:1px solid #ddd;flex-wrap:wrap;}
.navbar a{text-decoration:none;font-weight:800;color:#013369;}
.navbar a:hover{color:#d50a0a;}
.hero{background:linear-gradient(135deg,#013369,#d50a0a);color:white;padding:40px 20px;text-align:center;}
.hero h1{margin:0;font-size:42px;font-weight:900;}
.hero p{margin-top:8px;font-size:16px;opacity:.85;}
.controls{background:white;padding:16px 20px;display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.controls label{font-weight:800;font-size:14px;color:#013369;}
.controls select{font-size:15px;padding:10px 16px;border-radius:12px;border:1px solid #ddd;font-weight:700;cursor:pointer;background:white;}
.container{max-width:1300px;margin:30px auto;padding:0 20px 60px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:24px;}
.section{background:white;border-radius:20px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.section-title{font-size:18px;font-weight:900;margin-bottom:16px;color:#0f172a;text-transform:uppercase;letter-spacing:.5px;border-left:5px solid #013369;padding-left:12px;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
th{background:#013369;color:white;padding:8px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;text-align:left;}
td{padding:10px 12px;border-bottom:1px solid #edf2f7;font-size:13px;font-weight:600;vertical-align:middle;}
tr:nth-child(even) td{background:#f4f8fd;}
tbody tr:hover td{background:#e7f0ff;cursor:pointer;}
.rank{color:#aaa;font-weight:900;text-align:center;width:24px;font-size:13px;}
.stat-val{font-weight:900;text-align:right;font-size:18px;color:#0f172a;white-space:nowrap;padding-left:16px;}
.plink{color:#013369;font-weight:800;text-decoration:none;font-size:14px;}
.plink:hover{text-decoration:underline;}
.meta{color:#888;font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:900;text-transform:uppercase;background:#013369;color:white;vertical-align:middle;margin-left:2px;}
.badge.po{background:#d50a0a;}
.loading{text-align:center;padding:80px;font-size:20px;font-weight:700;color:#555;}
.error{text-align:center;padding:60px;font-size:16px;color:#d90429;font-weight:700;}
@media(max-width:700px){.grid{grid-template-columns:1fr;}.hero h1{font-size:28px;}}
</style>
</head>
<body>
<div class="navbar">
  <a href="/">Home</a>
  <a href="/nfl.html">NFL</a>
  <a href="/nfl-teams.html">Teams</a>
  <a href="/nfl-leaders.html">Leaders</a>
  <a href="/nfl-records.html">Records</a>
</div>
<div class="hero">
  <h1>Single Game Records</h1>
  <p>The greatest individual performances in NFL history</p>
</div>
<div class="controls">
  <label>Filter:</label>
  <select id="gameTypeSel" onchange="render()">
    <option value="all">All Games</option>
    <option value="regular">Regular Season Only</option>
    <option value="playoff">Playoffs Only</option>
  </select>
</div>
<div class="container">
  <div id="out"><div class="loading">Loading...</div></div>
</div>
<script>
var DATA = {};

fetch('/data/nfl/game-records.json')
  .then(function(r){ return r.json(); })
  .then(function(d){
    DATA = d.records || {};
    render();
  })
  .catch(function(e){
    document.getElementById('out').innerHTML = '<div class="error">Failed to load game-records.json<br>' + e + '</div>';
  });

function filter(list) {
  var gt = document.getElementById('gameTypeSel').value;
  var out = [];
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    if (gt === 'regular' && r.playoff) continue;
    if (gt === 'playoff' && !r.playoff) continue;
    out.push(r);
    if (out.length >= 10) break;
  }
  return out;
}

function badge(r) {
  if (r.playoff) return '<span class="badge po">' + (r.week || 'PO') + '</span>';
  return '<span class="badge">Wk ' + r.week + '</span>';
}

function section(title, key, statFn, colLabel) {
  var list = DATA[key];
  if (!list || !list.length) return '';
  var rows = filter(list);
  if (!rows.length) return '';
  var html = '<div class="section"><div class="section-title">' + title + '</div><table>';
  html += '<colgroup><col style="width:32px"><col><col style="width:64px"></colgroup><thead><tr><th>#</th><th>Player</th><th style="text-align:right">' + colLabel + '</th></tr></thead><tbody>';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    html += '<tr onclick="location.href=\'/nfl-player.html?player=' + encodeURIComponent(r.player_id) + '\'">';
    html += '<td class="rank">' + (i+1) + '</td>';
    html += '<td><a class="plink" href="/nfl-player.html?player=' + encodeURIComponent(r.player_id) + '">' + r.name + '</a>';
    html += '<div class="meta">' + r.team + ' vs ' + r.opponent + ' &middot; ' + r.season + ' ' + badge(r) + '</div></td>';
    html += '<td class="stat-val">' + statFn(r) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function render() {
  if (!Object.keys(DATA).length) return;
  var html = '<div class="grid">'
    + section('Most Passing Yards',        'pass_yds',  function(r){return r.pass_yds.toLocaleString();}, 'Yards')
    + section('Most Passing Touchdowns',   'pass_td',   function(r){return r.pass_td;},                   'TD')
    + section('Most Passing Attempts',     'pass_att',  function(r){return r.pass_att;},                  'Att')
    + section('Most Interceptions Thrown', 'pass_int',  function(r){return r.pass_int;},                  'INT')
    + section('Most Rushing Yards',        'rush_yds',  function(r){return r.rush_yds.toLocaleString();}, 'Yards')
    + section('Most Rushing Touchdowns',   'rush_td',   function(r){return r.rush_td;},                   'TD')
    + section('Most Rushing Attempts',     'rush_att',  function(r){return r.rush_att;},                  'Att')
    + section('Most Receiving Yards',      'rec_yds',   function(r){return r.rec_yds.toLocaleString();},  'Yards')
    + section('Most Receiving Touchdowns', 'rec_td',    function(r){return r.rec_td;},                    'TD')
    + section('Most Receptions',           'rec',       function(r){return r.rec;},                       'Rec')
    + section('Most Total Yards',          'total_yds', function(r){return r.total_yds.toLocaleString();},'Yards')
    + section('Most Total Touchdowns',     'total_td',  function(r){return r.total_td;},                  'TD')
    + '</div>';
  document.getElementById('out').innerHTML = html || '<div class="error">No records match this filter.</div>';
}
</script>
</body>
</html>
