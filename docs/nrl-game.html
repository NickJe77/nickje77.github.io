<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e5e7eb;
  --stripe:#f0f6ff;
}

body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#111;}

.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{text-decoration:none;color:#0056d6;}

.page{max-width:1400px;margin:auto;padding:30px 20px 60px;}

.game-header{text-align:center;margin-bottom:30px;}
.game-header h1{margin:0 0 8px;font-size:36px;}
.game-header .meta{color:#666;font-size:14px;margin-bottom:8px;}
.scoreline{font-size:38px;font-weight:800;margin-top:10px;}

.teams{display:grid;grid-template-columns:1fr 1fr;gap:24px;}

.team-card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.06);}
.team-card h2{margin:0 0 8px;font-size:22px;}

.team-bar{height:8px;border-radius:4px;margin-bottom:16px;}

.table-wrap{overflow-x:auto;}

table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px;}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:#f3f5f7;font-weight:700;cursor:pointer;user-select:none;text-align:center;}
th:first-child{text-align:left;}
td{text-align:center;}
td:first-child{text-align:left;}
th:hover{background:#e8ecf2;}
tbody tr:nth-child(even){background:var(--stripe);}
tbody tr:hover{background:#daeaff;}

.player-link{text-decoration:none;color:#0056d6;font-weight:600;}
.player-link:hover{text-decoration:underline;}

.stat-group{display:inline-block;padding:0 4px;border-right:1px solid #ddd;}
.stat-group:last-child{border-right:none;}

.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tab{padding:6px 14px;border-radius:20px;background:#eee;cursor:pointer;font-size:13px;font-weight:600;}
.tab.active{background:#0056d6;color:#fff;}

@media(max-width:768px){
  .teams{grid-template-columns:1fr;}
  .scoreline{font-size:26px;}
}
</style>
</head>

<body>
<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">
  <div class="game-header">
    <h1 id="gameTitle">Loading...</h1>
    <div class="meta" id="gameMeta"></div>
    <div class="scoreline" id="scoreline"></div>
  </div>

  <div class="teams">
    <div class="team-card">
      <h2 id="homeName"></h2>
      <div class="team-bar" id="homeBar"></div>
      <div class="tabs" id="homeTabs"></div>
      <div class="table-wrap">
        <table id="homeTable"><thead></thead><tbody></tbody></table>
      </div>
    </div>
    <div class="team-card">
      <h2 id="awayName"></h2>
      <div class="team-bar" id="awayBar"></div>
      <div class="tabs" id="awayTabs"></div>
      <div class="table-wrap">
        <table id="awayTable"><thead></thead><tbody></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
const teamColours = {
  "Brisbane Broncos":"#6F2C91",
  "Melbourne Storm":"#5A2D81",
  "Canberra Raiders":"#0054A6",
  "Penrith Panthers":"#000000",
  "South Sydney Rabbitohs":"#00643C",
  "Sydney Roosters":"#002B5C",
  "Manly-Warringah Sea Eagles":"#800000",
  "Parramatta Eels":"#003DA5",
  "Canterbury-Bankstown Bulldogs":"#0033A0",
  "Cronulla-Sutherland Sharks":"#00A3E0",
  "New Zealand Warriors":"#111111",
  "Gold Coast Titans":"#FFDD00",
  "North Queensland Cowboys":"#00205B",
  "Newcastle Knights":"#003E7E",
  "Wests Tigers":"#F04E23",
  "St. George Illawarra Dragons":"#E2231A"
};

const STAT_GROUPS = {
  "Scoring": [
    {key:"tries",        label:"Tries"},
    {key:"penalty_tries",label:"Pen Tries"},
    {key:"conversions",  label:"Conv"},
    {key:"penalty_goals",label:"PGs"},
    {key:"field_goals",  label:"FGs"},
    {key:"points",       label:"Points"},
  ],
  "Attack": [
    {key:"runs",              label:"Runs"},
    {key:"metres_gained",     label:"Metres"},
    {key:"post_contact_metres",label:"PCM"},
    {key:"line_breaks",       label:"LBs"},
    {key:"line_break_assists",label:"LB Ass"},
    {key:"tackle_breaks",     label:"TB"},
    {key:"offloads",          label:"Offloads"},
    {key:"try_assists",       label:"Try Ass"},
    {key:"passes",            label:"Passes"},
  ],
  "Running": [
    {key:"hitups",           label:"Hitups"},
    {key:"hitup_metres",     label:"HU Metres"},
    {key:"dummy_half_runs",  label:"DH Runs"},
    {key:"dummy_half_metres",label:"DH Metres"},
    {key:"kick_return_runs", label:"KR Runs"},
    {key:"kick_return_metres",label:"KR Metres"},
    {key:"normal_runs",      label:"Norm Runs"},
    {key:"normal_run_metres",label:"Norm Metres"},
  ],
  "Kicking": [
    {key:"kicks_general_play",label:"Kicks"},
    {key:"kick_metres",       label:"Kick M"},
    {key:"forty_twenties",    label:"40/20"},
    {key:"goal_line_dropouts",label:"GLDs"},
  ],
  "Defence": [
    {key:"tackles",           label:"Tackles"},
    {key:"missed_tackles",    label:"Miss Tkl"},
    {key:"ineffective_tackles",label:"Ineff Tkl"},
    {key:"try_saves",         label:"Try Saves"},
    {key:"intercepts",        label:"Intercepts"},
    {key:"kicks_caught",      label:"Kicks Ct"},
  ],
  "Discipline": [
    {key:"errors",            label:"Errors"},
    {key:"handling_errors",   label:"Hand Err"},
    {key:"penalties_conceded",label:"Penalties"},
    {key:"sin_bins_10min",    label:"10 Min SB"},
    {key:"send_offs",         label:"Send Offs"},
    {key:"on_reports",        label:"On Reports"},
  ],
};

let homePlayers = [];
let awayPlayers = [];
let activeGroup = {home:"Scoring", away:"Scoring"};
let sortState   = {};

const params  = new URLSearchParams(window.location.search);
const season  = params.get("season");
const matchId = params.get("match");

async function loadGame(){
  try{
    const res = await fetch(`data/nrl/seasons/${season}.json`);
    const matches = await res.json();
    const game = matches.find(m => String(m.match_id) === String(matchId));
    if(!game){ document.getElementById("gameTitle").innerText="Game Not Found"; return; }
    renderGame(game);
  } catch(err){
    console.error(err);
    document.getElementById("gameTitle").innerText="Error loading game";
  }
}

function renderGame(game){
  const homeTeam = game.home_team;
  const awayTeam = game.away_team;

  document.getElementById("gameTitle").innerText =
    `${game.season||season} – ${homeTeam} vs ${awayTeam}`;
  document.getElementById("gameMeta").innerText =
    [game.date, game.venue, game.crowd?"Crowd: "+Number(game.crowd).toLocaleString():""].filter(Boolean).join(" • ");
  document.getElementById("scoreline").innerText =
    `${homeTeam} ${game.home_points} – ${game.away_points} ${awayTeam}`;
  document.getElementById("homeName").innerText = homeTeam;
  document.getElementById("awayName").innerText = awayTeam;
  document.getElementById("homeBar").style.background = teamColours[homeTeam]||"#333";
  document.getElementById("awayBar").style.background = teamColours[awayTeam]||"#333";

  const players = game.players || [];
  homePlayers = players.filter(p=>p.played_for===homeTeam);
  awayPlayers = players.filter(p=>p.played_for===awayTeam);

  buildTabs("home");
  buildTabs("away");
  renderTable("home");
  renderTable("away");
}

function buildTabs(side){
  const div = document.getElementById(side+"Tabs");
  div.innerHTML = "";
  Object.keys(STAT_GROUPS).forEach(group=>{
    const tab = document.createElement("div");
    tab.className = "tab" + (group===activeGroup[side]?" active":"");
    tab.textContent = group;
    tab.onclick = ()=>{
      activeGroup[side] = group;
      buildTabs(side);
      renderTable(side);
    };
    div.appendChild(tab);
  });
}

function renderTable(side){
  const players = side==="home" ? homePlayers : awayPlayers;
  const group   = activeGroup[side];
  const cols    = STAT_GROUPS[group];
  const table   = document.getElementById(side+"Table");

  // Header
  table.querySelector("thead").innerHTML = `<tr>
    <th onclick="sortBy('${side}','player')">Player</th>
    ${cols.map(c=>`<th onclick="sortBy('${side}','${c.key}')">${c.label}</th>`).join("")}
  </tr>`;

  // Body
  table.querySelector("tbody").innerHTML = players.map(p=>`
    <tr>
      <td><a class="player-link" href="nrl-player.html?player=${encodeURIComponent(p.player)}">${p.player}</a></td>
      ${cols.map(c=>`<td>${p[c.key]??0}</td>`).join("")}
    </tr>
  `).join("");
}

function sortBy(side, key){
  const players = side==="home" ? homePlayers : awayPlayers;
  if(!sortState[side]) sortState[side]={};
  sortState[side][key] = !sortState[side][key];
  players.sort((a,b)=>{
    const av = key==="player" ? (a.player||"") : (Number(a[key])||0);
    const bv = key==="player" ? (b.player||"") : (Number(b[key])||0);
    if(av<bv) return sortState[side][key]?-1:1;
    if(av>bv) return sortState[side][key]?1:-1;
    return 0;
  });
  renderTable(side);
}

loadGame();
</script>
</body>
</html>
