<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e5e7eb;
  --stripe:#f0f6ff;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1300px;
  margin:auto;
  padding:30px 20px 60px;
}

.game-header{
  text-align:center;
  margin-bottom:40px;
}

.game-header h1{
  margin:0 0 10px 0;
  font-size:40px;
}

.game-header .meta{
  color:#666;
  margin-bottom:10px;
}

.scoreline{
  font-size:34px;
  font-weight:700;
  margin-top:10px;
}

.teams{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

.team-card{
  background:var(--card);
  border-radius:18px;
  padding:24px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.team-card h2{
  margin:0 0 10px 0;
  font-size:26px;
}

.team-bar{
  height:10px;
  border-radius:6px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

th{
  text-align:left;
  font-weight:700;
}

.numeric{
  text-align:center;
}

.sortable{
  cursor:pointer;
  user-select:none;
}

.sortable:hover{
  text-decoration:underline;
}

tbody tr:nth-child(even){
  background:var(--stripe);
}

tbody tr:hover{
  background:#e3efff;
}

.player-link{
  text-decoration:none;
  color:#0056d6;
  font-weight:600;
}

.player-link:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">

  <div class="game-header">
    <h1 id="gameTitle">Loading...</h1>
    <div class="meta" id="gameMeta"></div>
    <div class="scoreline" id="scoreline"></div>
  </div>

  <div class="teams">
    <div class="team-card">
      <h2 id="homeName"></h2>
      <div class="team-bar" id="homeBar"></div>
      <table id="homeTable">
        <thead>
          <tr>
            <th>Player</th>
            <th class="numeric sortable" data-team="home" data-sort="tries">Tries</th>
            <th class="numeric sortable" data-team="home" data-sort="goals">Goals</th>
            <th class="numeric sortable" data-team="home" data-sort="points">Points</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="team-card">
      <h2 id="awayName"></h2>
      <div class="team-bar" id="awayBar"></div>
      <table id="awayTable">
        <thead>
          <tr>
            <th>Player</th>
            <th class="numeric sortable" data-team="away" data-sort="tries">Tries</th>
            <th class="numeric sortable" data-team="away" data-sort="goals">Goals</th>
            <th class="numeric sortable" data-team="away" data-sort="points">Points</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<script>

const teamColours = {
  "Brisbane Broncos":"#6F2C91",
  "Melbourne Storm":"#5A2D81",
  "Canberra Raiders":"#0054A6",
  "Penrith Panthers":"#000000",
  "South Sydney Rabbitohs":"#00643C",
  "Sydney Roosters":"#002B5C",
  "Manly-Warringah Sea Eagles":"#800000",
  "Parramatta Eels":"#003DA5",
  "Canterbury-Bankstown Bulldogs":"#0033A0",
  "Cronulla-Sutherland Sharks":"#00A3E0",
  "New Zealand Warriors":"#111111",
  "Gold Coast Titans":"#FFDD00",
  "North Queensland Cowboys":"#00205B",
  "Newcastle Knights":"#003E7E",
  "Wests Tigers":"#F04E23",
  "St. George Illawarra Dragons":"#E2231A"
};

let homePlayers = [];
let awayPlayers = [];
let sortState = {};

const params  = new URLSearchParams(window.location.search);
const season  = params.get("season");
const matchId = params.get("match");

async function loadGame(){
  try{
    const res = await fetch(`data/nrl/seasons/${season}.json`);
    const matches = await res.json();

    const game = matches.find(m => String(m.match_id) === String(matchId));

    if(!game){
      document.getElementById("gameTitle").innerText = "Game Not Found";
      return;
    }

    renderGame(game);

  } catch(err){
    console.error(err);
    document.getElementById("gameTitle").innerText = "Error loading game";
  }
}

function renderGame(game){
  const homeTeam = game.home_team;
  const awayTeam = game.away_team;

  document.getElementById("gameTitle").innerText =
    `${game.season || season} – ${homeTeam} vs ${awayTeam}`;

  document.getElementById("gameMeta").innerText =
    [game.date, game.venue, game.crowd ? "Crowd: "+Number(game.crowd).toLocaleString() : ""]
    .filter(Boolean).join(" • ");

  document.getElementById("scoreline").innerText =
    `${homeTeam} ${game.home_points} – ${game.away_points} ${awayTeam}`;

  document.getElementById("homeName").innerText = homeTeam;
  document.getElementById("awayName").innerText = awayTeam;

  document.getElementById("homeBar").style.background =
    teamColours[homeTeam] || "#333";
  document.getElementById("awayBar").style.background =
    teamColours[awayTeam] || "#333";

  // Players are nested inside the match
  const players = game.players || [];
  homePlayers = players
    .filter(p => p.played_for === homeTeam)
    .map(p => ({
      player:  p.player,
      tries:   p.tries || 0,
      goals:   (p.conversions || 0) + (p.penalty_goals || 0),
      points:  p.points || 0
    }));
  awayPlayers = players
    .filter(p => p.played_for === awayTeam)
    .map(p => ({
      player:  p.player,
      tries:   p.tries || 0,
      goals:   (p.conversions || 0) + (p.penalty_goals || 0),
      points:  p.points || 0
    }));

  renderTable("home");
  renderTable("away");
}

function renderTable(team){
  const players = team === "home" ? homePlayers : awayPlayers;
  const tbody = document.querySelector(`#${team}Table tbody`);
  tbody.innerHTML = players.map(p=>`
    <tr>
      <td><a class="player-link" href="nrl-player.html?player=${encodeURIComponent(p.player)}">${p.player}</a></td>
      <td class="numeric">${p.tries}</td>
      <td class="numeric">${p.goals}</td>
      <td class="numeric"><strong>${p.points}</strong></td>
    </tr>
  `).join("");
}

function sortTeam(team, key){
  const players = team === "home" ? homePlayers : awayPlayers;
  if(!sortState[team]) sortState[team] = {};
  sortState[team][key] = !sortState[team][key];
  players.sort((a,b) => sortState[team][key] ? b[key]-a[key] : a[key]-b[key]);
  renderTable(team);
}

document.querySelectorAll(".sortable").forEach(th=>{
  th.addEventListener("click", ()=> sortTeam(th.dataset.team, th.dataset.sort));
});

loadGame();
</script>

</body>
</html>
