<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Match Centre | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c1118;
  --board-2:#141c26;
  --board-line:rgba(255,255,255,.10);
  --win:#ffffff;
  --lose:rgba(255,255,255,.42);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

.page{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

/* ── Scorebug ─────────────────────────────────────────── */
.scorebug{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;
}
.scorebug .eyebrow{
  text-align:center;font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);
  padding:18px 16px 0;
}
.bug-grid{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:10px;padding:14px 30px 30px;
}
.bug-team{display:flex;align-items:center;gap:16px;min-width:0;}
.bug-team.home{justify-content:flex-end;text-align:right;}
.bug-team.away{justify-content:flex-start;text-align:left;}
.bug-team .tname{
  font-family:var(--display);font-weight:600;font-size:clamp(18px,3vw,30px);
  line-height:1.04;letter-spacing:.01em;text-transform:uppercase;
}
.bug-team .tsub{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;letter-spacing:.04em;}
.crest{width:8px;align-self:stretch;min-height:54px;border-radius:6px;flex:0 0 auto;}
.bug-score{
  display:flex;align-items:center;gap:14px;font-family:var(--display);font-weight:600;
  font-size:clamp(40px,9vw,72px);line-height:1;letter-spacing:.01em;
}
.bug-score .sc{font-variant-numeric:tabular-nums;}
.bug-score .sc.lose{color:var(--lose);font-weight:500;}
.bug-score .dash{color:rgba(255,255,255,.3);font-weight:400;}
.ft-badge{
  position:absolute;top:16px;right:18px;font-family:var(--body);font-size:10.5px;
  font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.85);
  border:1px solid var(--board-line);border-radius:999px;padding:4px 10px;
}

/* ── Controls ─────────────────────────────────────────── */
.segment{
  display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px;gap:2px;margin-bottom:8px;max-width:100%;
  overflow-x:auto;scrollbar-width:none;
}
.segment::-webkit-scrollbar{display:none;}
.seg-btn{
  border:none;background:transparent;font-family:var(--body);font-size:13px;font-weight:600;
  color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s;
}
.seg-btn:hover{color:var(--ink);}
.seg-btn.active{background:var(--ink);color:#fff;}
.era-note{
  font-size:12.5px;color:var(--muted);margin:10px 2px 0;display:flex;align-items:center;gap:8px;
}
.era-note .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:0 0 auto;}

/* ── Team tables ──────────────────────────────────────── */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px;}
.team-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
.team-head{
  display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line);
}
.team-head .swatch{width:14px;height:14px;border-radius:4px;flex:0 0 auto;}
.team-head h2{
  margin:0;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em;
  text-transform:uppercase;
}
.team-head .tally{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;}
thead th{
  position:sticky;top:0;background:#f7f9fb;font-family:var(--body);font-weight:600;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  text-align:right;cursor:pointer;user-select:none;
}
thead th:first-child{text-align:left;}
thead th:hover{color:var(--ink);}
thead th.sorted::after{content:" ↓";color:var(--faint);}
thead th.sorted.asc::after{content:" ↑";}
td{text-align:right;font-variant-numeric:tabular-nums;color:#27313c;}
td:first-child{text-align:left;}
th:first-child,td:first-child{
  position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600;
}
thead th:first-child{background:#f7f9fb;z-index:2;}
tbody tr:hover td{background:#f0f6ff;}
tbody tr:hover td:first-child{background:#f0f6ff;}
.player-link{text-decoration:none;color:var(--ink);}
.player-link:hover{color:#0056d6;text-decoration:underline;}
.jersey{display:inline-block;min-width:20px;color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px;margin-right:8px;}
td.lead{color:var(--ink);font-weight:700;}

.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;}

@media(max-width:820px){
  .teams{grid-template-columns:1fr;}
  .bug-grid{grid-template-columns:1fr;gap:18px;padding:10px 18px 26px;}
  .bug-team.home,.bug-team.away{justify-content:center;text-align:center;}
  .bug-team.home{flex-direction:row;}
  .crest{min-height:30px;}
}
</style>
</head>
<body>
<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">
  <div id="content">
    <div class="loading">Loading match…</div>
  </div>
</div>

<script>
/* Team colours (canonical names). Old name variants map across via TEAM_ALIASES. */
const teamColours = {
  "Brisbane Broncos":"#6F1A78","Melbourne Storm":"#5A2D81","Canberra Raiders":"#0054A6",
  "Penrith Panthers":"#111111","South Sydney Rabbitohs":"#00643C","Sydney Roosters":"#002B5C",
  "Manly-Warringah Sea Eagles":"#800000","Parramatta Eels":"#003DA5","Canterbury-Bankstown Bulldogs":"#0033A0",
  "Cronulla-Sutherland Sharks":"#00A3E0","New Zealand Warriors":"#1A1A1A","Gold Coast Titans":"#0085CA",
  "North Queensland Cowboys":"#002B5C","Newcastle Knights":"#003E7E","Wests Tigers":"#F04E23",
  "St George-Illawarra Dragons":"#E2231A","Dolphins":"#D6001C","Gold Coast Chargers":"#E03A3E",
  "North Sydney Bears":"#E2231A","St George Dragons":"#E2231A","Balmain Tigers":"#F4820B",
  "Western Suburbs Magpies":"#111111","Illawarra Steelers":"#E2231A","Northern Eagles":"#6E1E78",
  "Adelaide Rams":"#C8102E"
};
const TEAM_ALIASES = {
  "Bulldogs":"Canterbury-Bankstown Bulldogs","Canterbury Bankstown Bulldogs":"Canterbury-Bankstown Bulldogs",
  "Sharks":"Cronulla-Sutherland Sharks","Cronulla Sutherland Sharks":"Cronulla-Sutherland Sharks",
  "Manly Warringah Sea Eagles":"Manly-Warringah Sea Eagles","St George Illawarra Dragons":"St George-Illawarra Dragons",
  "Auckland Warriors":"New Zealand Warriors","Warriors":"New Zealand Warriors","Sydney City Roosters":"Sydney Roosters"
};
const canonTeam = n => TEAM_ALIASES[n] || n;
const teamColour = n => teamColours[canonTeam(n)] || "#2b3640";
const fmtDate = d => {
  if(!d) return "";
  const iso = String(d).split("T")[0];
  const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return iso;
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${parseInt(m[3])} ${months[parseInt(m[2])-1]} ${m[1]}`;
};

const STAT_GROUPS = {
  "Scoring":[
    {key:"tries",label:"T"},{key:"conversions",label:"Con"},{key:"penalty_goals",label:"PG"},
    {key:"field_goals",label:"FG"},{key:"points",label:"Pts",lead:true},
  ],
  "Attack":[
    {key:"runs",label:"Runs"},{key:"metres_gained",label:"Mtrs",lead:true},{key:"post_contact_metres",label:"PCM"},
    {key:"line_breaks",label:"LB"},{key:"line_break_assists",label:"LBA"},{key:"tackle_breaks",label:"TB"},
    {key:"offloads",label:"Off"},{key:"try_assists",label:"TA"},{key:"passes",label:"Pass"},
  ],
  "Running":[
    {key:"hitups",label:"Hitups"},{key:"hitup_metres",label:"HU Mtrs"},{key:"dummy_half_runs",label:"DHR"},
    {key:"dummy_half_metres",label:"DH Mtrs"},{key:"kick_return_runs",label:"KRR"},{key:"kick_return_metres",label:"KR Mtrs"},
  ],
  "Kicking":[
    {key:"kicks_general_play",label:"Kicks"},{key:"kick_metres",label:"Kick M"},
    {key:"forty_twenties",label:"40/20"},{key:"goal_line_dropouts",label:"GLD"},
  ],
  "Defence":[
    {key:"tackles",label:"Tkl",lead:true},{key:"missed_tackles",label:"Miss"},{key:"ineffective_tackles",label:"Ineff"},
    {key:"try_saves",label:"TS"},{key:"intercepts",label:"Int"},{key:"kicks_caught",label:"Caught"},
  ],
  "Discipline":[
    {key:"errors",label:"Err"},{key:"handling_errors",label:"Hand"},{key:"penalties_conceded",label:"Pen"},
    {key:"sin_bins_10min",label:"Sin"},{key:"send_offs",label:"Off"},{key:"on_reports",label:"Rpt"},
  ],
};

let game=null, homePlayers=[], awayPlayers=[], availGroups=[], activeGroup="Scoring";
let sortState={home:{},away:{}};

const params=new URLSearchParams(location.search);
const season=params.get("season"), matchId=params.get("match");

/* ── FIX: merge duplicate player entries (same name, same team) into one row,
   summing numeric stat fields instead of rendering each entry separately. ── */
function dedupePlayers(players){
  const map = new Map();
  players.forEach(p=>{
    const key = (p.player||"").trim().toLowerCase();
    if(!map.has(key)){
      map.set(key, {...p});
    } else {
      const existing = map.get(key);
      Object.keys(p).forEach(k=>{
        const val = p[k];
        if(typeof val === "number" || (val!=="" && !isNaN(val) && val!==null)){
          if(k!=="jersey"){ // don't sum jersey numbers, just keep the first
            existing[k] = (Number(existing[k])||0) + (Number(val)||0);
          }
        }
      });
      // Prefer a populated jersey number if the first entry lacked one
      if(!existing.jersey && p.jersey) existing.jersey = p.jersey;
    }
  });
  return [...map.values()];
}

async function loadGame(){
  try{
    const res=await fetch(`data/nrl/seasons/${season}.json`);
    const matches=await res.json();
    game=matches.find(m=>String(m.match_id)===String(matchId));
    if(!game){ document.getElementById("content").innerHTML='<div class="loading">Match not found.</div>'; return; }
    render();
  }catch(e){
    console.error(e);
    document.getElementById("content").innerHTML='<div class="loading">Couldn’t load this match. Try again.</div>';
  }
}

function hasData(group, players){
  return STAT_GROUPS[group].some(c=>players.some(p=>(Number(p[c.key])||0)!==0));
}

function render(){
  const home=game.home_team, away=game.away_team;
  const players=game.players||[];

  /* FIX: filter as before, then dedupe by player name before anything else uses these arrays */
  homePlayers=dedupePlayers(players.filter(p=>p.played_for===home));
  awayPlayers=dedupePlayers(players.filter(p=>p.played_for===away));
  const all=[...homePlayers,...awayPlayers];

  availGroups=Object.keys(STAT_GROUPS).filter(g=>hasData(g,all));
  if(!availGroups.length) availGroups=["Scoring"];
  if(!availGroups.includes(activeGroup)) activeGroup=availGroups[0];

  const hWin=game.home_points>game.away_points, aWin=game.away_points>game.home_points;
  const eyebrow=[ (game.is_finals?"Finals":"Round "+(game.round||"")), fmtDate(game.date), game.venue ]
                .filter(Boolean).join("  ·  ");
  const detailedMissing = !availGroups.includes("Attack");

  document.getElementById("content").innerHTML = `
    <div class="scorebug">
      <span class="ft-badge">FULL TIME</span>
      <div class="eyebrow">${eyebrow}</div>
      <div class="bug-grid">
        <div class="bug-team home">
          <div>
            <div class="tname">${home}</div>
            <div class="tsub">${game.crowd?Number(game.crowd).toLocaleString()+" crowd":""}</div>
          </div>
          <div class="crest" style="background:${teamColour(home)}"></div>
        </div>
        <div class="bug-score">
          <span class="sc ${hWin?"":"lose"}">${game.home_points}</span>
          <span class="dash">–</span>
          <span class="sc ${aWin?"":"lose"}">${game.away_points}</span>
        </div>
        <div class="bug-team away">
          <div class="crest" style="background:${teamColour(away)}"></div>
          <div>
            <div class="tname">${away}</div>
            <div class="tsub"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="segment" id="segment"></div>
    ${detailedMissing ? `<div class="era-note"><span class="dot"></span>Detailed stats are available from 2014. This match shows scoring only.</div>`:""}

    <div class="teams">
      <div class="team-card">
        <div class="team-head"><span class="swatch" style="background:${teamColour(home)}"></span><h2>${home}</h2><span class="tally">${homePlayers.length} players</span></div>
        <div class="table-wrap"><table id="homeTable"><thead></thead><tbody></tbody></table></div>
      </div>
      <div class="team-card">
        <div class="team-head"><span class="swatch" style="background:${teamColour(away)}"></span><h2>${away}</h2><span class="tally">${awayPlayers.length} players</span></div>
        <div class="table-wrap"><table id="awayTable"><thead></thead><tbody></tbody></table></div>
      </div>
    </div>
  `;

  buildSegment();
  renderTable("home");
  renderTable("away");
}

function buildSegment(){
  const seg=document.getElementById("segment");
  seg.innerHTML="";
  availGroups.forEach(g=>{
    const b=document.createElement("button");
    b.className="seg-btn"+(g===activeGroup?" active":"");
    b.textContent=g;
    b.onclick=()=>{ activeGroup=g; buildSegment(); renderTable("home"); renderTable("away"); };
    seg.appendChild(b);
  });
}

function renderTable(side){
  const players=side==="home"?homePlayers:awayPlayers;
  const cols=STAT_GROUPS[activeGroup];
  const table=document.getElementById(side+"Table");
  const st=sortState[side];

  table.querySelector("thead").innerHTML=`<tr>
    <th data-k="player" class="${st.key==='player'?'sorted '+(st.asc?'asc':''):''}">Player</th>
    ${cols.map(c=>`<th data-k="${c.key}" class="${st.key===c.key?'sorted '+(st.asc?'asc':''):''}">${c.label}</th>`).join("")}
  </tr>`;
  table.querySelectorAll("thead th").forEach(th=>{
    th.onclick=()=>sortBy(side, th.getAttribute("data-k"));
  });

  table.querySelector("tbody").innerHTML=players.map(p=>`
    <tr>
      <td><span class="jersey">${p.jersey||""}</span><a class="player-link" href="nrl-player.html?player=${encodeURIComponent(p.player)}">${p.player}</a></td>
      ${cols.map(c=>`<td class="${c.lead?'lead':''}">${p[c.key]??0}</td>`).join("")}
    </tr>`).join("");
}

function sortBy(side,key){
  const players=side==="home"?homePlayers:awayPlayers;
  const st=sortState[side];
  st.asc = (st.key===key) ? !st.asc : false;     // default: highest first
  st.key=key;
  players.sort((a,b)=>{
    let av,bv;
    if(key==="player"){ av=(a.player||"").toLowerCase(); bv=(b.player||"").toLowerCase();
      return av<bv?(st.asc?-1:1):av>bv?(st.asc?1:-1):0; }
    av=Number(a[key])||0; bv=Number(b[key])||0;
    return st.asc?av-bv:bv-av;
  });
  renderTable(side);
}

loadGame();
</script>
</body>
</html>
