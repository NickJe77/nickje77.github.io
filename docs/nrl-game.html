<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NRL Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1200px;margin:auto;padding:30px;}

.top-nav{
  text-align:center;
  margin-bottom:20px;
}
.top-nav a{
  text-decoration:none;
  color:#0056d6;
  font-weight:600;
  margin:0 10px;
}

.header{
  text-align:center;
  margin-bottom:30px;
}
.header h1{
  margin:0;
  font-size:32px;
}
.meta{
  color:#666;
  margin-top:6px;
}
.score{
  font-size:26px;
  font-weight:800;
  margin-top:10px;
}

.teams{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.team-card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.team-name{
  font-weight:800;
  font-size:20px;
  margin-bottom:10px;
}

.stripe{
  height:10px;
  border-radius:6px;
  margin-bottom:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:6px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th:first-child, td:first-child{
  text-align:left;
}

.player-link{
  text-decoration:none;
  color:#000;
  font-weight:600;
}

.player-link:hover{
  color:#0056d6;
}
</style>
</head>
<body>

<div class="page">

<div class="top-nav">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</div>

<div class="header">
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
  <div class="score" id="score"></div>
</div>

<div class="teams">
  <div class="team-card">
    <div class="team-name" id="homeName"></div>
    <div class="stripe" id="homeStripe"></div>
    <table>
      <thead>
        <tr>
          <th>Player</th>
          <th>Tries</th>
          <th>Goals</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody id="homePlayers"></tbody>
    </table>
  </div>

  <div class="team-card">
    <div class="team-name" id="awayName"></div>
    <div class="stripe" id="awayStripe"></div>
    <table>
      <thead>
        <tr>
          <th>Player</th>
          <th>Tries</th>
          <th>Goals</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody id="awayPlayers"></tbody>
    </table>
  </div>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const season = params.get("season");
const matchId = params.get("match");

fetch("data/nrl/seasons/" + season + ".json")
.then(r=>r.json())
.then(rows=>{

  const matchRows = rows.filter(r => String(r.match_id) === String(matchId));
  if(!matchRows.length){
    document.body.innerHTML = "Match not found.";
    return;
  }

  const game = matchRows[0];

  document.getElementById("title").textContent =
    season + " – " + (game.round || "") + ": " +
    game.home_team + " vs " + game.away_team;

  document.getElementById("meta").textContent =
    "Venue: " + (game.venue || "") +
    (game.crowd ? " • Crowd: " + game.crowd.toLocaleString() : "");

  document.getElementById("score").textContent =
    game.home_team + " " + game.home_points +
    " – " +
    game.away_points + " " + game.away_team;

  document.getElementById("homeName").textContent = game.home_team;
  document.getElementById("awayName").textContent = game.away_team;

  // Simple colour bars (can later connect to team-colours JSON)
  document.getElementById("homeStripe").style.background = "#0055A4";
  document.getElementById("awayStripe").style.background = "#00A651";

  const homeDiv = document.getElementById("homePlayers");
  const awayDiv = document.getElementById("awayPlayers");

  matchRows.forEach(p=>{
    const row = `
      <tr>
        <td>
          <a class="player-link"
             href="nrl-player.html?player=${encodeURIComponent(p.player)}">
             ${p.player}
          </a>
        </td>
        <td>${p.tries || 0}</td>
        <td>${p.goals_made || 0}</td>
        <td>${p.points || 0}</td>
      </tr>
    `;

    if(p.played_for === game.home_team){
      homeDiv.innerHTML += row;
    } else {
      awayDiv.innerHTML += row;
    }
  });

})
.catch(err=>{
  document.body.innerHTML = "Error loading match.";
  console.error(err);
});
</script>

</body>
</html>
