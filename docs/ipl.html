<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Indian Premier League | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:30px;
}
.hero h1{margin:0;font-size:48px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

.controls{
  margin:20px 0;
  font-size:18px;
}
select{
  font-size:16px;
  padding:6px 10px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{
  background:#f3f6fb;
}
tr:nth-child(even){
  background:#f8fbff;
}

.footer-note{
  margin-top:25px;
  font-size:14px;
  color:#555;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1>Indian Premier League</h1>
    <p>Every IPL match — built from ball-by-ball Cricsheet data.</p>
  </div>

  <div class="controls">
    Season:
    <select id="seasonSelect"></select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Team 1</th>
        <th>Team 2</th>
        <th>Venue</th>
        <th>Winner</th>
        <th>Margin</th>
      </tr>
    </thead>
    <tbody id="matchTable"></tbody>
  </table>

  <div class="footer-note">
    Data source: <a href="https://cricsheet.org" target="_blank">Cricsheet.org</a>
  </div>

</div>

<script>
const indexUrl = "docs/data/ipl/index.json";
const basePath = "docs/data/ipl/";

const seasonSelect = document.getElementById("seasonSelect");
const tableBody = document.getElementById("matchTable");

fetch(indexUrl)
  .then(r => r.json())
  .then(files => {
    files.forEach(file => {
      const year = file.replace("ipl_","").replace(".json","");
      const opt = document.createElement("option");
      opt.value = file;
      opt.textContent = year;
      seasonSelect.appendChild(opt);
    });

    // load most recent season by default
    seasonSelect.value = files[files.length - 1];
    loadSeason(seasonSelect.value);
  });

seasonSelect.addEventListener("change", () => {
  loadSeason(seasonSelect.value);
});

function loadSeason(file){
  fetch(basePath + file)
    .then(r => r.json())
    .then(matches => {
      tableBody.innerHTML = "";

      matches.forEach(m => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${m.date || ""}</td>
          <td>${m.team1 || ""}</td>
          <td>${m.team2 || ""}</td>
          <td>${m.venue || ""}</td>
          <td>${m.winner || ""}</td>
          <td>${m.margin || ""}</td>
        `;
        tableBody.appendChild(tr);
      });
    });
}
</script>

</body>
</html>
