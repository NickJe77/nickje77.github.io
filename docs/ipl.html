<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Indian Premier League | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1300px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:30px;
}
.hero h1{margin:0;font-size:48px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

.controls{
  margin:20px 0;
  font-size:18px;
}

select{
  font-size:16px;
  padding:6px 10px;
  border-radius:6px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  font-size:15px;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}

th{
  background:#f3f6fb;
  position:sticky;
  top:0;
  z-index:2;
}

tr:nth-child(even){
  background:#f8fbff;
}

tr:hover{
  background:#eef4ff;
}

.winner{
  font-weight:600;
  color:#1a7f37;
}

.margin{
  font-weight:500;
}

@media(max-width:900px){
  th:nth-child(4), td:nth-child(4){
    display:none; /* hide venue on small screens */
  }
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1>Indian Premier League</h1>
    <p>Complete IPL match history by season.</p>
  </div>

  <div class="controls">
    Season:
    <select id="seasonSelect"></select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Team 1</th>
        <th>Team 2</th>
        <th>Venue</th>
        <th>Winner</th>
        <th>Margin</th>
      </tr>
    </thead>
    <tbody id="matchTable"></tbody>
  </table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";

const seasonSelect = document.getElementById("seasonSelect");
const tableBody = document.getElementById("matchTable");

fetch(indexUrl)
  .then(r => r.json())
  .then(files => {
    files.forEach(file => {
      const year = file.replace("ipl_","").replace(".json","");
      const opt = document.createElement("option");
      opt.value = file;
      opt.textContent = year;
      seasonSelect.appendChild(opt);
    });

    seasonSelect.value = files[files.length - 1];
    loadSeason(seasonSelect.value);
  });

seasonSelect.addEventListener("change", () => {
  loadSeason(seasonSelect.value);
});

function loadSeason(file){
  fetch(basePath + file)
    .then(r => r.json())
    .then(matches => {
      tableBody.innerHTML = "";

      // sort newest first
      matches.sort((a,b)=> new Date(b.date) - new Date(a.date));

      matches.forEach(m => {
        const team1 = m.teams ? m.teams[0] : "";
        const team2 = m.teams ? m.teams[1] : "";

        let margin = "";
        if (m.outcome && m.outcome.by){
          if (m.outcome.by.runs){
            margin = m.outcome.by.runs + " runs";
          } else if (m.outcome.by.wickets){
            margin = m.outcome.by.wickets + " wickets";
          }
        }

        const winner = m.outcome ? m.outcome.winner || "" : "";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${formatDate(m.date)}</td>
          <td>${team1}</td>
          <td>${team2}</td>
          <td>${m.venue || ""}</td>
          <td class="winner">${winner}</td>
          <td class="margin">${margin}</td>
        `;
        tableBody.appendChild(tr);
      });
    });
}

function formatDate(d){
  if(!d) return "";
  const dt = new Date(d);
  return dt.toLocaleDateString("en-GB",{
    day:"2-digit", month:"short", year:"numeric"
  });
}
</script>

</body>
</html>
