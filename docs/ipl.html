<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Indian Premier League | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body {
  font-family: Inter, system-ui, Arial, sans-serif;
  margin: 0;
  background: white;
}

.navbar {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 16px 0;
  border-bottom: 1px solid #ddd;
  font-weight: 600;
}

.navbar a {
  color: #0056d6;
  text-decoration: none;
  font-size: 18px;
}

.navbar a:hover {
  text-decoration: underline;
}

.page-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px;
}

.hero {
  background: linear-gradient(135deg, #3b0066, #6a1bb2);
  color: white;
  padding: 40px;
  border-radius: 22px;
  margin-bottom: 30px;
}

.hero h1 {
  margin: 0 0 10px 0;
  font-size: 42px;
}

.hero p {
  margin: 0;
  font-size: 18px;
  opacity: 0.9;
}

.controls {
  margin-bottom: 20px;
}

select {
  padding: 8px 12px;
  font-size: 16px;
}

.match-list {
  border-top: 1px solid #ddd;
}

.match {
  display: grid;
  grid-template-columns: 140px 1fr 1fr 2fr 1fr 1fr;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

.match.header {
  font-weight: 700;
  background: #f5f8ff;
}

.match div {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1>Indian Premier League</h1>
    <p>Every IPL match — built from ball-by-ball Cricsheet data.</p>
  </div>

  <div class="controls">
    Season:
    <select id="seasonSelect"></select>
  </div>

  <div class="match-list" id="matchList">
    <div class="match header">
      <div>Date</div>
      <div>Team 1</div>
      <div>Team 2</div>
      <div>Venue</div>
      <div>Winner</div>
      <div>Margin</div>
    </div>
  </div>

</div>

<script>
const INDEX_FILE = "data/ipl/index.json";
const DATA_FOLDER = "data/ipl/";

let allMatches = [];

async function loadIPL() {
  const res = await fetch(INDEX_FILE);
  const files = await res.json();

  for (const file of files) {
    try {
      const matchRes = await fetch(DATA_FOLDER + file);
      const data = await matchRes.json();

      const info = data.info;

      const date = info.dates[0];
      const season = date.substring(0,4);

      const team1 = info.teams[0];
      const team2 = info.teams[1];
      const venue = info.venue || "";

      const winner = info.outcome?.winner || "No result";

      let margin = "–";
      if (info.outcome?.by?.runs) {
        margin = info.outcome.by.runs + " runs";
      } else if (info.outcome?.by?.wickets) {
        margin = info.outcome.by.wickets + " wickets";
      }

      allMatches.push({
        season,
        date,
        team1,
        team2,
        venue,
        winner,
        margin
      });

    } catch (err) {
      console.warn("Skipping bad file:", file);
    }
  }

  buildSeasonDropdown();
}

function buildSeasonDropdown() {
  const seasons = [...new Set(allMatches.map(m => m.season))].sort();

  const select = document.getElementById("seasonSelect");
  select.innerHTML = "";

  seasons.forEach(season => {
    const opt = document.createElement("option");
    opt.value = season;
    opt.textContent = season;
    select.appendChild(opt);
  });

  if (seasons.length > 0) {
    renderMatches(seasons[0]);
  }

  select.addEventListener("change", () => {
    renderMatches(select.value);
  });
}

function renderMatches(season) {
  const list = document.getElementById("matchList");

  list.querySelectorAll(".match:not(.header)").forEach(e => e.remove());

  const filtered = allMatches.filter(m => m.season === season);

  filtered.forEach(m => {
    const row = document.createElement("div");
    row.className = "match";

    row.innerHTML = `
      <div>${m.date}</div>
      <div>${m.team1}</div>
      <div>${m.team2}</div>
      <div>${m.venue}</div>
      <div>${m.winner}</div>
      <div>${m.margin}</div>
    `;

    list.appendChild(row);
  });
}

loadIPL();
</script>

</body>
</html>
