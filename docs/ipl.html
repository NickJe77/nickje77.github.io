<meta charset="UTF-8">
<title>Indian Premier League | The Sporting Almanac</title>

<style>
body {
  font-family: Inter, system-ui, Arial, sans-serif;
  margin: 0;
  background: white;
}

.navbar {
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 16px 0;
  border-bottom: 1px solid #ddd;
  font-weight: 600;
}

.navbar a {
  color: #0056d6;
  text-decoration: none;
  font-size: 18px;
}

.navbar a:hover {
  text-decoration: underline;
}

.page-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px;
}

.hero {
  background: linear-gradient(135deg, #3b0066, #6a1bb2);
  color: white;
  padding: 40px;
  border-radius: 22px;
  margin-bottom: 30px;
}

.hero h1 {
  margin: 0 0 10px 0;
  font-size: 42px;
}

.hero p {
  margin: 0;
  font-size: 18px;
  opacity: 0.9;
}

.controls {
  margin-bottom: 20px;
}

select {
  padding: 8px 12px;
  font-size: 16px;
}

.match-list {
  border-top: 1px solid #ddd;
}

.match {
  display: grid;
  grid-template-columns: 140px 1fr 1fr 2fr 1fr 1fr;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

.match.header {
  font-weight: 700;
  background: #f5f8ff;
}

.match div {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
