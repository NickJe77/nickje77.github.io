<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tour de France Riders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:20px;}
h1{text-align:center;}

.controls{
  text-align:center;
  margin:20px 0;
}

input{
  padding:8px;
  width:250px;
  font-size:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#111;
  color:#fff;
}

tr:hover{background:#f5f5f5;}
</style>
</head>

<body>

<h1>Tour de France Riders</h1>

<div class="controls">
  <input type="text" id="search" placeholder="Search rider...">
</div>

<table>
  <thead>
    <tr>
      <th>Year</th>
      <th>Rider</th>
      <th>Stage Wins</th>
      <th>Yellow</th>
      <th>Green</th>
      <th>Polka Dot</th>
      <th>White</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>

let DATA = [];

fetch("data/cycling/riders.json")
  .then(r => r.json())
  .then(data => {
    DATA = data;
    render();
  });

document.getElementById("search").addEventListener("input", render);

function render(){

  const search = document.getElementById("search").value.toLowerCase();

  let rows = DATA;

  if(search){
    rows = rows.filter(d =>
      (d.Name || "").toLowerCase().includes(search)
    );
  }

  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  rows.slice(0,500).forEach(d => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${d.Year}</td>
      <td>${d.Name}</td>
      <td>${d.Wins}</td>
      <td>${d.Yellow}</td>
      <td>${d.Green}</td>
      <td>${d.PolkaDot}</td>
      <td>${d.White}</td>
    `;

    body.appendChild(tr);
  });

}

</script>

</body>
</html>
