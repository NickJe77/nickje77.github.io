<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tour de France Riders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui,Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{text-align:center;}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

/* SEARCH */
.controls{
  text-align:center;
  margin:20px 0;
}

input{
  padding:10px;
  width:260px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* TABLE */
table{
  width:100%;
  max-width:850px;
  margin:20px auto;
  border-collapse:collapse;
}

/* HEADER */
th{
  background:#111;
  color:#fff;
  padding:10px 12px;
  font-weight:600;
  cursor:pointer;
}

/* ALIGNMENT FIX */
th:first-child,
td:first-child{
  text-align:left;
}

th:not(:first-child),
td:not(:first-child){
  text-align:center;   /* 🔥 KEY FIX */
}

/* CELLS */
td{
  padding:10px 12px;
  border-bottom:1px solid #ddd;
  font-variant-numeric: tabular-nums;
}

/* STRIPING */
tbody tr:nth-child(even){
  background:#f2f6ff;
}

tr:hover{
  background:#e6edff;
}

/* LINKS */
a{
  color:#1a56db;
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
</div>

<h1>Tour de France Riders</h1>

<div class="controls">
  <input id="search" placeholder="Search rider...">
</div>

<table>
<thead>
<tr>
  <th onclick="setSort('name')">Rider</th>
  <th onclick="setSort('tour')">Tour Wins</th>
  <th onclick="setSort('stage')">Stage Wins</th>
  <th onclick="setSort('green')">Green</th>
  <th onclick="setSort('polka')">Polka Dot</th>
  <th onclick="setSort('white')">White</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>

<script>

let riders = [];
let winnersPerYear = {};
let tourWins = {};
let currentSort = { key:"tour", asc:false };

fetch("/data/cycling/riders.json")
.then(r => r.json())
.then(data => {
  buildWinners(data);
  buildRiders(data);
});

function cleanName(name){
  if(!name) return "";
  const cleaned = name.replace(/\(.*?\)/g,"").trim();

  if(
    cleaned === "" ||
    cleaned.toLowerCase() === "nan" ||
    cleaned.toLowerCase() === "null" ||
    cleaned.toLowerCase() === "undefined"
  ){
    return "";
  }

  return cleaned;
}

function buildWinners(data){

  data.forEach(r => {

    const year = r.Year;
    const name = cleanName(r.Name);
    const yellow = Number(r.Yellow || 0);

    if(!year || !name) return;

    if(!winnersPerYear[year]){
      winnersPerYear[year] = { name, yellow };
    } else {
      if(yellow > winnersPerYear[year].yellow){
        winnersPerYear[year] = { name, yellow };
      }
    }

  });

  Object.values(winnersPerYear).forEach(w => {
    if(!tourWins[w.name]) tourWins[w.name] = 0;
    tourWins[w.name]++;
  });

}

function buildRiders(data){

  const map = {};

  data.forEach(r => {

    const name = cleanName(r.Name);
    if(!name) return;

    if(!map[name]){
      map[name] = {
        name,
        tour: tourWins[name] || 0,
        stage: 0,
        green: 0,
        polka: 0,
        white: 0
      };
    }

    map[name].stage += Number(r.Wins || 0);
    map[name].green += Number(r.Green || 0);
    map[name].polka += Number(r.PolkaDot || 0);
    map[name].white += Number(r.White || 0);

  });

  riders = Object.values(map);
  sortAndRender();
}

function sortAndRender(){

  const {key, asc} = currentSort;

  riders.sort((a,b)=>{
    if(typeof a[key] === "string"){
      return asc ? a[key].localeCompare(b[key]) : b[key].localeCompare(a[key]);
    }
    return asc ? a[key]-b[key] : b[key]-a[key];
  });

  render(riders);
}

function render(data){

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  data.forEach(r => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <a href="cycling-rider.html?name=${encodeURIComponent(r.name)}">
          ${r.name}
        </a>
      </td>
      <td>${r.tour}</td>
      <td>${r.stage}</td>
      <td>${r.green}</td>
      <td>${r.polka}</td>
      <td>${r.white}</td>
    `;

    tbody.appendChild(tr);

  });

}

function setSort(key){

  if(currentSort.key === key){
    currentSort.asc = !currentSort.asc;
  }else{
    currentSort.key = key;
    currentSort.asc = false;
  }

  sortAndRender();
}

document.getElementById("search").addEventListener("input", e=>{
  const q = e.target.value.toLowerCase();
  render(riders.filter(r=>r.name.toLowerCase().includes(q)));
});

</script>

</body>
</html>
