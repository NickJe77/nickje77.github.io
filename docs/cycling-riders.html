<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tour de France Riders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover{opacity:1;color:var(--accent);}

.page{max-width:1000px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:36px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:10px;display:block;
}
h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.controls{display:flex;justify-content:center;margin-bottom:20px;}
input{
  padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink);width:280px;max-width:100%;
}
input:hover{border-color:var(--faint);}
input:focus{outline:none;border-color:var(--accent);}

.table-wrap{
  overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:center;cursor:pointer;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);user-select:none;
}
th:hover{color:var(--ink);}
th:first-child{text-align:left;}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
td:first-child{text-align:left;font-weight:700;color:var(--ink);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
a{color:inherit;text-decoration:none;}
a:hover{color:var(--accent);}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div class="page">

  <div class="hero">
    <span class="eyebrow">Tour de France</span>
    <h1>Tour de France Riders</h1>
  </div>

  <div class="controls">
    <input id="search" placeholder="Search rider...">
  </div>

  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th onclick="setSort('name')">Rider</th>
        <th onclick="setSort('tour')">Tour Wins</th>
        <th onclick="setSort('stage')">Stage Wins</th>
        <th onclick="setSort('green')">Green</th>
        <th onclick="setSort('polka')">Polka Dot</th>
        <th onclick="setSort('white')">White</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  </div>

</div>

<script>

let riders = [];
let tourWins = {};
let currentSort = { key:"tour", asc:false };

// -------------------------
// CLEAN (FOR MATCHING)
// -------------------------
function cleanName(name){
  return (name || "")
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\[.*?\]/g,"")
    .replace(/\(.*?\)/g,"")
    .trim();
}

// -------------------------
// DISPLAY NAME (NO TEAM)
// -------------------------
function displayName(name){
  return (name || "")
    .replace(/\(.*?\)/g,"") // 🔥 removes team names
    .trim();
}

// -------------------------
// LOAD DATA
// -------------------------
Promise.all([
  fetch("/data/cycling/riders.json").then(r=>r.json()),
  fetch("/data/cycling/tdf_winners.json").then(r=>r.json())
]).then(([ridersData, winnersData]) => {

  buildTourWins(winnersData);
  buildRiders(ridersData);

});

// -------------------------
function buildTourWins(data){

  data.forEach(r => {

    const name = cleanName(r.Cyclist);
    if(!name) return;

    if(!tourWins[name]) tourWins[name] = 0;
    tourWins[name]++;

  });

}

// -------------------------
function buildRiders(data){

  const map = {};
  const stageTracker = {};

  data.forEach(r => {

    const clean = cleanName(r.Name);
    if(!clean) return;

    const year = r.Year;
    const wins = Number(r.Wins || 0);

    if(!map[clean]){
      map[clean] = {
        name: clean,
        displayName: displayName(r.Name), // 🔥 CLEAN DISPLAY
        tour: tourWins[clean] || 0,
        stage: 0,
        green: 0,
        polka: 0,
        white: 0
      };
    }

    const key = `${clean}_${year}`;

    if(!stageTracker[key]){
      stageTracker[key] = wins;
    } else {
      stageTracker[key] = Math.max(stageTracker[key], wins);
    }

    map[clean].green += Number(r.Green || 0);
    map[clean].polka += Number(r.PolkaDot || 0);
    map[clean].white += Number(r.White || 0);

  });

  Object.entries(stageTracker).forEach(([key, wins])=>{
    const name = key.split("_")[0];
    map[name].stage += wins;
  });

  riders = Object.values(map);
  sortAndRender();
}

// -------------------------
function sortAndRender(){

  const {key, asc} = currentSort;

  riders.sort((a,b)=>{
    if(typeof a[key] === "string"){
      return asc ? a[key].localeCompare(b[key]) : b[key].localeCompare(a[key]);
    }
    return asc ? a[key]-b[key] : b[key]-a[key];
  });

  render(riders);
}

// -------------------------
function render(data){

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  data.forEach(r => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <a href="cycling-rider.html?name=${encodeURIComponent(r.displayName)}">
          ${r.displayName}
        </a>
      </td>
      <td>${r.tour}</td>
      <td>${r.stage}</td>
      <td>${r.green}</td>
      <td>${r.polka}</td>
      <td>${r.white}</td>
    `;

    tbody.appendChild(tr);

  });

}

// -------------------------
function setSort(key){

  if(currentSort.key === key){
    currentSort.asc = !currentSort.asc;
  }else{
    currentSort.key = key;
    currentSort.asc = false;
  }

  sortAndRender();
}

// -------------------------
document.getElementById("search").addEventListener("input", e=>{
  const q = cleanName(e.target.value);
  render(riders.filter(r=>cleanName(r.displayName).includes(q)));
});

</script>

</body>
</html>
