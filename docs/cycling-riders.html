<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tour de France Riders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui,Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{text-align:center;}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.controls{
  text-align:center;
  margin:20px 0;
}

input{
  padding:10px;
  width:260px;
  border-radius:8px;
  border:1px solid #ccc;
}

table{
  width:100%;
  max-width:850px;
  margin:20px auto;
  border-collapse:collapse;
}

th{
  background:#111;
  color:#fff;
  padding:10px 12px;
  font-weight:600;
  cursor:pointer;
}

th:first-child,
td:first-child{
  text-align:left;
}

th:not(:first-child),
td:not(:first-child){
  text-align:center;
}

td{
  padding:10px 12px;
  border-bottom:1px solid #ddd;
}

tbody tr:nth-child(even){
  background:#f2f6ff;
}

tr:hover{
  background:#e6edff;
}

a{
  color:#1a56db;
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
</div>

<h1>Tour de France Riders</h1>

<div class="controls">
  <input id="search" placeholder="Search rider...">
</div>

<table>
<thead>
<tr>
  <th onclick="setSort('name')">Rider</th>
  <th onclick="setSort('tour')">Tour Wins</th>
  <th onclick="setSort('stage')">Stage Wins</th>
  <th onclick="setSort('green')">Green</th>
  <th onclick="setSort('polka')">Polka Dot</th>
  <th onclick="setSort('white')">White</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>

<script>

let riders = [];
let tourWins = {};
let currentSort = { key:"tour", asc:false };

// -------------------------
// CLEAN (FOR MATCHING)
// -------------------------
function cleanName(name){
  return (name || "")
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\[.*?\]/g,"")
    .replace(/\(.*?\)/g,"")
    .trim();
}

// -------------------------
// DISPLAY NAME (NO TEAM)
// -------------------------
function displayName(name){
  return (name || "")
    .replace(/\(.*?\)/g,"") // 🔥 removes team names
    .trim();
}

// -------------------------
// LOAD DATA
// -------------------------
Promise.all([
  fetch("/data/cycling/riders.json").then(r=>r.json()),
  fetch("/data/cycling/tdf_winners.json").then(r=>r.json())
]).then(([ridersData, winnersData]) => {

  buildTourWins(winnersData);
  buildRiders(ridersData);

});

// -------------------------
function buildTourWins(data){

  data.forEach(r => {

    const name = cleanName(r.Cyclist);
    if(!name) return;

    if(!tourWins[name]) tourWins[name] = 0;
    tourWins[name]++;

  });

}

// -------------------------
function buildRiders(data){

  const map = {};
  const stageTracker = {};

  data.forEach(r => {

    const clean = cleanName(r.Name);
    if(!clean) return;

    const year = r.Year;
    const wins = Number(r.Wins || 0);

    if(!map[clean]){
      map[clean] = {
        name: clean,
        displayName: displayName(r.Name), // 🔥 CLEAN DISPLAY
        tour: tourWins[clean] || 0,
        stage: 0,
        green: 0,
        polka: 0,
        white: 0
      };
    }

    const key = `${clean}_${year}`;

    if(!stageTracker[key]){
      stageTracker[key] = wins;
    } else {
      stageTracker[key] = Math.max(stageTracker[key], wins);
    }

    map[clean].green += Number(r.Green || 0);
    map[clean].polka += Number(r.PolkaDot || 0);
    map[clean].white += Number(r.White || 0);

  });

  Object.entries(stageTracker).forEach(([key, wins])=>{
    const name = key.split("_")[0];
    map[name].stage += wins;
  });

  riders = Object.values(map);
  sortAndRender();
}

// -------------------------
function sortAndRender(){

  const {key, asc} = currentSort;

  riders.sort((a,b)=>{
    if(typeof a[key] === "string"){
      return asc ? a[key].localeCompare(b[key]) : b[key].localeCompare(a[key]);
    }
    return asc ? a[key]-b[key] : b[key]-a[key];
  });

  render(riders);
}

// -------------------------
function render(data){

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  data.forEach(r => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <a href="cycling-rider.html?name=${encodeURIComponent(r.displayName)}">
          ${r.displayName}
        </a>
      </td>
      <td>${r.tour}</td>
      <td>${r.stage}</td>
      <td>${r.green}</td>
      <td>${r.polka}</td>
      <td>${r.white}</td>
    `;

    tbody.appendChild(tr);

  });

}

// -------------------------
function setSort(key){

  if(currentSort.key === key){
    currentSort.asc = !currentSort.asc;
  }else{
    currentSort.key = key;
    currentSort.asc = false;
  }

  sortAndRender();
}

// -------------------------
document.getElementById("search").addEventListener("input", e=>{
  const q = cleanName(e.target.value);
  render(riders.filter(r=>cleanName(r.displayName).includes(q)));
});

</script>

</body>
</html>
