<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tour de France Riders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

/* MATCH SITE */
body{
  font-family:system-ui, Arial, sans-serif;
  margin:0;
  padding:20px;
}

/* NAVBAR */
.home-nav{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.home-nav a{
  color:#0056d6;
  text-decoration:none;
  font-size:15px;
}

/* TITLE */
h1{
  text-align:center;
  margin-top:20px;
}

/* CONTROLS */
.controls{
  text-align:center;
  margin:20px 0;
}

input{
  padding:8px;
  width:250px;
  font-size:16px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#111;
  color:#fff;
}

tr:hover{
  background:#f5f5f5;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="home-nav">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
  <a href="./nba.html">NBA</a>
  <a href="./nfl.html">NFL</a>
  <a href="./olympics.html">Olympics</a>
</nav>

<h1>Tour de France Riders</h1>

<div class="controls">
  <input type="text" id="search" placeholder="Search rider...">
</div>

<table>
  <thead>
    <tr>
      <th>Year</th>
      <th>Rider</th>
      <th>Stage Wins</th>
      <th>Yellow</th>
      <th>Green</th>
      <th>Polka Dot</th>
      <th>White</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>

let DATA = [];

/* SAFE NUMBER HANDLER */
function num(v){
  return v ? v : 0;
}

fetch("data/cycling/riders.json")
  .then(r => r.json())
  .then(data => {
    DATA = data;
    render();
  });

document.getElementById("search").addEventListener("input", render);

function render(){

  const search = document.getElementById("search").value.toLowerCase();

  let rows = DATA;

  if(search){
    rows = rows.filter(d =>
      (d.Name || "").toLowerCase().includes(search)
    );
  }

  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  rows.slice(0,500).forEach(d => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${d.Year || ""}</td>
      <td>${d.Name || ""}</td>
      <td>${num(d.Wins)}</td>
      <td>${num(d.Yellow)}</td>
      <td>${num(d.Green)}</td>
      <td>${num(d.PolkaDot)}</td>
      <td>${num(d.White)}</td>
    `;

    body.appendChild(tr);
  });

}

</script>

</body>
</html>
