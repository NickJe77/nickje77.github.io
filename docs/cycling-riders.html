<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tour de France Riders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:20px;}
h1{text-align:center;}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{color:#0056d6;text-decoration:none;}

.controls{text-align:center;margin:20px 0;}

input{
  padding:10px;
  width:260px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
}

table{width:100%;border-collapse:collapse;}

th{
  background:#111;
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

tr:hover{background:#f5f5f5;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
</div>

<h1>Tour de France Riders</h1>

<div class="controls">
  <input id="search" placeholder="Search rider...">
</div>

<table>
<thead>
<tr>
  <th>Rider</th>
  <th>Stage Wins</th>
  <th>Green</th>
  <th>Polka Dot</th>
  <th>White</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>

<script>

let riders = [];

fetch("/data/cycling/riders.json")
.then(r => r.json())
.then(data => build(data));

function cleanName(name){
  return (name || "").replace(/\(.*?\)/g,"").trim();
}

function build(data){

  const map = {};

  data.forEach(r => {

    const name = cleanName(r.Name);

    if(!name) return;

    if(!map[name]){
      map[name] = {
        name: name,
        stage: 0,
        green: 0,
        polka: 0,
        white: 0
      };
    }

    map[name].stage += Number(r.Wins || 0);
    map[name].green += Number(r.Green || 0);
    map[name].polka += Number(r.PolkaDot || 0);
    map[name].white += Number(r.White || 0);

  });

  riders = Object.values(map)
    .sort((a,b)=> b.stage - a.stage);

  render(riders);
}

function render(data){
  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  data.forEach(r => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${r.name}</td>
      <td>${r.stage}</td>
      <td>${r.green}</td>
      <td>${r.polka}</td>
      <td>${r.white}</td>
    `;

    tbody.appendChild(tr);
  });
}

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  render(riders.filter(r => r.name.toLowerCase().includes(q)));
});

</script>

</body>
</html>
