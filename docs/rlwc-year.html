<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Rugby League World Cup – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#1fa25c;
  --accent-soft:rgba(31,162,92,.16);
  --league:#a8790a;
  --league-soft:rgba(168,121,10,.1);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{color:var(--ink);text-decoration:none;opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:44px 20px;text-align:center;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4.5vw,42px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

/* ── Year tiles ───────────────────────────────────────── */
.year-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-bottom:26px;}
.year-tile{
  background:var(--surface);border:1px solid var(--line);color:var(--ink);text-align:center;
  padding:12px;border-radius:var(--radius);font-family:var(--display);font-weight:600;font-size:15px;
  cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.year-tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,16,24,.2);border-color:var(--league);}
.year-tile.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ── Summary ──────────────────────────────────────────── */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:22px;}
.summary h2{
  margin:0 0 16px;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.01em;
  text-transform:uppercase;color:var(--ink);
}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}

.summary-box{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  font-weight:600;font-size:13.5px;color:var(--ink);position:relative;overflow:hidden;
}

.flag-bg{
  position:absolute;font-size:88px;opacity:.14;right:6px;bottom:-6px;pointer-events:none;filter:saturate(1.2);
}
.flag-row{display:inline-flex;gap:8px;vertical-align:middle;margin-left:4px;}
.flag-icon{font-size:36px;line-height:1;}

/* ── Matches ──────────────────────────────────────────── */
.match{
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;
  background:var(--surface);display:block;text-decoration:none;color:inherit;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.match:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,16,24,.18);border-color:var(--faint);}
.match h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.01em;color:var(--ink);}
.small{font-size:12.5px;color:var(--muted);font-weight:600;}

.team-link{color:var(--league);text-decoration:none;font-weight:700;}
.team-link:hover{color:var(--accent);text-decoration:underline;}
</style>
</head>

<body>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="nrl.html">NRL</a>
<a href="rlwc.html">Rugby League World Cup</a>
<a href="rlwc-teams.html">Teams</a>
</nav>

<div class="hero">
  <div class="eyebrow">Rugby League</div>
  <h1>Rugby League World Cup – By Year</h1>
</div>

<div class="page-wrap">
<div id="years" class="year-grid"></div>
<div id="output"></div>
</div>

<script>
const TEAM_PAGE="rlwc-team.html";

const YEARS = [1954,1957,1960,1968,1970,1972,1975,1977,1988,1992,1995,2000,2008,2013,2017,2022];
const HOSTS = {
  1954:"France",1957:"Australia",1960:"United Kingdom",1968:"Australia/New Zealand",
  1970:"United Kingdom",1972:"France",1975:"Australia/France/New Zealand/United Kingdom",
  1977:"Australia/New Zealand",1988:"No host (home and away format)",
  1992:"No host (home and away format)",1995:"England/Wales",
  2000:"England/France/Ireland/Scotland/Wales",2008:"Australia",
  2013:"England/Wales",2017:"Australia/New Zealand/Papua New Guinea",2022:"England"
};

function buildYears(){
 const box=document.getElementById("years");
 [...YEARS].reverse().forEach(y=>{
  const d=document.createElement("div");
  d.className="year-tile";
  d.textContent=y;
  d.onclick=()=>loadYear(y,d);
  box.appendChild(d);
 });
}

function sortByRealDate(matches){
  // Dates are like "Oct 30" -- no year prefix on the string itself,
  // but matches are already returned in source-page order (which is
  // chronological), so a stable sort preserving original order is
  // sufficient here rather than trying to parse "Oct 30" into a
  // real date.
  return matches;
}

function tryPointValue(year){
  // Confirmed real rugby league scoring history: tries were worth 3
  // points before 1983, 4 points from 1983 onwards. Goals have been
  // worth 2 points and field/drop goals 1 point throughout this
  // period, so only the try value needs a year check.
  return year >= 1983 ? 4 : 3;
}

function loadYear(year,btn){
 document.querySelectorAll(".year-tile").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 const out=document.getElementById("output");
 out.innerHTML="<div style='text-align:center;padding:30px;color:var(--muted);'>Loading...</div>";

 fetch(`data/rlwc/${year}.json`).then(r=>r.json()).then(matches=>{
   out.innerHTML="";
   buildSummary(year, matches, out);
   buildMatches(year, matches, out);
 });
}

/* ---------- SUMMARY ---------- */
function buildSummary(year, matches, out){
 const host = HOSTS[year] || "Unknown";
 const final = matches[matches.length-1];
 const winner = final.home_score > final.away_score ? final.home_team.name
              : final.away_score > final.home_score ? final.away_team.name
              : "Draw";
 const runnerUp = winner === "Draw" ? "" : (winner === final.home_team.name ? final.away_team.name : final.home_team.name);

 // Top scorer for this tournament: aggregate every resolved scorer's
 // tries/goals/field goals across all matches, using the historically
 // correct try point value for this year.
 const tryPts = tryPointValue(Number(year));
 const points = {};
 matches.forEach(m=>{
  [m.home_scorers, m.away_scorers].forEach(group=>{
   if(!group) return;
   group.tries.forEach(e=>{ const n=e.full_name||e.player; points[n]=(points[n]||0)+e.count*tryPts; });
   group.goals.forEach(e=>{ const n=e.full_name||e.player; points[n]=(points[n]||0)+e.count*2; });
   group.field_goals.forEach(e=>{ const n=e.full_name||e.player; points[n]=(points[n]||0)+e.count*1; });
  });
 });
 const topScorers = Object.entries(points).sort((a,b)=>b[1]-a[1]).slice(0,5);

 const summary=document.createElement("div");
 summary.className="summary";
 summary.innerHTML=`
  <h2>${year} Rugby League World Cup Summary</h2>
  <div class="summary-grid">
   <div class="summary-box">Host: ${host}</div>
   <div class="summary-box">Winner: ${winner}</div>
   <div class="summary-box">Runner-up: ${runnerUp||"—"}</div>
   <div class="summary-box">
    Top Scorers:<br>
    ${topScorers.length ? topScorers.map(s=>`${s[0]} – ${s[1]}`).join("<br>") : "None on record"}
   </div>
  </div>
 `;
 out.appendChild(summary);
}

/* ---------- MATCHES ---------- */
function buildMatches(year, matches, out){
 matches.forEach(m=>{
  const div=document.createElement("a");
  div.className="match";
  div.style.display="block";
  div.style.textDecoration="none";
  div.style.color="inherit";
  div.href=`rlwc-match.html?year=${year}&match=${m.match_id}`;

  const result = m.home_score===m.away_score ? "Draw"
               : (m.home_score>m.away_score ? m.home_team.name : m.away_team.name);

  div.innerHTML=`
   <h3>
    <a class="team-link" href="${TEAM_PAGE}?team=${encodeURIComponent(m.home_team.name)}" onclick="event.stopPropagation()">${m.home_team.name}</a>
    ${m.home_score}-${m.away_score}
    <a class="team-link" href="${TEAM_PAGE}?team=${encodeURIComponent(m.away_team.name)}" onclick="event.stopPropagation()">${m.away_team.name}</a>
   </h3>
   <div class="small">${m.round} – ${m.date}, ${year}</div>
   <div class="small">${result==="Draw" ? "Draw" : `Winner: ${result}`}</div>
  `;

  out.appendChild(div);
 });
}

buildYears();

const requestedYear = new URLSearchParams(location.search).get("year");
if(requestedYear && YEARS.includes(Number(requestedYear))){
  const tile = [...document.querySelectorAll(".year-tile")]
    .find(el => el.textContent === String(requestedYear));
  if(tile) loadYear(Number(requestedYear), tile);
}

</script>

</body>
</html>
