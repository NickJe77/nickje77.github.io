<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Star Mile | The Sporting Almanac</title>

<style>
body{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;margin:0;}

.navbar{text-align:center;padding:16px 0;border-bottom:1px solid #ddd;}
.navbar a{margin:0 18px;text-decoration:none;font-size:18px;font-weight:600;color:#0056d6;}
.navbar a:hover{text-decoration:underline;}

.header-hero{
width:100%;
height:320px;
background:url("./images/all-star-mile-header.jpg") center/cover no-repeat;
position:relative;
}
.header-overlay{
position:absolute;
inset:0;
background:linear-gradient(to right,rgba(0,0,0,.6),rgba(0,0,0,.1));
}
.page-title{
position:absolute;
bottom:30px;
left:40px;
font-size:42px;
font-weight:bold;
letter-spacing:2px;
color:white;
}

.content-wrap{
max-width:1200px;
margin:auto;
padding:40px;
}

.intro{
font-size:18px;
line-height:1.6;
color:#333;
margin-bottom:40px;
}

.tile-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:32px;
}

.tile{
position:relative;
overflow:hidden;
border-radius:10px;
cursor:pointer;
background:#f2f2f2;
box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.tile img{
width:100%;
height:100%;
object-fit:cover;
transition:.4s;
}

.tile:hover img{
transform:scale(1.05);
}

.tile-title{
position:absolute;
bottom:0;
width:100%;
padding:14px;
background:linear-gradient(to top,rgba(0,0,0,.75),transparent);
font-size:18px;
font-weight:bold;
color:white;
}
</style>
</head>

</div>

<div class="content-wrap">

<div class="intro">
The All Star Mile is one of Australia’s most unique weight-for-age events, with the field selected by public vote.
Since its inception, the race has produced unforgettable moments and champion performances.
</div>

</div>
