<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Football World Cup – Leaders | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Inter, system-ui, Arial; margin: 0; background: white; }

    .navbar {
      display: flex;
      justify-content: center;
      gap: 22px;
      padding: 16px;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
    }
    .navbar a { color: #0056d6; text-decoration: none; font-size: 18px; }

    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }

    h1 { text-align: center; margin-bottom: 30px; }

    h2 {
      font-size: 17px;
      margin: 0 0 12px;
      color: #111;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .stat-box {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      background: #fafafa;
    }

    .leaders-table { width: 100%; border-collapse: collapse; }

    .leaders-table td {
      padding: 5px 8px;
      vertical-align: middle;
    }

    .leaders-table tr:hover td { background: #f0f4ff; border-radius: 4px; }

    .rank { font-weight: 700; color: #bbb; width: 26px; text-align: center; font-size: 13px; }
    .rank.gold   { color: #c9a200; }
    .rank.silver { color: #888; }
    .rank.bronze { color: #a0522d; }

    .player-name { font-weight: 600; font-size: 14px; }
    .player-cc   { font-size: 11px; color: #999; }

    .count { font-weight: 700; font-size: 15px; text-align: right; white-space: nowrap; }
    .count-goals  { color: #0056d6; }
    .count-yellow { color: #b38a00; }
    .count-red    { color: #cc2200; }

    .card-icon {
      display: inline-block;
      width: 11px; height: 15px;
      border-radius: 2px;
      vertical-align: middle;
    }
    .card-yellow { background: #e6b800; }
    .card-red    { background: #cc2200; }

    /* red cards two-col layout inside box */
    .red-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

    /* hat-tricks */
    .ht-table { width: 100%; border-collapse: collapse; }
    .ht-table th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #888;
      padding: 6px 10px;
      border-bottom: 2px solid #eee;
    }
    .ht-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #f4f4f4;
      vertical-align: middle;
    }
    .ht-table tr:hover td { background: #f7f9ff; }
    .ht-goals-cell { font-weight: 700; font-size: 15px; color: #0056d6; text-align: center; width: 50px; }
    .match-detail  { font-size: 13px; color: #555; }
    .round-badge   { display: inline-block; font-size: 11px; padding: 2px 7px; background: #f0f0f0; border-radius: 10px; color: #555; }
    .year-col      { font-weight: 600; color: #333; white-space: nowrap; }

    @media (max-width: 700px) {
      .stats-grid { grid-template-columns: 1fr; }
      .red-cols   { grid-template-columns: 1fr; }
      .navbar { gap: 12px; font-size: 15px; }
    }
  </style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="football.html">Football</a>
  <a href="football-world-cup.html">World Cup</a>
  <a href="world-cup-countries.html">Countries</a>
</div>

<div class="page-wrap">
  <h1>Football World Cup – Leaders</h1>

  <!-- Scorers + Yellow side by side -->
  <div class="stats-grid">

    <div class="stat-box">
      <h2>Top 15 All-Time Goal Scorers</h2>
      <table class="leaders-table">
        <tbody id="scorers-body"></tbody>
      </table>
    </div>

    <div class="stat-box">
      <h2><span class="card-icon card-yellow"></span> Most Yellow Cards</h2>

    </div>

  </div>

  <!-- Red cards full width, two columns -->
  <div class="stat-box" style="margin-bottom:24px">
    <h2><span class="card-icon card-red"></span> Most Red Cards</h2>
    <div class="red-cols">
      <table class="leaders-table"><tbody id="red-body-1"></tbody></table>
      <table class="leaders-table"><tbody id="red-body-2"></tbody></table>
    </div>
  </div>

  <!-- Hat-tricks -->
  <div class="stat-box">
    <h2>Most Goals in a Single Game (3+)</h2>
    <table class="ht-table">
      <thead>
        <tr>
          <th style="text-align:center">Goals</th>
          <th>Player</th>
          <th>Match</th>
          <th>Round</th>
          <th>Year</th>
        </tr>
      </thead>
      <tbody id="ht-body"></tbody>
    </table>
  </div>

</div>

function rankClass(i) {
  if (i === 0) return 'gold';
  if (i === 1) return 'silver';
  if (i === 2) return 'bronze';
  return '';
}

function renderLeaders(tbodyId, items, valueKey, countClass) {
  const tbody = document.getElementById(tbodyId);
  items.forEach((s, i) => {
    const count = s[valueKey];
    tbody.innerHTML += `
      <tr>
        <td class="rank ${rankClass(i)}">${i+1}</td>
        <td>
          <div class="player-name">${s.player}</div>
          <div class="player-cc">${s.cc}</div>
        </td>
        <td class="count ${countClass}">${count}</td>
      </tr>`;
  });
}

renderLeaders('scorers-body', TOP15, 'goals', 'count-goals');
renderLeaders('yellow-body', TOP_YELLOW, 'count', 'count-yellow');

const half = Math.ceil(TOP_RED.length / 2);
TOP_RED.slice(0, half).forEach((c, i) => {
  document.getElementById('red-body-1').innerHTML += `
    <tr>
      <td class="rank ${rankClass(i)}">${i+1}</td>
      <td><div class="player-name">${c.player}</div><div class="player-cc">${c.cc}</div></td>
      <td class="count count-red">${c.count}</td>
    </tr>`;
});
TOP_RED.slice(half).forEach((c, i) => {
  document.getElementById('red-body-2').innerHTML += `
    <tr>
      <td class="rank ${rankClass(i+half)}">${i+half+1}</td>
      <td><div class="player-name">${c.player}</div><div class="player-cc">${c.cc}</div></td>
      <td class="count count-red">${c.count}</td>
    </tr>`;
});

HATTRICKS.forEach(h => {
  document.getElementById('ht-body').innerHTML += `
    <tr>
      <td class="ht-goals-cell">${h.goals}</td>
      <td><div class="player-name">${h.player}</div><div class="player-cc">${h.cc}</div></td>

      <td class="year-col">${h.year}</td>

});
