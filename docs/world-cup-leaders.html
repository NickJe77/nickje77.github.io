    .match-table tr:hover td { background: #f7f9ff; }
    .match-teams { font-weight: 600; font-size: 14px; }
    .match-meta  { font-size: 12px; color: #888; margin-top: 2px; }
    .round-badge { display: inline-block; font-size: 11px; padding: 2px 7px; background: #f0f0f0; border-radius: 10px; color: #555; }
    .year-col    { font-weight: 600; color: #333; white-space: nowrap; font-size: 14px; }

}
