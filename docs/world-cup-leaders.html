<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Football World Cup – Leaders | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Inter, system-ui, Arial; margin: 0; background: white; }
    .navbar { display: flex; justify-content: center; gap: 22px; padding: 16px; border-bottom: 1px solid #ddd; font-weight: 600; }
    .navbar a { color: #0056d6; text-decoration: none; font-size: 18px; }
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    h1 { text-align: center; margin-bottom: 30px; }
    h2 { font-size: 17px; margin: 0 0 12px; color: #111; display: flex; align-items: center; gap: 7px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
    .stat-box { border: 1px solid #ddd; border-radius: 10px; padding: 20px; background: #fafafa; }
    .leaders-table { width: 100%; border-collapse: collapse; }
    .leaders-table td { padding: 5px 8px; vertical-align: middle; }
    .leaders-table tr:hover td { background: #f0f4ff; }
    .rank { font-weight: 700; color: #bbb; width: 26px; text-align: center; font-size: 13px; }
    .rank.gold   { color: #c9a200; }
    .rank.silver { color: #888; }
    .rank.bronze { color: #a0522d; }
    .player-name { font-weight: 600; font-size: 14px; }
    .player-cc   { font-size: 11px; color: #999; }
    .count { font-weight: 700; font-size: 15px; text-align: right; white-space: nowrap; }
    .count-goals  { color: #0056d6; }
    .count-yellow { color: #b38a00; }
    .count-red    { color: #cc2200; }
    .card-icon { display: inline-block; width: 11px; height: 15px; border-radius: 2px; vertical-align: middle; }
    .card-yellow { background: #e6b800; }
    .card-red    { background: #cc2200; }
    .red-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .match-table { width: 100%; border-collapse: collapse; }
    .match-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #888; padding: 6px 10px; border-bottom: 2px solid #eee; }
    .match-table td { padding: 8px 10px; border-bottom: 1px solid #f4f4f4; vertical-align: middle; }
    .match-table tr:hover td { background: #f7f9ff; }
    .score-badge { font-weight: 700; font-size: 15px; color: #0056d6; white-space: nowrap; }
    .match-teams { font-weight: 600; font-size: 14px; }
    .match-meta  { font-size: 12px; color: #888; margin-top: 2px; }
    .round-badge { display: inline-block; font-size: 11px; padding: 2px 7px; background: #f0f0f0; border-radius: 10px; color: #555; }
    .year-col    { font-weight: 600; color: #333; white-space: nowrap; font-size: 14px; }
    .margin-col  { font-weight: 700; font-size: 15px; color: #cc2200; white-space: nowrap; }
    .total-col   { font-weight: 700; font-size: 15px; color: #0056d6; white-space: nowrap; }
    .ht-goals-cell { font-weight: 700; font-size: 15px; color: #0056d6; text-align: center; width: 50px; }
    @media (max-width: 700px) {
      .stats-grid { grid-template-columns: 1fr; }
      .red-cols   { grid-template-columns: 1fr; }
      .navbar { gap: 12px; font-size: 15px; }
    }
  </style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="football.html">Football</a>
  <a href="football-world-cup.html">World Cup</a>
  <a href="world-cup-countries.html">Countries</a>
</div>

<div class="page-wrap">
  <h1>Football World Cup – Leaders</h1>

  <div class="stats-grid">
    <div class="stat-box">
      <h2>Top 15 All-Time Goal Scorers</h2>
      <table class="leaders-table"><tbody id="scorers-body"></tbody></table>
    </div>
    <div class="stat-box">
      <h2><span class="card-icon card-yellow"></span> Most Yellow Cards</h2>
      <table class="leaders-table"><tbody id="yellow-body"></tbody></table>
    </div>
  </div>

  <div class="stat-box" style="margin-bottom:24px">
    <h2><span class="card-icon card-red"></span> Most Red Cards</h2>
    <div class="red-cols">
      <table class="leaders-table"><tbody id="red-body-1"></tbody></table>
      <table class="leaders-table"><tbody id="red-body-2"></tbody></table>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <h2>Highest Scoring Games</h2>
      <table class="match-table">
        <thead><tr><th>Total</th><th>Match</th><th>Year</th></tr></thead>
        <tbody id="high-scoring-body"></tbody>
      </table>
    </div>
    <div class="stat-box">
      <h2>Biggest Wins</h2>
      <table class="match-table">
        <thead><tr><th>Margin</th><th>Match</th><th>Year</th></tr></thead>
        <tbody id="biggest-wins-body"></tbody>
      </table>
    </div>
  </div>

  <div class="stat-box" style="margin-top:24px">
    <h2>Most Goals in a Single Game (3+)</h2>
    <table class="match-table">
      <thead>
        <tr>
          <th style="text-align:center">Goals</th>
          <th>Player</th>
          <th>Match</th>
          <th>Round</th>
          <th>Year</th>
        </tr>
      </thead>
      <tbody id="ht-body"></tbody>
    </table>
  </div>

</div>

<script>
const DATA_URL = "https://nickje77.github.io/docs/data/world-cup.json";

function parseScore(s) {
  const m = String(s).match(/(\d+)\s*[-–]\s*(\d+)/);
  return m ? [parseInt(m[1]), parseInt(m[2])] : [null, null];
}

function parseCardPerson(s) {
  s = (s || "").trim();
  if (!s) return null;
  const cc = (s.match(/\(([A-Z]{2,4})\)/) || [])[1] || "";
  const name = s.replace(/\s*\([^)]*\)/g, "").trim();
  return { name, cc };
}

function rankClass(i) {
  return i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "";
}

async function init() {
  let raw;
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.url}`);
    raw = await res.json();
  } catch (err) {
    document.querySelector(".page-wrap").insertAdjacentHTML("afterbegin",
      `<div style="background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:16px;margin-bottom:24px;color:#856404;">
        <strong>Failed to load data:</strong> ${err.message}<br>
        <small>Check that <code>${DATA_URL}</code> is accessible and returns valid JSON.</small>
      </div>`);
    return;
  }

  // ── group into matches ──────────────────────────────────────
  const matches = [];
  let cur = null;
  for (const row of raw) {
    if (row["Team"] && row["Final Score"]) {
      cur = {
        year:    row["Year"],
        round:   row["Round"],
        team1:   row["Team"],
        team2:   row["Team__1"],
        score:   row["Final Score"],
        winner:  row["Winnning Team"] || "",
        goals:   [],
        yellows: [],
        reds:    [],
      };
      matches.push(cur);
    }
    if (!cur) continue;
    if (row["Scorers"]) {
      const s = row["Scorers"].trim();
      const og = /\(og\)/i.test(s);
      const cc = (s.match(/\(([A-Z]{2,4})\)/) || [])[1] || "";
      const name = s.replace(/\s*\([^)]*\)/g, "").trim();
      const min = row["Time scored"] || null;
      cur.goals.push({ name, cc, og, min });
    }
    if (row["Yellow Cards"]) {
      const p = parseCardPerson(row["Yellow Cards"]);
      if (p) cur.yellows.push(p);
    }
    if (row["Red Cards"]) {
      const p = parseCardPerson(row["Red Cards"]);
      if (p) cur.reds.push(p);
    }
  }

  // ── aggregate players ───────────────────────────────────────
  const scorers  = {};   // name → { goals, cc }
  const yellows  = {};
  const reds     = {};

  for (const m of matches) {
    for (const g of m.goals) {
      if (g.og) continue;
      if (!scorers[g.name]) scorers[g.name] = { goals: 0, cc: g.cc };
      scorers[g.name].goals++;
    }
    for (const c of m.yellows) {
      if (!yellows[c.name]) yellows[c.name] = { count: 0, cc: c.cc };
      yellows[c.name].count++;
    }
    for (const c of m.reds) {
      if (!reds[c.name]) reds[c.name] = { count: 0, cc: c.cc };
      reds[c.name].count++;
    }
  }

  const TOP15 = Object.entries(scorers)
    .map(([player, d]) => ({ player, ...d }))
    .sort((a, b) => b.goals - a.goals)
    .slice(0, 15);

  const TOP_YELLOW = Object.entries(yellows)
    .map(([player, d]) => ({ player, ...d }))
    .sort((a, b) => b.count - a.count)
    .slice(0, 15);

  const TOP_RED = Object.entries(reds)
    .map(([player, d]) => ({ player, ...d }))
    .sort((a, b) => b.count - a.count);

  // ── high scoring + biggest wins ─────────────────────────────
  const scoredMatches = matches
    .map(m => { const [a, b] = parseScore(m.score); return { ...m, a, b }; })
    .filter(m => m.a !== null);

  const HIGH_SCORING = [...scoredMatches]
    .sort((x, y) => (y.a + y.b) - (x.a + x.b))
    .slice(0, 15)
    .map(m => ({
      total: m.a + m.b, score: m.score,
      team1: m.team1, team2: m.team2, year: m.year, round: m.round
    }));

  const BIGGEST_WINS = [...scoredMatches]
    .sort((x, y) => Math.abs(y.a - y.b) - Math.abs(x.a - x.b))
    .slice(0, 15)
    .map(m => ({
      margin: Math.abs(m.a - m.b), score: m.score,
      winner: m.a >= m.b ? m.team1 : m.team2,
      loser:  m.a >= m.b ? m.team2 : m.team1,
      year: m.year, round: m.round
    }));

  // ── hat-tricks (3+ goals in one match) ─────────────────────
  const htMap = {};  // "name|year|team1|team2" → entry
  for (const m of matches) {
    const playerGoals = {};
    for (const g of m.goals) {
      if (g.og) continue;
      if (!playerGoals[g.name]) playerGoals[g.name] = { count: 0, cc: g.cc };
      playerGoals[g.name].count++;
    }
    for (const [name, d] of Object.entries(playerGoals)) {
      if (d.count >= 3) {
        const key = `${name}|${m.year}|${m.team1}|${m.team2}`;
        if (!htMap[key]) {
          htMap[key] = {
            player: name, cc: d.cc, goals: d.count,
            year: m.year, team1: m.team1, team2: m.team2, round: m.round
          };
        }
      }
    }
  }
  const HATTRICKS = Object.values(htMap)
    .sort((a, b) => b.goals - a.goals || b.year - a.year);

  // ── render ──────────────────────────────────────────────────
  function leaderRow(i, player, cc, value, countClass) {
    return `<tr>
      <td class="rank ${rankClass(i)}">${i+1}</td>
      <td><div class="player-name">${player}</div><div class="player-cc">${cc}</div></td>
      <td class="count ${countClass}">${value}</td>
    </tr>`;
  }

  document.getElementById("scorers-body").innerHTML =
    TOP15.map((s, i) => leaderRow(i, s.player, s.cc, s.goals, "count-goals")).join("");

  document.getElementById("yellow-body").innerHTML =
    TOP_YELLOW.map((s, i) => leaderRow(i, s.player, s.cc, s.count, "count-yellow")).join("");

  const half = Math.ceil(TOP_RED.length / 2);
  document.getElementById("red-body-1").innerHTML =
    TOP_RED.slice(0, half).map((c, i) => leaderRow(i, c.player, c.cc, c.count, "count-red")).join("");
  document.getElementById("red-body-2").innerHTML =
    TOP_RED.slice(half).map((c, i) => leaderRow(i + half, c.player, c.cc, c.count, "count-red")).join("");

  document.getElementById("high-scoring-body").innerHTML =
    HIGH_SCORING.map((m, i) => `<tr>
      <td class="rank ${rankClass(i)}">${i+1}</td>
      <td class="total-col">${m.total}</td>
      <td>
        <div class="match-teams">${m.team1} <strong>${m.score}</strong> ${m.team2}</div>
        <div class="match-meta"><span class="round-badge">${m.round}</span></div>
      </td>
      <td class="year-col">${m.year}</td>
    </tr>`).join("");

  document.getElementById("biggest-wins-body").innerHTML =
    BIGGEST_WINS.map((m, i) => `<tr>
      <td class="rank ${rankClass(i)}">${i+1}</td>
      <td class="margin-col">+${m.margin}</td>
      <td>
        <div class="match-teams">${m.winner} <strong>${m.score}</strong> ${m.loser}</div>
        <div class="match-meta"><span class="round-badge">${m.round}</span></div>
      </td>
      <td class="year-col">${m.year}</td>
    </tr>`).join("");

  document.getElementById("ht-body").innerHTML =
    HATTRICKS.map(h => `<tr>
      <td class="ht-goals-cell">${h.goals}</td>
      <td><div class="player-name">${h.player}</div><div class="player-cc">${h.cc}</div></td>
      <td>${h.team1} vs ${h.team2}</td>
      <td><span class="round-badge">${h.round}</span></td>
      <td class="year-col">${h.year}</td>
    </tr>`).join("");
}

init();
</script>
</body>
</html>
