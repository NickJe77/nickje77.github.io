<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Olympic Athlete | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui,Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{text-align:center;margin-bottom:10px;}
h2{text-align:center;margin-top:30px;}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

/* SUMMARY BOX */
.summary{
  max-width:600px;
  margin:20px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  text-align:center;
  gap:10px;
}

.card{
  background:#f5f7ff;
  padding:12px;
  border-radius:8px;
  font-weight:600;
}

.card span{
  display:block;
  font-size:22px;
  margin-top:5px;
}

/* TABLE */
table{
  width:100%;
  max-width:900px;
  margin:20px auto;
  border-collapse:collapse;
}

/* HEADER */
th{
  background:#111;
  color:#fff;
  padding:10px;
  text-align:center;
}

/* CELLS */
td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

/* LEFT ALIGN EVENT */
td.event{
  text-align:left;
}

/* STRIPES */
tbody tr:nth-child(even){
  background:#f2f6ff;
}

tr:hover{
  background:#e6edff;
}

/* MEDAL COLORS */
.gold{color:#c9a400;font-weight:700;}
.silver{color:#888;font-weight:700;}
.bronze{color:#b87333;font-weight:700;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./olympics.html">Olympics</a>
  <a href="./olympics-athletes.html">Athletes</a>
</div>

<h1 id="name">Loading...</h1>

<div class="summary" id="summary"></div>

<h2>Medal History</h2>

<table>
<thead>
<tr>
  <th>Year</th>
  <th>Sport</th>
  <th>Event</th>
  <th>Medal</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>

<script>

/* GET NAME FROM URL */
const params = new URLSearchParams(window.location.search);
const athleteName = decodeURIComponent(params.get("name") || "").trim();

document.getElementById("name").innerText = athleteName || "Unknown Athlete";

/* LOAD DATA */
fetch("/data/olympics/summer_olympic_medals.json")
.then(r => r.json())
.then(data => build(data));

/* CLEAN */
function clean(v){
  return (v || "").toString().trim();
}

/* BUILD */
function build(data){

  let rows = data.filter(r => clean(r.athlete) === athleteName);

  /* SORT BY YEAR */
  rows.sort((a,b)=> a.year - b.year);

  /* TOTALS */
  let gold = 0, silver = 0, bronze = 0;

  rows.forEach(r=>{
    const m = (r.medal || "").toUpperCase();
    if(m==="GOLD") gold++;
    if(m==="SILVER") silver++;
    if(m==="BRONZE") bronze++;
  });

  const total = gold + silver + bronze;

  renderSummary(gold, silver, bronze, total);
  renderTable(rows);
}

/* SUMMARY */
function renderSummary(g,s,b,t){

  const el = document.getElementById("summary");

  el.innerHTML = `
    <div class="card">Gold <span>${g}</span></div>
    <div class="card">Silver <span>${s}</span></div>
    <div class="card">Bronze <span>${b}</span></div>
    <div class="card">Total <span>${t}</span></div>
  `;
}

/* TABLE */
function renderTable(rows){

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  rows.forEach(r=>{

    const medal = (r.medal || "").toUpperCase();

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${r.year}</td>
      <td>${clean(r.sport)}</td>
      <td class="event">${clean(r.event)}</td>
      <td class="${medal.toLowerCase()}">${medal}</td>
    `;

    tbody.appendChild(tr);
  });

}

</script>

</body>
</html>
