<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Athlete | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui,Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{text-align:center;}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

/* SECTION */
.section{
  max-width:800px;
  margin:30px auto;
  text-align:center;
}

/* HEADERS */
h2{
  border-bottom:2px solid #eee;
  padding-bottom:6px;
  margin-bottom:15px;
}

/* SUMMARY BOX */
.summary{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-top:20px;
}

.stat{
  text-align:center;
}

.stat span{
  display:block;
  font-size:22px;
  font-weight:bold;
}

/* TABLE */
table{
  width:100%;
  max-width:700px;
  margin:10px auto;
  border-collapse:collapse;
}

th{
  background:#111;
  color:#fff;
  padding:10px;
  text-align:center;
}

td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

td:first-child{
  text-align:left;
}

/* STRIPING */
tbody tr:nth-child(even){
  background:#f2f6ff;
}

/* MEDAL COLORS */
.gold{color:#d4af37;font-weight:600;}
.silver{color:#888;}
.bronze{color:#cd7f32;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./olympics.html">Olympics</a>
</div>

<h1 id="name"></h1>

<!-- SUMMARY -->
<div class="section">
  <h2>Career Summary</h2>
  <div class="summary">
    <div class="stat">Gold<span id="gold">0</span></div>
    <div class="stat">Silver<span id="silver">0</span></div>
    <div class="stat">Bronze<span id="bronze">0</span></div>
    <div class="stat">Total<span id="total">0</span></div>
  </div>
</div>

<!-- MEDALS BY YEAR -->
<div class="section">
  <h2>Medals by Year</h2>
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Gold</th>
        <th>Silver</th>
        <th>Bronze</th>
      </tr>
    </thead>
    <tbody id="years"></tbody>
  </table>
</div>

<!-- EVENTS -->
<div class="section">
  <h2>Events</h2>
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Event</th>
        <th>Medal</th>
      </tr>
    </thead>
    <tbody id="events"></tbody>
  </table>
</div>

<script>

/* GET NAME */
const params = new URLSearchParams(window.location.search);
const athleteName = decodeURIComponent(params.get("name") || "");

document.getElementById("name").textContent = athleteName;

/* CLEAN */
function cleanName(name){
  return (name || "").trim();
}

fetch("/data/olympics/athletes.json")
.then(r=>r.json())
.then(data=>build(data));

function build(data){

  const athlete = data.filter(a =>
    cleanName(a.Name || a.name) === athleteName
  );

  let gold = 0, silver = 0, bronze = 0;

  const yearMap = {};

  const eventsBody = document.getElementById("events");

  athlete.forEach(a=>{

    const year = a.Year;
    const event = a.Event || "Unknown";

    /* DETECT MEDAL */
    let medal = "";

    if(a.Medal){
      medal = a.Medal;
    } else {
      if(a.Gold) medal = "Gold";
      if(a.Silver) medal = "Silver";
      if(a.Bronze) medal = "Bronze";
    }

    if(!medal) return;

    /* TOTALS */
    if(medal === "Gold") gold++;
    if(medal === "Silver") silver++;
    if(medal === "Bronze") bronze++;

    /* YEAR MAP */
    if(!yearMap[year]){
      yearMap[year] = {gold:0,silver:0,bronze:0};
    }

    if(medal === "Gold") yearMap[year].gold++;
    if(medal === "Silver") yearMap[year].silver++;
    if(medal === "Bronze") yearMap[year].bronze++;

    /* EVENTS TABLE */
    const tr = document.createElement("tr");

    let cls = medal.toLowerCase();

    tr.innerHTML = `
      <td>${year}</td>
      <td>${event}</td>
      <td class="${cls}">${medal}</td>
    `;

    eventsBody.appendChild(tr);

  });

  /* SUMMARY */
  document.getElementById("gold").textContent = gold;
  document.getElementById("silver").textContent = silver;
  document.getElementById("bronze").textContent = bronze;
  document.getElementById("total").textContent = gold + silver + bronze;

  /* YEARS TABLE */
  const yearsBody = document.getElementById("years");

  Object.entries(yearMap)
    .sort((a,b)=>b[0]-a[0])
    .forEach(([year,data])=>{

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${year}</td>
        <td>${data.gold}</td>
        <td>${data.silver}</td>
        <td>${data.bronze}</td>
      `;

      yearsBody.appendChild(tr);

    });

}

</script>

</body>
</html>
