<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>UCL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#eef1f5;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.hero{
padding:50px 20px;
text-align:center;
color:white;
position:relative;
}

.hero h1{
margin:0;
font-size:60px;
font-weight:900;
line-height:1;
}

.hero p{
margin-top:14px;
font-size:20px;
font-weight:700;
opacity:.95;
}

.search-wrap{
max-width:520px;
margin:28px auto 0;
position:relative;
}

.search-input{
width:100%;
padding:16px 18px;
border-radius:14px;
border:none;
font-size:18px;
font-weight:700;
box-sizing:border-box;
outline:none;
}

.search-results{
position:absolute;
top:100%;
left:0;
right:0;
background:white;
border-radius:0 0 14px 14px;
overflow:hidden;
box-shadow:0 8px 24px rgba(0,0,0,.18);
z-index:999;
display:none;
}

.search-item{
padding:14px 18px;
border-bottom:1px solid #eee;
cursor:pointer;
font-weight:700;
color:#111;
}

.search-item:hover{
background:#f3f6fb;
}

.search-item small{
color:#666;
font-weight:600;
margin-left:8px;
}

.container{
max-width:1500px;
margin:28px auto;
padding:0 20px 60px;
}

.section{
background:white;
border-radius:22px;
padding:26px;
margin-bottom:30px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.section-title{
font-size:18px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
margin-bottom:22px;
color:#666;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:18px;
}

.stat-card{
background:#f4f7fb;
border-radius:18px;
padding:24px;
text-align:center;
border:1px solid #dde3ea;
}

.stat-value{
font-size:42px;
font-weight:900;
line-height:1;
margin-bottom:10px;
}

.stat-label{
font-size:15px;
font-weight:700;
color:#555;
}

select{
padding:12px 16px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
font-weight:800;
background:white;
min-width:260px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#e8edf3;
padding:16px;
text-align:left;
font-size:13px;
font-weight:900;
text-transform:uppercase;
}

td{
padding:16px;
border-bottom:1px solid #ececec;
font-size:15px;
font-weight:600;
text-align:left;
}

tr:nth-child(even){
background:#f8fbff;
}

.team-link{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.team-link:hover{
text-decoration:underline;
}

.loading,
.error{
padding:120px 20px;
text-align:center;
font-size:32px;
font-weight:900;
}

.error{
color:#d90429;
}

@media(max-width:900px){
.hero h1{ font-size:40px; }
.hero p{ font-size:16px; }
.search-input{ font-size:16px; }
.stat-value{ font-size:34px; }
table{ display:block; overflow-x:auto; white-space:nowrap; }
}

</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/ucl.html">UCL</a>
  <a href="/ucl-teams.html">Teams</a>
  <a href="/ucl-players.html">Players</a>
  <a href="/epl.html">EPL</a>
  <a href="/nba.html">NBA</a>
  <a href="/afl.html">AFL</a>
</div>

<div id="page">
<div class="loading">Loading Player...</div>
</div>

<script>

const TEAM_COLOURS = {
"AC Milan":"linear-gradient(135deg,#FB090B,#000000)",
"Ajax":"linear-gradient(135deg,#D2122E,#FFFFFF)",
"Anderlecht":"linear-gradient(135deg,#6B2D8B,#FFFFFF)",
"Arsenal":"linear-gradient(135deg,#EF0107,#9C0000)",
"Atletico Madrid":"linear-gradient(135deg,#CB3524,#FFFFFF)",
"Barcelona":"linear-gradient(135deg,#A50044,#004D98)",
"Basel":"linear-gradient(135deg,#E4002B,#0033A0)",
"Bayern Munich":"linear-gradient(135deg,#DC052D,#FFFFFF)",
"Benfica":"linear-gradient(135deg,#D4001A,#FFFFFF)",
"Borussia Dortmund":"linear-gradient(135deg,#FDE100,#000000)",
"Borussia Mönchengladbach":"linear-gradient(135deg,#000000,#FFFFFF)",
"Celtic":"linear-gradient(135deg,#16973B,#FFFFFF)",
"Chelsea":"linear-gradient(135deg,#034694,#001C58)",
"Club Brugge":"linear-gradient(135deg,#1A3E6C,#000000)",
"CSKA Moscow":"linear-gradient(135deg,#D4002D,#003DA5)",
"Deportivo La Coruña":"linear-gradient(135deg,#FFFFFF,#005CA9)",
"Dynamo Kyiv":"linear-gradient(135deg,#003087,#FFFFFF)",
"Eintracht Frankfurt":"linear-gradient(135deg,#E1000F,#000000)",
"Feyenoord":"linear-gradient(135deg,#C8102E,#000000)",
"Fiorentina":"linear-gradient(135deg,#4B0082,#FFFFFF)",
"Galatasaray":"linear-gradient(135deg,#FFC300,#C8102E)",
"Internazionale":"linear-gradient(135deg,#010E80,#000000)",
"Juventus":"linear-gradient(135deg,#000000,#FFFFFF)",
"Kaiserslautern":"linear-gradient(135deg,#E4001C,#FFFFFF)",
"Lazio":"linear-gradient(135deg,#87CEEB,#FFFFFF)",
"Leeds United":"linear-gradient(135deg,#1D428A,#FFCD00)",
"Leicester City":"linear-gradient(135deg,#003090,#FDBE11)",
"Leverkusen":"linear-gradient(135deg,#E32221,#000000)",
"Liverpool":"linear-gradient(135deg,#C8102E,#00B2A9)",
"Lyon":"linear-gradient(135deg,#D4001A,#003DA5)",
"Manchester City":"linear-gradient(135deg,#6CABDD,#1C2C5B)",
"Manchester United":"linear-gradient(135deg,#DA291C,#8B0000)",
"Marseille":"linear-gradient(135deg,#009BDE,#FFFFFF)",
"Monaco":"linear-gradient(135deg,#D4002D,#FFFFFF)",
"Napoli":"linear-gradient(135deg,#12A0C7,#FFFFFF)",
"Olympiakos":"linear-gradient(135deg,#D4002D,#FFFFFF)",
"Paris Saint-Germain":"linear-gradient(135deg,#003170,#DA291C)",
"Porto":"linear-gradient(135deg,#003DA5,#FFFFFF)",
"PSV Eindhoven":"linear-gradient(135deg,#E4002B,#FFFFFF)",
"Rangers":"linear-gradient(135deg,#003087,#FFFFFF)",
"Real Madrid":"linear-gradient(135deg,#FEBE10,#FFFFFF)",
"Red Bull Salzburg":"linear-gradient(135deg,#D4002D,#FFFFFF)",
"Roma":"linear-gradient(135deg,#8B0000,#F5C518)",
"Schalke 04":"linear-gradient(135deg,#004D9D,#FFFFFF)",
"Sevilla":"linear-gradient(135deg,#C8102E,#FFFFFF)",
"Shakhtar Donetsk":"linear-gradient(135deg,#F4A100,#000000)",
"Sparta Prague":"linear-gradient(135deg,#AC2025,#FFFFFF)",
"Sporting CP":"linear-gradient(135deg,#006600,#FFFFFF)",
"Tottenham Hotspur":"linear-gradient(135deg,#132257,#FFFFFF)",
"Valencia":"linear-gradient(135deg,#000000,#F5A623)",
"Villarreal":"linear-gradient(135deg,#FFD700,#005BAC)",
"Werder Bremen":"linear-gradient(135deg,#1D6F42,#FFFFFF)",
"Zenit St. Petersburg":"linear-gradient(135deg,#003DA5,#FFFFFF)"
};

function slugify(str){
    return (str || '')
        .toLowerCase()
        .replace(/&/g,'and')
        .replace(/[^a-z0-9]+/g,'-')
        .replace(/^-|-$/g,'');
}

function playerSlug(p){
    const name      = slugify(p.name || '');
    const firstTeam = slugify((p.teams && p.teams[0]) || '');
    return firstTeam ? `${name}--${firstTeam}` : name;
}

function allPlayerSlugs(p){
    const name = slugify(p.name || '');
    const slugs = new Set();
    slugs.add(name);
    (p.teams || []).forEach(t => slugs.add(`${name}--${slugify(t)}`));
    return slugs;
}

const params    = new URLSearchParams(window.location.search);
const slugParam = params.get("player") || '';
const page      = document.getElementById("page");

async function loadPlayer(){

    try{

        page.innerHTML = '<div class="loading">Loading player data...</div>';

        const res = await fetch("/data/ucl/players.json");
        if(!res.ok) throw new Error(`players.json returned ${res.status}`);
        const players = await res.json();

        // Try all possible slugs for each player
        let player = players.find(p => allPlayerSlugs(p).has(slugParam));

        // Fallback: match just the name part before --
        if(!player){
            const namePart = slugParam.split('--')[0];
            player = players.find(p => slugify(p.name) === namePart);
        }

        if(!player){
            page.innerHTML = `<div class="error">Player Not Found</div>`;
            return;
        }

        const playerDisplayName = player.name;
        const currentTeam       = (player.teams && player.teams[player.teams.length - 1]) || "Unknown";
        const heroGradient      = TEAM_COLOURS[currentTeam] || 'linear-gradient(135deg,#001489,#0a3ccc)';

        page.innerHTML = `
            <div class="hero" style="background:${heroGradient};">
                <h1>${playerDisplayName}</h1>
                <p>Champions League Player Profile</p>
                <div class="search-wrap">
                    <input type="text" class="search-input" id="playerSearch"
                           placeholder="Search player..." autocomplete="off">
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>

            <div class="container">

                <div class="section">
                    <div class="section-title">Career Summary</div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" style="font-size:22px;">${currentTeam}</div>
                            <div class="stat-label">Club</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.seasons ? player.seasons.length : 0}</div>
                            <div class="stat-label">Seasons</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.goals || 0}</div>
                            <div class="stat-label">Goals</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.penalties || 0}</div>
                            <div class="stat-label">Penalties</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.yellow_cards || 0}</div>
                            <div class="stat-label">Yellow Cards</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.red_cards || 0}</div>
                            <div class="stat-label">Red Cards</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Season by Season</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Season</th>
                                <th>Team</th>
                                <th>Games</th>
                                <th>Goals</th>
                                <th>Penalties</th>
                                <th>Yellow Cards</th>
                                <th>Red Cards</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(player.season_stats || []).map(s => `
                                <tr>
                                    <td><a class="team-link" href="/ucl-season.html?season=${s.season}">${s.season}</a></td>
                                    <td>${s.team || ''}</td>
                                    <td>${s.games || 0}</td>
                                    <td>${s.goals || 0}</td>
                                    <td>${s.penalties || 0}</td>
                                    <td>${s.yellow_cards || 0}</td>
                                    <td>${s.red_cards || 0}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

            </div>
        `;

        const playerSearch  = document.getElementById("playerSearch");
        const searchResults = document.getElementById("searchResults");

        playerSearch.addEventListener("input", () => {
            const value = playerSearch.value.toLowerCase().trim();
            if(!value){ searchResults.style.display = "none"; return; }

            const matches = players
                .filter(p => (p.name || '').toLowerCase().includes(value))
                .slice(0, 8);

            if(!matches.length){ searchResults.style.display = "none"; return; }

            searchResults.innerHTML = matches.map(p => `
                <div class="search-item"
                     onclick="window.location.href='/ucl-player.html?player=${encodeURIComponent(playerSlug(p))}'">
                    ${p.name}
                    <small>${(p.teams && p.teams[0]) || ''}</small>
                </div>
            `).join('');

            searchResults.style.display = "block";
        });

        document.addEventListener("click", e => {
            if(!e.target.closest(".search-wrap")) searchResults.style.display = "none";
        });

    }catch(err){
        console.error(err);
        page.innerHTML = `<div class="error">Failed To Load Player Data</div>`;
    }

}

loadPlayer();

</script>

</body>
</html>
