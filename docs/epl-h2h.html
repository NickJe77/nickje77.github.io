<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#eef1f5;color:#111;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:white;border-bottom:1px solid #ddd;flex-wrap:wrap;}
.navbar a{text-decoration:none;font-weight:800;color:#0056d6;}
.hero{background:linear-gradient(135deg,#1a1a2e,#16213e);color:white;padding:50px 20px;text-align:center;}
.hero h1{margin:0;font-size:48px;font-weight:900;}
.hero p{margin-top:10px;font-size:16px;opacity:.85;}
.picker{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:30px;}
.picker select{padding:14px 18px;border-radius:12px;border:none;font-size:16px;font-weight:800;min-width:240px;background:white;color:#111;}
.vs{font-size:28px;font-weight:900;color:white;}
.btn{padding:14px 32px;border-radius:12px;border:none;background:#963cff;color:white;font-size:16px;font-weight:900;cursor:pointer;transition:.2s;}
.btn:hover{background:#7b2fd4;}
.container{max-width:1400px;margin:30px auto;padding:0 20px 60px;}
.h2h-header{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin-bottom:30px;}
.team-banner{border-radius:20px;padding:30px 20px;text-align:center;color:white;}
.team-banner h2{margin:0;font-size:36px;font-weight:900;}
.team-banner p{margin:6px 0 0;font-size:14px;opacity:.85;}
.h2h-score{background:white;border-radius:20px;padding:24px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08);}
.h2h-score-nums{display:flex;justify-content:center;align-items:center;gap:16px;font-size:52px;font-weight:900;line-height:1;}
.h2h-score-label{font-size:13px;font-weight:900;text-transform:uppercase;color:#888;margin-top:8px;letter-spacing:.5px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:white;border-radius:16px;padding:20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.stat-value{font-size:32px;font-weight:900;line-height:1;margin-bottom:6px;}
.stat-label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#666;}
.section{background:white;border-radius:20px;padding:24px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.section-title{font-size:22px;font-weight:900;margin-bottom:18px;}
.tables-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:24px;}
table{width:100%;border-collapse:collapse;}
th{background:#e9eef5;padding:12px;font-size:12px;font-weight:900;text-transform:uppercase;text-align:left;}
td{padding:12px;border-bottom:1px solid #ececec;font-size:14px;font-weight:700;}
tr:nth-child(even){background:#f8fbff;}
.player-link{text-decoration:none;font-weight:800;color:#0056d6;}
.player-link:hover{text-decoration:underline;}
.games-table tr{cursor:pointer;transition:.15s;}
.games-table tr:hover{background:#dfefff !important;}
.result-win{font-weight:900;color:#008000;font-size:18px;}
.result-loss{font-weight:900;color:#d90429;font-size:18px;}
.result-draw{font-weight:900;color:#d68910;font-size:18px;}
.loading{text-align:center;padding:60px;font-size:20px;color:#666;}
.error{text-align:center;padding:60px;font-size:24px;font-weight:900;color:#d90429;}
.hidden{display:none;}
@media(max-width:900px){
  .hero h1{font-size:32px;}
  .h2h-header{grid-template-columns:1fr;text-align:center;}
  .vs{display:none;}
  .h2h-score-nums{font-size:40px;}
  .team-banner h2{font-size:26px;}
  .picker{flex-direction:column;gap:12px;}
  .picker select{min-width:280px;width:100%;}
  .games-table thead{display:none;}
  .games-table tbody{display:block;}
  .games-table tr{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:12px;border-bottom:2px solid #ddd;background:white !important;}
  .games-table tr:nth-child(even){background:#f8fbff !important;}
  .games-table td{display:block;border:none;padding:4px 8px;font-size:14px;}
  .games-table td:nth-child(4){font-size:22px;text-align:right;}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/epl.html">EPL</a>
  <a href="/epl-teams.html">Teams</a>
  <a href="/epl-players.html">Players</a>
  <a href="/nba.html">NBA</a>
  <a href="/afl.html">AFL</a>
</div>

<div class="hero">
  <h1>Head to Head</h1>
  <p>Compare any two clubs in Premier League history</p>
  <div class="picker">
    <select id="team1Select"><option value="">Select Team 1...</option></select>
    <div class="vs">VS</div>
    <select id="team2Select"><option value="">Select Team 2...</option></select>
    <button class="btn" onclick="loadH2H()">Compare</button>
  </div>
</div>

<div class="container">
  <div id="results" class="hidden"></div>
</div>

<script>

const TEAM_COLOURS = {
  "Arsenal":                  "linear-gradient(135deg,#EF0107,#9C0000)",
  "Aston Villa":              "linear-gradient(135deg,#670E36,#95BFE5)",
  "Barnsley":                 "linear-gradient(135deg,#CC0000,#880000)",
  "Birmingham City":          "linear-gradient(135deg,#0000CC,#000088)",
  "Blackburn Rovers":         "linear-gradient(135deg,#009EE0,#862633)",
  "Blackpool":                "linear-gradient(135deg,#F68712,#CC6600)",
  "Bolton Wanderers":         "linear-gradient(135deg,#263C7E,#111144)",
  "Bradford City":            "linear-gradient(135deg,#862633,#FFBF00)",
  "Brentford":                "linear-gradient(135deg,#E30613,#111111)",
  "Brighton & Hove Albion":   "linear-gradient(135deg,#0057B8,#003380)",
  "Burnley":                  "linear-gradient(135deg,#6C1D45,#99D6EA)",
  "Cardiff City":             "linear-gradient(135deg,#0070B5,#003366)",
  "Charlton Athletic":        "linear-gradient(135deg,#CC0000,#880000)",
  "Chelsea":                  "linear-gradient(135deg,#034694,#001C58)",
  "Coventry City":            "linear-gradient(135deg,#59CAEA,#003366)",
  "Crystal Palace":           "linear-gradient(135deg,#1B458F,#C4122E)",
  "Derby County":             "linear-gradient(135deg,#111111,#333333)",
  "Everton":                  "linear-gradient(135deg,#003399,#001C58)",
  "Fulham":                   "linear-gradient(135deg,#111111,#333333)",
  "Huddersfield Town":        "linear-gradient(135deg,#0E63AD,#003366)",
  "Hull City":                "linear-gradient(135deg,#F5A12D,#000000)",
  "Ipswich Town":             "linear-gradient(135deg,#005BAC,#003366)",
  "Leeds United":             "linear-gradient(135deg,#1D428A,#FFCD00)",
  "Leicester City":           "linear-gradient(135deg,#003090,#FDBE11)",
  "Liverpool":                "linear-gradient(135deg,#C8102E,#00B2A9)",
  "Luton Town":               "linear-gradient(135deg,#F78F1E,#CC6600)",
  "Manchester City":          "linear-gradient(135deg,#6CABDD,#1C2C5B)",
  "Manchester United":        "linear-gradient(135deg,#DA291C,#8B0000)",
  "Manchester Utd":           "linear-gradient(135deg,#DA291C,#8B0000)",
  "Middlesbrough":            "linear-gradient(135deg,#CC0000,#880000)",
  "Newcastle United":         "linear-gradient(135deg,#111111,#444444)",
  "Norwich City":             "linear-gradient(135deg,#00A650,#007733)",
  "Nottingham Forest":        "linear-gradient(135deg,#DD0000,#880000)",
  "Oldham Athletic":          "linear-gradient(135deg,#004B8D,#002244)",
  "Portsmouth":               "linear-gradient(135deg,#001489,#000055)",
  "Queens Park Rangers":      "linear-gradient(135deg,#1D5BA4,#003366)",
  "Reading":                  "linear-gradient(135deg,#004494,#002244)",
  "Sheffield United":         "linear-gradient(135deg,#EE2737,#000000)",
  "Sheffield Wednesday":      "linear-gradient(135deg,#003399,#001166)",
  "Southampton":              "linear-gradient(135deg,#D71920,#880000)",
  "Stoke City":               "linear-gradient(135deg,#E03A3E,#1B2D6B)",
  "Sunderland":               "linear-gradient(135deg,#CC0000,#880000)",
  "Swansea City":             "linear-gradient(135deg,#111111,#333333)",
  "Swindon Town":             "linear-gradient(135deg,#CC0000,#880000)",
  "Tottenham Hotspur":        "linear-gradient(135deg,#132257,#000033)",
  "Watford":                  "linear-gradient(135deg,#FBEE23,#ED2127)",
  "West Bromwich Albion":     "linear-gradient(135deg,#122F67,#000033)",
  "West Ham United":          "linear-gradient(135deg,#7A263A,#1BB1E7)",
  "Wigan Athletic":           "linear-gradient(135deg,#1C5AA8,#003366)",
  "Wimbledon":                "linear-gradient(135deg,#0000CC,#000088)",
  "Wolverhampton Wanderers":  "linear-gradient(135deg,#FDB913,#CC9900)",
  "Wolves":                   "linear-gradient(135deg,#FDB913,#CC9900)"
};

function slugify(str){
  return (str || "")
    .toLowerCase()
    .replace(/&/g,"and")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

let allPlayers   = [];
let allTeamStats = [];

// Load teams and populate dropdowns
async function init(){
  try{
    const [teamsRes, playersRes, statsRes] = await Promise.all([
      fetch("/data/epl/teams.json"),
      fetch("/data/epl/players.json"),
      fetch("/data/epl/team-stats.json")
    ]);
    const teams  = await teamsRes.json();
    allPlayers   = await playersRes.json();
    allTeamStats = await statsRes.json();

    const teamNames = teams.map(t => t.name || t.team).filter(Boolean).sort();
    const sel1 = document.getElementById("team1Select");
    const sel2 = document.getElementById("team2Select");

    teamNames.forEach(name => {
      sel1.innerHTML += `<option value="${name}">${name}</option>`;
      sel2.innerHTML += `<option value="${name}">${name}</option>`;
    });

    // Pre-select from URL params
    const params = new URLSearchParams(window.location.search);
    if(params.get("team1")) sel1.value = params.get("team1");
    if(params.get("team2")) sel2.value = params.get("team2");
    if(params.get("team1") && params.get("team2")) loadH2H();

  }catch(err){
    console.error(err);
  }
}

async function loadH2H(){
  const team1 = document.getElementById("team1Select").value;
  const team2 = document.getElementById("team2Select").value;

  if(!team1 || !team2){
    alert("Please select both teams");
    return;
  }
  if(team1 === team2){
    alert("Please select two different teams");
    return;
  }

  // Update URL
  const url = new URL(window.location);
  url.searchParams.set("team1", team1);
  url.searchParams.set("team2", team2);
  window.history.pushState({}, "", url);

  const results = document.getElementById("results");
  results.className = "";
  results.innerHTML = '<div class="loading">Loading head to head data...</div>';

  try{
    // Try all seasons from 1992-2026
    const allSeasonIds = [];
    for(let y = 1992; y <= 2025; y++) allSeasonIds.push(`${y}-${y+1}`);

    // Fetch all season files and filter for h2h matches
    const seasonData = await Promise.all(allSeasonIds.map(async sid => {
      try{
        const r = await fetch(`/data/epl/seasons/${sid}.json`);
        if(!r.ok) return [];
        const data = await r.json();
        const games = Array.isArray(data) ? data : (data.games || []);
        return games
          .filter(g => (g.home === team1 && g.away === team2) || (g.home === team2 && g.away === team1))
          .map(g => ({...g, season: sid}));
      }catch(e){ return []; }
    }));
    const sharedSeasons = allSeasonIds;

    const h2hGames = seasonData.flat();

    // Calculate stats for each team
    function calcStats(team, opp){
      let wins=0, draws=0, losses=0, goals=0, goalsAgainst=0;
      h2hGames.forEach(g => {
        const isHome = g.home === team;
        const tf = isHome ? Number(g.score_home||0) : Number(g.score_away||0);
        const of = isHome ? Number(g.score_away||0) : Number(g.score_home||0);
        goals += tf;
        goalsAgainst += of;
        if(tf > of) wins++;
        else if(tf < of) losses++;
        else draws++;
      });
      return { wins, draws, losses, goals, goalsAgainst };
    }

    const s1 = calcStats(team1, team2);
    const s2 = calcStats(team2, team1);

    // Top scorers vs each other from players.json season_stats
    function getScorers(team, opponent){
      return allPlayers
        .filter(p => p.teams && p.teams.includes(team))
        .map(p => {
          const goals = (p.season_stats || [])
            .filter(s => s.team === team)
            .reduce((sum, s) => sum + ((s.goals_by_opponent || {})[opponent] || 0), 0);
          return { name: p.name, goals };
        })
        .filter(p => p.goals > 0)
        .sort((a,b) => b.goals - a.goals)
        .slice(0, 10);
    }

    // Card leaders in h2h matches from players.json
    function getCardLeaders(team, cardType){
      return allPlayers
        .filter(p => p.teams && p.teams.includes(team))
        .map(p => {
          const cards = (p.season_stats || [])
            .filter(s => s.team === team && sharedSeasons.includes(s.season))
            .reduce((sum, s) => sum + (s[cardType] || 0), 0);
          return { name: p.name, cards };
        })
        .filter(p => p.cards > 0)
        .sort((a,b) => b.cards - a.cards)
        .slice(0, 10);
    }

    const scorers1   = getScorers(team1, team2);
    const scorers2   = getScorers(team2, team1);
    const yellows1   = getCardLeaders(team1, "yellow_cards");
    const yellows2   = getCardLeaders(team2, "yellow_cards");
    const reds1      = getCardLeaders(team1, "red_cards");
    const reds2      = getCardLeaders(team2, "red_cards");

    const grad1 = TEAM_COLOURS[team1] || 'linear-gradient(135deg,#111,#444)';
    const grad2 = TEAM_COLOURS[team2] || 'linear-gradient(135deg,#111,#444)';

    function scorerRows(list){
      if(!list.length) return `<tr><td colspan="2">No data</td></tr>`;
      return list.map(p => `
        <tr>
          <td><a class="player-link" href="/epl-player.html?player=${encodeURIComponent(slugify(p.name))}">${p.name}</a></td>
          <td>${p.goals}</td>
        </tr>`).join('');
    }

    function cardRows(list){
      if(!list.length) return `<tr><td colspan="2">No data</td></tr>`;
      return list.map(p => `
        <tr>
          <td><a class="player-link" href="/epl-player.html?player=${encodeURIComponent(slugify(p.name))}">${p.name}</a></td>
          <td>${p.cards}</td>
        </tr>`).join('');
    }

    function gameRows(){
      if(!h2hGames.length) return `<tr><td colspan="5">No matches found</td></tr>`;
      return [...h2hGames].reverse().map(g => {
        const t1home = g.home === team1;
        const home = g.home;
        const away = g.away;
        const sh   = Number(g.score_home || 0);
        const sa   = Number(g.score_away || 0);
        const t1g  = t1home ? sh : sa;
        const t2g  = t1home ? sa : sh;
        const res1 = t1g > t2g ? 'W' : t1g < t2g ? 'L' : 'D';
        const cls  = t1g > t2g ? 'result-win' : t1g < t2g ? 'result-loss' : 'result-draw';
        return `
          <tr onclick="window.location.href='/epl-game.html?match=${encodeURIComponent(g.match_id)}&season=${encodeURIComponent(g.season)}'">
            <td>${g.season}</td>
            <td>${home}</td>
            <td>${sh} - ${sa}</td>
            <td>${away}</td>
            <td class="${cls}">${res1}</td>
          </tr>`;
      }).join('');
    }

    results.innerHTML = `

      <div class="h2h-header">
        <div class="team-banner" style="background:${grad1};">
          <h2>${team1}</h2>
          <p>${s1.wins}W ${s1.draws}D ${s1.losses}L</p>
        </div>
        <div class="h2h-score">
          <div class="h2h-score-nums">
            <span style="color:#008000">${s1.wins}</span>
            <span style="color:#888;font-size:32px">-</span>
            <span style="color:#888;font-size:32px">${s1.draws}</span>
            <span style="color:#888;font-size:32px">-</span>
            <span style="color:#d90429">${s2.wins}</span>
          </div>
          <div class="h2h-score-label">${h2hGames.length} meetings</div>
        </div>
        <div class="team-banner" style="background:${grad2};">
          <h2>${team2}</h2>
          <p>${s2.wins}W ${s2.draws}D ${s2.losses}L</p>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value">${h2hGames.length}</div><div class="stat-label">Meetings</div></div>
        <div class="stat-card"><div class="stat-value">${s1.wins}</div><div class="stat-label">${team1} Wins</div></div>
        <div class="stat-card"><div class="stat-value">${s1.draws}</div><div class="stat-label">Draws</div></div>
        <div class="stat-card"><div class="stat-value">${s2.wins}</div><div class="stat-label">${team2} Wins</div></div>
        <div class="stat-card"><div class="stat-value">${s1.goals}</div><div class="stat-label">${team1} Goals</div></div>
        <div class="stat-card"><div class="stat-value">${s2.goals}</div><div class="stat-label">${team2} Goals</div></div>
      </div>

      <div class="tables-grid">
        <div class="section">
          <div class="section-title">⚽ ${team1} Top Scorers</div>
          <table>
            <thead><tr><th>Player</th><th>Goals vs ${team2}</th></tr></thead>
            <tbody>${scorerRows(scorers1)}</tbody>
          </table>
        </div>
        <div class="section">
          <div class="section-title">⚽ ${team2} Top Scorers</div>
          <table>
            <thead><tr><th>Player</th><th>Goals vs ${team1}</th></tr></thead>
            <tbody>${scorerRows(scorers2)}</tbody>
          </table>
        </div>
      </div>

      <div class="tables-grid">
        <div class="section">
          <div class="section-title">🟨 ${team1} Yellow Cards</div>
          <table>
            <thead><tr><th>Player</th><th>Yellow Cards</th></tr></thead>
            <tbody>${cardRows(yellows1)}</tbody>
          </table>
        </div>
        <div class="section">
          <div class="section-title">🟨 ${team2} Yellow Cards</div>
          <table>
            <thead><tr><th>Player</th><th>Yellow Cards</th></tr></thead>
            <tbody>${cardRows(yellows2)}</tbody>
          </table>
        </div>
        <div class="section">
          <div class="section-title">🟥 ${team1} Red Cards</div>
          <table>
            <thead><tr><th>Player</th><th>Red Cards</th></tr></thead>
            <tbody>${cardRows(reds1)}</tbody>
          </table>
        </div>
        <div class="section">
          <div class="section-title">🟥 ${team2} Red Cards</div>
          <table>
            <thead><tr><th>Player</th><th>Red Cards</th></tr></thead>
            <tbody>${cardRows(reds2)}</tbody>
          </table>
        </div>
      </div>

      <div class="section">
        <div class="section-title">All Meetings</div>
        <table class="games-table">
          <thead>
            <tr>
              <th>Season</th>
              <th>Home</th>
              <th>Score</th>
              <th>Away</th>
              <th>${team1} Result</th>
            </tr>
          </thead>
          <tbody>${gameRows()}</tbody>
        </table>
      </div>
    `;

  }catch(err){
    console.error(err);
    results.innerHTML = `<div class="error">Failed to load head to head data</div>`;
  }
}

init();
</script>
</body>
</html>
