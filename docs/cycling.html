<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tour de France | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

<style>

/* MATCH YOUR HOME TILE STYLE */

.home-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  max-width:1100px;
  margin:40px auto;
  padding:0 20px;
}

.home-tile{
  position:relative;
  display:block;
  overflow:hidden;
  border-radius:12px;
}

.home-tile img{
  width:100%;
  aspect-ratio:1 / 1;
  object-fit:cover;
  border-radius:12px;
  transition:transform .25s ease;
}

.home-tile:hover img{
  transform:scale(1.05);
}

.home-overlay{
  position:absolute;
  bottom:0;
  width:100%;
  padding:12px;
  background:linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  color:#fff;
  font-weight:600;
  font-size:16px;
}

/* HEADER */
.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  text-align:center;
  padding:40px 20px;
}

.hero h1{
  margin:0;
  font-size:28px;
}

</style>
</head>

<body>

<div class="hero">
  <h1>Tour de France</h1>
</div>

<div class="home-grid">

  <!-- STAGES -->
  <a href="cycling-stages.html" class="home-tile">
    <img src="https://images.unsplash.com/photo-1505843513577-22bb7d21e455?q=80&w=1200&auto=format&fit=crop">
    <div class="home-overlay">Stages</div>
  </a>

  <!-- RIDERS -->
  <a href="cycling-riders.html" class="home-tile">
    <img src="https://images.unsplash.com/photo-1518655048521-f130df041f66?q=80&w=1200&auto=format&fit=crop">
    <div class="home-overlay">Riders</div>
  </a>

  <!-- GC -->
  <a href="cycling-rankings.html" class="home-tile">
    <img src="https://images.unsplash.com/photo-1521417531039-6d1c6fdbb3c3?q=80&w=1200&auto=format&fit=crop">
    <div class="home-overlay">General Classification</div>
  </a>

</div>

</body>
</html>
