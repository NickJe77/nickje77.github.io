<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tour de France | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

<style>

/* FORCE SAME FONT AS SITE */
body{
  font-family:system-ui, Arial, sans-serif;
  margin:0;
}

/* CENTER NAVBAR LIKE HOME */
.home-nav{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.home-nav a{
  color:#0056d6;
  text-decoration:none;
  font-size:15px;
}

/* GRID */
.home-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  max-width:1100px;
  margin:40px auto;
  padding:0 20px;
}

/* TILE BOXES */
.home-tile{
  display:flex;
  align-items:center;
  justify-content:center;
  height:160px;
  border-radius:12px;
  background:#fff;
  border:1px solid #ddd;
  font-weight:600;
  font-size:18px;
  text-decoration:none;
  color:#000;
  transition:.2s;
}

.home-tile:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* HERO — FRENCH FLAG */
.hero{
  background:linear-gradient(90deg,#0055A4,#ffffff,#EF4135);
  text-align:center;
  padding:40px 20px;
  position:relative;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,255,255,0.3);
  backdrop-filter:blur(6px);
}

.hero h1{
  position:relative;
  margin:0;
  font-size:28px;
  z-index:2;
}

</style>
</head>

<body>

<!-- NAVIGATION -->
<nav class="home-nav">

</nav>

<div class="hero">
  <h1>Tour de France</h1>
</div>

<!-- GRID -->
<div class="home-grid">

    Stages

    Riders

</div>
