<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup – By Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}

.hero h1{
  margin:0;
  font-size:46px;
}

.hero p{
  margin-top:10px;
  font-size:20px;
  opacity:.95;
}

.year-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:12px;
  margin-bottom:25px;
}

.year-btn{
  background:#6a040f;
  color:white;
  border:none;
  padding:12px 0;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
}

.year-btn:hover{
  background:#9d0208;
}

.year-btn.active{
  background:#dc2f02;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}

th{
  background:#f3f6fb;
}

tr:nth-child(even){
  background:#f8fbff;
}

tr:hover{
  background:#eef4ff;
}

.match-link{
  color:#6a040f;
  font-weight:600;
  text-decoration:none;
}

.match-link:hover{
  text-decoration:underline;
}

</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>T20 World Cup – By Season</h1>
  <p>Select a tournament year.</p>
</div>

<div id="yearGrid" class="year-grid"></div>

<h2>Matches</h2>

<table>

<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Venue</th>
<th>Result</th>
</tr>
</thead>

<tbody id="matchesTable"></tbody>

</table>

</div>

<script>

const FILES = [

"t20wc_2007_FULL.json",
"t20wc_2008_FULL.json",
"t20wc_2009_FULL.json",
"t20wc_2010_FULL.json",
"t20wc_2012_FULL.json",
"t20wc_2013_FULL.json",
"t20wc_2014_FULL.json",
"t20wc_2015_FULL.json",
"t20wc_2016_FULL.json",
"t20wc_2019_FULL.json",
"t20wc_2021_FULL.json",
"t20wc_2022_FULL.json",
"t20wc_2024_FULL.json"

];

const BASE_PATH = "data/t20-world-cup/matches/";

let seasons = [];
let currentSeasonIndex = 0;

const yearGrid = document.getElementById("yearGrid");
const tableBody = document.getElementById("matchesTable");


async function init(){

  for(const file of FILES){

    const response = await fetch(BASE_PATH + file);

    const matches = await response.json();

    seasons.push({

      year: file.match(/\d{4}/)[0],

      file: file,

      matches: matches

    });

  }

  seasons.sort((a,b)=> b.year - a.year);

  buildYearButtons();

  showSeason(0);

}


function buildYearButtons(){

  yearGrid.innerHTML = "";

  seasons.forEach((season,index)=>{

    const btn = document.createElement("button");

    btn.className = "year-btn";

    btn.textContent = season.year;

    if(index === 0) btn.classList.add("active");

    btn.onclick = () => {

      document.querySelectorAll(".year-btn")
        .forEach(b=>b.classList.remove("active"));

      btn.classList.add("active");

      showSeason(index);

    };

    yearGrid.appendChild(btn);

  });

}


function showSeason(index){

  currentSeasonIndex = index;

  renderMatches(seasons[index].matches);

}


function renderMatches(matches){

  tableBody.innerHTML = "";

  matches
  .sort((a,b)=> new Date(a.info.dates[0]) - new Date(b.info.dates[0]))
  .forEach((match,matchIndex)=>{

    const date = new Date(match.info.dates[0])
      .toLocaleDateString("en-GB",{

        day:"2-digit",
        month:"short",
        year:"numeric"

      });

    const teams = match.info.teams.join(" vs ");

    const venue = match.info.venue || "—";

    let result = "—";

    if(match.info.outcome?.winner){

      if(match.info.outcome.by?.runs){

        result =
        `${match.info.outcome.winner} won by ${match.info.outcome.by.runs} runs`;

      }

      else if(match.info.outcome.by?.wickets){

        result =
        `${match.info.outcome.winner} won by ${match.info.outcome.by.wickets} wickets`;

      }

    }

    const row = document.createElement("tr");

    row.innerHTML = `

      <td>${date}</td>

      <td>
        <a class="match-link"
           href="t20wc-match.html?season=${currentSeasonIndex}&match=${matchIndex}">
          ${teams}
        </a>
      </td>

      <td>${venue}</td>

      <td>${result}</td>

    `;

    tableBody.appendChild(row);

  });

}


init();

</script>

</body>
</html>
