<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>T20 World Cup | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#8b0000,#e10600);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:25px;
}

.year-grid{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-bottom:18px;
}

.year-btn{
  background:#7a0000;
  color:#fff;
  border:none;
  padding:12px 22px;
  border-radius:12px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
}
.year-btn.active{
  background:#ff3b3b;
}

.match{
  background:#fff;
  padding:16px;
  margin-bottom:12px;
  border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.match a{
  font-weight:800;
  font-size:18px;
  text-decoration:none;
  color:#8b0000;
}

.meta{
  margin-top:4px;
  color:#555;
}
.result{
  margin-top:6px;
  font-weight:600;
  color:#222;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

  <div class="hero">
    <h1>T20 World Cup</h1>
  </div>

  <div class="year-grid" id="yearGrid"></div>
  <div id="matches"></div>

</div>

<script>
const MATCH_PATH="data/t20-world-cup/matches/";
let YEARS=[];   // built from index.json — only years that actually have a data file

function getMatchesArray(data){
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.matches)) return data.matches;
  return [];
}

function deriveTeams(match){
  const info=match?.info || {};
  if(Array.isArray(info.teams) && info.teams.length>=2) return [info.teams[0],info.teams[1]];
  if(info.players){
    const keys=Object.keys(info.players);
    if(keys.length>=2) return [keys[0],keys[1]];
  }
  return ["Unknown","Unknown"];
}

function getMatchYear(match){
  const d=match?.info?.dates?.[0];
  if(!d) return null;
  const m=/^(\d{4})-/.exec(d);
  return m ? Number(m[1]) : null;
}

function describeOutcome(outcome){
  if(!outcome) return "";
  if(outcome.winner){
    if(outcome.by?.runs)    return `${outcome.winner} won by ${outcome.by.runs} run${outcome.by.runs===1?"":"s"}`;
    if(outcome.by?.wickets) return `${outcome.winner} won by ${outcome.by.wickets} wicket${outcome.by.wickets===1?"":"s"}`;
    return `${outcome.winner} won`;
  }
  if(outcome.result){
    let t=outcome.result.charAt(0).toUpperCase()+outcome.result.slice(1);   // Tie / No result
    if(outcome.eliminator) t+=` (${outcome.eliminator} won super over)`;
    return t;
  }
  return "";
}

async function loadYear(year){

  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  const btn=document.querySelector(`button[data-year="${year}"]`);
  if(btn) btn.classList.add("active");

  const file=`${MATCH_PATH}t20wc_${year}_FULL.json`;

  let data;
  try{
    const res=await fetch(file);
    if(!res.ok) throw new Error();
    data=await res.json();
  }catch{
    document.getElementById("matches").innerHTML=`<div class="match">File not found for ${year}</div>`;
    return;
  }

  const allMatches=getMatchesArray(data);

  // Filter by actual date year (in case file isn’t perfectly sorted), then sort by date
  const matches=allMatches.filter(m=>getMatchYear(m)===year);
  const list=(matches.length ? matches : allMatches)
    .slice()
    .sort((a,b)=>String(a.info?.dates?.[0]||"").localeCompare(String(b.info?.dates?.[0]||"")));

  let html="";

  list.forEach(match=>{
    const info=match.info || {};
    const teams=deriveTeams(match);
    const id=info.match_type_number;

    if(!id) return;   // no stable id → can't link to the detail page

    const venue=info.venue || info.city || "";
    const date=info.dates?.[0] || "";
    const result=describeOutcome(info.outcome);

    html+=`
      <div class="match">
        <a href="t20-world-cup-match.html?season=${year}&id=${id}">
          ${teams[0]} vs ${teams[1]}
        </a>
        <div class="meta">${venue}</div>
        <div class="meta">${date}</div>
        ${result ? `<div class="result">${result}</div>` : ""}
      </div>
    `;
  });

  document.getElementById("matches").innerHTML=html || `<div class="match">No matches found for ${year}</div>`;
}

function buildYearButtons(){
  const grid=document.getElementById("yearGrid");
  grid.innerHTML="";
  YEARS.forEach(year=>{
    const btn=document.createElement("button");
    btn.className="year-btn";
    btn.textContent=year;
    btn.dataset.year=year;
    btn.onclick=()=>loadYear(year);
    grid.appendChild(btn);
  });
}

// Build the year list from index.json so only real tournament years appear
async function init(){
  try{
    const idx=await fetch(MATCH_PATH+"index.json").then(r=>r.json());
    YEARS=[...new Set(
      idx.map(f=>{ const m=/t20wc_(\d{4})/.exec(f); return m?Number(m[1]):null; }).filter(Boolean)
    )].sort((a,b)=>b-a);   // most recent first
  }catch{
    YEARS=[2024,2022,2021,2016,2014,2012,2010,2009,2007];   // fallback
  }
  buildYearButtons();
  if(YEARS.length) loadYear(YEARS[0]);
}

init();
</script>

</body>
</html>
