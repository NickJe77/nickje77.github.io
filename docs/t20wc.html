<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup – By Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}

.year-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:12px;
  margin-bottom:25px;
}

.year-btn{
  background:#6a040f;
  color:white;
  border:none;
  padding:12px 0;
  border-radius:10px;
  cursor:pointer;
}

.year-btn.active{
  background:#dc2f02;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:10px;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>T20 World Cup – By Season</h1>
<p>Select a tournament year.</p>
</div>

<div id="yearGrid" class="year-grid"></div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Venue</th>
<th>Result</th>
</tr>
</thead>

<tbody id="matchesTable"></tbody>

</table>

</div>

<script>

const INDEX="data/t20-world-cup/index.json";
const PATH="data/t20-world-cup/";

let seasons=[];
let currentSeason=0;

const yearGrid=document.getElementById("yearGrid");
const table=document.getElementById("matchesTable");


async function init(){

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const matches=await fetch(PATH+file).then(r=>r.json());

seasons.push({

year:file.match(/\d{4}/)[0],

matches:matches

});

}

seasons.sort((a,b)=>b.year-a.year);

buildButtons();

showSeason(0);

}


function buildButtons(){

yearGrid.innerHTML="";

seasons.forEach((season,i)=>{

const btn=document.createElement("button");

btn.className="year-btn";

btn.textContent=season.year;

if(i===0) btn.classList.add("active");

btn.onclick=()=>{

document.querySelectorAll(".year-btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

showSeason(i);

};

yearGrid.appendChild(btn);

});

}


function showSeason(i){

currentSeason=i;

render(seasons[i].matches);

}


function render(matches){

table.innerHTML="";

matches.forEach((match,index)=>{

const date=new Date(match.info.dates[0])
.toLocaleDateString("en-GB");

const teams=match.info.teams.join(" vs ");

const venue=match.info.venue || "—";

let result="—";

if(match.info.outcome?.winner){

if(match.info.outcome.by?.runs)
result=`${match.info.outcome.winner} won by ${match.info.outcome.by.runs} runs`;

else if(match.info.outcome.by?.wickets)
result=`${match.info.outcome.winner} won by ${match.info.outcome.by.wickets} wickets`;

}

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${date}</td>
<td>
<a href="t20wc-match.html?season=${currentSeason}&match=${index}">
${teams}
</a>
</td>
<td>${venue}</td>
<td>${result}</td>
`;

table.appendChild(tr);

});

}


init();

</script>

</body>
</html>
