<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup – By Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:25px;
}

.hero h1{
  margin:0;
  font-size:46px;
}

.hero p{
  margin-top:10px;
  font-size:20px;
  opacity:.95;
}

.year-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:12px;
  margin-bottom:25px;
}

.year-btn{
  background:#6a040f;
  color:white;
  border:none;
  padding:12px 0;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
}

.year-btn:hover{
  background:#9d0208;
}

.year-btn.active{
  background:#dc2f02;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}

th{
  background:#f3f6fb;
}

tr:nth-child(even){
  background:#f8fbff;
}

tr:hover{
  background:#eef4ff;
}

a{
  color:#6a040f;
  font-weight:600;
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}

</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>T20 World Cup – By Season</h1>
  <p>Select a tournament year.</p>
</div>

<div id="yearGrid" class="year-grid"></div>

<h2>Matches</h2>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Match</th>
  <th>Venue</th>
  <th>Result</th>
</tr>
</thead>

<tbody id="matchesTable"></tbody>

</table>

</div>

<script>

const INDEX_URL = "data/t20-world-cup/index.json";
const BASE_PATH = "data/t20-world-cup/";

const yearGrid = document.getElementById("yearGrid");
const tableBody = document.getElementById("matchesTable");

let seasons = [];
let currentSeasonIndex = 0;


async function init(){

  const files = await fetch(INDEX_URL).then(r=>r.json());

  const loaded = await Promise.all(

    files.map(async file => {

      const matches = await fetch(BASE_PATH + file).then(r=>r.json());

      return {

        file:file,

        year:file.match(/\d{4}/)[0],

        matches:matches

      };

    })

  );

  seasons = loaded.sort((a,b)=>b.year - a.year);

  buildButtons();

  showSeason(0);

}


function buildButtons(){

  yearGrid.innerHTML = "";

  seasons.forEach((season,index)=>{

    const btn = document.createElement("button");

    btn.className = "year-btn";

    btn.textContent = season.year;

    if(index===0) btn.classList.add("active");

    btn.onclick = ()=>{

      document.querySelectorAll(".year-btn")
        .forEach(b=>b.classList.remove("active"));

      btn.classList.add("active");

      showSeason(index);

    };

    yearGrid.appendChild(btn);

  });

}


function showSeason(index){

  currentSeasonIndex = index;

  renderTable(seasons[index].matches);

}


function renderTable(matches){

  tableBody.innerHTML = "";

  matches
  .sort((a,b)=>new Date(a.info.dates[0]) - new Date(b.info.dates[0]))
  .forEach((match,i)=>{

    const date = formatDate(match.info.dates[0]);

    const teams = match.info.teams.join(" vs ");

    const venue = match.info.venue || "—";

    let result = "—";

    if(match.info.outcome?.winner){

      if(match.info.outcome.by?.runs)
        result = `${match.info.outcome.winner} won by ${match.info.outcome.by.runs} runs`;

      else if(match.info.outcome.by?.wickets)
        result = `${match.info.outcome.winner} won by ${match.info.outcome.by.wickets} wickets`;

    }

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${date}</td>
      <td>
        <a href="t20wc-match.html?season=${currentSeasonIndex}&match=${i}">
          ${teams}
        </a>
      </td>
      <td>${venue}</td>
      <td>${result}</td>
    `;

    tableBody.appendChild(tr);

  });

}


function formatDate(date){

  return new Date(date).toLocaleDateString("en-GB",{

    day:"2-digit",
    month:"short",
    year:"numeric"

  });

}


init();

</script>

</body>
</html>
