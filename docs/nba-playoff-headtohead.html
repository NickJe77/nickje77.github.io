<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals Head-to-Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1100px;
margin:auto;
padding:30px 20px 60px;
}

h1{text-align:center;margin:0 0 10px;}
p{text-align:center;color:#555;margin:0 0 18px;}

.controls{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:18px;
}

select{
padding:8px 12px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
}

.summary{
text-align:center;
font-weight:700;
margin-bottom:14px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border-bottom:1px solid #ddd;
padding:8px 10px;
text-align:left;
}

th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}

.small{color:#666;font-size:13px;}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<h1>NBA Finals Head-to-Head</h1>
<p>Finals history between two teams.</p>

<div class="controls">
<select id="teamA"></select>
<select id="teamB"></select>
</div>

<div class="summary" id="summary">Loading...</div>

<table>

<thead>
<tr>
<th>Season</th>
<th>Matchup</th>
<th>Series</th>
<th class="small">Champion</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

<script>

let data=[];

const teamA=document.getElementById("teamA");
const teamB=document.getElementById("teamB");
const summary=document.getElementById("summary");
const rows=document.getElementById("rows");

fetch("data/nba/finals.json")

.then(r=>r.json())

.then(d=>{

data=d||[];

/* build team list */

const teams=[...new Set(data.flatMap(x=>[x.champion,x.runner_up]))].sort();

teams.forEach(t=>{

const o1=document.createElement("option");
o1.value=t;
o1.textContent=t;
teamA.appendChild(o1);

const o2=document.createElement("option");
o2.value=t;
o2.textContent=t;
teamB.appendChild(o2);

});

if(teams.length){

teamA.value=teams[0];
teamB.value=teams[1]||teams[0];

}

render();

})

.catch(()=>summary.textContent="Could not load data.");

teamA.addEventListener("change",render);
teamB.addEventListener("change",render);

function render(){

const a=teamA.value;
const b=teamB.value;

rows.innerHTML="";

if(a===b){

summary.textContent="Pick two different teams.";

return;

}

const match=data.filter(x=>

(x.champion===a && x.runner_up===b) ||
(x.champion===b && x.runner_up===a)

)

.sort((x,y)=>y.season-x.season);

if(!match.length){

summary.textContent=`${a} and ${b} have never met in the NBA Finals.`;

return;

}

let aWins=0;
let bWins=0;

match.forEach(s=>{

if(s.champion===a) aWins++;
if(s.champion===b) bWins++;

});

summary.textContent=`${a} vs ${b} — Finals: ${a} ${aWins} – ${bWins} ${b}`;

match.forEach(s=>{

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${s.season}</td>
<td>${s.champion} vs ${s.runner_up}</td>
<td>${s.series}</td>
<td class="small">${s.champion}</td>

`;

rows.appendChild(tr);

});

}

</script>

</body>
</html>
