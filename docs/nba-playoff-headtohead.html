<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Playoff Head-to-Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:28px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero p{margin:0;color:rgba(255,255,255,.68);font-size:14px;}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}
button{
  padding:10px 22px;border:none;background:var(--board);color:#fff;border-radius:999px;
  cursor:pointer;font-family:var(--body);font-weight:600;font-size:13.5px;
}
button:hover{background:#000;}

.summary{text-align:center;font-weight:600;margin-bottom:18px;font-size:14.5px;color:var(--muted);}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px;}
th{
  background:#f7f9fb;color:var(--muted);font-weight:600;font-family:var(--body);
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;
}
td{color:#27313c;}
tbody tr{cursor:pointer;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.loading{text-align:center;padding:40px;color:var(--muted);font-style:italic;}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div class="page-wrap">
  <div class="hero">
    <span class="eyebrow">NBA</span>
    <h1>NBA Playoff Head-to-Head</h1>
    <p>All playoff series between two NBA teams.</p>
  </div>

  <div class="controls">
    <select id="teamA"></select>
    <select id="teamB"></select>
    <button onclick="compare()">Compare</button>
  </div>

  <div class="summary" id="summary"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Season</th>
          <th>Date</th>
          <th>Away</th>
          <th>Score</th>
          <th>Home</th>
          <th>Winner</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

const NBA_TEAMS = [
  "Atlanta Hawks","Boston Celtics","Brooklyn Nets","Buffalo Braves",
  "Charlotte Hornets","Chicago Bulls","Cleveland Cavaliers",
  "Dallas Mavericks","Denver Nuggets","Detroit Pistons",
  "Golden State Warriors","Houston Rockets","Indiana Pacers",
  "Kansas City Kings","LA Clippers","Los Angeles Clippers",
  "Los Angeles Lakers","Memphis Grizzlies","Miami Heat",
  "Milwaukee Bucks","Minnesota Timberwolves","New Jersey Nets",
  "New Orleans Hornets","New Orleans Jazz","New Orleans Pelicans",
  "New York Knicks","Oklahoma City Thunder","Orlando Magic",
  "Philadelphia 76ers","Phoenix Suns","Portland Trail Blazers",
  "Sacramento Kings","San Antonio Spurs","San Diego Clippers",
  "Seattle SuperSonics","Toronto Raptors","Utah Jazz",
  "Vancouver Grizzlies","Washington Bullets","Washington Wizards"
].sort();

const teamAEl  = document.getElementById("teamA");
const teamBEl  = document.getElementById("teamB");
const rowsEl   = document.getElementById("rows");
const summaryEl= document.getElementById("summary");

NBA_TEAMS.forEach(t => {
  const o1 = document.createElement("option");
  o1.value = t; o1.textContent = t;
  teamAEl.appendChild(o1);
  const o2 = document.createElement("option");
  o2.value = t; o2.textContent = t;
  teamBEl.appendChild(o2);
});
if(teamBEl.options.length > 1) teamBEl.selectedIndex = 1;

let allGames = [];
let loaded   = false;

async function loadAllSeasons(){
  if(loaded) return;
  summaryEl.textContent = "Loading all seasons...";
  rowsEl.innerHTML = `<tr><td colspan="6" class="loading">Loading...</td></tr>`;

  const results = await Promise.allSettled(
    Array.from({length: 50}, (_,i) => 1977 + i).map(s =>
      fetch(`${R2}/basketball/indexes/${s}.json`)
        .then(r => r.ok ? r.json() : [])
        .then(games => games.filter(g => g.playoff).map(g => ({...g, season: s})))
        .catch(() => [])
    )
  );

  results.forEach(r => {
    if(r.status === "fulfilled") allGames.push(...r.value);
  });

  loaded = true;
}

async function compare(){
  const a = teamAEl.value;
  const b = teamBEl.value;

  if(a === b){
    summaryEl.textContent = "Pick two different teams.";
    return;
  }

  await loadAllSeasons();

  // Get all playoff games between these two teams
  const matched = allGames.filter(g =>
    (g.home === a && g.away === b) ||
    (g.home === b && g.away === a)
  );

  // Group into series (3+ games within 20 days)
  matched.sort((x,y) => new Date(x.date) - new Date(y.date));

  const series = [];
  let current  = matched.length ? [matched[0]] : [];
  for(let i = 1; i < matched.length; i++){
    const days = (new Date(matched[i].date) - new Date(matched[i-1].date)) / 86400000;
    if(days > 20){
      if(current.length >= 3) series.push(current);
      current = [matched[i]];
    } else {
      current.push(matched[i]);
    }
  }
  if(current.length >= 3) series.push(current);

  if(!series.length){
    summaryEl.textContent = `${a} and ${b} have never met in the playoffs.`;
    rowsEl.innerHTML = "";
    return;
  }

  // Count series wins
  let aSeriesWins = 0, bSeriesWins = 0;
  let aGameWins   = 0, bGameWins   = 0;

  series.forEach(s => {
    let aW = 0, bW = 0;
    s.forEach(g => {
      const winner = g.home_score > g.away_score ? g.home : g.away;
      if(winner === a){ aW++; aGameWins++; }
      else { bW++; bGameWins++; }
    });
    if(aW > bW) aSeriesWins++;
    else bSeriesWins++;
  });

  summaryEl.textContent = `${a} vs ${b} — ${series.length} playoff series | Series: ${a} ${aSeriesWins}–${bSeriesWins} ${b} | Games: ${a} ${aGameWins}–${bGameWins} ${b}`;

  // Render all games newest series first
  const allSeriesGames = series.reverse().flat();
  rowsEl.innerHTML = allSeriesGames.map(g => {
    const winner = g.home_score > g.away_score ? g.home : g.away;
    return `
      <tr onclick="window.location.href='/nba-game.html?season=${g.season}&game=${g.game_id}'">
        <td>${parseInt(g.season)-1}-${g.season}</td>
        <td>${g.date || ""}</td>
        <td>${g.away || ""}</td>
        <td>${g.away_score ?? "–"} – ${g.home_score ?? "–"}</td>
        <td>${g.home || ""}</td>
        <td><strong>${winner}</strong></td>
      </tr>
    `;
  }).join("");
}
</script>
</body>
</html>
