<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Playoff Head-to-Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1100px;
margin:auto;
padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:8px;}
p{text-align:center;color:#555;margin-bottom:18px;}

.controls{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:18px;
}

select{
padding:8px 12px;
border-radius:8px;
border:1px solid #ccc;
}

.summary{
text-align:center;
font-weight:700;
margin-bottom:14px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border-bottom:1px solid #ddd;
padding:8px 10px;
text-align:left;
}

th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<h1>NBA Playoff Head-to-Head</h1>
<p>All playoff games between two teams.</p>

<div class="controls">
<select id="teamA"></select>
<select id="teamB"></select>
</div>

<div class="summary" id="summary">Loading...</div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Matchup</th>
<th>Score</th>
<th>Winner</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

<script>

let games=[];

const teamA=document.getElementById("teamA");
const teamB=document.getElementById("teamB");
const rows=document.getElementById("rows");
const summary=document.getElementById("summary");

fetch("data/nba/playoff-games.json")

.then(r=>r.json())

.then(d=>{

games=d||[];

const teams=[...new Set(games.flatMap(g=>[g.home_team,g.away_team]))].sort();

teams.forEach(t=>{

const o1=document.createElement("option");
o1.value=t;
o1.textContent=t;
teamA.appendChild(o1);

const o2=document.createElement("option");
o2.value=t;
o2.textContent=t;
teamB.appendChild(o2);

});

teamA.value=teams[0];
teamB.value=teams[1];

render();

})

.catch(()=>summary.textContent="Could not load data");

teamA.addEventListener("change",render);
teamB.addEventListener("change",render);

function render(){

const a=teamA.value;
const b=teamB.value;

rows.innerHTML="";

if(a===b){

summary.textContent="Pick two different teams.";
return;

}

const match=games.filter(g=>

(g.home_team===a && g.away_team===b) ||
(g.home_team===b && g.away_team===a)

).sort((x,y)=>new Date(y.date)-new Date(x.date));

if(!match.length){

summary.textContent=`${a} and ${b} have never met in the playoffs.`;
return;

}

let aWins=0;
let bWins=0;

match.forEach(g=>{

let winner;

if(g.home_score>g.away_score) winner=g.home_team;
else winner=g.away_team;

if(winner===a) aWins++;
if(winner===b) bWins++;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${g.date}</td>
<td>${g.season}</td>
<td>${g.away_team} @ ${g.home_team}</td>
<td>${g.away_score}-${g.home_score}</td>
<td>${winner}</td>

`;

rows.appendChild(tr);

});

summary.textContent=`${a} vs ${b} — Playoff games: ${a} ${aWins} – ${bWins} ${b}`;

}

</script>

</body>
</html>
