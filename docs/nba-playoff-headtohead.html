<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Playoff Head-to-Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* PAGE */

.page-wrap{
max-width:1100px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#1D428A,#C8102E);
color:white;
padding:26px 30px;
border-radius:14px;
margin-bottom:25px;
box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.hero h1{
margin:0;
font-size:34px;
font-weight:800;
}

.hero p{
margin:6px 0 0;
opacity:.9;
}

/* CONTROLS */

.controls{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:20px;
}

select{
padding:10px 14px;
border-radius:10px;
border:1px solid #ccc;
font-size:14px;
background:#fff;
}

/* SUMMARY */

.summary{
text-align:center;
font-weight:800;
margin-bottom:18px;
font-size:16px;
}

/* TABLE CARD */

.table-card{
background:#fff;
border-radius:14px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th,td{
padding:10px 12px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#eef3ff;
font-weight:800;
}

tr:nth-child(even){
background:#f8faff;
}

tbody tr{
cursor:pointer;
}

tbody tr:hover{
background:#eaf0ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Playoff Head-to-Head</h1>
<p>All playoff games between two NBA teams.</p>
</div>

<div class="controls">
<select id="teamA"></select>
<select id="teamB"></select>
</div>

<div class="summary" id="summary">Loading...</div>

<div class="table-card">

<table>

<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Matchup</th>
<th>Score</th>
<th>Winner</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

</div>

<script>

let games=[];

const teamA=document.getElementById("teamA");
const teamB=document.getElementById("teamB");
const rows=document.getElementById("rows");
const summary=document.getElementById("summary");

/* LOAD DATA */

fetch("data/nba/playoff-games.json")

.then(r=>r.json())

.then(d=>{

games=d||[];

const teams=[...new Set(games.flatMap(g=>[g.home_team,g.away_team]))].sort();

teams.forEach(t=>{

const o1=document.createElement("option");
o1.value=t;
o1.textContent=t;
teamA.appendChild(o1);

const o2=document.createElement("option");
o2.value=t;
o2.textContent=t;
teamB.appendChild(o2);

});

teamA.value=teams[0];
teamB.value=teams[1];

render();

})

.catch(()=>summary.textContent="Could not load data");

/* EVENTS */

teamA.addEventListener("change",render);
teamB.addEventListener("change",render);

/* RENDER */

function render(){

const a=teamA.value;
const b=teamB.value;

rows.innerHTML="";

if(a===b){

summary.textContent="Pick two different teams.";
return;

}

const match=games.filter(g=>

(g.home_team===a && g.away_team===b) ||
(g.home_team===b && g.away_team===a)

).sort((x,y)=>new Date(y.date)-new Date(x.date));

if(!match.length){

summary.textContent=`${a} and ${b} have never met in the playoffs.`;
return;

}

let aWins=0;
let bWins=0;

match.forEach(g=>{

let winner;

if(g.home_score>g.away_score) winner=g.home_team;
else winner=g.away_team;

if(winner===a) aWins++;
if(winner===b) bWins++;

const tr=document.createElement("tr");

tr.onclick=()=>{
location.href=`nba-game.html?season=${g.season}&game=${g.game_id}`;
};

tr.innerHTML=`

<td>${g.date}</td>
<td>${g.season}</td>
<td>${g.away_team} @ ${g.home_team}</td>
<td>${g.away_score}-${g.home_score}</td>
<td>${winner}</td>

`;

rows.appendChild(tr);

});

summary.textContent=`${a} vs ${b} — Playoff games: ${a} ${aWins} – ${bWins} ${b}`;

}

</script>

</body>
</html>
