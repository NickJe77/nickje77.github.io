<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>T20 World Cup By Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

.tabs{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.tab{
background:#fff;
border:1px solid #ddd;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.tab.active{
background:#e10600;
color:#fff;
border-color:#e10600;
}

.seasonBox{
background:#fff;
padding:20px;
border-radius:12px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f8fbff;
}

.matchLink{
color:#0056d6;
font-weight:600;
text-decoration:none;
}

.matchLink:hover{
text-decoration:underline;
}

.loading{
font-weight:700;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1>T20 World Cup By Season</h1>
</div>

<div id="tabs" class="tabs"></div>

<div id="seasonContainer" class="seasonBox">

<div class="loading">Loading seasons...</div>

</div>

</div>

<script>

const SEASON_FILES = [

"data/t20-world-cup/2007.json",
"data/t20-world-cup/2009.json",
"data/t20-world-cup/2010.json",
"data/t20-world-cup/2012.json",
"data/t20-world-cup/2014.json",
"data/t20-world-cup/2016.json",
"data/t20-world-cup/2021.json",
"data/t20-world-cup/2022.json",
"data/t20-world-cup/2024.json"

];

let seasons={};

init();

async function init(){

for(const file of SEASON_FILES){

const res=await fetch(file);
const matches=await res.json();

if(matches.length===0) continue;

const year=matches[0].info.dates[0].substring(0,4);

seasons[year]={

file:file,
matches:matches

};

}

buildTabs();

const latestYear=Object.keys(seasons).sort().reverse()[0];

loadSeason(latestYear);

}

function buildTabs(){

const tabs=document.getElementById("tabs");

const years=Object.keys(seasons).sort().reverse();

years.forEach(year=>{

const div=document.createElement("div");

div.className="tab";

div.innerText=year;

div.onclick=()=>{

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

div.classList.add("active");

loadSeason(year);

};

tabs.appendChild(div);

});

tabs.firstChild.classList.add("active");

}

function loadSeason(year){

const container=document.getElementById("seasonContainer");

const season=seasons[year];

const matches=season.matches;

matches.sort((a,b)=>
new Date(a.info.dates[0])-
new Date(b.info.dates[0])
);

const final=matches.find(m=>
m.info.event?.stage==="Final"
);

container.innerHTML=`

<div style="font-weight:700;margin-bottom:15px;">

Winner: ${
final ?
final.info.outcome.winner :
""
}

</div>

<table>

<tr>
<th>Date</th>
<th>Match</th>
<th>Venue</th>
<th>Result</th>
</tr>

${matches.map(match=>`

<tr>

<td>${match.info.dates[0]}</td>

<td>

<a class="matchLink"
href="t20-world-cup-match.html?file=${season.file}&match=${match.info.match_id}">

${match.info.teams.join(" vs ")}

</a>

</td>

<td>${match.info.venue}</td>

<td>${
match.info.outcome.winner ?
match.info.outcome.winner+" won"
:""
}</td>

</tr>

`).join("")}

</table>

`;

}

</script>

</body>
</html>
