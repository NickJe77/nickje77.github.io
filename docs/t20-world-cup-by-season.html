<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#8b0000,#e10600);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:25px;
}

.year-grid{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-bottom:18px;
}

.year-btn{
  background:#7a0000;
  color:#fff;
  border:none;
  padding:12px 22px;
  border-radius:12px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
}
.year-btn.active{
  background:#ff3b3b;
}

.match{
  background:#fff;
  padding:16px;
  margin-bottom:12px;
  border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.match a{
  font-weight:800;
  font-size:18px;
  text-decoration:none;
  color:#8b0000;
}

.meta{
  margin-top:4px;
  color:#555;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

  <div class="hero">
    <h1>T20 World Cup</h1>
  </div>

  <div class="year-grid" id="yearGrid"></div>
  <div id="matches"></div>

</div>

<script>
const MATCH_PATH="data/t20-world-cup/matches/";
const YEARS=[2007,2009,2010,2012,2014,2016,2021,2022,2024,2026];

function getMatchesArray(data){
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.matches)) return data.matches;
  return [];
}

function deriveTeams(match){
  const info=match?.info || {};
  if(info.players){
    const keys=Object.keys(info.players);
    if(keys.length>=2) return [keys[0],keys[1]];
  }
  return ["Unknown","Unknown"];
}

function getMatchYear(match){
  const d=match?.info?.dates?.[0];
  if(!d) return null;
  const m=/^(\d{4})-/.exec(d);
  return m ? Number(m[1]) : null;
}

async function loadYear(year){

  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector(`button[data-year="${year}"]`).classList.add("active");

  const file=`${MATCH_PATH}t20wc_${year}_FULL.json`;

  let data;
  try{
    const res=await fetch(file);
    if(!res.ok) throw new Error();
    data=await res.json();
  }catch{
    document.getElementById("matches").innerHTML=`<div class="match">File not found for ${year}</div>`;
    return;
  }

  const allMatches=getMatchesArray(data);

  // Filter by actual date year (in case file isn’t perfectly sorted)
  const matches=allMatches.filter(m=>getMatchYear(m)===year);

  const list = matches.length ? matches : allMatches;

  let html="";

  list.forEach(match=>{
    const info=match.info || {};
    const teams=deriveTeams(match);
    const id=info.match_type_number;

    if(!id) return;

    const venue=info.venue || info.city || "";
    const date=info.dates?.[0] || "";

    html+=`
      <div class="match">
        <a href="t20-world-cup-match.html?season=${year}&id=${id}">
          ${teams[0]} vs ${teams[1]}
        </a>
        <div class="meta">${venue}</div>
        <div class="meta">${date}</div>
      </div>
    `;
  });

  document.getElementById("matches").innerHTML=html;
}

function buildYearButtons(){
  const grid=document.getElementById("yearGrid");
  YEARS.forEach(year=>{
    const btn=document.createElement("button");
    btn.className="year-btn";
    btn.innerText=year;
    btn.dataset.year=year;
    btn.onclick=()=>loadYear(year);
    grid.appendChild(btn);
  });
}

buildYearButtons();
loadYear(2024);
</script>

</body>
</html>
