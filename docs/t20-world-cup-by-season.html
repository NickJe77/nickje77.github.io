<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#8b0000,#e10600);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:25px;
}

.year-grid{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-bottom:18px;
}

.year-btn{
  background:#7a0000;
  color:#fff;
  border:none;
  padding:12px 22px;
  border-radius:12px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
}

.year-btn.active{
  background:#ff3b3b;
}

.summary-wrap{
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
  margin-bottom:20px;
}

.summary-title{
  font-size:26px;
  font-weight:800;
  margin-bottom:12px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.summary-card{
  border:1px solid #eee;
  border-radius:14px;
  padding:14px;
  background:#fff7f7;
}

.summary-card a{
  text-decoration:none;
  color:#7a0000;
  font-weight:800;
  font-size:18px;
}

.summary-card a:hover{
  color:#e10600;
}

.sub{
  margin-top:6px;
  color:#444;
}

.match{
  background:#fff;
  padding:16px;
  margin-bottom:12px;
  border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.match a{
  font-weight:800;
  font-size:18px;
  text-decoration:none;
  color:#8b0000;
}

.meta{
  margin-top:4px;
  color:#555;
}

</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1>T20 World Cup</h1>
</div>

<div class="year-grid" id="yearGrid"></div>

<div class="summary-wrap" id="summaryWrap" style="display:none;">
  <div class="summary-title">Season Summary</div>
  <div class="summary-grid" id="summaryGrid"></div>
</div>

<div id="matches"></div>

</div>

<script>

const SUMMARY_PATH="data/t20-world-cup/summary.json";
const MATCH_PATH="data/t20-world-cup/matches/";

const YEARS=[2007,2009,2010,2012,2014,2016,2021,2022,2024,2026];

let SUMMARY=null;


/* URL HELPERS */

function teamURL(team)
{
return "t20wc-team.html?team="+encodeURIComponent(team);
}

function playerURL(player)
{
return "t20-world-cup-player.html?player="+encodeURIComponent(player);
}


/* LOAD SUMMARY */

async function loadSummary()
{
const res=await fetch(SUMMARY_PATH);
SUMMARY=await res.json();
}


/* RENDER SUMMARY */

function renderSummary(year)
{
const wrap=document.getElementById("summaryWrap");
const grid=document.getElementById("summaryGrid");

const s=SUMMARY?.[year];

if(!s)
{
wrap.style.display="none";
return;
}

wrap.style.display="block";

grid.innerHTML=`

<div class="summary-card">

<b>Winner</b><br>

<a href="${teamURL(s.winner)}">
${s.winner}
</a>

</div>

<div class="summary-card">

<b>Most Runs</b><br>

<a href="${playerURL(s.most_runs.player)}">
${s.most_runs.player}
</a>

<div class="sub">
${s.most_runs.value} runs
</div>

</div>

<div class="summary-card">

<b>Most Wickets</b><br>

<a href="${playerURL(s.most_wickets.player)}">
${s.most_wickets.player}
</a>

<div class="sub">
${s.most_wickets.value} wickets
</div>

</div>

`;
}


/* YEAR BUTTONS */

function buildYearButtons()
{
const grid=document.getElementById("yearGrid");

YEARS.forEach(year=>
{
const btn=document.createElement("button");

btn.className="year-btn";
btn.innerText=year;

btn.onclick=()=>
{
document.querySelectorAll(".year-btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

loadYear(year);
};

grid.appendChild(btn);
});
}


/* LOAD MATCHES */

async function loadYear(year)
{

renderSummary(year);

const file=`t20wc_${year}_FULL.json`;

const res=await fetch(MATCH_PATH+file);

const data=await res.json();

const matches=Array.isArray(data)?data:data.matches;

let html="";

matches.forEach((match,index)=>
{

const info=match.info;

html+=`

<div class="match">

<a href="t20-world-cup-match.html?file=${file}&match=${index}">

${info.teams[0]} vs ${info.teams[1]}

</a>

<div class="meta">${info.venue}</div>

<div class="meta">${info.dates[0]}</div>

</div>

`;

});

document.getElementById("matches").innerHTML=html;

}


/* INIT */

(async function(){

await loadSummary();

buildYearButtons();

loadYear(2024);

document.querySelectorAll(".year-btn")
.forEach(btn=>
{
if(btn.innerText=="2024")
btn.classList.add("active");
});

})();

</script>

</body>
</html>
