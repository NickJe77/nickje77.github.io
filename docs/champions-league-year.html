<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>European Champions League – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
h1{text-align:center;margin-bottom:22px;}

.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-bottom:28px;}
.year-btn{background:#111;color:white;text-align:center;padding:10px 0;border-radius:8px;cursor:pointer;font-weight:600;}
.year-btn.active{background:#0056d6;}

.section-box{border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:26px;background:#fff;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.summary-card{border:1px solid #e1e1e1;border-radius:10px;padding:14px;}
#topScorersVal{line-height:1.6;}

.match-card{border:1px solid #ddd;border-radius:10px;padding:14px;margin-bottom:12px;}
</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="champions-league.html">European Champions League</a>
<a href="champions-league-year.html">By Year</a>
</div>

<div class="page-wrap">

<h1>European Champions League – By Year</h1>

<div class="year-grid" id="yearGrid"></div>

<div class="section-box" id="summaryBox" style="display:none;">
<div class="summary-grid">
  <div class="summary-card"><b>Winner</b><div id="winnerVal">—</div></div>
  <div class="summary-card"><b>Runner-up</b><div id="runnerVal">—</div></div>
  <div class="summary-card"><b>Top 5 Goal Scorers</b><div id="topScorersVal">—</div></div>
</div>
</div>

<div id="matchesWrap"></div>

</div>

<script>
const DATA_URL="data/ucl_by_year_with_goals_WITH_SCORERS.json";
const IN_PROGRESS=[2025];

const years=[2025,2024,2023,2022,2021,2020,2019,2018,2017,2016,2015,2014,2013,2012,2011,2010,2009,2008,2007,2006,2005,2004,2003,2002,2001,2000,1999,1998,1997,1996,1995,1994,1993,1992,1991,1990,1989,1988,1987,1986,1985,1984,1983,1982,1981,1980,1979,1978,1977,1976,1975,1974,1973,1972,1971,1970,1969,1968,1967,1966,1965,1964,1963,1962,1961,1960,1959,1958,1957,1956,1955];

const grid=document.getElementById("yearGrid");
const winnerVal=document.getElementById("winnerVal");
const runnerVal=document.getElementById("runnerVal");
const topScorersVal=document.getElementById("topScorersVal");
const summaryBox=document.getElementById("summaryBox");
const matchesWrap=document.getElementById("matchesWrap");

let DATA=null, MAP=null;

function normTeam(t){
 if(!t) return "—";
 if(/inter/i.test(t) && /milan|internazionale/i.test(t)) return "Inter";
 if(/^inter$/i.test(t)) return "Inter";
 return t;
}

function buildMap(data){
 const m=new Map();
 data.forEach(r=>{
   const y=String(r.season).slice(0,4);
   if(!m.has(y)) m.set(y,[]);
   m.get(y).push(r);
 });
 return m;
}

/* -------- Goals -------- */
function getGoals(m,side){
 return Number(
   m.score?.regular?.[side] ??
   m.score?.total?.[side] ??
   m[side+"_goals"]
 );
}

/* -------- Penalties (ALL formats) -------- */
function getPens(m,side){
 const direct =
   m.score?.penalty?.[side] ??
   m.score?.shootout?.[side] ??
   m.penalty?.[side] ??
   m.shootout?.[side] ??
   m[side+"_penalties"] ??
   m[side+"_pens"];

 if(Number.isFinite(Number(direct))) return Number(direct);

 const scan = JSON.stringify(m);
 const rx = new RegExp("(\\d+)\\D+(\\d+)", "g");
 let match;
 while((match = rx.exec(scan)) !== null){
   return side==="home" ? Number(match[1]) : Number(match[2]);
 }
 return NaN;
}

/* -------- Final picker -------- */
function pickFinal(matches){
 const finals=matches.filter(m=>String(m.round).toLowerCase()==="final");

 for(const f of finals){
   const hg=getGoals(f,"home");
   const ag=getGoals(f,"away");
   if(hg!==ag) return f;

   const hp=getPens(f,"home");
   const ap=getPens(f,"away");
   if(Number.isFinite(hp)&&Number.isFinite(ap)&&hp!==ap) return f;
 }

 return finals[finals.length-1]||null;
}

/* -------- Winner logic -------- */
function winnerRunner(final){
 if(!final) return ["—","—"];

 const hg=getGoals(final,"home");
 const ag=getGoals(final,"away");

 const home=normTeam(final.home||final.homeTeam?.translations?.displayOfficialName?.EN);
 const away=normTeam(final.away||final.awayTeam?.translations?.displayOfficialName?.EN);

 if(hg>ag) return [home,away];
 if(ag>hg) return [away,home];

 const hp=getPens(final,"home");
 const ap=getPens(final,"away");

 if(Number.isFinite(hp)&&Number.isFinite(ap)){
   if(hp>ap) return [home,away];
   if(ap>hp) return [away,home];
 }

 return ["—","—"];
}

/* -------- Top scorers -------- */
function topScorers(matches){
 const map={};

 matches.forEach(m=>{
   if(m.goals){
     m.goals.forEach(g=>{
       if(g.player) map[g.player]=(map[g.player]||0)+1;
     });
   }

   if(m.playerEvents?.scorers){
     m.playerEvents.scorers.forEach(s=>{
       const name=s.player?.translations?.name?.EN || s.player?.internationalName;
       if(name) map[name]=(map[name]||0)+1;
     });
   }
 });

 const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5);
 if(!arr.length) return "—";
 return arr.map(a=>`${a[0]} (${a[1]})`).join("<br>");
}

/* -------- Render -------- */
function render(year){
 const matches=MAP.get(String(year))||[];

 summaryBox.style.display="block";

 if(IN_PROGRESS.includes(year)){
   winnerVal.textContent="In Progress";
   runnerVal.textContent="In Progress";
   topScorersVal.textContent="In Progress";
 }else{
   const f=pickFinal(matches);
   const wr=winnerRunner(f);
   winnerVal.textContent=wr[0];
   runnerVal.textContent=wr[1];
   topScorersVal.innerHTML=topScorers(matches);
 }

 matchesWrap.innerHTML="";
 matches.forEach(m=>{
   const hg=getGoals(m,"home");
   const ag=getGoals(m,"away");
   const hp=getPens(m,"home");
   const ap=getPens(m,"away");

   const penTxt=(Number.isFinite(hp)&&Number.isFinite(ap))?` (Pens ${hp}–${ap})`:"";

   const home=normTeam(m.home||m.homeTeam?.translations?.displayOfficialName?.EN);
   const away=normTeam(m.away||m.awayTeam?.translations?.displayOfficialName?.EN);

   const d=document.createElement("div");
   d.className="match-card";
   d.innerHTML=`<b>${home} ${hg} – ${ag} ${away}${penTxt}</b><br>${m.date||m.fullTimeAt} • ${m.round}`;
   matchesWrap.appendChild(d);
 });
}

async function load(year){
 if(!DATA){
   DATA=await (await fetch(DATA_URL,{cache:"no-store"})).json();
   MAP=buildMap(DATA);
 }
 render(year);
}

years.forEach(y=>{
 const b=document.createElement("div");
 b.className="year-btn";
 b.textContent=y;
 b.onclick=()=>load(y);
 grid.appendChild(b);
});

load(years[0]);
</script>

</body>
</html>
