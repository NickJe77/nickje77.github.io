<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UEFA Champions League – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:0 auto;
padding:30px 20px;
}

h1{text-align:center;margin-bottom:25px;}

.year-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
gap:10px;
margin-bottom:30px;
}

.year-tile{
background:#111;
color:white;
text-align:center;
padding:10px;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

.year-tile.active{background:#0056d6;}

.summary{
border:1px solid #ddd;
border-radius:14px;
padding:18px;
margin-bottom:25px;
background:#fafafa;
}

.summary-grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
}

.summary-box{
background:white;
border:1px solid #ddd;
border-radius:10px;
padding:12px;
}

.scorer{font-size:14px;margin-bottom:4px;}

.match{
border:1px solid #ddd;
border-radius:12px;
padding:14px;
margin-bottom:14px;
background:white;
}

.error{
color:red;
font-weight:600;
text-align:center;
}
</style>
</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/football.html">Football</a>
<a href="/football-champions-league.html">Champions League</a>
<a href="/docs/champions-league-year.html">By Year</a>
</div>

<div class="page-wrap">

<h1>UEFA Champions League – By Year</h1>

<div id="years" class="year-grid"></div>
<div id="output"></div>

</div>

<script>
const yearsBox=document.getElementById("years");
const output=document.getElementById("output");
let matchesByYear={};

function normaliseTeam(n){
 if(!n) return "";
 const map={
  "Paris":"Paris Saint-Germain",
  "B Dortmund":"Borussia Dortmund",
  "B. Dortmund":"Borussia Dortmund",
  "Dortmund":"Borussia Dortmund",
  "Man City":"Manchester City",
  "Man United":"Manchester United",
  "Inter":"Internazionale",
  "Atletico":"Atlético Madrid",
  "Bayern München":"Bayern Munich",
  "Bayern M":"Bayern Munich",
  "AC Milan":"Milan"
 };
 return map[n.trim()]||n.trim();
}

// ABSOLUTE PATH – NO RELATIVE FAILURE POSSIBLE
const jsonURL = window.location.origin + "/data/ucl_by_year_with_goals_WITH_SCORERS.json";

fetch(jsonURL,{cache:"no-store"})
.then(r=>{
 if(!r.ok) throw new Error("HTTP "+r.status);
 return r.json();
})
.then(data=>{
 if(!Array.isArray(data)){
  output.innerHTML="<div class='error'>JSON loaded but is not an array.</div>";
  return;
 }

 data.forEach(r=>{
  if(!r.season) return;
  if(!matchesByYear[r.season]) matchesByYear[r.season]=[];
  matchesByYear[r.season].push(r);
 });

 buildYears();
})
.catch(e=>{
 output.innerHTML="<div class='error'>JSON failed to load from:<br>"+jsonURL+"</div>";
 console.error(e);
});

function buildYears(){
 yearsBox.innerHTML="";
 Object.keys(matchesByYear)
 .sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}))
 .forEach(y=>{
  const d=document.createElement("div");
  d.className="year-tile";
  d.textContent=y;
  d.onclick=()=>loadYear(y,d);
  yearsBox.appendChild(d);
 });
}

function loadYear(year,btn){
 document.querySelectorAll(".year-tile").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");

 output.innerHTML="";

 const matches=matchesByYear[year]||[];

 buildSummary(matches);

 matches.forEach(m=>{
  const home=normaliseTeam(m.home);
  const away=normaliseTeam(m.away);

  const score=(m.home_goals!=null&&m.away_goals!=null)
   ?`${m.home_goals} – ${m.away_goals}`:"v";

  let goals="";
  if(Array.isArray(m.goals)){
   goals=m.goals.map(g=>`${g.player} (${g.minute}')`).join(", ");
  }

  const div=document.createElement("div");
  div.className="match";
  div.innerHTML=`
   <h3>${home} ${score} ${away}</h3>
   <div>${m.round||""}</div>
   <div>${m.date||""}</div>
   ${goals?`<div><strong>Goals:</strong> ${goals}</div>`:""}
  `;
  output.appendChild(div);
 });
}

function buildSummary(matches){

 let final=matches.find(m=>(m.round||"").toLowerCase().includes("final"));
 let winner="Unknown",runner="Unknown";

 if(final && final.home_goals!=null){
  if(final.home_goals>final.away_goals){
   winner=normaliseTeam(final.home);
   runner=normaliseTeam(final.away);
  }else{
   winner=normaliseTeam(final.away);
   runner=normaliseTeam(final.home);
  }
 }

 let scorers={};
 matches.forEach(m=>{
  if(Array.isArray(m.goals)){
   m.goals.forEach(g=>{
    if(!g.player) return;
    scorers[g.player]=(scorers[g.player]||0)+1;
   });
  }
 });

 let top=Object.entries(scorers).sort((a,b)=>b[1]-a[1]).slice(0,5);

 let scorerHTML=top.map(s=>`<div class="scorer">${s[0]} – ${s[1]}</div>`).join("");

 const sum=document.createElement("div");
 sum.className="summary";
 sum.innerHTML=`
  <h2>Season Summary</h2>
  <div class="summary-grid">
   <div class="summary-box"><strong>Winner</strong><br>${winner}</div>
   <div class="summary-box"><strong>Runner-up</strong><br>${runner}</div>
   <div class="summary-box"><strong>Top Scorers</strong><br>${scorerHTML||"No data"}</div>
  </div>
 `;
 output.appendChild(sum);
}
</script>

</body>
</html>
