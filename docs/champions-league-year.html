<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>European Champions League – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:white;}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}

.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
h1{text-align:center;margin-bottom:22px;}

.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-bottom:28px;}
.year-btn{background:#111;color:white;text-align:center;padding:10px 0;border-radius:8px;cursor:pointer;font-weight:600;user-select:none;}
.year-btn.active{background:#0056d6;}
.year-btn:hover{background:#333;}

.section-box{border:1px solid #ddd;border-radius:12px;padding:18px 18px;margin:18px 0 26px;background:#fff;}
.section-title{font-size:22px;font-weight:700;margin:0 0 14px;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.summary-card{border:1px solid #e1e1e1;border-radius:10px;padding:14px 14px;background:#fff;}
.summary-card h3{margin:0 0 8px;font-size:16px;font-weight:700;}
.summary-card .value{font-size:18px;}

.scorer-list{margin:0;padding-left:18px;}
.scorer-list li{margin:6px 0;font-size:16px;line-height:1.4;}

.match-card{border:1px solid #e1e1e1;border-radius:12px;padding:16px;margin:12px 0;background:#fff;}
.match-title{font-size:18px;font-weight:700;margin:0 0 6px;}
.match-meta{color:#555;font-size:14px;margin:0 0 10px;}
.goals-line{font-size:14px;color:#222;margin:0;}
.muted{color:#777;}

#errorBox{
  display:none;
  border:1px solid #ffb3b3;
  background:#fff5f5;
  color:#8a1f1f;
  padding:12px 14px;
  border-radius:12px;
  margin:12px 0 18px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="football.html">Football</a>
  <a href="champions-league.html">Champions League</a>
  <a href="champions-league-year.html">By Year</a>
</div>

<div class="page-wrap">
  <h1>European Champions League – By Year</h1>

  <div class="year-grid" id="yearGrid"></div>

  <div id="errorBox"></div>

  <div class="section-box" id="summaryBox" style="display:none;">
    <div class="section-title">Season Summary</div>
    <div class="summary-grid">
      <div class="summary-card">
        <h3>Winner</h3>
        <div class="value" id="winnerVal">—</div>
      </div>
      <div class="summary-card">
        <h3>Runner-up</h3>
        <div class="value" id="runnerVal">—</div>
      </div>
      <div class="summary-card">
        <h3>Top Scorers</h3>
        <ol class="scorer-list" id="scorersList"></ol>
      </div>
    </div>
  </div>

  <div id="matchesWrap"></div>
</div>

<script>
/* ===== Config ===== */
const DATA_URL = "data/ucl_by_year_with_goals_WITH_SCORERS.json";
const IN_PROGRESS_SEASONS = new Set([2025]);

/* Your buttons */
const years=[2025,2024,2023,2022,2021,2020,2019,2018,2017,2016,2015,2014,2013,2012,2011,2010,2009,2008,2007,2006,2005,2004,2003,2002,2001,2000,1999,1998,1997,1996,1995,1994,1993,1992,1991,1990,1989,1988,1987,1986,1985,1984,1983,1982,1981,1980,1979,1978,1977,1976,1975,1974,1973,1972,1971,1970,1969,1968,1967,1966,1965,1964,1963,1962,1961,1960,1959,1958,1957,1956,1955];

const grid = document.getElementById("yearGrid");
const summaryBox = document.getElementById("summaryBox");
const winnerVal = document.getElementById("winnerVal");
const runnerVal = document.getElementById("runnerVal");
const scorersList = document.getElementById("scorersList");
const matchesWrap = document.getElementById("matchesWrap");
const errorBox = document.getElementById("errorBox");

let RAW = null;
let SEASON_MAP = null;

/* ===== Utilities ===== */
function showError(msg){
  errorBox.style.display = "block";
  errorBox.textContent = msg;
}
function clearError(){
  errorBox.style.display = "none";
  errorBox.textContent = "";
}

function safeText(v){
  return (v === null || v === undefined || v === "") ? "—" : String(v);
}

function normTeam(name){
  if(name === null || name === undefined) return "—";
  let s = String(name).trim();

  // unify Inter naming
  if (/internazionale/i.test(s) || (/^inter\b/i.test(s) && /milan/i.test(s)) || /^inter$/i.test(s)) return "Inter";

  // your earlier issue: PSG / Dortmund shortenings are NOT changed here (you didn’t ask now)
  return s;
}

function get(obj, path){
  try{
    return path.split('.').reduce((o,k)=> (o && o[k] !== undefined) ? o[k] : undefined, obj);
  }catch(e){
    return undefined;
  }
}

function parseISODate(d){
  if (!d) return null;
  const t = Date.parse(d);
  return Number.isFinite(t) ? t : null;
}

/* ===== Season mapping (mixed schema safe) =====
   Priority:
   A) explicit season field (your flat schema)
   B) UEFA matchday.seasonYear -> start year (2008 -> 2007)
   C) derive from date (Jul-Dec => same year, Jan-Jun => year-1)
*/
function seasonKeyFromRecord(r){
  // A: explicit season
  const s = r && (r.season ?? r.Season ?? r.year ?? r.seasonYear);
  if (s !== undefined && s !== null && String(s).trim() !== "") {
    const m = String(s).trim().match(/^(\d{4})/);
    if (m) return m[1];
  }

  // B: UEFA seasonYear (finish year)
  const uefaSY = get(r, "matchday.seasonYear");
  const syNum = Number(uefaSY);
  if (Number.isFinite(syNum) && syNum > 1900) return String(syNum - 1);

  // C: derive from date
  const dateStr =
    r.date || r.Date ||
    get(r, "kickOffTime.date") ||
    get(r, "kickOffTime.dateTime") ||
    get(r, "fullTimeAt");
  const t = parseISODate(dateStr);
  if (t !== null) {
    const d = new Date(t);
    const y = d.getFullYear();
    const month = d.getMonth() + 1;
    return String(month >= 7 ? y : (y - 1));
  }

  return null;
}

function buildSeasonMap(raw){
  const map = new Map();
  if (!Array.isArray(raw)) return map;

  raw.forEach(r=>{
    const key = seasonKeyFromRecord(r);
    if(!key) return;
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(r);
  });

  return map;
}

/* ===== Score extraction (mixed schema safe) ===== */
function getHomeAwayNames(m){
  const home =
    m.home || m.Home ||
    get(m, "homeTeam.translations.displayOfficialName.EN") ||
    get(m, "homeTeam.translations.displayName.EN") ||
    get(m, "homeTeam.internationalName") ||
    get(m, "homeTeam.name") ||
    "";
  const away =
    m.away || m.Away ||
    get(m, "awayTeam.translations.displayOfficialName.EN") ||
    get(m, "awayTeam.translations.displayName.EN") ||
    get(m, "awayTeam.internationalName") ||
    get(m, "awayTeam.name") ||
    "";
  return { home: normTeam(home), away: normTeam(away) };
}

function getGoalsFromScoreObject(m){
  // UEFA commonly: score.regular.home/away or score.total.home/away
  const h = get(m, "score.regular.home") ?? get(m, "score.total.home") ?? get(m, "score.fullTime.home");
  const a = get(m, "score.regular.away") ?? get(m, "score.total.away") ?? get(m, "score.fullTime.away");
  const nh = Number(h), na = Number(a);
  if (Number.isFinite(nh) && Number.isFinite(na)) return { hg: nh, ag: na };
  return { hg: null, ag: null };
}

function getGoalsFromFlatFields(m){
  const hg = Number(m.home_goals ?? m.homeGoals ?? m.HomeGoals ?? m.home_score ?? m.homeScore);
  const ag = Number(m.away_goals ?? m.awayGoals ?? m.AwayGoals ?? m.away_score ?? m.awayScore);
  if (Number.isFinite(hg) && Number.isFinite(ag)) return { hg, ag };
  return { hg: null, ag: null };
}

function getGoals(m){
  // Prefer explicit flat fields if present; else UEFA score object; else count from events as last resort
  let { hg, ag } = getGoalsFromFlatFields(m);
  if (hg !== null && ag !== null) return { hg, ag };

  ({ hg, ag } = getGoalsFromScoreObject(m));
  if (hg !== null && ag !== null) return { hg, ag };

  // Last resort: count scorer events with teamId if available
  const scorers = get(m, "playerEvents.scorers");
  const hId = get(m, "homeTeam.id");
  const aId = get(m, "awayTeam.id");
  if (Array.isArray(scorers) && hId && aId) {
    let ch = 0, ca = 0;
    for (const s of scorers) {
      const gt = String(s.goalType || s.type || "").toUpperCase();
      if (gt && gt !== "SCORED") continue;
      const tid = s.teamId || s.team?.id || s.clubId || null;
      if (tid === hId) ch++;
      if (tid === aId) ca++;
    }
    return { hg: ch, ag: ca };
  }

  return { hg: null, ag: null };
}

function getPens(m){
  // UEFA: score.penalty.home/away
  const ph = get(m, "score.penalty.home") ?? get(m, "score.shootout.home");
  const pa = get(m, "score.penalty.away") ?? get(m, "score.shootout.away");
  const nph = Number(ph), npa = Number(pa);
  if (Number.isFinite(nph) && Number.isFinite(npa)) return { ph: nph, pa: npa };

  // Some schemas: home_penalties / away_penalties
  const fh = Number(m.home_penalties ?? m.homePens ?? m.home_pens ?? m.homePenalties);
  const fa = Number(m.away_penalties ?? m.awayPens ?? m.away_pens ?? m.awayPenalties);
  if (Number.isFinite(fh) && Number.isFinite(fa)) return { ph: fh, pa: fa };

  // If penalties embedded as text somewhere, try parse "(3-2 pens)" style
  const candidates = [m.result, m.score, m.Score, m.note, m.notes].filter(v=>v!==undefined && v!==null);
  for (const c of candidates) {
    const s = String(c);
    const pm = s.match(/(\d+)\D+(\d+)\D*(?:pens?|penalties)/i) || s.match(/(?:pens?|penalties)\D*(\d+)\D+(\d+)/i);
    if (pm) {
      const a = Number(pm[1]), b = Number(pm[2]);
      if (Number.isFinite(a) && Number.isFinite(b)) return { ph: a, pa: b };
    }
  }

  return { ph: null, pa: null };
}

/* ===== Finals + summary ===== */
function isFinal(m){
  const r = String(m.round || m.Round || "").toLowerCase();
  if (r === "final") return true;
  const t = String(get(m,"matchday.type") || "").toUpperCase();
  if (t === "FINAL") return true;
  return false;
}

function pickFinalMatch(matches){
  if (!matches || !matches.length) return null;

  const finals = matches.filter(isFinal);
  const pool = finals.length ? finals : matches;

  // Prefer decisive (non-draw) OR penalties available
  for (const m of pool) {
    const g = getGoals(m);
    if (g.hg !== null && g.ag !== null && g.hg !== g.ag) return m;
    const p = getPens(m);
    if (g.hg !== null && g.ag !== null && g.hg === g.ag && p.ph !== null && p.pa !== null && p.ph !== p.pa) return m;
  }

  // else latest by date
  let best = pool[pool.length - 1];
  let bestT = -Infinity;
  for (const m of pool) {
    const dateStr = m.date || m.Date || get(m,"kickOffTime.date") || get(m,"kickOffTime.dateTime") || get(m,"fullTimeAt");
    const t = parseISODate(dateStr);
    if (t !== null && t > bestT) { bestT = t; best = m; }
  }
  return best;
}

function computeWinnerRunner(matches, year){
  if (IN_PROGRESS_SEASONS.has(year)) {
    return { winner: "In Progress", runner: "In Progress" };
  }

  const finalMatch = pickFinalMatch(matches);
  if (!finalMatch) return { winner:"—", runner:"—" };

  const { home, away } = getHomeAwayNames(finalMatch);
  const { hg, ag } = getGoals(finalMatch);

  if (hg !== null && ag !== null) {
    if (hg > ag) return { winner: home, runner: away };
    if (ag > hg) return { winner: away, runner: home };

    // draw -> try penalties
    const { ph, pa } = getPens(finalMatch);
    if (ph !== null && pa !== null) {
      if (ph > pa) return { winner: home, runner: away };
      if (pa > ph) return { winner: away, runner: home };
    }
  }

  return { winner:"—", runner:"—" };
}

/* ===== Scorers (both schemas) ===== */
function computeTopScorers(matches, topN=5){
  const counts = new Map();

  for (const m of matches) {
    // Flat schema: goals[]
    const goalsArr = m.goals || m.Goals;
    if (Array.isArray(goalsArr)) {
      for (const g of goalsArr) {
        let name = null;
        if (typeof g === "string") name = g.replace(/\s*\(?\d+.*$/, "").trim();
        else if (g && typeof g === "object") name = g.player || g.Player || g.name || g.scorer || null;
        if (!name) continue;
        name = String(name).trim();
        if (!name) continue;
        counts.set(name, (counts.get(name) || 0) + 1);
      }
    }

    // UEFA schema: playerEvents.scorers[]
    const scorerEvents = get(m, "playerEvents.scorers");
    if (Array.isArray(scorerEvents)) {
      for (const ev of scorerEvents) {
        const gt = String(ev.goalType || ev.type || "").toUpperCase();
        // If goalType exists, only count SCORED. If not present, count anyway (some exports omit it).
        if (gt && gt !== "SCORED") continue;

        const p = ev.player || {};
        const name =
          get(p, "translations.name.EN") ||
          get(p, "translations.name") ||
          p.internationalName ||
          p.name ||
          null;

        if (!name) continue;
        const clean = String(name).trim();
        if (!clean) continue;
        counts.set(clean, (counts.get(clean) || 0) + 1);
      }
    }
  }

  return Array.from(counts.entries())
    .sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]))
    .slice(0, topN)
    .map(([player, goals]) => ({ player, goals }));
}

/* ===== Rendering ===== */
function setActiveYearButton(year){
  document.querySelectorAll(".year-btn").forEach(btn=>{
    btn.classList.toggle("active", String(btn.dataset.year) === String(year));
  });
}

function formatGoalsLine(m){
  const goalsArr = m.goals || m.Goals;
  if (Array.isArray(goalsArr) && goalsArr.length) {
    // If flat schema includes strings/objects, display it
    const parts = [];
    for (const g of goalsArr) {
      if (typeof g === "string") { parts.push(g); continue; }
      if (g && typeof g === "object") {
        const p = g.player || g.Player || g.name || g.scorer;
        const min = g.minute ?? g.Min ?? g.time ?? g.minuteText;
        if (p && (min !== null && min !== undefined && min !== "")) parts.push(`${p} ${min}'`);
        else if (p) parts.push(String(p));
      }
    }
    return parts.join(", ");
  }

  // UEFA scorer events: show names only (minutes are often present but not needed here)
  const evs = get(m, "playerEvents.scorers");
  if (Array.isArray(evs) && evs.length) {
    const parts = [];
    for (const ev of evs) {
      const gt = String(ev.goalType || ev.type || "").toUpperCase();
      if (gt && gt !== "SCORED") continue;
      const p = ev.player || {};
      const name = get(p, "translations.name.EN") || p.internationalName || p.name;
      if (name) parts.push(String(name));
    }
    return parts.join(", ");
  }

  return "";
}

function renderSummary(matches, year){
  summaryBox.style.display = "block";

  const wr = computeWinnerRunner(matches, year);
  winnerVal.textContent = safeText(wr.winner);
  runnerVal.textContent = safeText(wr.runner);

  const top = computeTopScorers(matches, 5);
  scorersList.innerHTML = "";
  if (!top.length) {
    const li = document.createElement("li");
    li.className = "muted";
    li.textContent = "No scorer data available.";
    scorersList.appendChild(li);
  } else {
    top.forEach(row=>{
      const li = document.createElement("li");
      li.textContent = `${row.player} – ${row.goals}`;
      scorersList.appendChild(li);
    });
  }
}

function renderMatches(matches){
  matchesWrap.innerHTML = "";

  if (!matches || !matches.length) {
    matchesWrap.innerHTML = `<p class="muted">No matches found for this season.</p>`;
    return;
  }

  const sorted = [...matches].sort((a,b)=>{
    const da = a.date || a.Date || get(a,"kickOffTime.date") || get(a,"kickOffTime.dateTime") || get(a,"fullTimeAt");
    const db = b.date || b.Date || get(b,"kickOffTime.date") || get(b,"kickOffTime.dateTime") || get(b,"fullTimeAt");
    const ta = parseISODate(da) ?? -Infinity;
    const tb = parseISODate(db) ?? -Infinity;
    return ta - tb;
  });

  for (const m of sorted) {
    const date = m.date || m.Date || get(m,"kickOffTime.date") || "";
    const round = m.round || m.Round || get(m,"matchday.type") || "";
    const { home, away } = getHomeAwayNames(m);

    const { hg, ag } = getGoals(m);
    const scoreH = (hg === null ? "—" : hg);
    const scoreA = (ag === null ? "—" : ag);

    const p = getPens(m);
    const penTxt = (p.ph !== null && p.pa !== null) ? ` (Pens ${p.ph}–${p.pa})` : "";

    const goalsLine = formatGoalsLine(m);

    const card = document.createElement("div");
    card.className = "match-card";
    card.innerHTML = `
      <div class="match-title">${safeText(home)} ${safeText(scoreH)} – ${safeText(scoreA)} ${safeText(away)}${penTxt}</div>
      <div class="match-meta">${safeText(date)}${round ? " • " + safeText(round) : ""}</div>
      <p class="goals-line">${goalsLine ? `<strong>Goals:</strong> ${goalsLine}` : `<span class="muted">No goals</span>`}</p>
    `;
    matchesWrap.appendChild(card);
  }
}

/* ===== Data load ===== */
async function ensureDataLoaded(){
  if (RAW && SEASON_MAP) return;

  const res = await fetch(DATA_URL, { cache: "no-store" });
  if (!res.ok) throw new Error(`Failed to load data (${res.status}). Check path: ${DATA_URL}`);

  const raw = await res.json();
  if (!Array.isArray(raw)) throw new Error("JSON loaded but is not an array.");

  RAW = raw;
  SEASON_MAP = buildSeasonMap(raw);
}

async function loadSeason(year){
  try{
    clearError();
    await ensureDataLoaded();

    const key = String(year);
    const matches = SEASON_MAP.get(key) || [];

    setActiveYearButton(year);
    renderSummary(matches, year);
    renderMatches(matches);
  } catch (err) {
    console.error(err);
    showError(err.message || "Unknown error.");
    summaryBox.style.display = "block";
    winnerVal.textContent = "—";
    runnerVal.textContent = "—";
    scorersList.innerHTML = `<li class="muted">Data failed to load.</li>`;
    matchesWrap.innerHTML = `<p class="muted">Could not load season data. Check the JSON path: <strong>${DATA_URL}</strong></p>`;
  }
}

/* ===== Build year buttons (always clickable) ===== */
years.forEach(y=>{
  const d=document.createElement("div");
  d.className="year-btn";
  d.textContent=y;
  d.dataset.year = y;
  d.addEventListener("click", ()=>loadSeason(y));
  grid.appendChild(d);
});

/* Default load */
loadSeason(years[0]);
</script>

</body>
</html>
