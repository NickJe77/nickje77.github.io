<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>European Champions League – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px;
border-bottom:1px solid #ddd;
font-weight:600;
}
.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:0 auto;
padding:30px 20px;
}

h1{text-align:center;margin-bottom:25px;}

.year-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
gap:10px;
margin-bottom:30px;
}

.year-tile{
background:#111;
color:white;
text-align:center;
padding:10px;
border-radius:8px;
font-weight:700;
cursor:pointer;
}
.year-tile.active{background:#0056d6;}

.summary{
border:1px solid #ddd;
border-radius:14px;
padding:18px;
margin-bottom:25px;
background:#fafafa;
}
.summary h2{margin:0 0 12px 0;font-size:22px;}

.summary-grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
}
.summary-box{
background:white;
border:1px solid #ddd;
border-radius:10px;
padding:12px;
}
.summary-box h3{margin:0 0 8px 0;font-size:16px;}

.scorer{font-size:14px;margin-bottom:4px;}

.match{
border:1px solid #ddd;
border-radius:12px;
padding:14px;
margin-bottom:14px;
background:white;
}
.match h3{margin:0 0 6px 0;font-size:18px;}
.small{font-size:13px;color:#555;}
.stage{font-weight:700;color:#222;}
.goalscorers{margin-top:6px;font-size:14px;color:#333;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-champions-league.html">Champions League</a>
<a href="champions-league-year.html">By Year</a>
</div>

<div class="page-wrap">

<h1>European Champions League – By Year</h1>

<div id="years" class="year-grid"></div>
<div id="output"></div>

</div>

<script>
let matchesByYear={};

function normaliseTeam(name){
 if(!name) return name;
 const map={
  "Paris":"Paris Saint-Germain",
  "B Dortmund":"Borussia Dortmund",
  "Man City":"Manchester City",
  "Man United":"Manchester United",
  "Inter":"Internazionale",
  "Atletico":"Atlético Madrid",
  "Bayern München":"Bayern Munich",
  "AC Milan":"Milan"
 };
 return map[name]||name;
}

fetch("data/ucl_by_year_with_goals_WITH_SCORERS.json",{cache:"no-store"})
.then(r=>r.json())
.then(data=>{
 data.forEach(r=>{
  const y=String(r.season);
  if(!matchesByYear[y]) matchesByYear[y]=[];
  matchesByYear[y].push(r);
 });
 buildYears();
});

function buildYears(){
 const box=document.getElementById("years");
 Object.keys(matchesByYear).sort((a,b)=>b-a).forEach(y=>{
  const d=document.createElement("div");
  d.className="year-tile";
  d.textContent=y;
  d.onclick=()=>loadYear(y,d);
  box.appendChild(d);
 });
}

function loadYear(year,btn){
 document.querySelectorAll(".year-tile").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");

 const out=document.getElementById("output");
 out.innerHTML="";

 const season=matchesByYear[year];

 buildSummary(season,out);

 season.sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(m=>{
  const home=normaliseTeam(m.home);
  const away=normaliseTeam(m.away);
  const score=`${m.home_goals} – ${m.away_goals}`;

  let goals="";
  if(m.goals?.length){
   goals=m.goals.map(g=>`${g.player} (${g.minute}')`).join(", ");
  }

  out.innerHTML+=`
   <div class="match">
    <h3>${home} ${score} ${away}</h3>
    <div class="small stage">${m.round}</div>
    <div class="small">${m.date}</div>
    ${goals?`<div class="goalscorers"><strong>Goals:</strong> ${goals}</div>`:""}
   </div>
  `;
 });
}

function buildSummary(matches,container){

 let final = matches
   .filter(m => /^final\b/i.test(m.round || ""))
   .sort((a,b)=> new Date(b.date) - new Date(a.date))[0];

 let winner="Unknown",runner="Unknown";

 if(final){
  if(final.home_goals>final.away_goals){
   winner=normaliseTeam(final.home);
   runner=normaliseTeam(final.away);
  }else{
   winner=normaliseTeam(final.away);
   runner=normaliseTeam(final.home);
  }
 }

 let scorerMap={};
 matches.forEach(m=>{
  m.goals?.forEach(g=>{
   scorerMap[g.player]=(scorerMap[g.player]||0)+1;
  });
 });

 let top=Object.entries(scorerMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

 container.innerHTML+=`
  <div class="summary">
   <h2>Season Summary</h2>
   <div class="summary-grid">
    <div class="summary-box"><h3>Winner</h3>${winner}</div>
    <div class="summary-box"><h3>Runner-up</h3>${runner}</div>
    <div class="summary-box"><h3>Top Scorers</h3>
     ${top.map(t=>`<div class="scorer">${t[0]} – ${t[1]}</div>`).join("")}
    </div>
   </div>
  </div>
 `;
}
</script>

</body>
</html>
