<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>European Champions League – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:white;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
h1{text-align:center;margin-bottom:22px;}
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-bottom:28px;}
.year-btn{background:#111;color:white;text-align:center;padding:10px 0;border-radius:8px;cursor:pointer;font-weight:600;}
.year-btn.active{background:#0056d6;}
.year-btn:hover{background:#333;}

/* Summary + matches (kept simple, aligned with your current look) */
.section-box{border:1px solid #ddd;border-radius:12px;padding:18px 18px;margin:18px 0 26px;background:#fff;}
.section-title{font-size:22px;font-weight:700;margin:0 0 14px;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.summary-card{border:1px solid #e1e1e1;border-radius:10px;padding:14px 14px;background:#fff;}
.summary-card h3{margin:0 0 8px;font-size:16px;font-weight:700;}
.summary-card .value{font-size:18px;}
.scorer-list{margin:0;padding-left:18px;}
.scorer-list li{margin:4px 0;font-size:16px;}

.match-card{border:1px solid #e1e1e1;border-radius:12px;padding:16px;margin:12px 0;background:#fff;}
.match-title{font-size:18px;font-weight:700;margin:0 0 6px;}
.match-meta{color:#555;font-size:14px;margin:0 0 10px;}
.goals-line{font-size:14px;color:#222;margin:0;}
.muted{color:#777;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="football.html">Football</a>
  <a href="champions-league.html">Champions League</a>
  <a href="champions-league-year.html">By Year</a>
</div>

<div class="page-wrap">

<h1>European Champions League – By Year</h1>

<div class="year-grid" id="yearGrid"></div>

<div class="section-box" id="summaryBox" style="display:none;">
  <div class="section-title">Season Summary</div>
  <div class="summary-grid">
    <div class="summary-card">
      <h3>Winner</h3>
      <div class="value" id="winnerVal">—</div>
    </div>
    <div class="summary-card">
      <h3>Runner-up</h3>
      <div class="value" id="runnerVal">—</div>
    </div>
    <div class="summary-card">
      <h3>Top Scorers</h3>
      <ol class="scorer-list" id="scorersList"></ol>
    </div>
  </div>
</div>

<div id="matchesWrap"></div>

</div>

<script>
/* ===== Config ===== */
const DATA_URL = "data/ucl_by_year_with_goals_WITH_SCORERS.json";

/* Your year buttons (as you had them) */
const years=[2025,2024,2023,2022,2021,2020,2019,2018,2017,2016,2015,2014,2013,2012,2011,2010,2009,2008,2007,2006,2005,2004,2003,2002,2001,2000,1999,1998,1997,1996,1995,1994,1993,1992,1991,1990,1989,1988,1987,1986,1985,1984,1983,1982,1981,1980,1979,1978,1977,1976,1975,1974,1973,1972,1971,1970,1969,1968,1967,1966,1965,1964,1963,1962,1961,1960,1959,1958,1957,1956,1955];

const grid = document.getElementById("yearGrid");
const summaryBox = document.getElementById("summaryBox");
const winnerVal = document.getElementById("winnerVal");
const runnerVal = document.getElementById("runnerVal");
const scorersList = document.getElementById("scorersList");
const matchesWrap = document.getElementById("matchesWrap");

let DATA_CACHE = null;
let SEASON_MAP = null;

function safeText(v){
  return (v === null || v === undefined || v === "") ? "—" : String(v);
}

function normalizeSeasonValue(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  if (!s) return null;
  // allow "2016/17" or "2016-17" to map to 2016
  const m = s.match(/^(\d{4})/);
  if (m) return m[1];
  if (/^\d+$/.test(s)) return s;
  return s;
}

function parseISODate(d){
  if (!d) return null;
  // expects YYYY-MM-DD
  const t = Date.parse(d);
  return Number.isFinite(t) ? t : null;
}

function buildSeasonMap(raw){
  const map = new Map();

  if (!raw) return map;

  // Case A: wrapper objects with matches array
  if (Array.isArray(raw) && raw.length && raw[0] && typeof raw[0] === "object" && Array.isArray(raw[0].matches)) {
    raw.forEach(seasonObj => {
      const seasonKey = normalizeSeasonValue(seasonObj.season ?? seasonObj.year ?? seasonObj.Season);
      const arr = Array.isArray(seasonObj.matches) ? seasonObj.matches : [];
      if (!seasonKey) return;
      map.set(seasonKey, arr.map(m => ({...m, season: seasonKey})));
    });
    return map;
  }

  // Case B: flat list of matches
  if (Array.isArray(raw)) {
    raw.forEach(m => {
      const seasonKey = normalizeSeasonValue(m.season ?? m.Season ?? m.year ?? m.seasonYear);
      if (!seasonKey) return;
      if (!map.has(seasonKey)) map.set(seasonKey, []);
      map.get(seasonKey).push(m);
    });
    return map;
  }

  return map;
}

function pickFinalMatch(matches){
  if (!matches || !matches.length) return null;

  // Prefer explicit "Final" round
  const finals = matches.filter(m => String(m.round || m.Round || "").toLowerCase() === "final");
  const pool = finals.length ? finals : matches;

  // pick latest by date, fallback by appearance
  let best = null;
  let bestT = -Infinity;
  for (const m of pool) {
    const t = parseISODate(m.date || m.Date);
    if (t !== null && t > bestT) {
      bestT = t;
      best = m;
    }
  }
  return best || pool[pool.length - 1];
}

function computeWinnerRunner(finalMatch){
  if (!finalMatch) return { winner:"—", runner:"—" };

  const home = finalMatch.home || finalMatch.Home || finalMatch.homeTeam || "—";
  const away = finalMatch.away || finalMatch.Away || finalMatch.awayTeam || "—";
  const hg = Number(finalMatch.home_goals ?? finalMatch.homeGoals ?? finalMatch.HomeGoals ?? finalMatch.home_score ?? finalMatch.homeScore);
  const ag = Number(finalMatch.away_goals ?? finalMatch.awayGoals ?? finalMatch.AwayGoals ?? finalMatch.away_score ?? finalMatch.awayScore);

  if (Number.isFinite(hg) && Number.isFinite(ag)) {
    if (hg > ag) return { winner: home, runner: away };
    if (ag > hg) return { winner: away, runner: home };
    // draw (pens not represented in your simplified schema) -> unknown
    return { winner:"—", runner:"—" };
  }

  return { winner:"—", runner:"—" };
}

function computeTopScorers(matches, topN=5){
  const counts = new Map();

  for (const m of matches) {
    const goalsArr = m.goals || m.Goals || [];
    if (!Array.isArray(goalsArr)) continue;

    for (const g of goalsArr) {
      // Accept {player, minute} OR "Player (12')" style strings
      let player = null;

      if (typeof g === "string") {
        // strip minute/punctuation
        player = g.replace(/\s*\(?\d+.*$/, "").trim();
      } else if (g && typeof g === "object") {
        player = g.player || g.Player || g.name || g.scorer || null;
      }

      player = player ? String(player).trim() : null;
      if (!player) continue;

      counts.set(player, (counts.get(player) || 0) + 1);
    }
  }

  const arr = Array.from(counts.entries())
    .sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]))
    .slice(0, topN)
    .map(([player, goals]) => ({ player, goals }));

  return arr;
}

function formatGoalsList(m){
  const goalsArr = m.goals || m.Goals || [];
  if (!Array.isArray(goalsArr)) return "";

  const parts = [];
  for (const g of goalsArr) {
    if (typeof g === "string") {
      parts.push(g);
      continue;
    }
    if (g && typeof g === "object") {
      const p = g.player || g.Player || g.name || g.scorer;
      const min = g.minute ?? g.Min ?? g.time ?? g.minuteText;
      if (p && (min !== null && min !== undefined && min !== "")) {
        parts.push(`${p} ${min}'`);
      } else if (p) {
        parts.push(`${p}`);
      }
    }
  }
  return parts.join(", ");
}

function renderMatches(matches){
  matchesWrap.innerHTML = "";

  if (!matches || !matches.length) {
    matchesWrap.innerHTML = `<p class="muted">No matches found for this season.</p>`;
    return;
  }

  // Sort earliest -> latest (your requirement)
  const sorted = [...matches].sort((a,b)=>{
    const ta = parseISODate(a.date || a.Date) ?? -Infinity;
    const tb = parseISODate(b.date || b.Date) ?? -Infinity;
    if (ta !== tb) return ta - tb;
    // Secondary: round text
    const ra = String(a.round || a.Round || "");
    const rb = String(b.round || b.Round || "");
    return ra.localeCompare(rb);
  });

  for (const m of sorted) {
    const date = m.date || m.Date || "";
    const round = m.round || m.Round || "";
    const home = m.home || m.Home || "";
    const away = m.away || m.Away || "";
    const hg = m.home_goals ?? m.homeGoals ?? m.HomeGoals ?? "";
    const ag = m.away_goals ?? m.awayGoals ?? m.AwayGoals ?? "";
    const goalsLine = formatGoalsList(m);

    const title = `${safeText(home)} ${safeText(hg)} – ${safeText(ag)} ${safeText(away)}`;
    const metaBits = [];
    if (date) metaBits.push(date);
    if (round) metaBits.push(round);

    const meta = metaBits.length ? metaBits.join(" • ") : "";

    const card = document.createElement("div");
    card.className = "match-card";
    card.innerHTML = `
      <div class="match-title">${title}</div>
      <div class="match-meta">${safeText(meta)}</div>
      <p class="goals-line">${goalsLine ? `<strong>Goals:</strong> ${goalsLine}` : `<span class="muted">No goals</span>`}</p>
    `;
    matchesWrap.appendChild(card);
  }
}

function renderSummary(matches){
  summaryBox.style.display = "block";

  // Winner/Runner-up: if your JSON already has them, prefer that
  // Otherwise compute from Final match
  let winner = null;
  let runner = null;

  // Try to find explicit fields anywhere in season matches (sometimes attached to every match)
  for (const m of matches) {
    if (!winner) winner = m.winner || m.Winner || null;
    if (!runner) runner = m.runner_up || m.runnerUp || m["runner-up"] || m.RunnerUp || null;
    if (winner && runner) break;
  }

  if (!winner || !runner) {
    const finalMatch = pickFinalMatch(matches);
    const wr = computeWinnerRunner(finalMatch);
    winner = winner || wr.winner;
    runner = runner || wr.runner;
  }

  winnerVal.textContent = safeText(winner);
  runnerVal.textContent = safeText(runner);

  // Top 5 scorers (compute from goals array)
  const top = computeTopScorers(matches, 5);
  scorersList.innerHTML = "";
  if (!top.length) {
    const li = document.createElement("li");
    li.className = "muted";
    li.textContent = "No scorer data available.";
    scorersList.appendChild(li);
  } else {
    top.forEach(row=>{
      const li = document.createElement("li");
      li.textContent = `${row.player} – ${row.goals}`;
      scorersList.appendChild(li);
    });
  }
}

function setActiveYearButton(year){
  document.querySelectorAll(".year-btn").forEach(btn=>{
    btn.classList.toggle("active", String(btn.dataset.year) === String(year));
  });
}

async function ensureDataLoaded(){
  if (DATA_CACHE && SEASON_MAP) return;

  const res = await fetch(DATA_URL, { cache: "no-store" });
  if (!res.ok) throw new Error(`Failed to load data (${res.status})`);

  const raw = await res.json();
  DATA_CACHE = raw;
  SEASON_MAP = buildSeasonMap(raw);
}

async function loadSeason(year){
  try{
    await ensureDataLoaded();

    const seasonKey = String(year);
    const matches = SEASON_MAP.get(seasonKey) || [];

    setActiveYearButton(year);
    renderSummary(matches);
    renderMatches(matches);
  } catch(err){
    summaryBox.style.display = "block";
    winnerVal.textContent = "—";
    runnerVal.textContent = "—";
    scorersList.innerHTML = `<li class="muted">Data failed to load.</li>`;
    matchesWrap.innerHTML = `<p class="muted">Could not load season data. Check the JSON path: <strong>${DATA_URL}</strong></p>`;
    console.error(err);
  }
}

/* Build year buttons */
years.forEach(y=>{
  const d=document.createElement("div");
  d.className="year-btn";
  d.innerText=y;
  d.dataset.year = y;
  d.onclick = ()=>loadSeason(y);
  grid.appendChild(d);
});

/* Default load (latest year shown first in your array) */
loadSeason(years[0]);
</script>

</body>
</html>
