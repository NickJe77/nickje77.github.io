<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UEFA Champions League – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:0 auto;
padding:30px 20px;
}

h1{text-align:center;margin-bottom:30px;}

.year-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
gap:12px;
margin-bottom:30px;
}

.year-tile{
background:#111;
color:white;
text-align:center;
padding:12px;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

.year-tile.active{
background:#0056d6;
}

.match{
border:1px solid #ddd;
border-radius:12px;
padding:14px;
margin-bottom:16px;
background:white;
}

.match h3{margin:0 0 6px 0;}

.small{font-size:13px;color:#555;}

.team-link{
color:#0056d6;
text-decoration:none;
font-weight:700;
}
.team-link:hover{text-decoration:underline;}

.stage{
font-weight:700;
color:#222;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-champions-league.html">Champions League</a>
<a href="champions-league-year.html">By Year</a>
</div>

<div class="page-wrap">

<h1>UEFA Champions League – By Year</h1>

<div id="years" class="year-grid"></div>
<div id="output"></div>

</div>

<script>
let matchesByYear={};

fetch("data/champions-league.json",{cache:"no-store"})
.then(r=>r.json())
.then(data=>{
 normalise(data);
 buildYears();
});

function normalise(rows){
 rows.forEach(r=>{
  const y=r.Year;
  if(!matchesByYear[y]) matchesByYear[y]=[];
  matchesByYear[y].push(r);
 });
}

function buildYears(){
 const box=document.getElementById("years");

 Object.keys(matchesByYear)
  .sort()
  .forEach(y=>{
   const d=document.createElement("div");
   d.className="year-tile";
   d.textContent=y;
   d.onclick=()=>loadYear(y,d);
   box.appendChild(d);
  });
}

function loadYear(year,btn){
 document.querySelectorAll(".year-tile").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");

 const out=document.getElementById("output");
 out.innerHTML="";

 matchesByYear[year].forEach(m=>{
  const div=document.createElement("div");
  div.className="match";

  div.innerHTML=`
   <h3>
    <span class="team-link">${m.Home}</span>
    ${m.Score}
    <span class="team-link">${m.Away}</span>
   </h3>
   <div class="small stage">${m.Stage}</div>
   <div class="small">${m.Date}</div>
   <div class="small">Winner: ${m.Winner}</div>
  `;

  out.appendChild(div);
 });
}
</script>

</body>
</html>
