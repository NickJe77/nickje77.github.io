<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>European Champions League – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
  body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;color:#111;}
  .navbar{
    display:flex;justify-content:center;gap:22px;
    padding:16px;border-bottom:1px solid #ddd;font-weight:600;
  }
  .navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

  .page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
  h1{text-align:center;margin:0 0 18px;}
  .sub{text-align:center;color:#555;margin:0 0 26px;}

  .controls{
    display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
    margin:0 0 22px;
  }
  select{
    font:inherit;padding:10px 12px;border:1px solid #ccc;border-radius:10px;
    background:#fff;min-width:220px;
  }

  .summary{
    display:grid;grid-template-columns:repeat(3, minmax(0,1fr));
    gap:14px;margin:18px 0 22px;
  }
  .card{
    border:1px solid #e5e5e5;border-radius:14px;padding:14px 14px;
    background:#fff;
  }
  .card h3{margin:0 0 10px;font-size:16px;}
  .meta{color:#555;font-size:14px;line-height:1.4;}
  .meta b{color:#111;}

  .table-wrap{overflow:auto;border:1px solid #e5e5e5;border-radius:14px;}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:780px;}
  th,td{padding:10px 12px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;}
  th{background:#fafafa;font-weight:700;}
  .muted{color:#666;}
  .pill{
    display:inline-block;padding:3px 10px;border-radius:999px;
    border:1px solid #ddd;background:#fafafa;font-size:12px;color:#333;
  }
</style>
</head>

<body>
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="football.html">Football</a>
    <a href="champions-league.html">European Champions League</a>
  </div>

  <div class="page-wrap">
    <h1>European Champions League – By Year</h1>
    <p class="sub">Select a season to view the final, season summary, and all matches.</p>

    <div class="controls">
      <select id="seasonSelect">
        <option value="">Loading seasons…</option>
      </select>
    </div>

    <div class="summary" id="summary" style="display:none;">
      <div class="card">
        <h3>Winner</h3>
        <div class="meta" id="winnerBox">—</div>
      </div>
      <div class="card">
        <h3>Runner-up</h3>
        <div class="meta" id="runnerUpBox">—</div>
      </div>
      <div class="card">
        <h3>Top 5 Goal Scorers</h3>
        <div class="meta" id="topScorersBox">—</div>
      </div>
    </div>

    <div class="table-wrap" id="matchesWrap" style="display:none;">
      <table>
        <thead>
          <tr>
            <th style="width:110px;">Date</th>
            <th style="width:120px;">Stage</th>
            <th>Match</th>
            <th style="width:110px;">Score</th>
          </tr>
        </thead>
        <tbody id="matchesBody"></tbody>
      </table>
    </div>

    <p class="muted" id="status" style="text-align:center;margin-top:18px;"></p>
  </div>

<script>
/* =========================
   Helpers (UEFA-ish objects)
   ========================= */

function get(obj, path, fallback=null){
  try{
    return path.split('.').reduce((o,k)=> (o && k in o) ? o[k] : undefined, obj) ?? fallback;
  }catch(e){ return fallback; }
}

function parseISODate(iso){
  // iso can be "YYYY-MM-DD" or full datetime
  if(!iso) return null;
  const d = new Date(iso);
  return isNaN(d.getTime()) ? null : d;
}

function formatDateShort(d){
  if(!d) return "";
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function seasonStartYearFromMatch(match){
  // Use kickOffTime.date if present, else kickOffTime.dateTime, else fullTimeAt, else null
  const dateStr =
    get(match, "kickOffTime.date") ||
    get(match, "kickOffTime.dateTime") ||
    get(match, "fullTimeAt") ||
    get(match, "date") ||
    null;

  const d = parseISODate(dateStr);
  if(!d) return null;

  const y = d.getFullYear();
  const month = d.getMonth()+1; // 1-12
  // Season convention: July -> next May/June, so Jan–Jun belongs to previous start year
  return (month >= 7) ? y : (y - 1);
}

function seasonLabel(startYear){
  const endYY = String((startYear + 1) % 100).padStart(2,'0');
  return `${startYear}-${endYY}`;
}

function getTeamName(teamObj){
  // Prefer official/translated display name when present
  return (
    get(teamObj, "translations.displayOfficialName.EN") ||
    get(teamObj, "translations.displayName.EN") ||
    get(teamObj, "internationalName") ||
    get(teamObj, "name") ||
    "Unknown"
  );
}

function getStage(match){
  return (
    get(match, "matchday.type") ||
    get(match, "round") ||
    get(match, "stage") ||
    "—"
  );
}

function isFinalMatch(match){
  const t = String(get(match, "matchday.type") || "").toUpperCase();
  return t === "FINAL";
}

function getScore(match){
  // Try common score fields (varies by export)
  const home = get(match, "score.fullTime.home") ??
               get(match, "score.fullTime.homeTeam") ??
               get(match, "score.home") ??
               get(match, "homeScore") ??
               null;

  const away = get(match, "score.fullTime.away") ??
               get(match, "score.fullTime.awayTeam") ??
               get(match, "score.away") ??
               get(match, "awayScore") ??
               null;

  // If still null, try "result" strings
  const resultStr = get(match, "result") || get(match, "Final Score") || null;
  if(home == null || away == null){
    if(resultStr && typeof resultStr === "string" && resultStr.includes("-")){
      return resultStr.replace(/\s+/g,' ').trim();
    }
    return "—";
  }
  return `${home}-${away}`;
}

function getWinnerRunnerUpFromFinal(finalMatch){
  if(!finalMatch) return { winner: "—", runnerUp: "—" };

  const homeName = getTeamName(get(finalMatch, "homeTeam", {}));
  const awayName = getTeamName(get(finalMatch, "awayTeam", {}));
  const scoreStr = getScore(finalMatch);

  // Try numeric compare if we can
  const m = scoreStr.match(/^(\d+)\s*-\s*(\d+)$/);
  if(m){
    const h = parseInt(m[1],10);
    const a = parseInt(m[2],10);
    if(h > a) return { winner: homeName, runnerUp: awayName };
    if(a > h) return { winner: awayName, runnerUp: homeName };
  }

  // If drawn and decided by pens/ET, we may not have pens; fall back to "Home vs Away"
  return { winner: `${homeName} (see match)`, runnerUp: `${awayName} (see match)` };
}

function collectScorersForSeason(matches){
  // UEFA-ish: match.playerEvents.scorers[] with player.name/translations and goalType
  // Only count SCORED
  const totals = new Map();

  for(const match of matches){
    const scorers = get(match, "playerEvents.scorers", []);
    if(!Array.isArray(scorers)) continue;

    for(const ev of scorers){
      const goalType = String(get(ev, "goalType") || "").toUpperCase();
      if(goalType && goalType !== "SCORED") continue;

      const p = get(ev, "player", {});
      const name =
        get(p, "translations.name.EN") ||
        get(p, "internationalName") ||
        get(p, "name") ||
        "Unknown";

      totals.set(name, (totals.get(name) || 0) + 1);
    }
  }

  // Sort desc by goals, then name
  return Array.from(totals.entries())
    .sort((a,b)=> (b[1]-a[1]) || a[0].localeCompare(b[0]))
    .slice(0,5);
}

/* =========================
   Main
   ========================= */

const DATA_URL = "data/champions-league.json";

let ALL = [];
let BY_SEASON = new Map(); // startYear -> matches[]

const seasonSelect = document.getElementById("seasonSelect");
const statusEl = document.getElementById("status");
const summaryEl = document.getElementById("summary");
const winnerBox = document.getElementById("winnerBox");
const runnerUpBox = document.getElementById("runnerUpBox");
const topScorersBox = document.getElementById("topScorersBox");
const matchesWrap = document.getElementById("matchesWrap");
const matchesBody = document.getElementById("matchesBody");

function buildIndex(){
  BY_SEASON.clear();

  for(const match of ALL){
    const startYear = seasonStartYearFromMatch(match);
    if(startYear == null) continue;

    if(!BY_SEASON.has(startYear)) BY_SEASON.set(startYear, []);
    BY_SEASON.get(startYear).push(match);
  }

  // sort matches inside each season by date
  for(const [y, arr] of BY_SEASON.entries()){
    arr.sort((a,b)=>{
      const da = parseISODate(get(a,"kickOffTime.date") || get(a,"kickOffTime.dateTime") || get(a,"fullTimeAt"));
      const db = parseISODate(get(b,"kickOffTime.date") || get(b,"kickOffTime.dateTime") || get(b,"fullTimeAt"));
      const ta = da ? da.getTime() : 0;
      const tb = db ? db.getTime() : 0;
      return ta - tb;
    });
  }
}

function populateSeasonDropdown(){
  const years = Array.from(BY_SEASON.keys()).sort((a,b)=>b-a);

  seasonSelect.innerHTML = `<option value="">Select season…</option>` +
    years.map(y => `<option value="${y}">${seasonLabel(y)}</option>`).join("");

  // auto-select most recent season
  if(years.length){
    seasonSelect.value = String(years[0]);
    renderSeason(years[0]);
  } else {
    statusEl.textContent = "No seasons found in the dataset.";
  }
}

function renderSeason(startYear){
  const y = parseInt(startYear, 10);
  const matches = BY_SEASON.get(y) || [];
  if(!matches.length){
    summaryEl.style.display = "none";
    matchesWrap.style.display = "none";
    statusEl.textContent = "No matches found for this season.";
    return;
  }

  // Find final (prefer matchday.type === FINAL; otherwise last match)
  let finalMatch = matches.find(isFinalMatch);
  if(!finalMatch) finalMatch = matches[matches.length - 1];

  const { winner, runnerUp } = getWinnerRunnerUpFromFinal(finalMatch);
  winnerBox.innerHTML = `<b>${winner}</b>`;
  runnerUpBox.innerHTML = `<b>${runnerUp}</b>`;

  const top5 = collectScorersForSeason(matches);
  if(top5.length){
    topScorersBox.innerHTML = top5.map(([name, goals], idx) =>
      `${idx+1}. <b>${name}</b> — ${goals}`
    ).join("<br>");
  } else {
    topScorersBox.innerHTML = "No scorer events found in this dataset export.";
  }

  // Build match rows
  matchesBody.innerHTML = matches.map(m=>{
    const d = parseISODate(get(m,"kickOffTime.date") || get(m,"kickOffTime.dateTime") || get(m,"fullTimeAt"));
    const dateStr = formatDateShort(d);
    const stage = getStage(m);

    const home = getTeamName(get(m,"homeTeam",{}));
    const away = getTeamName(get(m,"awayTeam",{}));
    const score = getScore(m);

    return `
      <tr>
        <td>${dateStr || "—"}</td>
        <td><span class="pill">${stage}</span></td>
        <td><b>${home}</b> vs <b>${away}</b></td>
        <td>${score}</td>
      </tr>
    `;
  }).join("");

  summaryEl.style.display = "grid";
  matchesWrap.style.display = "block";
  statusEl.textContent = `${seasonLabel(y)} — ${matches.length} matches`;
}

seasonSelect.addEventListener("change", ()=>{
  const val = seasonSelect.value;
  if(!val){
    summaryEl.style.display = "none";
    matchesWrap.style.display = "none";
    statusEl.textContent = "";
    return;
  }
  renderSeason(val);
});

(async function init(){
  try{
    statusEl.textContent = "Loading…";
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if(!res.ok) throw new Error(`Failed to load ${DATA_URL} (${res.status})`);
    const data = await res.json();

    if(!Array.isArray(data)) throw new Error("JSON is not an array of matches.");
    ALL = data;

    buildIndex();
    populateSeasonDropdown();
    statusEl.textContent = "";
  }catch(err){
    console.error(err);
    seasonSelect.innerHTML = `<option value="">(Failed to load seasons)</option>`;
    statusEl.textContent = "Error loading dataset. Check the JSON path and structure.";
  }
})();
</script>
</body>
</html>
