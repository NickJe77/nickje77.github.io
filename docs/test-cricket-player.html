<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Test Cricket Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f8fc;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:24px;
}

.hero{
  background:linear-gradient(135deg,#0d3320,#1a6b3c);
  color:#fff;
  padding:40px;
  border-radius:22px;
}

.hero h1{
  margin:0;
  font-size:42px;
}

/* SEARCH */
.search-wrap{
  margin:20px 0 10px;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.search-wrap input{
  padding:10px 14px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
  width:280px;
}

.search-wrap input:focus{
  outline:2px solid #1a6b3c;
  border-color:#1a6b3c;
}

.search-results{
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
  max-height:220px;
  overflow-y:auto;
  width:280px;
  display:none;
}

.search-result-item{
  padding:10px 14px;
  cursor:pointer;
  font-size:14px;
  border-bottom:1px solid #f0f0f0;
}

.search-result-item:last-child{border-bottom:none;}
.search-result-item:hover{background:#f0f7f2;}

/* CONTROLS */
.controls{
  margin:16px 0;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.controls label{font-size:14px;color:#555;font-weight:600;}

select{
  padding:8px 14px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
  background:#fff;
}

.tab-btn{
  padding:8px 18px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
  cursor:pointer;
  background:#fff;
  font-weight:600;
}

.tab-btn.active{
  background:#1a6b3c;
  color:#fff;
  border-color:#1a6b3c;
}

/* STATS */
.section-title{
  margin:24px 0 10px;
  font-weight:700;
  color:#0d3320;
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
}

.stat{
  background:#fff;
  padding:16px;
  border-radius:12px;
  text-align:center;
  border:1px solid #d0e8da;
}

.stat h3{
  margin:0 0 4px;
  font-size:26px;
  color:#0d3320;
}

.stat span{
  font-size:12px;
  color:#888;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.5px;
}

/* TABLE */
.table-wrap{
  margin-top:20px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th{
  background:linear-gradient(135deg,#0d3320,#1a6b3c);
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid #eee;
}

td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:'SF Mono',Consolas,monospace;}

tr:nth-child(even){background:#f4f8fc;}
tr.game-row{cursor:pointer;}
tr.game-row:hover{background:#d6ede0;}

.empty-msg{
  padding:40px;
  text-align:center;
  color:#aaa;
  font-size:15px;
}

footer{
  text-align:center;
  padding:24px 20px;
  font-size:12px;
  color:#aaa;
  border-top:1px solid #eee;
  margin-top:40px;
}
footer a{color:#888;text-decoration:none;}
footer a:hover{text-decoration:underline;}

</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="test-cricket.html">Test Cricket</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="playerName">Test Cricket Player</h1>
  </div>

  <div class="search-wrap">
    <div>
      <input type="text" id="playerSearch" placeholder="Search player name…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div id="playerContent" style="display:none">

    <div class="controls">
      <label>Opposition:</label>
      <select id="oppSelect"></select>
      <button class="tab-btn active" id="batBtn">Batting</button>
      <button class="tab-btn" id="bowlBtn">Bowling</button>
    </div>

    <div class="section-title">Career</div>
    <div class="stats" id="careerStats"></div>

    <div class="section-title">vs Selected Opposition</div>
    <div class="stats" id="vsStats"></div>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="gamesTable"></tbody>
      </table>
    </div>

  </div>

  <div id="emptyMsg" class="empty-msg">Search for a player above to view their Test career stats.</div>

</div>

<footer>
  Scorecard data sourced from <a href="https://www.howstat.com" target="_blank">howstat.com</a>
</footer>

<script>
const BASE = '/data/test_cricket';

let allPlayers = {};   // name -> [{year, matchIdx, match}]
let battingGames = [];
let bowlingGames = [];
let currentTab = 'bat';

// Build player index by scanning all years
async function buildPlayerIndex() {
  const years = [];
  for (let y = 1970; y <= 2026; y++) years.push(y);

  await Promise.all(years.map(async year => {
    try {
      const res = await fetch(`${BASE}/tests_${year}.json`);
      if (!res.ok) return;
      const data = await res.json();
      (data.matches || []).forEach((match, idx) => {
        const innings = match.scorecard?.innings || [];

        // Build surname lookup from batting arrays for this match
        const surnameMap = {};
        const fullNameSet = new Set();
        innings.forEach(inn => {
          (inn.batting || []).forEach(b => {
            const full = b.batsman.trim();
            fullNameSet.add(full);
            const parts = full.split(/\s+/);
            const surname = parts[parts.length - 1].toLowerCase();
            if (!surnameMap[surname]) surnameMap[surname] = [];
            if (!surnameMap[surname].includes(full)) surnameMap[surname].push(full);
          });
        });

        function resolveName(raw) {
          const clean = raw.trim();
          if (fullNameSet.has(clean)) return clean;
          const parts = clean.split(/\s+/);
          const surname = parts[parts.length - 1].toLowerCase();
          const candidates = surnameMap[surname] || [];
          if (candidates.length === 0) return clean; // keep as-is
          if (candidates.length === 1) return candidates[0];
          if (parts.length > 1) {
            const initials = parts.slice(0, -1).map(p => p[0].toUpperCase()).join('');
            for (const candidate of candidates) {
              const cParts = candidate.split(/\s+/);
              const cInitials = cParts.slice(0, -1).map(p => p[0].toUpperCase()).join('');
              if (cInitials === initials) return candidate;
              if (cInitials[0] === initials[0]) return candidate;
            }
          }
          return candidates[0];
        }

        innings.forEach(inn => {
          // Index batters by full name (already correct)
          (inn.batting || []).forEach(b => {
            const name = b.batsman;
            if (!allPlayers[name]) allPlayers[name] = [];
            if (!allPlayers[name].find(e => e.year === year && e.matchIdx === idx)) {
              allPlayers[name].push({ year, matchIdx: idx, match });
            }
          });

          // Index bowlers — resolve abbreviated names to full names
          const bowlSeen = new Set();
          (inn.bowling || []).forEach(b => {
            if (bowlSeen.has(b.bowler)) return;
            bowlSeen.add(b.bowler);
            const name = resolveName(b.bowler);
            if (!allPlayers[name]) allPlayers[name] = [];
            if (!allPlayers[name].find(e => e.year === year && e.matchIdx === idx)) {
              allPlayers[name].push({ year, matchIdx: idx, match });
            }
          });
        });
      });
    } catch {}
  }));
}

// Search
const searchInput = document.getElementById('playerSearch');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2) { searchResults.style.display = 'none'; return; }
  const matches = Object.keys(allPlayers).filter(n => n.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.innerHTML = matches.map(n =>
    `<div class="search-result-item" data-name="${n.replace(/"/g,'&quot;')}">${n}</div>`
  ).join('');
  searchResults.style.display = 'block';
});

searchResults.addEventListener('mousedown', e => {
  e.preventDefault(); // prevent input blur from hiding results before click fires
  const item = e.target.closest('.search-result-item');
  if (!item) return;
  const name = item.dataset.name;
  selectPlayer(name);
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchResults.style.display = 'none';
});

function selectPlayer(name) {
  searchInput.value = name;
  searchResults.style.display = 'none';
  document.getElementById('playerName').textContent = name;
  loadPlayer(name);
}

function loadPlayer(name) {
  battingGames = [];
  bowlingGames = [];

  const entries = allPlayers[name] || [];
  // dedupe by year+matchIdx
  const seen = new Set();
  const unique = entries.filter(e => {
    const k = `${e.year}-${e.matchIdx}`;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });

  unique.forEach(({ year, matchIdx, match }) => {
    const innings = match.scorecard?.innings || [];
    const info = match.scorecard?.match_info || {};
    const series = info.Series || match.teams || '';
    const venue = info.Venue || match.ground || '';
    const date = match.date || '';
    const testNo = info['Match No.'] || `#${match.match_number}`;

    // Build surname resolver for this match
    const surnameMap = {};
    const fullNameSet = new Set();
    innings.forEach(inn => {
      (inn.batting || []).forEach(b => {
        const full = b.batsman.trim();
        fullNameSet.add(full);
        const parts = full.split(/\s+/);
        const surname = parts[parts.length - 1].toLowerCase();
        if (!surnameMap[surname]) surnameMap[surname] = [];
        if (!surnameMap[surname].includes(full)) surnameMap[surname].push(full);
      });
    });

    function resolveName(raw) {
      const clean = raw.trim();
      if (fullNameSet.has(clean)) return clean;
      const parts = clean.split(/\s+/);
      const surname = parts[parts.length - 1].toLowerCase();
      const candidates = surnameMap[surname] || [];
      if (candidates.length === 0) return clean;
      if (candidates.length === 1) return candidates[0];
      if (parts.length > 1) {
        const initials = parts.slice(0, -1).map(p => p[0].toUpperCase()).join('');
        for (const candidate of candidates) {
          const cParts = candidate.split(/\s+/);
          const cInitials = cParts.slice(0, -1).map(p => p[0].toUpperCase()).join('');
          if (cInitials === initials) return candidate;
          if (cInitials[0] === initials[0]) return candidate;
        }
      }
      return candidates[0];
    }

    innings.forEach(inn => {
      const battingEntry = (inn.batting || []).find(b => b.batsman === name);
      // Match bowling by resolving the bowler name
      const bowlingEntries = (inn.bowling || []).filter(b => resolveName(b.bowler) === name);

      // Determine opponent
      const teams = innings.map(i => i.team).filter((v,i,a)=>a.indexOf(v)===i);
      const opponent = teams.find(t => t !== inn.team) || '—';

      if (battingEntry) {
        battingGames.push({
          year, date, testNo, series, venue,
          opponent,
          runs: battingEntry.runs,
          balls: battingEntry.balls_faced,
          fours: battingEntry.fours,
          sixes: battingEntry.sixes,
          sr: battingEntry.strike_rate,
          dismissal: battingEntry.dismissal,
          notOut: (battingEntry.dismissal||'').toLowerCase().includes('not out'),
        });
      }

      bowlingEntries.forEach(b => {
        if (b.overs) {
          bowlingGames.push({
            year, date, testNo, series, venue,
            opponent,
            overs: b.overs,
            maidens: b.maidens,
            runs: b.runs,
            wickets: b.wickets,
            economy: b.economy,
          });
        }
      });
    });
  });

  // Dedupe bowling (bowler appears 3x in JSON)
  const bowlSeen = new Set();
  bowlingGames = bowlingGames.filter(g => {
    const k = `${g.year}-${g.testNo}-${g.overs}-${g.runs}-${g.wickets}`;
    if (bowlSeen.has(k)) return false;
    bowlSeen.add(k); return true;
  });

  // Build opposition dropdown
  const oppSel = document.getElementById('oppSelect');
  const opps = [...new Set([...battingGames, ...bowlingGames].map(g => g.opponent))].sort();
  oppSel.innerHTML = ['All', ...opps].map(o => `<option value="${o}">${o}</option>`).join('');

  document.getElementById('playerContent').style.display = 'block';
  document.getElementById('emptyMsg').style.display = 'none';

  render();
}

function sum(list, key) { return list.reduce((a, b) => a + (Number(b[key]) || 0), 0); }

function avg(runs, inns, notOuts) {
  const outs = inns - notOuts;
  return outs > 0 ? (runs / outs).toFixed(2) : '—';
}

function render() {
  const opp = document.getElementById('oppSelect').value;
  const batList = opp === 'All' ? battingGames : battingGames.filter(g => g.opponent === opp);
  const bowlList = opp === 'All' ? bowlingGames : bowlingGames.filter(g => g.opponent === opp);

  if (currentTab === 'bat') {
    const totalRuns = sum(battingGames, 'runs');
    const totalInns = battingGames.length;
    const totalNO = battingGames.filter(g => g.notOut).length;
    const totalBalls = sum(battingGames, 'balls');
    const top = battingGames.reduce((a, b) => b.runs > (a?.runs||0) ? b : a, null);

    document.getElementById('careerStats').innerHTML = `
      <div class="stat"><h3>${totalInns}</h3><span>Innings</span></div>
      <div class="stat"><h3>${totalRuns}</h3><span>Runs</span></div>
      <div class="stat"><h3>${avg(totalRuns, totalInns, totalNO)}</h3><span>Average</span></div>
      <div class="stat"><h3>${totalBalls ? ((totalRuns/totalBalls)*100).toFixed(1) : '—'}</h3><span>Strike Rate</span></div>
      <div class="stat"><h3>${top ? top.runs + (top.notOut?'*':'') : '—'}</h3><span>Top Score</span></div>
      <div class="stat"><h3>${sum(battingGames,'fours')}</h3><span>Fours</span></div>
      <div class="stat"><h3>${sum(battingGames,'sixes')}</h3><span>Sixes</span></div>
    `;

    const vsRuns = sum(batList, 'runs');
    const vsInns = batList.length;
    const vsNO = batList.filter(g => g.notOut).length;
    const vsBalls = sum(batList, 'balls');

    document.getElementById('vsStats').innerHTML = `
      <div class="stat"><h3>${vsInns}</h3><span>Innings</span></div>
      <div class="stat"><h3>${vsRuns}</h3><span>Runs</span></div>
      <div class="stat"><h3>${avg(vsRuns, vsInns, vsNO)}</h3><span>Average</span></div>
      <div class="stat"><h3>${vsBalls ? ((vsRuns/vsBalls)*100).toFixed(1) : '—'}</h3><span>Strike Rate</span></div>
    `;

    document.getElementById('tableHead').innerHTML = `<tr>
      <th>Test #</th><th>Date</th><th>Series</th><th>Venue</th>
      <th class="num">R</th><th class="num">B</th><th class="num">4s</th>
      <th class="num">6s</th><th class="num">SR</th><th>Dismissal</th>
    </tr>`;

    document.getElementById('gamesTable').innerHTML = batList.length ? batList.map(g => `
      <tr class="game-row">
        <td>${g.testNo}</td>
        <td>${g.date}</td>
        <td>${g.series}</td>
        <td>${g.venue}</td>
        <td class="num">${g.runs}${g.notOut?'*':''}</td>
        <td class="num">${g.balls??'—'}</td>
        <td class="num">${g.fours??'—'}</td>
        <td class="num">${g.sixes??'—'}</td>
        <td class="num">${g.sr!=null?Number(g.sr).toFixed(1):'—'}</td>
        <td>${g.dismissal||'—'}</td>
      </tr>`).join('') :
      `<tr><td colspan="10" class="empty-msg">No batting data found</td></tr>`;

  } else {
    const totalWkts = sum(bowlingGames, 'wickets');
    const totalRuns = sum(bowlingGames, 'runs');
    const totalOvers = sum(bowlingGames, 'overs');
    const totalMaidens = sum(bowlingGames, 'maidens');
    const best = bowlingGames.reduce((a, b) => b.wickets > (a?.wickets||0) ? b : a, null);

    document.getElementById('careerStats').innerHTML = `
      <div class="stat"><h3>${bowlingGames.length}</h3><span>Innings</span></div>
      <div class="stat"><h3>${totalWkts}</h3><span>Wickets</span></div>
      <div class="stat"><h3>${totalOvers ? (totalRuns/totalOvers).toFixed(2) : '—'}</h3><span>Economy</span></div>
      <div class="stat"><h3>${totalWkts ? (totalRuns/totalWkts).toFixed(1) : '—'}</h3><span>Average</span></div>
      <div class="stat"><h3>${totalMaidens}</h3><span>Maidens</span></div>
      <div class="stat"><h3>${best ? best.wickets+'/'+best.runs : '—'}</h3><span>Best</span></div>
    `;

    const vsWkts = sum(bowlList, 'wickets');
    const vsRuns = sum(bowlList, 'runs');
    const vsOvers = sum(bowlList, 'overs');

    document.getElementById('vsStats').innerHTML = `
      <div class="stat"><h3>${bowlList.length}</h3><span>Innings</span></div>
      <div class="stat"><h3>${vsWkts}</h3><span>Wickets</span></div>
      <div class="stat"><h3>${vsOvers ? (vsRuns/vsOvers).toFixed(2) : '—'}</h3><span>Economy</span></div>
      <div class="stat"><h3>${vsWkts ? (vsRuns/vsWkts).toFixed(1) : '—'}</h3><span>Average</span></div>
    `;

    document.getElementById('tableHead').innerHTML = `<tr>
      <th>Test #</th><th>Date</th><th>Series</th><th>Venue</th>
      <th class="num">O</th><th class="num">M</th>
      <th class="num">R</th><th class="num">W</th><th class="num">Econ</th>
    </tr>`;

    document.getElementById('gamesTable').innerHTML = bowlList.length ? bowlList.map(g => `
      <tr class="game-row">
        <td>${g.testNo}</td>
        <td>${g.date}</td>
        <td>${g.series}</td>
        <td>${g.venue}</td>
        <td class="num">${g.overs}</td>
        <td class="num">${g.maidens}</td>
        <td class="num">${g.runs}</td>
        <td class="num">${g.wickets}</td>
        <td class="num">${g.economy!=null?Number(g.economy).toFixed(2):'—'}</td>
      </tr>`).join('') :
      `<tr><td colspan="9" class="empty-msg">No bowling data found</td></tr>`;
  }
}

document.getElementById('batBtn').onclick = () => {
  currentTab = 'bat';
  document.getElementById('batBtn').classList.add('active');
  document.getElementById('bowlBtn').classList.remove('active');
  render();
};
document.getElementById('bowlBtn').onclick = () => {
  currentTab = 'bowl';
  document.getElementById('bowlBtn').classList.add('active');
  document.getElementById('batBtn').classList.remove('active');
  render();
};
document.getElementById('oppSelect').onchange = render;

// Init — build index on load
buildPlayerIndex();
</script>

</body>
</html>
