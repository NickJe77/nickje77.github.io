<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>World Cup Country | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --board-line:rgba(255,255,255,.10);
  --accent:#1fa25c;
  --league:#a8790a;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{color:var(--ink);text-decoration:none;opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

/* ── Header hero ──────────────────────────────────────── */
.header{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:22px;padding:36px 26px;display:flex;align-items:center;justify-content:center;
  position:relative;
}
.header h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,46px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.version{
  position:absolute;top:16px;right:18px;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  color:rgba(255,255,255,.5);text-transform:uppercase;
}

/* ── Stats ────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.stat-box{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  text-align:center;font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink);line-height:1.7;
}

/* ── Leaders ──────────────────────────────────────────── */
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:30px;}
.leader-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.leader-box h3{
  text-align:center;margin:0 0 12px;font-family:var(--display);font-weight:600;font-size:14px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--league);
}
.leader-line{font-size:13.5px;font-weight:600;padding:6px 0;border-bottom:1px solid var(--line);text-align:center;color:var(--ink);}
.leader-line:last-child{border-bottom:none;}

/* ── Year sections ────────────────────────────────────── */
.year-section{margin-bottom:30px;}
.year-section h2{
  border-bottom:2px solid var(--league);padding-bottom:8px;font-family:var(--display);font-weight:600;
  font-size:22px;letter-spacing:.01em;color:var(--ink);margin:0 0 14px;
}

.match{
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-top:10px;
  background:var(--surface);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.match:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,16,24,.18);border-color:var(--faint);}
.match h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink);}
.small{font-size:12.5px;color:var(--muted);font-weight:600;}
.error{color:#c0362c;font-weight:700;}
</style>
</head>

<body>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="world-cup-countries.html">Countries</a>
</nav>

<div class="page-wrap">
<div id="content"></div>
</div>

<script>
let team=new URLSearchParams(location.search).get("team");

/* ---------- NORMALISE ---------- */
function normalizeTeam(name){
 if(!name) return "";
 let n=String(name).replace(/\u00A0/g," ").trim();
 let k=n.toLowerCase();

 if(k.includes("west germany")) return "Germany";
 if(k==="frg") return "Germany";
 if(k.includes("federal republic")) return "Germany";
 if(k.includes("fr germany")) return "Germany";

 return n;
}

team=normalizeTeam(team);

if(!team){
 document.getElementById("content").innerHTML="<div class='error'>No country selected.</div>";
 throw new Error("No team");
}

/* ---------- COUNTRY CODE MAP ---------- */
const codeMap={
BRA:"Brazil",ITA:"Italy",ARG:"Argentina",FRA:"France",ENG:"England",ESP:"Spain",
GER:"Germany",NED:"Netherlands",URU:"Uruguay",POR:"Portugal",BEL:"Belgium",
CRO:"Croatia",MEX:"Mexico",USA:"USA",JPN:"Japan",KOR:"South Korea",
AUS:"Australia",AUT:"Austria",SUI:"Switzerland",SWE:"Sweden",NOR:"Norway",
DEN:"Denmark",POL:"Poland",CZE:"Czech Republic",RUS:"Russia",UKR:"Ukraine",
TUR:"Turkey",GRE:"Greece",SCO:"Scotland",WAL:"Wales",IRL:"Ireland",
MAR:"Morocco",CMR:"Cameroon",NGA:"Nigeria",GHA:"Ghana",SEN:"Senegal",
TUN:"Tunisia",ALG:"Algeria",IRN:"Iran",IRQ:"Iraq",KSA:"Saudi Arabia",
QAT:"Qatar",CHN:"China",RSA:"South Africa",NZL:"New Zealand",CAN:"Canada",
CRC:"Costa Rica",HON:"Honduras",PAN:"Panama",JAM:"Jamaica",TTO:"Trinidad and Tobago",
COL:"Colombia",CHI:"Chile",PER:"Peru",PAR:"Paraguay",ECU:"Ecuador",BOL:"Bolivia",VEN:"Venezuela"
};

/* ---------- HELPERS ---------- */

function isGrandFinalRound(round){
 const r=String(round||"").toLowerCase();
 if(!/\bfinal\b/.test(r)) return false;
 if(/semi|quarter|third|bronze|3rd|playoff|play-off|placement/.test(r)) return false;
 return true;
}

function getGrandFinalMatch(matches){
 const finals=matches.filter(m=>isGrandFinalRound(m.round));
 return finals.length?finals[finals.length-1]:null;
}

// Handles two raw "Final Score" formats seen in the data:
//   "2-1"              -> normal result, no shootout
//   "(2) 1-1 (4)"       -> regulation score 1-1 (a draw), decided (2) v (4) on penalties
// The old version did `score.split("(")[0]` to strip parentheses, which for
// a shootout string starting with "(" left an EMPTY string before the first
// "(" — so shootout matches silently contributed zero goals to a country's
// tally instead of the real regulation score.
function parseScore(score){
 const raw = (score||"").trim();
 if(!raw) return null;

 const shootoutMatch = raw.match(/^\((\d+)\)\s*(\d+)\s*[-–]\s*(\d+)\s*\((\d+)\)$/);
 if(shootoutMatch){
  return {
   reg: [parseInt(shootoutMatch[2],10), parseInt(shootoutMatch[3],10)],
   shootout: [parseInt(shootoutMatch[1],10), parseInt(shootoutMatch[4],10)]
  };
 }

 const plainMatch = raw.match(/(\d+)\s*[-–]\s*(\d+)/);
 if(plainMatch){
  return { reg: [parseInt(plainMatch[1],10), parseInt(plainMatch[2],10)], shootout: null };
 }

 return null;
}

// The data's "Winnning Team" field is often blank for shootout matches
// (regulation time was a draw), so derive the real winner from who scored
// more penalties instead of undercounting that team's titles/finals/wins.
function resolveWinner(m){
 if(m.winner) return m.winner;
 const parsed = parseScore(m.score);
 if(parsed && parsed.shootout){
  const [p1, p2] = parsed.shootout;
  if(p1 > p2) return m.team1;
  if(p2 > p1) return m.team2;
 }
 return m.winner; // still blank/falsy — genuinely a draw or no data
}

function parseProgress(p){
 if(!p) return null;
 const s=String(p).trim();
 if(!s) return null;
 const a=s.split(/[-–]/);
 if(a.length!==2) return null;
 const x=parseInt(a[0]),y=parseInt(a[1]);
 if(isNaN(x)||isNaN(y)) return null;
 return [x,y];
}

function parseEvent(str){
 if(!str) return null;
 const s=str.trim();
 if(!s) return null;
 const m=s.match(/^(.*?)\s*\(([^)]+)\)$/);
 if(m) return {name:m[1].trim(),tag:m[2].trim()};
 return {name:s,tag:null};
}

function whoScored(prev,curr){
 if(!prev||!curr) return null;
 if(curr[0]===prev[0]+1 && curr[1]===prev[1]) return "team1";
 if(curr[1]===prev[1]+1 && curr[0]===prev[0]) return "team2";
 return null;
}

/* ---------- LOAD ---------- */

fetch("data/world-cup.json",{cache:"no-store"})
.then(r=>r.json())
.then(rows=>{
 let byYear={},cur=null;

 rows.forEach(r=>{
  if(r.Team){
   cur={
    year:r.Year,
    round:r.Round,
    team1:normalizeTeam(r.Team),
    team2:normalizeTeam(r.Team__1),
    score:r["Final Score"],
    winner:normalizeTeam(r["Winnning Team"]),
    events:[]
   };

   if(!byYear[r.Year]) byYear[r.Year]=[];
   byYear[r.Year].push(cur);
  }

  if(cur&&(r.Scorers||r["Yellow Cards"]||r["Red Cards"])){
   cur.events.push({
    scorer:r.Scorers||"",
    progress:r["Progess Score"]||"",
    yellow:r["Yellow Cards"]||"",
    red:r["Red Cards"]||""
   });
  }
 });

 render(team,byYear);
});

/* ---------- RENDER ---------- */

function render(team,data){

 let appearances=0,titles=0,finals=0,matches=0,goals=0;
 let g={},y={},rr={};

 const years=Object.keys(data).sort();

 years.forEach(year=>{
  const matchesYear=data[year];
  const teamMatches=matchesYear.filter(m=>m.team1===team||m.team2===team);
  if(teamMatches.length) appearances++;

  const gf=getGrandFinalMatch(matchesYear);
  if(gf){
   if(gf.team1===team||gf.team2===team) finals++;
   if(resolveWinner(gf)===team) titles++;
  }

  teamMatches.forEach(m=>{
   matches++;

   const sc=parseScore(m.score);
   if(sc){
    if(m.team1===team) goals+=sc.reg[0];
    if(m.team2===team) goals+=sc.reg[1];
   }

   let prev=[0,0];

   m.events.forEach(e=>{
    const prog=parseProgress(e.progress);

    if(e.scorer){
     const p=parseEvent(e.scorer);
     const side=whoScored(prev,prog);
     if(p&&p.name&&side){
      const scoring=(side==="team1")?m.team1:m.team2;
      if(scoring===team){
       g[p.name]=(g[p.name]||0)+1;
      }
     }
    }

    if(prog) prev=prog;

    // FIX: split on ";" to handle multiple players per card field,
    // then evaluate each player's country tag individually.
    if(e.yellow){
     e.yellow.split(";").forEach(entry=>{
      const p=parseEvent(entry.trim());
      const country=codeMap[p&&p.tag]||"";
      if(p&&p.name&&country===team){
       y[p.name]=(y[p.name]||0)+1;
      }
     });
    }

    if(e.red){
     e.red.split(";").forEach(entry=>{
      const p=parseEvent(entry.trim());
      const country=codeMap[p&&p.tag]||"";
      if(p&&p.name&&country===team){
       rr[p.name]=(rr[p.name]||0)+1;
      }
     });
    }
   });
  });
 });

 const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5);

 let html=`
 <div class="header">
  <h1>${team}</h1>
  <div class="version">Country Page v14</div>
 </div>

 <div class="stats">
  <div class="stat-box">Appearances<br>${appearances}</div>
  <div class="stat-box">Titles<br>${titles}</div>
  <div class="stat-box">Finals<br>${finals}</div>
  <div class="stat-box">Matches<br>${matches}</div>
  <div class="stat-box">Goals<br>${goals}</div>
 </div>

 <div class="leaders">
  <div class="leader-box"><h3>Top 5 Goals</h3>${top(g).map(p=>`<div class="leader-line">${p[0]} – ${p[1]}</div>`).join("")}</div>
  <div class="leader-box"><h3>Top 5 Yellow Cards</h3>${top(y).map(p=>`<div class="leader-line">${p[0]} – ${p[1]}</div>`).join("")}</div>
  <div class="leader-box"><h3>Top 5 Red Cards</h3>${top(rr).map(p=>`<div class="leader-line">${p[0]} – ${p[1]}</div>`).join("")}</div>
 </div>
`;

 years.forEach(year=>{
  const ym=data[year].filter(m=>m.team1===team||m.team2===team);
  if(!ym.length) return;

  html+=`<div class="year-section"><h2>${year}</h2>`;
  ym.forEach(m=>{
   const mWinner = resolveWinner(m);
   html+=`
    <a class="match" style="display:block;text-decoration:none;color:inherit;" href="world-cup-match.html?year=${encodeURIComponent(m.year)}&round=${encodeURIComponent(m.round)}&team1=${encodeURIComponent(m.team1)}&team2=${encodeURIComponent(m.team2)}">
     <h3>${m.team1} ${m.score} ${m.team2}</h3>
     <div class="small">${m.round}</div>
     <div class="small">Winner: ${mWinner || "Draw"}</div>
    </a>`;
  });
  html+=`</div>`;
 });

 document.getElementById("content").innerHTML=html;
}
</script>

</body>
</html>
