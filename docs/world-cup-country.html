<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Cup Country | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}

.header{margin-bottom:20px;}
.header h1{margin:0;font-size:32px;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:25px;}
.stat-box{border:1px solid #ddd;border-radius:10px;padding:14px;background:#fafafa;text-align:center;font-weight:700;}

.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:40px;}
.leader-box{border:1px solid #ddd;border-radius:10px;padding:14px;background:#f9fbff;font-weight:700;}
.leader-box h3{text-align:center;margin:0 0 10px 0;}

.leader-line{font-size:14px;font-weight:600;padding:4px 0;border-bottom:1px solid #eee;}
.leader-line:last-child{border-bottom:none;}

.year-section{margin-bottom:40px;}
.year-section h2{border-bottom:2px solid #0056d6;padding-bottom:6px;}

.match{border:1px solid #ddd;border-radius:10px;padding:14px;margin-top:12px;background:white;}
.match h3{margin:0 0 6px 0;}
.small{font-size:13px;color:#555;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="world-cup-countries.html">Countries</a>
</div>

<div class="page-wrap">
<div id="content"></div>
</div>

<script>
const team=new URLSearchParams(location.search).get("team");

const aliases={
"Argentina":["ARG","Argentina"],
"Brazil":["BRA","Brazil"],
"Germany":["GER","DEU","Germany"],
"France":["FRA","France"],
"Italy":["ITA","Italy"],
"Spain":["ESP","Spain"],
"England":["ENG","England"],
"Netherlands":["NED","Netherlands"],
"Portugal":["POR","Portugal"],
"Uruguay":["URU","Uruguay"],
"Belgium":["BEL","Belgium"],
"Croatia":["CRO","Croatia"],
"Australia":["AUS","Australia"],
"Austria":["AUT","Austria"],
"Switzerland":["SUI","Switzerland"],
"Scotland":["SCO","Scotland"],
"Wales":["WAL","Wales"],
"Ireland":["IRL","Ireland"],
"Japan":["JPN","Japan"],
"Mexico":["MEX","Mexico"],
"USA":["USA","United States","US"]
};

function parseEvent(str){
 const m=str.match(/^(.*?)\s*\(([^)]+)\)$/);
 if(m) return {name:m[1].trim(),country:m[2].trim()};
 return {name:str.trim(),country:null};
}

function matchesTeam(bracket){
 if(!bracket) return true;
 const list=aliases[team];
 if(!list) return bracket===team;
 return list.includes(bracket);
}

function isFinal(round){
 round=String(round).toLowerCase();
 return round.includes("final") && !round.includes("semi") && !round.includes("quarter");
}

fetch("data/world-cup.json",{cache:"no-store"})
.then(r=>r.json())
.then(rows=>{
 let data={},cur=null;

 rows.forEach(r=>{
  if(r.Team){
   cur={year:r.Year,round:r.Round,team1:r.Team,team2:r.Team__1,
        score:r["Final Score"],winner:r["Winnning Team"],events:[]};
   if(!data[r.Year]) data[r.Year]=[];
   data[r.Year].push(cur);
  }

  if(cur&&(r.Scorers||r["Yellow Cards"]||r["Red Cards"])){
   cur.events.push({
    scorer:r.Scorers||"",
    yellow:r["Yellow Cards"]||"",
    red:r["Red Cards"]||""
   });
  }
 });

 render(team,data);
});

function render(team,data){

 let appearances=0,titles=0,finals=0,matchesPlayed=0,goalsScored=0;
 let g={},y={},r={};

 Object.keys(data).sort().forEach(year=>{
  const ym=data[year].filter(m=>m.team1===team||m.team2===team);
  if(!ym.length) return;

  appearances++;

  const finalMatch=ym.find(m=>isFinal(m.round));
  if(finalMatch){
   finals++;
   if(finalMatch.winner===team) titles++;
  }

  ym.forEach(m=>{
   matchesPlayed++;

   const ps=String(m.score).split(/[-–]/);
   if(ps.length===2){
    if(m.team1===team) goalsScored+=parseInt(ps[0])||0;
    if(m.team2===team) goalsScored+=parseInt(ps[1])||0;
   }

   m.events.forEach(e=>{
    [["scorer",g],["yellow",y],["red",r]].forEach(pair=>{
     const raw=e[pair[0]];
     if(!raw) return;

     const p=parseEvent(raw);
     if(!p.name) return;

     if(p.country && !matchesTeam(p.country)) return;

     pair[1][p.name]=(pair[1][p.name]||0)+1;
    });
   });
  });
 });

 const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5);

 let html=`
 <div class="header"><h1>${team}</h1></div>

 <div class="stats">
  <div class="stat-box">Appearances<br>${appearances}</div>
  <div class="stat-box">Titles<br>${titles}</div>
  <div class="stat-box">Finals<br>${finals}</div>
  <div class="stat-box">Matches<br>${matchesPlayed}</div>
  <div class="stat-box">Goals<br>${goalsScored}</div>
 </div>

 <div class="leaders">
  <div class="leader-box"><h3>Top 5 Goals</h3>${top(g).map(p=>`<div class="leader-line">${p[0]} – ${p[1]}</div>`).join("")}</div>
  <div class="leader-box"><h3>Top 5 Yellow Cards</h3>${top(y).map(p=>`<div class="leader-line">${p[0]} – ${p[1]}</div>`).join("")}</div>
  <div class="leader-box"><h3>Top 5 Red Cards</h3>${top(r).map(p=>`<div class="leader-line">${p[0]} – ${p[1]}</div>`).join("")}</div>
 </div>
`;

 Object.keys(data).sort().forEach(year=>{
  const ym=data[year].filter(m=>m.team1===team||m.team2===team);
  if(!ym.length) return;

  html+=`<div class="year-section"><h2>${year}</h2>`;
  ym.forEach(m=>{
   html+=`
    <div class="match">
     <h3>${m.team1} ${m.score} ${m.team2}</h3>
     <div class="small">${m.round}</div>
     <div class="small">Winner: ${m.winner}</div>
    </div>`;
  });
  html+=`</div>`;
 });

 document.getElementById("content").innerHTML=html;
}
</script>

</body>
</html>
