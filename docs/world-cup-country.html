<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Cup Country | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.header h1{margin:0;font-size:32px;}
.version{font-size:12px;color:#999;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:25px;}
.stat-box{border:1px solid #ddd;border-radius:10px;padding:14px;background:#fafafa;text-align:center;font-weight:700;}

.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:40px;}
.leader-box{border:1px solid #ddd;border-radius:10px;padding:14px;background:#f9fbff;font-weight:700;}
.leader-box h3{text-align:center;margin:0 0 10px 0;}
.leader-line{font-size:14px;font-weight:600;padding:4px 0;border-bottom:1px solid #eee;}
.leader-line:last-child{border-bottom:none;}

.year-section{margin-bottom:40px;}
.year-section h2{border-bottom:2px solid #0056d6;padding-bottom:6px;}

.match{border:1px solid #ddd;border-radius:10px;padding:14px;margin-top:12px;background:white;}
.match h3{margin:0 0 6px 0;}
.small{font-size:13px;color:#555;}
.error{color:#900;font-weight:700;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="world-cup-countries.html">Countries</a>
</div>

<div class="page-wrap">
<div id="content"></div>
</div>

<script>
const team=new URLSearchParams(location.search).get("team");

if(!team){
 document.getElementById("content").innerHTML="<div class='error'>No country selected.</div>";
 throw new Error("No team");
}

/* ---------- Helpers ---------- */

function isGrandFinalRound(round){
 const r=String(round||"").toLowerCase();
 if(!/\bfinal\b/.test(r)) return false;
 if(/semi|quarter|third|bronze|3rd|playoff|play-off|placement/.test(r)) return false;
 return true;
}

function getGrandFinalMatch(matchesInYear){
 const finals=matchesInYear.filter(m=>isGrandFinalRound(m.round));
 return finals.length ? finals[finals.length-1] : null;
}

function parseScore(score){
 if(!score) return null;
 const clean=String(score).split("(")[0].trim();
 const parts=clean.split(/[-–]/);
 if(parts.length!==2) return null;
 const a=parseInt(parts[0].trim(),10);
 const b=parseInt(parts[1].trim(),10);
 if(Number.isNaN(a) || Number.isNaN(b)) return null;
 return [a,b];
}

function parseEvent(str){
 if(!str) return null;
 const s=String(str).trim();
 if(!s) return null;
 const m=s.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
 if(m) return {name:m[1].trim(),tag:m[2].trim()};
 return {name:s,tag:null};
}

/* --- Tag matching (name + common codes) --- */
const codeAliases={
"Argentina":["ARG"], "Brazil":["BRA"], "Germany":["GER","DEU"], "France":["FRA"], "Italy":["ITA"],
"Spain":["ESP"], "England":["ENG"], "Netherlands":["NED","HOL"], "Portugal":["POR"], "Uruguay":["URU"],
"Belgium":["BEL"], "Croatia":["CRO"], "Australia":["AUS"], "Austria":["AUT"], "Switzerland":["SUI"],
"Scotland":["SCO"], "Wales":["WAL"], "Ireland":["IRL"], "Japan":["JPN"], "Mexico":["MEX"],
"United States":["USA","US"], "USA":["USA","US"]
};

function tagMatchesCountry(tag, countryName){
 if(!tag) return false;
 const t=tag.toLowerCase();
 const n=countryName.toLowerCase();
 if(t===n) return true;
 const codes=codeAliases[countryName]||[];
 return codes.some(c=>t===c.toLowerCase());
}

/* --- Event attribution rules --- */
/*
Scorer MUST be correct: if tag exists and matches opponent => exclude.
If tag exists and matches team => include.
If tag exists but matches neither => include (unknown/messy tag; better than losing data).
If no tag => include.
*/
function shouldCountScorer(tag, teamName, opponentName){
 if(!tag) return true;
 if(tagMatchesCountry(tag, opponentName)) return false;
 if(tagMatchesCountry(tag, teamName)) return true;
 return true;
}

/*
Cards are sometimes missing/dirty tags. Keep forgiving:
Exclude ONLY if tag clearly matches opponent.
*/
function shouldCountCard(tag, teamName, opponentName){
 if(!tag) return true;
 if(tagMatchesCountry(tag, opponentName)) return false;
 return true;
}

/* ---------- Load + Normalise ---------- */

fetch("data/world-cup.json?v=5",{cache:"no-store"})
.then(r=>r.json())
.then(rows=>{
 let matchesByYear={};
 let cur=null;

 rows.forEach(r=>{
  if(r.Team){
   cur={
    year:r.Year,
    round:r.Round,
    team1:r.Team,
    team2:r.Team__1,
    score:r["Final Score"],
    winner:r["Winnning Team"],
    events:[]
   };

   if(!matchesByYear[r.Year]) matchesByYear[r.Year]=[];
   matchesByYear[r.Year].push(cur);
  }

  if(cur && (r.Scorers||r["Yellow Cards"]||r["Red Cards"])){
   cur.events.push({
    scorer:r.Scorers||"",
    yellow:r["Yellow Cards"]||"",
    red:r["Red Cards"]||""
   });
  }
 });

 render(team,matchesByYear);
})
.catch(()=>{
 document.getElementById("content").innerHTML="<div class='error'>World Cup data failed to load.</div>";
});

/* ---------- Render ---------- */

function render(team,matchesByYear){

 let appearances=0, titles=0, finals=0, matchesPlayed=0, goalsScored=0;
 let g={}, y={}, rr={};

 const years=Object.keys(matchesByYear).sort();

 years.forEach(year=>{
  const yearMatches=matchesByYear[year];

  const teamMatches=yearMatches.filter(m=>m.team1===team || m.team2===team);
  if(teamMatches.length) appearances++;

  const gf=getGrandFinalMatch(yearMatches);
  if(gf){
   if(gf.team1===team || gf.team2===team) finals++;
   if(gf.winner===team) titles++;
  }

  teamMatches.forEach(m=>{
   matchesPlayed++;

   const ps=parseScore(m.score);
   if(ps){
    if(m.team1===team) goalsScored+=ps[0];
    if(m.team2===team) goalsScored+=ps[1];
   }

   const opponent=(m.team1===team)?m.team2:m.team1;

   m.events.forEach(e=>{
    // scorers (strict vs opponent)
    if(e.scorer){
     const p=parseEvent(e.scorer);
     if(p && p.name && shouldCountScorer(p.tag, team, opponent)){
      g[p.name]=(g[p.name]||0)+1;
     }
    }

    // yellow (forgiving but exclude clear opponent)
    if(e.yellow){
     const p=parseEvent(e.yellow);
     if(p && p.name && shouldCountCard(p.tag, team, opponent)){
      y[p.name]=(y[p.name]||0)+1;
     }
    }

    // red (forgiving but exclude clear opponent)
    if(e.red){
     const p=parseEvent(e.red);
     if(p && p.name && shouldCountCard(p.tag, team, opponent)){
      rr[p.name]=(rr[p.name]||0)+1;
     }
    }
   });
  });
 });

 const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5);

 let html=`
  <div class="header">
   <h1>${team}</h1>
   <div class="version">Country Page v5</div>
  </div>

  <div class="stats">
   <div class="stat-box">Appearances<br>${appearances}</div>
   <div class="stat-box">Titles<br>${titles}</div>
   <div class="stat-box">Finals<br>${finals}</div>
   <div class="stat-box">Matches<br>${matchesPlayed}</div>
   <div class="stat-box">Goals<br>${goalsScored}</div>
  </div>

  <div class="leaders">
   <div class="leader-box"><h3>Top 5 Goals</h3>${top(g).map(p=>`<div class="leader-line">${p[0]} – ${p[1]}</div>`).join("")}</div>
   <div class="leader-box"><h3>Top 5 Yellow Cards</h3>${top(y).map(p=>`<div class="leader-line">${p[0]} – ${p[1]}</div>`).join("")}</div>
   <div class="leader-box"><h3>Top 5 Red Cards</h3>${top(rr).map(p=>`<div class="leader-line">${p[0]} – ${p[1]}</div>`).join("")}</div>
  </div>
 `;

 years.forEach(year=>{
  const ym=matchesByYear[year].filter(m=>m.team1===team || m.team2===team);
  if(!ym.length) return;

  html+=`<div class="year-section"><h2>${year}</h2>`;
  ym.forEach(m=>{
   html+=`
    <div class="match">
     <h3>${m.team1} ${m.score} ${m.team2}</h3>
     <div class="small">${m.round}</div>
     <div class="small">Winner: ${m.winner}</div>
    </div>`;
  });
  html+=`</div>`;
 });

 document.getElementById("content").innerHTML=html;
}
</script>

</body>
</html>
