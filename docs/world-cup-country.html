<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Cup Country | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}

.header{display:flex;align-items:center;gap:20px;margin-bottom:20px;}
.header .flag{font-size:64px;}
.header h1{margin:0;}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;margin-bottom:25px;
}

.stat-box{
border:1px solid #ddd;border-radius:10px;
padding:14px;background:#fafafa;
text-align:center;font-weight:700;
}

.leaders{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:14px;
margin-bottom:40px;
}

.leader-box{
border:1px solid #ddd;border-radius:10px;
padding:14px;background:#f9fbff;
font-weight:700;
}

.leader-box h3{
margin:0 0 8px 0;
font-size:16px;
text-align:center;
}

.leader-box ol{
margin:0;
padding-left:20px;
font-weight:600;
font-size:14px;
}

.year-section{margin-bottom:40px;}
.year-section h2{border-bottom:2px solid #0056d6;padding-bottom:6px;}

.match{
border:1px solid #ddd;border-radius:10px;
padding:14px;margin-top:12px;background:white;
}

.match h3{margin:0 0 6px 0;}
.small{font-size:13px;color:#555;}
.error{color:#900;font-weight:700;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="worldcupcountries.html">Countries</a>
</div>

<div class="page-wrap">
<div id="content"></div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
const team=params.get("team");

const countryCodes={
"Brazil":"BR","Germany":"DE","Italy":"IT","Argentina":"AR","France":"FR",
"England":"GB","Spain":"ES","Netherlands":"NL","Uruguay":"UY","Portugal":"PT",
"Belgium":"BE","Croatia":"HR","Mexico":"MX","USA":"US","United States":"US",
"Japan":"JP","South Korea":"KR","Korea Republic":"KR","Australia":"AU"
};

function flagEmoji(code){
 if(!code) return "";
 return code.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt()));
}

function cleanName(name){
 if(!name) return "";
 return name.replace(/\s*\(.*?\)/g,"").trim();
}

if(!team){
 document.getElementById("content").innerHTML="<div class='error'>No country selected.</div>";
}else{
 loadCountry(team);
}

function parseScore(score){
 if(!score) return null;
 let clean=String(score).split("(")[0].trim();
 let parts=clean.split(/[-–]/);
 if(parts.length!==2) return null;
 let a=parseInt(parts[0],10), b=parseInt(parts[1],10);
 if(Number.isNaN(a)||Number.isNaN(b)) return null;
 return [a,b];
}

function isGrandFinalRound(round){
 if(!round) return false;
 const r=String(round).toLowerCase();
 if(!/\bfinal\b/.test(r)) return false;
 if(/\bsemi|\bquarter|\bthird|\bbronze/.test(r)) return false;
 return true;
}

function getGrandFinalMatch(list){
 const c=list.filter(m=>isGrandFinalRound(m.round));
 if(!c.length) return null;
 return c[c.length-1];
}

function loadCountry(team){

 fetch("data/world-cup.json",{cache:"no-store"})
 .then(r=>r.json())
 .then(rows=>{
  let matchesByYear={}, current=null;

  rows.forEach(r=>{
   if(r.Team){
    current={
     year:r.Year,
     round:r.Round,
     team1:r.Team,
     team2:r.Team__1,
     score:r["Final Score"],
     winner:r["Winnning Team"],
     events:[]
    };

    if(!matchesByYear[r.Year]) matchesByYear[r.Year]=[];
    matchesByYear[r.Year].push(current);
   }

   if(current && (r.Scorers||r["Yellow Cards"]||r["Red Cards"])){
    current.events.push({
     scorer:r.Scorers||"",
     yellow:r["Yellow Cards"]||"",
     red:r["Red Cards"]||""
    });
   }
  });

  render(team,matchesByYear);
 });
}

function render(team,data){

 let appearances=0,titles=0,finals=0,matchesPlayed=0,goalsScored=0;

 let goalLeaders={},yellowLeaders={},redLeaders={};

 let years=Object.keys(data).sort();

 years.forEach(y=>{
  const all=data[y];
  const gf=getGrandFinalMatch(all);

  if(gf){
   if(gf.team1===team||gf.team2===team) finals++;
   if(gf.winner===team) titles++;
  }

  const ym=all.filter(m=>m.team1===team||m.team2===team);

  if(ym.length){
   appearances++;

   ym.forEach(m=>{
    matchesPlayed++;

    const ps=parseScore(m.score);
    if(ps){
     if(m.team1===team) goalsScored+=ps[0];
     if(m.team2===team) goalsScored+=ps[1];
    }

    m.events.forEach(e=>{
     if(e.scorer){
      let n=cleanName(e.scorer);
      goalLeaders[n]=(goalLeaders[n]||0)+1;
     }
     if(e.yellow){
      let n=cleanName(e.yellow);
      yellowLeaders[n]=(yellowLeaders[n]||0)+1;
     }
     if(e.red){
      let n=cleanName(e.red);
      redLeaders[n]=(redLeaders[n]||0)+1;
     }
    });
   });
  }
 });

 function topFive(obj){
  return Object.entries(obj)
   .sort((a,b)=>b[1]-a[1])
   .slice(0,5);
 }

 const tg=topFive(goalLeaders);
 const ty=topFive(yellowLeaders);
 const tr=topFive(redLeaders);

 const code=countryCodes[team];
 const flag=flagEmoji(code);

 let html=`
 <div class="header">
  <div class="flag">${flag}</div>
  <h1>${team}</h1>
 </div>

 <div class="stats">
  <div class="stat-box">Appearances<br>${appearances}</div>
  <div class="stat-box">Titles<br>${titles}</div>
  <div class="stat-box">Finals<br>${finals}</div>
  <div class="stat-box">Matches<br>${matchesPlayed}</div>
  <div class="stat-box">Goals<br>${goalsScored}</div>
 </div>

 <div class="leaders">
  <div class="leader-box">
   <h3>Top 5 Goals</h3>
   <ol>${tg.map(p=>`<li>${p[0]} (${p[1]})</li>`).join("")}</ol>
  </div>

  <div class="leader-box">
   <h3>Top 5 Yellow Cards</h3>
   <ol>${ty.map(p=>`<li>${p[0]} (${p[1]})</li>`).join("")}</ol>
  </div>

  <div class="leader-box">
   <h3>Top 5 Red Cards</h3>
   <ol>${tr.map(p=>`<li>${p[0]} (${p[1]})</li>`).join("")}</ol>
  </div>
 </div>
`;

 years.forEach(y=>{
  const ym=data[y].filter(m=>m.team1===team||m.team2===team);
  if(!ym.length) return;

  html+=`<div class="year-section"><h2>${y}</h2>`;

  ym.forEach(m=>{
   html+=`
    <div class="match">
     <h3>${m.team1} ${m.score} ${m.team2}</h3>
     <div class="small">${m.round}</div>
     <div class="small">Winner: ${m.winner}</div>
    </div>
   `;
  });

  html+=`</div>`;
 });

 document.getElementById("content").innerHTML=html;
}
</script>

</body>
</html>
