<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Cup Country | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.header h1{margin:0;font-size:32px;}
.version{font-size:12px;color:#999;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:25px;}
.stat-box{border:1px solid #ddd;border-radius:10px;padding:14px;background:#fafafa;text-align:center;font-weight:700;}

.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:40px;}
.leader-box{border:1px solid #ddd;border-radius:10px;padding:14px;background:#f9fbff;font-weight:700;}
.leader-box h3{text-align:center;margin:0 0 10px 0;}
.leader-line{font-size:14px;font-weight:600;padding:4px 0;border-bottom:1px solid #eee;}
.leader-line:last-child{border-bottom:none;}

.year-section{margin-bottom:40px;}
.year-section h2{border-bottom:2px solid #0056d6;padding-bottom:6px;}

.match{border:1px solid #ddd;border-radius:10px;padding:14px;margin-top:12px;background:white;}
.match h3{margin:0 0 6px 0;}
.small{font-size:13px;color:#555;}
.error{color:#900;font-weight:700;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="world-cup-countries.html">Countries</a>
</div>

<div class="page-wrap">
<div id="content"></div>
</div>

<script>
let team=new URLSearchParams(location.search).get("team");

/* ---------- NORMALISE ---------- */
function normalizeTeam(name){
 if(!name) return "";
 let n=String(name).replace(/\u00A0/g," ").trim();
 let k=n.toLowerCase();

 if(k.includes("west germany")) return "Germany";
 if(k==="frg") return "Germany";
 if(k.includes("federal republic")) return "Germany";
 if(k.includes("fr germany")) return "Germany";

 return n;
}

team=normalizeTeam(team);

if(!team){
 document.getElementById("content").innerHTML="<div class='error'>No country selected.</div>";
 throw new Error("No team");
}

/* ---------- Helpers ---------- */

function isGrandFinalRound(round){
 const r=String(round||"").toLowerCase();
 if(!/\bfinal\b/.test(r)) return false;
 if(/semi|quarter|third|bronze|3rd|playoff|play-off|placement/.test(r)) return false;
 return true;
}

function getGrandFinalMatch(matches){
 const finals=matches.filter(m=>isGrandFinalRound(m.round));
 return finals.length?finals[finals.length-1]:null;
}

function parseScore(score){
 if(!score) return null;
 const clean=String(score).split("(")[0].trim();
 const p=clean.split(/[-–]/);
 if(p.length!==2) return null;
 const a=parseInt(p[0]),b=parseInt(p[1]);
 if(isNaN(a)||isNaN(b)) return null;
 return [a,b];
}

/* ---------- LOAD ---------- */

fetch("data/world-cup.json",{cache:"no-store"})
.then(r=>r.json())
.then(rows=>{
 let byYear={},cur=null;

 rows.forEach(r=>{
  if(r.Team){
   cur={
    year:r.Year,
    round:r.Round,
    team1:normalizeTeam(r.Team),
    team2:normalizeTeam(r.Team__1),
    score:r["Final Score"],
    winner:normalizeTeam(r["Winnning Team"]),
    events:[]
   };

   if(!byYear[r.Year]) byYear[r.Year]=[];
   byYear[r.Year].push(cur);
  }
 });

 render(team,byYear);
});

/* ---------- RENDER ---------- */

function render(team,data){

 let appearances=0,titles=0,finals=0,matches=0,goals=0;

 const years=Object.keys(data).sort();

 years.forEach(year=>{
  const matchesYear=data[year];
  const teamMatches=matchesYear.filter(m=>m.team1===team||m.team2===team);
  if(teamMatches.length) appearances++;

  const gf=getGrandFinalMatch(matchesYear);
  if(gf){
   if(gf.team1===team||gf.team2===team) finals++;
   if(gf.winner===team) titles++;
  }

  teamMatches.forEach(m=>{
   matches++;
   const sc=parseScore(m.score);
   if(sc){
    if(m.team1===team) goals+=sc[0];
    if(m.team2===team) goals+=sc[1];
   }
  });
 });

 let html=`
 <div class="header">
  <h1>${team}</h1>
  <div class="version">Country Page v11</div>
 </div>

 <div class="stats">
  <div class="stat-box">Appearances<br>${appearances}</div>
  <div class="stat-box">Titles<br>${titles}</div>
  <div class="stat-box">Finals<br>${finals}</div>
  <div class="stat-box">Matches<br>${matches}</div>
  <div class="stat-box">Goals<br>${goals}</div>
 </div>
`;

 years.forEach(year=>{
  const ym=data[year].filter(m=>m.team1===team||m.team2===team);
  if(!ym.length) return;

  html+=`<div class="year-section"><h2>${year}</h2>`;
  ym.forEach(m=>{
   html+=`
    <div class="match">
     <h3>${m.team1} ${m.score} ${m.team2}</h3>
     <div class="small">${m.round}</div>
     <div class="small">Winner: ${m.winner}</div>
    </div>`;
  });
  html+=`</div>`;
 });

 document.getElementById("content").innerHTML=html;
}
</script>

</body>
</html>
