<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Cup Country | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}

.navbar{
display:flex;justify-content:center;gap:22px;
padding:16px;border-bottom:1px solid #ddd;font-weight:600;
}

.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}

.header{
display:flex;
align-items:center;
gap:20px;
margin-bottom:30px;
}

.header .flag{
font-size:64px;
}

.header h1{margin:0;}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
margin-bottom:40px;
}

.stat-box{
border:1px solid #ddd;
border-radius:10px;
padding:14px;
background:#fafafa;
text-align:center;
font-weight:700;
}

.year-section{
margin-bottom:40px;
}

.year-section h2{
border-bottom:2px solid #0056d6;
padding-bottom:6px;
}

.match{
border:1px solid #ddd;
border-radius:10px;
padding:14px;
margin-top:12px;
background:white;
}

.match h3{margin:0 0 6px 0;}

.small{font-size:13px;color:#555;}
.error{color:#900;font-weight:700;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="worldcupcountries.html">Countries</a>
</div>

<div class="page-wrap">

<div id="content"></div>

</div>

<script>
const params=new URLSearchParams(window.location.search);
const team=params.get("team");

const countryCodes={
"Brazil":"BR","Germany":"DE","Italy":"IT","Argentina":"AR","France":"FR",
"England":"GB","Spain":"ES","Netherlands":"NL","Uruguay":"UY","Portugal":"PT",
"Belgium":"BE","Croatia":"HR","Mexico":"MX","USA":"US","United States":"US",
"Japan":"JP","South Korea":"KR","Korea Republic":"KR","Australia":"AU",
"Denmark":"DK","Sweden":"SE","Norway":"NO","Switzerland":"CH","Austria":"AT",
"Poland":"PL","Czech Republic":"CZ","Czechoslovakia":"CZ",
"Yugoslavia":"RS","Serbia":"RS","Slovenia":"SI","Scotland":"GB",
"Wales":"GB","Morocco":"MA","Cameroon":"CM","Nigeria":"NG","Ghana":"GH",
"Senegal":"SN","Tunisia":"TN","Algeria":"DZ","Iran":"IR","Iraq":"IQ",
"Saudi Arabia":"SA","Qatar":"QA","China":"CN","Russia":"RU","Ukraine":"UA",
"Turkey":"TR","Greece":"GR","Colombia":"CO","Chile":"CL","Peru":"PE",
"Paraguay":"PY","Ecuador":"EC","Costa Rica":"CR","Honduras":"HN",
"Panama":"PA","Jamaica":"JM","Trinidad and Tobago":"TT","Canada":"CA"
};

function flagEmoji(code){
 if(!code) return "";
 return code.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt()));
}

if(!team){
 document.getElementById("content").innerHTML="<div class='error'>No country selected.</div>";
}else{
 loadCountry(team);
}

function loadCountry(team){

 fetch("data/world-cup.json",{cache:"no-store"})
 .then(r=>r.json())
 .then(rows=>{
  let matchesByYear={};
  let current=null;

  rows.forEach(r=>{
   if(r.Team){
    current={
     year:r.Year,
     round:r.Round,
     team1:r.Team,
     team2:r.Team__1,
     score:r["Final Score"],
     winner:r["Winnning Team"],
     goals:[],
    };

    if(!matchesByYear[r.Year]) matchesByYear[r.Year]=[];
    matchesByYear[r.Year].push(current);
   }

   if(current && r.Scorers){
    current.goals.push(r.Scorers);
   }
  });

  render(team,matchesByYear);
 });
}

function render(team,data){

 let appearances=0;
 let titles=0;
 let finals=0;
 let matchesPlayed=0;
 let goalsScored=0;

 let years=Object.keys(data).sort();

 years.forEach(y=>{
  let yearMatches=data[y].filter(m=>m.team1===team||m.team2===team);
  if(yearMatches.length){
   appearances++;

   yearMatches.forEach(m=>{
    matchesPlayed++;

    m.goals.forEach(g=>{
     if(g.includes(team)) goalsScored++;
    });

    if(/final/i.test(m.round) && !/semi|quarter|third|bronze/i.test(m.round)){
     finals++;
     if(m.winner===team) titles++;
    }
   });
  }
 });

 const code=countryCodes[team];
 const flag=flagEmoji(code);

 let html=`
 <div class="header">
  <div class="flag">${flag}</div>
  <h1>${team}</h1>
 </div>

 <div class="stats">
  <div class="stat-box">Appearances<br>${appearances}</div>
  <div class="stat-box">Titles<br>${titles}</div>
  <div class="stat-box">Finals<br>${finals}</div>
  <div class="stat-box">Matches<br>${matchesPlayed}</div>
  <div class="stat-box">Goals<br>${goalsScored}</div>
 </div>
`;

 years.forEach(y=>{
  let yearMatches=data[y].filter(m=>m.team1===team||m.team2===team);
  if(!yearMatches.length) return;

  html+=`<div class="year-section"><h2>${y}</h2>`;

  yearMatches.forEach(m=>{
   html+=`
    <div class="match">
     <h3>${m.team1} ${m.score} ${m.team2}</h3>
     <div class="small">${m.round}</div>
     <div class="small">Winner: ${m.winner}</div>
    </div>
   `;
  });

  html+=`</div>`;
 });

 document.getElementById("content").innerHTML=html;
}
</script>

</body>
</html>
