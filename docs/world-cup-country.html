<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Cup Country | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}

.header{display:flex;align-items:center;gap:20px;margin-bottom:20px;}
.header .flag{font-size:64px;}
.header h1{margin:0;}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;margin-bottom:25px;
}

.stat-box{
border:1px solid #ddd;border-radius:10px;
padding:14px;background:#fafafa;
text-align:center;font-weight:700;
}

.leaders{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:14px;
margin-bottom:40px;
}

.leader-box{
border:1px solid #ddd;border-radius:10px;
padding:14px;background:#f9fbff;
text-align:center;
font-weight:700;
}

.year-section{margin-bottom:40px;}
.year-section h2{border-bottom:2px solid #0056d6;padding-bottom:6px;}

.match{
border:1px solid #ddd;border-radius:10px;
padding:14px;margin-top:12px;background:white;
}

.match h3{margin:0 0 6px 0;}
.small{font-size:13px;color:#555;}
.error{color:#900;font-weight:700;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="worldcupcountries.html">Countries</a>
</div>

<div class="page-wrap">
<div id="content"></div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
const team=params.get("team");

const countryCodes={
"Brazil":"BR","Germany":"DE","Italy":"IT","Argentina":"AR","France":"FR",
"England":"GB","Spain":"ES","Netherlands":"NL","Uruguay":"UY","Portugal":"PT",
"Belgium":"BE","Croatia":"HR","Mexico":"MX","USA":"US","United States":"US",
"Japan":"JP","South Korea":"KR","Korea Republic":"KR","Australia":"AU"
};

function flagEmoji(code){
 if(!code) return "";
 return code.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt()));
}

if(!team){
 document.getElementById("content").innerHTML="<div class='error'>No country selected.</div>";
}else{
 loadCountry(team);
}

function parseScore(score){
 if(!score) return null;
 let clean=String(score).split("(")[0].trim();
 let parts=clean.split(/[-–]/);
 if(parts.length!==2) return null;
 let a=parseInt(parts[0],10), b=parseInt(parts[1],10);
 if(Number.isNaN(a) || Number.isNaN(b)) return null;
 return [a,b];
}

/* Robust: identify the actual Grand Final match */
function isGrandFinalRound(round){
 if(!round) return false;
 const r=String(round).toLowerCase().trim();
 // must contain the word "final"
 if(!/\bfinal\b/.test(r)) return false;
 // exclude obvious non-grand-final rounds
 if(/\bsemi\b/.test(r)) return false;
 if(/\bquarter\b/.test(r)) return false;
 if(/\bthird\b/.test(r)) return false;
 if(/\bbronze\b/.test(r)) return false;
 return true;
}

function getGrandFinalMatch(matchesInYear){
 // collect candidates and take the LAST one (handles "Final replay" etc)
 const candidates = matchesInYear.filter(m=>isGrandFinalRound(m.round));
 if(!candidates.length) return null;
 return candidates[candidates.length-1];
}

function loadCountry(team){

 fetch("data/world-cup.json",{cache:"no-store"})
 .then(r=>r.json())
 .then(rows=>{
  let matchesByYear={};
  let current=null;

  rows.forEach(r=>{
   if(r.Team){
    current={
     year:r.Year,
     round:r.Round,
     team1:r.Team,
     team2:r.Team__1,
     score:r["Final Score"],
     winner:r["Winnning Team"],
     events:[]
    };

    if(!matchesByYear[r.Year]) matchesByYear[r.Year]=[];
    matchesByYear[r.Year].push(current);
   }

   if(current && (r.Scorers||r["Yellow Cards"]||r["Red Cards"])){
    current.events.push({
     scorer:r.Scorers||"",
     yellow:r["Yellow Cards"]||"",
     red:r["Red Cards"]||""
    });
   }
  });

  render(team,matchesByYear);
 })
 .catch(()=>{
  document.getElementById("content").innerHTML="<div class='error'>World Cup data failed to load.</div>";
 });
}

function render(team,data){

 let appearances=0;
 let titles=0;
 let finals=0;
 let matchesPlayed=0;
 let goalsScored=0;

 let goalLeaders={};
 let yellowLeaders={};
 let redLeaders={};

 let years=Object.keys(data).sort();

 years.forEach(y=>{
  const allYearMatches = data[y];

  // 1) Determine tournament title/final participation from the Grand Final match ONLY
  const gf = getGrandFinalMatch(allYearMatches);
  if(gf){
   const playedFinal = (gf.team1===team || gf.team2===team);
   if(playedFinal) finals++;
   if(gf.winner===team) titles++;
  }

  // 2) Determine appearances and per-match stats from matches involving the country
  const yearMatches = allYearMatches.filter(m=>m.team1===team||m.team2===team);

  if(yearMatches.length){
   appearances++;

   yearMatches.forEach(m=>{
    matchesPlayed++;

    const parsed=parseScore(m.score);
    if(parsed){
     if(m.team1===team) goalsScored+=parsed[0];
     if(m.team2===team) goalsScored+=parsed[1];
    }

    m.events.forEach(e=>{
     if(e.scorer){
      goalLeaders[e.scorer]=(goalLeaders[e.scorer]||0)+1;
     }
     if(e.yellow){
      yellowLeaders[e.yellow]=(yellowLeaders[e.yellow]||0)+1;
     }
     if(e.red){
      redLeaders[e.red]=(redLeaders[e.red]||0)+1;
     }
    });
   });
  }
 });

 function topEntry(obj){
  let arr=Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  return arr.length?arr[0]:["–",0];
 }

 const topGoal=topEntry(goalLeaders);
 const topYellow=topEntry(yellowLeaders);
 const topRed=topEntry(redLeaders);

 const code=countryCodes[team];
 const flag=flagEmoji(code);

 let html=`
 <div class="header">
  <div class="flag">${flag}</div>
  <h1>${team}</h1>
 </div>

 <div class="stats">
  <div class="stat-box">Appearances<br>${appearances}</div>
  <div class="stat-box">Titles<br>${titles}</div>
  <div class="stat-box">Finals<br>${finals}</div>
  <div class="stat-box">Matches<br>${matchesPlayed}</div>
  <div class="stat-box">Goals<br>${goalsScored}</div>
 </div>

 <div class="leaders">
  <div class="leader-box">Most Goals<br>${topGoal[0]} (${topGoal[1]})</div>
  <div class="leader-box">Most Yellow Cards<br>${topYellow[0]} (${topYellow[1]})</div>
  <div class="leader-box">Most Red Cards<br>${topRed[0]} (${topRed[1]})</div>
 </div>
`;

 // Results by year
 years.forEach(y=>{
  const yearMatches=data[y].filter(m=>m.team1===team||m.team2===team);
  if(!yearMatches.length) return;

  html+=`<div class="year-section"><h2>${y}</h2>`;

  yearMatches.forEach(m=>{
   html+=`
    <div class="match">
     <h3>${m.team1} ${m.score} ${m.team2}</h3>
     <div class="small">${m.round}</div>
     <div class="small">Winner: ${m.winner}</div>
    </div>
   `;
  });

  html+=`</div>`;
 });

 document.getElementById("content").innerHTML=html;
}
</script>

</body>
</html>
