<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:700;
color:#0056d6;
}

.hero{
padding:80px 20px;
text-align:center;
color:white;
background:linear-gradient(135deg,#111827,#1f2937);
}

.hero h1{
margin:0;
font-size:72px;
font-weight:900;
line-height:1;
}

.hero p{
margin-top:16px;
font-size:24px;
font-weight:700;
opacity:.95;
}

.container{
max-width:1600px;
margin:36px auto;
padding:0 20px 60px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:24px;
margin-bottom:34px;
}

.stat-card{
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
text-align:center;
}

.stat-label{
font-size:14px;
font-weight:900;
text-transform:uppercase;
letter-spacing:.7px;
color:#666;
margin-bottom:14px;
}

.stat-value{
font-size:56px;
font-weight:900;
line-height:1;
}

.section{
background:white;
border-radius:20px;
padding:30px;
margin-bottom:30px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.section-title{
font-size:40px;
font-weight:900;
margin-bottom:24px;
}

.filters{
display:flex;
gap:18px;
margin-bottom:24px;
flex-wrap:wrap;
}

select{
padding:14px 18px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
font-weight:700;
background:white;
}

table{
width:100%;
border-collapse:collapse;
table-layout:fixed;
}

th{
background:#eef2f7;
padding:16px;
font-size:14px;
font-weight:900;
text-transform:uppercase;
text-align:left;
}

td{
padding:16px;
border-bottom:1px solid #ececec;
font-size:16px;
font-weight:600;
vertical-align:middle;
text-align:left;
}

tr:nth-child(even){
background:#f8fbff;
}

.loading,
.error{
padding:100px 20px;
text-align:center;
font-size:28px;
font-weight:900;
}

.error{
color:#d90429;
}

.team-link{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.team-link:hover{
text-decoration:underline;
}

.result-win{
color:#009944;
font-weight:900;
}

.result-loss{
color:#d90429;
font-weight:900;
}

.result-draw{
color:#e67e22;
font-weight:900;
}

@media(max-width:900px){

.hero h1{
font-size:46px;
}

.hero p{
font-size:18px;
}

.section-title{
font-size:30px;
}

.stat-value{
font-size:42px;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/epl-teams.html">Teams</a>
<a href="/epl-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div id="page">

<div class="loading">
Loading Player...
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const playerName = params.get("player");

const page = document.getElementById("page");

async function loadPlayer(){

try{

if(!playerName){

page.innerHTML = `
<div class="error">
No Player Selected
</div>
`;

return;

}

const playerStats = {

"Duncan Ferguson":{
team:"Everton",
games:269,
goals:68,
assists:12,
yellow:52,
red:8,
seasons:10
},

"Romelu Lukaku":{
team:"Everton",
games:141,
goals:68,
assists:18,
yellow:8,
red:0,
seasons:5
},

"Tim Cahill":{
team:"Everton",
games:226,
goals:56,
assists:17,
yellow:71,
red:1,
seasons:9
}

};

const player =
playerStats[playerName] || {

team:"Unknown",
games:0,
goals:0,
assists:0,
yellow:0,
red:0,
seasons:0

};

const appearances = [

{
season:"2006-07",
team:player.team,
opponent:"Liverpool",
result:"W",
score:"3-0",
goals:1,
assists:0,
yellow:0,
red:0
},

{
season:"2007-08",
team:player.team,
opponent:"Chelsea",
result:"D",
score:"1-1",
goals:0,
assists:1,
yellow:1,
red:0
},

{
season:"2008-09",
team:player.team,
opponent:"Arsenal",
result:"L",
score:"1-2",
goals:1,
assists:0,
yellow:0,
red:0
}

];

page.innerHTML = `

<div class="hero">

<h1>
${playerName}
</h1>

<p>
Premier League Player Profile
</p>

</div>

<div class="container">

<div class="stats-grid">

<div class="stat-card">
<div class="stat-label">Club</div>
<div class="stat-value" style="font-size:34px;">
${player.team}
</div>
</div>

<div class="stat-card">
<div class="stat-label">Games</div>
<div class="stat-value">
${player.games}
</div>
</div>

<div class="stat-card">
<div class="stat-label">Goals</div>
<div class="stat-value">
${player.goals}
</div>
</div>

<div class="stat-card">
<div class="stat-label">Assists</div>
<div class="stat-value">
${player.assists}
</div>
</div>

<div class="stat-card">
<div class="stat-label">Yellow Cards</div>
<div class="stat-value">
${player.yellow}
</div>
</div>

<div class="stat-card">
<div class="stat-label">Red Cards</div>
<div class="stat-value">
${player.red}
</div>
</div>

</div>

<div class="section">

<div class="section-title">
Career Summary
</div>

<table>

<thead>

<tr>
<th>Season</th>
<th>Club</th>
<th>Games</th>
<th>Goals</th>
<th>Assists</th>
<th>Yellow</th>
<th>Red</th>
</tr>

</thead>

<tbody>

<tr>

<td>${player.seasons}</td>

<td>

<a
class="team-link"
href="/epl-team.html?team=${encodeURIComponent(player.team)}"
>

${player.team}

</a>

</td>

<td>${player.games}</td>
<td>${player.goals}</td>
<td>${player.assists}</td>
<td>${player.yellow}</td>
<td>${player.red}</td>

</tr>

</tbody>

</table>

</div>

<div class="section">

<div class="section-title">
Match Log
</div>

<div class="filters">

<select>
<option>All Seasons</option>
<option>2008-09</option>
<option>2007-08</option>
<option>2006-07</option>
</select>

<select>
<option>All Opponents</option>
<option>Arsenal</option>
<option>Chelsea</option>
<option>Liverpool</option>
</select>

</div>

<table>

<thead>

<tr>
<th>Season</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
<th>Goals</th>
<th>Assists</th>
<th>YC</th>
<th>RC</th>
</tr>

</thead>

<tbody>

${appearances.map(g=>`

<tr>

<td>${g.season}</td>

<td>

<a
class="team-link"
href="/epl-team.html?team=${encodeURIComponent(g.opponent)}"
>

vs ${g.opponent}

</a>

</td>

<td class="
${g.result==="W" ? "result-win" : ""}
${g.result==="L" ? "result-loss" : ""}
${g.result==="D" ? "result-draw" : ""}
">

${g.result}

</td>

<td>${g.score}</td>
<td>${g.goals}</td>
<td>${g.assists}</td>
<td>${g.yellow}</td>
<td>${g.red}</td>

</tr>

`).join("")}

</tbody>

</table>

</div>

</div>

`;

}catch(err){

console.error(err);

page.innerHTML = `
<div class="error">
Failed To Load Player Data
</div>
`;

}

}

loadPlayer();

</script>

</body>
</html>
