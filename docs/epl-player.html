<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#eef1f5;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.hero{
padding:50px 20px;
text-align:center;
color:white;
position:relative;
}

.hero h1{
margin:0;
font-size:60px;
font-weight:900;
line-height:1;
}

.hero p{
margin-top:14px;
font-size:20px;
font-weight:700;
opacity:.95;
}

.search-wrap{
max-width:520px;
margin:28px auto 0;
position:relative;
}

.search-input{
width:100%;
padding:16px 18px;
border-radius:14px;
border:none;
font-size:18px;
font-weight:700;
box-sizing:border-box;
outline:none;
}

.search-results{
position:absolute;
top:100%;
left:0;
right:0;
background:white;
border-radius:0 0 14px 14px;
overflow:hidden;
box-shadow:0 8px 24px rgba(0,0,0,.18);
z-index:999;
display:none;
}

.search-item{
padding:14px 18px;
border-bottom:1px solid #eee;
cursor:pointer;
font-weight:700;
color:#111;
}

.search-item:hover{
background:#f3f6fb;
}

.container{
max-width:1500px;
margin:28px auto;
padding:0 20px 60px;
}

.section{
background:white;
border-radius:22px;
padding:26px;
margin-bottom:30px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.section-title{
font-size:18px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
margin-bottom:22px;
color:#666;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:18px;
}

.stat-card{
background:#f4f7fb;
border-radius:18px;
padding:24px;
text-align:center;
border:1px solid #dde3ea;
}

.stat-value{
font-size:42px;
font-weight:900;
line-height:1;
margin-bottom:10px;
}

.stat-label{
font-size:15px;
font-weight:700;
color:#555;
}

.filters{
margin-bottom:20px;
}

select{
padding:12px 16px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
font-weight:800;
background:white;
min-width:260px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#e8edf3;
padding:16px;
text-align:left;
font-size:13px;
font-weight:900;
text-transform:uppercase;
}

td{
padding:16px;
border-bottom:1px solid #ececec;
font-size:15px;
font-weight:600;
}

tr:nth-child(even){
background:#f8fbff;
}

.result-win{ color:#0a8f3d; font-weight:900; }
.result-draw{ color:#e67e22; font-weight:900; }
.result-loss{ color:#d90429; font-weight:900; }

.team-link{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.team-link:hover{
text-decoration:underline;
}

.loading,
.error{
padding:120px 20px;
text-align:center;
font-size:32px;
font-weight:900;
}

.error{ color:#d90429; }

@media(max-width:900px){
.hero h1{ font-size:40px; }
.hero p{ font-size:16px; }
.search-input{ font-size:16px; }
.stat-value{ font-size:34px; }
table{ display:block; overflow-x:auto; white-space:nowrap; }
}

</style>
</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/epl-teams.html">Teams</a>
<a href="/epl-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div id="page">
<div class="loading">Loading Player...</div>
</div>

<script>

const TEAM_COLOURS = {
"Everton":"linear-gradient(135deg,#003399,#001C58)",
"Arsenal":"linear-gradient(135deg,#EF0107,#9C0000)",
"Liverpool":"linear-gradient(135deg,#C8102E,#00B2A9)",
"Chelsea":"linear-gradient(135deg,#034694,#001C58)",
"Manchester United":"linear-gradient(135deg,#DA291C,#FBE122)",
"Manchester City":"linear-gradient(135deg,#6CABDD,#1C2C5B)",
"Tottenham Hotspur":"linear-gradient(135deg,#132257,#FFFFFF)",
"Newcastle United":"linear-gradient(135deg,#111111,#666666)"
};

function slugify(name){
    return (name || '')
        .toLowerCase()
        .replace(/\./g,'')
        .replace(/'/g,'')
        .replace(/'/g,'')
        .replace(/"/g,'')
        .replace(/\s+/g,'-');
}

const params     = new URLSearchParams(window.location.search);
const playerSlug = params.get("player") || '';
const page       = document.getElementById("page");

async function loadPlayer(){

    try{

        page.innerHTML = '<div class="loading">Loading player data...</div>';

        const res = await fetch("/data/epl/players.json");

        if(!res.ok){
            throw new Error(`players.json returned ${res.status}`);
        }

        const players = await res.json();

        page.innerHTML = '<div class="loading">Finding player...</div>';

        const player = players.find(p => slugify(p.name) === playerSlug);

        if(!player){
            // Show closest matches to help debug
            const close = players
                .filter(p => slugify(p.name).includes(playerSlug.split('-')[0]))
                .slice(0,5)
                .map(p => p.name)
                .join(', ');

            page.innerHTML = `
                <div class="error">
                    Player Not Found<br>
                    <small style="font-size:16px;color:#666;">
                        Slug: "${playerSlug}"<br>
                        ${close ? `Similar: ${close}` : 'No similar names found'}
                    </small>
                </div>
            `;
            return;
        }

        const playerDisplayName = player.name;
        const playerClub = (player.teams && player.teams[player.teams.length - 1]) || "Unknown";

        page.innerHTML = `

            <div class="hero" style="background:${TEAM_COLOURS[playerClub] || 'linear-gradient(135deg,#111,#444)'};">

                <h1>${playerDisplayName}</h1>
                <p>Premier League Player Profile</p>

                <div class="search-wrap">
                    <input type="text" class="search-input" id="playerSearch"
                           placeholder="Search player..." autocomplete="off">
                    <div class="search-results" id="searchResults"></div>
                </div>

            </div>

            <div class="container">

                <div class="section">
                    <div class="section-title">Career Summary</div>
                    <div class="stats-grid">

                        <div class="stat-card">
                            <div class="stat-value" style="font-size:22px;">${playerClub}</div>
                            <div class="stat-label">Club</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-value">${player.seasons ? player.seasons.length : 0}</div>
                            <div class="stat-label">Seasons</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-value">${player.goals || 0}</div>
                            <div class="stat-label">Goals</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-value">${player.penalties || 0}</div>
                            <div class="stat-label">Penalties</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-value">${player.yellow_cards || 0}</div>
                            <div class="stat-label">Yellow Cards</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-value">${player.red_cards || 0}</div>
                            <div class="stat-label">Red Cards</div>
                        </div>

                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Seasons</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Season</th>
                                <th>Team</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(player.seasons || []).map((s, i) => `
                                <tr>
                                    <td>
                                        <a class="team-link"
                                           href="/epl-season.html?season=${s}">
                                           ${s}
                                        </a>
                                    </td>
                                    <td>${(player.teams && player.teams[i]) || playerClub}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

            </div>
        `;

        // Search
        const playerSearch  = document.getElementById("playerSearch");
        const searchResults = document.getElementById("searchResults");

        playerSearch.addEventListener("input", () => {
            const value = playerSearch.value.toLowerCase().trim();
            if(!value){
                searchResults.style.display = "none";
                return;
            }
            const matches = players
                .filter(p => (p.name || '').toLowerCase().includes(value))
                .slice(0, 8);

            if(!matches.length){
                searchResults.style.display = "none";
                return;
            }

            searchResults.innerHTML = matches.map(p => `
                <div class="search-item"
                     onclick="window.location.href='/epl-player.html?player=${encodeURIComponent(slugify(p.name))}'">
                    ${p.name}
                </div>
            `).join('');

            searchResults.style.display = "block";
        });

        document.addEventListener("click", e => {
            if(!e.target.closest(".search-wrap")){
                searchResults.style.display = "none";
            }
        });

    }catch(err){

        console.error(err);
        page.innerHTML = `<div class="error">Failed To Load Player Data<br><small style="font-size:16px;color:#666;">${err.message}</small></div>`;

    }

}

loadPlayer();

</script>

</body>
</html>
