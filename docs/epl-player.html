<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#eef1f5;color:#111;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:white;border-bottom:1px solid #ddd;flex-wrap:wrap;}
.navbar a{text-decoration:none;font-weight:800;color:#0056d6;}
.hero{padding:50px 20px;text-align:center;color:white;position:relative;}
.hero h1{margin:0;font-size:60px;font-weight:900;line-height:1;}
.hero p{margin-top:14px;font-size:20px;font-weight:700;opacity:.95;}
.search-wrap{max-width:520px;margin:28px auto 0;position:relative;}
.search-input{width:100%;padding:16px 18px;border-radius:14px;border:none;font-size:18px;font-weight:700;box-sizing:border-box;outline:none;}
.search-results{position:absolute;top:100%;left:0;right:0;background:white;border-radius:0 0 14px 14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:999;display:none;}
.search-item{padding:14px 18px;border-bottom:1px solid #eee;cursor:pointer;font-weight:700;color:#111;}
.search-item:hover{background:#f3f6fb;}
.container{max-width:1500px;margin:28px auto;padding:0 20px 60px;}
.section{background:white;border-radius:22px;padding:26px;margin-bottom:30px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.section-title{font-size:18px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:22px;color:#666;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;}
.stat-card{background:#f4f7fb;border-radius:18px;padding:24px;text-align:center;border:1px solid #dde3ea;}
.stat-value{font-size:42px;font-weight:900;line-height:1;margin-bottom:10px;}
.stat-label{font-size:15px;font-weight:700;color:#555;}
.controls{margin-bottom:20px;}
.controls select{padding:12px 16px;border-radius:10px;border:1px solid #ccc;font-size:15px;font-weight:700;background:white;min-width:220px;}
table{width:100%;border-collapse:collapse;}
th{background:#e8edf3;padding:16px;text-align:left;font-size:13px;font-weight:900;text-transform:uppercase;}
td{padding:16px;border-bottom:1px solid #ececec;font-size:15px;font-weight:600;}
tr:nth-child(even){background:#f8fbff;}
.team-link{text-decoration:none;font-weight:800;color:#0056d6;}
.team-link:hover{text-decoration:underline;}
.loading,.error{padding:120px 20px;text-align:center;font-size:32px;font-weight:900;}
.error{color:#d90429;}
@media(max-width:900px){
  .hero h1{font-size:40px;}
  .hero p{font-size:16px;}
  .search-input{font-size:16px;}
  .stat-value{font-size:34px;}
  table{display:block;overflow-x:auto;white-space:nowrap;}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/epl.html">EPL</a>
  <a href="/epl-teams.html">Teams</a>
  <a href="/epl-players.html">Players</a>
  <a href="/nba.html">NBA</a>
  <a href="/afl.html">AFL</a>
</div>

<div id="page">
  <div class="loading">Loading Player...</div>
</div>

<script>

const TEAM_COLOURS = {
  "Arsenal":                   "linear-gradient(135deg,#EF0107,#9C0000)",
  "Aston Villa":               "linear-gradient(135deg,#95BFE5,#670E36)",
  "Barnsley":                  "linear-gradient(135deg,#CC0000,#FFFFFF)",
  "Birmingham City":           "linear-gradient(135deg,#0000CC,#FFFFFF)",
  "Blackburn Rovers":          "linear-gradient(135deg,#009EE0,#862633)",
  "Blackpool":                 "linear-gradient(135deg,#F68712,#FFFFFF)",
  "Bolton Wanderers":          "linear-gradient(135deg,#263C7E,#FFFFFF)",
  "Bradford City":             "linear-gradient(135deg,#862633,#FFBF00)",
  "Brentford":                 "linear-gradient(135deg,#e30613,#ffd700)",
  "Brighton & Hove Albion":    "linear-gradient(135deg,#0057B8,#FFFFFF)",
  "Burnley":                   "linear-gradient(135deg,#6C1D45,#99D6EA)",
  "Cardiff City":              "linear-gradient(135deg,#0070B5,#D01317)",
  "Charlton Athletic":         "linear-gradient(135deg,#CC0000,#FFFFFF)",
  "Chelsea":                   "linear-gradient(135deg,#034694,#001C58)",
  "Coventry City":             "linear-gradient(135deg,#59CAEA,#003366)",
  "Crystal Palace":            "linear-gradient(135deg,#1B458F,#C4122E)",
  "Derby County":              "linear-gradient(135deg,#FFFFFF,#000000)",
  "Everton":                   "linear-gradient(135deg,#003399,#001C58)",
  "Fulham":                    "linear-gradient(135deg,#CC0000,#000000)",
  "Huddersfield Town":         "linear-gradient(135deg,#0E63AD,#FFFFFF)",
  "Hull City":                 "linear-gradient(135deg,#F5A12D,#000000)",
  "Ipswich Town":              "linear-gradient(135deg,#0044A9,#FFFFFF)",
  "Leeds United":              "linear-gradient(135deg,#1D428A,#FFCD00)",
  "Leicester City":            "linear-gradient(135deg,#003090,#FDBE11)",
  "Liverpool":                 "linear-gradient(135deg,#C8102E,#00B2A9)",
  "Luton Town":                "linear-gradient(135deg,#F78F1E,#FFFFFF)",
  "Manchester City":           "linear-gradient(135deg,#6CABDD,#1C2C5B)",
  "Manchester United":         "linear-gradient(135deg,#DA291C,#FBE122)",
  "Manchester Utd":            "linear-gradient(135deg,#DA291C,#FBE122)",
  "Middlesbrough":             "linear-gradient(135deg,#CC0000,#FFFFFF)",
  "Newcastle United":          "linear-gradient(135deg,#111111,#666666)",
  "Norwich City":              "linear-gradient(135deg,#00A650,#FFF200)",
  "Nottingham Forest":         "linear-gradient(135deg,#DD0000,#FFFFFF)",
  "Oldham Athletic":           "linear-gradient(135deg,#004B8D,#FFFFFF)",
  "Portsmouth":                "linear-gradient(135deg,#001489,#FFFFFF)",
  "Queens Park Rangers":       "linear-gradient(135deg,#1D5BA4,#FFFFFF)",
  "Reading":                   "linear-gradient(135deg,#004494,#FFFFFF)",
  "Sheffield United":          "linear-gradient(135deg,#EE2737,#000000)",
  "Sheffield Wednesday":       "linear-gradient(135deg,#003399,#FFFFFF)",
  "Southampton":               "linear-gradient(135deg,#D71920,#130C0E)",
  "Stoke City":                "linear-gradient(135deg,#E03A3E,#1B2D6B)",
  "Sunderland":                "linear-gradient(135deg,#CC0000,#FFFFFF)",
  "Swansea City":              "linear-gradient(135deg,#FFFFFF,#000000)",
  "Swindon Town":              "linear-gradient(135deg,#CC0000,#FFFFFF)",
  "Tottenham Hotspur":         "linear-gradient(135deg,#132257,#FFFFFF)",
  "Watford":                   "linear-gradient(135deg,#FBEE23,#ED2127)",
  "West Bromwich Albion":      "linear-gradient(135deg,#122F67,#FFFFFF)",
  "West Ham United":           "linear-gradient(135deg,#7A263A,#1BB1E7)",
  "Wigan Athletic":            "linear-gradient(135deg,#1C5AA8,#FFFFFF)",
  "Wimbledon":                 "linear-gradient(135deg,#0000CC,#FFFF00)",
  "Wolverhampton Wanderers":   "linear-gradient(135deg,#FDB913,#231F20)",
  "Wolves":                    "linear-gradient(135deg,#FDB913,#231F20)"
};

function slugify(name){
  return (name || '')
    .toLowerCase()
    .replace(/\./g,'')
    .replace(/'/g,'')
    .replace(/\u2019/g,'')
    .replace(/"/g,'')
    .replace(/\s+/g,'-');
}

const params     = new URLSearchParams(window.location.search);
const playerSlug = params.get("player") || '';
const page       = document.getElementById("page");

async function loadPlayer(){
  try{
    page.innerHTML = '<div class="loading">Loading player data...</div>';

    const res = await fetch("/data/epl/players.json");
    if(!res.ok) throw new Error(`players.json returned ${res.status}`);
    const players = await res.json();

    const player = players.find(p => slugify(p.name) === playerSlug);

    if(!player){
      page.innerHTML = `<div class="error">Player Not Found</div>`;
      return;
    }

    const playerDisplayName = player.name;
    const playerTeams       = player.teams || [];
    const seasonStats       = player.season_stats || [];
    const currentTeam       = playerTeams[playerTeams.length - 1] || "Unknown";
    const heroGradient      = TEAM_COLOURS[currentTeam] || 'linear-gradient(135deg,#111,#444)';

    // Collect all opponents this player has scored against
    const opponentSet = new Set();
    seasonStats.forEach(s => {
      Object.keys(s.goals_by_opponent || {}).forEach(opp => opponentSet.add(opp));
    });
    const opponents = [...opponentSet].sort();

    page.innerHTML = `
      <div class="hero" style="background:${heroGradient};">
        <h1>${playerDisplayName}</h1>
        <p>Premier League Player Profile</p>
        <div class="search-wrap">
          <input type="text" class="search-input" id="playerSearch"
                 placeholder="Search player..." autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>

      <div class="container">

        <div class="section">
          <div class="section-title">Career Summary</div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value" style="font-size:22px;">${currentTeam}</div>
              <div class="stat-label">Club</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${seasonStats.length}</div>
              <div class="stat-label">Seasons</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${player.goals || 0}</div>
              <div class="stat-label">Career Goals</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${player.penalties || 0}</div>
              <div class="stat-label">Penalties</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${player.yellow_cards || 0}</div>
              <div class="stat-label">Yellow Cards</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${player.red_cards || 0}</div>
              <div class="stat-label">Red Cards</div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Season by Season</div>
          <div class="controls">
            <select id="opponentFilter">
              <option value="">All Opponents</option>
              ${opponents.map(o => `<option value="${o}">${o}</option>`).join('')}
            </select>
          </div>
          <div id="seasonTableContainer"></div>
        </div>

      </div>
    `;

    // Search
    const playerSearch  = document.getElementById("playerSearch");
    const searchResults = document.getElementById("searchResults");

    playerSearch.addEventListener("input", () => {
      const value = playerSearch.value.toLowerCase().trim();
      if(!value){ searchResults.style.display = "none"; return; }
      const matches = players
        .filter(p => (p.name || '').toLowerCase().includes(value))
        .slice(0, 8);
      if(!matches.length){ searchResults.style.display = "none"; return; }
      searchResults.innerHTML = matches.map(p => `
        <div class="search-item"
             onclick="window.location.href='/epl-player.html?player=${encodeURIComponent(slugify(p.name))}'">
          ${p.name}
        </div>
      `).join('');
      searchResults.style.display = "block";
    });

    document.addEventListener("click", e => {
      if(!e.target.closest(".search-wrap")) searchResults.style.display = "none";
    });

    // Render season table
    function renderTable(){
      const opponent = document.getElementById("opponentFilter").value;
      const container = document.getElementById("seasonTableContainer");

      if(!seasonStats.length){
        container.innerHTML = '<p>No season data available.</p>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Season</th>
              <th>Club</th>
              <th>Goals${opponent ? ' vs ' + opponent : ''}</th>
              <th>Penalties</th>
              <th>Yellow Cards</th>
              <th>Red Cards</th>
            </tr>
          </thead>
          <tbody>
      `;

      // Show most recent season first
      [...seasonStats].reverse().forEach(s => {
        const goals = opponent
          ? (s.goals_by_opponent || {})[opponent] || 0
          : s.goals || 0;

        html += `
          <tr>
            <td><a class="team-link" href="/epl-season.html?season=${encodeURIComponent(s.season)}">${s.season}</a></td>
            <td><a class="team-link" href="/epl-team.html?team=${encodeURIComponent(s.team)}">${s.team}</a></td>
            <td>${goals}</td>
            <td>${opponent ? '-' : (s.penalties || 0)}</td>
            <td>${opponent ? '-' : (s.yellow_cards || 0)}</td>
            <td>${opponent ? '-' : (s.red_cards || 0)}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    document.getElementById("opponentFilter").addEventListener("change", renderTable);
    renderTable();

  }catch(err){
    console.error(err);
    page.innerHTML = `<div class="error">Failed to load player data</div>`;
  }
}

loadPlayer();

</script>
</body>
</html>
