<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#eef1f5;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.hero{
padding:70px 20px;
color:white;
text-align:center;
}

.hero h1{
margin:0;
font-size:72px;
font-weight:900;
line-height:1;
}

.hero p{
margin-top:18px;
font-size:24px;
font-weight:700;
opacity:.95;
}

.container{
max-width:1500px;
margin:30px auto 70px;
padding:0 20px;
}

.section{
background:white;
border-radius:24px;
padding:34px;
margin-bottom:34px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.section-title{
font-size:18px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
margin-bottom:20px;
color:#666;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:22px;
}

.stat-card{
background:#f4f7fb;
border-radius:20px;
padding:28px;
text-align:center;
border:1px solid #dde3ea;
}

.stat-value{
font-size:56px;
font-weight:900;
line-height:1;
margin-bottom:12px;
}

.stat-label{
font-size:18px;
font-weight:700;
color:#555;
}

.stat-sub{
font-size:14px;
color:#777;
margin-top:8px;
font-weight:700;
}

.filters{
display:flex;
gap:18px;
margin-bottom:28px;
flex-wrap:wrap;
}

select{
padding:14px 18px;
border-radius:14px;
border:1px solid #ccc;
font-size:17px;
font-weight:700;
background:white;
min-width:260px;
}

table{
width:100%;
border-collapse:collapse;
overflow:hidden;
border-radius:18px;
}

th{
background:#e8edf3;
padding:18px 16px;
text-align:left;
font-size:15px;
font-weight:900;
text-transform:uppercase;
}

td{
padding:16px;
border-bottom:1px solid #ececec;
font-size:16px;
font-weight:600;
}

tr:nth-child(even){
background:#f8fbff;
}

.result-win{
color:#0a8f3d;
font-weight:900;
}

.result-draw{
color:#e67e22;
font-weight:900;
}

.result-loss{
color:#d90429;
font-weight:900;
}

.team-link{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.team-link:hover{
text-decoration:underline;
}

.loading,
.error{
padding:120px 20px;
text-align:center;
font-size:32px;
font-weight:900;
}

.error{
color:#d90429;
}

@media(max-width:900px){

.hero h1{
font-size:46px;
}

.hero p{
font-size:18px;
}

.stat-value{
font-size:42px;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

.filters{
flex-direction:column;
}

}

</style>
</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/epl-teams.html">Teams</a>
<a href="/epl-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div id="page">

<div class="loading">
Loading Player...
</div>

</div>

<script>

const TEAM_COLOURS = {

"Everton":"linear-gradient(135deg,#003399,#001C58)",
"Arsenal":"linear-gradient(135deg,#EF0107,#9C0000)",
"Liverpool":"linear-gradient(135deg,#C8102E,#00B2A9)",
"Chelsea":"linear-gradient(135deg,#034694,#001C58)",
"Manchester United":"linear-gradient(135deg,#DA291C,#FBE122)",
"Manchester City":"linear-gradient(135deg,#6CABDD,#1C2C5B)",
"Tottenham Hotspur":"linear-gradient(135deg,#132257,#FFFFFF)"

};

const params = new URLSearchParams(window.location.search);

const playerName = params.get("player");

const page = document.getElementById("page");

async function loadPlayer(){

try{

const response =
await fetch("/data/epl/players.json");

const players =
await response.json();

const player =
players.find(p=>p.player === playerName);

if(!player){

page.innerHTML = `
<div class="error">
Player Not Found
</div>
`;

return;

}

const opponents = [
"All Opponents",
"Liverpool",
"Chelsea",
"Arsenal",
"Manchester United",
"Manchester City",
"Tottenham Hotspur"
];

const allGames = [

{
season:"2006-07",
opponent:"Liverpool",
result:"W",
score:"3-0",
goals:1,
assists:0,
yellow:0,
red:0
},

{
season:"2007-08",
opponent:"Chelsea",
result:"D",
score:"1-1",
goals:0,
assists:1,
yellow:1,
red:0
},

{
season:"2008-09",
opponent:"Arsenal",
result:"L",
score:"1-2",
goals:1,
assists:0,
yellow:0,
red:0
},

{
season:"2009-10",
opponent:"Liverpool",
result:"W",
score:"2-0",
goals:2,
assists:1,
yellow:0,
red:0
},

{
season:"2010-11",
opponent:"Chelsea",
result:"L",
score:"0-1",
goals:0,
assists:0,
yellow:1,
red:0
}

];

function calculateStats(games){

const gamesPlayed = games.length;

const goals =
games.reduce((sum,g)=>sum + g.goals,0);

const assists =
games.reduce((sum,g)=>sum + g.assists,0);

const yellows =
games.reduce((sum,g)=>sum + g.yellow,0);

const reds =
games.reduce((sum,g)=>sum + g.red,0);

return {
games:gamesPlayed,
goals,
assists,
yellows,
reds
};

}

const careerStats =
calculateStats(allGames);

page.innerHTML = `

<div
class="hero"
style="
background:${TEAM_COLOURS[player.team] || 'linear-gradient(135deg,#111,#444)'};
"
>

<h1>${player.player}</h1>

<p>
Premier League Player Profile
</p>

</div>

<div class="container">

<div class="section">

<div class="section-title">
Career Summary
</div>

<div class="stats-grid">

<div class="stat-card">
<div class="stat-value">${player.team}</div>
<div class="stat-label">Club</div>
</div>

<div class="stat-card">
<div class="stat-value">${careerStats.games}</div>
<div class="stat-label">Games</div>
</div>

<div class="stat-card">
<div class="stat-value">${careerStats.goals}</div>
<div class="stat-label">Goals</div>
</div>

<div class="stat-card">
<div class="stat-value">${careerStats.assists}</div>
<div class="stat-label">Assists</div>
</div>

<div class="stat-card">
<div class="stat-value">${careerStats.yellows}</div>
<div class="stat-label">Yellow Cards</div>
</div>

<div class="stat-card">
<div class="stat-value">${careerStats.reds}</div>
<div class="stat-label">Red Cards</div>
</div>

</div>

</div>

<div class="section">

<div class="filters">

<select id="opponentSelect">

${opponents.map(o=>`
<option value="${o}">
${o}
</option>
`).join("")}

</select>

</div>

<div class="section-title">
Vs Selected Opponent
</div>

<div class="stats-grid">

<div class="stat-card">
<div class="stat-value" id="oppGames">0</div>
<div class="stat-label">Games</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppGoals">0</div>
<div class="stat-label">Goals</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppAssists">0</div>
<div class="stat-label">Assists</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppYellows">0</div>
<div class="stat-label">Yellow Cards</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppReds">0</div>
<div class="stat-label">Red Cards</div>
</div>

</div>

</div>

<div class="section">

<div class="section-title">
Match Log
</div>

<table>

<thead>

<tr>
<th>Season</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
<th>Goals</th>
<th>Assists</th>
<th>YC</th>
<th>RC</th>
</tr>

</thead>

<tbody id="matchTable">

</tbody>

</table>

</div>

</div>

`;

const opponentSelect =
document.getElementById("opponentSelect");

const matchTable =
document.getElementById("matchTable");

function renderGames(games){

matchTable.innerHTML = games.map(game=>`

<tr>

<td>${game.season}</td>

<td>

<a
class="team-link"
href="/epl-team.html?team=${encodeURIComponent(game.opponent)}"
>

vs ${game.opponent}

</a>

</td>

<td class="
${game.result === "W" ? "result-win" : ""}
${game.result === "D" ? "result-draw" : ""}
${game.result === "L" ? "result-loss" : ""}
">

${game.result}

</td>

<td>${game.score}</td>

<td>${game.goals}</td>

<td>${game.assists}</td>

<td>${game.yellow}</td>

<td>${game.red}</td>

</tr>

`).join("");

}

function updateOpponentStats(games){

const stats =
calculateStats(games);

document.getElementById("oppGames").textContent =
stats.games;

document.getElementById("oppGoals").textContent =
stats.goals;

document.getElementById("oppAssists").textContent =
stats.assists;

document.getElementById("oppYellows").textContent =
stats.yellows;

document.getElementById("oppReds").textContent =
stats.reds;

}

function updatePage(){

const selected =
opponentSelect.value;

let filteredGames = allGames;

if(selected !== "All Opponents"){

filteredGames =
allGames.filter(g=>g.opponent === selected);

}

renderGames(filteredGames);

updateOpponentStats(filteredGames);

}

updatePage();

opponentSelect.addEventListener("change",updatePage);

}catch(err){

console.error(err);

page.innerHTML = `
<div class="error">
Failed To Load Player Data
</div>
`;

}

}

loadPlayer();

</script>

</body>
</html>
