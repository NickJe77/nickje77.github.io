<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#eef1f5;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.hero{
padding:50px 20px;
text-align:center;
color:white;
position:relative;
}

.hero h1{
margin:0;
font-size:60px;
font-weight:900;
line-height:1;
}

.hero p{
margin-top:14px;
font-size:20px;
font-weight:700;
opacity:.95;
}

.search-wrap{
max-width:520px;
margin:28px auto 0;
position:relative;
}

.search-input{
width:100%;
padding:16px 18px;
border-radius:14px;
border:none;
font-size:18px;
font-weight:700;
box-sizing:border-box;
outline:none;
}

.search-results{
position:absolute;
top:100%;
left:0;
right:0;
background:white;
border-radius:0 0 14px 14px;
overflow:hidden;
box-shadow:0 8px 24px rgba(0,0,0,.18);
z-index:999;
display:none;
}

.search-item{
padding:14px 18px;
border-bottom:1px solid #eee;
cursor:pointer;
font-weight:700;
color:#111;
}

.search-item:hover{
background:#f3f6fb;
}

.container{
max-width:1500px;
margin:28px auto;
padding:0 20px 60px;
}

.section{
background:white;
border-radius:22px;
padding:26px;
margin-bottom:30px;
box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.section-title{
font-size:18px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
margin-bottom:22px;
color:#666;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:18px;
}

.stat-card{
background:#f4f7fb;
border-radius:18px;
padding:24px;
text-align:center;
border:1px solid #dde3ea;
}

.stat-value{
font-size:42px;
font-weight:900;
line-height:1;
margin-bottom:10px;
}

.stat-label{
font-size:15px;
font-weight:700;
color:#555;
}

.filters{
margin-bottom:20px;
}

select{
padding:12px 16px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
font-weight:800;
background:white;
min-width:260px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#e8edf3;
padding:16px;
text-align:left;
font-size:13px;
font-weight:900;
text-transform:uppercase;
}

td{
padding:16px;
border-bottom:1px solid #ececec;
font-size:15px;
font-weight:600;
}

tr:nth-child(even){
background:#f8fbff;
}

.result-win{
color:#0a8f3d;
font-weight:900;
}

.result-draw{
color:#e67e22;
font-weight:900;
}

.result-loss{
color:#d90429;
font-weight:900;
}

.team-link{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.team-link:hover{
text-decoration:underline;
}

.loading,
.error{
padding:120px 20px;
text-align:center;
font-size:32px;
font-weight:900;
}

.error{
color:#d90429;
}

@media(max-width:900px){

.hero h1{
font-size:40px;
}

.hero p{
font-size:16px;
}

.search-input{
font-size:16px;
}

.stat-value{
font-size:34px;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

}

</style>
</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/epl-teams.html">Teams</a>
<a href="/epl-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div id="page">

<div class="loading">
Loading Player...
</div>

</div>

<script>

const TEAM_COLOURS = {

"Everton":"linear-gradient(135deg,#003399,#001C58)",
"Arsenal":"linear-gradient(135deg,#EF0107,#9C0000)",
"Liverpool":"linear-gradient(135deg,#C8102E,#00B2A9)",
"Chelsea":"linear-gradient(135deg,#034694,#001C58)",
"Manchester United":"linear-gradient(135deg,#DA291C,#FBE122)",
"Manchester City":"linear-gradient(135deg,#6CABDD,#1C2C5B)",
"Tottenham Hotspur":"linear-gradient(135deg,#132257,#FFFFFF)",
"Newcastle United":"linear-gradient(135deg,#111111,#666666)"

};

const params = new URLSearchParams(window.location.search);

const playerName = params.get("player");

const page = document.getElementById("page");

async function loadPlayer(){

try{

const playersResponse =
await fetch("/data/epl/players.json");

const players =
await playersResponse.json();

const seasonsResponse =
await fetch("/data/epl/seasons.json");

const seasons =
await seasonsResponse.json();

const player =
players.find(p => {

const name =
p.player || p.name || p.player_name;

return (
name &&
playerName &&
name.toLowerCase() === playerName.toLowerCase()
);

});

if(!player){

page.innerHTML = `
<div class="error">
Player Not Found
</div>
`;

return;

}

const playerDisplayName =
player.player || player.name || player.player_name;

const playerClub =
player.team || player.club || "Unknown";

const allGames = [];

seasons.forEach(season=>{

if(!season.games) return;

season.games.forEach(game=>{

const homePlayers =
game.home_players || [];

const awayPlayers =
game.away_players || [];

const combined =
[...homePlayers,...awayPlayers];

combined.forEach(p=>{

const name =
p.player || p.name || p.player_name;

if(
name &&
name.toLowerCase() === playerDisplayName.toLowerCase()
){

const isHome =
homePlayers.includes(p);

const opponent =
isHome
? game.away_team
: game.home_team;

const team =
isHome
? game.home_team
: game.away_team;

const homeGoals =
game.home_score || 0;

const awayGoals =
game.away_score || 0;

let result = "D";

if(
(isHome && homeGoals > awayGoals) ||
(!isHome && awayGoals > homeGoals)
){
result = "W";
}

if(
(isHome && homeGoals < awayGoals) ||
(!isHome && awayGoals < homeGoals)
){
result = "L";
}

allGames.push({

season:
season.season || season.year || "",

team,

opponent,

result,

score:
`${homeGoals}-${awayGoals}`,

goals:
p.goals || 0,

assists:
p.assists || 0,

yellow:
p.yellow_cards || p.yellow || 0,

red:
p.red_cards || p.red || 0

});

}

});

});

});

function calculateStats(games){

return {

games:games.length,

goals:
games.reduce((sum,g)=>sum + g.goals,0),

assists:
games.reduce((sum,g)=>sum + g.assists,0),

yellow:
games.reduce((sum,g)=>sum + g.yellow,0),

red:
games.reduce((sum,g)=>sum + g.red,0)

};

}

const careerStats =
calculateStats(allGames);

const opponents = [
"All Opponents",
...new Set(allGames.map(g=>g.opponent))
].sort();

page.innerHTML = `

<div
class="hero"
style="
background:${TEAM_COLOURS[playerClub] || 'linear-gradient(135deg,#111,#444)'};
"
>

<h1>${playerDisplayName}</h1>

<p>
Premier League Player Profile
</p>

<div class="search-wrap">

<input
type="text"
class="search-input"
id="playerSearch"
placeholder="Search player..."
autocomplete="off"
>

<div
class="search-results"
id="searchResults"
></div>

</div>

</div>

<div class="container">

<div class="section">

<div class="section-title">
Career Summary
</div>

<div class="stats-grid">

<div class="stat-card">
<div class="stat-value">
${playerClub}
</div>
<div class="stat-label">
Club
</div>
</div>

<div class="stat-card">
<div class="stat-value">
${careerStats.games}
</div>
<div class="stat-label">
Games
</div>
</div>

<div class="stat-card">
<div class="stat-value">
${careerStats.goals}
</div>
<div class="stat-label">
Goals
</div>
</div>

<div class="stat-card">
<div class="stat-value">
${careerStats.assists}
</div>
<div class="stat-label">
Assists
</div>
</div>

<div class="stat-card">
<div class="stat-value">
${careerStats.yellow}
</div>
<div class="stat-label">
Yellow Cards
</div>
</div>

<div class="stat-card">
<div class="stat-value">
${careerStats.red}
</div>
<div class="stat-label">
Red Cards
</div>
</div>

</div>

</div>

<div class="section">

<div class="filters">

<select id="opponentSelect">

${opponents.map(o=>`
<option value="${o}">
${o}
</option>
`).join("")}

</select>

</div>

<div class="section-title">
Vs Selected Opponent
</div>

<div class="stats-grid">

<div class="stat-card">
<div class="stat-value" id="oppGames">0</div>
<div class="stat-label">Games</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppGoals">0</div>
<div class="stat-label">Goals</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppAssists">0</div>
<div class="stat-label">Assists</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppYellow">0</div>
<div class="stat-label">Yellow Cards</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppRed">0</div>
<div class="stat-label">Red Cards</div>
</div>

</div>

</div>

<div class="section">

<div class="section-title">
Match Log
</div>

<table>

<thead>

<tr>
<th>Season</th>
<th>Team</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
<th>Goals</th>
<th>Assists</th>
<th>YC</th>
<th>RC</th>
</tr>

</thead>

<tbody id="matchBody">

</tbody>

</table>

</div>

</div>

`;

const opponentSelect =
document.getElementById("opponentSelect");

const matchBody =
document.getElementById("matchBody");

function renderGames(games){

matchBody.innerHTML = games.map(game=>`

<tr>

<td>${game.season}</td>

<td>${game.team}</td>

<td>

<a
class="team-link"
href="/epl-team.html?team=${encodeURIComponent(game.opponent)}"
>

${game.opponent}

</a>

</td>

<td class="
${game.result === "W" ? "result-win" : ""}
${game.result === "D" ? "result-draw" : ""}
${game.result === "L" ? "result-loss" : ""}
">

${game.result}

</td>

<td>${game.score}</td>

<td>${game.goals}</td>

<td>${game.assists}</td>

<td>${game.yellow}</td>

<td>${game.red}</td>

</tr>

`).join("");

}

function updateOpponentStats(games){

const stats =
calculateStats(games);

document.getElementById("oppGames").textContent =
stats.games;

document.getElementById("oppGoals").textContent =
stats.goals;

document.getElementById("oppAssists").textContent =
stats.assists;

document.getElementById("oppYellow").textContent =
stats.yellow;

document.getElementById("oppRed").textContent =
stats.red;

}

function updatePage(){

const selected =
opponentSelect.value;

let filteredGames = allGames;

if(selected !== "All Opponents"){

filteredGames =
allGames.filter(g=>g.opponent === selected);

}

renderGames(filteredGames);

updateOpponentStats(filteredGames);

}

updatePage();

opponentSelect.addEventListener("change",updatePage);

const playerSearch =
document.getElementById("playerSearch");

const searchResults =
document.getElementById("searchResults");

playerSearch.addEventListener("input",()=>{

const value =
playerSearch.value.toLowerCase().trim();

if(!value){

searchResults.style.display = "none";
searchResults.innerHTML = "";
return;

}

const matches =
players.filter(p=>{

const name =
p.player || p.name || p.player_name || "";

return name.toLowerCase().includes(value);

}).slice(0,8);

if(matches.length === 0){

searchResults.style.display = "none";
return;

}

searchResults.innerHTML =
matches.map(p=>{

const name =
p.player || p.name || p.player_name;

return `

<div
class="search-item"
onclick="
window.location.href='/epl-player.html?player=${encodeURIComponent(name)}'
"
>

${name}

</div>

`;

}).join("");

searchResults.style.display = "block";

});

document.addEventListener("click",(e)=>{

if(!e.target.closest(".search-wrap")){

searchResults.style.display = "none";

}

});

}catch(err){

console.error(err);

page.innerHTML = `
<div class="error">
Failed To Load Player Data
</div>
`;

}

}

loadPlayer();

</script>

</body>
</html>
