<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --league:#c99a3d;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

/* ── Hero (club-colour identity, kept per-player's current club) ─ */
.hero{padding:44px 20px 56px;text-align:center;color:#fff;position:relative;box-shadow:0 18px 40px -18px rgba(10,16,24,.4);}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:10px;
  text-shadow:0 1px 3px rgba(0,0,0,.3);
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,5.5vw,50px);
  line-height:1.05;letter-spacing:.01em;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.25);
}
.hero p{margin-top:10px;font-size:14px;font-weight:600;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.25);}

.search-wrap{max-width:480px;margin:24px auto 0;position:relative;}
.search-input{
  width:100%;padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);font-size:14px;font-weight:600;box-sizing:border-box;outline:none;color:#fff;
  font-family:var(--body);
}
.search-input::placeholder{color:rgba(255,255,255,.6);}
.search-input:focus{border-color:#fff;background:rgba(255,255,255,.18);}

.search-results{
  position:absolute;top:100%;left:0;right:0;background:var(--surface);border-radius:12px;
  overflow:hidden;box-shadow:0 18px 40px -18px rgba(10,16,24,.4);z-index:999;display:none;margin-top:8px;
}
.search-item{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600;color:var(--ink);font-size:13.5px;}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:#f0f6ff;}
.search-item small{color:var(--muted);font-weight:600;margin-left:8px;}

.container{max-width:1500px;margin:0 auto;padding:26px 20px 70px;}

.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
.section-title{
  font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:20px;color:var(--muted);
}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;text-align:center;}
.stat-value{font-family:var(--display);font-weight:600;font-size:32px;line-height:1;margin-bottom:8px;color:var(--ink);}
.stat-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}

select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;
  background:var(--surface);color:var(--ink);min-width:220px;
}

table{width:100%;border-collapse:collapse;}
th{background:#f7f9fb;padding:12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);}
td{padding:12px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;color:#27313c;}
tr:last-child td{border-bottom:none;}
.team-link{text-decoration:none;font-weight:700;color:var(--league);}
.team-link:hover{color:var(--accent);text-decoration:underline;}

.loading,.error{padding:100px 20px;text-align:center;font-family:var(--display);font-size:24px;font-weight:600;text-transform:uppercase;letter-spacing:.01em;color:var(--muted);}
.error{color:#c0362c;}

@media(max-width:900px){
  .hero h1{font-size:32px;}
  .hero p{font-size:14px;}
  .stat-value{font-size:26px;}
  table{display:block;overflow-x:auto;white-space:nowrap;}
}
/* Fantasy Premier League */
.stat-card.fp{background:#0c130f;border-color:#0c130f;}
.stat-card.fp .stat-value{color:#fff;}
.stat-card.fp .stat-label{color:#c99a3d;}
.stat-card .stat-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:6px;}
th.fp,td.fp{background:rgba(201,154,61,.14);}
td.fp{font-weight:700;}
.fp-note{font-size:12px;color:var(--muted);margin-top:10px;}
/* Game log */
.gl-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.gl-controls select{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:600;}
.gl-count{font-size:13px;color:var(--muted);margin-left:auto;}
tr.gl-row{cursor:pointer;}
tr.gl-row:hover td{background:#f0f6ff;}
.res{display:inline-block;min-width:22px;text-align:center;font-size:11px;font-weight:700;padding:2px 6px;border-radius:999px;margin-right:6px;}
.res.W{background:#d0edcc;color:#1a5c1a;}.res.L{background:#fddcdc;color:#8c1a1a;}.res.D{background:#fef3cc;color:#6b5010;}
.gl-more{display:block;margin:14px auto 0;padding:10px 20px;border:none;border-radius:999px;background:var(--ink,#0f141a);color:#fff;font-weight:600;cursor:pointer;}
</style>
</head>

<body>

<nav class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>

<div id="page">
<div class="loading">Loading Player...</div>
</div>

<script>

const TEAM_COLOURS = {
"Arsenal":"linear-gradient(135deg,#EF0107,#9C0000)",
"Aston Villa":"linear-gradient(135deg,#670E36,#95BFE5)",
"Barnsley":"linear-gradient(135deg,#CC0000,#FFFFFF)",
"Birmingham City":"linear-gradient(135deg,#0000CC,#FFFFFF)",
"Blackburn Rovers":"linear-gradient(135deg,#009EE0,#862633)",
"Blackpool":"linear-gradient(135deg,#F68712,#FFFFFF)",
"Bolton Wanderers":"linear-gradient(135deg,#263C7E,#FFFFFF)",
"Bradford City":"linear-gradient(135deg,#862633,#FFBF00)",
"Brentford":"linear-gradient(135deg,#E30613,#111111)",
"Brighton & Hove Albion":"linear-gradient(135deg,#0057B8,#FFCD00)",
"Burnley":"linear-gradient(135deg,#6C1D45,#99D6EA)",
"Cardiff City":"linear-gradient(135deg,#0070B5,#D01317)",
"Charlton Athletic":"linear-gradient(135deg,#CC0000,#FFFFFF)",
"Chelsea":"linear-gradient(135deg,#034694,#001C58)",
"Coventry City":"linear-gradient(135deg,#59CAEA,#003366)",
"Crystal Palace":"linear-gradient(135deg,#1B458F,#C4122E)",
"Derby County":"linear-gradient(135deg,#111111,#FFFFFF)",
"Everton":"linear-gradient(135deg,#003399,#001C58)",
"Fulham":"linear-gradient(135deg,#111111,#FFFFFF)",
"Huddersfield Town":"linear-gradient(135deg,#0E63AD,#FFFFFF)",
"Hull City":"linear-gradient(135deg,#F5A12D,#000000)",
"Ipswich Town":"linear-gradient(135deg,#005BAC,#FFFFFF)",
"Leeds United":"linear-gradient(135deg,#1D428A,#FFCD00)",
"Leicester City":"linear-gradient(135deg,#003090,#FDBE11)",
"Liverpool":"linear-gradient(135deg,#C8102E,#00B2A9)",
"Luton Town":"linear-gradient(135deg,#F78F1E,#FFFFFF)",
"Manchester City":"linear-gradient(135deg,#6CABDD,#1C2C5B)",
"Manchester United":"linear-gradient(135deg,#DA291C,#8B0000)",
"Manchester Utd":"linear-gradient(135deg,#DA291C,#8B0000)",
"Middlesbrough":"linear-gradient(135deg,#CC0000,#FFFFFF)",
"Newcastle United":"linear-gradient(135deg,#111111,#666666)",
"Norwich City":"linear-gradient(135deg,#00A650,#FFF200)",
"Nottingham Forest":"linear-gradient(135deg,#DD0000,#FFFFFF)",
"Oldham Athletic":"linear-gradient(135deg,#004B8D,#FFFFFF)",
"Portsmouth":"linear-gradient(135deg,#001489,#FFFFFF)",
"Queens Park Rangers":"linear-gradient(135deg,#1D5BA4,#FFFFFF)",
"Reading":"linear-gradient(135deg,#004494,#FFFFFF)",
"Sheffield United":"linear-gradient(135deg,#EE2737,#000000)",
"Sheffield Wednesday":"linear-gradient(135deg,#003399,#FFFFFF)",
"Southampton":"linear-gradient(135deg,#D71920,#FFFFFF)",
"Stoke City":"linear-gradient(135deg,#E03A3E,#1B2D6B)",
"Sunderland":"linear-gradient(135deg,#CC0000,#FFFFFF)",
"Swansea City":"linear-gradient(135deg,#111111,#FFFFFF)",
"Swindon Town":"linear-gradient(135deg,#CC0000,#FFFFFF)",
"Tottenham Hotspur":"linear-gradient(135deg,#132257,#FFFFFF)",
"Watford":"linear-gradient(135deg,#FBEE23,#ED2127)",
"West Bromwich Albion":"linear-gradient(135deg,#122F67,#FFFFFF)",
"West Ham United":"linear-gradient(135deg,#7A263A,#1BB1E7)",
"Wigan Athletic":"linear-gradient(135deg,#1C5AA8,#FFFFFF)",
"Wimbledon":"linear-gradient(135deg,#0000CC,#FFFF00)",
"Wolverhampton Wanderers":"linear-gradient(135deg,#FDB913,#231F20)",
"Wolves":"linear-gradient(135deg,#FDB913,#231F20)"
};

function slugify(str){
    return (str || '')
        .toLowerCase()
        .replace(/&/g,'and')
        .replace(/[^a-z0-9]+/g,'-')
        .replace(/^-|-$/g,'');
}

function playerSlug(p){
    const name      = slugify(p.name || '');
    const firstTeam = slugify((p.teams && p.teams[0]) || '');
    return firstTeam ? `${name}--${firstTeam}` : name;
}

const params    = new URLSearchParams(window.location.search);
const slugParam = params.get("player") || '';
const page      = document.getElementById("page");

async function loadPlayer(){

    try{

        page.innerHTML = '<div class="loading">Loading player data...</div>';

        const res = await fetch("/data/epl/players.json");
        if(!res.ok) throw new Error(`players.json returned ${res.status}`);
        const players = await res.json();

        // Try exact slug match first (name--team), then fall back to name only
        let player = players.find(p => playerSlug(p) === slugParam);
        if(!player){
            player = players.find(p => slugify(p.name) === slugParam);
        }
        // If still not found, try matching just the name part before --
        if(!player){
            const namePart = slugParam.split('--')[0];
            player = players.find(p => slugify(p.name) === namePart);
        }

        if(!player){
            page.innerHTML = `<div class="error">Player Not Found</div>`;
            return;
        }

        // Official FPL points by season (2016-17 on): {season: [pts, games, best, bestVs, bestDate]}
        let fpl = {};
        try{
            const fr = await fetch("/data/epl/fantasy/players.json");
            if(fr.ok) fpl = (await fr.json())[player.name] || {};
        }catch(e){ fpl = {}; }
        const fplSeasons = Object.entries(fpl);
        const fplTotal = fplSeasons.reduce((a,[,v]) => a + v[0], 0);
        const fplGames = fplSeasons.reduce((a,[,v]) => a + v[1], 0);
        const fplBest  = fplSeasons.reduce((b,[,v]) => (!b || v[2] > b[2]) ? v : b, null);
        const fplCards = fplGames ? `
                        <div class="stat-card fp">
                            <div class="stat-value">${fplTotal.toLocaleString()}</div>
                            <div class="stat-label">FPL Points</div>
                        </div>
                        <div class="stat-card fp">
                            <div class="stat-value">${(fplTotal / fplGames).toFixed(1)}</div>
                            <div class="stat-label">FPL Avg / Game</div>
                            <div class="stat-sub">${fplGames} games</div>
                        </div>
                        <div class="stat-card fp">
                            <div class="stat-value">${fplBest[2]}</div>
                            <div class="stat-label">Best FPL Game</div>
                            <div class="stat-sub">vs ${fplBest[3]}${fplBest[4] ? ' · ' + fplBest[4] : ''}</div>
                        </div>` : '';

        const playerDisplayName = player.name;
        // Club = team in the player's MOST RECENT season. (player.teams isn't in
        // date order -- e.g. Ross Barkley listed Luton after Aston Villa.)
        const latestSeason      = (player.season_stats || []).slice().sort((a,b) => String(b.season).localeCompare(String(a.season)))[0];
        const currentTeam       = (latestSeason && latestSeason.team)
                                  || (player.teams && player.teams[player.teams.length - 1]) || "Unknown";
        const heroGradient      = TEAM_COLOURS[currentTeam] || 'linear-gradient(135deg,#111,#444)';

        page.innerHTML = `
            <div class="hero" style="background:${heroGradient};">
                <div class="eyebrow">Premier League Player</div>
                <h1>${playerDisplayName}</h1>
                <p>Premier League Player Profile</p>
                <div class="search-wrap">
                    <input type="text" class="search-input" id="playerSearch"
                           placeholder="Search player..." autocomplete="off">
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>

            <div class="container">

                <div class="section">
                    <div class="section-title">Career Summary</div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" style="font-size:20px;">${currentTeam}</div>
                            <div class="stat-label">Club</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.seasons ? player.seasons.length : 0}</div>
                            <div class="stat-label">Seasons</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.goals || 0}</div>
                            <div class="stat-label">Goals</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.penalties || 0}</div>
                            <div class="stat-label">Penalties</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.yellow_cards || 0}</div>
                            <div class="stat-label">Yellow Cards</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${player.red_cards || 0}</div>
                            <div class="stat-label">Red Cards</div>
                        </div>
                        ${fplCards}
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Season by Season</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Season</th>
                                <th>Team</th>
                                <th>Goals</th>
                                <th>Penalties</th>
                                <th>Yellow Cards</th>
                                <th>Red Cards</th>
                                ${fplGames ? '<th class="fp" title="Official Fantasy Premier League points">FPL Pts</th>' : ''}
                            </tr>
                        </thead>
                        <tbody>
                            ${(player.season_stats || []).map(s => `
                                <tr>
                                    <td><a class="team-link" href="/epl-season.html?season=${s.season}">${s.season}</a></td>
                                    <td>${s.team || ''}</td>
                                    <td>${s.goals || 0}</td>
                                    <td>${s.penalties || 0}</td>
                                    <td>${s.yellow_cards || 0}</td>
                                    <td>${s.red_cards || 0}</td>
                                    ${fplGames ? `<td class="fp">${fpl[s.season] ? fpl[s.season][0] : '–'}</td>` : ''}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    ${fplGames ? '<div class="fp-note">FPL = official Fantasy Premier League points, available from 2016-17.</div>' : ''}
                </div>

                <div class="section" id="gameLog">
                    <div class="section-title">Games</div>
                    <div class="loading">Loading games...</div>
                </div>

            </div>
        `;

        loadGameLog(player);

        const playerSearch  = document.getElementById("playerSearch");
        const searchResults = document.getElementById("searchResults");

        playerSearch.addEventListener("input", () => {
            const value = playerSearch.value.toLowerCase().trim();
            if(!value){ searchResults.style.display = "none"; return; }

            const matches = players
                .filter(p => (p.name || '').toLowerCase().includes(value))
                .slice(0, 8);

            if(!matches.length){ searchResults.style.display = "none"; return; }

            searchResults.innerHTML = matches.map(p => `
                <div class="search-item"
                     onclick="window.location.href='/epl-player.html?player=${encodeURIComponent(playerSlug(p))}'">
                    ${p.name}
                    <small>${(p.teams && p.teams[0]) || ''}</small>
                </div>
            `).join('');

            searchResults.style.display = "block";
        });

        document.addEventListener("click", e => {
            if(!e.target.closest(".search-wrap")) searchResults.style.display = "none";
        });

    }catch(err){
        console.error(err);
        page.innerHTML = `<div class="error">Failed To Load Player Data</div>`;
    }

}

/* ── Individual games ─────────────────────────────────────────────
   /data/epl/player_games/<first two letters>.json  {name: [[season, match_id, date, team,
   opponent, home, gf, ga, G, YC, RC, fpl, mins], ...]} -- built from the
   match files (every season), FPL points/minutes from 2016-17. */
async function loadGameLog(player){
    const box = document.getElementById("gameLog");
    const norm = s => (s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z]/g,"");
    const key = norm(player.name).slice(0, 2);
    let games = [];
    try{
        const r = await fetch(`/data/epl/player_games/${key.length === 2 ? key : "0"}.json`);
        if(r.ok) games = (await r.json())[player.name] || [];
    }catch(e){ games = []; }
    // two different players can share a name -- keep only this player's clubs
    const clubs = new Set(player.teams || []);
    if(clubs.size) {
        const own = games.filter(g => clubs.has(g[3]));
        if(own.length) games = own;
    }
    if(!games.length){
        box.innerHTML = '<div class="section-title">Games</div><div class="loading">No individual games recorded.</div>';
        return;
    }
    const seasons = [...new Set(games.map(g => g[0]))];
    const hasFpl = games.some(g => g[11] !== null && g[11] !== undefined);
    let season = "", shown = 50;

    function draw(){
        const list = season ? games.filter(g => g[0] === season) : games;
        const rows = list.slice(0, shown).map(g => {
            const [s, mid, date, team, opp, home, gf, ga, gl, y, rd, pts, mins] = g;
            const res = (gf == null || ga == null) ? "" : gf > ga ? "W" : gf < ga ? "L" : "D";
            return `<tr class="gl-row" onclick="location.href='/epl-game.html?match=${encodeURIComponent(mid)}&season=${encodeURIComponent(s)}'">
                <td>${date || ""}</td>
                <td>${team}</td>
                <td>${home ? "vs" : "@"} ${opp}</td>
                <td>${res ? `<span class="res ${res}">${res}</span>` : ""}${gf ?? "-"}–${ga ?? "-"}</td>
                <td>${gl || ""}</td><td>${y || ""}</td><td>${rd || ""}</td>
                ${hasFpl ? `<td>${mins ?? "–"}</td><td class="fp">${pts ?? "–"}</td>` : ""}
            </tr>`;
        }).join("");
        box.innerHTML = `
            <div class="section-title">Games</div>
            <div class="gl-controls">
                <select id="glSeason"><option value="">All seasons</option>${seasons.map(x => `<option${x===season?" selected":""}>${x}</option>`).join("")}</select>
                <span class="gl-count">${list.length} game${list.length===1?"":"s"}</span>
            </div>
            <table>
                <thead><tr><th>Date</th><th>Team</th><th>Opponent</th><th>Result</th><th>G</th><th>YC</th><th>RC</th>
                ${hasFpl ? '<th>Mins</th><th class="fp">FPL</th>' : ''}</tr></thead>
                <tbody>${rows}</tbody>
            </table>
            ${list.length > shown ? `<button class="gl-more" id="glMore">Show all ${list.length} games</button>` : ""}`;
        document.getElementById("glSeason").onchange = e => { season = e.target.value; shown = 50; draw(); };
        const more = document.getElementById("glMore");
        if(more) more.onclick = () => { shown = list.length; draw(); };
    }
    draw();
}

loadPlayer();

</script>
