<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rider | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:20px;}
h1{text-align:center;}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{color:#0056d6;text-decoration:none;}

.section{max-width:800px;margin:30px auto;}

h2{border-bottom:2px solid #eee;padding-bottom:6px;}

table{width:100%;border-collapse:collapse;margin-top:10px;}

th{background:#111;color:#fff;padding:10px;}

td{padding:8px;border-bottom:1px solid #ddd;}

tbody tr:nth-child(even){background:#f2f6ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
</div>

<h1 id="name"></h1>

<div class="section">
  <h2>Tour Wins</h2>
  <table>
    <thead><tr><th>Year</th></tr></thead>
    <tbody id="tour"></tbody>
  </table>
</div>

<div class="section">
  <h2>Stage Wins</h2>
  <table>
    <thead><tr><th>Year</th><th>Wins</th></tr></thead>
    <tbody id="stages"></tbody>
  </table>
</div>

<div class="section">
  <h2>Jerseys</h2>
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Green</th>
        <th>Polka</th>
        <th>White</th>
      </tr>
    </thead>
    <tbody id="jerseys"></tbody>
  </table>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const riderName = decodeURIComponent(params.get("name") || "");

document.getElementById("name").textContent = riderName;

function cleanName(name){
  return (name || "").replace(/\(.*?\)/g,"").trim();
}

fetch("/data/cycling/riders.json")
.then(r=>r.json())
.then(data=>{

  const rider = data.filter(r => cleanName(r.Name) === riderName);

  const winners = {};
  data.forEach(r=>{
    const year = r.Year;
    const name = cleanName(r.Name);
    const y = Number(r.Yellow||0);

    if(!winners[year] || y > winners[year].y){
      winners[year] = {name,y};
    }
  });

  const tourBody = document.getElementById("tour");
  const stageBody = document.getElementById("stages");
  const jerseyBody = document.getElementById("jerseys");

  const stageMap = {};

  rider.forEach(r=>{

    const year = r.Year;

    if(winners[year] && winners[year].name === riderName){
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${year}</td>`;
      tourBody.appendChild(tr);
    }

    const wins = Number(r.Wins||0);
    if(wins > 0){
      stageMap[year] = wins;
    }

    if(r.Green || r.PolkaDot || r.White){
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${year}</td>
        <td>${r.Green||0}</td>
        <td>${r.PolkaDot||0}</td>
        <td>${r.White||0}</td>
      `;
      jerseyBody.appendChild(tr);
    }

  });

  Object.entries(stageMap)
    .sort((a,b)=>b[0]-a[0])
    .forEach(([y,w])=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${y}</td><td>${w}</td>`;
      stageBody.appendChild(tr);
    });

});

</script>

</body>
</html>
