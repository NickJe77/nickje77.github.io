<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Rider | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover{opacity:1;color:var(--accent);}

.page{max-width:900px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:36px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:10px;display:block;
}
h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,5vw,38px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

/* ── Section cards ────────────────────────────────────── */
.section{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:20px;overflow:hidden;
}
.section h2{
  margin:0;padding:14px 20px;font-family:var(--display);font-weight:600;font-size:14px;
  letter-spacing:.04em;text-transform:uppercase;background:#f7f9fb;
  border-bottom:1px solid var(--line);color:var(--muted);
}

table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:center;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
td:first-child{text-align:left;font-weight:700;color:var(--ink);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
</div>

<div class="page">

  <div class="hero">
    <span class="eyebrow">Tour de France</span>
    <h1 id="name"></h1>
  </div>

  <div class="section">
    <h2>Tour Wins</h2>
    <table>
      <thead><tr><th>Year</th></tr></thead>
      <tbody id="tour"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Stage Wins</h2>
    <table>
      <thead>
        <tr><th>Year</th><th>Wins</th></tr>
      </thead>
      <tbody id="stages"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Jerseys</h2>
    <table>
      <thead>
        <tr>
          <th>Year</th>
          <th>Green</th>
          <th>Polka</th>
          <th>White</th>
        </tr>
      </thead>
      <tbody id="jerseys"></tbody>
    </table>
  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const riderNameRaw = decodeURIComponent(params.get("name") || "");

// -------------------------
// CLEAN (MATCHING)
// -------------------------
function cleanName(name){
  return (name || "")
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\[.*?\]/g,"")
    .replace(/\(.*?\)/g,"")
    .trim();
}

// -------------------------
// DISPLAY (REMOVE TEAM)
// -------------------------
function displayName(name){
  return (name || "")
    .replace(/\(.*?\)/g,"")
    .trim();
}

// -------------------------
// SLUGIFY (same convention as cycling-leaders.html / cycling-stages.html,
// which link here with a hyphenated slug -- cycling-riders.html instead
// links with the raw display name. Matching on a normalized slug handles
// both formats correctly regardless of which page linked here.)
// -------------------------
function slugify(name){
  return (name || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

const riderSlug = slugify(riderNameRaw);

// -------------------------
// LOAD DATA
// -------------------------
Promise.all([
  fetch("/data/cycling/riders.json").then(r=>r.json()),
  fetch("/data/cycling/tdf_winners.json").then(r=>r.json())
]).then(([data, winners]) => {

  const tourWinsYears = getTourWins(winners);
  buildPage(data, tourWinsYears);

});

// -------------------------
function getTourWins(data){

  const wins = [];

  data.forEach(r => {
    const name = cleanName(r.Cyclist);
    if(slugify(name) === riderSlug){
      wins.push(Number(r.Year));
    }
  });

  return wins;
}

// -------------------------
function buildPage(data, tourWinsYears){

  const rider = data.filter(r => slugify(cleanName(r.Name)) === riderSlug);

  // Show the real name from the matched data (correct casing/accents)
  // rather than whatever format arrived in the URL.
  if(rider.length > 0){
    document.getElementById("name").textContent = displayName(rider[0].Name);
  } else {
    document.getElementById("name").textContent = "Rider not found";
  }

  const tourBody = document.getElementById("tour");
  const stageBody = document.getElementById("stages");
  const jerseyBody = document.getElementById("jerseys");

  const yearly = {};

  rider.forEach(r=>{

    const year = r.Year;
    const wins = Number(r.Wins || 0);

    if(!yearly[year]){
      yearly[year] = {
        wins: 0,
        green: 0,
        polka: 0,
        white: 0
      };
    }

    yearly[year].wins = Math.max(yearly[year].wins, wins);

    yearly[year].green += Number(r.Green || 0);
    yearly[year].polka += Number(r.PolkaDot || 0);
    yearly[year].white += Number(r.White || 0);

  });

  // TOUR WINS
  tourWinsYears
    .sort((a,b)=>b-a)
    .forEach(year=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${year}</td>`;
      tourBody.appendChild(tr);
    });

  // STAGE WINS
  Object.entries(yearly)
    .sort((a,b)=>b[0]-a[0])
    .forEach(([year,y])=>{
      if(y.wins > 0){
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${year}</td>
          <td>${y.wins}</td>
        `;
        stageBody.appendChild(tr);
      }
    });

  // JERSEYS
  Object.entries(yearly)
    .sort((a,b)=>b[0]-a[0])
    .forEach(([year,y])=>{
      if(y.green || y.polka || y.white){
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${year}</td>
          <td>${y.green}</td>
          <td>${y.polka}</td>
          <td>${y.white}</td>
        `;
        jerseyBody.appendChild(tr);
      }
    });

}

</script>

</body>
</html>
