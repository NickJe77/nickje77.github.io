<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rider | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:20px;}
h1{text-align:center;}

.summary{
  text-align:center;
  margin:20px 0;
  font-size:18px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
}

th{
  background:#111;
  color:#fff;
}
</style>
</head>

<body>

<nav class="home-nav">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
</nav>

<h1 id="name">Rider</h1>

<div class="summary" id="summary"></div>

<table>
  <thead>
    <tr>
      <th>Year</th>
      <th>Wins</th>
      <th>Yellow</th>
      <th>Green</th>
      <th>Polka Dot</th>
      <th>White</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function unslug(slug){
  return slug
    .replace(/-/g," ")
    .replace(/\b\w/g, l => l.toUpperCase());
}

const slug = getParam("name");
const riderName = unslug(slug);

document.getElementById("name").textContent = riderName;

let DATA = [];

fetch("data/cycling/riders.json")
  .then(r => r.json())
  .then(data => {
    DATA = data;
    render();
  });

function render(){

  const rows = DATA.filter(d =>
    d.Name.toLowerCase() === riderName.toLowerCase()
  );

  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  let totals = {
    Wins:0, Yellow:0, Green:0, PolkaDot:0, White:0
  };

  rows.forEach(d => {

    totals.Wins += d.Wins;
    totals.Yellow += d.Yellow;
    totals.Green += d.Green;
    totals.PolkaDot += d.PolkaDot;
    totals.White += d.White;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${d.Year}</td>
      <td>${d.Wins}</td>
      <td>${d.Yellow}</td>
      <td>${d.Green}</td>
      <td>${d.PolkaDot}</td>
      <td>${d.White}</td>
    `;

    body.appendChild(tr);
  });

  document.getElementById("summary").innerHTML = `
    Wins: ${totals.Wins} |
    Yellow: ${totals.Yellow} |
    Green: ${totals.Green} |
    Polka Dot: ${totals.PolkaDot} |
    White: ${totals.White}
  `;
}

</script>

</body>
</html>
