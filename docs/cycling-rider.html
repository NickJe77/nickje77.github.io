<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rider | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

/* BASE */
body{
  font-family:system-ui, Arial, sans-serif;
  margin:0;
  padding:20px;
}

/* NAVBAR */
.home-nav{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.home-nav a{
  color:#0056d6;
  text-decoration:none;
  font-size:15px;
}

/* HEADER */
h1{
  text-align:center;
  margin-top:20px;
}

/* SUMMARY */
.summary{
  text-align:center;
  margin:20px 0;
  font-size:18px;
  font-weight:600;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#111;
  color:#fff;
}

tr:hover{
  background:#f5f5f5;
}

</style>
</head>

<body>

<!-- NAV -->
<nav class="home-nav">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
  <a href="./cycling-leaders.html">Leaders</a>
  <a href="./nba.html">NBA</a>
  <a href="./nfl.html">NFL</a>
</nav>

<h1 id="name">Rider</h1>

<div class="summary" id="summary"></div>

<table>
  <thead>
    <tr>
      <th>Year</th>
      <th>Stage Wins</th>
      <th>Yellow</th>
      <th>Green</th>
      <th>Polka Dot</th>
      <th>White</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>

/* GET URL PARAM */
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

/* CONVERT SLUG → NAME */
function unslug(slug){
  if(!slug) return "";
  return slug
    .replace(/-/g," ")
    .replace(/\b\w/g, l => l.toUpperCase());
}

/* SAFE NUMBER */
function num(v){
  return v ? v : 0;
}

const slug = getParam("name");
const riderName = unslug(slug);

document.getElementById("name").textContent = riderName;

let DATA = [];

/* LOAD DATA */
fetch("data/cycling/riders.json")
  .then(r => r.json())
  .then(data => {
    DATA = data;
    render();
  });

/* RENDER PAGE */
function render(){

  const rows = DATA.filter(d =>
    d.Name.toLowerCase() === riderName.toLowerCase()
  );

  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  let totals = {
    Wins:0,
    Yellow:0,
    Green:0,
    PolkaDot:0,
    White:0
  };

  rows.forEach(d => {

    totals.Wins += num(d.Wins);
    totals.Yellow += num(d.Yellow);
    totals.Green += num(d.Green);
    totals.PolkaDot += num(d.PolkaDot);
    totals.White += num(d.White);

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${d.Year}</td>
      <td>${num(d.Wins)}</td>
      <td>${num(d.Yellow)}</td>
      <td>${num(d.Green)}</td>
      <td>${num(d.PolkaDot)}</td>
      <td>${num(d.White)}</td>
    `;

    body.appendChild(tr);
  });

  /* SUMMARY */
  document.getElementById("summary").innerHTML = `
    Wins: ${totals.Wins} |
    Yellow: ${totals.Yellow} |
    Green: ${totals.Green} |
    Polka Dot: ${totals.PolkaDot} |
    White: ${totals.White}
  `;
}

</script>

</body>
</html>
