<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Rider | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui,Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{text-align:center;}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{color:#0056d6;text-decoration:none;}

.section{
  max-width:700px;
  margin:30px auto;
  text-align:center;
}

h2{
  border-bottom:2px solid #eee;
  padding-bottom:6px;
  margin-bottom:15px;
  font-size:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th{
  background:#111;
  color:#fff;
  padding:10px;
  text-align:center;
}

td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:center;
  font-variant-numeric: tabular-nums;
}

td:first-child{text-align:left;}

tbody tr:nth-child(even){background:#f2f6ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
</div>

<h1 id="name"></h1>

<div class="section">
  <h2>Tour Wins</h2>
  <table>
    <thead><tr><th>Year</th></tr></thead>
    <tbody id="tour"></tbody>
  </table>
</div>

<div class="section">
  <h2>Stage Wins</h2>
  <table>
    <thead>
      <tr><th>Year</th><th>Wins</th></tr>
    </thead>
    <tbody id="stages"></tbody>
  </table>
</div>

<div class="section">
  <h2>Jerseys</h2>
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Green</th>
        <th>Polka</th>
        <th>White</th>
      </tr>
    </thead>
    <tbody id="jerseys"></tbody>
  </table>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const riderNameRaw = decodeURIComponent(params.get("name") || "");

// -------------------------
// CLEAN (MATCHING)
// -------------------------
function cleanName(name){
  return (name || "")
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\[.*?\]/g,"")
    .replace(/\(.*?\)/g,"")
    .trim();
}

// -------------------------
// DISPLAY (REMOVE TEAM)
// -------------------------
function displayName(name){
  return (name || "")
    .replace(/\(.*?\)/g,"")
    .trim();
}

const riderName = cleanName(riderNameRaw);
document.getElementById("name").textContent = displayName(riderNameRaw);

// -------------------------
// LOAD DATA
// -------------------------
Promise.all([
  fetch("/data/cycling/riders.json").then(r=>r.json()),
  fetch("/data/cycling/tdf_winners.json").then(r=>r.json())
]).then(([data, winners]) => {

  const tourWinsYears = getTourWins(winners);
  buildPage(data, tourWinsYears);

});

// -------------------------
function getTourWins(data){

  const wins = [];

  data.forEach(r => {
    const name = cleanName(r.Cyclist);
    if(name === riderName){
      wins.push(Number(r.Year));
    }
  });

  return wins;
}

// -------------------------
function buildPage(data, tourWinsYears){

  const rider = data.filter(r => cleanName(r.Name) === riderName);

  const tourBody = document.getElementById("tour");
  const stageBody = document.getElementById("stages");
  const jerseyBody = document.getElementById("jerseys");

  const yearly = {};

  rider.forEach(r=>{

    const year = r.Year;
    const wins = Number(r.Wins || 0);

    if(!yearly[year]){
      yearly[year] = {
        wins: 0,
        green: 0,
        polka: 0,
        white: 0
      };
    }

    yearly[year].wins = Math.max(yearly[year].wins, wins);

    yearly[year].green += Number(r.Green || 0);
    yearly[year].polka += Number(r.PolkaDot || 0);
    yearly[year].white += Number(r.White || 0);

  });

  // TOUR WINS
  tourWinsYears
    .sort((a,b)=>b-a)
    .forEach(year=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${year}</td>`;
      tourBody.appendChild(tr);
    });

  // STAGE WINS
  Object.entries(yearly)
    .sort((a,b)=>b[0]-a[0])
    .forEach(([year,y])=>{
      if(y.wins > 0){
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${year}</td>
          <td>${y.wins}</td>
        `;
        stageBody.appendChild(tr);
      }
    });

  // JERSEYS
  Object.entries(yearly)
    .sort((a,b)=>b[0]-a[0])
    .forEach(([year,y])=>{
      if(y.green || y.polka || y.white){
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${year}</td>
          <td>${y.green}</td>
          <td>${y.polka}</td>
          <td>${y.white}</td>
        `;
        jerseyBody.appendChild(tr);
      }
    });

}

</script>

</body>
</html>
