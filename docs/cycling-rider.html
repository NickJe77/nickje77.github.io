<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rider | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui,Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

/* SECTION (CENTERED WITH TABLE WIDTH) */
.section{
  max-width:700px;
  margin:30px auto;
  text-align:center;
}

/* HEADERS */
h2{
  border-bottom:2px solid #eee;
  padding-bottom:6px;
  margin-bottom:15px;
  font-size:20px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

/* HEADER */
th{
  background:#111;
  color:#fff;
  padding:10px;
  text-align:center;
}

/* CELLS */
td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:center;
  font-variant-numeric: tabular-nums;
}

/* FIRST COLUMN LEFT */
td:first-child{
  text-align:left;
}

/* STRIPING */
tbody tr:nth-child(even){
  background:#f2f6ff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
</div>

<h1 id="name"></h1>

<!-- TOUR WINS -->
<div class="section">
  <h2>Tour Wins</h2>
  <table>
    <thead>
      <tr>
        <th>Year</th>
      </tr>
    </thead>
    <tbody id="tour"></tbody>
  </table>
</div>

<!-- STAGE WINS -->
<div class="section">
  <h2>Stage Wins</h2>
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Wins</th>
      </tr>
    </thead>
    <tbody id="stages"></tbody>
  </table>
</div>

<!-- JERSEYS -->
<div class="section">
  <h2>Jerseys</h2>
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Green</th>
        <th>Polka</th>
        <th>White</th>
      </tr>
    </thead>
    <tbody id="jerseys"></tbody>
  </table>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const riderName = decodeURIComponent(params.get("name") || "");

document.getElementById("name").textContent = riderName;

/* CLEAN NAME */
function cleanName(name){
  return (name || "").replace(/\(.*?\)/g,"").trim();
}

fetch("/data/cycling/riders.json")
.then(r => r.json())
.then(data => {

  const rider = data.filter(r => cleanName(r.Name) === riderName);

  const winners = {};

  data.forEach(r=>{
    const year = r.Year;
    const name = cleanName(r.Name);
    const y = Number(r.Yellow||0);

    if(!winners[year] || y > winners[year].y){
      winners[year] = {name,y};
    }
  });

  const tourBody = document.getElementById("tour");
  const stageBody = document.getElementById("stages");
  const jerseyBody = document.getElementById("jerseys");

  const tourSet = new Set();
  const stageMap = {};

  rider.forEach(r=>{

    const year = r.Year;

    /* TOUR WIN */
    if(winners[year] && winners[year].name === riderName){
      tourSet.add(year);
    }

    /* STAGE WINS */
    const wins = Number(r.Wins||0);
    if(wins > 0){
      stageMap[year] = wins;
    }

    /* JERSEYS */
    if(r.Green || r.PolkaDot || r.White){
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${year}</td>
        <td>${r.Green||0}</td>
        <td>${r.PolkaDot||0}</td>
        <td>${r.White||0}</td>
      `;
      jerseyBody.appendChild(tr);
    }

  });

  /* TOUR WINS (DEDUPED) */
  [...tourSet]
    .sort((a,b)=>b-a)
    .forEach(year=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${year}</td>`;
      tourBody.appendChild(tr);
    });

  /* STAGE WINS */
  Object.entries(stageMap)
    .sort((a,b)=>b[0]-a[0])
    .forEach(([year,wins])=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${year}</td>
        <td>${wins}</td>
      `;
      stageBody.appendChild(tr);
    });

});

</script>

</body>
</html>
