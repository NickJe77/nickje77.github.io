<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>World Club Challenge Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c1118;
  --board-2:#141c26;
  --board-line:rgba(255,255,255,.10);
  --win:#ffffff;
  --lose:rgba(255,255,255,.42);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

.page{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

/* ── Scorebug ─────────────────────────────────────────── */
.scorebug{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;
}
.scorebug .eyebrow{
  text-align:center;font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);
  padding:18px 16px 0;
}
.bug-grid{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:10px;padding:14px 30px 30px;
}
.bug-team{display:flex;align-items:center;gap:16px;min-width:0;}
.bug-team.home{justify-content:flex-end;text-align:right;}
.bug-team.away{justify-content:flex-start;text-align:left;}
.bug-team .tname{
  font-family:var(--display);font-weight:600;font-size:clamp(18px,3vw,30px);
  line-height:1.04;letter-spacing:.01em;text-transform:uppercase;
}
.bug-team .tsub{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;letter-spacing:.04em;}
.crest{width:8px;align-self:stretch;min-height:54px;border-radius:6px;flex:0 0 auto;}
.bug-score{
  display:flex;align-items:center;gap:14px;font-family:var(--display);font-weight:600;
  font-size:clamp(40px,9vw,72px);line-height:1;letter-spacing:.01em;
}
.bug-score .sc{font-variant-numeric:tabular-nums;}
.bug-score .sc.lose{color:var(--lose);font-weight:500;}
.bug-score .dash{color:rgba(255,255,255,.3);font-weight:400;}
.ft-badge{
  position:absolute;top:16px;right:18px;font-family:var(--body);font-size:10.5px;
  font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.85);
  border:1px solid var(--board-line);border-radius:999px;padding:4px 10px;
}

/* ── Controls ─────────────────────────────────────────── */
.segment{
  display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px;gap:2px;margin-bottom:8px;max-width:100%;
  overflow-x:auto;scrollbar-width:none;
}
.segment::-webkit-scrollbar{display:none;}
.seg-btn{
  border:none;background:transparent;font-family:var(--body);font-size:13px;font-weight:600;
  color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s;
}
.seg-btn:hover{color:var(--ink);}
.seg-btn.active{background:var(--ink);color:#fff;}
.era-note{
  font-size:12.5px;color:var(--muted);margin:10px 2px 0;display:flex;align-items:center;gap:8px;
}
.era-note .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:0 0 auto;}

/* ── Team tables ──────────────────────────────────────── */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px;}
.team-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
.team-head{
  display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line);
}
.team-head .swatch{width:14px;height:14px;border-radius:4px;flex:0 0 auto;}
.team-head h2{
  margin:0;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em;
  text-transform:uppercase;
}
.team-head .tally{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;}
thead th{
  position:sticky;top:0;background:#f7f9fb;font-family:var(--body);font-weight:600;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  text-align:right;cursor:pointer;user-select:none;
}
thead th:first-child{text-align:left;}
thead th:hover{color:var(--ink);}
thead th.sorted::after{content:" ↓";color:var(--faint);}
thead th.sorted.asc::after{content:" ↑";}
td{text-align:right;font-variant-numeric:tabular-nums;color:#27313c;}
td:first-child{text-align:left;}
th:first-child,td:first-child{
  position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600;
}
thead th:first-child{background:#f7f9fb;z-index:2;}
tbody tr:hover td{background:#f0f6ff;}
tbody tr:hover td:first-child{background:#f0f6ff;}
.player-link{text-decoration:none;color:var(--ink);}
.player-link:hover{color:#0056d6;text-decoration:underline;}
.jersey{display:inline-block;min-width:20px;color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px;margin-right:8px;}
td.lead{color:var(--ink);font-weight:700;}

.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;}

@media(max-width:820px){
  .teams{grid-template-columns:1fr;}
  .bug-grid{grid-template-columns:1fr;gap:18px;padding:10px 18px 26px;}
  .bug-team.home,.bug-team.away{justify-content:center;text-align:center;}
  .bug-team.home{flex-direction:row;}
  .crest{min-height:30px;}
}
</style>
</head>
<body>
<nav class="navbar">
<a href="/">Home</a>
<a href="/rugby-league.html">Rugby League</a>
<a href="/wcc.html">World Club Challenge</a>
</nav>

<div class="page">
  <div id="content">
    <div class="loading">Loading match…</div>
  </div>
</div>

<script>

const params = new URLSearchParams(location.search);
const yearQ = params.get("year") || "";
const matchQ = params.get("match") || "";

if(!yearQ || !matchQ){
  document.getElementById("content").innerHTML = `<div class="loading">Match not found.</div>`;
  throw new Error("Missing year or match param");
}

fetch("data/world-club-challenge/results.json")
.then(r => r.ok ? r.json() : [])
.catch(() => [])
.then(matches => {
  const m = matches.find(x => x.year === yearQ && String(x.match_id) === String(matchQ));
  render(m);
});

function buildPlayerRows(side){
  const rows = {};
  const add = (list, key) => {
    (list || []).forEach(e => {
      if(!rows[e.player]) rows[e.player] = { name: e.player, tries: 0, goals: 0, field_goals: 0 };
      rows[e.player][key] += e.count;
    });
  };
  add(side?.tries, "tries");
  add(side?.goals, "goals");
  add(side?.field_goals, "field_goals");

  return Object.values(rows).map(r => ({
    ...r,
    // Try/goal/field-goal point values have been consistent across
    // both the NRL and Super League eras this competition has drawn
    // from throughout its entire 1976-present history, so no
    // year-conditional logic is needed here.
    points: r.tries*4 + r.goals*2 + r.field_goals*1,
  })).sort((a,b) => b.points - a.points);
}

function render(m){
  const content = document.getElementById("content");

  if(!m){
    content.innerHTML = `<div class="loading">Match not found.</div>`;
    return;
  }

  const team1 = m.home_team.name;
  const team2 = m.away_team.name;
  document.title = `${team1} vs ${team2} ${yearQ} | The Sporting Almanac`;

  const hWin = m.home_score > m.away_score, aWin = m.away_score > m.home_score;
  const refs = (m.referees || []).map(r => r.name).join(", ");
  const eyebrow = [m.date, m.venue?.name].filter(Boolean).join("  ·  ");

  const homeRows = buildPlayerRows(m.home_scorers);
  const awayRows = buildPlayerRows(m.away_scorers);

  const renderTable = (rows) => {
    if(!rows.length) return `<div class="table-wrap" style="padding:16px;color:var(--muted);font-size:13px;">No scorer data available.</div>`;
    return `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Player</th><th>T</th><th>G</th><th>FG</th><th>Pts</th></tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${r.name}</td>
                <td>${r.tries}</td>
                <td>${r.goals}</td>
                <td>${r.field_goals}</td>
                <td class="lead">${r.points}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>`;
  };

  content.innerHTML = `
    <div class="scorebug">
      <span class="ft-badge">FULL TIME</span>
      <div class="eyebrow">${yearQ} World Club Challenge &middot; ${eyebrow}</div>
      <div class="bug-grid">
        <div class="bug-team home">
          <div>
            <div class="tname">${team1}</div>
          </div>
        </div>
        <div class="bug-score">
          <span class="sc ${hWin ? "" : "lose"}">${m.home_score}</span>
          <span class="dash">–</span>
          <span class="sc ${aWin ? "" : "lose"}">${m.away_score}</span>
        </div>
        <div class="bug-team away">
          <div>
            <div class="tname">${team2}</div>
            <div class="tsub">${refs ? "Referee: " + refs : ""}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="teams">
      <div class="team-card">
        <div class="team-head"><h2>${team1}</h2><span class="tally">${homeRows.length} scorers</span></div>
        ${renderTable(homeRows)}
      </div>
      <div class="team-card">
        <div class="team-head"><h2>${team2}</h2><span class="tally">${awayRows.length} scorers</span></div>
        ${renderTable(awayRows)}
      </div>
    </div>
  `;
}

</script>
</body>
</html>
