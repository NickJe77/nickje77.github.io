<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Players | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page{max-width:900px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:32px 34px;border-radius:var(--radius);margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,40px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.search{
  width:100%;padding:12px 18px;font-family:var(--body);font-size:14px;font-weight:600;
  border-radius:999px;border:1px solid var(--board-line,rgba(255,255,255,.15));
  margin-top:18px;background:rgba(255,255,255,.08);color:#fff;
}
.search::placeholder{color:rgba(255,255,255,.55);}
.search:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.12);}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
.player{
  padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;
  font-size:14px;font-weight:600;color:var(--ink);transition:background .12s,color .12s;
}
.player:last-child{border-bottom:none;}
.player:hover{background:var(--accent-soft);color:var(--accent);}

.empty{padding:26px;text-align:center;font-size:14px;font-weight:600;color:var(--muted);}
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-players.html" aria-current="page">Players</a>
  <a href="baseball-standings.html">Standings</a>
  <a href="baseball-leaders.html">Leaders</a>
</nav>

<div class="page">
<div class="hero">
<div class="eyebrow">Baseball</div>
<h1>Players</h1>
<input
type="text"
id="search"
class="search"
placeholder="Search player..."
oninput="filterPlayers()"
/>
</div>
<div class="card" id="playersList">
<div class="empty">Loading players...</div>
</div>
</div>
<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
let ALL_PLAYERS=[];
async function loadPlayers(){
const data = await fetch(`${R2}/baseball/players.json`)
.then(r=>r.json());
ALL_PLAYERS = data.sort((a,b)=>
a.name.localeCompare(b.name)
);
renderPlayers(ALL_PLAYERS);
}
function renderPlayers(list){
playersList.innerHTML="";
if(!list.length){
  playersList.innerHTML = '<div class="empty">No players found.</div>';
  return;
}
list.forEach(p=>{
const div=document.createElement("div");
div.className="player";
div.textContent = p.name;
div.onclick=()=>{
location.href=
`baseball-player.html?player=${p.player_id}`;
};
playersList.appendChild(div);
});
}
function filterPlayers(){
const q=search.value.toLowerCase();
const filtered=ALL_PLAYERS.filter(p=>
p.name.toLowerCase().includes(q)
);
renderPlayers(filtered);
}
loadPlayers();
</script>
</body>
</html>
