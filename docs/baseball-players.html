<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Players | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:900px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:40px;
}

.search{
width:100%;
padding:12px;
font-size:18px;
border-radius:10px;
border:none;
margin-top:12px;
}

.card{
background:white;
padding:16px;
border-radius:14px;
}

.player{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
font-weight:600;
}

.player:hover{
background:#eaf3ff;
color:#0056d6;
}

.team{
font-size:13px;
color:#777;
margin-left:8px;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">

<h1>Players</h1>

<input
type="text"
id="search"
class="search"
placeholder="Search player..."
oninput="filterPlayers()"
/>

</div>

<div class="card" id="playersList">
Loading players...
</div>

</div>

<script>

let ALL_PLAYERS=[];

async function loadPlayers(){

const data = await fetch(
"data/baseball/players.json"
).then(r=>r.json());

/* convert objects to usable format */

ALL_PLAYERS = data.map(p=>({

name: p.player,
team: p.team

}));

/* remove duplicates */

const unique = {};

ALL_PLAYERS.forEach(p=>{
unique[p.name]=p;
});

ALL_PLAYERS = Object.values(unique);

/* sort */

ALL_PLAYERS.sort((a,b)=>
a.name.localeCompare(b.name)
);

renderPlayers(ALL_PLAYERS);

}

function renderPlayers(list){

playersList.innerHTML="";

list.forEach(p=>{

const div=document.createElement("div");

div.className="player";

div.innerHTML=`
${p.name}
<span class="team">${p.team}</span>
`;

div.onclick=()=>{

location.href=
`baseball-player.html?player=${encodeURIComponent(p.name)}`;

};

playersList.appendChild(div);

});

}

function filterPlayers(){

const q=search.value.toLowerCase();

const filtered=ALL_PLAYERS.filter(p=>
p.name.toLowerCase().includes(q)
);

renderPlayers(filtered);

}

loadPlayers();

</script>

</body>
</html>
