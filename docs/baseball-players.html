<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1000px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
margin:0;
font-size:42px;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 2px 6px rgba(0,0,0,.05);
}

.back{
display:inline-block;
margin-bottom:14px;
text-decoration:none;
color:#0056d6;
font-weight:600;
}
.back:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="page">

<a href="baseball-players.html" class="back">← Back to Players</a>

<div id="content">
Loading player...
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const playerId = params.get("player");

if(!playerId){
document.getElementById("content").innerHTML="<h1>Player not found</h1>";
throw new Error("Missing player id");
}

init();

async function init(){

try{

const res = await fetch("data/baseball/players.json");
const players = await res.json();

const player = players.find(p => p.player_id === playerId);

if(!player){
document.getElementById("content").innerHTML="<h1>Player not found</h1>";
return;
}

renderPlayer(player);

}catch(err){
console.error(err);
document.getElementById("content").innerHTML="<h1>Error loading player</h1>";
}

}

function renderPlayer(player){

document.getElementById("content").innerHTML = `

<div class="hero">
<h1>${player.name}</h1>
</div>

<div class="card">
<p><strong>Player ID:</strong> ${player.player_id}</p>
<p><strong>First:</strong> ${player.first}</p>
<p><strong>Last:</strong> ${player.last}</p>
</div>

`;

}

</script>

</body>
</html>
