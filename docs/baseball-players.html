<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Players | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:900px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:40px;
}

.searchBox{
width:100%;
padding:12px;
font-size:18px;
border-radius:10px;
border:none;
margin-top:12px;
}

.card{
background:white;
padding:16px;
border-radius:14px;
}

.player{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
font-weight:600;
}

.player:hover{
background:#eaf3ff;
color:#0056d6;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">

<h1>Players</h1>

<input
type="text"
id="search"
class="searchBox"
placeholder="Search player..."
oninput="filterPlayers()"
/>

</div>

<div class="card" id="playersList">

Loading players...

</div>

</div>

<script>

let ALL_PLAYERS=[];
let FILTERED=[];

/* LOAD PLAYERS */

async function loadPlayers(){

/* try cached first */

const cached=localStorage.getItem("mlb_players");

if(cached){

ALL_PLAYERS=JSON.parse(cached);

renderPlayers();

return;

}

/* build from latest season */

const seasons=await fetch("data/baseball/index.json")
.then(r=>r.json());

const latest=seasons.sort((a,b)=>b-a)[0];

const games=await fetch(
`data/baseball/seasons/${latest}.json`
).then(r=>r.json());

const players=new Set();

/* load boxscores fast */

const boxes=await Promise.all(

games.map(g=>
fetch(`data/baseball/boxscores/${g.date}_${g.away_code}_${g.home_code}.json`)
.then(r=>r.json())
)

);

boxes.forEach(box=>{

(box.batting||[]).forEach(p=>players.add(p.player));

(box.pitching||[]).forEach(p=>players.add(p.player));

});

ALL_PLAYERS=[...players].sort();

/* cache */

localStorage.setItem(
"mlb_players",
JSON.stringify(ALL_PLAYERS)
);

renderPlayers();

}

/* RENDER */

function renderPlayers(){

FILTERED=ALL_PLAYERS;

const list=document.getElementById("playersList");

list.innerHTML="";

FILTERED.forEach(p=>{

const div=document.createElement("div");

div.className="player";

div.textContent=p;

div.onclick=()=>
location.href=
`baseball-player.html?player=${encodeURIComponent(p)}`;

list.appendChild(div);

});

}

/* SEARCH */

function filterPlayers(){

const q=search.value.toLowerCase();

FILTERED=ALL_PLAYERS.filter(p=>
p.toLowerCase().includes(q)
);

const list=document.getElementById("playersList");

list.innerHTML="";

FILTERED.forEach(p=>{

const div=document.createElement("div");

div.className="player";

div.textContent=p;

div.onclick=()=>
location.href=
`baseball-player.html?player=${encodeURIComponent(p)}`;

list.appendChild(div);

});

}

loadPlayers();

</script>

</body>
</html>
