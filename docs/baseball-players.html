<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1000px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
margin:0;
font-size:42px;
}

.team{
margin-top:6px;
font-size:18px;
opacity:.9;
}

.card{
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 2px 6px rgba(0,0,0,.05);
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#002D72;
color:white;
}

.back{
display:inline-block;
margin-bottom:14px;
text-decoration:none;
color:#0056d6;
font-weight:600;
}
.back:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="page">

<a href="baseball-players.html" class="back">← Back to Players</a>

<div id="content">
Loading player...
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const playerName = params.get("player");

if(!playerName){
document.getElementById("content").innerHTML="<h1>Player not found</h1>";
throw new Error("No player parameter provided");
}

init();

async function init(){

try{

const decodedName = decodeURIComponent(playerName);

// Load teams
const teamsRes = await fetch("data/baseball/teams.json");
const franchises = await teamsRes.json();

let TEAM_MAP = {};
franchises.forEach(franchise=>{
franchise.codes.forEach(code=>{
TEAM_MAP[code] = franchise.name;
});
});

// Load players
const playersRes = await fetch("data/baseball/players.json");
const players = await playersRes.json();

const player = players.find(p => p.player === decodedName);

if(!player){
document.getElementById("content").innerHTML="<h1>Player not found</h1>";
return;
}

renderPlayer(player, TEAM_MAP);

}catch(err){
console.error(err);
document.getElementById("content").innerHTML="<h1>Error loading player</h1>";
}

}

function renderPlayer(player, TEAM_MAP){

const teamName = TEAM_MAP[player.team] || player.team || "N/A";

document.getElementById("content").innerHTML = `

<div class="hero">
<h1>${player.player}</h1>
<div class="team">${teamName}</div>
</div>

<div class="card">

<table>
<tr><th>Stat</th><th>Value</th></tr>

<tr><td>Games</td><td>${player.games ?? "-"}</td></tr>
<tr><td>At Bats</td><td>${player.at_bats ?? "-"}</td></tr>
<tr><td>Runs</td><td>${player.runs ?? "-"}</td></tr>
<tr><td>Hits</td><td>${player.hits ?? "-"}</td></tr>
<tr><td>Home Runs</td><td>${player.home_runs ?? "-"}</td></tr>
<tr><td>RBIs</td><td>${player.rbis ?? "-"}</td></tr>
<tr><td>Batting Average</td><td>${player.batting_average ?? "-"}</td></tr>

</table>

</div>

`;

}

</script>

</body>
</html>
