<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tennis Event | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{
    --green:#1b5e20;
    --green-2:#2e7d32;
    --green-3:#43a047;
    --bg:#f5f7f5;
    --card:#ffffff;
    --border:#d9e2d9;
    --text:#172117;
    --muted:#5f6b5f;
    --shadow:0 10px 30px rgba(0,0,0,.08);
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:linear-gradient(180deg,#f7faf7 0%,#eef5ef 100%);
    color:var(--text);
  }

  .navbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:18px;
    padding:16px 20px;
    background:#fff;
    border-bottom:1px solid #e3e8e3;
    position:sticky;
    top:0;
    z-index:50;
  }

  .navbar a{
    color:#1e4ed8;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
  }

  .navbar a.active{
    color:var(--green);
  }

  .hero{
    background:linear-gradient(90deg,#1b5e20,#2e7d32,#43a047);
    color:#fff;
    padding:44px 20px 34px;
    text-align:center;
    box-shadow:var(--shadow);
  }

  .hero h1{
    margin:0;
    font-size:clamp(30px,5vw,50px);
    line-height:1.08;
  }

  .hero p{
    margin:10px auto 0;
    max-width:820px;
    font-size:16px;
    line-height:1.6;
    opacity:.96;
  }

  .container{
    max-width:1100px;
    margin:0 auto;
    padding:24px 16px 44px;
  }

  .top-links{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
  }

  .back{
    display:inline-block;
    text-decoration:none;
    font-weight:800;
    color:var(--green);
    background:#fff;
    border:1px solid var(--border);
    border-radius:999px;
    padding:10px 14px;
    box-shadow:var(--shadow);
  }

  .status{
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
    font-weight:700;
  }

  .status.error{
    border-color:#f1c0c0;
    background:#fff7f7;
    color:#8a1f1f;
  }

  .card{
    background:#fff;
    border-radius:18px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
  }

  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:14px;
  }

  .pill{
    display:inline-flex;
    align-items:center;
    padding:7px 11px;
    border-radius:999px;
    background:#e9f5ea;
    color:#1f5d25;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.04em;
  }

  .headline{
    margin:0 0 14px;
    font-size:30px;
    font-weight:900;
    line-height:1.1;
    color:#123814;
  }

  .winner-box{
    margin:0 0 18px;
    font-size:22px;
    font-weight:900;
  }

  .winner-box span{
    color:var(--muted);
    font-weight:800;
    margin-right:6px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
  }

  .detail{
    background:#f8fbf8;
    border:1px solid #e3ece3;
    border-radius:14px;
    padding:14px;
  }

  .label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:800;
    letter-spacing:.08em;
    margin-bottom:6px;
  }

  .value{
    font-size:18px;
    font-weight:800;
    word-break:break-word;
  }

  .empty{
    background:#fff;
    border:1px dashed #bfd0bf;
    border-radius:18px;
    padding:36px 18px;
    text-align:center;
    color:var(--muted);
    font-weight:700;
    box-shadow:var(--shadow);
  }

  @media (max-width: 760px){
    .grid{
      grid-template-columns:1fr;
    }
    .headline{
      font-size:24px;
    }
    .winner-box{
      font-size:20px;
    }
  }
</style>
</head>

<body>

<nav class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nfl.html">NFL</a>
  <a href="./olympics.html">Olympics</a>
  <a href="./tennis.html" class="active">Tennis</a>
</nav>

<header class="hero">
  <h1 id="eventName">Loading...</h1>
  <p id="heroSub">Loading event details...</p>
</header>

<div class="container">
  <div class="top-links">
    <a id="backLink" class="back" href="./tennis.html">← Back to Tennis</a>
    <a id="slamLink" class="back" href="./tennis.html" style="display:none;"></a>
  </div>

  <div id="status" class="status">Loading event...</div>

  <div id="content"></div>
</div>

<script>
  function getParam(name){
    return new URLSearchParams(window.location.search).get(name);
  }

  const year = getParam('year');
  const eventNameParam = decodeURIComponent(getParam('event') || '');

  const backLink = document.getElementById('backLink');
  const slamLink = document.getElementById('slamLink');
  const statusBox = document.getElementById('status');
  const content = document.getElementById('content');
  const eventNameEl = document.getElementById('eventName');
  const heroSubEl = document.getElementById('heroSub');

  if (year) {
    backLink.href = `./tennis.html?year=${encodeURIComponent(year)}`;
  }

  function text(v){
    if (v === null || v === undefined) return '';
    if (typeof v === 'string') return v.trim();
    if (typeof v === 'number') return String(v);
    return '';
  }

  function pick(obj, keys){
    if (!obj || typeof obj !== 'object') return '';
    for (const key of keys){
      if (obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== ''){
        return obj[key];
      }
    }
    return '';
  }

  function normaliseSurface(surface){
    const s = text(surface).toLowerCase();
    if (!s) return '';
    if (s.includes('hard')) return 'Hard';
    if (s.includes('clay')) return 'Clay';
    if (s.includes('grass')) return 'Grass';
    if (s.includes('carpet')) return 'Carpet';
    if (s.includes('indoor')) return 'Indoor';
    return text(surface);
  }

  function slugify(str){
    return text(str)
      .normalize('NFKD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  function objectToEvent(item, fallbackYear){
    if (!item || typeof item !== 'object') return null;

    const name = text(
      pick(item, [
        'event','event_name','name','tournament','tournament_name','competition',
        'title','Event','Tournament'
      ])
    );

    const winner = text(
      pick(item, [
        'winner','champion','singles_winner','mens_singles_winner','ladies_singles_winner',
        'winner_name','Champion'
      ])
    );

    const runnerUp = text(
      pick(item, [
        'runner_up','finalist','runnerup','runner','loser','opponent',
        'singles_runner_up','RunnerUp'
      ])
    );

    const surface = normaliseSurface(
      pick(item, ['surface','court_surface','Surface'])
    );

    const location = text(
      pick(item, ['location','venue','city','country','host','Location'])
    );

    const score = text(
      pick(item, ['score','final_score','championship_score','result','Score'])
    );

    const draw = text(
      pick(item, ['draw','draw_size'])
    );

    const category = text(
      pick(item, ['category','event_type','type','tour','level'])
    );

    const startDate = text(
      pick(item, ['start_date','date_start','start','from_date'])
    );

    const endDate = text(
      pick(item, ['end_date','date_end','end','to_date','date'])
    );

    const seasonYear = text(pick(item, ['year','season'])) || String(fallbackYear);

    if (!name && !winner && !runnerUp) return null;

    return {
      name: name || 'Unnamed Event',
      winner,
      runnerUp,
      surface,
      location,
      score,
      draw,
      category,
      start_date: startDate,
      end_date: endDate,
      date: endDate || startDate,
      year: seasonYear,
      slug: slugify(name || 'Unnamed Event')
    };
  }

  function extractEvents(data, year){
    if (Array.isArray(data)){
      return data.map(item => objectToEvent(item, year)).filter(Boolean);
    }

    if (data && typeof data === 'object'){
      const directKeys = [
        'events','tournaments','results','data','items','rows','competitions'
      ];

      for (const key of directKeys){
        if (Array.isArray(data[key])){
          return data[key].map(item => objectToEvent(item, year)).filter(Boolean);
        }
      }

      const values = Object.values(data);
      for (const val of values){
        if (Array.isArray(val)){
          const mapped = val.map(item => objectToEvent(item, year)).filter(Boolean);
          if (mapped.length) return mapped;
        }
      }

      const single = objectToEvent(data, year);
      if (single) return [single];
    }

    return [];
  }

  function setStatus(message, isError = false){
    statusBox.textContent = message;
    statusBox.className = isError ? 'status error' : 'status';
  }

  function escapeHtml(value){
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function detectSlam(name){
    const n = text(name).toLowerCase();
    if (n.includes('australian open')) return 'Australian Open';
    if (n.includes('french open') || n.includes('roland garros')) return 'French Open';
    if (n.includes('wimbledon')) return 'Wimbledon';
    if (n.includes('us open')) return 'US Open';
    return '';
  }

  function renderEvent(event){
    const slamName = detectSlam(event.name);

    eventNameEl.textContent = event.name;
    heroSubEl.textContent = `${event.year || '-'} • ${event.location || 'Location unknown'}${event.surface ? ' • ' + event.surface : ''}`;

    if (slamName){
      slamLink.style.display = 'inline-block';
      slamLink.textContent = `${slamName} History`;
      slamLink.href = `./tennis-slam.html?slam=${encodeURIComponent(slamName)}`;
    }

    content.innerHTML = `
      <div class="card">
        <div class="pills">
          ${event.year ? `<span class="pill">${escapeHtml(event.year)}</span>` : ''}
          ${event.surface ? `<span class="pill">${escapeHtml(event.surface)}</span>` : ''}
          ${event.category ? `<span class="pill">${escapeHtml(event.category)}</span>` : ''}
        </div>

        <h2 class="headline">${escapeHtml(event.name)}</h2>

        <div class="winner-box">
          <span>Winner:</span>${escapeHtml(event.winner || 'Unknown')}
        </div>

        <div class="grid">
          <div class="detail">
            <span class="label">Runner-Up</span>
            <div class="value">${escapeHtml(event.runnerUp || '-')}</div>
          </div>

          <div class="detail">
            <span class="label">Final Score</span>
            <div class="value">${escapeHtml(event.score || '-')}</div>
          </div>

          <div class="detail">
            <span class="label">Surface</span>
            <div class="value">${escapeHtml(event.surface || '-')}</div>
          </div>

          <div class="detail">
            <span class="label">Location</span>
            <div class="value">${escapeHtml(event.location || '-')}</div>
          </div>

          <div class="detail">
            <span class="label">Start Date</span>
            <div class="value">${escapeHtml(event.start_date || '-')}</div>
          </div>

          <div class="detail">
            <span class="label">End Date</span>
            <div class="value">${escapeHtml(event.end_date || event.date || '-')}</div>
          </div>

          <div class="detail">
            <span class="label">Draw</span>
            <div class="value">${escapeHtml(event.draw || '-')}</div>
          </div>

          <div class="detail">
            <span class="label">Category</span>
            <div class="value">${escapeHtml(event.category || '-')}</div>
          </div>
        </div>
      </div>
    `;
  }

  async function loadEvent(){
    if (!year || !eventNameParam){
      eventNameEl.textContent = 'Event Not Found';
      heroSubEl.textContent = 'Missing year or event in URL.';
      content.innerHTML = `<div class="empty">Missing event details in the URL.</div>`;
      setStatus('Missing event details.', true);
      return;
    }

    setStatus(`Loading ${eventNameParam} (${year})...`);

    try{
      const res = await fetch(`./data/tennis/events/${year}.json?ts=${Date.now()}`);
      if (!res.ok) throw new Error('Year file not found');

      const data = await res.json();
      const events = extractEvents(data, year);

      const match = events.find(e =>
        e.name.toLowerCase() === eventNameParam.toLowerCase()
      ) || events.find(e =>
        slugify(e.name) === slugify(eventNameParam)
      );

      if (!match){
        eventNameEl.textContent = 'Event Not Found';
        heroSubEl.textContent = `${year}`;
        content.innerHTML = `<div class="empty">No event matched "${escapeHtml(eventNameParam)}" in ${escapeHtml(year)}.</div>`;
        setStatus(`Could not find ${eventNameParam} in ${year}.`, true);
        return;
      }

      renderEvent(match);
      setStatus(`Loaded ${match.name} (${year}).`);
    } catch (err){
      eventNameEl.textContent = 'Error Loading Event';
      heroSubEl.textContent = `${year || ''}`;
      content.innerHTML = `<div class="empty">Could not load event data.</div>`;
      setStatus(`Could not load ./data/tennis/events/${year}.json`, true);
    }
  }

  loadEvent();
</script>

</body>
</html>
