<!DOCTYPE html>

<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tournament | Tennis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:20px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;flex-wrap:wrap;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover{opacity:1;color:var(--accent);}

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));color:#fff;
  padding:36px 20px;text-align:center;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;
}

.wrap{max-width:1100px;margin:auto;padding:26px 20px 70px;}
.toggle-row{display:flex;justify-content:center;gap:8px;margin-bottom:22px;}
button{
  padding:10px 22px;border:1px solid var(--line);border-radius:999px;cursor:pointer;
  background:var(--surface);color:var(--ink);font-family:var(--body);font-weight:600;
  font-size:13.5px;transition:.15s;
}
button:hover{border-color:var(--faint);}
button.active{background:var(--board);border-color:var(--board);color:#fff;}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;font-size:13.5px;}
th{
  background:#f7f9fb;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.04em;font-family:var(--body);
}
td{color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.player{color:var(--ink);font-weight:700;cursor:pointer;}
.player:hover{color:var(--accent);}
</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
<a href="nba.html">NBA</a>
<a href="nhl.html">NHL</a>
<a href="ufc.html">UFC</a>
<a href="nfl.html">NFL</a>
<a href="tennis.html">Tennis</a>
</div>

<div class="hero">
<h1 id="title"></h1>
</div>

<div class="wrap">

<div class="toggle-row">
<button id="btnM" onclick="setGender('M')" class="active">Men</button>
<button id="btnW" onclick="setGender('W')">Women</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Round</th>
<th>Player 1</th>
<th>Player 2</th>
<th>Score</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const year = params.get("year");
const event = params.get("event");

document.getElementById("title").textContent = `${event} (${year})`;

let matches = [];
let currentGender = "M";

async function load(){

  const res = await fetch(`data/tennis/matches/${year}.json`);
  const data = await res.json();

  matches = data.filter(m => m.tournament === event);

  render();
}

function setGender(g){
  currentGender = g;
  document.getElementById("btnM").classList.toggle("active", g === "M");
  document.getElementById("btnW").classList.toggle("active", g === "W");
  render();
}

function render(){

  const tbody = document.getElementById("tbody");

  const filtered = matches.filter(m => m.gender === currentGender);

  // sort by round order
  const order = ["R128","R64","R32","R16","QF","SF","F"];

  filtered.sort((a,b)=>order.indexOf(a.round) - order.indexOf(b.round));

  tbody.innerHTML = filtered.map(m=>`
    <tr>
      <td>${m.round}</td>
      <td class="player" onclick="goPlayer('${m.player1}')">${m.player1}</td>
      <td class="player" onclick="goPlayer('${m.player2}')">${m.player2}</td>
      <td>${m.score}</td>
    </tr>
  `).join("");
}

function goPlayer(name){
  window.location = `tennis-player.html?player=${encodeURIComponent(name)}`;
}

load();

</script>

</body>
</html>
