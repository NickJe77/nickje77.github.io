<!DOCTYPE html>

<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tournament | Tennis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui;margin:0;background:#f5f5f5;}
.wrap{max-width:1100px;margin:auto;padding:20px;}
button{padding:10px 15px;margin:5px;border:none;border-radius:8px;cursor:pointer;background:#1e4ed8;color:#fff;}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:20px;}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:center;}
.player{color:#1e4ed8;cursor:pointer;}
</style>

</head>

<body>

<div class="wrap">

<h1 id="title"></h1>

<div>
<button onclick="setGender('M')">Men</button>
<button onclick="setGender('W')">Women</button>
</div>

<table>
<thead>
<tr>
<th>Round</th>
<th>Player 1</th>
<th>Player 2</th>
<th>Score</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const year = params.get("year");
const event = params.get("event");

document.getElementById("title").textContent = `${event} (${year})`;

let matches = [];
let currentGender = "M";

async function load(){

  const res = await fetch(`data/tennis/matches/${year}.json`);
  const data = await res.json();

  matches = data.filter(m => m.tournament === event);

  render();
}

function setGender(g){
  currentGender = g;
  render();
}

function render(){

  const tbody = document.getElementById("tbody");

  const filtered = matches.filter(m => m.gender === currentGender);

  // sort by round order
  const order = ["R128","R64","R32","R16","QF","SF","F"];

  filtered.sort((a,b)=>order.indexOf(a.round) - order.indexOf(b.round));

  tbody.innerHTML = filtered.map(m=>`
    <tr>
      <td>${m.round}</td>
      <td class="player" onclick="goPlayer('${m.player1}')">${m.player1}</td>
      <td class="player" onclick="goPlayer('${m.player2}')">${m.player2}</td>
      <td>${m.score}</td>
    </tr>
  `).join("");
}

function goPlayer(name){
  window.location = `tennis-player.html?player=${encodeURIComponent(name)}`;
}

load();

</script>

</body>
</html>
