<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Olympic Events | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:system-ui,Arial,sans-serif;
    margin:0;
    background:#f5f5f5;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:#111;
}
.navbar a{
    color:white;
    text-decoration:none;
    font-weight:600;
}

.hero{
    background:linear-gradient(90deg,#0085C7,#F4C300,#000,#009F3D,#DF0024);
    color:white;
    text-align:center;
    padding:30px;
}

.container{
    max-width:1100px;
    margin:20px auto;
    padding:10px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

select,input{
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:12px;
    cursor:pointer;
}

.card:hover{
    background:#f0f0f0;
}

.medals{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:10px;
}

.medal{
    background:#f2f2f2;
    padding:10px;
    border-radius:6px;
}

.gold{border-left:5px solid gold;}
.silver{border-left:5px solid silver;}
.bronze{border-left:5px solid #cd7f32;}
</style>
</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/olympics.html">Olympics</a>
<a href="/olympics-medals.html">Medal Table</a>
<a href="/olympics-events.html">Events</a>
<a href="/olympics-athletes.html">Athletes</a>
</div>

<div class="hero">
<h1>Olympic Events</h1>
<p>Results by event across Olympic history</p>
</div>

<div class="container">

<div class="controls">
<select id="yearFilter"><option value="">All Years</option></select>
<select id="sportFilter"><option value="">All Sports</option></select>
<input id="searchFilter" placeholder="Search event...">
</div>

<div id="events"></div>

</div>

<script>

let eventsData = [];

async function load(){

/* LOAD — merge main medals + relay results */
const [main, relays] = await Promise.all([
  fetch("/data/olympics/summer_olympic_medals.json").then(r=>r.json()),
  fetch("/data/olympics/olympic_relay_results.json").then(r=>r.json())
]);

const rows = [...main, ...relays];

const map = new Map();

rows.forEach(r=>{

const year = r.year;
const sport = r.sport;
const event = r.event;
const athlete = r.athlete;
let medal = r.medal;

if(!year || !sport || !event || !athlete || !medal) return;

medal = medal.toUpperCase();

if(!["GOLD","SILVER","BRONZE"].includes(medal)) return;

const key = year + "|" + sport + "|" + event;

if(!map.has(key)){
map.set(key,{
year,
sport,
event,
gold:[],
silver:[],
bronze:[]
});
}

const obj = map.get(key);

if(medal==="GOLD") obj.gold.push(athlete);
if(medal==="SILVER") obj.silver.push(athlete);
if(medal==="BRONZE") obj.bronze.push(athlete);

});

eventsData = Array.from(map.values());

buildFilters();
render(eventsData);

}

function buildFilters(){

const years = [...new Set(eventsData.map(e=>e.year))].sort((a,b)=>b-a);
const sports = [...new Set(eventsData.map(e=>e.sport))].sort();

years.forEach(y=>{
yearFilter.innerHTML += `<option value="${y}">${y}</option>`;
});

sports.forEach(s=>{
sportFilter.innerHTML += `<option value="${s}">${s}</option>`;
});

}

function render(list){

const container = document.getElementById("events");
container.innerHTML = "";

list.forEach(e=>{

const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<h3>${e.event}</h3>
<div>${e.year} • ${e.sport}</div>

<div class="medals">
<div class="medal gold"><b>Gold</b><br>${e.gold.join("<br>")}</div>
<div class="medal silver"><b>Silver</b><br>${e.silver.join("<br>")}</div>
<div class="medal bronze"><b>Bronze</b><br>${e.bronze.join("<br>")}</div>
</div>
`;

div.onclick = () => {
window.location.href =
`olympics-event.html?event=${encodeURIComponent(e.event)}&year=${e.year}`;
};

container.appendChild(div);

});

}

function applyFilters(){

const y = yearFilter.value;
const s = sportFilter.value;
const q = searchFilter.value.toLowerCase();

let filtered = [...eventsData];

if(y) filtered = filtered.filter(e=>e.year==y);
if(s) filtered = filtered.filter(e=>e.sport==s);
if(q) filtered = filtered.filter(e=>e.event.toLowerCase().includes(q));

render(filtered);

}

yearFilter.onchange = applyFilters;
sportFilter.onchange = applyFilters;
searchFilter.oninput = applyFilters;

load();

</script>

</body>
</html>
