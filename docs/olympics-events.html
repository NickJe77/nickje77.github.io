<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Olympic Events | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
    font-family:var(--body);
    margin:0;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
}

.navbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    font-weight:600;
    font-size:13.5px;
}
.navbar a{
    color:var(--ink);
    text-decoration:none;
    opacity:.7;
    transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
    opacity:1;
    color:var(--accent);
}

.hero{
    background:linear-gradient(160deg,var(--board-2),var(--board));
    color:#fff;
    text-align:center;
    padding:36px 20px;
}
.hero h1{
    margin:0;
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(22px,4.5vw,34px);
    letter-spacing:.01em;
    text-transform:uppercase;
}
.hero p{
    margin-top:8px;
    font-size:13.5px;
    color:rgba(255,255,255,.68);
}

.container{
    max-width:1100px;
    margin:0 auto;
    padding:26px 20px 70px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
    justify-content:center;
}

select,input{
    padding:10px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    font-family:var(--body);
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
}
select{cursor:pointer;}
select:hover,input:hover{border-color:var(--faint);}
select:focus,input:focus{outline:none;border-color:var(--accent);}

.card{
    background:var(--surface);
    border:1px solid var(--line);
    padding:18px 20px;
    border-radius:var(--radius);
    margin-bottom:12px;
    cursor:pointer;
    transition:.15s;
}
.card:hover{border-color:var(--accent);}
.card h3{
    margin:0 0 4px;
    font-family:var(--display);
    font-weight:600;
    font-size:17px;
    color:var(--ink);
}
.card > div{
    font-size:12.5px;
    color:var(--muted);
    font-weight:600;
}

.medals{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:12px;
}

.medal{
    background:#f7f9fb;
    padding:12px;
    border-radius:12px;
    font-size:13px;
    color:#27313c;
    line-height:1.5;
}
.medal b{
    display:block;
    font-family:var(--body);
    font-size:10.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    margin-bottom:4px;
}

.gold{border-left:3px solid #d4af37;}
.silver{border-left:3px solid #9ea7ad;}
.bronze{border-left:3px solid #b06a35;}
</style>
</head>

<body>

<nav class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</nav>

<div class="hero">
<h1>Olympic Events</h1>
<p>Results by event across Olympic history</p>
</div>

<div class="container">

<div class="controls">
<select id="yearFilter"><option value="">All Years</option></select>
<select id="sportFilter"><option value="">All Sports</option></select>
<input id="searchFilter" placeholder="Search event...">
</div>

<div id="events"></div>

</div>

<script>

let eventsData = [];

async function load(){

const rows = await fetch("/data/olympics/summer_olympic_medals.json").then(r=>r.json());

const map = new Map();

rows.forEach(r=>{

const year = r.year;
const sport = r.sport;
const event = r.event;
const athlete = r.athlete;
let medal = r.medal;

if(!year || !sport || !event || !athlete || !medal) return;

medal = medal.toUpperCase();

if(!["GOLD","SILVER","BRONZE"].includes(medal)) return;

const key = year + "|" + sport + "|" + event;

if(!map.has(key)){
map.set(key,{
year,
sport,
event,
gold:[],
silver:[],
bronze:[]
});
}

const obj = map.get(key);

if(medal==="GOLD") obj.gold.push(athlete);
if(medal==="SILVER") obj.silver.push(athlete);
if(medal==="BRONZE") obj.bronze.push(athlete);

});

eventsData = Array.from(map.values());

buildFilters();
render(eventsData);

}

function buildFilters(){

const years = [...new Set(eventsData.map(e=>e.year))].sort((a,b)=>b-a);
const sports = [...new Set(eventsData.map(e=>e.sport))].sort();

years.forEach(y=>{
yearFilter.innerHTML += `<option value="${y}">${y}</option>`;
});

sports.forEach(s=>{
sportFilter.innerHTML += `<option value="${s}">${s}</option>`;
});

}

function render(list){

const container = document.getElementById("events");
container.innerHTML = "";

list.forEach(e=>{

const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<h3>${e.event}</h3>
<div>${e.year} • ${e.sport}</div>

<div class="medals">
<div class="medal gold"><b>Gold</b><br>${e.gold.join("<br>")}</div>
<div class="medal silver"><b>Silver</b><br>${e.silver.join("<br>")}</div>
<div class="medal bronze"><b>Bronze</b><br>${e.bronze.join("<br>")}</div>
</div>
`;

div.onclick = () => {
window.location.href =
`olympics-event.html?event=${encodeURIComponent(e.event)}&year=${e.year}`;
};

container.appendChild(div);

});

}

function applyFilters(){

const y = yearFilter.value;
const s = sportFilter.value;
const q = searchFilter.value.toLowerCase();

let filtered = [...eventsData];

if(y) filtered = filtered.filter(e=>e.year==y);
if(s) filtered = filtered.filter(e=>e.sport==s);
if(q) filtered = filtered.filter(e=>e.event.toLowerCase().includes(q));

render(filtered);

}

yearFilter.onchange = applyFilters;
sportFilter.onchange = applyFilters;
searchFilter.oninput = applyFilters;

load();

</script>

</body>
</html>
