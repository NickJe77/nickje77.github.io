<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Olympic Events</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui;margin:0;background:#f5f5f5;}
.navbar{display:flex;justify-content:center;gap:20px;padding:15px;background:#111;}
.navbar a{color:white;text-decoration:none;font-weight:600;}

.hero{
background:linear-gradient(90deg,#0085C7,#F4C300,#000,#009F3D,#DF0024);
color:white;text-align:center;padding:30px;
}

.container{max-width:1100px;margin:20px auto;padding:10px;}

.controls{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;}
select,input{padding:10px;border-radius:8px;border:1px solid #ccc;}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:12px;
cursor:pointer;
}

.card:hover{background:#f0f0f0;}

.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.medal{background:#f2f2f2;padding:10px;border-radius:6px;}
.gold{border-left:5px solid gold;}
.silver{border-left:5px solid silver;}
.bronze{border-left:5px solid #cd7f32;}
</style>
</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/olympics.html">Olympics</a>
<a href="/olympics-medals.html">Medal Table</a>
<a href="/olympics-events.html">Events</a>
<a href="/olympics-athletes.html">Athletes</a>
</div>

<div class="hero">
<h1>Olympic Events</h1>
</div>

<div class="container">

<div class="controls">
<select id="yearFilter"><option value="">All Years</option></select>
<select id="sportFilter"><option value="">All Sports</option></select>
<input id="searchFilter" placeholder="Search event...">
</div>

<div id="events"></div>

</div>

<script>

let eventsData = [];

async function load(){

const res = await fetch("/data/olympics/olympic_results.json");
const rows = await res.json();

const map = new Map();

rows.forEach(r=>{

const year = Number(r.year || (r.slug_game||"").substring(0,4));
const sport = r.discipline_title || r.discipline || "";
const event = r.event_title || r.event || "";
const athlete = r.athlete_full_name || r.name || "";
let medal = r.medal_type || r.medal || "";

if(!year || !sport || !event || !athlete || !medal) return;

medal = medal.toUpperCase()
.replace("GOLD MEDAL","GOLD")
.replace("SILVER MEDAL","SILVER")
.replace("BRONZE MEDAL","BRONZE");

if(!["GOLD","SILVER","BRONZE"].includes(medal)) return;

const key = year+"|"+sport+"|"+event;

if(!map.has(key)){
map.set(key,{year,sport,event,gold:[],silver:[],bronze:[]});
}

const obj = map.get(key);

if(medal==="GOLD") obj.gold.push(athlete);
if(medal==="SILVER") obj.silver.push(athlete);
if(medal==="BRONZE") obj.bronze.push(athlete);

});

eventsData = Array.from(map.values());

buildFilters();
render(eventsData);
}

function buildFilters(){

const years = [...new Set(eventsData.map(e=>e.year))].sort((a,b)=>b-a);
const sports = [...new Set(eventsData.map(e=>e.sport))].sort();

years.forEach(y=>{
yearFilter.innerHTML += `<option value="${y}">${y}</option>`;
});

sports.forEach(s=>{
sportFilter.innerHTML += `<option value="${s}">${s}</option>`;
});

}

function render(list){

const container = document.getElementById("events");
container.innerHTML = "";

list.forEach(e=>{

const div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<h3>${e.event}</h3>
<div>${e.year} • ${e.sport}</div>

<div class="medals">
<div class="medal gold"><b>Gold</b><br>${e.gold.join("<br>")}</div>
<div class="medal silver"><b>Silver</b><br>${e.silver.join("<br>")}</div>
<div class="medal bronze"><b>Bronze</b><br>${e.bronze.join("<br>")}</div>
</div>
`;

div.onclick = () => {
window.location.href =
`olympics-event.html?event=${encodeURIComponent(e.event)}&year=${e.year}`;
};

container.appendChild(div);

});

}

function filter(){

const y = yearFilter.value;
const s = sportFilter.value;
const q = searchFilter.value.toLowerCase();

let f = [...eventsData];

if(y) f = f.filter(e=>e.year==y);
if(s) f = f.filter(e=>e.sport==s);
if(q) f = f.filter(e=>e.event.toLowerCase().includes(q));

render(f);
}

yearFilter.onchange = filter;
sportFilter.onchange = filter;
searchFilter.oninput = filter;

load();

</script>

</body>
</html>
