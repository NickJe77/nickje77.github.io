<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>MLB Postseason Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:28px 32px;border-radius:var(--radius);margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:8px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,4.5vw,36px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.scoreline{
  font-family:var(--display);font-size:20px;font-weight:600;margin-top:10px;
  color:#fff;font-variant-numeric:tabular-nums;
}
.meta-line{margin-top:6px;font-size:13px;color:rgba(255,255,255,.7);}
.sub{margin-top:4px;font-size:13px;color:rgba(255,255,255,.7);}

/* ── Sections ─────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}

.section{background:var(--surface);border:1px solid var(--line);padding:18px;border-radius:var(--radius);}
.section h2{
  margin:0 0 14px;font-family:var(--display);font-weight:600;font-size:16px;
  letter-spacing:.02em;text-transform:uppercase;color:var(--muted);
}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:10px;font-family:var(--body);font-weight:600;
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;text-align:left;
  border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f0f6ff;}

.no-stats{padding:16px;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-postseason.html" aria-current="page">Postseason</a>
</div>
<div class="page">
<div class="hero">
<div class="eyebrow">MLB Postseason</div>
<h1 id="title">Loading...</h1>
<div id="scoreline" class="scoreline"></div>
<div id="subtitle" class="sub"></div>
<div id="venueLine" class="meta-line"></div>
<div id="crowdLine" class="meta-line"></div>
</div>
<div class="grid">
<div class="section"><h2>Away Batting</h2><div id="awayBatting"></div></div>
<div class="section"><h2>Home Batting</h2><div id="homeBatting"></div></div>
<div class="section"><h2>Away Pitching</h2><div id="awayPitching"></div></div>
<div class="section"><h2>Home Pitching</h2><div id="homePitching"></div></div>
</div>
</div>
<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
function param(n){return new URLSearchParams(window.location.search).get(n)}
function renderTable(id,data){
if(!data||data.length===0){
document.getElementById(id).innerHTML="<div class=\"no-stats\">No detailed data available.</div>"
return
}
const keys=Object.keys(data[0]).filter(k=>k!=="player_id")
let html="<div class=\"table-wrap\"><table><thead><tr><th>Player</th>"
keys.forEach(k=>html+=`<th>${k}</th>`)
html+="</tr></thead><tbody>"
data.forEach(p=>{
html+=`<tr>
<td>${p.player_name || p.player_id}</td>`
keys.forEach(k=>html+=`<td>${p[k]}</td>`)
html+="</tr>"
})
html+="</tbody></table></div>"
document.getElementById(id).innerHTML=html
}
async function loadGame(){
const id=param("game")
if(!id){
document.getElementById("title").innerText="Game not found"
return
}
const season=id.match(/(\d{4})/)[1]
const gameRes=await fetch(`${R2}/baseball/postseason-games/${season}/${id}.json`)
if(!gameRes.ok){
document.getElementById("title").innerText="Game not found"
return
}
const game=await gameRes.json()
document.getElementById("title").innerText=
`${game.away_team} @ ${game.home_team}`
document.getElementById("scoreline").innerText=
`${game.away_team} ${game.away_score} – ${game.home_team} ${game.home_score}`
document.getElementById("subtitle").innerText=game.date
document.getElementById("venueLine").innerText=`Venue: ${game.venue || ""}`
document.getElementById("crowdLine").innerText=
game.attendance?`Attendance: ${Number(game.attendance).toLocaleString()}`:""
renderTable("awayBatting",game.batters_away)
renderTable("homeBatting",game.batters_home)
renderTable("awayPitching",game.pitchers_away)
renderTable("homePitching",game.pitchers_home)
}
loadGame()
</script>
</body>
</html>
