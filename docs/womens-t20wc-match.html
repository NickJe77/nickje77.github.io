<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Women's T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
}

.page{
max-width:1100px;
margin:30px auto;
padding:0 20px;
}

/* UNIFIED HERO */

.hero{
background:linear-gradient(90deg,#7b1fa2,#e91e63);
color:white;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

/* INNINGS CARD */

.innings{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

/* TEAM HEADER */

.teamHeader{
display:inline-block;
background:#e91e63;
color:white;
padding:8px 14px;
border-radius:8px;
font-weight:700;
margin-bottom:10px;
}

.score{
font-size:22px;
font-weight:700;
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:15px;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
text-align:left;
}

/* UNIFIED ROW STRIPING */

tr:nth-child(even){
background:#eef3ff;
}

/* UNIFIED PLAYER LINK */

.playerLink{
color:#7b1fa2;
font-weight:600;
text-decoration:none;
}

.playerLink:hover{
text-decoration:underline;
}

.sectionTitle{
font-weight:700;
margin-top:10px;
margin-bottom:5px;
}

</style>

</head>

<body>

<div class="navbar">

<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="womens-t20-world-cup.html">Women's T20 World Cup</a>

</div>

<div class="page">

<div id="matchContainer">

<div class="hero">Loading match...</div>

</div>

</div>

<script>

const params=new URLSearchParams(window.location.search);

const file=params.get("file");
const matchId=parseInt(params.get("match"));

const BASE="data/womens-t20-world-cup/matches/";

loadMatch();

async function loadMatch(){

const matches=await fetch(BASE+file).then(r=>r.json());

const match=matches[matchId];

renderMatch(match);

}

function playerLink(name){

return `<a href="womens-t20-world-cup-player.html?player=${encodeURIComponent(name)}" class="playerLink">${name}</a>`;

}

function renderMatch(match){

const container=document.getElementById("matchContainer");

const teams=match.info.teams || Object.keys(match.info.players);

container.innerHTML=`

<div class="hero">

<h1>${teams[0]} vs ${teams[1]}</h1>

<div>${match.info.venue}</div>

<div>${match.info.dates.join(", ")}</div>

</div>

`;

match.innings.forEach(inn=>{

const team=inn.team;

let runs=0;
let wickets=0;
let balls=0;

const batting={};
const bowling={};
const fow=[];

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

const batter=d.batter;
const bowler=d.bowler;

const legal=!d.extras?.wides && !d.extras?.noballs;

if(!batting[batter])
batting[batter]={runs:0,balls:0,out:"not out"};

if(!bowling[bowler])
bowling[bowler]={runs:0,balls:0,wickets:0};

batting[batter].runs+=d.runs.batter;

if(legal){

batting[batter].balls++;
bowling[bowler].balls++;
balls++;

}

bowling[bowler].runs+=d.runs.total;

runs+=d.runs.total;

if(d.wickets){

d.wickets.forEach(w=>{

wickets++;

batting[w.player_out].out=dismissalText(w,bowler);

bowling[bowler].wickets++;

fow.push(`${runs}/${wickets} (${w.player_out})`);

});

}

});

});

const overs=Math.floor(balls/6)+"."+(balls%6);

const div=document.createElement("div");

div.className="innings";

div.innerHTML=`

<div class="teamHeader">${team}</div>

<div class="score">${runs}/${wickets} (${overs} overs)</div>

<div class="sectionTitle">Batting</div>

<table>

<tr>
<th>Batter</th>
<th>How out</th>
<th>R</th>
<th>B</th>
<th>SR</th>
</tr>

${Object.entries(batting).map(([name,b])=>`

<tr>

<td>${playerLink(name)}</td>

<td>${b.out}</td>

<td>${b.runs}</td>

<td>${b.balls}</td>

<td>${b.balls?((b.runs/b.balls)*100).toFixed(1):""}</td>

</tr>

`).join("")}

</table>

<div class="sectionTitle">Fall of wickets</div>

<div>${fow.join(", ") || "None"}</div>

<div class="sectionTitle">Bowling</div>

<table>

<tr>
<th>Bowler</th>
<th>O</th>
<th>R</th>
<th>W</th>
<th>Econ</th>
</tr>

${Object.entries(bowling).map(([name,b])=>`

<tr>

<td>${playerLink(name)}</td>

<td>${Math.floor(b.balls/6)}.${b.balls%6}</td>

<td>${b.runs}</td>

<td>${b.wickets}</td>

<td>${b.balls?(b.runs/(b.balls/6)).toFixed(2):""}</td>

</tr>

`).join("")}

</table>

`;

container.appendChild(div);

});

}

function dismissalText(w,bowler){

if(w.kind==="caught")
return `c ${w.fielders?.[0]?.name || ""} b ${bowler}`;

if(w.kind==="bowled")
return `b ${bowler}`;

if(w.kind==="lbw")
return `lbw b ${bowler}`;

if(w.kind==="run out")
return "run out";

return w.kind;

}

</script>

</body>
</html>
