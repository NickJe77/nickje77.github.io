<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Women's T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:35px 40px;
  border-radius:20px;
  margin-bottom:25px;
}

.hero h1{
  margin:0;
  font-size:28px;
}

.hero p{
  margin-top:8px;
  font-size:16px;
}

.section{
  margin-bottom:30px;
}

.section h2{
  margin-bottom:10px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:8px 10px;
  border-bottom:1px solid #ddd;
}

th{
  background:#f3f6fb;
}

tr:nth-child(even){
  background:#eaf3ff;
}

.player-link{
  color:#6a040f;
  font-weight:600;
  text-decoration:none;
}

.player-link:hover{
  text-decoration:underline;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="womens-t20-world-cup.html">Women's T20 World Cup</a>
</div>

<div class="page">

<div id="hero" class="hero"></div>

<div class="section">
<h2>Batting</h2>
<table>
<thead>
<tr>
<th>Player</th>
<th>Runs</th>
<th>Balls</th>
<th>4s</th>
<th>6s</th>
<th>SR</th>
</tr>
</thead>
<tbody id="battingTable"></tbody>
</table>
</div>

<div class="section">
<h2>Bowling</h2>
<table>
<thead>
<tr>
<th>Player</th>
<th>Overs</th>
<th>Runs</th>
<th>Wickets</th>
<th>Econ</th>
</tr>
</thead>
<tbody id="bowlingTable"></tbody>
</table>
</div>

</div>

<script>

const params=new URLSearchParams(location.search);

const file=params.get("file");
const matchIndex=parseInt(params.get("match"));

const BASE="data/womens-t20-world-cup/matches/";

let nameMap={};

load();

async function load(){

nameMap=await fetch(BASE+"player-names.json")
.then(r=>r.json())
.catch(()=>({}));

const matches=await fetch(BASE+file).then(r=>r.json());

const match=matches[matchIndex];

renderHero(match);

renderBatting(match);

renderBowling(match);

}

function renderHero(match){

const hero=document.getElementById("hero");

const teams=match.info.teams.join(" vs ");

const venue=match.info.venue;

const date=formatDate(match.info.dates[0]);

let result="";

if(match.info.outcome?.winner){

if(match.info.outcome.by?.runs)
result=`${match.info.outcome.winner} won by ${match.info.outcome.by.runs} runs`;

else if(match.info.outcome.by?.wickets)
result=`${match.info.outcome.winner} won by ${match.info.outcome.by.wickets} wickets`;

}

hero.innerHTML=`

<h1>${teams}</h1>

<p>${venue} • ${date}</p>

<p>${result}</p>

`;

}

function renderBatting(match){

const tbody=document.getElementById("battingTable");

let batStats={};

match.innings.forEach(inn=>{

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

const p=d.batter;

batStats[p]=batStats[p]||{
runs:0,balls:0,fours:0,sixes:0
};

batStats[p].runs+=d.runs.batter;

batStats[p].balls++;

if(d.runs.batter===4) batStats[p].fours++;

if(d.runs.batter===6) batStats[p].sixes++;

});

});

});

Object.entries(batStats).forEach(([p,s])=>{

const sr=(s.runs/s.balls*100).toFixed(1);

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${playerLink(p)}</td>
<td>${s.runs}</td>
<td>${s.balls}</td>
<td>${s.fours}</td>
<td>${s.sixes}</td>
<td>${sr}</td>

`;

tbody.appendChild(tr);

});

}

function renderBowling(match){

const tbody=document.getElementById("bowlingTable");

let bowlStats={};

match.innings.forEach(inn=>{

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

const p=d.bowler;

bowlStats[p]=bowlStats[p]||{
balls:0,runs:0,wkts:0
};

bowlStats[p].balls++;

bowlStats[p].runs+=d.runs.total;

if(d.wickets){

d.wickets.forEach(w=>{

if(w.kind!=="run out")
bowlStats[p].wkts++;

});

}

});

});

});

Object.entries(bowlStats).forEach(([p,s])=>{

const overs=(s.balls/6).toFixed(1);

const econ=(s.runs/overs).toFixed(1);

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${playerLink(p)}</td>
<td>${overs}</td>
<td>${s.runs}</td>
<td>${s.wkts}</td>
<td>${econ}</td>

`;

tbody.appendChild(tr);

});

}

function playerLink(short){

const name=nameMap[short]||short;

return `<a class="player-link" href="womens-t20wc-player.html?player=${encodeURIComponent(short)}">${name}</a>`;

}

function formatDate(d){

return new Date(d).toLocaleDateString("en-GB",{

day:"2-digit",
month:"short",
year:"numeric"

});

}

</script>

</body>
</html>
