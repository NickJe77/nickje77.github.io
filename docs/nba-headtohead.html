<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Head-to-Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#fff;
color:#1f2937;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:700;
background:#fff;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.navbar a:hover{
text-decoration:underline;
}

/* PAGE */

.page{
max-width:1100px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#17408B,#C9082A);
color:white;
padding:26px 28px 22px;
border-radius:16px;
margin-bottom:26px;
text-align:center;
box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.hero h1{
margin:0 0 6px;
font-size:32px;
}

.hero p{
margin:0;
opacity:.9;
font-size:15px;
}

/* CONTROLS */

.controls{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:22px;
}

select{
padding:10px 12px;
border-radius:10px;
border:1px solid #d1d5db;
font-size:15px;
min-width:200px;
}

button{
padding:10px 18px;
border:none;
background:#17408B;
color:white;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

button:hover{
background:#12346f;
}

/* SUMMARY */

.summary{
text-align:center;
font-size:24px;
font-weight:800;
margin-bottom:6px;
}

.stats{
text-align:center;
color:#666;
margin-bottom:22px;
}

/* TABLE CARD */

.table-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
overflow:hidden;
box-shadow:0 6px 16px rgba(0,0,0,0.05);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:11px 12px;
border-bottom:1px solid #e5e7eb;
text-align:left;
}

th{
background:#17408B;
color:white;
font-size:14px;
font-weight:700;
}

td{
font-size:15px;
}

tr:nth-child(even){
background:#f8faff;
}

tr:hover{
background:#e9f0ff;
}

.game-link{
color:#0056d6;
text-decoration:none;
font-weight:700;
}

.game-link:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
<h1>NBA Head-to-Head</h1>
<p>Compare meetings between two franchises</p>
</div>

<div class="controls">
<select id="team1"></select>
<select id="team2"></select>
<button onclick="compare()">Compare</button>
</div>

<div class="summary" id="summary"></div>
<div class="stats" id="stats"></div>

<div class="table-card">

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>

<tbody id="games"></tbody>

</table>

</div>

</div>

<script>

/* JAVASCRIPT UNCHANGED */

let games=[]

const NBA_TEAMS=[
"76ers","Bucks","Bulls","Cavaliers","Celtics","Clippers","Grizzlies",
"Hawks","Heat","Hornets","Jazz","Kings","Knicks","Lakers","Magic",
"Mavericks","Nets","Nuggets","Pacers","Pelicans","Pistons","Raptors",
"Rockets","Spurs","Suns","Thunder","Timberwolves","Trail Blazers",
"Warriors","Wizards"
]

const teamNames={
"76ers":"Philadelphia 76ers",
"Bucks":"Milwaukee Bucks",
"Bulls":"Chicago Bulls",
"Cavaliers":"Cleveland Cavaliers",
"Celtics":"Boston Celtics",
"Clippers":"Los Angeles Clippers",
"Grizzlies":"Memphis Grizzlies",
"Hawks":"Atlanta Hawks",
"Heat":"Miami Heat",
"Hornets":"Charlotte Hornets",
"Jazz":"Utah Jazz",
"Kings":"Sacramento Kings",
"Knicks":"New York Knicks",
"Lakers":"Los Angeles Lakers",
"Magic":"Orlando Magic",
"Mavericks":"Dallas Mavericks",
"Nets":"Brooklyn Nets",
"Nuggets":"Denver Nuggets",
"Pacers":"Indiana Pacers",
"Pelicans":"New Orleans Pelicans",
"Pistons":"Detroit Pistons",
"Raptors":"Toronto Raptors",
"Rockets":"Houston Rockets",
"Spurs":"San Antonio Spurs",
"Suns":"Phoenix Suns",
"Thunder":"Oklahoma City Thunder",
"Timberwolves":"Minnesota Timberwolves",
"Trail Blazers":"Portland Trail Blazers",
"Warriors":"Golden State Warriors",
"Wizards":"Washington Wizards"
}

function fullName(t){return teamNames[t]||t}

async function load(){

const data=await fetch("data/nba/nba_games_master.json").then(r=>r.json())

data.forEach(g=>{

if(!NBA_TEAMS.includes(g.home_team)) return
if(!NBA_TEAMS.includes(g.away_team)) return

games.push(g)

})

buildTeams()

}

function buildTeams(){

const t1=document.getElementById("team1")
const t2=document.getElementById("team2")

NBA_TEAMS.forEach(team=>{
let o=document.createElement("option")
o.value=team
o.textContent=fullName(team)
t1.appendChild(o.cloneNode(true))
t2.appendChild(o)
})

}

function compare(){

const a=document.getElementById("team1").value
const b=document.getElementById("team2").value

if(a===b){
alert("Pick two different teams")
return
}

const match=games.filter(g=>
(g.home_team===a && g.away_team===b) ||
(g.home_team===b && g.away_team===a)
)

let aw=0,bw=0,pfA=0,pfB=0

match.forEach(g=>{

if(g.home_score>g.away_score){
if(g.home_team===a) aw++; else bw++
}else{
if(g.away_team===a) aw++; else bw++
}

if(g.home_team===a){
pfA+=g.home_score
pfB+=g.away_score
}else{
pfA+=g.away_score
pfB+=g.home_score
}

})

const gamesPlayed=match.length

document.getElementById("summary").innerHTML=
`${fullName(a)} ${aw} – ${bw} ${fullName(b)}`

document.getElementById("stats").innerHTML=
`${gamesPlayed} games`

render(match)

}

function render(list){

const tbody=document.getElementById("games")
tbody.innerHTML=""

list.sort((a,b)=>new Date(b.date)-new Date(a.date))

list.forEach(g=>{

const winner=g.home_score>g.away_score?g.home_team:g.away_team

const tr=document.createElement("tr")

tr.innerHTML=`
<td>${g.date}</td>

<td>
<a class="game-link" href="nba-game.html?season=${g.season}&game=${g.game_id}">
${fullName(g.away_team)} @ ${fullName(g.home_team)}
</a>
</td>

<td>${fullName(winner)}</td>

<td>${g.away_score}-${g.home_score}</td>
`

tbody.appendChild(tr)

})

}

load()

</script>

</body>
</html>
