<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Head-to-Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1100px;
margin:auto;
padding:30px 20px 60px;
}

.hero{
background:linear-gradient(90deg,#17408B,#C9082A);
color:white;
padding:26px;
border-radius:14px;
margin-bottom:30px;
text-align:center;
}

.controls{
text-align:center;
margin-bottom:25px;
}

select{
padding:10px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
margin:0 10px;
}

button{
padding:10px 18px;
border:none;
background:#17408B;
color:white;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.summary{
text-align:center;
margin-bottom:25px;
font-size:18px;
font-weight:600;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#17408B;
color:white;
padding:10px;
text-align:left;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
}

tr:nth-child(even){
background:#f5f7fb;
}

.game-link{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
<h1>NBA Head-to-Head</h1>
<p>Compare every game between two franchises</p>
</div>

<div class="controls">
<select id="team1"></select>
<select id="team2"></select>
<button onclick="compare()">Compare</button>
</div>

<div class="summary" id="summary"></div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="games"></tbody>
</table>

</div>

<script>

let games=[]
let teams=new Set()

async function load(){

const data = await fetch("data/nba/nba_games_master.json")
.then(r=>r.json())

games=data

data.forEach(g=>{
teams.add(g.home_team)
teams.add(g.away_team)
})

buildTeamLists()

}

function buildTeamLists(){

const list=[...teams].sort()

const t1=document.getElementById("team1")
const t2=document.getElementById("team2")

list.forEach(team=>{

let o=document.createElement("option")
o.value=team
o.textContent=team

t1.appendChild(o.cloneNode(true))
t2.appendChild(o)

})

}

function compare(){

const teamA=document.getElementById("team1").value
const teamB=document.getElementById("team2").value

if(teamA===teamB){
alert("Select two different teams")
return
}

const matchGames = games.filter(g =>
(g.home_team===teamA && g.away_team===teamB) ||
(g.home_team===teamB && g.away_team===teamA)
)

let winsA=0
let winsB=0

matchGames.forEach(g=>{

if(g.home_score>g.away_score){

if(g.home_team===teamA) winsA++
else winsB++

}else{

if(g.away_team===teamA) winsA++
else winsB++

}

})

document.getElementById("summary").innerHTML =
`${teamA} ${winsA} – ${winsB} ${teamB}<br>${matchGames.length} games`

render(matchGames)

}

function render(list){

const tbody=document.getElementById("games")
tbody.innerHTML=""

list.sort((a,b)=>new Date(b.date)-new Date(a.date))

list.forEach(g=>{

const winner = g.home_score>g.away_score ? g.home_team : g.away_team

const tr=document.createElement("tr")

tr.innerHTML=`
<td>${g.date}</td>
<td>
<a class="game-link" href="nba-game.html?game=${g.game_id}">
${g.away_team} @ ${g.home_team}
</a>
</td>
<td>${winner}</td>
<td>${g.away_score}-${g.home_score}</td>
`

tbody.appendChild(tr)

})

}

load()

</script>

</body>
</html>
