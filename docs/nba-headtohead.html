<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Head-to-Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page{
max-width:1100px;
margin:auto;
padding:30px 20px 60px;
}

.hero{
background:linear-gradient(90deg,#17408B,#C9082A);
color:white;
padding:26px;
border-radius:14px;
margin-bottom:30px;
text-align:center;
}

.controls{text-align:center;margin-bottom:25px;}

select{
padding:10px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
margin:0 10px;
}

button{
padding:10px 18px;
border:none;
background:#17408B;
color:white;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.summary{
text-align:center;
font-size:22px;
font-weight:700;
margin-bottom:6px;
}

.stats{
text-align:center;
color:#555;
margin-bottom:25px;
}

.last10{
text-align:center;
margin-bottom:25px;
font-size:14px;
color:#333;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#17408B;
color:white;
padding:10px;
text-align:left;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
}

tr:nth-child(even){background:#f5f7fb;}

.game-link{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
<h1>NBA Head-to-Head</h1>
<p>Compare every game between two franchises</p>
</div>

<div class="controls">
<select id="team1"></select>
<select id="team2"></select>
<button onclick="compare()">Compare</button>
</div>

<div class="summary" id="summary"></div>
<div class="stats" id="stats"></div>
<div class="last10" id="last10"></div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="games"></tbody>
</table>

</div>

<script>

let games=[]
let teams=new Set()

const teamNames={
"76ers":"Philadelphia 76ers",
"Bucks":"Milwaukee Bucks",
"Bulls":"Chicago Bulls",
"Cavaliers":"Cleveland Cavaliers",
"Celtics":"Boston Celtics",
"Clippers":"Los Angeles Clippers",
"Grizzlies":"Memphis Grizzlies",
"Hawks":"Atlanta Hawks",
"Heat":"Miami Heat",
"Hornets":"Charlotte Hornets",
"Jazz":"Utah Jazz",
"Kings":"Sacramento Kings",
"Knicks":"New York Knicks",
"Lakers":"Los Angeles Lakers",
"Magic":"Orlando Magic",
"Mavericks":"Dallas Mavericks",
"Nets":"Brooklyn Nets",
"Nuggets":"Denver Nuggets",
"Pacers":"Indiana Pacers",
"Pelicans":"New Orleans Pelicans",
"Pistons":"Detroit Pistons",
"Raptors":"Toronto Raptors",
"Rockets":"Houston Rockets",
"Spurs":"San Antonio Spurs",
"Suns":"Phoenix Suns",
"Thunder":"Oklahoma City Thunder",
"Timberwolves":"Minnesota Timberwolves",
"Trail Blazers":"Portland Trail Blazers",
"Warriors":"Golden State Warriors",
"Wizards":"Washington Wizards"
}

function fullName(t){return teamNames[t]||t}

async function load(){

const data=await fetch("data/nba/nba_games_master.json").then(r=>r.json())

data.forEach(g=>{

// only games with real files
if(!String(g.game_id).startsWith("002")) return

games.push(g)
teams.add(g.home_team)
teams.add(g.away_team)

})

buildTeams()

}

function buildTeams(){

const list=[...teams].sort()

const t1=document.getElementById("team1")
const t2=document.getElementById("team2")

list.forEach(team=>{
let o=document.createElement("option")
o.value=team
o.textContent=fullName(team)
t1.appendChild(o.cloneNode(true))
t2.appendChild(o)
})

}

function compare(){

const a=document.getElementById("team1").value
const b=document.getElementById("team2").value

if(a===b){alert("Pick two different teams");return}

const match=games.filter(g=>
(g.home_team===a && g.away_team===b) ||
(g.home_team===b && g.away_team===a)
)

let aw=0,bw=0,pfA=0,pfB=0,reg=0,play=0

match.forEach(g=>{

if(g.home_score>g.away_score){
if(g.home_team===a)aw++;else bw++
}else{
if(g.away_team===a)aw++;else bw++
}

if(g.home_team===a){
pfA+=g.home_score
pfB+=g.away_score
}else{
pfA+=g.away_score
pfB+=g.home_score
}

if((g.game_type||"").includes("Regular"))reg++
else play++

})

const gamesPlayed=match.length
const winPct=(aw/gamesPlayed*100).toFixed(1)

document.getElementById("summary").innerHTML=
`${fullName(a)} ${aw} – ${bw} ${fullName(b)}`

document.getElementById("stats").innerHTML=
`${gamesPlayed} games | Win % ${winPct}% | Regular Season ${reg} | Playoffs ${play} | Avg Score ${(pfA/gamesPlayed).toFixed(1)} – ${(pfB/gamesPlayed).toFixed(1)}`

const last10=match.slice(-10).reverse().map(g=>{
const w=g.home_score>g.away_score?g.home_team:g.away_team
return `${g.date} ${fullName(w)}`
})

document.getElementById("last10").innerHTML="Last 10: "+last10.join(" • ")

render(match)

}

function render(list){

const tbody=document.getElementById("games")
tbody.innerHTML=""

list.sort((a,b)=>new Date(b.date)-new Date(a.date))

list.forEach(g=>{

const winner=g.home_score>g.away_score?g.home_team:g.away_team

// determine season folder from game id
const seasonFolder="20"+g.game_id.substring(3,5)

const tr=document.createElement("tr")

tr.innerHTML=`
<td>${g.date}</td>
<td>
<a class="game-link" href="nba-game.html?season=${seasonFolder}&game=${g.game_id}">
${fullName(g.away_team)} @ ${fullName(g.home_team)}
</a>
</td>
<td>${fullName(winner)}</td>
<td>${g.away_score}-${g.home_score}</td>
`

tbody.appendChild(tr)

})

}

load()

</script>

</body>
</html>
