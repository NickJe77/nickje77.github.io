<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Head-to-Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:28px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero p{margin:0;color:rgba(255,255,255,.68);font-size:14px;}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);min-width:220px;cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}
button{
  padding:10px 22px;border:none;background:var(--board);color:#fff;border-radius:999px;
  cursor:pointer;font-family:var(--body);font-weight:600;font-size:13.5px;
}
button:hover{background:#000;}

.summary{text-align:center;font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:6px;color:var(--ink);}
.stats{text-align:center;color:var(--muted);margin-bottom:22px;font-size:13.5px;}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.game-link{color:var(--ink);text-decoration:none;font-weight:700;}
.game-link:hover{color:var(--accent);}
.loading{text-align:center;padding:40px;color:var(--muted);font-style:italic;}
</style>
</head>
<body>
<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>
<div class="page">
  <div class="hero">
    <span class="eyebrow">NBA</span>
    <h1>NBA Head-to-Head</h1>
    <p>Compare meetings between two franchises</p>
  </div>
  <div class="controls">
    <select id="team1"></select>
    <select id="team2"></select>
    <button onclick="compare()">Compare</button>
  </div>
  <div class="summary" id="summary"></div>
  <div class="stats" id="stats"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Game</th>
          <th>Winner</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

const NBA_TEAMS = [
  "Atlanta Hawks","Boston Celtics","Brooklyn Nets","Charlotte Hornets",
  "Chicago Bulls","Cleveland Cavaliers","Dallas Mavericks","Denver Nuggets",
  "Detroit Pistons","Golden State Warriors","Houston Rockets","Indiana Pacers",
  "LA Clippers","Los Angeles Clippers","Los Angeles Lakers","Memphis Grizzlies",
  "Miami Heat","Milwaukee Bucks","Minnesota Timberwolves","New Orleans Pelicans",
  "New York Knicks","Oklahoma City Thunder","Orlando Magic","Philadelphia 76ers",
  "Phoenix Suns","Portland Trail Blazers","Sacramento Kings","San Antonio Spurs",
  "Toronto Raptors","Utah Jazz","Washington Wizards"
].sort();

// Also include historical team names
const HISTORICAL_TEAMS = [
  "Buffalo Braves","Chicago Zephyrs","Cincinnati Royals","Kansas City Kings",
  "Kansas City-Omaha Kings","New Jersey Nets","New Orleans Jazz","New Orleans Hornets",
  "Seattle SuperSonics","Vancouver Grizzlies","Washington Bullets",
  "San Diego Clippers","San Diego Rockets","Houston Rockets",
  "Carolina Cougars","Dallas Chaparrals","Denver Rockets",
  "Memphis Tams","New Orleans Buccaneers","Virginia Squires"
].sort();

let allGames = [];
let loaded   = false;

const team1El   = document.getElementById("team1");
const team2El   = document.getElementById("team2");
const summaryEl = document.getElementById("summary");
const statsEl   = document.getElementById("stats");
const gamesBody = document.getElementById("gamesBody");

// Build team dropdowns
NBA_TEAMS.forEach(t => {
  const o1 = document.createElement("option");
  o1.value = t; o1.textContent = t;
  team1El.appendChild(o1);
  const o2 = document.createElement("option");
  o2.value = t; o2.textContent = t;
  team2El.appendChild(o2);
});

// Set different defaults
if(team2El.options.length > 1) team2El.selectedIndex = 1;

async function loadAllSeasons(){
  if(loaded) return;
  summaryEl.innerHTML = "Loading all seasons...";
  statsEl.innerHTML   = "This may take a moment";
  gamesBody.innerHTML = `<tr><td colspan="4" class="loading">Loading...</td></tr>`;

  const seasons = [];
  for(let y = 1977; y <= 2026; y++) seasons.push(y);

  const results = await Promise.allSettled(
    seasons.map(s =>
      fetch(`${R2}/basketball/indexes/${s}.json`)
        .then(r => r.ok ? r.json() : [])
        .then(games => games.map(g => ({...g, season: s})))
        .catch(() => [])
    )
  );

  results.forEach(r => {
    if(r.status === "fulfilled") allGames.push(...r.value);
  });

  loaded = true;
  summaryEl.innerHTML = "";
  statsEl.innerHTML   = "";
  gamesBody.innerHTML = "";
}

async function compare(){
  const a = team1El.value;
  const b = team2El.value;

  if(a === b){
    alert("Pick two different teams");
    return;
  }

  await loadAllSeasons();

  const matched = allGames.filter(g =>
    (g.home === a && g.away === b) ||
    (g.home === b && g.away === a)
  );

  let aWins = 0, bWins = 0, aPts = 0, bPts = 0;

  matched.forEach(g => {
    const aIsHome = g.home === a;
    const aScore  = aIsHome ? g.home_score : g.away_score;
    const bScore  = aIsHome ? g.away_score : g.home_score;
    if(aScore != null && bScore != null){
      aPts += aScore;
      bPts += bScore;
      if(aScore > bScore) aWins++;
      else if(bScore > aScore) bWins++;
    }
  });

  summaryEl.innerHTML = `${a} ${aWins} – ${bWins} ${b}`;
  statsEl.innerHTML   = `${matched.length} games played • ${a} avg ${matched.length ? (aPts/matched.length).toFixed(1) : 0} pts • ${b} avg ${matched.length ? (bPts/matched.length).toFixed(1) : 0} pts`;

  // Sort newest first
  matched.sort((x, y) => new Date(y.date) - new Date(x.date));

  gamesBody.innerHTML = matched.map(g => {
    const winner = g.home_score > g.away_score ? g.home : g.away;
    return `
      <tr>
        <td>${g.date || ""}</td>
        <td>
          <a class="game-link" href="/nba-game.html?season=${g.season}&game=${g.game_id}">
            ${g.away} @ ${g.home}
          </a>
        </td>
        <td>${winner}</td>
        <td>${g.away_score ?? "–"} – ${g.home_score ?? "–"}</td>
      </tr>
    `;
  }).join("");

  if(!matched.length){
    gamesBody.innerHTML = `<tr><td colspan="4" class="loading">No games found between these teams.</td></tr>`;
  }
}
</script>
</body>
</html>
