<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Franchises | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1200px;margin:0 auto;padding:22px 18px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:30px;border-radius:22px;margin-bottom:18px;}
.hero h1{margin:0 0 10px 0;font-size:36px;}
select{padding:10px 14px;font-size:16px;border-radius:8px;border:none;font-weight:700;}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;font-weight:800;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;}
th,td{padding:10px;text-align:left;border-bottom:1px solid #f1f1f1;}
th{background:#002D72;color:#fff;}
tbody tr:nth-child(even){background:#eaf3ff;}
tbody tr:hover{background:#d6e6ff;}
.error{color:#b00020;font-weight:700;margin-top:10px;}
</style>
</head>
<body>

<div class="page">
  <div class="hero">
    <h1 id="title">Select Franchise</h1>
    <select id="teamSelect"></select>
    <div id="error" class="error"></div>
  </div>

  <div class="card">
    <a href="baseball.html">← Back to Baseball</a>
  </div>

  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>W</th>
        <th>L</th>
        <th>PCT</th>
        <th>RS</th>
        <th>RA</th>
        <th>DIFF</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>
</div>

<script>

const teamSelect = document.getElementById("teamSelect");
const tb = document.getElementById("tb");
const title = document.getElementById("title");
const errorBox = document.getElementById("error");

let games = [];
let teams = [];

async function init(){
  try {

    const teamsRes = await fetch("/docs/data/baseball/teams.json");
    teams = await teamsRes.json();

    teams.sort((a,b)=>a.name.localeCompare(b.name));

    teams.forEach(t=>{
      const opt = document.createElement("option");
      opt.value = t.code;
      opt.textContent = t.name;
      teamSelect.appendChild(opt);
    });

    const gamesRes = await fetch("/docs/data/baseball/index.json");
    games = await gamesRes.json();

    if(teams.length){
      loadTeam(teams[0].code, teams[0].name);
    }

    teamSelect.onchange = ()=>{
      const selected = teams.find(t=>t.code === teamSelect.value);
      loadTeam(selected.code, selected.name);
    };

  } catch(err){
    errorBox.textContent = "Failed to load data. Check file paths.";
    console.error(err);
  }
}

function loadTeam(code, name){

  title.textContent = `${name} (${code})`;
  tb.innerHTML = "";

  const seasonMap = {};

  games.forEach(g=>{
    if(g.home_code !== code && g.away_code !== code) return;

    if(!seasonMap[g.season]){
      seasonMap[g.season] = { W:0, L:0, RS:0, RA:0 };
    }

    const isHome = g.home_code === code;
    const teamScore = isHome ? g.home_score : g.away_score;
    const oppScore  = isHome ? g.away_score : g.home_score;

    seasonMap[g.season].RS += teamScore;
    seasonMap[g.season].RA += oppScore;

    if(teamScore > oppScore) seasonMap[g.season].W++;
    else seasonMap[g.season].L++;
  });

  Object.keys(seasonMap)
    .sort((a,b)=>b - a)
    .forEach(season=>{
      const s = seasonMap[season];
      const gp = s.W + s.L;
      const pct = gp ? (s.W/gp).toFixed(3) : ".000";
      const diff = s.RS - s.RA;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${season}</td>
        <td>${s.W}</td>
        <td>${s.L}</td>
        <td>${pct}</td>
        <td>${s.RS}</td>
        <td>${s.RA}</td>
        <td>${diff}</td>
      `;
      tb.appendChild(tr);
    });
}

init();

</script>

</body>
</html>
