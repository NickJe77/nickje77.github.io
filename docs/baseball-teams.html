<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Baseball Franchise | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.page{
  max-width:1200px;
  margin:0 auto;
  padding:24px 18px;
}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:#fff;
  padding:36px;
  border-radius:22px;
  margin-bottom:16px;
}

.hero h1{
  margin:0 0 16px 0;
  font-size:38px;
}

select{
  padding:10px 14px;
  font-size:16px;
  border-radius:10px;
  border:none;
  font-weight:600;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

th,td{
  padding:12px 10px;
  text-align:left;
  border-bottom:1px solid #eee;
}

th{
  background:#002D72;
  color:#fff;
  cursor:pointer;
  user-select:none;
}

th:hover{
  background:#001f4f;
}

tbody tr:nth-child(even){
  background:#eef5ff;
}

tbody tr:hover{
  background:#dce9ff;
}

.back{
  font-weight:700;
  color:#0056d6;
  text-decoration:none;
}

.season-link{
  color:#0056d6;
  font-weight:700;
  text-decoration:none;
}

.loading{
  padding:20px;
  font-weight:700;
  color:#555;
}
</style>
</head>
<body>

<div class="page">

  <div class="hero">
    <h1 id="title">Franchise History</h1>
    <select id="teamSelect"></select>
  </div>

  <div class="card">
    <a class="back" href="baseball.html">← Back to Baseball</a>
  </div>

  <div id="loadingMsg" class="loading" style="display:none">Loading...</div>

  <table>
    <thead>
      <tr>
        <th data-col="season">Season</th>
        <th data-col="W">W</th>
        <th data-col="L">L</th>
        <th data-col="PCT">PCT</th>
        <th data-col="RS">RS</th>
        <th data-col="RA">RA</th>
        <th data-col="DIFF">DIFF</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>

</div>

<script>

const teamSelect = document.getElementById("teamSelect");
const tb = document.getElementById("tb");
const title = document.getElementById("title");
const loadingMsg = document.getElementById("loadingMsg");

let years = [];
let franchises = [];
let tableData = [];
let sortState = {};

async function init(){
  years = await (await fetch("data/baseball/index.json")).json();
  franchises = await (await fetch("data/baseball/teams.json")).json();

  teamSelect.innerHTML = '<option value="">Select Franchise</option>';

  franchises.forEach(franchise=>{
    const opt = document.createElement("option");
    opt.value = franchise.id;
    opt.textContent = franchise.name;
    teamSelect.appendChild(opt);
  });

  teamSelect.addEventListener("change", buildFranchise);

  document.querySelectorAll("th").forEach(th=>{
    th.addEventListener("click", ()=>sortTable(th.dataset.col));
  });
}

async function buildFranchise(){

  const franchiseId = teamSelect.value;

  if(!franchiseId){
    tb.innerHTML = "";
    title.textContent = "Franchise History";
    tableData = [];
    return;
  }

  const franchise = franchises.find(f=>f.id === franchiseId);
  title.textContent = `Franchise History – ${franchise.name}`;
  loadingMsg.style.display = "block";
  tb.innerHTML = "";

  const results = await Promise.all(
    years.map(year =>
      fetch(`data/baseball/team_seasons/${year}.json`)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
        .then(seasonData => {
          if(!seasonData) return null;
          let W=0,L=0,RS=0,RA=0,played=false;
          franchise.codes.forEach(code=>{
            if(seasonData[code]){
              const data=seasonData[code];
              W+=data.W; L+=data.L; RS+=data.RS; RA+=data.RA;
              played=true;
            }
          });
          if(!played) return null;
          const PCT=(W+L)>0 ? +(W/(W+L)).toFixed(3) : 0;
          return {season:+year,W,L,PCT,RS,RA,DIFF:RS-RA};
        })
    )
  );

  tableData = results.filter(Boolean);
  tableData.sort((a,b)=>b.season-a.season);
  loadingMsg.style.display = "none";
  renderTable();
}

function renderTable(){
  tb.innerHTML="";
  tableData.forEach(row=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><a class="season-link" href="baseball-season.html?year=${row.season}">${row.season}</a></td>
      <td>${row.W}</td>
      <td>${row.L}</td>
      <td>${row.PCT.toFixed(3)}</td>
      <td>${row.RS}</td>
      <td>${row.RA}</td>
      <td>${row.DIFF}</td>
    `;
    tb.appendChild(tr);
  });
}

function sortTable(col){
  sortState[col] = sortState[col]==="desc" ? "asc" : "desc";
  tableData.sort((a,b)=>
    sortState[col]==="desc" ? b[col]-a[col] : a[col]-b[col]
  );
  renderTable();
}

init();

</script>

</body>
</html>
