<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Baseball Franchise | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  text-decoration:none;
  color:var(--ink);
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}

.page{
  max-width:1200px;
  margin:0 auto;
  padding:26px 20px 70px;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:32px 34px;
  border-radius:var(--radius);
  margin-bottom:16px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.hero h1{
  margin:0 0 16px;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(24px,4.5vw,36px);
  letter-spacing:.01em;
  text-transform:uppercase;
}

select{
  padding:9px 16px;
  font-family:var(--body);
  font-size:13px;
  font-weight:600;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  color:#fff;
  cursor:pointer;
}
select:focus{ outline:none;border-color:var(--accent); }

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 18px;
  margin-bottom:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}

th,td{
  padding:11px 12px;
  text-align:left;
  border-bottom:1px solid var(--line);
  font-size:13.5px;
}

th{
  background:#f7f9fb;
  color:var(--muted);
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
  user-select:none;
  transition:color .15s;
}

th:hover{
  color:var(--accent);
}

td{
  color:#27313c;
  font-variant-numeric:tabular-nums;
}

tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover td{ background:#f0f6ff; }

.back{
  font-weight:600;
  color:var(--ink);
  text-decoration:none;
  font-size:13.5px;
  opacity:.75;
  transition:opacity .15s,color .15s;
}
.back:hover{ opacity:1;color:var(--accent); }

.season-link{
  color:var(--ink);
  font-weight:700;
  text-decoration:none;
}
.season-link:hover{ color:var(--accent); }

.loading{
  padding:20px;
  font-weight:600;
  color:var(--muted);
  font-size:14px;
}
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-standings.html">Standings</a>
</nav>

<div class="page">

  <div class="hero">
    <div class="eyebrow">MLB</div>
    <h1 id="title">Franchise History</h1>
    <select id="teamSelect"></select>
  </div>

  <div class="card">
    <a class="back" href="baseball.html">← Back to Baseball</a>
  </div>

  <div id="loadingMsg" class="loading" style="display:none">Loading...</div>

  <table>
    <thead>
      <tr>
        <th data-col="season">Season</th>
        <th data-col="W">W</th>
        <th data-col="L">L</th>
        <th data-col="PCT">PCT</th>
        <th data-col="RS">RS</th>
        <th data-col="RA">RA</th>
        <th data-col="DIFF">DIFF</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>

</div>

<script>

const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
const teamSelect = document.getElementById("teamSelect");
const tb = document.getElementById("tb");
const title = document.getElementById("title");
const loadingMsg = document.getElementById("loadingMsg");

let years = [];
let franchises = [];
let tableData = [];
let sortState = {};

async function init(){
  years = await (await fetch(`${R2}/baseball/index.json`)).json();
  franchises = await (await fetch(`${R2}/baseball/teams.json`)).json();

  teamSelect.innerHTML = '<option value="">Select Franchise</option>';

  franchises.forEach(franchise=>{
    const opt = document.createElement("option");
    opt.value = franchise.id;
    opt.textContent = franchise.name;
    teamSelect.appendChild(opt);
  });

  teamSelect.addEventListener("change", buildFranchise);

  document.querySelectorAll("th").forEach(th=>{
    th.addEventListener("click", ()=>sortTable(th.dataset.col));
  });
}

async function buildFranchise(){

  const franchiseId = teamSelect.value;

  if(!franchiseId){
    tb.innerHTML = "";
    title.textContent = "Franchise History";
    tableData = [];
    return;
  }

  const franchise = franchises.find(f=>f.id === franchiseId);
  title.textContent = `Franchise History – ${franchise.name}`;
  loadingMsg.style.display = "block";
  tb.innerHTML = "";

  const results = await Promise.all(
    years.map(year =>
      fetch(`${R2}/baseball/team_seasons/${year}.json`)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
        .then(seasonData => {
          if(!seasonData) return null;
          let W=0,L=0,RS=0,RA=0,played=false;
          franchise.codes.forEach(code=>{
            if(seasonData[code]){
              const data=seasonData[code];
              W+=data.W; L+=data.L; RS+=data.RS; RA+=data.RA;
              played=true;
            }
          });
          if(!played) return null;
          const PCT=(W+L)>0 ? +(W/(W+L)).toFixed(3) : 0;
          return {season:+year,W,L,PCT,RS,RA,DIFF:RS-RA};
        })
    )
  );

  tableData = results.filter(Boolean);
  tableData.sort((a,b)=>b.season-a.season);
  loadingMsg.style.display = "none";
  renderTable();
}

function renderTable(){
  tb.innerHTML="";
  tableData.forEach(row=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><a class="season-link" href="baseball-season.html?year=${row.season}">${row.season}</a></td>
      <td>${row.W}</td>
      <td>${row.L}</td>
      <td>${row.PCT.toFixed(3)}</td>
      <td>${row.RS}</td>
      <td>${row.RA}</td>
      <td>${row.DIFF}</td>
    `;
    tb.appendChild(tr);
  });
}

function sortTable(col){
  sortState[col] = sortState[col]==="desc" ? "asc" : "desc";
  tableData.sort((a,b)=>
    sortState[col]==="desc" ? b[col]-a[col] : a[col]-b[col]
  );
  renderTable();
}

init();

</script>

</body>
</html>
