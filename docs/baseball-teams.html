<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1200px;margin:0 auto;padding:22px 18px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:30px;border-radius:22px;margin-bottom:14px;}
.hero h1{margin:0;font-size:40px;}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid #f1f1f1;}
th{background:#002D72;color:#fff;}
tbody tr:nth-child(even){background:#eaf3ff;}
tbody tr:hover{background:#d6e6ff;}
.link{color:#0056d6;font-weight:800;cursor:pointer;}
</style>
</head>
<body>

<div class="page">
  <div class="hero">
    <h1 id="title">Team</h1>
  </div>

  <div class="card" style="font-weight:800;">
    <a class="link" href="baseball.html">← Back to Baseball</a>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:90px;">Season</th>
        <th style="width:70px;">W</th>
        <th style="width:70px;">L</th>
        <th style="width:90px;">PCT</th>
        <th style="width:90px;">RS</th>
        <th style="width:90px;">RA</th>
        <th style="width:90px;">DIFF</th>
        <th style="width:140px;">Open</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>
</div>

<script>
const params = new URLSearchParams(location.search);
const team = params.get("team");

async function init(){
  const data = await (await fetch(`data/baseball/teams/${team}.json`)).json();
  document.getElementById("title").textContent = `${data.team_name} (${data.team_code})`;

  const tb = document.getElementById("tb");
  tb.innerHTML = "";

  data.seasons.slice().reverse().forEach(s=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s.season}</td>
      <td>${s.W}</td>
      <td>${s.L}</td>
      <td>${s.PCT}</td>
      <td>${s.RS}</td>
      <td>${s.RA}</td>
      <td>${s.DIFF}</td>
      <td><span class="link" data-year="${s.season}">View Season</span></td>
    `;
    tr.querySelector("[data-year]").onclick = ()=> location.href=`baseball-season.html?year=${s.season}`;
    tb.appendChild(tr);
  });
}

init();
</script>

</body>
</html>
