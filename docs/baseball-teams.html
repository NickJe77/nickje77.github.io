<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Franchises | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.page{
  max-width:1200px;
  margin:0 auto;
  padding:22px 18px;
}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:#fff;
  padding:30px;
  border-radius:22px;
  margin-bottom:18px;
}

.hero h1{
  margin:0 0 10px 0;
  font-size:38px;
}

.selector-wrap{
  margin-top:12px;
}

select{
  padding:10px 14px;
  font-size:16px;
  border-radius:8px;
  border:none;
  font-weight:700;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  font-weight:800;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

th,td{
  padding:10px;
  text-align:left;
  border-bottom:1px solid #f1f1f1;
}

th{
  background:#002D72;
  color:#fff;
}

tbody tr:nth-child(even){
  background:#eaf3ff;
}

tbody tr:hover{
  background:#d6e6ff;
}

.link{
  color:#0056d6;
  font-weight:800;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="page">

  <div class="hero">
    <h1 id="title">Select Franchise</h1>
    <div class="selector-wrap">
      <select id="teamSelect"></select>
    </div>
  </div>

  <div class="card">
    <a class="link" href="baseball.html">← Back to Baseball</a>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:90px;">Season</th>
        <th style="width:70px;">W</th>
        <th style="width:70px;">L</th>
        <th style="width:90px;">PCT</th>
        <th style="width:90px;">RS</th>
        <th style="width:90px;">RA</th>
        <th style="width:90px;">DIFF</th>
        <th style="width:140px;">Open</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>

</div>

<script>

const teamSelect = document.getElementById("teamSelect");
const tb = document.getElementById("tb");
const title = document.getElementById("title");

let allTeams = {};

async function init(){

  // Load franchise index file
  // This file should contain:
  // [
  //   { "team_code": "NYA", "team_name": "New York Yankees" },
  //   { "team_code": "BOS", "team_name": "Boston Red Sox" }
  // ]

  const res = await fetch("data/baseball/teams/index.json");
  const teams = await res.json();

  teams.sort((a,b)=>a.team_name.localeCompare(b.team_name));

  teams.forEach(t=>{
    const opt = document.createElement("option");
    opt.value = t.team_code;
    opt.textContent = t.team_name;
    teamSelect.appendChild(opt);
  });

  if(teams.length){
    loadTeam(teams[0].team_code);
  }

  teamSelect.onchange = ()=>{
    loadTeam(teamSelect.value);
  };
}

async function loadTeam(teamCode){

  const res = await fetch(`data/baseball/teams/${teamCode}.json`);
  const data = await res.json();

  title.textContent = `${data.team_name} (${data.team_code})`;

  tb.innerHTML = "";

  data.seasons
    .slice()
    .sort((a,b)=>b.season - a.season)
    .forEach(s=>{

      const diff = (s.RS ?? 0) - (s.RA ?? 0);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${s.season}</td>
        <td>${s.W}</td>
        <td>${s.L}</td>
        <td>${Number(s.PCT).toFixed(3)}</td>
        <td>${s.RS}</td>
        <td>${s.RA}</td>
        <td>${diff}</td>
        <td><span class="link" data-year="${s.season}">View Season</span></td>
      `;

      tr.querySelector("[data-year]").onclick =
        ()=> location.href=`baseball-season.html?year=${s.season}&team=${teamCode}`;

      tb.appendChild(tr);
    });
}

init();

</script>

</body>
</html>
