<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Franchise | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.page{
  max-width:1200px;
  margin:0 auto;
  padding:24px 18px;
}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:#fff;
  padding:36px;
  border-radius:22px;
  margin-bottom:16px;
}

.hero h1{
  margin:0 0 16px 0;
  font-size:38px;
}

select{
  padding:10px 14px;
  font-size:16px;
  border-radius:10px;
  border:none;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

th,td{
  padding:12px 10px;
  text-align:left;
  border-bottom:1px solid #eee;
}

th{
  background:#002D72;
  color:#fff;
}

tbody tr:nth-child(even){
  background:#eef5ff;
}

tbody tr:hover{
  background:#dce9ff;
}

.back{
  font-weight:700;
  color:#0056d6;
  text-decoration:none;
}
</style>
</head>
<body>

<div class="page">

  <div class="hero">
    <h1 id="title">Franchise History</h1>
    <select id="teamSelect"></select>
  </div>

  <div class="card">
    <a class="back" href="baseball.html">← Back to Baseball</a>
  </div>

  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>W</th>
        <th>L</th>
        <th>PCT</th>
        <th>RS</th>
        <th>RA</th>
        <th>DIFF</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>

</div>

<script>

const teamSelect = document.getElementById("teamSelect");
const tb = document.getElementById("tb");
const title = document.getElementById("title");

let years = [];
let teams = [];

async function init(){

  // Load seasons index
  years = await (await fetch("/data/baseball/index.json")).json();

  // Load teams list
  teams = await (await fetch("/data/baseball/teams.json")).json();

  teamSelect.innerHTML = '<option value="">Select Franchise</option>';

  teams.forEach(t=>{
    const opt = document.createElement("option");
    opt.value = t.code;
    opt.textContent = t.name;
    teamSelect.appendChild(opt);
  });

  teamSelect.addEventListener("change", buildFranchise);

}

async function buildFranchise(){

  const code = teamSelect.value;
  if(!code){
    tb.innerHTML = "";
    title.textContent = "Franchise History";
    return;
  }

  const teamName = teams.find(t=>t.code === code)?.name || code;
  title.textContent = `Franchise History – ${teamName}`;

  tb.innerHTML = "";

  for(const year of years){

    try{

      const seasonData = await (await fetch(`/data/baseball/team_seasons/${year}.json`)).json();

      if(!seasonData[code]) continue;

      const data = seasonData[code];

      const W = data.W;
      const L = data.L;
      const RS = data.RS;
      const RA = data.RA;

      const PCT = (W + L) > 0 ? (W / (W + L)).toFixed(3) : "0.000";
      const DIFF = RS - RA;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${year}</td>
        <td>${W}</td>
        <td>${L}</td>
        <td>${PCT}</td>
        <td>${RS}</td>
        <td>${RA}</td>
        <td>${DIFF}</td>
      `;

      tb.appendChild(tr);

    }catch(e){
      // ignore missing years
    }

  }

}

init();

</script>

</body>
</html>
