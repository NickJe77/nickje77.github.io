<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Event | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:var(--body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:15px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
  font-weight:600;
  font-size:13.5px;
  flex-wrap:wrap;
}

.navbar a{
  text-decoration:none;
  color:var(--ink);
  opacity:.7;
  transition:opacity .15s,color .15s;
}

.navbar a:hover{opacity:1;color:var(--accent);}

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:36px 20px;
  text-align:center;
}

.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;
  text-transform:uppercase;
}

.gender-toggle{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:16px;
}

.gender-toggle a{
  padding:8px 18px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.3);
  text-decoration:none;
  font-weight:600;
  font-size:13px;
  color:#fff;
  font-family:var(--body);
}

.gender-toggle a.active{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--ink);
}

.page{max-width:1000px;margin:0 auto;padding:26px 20px 70px;}
.table-wrap{
  overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
}
table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#f7f9fb;
  color:var(--muted);
  padding:11px 14px;
  text-align:left;
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  border-bottom:1px solid var(--line);
}

td{
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  text-align:center;
  font-size:13.5px;
  color:#27313c;
}

td:first-child{text-align:left;}

tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}

.winner{
  font-weight:700;
  color:#1e7a3d;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
</div>

<div class="hero">
  <h1 id="title"></h1>
  <div class="gender-toggle" id="genderToggle"></div>
</div>

<div class="page">
<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Round</th>
  <th>Player 1</th>
  <th>Player 2</th>
  <th>Score</th>
</tr>
</thead>
<tbody id="matches"></tbody>
</table>
</div>
</div>

<script>

// -------------------------
const params = new URLSearchParams(window.location.search);

const tournament = decodeURIComponent(params.get("tournament") || "");
const year = params.get("year") || new Date().getFullYear();
const gender = params.get("gender") || "male";

document.getElementById("title").textContent =
  `${tournament} ${year}`;

// -------------------------
function buildGenderToggle(){
  const container = document.getElementById("genderToggle");
  const base = `?tournament=${encodeURIComponent(tournament)}&year=${year}`;

  container.innerHTML = `
    <a href="${base}&gender=male" class="${gender==="male"?"active":""}">Male</a>
    <a href="${base}&gender=female" class="${gender==="female"?"active":""}">Female</a>
  `;
}
buildGenderToggle();

// -------------------------
function clean(t){
  return (t || "").toLowerCase().trim();
}

// -------------------------
function genderMatch(g){

  if(!g) return true;

  g = clean(g);

  if(g === "m" || g === "men") return gender === "male";
  if(g === "f" || g === "women") return gender === "female";

  return g === gender;
}

// -------------------------
fetch(`/data/tennis/seasons/${year}.json`)
.then(r => {
  if(!r.ok) throw new Error("Fetch failed");
  return r.json();
})
.then(data => {

  const allMatches = Array.isArray(data) ? data : (data.matches || []);

  const matches = allMatches.filter(m => {

    const tName =
      m.tournament ||
      m.event ||
      m.tourney ||
      m.event_name ||
      "";

    return (
      clean(tName).includes(clean(tournament)) &&
      genderMatch(m.gender)
    );

  });

  buildTable(matches, allMatches);

})
.catch(err => {
  console.error("ERROR LOADING DATA:", err);
});

// -------------------------
function getWinner(score){

  if(!score) return "";

  let p1Sets = 0;
  let p2Sets = 0;

  score.split(" ").forEach(set=>{
    const [a,b] = set.split("-");
    if(!a || !b) return;

    if(parseInt(a) > parseInt(b)) p1Sets++;
    else p2Sets++;
  });

  return p1Sets > p2Sets ? "p1" : "p2";
}

// -------------------------
function buildTable(matches, allMatches){

  const tbody = document.getElementById("matches");
  tbody.innerHTML = "";

  // detect if tournament exists at all
  const tournamentExists = allMatches.some(m => {
    const tName =
      m.tournament ||
      m.event ||
      m.tourney ||
      m.event_name ||
      "";

    return clean(tName).includes(clean(tournament));
  });

  // -------------------------
  // NOT PLAYED YET
  // -------------------------
  if(matches.length === 0 && tournamentExists){
    tbody.innerHTML = `
      <tr>
        <td colspan="4" style="padding:30px;font-weight:600;">
          Tournament not played yet
        </td>
      </tr>
    `;
    return;
  }

  // -------------------------
  // NOT FOUND
  // -------------------------
  if(matches.length === 0){
    tbody.innerHTML = `
      <tr>
        <td colspan="4" style="padding:30px;font-weight:600;">
          Tournament not found
        </td>
      </tr>
    `;
    return;
  }

  // -------------------------
  // NORMAL
  // -------------------------
  matches.forEach(m => {

    const p1 = m.player1 || m.winner || m.p1 || "";
    const p2 = m.player2 || m.loser || m.p2 || "";
    const score = m.score || "";

    const winner = getWinner(score);

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${m.round || ""}</td>
      <td class="${winner==="p1"?"winner":""}">${p1}</td>
      <td class="${winner==="p2"?"winner":""}">${p2}</td>
      <td>${score}</td>
    `;

    tbody.appendChild(tr);

  });

}
</script>

</body>
</html>
