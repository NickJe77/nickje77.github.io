<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tennis Event | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui,Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{text-align:center;}

.navbar{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:15px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

/* TABLE */
table{
  width:100%;
  max-width:900px;
  margin:30px auto;
  border-collapse:collapse;
}

th{
  background:#111;
  color:#fff;
  padding:10px;
}

td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

td:first-child{
  text-align:left;
}

tbody tr:nth-child(even){
  background:#f2f6ff;
}

.winner{
  font-weight:700;
  color:#0a7f2e;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./tennis.html">Tennis</a>
</div>

<h1 id="title"></h1>

<table>
<thead>
<tr>
  <th>Round</th>
  <th>Player 1</th>
  <th>Player 2</th>
  <th>Score</th>
</tr>
</thead>
<tbody id="matches"></tbody>
</table>

<script>

// -------------------------
// GET PARAMS
// -------------------------
const params = new URLSearchParams(window.location.search);
const tournament = params.get("tournament");
const year = params.get("year");

// -------------------------
document.getElementById("title").textContent =
  `${tournament} ${year}`;

// -------------------------
// LOAD DATA
// -------------------------
fetch(`/data/tennis/matches/${year}.json`)
.then(r => r.json())
.then(data => {

  const matches = data.filter(m =>
    m.tournament === tournament
  );

  buildTable(matches);

});

// -------------------------
function buildTable(matches){

  const tbody = document.getElementById("matches");

  matches.forEach(m => {

    const tr = document.createElement("tr");

    const winner =
      m.winner === m.player1 ? "p1" :
      m.winner === m.player2 ? "p2" : "";

    tr.innerHTML = `
      <td>${m.round}</td>
      <td class="${winner==="p1"?"winner":""}">${m.player1}</td>
      <td class="${winner==="p2"?"winner":""}">${m.player2}</td>
      <td>${m.score || ""}</td>
    `;

    tbody.appendChild(tr);

  });

}
</script>

</body>
</html>
