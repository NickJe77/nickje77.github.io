<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Event | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui,Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{text-align:center;}

.gender-toggle{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

.gender-toggle a{
  padding:6px 14px;
  border-radius:20px;
  border:1px solid #0056d6;
  text-decoration:none;
  font-weight:600;
  color:#0056d6;
}

.gender-toggle a.active{
  background:#0056d6;
  color:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:15px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

table{
  width:100%;
  max-width:900px;
  margin:30px auto;
  border-collapse:collapse;
}

th{
  background:#111;
  color:#fff;
  padding:10px;
}

td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

td:first-child{text-align:left;}

tbody tr:nth-child(even){
  background:#f2f6ff;
}

.winner{
  font-weight:700;
  color:#0a7f2e;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./tennis.html">Tennis</a>
</div>

<h1 id="title"></h1>

<div class="gender-toggle" id="genderToggle"></div>

<table>
<thead>
<tr>
  <th>Round</th>
  <th>Player 1</th>
  <th>Player 2</th>
  <th>Score</th>
</tr>
</thead>
<tbody id="matches"></tbody>
</table>

<script>

// -------------------------
const params = new URLSearchParams(window.location.search);

const tournament = decodeURIComponent(params.get("tournament") || "");
const year = params.get("year") || new Date().getFullYear();
const gender = params.get("gender") || "male";

document.getElementById("title").textContent =
  `${tournament} ${year}`;

// -------------------------
function buildGenderToggle(){
  const container = document.getElementById("genderToggle");
  const base = `?tournament=${encodeURIComponent(tournament)}&year=${year}`;

  container.innerHTML = `
    <a href="${base}&gender=male" class="${gender==="male"?"active":""}">Male</a>
    <a href="${base}&gender=female" class="${gender==="female"?"active":""}">Female</a>
  `;
}
buildGenderToggle();

// -------------------------
function clean(t){
  return (t || "").toLowerCase().trim();
}

// -------------------------
function genderMatch(g){

  if(!g) return true;

  g = clean(g);

  if(g === "m" || g === "men") return gender === "male";
  if(g === "f" || g === "women") return gender === "female";

  return g === gender;
}

// -------------------------
fetch(`/data/tennis/seasons/${year}.json`)
.then(r => {
  if(!r.ok) throw new Error("Fetch failed");
  return r.json();
})
.then(data => {

  const allMatches = Array.isArray(data) ? data : (data.matches || []);

  const matches = allMatches.filter(m => {

    const tName =
      m.tournament ||
      m.event ||
      m.tourney ||
      m.event_name ||
      "";

    return (
      clean(tName).includes(clean(tournament)) &&
      genderMatch(m.gender)
    );

  });

  buildTable(matches, allMatches);

})
.catch(err => {
  console.error("ERROR LOADING DATA:", err);
});

// -------------------------
function getWinner(score){

  if(!score) return "";

  let p1Sets = 0;
  let p2Sets = 0;

  score.split(" ").forEach(set=>{
    const [a,b] = set.split("-");
    if(!a || !b) return;

    if(parseInt(a) > parseInt(b)) p1Sets++;
    else p2Sets++;
  });

  return p1Sets > p2Sets ? "p1" : "p2";
}

// -------------------------
function buildTable(matches, allMatches){

  const tbody = document.getElementById("matches");
  tbody.innerHTML = "";

  // detect if tournament exists at all
  const tournamentExists = allMatches.some(m => {
    const tName =
      m.tournament ||
      m.event ||
      m.tourney ||
      m.event_name ||
      "";

    return clean(tName).includes(clean(tournament));
  });

  // -------------------------
  // NOT PLAYED YET
  // -------------------------
  if(matches.length === 0 && tournamentExists){
    tbody.innerHTML = `
      <tr>
        <td colspan="4" style="padding:30px;font-weight:600;">
          Tournament not played yet
        </td>
      </tr>
    `;
    return;
  }

  // -------------------------
  // NOT FOUND
  // -------------------------
  if(matches.length === 0){
    tbody.innerHTML = `
      <tr>
        <td colspan="4" style="padding:30px;font-weight:600;">
          Tournament not found
        </td>
      </tr>
    `;
    return;
  }

  // -------------------------
  // NORMAL
  // -------------------------
  matches.forEach(m => {

    const p1 = m.player1 || m.winner || m.p1 || "";
    const p2 = m.player2 || m.loser || m.p2 || "";
    const score = m.score || "";

    const winner = getWinner(score);

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${m.round || ""}</td>
      <td class="${winner==="p1"?"winner":""}">${p1}</td>
      <td class="${winner==="p2"?"winner":""}">${p2}</td>
      <td>${score}</td>
    `;

    tbody.appendChild(tr);

  });

}
</script>

</body>
</html>
