<!DOCTYPE html>
<html>
<head>
<title>Australian Cup Winners</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="./css/racing.css">

<style>
body{font-family:Arial;margin:0;background:white;}

.navbar{text-align:center;padding:16px 0;border-bottom:1px solid #ddd;}
.navbar a{margin:0 18px;text-decoration:none;font-size:18px;font-weight:600;color:#0056d6;}
.navbar a:hover{text-decoration:underline;}

.filter-bar{
max-width:900px;margin:20px auto;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;padding:0 20px;
}

input,select{
height:36px;padding:6px 10px;border-radius:6px;border:1px solid #ccc;width:100%;
box-sizing:border-box;
}

.suggestions{
position:absolute;background:white;border:1px solid #ccc;
max-height:160px;overflow:auto;z-index:9999;width:100%;
}

.suggestions div{padding:6px 10px;cursor:pointer;}
.suggestions div:hover{background:#eaf3ff;}

table{max-width:900px;margin:auto;width:100%;border-collapse:collapse;}
th{background:#f3f8ff;padding:10px;}
td{padding:9px;border-bottom:1px solid #e1ecfa;}
tr:nth-child(even){background:#f7fbff;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
<a href="f1.html">F1</a>
</div>

<h1 style="text-align:center">Australian Cup Winners</h1>

<div class="filter-bar">
<select id="yearFilter"><option value="">Year</option></select>

<div>
<input id="winnerFilter" placeholder="Winner">
<div class="suggestions" id="winnerSug"></div>
</div>

<div>
<input id="jockeyFilter" placeholder="Jockey">
<div class="suggestions" id="jockeySug"></div>
</div>

<div>
<input id="trainerFilter" placeholder="Trainer">
<div class="suggestions" id="trainerSug"></div>
</div>
</div>

<table>
<thead><tr><th>Year</th><th>Winner</th><th>Jockey</th><th>Trainer</th></tr></thead>
<tbody id="body"></tbody>
</table>

<script>
const safe=v=>(v||"").toString().toLowerCase().trim();
let all=[];

function isWinner(val){
 const v=safe(val);
 return v==="1"||v==="1st"||v==="first"||v==="winner"||v==="win"||v==="01"||v==="1.0";
}

fetch("./data/vic-g1.json").then(r=>r.json()).then(d=>{
all=d.filter(r=>
 safe(r.race).includes("australian cup") &&
 isWinner(r.finish)
).sort((a,b)=>b.year-a.year);

[...new Set(all.map(r=>r.year))].forEach(y=>yearFilter.innerHTML+=`<option>${y}</option>`);

setupPredictive(winnerFilter,winnerSug,[...new Set(all.map(r=>r.horse))]);
setupPredictive(jockeyFilter,jockeySug,[...new Set(all.map(r=>r.jockey))]);
setupPredictive(trainerFilter,trainerSug,[...new Set(all.map(r=>r.trainer))]);

render(all);
});

function render(rows){
body.innerHTML=rows.map(r=>`<tr><td>${r.year}</td><td>${r.horse}</td><td>${r.jockey}</td><td>${r.trainer}</td></tr>`).join("");
}

function apply(){
render(all.filter(r=>
(!yearFilter.value||r.year==yearFilter.value)&&
(!winnerFilter.value||safe(r.horse).includes(safe(winnerFilter.value)))&&
(!jockeyFilter.value||safe(r.jockey).includes(safe(jockeyFilter.value)))&&
(!trainerFilter.value||safe(r.trainer).includes(safe(trainerFilter.value)))
));
}

yearFilter.onchange=winnerFilter.oninput=jockeyFilter.oninput=trainerFilter.oninput=apply;

function setupPredictive(input,box,list){
input.addEventListener("input",()=>{
 const v=safe(input.value);
 box.innerHTML="";
 if(!v)return;
 list.filter(x=>safe(x).includes(v)).slice(0,20).forEach(x=>{
  const d=document.createElement("div");
  d.textContent=x;
  d.onclick=()=>{input.value=x;box.innerHTML="";apply();}
  box.appendChild(d);
 });
});
document.addEventListener("click",e=>{if(!box.contains(e.target)&&e.target!==input)box.innerHTML="";});
}
</script>

</body>
</html>
