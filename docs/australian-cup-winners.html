<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Australian Cup Winners | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./css/racing.css">

<style>
body{background:#fff;font-family:Arial,Helvetica,sans-serif;margin:0;}
.navbar{text-align:center;padding:16px 0;border-bottom:1px solid #ddd;}
.navbar a{margin:0 18px;text-decoration:none;font-size:18px;font-weight:600;color:#0056d6;}

h1{text-align:center;margin:30px 0 10px;}

.filter-bar{
max-width:900px;margin:20px auto;
display:grid;grid-template-columns:1fr 2fr 2fr 2fr;
gap:16px;padding:0 20px;
}
.filter-bar input,.filter-bar select{
width:100%;height:36px;padding:6px 10px;
border-radius:6px;border:1px solid #ccc;font-size:14px;
}

table{max-width:900px;margin:auto;width:100%;border-collapse:collapse;}
th{background:#f3f8ff;padding:10px;border-bottom:1px solid #cfe0f5;text-align:left;}
td{padding:9px 10px;border-bottom:1px solid #e1ecfa;}
tr:nth-child(even){background:#f7fbff;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
<a href="f1.html">F1</a>
</div>

<h1>Australian Cup Winners</h1>

<div class="filter-bar">
<select id="yearFilter"><option value="">All</option></select>
<input id="winnerFilter" list="winnerList" placeholder="Winner">
<input id="jockeyFilter" list="jockeyList" placeholder="Jockey">
<input id="trainerFilter" list="trainerList" placeholder="Trainer">
</div>

<datalist id="winnerList"></datalist>
<datalist id="jockeyList"></datalist>
<datalist id="trainerList"></datalist>

<table>
<thead><tr><th>Year</th><th>Winner</th><th>Jockey</th><th>Trainer</th></tr></thead>
<tbody id="body"></tbody>
</table>

<script>
const safe=v=>(v||"").toLowerCase();
let all=[];

fetch("./data/vic-g1.json").then(r=>r.json()).then(d=>{
all=d.filter(r=>safe(r.race).includes("australian cup") && ["1","1st","01"].includes(safe(r.finish)))
.sort((a,b)=>b.year-a.year);

[...new Set(all.map(r=>r.year))].forEach(y=>yearFilter.innerHTML+=`<option>${y}</option>`);

winnerList.innerHTML=[...new Set(all.map(r=>r.horse))].map(v=>`<option value="${v}">`).join("");
jockeyList.innerHTML=[...new Set(all.map(r=>r.jockey))].map(v=>`<option value="${v}">`).join("");
trainerList.innerHTML=[...new Set(all.map(r=>r.trainer))].map(v=>`<option value="${v}">`).join("");

render(all);
});

function render(rows){
body.innerHTML=rows.map(r=>`<tr><td>${r.year}</td><td>${r.horse}</td><td>${r.jockey}</td><td>${r.trainer}</td></tr>`).join("");
}

function apply(){
render(all.filter(r=>
(!yearFilter.value||r.year==yearFilter.value)&&
(!winnerFilter.value||safe(r.horse).includes(safe(winnerFilter.value)))&&
(!jockeyFilter.value||safe(r.jockey).includes(safe(jockeyFilter.value)))&&
(!trainerFilter.value||safe(r.trainer).includes(safe(trainerFilter.value)))
));
}

yearFilter.onchange=winnerFilter.oninput=jockeyFilter.oninput=trainerFilter.oninput=apply;
</script>

</body>
</html>
