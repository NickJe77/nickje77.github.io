<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UEFA Champions League Finals Results</title>
<link rel="stylesheet" href="../css/racing.css">
<style>
body { font-family: Arial; background:#fff; }
table { border-collapse: collapse; width:100%; }
th, td { border:1px solid #ddd; padding:8px; text-align:center; }
th { background:#0056d6; color:white; }
</style>
</head>
<body>

<h1>UEFA Champions League Finals</h1>

<table id="results">
<thead>
<tr>
<th>Season</th>
<th>Home</th>
<th>Away</th>
<th>Score</th>
<th>Winner</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
fetch("../data/ucl_finals_with_winners_fixed.json")
.then(r => r.json())
.then(data => {
  const tbody = document.querySelector("#results tbody");
  data.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.season}</td>
      <td>${r.home}</td>
      <td>${r.away}</td>
      <td>${r.home_goals} - ${r.away_goals}</td>
      <td>${r.winner || ""}</td>
    `;
    tbody.appendChild(tr);
  });
});
</script>

</body>
</html>
