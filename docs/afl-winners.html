<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Winners & Awards | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --board-line:rgba(255,255,255,.10);
  --accent:#e0b94a;
  --accent-soft:rgba(224,185,74,.18);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

.page-wrap{max-width:900px;margin:0 auto;padding:26px 20px 70px;}

h1{
  font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,38px);
  letter-spacing:.01em;text-transform:uppercase;text-align:center;margin:6px 0 24px;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:26px 26px 30px;text-align:center;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:8px;
}
.hero h1{color:#fff;margin:0;}

.year-select{
  display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:26px;
  font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;
}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}

.section{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-top:20px;
}
.section-head{
  padding:15px 18px;border-bottom:1px solid var(--line);
  font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);background:#f7f9fb;
}

.row{
  display:grid;grid-template-columns:1fr 1fr;padding:15px 18px;border-bottom:1px solid var(--line);
  align-items:center;
}
.row:last-child{border-bottom:none;}
.row .label{
  font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.02em;color:var(--muted);
  text-transform:uppercase;
}
.row .value{font-size:14.5px;color:var(--ink);}
.placeholder{color:var(--faint);font-style:italic;}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html" class="current">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</nav>

<div class="page-wrap">

<div class="hero">
  <div class="eyebrow">AFL</div>
  <h1>Winners &amp; Awards</h1>
</div>

<div class="year-select">
  Season
  <select id="yearSelect"></select>
</div>

<div class="section">
  <div class="section-head">Team Honours</div>
  <div class="row"><div class="label">Premiers</div><div class="value placeholder" id="premier">—</div></div>
  <div class="row"><div class="label">Runner-up</div><div class="value placeholder" id="runnerUp">—</div></div>
  <div class="row"><div class="label">Minor Premiers</div><div class="value placeholder" id="minorPremier">—</div></div>
</div>

<div class="section">
  <div class="section-head">Individual Awards</div>
  <div class="row"><div class="label">Brownlow Medal</div><div class="value placeholder" id="brownlow">—</div></div>
  <div class="row"><div class="label">Norm Smith Medal</div><div class="value placeholder" id="normSmith">—</div></div>
  <div class="row"><div class="label">Coleman Medal</div><div class="value placeholder" id="coleman">—</div></div>
  <div class="row"><div class="label">Rising Star</div><div class="value placeholder" id="risingStar">—</div></div>
  <div class="row"><div class="label">AFLPA MVP</div><div class="value placeholder" id="aflpaMvp">—</div></div>
</div>

</div>

<script>
const files = {
  team: "data/afl/Premiers & Minor Premiers.csv",
  brownlow: "data/afl/Brownlow.csv",
  norm: "data/afl/Norm Smith Medal.csv",
  coleman: "data/afl/Coleman Medal.csv",
  rising: "data/afl/Rising Star.csv",
  aflpa: "data/afl/AFLPA - MVP.csv"
};

let data = {
  team: [],
  brownlow: [],
  norm: [],
  coleman: [],
  rising: [],
  aflpa: []
};

const yearSelect = document.getElementById("yearSelect");

function parseCSV(text){
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",").map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const parts = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    let obj = {};
    headers.forEach((h,i)=>{
      obj[h.replace(/\u00A0/g,"").trim()] =
        (parts[i]||"").replace(/^"|"$/g,"").trim();
    });
    return obj;
  });
}

function normaliseTeam(name){
  if(!name) return "";
  const map = {
    "Kangaroos": "North Melbourne",
    "North Melbourne Kangaroos": "North Melbourne",
    "Footscray": "Western Bulldogs"
  };
  return map[name] || name;
}

function playerWithTeam(r){
  const team = normaliseTeam(r.Team || r.Club || "");
  if(team) return r.Player + " (" + team + ")";
  return r.Player;
}

Promise.all([
  fetch(files.team).then(r=>r.text()),
  fetch(files.brownlow).then(r=>r.text()),
  fetch(files.norm).then(r=>r.text()),
  fetch(files.coleman).then(r=>r.text()),
  fetch(files.rising).then(r=>r.text()),
  fetch(files.aflpa).then(r=>r.text())
]).then(([team,brownlow,norm,coleman,rising,aflpa])=>{
  data.team = parseCSV(team);
  data.brownlow = parseCSV(brownlow);
  data.norm = parseCSV(norm);
  data.coleman = parseCSV(coleman);
  data.rising = parseCSV(rising);
  data.aflpa = parseCSV(aflpa);

  const years = new Set();
  Object.values(data).flat().forEach(r=>{
    if(r.Year && !r.Year.includes("replay")) years.add(r.Year);
  });

  [...years].sort((a,b)=>b-a).forEach(y=>{
    const opt=document.createElement("option");
    opt.value=y;
    opt.textContent=y;
    yearSelect.appendChild(opt);
  });

  loadYear(yearSelect.value);
});

yearSelect.onchange = () => loadYear(yearSelect.value);

function multi(list){
  if(!list.length) return "—";
  return list.join(", ");
}

function setField(id, text){
  const el = document.getElementById(id);
  el.textContent = text;
  el.classList.toggle("placeholder", text === "—" || !text);
}

function loadYear(year){
  let team = data.team.find(r=>r.Year===year);

  if(year === "2010"){
    const replay = data.team.find(r=>r.Year==="2010 (replay)");
    if(replay) team = replay;
  }

  team = team || {};

  setField("premier", normaliseTeam(team["Winner"]) || "—");
  setField("runnerUp", normaliseTeam(team["Runner-up"]) || "—");
  setField("minorPremier", normaliseTeam(team["Minor Premier"]) || "—");

  setField("brownlow",
    multi(data.brownlow.filter(r=>r.Year===year).map(playerWithTeam)));

  setField("normSmith",
    multi(data.norm.filter(r=>r.Year===year).map(r=>{
      return (r.Recipient || r.Player) + " (" + normaliseTeam(r.Team || r.Club || "") + ")";
    })));

  setField("coleman",
    multi(data.coleman.filter(r=>r.Year===year)
      .map(r=>{
        const team = normaliseTeam(r.Team || r.Club || "");
        return r.Player + " (" + r.Goals + (team ? ", " + team : "") + ")";
      })));

  setField("risingStar",
    multi(data.rising.filter(r=>r.Year===year).map(playerWithTeam)));

  setField("aflpaMvp",
    multi(data.aflpa.filter(r=>r.Year===year).map(playerWithTeam)));
}
</script>

</body>
</html>
