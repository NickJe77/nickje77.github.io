<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prix de l’Arc de Triomphe Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="racing.css">

  <style>
    .g1-hero {
      position: relative;
      max-width: 1200px;
      margin: 36px auto 40px;
      padding: 0 24px;
    }

    .g1-hero img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .g1-hero-text {
      position: absolute;
      left: 48px;
      bottom: 36px;
    }

    .g1-hero-text h1 {
      margin: 0;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 4px 14px rgba(0,0,0,0.55);
    }

    .filters {
      max-width: 1200px;
      margin: 0 auto 30px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .archive-table {
      max-width: 1200px;
      margin: 0 auto 80px;
      padding: 0 24px;
      border: 1px solid #d6e4f2;
      border-radius: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #e1e8f0;
    }

    thead { background: #f3f7fc; }
    tbody tr:nth-child(even) { background: #f5f9ff; }
  </style>
</head>

<body>

<nav class="home-nav">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="major-carnivals.html">Major Carnivals</a>
  <a href="arc.html" class="active">Arc</a>
</nav>

<div class="g1-hero">
  <img src="images/arc-hero.jpg" alt="Prix de l’Arc de Triomphe">
  <div class="g1-hero-text">
    <h1>Prix de l’Arc de Triomphe</h1>
  </div>
</div>

<div class="filters">
  <div>
    <label>Year</label>
    <select id="yearFilter">
      <option value="">All</option>
    </select>
  </div>

  <div>
    <label>Race</label>
    <input id="raceFilter" list="raceList" placeholder="Race">
    <datalist id="raceList"></datalist>
  </div>

  <div>
    <label>Winner</label>
    <input id="winnerFilter" list="winnerList" placeholder="Horse">
    <datalist id="winnerList"></datalist>
  </div>

  <div>
    <label>Jockey</label>
    <input id="jockeyFilter" list="jockeyList" placeholder="Jockey">
    <datalist id="jockeyList"></datalist>
  </div>
</div>

<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
        <th>SP</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="arc.js"></script>

</body>
</html>
