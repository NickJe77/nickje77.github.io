<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Bundesliga Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --board-line:rgba(255,255,255,.10);
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --league:#c99a3d;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:44px 20px;text-align:center;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0 0 10px;font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,46px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero p{margin:0;font-size:14.5px;color:rgba(255,255,255,.65);}

.container{max-width:1400px;margin:0 auto;padding:26px 20px 70px;}

.search-wrap{margin-bottom:22px;display:flex;justify-content:center;}
#teamSearch{
  width:100%;max-width:480px;padding:12px 18px;font-size:14px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);outline:none;
  font-family:var(--body);font-weight:600;color:var(--ink);
}
#teamSearch:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

.team-count{margin-bottom:20px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.03em;}

.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}

.team-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  text-decoration:none;color:var(--ink);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
  display:block;
}
.team-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(10,16,24,.2);border-color:var(--faint);}

.team-band{height:6px;width:100%;}

.team-content{padding:20px 20px 22px;}
.team-name{
  font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:8px;line-height:1.15;
  letter-spacing:.01em;text-transform:uppercase;color:var(--ink);
}
.team-meta{font-size:13px;color:var(--muted);font-weight:600;}

.no-results{text-align:center;font-family:var(--display);font-size:18px;letter-spacing:.01em;text-transform:uppercase;padding:60px 20px;color:var(--muted);display:none;}

@media(max-width:900px){
  .team-name{font-size:17px;}
}
</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/bundesliga.html">Bundesliga</a>
<a href="/bundesliga-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div class="hero">
<div class="eyebrow">Football</div>
<h1>Bundesliga Teams</h1>
<p>Every club to play in the Bundesliga</p>
</div>

<div class="container">

<div class="search-wrap">
<input type="text" id="teamSearch" placeholder="Search teams...">
</div>

<div class="team-count" id="teamCount"></div>

<div class="teams-grid" id="teamsGrid"></div>

<div class="no-results" id="noResults">No teams found</div>

</div>

<script>

const TEAMS = [

{ name:"Augsburg",                  colour:"linear-gradient(90deg,#BA3733,#007A3D)" },
{ name:"Bayern Munich",             colour:"linear-gradient(90deg,#DC052D,#0066B2)" },
{ name:"Bayer Leverkusen",          colour:"linear-gradient(90deg,#E32221,#000000)" },
{ name:"Borussia Dortmund",         colour:"linear-gradient(90deg,#FDE100,#000000)" },
{ name:"Borussia Mönchengladbach",  colour:"linear-gradient(90deg,#000000,#ffffff)" },
{ name:"Darmstadt 98",              colour:"linear-gradient(90deg,#003F86,#ffffff)" },
{ name:"Eintracht Frankfurt",       colour:"linear-gradient(90deg,#E1000F,#000000)" },
{ name:"Hamburger SV",              colour:"linear-gradient(90deg,#0B4EA2,#ffffff)" },
{ name:"Hannover 96",               colour:"linear-gradient(90deg,#009F4D,#000000)" },
{ name:"Heidenheim",                colour:"linear-gradient(90deg,#E8000D,#003F86)" },
{ name:"Hertha Berlin",             colour:"linear-gradient(90deg,#003CA6,#ffffff)" },
{ name:"Hoffenheim",                colour:"linear-gradient(90deg,#1961AC,#ffffff)" },
{ name:"Holstein Kiel",             colour:"linear-gradient(90deg,#D00B16,#003D8F)" },
{ name:"Köln",                      colour:"linear-gradient(90deg,#FF0000,#ffffff)" },
{ name:"Mainz 05",                  colour:"linear-gradient(90deg,#C3001E,#ffffff)" },
{ name:"RB Leipzig",                colour:"linear-gradient(90deg,#DD0741,#001A3C)" },
{ name:"SC Freiburg",               colour:"linear-gradient(90deg,#E8000D,#000000)" },
{ name:"Schalke 04",                colour:"linear-gradient(90deg,#004D9D,#ffffff)" },
{ name:"St. Pauli",                 colour:"linear-gradient(90deg,#5B1213,#ffffff)" },
{ name:"Union Berlin",              colour:"linear-gradient(90deg,#EB1923,#005CA9)" },
{ name:"VfB Stuttgart",             colour:"linear-gradient(90deg,#E32219,#ffffff)" },
{ name:"Werder Bremen",             colour:"linear-gradient(90deg,#1D9053,#ffffff)" },
{ name:"Wolfsburg",                 colour:"linear-gradient(90deg,#65B32E,#003F2D)" },

];

const grid      = document.getElementById("teamsGrid");
const search    = document.getElementById("teamSearch");
const count     = document.getElementById("teamCount");
const noResults = document.getElementById("noResults");

function renderTeams(filter=""){

  grid.innerHTML = "";

  const filtered = TEAMS
    .sort((a,b) => a.name.localeCompare(b.name))
    .filter(team => team.name.toLowerCase().includes(filter.toLowerCase()));

  count.innerHTML = `${filtered.length} Teams`;

  if(filtered.length === 0){
    noResults.style.display = "block";
    return;
  }

  noResults.style.display = "none";

  filtered.forEach(team => {
    grid.innerHTML += `
      <a class="team-card" href="/bundesliga-team.html?team=${encodeURIComponent(team.name)}">
        <div class="team-band" style="background:${team.colour};"></div>
        <div class="team-content">
          <div class="team-name">${team.name}</div>
          <div class="team-meta">View club stats, results and players</div>
        </div>
      </a>
    `;
  });

}

search.addEventListener("input", e => renderTeams(e.target.value));

renderTeams();

</script>

</body>
</html>
