<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Bundesliga Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:700;
color:#0056d6;
}

.hero{
background:linear-gradient(135deg,#d20515,#a50010);
color:white;
padding:70px 20px;
text-align:center;
}

.hero h1{
margin:0;
font-size:64px;
font-weight:900;
}

.hero p{
margin-top:14px;
font-size:22px;
font-weight:600;
opacity:.95;
}

.container{
max-width:1600px;
margin:40px auto;
padding:0 20px;
}

.search-wrap{
margin-bottom:28px;
display:flex;
justify-content:center;
}

#teamSearch{
width:100%;
max-width:520px;
padding:16px 18px;
font-size:18px;
border-radius:14px;
border:1px solid #d7dbe3;
outline:none;
font-family:Inter,system-ui,Arial,sans-serif;
font-weight:600;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

#teamSearch:focus{
border-color:#d20515;
box-shadow:0 0 0 4px rgba(210,5,21,.15);
}

.team-count{
margin-bottom:24px;
font-size:18px;
font-weight:700;
color:#555;
text-align:center;
}

.teams-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:24px;
}

.team-card{
background:white;
border-radius:18px;
overflow:hidden;
text-decoration:none;
color:#111;
box-shadow:0 2px 10px rgba(0,0,0,.08);
transition:.2s ease;
display:block;
}

.team-card:hover{
transform:translateY(-4px);
box-shadow:0 8px 24px rgba(0,0,0,.14);
}

.team-band{
height:10px;
width:100%;
}

.team-content{
padding:28px 22px;
}

.team-name{
font-size:30px;
font-weight:900;
margin-bottom:10px;
line-height:1.15;
}

.team-meta{
font-size:16px;
color:#666;
font-weight:600;
}

.no-results{
text-align:center;
font-size:22px;
font-weight:800;
padding:60px 20px;
color:#666;
display:none;
}

@media(max-width:900px){

.hero h1{
font-size:42px;
}

.hero p{
font-size:18px;
}

.team-name{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/bundesliga.html">Bundesliga</a>
<a href="/bundesliga-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div class="hero">
<h1>Bundesliga Teams</h1>
<p>Every club to play in the Bundesliga</p>
</div>

<div class="container">

<div class="search-wrap">
<input type="text" id="teamSearch" placeholder="Search teams...">
</div>

<div class="team-count" id="teamCount"></div>

<div class="teams-grid" id="teamsGrid"></div>

<div class="no-results" id="noResults">No teams found</div>

</div>

<script>

const TEAMS = [

{ name:"Augsburg",                  colour:"linear-gradient(90deg,#BA3733,#007A3D)" },
{ name:"Bayern Munich",             colour:"linear-gradient(90deg,#DC052D,#0066B2)" },
{ name:"Bayer Leverkusen",          colour:"linear-gradient(90deg,#E32221,#000000)" },
{ name:"Borussia Dortmund",         colour:"linear-gradient(90deg,#FDE100,#000000)" },
{ name:"Borussia Mönchengladbach",  colour:"linear-gradient(90deg,#000000,#ffffff)" },
{ name:"Darmstadt 98",              colour:"linear-gradient(90deg,#003F86,#ffffff)" },
{ name:"Eintracht Frankfurt",       colour:"linear-gradient(90deg,#E1000F,#000000)" },
{ name:"Hamburger SV",              colour:"linear-gradient(90deg,#0B4EA2,#ffffff)" },
{ name:"Hannover 96",               colour:"linear-gradient(90deg,#009F4D,#000000)" },
{ name:"Heidenheim",                colour:"linear-gradient(90deg,#E8000D,#003F86)" },
{ name:"Hertha Berlin",             colour:"linear-gradient(90deg,#003CA6,#ffffff)" },
{ name:"Hoffenheim",                colour:"linear-gradient(90deg,#1961AC,#ffffff)" },
{ name:"Holstein Kiel",             colour:"linear-gradient(90deg,#D00B16,#003D8F)" },
{ name:"Köln",                      colour:"linear-gradient(90deg,#FF0000,#ffffff)" },
{ name:"Mainz 05",                  colour:"linear-gradient(90deg,#C3001E,#ffffff)" },
{ name:"RB Leipzig",                colour:"linear-gradient(90deg,#DD0741,#001A3C)" },
{ name:"SC Freiburg",               colour:"linear-gradient(90deg,#E8000D,#000000)" },
{ name:"Schalke 04",                colour:"linear-gradient(90deg,#004D9D,#ffffff)" },
{ name:"St. Pauli",                 colour:"linear-gradient(90deg,#5B1213,#ffffff)" },
{ name:"Union Berlin",              colour:"linear-gradient(90deg,#EB1923,#005CA9)" },
{ name:"VfB Stuttgart",             colour:"linear-gradient(90deg,#E32219,#ffffff)" },
{ name:"Werder Bremen",             colour:"linear-gradient(90deg,#1D9053,#ffffff)" },
{ name:"Wolfsburg",                 colour:"linear-gradient(90deg,#65B32E,#003F2D)" },

];

const grid      = document.getElementById("teamsGrid");
const search    = document.getElementById("teamSearch");
const count     = document.getElementById("teamCount");
const noResults = document.getElementById("noResults");

function renderTeams(filter=""){

  grid.innerHTML = "";

  const filtered = TEAMS
    .sort((a,b) => a.name.localeCompare(b.name))
    .filter(team => team.name.toLowerCase().includes(filter.toLowerCase()));

  count.innerHTML = `${filtered.length} Teams`;

  if(filtered.length === 0){
    noResults.style.display = "block";
    return;
  }

  noResults.style.display = "none";

  filtered.forEach(team => {
    grid.innerHTML += `
      <a class="team-card" href="/bundesliga-team.html?team=${encodeURIComponent(team.name)}">
        <div class="team-band" style="background:${team.colour};"></div>
        <div class="team-content">
          <div class="team-name">${team.name}</div>
          <div class="team-meta">View club stats, results and players</div>
        </div>
      </a>
    `;
  });

}

search.addEventListener("input", e => renderTeams(e.target.value));

renderTeams();

</script>

</body>
</html>
