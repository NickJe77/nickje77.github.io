<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Majors | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#0c6f3c;
  --gold:#d9b44a;
  --blue:#0056d6;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e3e7eb;
  --zebra:#f3f8f4;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:var(--blue);
  text-decoration:none;
  font-size:18px;
}

/* HERO */
.hero{
  height:200px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("/images/golf-hero.jpg");
  background-size:cover;
  background-position:center;
  border-bottom:4px solid var(--gold);
}

.hero h1{
  margin:0;
  font-size:48px;
}

/* PAGE */
.page{
  max-width:1100px;
  margin:auto;
  padding:25px;
}

/* TABLE */
.table-card{
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:var(--green);
  color:#fff;
}

th,td{
  padding:12px;
  font-size:14px;
  text-align:left;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}

.year{
  font-weight:700;
  width:100px;
}

.player a{
  color:#111;
  text-decoration:none;
  font-weight:600;
}

.player a:hover{
  color:var(--blue);
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/golf-majors.html">Majors</a>
  <a href="/golf-players.html">Players</a>
</div>

<div class="hero">
  <h1>Majors</h1>
</div>

<div class="page">

<div class="table-card">
<table>
<thead>
<tr>
  <th>Year</th>
  <th>Masters</th>
  <th>PGA Championship</th>
  <th>U.S. Open</th>
  <th>The Open</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>
const majors = {
  "Masters Tournament": "masters",
  "PGA Championship": "pga",
  "U.S. Open": "usopen",
  "The Open Championship": "open"
};

async function load(){
  const res = await fetch("/data/golf/pga_winners.json");
  const data = await res.json();

  // filter majors only
  const majorsData = data.filter(d => majors[d.event]);

  // group by year
  const years = [...new Set(majorsData.map(d => d.year))].sort((a,b)=>b-a);

  const tbody = document.getElementById("tableBody");

  years.forEach(year=>{
    const row = {
      masters: "",
      pga: "",
      usopen: "",
      open: ""
    };

    majorsData
      .filter(d => d.year === year)
      .forEach(d=>{
        if(!(d.winner || "").toLowerCase().includes("cancel")){
          row[majors[d.event]] = d.winner;
        }
      });

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="year">${year}</td>
      <td class="player">${formatPlayer(row.masters)}</td>
      <td class="player">${formatPlayer(row.pga)}</td>
      <td class="player">${formatPlayer(row.usopen)}</td>
      <td class="player">${formatPlayer(row.open)}</td>
    `;

    tbody.appendChild(tr);
  });
}

function formatPlayer(name){
  if(!name) return "";
  return `<a href="/golf-player.html?player=${encodeURIComponent(name)}">${name}</a>`;
}

load();
</script>

</body>
</html>
