<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Majors | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;

  /* subtle per-major column tints, kept from the original design */
  --masters:#eef7f1;
  --pga:#f7f2df;
  --usopen:#eef4fb;
  --open:#f9f4e8;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:44px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,5vw,38px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.page{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;
  font-size:13.5px;color:#27313c;
}
td.year{font-weight:700;color:var(--ink);}
tbody tr:last-child td{border-bottom:none;}

.masters{ background:var(--masters); }
.pga{ background:var(--pga); }
.usopen{ background:var(--usopen); }
.open{ background:var(--open); }

.player a{color:var(--ink);text-decoration:none;font-weight:600;}
.player a:hover{color:var(--accent);}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/golf-majors.html" aria-current="page">Majors</a>
</div>

<div class="hero">
  <span class="eyebrow">The Sporting Almanac</span>
  <h1>Majors</h1>
</div>

<div class="page">

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Year</th>
  <th>Masters</th>
  <th>PGA Championship</th>
  <th>U.S. Open</th>
  <th>The Open</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>
const majors = {
  "Masters Tournament": "masters",
  "PGA Championship": "pga",
  "U.S. Open": "usopen",
  "The Open Championship": "open"
};

async function load(){
  const res = await fetch("/data/golf/pga_winners.json");
  const data = await res.json();

  const majorsData = data.filter(d => majors[d.event]);

  const years = [...new Set(majorsData.map(d => d.year))].sort((a,b)=>b-a);

  const tbody = document.getElementById("tableBody");

  years.forEach(year=>{
    const row = {
      masters: "",
      pga: "",
      usopen: "",
      open: ""
    };

    majorsData
      .filter(d => d.year === year)
      .forEach(d=>{
        const w = (d.winner || "").toLowerCase();

        if(w.includes("cancel") || w.includes("postpon")){
          row[majors[d.event]] = "";
        } else {
          row[majors[d.event]] = d.winner;
        }
      });

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="year">${year}</td>
      <td class="masters player">${formatPlayer(row.masters)}</td>
      <td class="pga player">${formatPlayer(row.pga)}</td>
      <td class="usopen player">${formatPlayer(row.usopen)}</td>
      <td class="open player">${formatPlayer(row.open)}</td>
    `;

    tbody.appendChild(tr);
  });
}

function formatPlayer(name){
  if(!name) return "";
  return `<a href="/golf-player.html?player=${encodeURIComponent(name)}">${name}</a>`;
}

load();
</script>

</body>
</html>
