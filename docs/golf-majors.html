<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Majors | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#0c6f3c;
  --gold:#d9b44a;
  --blue:#0056d6;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e3e7eb;
  --zebra:#f3f8f4;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:var(--blue);
  text-decoration:none;
  font-size:18px;
}

/* HERO */
.hero{
  height:200px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("/images/golf-hero.jpg");
  background-size:cover;
  background-position:center;
  border-bottom:4px solid var(--gold);
}

.hero h1{
  margin:0;
  font-size:48px;
}

/* PAGE */
.page{
  max-width:1000px;
  margin:auto;
  padding:25px;
}

/* SECTION */
.section{
  margin-bottom:30px;
}

.section h2{
  margin:0 0 10px;
  color:#0c6f3c;
}

/* TABLE */
.table-card{
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:var(--green);
  color:#fff;
}

th,td{
  padding:12px;
  font-size:14px;
  text-align:left;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}

.year{
  width:100px;
  font-weight:700;
}

.player{
  font-weight:600;
}

.player a{
  color:#111;
  text-decoration:none;
}

.player a:hover{
  color:var(--blue);
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/golf-majors.html">Majors</a>
  <a href="/golf-players.html">Players</a>
</div>

<div class="hero">
  <h1>Majors</h1>
</div>

<div class="page" id="content"></div>

<script>
const majors = [
  "Masters Tournament",
  "PGA Championship",
  "U.S. Open",
  "The Open Championship"
];

async function load(){
  const res = await fetch("/data/golf/pga_winners.json");
  const data = await res.json();

  const container = document.getElementById("content");

  majors.forEach(m=>{
    const section = document.createElement("div");
    section.className = "section";

    const title = document.createElement("h2");
    title.textContent = m;
    section.appendChild(title);

    const tableCard = document.createElement("div");
    tableCard.className = "table-card";

    const table = document.createElement("table");

    table.innerHTML = `
      <thead>
        <tr>
          <th>Year</th>
          <th>Winner</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody = table.querySelector("tbody");

    data
      .filter(d => d.event === m)
      .filter(d => !(d.winner || "").toLowerCase().includes("cancel"))
      .sort((a,b)=>b.year-a.year)
      .forEach(r=>{
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td class="year">${r.year}</td>
          <td class="player">
            <a href="/golf-player.html?player=${encodeURIComponent(r.winner)}">
              ${r.winner}
            </a>
          </td>
        `;

        tbody.appendChild(tr);
      });

    tableCard.appendChild(table);
    section.appendChild(tableCard);
    container.appendChild(section);
  });
}

load();
</script>

</body>
</html>
