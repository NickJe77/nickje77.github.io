<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Horse vs Horse | Australian Stakes Results</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="racing.css">
<link rel="stylesheet" href="archive.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#0f141a; --muted:#69727c; --faint:#9aa3ad;
  --line:#e3e8ee; --board:#0c130f; --board-2:#161f16; --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16); --win-bg:#e6f4ea; --win-text:#1e7a3d;
  --display:'Oswald',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --radius:16px;
}
*{box-sizing:border-box;}
body{ font-size:15px; font-family:var(--body); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; margin:0; }

#global-nav nav{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;}
#global-nav nav a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
#global-nav nav a:hover{opacity:1;}

.page{ max-width:1000px; margin:0 auto; padding:26px 20px 70px; }

.search-wrap{ max-width:500px; margin:0 auto 26px; position:relative; }
.search-wrap input{
  width:100%; padding:13px 20px; border-radius:999px; border:1px solid var(--line);
  font-family:var(--body); font-size:15px; font-weight:600; outline:none; background:var(--surface);
}
.search-wrap input:focus{ border-color:var(--accent); }
.suggestions{
  position:absolute; width:100%; background:var(--surface); border-radius:14px; margin-top:8px;
  overflow:hidden; box-shadow:0 14px 30px -12px rgba(10,16,24,.4); z-index:10; max-height:320px; overflow-y:auto;
}
.suggestion{ padding:12px 18px; cursor:pointer; font-weight:600; font-size:14px; }
.suggestion:hover{ background:var(--accent-soft); }

.hero{
  position:relative; background:linear-gradient(160deg,var(--board-2),var(--board)); color:#fff;
  padding:32px 34px; border-radius:var(--radius); margin-bottom:22px; text-align:center;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body); font-size:11.5px; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--accent); margin-bottom:10px;
}
.hero h1{
  margin:0; font-family:var(--display); font-weight:600; font-size:clamp(24px,5vw,38px);
  letter-spacing:.01em; text-transform:uppercase; color:#fff;
}

.summary{ display:flex; justify-content:center; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
.summary div{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px 28px; text-align:center; font-weight:600; color:var(--muted); font-size:13px;
}
.summary span{
  display:block; font-family:var(--display); font-weight:600; font-size:26px;
  color:var(--ink); margin-top:4px; font-variant-numeric:tabular-nums;
}

.table-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); }
table{ width:100%; border-collapse:collapse; min-width:700px; }
th, td{ padding:11px 14px; text-align:left; font-size:13.5px; border-bottom:1px solid var(--line); white-space:nowrap; }
th{ background:#f7f9fb; color:var(--muted); font-family:var(--body); font-weight:600; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
td{ color:#27313c; font-variant-numeric:tabular-nums; }
td:first-child{ font-weight:700; color:var(--ink); }
tbody tr{ cursor:pointer; }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover td{ background:#f9fbfd; }
.win td{ background:var(--win-bg) !important; font-weight:600; color:var(--win-text); }
.win td:first-child{ color:var(--win-text); }

.loading{ text-align:center; color:var(--muted); font-style:italic; padding:20px; }
.win-cell{ background:var(--win-bg) !important; font-weight:700 !important; color:var(--win-text) !important; }
</style>
</head>

<body>
<div id="global-nav"></div>

<div class="page">

  <div class="hero">
    <div class="eyebrow">Australian Stakes Races</div>
    <h1>Horse vs Horse</h1>
  </div>

  <div style="display:flex;gap:16px;flex-wrap:wrap;max-width:700px;margin:0 auto 8px;">
    <div class="search-wrap" style="flex:1;min-width:220px;margin-bottom:0;">
      <input id="horse1Box" placeholder="First horse..." autocomplete="off">
      <div class="suggestions" id="suggestions1" style="display:none;"></div>
    </div>
    <div class="search-wrap" style="flex:1;min-width:220px;margin-bottom:0;">
      <input id="horse2Box" placeholder="Second horse..." autocomplete="off">
      <div class="suggestions" id="suggestions2" style="display:none;"></div>
    </div>
  </div>

  <div class="loading" id="status">Loading data…</div>

  <div class="summary" id="summary" style="display:none;">
    <div>Shared Races<span id="sharedCount">0</span></div>
    <div id="horse1SummaryLabel">Horse 1 Ahead<span id="horse1Wins">0</span></div>
    <div id="horse2SummaryLabel">Horse 2 Ahead<span id="horse2Wins">0</span></div>
  </div>

  <div class="table-wrap" id="tableWrap" style="display:none;">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Race</th>
        <th>Venue</th>
        <th id="horse1Header">Horse 1</th>
        <th id="horse2Header">Horse 2</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>
  </div>

</div>

<script>

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const lines = text.trim().replace(/\r/g,"").split("\n");
  const headers = lines[0].split(",").map(h=>h.trim());

  return lines.slice(1).map(line=>{
    const values = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    let obj = {};
    headers.forEach((h,i)=>{
      obj[h] = (values[i]||"").replace(/^"|"$/g,"").trim();
    });
    return obj;
  });
}

let allData = [];
let allHorseNames = [];

fetch("/data/Stakes%20races.csv")
  .then(res => res.text())
  .then(text => {
    allData = parseCSV(text);
    allHorseNames = [...new Set(allData.map(r => r.Horse))].filter(Boolean).sort();
    document.getElementById("status").textContent = "Type two horse names above to compare.";
  });

function buildSuggestions(boxId, listId, otherBoxId){
  const box = document.getElementById(boxId);
  const list = document.getElementById(listId);

  box.addEventListener("input", () => {
    const q = box.value.trim().toLowerCase();
    if(q.length < 2){ list.style.display = "none"; return; }

    const matches = allHorseNames.filter(n => n.toLowerCase().includes(q)).slice(0, 8);
    if(!matches.length){ list.style.display = "none"; return; }

    list.innerHTML = matches.map(n => `<div class="suggestion">${n}</div>`).join("");
    list.style.display = "block";

    list.querySelectorAll(".suggestion").forEach((el, i) => {
      el.onclick = () => {
        box.value = matches[i];
        list.style.display = "none";
        compareHorses();
      };
    });
  });

  document.addEventListener("click", (e) => {
    if(!box.contains(e.target) && !list.contains(e.target)) list.style.display = "none";
  });
}

buildSuggestions("horse1Box", "suggestions1", "horse2Box");
buildSuggestions("horse2Box", "suggestions2", "horse1Box");

function compareHorses(){
  const h1 = document.getElementById("horse1Box").value.trim();
  const h2 = document.getElementById("horse2Box").value.trim();

  if(!h1 || !h2){
    document.getElementById("summary").style.display = "none";
    document.getElementById("tableWrap").style.display = "none";
    return;
  }

  const raceMap = {};
  allData.forEach(r => {
    const key = `${r.Track}|${r.Date}|${r["Race Name"]}`;
    if(!raceMap[key]) raceMap[key] = { info: r, rows: [] };
    raceMap[key].rows.push(r);
  });

  const shared = Object.values(raceMap).filter(race => {
    const names = race.rows.map(r => r.Horse.toLowerCase());
    return names.includes(h1.toLowerCase()) && names.includes(h2.toLowerCase());
  });

  document.getElementById("horse1Header").textContent = h1;
  document.getElementById("horse2Header").textContent = h2;
  document.getElementById("horse1SummaryLabel").innerHTML = `${h1} Ahead<span id="horse1Wins">0</span>`;
  document.getElementById("horse2SummaryLabel").innerHTML = `${h2} Ahead<span id="horse2Wins">0</span>`;

  if(shared.length === 0){
    document.getElementById("status").textContent = `${h1} and ${h2} have never raced against each other in a Group 1.`;
    document.getElementById("status").style.display = "block";
    document.getElementById("summary").style.display = "none";
    document.getElementById("tableWrap").style.display = "none";
    return;
  }

  document.getElementById("status").style.display = "none";

  const sorted = shared.slice().sort((a,b) => {
    const [ad,am,ay] = a.info.Date.split("/").map(Number);
    const [bd,bm,by] = b.info.Date.split("/").map(Number);
    return new Date(ay,am-1,ad) - new Date(by,bm-1,bd);
  });

  let h1Wins = 0, h2Wins = 0;

  const rowsHtml = sorted.map(race => {
    const r1 = race.rows.find(r => r.Horse.toLowerCase() === h1.toLowerCase());
    const r2 = race.rows.find(r => r.Horse.toLowerCase() === h2.toLowerCase());
    const f1 = parseInt(r1["Position"]) || 999;
    const f2 = parseInt(r2["Position"]) || 999;
    if(f1 < f2) h1Wins++;
    else if(f2 < f1) h2Wins++;

    return `
      <tr>
        <td>${race.info.Date}</td>
        <td>${race.info["Race Name"]}</td>
        <td>${race.info.Track}</td>
        <td class="${f1 < f2 ? 'win-cell' : ''}">${r1["Position"]}</td>
        <td class="${f2 < f1 ? 'win-cell' : ''}">${r2["Position"]}</td>
      </tr>
    `;
  }).join("");

  document.getElementById("sharedCount").textContent = shared.length;
  document.getElementById("horse1Wins").textContent = h1Wins;
  document.getElementById("horse2Wins").textContent = h2Wins;
  document.getElementById("summary").style.display = "flex";
  document.getElementById("tableWrap").style.display = "block";
  document.getElementById("results").innerHTML = rowsHtml;
}

/* LOAD NAV BAR */
fetch("g1-archive.html")
  .then(res => res.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const nav = doc.querySelector("nav");
    if(nav){ document.getElementById("global-nav").innerHTML = nav.outerHTML; }
  });

</script>
</body>
</html>
