<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
}

.navbar a{
text-decoration:none;
font-weight:700;
color:#0056d6;
}

.hero{
background:linear-gradient(135deg,#3d014d,#8f35ff);
color:white;
padding:70px 20px;
text-align:center;
}

.hero h1{
margin:0;
font-size:64px;
font-weight:900;
}

.hero p{
margin-top:14px;
font-size:22px;
font-weight:600;
opacity:.95;
}

.container{
max-width:1500px;
margin:40px auto;
padding:0 20px;
}

.teams-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:24px;
}

.team-card{
background:white;
border-radius:18px;
overflow:hidden;
text-decoration:none;
color:#111;
box-shadow:0 2px 10px rgba(0,0,0,.08);
transition:.2s ease;
}

.team-card:hover{
transform:translateY(-4px);
box-shadow:0 8px 24px rgba(0,0,0,.14);
}

.team-band{
height:10px;
width:100%;
}

.team-content{
padding:28px 22px;
}

.team-name{
font-size:30px;
font-weight:900;
margin-bottom:10px;
}

.team-meta{
font-size:16px;
color:#666;
font-weight:600;
}

@media(max-width:900px){

.hero h1{
font-size:42px;
}

.hero p{
font-size:18px;
}

.team-name{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
<a href="/baseball.html">Baseball</a>
</div>

<div class="hero">
<h1>Premier League Teams</h1>
<p>Select a club</p>
</div>

<div class="container">

<div class="teams-grid" id="teamsGrid"></div>

</div>

<script>

const TEAMS = [

{
name:"Arsenal",
colour:"linear-gradient(90deg,#EF0107,#FFFFFF)"
},

{
name:"Aston Villa",
colour:"linear-gradient(90deg,#670E36,#95BFE5)"
},

{
name:"Bournemouth",
colour:"linear-gradient(90deg,#DA291C,#000000)"
},

{
name:"Brentford",
colour:"linear-gradient(90deg,#E30613,#FFFFFF)"
},

{
name:"Brighton",
colour:"linear-gradient(90deg,#0057B8,#FFFFFF)"
},

{
name:"Chelsea",
colour:"linear-gradient(90deg,#034694,#FFFFFF)"
},

{
name:"Crystal Palace",
colour:"linear-gradient(90deg,#1B458F,#C4122E)"
},

{
name:"Everton",
colour:"linear-gradient(90deg,#003399,#FFFFFF)"
},

{
name:"Fulham",
colour:"linear-gradient(90deg,#FFFFFF,#000000)"
},

{
name:"Ipswich Town",
colour:"linear-gradient(90deg,#005BAC,#FFFFFF)"
},

{
name:"Leicester City",
colour:"linear-gradient(90deg,#003090,#FDBE11)"
},

{
name:"Liverpool",
colour:"linear-gradient(90deg,#C8102E,#00B2A9)"
},

{
name:"Manchester City",
colour:"linear-gradient(90deg,#6CABDD,#1C2C5B)"
},

{
name:"Manchester United",
colour:"linear-gradient(90deg,#DA291C,#FBE122)"
},

{
name:"Newcastle United",
colour:"linear-gradient(90deg,#000000,#FFFFFF)"
},

{
name:"Nottingham Forest",
colour:"linear-gradient(90deg,#DD0000,#FFFFFF)"
},

{
name:"Southampton",
colour:"linear-gradient(90deg,#D71920,#FFFFFF)"
},

{
name:"Tottenham Hotspur",
colour:"linear-gradient(90deg,#132257,#FFFFFF)"
},

{
name:"West Ham United",
colour:"linear-gradient(90deg,#7A263A,#1BB1E7)"
},

{
name:"Wolverhampton Wanderers",
colour:"linear-gradient(90deg,#FDB913,#231F20)"
}

];

const grid =
document.getElementById("teamsGrid");

TEAMS.forEach(team=>{

grid.innerHTML += `

<a
class="team-card"
href="epl-team.html?team=${encodeURIComponent(team.name)}"
>

<div
class="team-band"
style="background:${team.colour};"
></div>

<div class="team-content">

<div class="team-name">
${team.name}
</div>

<div class="team-meta">
View club stats, results and players
</div>

</div>

</a>

`;

});

</script>

</body>
</html>
