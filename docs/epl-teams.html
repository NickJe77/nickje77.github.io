<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Inter,system-ui,Arial,sans-serif;
    background:#f3f4f7;
    color:#111;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px;
    background:white;
    border-bottom:1px solid #ddd;
    flex-wrap:wrap;
}

.navbar a{
    text-decoration:none;
    color:#0056d6;
    font-weight:600;
}

.hero{
    background:linear-gradient(135deg,#37003c,#963cff);
    color:white;
    padding:60px 20px;
    text-align:center;
}

.hero h1{
    margin:0;
    font-size:52px;
    font-weight:900;
}

.hero p{
    margin-top:14px;
    font-size:20px;
    opacity:.95;
}

.team-stripe{
    height:8px;
    background:linear-gradient(90deg,#37003c,#963cff);
}

.container{
    max-width:1500px;
    margin:30px auto;
    padding:0 20px;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat-box{
    background:white;
    border-radius:16px;
    padding:24px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.stat-number{
    font-size:42px;
    font-weight:900;
    color:#37003c;
}

.stat-label{
    margin-top:10px;
    font-size:15px;
    color:#666;
}

.card{
    background:white;
    border-radius:16px;
    padding:24px;
    margin-bottom:30px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.section-title{
    margin-top:0;
    margin-bottom:24px;
    font-size:30px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#37003c;
    color:white;
    padding:14px;
    text-align:center;
    font-size:14px;
}

td{
    padding:14px;
    border-bottom:1px solid #eee;
    text-align:center;
    font-size:15px;
}

tr:nth-child(even){
    background:#f3f7fd;
}

.match-row{
    cursor:pointer;
    transition:.15s ease;
}

.match-row:hover{
    background:#dfeaff !important;
}

.team-link,
.player-link{
    color:#0056d6;
    text-decoration:none;
    font-weight:700;
}

.score{
    font-size:18px;
    font-weight:900;
}

.loading{
    text-align:center;
    padding:50px;
    font-size:18px;
    color:#666;
}

.players-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:16px;
}

.player-tile{
    background:#f3f7fd;
    border-radius:12px;
    padding:16px;
    transition:.15s ease;
}

.player-tile:hover{
    background:#dfeaff;
}

.player-name{
    font-size:18px;
    font-weight:800;
    margin-bottom:8px;
}

.player-meta{
    color:#666;
    font-size:14px;
}

@media(max-width:900px){

.hero h1{
    font-size:36px;
}

th,td{
    padding:8px;
    font-size:12px;
}

.stat-number{
    font-size:30px;
}

}

</style>
</head>
<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/epl.html">EPL</a>
    <a href="/nba.html">NBA</a>
    <a href="/afl.html">AFL</a>
    <a href="/baseball.html">Baseball</a>
</div>

<div class="hero">

    <h1 id="teamName">Loading Team...</h1>

    <p id="teamSummary"></p>

</div>

<div class="team-stripe"></div>

<div class="container">

    <div class="stats-grid">

        <div class="stat-box">
            <div class="stat-number" id="gamesStat">0</div>
            <div class="stat-label">Games</div>
        </div>

        <div class="stat-box">
            <div class="stat-number" id="winsStat">0</div>
            <div class="stat-label">Wins</div>
        </div>

        <div class="stat-box">
            <div class="stat-number" id="drawsStat">0</div>
            <div class="stat-label">Draws</div>
        </div>

        <div class="stat-box">
            <div class="stat-number" id="lossesStat">0</div>
            <div class="stat-label">Losses</div>
        </div>

        <div class="stat-box">
            <div class="stat-number" id="goalsForStat">0</div>
            <div class="stat-label">Goals For</div>
        </div>

        <div class="stat-box">
            <div class="stat-number" id="goalsAgainstStat">0</div>
            <div class="stat-label">Goals Against</div>
        </div>

    </div>

    <div class="card">

        <h2 class="section-title">Matches</h2>

        <div id="matchesContainer" class="loading">
            Loading matches...
        </div>

    </div>

    <div class="card">

        <h2 class="section-title">Players</h2>

        <div id="playersContainer" class="loading">
            Loading players...
        </div>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const team = params.get("team");

document.getElementById("teamName").textContent = team || "Unknown Team";

let allMatches = [];
let allPlayers = [];

async function loadData(){

    try{

        const seasons = [];

        for(let year=1992; year<=2026; year++){

            seasons.push(`${year}-${year+1}`);

        }

        for(const season of seasons){

            try{

                const response = await fetch(`/data/epl/seasons/${season}.json`);

                if(response.ok){

                    const data = await response.json();

                    allMatches.push(...data);

                }

            }catch(err){}

        }

        allMatches = allMatches.filter(match =>
            match.home_team === team ||
            match.away_team === team
        );

        buildStats();

        renderMatches();

        loadPlayers();

    }catch(err){

        console.error(err);

    }

}

async function loadPlayers(){

    try{

        const response = await fetch('/data/epl/players.json');

        const players = await response.json();

        allPlayers = players.filter(player =>
            player.teams &&
            player.teams.includes(team)
        );

        renderPlayers();

    }catch(err){

        console.error(err);

    }

}

function buildStats(){

    let wins = 0;
    let draws = 0;
    let losses = 0;

    let goalsFor = 0;
    let goalsAgainst = 0;

    allMatches.forEach(match => {

        const isHome = match.home_team === team;

        const gf = isHome ? match.home_score : match.away_score;
        const ga = isHome ? match.away_score : match.home_score;

        goalsFor += gf || 0;
        goalsAgainst += ga || 0;

        if(gf > ga){
            wins++;
        }else if(gf < ga){
            losses++;
        }else{
            draws++;
        }

    });

    document.getElementById("gamesStat").textContent = allMatches.length;
    document.getElementById("winsStat").textContent = wins;
    document.getElementById("drawsStat").textContent = draws;
    document.getElementById("lossesStat").textContent = losses;
    document.getElementById("goalsForStat").textContent = goalsFor;
    document.getElementById("goalsAgainstStat").textContent = goalsAgainst;

    document.getElementById("teamSummary").textContent =
        `${wins} wins • ${draws} draws • ${losses} losses`;

}

function renderMatches(){

    allMatches.sort((a,b) => {

        return new Date(b.date || 0) - new Date(a.date || 0);

    });

    let html = `
        <table>

            <thead>

                <tr>
                    <th>Home</th>
                    <th>Score</th>
                    <th>Away</th>
                </tr>

            </thead>

            <tbody>
    `;

    allMatches.forEach(match => {

        html += `
            <tr class="match-row"
                onclick="window.location.href='/epl-game.html?match=${match.match_id}&season=${match.season}'">

                <td>

                    <a class="team-link"
                       href="/epl-team.html?team=${encodeURIComponent(match.home_team)}"
                       onclick="event.stopPropagation()">

                       ${match.home_team || ''}

                    </a>

                </td>

                <td class="score">

                    ${match.home_score ?? '-'}
                    -
                    ${match.away_score ?? '-'}

                </td>

                <td>

                    <a class="team-link"
                       href="/epl-team.html?team=${encodeURIComponent(match.away_team)}"
                       onclick="event.stopPropagation()">

                       ${match.away_team || ''}

                    </a>

                </td>

            </tr>
        `;

    });

    html += `
            </tbody>
        </table>
    `;

    document.getElementById("matchesContainer").innerHTML = html;

}

function renderPlayers(){

    if(!allPlayers.length){

        document.getElementById("playersContainer").innerHTML = `
            <div class="loading">
                No players found
            </div>
        `;

        return;

    }

    let html = `<div class="players-grid">`;

    allPlayers.forEach(player => {

        html += `
            <a class="player-link"
               href="/epl-player.html?player=${player.slug}">

                <div class="player-tile">

                    <div class="player-name">
                        ${player.name}
                    </div>

                    <div class="player-meta">

                        ${player.first_season || ''}
                        -
                        ${player.last_season || ''}

                    </div>

                </div>

            </a>
        `;

    });

    html += `</div>`;

    document.getElementById("playersContainer").innerHTML = html;

}

loadData();

</script>

</body>
</html>
