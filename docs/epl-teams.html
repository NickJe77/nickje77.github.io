<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
}

.navbar a{
text-decoration:none;
font-weight:700;
color:#0056d6;
}

.hero{
background:linear-gradient(135deg,#3d014d,#8f35ff);
color:white;
padding:60px 20px;
text-align:center;
}

.hero h1{
margin:0;
font-size:64px;
font-weight:900;
}

.hero p{
margin-top:12px;
font-size:24px;
font-weight:700;
}

.team-search-wrap{
display:flex;
justify-content:center;
margin:26px 0;
}

#teamSearch{
width:340px;
max-width:92%;
padding:14px 16px;
font-size:16px;
border-radius:12px;
border:1px solid #ccc;
background:white;
font-weight:700;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
max-width:1600px;
margin:0 auto 26px;
padding:0 10px;
}

.stat-box{
background:white;
border-radius:18px;
padding:34px 20px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.stat-box .num{
font-size:64px;
font-weight:900;
color:#4b0055;
line-height:1;
margin-bottom:12px;
}

.stat-box .label{
font-size:24px;
font-weight:700;
color:#666;
}

.section{
max-width:1600px;
margin:30px auto;
background:white;
padding:26px;
border-radius:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.section h2{
margin-top:0;
font-size:48px;
margin-bottom:24px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#4b0055;
color:white;
padding:16px;
font-size:18px;
}

td{
padding:16px;
border-bottom:1px solid #eee;
font-size:17px;
text-align:center;
}

tbody tr:nth-child(even){
background:#f2f7ff;
}

tbody tr:hover{
background:#dcecff;
}

.team-link,
.player-link{
color:#0056d6;
font-weight:700;
text-decoration:none;
}

.team-link:hover,
.player-link:hover{
text-decoration:underline;
}

.loading{
text-align:center;
font-size:30px;
font-weight:800;
padding:80px 20px;
}

@media(max-width:900px){

.hero h1{
font-size:42px;
}

.hero p{
font-size:18px;
}

.section h2{
font-size:34px;
}

.stat-box .num{
font-size:44px;
}

.stat-box .label{
font-size:18px;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
<a href="/baseball.html">Baseball</a>
</div>

<div class="hero">
<h1 id="teamName">Loading Team...</h1>
<p id="recordText"></p>
</div>

<div class="team-search-wrap">

<input
type="text"
id="teamSearch"
list="teamList"
placeholder="Search team..."
autocomplete="off"
/>

<datalist id="teamList"></datalist>

</div>

<div class="stats-grid">

<div class="stat-box">
<div class="num" id="gamesStat">0</div>
<div class="label">Games</div>
</div>

<div class="stat-box">
<div class="num" id="winsStat">0</div>
<div class="label">Wins</div>
</div>

<div class="stat-box">
<div class="num" id="drawsStat">0</div>
<div class="label">Draws</div>
</div>

<div class="stat-box">
<div class="num" id="lossesStat">0</div>
<div class="label">Losses</div>
</div>

<div class="stat-box">
<div class="num" id="gfStat">0</div>
<div class="label">Goals For</div>
</div>

<div class="stat-box">
<div class="num" id="gaStat">0</div>
<div class="label">Goals Against</div>
</div>

</div>

<div class="section">

<h2>Matches</h2>

<table>

<thead>
<tr>
<th>Date</th>
<th>Home</th>
<th>Score</th>
<th>Away</th>
</tr>
</thead>

<tbody id="matchesTable"></tbody>

</table>

</div>

<div class="section">

<h2>Players</h2>

<table>

<thead>
<tr>
<th>Player</th>
<th>Goals</th>
<th>Assists</th>
<th>Yellow</th>
<th>Red</th>
</tr>
</thead>

<tbody id="playersTable"></tbody>

</table>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const teamParam =
decodeURIComponent(
params.get("team") || ""
);

const TEAM_MAP = {
"ARS":"Arsenal",
"AVL":"Aston Villa",
"BOU":"Bournemouth",
"BRE":"Brentford",
"BHA":"Brighton",
"CHE":"Chelsea",
"CRY":"Crystal Palace",
"EVE":"Everton",
"FUL":"Fulham",
"IPS":"Ipswich Town",
"LEI":"Leicester City",
"LIV":"Liverpool",
"MCI":"Manchester City",
"MUN":"Manchester United",
"NEW":"Newcastle United",
"NFO":"Nottingham Forest",
"SOU":"Southampton",
"TOT":"Tottenham Hotspur",
"WHU":"West Ham United",
"WOL":"Wolverhampton Wanderers"
};

const teamList =
document.getElementById("teamList");

Object.values(TEAM_MAP)
.sort()
.forEach(team=>{

const opt =
document.createElement("option");

opt.value = team;

teamList.appendChild(opt);

});

document.getElementById("teamSearch")
.addEventListener("change",()=>{

const val =
document.getElementById("teamSearch").value;

window.location =
`epl-team.html?team=${encodeURIComponent(val)}`;

});

let selectedTeam = "";

Object.entries(TEAM_MAP).forEach(([code,name])=>{

if(
teamParam.toLowerCase() === code.toLowerCase() ||
teamParam.toLowerCase() === name.toLowerCase()
){
selectedTeam = name;
}

});

if(!selectedTeam){

selectedTeam = teamParam;

}

async function loadData(){

document.getElementById("teamName").innerText =
selectedTeam || "Unknown Team";

let allGames = [];

for(let year=1992;year<=2026;year++){

try{

const res =
await fetch(`/data/epl/epl_${year}.json?v=${Date.now()}`);

if(!res.ok) continue;

const data =
await res.json();

allGames.push(...data);

}catch(err){

console.log(err);

}

}

const games =
allGames.filter(g=>{

const home =
g.home_team ||
g.home ||
"";

const away =
g.away_team ||
g.away ||
"";

return (
home === selectedTeam ||
away === selectedTeam
);

});

let wins = 0;
let draws = 0;
let losses = 0;
let gf = 0;
let ga = 0;

const playerStats = {};

games.forEach(g=>{

const home =
g.home_team ||
g.home ||
"";

const away =
g.away_team ||
g.away ||
"";

const hs =
Number(
g.home_score ||
g.home_goals ||
0
);

const as =
Number(
g.away_score ||
g.away_goals ||
0
);

const isHome =
home === selectedTeam;

const teamGoals =
isHome ? hs : as;

const oppGoals =
isHome ? as : hs;

gf += teamGoals;
ga += oppGoals;

if(teamGoals > oppGoals){
wins++;
}else if(teamGoals < oppGoals){
losses++;
}else{
draws++;
}

(g.scorers || []).forEach(s=>{

if(s.team !== selectedTeam) return;

if(!playerStats[s.player]){

playerStats[s.player] = {
goals:0,
assists:0,
yellow:0,
red:0
};

}

playerStats[s.player].goals++;

});

(g.cards || []).forEach(c=>{

if(c.team !== selectedTeam) return;

if(!playerStats[c.player]){

playerStats[c.player] = {
goals:0,
assists:0,
yellow:0,
red:0
};

}

if(
String(c.card).toLowerCase().includes("yellow")
){
playerStats[c.player].yellow++;
}

if(
String(c.card).toLowerCase().includes("red")
){
playerStats[c.player].red++;
}

});

});

document.getElementById("gamesStat").innerText =
games.length;

document.getElementById("winsStat").innerText =
wins;

document.getElementById("drawsStat").innerText =
draws;

document.getElementById("lossesStat").innerText =
losses;

document.getElementById("gfStat").innerText =
gf;

document.getElementById("gaStat").innerText =
ga;

document.getElementById("recordText").innerText =
`${wins} wins • ${draws} draws • ${losses} losses`;

const matchesTable =
document.getElementById("matchesTable");

matchesTable.innerHTML = "";

games
.sort((a,b)=>
new Date(b.date) - new Date(a.date)
)
.forEach(g=>{

const home =
g.home_team ||
g.home ||
"";

const away =
g.away_team ||
g.away ||
"";

const hs =
g.home_score ||
g.home_goals ||
0;

const as =
g.away_score ||
g.away_goals ||
0;

matchesTable.innerHTML += `
<tr>

<td>${g.date || ""}</td>

<td>
<a class="team-link"
href="epl-team.html?team=${encodeURIComponent(home)}">
${home}
</a>
</td>

<td>
<a class="team-link"
href="epl-game.html?game=${g.game_id || g.id}">
${hs} - ${as}
</a>
</td>

<td>
<a class="team-link"
href="epl-team.html?team=${encodeURIComponent(away)}">
${away}
</a>
</td>

</tr>
`;

});

const playersTable =
document.getElementById("playersTable");

playersTable.innerHTML = "";

Object.entries(playerStats)
.sort((a,b)=>b[1].goals - a[1].goals)
.forEach(([player,stats])=>{

playersTable.innerHTML += `
<tr>

<td>
<a class="player-link"
href="epl-player.html?player=${encodeURIComponent(player)}">
${player}
</a>
</td>

<td>${stats.goals}</td>
<td>${stats.assists}</td>
<td>${stats.yellow}</td>
<td>${stats.red}</td>

</tr>
`;

});

}

loadData();

</script>

</body>
</html>
