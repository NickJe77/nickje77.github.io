<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>La Liga Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{display:flex;justify-content:center;gap:20px;padding:15px;background:var(--surface);border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover{opacity:1;color:var(--accent);}
.hero{background:linear-gradient(160deg,var(--board-2),var(--board));color:#fff;padding:44px 20px;text-align:center;}
.hero h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,42px);letter-spacing:.01em;text-transform:uppercase;}
.hero p{margin-top:10px;font-size:14px;color:rgba(255,255,255,.68);}
.picker{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:26px;}
.picker select{padding:11px 16px;border-radius:999px;border:none;font-size:14px;font-weight:600;min-width:240px;background:#fff;color:var(--ink);font-family:var(--body);}
.vs{font-family:var(--display);font-size:20px;font-weight:600;color:#fff;}
.btn{padding:11px 26px;border-radius:999px;border:none;background:var(--accent);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer;transition:.2s;font-family:var(--body);}
.btn:hover{opacity:.9;}
.container{max-width:1400px;margin:0 auto;padding:26px 20px 70px;}
.h2h-header{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin-bottom:22px;}
.team-banner{border-radius:var(--radius);padding:26px 20px;text-align:center;color:#fff;}
.team-banner h2{margin:0;font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;}
.team-banner p{margin:6px 0 0;font-size:13.5px;opacity:.85;font-weight:600;}
.h2h-score{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;text-align:center;}
.h2h-score-nums{display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--display);font-size:40px;font-weight:600;line-height:1;}
.h2h-score-label{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);margin-top:8px;letter-spacing:.06em;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;}
.stat-value{font-family:var(--display);font-size:26px;font-weight:600;line-height:1;margin-bottom:6px;color:var(--ink);}
.stat-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
.section-title{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:16px;color:var(--ink);text-transform:uppercase;letter-spacing:.01em;border-left:4px solid var(--accent);padding-left:12px;}
.tables-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;}
th{background:#f7f9fb;padding:11px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:left;color:var(--muted);font-family:var(--body);border-bottom:1px solid var(--line);}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.player-link{text-decoration:none;font-weight:700;color:var(--ink);}
.player-link:hover{color:var(--accent);}
.games-table tr{cursor:pointer;transition:.15s;}
.result-win{font-weight:700;color:#1e7a3d;font-size:15px;}
.result-loss{font-weight:700;color:#c0362c;font-size:15px;}
.result-draw{font-weight:700;color:#b8860b;font-size:15px;}
.loading{text-align:center;padding:60px;font-size:16px;color:var(--muted);font-weight:600;}
.error{text-align:center;padding:60px;font-size:16px;font-weight:600;color:#c0362c;}
.hidden{display:none;}
@media(max-width:900px){
  .h2h-header{grid-template-columns:1fr;text-align:center;}
  .vs{display:none;}
  .h2h-score-nums{font-size:32px;}
  .team-banner h2{font-size:22px;}
  .picker{flex-direction:column;gap:10px;}
  .picker select{min-width:280px;width:100%;}
  .games-table thead{display:none;}
  .games-table tbody{display:block;}
  .games-table tr{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:12px;border-bottom:1px solid var(--line);}
  .games-table td{display:block;border:none;padding:4px 8px;font-size:13px;}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
  <a href="laliga.html">La Liga</a>
  <a href="laliga-teams.html">Teams</a>
  <a href="laliga-players.html">Players</a>
</div>

<div class="hero">
  <h1>Head to Head</h1>
  <p>Compare any two clubs in La Liga history</p>
  <div class="picker">
    <select id="team1Select"><option value="">Select Team 1...</option></select>
    <div class="vs">VS</div>
    <select id="team2Select"><option value="">Select Team 2...</option></select>
    <button class="btn" onclick="loadH2H()">Compare</button>
  </div>
</div>

<div class="container">
  <div id="results" class="hidden"></div>
</div>

<script>

const TEAM_COLOURS = {
  "Alavés":                   "linear-gradient(160deg,#003DA5,#001A5E)",
  "Albacete":                 "linear-gradient(160deg,#FFDD00,#004A97)",
  "Almería":                  "linear-gradient(160deg,#CC0000,#880000)",
  "Athletic Club":            "linear-gradient(160deg,#CC0000,#880000)",
  "Atlético de Madrid":       "linear-gradient(160deg,#CB3524,#880000)",
  "Barcelona":                "linear-gradient(160deg,#A50044,#004D98)",
  "Betis":                    "linear-gradient(160deg,#00954C,#004422)",
  "Cádiz":                    "linear-gradient(160deg,#F4D03F,#002F6C)",
  "Celta de Vigo":            "linear-gradient(160deg,#8DB7E2,#4488BB)",
  "Córdoba":                  "linear-gradient(160deg,#009A44,#004422)",
  "Deportivo de La Coruña":   "linear-gradient(160deg,#0055A4,#003366)",
  "Elche":                    "linear-gradient(160deg,#007A33,#004422)",
  "Espanyol":                 "linear-gradient(160deg,#003DA5,#001A5E)",
  "Getafe":                   "linear-gradient(160deg,#005BAC,#003366)",
  "Girona":                   "linear-gradient(160deg,#CC0000,#880000)",
  "Granada":                  "linear-gradient(160deg,#CC0000,#880000)",
  "Leganés":                  "linear-gradient(160deg,#003DA5,#001A5E)",
  "Levante":                  "linear-gradient(160deg,#C8102E,#004EA8)",
  "Málaga":                   "linear-gradient(160deg,#003DA5,#001A5E)",
  "Mallorca":                 "linear-gradient(160deg,#E31837,#000000)",
  "Murcia":                   "linear-gradient(160deg,#CC0000,#880000)",
  "Numancia":                 "linear-gradient(160deg,#CC0000,#000000)",
  "Osasuna":                  "linear-gradient(160deg,#CC0000,#003DA5)",
  "Oviedo":                   "linear-gradient(160deg,#003DA5,#001A5E)",
  "Rayo Vallecano":           "linear-gradient(160deg,#CC0000,#880000)",
  "Racing de Santander":      "linear-gradient(160deg,#009A44,#004422)",
  "Real Madrid":              "linear-gradient(160deg,#0c130f,#161f16)",
  "Real Sociedad":            "linear-gradient(160deg,#003DA5,#001A5E)",
  "Real Valladolid":          "linear-gradient(160deg,#5B2D8E,#2D1647)",
  "Real Zaragoza":            "linear-gradient(160deg,#003DA5,#001A5E)",
  "Recreativo de Huelva":     "linear-gradient(160deg,#CC0000,#000000)",
  "Sevilla":                  "linear-gradient(160deg,#CC0000,#880000)",
  "Sporting de Gijón":        "linear-gradient(160deg,#CC0000,#880000)",
  "Tenerife":                 "linear-gradient(160deg,#003DA5,#001A5E)",
  "Valencia":                 "linear-gradient(160deg,#FF6900,#CC4400)",
  "Valladolid":               "linear-gradient(160deg,#5B2D8E,#2D1647)",
  "Villarreal":               "linear-gradient(160deg,#FFD700,#AA9900)",
  "Xerez":                    "linear-gradient(160deg,#003DA5,#001A5E)",
};

function slugify(str){
  return (str || "")
    .toLowerCase()
    .replace(/&/g,"and")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

let allPlayers   = [];
let allTeamStats = [];

async function init(){
  try{
    const [teamsRes, playersRes, statsRes] = await Promise.all([
      fetch("/data/la_liga/teams.json"),
      fetch("/data/la_liga/players.json"),
      fetch("/data/la_liga/team-stats.json")
    ]);
    const teams  = await teamsRes.json();
    allPlayers   = await playersRes.json();
    allTeamStats = await statsRes.json();

    const teamNames = teams.map(t => t.name || t.team).filter(Boolean).sort();
    const sel1 = document.getElementById("team1Select");
    const sel2 = document.getElementById("team2Select");

    teamNames.forEach(name => {
      sel1.innerHTML += `<option value="${name}">${name}</option>`;
      sel2.innerHTML += `<option value="${name}">${name}</option>`;
    });

    const params = new URLSearchParams(window.location.search);
    if(params.get("team1")) sel1.value = params.get("team1");
    if(params.get("team2")) sel2.value = params.get("team2");
    if(params.get("team1") && params.get("team2")) loadH2H();

  }catch(err){
    console.error(err);
  }
}

async function loadH2H(){
  const team1 = document.getElementById("team1Select").value;
  const team2 = document.getElementById("team2Select").value;

  if(!team1 || !team2){
    alert("Please select both teams");
    return;
  }
  if(team1 === team2){
    alert("Please select two different teams");
    return;
  }

  const url = new URL(window.location);
  url.searchParams.set("team1", team1);
  url.searchParams.set("team2", team2);
  window.history.pushState({}, "", url);

  const results = document.getElementById("results");
  results.className = "";
  results.innerHTML = '<div class="loading">Loading head to head data...</div>';

  try{
    const allSeasonIds = [];
    for(let y = 1929; y <= 2025; y++) allSeasonIds.push(`${y}-${y+1}`);

    const seasonData = await Promise.all(allSeasonIds.map(async sid => {
      try{
        const r = await fetch(`/data/laliga/seasons/${sid}.json`);
        if(!r.ok) return [];
        const data = await r.json();
        const games = Array.isArray(data) ? data : (data.games || []);
        return games
          .filter(g => (g.home === team1 && g.away === team2) || (g.home === team2 && g.away === team1))
          .map(g => ({...g, season: sid}));
      }catch(e){ return []; }
    }));

    const sharedSeasons = allSeasonIds;
    const h2hGames = seasonData.flat();

    function calcStats(team){
      let wins=0, draws=0, losses=0, goals=0, goalsAgainst=0;
      h2hGames.forEach(g => {
        const isHome = g.home === team;
        const tf = isHome ? Number(g.score_home||0) : Number(g.score_away||0);
        const of = isHome ? Number(g.score_away||0) : Number(g.score_home||0);
        goals += tf;
        goalsAgainst += of;
        if(tf > of) wins++;
        else if(tf < of) losses++;
        else draws++;
      });
      return { wins, draws, losses, goals, goalsAgainst };
    }

    const s1 = calcStats(team1);
    const s2 = calcStats(team2);

    function getScorers(team, opponent){
      return allPlayers
        .filter(p => p.teams && p.teams.includes(team))
        .map(p => {
          const goals = (p.season_stats || [])
            .filter(s => s.team === team)
            .reduce((sum, s) => sum + ((s.goals_by_opponent || {})[opponent] || 0), 0);
          return { name: p.name, goals };
        })
        .filter(p => p.goals > 0)
        .sort((a,b) => b.goals - a.goals)
        .slice(0, 10);
    }

    const scorers1 = getScorers(team1, team2);
    const scorers2 = getScorers(team2, team1);

    const grad1 = TEAM_COLOURS[team1] || 'linear-gradient(160deg,#0c130f,#161f16)';
    const grad2 = TEAM_COLOURS[team2] || 'linear-gradient(160deg,#0c130f,#161f16)';

    function scorerRows(list){
      if(!list.length) return `<tr><td colspan="2">No data</td></tr>`;
      return list.map(p => `
        <tr>
          <td><a class="player-link" href="/laliga-player.html?player=${encodeURIComponent(slugify(p.name))}">${p.name}</a></td>
          <td>${p.goals}</td>
        </tr>`).join('');
    }

    function gameRows(){
      if(!h2hGames.length) return `<tr><td colspan="5">No matches found</td></tr>`;
      return [...h2hGames].reverse().map(g => {
        const t1home = g.home === team1;
        const sh   = Number(g.score_home || 0);
        const sa   = Number(g.score_away || 0);
        const t1g  = t1home ? sh : sa;
        const t2g  = t1home ? sa : sh;
        const res1 = t1g > t2g ? 'W' : t1g < t2g ? 'L' : 'D';
        const cls  = t1g > t2g ? 'result-win' : t1g < t2g ? 'result-loss' : 'result-draw';
        return `
          <tr onclick="window.location.href='/laliga-game.html?match=${encodeURIComponent(g.match_id)}&season=${encodeURIComponent(g.season)}'">
            <td>${g.season}</td>
            <td>${g.home}</td>
            <td>${sh} - ${sa}</td>
            <td>${g.away}</td>
            <td class="${cls}">${res1}</td>
          </tr>`;
      }).join('');
    }

    results.innerHTML = `

      <div class="h2h-header">
        <div class="team-banner" style="background:${grad1};">
          <h2>${team1}</h2>
          <p>${s1.wins}W ${s1.draws}D ${s1.losses}L</p>
        </div>
        <div class="h2h-score">
          <div class="h2h-score-nums">
            <span style="color:#1e7a3d">${s1.wins}</span>
            <span style="color:var(--faint);font-size:28px">-</span>
            <span style="color:var(--faint);font-size:28px">${s1.draws}</span>
            <span style="color:var(--faint);font-size:28px">-</span>
            <span style="color:#c0362c">${s2.wins}</span>
          </div>
          <div class="h2h-score-label">${h2hGames.length} meetings</div>
        </div>
        <div class="team-banner" style="background:${grad2};">
          <h2>${team2}</h2>
          <p>${s2.wins}W ${s2.draws}D ${s2.losses}L</p>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value">${h2hGames.length}</div><div class="stat-label">Meetings</div></div>
        <div class="stat-card"><div class="stat-value">${s1.wins}</div><div class="stat-label">${team1} Wins</div></div>
        <div class="stat-card"><div class="stat-value">${s1.draws}</div><div class="stat-label">Draws</div></div>
        <div class="stat-card"><div class="stat-value">${s2.wins}</div><div class="stat-label">${team2} Wins</div></div>
        <div class="stat-card"><div class="stat-value">${s1.goals}</div><div class="stat-label">${team1} Goals</div></div>
        <div class="stat-card"><div class="stat-value">${s2.goals}</div><div class="stat-label">${team2} Goals</div></div>
      </div>

      <div class="tables-grid">
        <div class="section">
          <div class="section-title">${team1} Top Scorers</div>
          <table>
            <thead><tr><th>Player</th><th>Goals vs ${team2}</th></tr></thead>
            <tbody>${scorerRows(scorers1)}</tbody>
          </table>
        </div>
        <div class="section">
          <div class="section-title">${team2} Top Scorers</div>
          <table>
            <thead><tr><th>Player</th><th>Goals vs ${team1}</th></tr></thead>
            <tbody>${scorerRows(scorers2)}</tbody>
          </table>
        </div>
      </div>

      <div class="section">
        <div class="section-title">All Meetings</div>
        <table class="games-table">
          <thead>
            <tr>
              <th>Season</th>
              <th>Home</th>
              <th>Score</th>
              <th>Away</th>
              <th>${team1} Result</th>
            </tr>
          </thead>
          <tbody>${gameRows()}</tbody>
        </table>
      </div>
    `;

  }catch(err){
    console.error(err);
    results.innerHTML = `<div class="error">Failed to load head to head data</div>`;
  }
}

init();
</script>
</body>
</html>
