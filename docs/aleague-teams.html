<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>A-League Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:700;
color:#0056d6;
}

.hero{
background:linear-gradient(135deg,#002f6c,#0057b8);
color:white;
padding:70px 20px;
text-align:center;
}

.hero h1{
margin:0;
font-size:64px;
font-weight:900;
}

.hero p{
margin-top:14px;
font-size:22px;
font-weight:600;
opacity:.95;
}

.container{
max-width:1600px;
margin:40px auto;
padding:0 20px;
}

.search-wrap{
margin-bottom:28px;
display:flex;
justify-content:center;
}

#teamSearch{
width:100%;
max-width:520px;
padding:16px 18px;
font-size:18px;
border-radius:14px;
border:1px solid #d7dbe3;
outline:none;
font-family:Inter,system-ui,Arial,sans-serif;
font-weight:600;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

#teamSearch:focus{
border-color:#002f6c;
box-shadow:0 0 0 4px rgba(0,47,108,.15);
}

.team-count{
margin-bottom:24px;
font-size:18px;
font-weight:700;
color:#555;
text-align:center;
}

.teams-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:24px;
}

.team-card{
background:white;
border-radius:18px;
overflow:hidden;
text-decoration:none;
color:#111;
box-shadow:0 2px 10px rgba(0,0,0,.08);
transition:.2s ease;
display:block;
}

.team-card:hover{
transform:translateY(-4px);
box-shadow:0 8px 24px rgba(0,0,0,.14);
}

.team-band{
height:10px;
width:100%;
}

.team-content{
padding:28px 22px;
}

.team-name{
font-size:30px;
font-weight:900;
margin-bottom:10px;
line-height:1.15;
}

.team-meta{
font-size:16px;
color:#666;
font-weight:600;
}

.no-results{
text-align:center;
font-size:22px;
font-weight:800;
padding:60px 20px;
color:#666;
display:none;
}

@media(max-width:900px){

.hero h1{
font-size:42px;
}

.hero p{
font-size:18px;
}

.team-name{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/aleague.html">A-League</a>
<a href="/aleague-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div class="hero">
<h1>A-League Teams</h1>
<p>Every club to play in the A-League</p>
</div>

<div class="container">

<div class="search-wrap">
<input type="text" id="teamSearch" placeholder="Search teams...">
</div>

<div class="team-count" id="teamCount"></div>

<div class="teams-grid" id="teamsGrid"></div>

<div class="no-results" id="noResults">No teams found</div>

</div>

<script>

const TEAMS = [

{ name:"Adelaide United",          colour:"linear-gradient(90deg,#EF0107,#000000)" },
{ name:"Auckland FC",              colour:"linear-gradient(90deg,#0057b8,#ffffff)" },
{ name:"Brisbane Roar",            colour:"linear-gradient(90deg,#F47920,#000000)" },
{ name:"Central Coast Mariners",   colour:"linear-gradient(90deg,#F7941D,#003087)" },
{ name:"Gold Coast United",        colour:"linear-gradient(90deg,#FFD700,#CC0000)" },
{ name:"Macarthur FC",             colour:"linear-gradient(90deg,#1A1A1A,#ffffff)" },
{ name:"Melbourne City",           colour:"linear-gradient(90deg,#6CABDD,#1C2C5B)" },
{ name:"Melbourne Heart",          colour:"linear-gradient(90deg,#CC0033,#ffffff)" },
{ name:"Melbourne Victory",        colour:"linear-gradient(90deg,#001489,#ffffff)" },
{ name:"Newcastle Jets",           colour:"linear-gradient(90deg,#003087,#ffffff)" },
{ name:"New Zealand Knights",      colour:"linear-gradient(90deg,#000000,#ffffff)" },
{ name:"North Queensland Fury",    colour:"linear-gradient(90deg,#FF6600,#000000)" },
{ name:"Perth Glory",              colour:"linear-gradient(90deg,#5B0FA8,#ffffff)" },
{ name:"Queensland Roar",          colour:"linear-gradient(90deg,#F47920,#000000)" },
{ name:"Sydney FC",                colour:"linear-gradient(90deg,#009FDF,#00005a)" },
{ name:"Wellington Phoenix",       colour:"linear-gradient(90deg,#F5A800,#000000)" },
{ name:"Western Sydney Wanderers", colour:"linear-gradient(90deg,#CC0000,#111111)" },
{ name:"Western United",           colour:"linear-gradient(90deg,#1A1A1A,#ffffff)" },

];

const grid      = document.getElementById("teamsGrid");
const search    = document.getElementById("teamSearch");
const count     = document.getElementById("teamCount");
const noResults = document.getElementById("noResults");

function renderTeams(filter=""){

  grid.innerHTML = "";

  const filtered = TEAMS
    .sort((a,b) => a.name.localeCompare(b.name))
    .filter(team => team.name.toLowerCase().includes(filter.toLowerCase()));

  count.innerHTML = `${filtered.length} Teams`;

  if(filtered.length === 0){
    noResults.style.display = "block";
    return;
  }

  noResults.style.display = "none";

  filtered.forEach(team => {
    grid.innerHTML += `
      <a class="team-card" href="/aleague-team.html?team=${encodeURIComponent(team.name)}">
        <div class="team-band" style="background:${team.colour};"></div>
        <div class="team-content">
          <div class="team-name">${team.name}</div>
          <div class="team-meta">View club stats, results and players</div>
        </div>
      </a>
    `;
  });

}

search.addEventListener("input", e => renderTeams(e.target.value));

renderTeams();

</script>

</body>
</html>
