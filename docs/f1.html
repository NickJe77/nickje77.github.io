<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:44px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:10px;display:block;
}
.hero h1{
  margin:0 0 14px;font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,42px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero p{
  max-width:640px;margin:0 auto;color:rgba(255,255,255,.68);line-height:1.6;font-size:14.5px;
}

/* ── Tile grid ────────────────────────────────────────── */
.tile-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;
}
.tile{
  display:flex;align-items:center;justify-content:center;min-height:120px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 22px;text-decoration:none;color:var(--ink);
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.tile:hover{
  transform:translateY(-3px);border-color:var(--accent);background:var(--accent-soft);
}
.tile .tile-title{
  font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em;
  text-transform:uppercase;color:var(--ink);
}
</style>
