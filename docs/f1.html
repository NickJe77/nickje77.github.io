<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Formula 1 Results | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:20px;}

.year-grid{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-bottom:25px;
}
.year-btn{
  padding:8px 14px;
  border-radius:12px;
  border:1px solid #ccc;
  background:#e0e0e0;
  cursor:pointer;
  font-size:15px;
}
.year-btn.active{
  background:#222;
  color:white;
  border-color:#222;
}

.tile-wrap{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:30px;
}
.tile{
  border:1px solid #ddd;
  border-radius:10px;
  padding:16px;
  background:#f6f9ff;
  text-align:center;
}
.tile h3{
  margin:0 0 6px 0;
  font-size:14px;
  color:#555;
  font-weight:600;
}
.tile div{
  font-size:22px;
  font-weight:700;
}

details{
  margin-bottom:20px;
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px;
}
summary{
  cursor:pointer;
  font-weight:700;
  font-size:18px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{background:#f0f0f0;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>Formula 1 Results</h1>
<p>Race results by season (1950–present).</p>

<div class="year-grid" id="yearGrid"></div>

<div class="tile-wrap">
  <div class="tile">
    <h3>Season</h3>
    <div id="tileSeason">—</div>
  </div>
  <div class="tile">
    <h3>Champion</h3>
    <div id="tileChampion">—</div>
  </div>
  <div class="tile">
    <h3>Total Points</h3>
    <div id="tilePoints">—</div>
  </div>
</div>

<div id="results"></div>

</div>

<script>
const yearGrid = document.getElementById("yearGrid");
const resultsDiv = document.getElementById("results");

const tileSeason = document.getElementById("tileSeason");
const tileChampion = document.getElementById("tileChampion");
const tilePoints = document.getElementById("tilePoints");

const startYear = 1950;
const endYear = new Date().getFullYear();

function cleanDriver(name){
  return name.replace(/\s[A-Z]{3}$/, "");
}

const flagMap = {
  "Australia":"🇦🇺",
  "China":"🇨🇳",
  "Japan":"🇯🇵",
  "Bahrain":"🇧🇭",
  "Saudi Arabia":"🇸🇦",
  "Monaco":"🇲🇨",
  "Italy":"🇮🇹",
  "Spain":"🇪🇸",
  "Canada":"🇨🇦",
  "Austria":"🇦🇹",
  "Hungary":"🇭🇺",
  "Belgium":"🇧🇪",
  "Netherlands":"🇳🇱",
  "UK":"🇬🇧",
  "United Kingdom":"🇬🇧",
  "Mexico":"🇲🇽",
  "Brazil":"🇧🇷",
  "USA":"🇺🇸",
  "United States":"🇺🇸",
  "Qatar":"🇶🇦",
  "Abu Dhabi":"🇦🇪",
  "UAE":"🇦🇪"
};

function cleanRaceName(name){
  let n = name.replace(/^Flag of\s+/i,"").trim();
  const parts = n.split(" ");
  if(parts.length > 1 && parts[parts.length-1] === parts[parts.length-2]){
    n = parts.slice(0, -1).join(" ");
  }
  return n;
}

function raceWithFlag(name){
  const clean = cleanRaceName(name);
  const flag = flagMap[clean] || "";
  return flag ? `${clean} ${flag}` : clean;
}

for(let y=startYear; y<=endYear; y++){
  const btn=document.createElement("button");
  btn.className="year-btn";
  btn.textContent=y;
  btn.onclick=()=>loadSeason(y);
  btn.id="year-"+y;
  yearGrid.appendChild(btn);
}

async function loadSeason(year){
  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  const activeBtn=document.getElementById("year-"+year);
  if(activeBtn) activeBtn.classList.add("active");

  tileSeason.textContent=year;
  tileChampion.textContent="—";
  tilePoints.textContent="—";
  resultsDiv.innerHTML="Loading…";

  try{
    const res=await fetch(`data/f1/${year}.json`);
    if(!res.ok){
      resultsDiv.innerHTML="<p>No data for this season.</p>";
      return;
    }
    const data=await res.json();
    renderSeason(data);
  }catch(e){
    resultsDiv.innerHTML="<p>Error loading season.</p>";
  }
}

function renderSeason(data){
  resultsDiv.innerHTML="";
  if(!data.races || data.races.length===0){
    resultsDiv.innerHTML="<p>No races available.</p>";
    return;
  }

  let totals={};

  data.races.forEach(race=>{
    race.results.forEach(r=>{
      const pts=Number(r.points)||0;
      if(!totals[r.driver]) totals[r.driver]=0;
      totals[r.driver]+=pts;
    });
  });

  let champion="—", champPoints=0;
  Object.entries(totals).forEach(([driver,pts])=>{
    if(pts>champPoints){
      champPoints=pts;
      champion=driver;
    }
  });

  tileChampion.textContent=cleanDriver(champion);
  tilePoints.textContent=champPoints;

  data.races.forEach(race=>{
    const details=document.createElement("details");
    const summary=document.createElement("summary");
    summary.textContent = `Round ${race.round} – ${raceWithFlag(race.grand_prix)}`;
    details.appendChild(summary);

    const table=document.createElement("table");
    table.innerHTML=`
      <thead>
        <tr>
          <th>Pos</th>
          <th>Driver</th>
          <th>Team</th>
          <th>Grid</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody=table.querySelector("tbody");

    race.results
      .sort((a,b)=>a.pos-b.pos)
      .forEach(r=>{
        const tr=document.createElement("tr");
        tr.innerHTML=`
          <td>${r.pos}</td>
          <td>${cleanDriver(r.driver)}</td>
          <td>${r.team}</td>
          <td>${r.grid ?? ""}</td>
          <td>${r.points}</td>
        `;
        tbody.appendChild(tr);
      });

    details.appendChild(table);
    resultsDiv.appendChild(details);
  });
}

loadSeason(endYear);
</script>

</body>
</html>
