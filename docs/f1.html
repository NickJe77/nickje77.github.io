<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Formula 1 Results | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:20px;}

/* year tiles */
.year-grid{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-bottom:25px;
}
.year-btn{
  padding:8px 14px;
  border-radius:12px;
  border:1px solid #ccc;
  background:#e0e0e0;
  cursor:pointer;
  font-size:15px;
}
.year-btn.active{
  background:#222;
  color:white;
  border-color:#222;
}

/* tiles */
.tile-wrap{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:30px;
}
.tile{
  border:1px solid #ddd;
  border-radius:10px;
  padding:16px;
  background:#f6f9ff;
  text-align:center;
}
.tile h3{
  margin:0 0 6px 0;
  font-size:14px;
  color:#555;
  font-weight:600;
}
.tile div{
  font-size:22px;
  font-weight:700;
}

/* tables */
table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:40px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{background:#f0f0f0;}

.race-title{
  margin-top:30px;
  font-size:20px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>Formula 1 Results</h1>
<p>Race results by season (1950–present).</p>

<!-- YEAR BUTTONS -->
<div class="year-grid" id="yearGrid"></div>

<!-- SUMMARY TILES -->
<div class="tile-wrap">
  <div class="tile">
    <h3>Season</h3>
    <div id="tileSeason">—</div>
  </div>
  <div class="tile">
    <h3>Champion</h3>
    <div id="tileChampion">—</div>
  </div>
  <div class="tile">
    <h3>Total Points</h3>
    <div id="tilePoints">—</div>
  </div>
</div>

<div id="results"></div>

</div>

<script>
const yearGrid = document.getElementById("yearGrid");
const resultsDiv = document.getElementById("results");

const tileSeason = document.getElementById("tileSeason");
const tileChampion = document.getElementById("tileChampion");
const tilePoints = document.getElementById("tilePoints");

const startYear = 1950;
const endYear = new Date().getFullYear();

// build year buttons
for(let y=startYear; y<=endYear; y++){
  const btn = document.createElement("button");
  btn.className = "year-btn";
  btn.textContent = y;
  btn.onclick = () => loadSeason(y);
  btn.id = "year-" + y;
  yearGrid.appendChild(btn);
}

async function findLatestSeasonWithData(){
  for(let y=endYear; y>=startYear; y--){
    try{
      const res = await fetch(`data/f1/${y}.json`);
      if(!res.ok) continue;
      const data = await res.json();
      if(data.races && data.races.length > 0){
        return y;
      }
    }catch(e){}
  }
  return null;
}

async function loadSeason(year){
  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  const activeBtn = document.getElementById("year-"+year);
  if(activeBtn) activeBtn.classList.add("active");

  tileSeason.textContent = year;
  tileChampion.textContent = "—";
  tilePoints.textContent = "—";
  resultsDiv.innerHTML = "Loading…";

  try{
    const res = await fetch(`data/f1/${year}.json`);
    if(!res.ok){
      resultsDiv.innerHTML = "<p>No data for this season.</p>";
      return;
    }
    const data = await res.json();
    renderSeason(data);
  }catch(e){
    resultsDiv.innerHTML = "<p>Error loading season.</p>";
  }
}

function renderSeason(data){
  resultsDiv.innerHTML = "";

  if(!data.races || data.races.length===0){
    resultsDiv.innerHTML = "<p>No races available for this season.</p>";
    return;
  }

  let totals = {};

  data.races.forEach(race=>{
    race.results.forEach(r=>{
      if(!totals[r.driver]) totals[r.driver]=0;
      totals[r.driver]+=Number(r.points)||0;
    });
  });

  let champion="—";
  let champPoints=0;

  Object.entries(totals).forEach(([driver,pts])=>{
    if(pts>champPoints){
      champPoints=pts;
      champion=driver;
    }
  });

  tileChampion.textContent = champion;
  tilePoints.textContent = champPoints;

  data.races.forEach(race=>{
    const h=document.createElement("div");
    h.className="race-title";
    h.textContent=`Round ${race.round} – ${race.grand_prix}`;
    resultsDiv.appendChild(h);

    const table=document.createElement("table");
    table.innerHTML=`
      <thead>
        <tr>
          <th>Pos</th>
          <th>Driver</th>
          <th>Team</th>
          <th>Grid</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody=table.querySelector("tbody");

    race.results
      .sort((a,b)=>b.points-a.points)
      .forEach((r,i)=>{
        const tr=document.createElement("tr");
        tr.innerHTML=`
          <td>${i+1}</td>
          <td>${r.driver}</td>
          <td>${r.team}</td>
          <td>${r.grid ?? ""}</td>
          <td>${r.points}</td>
        `;
        tbody.appendChild(tr);
      });

    resultsDiv.appendChild(table);
  });
}

// load latest real season (skip empty 2026)
findLatestSeasonWithData().then(y=>{
  if(y) loadSeason(y);
});
</script>

</body>
</html>
