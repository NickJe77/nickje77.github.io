<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Formula 1 Results | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:20px;}

.year-grid{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-bottom:25px;
}
.year-btn{
  padding:8px 14px;
  border-radius:12px;
  border:1px solid #ccc;
  background:#e0e0e0;
  cursor:pointer;
  font-size:15px;
}
.year-btn.active{
  background:#222;
  color:white;
  border-color:#222;
}

.tile-wrap{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:30px;
}
.tile{
  border:1px solid #ddd;
  border-radius:10px;
  padding:16px;
  background:#f6f9ff;
  text-align:center;
}
.tile h3{
  margin:0 0 6px 0;
  font-size:14px;
  color:#555;
  font-weight:600;
}
.tile div{
  font-size:22px;
  font-weight:700;
}

details{
  margin-bottom:20px;
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px;
}
summary{
  cursor:pointer;
  font-weight:700;
  font-size:18px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{background:#f0f0f0;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<h1>Formula 1 Results</h1>
<p>Race results by season (1950–present).</p>

<div class="year-grid" id="yearGrid"></div>

<div class="tile-wrap">
  <div class="tile">
    <h3>Season</h3>
    <div id="tileSeason">—</div>
  </div>
  <div class="tile">
    <h3>Champion</h3>
    <div id="tileChampion">—</div>
  </div>
  <div class="tile">
    <h3>Total Points</h3>
    <div id="tilePoints">—</div>
  </div>
</div>

<div id="results"></div>

</div>

<script>
const yearGrid = document.getElementById("yearGrid");
const resultsDiv = document.getElementById("results");

const tileSeason = document.getElementById("tileSeason");
const tileChampion = document.getElementById("tileChampion");
const tilePoints = document.getElementById("tilePoints");

const startYear = 1950;
const endYear = new Date().getFullYear();

function cleanDriver(name){
  return String(name || "").replace(/\s[A-Z]{3}$/, "");
}

/* ================= FLAGS ================= */

const flagByCountry = {
  "Australia":"🇦🇺",
  "Bahrain":"🇧🇭",
  "Saudi Arabia":"🇸🇦",
  "China":"🇨🇳",
  "Japan":"🇯🇵",
  "Monaco":"🇲🇨",
  "Spain":"🇪🇸",
  "Canada":"🇨🇦",
  "Austria":"🇦🇹",
  "Great Britain":"🇬🇧",
  "Belgium":"🇧🇪",
  "Hungary":"🇭🇺",
  "Netherlands":"🇳🇱",
  "Italy":"🇮🇹",
  "Azerbaijan":"🇦🇿",
  "Singapore":"🇸🇬",
  "United States":"🇺🇸",
  "Mexico":"🇲🇽",
  "Brazil":"🇧🇷",
  "Qatar":"🇶🇦",
  "United Arab Emirates":"🇦🇪",
  "France":"🇫🇷",
  "Switzerland":"🇨🇭",
  "Argentina":"🇦🇷",
  "Germany":"🇩🇪",
  "Portugal":"🇵🇹",
  "Morocco":"🇲🇦",
  "South Africa":"🇿🇦",
  "Sweden":"🇸🇪",
  "San Marino":"🇸🇲",
  "Turkey":"🇹🇷",
  "Russia":"🇷🇺",
  "Malaysia":"🇲🇾",
  "South Korea":"🇰🇷",
  "India":"🇮🇳"
};

/* ================= OVERRIDES ================= */

const raceOverrides = {
  "France Switzerland":"Switzerland",
  "Germany Europe":"Germany",
  "Pacific Japan":"Japan",
  "Türkiye Turkey":"Turkey",
  "Peoples Republic of China China":"China",
  "People's Republic of China China":"China",
  "of America Las Vegas":"Las Vegas",
  "of America Miami":"Miami",
  "of America United States":"United States",
  "Republic of Korea South Korea":"South Korea"
};

/* ================= NORMALISE ================= */

function normalizeGpRaw(s){
  let n = String(s || "").trim();
  n = n.replace(/^Flag of\s+/i,"").trim();
  n = n.replace(/\s+/g," ").trim();

  if(raceOverrides[n]) return raceOverrides[n];

  const parts = n.split(" ");
  if(parts.length % 2 === 0){
    const half = parts.length / 2;
    if(parts.slice(0,half).join(" ") === parts.slice(half).join(" ")){
      n = parts.slice(0,half).join(" ");
    }
  }
  return n;
}

function parseGpName(grandPrix){
  let raw = normalizeGpRaw(grandPrix);

  const countries = Object.keys(flagByCountry).sort((a,b)=>b.length-a.length);

  for(const c of countries){
    if(raw === c){
      return { label: c, country: c };
    }
    if(raw.startsWith(c + " ")){
      const venue = raw.slice(c.length).trim();
      if(!venue || venue === c) return { label: c, country: c };
      return { label: venue, country: c };
    }
  }

  return { label: raw, country: "" };
}

function formatRoundTitle(round, grandPrix){
  const parsed = parseGpName(grandPrix);
  const flag = parsed.country ? flagByCountry[parsed.country] : "";
  return `Round ${round} – ${parsed.label}${flag ? " " + flag : ""}`;
}

/* ================= YEAR BUTTONS ================= */

for(let y=startYear; y<=endYear; y++){
  const btn=document.createElement("button");
  btn.className="year-btn";
  btn.textContent=y;
  btn.onclick=()=>loadSeason(y);
  btn.id="year-"+y;
  yearGrid.appendChild(btn);
}

/* ================= LOAD ================= */

async function loadSeason(year){
  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  const activeBtn=document.getElementById("year-"+year);
  if(activeBtn) activeBtn.classList.add("active");

  tileSeason.textContent=year;
  tileChampion.textContent="—";
  tilePoints.textContent="—";
  resultsDiv.innerHTML="Loading…";

  try{
    const res=await fetch(`data/f1/${year}.json`);
    if(!res.ok){
      resultsDiv.innerHTML="<p>No data for this season.</p>";
      return;
    }
    const data=await res.json();
    renderSeason(data);
  }catch(e){
    resultsDiv.innerHTML="<p>Error loading season.</p>";
  }
}

/* ================= RENDER ================= */

function renderSeason(data){
  resultsDiv.innerHTML="";
  if(!data.races || data.races.length===0){
    resultsDiv.innerHTML="<p>No races available.</p>";
    return;
  }

  let totals={};

  data.races.forEach(race=>{
    (race.results||[]).forEach(r=>{
      const pts=Number(r.points)||0;
      if(!totals[r.driver]) totals[r.driver]=0;
      totals[r.driver]+=pts;
    });
  });

  let champion="—", champPoints=-1;
  Object.entries(totals).forEach(([driver,pts])=>{
    if(pts>champPoints){
      champPoints=pts;
      champion=driver;
    }
  });

  tileChampion.textContent=cleanDriver(champion);
  tilePoints.textContent=(champPoints>=0?champPoints:"—");

  data.races.forEach(race=>{
    const details=document.createElement("details");
    const summary=document.createElement("summary");
    summary.textContent = formatRoundTitle(race.round, race.grand_prix);
    details.appendChild(summary);

    const table=document.createElement("table");
    table.innerHTML=`
      <thead>
        <tr>
          <th>Pos</th>
          <th>Driver</th>
          <th>Team</th>
          <th>Grid</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody=table.querySelector("tbody");

    const results = (race.results||[]).slice();
    results.sort((a,b)=>Number(a.position)-Number(b.position));

    results.forEach(r=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${r.position}</td>
        <td>${cleanDriver(r.driver)}</td>
        <td>${r.team||""}</td>
        <td>${r.grid||""}</td>
        <td>${r.points||0}</td>
      `;
      tbody.appendChild(tr);
    });

    details.appendChild(table);
    resultsDiv.appendChild(details);
  });
}

loadSeason(endYear);
</script>

</body>
</html>
