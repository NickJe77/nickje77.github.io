<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Results by Year</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin:20px; }
h1 { text-align:center; }

.year-buttons, .round-buttons {
  display:flex; flex-wrap:wrap; gap:8px;
  justify-content:center; margin-bottom:15px;
}

button {
  padding:8px 14px;
  border:1px solid #ccc;
  background:#f5f5f5;
  cursor:pointer;
}
button.active { background:#ddd; font-weight:bold; }

select { padding:8px; margin-bottom:15px; }

.match { padding:8px; border-bottom:1px solid #eee; }
.win { background:#e9f9ec; }
.loss { background:#fdecec; }
.draw { background:#fff; }

.star { color:goldenrod; font-size:14px; margin-left:20px; }

table { border-collapse:collapse; width:100%; margin-top:30px; }
th, td { border:1px solid #ccc; padding:6px; text-align:center; }
th { background:#f0f0f0; }
</style>
</head>

<body>

<h1>AFL Results by Year</h1>

<div class="year-buttons" id="yearButtons"></div>

<div style="text-align:center">
Team:
<select id="teamSelect"></select>
</div>

<div class="round-buttons" id="roundButtons"></div>

<h2 id="heading">All Matches</h2>
<div id="matches"></div>

<h2 id="ladderTitle" style="margin-top:30px">Ladder</h2>
<div id="ladder"></div>

<script>
let currentYear = 1990;
let currentRound = "All";
let currentTeam = "All teams";

let rawRows = [];
let allMatches = [];
let allPlayers = [];

const years = [];
for(let y=1990;y<=2025;y++) years.push(y);

const roundOrder = [
 "Round 0",
 "Round 1","Round 2","Round 3","Round 4","Round 5","Round 6","Round 7","Round 8","Round 9","Round 10",
 "Round 11","Round 12","Round 13","Round 14","Round 15","Round 16","Round 17","Round 18","Round 19","Round 20",
 "Round 21","Round 22","Round 23","Round 24",
 "Elimination Final","Qualifying Final","Semi Final","Preliminary Final","Grand Final"
];

const ladderRounds = roundOrder.slice(0, roundOrder.indexOf("Elimination Final"));

function getActiveRoundOrder(){
  if(currentYear >= 2024){
    return roundOrder;
  } else {
    return roundOrder.filter(r => r !== "Round 0");
  }
}

function buildYearButtons(){
  const div=document.getElementById("yearButtons");
  div.innerHTML="";
  years.forEach(y=>{
    const b=document.createElement("button");
    b.textContent=y;
    if(y===currentYear) b.classList.add("active");
    b.onclick=()=>loadYear(y);
    div.appendChild(b);
  });
}

function buildRoundButtons(){
  const div=document.getElementById("roundButtons");
  div.innerHTML="";
  const activeRounds = getActiveRoundOrder();
  ["All",...activeRounds].forEach(r=>{
    const b=document.createElement("button");
    b.textContent=r;
    if(r===currentRound) b.classList.add("active");
    b.onclick=()=>{currentRound=r;render();}
    div.appendChild(b);
  });
}

function buildTeamSelect(){
  const sel=document.getElementById("teamSelect");
  sel.innerHTML="";
  const teams=[...new Set(allMatches.flatMap(m=>[m.home_team,m.away_team]))].sort();
  ["All teams",...teams].forEach(t=>{
    const o=document.createElement("option");
    o.value=t;
    o.textContent=t;
    sel.appendChild(o);
  });
  sel.onchange=()=>{currentTeam=sel.value;render();}
}

function loadYear(y){
  currentYear=y;
  currentRound="All";

  Promise.all([
    fetch(`data/afl/afl_${y}.json`).then(r=>r.json()),
    fetch(`docs/data/afl_players_by_year/players_${y}.json`).then(r=>r.ok ? r.json() : [])
  ]).then(([rows, players])=>{
    rawRows = rows;
    allPlayers = players;
    buildMatches();
    buildYearButtons();
    buildRoundButtons();
    buildTeamSelect();
    render();
  });
}

function buildMatches(){
  const map = {};
  rawRows.forEach(r=>{
    const id = Number(r.match_id);
    if(!map[id]){
      map[id] = {
        match_id: id,
        round: r.round,
        home_team: r.home_team,
        away_team: r.away_team,
        home_score: Number(r.home_points),
        away_score: Number(r.away_points)
      };
    }
  });
  allMatches = Object.values(map);
}

function getStars(match){
  return allPlayers.filter(p =>
    Number(p.match_id) === Number(match.match_id) &&
    (Number(p.D) >= 35 || Number(p.G) >= 5)
  ).map(s=>{
    let parts=[];
    if(Number(s.D)>=35) parts.push(`${s.D} disposals`);
    if(Number(s.G)>=5) parts.push(`${s.G} goals`);
    return `⭐ ${s.player} (${s.played_for}) – ${parts.join(" & ")}`;
  });
}

function buildLadder(matches){
  const table = {};

  matches.forEach(m=>{
    [m.home_team, m.away_team].forEach(t=>{
      if(!table[t]){
        table[t]={team:t,played:0,w:0,l:0,d:0,for:0,against:0,pts:0};
      }
    });

    const home=table[m.home_team];
    const away=table[m.away_team];

    home.played++; away.played++;
    home.for+=m.home_score; home.against+=m.away_score;
    away.for+=m.away_score; away.against+=m.home_score;

    if(m.home_score>m.away_score){ home.w++; away.l++; home.pts+=4; }
    else if(m.home_score<m.away_score){ away.w++; home.l++; away.pts+=4; }
    else { home.d++; away.d++; home.pts+=2; away.pts+=2; }
  });

  return Object.values(table).sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    const pctA=(a.for/a.against)*100;
    const pctB=(b.for/b.against)*100;
    return pctB-pctA;
  });
}

function renderLadder(list){
  const div=document.getElementById("ladder");
  const title=document.getElementById("ladderTitle");
  if(list.length===0){
    div.innerHTML="";
    title.style.display="none";
    return;
  }
  title.style.display="block";

  let html=`<table><tr>
  <th>Pos</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>D</th>
  <th>For</th><th>Against</th><th>%</th><th>Pts</th></tr>`;

  list.forEach((t,i)=>{
    const pct=((t.for/t.against)*100).toFixed(1);
    html+=`<tr>
    <td>${i+1}</td>
    <td>${t.team}</td>
    <td>${t.played}</td>
    <td>${t.w}</td>
    <td>${t.l}</td>
    <td>${t.d}</td>
    <td>${t.for}</td>
    <td>${t.against}</td>
    <td>${pct}</td>
    <td>${t.pts}</td>
    </tr>`;
  });

  html+=`</table>`;
  div.innerHTML=html;
}

function render(){
  const div=document.getElementById("matches");
  div.innerHTML="";
  document.getElementById("heading").textContent =
    currentRound==="All" ? "All Matches" : currentRound;

  const activeRounds = getActiveRoundOrder();

  let matchList=[...allMatches];
  if(currentRound!=="All"){
    matchList = matchList.filter(m=>m.round===currentRound);
  }
  if(currentTeam!=="All teams"){
    matchList = matchList.filter(m=>m.home_team===currentTeam||m.away_team===currentTeam);
  }

  matchList.sort((a,b)=>activeRounds.indexOf(a.round)-activeRounds.indexOf(b.round));

  matchList.forEach(m=>{
    const homeWin = m.home_score > m.away_score;
    const awayWin = m.away_score > m.home_score;

    let cls="draw";
    if(currentTeam!=="All teams"){
      if(m.home_team === currentTeam){
        cls = homeWin ? "win" : awayWin ? "loss" : "draw";
      } else if(m.away_team === currentTeam){
        cls = awayWin ? "win" : homeWin ? "loss" : "draw";
      }
    }

    const d=document.createElement("div");
    d.className=`match ${cls}`;
    d.innerHTML=`<strong>${m.round}</strong> — ${m.home_team} ${m.home_score} vs ${m.away_team} ${m.away_score}`;

    getStars(m).forEach(s=>{
      const st=document.createElement("div");
      st.className="star";
      st.textContent=s;
      d.appendChild(st);
    });

    div.appendChild(d);
  });

  if(currentRound !== "All" && !ladderRounds.includes(currentRound)){
    renderLadder([]);
    return;
  }

  let ladderMatches = allMatches.filter(m=>ladderRounds.includes(m.round));
  if(currentYear < 2024){
    ladderMatches = ladderMatches.filter(m=>m.round !== "Round 0");
  }

  if(currentRound!=="All"){
    const idx = ladderRounds.indexOf(currentRound);
    ladderMatches = ladderMatches.filter(m=>ladderRounds.indexOf(m.round)<=idx);
  }

  const ladder = buildLadder(ladderMatches);
  renderLadder(ladder);
}

buildYearButtons();
loadYear(currentYear);
</script>

</body>
</html>
