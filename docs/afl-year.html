<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AFL Season</title>
<style>
body { font-family: system-ui, Arial, sans-serif; }
button { margin:4px; padding:6px 10px; border-radius:6px; border:1px solid #ccc; cursor:pointer; }
.star { color:#d89b00; font-weight:600; }
.match { margin-bottom:10px; }
.round { margin-top:20px; }
</style>
</head>
<body>

<h1>AFL Season</h1>
<div id="yearButtons"></div>

<h2>Ladder</h2>
<div id="ladder"></div>

<div id="rounds"></div>

<script>
const years = [];
for (let y=1990;y<=2025;y++) years.push(y);

const yearButtons = document.getElementById("yearButtons");
years.forEach(y=>{
  const b=document.createElement("button");
  b.textContent=y;
  b.onclick=()=>loadYear(y);
  yearButtons.appendChild(b);
});

function loadYear(year){
  fetch(`data/afl/afl_${year}.json`,{cache:"no-store"})
  .then(r=>r.json())
  .then(rows=>{
    buildRounds(rows);
    buildLadder(rows);
  });
}

function buildRounds(rows){
  const roundsDiv=document.getElementById("rounds");
  roundsDiv.innerHTML="";

  const rounds={};

  rows.forEach(r=>{
    if(!rounds[r.round]) rounds[r.round]={};
    if(!rounds[r.round][r.match_id]) rounds[r.round][r.match_id]=[];
    rounds[r.round][r.match_id].push(r);
  });

  for(const round in rounds){
    const h=document.createElement("h2");
    h.textContent=round;
    roundsDiv.appendChild(h);

    for(const matchId in rounds[round]){
      const players=rounds[round][matchId];
      const m=players[0];

      const div=document.createElement("div");
      div.className="match";
      div.innerHTML=`${m.home_team} ${m.home_points} vs ${m.away_team} ${m.away_points}`;
      roundsDiv.appendChild(div);

      const stars = players.filter(p=>p.D>=35 || p.G>=5);
      stars.forEach(p=>{
        const s=document.createElement("div");
        s.className="star";
        s.textContent=`⭐ ${p.player} (${p.played_for}) – ${p.D} disposals ${p.G>0?`/ ${p.G} goals`:""}`;
        roundsDiv.appendChild(s);
      });
    }
  }
}

function buildLadder(rows){
  const ladderDiv=document.getElementById("ladder");
  ladderDiv.innerHTML="";

  const teams={};

  rows.forEach(r=>{
    if(!teams[r.home_team]) teams[r.home_team]={pts:0,for:0,against:0};
    if(!teams[r.away_team]) teams[r.away_team]={pts:0,for:0,against:0};

    teams[r.home_team].for += r.home_points;
    teams[r.home_team].against += r.away_points;
    teams[r.away_team].for += r.away_points;
    teams[r.away_team].against += r.home_points;

    if(r.home_points > r.away_points) teams[r.home_team].pts+=4;
    if(r.away_points > r.home_points) teams[r.away_team].pts+=4;
  });

  const sorted = Object.entries(teams).sort((a,b)=>b[1].pts-a[1].pts);

  sorted.forEach((t,i)=>{
    const d=document.createElement("div");
    d.textContent = `${i+1}. ${t[0]} – ${t[1].pts} pts`;
    ladderDiv.appendChild(d);
  });
}

</script>
</body>
</html>
