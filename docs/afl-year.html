<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Year by Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.year-grid{
  max-width:1200px;
  margin:30px auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:14px;
  padding:0 20px;
}
.year-tile{
  background:#111;
  color:#fff;
  padding:14px 0;
  text-align:center;
  border-radius:8px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}
.year-tile.active{background:#0056d6;}

#rounds button{
  margin:6px;
  padding:6px 10px;
  border:1px solid #ccc;
  background:#fff;
  cursor:pointer;
}

.game{
  padding:8px;
  border-bottom:1px solid #ddd;
}

.placeholder{
  color:#666;
  font-style:italic;
  padding:10px 0;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<h1 style="padding:20px;">AFL Year by Year</h1>

<div id="status" style="padding:0 20px;color:#555;">
  AFL match data will be added once full season records are collated.
</div>

<div id="years" class="year-grid"></div>
<div id="rounds" style="padding:20px;"></div>
<div id="games" style="padding:20px;"></div>
<div id="players" style="padding:20px;"></div>

<script>
/* TEMP YEAR RANGE UNTIL JSON IS READY */
const years = [];
for(let y=1990;y<=2025;y++) years.push(y);

const yearsBox=document.getElementById("years");
const roundsBox=document.getElementById("rounds");
const gamesBox=document.getElementById("games");
const playersBox=document.getElementById("players");

/* BUILD YEAR TILES */
years.forEach(y=>{
  const t=document.createElement("div");
  t.className="year-tile";
  t.textContent=y;
  t.onclick=()=>loadYear(y,t);
  yearsBox.appendChild(t);
});

/* AUTO SELECT LATEST */
if(yearsBox.lastChild) yearsBox.lastChild.click();

function loadYear(year,tile){
 document.querySelectorAll(".year-tile").forEach(x=>x.classList.remove("active"));
 tile.classList.add("active");

 roundsBox.innerHTML="<div class='placeholder'>Round data will appear here.</div>";
 gamesBox.innerHTML="<div class='placeholder'>Match results will appear here.</div>";
 playersBox.innerHTML="<div class='placeholder'>Player statistics will appear here.</div>";
}
</script>

</body>
</html>
