<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AFL Season</title>

<style>
body { font-family: system-ui, Arial, sans-serif; margin: 20px; }
.year-bar, .round-bar { margin-bottom: 15px; }

.year-btn, .round-btn {
  margin: 4px;
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid #ccc;
  background: #ddd;
  cursor: pointer;
  font-size: 15px;
}
.year-btn.active, .round-btn.active { background: #333; color: #fff; }

select { padding: 6px; font-size: 16px; margin-bottom: 15px; display: block; }

.match { margin-left: 15px; margin-bottom: 5px; }

.star { font-size: 18px; letter-spacing: 2px; font-weight: 700; }
</style>
</head>

<body>
<h1>AFL Season</h1>

<div id="yearBar" class="year-bar"></div>

<select id="teamSelect">
  <option value="ALL">All teams</option>
</select>

<div id="roundBar" class="round-bar"></div>

<div id="matches"></div>

<script>
const startYear = 1990;
const endYear = new Date().getFullYear();

const yearBar = document.getElementById("yearBar");
const teamSelect = document.getElementById("teamSelect");
const roundBar = document.getElementById("roundBar");
const matchesDiv = document.getElementById("matches");

let currentData = [];
let currentRound = "ALL";

// build year buttons
for (let y = startYear; y <= endYear; y++) {
  const btn = document.createElement("button");
  btn.textContent = y;
  btn.className = "year-btn";
  btn.onclick = () => loadYear(y);
  yearBar.appendChild(btn);
}

loadYear(startYear);

function loadYear(year) {
  currentRound = "ALL";

  document.querySelectorAll(".year-btn").forEach(b => b.classList.remove("active"));
  [...yearBar.children].find(b => b.textContent == year).classList.add("active");

  fetch(`data/afl/afl_${year}.json`)
    .then(res => res.json())
    .then(data => {
      currentData = data;
      buildTeamSelector(data);
      teamSelect.value = "ALL";   // 🔑 FIX: reset team filter
      buildRoundButtons(data);
      renderMatches();
    })
    .catch(() => {
      matchesDiv.innerHTML = "<p>No data for this year.</p>";
    });
}

function buildTeamSelector(data) {
  const teams = new Set();
  data.forEach(g => {
    teams.add(g.home_team);
    teams.add(g.away_team);
  });

  teamSelect.innerHTML = `<option value="ALL">All teams</option>`;
  [...teams].sort().forEach(t => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    teamSelect.appendChild(opt);
  });
}

function buildRoundButtons(data) {
  roundBar.innerHTML = "";

  const numericRounds = new Set();
  const nonNumericRounds = new Set();

  data.forEach(g => {
    const m = g.round.toString().match(/\d+/);
    if (m) numericRounds.add(parseInt(m[0]));
    else nonNumericRounds.add(g.round);
  });

  const sortedNumeric = [...numericRounds].sort((a, b) => a - b);
  const sortedNonNumeric = [...nonNumericRounds];

  const allBtn = document.createElement("button");
  allBtn.textContent = "All Rounds";
  allBtn.className = "round-btn active";
  allBtn.onclick = () => {
    currentRound = "ALL";
    setActiveRound(allBtn);
    renderMatches();
  };
  roundBar.appendChild(allBtn);

  sortedNumeric.forEach(num => {
    const btn = document.createElement("button");
    btn.textContent = num;
    btn.className = "round-btn";
    btn.onclick = () => {
      currentRound = num;
      setActiveRound(btn);
      renderMatches();
    };
    roundBar.appendChild(btn);
  });

  sortedNonNumeric.forEach(r => {
    const btn = document.createElement("button");
    btn.textContent = r;
    btn.className = "round-btn";
    btn.onclick = () => {
      currentRound = r;
      setActiveRound(btn);
      renderMatches();
    };
    roundBar.appendChild(btn);
  });
}

function setActiveRound(activeBtn) {
  document.querySelectorAll(".round-btn").forEach(b => b.classList.remove("active"));
  activeBtn.classList.add("active");
}

teamSelect.addEventListener("change", renderMatches);

function renderMatches() {
  matchesDiv.innerHTML = "";

  let filtered = currentData;

  if (teamSelect.value !== "ALL") {
    filtered = filtered.filter(g =>
      g.home_team === teamSelect.value || g.away_team === teamSelect.value
    );
  }

  if (currentRound !== "ALL") {
    filtered = filtered.filter(g => {
      const m = g.round.toString().match(/\d+/);
      if (typeof currentRound === "number") return m && parseInt(m[0]) === currentRound;
      return g.round === currentRound;
    });
  }

  const matchMap = new Map();
  filtered.forEach(g => {
    const key = `${g.season}|${g.match_id}|${g.round}|${g.home_team}|${g.away_team}`;
    if (!matchMap.has(key)) matchMap.set(key, g);
  });

  const uniqueMatches = [...matchMap.values()];

  if (uniqueMatches.length === 0) {
    matchesDiv.innerHTML = "<p>No matches found for this filter.</p>";
    return;
  }

  uniqueMatches.forEach(game => {
    const div = document.createElement("div");
    div.className = "match";
    div.innerHTML = `
      ${game.round}:
      ${game.home_team} ${game.home_points} def ${game.away_team} ${game.away_points}
    `;
    matchesDiv.appendChild(div);
  });
}
</script>
</body>
</html>
