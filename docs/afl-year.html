<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AFL Season</title>

<style>
body {
  font-family: system-ui, Arial, sans-serif;
  margin: 20px;
}

.year-bar {
  margin-bottom: 15px;
}

.year-btn {
  margin: 3px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  background: #ddd;
  cursor: pointer;
}

.year-btn.active {
  background: #333;
  color: #fff;
}

select {
  padding: 6px;
  font-size: 16px;
  margin-bottom: 15px;
}

.round {
  margin-top: 15px;
  font-weight: bold;
}

.match {
  margin-left: 15px;
  margin-bottom: 5px;
}

.star {
  font-size: 18px;
  letter-spacing: 2px;
  font-weight: 700;
}
</style>
</head>

<body>

<h1>AFL Season</h1>

<div id="yearBar" class="year-bar"></div>

<select id="teamSelect">
  <option value="ALL">All teams</option>
</select>

<div id="matches"></div>

<script>
const startYear = 1990;
const endYear = new Date().getFullYear();

const yearBar = document.getElementById("yearBar");
const teamSelect = document.getElementById("teamSelect");
const matchesDiv = document.getElementById("matches");

let currentData = [];
let currentYear = startYear;

// build year buttons
for (let y = startYear; y <= endYear; y++) {
  const btn = document.createElement("button");
  btn.textContent = y;
  btn.className = "year-btn";
  btn.onclick = () => loadYear(y);
  yearBar.appendChild(btn);
}

// load first year
loadYear(startYear);

function loadYear(year) {
  currentYear = year;
  document.querySelectorAll(".year-btn").forEach(b => b.classList.remove("active"));
  [...yearBar.children].find(b => b.textContent == year).classList.add("active");

  fetch(`data/afl/afl_${year}.json`)
    .then(res => res.json())
    .then(data => {
      currentData = data;
      buildTeamSelector(data);
      renderMatches();
    })
    .catch(() => {
      matchesDiv.innerHTML = "<p>No data for this year.</p>";
    });
}

function buildTeamSelector(data) {
  const teams = new Set();

  data.forEach(g => {
    teams.add(g.home);
    teams.add(g.away);
  });

  teamSelect.innerHTML = `<option value="ALL">All teams</option>`;

  [...teams].sort().forEach(t => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    teamSelect.appendChild(opt);
  });
}

teamSelect.addEventListener("change", renderMatches);

function renderMatches() {
  matchesDiv.innerHTML = "";

  let filtered = currentData;

  if (teamSelect.value !== "ALL") {
    filtered = currentData.filter(g =>
      g.home === teamSelect.value || g.away === teamSelect.value
    );
  }

  let lastRound = "";

  filtered.forEach(game => {
    if (game.round !== lastRound) {
      const roundDiv = document.createElement("div");
      roundDiv.className = "round";
      roundDiv.textContent = game.round;
      matchesDiv.appendChild(roundDiv);
      lastRound = game.round;
    }

    const div = document.createElement("div");
    div.className = "match";

    const stars = game.stars || "";

    div.innerHTML = `
      ${game.home} ${game.home_score} def ${game.away} ${game.away_score}
      <span class="star">${stars}</span>
    `;

    matchesDiv.appendChild(div);
  });
}
</script>

</body>
</html>
