<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>AFL Season</title>

<style>
body { font-family: system-ui, Arial, sans-serif; margin:20px; }
.year-bar, .round-bar { margin-bottom:15px; }

.year-btn, .round-btn {
  margin:4px;
  padding:10px 16px;
  border-radius:10px;
  border:1px solid #ccc;
  background:#ddd;
  cursor:pointer;
  font-size:15px;
}
.year-btn.active, .round-btn.active { background:#333; color:#fff; }

select { padding:8px 10px; font-size:16px; margin-bottom:15px; display:block; }

.match { 
  margin-left:15px; 
  margin-bottom:6px; 
  padding:4px 8px;
  border-radius:6px;
}

.win  { background:#e6f4ea; }
.loss { background:#fbeaea; }
.draw { background:#f0f0f0; }
.alt  { background:#eaf4ff; }

.muted { color:#666; font-size:13px; margin:8px 0 14px; }

table { border-collapse: collapse; margin-top:15px; }
th, td { padding:6px 10px; border:1px solid #ccc; text-align:center; }
th { background:#f0f0f0; }
td.team { text-align:left; font-weight:600; }
</style>
</head>

<body>
<h1>AFL Season</h1>

<div id="yearBar" class="year-bar"></div>

<select id="teamSelect">
  <option value="ALL">All teams</option>
</select>

<div id="roundBar" class="round-bar"></div>

<div id="ladder"></div>

<div id="status" class="muted"></div>
<div id="matches"></div>

<script>
const startYear = 1990;
const endYear = new Date().getFullYear();

const yearBar = document.getElementById("yearBar");
const teamSelect = document.getElementById("teamSelect");
const roundBar = document.getElementById("roundBar");
const matchesDiv = document.getElementById("matches");
const statusDiv = document.getElementById("status");
const ladderDiv = document.getElementById("ladder");

let currentData = [];
let currentRound = "ALL";

for (let y = startYear; y <= endYear; y++) {
  const btn = document.createElement("button");
  btn.textContent = y;
  btn.className = "year-btn";
  btn.onclick = () => loadYear(y);
  yearBar.appendChild(btn);
}

loadYear(startYear);

function canonicalRound(r) {
  const t = (r ?? "").toString().toLowerCase();
  if (t.includes("elimination")) return "Elimination Final";
  if (t.includes("qualifying")) return "Qualifying Final";
  if (t.includes("semi")) return "Semi Final";
  if (t.includes("preliminary")) return "Preliminary Final";
  if (t.includes("grand")) return "Grand Final";
  return (r ?? "").toString().trim();
}

function loadYear(year) {
  currentRound = "ALL";
  teamSelect.value = "ALL";

  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  [...yearBar.children].find(b=>b.textContent==year).classList.add("active");

  matchesDiv.innerHTML="";
  ladderDiv.innerHTML="";
  statusDiv.textContent="Loading…";

  fetch(`/data/afl/afl_${year}.json?cb=${Date.now()}`)
    .then(r=>r.json())
    .then(data=>{
      currentData = data;
      buildTeamSelector();
      buildRoundButtons();
      renderMatches();
      statusDiv.textContent = `Year ${year}: loaded ${currentData.length.toLocaleString()} player-rows`;
    });
}

function buildTeamSelector() {
  const teams=new Set();
  currentData.forEach(r=>{
    teams.add(r.home_team);
    teams.add(r.away_team);
  });

  teamSelect.innerHTML=`<option value="ALL">All teams</option>`;
  [...teams].sort().forEach(t=>{
    const opt=document.createElement("option");
    opt.value=t;
    opt.textContent=t;
    teamSelect.appendChild(opt);
  });
}

function buildRoundButtons() {
  roundBar.innerHTML="";

  const rounds=[...new Set(currentData.map(r=>canonicalRound(r.round)))];
  const numeric=rounds.filter(r=>/^Round\s*\d+/i.test(r))
    .map(r=>({label:r,num:parseInt(r.match(/\d+/)[0])}))
    .sort((a,b)=>a.num-b.num);

  addRoundButton("All Rounds", true);
  numeric.forEach(r=>addRoundButton(r.label));
  ["Elimination Final","Qualifying Final","Semi Final","Preliminary Final","Grand Final"]
    .forEach(r=>addRoundButton(r));
}

function addRoundButton(label,active=false){
  const btn=document.createElement("button");
  btn.textContent=label;
  btn.className="round-btn"+(active?" active":"");
  btn.onclick=()=>{
    currentRound=label==="All Rounds"?"ALL":label;
    document.querySelectorAll(".round-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    renderMatches();
  };
  roundBar.appendChild(btn);
}

teamSelect.onchange=renderMatches;

function renderMatches(){
  matchesDiv.innerHTML="";
  ladderDiv.innerHTML="";

  let rows=currentData;
  const selectedTeam = teamSelect.value;

  if(selectedTeam!=="ALL"){
    rows=rows.filter(r=>r.home_team===selectedTeam||r.away_team===selectedTeam);
  }
  if(currentRound!=="ALL"){
    rows=rows.filter(r=>canonicalRound(r.round)===currentRound);
  }

  buildLadder();

  const seen=new Set();
  let i=0;

  rows.forEach(g=>{
    const key=g.season+"|"+canonicalRound(g.round)+"|"+g.home_team+"|"+g.away_team;
    if(seen.has(key)) return;
    seen.add(key);

    let text=`${canonicalRound(g.round)}: ${g.home_team} ${g.home_points} def ${g.away_team} ${g.away_points}`;
    const div=document.createElement("div");
    div.className="match";

    if(selectedTeam==="ALL" && i%2===1) div.classList.add("alt");

    div.textContent=text;
    matchesDiv.appendChild(div);
    i++;
  });
}

function buildLadder() {
  let ladder = {};

  currentData.forEach(g=>{
    const round = canonicalRound(g.round);
    const m = round.match(/^Round\s*(\d+)/i);
    if (!m) return;

    const roundNum = parseInt(m[1],10);
    if (currentRound !== "ALL") {
      const sel = currentRound.match(/^Round\s*(\d+)/i);
      if (!sel || roundNum > parseInt(sel[1],10)) return;
    }

    const home=g.home_team, away=g.away_team;
    const hp=+g.home_points, ap=+g.away_points;
    if(!hp||!ap) return;

    [home,away].forEach(t=>{
      if(!ladder[t]) ladder[t]={team:t,win:0,loss:0,draw:0,for:0,against:0};
    });

    ladder[home].for+=hp; ladder[home].against+=ap;
    ladder[away].for+=ap; ladder[away].against+=hp;

    if(hp>ap){ ladder[home].win++; ladder[away].loss++; }
    else if(ap>hp){ ladder[away].win++; ladder[home].loss++; }
    else{ ladder[home].draw++; ladder[away].draw++; }
  });

  const arr=Object.values(ladder).map(t=>{
    t.perc = t.against ? ((t.for/t.against)*100).toFixed(1) : "0.0";
    return t;
  });

  arr.sort((a,b)=>b.win-a.win || b.perc-a.perc || a.team.localeCompare(b.team));

  let html="<table><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>D</th><th>%</th></tr>";
  arr.forEach((t,i)=>{
    html+=`<tr>
      <td>${i+1}</td>
      <td class="team">${t.team}</td>
      <td>${t.win}</td>
      <td>${t.loss}</td>
      <td>${t.draw}</td>
      <td>${t.perc}</td>
    </tr>`;
  });
  html+="</table>";

  ladderDiv.innerHTML=html;
}
</script>
</body>
</html>
