<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Results by Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body {
  font-family: Inter, system-ui, Arial, sans-serif;
  margin: 0;
  background: white;
}

.navbar {
  display: flex;
  justify-content: center;
  gap: 22px;
  padding: 16px 0;
  border-bottom: 1px solid #ddd;
  font-weight: 600;
}

.navbar a {
  color: #0056d6;
  text-decoration: none;
  font-size: 18px;
}

.page-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.year-grid, .round-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.year-grid button, .round-grid button {
  padding: 10px;
  border: 1px solid #ccc;
  background: #f4f4f4;
  cursor: pointer;
  font-weight: 600;
}

.year-grid button:hover, .round-grid button:hover {
  background: #ddd;
}

.team-select {
  margin-bottom: 20px;
  text-align: center;
}

.team-select select {
  padding: 8px 12px;
  font-size: 16px;
}

.match {
  border-bottom: 1px solid #eee;
  padding: 6px 0;
  font-size: 15px;
}

.match strong {
  display: inline-block;
  width: 120px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="afl.html">AFL</a>
  <a href="afl-year.html">By Year</a>
</div>

<div class="page-wrap">
<h1>AFL Results by Year</h1>

<div class="year-grid" id="yearGrid"></div>

<div class="team-select" id="teamSelect" style="display:none;">
  <label for="teamDropdown"><strong>Team:</strong></label>
  <select id="teamDropdown">
    <option value="All">All teams</option>
  </select>
</div>

<div class="round-grid" id="roundGrid" style="display:none;"></div>
<div id="results"></div>
</div>

<script>
const startYear = 1990;
const endYear = 2025;

const yearGrid = document.getElementById("yearGrid");
const roundGrid = document.getElementById("roundGrid");
const resultsDiv = document.getElementById("results");
const teamSelectDiv = document.getElementById("teamSelect");
const teamDropdown = document.getElementById("teamDropdown");

let allMatches = [];
let currentMatches = [];
let currentTeam = "All";

// build year buttons
for (let y = startYear; y <= endYear; y++) {
  const btn = document.createElement("button");
  btn.textContent = y;
  btn.onclick = () => loadYear(y);
  yearGrid.appendChild(btn);
}

function loadYear(year) {
  resultsDiv.innerHTML = `<h2>${year}</h2><p>Loading...</p>`;
  roundGrid.style.display = "none";
  roundGrid.innerHTML = "";
  teamSelectDiv.style.display = "none";
  teamDropdown.innerHTML = `<option value="All">All teams</option>`;
  currentTeam = "All";

  fetch(`data/afl/afl_${year}.json`)
    .then(r => r.json())
    .then(rows => {

      // ---- DEDUPE MATCHES ----
      const seen = new Set();
      const matches = [];

      rows.forEach(r => {
        const key = [
          r.round,
          r.home_team,
          r.away_team,
          r.home_points,
          r.away_points
        ].join("|");

        if (!seen.has(key)) {
          seen.add(key);
          matches.push(r);
        }
      });

      allMatches = matches;
      currentMatches = matches;

      buildTeamDropdown(matches);
      buildRoundButtons(matches);
      showMatches(matches, "All");
    })
    .catch(err => {
      resultsDiv.innerHTML = `<p>No data found for ${year}</p>`;
      console.error(err);
    });
}

function buildTeamDropdown(matches) {
  const teams = new Set();

  matches.forEach(m => {
    teams.add(m.home_team);
    teams.add(m.away_team);
  });

  const sortedTeams = Array.from(teams).sort();

  sortedTeams.forEach(team => {
    const opt = document.createElement("option");
    opt.value = team;
    opt.textContent = team;
    teamDropdown.appendChild(opt);
  });

  teamSelectDiv.style.display = "block";

  teamDropdown.onchange = () => {
    currentTeam = teamDropdown.value;
    filterMatches();
  };
}

function buildRoundButtons(matches) {
  const rounds = [...new Set(matches.map(m => m.round))];

  roundGrid.innerHTML = "";
  roundGrid.style.display = "grid";

  const allBtn = document.createElement("button");
  allBtn.textContent = "All";
  allBtn.onclick = () => showMatches(currentMatches, "All");
  roundGrid.appendChild(allBtn);

  rounds.forEach(r => {
    const btn = document.createElement("button");
    btn.textContent = r;
    btn.onclick = () => showMatches(
      currentMatches.filter(m => m.round === r),
      r
    );
    roundGrid.appendChild(btn);
  });
}

function filterMatches() {
  if (currentTeam === "All") {
    currentMatches = allMatches;
  } else {
    currentMatches = allMatches.filter(m =>
      m.home_team === currentTeam || m.away_team === currentTeam
    );
  }

  buildRoundButtons(currentMatches);
  showMatches(currentMatches, "All");
}

function showMatches(list, label) {
  let html = `<h2>${label === "All" ? "All Matches" : label}</h2>`;

  list.forEach(match => {
    html += `
      <div class="match">
        <strong>${match.round}</strong>
        ${match.home_team} ${match.home_points}
        vs
        ${match.away_team} ${match.away_points}
      </div>
    `;
  });

  resultsDiv.innerHTML = html;
}
</script>

</body>
</html>
