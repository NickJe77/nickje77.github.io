<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>AFL Season</title>

<link rel="stylesheet" href="style.css">

<style>
body { font-family: system-ui, Arial, sans-serif; margin:0; }

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{ margin:20px; }

.year-bar, .round-bar { margin-bottom:15px; }

.year-btn, .round-btn {
  margin:4px;
  padding:10px 16px;
  border-radius:10px;
  border:1px solid #ccc;
  background:#ddd;
  cursor:pointer;
  font-size:15px;
}
.year-btn.active, .round-btn.active { background:#333; color:#fff; }

select { padding:8px 10px; font-size:16px; margin-bottom:15px; display:block; }

.match { margin-bottom:6px; padding:6px 10px; border-radius:6px; }

table { border-collapse: collapse; width:100%; }
th, td { padding:6px 10px; border:1px solid #ccc; text-align:center; }
th { background:#f0f0f0; }

td.team { text-align:left; font-weight:600; white-space:nowrap; width:190px; }

.main-layout { display:flex; gap:30px; align-items:flex-start; }
.ladder-wrap { width:460px; flex-shrink:0; }
.results-wrap { flex:1; }

.meta { font-size:13px; color:#555; }
.meta a { color:#0056d6; text-decoration:none; font-weight:600; }
.meta a:hover { text-decoration:underline; }
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">
<h1>AFL Season</h1>

<div id="yearBar" class="year-bar"></div>
<select id="teamSelect"><option value="ALL">All teams</option></select>
<div id="roundBar" class="round-bar"></div>

<div class="main-layout">
  <div id="ladder" class="ladder-wrap"></div>
  <div class="results-wrap"><div id="matches"></div></div>
</div>
</div>

<script>

/* force seasons through 2026 */
const startYear = 1990;
const endYear = 2026;

const yearBar = document.getElementById("yearBar");
const teamSelect = document.getElementById("teamSelect");
const roundBar = document.getElementById("roundBar");
const matchesDiv = document.getElementById("matches");
const ladderDiv = document.getElementById("ladder");

let rawData = [];
let matches = [];
let currentRound = "ALL";

const finalsRounds = ["Elimination Final","Qualifying Final","Semi Final","Preliminary Final","Grand Final"];

for (let y = startYear; y <= endYear; y++) {
  const btn = document.createElement("button");
  btn.textContent = y;
  btn.className = "year-btn";
  btn.onclick = () => loadYear(y);
  yearBar.appendChild(btn);
}
loadYear(startYear);

/* everything else unchanged */

function canonicalRound(r) {
  const t=(r??"").toLowerCase();
  if(t.includes("elimination"))return"Elimination Final";
  if(t.includes("qualifying"))return"Qualifying Final";
  if(t.includes("semi"))return"Semi Final";
  if(t.includes("preliminary"))return"Preliminary Final";
  if(t.includes("grand"))return"Grand Final";
  return (r??"").trim();
}

function loadYear(year){
  currentRound="ALL";
  teamSelect.value="ALL";
  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  [...yearBar.children].find(b=>b.textContent==year).classList.add("active");

  fetch(`data/afl/afl_${year}.json`)
    .then(r=>r.json())
    .then(data=>{
      rawData=data;
      buildMatchesFromPlayers();
      buildTeamSelector();
      buildRoundButtons();
      renderMatches();
    });
}

/* rest of script unchanged */
</script>
</body>
</html>
