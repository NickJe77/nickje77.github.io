<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body {
  font-family: Inter, system-ui, Arial, sans-serif;
  margin: 0;
  background: #fff;
}

h1 {
  text-align: center;
  margin: 20px 0;
}

#controls {
  text-align: center;
  margin-bottom: 20px;
}

button {
  padding: 6px 10px;
  margin: 2px;
  cursor: pointer;
}

.round {
  margin-bottom: 25px;
}

.match {
  margin: 6px 0;
}

.star {
  color: #b8860b; /* darker gold for readability */
  font-weight: 600;
}

hr {
  border: none;
  border-top: 1px solid #eee;
  margin: 10px 0;
}
</style>
</head>

<body>

<h1>AFL Season</h1>

<div id="controls"></div>

<div id="output"></div>

<h2>Ladder</h2>
<div id="ladder"></div>

<script>
const output = document.getElementById("output");
const ladderDiv = document.getElementById("ladder");
const controls = document.getElementById("controls");

let currentYear = 2021;

for (let y = 1990; y <= 2025; y++) {
  const btn = document.createElement("button");
  btn.textContent = y;
  btn.onclick = () => loadYear(y);
  controls.appendChild(btn);
}

async function loadYear(y) {
  currentYear = y;
  output.innerHTML = "";
  ladderDiv.innerHTML = "";

  const [games, players] = await Promise.all([
    fetch(`data/afl/afl_${y}.json`, { cache: "no-store" }).then(r => r.json()),
    fetch(`data/afl_players_by_year/players_${y}.json`, { cache: "no-store" }).then(r => r.ok ? r.json() : [])
  ]);

  renderRounds(games, players);
  renderLadder(games);
}

function renderRounds(games, players) {
  const byRound = {};

  games.forEach(g => {
    if (!byRound[g.round]) byRound[g.round] = [];
    byRound[g.round].push(g);
  });

  Object.keys(byRound).forEach(r => {
    const div = document.createElement("div");
    div.className = "round";
    div.innerHTML = `<h2>Round ${r}</h2>`;

    byRound[r].forEach(g => {
      const m = document.createElement("div");
      m.className = "match";
      m.innerHTML = `<strong>${g.home} ${g.home_score} vs ${g.away} ${g.away_score}</strong>`;

      const stars = players.filter(p =>
        p.round == g.round &&
        (p.team === g.home || p.team === g.away)
      );

      stars.forEach(s => {
        const star = document.createElement("div");
        star.className = "star";
        star.textContent = `⭐ ${s.player} (${s.team}) – ${s.stat}`;
        m.appendChild(star);
      });

      div.appendChild(m);
      div.appendChild(document.createElement("hr"));
    });

    output.appendChild(div);
  });
}

function renderLadder(games) {
  const ladder = {};

  games.forEach(g => {
    if (!ladder[g.home]) ladder[g.home] = { team: g.home, pts: 0 };
    if (!ladder[g.away]) ladder[g.away] = { team: g.away, pts: 0 };

    if (g.home_score > g.away_score) ladder[g.home].pts += 4;
    else if (g.away_score > g.home_score) ladder[g.away].pts += 4;
    else {
      ladder[g.home].pts += 2;
      ladder[g.away].pts += 2;
    }
  });

  const sorted = Object.values(ladder).sort((a,b)=>b.pts-a.pts);

  const table = document.createElement("table");
  table.innerHTML = "<tr><th>Pos</th><th>Team</th><th>Pts</th></tr>";

  sorted.forEach((t,i)=>{
    const row = document.createElement("tr");
    row.innerHTML = `<td>${i+1}</td><td>${t.team}</td><td>${t.pts}</td>`;
    table.appendChild(row);
  });

  ladderDiv.appendChild(table);
}

loadYear(currentYear);
</script>

</body>
</html>
