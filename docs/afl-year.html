<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Results by Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body {
  font-family: Inter, system-ui, Arial, sans-serif;
  margin: 0;
  background: white;
}

.navbar {
  display: flex;
  justify-content: center;
  gap: 22px;
  padding: 16px 0;
  border-bottom: 1px solid #ddd;
  font-weight: 600;
}

.navbar a {
  color: #0056d6;
  text-decoration: none;
  font-size: 18px;
}

.page-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.year-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 10px;
  margin-bottom: 25px;
}

.year-grid button {
  padding: 10px;
  border: 1px solid #ccc;
  background: #f4f4f4;
  cursor: pointer;
  font-weight: 600;
}

.year-grid button:hover {
  background: #ddd;
}

.match {
  border-bottom: 1px solid #eee;
  padding: 6px 0;
  font-size: 15px;
}

.match strong {
  display: inline-block;
  width: 140px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="afl.html">AFL</a>
  <a href="afl-year.html">By Year</a>
</div>

<div class="page-wrap">
<h1>AFL Results by Year</h1>

<div class="year-grid" id="yearGrid"></div>
<div id="results"></div>
</div>

<script>
const startYear = 1990;
const endYear = 2025;

const yearGrid = document.getElementById("yearGrid");
const resultsDiv = document.getElementById("results");

// build year buttons
for (let y = startYear; y <= endYear; y++) {
  const btn = document.createElement("button");
  btn.textContent = y;
  btn.onclick = () => loadYear(y);
  yearGrid.appendChild(btn);
}

function loadYear(year) {
  resultsDiv.innerHTML = `<h2>${year}</h2><p>Loading...</p>`;

  fetch(`data/afl/afl_${year}.json`)
    .then(r => r.json())
    .then(rows => {

      // ---- DEDUPE MATCHES ----
      const seen = new Set();
      const matches = [];

      rows.forEach(r => {
        const key = [
          r.round,
          r.home_team,
          r.away_team,
          r.home_points,
          r.away_points,
          r.venue
        ].join("|");

        if (!seen.has(key)) {
          seen.add(key);
          matches.push(r);
        }
      });
      // ------------------------

      let html = `<h2>${year}</h2>`;

      matches.forEach(match => {
        html += `
          <div class="match">
            <strong>${match.round}</strong>
            ${match.home_team} ${match.home_points}
            vs
            ${match.away_team} ${match.away_points}
            <em>(${match.venue})</em>
          </div>
        `;
      });

      resultsDiv.innerHTML = html;
    })
    .catch(err => {
      resultsDiv.innerHTML = `<p>No data found for ${year}</p>`;
      console.error(err);
    });
}
</script>

</body>
</html>
