<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
.year-buttons{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px;}
.year-buttons button{border:1px solid #ddd;background:#f4f4f4;padding:6px 10px;border-radius:6px;cursor:pointer;}
.year-buttons button.active{background:#0056d6;color:white;}
h1{text-align:center;margin-bottom:15px;}
h2{margin-top:40px;}
.match{padding:10px 0;border-bottom:1px solid #eee;}
.star{color:#c69214;font-weight:600;}
.ladder-table{border-collapse:collapse;width:100%;margin-top:10px;}
.ladder-table th,.ladder-table td{border:1px solid #ddd;padding:6px;text-align:center;}
.ladder-table th{background:#f0f0f0;}
</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="afl.html">AFL</a>
</div>

<div class="page-wrap">
<h1>AFL Season</h1>

<div class="year-buttons" id="yearButtons"></div>

<div id="ladder"></div>
<div id="matches"></div>
</div>

<script>
const startYear = 1990;
const endYear = 2025;
const yearButtons = document.getElementById("yearButtons");
const ladderDiv = document.getElementById("ladder");
const matchesDiv = document.getElementById("matches");

for(let y=startYear;y<=endYear;y++){
  const b=document.createElement("button");
  b.textContent=y;
  b.onclick=()=>loadYear(y);
  yearButtons.appendChild(b);
}

function setActive(y){
  document.querySelectorAll(".year-buttons button").forEach(b=>{
    b.classList.toggle("active",b.textContent==y);
  });
}

async function loadYear(y){
  setActive(y);
  ladderDiv.innerHTML="";
  matchesDiv.innerHTML="";

  const season = await fetch(`data/afl/afl_${y}.json`).then(r=>r.json());
  const players = await fetch(`data/afl_players_by_year/players_${y}.json`).then(r=>r.ok?r.json():[]);

  // LADDER
  let ladderHTML="<h2>Ladder</h2><table class='ladder-table'><tr><th>Pos</th><th>Team</th><th>Pts</th></tr>";
  season.ladder.forEach((t,i)=>{
    ladderHTML+=`<tr><td>${i+1}</td><td>${t.team}</td><td>${t.points}</td></tr>`;
  });
  ladderHTML+="</table>";
  ladderDiv.innerHTML=ladderHTML;

  // MATCHES
  let matchHTML="";
  season.rounds.forEach(r=>{
    matchHTML+=`<h2>Round ${r.round}</h2>`;
    r.games.forEach(g=>{
      matchHTML+=`<div class="match"><strong>${g.home} ${g.homeScore} vs ${g.away} ${g.awayScore}</strong><br>`;
      const stars=players.filter(p=>p.round==r.round && p.match==g.match);
      stars.forEach(s=>{
        matchHTML+=`<div class="star">⭐ ${s.player} (${s.team}) – ${s.stat}</div>`;
      });
      matchHTML+=`</div>`;
    });
  });
  matchesDiv.innerHTML=matchHTML;
}

loadYear(1990);
</script>
</body>
</html>
