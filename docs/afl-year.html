<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AFL Season</title>

<style>
body {
  font-family: system-ui, Arial, sans-serif;
  margin: 20px;
}

select {
  padding: 6px;
  font-size: 16px;
}

.match {
  margin-bottom: 8px;
}

.star {
  font-size: 18px;
  letter-spacing: 2px;
  color: #000;
  font-weight: 700;
}
</style>
</head>

<body>

<h1>AFL By Season</h1>

<select id="yearSelect"></select>

<div id="matches"></div>

<script>
const startYear = 1990;
const endYear = new Date().getFullYear();

const select = document.getElementById("yearSelect");
const matchesDiv = document.getElementById("matches");

for (let y = startYear; y <= endYear; y++) {
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = y;
  select.appendChild(opt);
}

select.value = startYear;
loadYear(startYear);

select.addEventListener("change", () => {
  loadYear(select.value);
});

function loadYear(year) {
  fetch(`data/afl/afl_${year}.json`)
    .then(res => {
      if (!res.ok) throw new Error("No file");
      return res.json();
    })
    .then(data => renderMatches(data))
    .catch(() => {
      matchesDiv.innerHTML = "<p>No data for this year.</p>";
    });
}

function renderMatches(data) {
  matchesDiv.innerHTML = "";

  data.forEach(game => {
    const div = document.createElement("div");
    div.className = "match";

    const stars = game.stars || "";

    div.innerHTML = `
      <strong>${game.round}</strong> – 
      ${game.home} ${game.home_score} def ${game.away} ${game.away_score}
      <span class="star">${stars}</span>
    `;

    matchesDiv.appendChild(div);
  });
}
</script>

</body>
</html>
