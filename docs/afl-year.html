<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>AFL Season</title>

<style>
body { font-family: system-ui, Arial, sans-serif; margin:20px; }
.year-bar, .round-bar { margin-bottom:15px; }

.year-btn, .round-btn {
  margin:4px;
  padding:10px 16px;
  border-radius:10px;
  border:1px solid #ccc;
  background:#ddd;
  cursor:pointer;
  font-size:15px;
}
.year-btn.active, .round-btn.active { background:#333; color:#fff; }

select { padding:8px 10px; font-size:16px; margin-bottom:15px; display:block; }
.match { margin-left:15px; margin-bottom:6px; }
.muted { color:#666; font-size:13px; margin:8px 0 14px; }
</style>
</head>

<body>
<h1>AFL Season</h1>

<div id="yearBar" class="year-bar"></div>

<select id="teamSelect">
  <option value="ALL">All teams</option>
</select>

<div id="roundBar" class="round-bar"></div>

<div id="status" class="muted"></div>
<div id="matches"></div>

<script>
const BUILD_ID = "WINNER_FIX_v2"; // <-- if you don't see this in the status line, the new file isn't live

const startYear = 1990;
const endYear = new Date().getFullYear();

const yearBar = document.getElementById("yearBar");
const teamSelect = document.getElementById("teamSelect");
const roundBar = document.getElementById("roundBar");
const matchesDiv = document.getElementById("matches");
const statusDiv = document.getElementById("status");

let currentData = [];
let currentRound = "ALL";

for (let y = startYear; y <= endYear; y++) {
  const btn = document.createElement("button");
  btn.textContent = y;
  btn.className = "year-btn";
  btn.onclick = () => loadYear(y);
  yearBar.appendChild(btn);
}

loadYear(startYear);

function canonicalRound(r) {
  const t = (r ?? "").toString().toLowerCase();
  if (t.includes("elimination")) return "Elimination Final";
  if (t.includes("qualifying")) return "Qualifying Final";
  if (t.includes("semi")) return "Semi Final";
  if (t.includes("preliminary")) return "Preliminary Final";
  if (t.includes("grand")) return "Grand Final";
  return (r ?? "").toString().trim();
}

function toPoints(v) {
  // Handles numbers, "104", " 104 ", "1,104", null, undefined, weird junk
  if (v === null || v === undefined) return null;
  if (typeof v === "number" && Number.isFinite(v)) return v;
  const s = String(v).replace(/,/g, "").trim();
  if (s === "") return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function loadYear(year) {
  currentRound = "ALL";
  teamSelect.value = "ALL";

  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  [...yearBar.children].find(b=>b.textContent==year).classList.add("active");

  matchesDiv.innerHTML="";
  statusDiv.textContent=`Loading… (${BUILD_ID})`;

  fetch(`/data/afl/afl_${year}.json?cb=${Date.now()}`)
    .then(r=>r.json())
    .then(data=>{
      currentData = Array.isArray(data) ? data : [];
      buildTeamSelector(currentData);
      buildRoundButtons();
      renderMatches();
      statusDiv.textContent = `Year ${year}: loaded ${currentData.length.toLocaleString()} player-rows (${BUILD_ID})`;
    })
    .catch(() => {
      currentData = [];
      matchesDiv.innerHTML = "<p>No data for this year.</p>";
      statusDiv.textContent = `Load error (${BUILD_ID})`;
    });
}

function buildTeamSelector(data) {
  const teams=new Set();
  data.forEach(r=>{
    if(r.home_team) teams.add(r.home_team);
    if(r.away_team) teams.add(r.away_team);
  });

  teamSelect.innerHTML=`<option value="ALL">All teams</option>`;
  [...teams].sort().forEach(t=>{
    const opt=document.createElement("option");
    opt.value=t;
    opt.textContent=t;
    teamSelect.appendChild(opt);
  });
}

function buildRoundButtons() {
  roundBar.innerHTML="";

  const rounds=[...new Set(currentData.map(r=>canonicalRound(r.round)))];

  const numeric=[];
  rounds.forEach(r=>{
    const m=r.match(/^Round\s*(\d+)/i);
    if(m) numeric.push({label:r,num:parseInt(m[1],10)});
  });
  numeric.sort((a,b)=>a.num-b.num);

  const allBtn=document.createElement("button");
  allBtn.textContent="All Rounds";
  allBtn.className="round-btn active";
  allBtn.onclick=()=>{currentRound="ALL";setActiveRound(allBtn);renderMatches();};
  roundBar.appendChild(allBtn);

  numeric.forEach(r=>addRoundButton(r.label));

  // finals order as requested
  ["Elimination Final","Qualifying Final","Semi Final","Preliminary Final","Grand Final"]
    .forEach(r=>addRoundButton(r));
}

function addRoundButton(label){
  const btn=document.createElement("button");
  btn.textContent=label;
  btn.className="round-btn";
  btn.onclick=()=>{
    currentRound=label;
    setActiveRound(btn);
    renderMatches();
  };
  roundBar.appendChild(btn);
}

function setActiveRound(activeBtn){
  document.querySelectorAll(".round-btn").forEach(b=>b.classList.remove("active"));
  activeBtn.classList.add("active");
}

teamSelect.addEventListener("change",renderMatches);

function formatResultLine(game) {
  const round = canonicalRound(game.round);

  const home = (game.home_team ?? "").toString();
  const away = (game.away_team ?? "").toString();

  const hp = toPoints(game.home_points);
  const ap = toPoints(game.away_points);

  if (hp === null || ap === null) {
    return `${round}: ${home} vs ${away}`;
  }

  if (hp > ap) return `${round}: ${home} ${hp} def ${away} ${ap}`;
  if (ap > hp) return `${round}: ${away} ${ap} def ${home} ${hp}`;
  return `${round}: ${home} ${hp} drew ${away} ${ap}`;
}

function renderMatches(){
  matchesDiv.innerHTML="";
  let rows=currentData;

  if(teamSelect.value!=="ALL"){
    rows=rows.filter(r=>r.home_team===teamSelect.value||r.away_team===teamSelect.value);
  }

  if(currentRound!=="ALL"){
    rows=rows.filter(r=>canonicalRound(r.round)===currentRound);
  }

  const seen=new Set();
  rows.forEach(g=>{
    const key = (g.season ?? "") + "|" + canonicalRound(g.round) + "|" + (g.home_team ?? "") + "|" + (g.away_team ?? "");
    if(!seen.has(key)){
      seen.add(key);
      const div=document.createElement("div");
      div.className="match";
      div.textContent = formatResultLine(g);
      matchesDiv.appendChild(div);
    }
  });
}
</script>
</body>
</html>
