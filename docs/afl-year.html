<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Results by Year</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial, sans-serif; margin:20px; }
h1 { text-align:center; }

.year-buttons, .round-buttons {
  display:flex; flex-wrap:wrap; gap:8px;
  justify-content:center; margin-bottom:15px;
}

button {
  padding:8px 14px;
  border:1px solid #ccc;
  background:#f5f5f5;
  cursor:pointer;
}
button.active { background:#ddd; font-weight:bold; }

select { padding:8px; margin-bottom:15px; }

.match { padding:8px; border-bottom:1px solid #eee; }
.win { background:#e9f9ec; }
.loss { background:#fdecec; }
.draw { background:#fff; }

.star { color:goldenrod; font-size:14px; margin-left:20px; }
</style>
</head>

<body>

<h1>AFL Results by Year</h1>

<div class="year-buttons" id="yearButtons"></div>

<div style="text-align:center">
Team:
<select id="teamSelect"></select>
</div>

<div class="round-buttons" id="roundButtons"></div>

<h2 id="heading">All Matches</h2>
<div id="matches"></div>

<script>
let currentYear = 1990;
let currentRound = "All";
let currentTeam = "All teams";

let allMatches = [];
let allPlayers = [];

const years = [];
for(let y=1990;y<=2025;y++) years.push(y);

const roundOrder = [
 "Round 1","Round 2","Round 3","Round 4","Round 5","Round 6","Round 7","Round 8","Round 9","Round 10",
 "Round 11","Round 12","Round 13","Round 14","Round 15","Round 16","Round 17","Round 18","Round 19","Round 20",
 "Round 21","Round 22","Round 23","Round 24",
 "Elimination Final","Qualifying Final","Semi Final","Preliminary Final","Grand Final"
];

function buildYearButtons(){
  const div=document.getElementById("yearButtons");
  div.innerHTML="";
  years.forEach(y=>{
    const b=document.createElement("button");
    b.textContent=y;
    if(y===currentYear) b.classList.add("active");
    b.onclick=()=>loadYear(y);
    div.appendChild(b);
  });
}

function buildRoundButtons(){
  const div=document.getElementById("roundButtons");
  div.innerHTML="";
  ["All",...roundOrder].forEach(r=>{
    const b=document.createElement("button");
    b.textContent=r;
    if(r===currentRound) b.classList.add("active");
    b.onclick=()=>{currentRound=r;render();}
    div.appendChild(b);
  });
}

function buildTeamSelect(){
  const sel=document.getElementById("teamSelect");
  sel.innerHTML="";
  const teams=[...new Set(allMatches.flatMap(m=>[m.home_team,m.away_team]))].sort();
  ["All teams",...teams].forEach(t=>{
    const o=document.createElement("option");
    o.value=t;
    o.textContent=t;
    sel.appendChild(o);
  });
  sel.onchange=()=>{currentTeam=sel.value;render();}
}

function loadYear(y){
  currentYear=y;
  currentRound="All";

  fetch(`data/afl/afl_${y}.json`)
    .then(r=>r.json())
    .then(data=>{
      allMatches=data;
      buildYearButtons();
      buildRoundButtons();
      buildTeamSelect();
      render();
    });
}

function getStars(match){
  if(allPlayers.length===0) return [];
  return allPlayers.filter(p =>
    Number(p.season)===Number(currentYear) &&
    p.round===match.round &&
    (
      (p.played_for===match.home_team && p.played_againK===match.away_team) ||
      (p.played_for===match.away_team && p.played_againK===match.home_team)
    ) &&
    (Number(p.D)>=35 || Number(p.G)>=5)
  ).map(s=>{
    let parts=[];
    if(Number(s.D)>=35) parts.push(`${s.D} disposals`);
    if(Number(s.G)>=5) parts.push(`${s.G} goals`);
    return `⭐ ${s.player} (${s.played_for}) – ${parts.join(" & ")}`;
  });
}

function render(){
  const div=document.getElementById("matches");
  div.innerHTML="";
  document.getElementById("heading").textContent =
    currentRound==="All" ? "All Matches" : currentRound;

  let list=[...allMatches];

  if(currentRound!=="All") list=list.filter(m=>m.round===currentRound);
  if(currentTeam!=="All teams") list=list.filter(m=>m.home_team===currentTeam||m.away_team===currentTeam);

  list.sort((a,b)=>roundOrder.indexOf(a.round)-roundOrder.indexOf(b.round));

  list.forEach(m=>{
    const homeWin=m.home_score>m.away_score;
    const awayWin=m.away_score>m.home_score;

    let cls="";
    if(currentTeam!=="All teams"){
      if(m.home_team===currentTeam){
        cls=homeWin?"win":awayWin?"loss":"draw";
      } else {
        cls=awayWin?"win":homeWin?"loss":"draw";
      }
    }

    const d=document.createElement("div");
    d.className=`match ${cls}`;
    d.innerHTML=`<strong>${m.round}</strong> — ${m.home_team} ${m.home_score} vs ${m.away_team} ${m.away_score}`;

    getStars(m).forEach(s=>{
      const st=document.createElement("div");
      st.className="star";
      st.textContent=s;
      d.appendChild(st);
    });

    div.appendChild(d);
  });
}

fetch("data/afl_players.json")
  .then(r=>{
    if(!r.ok) return [];
    return r.json();
  })
  .then(p=>{
    allPlayers=p;
    buildYearButtons();
    loadYear(currentYear);
  })
  .catch(()=>{
    buildYearButtons();
    loadYear(currentYear);
  });
</script>

</body>
</html>
