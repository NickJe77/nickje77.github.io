<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>AFL Season</title>

<link rel="stylesheet" href="style.css">

<style>
body { font-family: system-ui, Arial, sans-serif; margin:0; }

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{ margin:20px; }

.year-bar, .round-bar { margin-bottom:15px; }

.year-btn, .round-btn {
  margin:4px;
  padding:10px 16px;
  border-radius:10px;
  border:1px solid #ccc;
  background:#ddd;
  cursor:pointer;
  font-size:15px;
}
.year-btn.active, .round-btn.active { background:#333; color:#fff; }

select { padding:8px 10px; font-size:16px; margin-bottom:15px; display:block; }

.match { margin-bottom:6px; padding:6px 10px; border-radius:6px; cursor:pointer; }

table { border-collapse: collapse; width:100%; }
th, td { padding:6px 10px; border:1px solid #ccc; text-align:center; }
th { background:#f0f0f0; }

td.team { text-align:left; font-weight:600; white-space:nowrap; width:190px; }

.main-layout { display:flex; gap:30px; align-items:flex-start; }
.ladder-wrap { width:460px; flex-shrink:0; }
.results-wrap { flex:1; }

.meta { font-size:13px; color:#555; }
.meta a { color:#0056d6; text-decoration:none; font-weight:600; }
.meta a:hover { text-decoration:underline; }
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">
<h1>AFL Season</h1>

<div id="yearBar" class="year-bar"></div>
<select id="teamSelect"><option value="ALL">All teams</option></select>
<div id="roundBar" class="round-bar"></div>

<div class="main-layout">
  <div id="ladder" class="ladder-wrap"></div>
  <div class="results-wrap"><div id="matches"></div></div>
</div>
</div>

<script>
const startYear = 2021;
const endYear = 2026;

const yearBar = document.getElementById("yearBar");
const teamSelect = document.getElementById("teamSelect");
const roundBar = document.getElementById("roundBar");
const matchesDiv = document.getElementById("matches");
const ladderDiv = document.getElementById("ladder");

let rawData = [];
let matches = [];
let currentRound = "ALL";

const finalsRounds = ["Elimination Final","Qualifying Final","Semi Final","Preliminary Final","Grand Final"];

for (let y = startYear; y <= endYear; y++) {
  const btn = document.createElement("button");
  btn.textContent = y;
  btn.className = "year-btn";
  btn.onclick = () => loadYear(y);
  yearBar.appendChild(btn);
}
loadYear(endYear);

function canonicalRound(r) {
  const t = (r ?? "").toLowerCase();
  if (t.includes("elimination")) return "Elimination Final";
  if (t.includes("qualifying")) return "Qualifying Final";
  if (t.includes("semi")) return "Semi Final";
  if (t.includes("preliminary")) return "Preliminary Final";
  if (t.includes("grand")) return "Grand Final";
  return (r ?? "").trim();
}

function roundNumber(r){
  const m = String(r || "").match(/\d+/);
  return m ? +m[0] : null;
}

function loadYear(year){
  currentRound = "ALL";
  teamSelect.value = "ALL";
  document.querySelectorAll(".year-btn").forEach(b => b.classList.remove("active"));
  [...yearBar.children].find(b => b.textContent == year)?.classList.add("active");

  fetch(`data/afl/afl_${year}.json`)
    .then(r => r.json())
    .then(data => {
      rawData = Array.isArray(data) ? data : [];
      buildMatchesFromMatchRows();
      buildTeamSelector();
      buildRoundButtons();
      renderMatches();
    })
    .catch(() => {
      rawData = [];
      matches = [];
      buildTeamSelector();
      buildRoundButtons();
      renderMatches();
    });
}

function buildMatchesFromMatchRows(){
  matches = rawData
    .filter(m => m && m.match_id)
    .map(m => ({
      match_id: m.match_id,
      season: +m.season || "",
      round: canonicalRound(m.round),
      home_team: m.home_team || "",
      away_team: m.away_team || "",
      home_points: +m.home_points || 0,
      away_points: +m.away_points || 0,
      margin: m.margin != null ? +m.margin : Math.abs((+m.home_points || 0) - (+m.away_points || 0)),
      total_points: m.total_points != null ? +m.total_points : ((+m.home_points || 0) + (+m.away_points || 0)),
      date: m.date_iso || m.date || "",
      venue: m.venue || "",
      crowd: m.crowd || ""
    }));
}

function buildTeamSelector(){
  const teams = new Set();
  matches.forEach(m => {
    if (m.home_team) teams.add(m.home_team);
    if (m.away_team) teams.add(m.away_team);
  });

  teamSelect.innerHTML = `<option value="ALL">All teams</option>`;
  [...teams].sort().forEach(t => {
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    teamSelect.appendChild(o);
  });
}

function buildRoundButtons(){
  roundBar.innerHTML = "";

  const rounds = [...new Set(matches.map(m => canonicalRound(m.round)).filter(Boolean))];

  const numeric = rounds
    .filter(r => /^Round\s*\d+/i.test(r))
    .map(r => ({ label: r, num: roundNumber(r) }))
    .sort((a,b) => a.num - b.num);

  addRoundButton("All Rounds", true);
  numeric.forEach(r => addRoundButton(r.label));
  finalsRounds.forEach(r => {
    if (rounds.includes(r)) addRoundButton(r);
  });
}

function addRoundButton(label, active=false){
  const b = document.createElement("button");
  b.textContent = label;
  b.className = "round-btn" + (active ? " active" : "");
  b.onclick = () => {
    currentRound = label === "All Rounds" ? "ALL" : label;
    document.querySelectorAll(".round-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    renderMatches();
  };
  roundBar.appendChild(b);
}

teamSelect.onchange = renderMatches;

function getRunningLadderMatches(){
  if (currentRound === "ALL") {
    return matches.filter(m => /^Round\s*\d+/i.test(m.round));
  }

  if (finalsRounds.includes(currentRound)) {
    return matches.filter(m => /^Round\s*\d+/i.test(m.round));
  }

  const n = roundNumber(currentRound);
  return matches.filter(m => {
    const rn = roundNumber(m.round);
    return rn !== null && rn <= n;
  });
}

function renderMatches(){
  matchesDiv.innerHTML = "";
  ladderDiv.innerHTML = "";

  let rows = matches.slice();

  if (teamSelect.value !== "ALL") {
    rows = rows.filter(r => r.home_team === teamSelect.value || r.away_team === teamSelect.value);
  }

  if (currentRound !== "ALL") {
    rows = rows.filter(r => canonicalRound(r.round) === currentRound);
  }

  if (!finalsRounds.includes(currentRound)) {
    buildLadder(getRunningLadderMatches());
  }

  rows.forEach(g => {
    const line = g.home_points > g.away_points
      ? `${g.home_team} ${g.home_points} def ${g.away_team} ${g.away_points}`
      : g.home_points < g.away_points
      ? `${g.home_team} ${g.home_points} def by ${g.away_team} ${g.away_points}`
      : `${g.home_team} ${g.home_points} drew ${g.away_team} ${g.away_points}`;

    matchesDiv.innerHTML += `
      <div class="match" onclick="location.href='afl-game.html?match=${encodeURIComponent(g.match_id)}'">
        <strong>${g.round}</strong>: ${line}
        <div class="meta">${[g.date, g.venue, g.crowd && `Crowd: ${g.crowd}`].filter(Boolean).join(" · ")}</div>
      </div>`;
  });
}

function buildLadder(rows){
  const ladder = {};

  rows.forEach(g => {
    const h = g.home_team, a = g.away_team, hp = +g.home_points, ap = +g.away_points;
    if (!h || !a) return;

    if (!ladder[h]) ladder[h] = {team:h,w:0,l:0,d:0,f:0,ag:0};
    if (!ladder[a]) ladder[a] = {team:a,w:0,l:0,d:0,f:0,ag:0};

    ladder[h].f += hp; ladder[h].ag += ap;
    ladder[a].f += ap; ladder[a].ag += hp;

    if (hp > ap) {
      ladder[h].w++;
      ladder[a].l++;
    } else if (ap > hp) {
      ladder[a].w++;
      ladder[h].l++;
    } else {
      ladder[h].d++;
      ladder[a].d++;
    }
  });

  const arr = Object.values(ladder)
    .map(t => {
      t.p = t.ag ? ((t.f / t.ag) * 100).toFixed(1) : "0.0";
      return t;
    })
    .sort((a,b) => b.w - a.w || b.p - a.p);

  let html = "<table><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>D</th><th>%</th></tr>";
  arr.forEach((t,i) => {
    html += `<tr><td>${i+1}</td><td class="team">${t.team}</td><td>${t.w}</td><td>${t.l}</td><td>${t.d}</td><td>${t.p}</td></tr>`;
  });
  html += "</table>";
  ladderDiv.innerHTML = html;
}
</script>
</body>
</html>
