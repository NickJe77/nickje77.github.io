<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst 1000 | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:Inter,system-ui,Arial;
      margin:0;
      background:#f4f6f8;
    }

    .navbar{
      display:flex;
      justify-content:center;
      gap:24px;
      padding:16px 0;
      background:#fff;
      border-bottom:1px solid #ddd;
      font-weight:600;
    }

    .navbar a{
      text-decoration:none;
      color:#0056d6;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
    }

    .top-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-bottom:20px;
    }

    .card{
      background:#fff;
      padding:16px;
      border-radius:10px;
    }

    .card h3{
      margin-top:0;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#fff;
      border-radius:10px;
      overflow:hidden;
    }

    th, td{
      padding:12px;
      text-align:left;
    }

    th{
      background:#002D72;
      color:#fff;
    }

    tbody tr:nth-child(even){
      background:#f2f6ff;
    }

    tbody tr:hover{
      background:#e0ecff;
    }

    a.year-link{
      font-weight:600;
      color:#0056d6;
      text-decoration:none;
    }

    .drivers{
      color:#333;
      font-size:14px;
    }

    .car{
      color:#666;
      font-size:13px;
    }

    .leaderboard li{
      display:flex;
      justify-content:space-between;
      padding:4px 0;
      border-bottom:1px solid #eee;
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
</div>

<div class="container">
  <h1>Bathurst 1000 History</h1>

  <!-- NEW TOP SECTION -->
  <div class="top-grid">

    <!-- Latest Winner -->
    <div class="card">
      <h3>🏆 Latest Winner</h3>
      <div id="latestWinner">Loading...</div>
    </div>

    <!-- Top Wins -->
    <div class="card">
      <h3>🏁 Most Wins</h3>
      <ul id="leaderboard" class="leaderboard"></ul>
    </div>

  </div>

  <!-- EXISTING TABLE (UNCHANGED STRUCTURE) -->
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Winners</th>
        <th>Car</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>

const body = document.getElementById("table-body");

// -------------------------
// LOAD WINNERS TABLE
// -------------------------
fetch("data/bathurst/winners.json")
  .then(res => res.json())
  .then(data => {

    data.sort((a, b) => b.year - a.year);

    // Latest winner
    const latest = data[0];

    document.getElementById("latestWinner").innerHTML = `
      <strong>${latest.year}</strong><br>
      ${latest.driver}<br>
      <em>${latest.car}</em>
    `;

    data.forEach(r => {

      const tr = document.createElement("tr");

      // FIX: split drivers safely
      const drivers = r.driver.split("/").map(d => d.trim()).join(" / ");

      tr.innerHTML = `
        <td>
          <a class="year-link" href="bathurst-race.html?year=${r.year}">
            ${r.year}
          </a>
        </td>
        <td class="drivers">
          ${drivers}
        </td>
        <td class="car">
          ${r.car}
        </td>
      `;

      body.appendChild(tr);
    });

  })
  .catch(err => {
    console.error("Failed to load Bathurst data", err);

    body.innerHTML = `
      <tr>
        <td colspan="3">Failed to load data</td>
      </tr>
    `;
  });


// -------------------------
// LOAD DRIVER STATS
// -------------------------
fetch("data/bathurst/drivers.json")
  .then(res => res.json())
  .then(data => {

    const top = data.slice(0, 10);
    const list = document.getElementById("leaderboard");

    top.forEach(d => {
      const li = document.createElement("li");
      li.innerHTML = `<span>${d.name}</span><span>${d.wins}</span>`;
      list.appendChild(li);
    });

  });

</script>

</body>
</html>
