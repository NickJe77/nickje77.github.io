<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst Race | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:900px;
  margin:auto;
  padding:25px;
}

h1{
  text-align:center;
}

.table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
}

.table th{
  background:#002D72;
  color:#fff;
  padding:12px;
  text-align:left;
}

.table td{
  padding:12px;
}

.table tr:nth-child(even){
  background:#f2f6ff;
}

.driver{
  color:#0056d6;
  font-weight:600;
  text-decoration:none;
}

.driver:hover{
  text-decoration:underline;
}
</style>

</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./bathurst.html">Bathurst</a>
</div>

<div class="page">

  <h1 id="title">Loading...</h1>

  <table class="table">
    <thead>
      <tr>
        <th>Position</th>
        <th>Driver(s)</th>
        <th>Car</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>

</div>

<script>

// -------------------------
// GET YEAR (SAFE)
// -------------------------
const params = new URLSearchParams(window.location.search);
let year = parseInt(params.get("year"));

console.log("Year param:", year);

// fallback if missing
if(!year || isNaN(year)){
  document.getElementById("title").textContent = "No year selected";
  throw new Error("Missing year parameter");
}

// -------------------------
// DRIVER FORMAT FIX
// -------------------------
function formatDrivers(str){
  if(!str) return "";

  if(str.includes("/")){
    return str.split("/").map(d => d.trim()).join(" / ");
  }

  const parts = str.trim().split(" ");

  if(parts.length >= 4){
    const mid = Math.floor(parts.length / 2);
    return parts.slice(0, mid).join(" ") + " / " + parts.slice(mid).join(" ");
  }

  return str;
}

// -------------------------
// LOAD DATA (CORRECT PATH)
// -------------------------
const url = `/data/bathurst/seasons/${year}.json`;
console.log("Loading:", url);

fetch(url)
  .then(res => {
    if(!res.ok) throw new Error("Fetch failed");
    return res.json();
  })
  .then(data => {

    if(!data || !data.results){
      document.getElementById("title").textContent = "Race not found";
      return;
    }

    document.getElementById("title").textContent =
      `${year} Bathurst 1000`;

    const table = document.getElementById("results");
    table.innerHTML = "";

    data.results.sort((a,b) => {
      if(a.position === "DNF") return 1;
      if(b.position === "DNF") return -1;
      return parseInt(a.position) - parseInt(b.position);
    });

    data.results.forEach(r => {

      const formatted = formatDrivers(r.driver);

      const drivers = formatted
        .split("/")
        .map(d => {
          const name = d.trim();
          const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,"-");
          return `<a class="driver" href="./bathurst-driver.html?driver=${slug}">${name}</a>`;
        })
        .join(" / ");

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${r.position || ""}</td>
        <td>${drivers}</td>
        <td>${r.car || ""}</td>
      `;

      table.appendChild(tr);
    });

  })
  .catch(err => {
    document.getElementById("title").textContent = "Error loading race";
    console.error("ERROR:", err);
  });

</script>

</body>
</html>
