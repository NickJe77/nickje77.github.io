<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  text-align:center;
  padding:44px 20px;
}
.eyebrow{
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:12px;
  display:block;
}
.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(28px,5.5vw,44px);
  letter-spacing:.01em;
  text-transform:uppercase;
}
.hero p{
  margin-top:10px;
  color:rgba(255,255,255,.75);
  font-size:14px;
  font-weight:600;
}
.search-box{
  margin:26px auto 0;
  max-width:420px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:12px 18px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.2);
  font-family:var(--body);
  font-size:14px;
  font-weight:600;
  outline:none;
  background:rgba(255,255,255,.1);
  color:#fff;
}
.search-box input::placeholder{ color:rgba(255,255,255,.6); }
.search-box input:focus{ border-color:var(--accent); }
.suggestions{
  position:absolute;
  width:100%;
  background:var(--surface);
  border-radius:14px;
  margin-top:8px;
  overflow:hidden;
  box-shadow:0 14px 30px -12px rgba(10,16,24,.4);
  z-index:10;
}
.suggestion{
  padding:12px 16px;
  cursor:pointer;
  text-align:left;
}
.suggestion:hover{
  background:var(--accent-soft);
}
.suggestion-name{
  font-weight:700;
  color:var(--ink);
  font-size:14px;
}
.suggestion-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.page{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 70px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:12px;
}
.tile{
  display:block;
  text-align:center;
  padding:22px 10px;
  background:var(--surface);
  border-radius:14px;
  text-decoration:none;
  font-weight:600;
  color:var(--ink);
  border:1px solid var(--line);
  transition:transform .15s,border-color .15s,background .15s;
  font-family:var(--display);
  font-size:18px;
  letter-spacing:.01em;
}
.tile:hover{
  background:var(--accent-soft);
  border-color:var(--accent);
  transform:translateY(-3px);
}
</style>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./bathurst.html" aria-current="page">Bathurst</a>
</div>

<div class="hero">
  <span class="eyebrow">Mount Panorama</span>
  <h1>Bathurst 1000 History & Results</h1>
  <p>Race results, winning drivers and records from every year of the Great Race</p>

  <div class="search-box">
    <input id="search" placeholder="Search driver..." autocomplete="off">
    <div id="suggestions" class="suggestions"></div>
  </div>
</div>

<div class="page">
  <div id="years" class="grid"></div>
</div>

<script>

fetch("/data/bathurst/index.json")
  .then(res => res.json())
  .then(data => {
    if(!Array.isArray(data)){
      console.error("Invalid index.json");
      return;
    }
    data.sort((a,b) => b.year - a.year);
    const container = document.getElementById("years");
    data.forEach(item => {
      const a = document.createElement("a");
      a.className = "tile";
      a.href = `./bathurst-race.html?year=${item.year}`;
      a.innerHTML = `
        ${item.year}
        <div style="font-size:11px;color:#666;margin-top:4px;">
          ${item.winner || ""}
        </div>
      `;
      container.appendChild(a);
    });
  });

let drivers = [];

fetch("/data/bathurst/drivers.json")
  .then(res => res.json())
  .then(data => {
    drivers = data;
  });

const input = document.getElementById("search");
const suggestions = document.getElementById("suggestions");

input.addEventListener("input", () => {
  const value = input.value.toLowerCase();
  suggestions.innerHTML = "";
  if(!value) return;
  const matches = drivers
    .filter(d => d.name.toLowerCase().includes(value))
    .slice(0,8);
  matches.forEach(d => {
    const div = document.createElement("div");
    div.className = "suggestion";
    div.innerHTML = `
      <div class="suggestion-name">${d.name}</div>
      <div class="suggestion-meta">${d.wins} wins • ${d.starts} starts</div>
    `;
    div.onclick = () => {
      const slug = d.name.toLowerCase().replace(/[^a-z0-9]+/g,"-");
      window.location.href = `./bathurst-driver.html?driver=${slug}`;
    };
    suggestions.appendChild(div);
  });
});

document.addEventListener("click", (e) => {
  if(!e.target.closest(".search-box")){
    suggestions.innerHTML = "";
  }
});

</script>

</body>
