<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst 1000 | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:Inter,system-ui,Arial;
      margin:0;
      background:#f4f6f8;
    }

    .navbar{
      display:flex;
      justify-content:center;
      gap:24px;
      padding:16px 0;
      background:#fff;
      border-bottom:1px solid #ddd;
      font-weight:600;
    }

    .navbar a{
      text-decoration:none;
      color:#0056d6;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#fff;
      border-radius:10px;
      overflow:hidden;
    }

    th, td{
      padding:12px;
      text-align:left;
    }

    th{
      background:#002D72;
      color:#fff;
    }

    tbody tr:nth-child(even){
      background:#f2f6ff;
    }

    tbody tr:hover{
      background:#e0ecff;
    }

    a.year-link{
      font-weight:600;
      color:#0056d6;
      text-decoration:none;
    }

    .drivers{
      color:#333;
      font-size:14px;
    }

    .car{
      color:#666;
      font-size:13px;
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
</div>

<div class="container">
  <h1>Bathurst 1000 History</h1>

  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Winners</th>
        <th>Car</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>

const body = document.getElementById("table-body");

fetch("data/bathurst/winners.json")
  .then(res => res.json())
  .then(data => {

    // sort newest first
    data.sort((a, b) => b.year - a.year);

    data.forEach(r => {

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>
          <a class="year-link" href="bathurst-race.html?year=${r.year}">
            ${r.year}
          </a>
        </td>
        <td class="drivers">
          ${r.drivers.join(" / ")}
        </td>
        <td class="car">
          ${r.car}
        </td>
      `;

      body.appendChild(tr);
    });

  })
  .catch(err => {
    console.error("Failed to load Bathurst data", err);

    body.innerHTML = `
      <tr>
        <td colspan="3">Failed to load data</td>
      </tr>
    `;
  });

</script>

</body>
</html>
