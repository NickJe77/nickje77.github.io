<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst 1000 | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:Inter,system-ui,Arial;
      margin:0;
      background:#f4f6f8;
    }

    .navbar{
      display:flex;
      justify-content:center;
      gap:24px;
      padding:16px 0;
      background:#fff;
      border-bottom:1px solid #ddd;
      font-weight:600;
    }

    .navbar a{
      text-decoration:none;
      color:#0056d6;
    }

    .container{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#fff;
      border-radius:10px;
      overflow:hidden;
    }

    th, td{
      padding:12px;
      text-align:left;
    }

    th{
      background:#002D72;
      color:#fff;
    }

    tbody tr:nth-child(even){
      background:#f2f6ff;
    }

    tbody tr:hover{
      background:#e0ecff;
    }

    a.year-link{
      font-weight:600;
      color:#0056d6;
      text-decoration:none;
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
</div>

<div class="container">
  <h1>Bathurst 1000 History</h1>

  <table>
    <thead>
      <tr>
        <th>Year</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
fetch("data/bathurst/index.json")
.then(res => res.json())
.then(data => {
  const body = document.getElementById("table-body");

  data.reverse().forEach(y => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <a class="year-link" href="bathurst-race.html?year=${y.year}">
          ${y.year}
        </a>
      </td>
    `;

    body.appendChild(tr);
  });
});
</script>

</body>
</html>
