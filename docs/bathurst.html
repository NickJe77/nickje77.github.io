<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}
.hero{
  position:relative;
  background:url('/images/bathurst-hero.jpg') center/cover no-repeat;
  color:#fff;
  text-align:center;
  padding:70px 20px 50px;
}
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(0,45,114,0.85), rgba(0,86,214,0.75));
}
.hero *{
  position:relative;
  z-index:1;
}
.hero h1{
  margin:0;
  font-size:40px;
}
.hero p{
  margin-top:10px;
  opacity:.95;
  font-size:17px;
}
.search-box{
  margin:25px auto 0;
  max-width:420px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:none;
  font-size:16px;
  outline:none;
}
.suggestions{
  position:absolute;
  width:100%;
  background:#fff;
  border-radius:10px;
  margin-top:6px;
  overflow:hidden;
  box-shadow:0 10px 20px rgba(0,0,0,.12);
  z-index:10;
}
.suggestion{
  padding:12px;
  cursor:pointer;
}
.suggestion:hover{
  background:#f2f6ff;
}
.suggestion-name{
  font-weight:600;
  color:#0056d6;
}
.suggestion-meta{
  font-size:12px;
  color:#666;
}
.page{
  max-width:1100px;
  margin:auto;
  padding:35px 20px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:18px;
}
.tile{
  display:block;
  text-align:center;
  padding:24px 10px;
  background:#fff;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
  color:#0056d6;
  border:1px solid #e0e0e0;
  transition:.2s;
  font-size:18px;
}
.tile:hover{
  background:#eaf2ff;
  transform:translateY(-4px);
  box-shadow:0 12px 22px rgba(0,0,0,.12);
}

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./bathurst.html">Bathurst</a>
</div>

<div class="hero">
  <h1>Bathurst 1000 History & Results</h1>
  <p>Race results, winning drivers and records from every year of the Great Race</p>

  <div class="search-box">
    <input id="search" placeholder="Search driver..." autocomplete="off">
    <div id="suggestions" class="suggestions"></div>
  </div>
</div>

<div class="page">
  <div id="years" class="grid"></div>
</div>

<script>

fetch("/data/bathurst/index.json")
  .then(res => res.json())
  .then(data => {
    if(!Array.isArray(data)){
      console.error("Invalid index.json");
      return;
    }
    data.sort((a,b) => b.year - a.year);
    const container = document.getElementById("years");
    data.forEach(item => {
      const a = document.createElement("a");
      a.className = "tile";
      a.href = `./bathurst-race.html?year=${item.year}`;
      a.innerHTML = `
        ${item.year}
        <div style="font-size:11px;color:#666;margin-top:4px;">
          ${item.winner || ""}
        </div>
      `;
      container.appendChild(a);
    });
  });

let drivers = [];

fetch("/data/bathurst/drivers.json")
  .then(res => res.json())
  .then(data => {
    drivers = data;
  });

const input = document.getElementById("search");
const suggestions = document.getElementById("suggestions");

input.addEventListener("input", () => {
  const value = input.value.toLowerCase();
  suggestions.innerHTML = "";
  if(!value) return;
  const matches = drivers
    .filter(d => d.name.toLowerCase().includes(value))
    .slice(0,8);
  matches.forEach(d => {
    const div = document.createElement("div");
    div.className = "suggestion";
    div.innerHTML = `
      <div class="suggestion-name">${d.name}</div>
      <div class="suggestion-meta">${d.wins} wins • ${d.starts} starts</div>
    `;
    div.onclick = () => {
      const slug = d.name.toLowerCase().replace(/[^a-z0-9]+/g,"-");
      window.location.href = `./bathurst-driver.html?driver=${slug}`;
    };
    suggestions.appendChild(div);
  });
});

document.addEventListener("click", (e) => {
  if(!e.target.closest(".search-box")){
    suggestions.innerHTML = "";
  }
});

</script>

</body>
