<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

/* NAVBAR */

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

/* PAGE */

.page{
  max-width:1000px;
  margin:auto;
  padding:30px 20px;
}

h1{
  text-align:center;
  margin-bottom:30px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:16px;
}

/* TILE */

.tile{
  display:block;
  text-align:center;
  padding:18px 10px;
  background:#fff;
  border-radius:10px;
  text-decoration:none;
  font-weight:600;
  color:#0056d6;
  border:1px solid #e0e0e0;
  transition:.2s;
}

.tile:hover{
  background:#eaf2ff;
  transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(0,0,0,.1);
}

</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./bathurst.html">Bathurst</a>
</div>

<div class="page">

  <h1>Bathurst 1000</h1>

  <div id="years" class="grid"></div>

</div>

<script>

// -------------------------
// LOAD INDEX
// -------------------------
fetch("/data/bathurst/index.json")
  .then(res => res.json())
  .then(data => {

    if(!data || !data.years){
      document.getElementById("years").innerHTML = "No data found";
      return;
    }

    const container = document.getElementById("years");
    container.innerHTML = "";

    // sort newest first
    data.years.sort((a,b) => b - a);

    data.years.forEach(year => {

      const a = document.createElement("a");
      a.className = "tile";

      // ✅ THIS IS THE FIX
      a.href = `./bathurst-race.html?year=${year}`;

      a.textContent = year;

      container.appendChild(a);
    });

  })
  .catch(err => {
    document.getElementById("years").innerHTML = "Error loading years";
    console.error(err);
  });

</script>

</body>
</html>
