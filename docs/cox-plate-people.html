<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cox Plate Jockeys & Trainers | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./css/racing.css">

<style>
body { background:#fff; color:#111; font-family:Arial,Helvetica,sans-serif; margin:0; }

.navbar {
 text-align:center; padding:16px 0; border-bottom:1px solid #ddd;
}
.navbar a {
 margin:0 18px; text-decoration:none; font-size:18px; font-weight:600; color:#0056d6;
}
.navbar a:hover { text-decoration:underline; }

h1 { text-align:center; margin:30px 0 10px; }

.filter-bar {
 max-width:900px; margin:20px auto 10px;
 display:grid; grid-template-columns:2fr 2fr;
 gap:16px; padding:0 20px;
}

.filter-bar label { font-weight:600; font-size:14px; }

.filter-bar input {
 width:100%; height:36px; padding:6px 10px;
 border-radius:6px; border:1px solid #ccc;
 font-size:14px;
}

.table-wrap { max-width:900px; margin:auto; padding:10px 20px 40px; }

table { width:100%; border-collapse:collapse; font-size:15px; }

th {
 padding:10px; background:#f3f8ff; border-bottom:1px solid #cfe0f5;
 text-align:left; font-weight:700;
}
td { padding:9px 10px; border-bottom:1px solid #e1ecfa; }

tr:nth-child(even){background:#f7fbff;}
tr:hover{background:#eaf3ff;}
</style>
</head>

<body>

<div class="navbar">
 <a href="index.html">Home</a>
 <a href="racing.html">Racing</a>
 <a href="afl.html">AFL</a>
 <a href="football.html">Football</a>
 <a href="cricket.html">Cricket</a>
 <a href="f1.html">F1</a>
</div>

<h1>W.S. Cox Plate – Jockeys & Trainers</h1>

<div class="filter-bar">
 <div>
  <label>Jockey</label>
  <input id="jockeyFilter" placeholder="Type jockey name">
 </div>
 <div>
  <label>Trainer</label>
  <input id="trainerFilter" placeholder="Type trainer name">
 </div>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
 <th>Year</th>
 <th>Winner</th>
 <th>Jockey</th>
 <th>Trainer</th>
</tr>
</thead>
<tbody id="resultsBody"></tbody>
</table>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

let allRows=[];
const body=document.getElementById("resultsBody");

function safe(v){ return (v||"").toString().toLowerCase(); }

fetch("./data/vic-g1.json")
.then(r=>r.json())
.then(data=>{

 allRows=data.filter(r=>{
  if(!r.race||!r.finish) return false;
  const f=safe(r.finish);
  return safe(r.race).includes("cox") &&
         (f==="1"||f==="1st"||f==="01");
 }).sort((a,b)=>b.year-a.year);

 render(allRows);
});

function render(rows){
 body.innerHTML="";
 rows.forEach(r=>{
  body.innerHTML+=`
   <tr>
    <td>${r.year||""}</td>
    <td>${r.horse||""}</td>
    <td>${r.jockey||""}</td>
    <td>${r.trainer||""}</td>
   </tr>`;
 });
}

function apply(){
 const j=safe(jockeyFilter.value);
 const t=safe(trainerFilter.value);

 render(allRows.filter(r=>{
  return (!j||safe(r.jockey).includes(j)) &&
         (!t||safe(r.trainer).includes(t));
 }));
}

jockeyFilter.oninput=apply;
trainerFilter.oninput=apply;

});
</script>

</body>
</html>
