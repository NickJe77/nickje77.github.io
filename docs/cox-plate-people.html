<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cox Plate Jockeys & Trainers | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./css/racing.css">

<style>
body { background:#fff; color:#111; font-family:Arial,Helvetica,sans-serif; margin:0; }

.navbar {
 text-align:center; padding:16px 0; border-bottom:1px solid #ddd;
}
.navbar a {
 margin:0 18px; text-decoration:none; font-size:18px; font-weight:600; color:#0056d6;
}
.navbar a:hover { text-decoration:underline; }

h1 { text-align:center; margin:30px 0 10px; }

.filter-bar {
 max-width:900px;
 margin:20px auto 10px;
 display:grid;
 grid-template-columns:1fr 2fr 2fr 2fr;
 gap:16px;
 padding:0 20px;
}

.filter-bar label {
 font-weight:600;
 font-size:14px;
}

.filter-bar select,
.filter-bar input {
 width:100%;
 height:36px;
 padding:6px 10px;
 border-radius:6px;
 border:1px solid #ccc;
 font-size:14px;
 box-sizing:border-box;
}

/* TABLE */
.table-wrap { max-width:900px; margin:auto; padding:10px 20px 40px; }

table { width:100%; border-collapse:collapse; font-size:15px; }

th {
 padding:10px;
 background:#f3f8ff;
 border-bottom:1px solid #cfe0f5;
 text-align:left;
 font-weight:700;
}
td {
 padding:9px 10px;
 border-bottom:1px solid #e1ecfa;
}

tr:nth-child(even){background:#f7fbff;}
tr:hover{background:#eaf3ff;}
</style>
</head>

<body>

<div class="navbar">
 <a href="index.html">Home</a>
 <a href="racing.html">Racing</a>
 <a href="afl.html">AFL</a>
 <a href="football.html">Football</a>
 <a href="cricket.html">Cricket</a>
 <a href="f1.html">F1</a>
</div>

<h1>W.S. Cox Plate – Jockeys & Trainers</h1>

<div class="filter-bar">

 <div>
  <label>Year</label>
  <select id="yearFilter">
    <option value="">All</option>
  </select>
 </div>

 <div>
  <label>Jockey</label>
  <input id="jockeyFilter" placeholder="Type jockey name">
 </div>

 <div>
  <label>Trainer</label>
  <input id="trainerFilter" placeholder="Type trainer name">
 </div>

 <div>
  <label>Horse</label>
  <input id="horseFilter" placeholder="Type horse name">
 </div>

</div>

<div class="table-wrap">
<table>
<thead>
<tr>
 <th>Year</th>
 <th>Horse</th>
 <th>Jockey</th>
 <th>Trainer</th>
 <th>Finish</th>
</tr>
</thead>
<tbody id="resultsBody"></tbody>
</table>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

let allRows=[];
const body=document.getElementById("resultsBody");

function safe(v){ return (v||"").toString().toLowerCase(); }

fetch("./data/vic-g1.json")
.then(r=>r.json())
.then(data=>{

 allRows=data.filter(r=>{
  if(!r.race || !r.year) return false;
  return safe(r.race).includes("cox");
 }).sort((a,b)=>b.year-a.year || (a.finish-b.finish));

 populateYears();
 render(allRows);
});

function populateYears(){
 const sel=document.getElementById("yearFilter");
 [...new Set(allRows.map(r=>r.year))].sort((a,b)=>b-a).forEach(y=>{
  const o=document.createElement("option");
  o.value=y;
  o.textContent=y;
  sel.appendChild(o);
 });
}

function render(rows){
 body.innerHTML="";
 rows.forEach(r=>{
  body.innerHTML+=`
   <tr>
    <td>${r.year||""}</td>
    <td>${r.horse||""}</td>
    <td>${r.jockey||""}</td>
    <td>${r.trainer||""}</td>
    <td>${r.finish||""}</td>
   </tr>`;
 });
}

function apply(){
 const year=yearFilter.value;
 const jockey=safe(jockeyFilter.value);
 const trainer=safe(trainerFilter.value);
 const horse=safe(horseFilter.value);

 render(allRows.filter(r=>{
  return (!year||r.year==year) &&
         (!jockey||safe(r.jockey).includes(jockey)) &&
         (!trainer||safe(r.trainer).includes(trainer)) &&
         (!horse||safe(r.horse).includes(horse));
 }));
}

yearFilter.onchange=apply;
jockeyFilter.oninput=apply;
trainerFilter.oninput=apply;
horseFilter.oninput=apply;

});
</script>

</body>
</html>
