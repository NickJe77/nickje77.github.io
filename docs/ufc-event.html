<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>UFC Event | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;position:sticky;top:0;z-index:100;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));color:#fff;
  padding:44px 20px 38px;text-align:center;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,4.5vw,36px);
  letter-spacing:.01em;text-transform:uppercase;line-height:1.1;
}
.hero p{margin:8px 0 0;font-size:14px;color:rgba(255,255,255,.68);}

.page-wrap{max-width:1000px;margin:0 auto;padding:26px 20px 70px;}
.section{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;margin-bottom:18px;
}
.section-title{
  font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;margin:0 0 16px;border-left:4px solid var(--accent);
  padding-left:12px;color:var(--muted);
}
.fight-card{border-radius:14px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line);}
.fight-header{
  background:#f7f9fb;padding:8px 16px;font-size:10.5px;font-weight:600;text-transform:uppercase;
  color:var(--muted);letter-spacing:.04em;display:flex;justify-content:space-between;font-family:var(--body);
}
.fight-body{padding:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;}
.fighter-side{display:flex;flex-direction:column;}
.fighter-side.right{align-items:flex-end;text-align:right;}
.fighter-name{font-family:var(--display);font-size:16px;font-weight:600;}
.fighter-name a{color:var(--ink);text-decoration:none;}
.fighter-name a:hover{color:var(--accent);}
.fighter-result{font-size:12px;font-weight:700;margin-top:4px;}
.result-W{color:#1e7a3d;}
.result-L{color:#c0362c;}
.result-NC{color:var(--muted);}
.fight-middle{text-align:center;}
.fight-method{font-size:13px;font-weight:700;color:var(--ink);}
.fight-detail{font-size:11.5px;color:var(--muted);margin-top:3px;}
.fight-time{font-size:11.5px;color:var(--muted);}
.main-event .fight-card{border:2px solid var(--accent);}
.main-event .fight-header{background:var(--accent-soft);color:var(--ink);}
.segment-label{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--accent);letter-spacing:.04em;margin:20px 0 10px;}
.loading{text-align:center;padding:60px;font-size:15px;font-weight:600;color:var(--muted);}
.error{text-align:center;padding:60px;font-size:15px;color:#c0362c;font-weight:600;}
</style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="ufc.html">UFC</a>
  <a href="ufc-events.html">Events</a>
  <a href="ufc-fighters.html">Fighters</a>
  <a href="ufc-records.html">Records</a>
</div>
<div id="hero" class="hero"><div class="loading">Loading event...</div></div>
<div id="pageWrap" class="page-wrap" style="display:none"></div>

<script>
var params  = new URLSearchParams(location.search);
var eventId = params.get('id');

if(!eventId){
  document.getElementById('hero').innerHTML = '<div class="error">No event specified.</div>';
} else {
  fetch('/data/ufc/events/'+eventId+'.json')
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(render)
    .catch(function(){
      document.getElementById('hero').innerHTML = '<div class="error">Event not found.</div>';
    });
}

function render(ev){
  document.title = ev.name + ' | UFC | The Sporting Almanac';
  document.getElementById('hero').innerHTML =
    '<h1>'+ev.name+'</h1>'+
    '<p>'+ev.date+(ev.venue?' · '+ev.venue:'')+'</p>';

  // Group fights by card segment
  var segments = {};
  var segOrder = [];
  (ev.fights||[]).forEach(function(f){
    var seg = f.card_segment || 'Fight Card';
    if(!segments[seg]){ segments[seg]=[]; segOrder.push(seg); }
    segments[seg].push(f);
  });

  var html = '';

  // Preferred segment order
  var order = ['Main Card','Prelims','Early Prelims','Prelim Card','Fight Card'];
  var sortedSegs = segOrder.sort(function(a,b){
    var ai = order.indexOf(a), bi = order.indexOf(b);
    if(ai===-1) ai=99; if(bi===-1) bi=99;
    return ai-bi;
  });

  sortedSegs.forEach(function(seg, si){
    var fights = segments[seg];
    html += '<div class="section">';
    html += '<div class="section-title">'+seg+'</div>';
    fights.forEach(function(f, fi){
      var isMain = si===0 && fi===0;
      var f1 = (f.fighters||[])[0] || {};
      var f2 = (f.fighters||[])[1] || {};

      html += '<div class="fight-card'+(isMain?' main-event':'')+'">';
      html += '<div class="fight-header">'+
        '<span>'+f.weight_class+'</span>'+
        '<span>'+(f.format||'')+'</span>'+
        '</div>';
      html += '<div class="fight-body">';

      // Fighter 1
      html += '<div class="fighter-side">'+
        '<div class="fighter-name"><a href="/ufc-fighter.html?id='+f1.id+'">'+f1.name+'</a></div>'+
        (f.completed?'<div class="fighter-result result-'+(f1.winner?'W':'L')+'">'+(f1.winner?'WIN':'LOSS')+'</div>':'')+
        '</div>';

      // Middle
      html += '<div class="fight-middle">'+
        '<div style="font-size:22px;font-weight:900;color:#ccc">VS</div>'+
        (f.completed?
          '<div class="fight-method">'+f.method+'</div>'+
          (f.method_detail?'<div class="fight-detail">'+f.method_detail+'</div>':'')+
          '<div class="fight-time">R'+f.round+' '+f.time+'</div>'
        :'')+
        '</div>';

      // Fighter 2
      html += '<div class="fighter-side right">'+
        '<div class="fighter-name"><a href="/ufc-fighter.html?id='+f2.id+'">'+f2.name+'</a></div>'+
        (f.completed?'<div class="fighter-result result-'+(f2.winner?'W':'L')+'">'+(f2.winner?'WIN':'LOSS')+'</div>':'')+
        '</div>';

      html += '</div></div>'; // fight-body, fight-card
    });
    html += '</div>'; // section
  });

  if(!html) html = '<div class="loading">No fight data available yet.</div>';

  var wrap = document.getElementById('pageWrap');
  wrap.innerHTML = html;
  wrap.style.display = 'block';
}
</script>
</body>
</html>
