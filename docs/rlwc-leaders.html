<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Rugby League World Cup – Leaders | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#eceff3;
      --surface:#ffffff;
      --ink:#0f141a;
      --muted:#69727c;
      --faint:#9aa3ad;
      --line:#e3e8ee;
      --board:#0a0a0a;
      --board-2:#1a1a1a;
      --accent:#1fa25c;
      --league:#a8790a;
      --gold:#c9a200;
      --silver:#8a94a0;
      --bronze:#a0522d;
      --display:'Oswald',system-ui,sans-serif;
      --body:'Inter',system-ui,sans-serif;
      --radius:16px;
    }
    *{box-sizing:border-box;}
    body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
    .navbar a{color:var(--ink);text-decoration:none;opacity:.7;transition:opacity .15s;}
    .navbar a:hover{opacity:1;}

    /* ── Hero ─────────────────────────────────────────── */
    .hero{
      position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
      color:#fff;padding:44px 20px;text-align:center;
    }
    .hero .eyebrow{
      font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
      text-transform:uppercase;color:var(--accent);margin-bottom:10px;
    }
    .hero h1{
      margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,4.5vw,40px);
      letter-spacing:.01em;text-transform:uppercase;color:#fff;
    }

    .page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

    h2{
      font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em;text-transform:uppercase;
      margin:0 0 14px;color:var(--league);display:flex;align-items:center;gap:8px;
    }
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
    .stat-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}

    .leaders-table{width:100%;border-collapse:collapse;}
    .leaders-table td{padding:7px 8px;vertical-align:middle;border-bottom:1px solid var(--line);}
    .leaders-table tr:last-child td{border-bottom:none;}
    .leaders-table tr:hover td{background:#f0f6ff;}
    .rank{font-weight:700;color:var(--faint);width:26px;text-align:center;font-size:12.5px;}
    .rank.gold{color:var(--gold);}
    .rank.silver{color:var(--silver);}
    .rank.bronze{color:var(--bronze);}
    .player-name{font-weight:700;font-size:13.5px;color:var(--ink);}
    .player-cc{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;}
    .count{font-weight:700;font-size:14.5px;text-align:right;white-space:nowrap;font-family:var(--display);}
    .count-goals{color:var(--league);}
    .count-yellow{color:#b38a00;}
    .count-red{color:#c0362c;}
    .card-icon{display:inline-block;width:11px;height:15px;border-radius:2px;vertical-align:middle;}
    .card-yellow{background:#e6b800;}
    .card-red{background:#c0362c;}
    .red-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}

    .match-table{width:100%;border-collapse:collapse;}
    .match-table th{
      text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
      padding:8px 10px;border-bottom:2px solid var(--line);font-weight:600;
    }
    .match-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px;}
    .match-table tr:last-child td{border-bottom:none;}
    .match-table tr:hover td{background:#f0f6ff;}
    .match-teams{font-weight:700;font-size:13.5px;color:var(--ink);}
    .match-meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
    .round-badge{display:inline-block;font-size:10.5px;padding:2px 8px;background:#f0f2f5;border-radius:999px;color:var(--muted);font-weight:600;}
    .year-col{font-family:var(--display);font-weight:600;color:var(--ink);white-space:nowrap;font-size:13.5px;}
    .margin-col{font-family:var(--display);font-weight:600;font-size:14.5px;color:#c0362c;white-space:nowrap;}
    .total-col{font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--league);white-space:nowrap;}
    .ht-goals-cell{font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--league);text-align:center;width:50px;}

    @media (max-width: 700px) {
      .stats-grid{grid-template-columns:1fr;}
      .red-cols{grid-template-columns:1fr;}
      .navbar{gap:12px;font-size:12.5px;}
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
  <a href="rlwc.html">Rugby League World Cup</a>
  <a href="rlwc-teams.html">Teams</a>
</nav>

<div class="hero">
  <div class="eyebrow">Rugby League</div>
  <h1>Rugby League World Cup Leaders</h1>
</div>

<div class="page-wrap">

  <div class="stats-grid">
    <div class="stat-box">
      <h2>Top 15 All-Time Try Scorers</h2>
      <table class="leaders-table"><tbody id="scorers-body"></tbody></table>
    </div>
    <div class="stat-box">
      <h2>Most Goals Kicked</h2>
      <table class="leaders-table"><tbody id="yellow-body"></tbody></table>
    </div>
  </div>

  <div class="stat-box" style="margin-bottom:18px">
    <h2>Most Field Goals</h2>
    <div class="red-cols">
      <table class="leaders-table"><tbody id="red-body-1"></tbody></table>
      <table class="leaders-table"><tbody id="red-body-2"></tbody></table>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <h2>Highest Scoring Games</h2>
      <table class="match-table">
        <thead><tr><th>Total</th><th>Match</th><th>Year</th></tr></thead>
        <tbody id="high-scoring-body"></tbody>
      </table>
    </div>
    <div class="stat-box">
      <h2>Biggest Wins</h2>
      <table class="match-table">
        <thead><tr><th>Margin</th><th>Match</th><th>Year</th></tr></thead>
        <tbody id="biggest-wins-body"></tbody>
      </table>
    </div>
  </div>

  <div class="stat-box" style="margin-top:18px">
    <h2>Most Tries in a Single Game (3+)</h2>
    <table class="match-table">
      <thead><tr><th style="text-align:center">Goals</th><th>Player</th><th>Match</th><th>Round</th><th>Year</th></tr></thead>
      <tbody id="ht-body"></tbody>
    </table>
  </div>
</div>

<script>
function rankClass(i) {
  return i===0?'gold':i===1?'silver':i===2?'bronze':'';
}
function leaderRow(i, player, value, cls) {
  return `<tr><td class="rank ${rankClass(i)}">${i+1}</td><td><div class="player-name">${player}</div></td><td class="count ${cls}">${value}</td></tr>`;
}

const YEARS = [1954,1957,1960,1968,1970,1972,1975,1977,1988,1992,1995,2000,2008,2013,2017,2022];

Promise.all(YEARS.map(y=>
  fetch(`data/rlwc/${y}.json`).then(r=> r.ok ? r.json() : []).catch(()=>[]).then(matches=>matches.map(m=>({...m, _year:y})))
)).then(allTournaments=>{
  const allMatches = allTournaments.flat();

  // ── Top try scorers / goal kickers / field goals, computed live ──
  const tries={}, goals={}, fieldGoals={};
  allMatches.forEach(m=>{
    [m.home_scorers, m.away_scorers].forEach(group=>{
      if(!group) return;
      group.tries.forEach(e=>{ const n=e.full_name||e.player; tries[n]=(tries[n]||0)+e.count; });
      group.goals.forEach(e=>{ const n=e.full_name||e.player; goals[n]=(goals[n]||0)+e.count; });
      group.field_goals.forEach(e=>{ const n=e.full_name||e.player; fieldGoals[n]=(fieldGoals[n]||0)+e.count; });
    });
  });

  const topTop=arr=>Object.entries(arr).sort((a,b)=>b[1]-a[1]);
  const topTries = topTop(tries).slice(0,15);
  const topGoals = topTop(goals).slice(0,15);
  const topFieldGoals = topTop(fieldGoals);

  document.getElementById('scorers-body').innerHTML = topTries.map((s,i)=>leaderRow(i,s[0],s[1],'count-goals')).join('');
  document.getElementById('yellow-body').innerHTML = topGoals.map((s,i)=>leaderRow(i,s[0],s[1],'count-yellow')).join('');

  const half = Math.ceil(topFieldGoals.length/2);
  document.getElementById('red-body-1').innerHTML = topFieldGoals.slice(0,half).map((c,i)=>leaderRow(i,c[0],c[1],'count-red')).join('');
  document.getElementById('red-body-2').innerHTML = topFieldGoals.slice(half).map((c,i)=>leaderRow(i+half,c[0],c[1],'count-red')).join('');

  // ── Highest scoring / biggest wins, computed live ──
  const withTotals = allMatches.map(m=>({
    total: m.home_score+m.away_score, margin: Math.abs(m.home_score-m.away_score),
    home: m.home_team.name, away: m.away_team.name,
    home_score: m.home_score, away_score: m.away_score, round: m.round, year: m._year,
  }));

  const highScoring = [...withTotals].sort((a,b)=>b.total-a.total).slice(0,15);
  document.getElementById('high-scoring-body').innerHTML = highScoring.map((m,i)=>
    `<tr><td class="rank ${rankClass(i)}">${i+1}</td><td class="total-col">${m.total}</td><td><div class="match-teams">${m.home} <strong>${m.home_score}-${m.away_score}</strong> ${m.away}</div><div class="match-meta"><span class="round-badge">${m.round}</span></div></td><td class="year-col">${m.year}</td></tr>`
  ).join('');

  const biggestWins = [...withTotals].sort((a,b)=>b.margin-a.margin).slice(0,15);
  document.getElementById('biggest-wins-body').innerHTML = biggestWins.map((m,i)=>{
    const winner = m.home_score>m.away_score ? m.home : m.away;
    const loser = m.home_score>m.away_score ? m.away : m.home;
    const score = `${Math.max(m.home_score,m.away_score)}-${Math.min(m.home_score,m.away_score)}`;
    return `<tr><td class="rank ${rankClass(i)}">${i+1}</td><td class="margin-col">+${m.margin}</td><td><div class="match-teams">${winner} <strong>${score}</strong> ${loser}</div><div class="match-meta"><span class="round-badge">${m.round}</span></div></td><td class="year-col">${m.year}</td></tr>`;
  }).join('');

  // ── Hat-tricks: 3+ tries by one player in a single match ──
  const hatTricks = [];
  allMatches.forEach(m=>{
    [{group:m.home_scorers, opp:m.away_team.name, team:m.home_team.name},
     {group:m.away_scorers, opp:m.home_team.name, team:m.away_team.name}].forEach(({group, opp, team})=>{
      if(!group) return;
      group.tries.forEach(e=>{
        if(e.count>=3){
          hatTricks.push({player:e.full_name||e.player, tries:e.count, team, opp, round:m.round, year:m._year});
        }
      });
    });
  });
  hatTricks.sort((a,b)=>b.tries-a.tries);

  document.getElementById('ht-body').innerHTML = hatTricks.length
    ? hatTricks.map(h=>`<tr><td class="ht-goals-cell">${h.tries}</td><td><div class="player-name">${h.player}</div></td><td>${h.team} vs ${h.opp}</td><td><span class="round-badge">${h.round}</span></td><td class="year-col">${h.year}</td></tr>`).join('')
    : `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:16px;">None on record</td></tr>`;
});

</script>
</body>
</html>
