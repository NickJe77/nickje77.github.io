<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>UEFA Euro – Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#1fa25c;
  --league:#a8790a;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{color:var(--ink);text-decoration:none;opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:44px 20px;text-align:center;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,4.5vw,40px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

/* ── Selector ─────────────────────────────────────────── */
.selector{display:flex;gap:12px;justify-content:center;margin-bottom:26px;flex-wrap:wrap;}
select{
  padding:10px 16px;font-size:13.5px;font-weight:600;border-radius:999px;border:1px solid var(--line);
  min-width:220px;background:var(--surface);color:var(--ink);font-family:var(--body);cursor:pointer;
}
select:hover{border-color:var(--faint);}
button{
  padding:10px 22px;font-size:13.5px;border:none;border-radius:999px;cursor:pointer;
  background:var(--ink);color:#fff;font-weight:600;font-family:var(--body);transition:opacity .15s;
}
button:hover{opacity:.85;}

/* ── Summary ──────────────────────────────────────────── */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 18px;margin-bottom:20px;}
.h2h-grid{
  display:grid;grid-template-columns:80px 1fr 1fr 1fr 80px;align-items:center;justify-items:center;
  column-gap:24px;row-gap:10px;
}
.flag{font-size:42px;line-height:1;}
.h2h-num{font-family:var(--display);font-weight:600;font-size:36px;color:var(--ink);}
.h2h-sep{font-family:var(--display);font-weight:600;font-size:36px;opacity:.3;}
.h2h-labels{
  grid-column:2 / 5;width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;justify-items:center;
  column-gap:24px;margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;
}
.h2h-labels div{text-align:center;}

/* ── Leaders & matches ────────────────────────────────── */
.leaders{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
.leaders h3{
  text-align:center;margin:0 0 14px;font-family:var(--display);font-weight:600;font-size:15px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--league);
}
.leader-line{font-size:13.5px;font-weight:600;padding:6px 0;border-bottom:1px solid var(--line);text-align:center;color:var(--ink);}
.leader-line:last-child{border-bottom:none;}

.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
.match h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink);}
.small{font-size:12.5px;color:var(--muted);font-weight:600;}

.team-link{color:var(--league);text-decoration:none;font-weight:700;}
.team-link:hover{color:var(--accent);text-decoration:underline;}
</style>
</head>

<body>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="euro.html">Euro</a>
<a href="euro-countries.html">Countries</a>
<a href="euro-year.html">By Year</a>
</nav>

<div class="hero">
  <div class="eyebrow">Football</div>
  <h1>Euro – Head to Head</h1>
</div>

<div class="page-wrap">

<div class="selector">
<select id="teamA"></select>
<select id="teamB"></select>
<button onclick="compare()">Compare</button>
</div>

<div id="summary"></div>
<div id="scorers"></div>
<div id="results"></div>

</div>

<script>
const COUNTRY_PAGE="euro-country.html";
const YEARS = [1960,1964,1968,1972,1976,1980,1984,1988,1992,1996,2000,2004,2008,2012,2016,2020,2024];

const countryCodes={"Albania": "AL", "Austria": "AT", "Belgium": "BE", "Bulgaria": "BG", "Croatia": "HR", "Czech Republic": "CZ", "Denmark": "DK", "England": "GB", "Finland": "FI", "France": "FR", "Georgia": "GE", "Germany": "DE", "Greece": "GR", "Hungary": "HU", "Iceland": "IS", "Ireland": "IE", "Italy": "IT", "Latvia": "LV", "N. Ireland": "GB", "Netherlands": "NL", "North Macedonia": "MK", "Norway": "NO", "Poland": "PL", "Portugal": "PT", "Romania": "RO", "Russia": "RU", "Scotland": "GB", "Serbia": "RS", "Slovakia": "SK", "Slovenia": "SI", "Spain": "ES", "Sweden": "SE", "Switzerland": "CH", "Turkey": "TR", "Ukraine": "UA", "Wales": "GB", "CIS": "", "CSSR": "", "USSR": "", "Yugoslavia": ""};
function flagEmoji(code){
 if(!code) return "";
 return code.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0)));
}
function getFlag(team){
 return flagEmoji(countryCodes[team]||"");
}

/* ---------- LOAD TEAM LIST ---------- */
fetch("data/uefaeuro/teams.json",{cache:"no-store"})
.then(r=>r.json())
.then(teams=>{
 const a=document.getElementById("teamA");
 const b=document.getElementById("teamB");
 teams.map(t=>t.name).sort((x,y)=>x.localeCompare(y)).forEach(name=>{
  a.add(new Option(name,name));
  b.add(new Option(name,name));
 });
});

function compare(){
 const a=document.getElementById("teamA").value;
 const b=document.getElementById("teamB").value;
 if(!a||!b||a===b) return;

 document.getElementById("results").innerHTML = "<div style='text-align:center;padding:20px;color:var(--muted);'>Loading...</div>";

 Promise.all([
   ...YEARS.map(y=>
     fetch(`data/uefaeuro/seasons/${y}.json`).then(r=>r.json()).then(d=>({year:y, games:d.games||d}))
   ),
   fetch("data/uefaeuro/players.json").then(r=>r.json()),
 ]).then(results=>{
   const players = results.pop();
   const allSeasons = results;
   const matches = [];
   allSeasons.forEach(({year, games})=>{
     games.forEach(g=>{
       if((g.home_team===a && g.away_team===b) || (g.home_team===b && g.away_team===a)){
         matches.push({...g, year});
       }
     });
   });

   // Scorers against the OTHER team specifically, from either side --
   // goals_by_opponent is already computed per player per season.
   const scorers = {};
   players.forEach(p=>{
    p.season_stats.forEach(s=>{
     if(s.team===a && s.goals_by_opponent && s.goals_by_opponent[b]){
      scorers[p.name] = (scorers[p.name]||0) + s.goals_by_opponent[b];
     }
     if(s.team===b && s.goals_by_opponent && s.goals_by_opponent[a]){
      scorers[p.name] = (scorers[p.name]||0) + s.goals_by_opponent[a];
     }
    });
   });

   // For any match decided by penalties, the season file's home_score/
   // away_score reflects the SHOOTOUT result, not the real regulation
   // score -- confirmed real bug (Italy 3:2 England shown for the 2020
   // final, when the actual match was 1-1). Fetch each h2h match's own
   // file to recover the true score for display; win/loss tallying
   // above is untouched since the season-file score already correctly
   // reflects who really won, shootout or not.
   Promise.all(matches.map(m=>
     fetch(`data/uefaeuro/matches/${m.year}/${m.game_id}.json`)
       .then(r=> r.ok ? r.json() : null)
       .then(raw=>{
         if(!raw) return m;
         let lastValid = null;
         (raw.events||[]).forEach(e=>{
           if(e.type==='goal' && e.running_score && e.running_score.includes(':')) lastValid = e.running_score;
         });
         if(!lastValid){
           const wasShootout0 = (m.home_score !== 0) || (m.away_score !== 0);
           return {...m, trueHome:0, trueAway:0, penaltyScore: wasShootout0 ? `${m.home_score}-${m.away_score}` : null};
         }
         const [h,a2] = lastValid.split(':').map(Number);
         const wasShootout = (h!==m.home_score) || (a2!==m.away_score);
         return {...m, trueHome:h, trueAway:a2, penaltyScore: wasShootout ? `${m.home_score}-${m.away_score}` : null};
       })
       .catch(()=>m)
   )).then(correctedMatches=>{
     render(a,b,correctedMatches,scorers);
   });
 });
}

function render(a,b,matches,scorers){
 let wA=0,wB=0,d=0;

 matches.forEach(m=>{
  const aIsHome = m.home_team===a;
  const aScore = aIsHome ? m.home_score : m.away_score;
  const bScore = aIsHome ? m.away_score : m.home_score;
  if(aScore>bScore) wA++;
  else if(bScore>aScore) wB++;
  else d++;
 });

 const flagA=getFlag(a);
 const flagB=getFlag(b);

 document.getElementById("summary").innerHTML=`
  <div class="summary">
   <div class="h2h-grid">
    <div class="flag">${flagA}</div>
    <div class="h2h-num">${wA}</div>
    <div class="h2h-num">${d}</div>
    <div class="h2h-num">${wB}</div>
    <div class="flag">${flagB}</div>
    <div class="h2h-labels">
     <div>${a} Wins</div>
     <div>Draws</div>
     <div>${b} Wins</div>
    </div>
   </div>
  </div>
 `;

 const top = Object.entries(scorers).sort((x,y)=>y[1]-x[1]).slice(0,5);
 document.getElementById("scorers").innerHTML=`
  <div class="leaders">
   <h3>Top Scorers in this Match-Up</h3>
   ${top.length
     ? top.map(s=>`<div class="leader-line">${s[0]} – ${s[1]}</div>`).join("")
     : "<div class='leader-line'>No goals recorded</div>"}
  </div>
 `;

 const out=document.getElementById("results");
 out.innerHTML="";

 matches
  .sort((x,y)=>x.year-y.year)
  .forEach(m=>{
   const hasTrue = m.trueHome !== undefined;
   const dispHome = hasTrue ? m.trueHome : m.home_score;
   const dispAway = hasTrue ? m.trueAway : m.away_score;
   const result = m.home_score===m.away_score ? "Draw"
                : (m.home_score>m.away_score ? m.home_team : m.away_team);
   const penaltyNote = m.penaltyScore ? ` (won ${m.penaltyScore} on penalties)` : "";
   out.innerHTML += `
    <div class="match">
     <h3>
      <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.home_team)}">${m.home_team}</a>
      ${dispHome}-${dispAway}
      <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.away_team)}">${m.away_team}</a>
     </h3>
     <div class="small">${m.year} – ${m.date}</div>
     <div class="small">${result==="Draw" ? "Draw" : `Winner: ${result}${penaltyNote}`}</div>
    </div>
   `;
  });
}

</script>

</body>
</html>
