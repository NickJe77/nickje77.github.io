<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Matches | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family:Inter,Arial;
    margin:0;
    background:#f4f6f8;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px;
    border-bottom:1px solid #ddd;
    background:white;
}

.navbar a{
    text-decoration:none;
    font-weight:600;
    color:#0056d6;
}

.page{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.match{
    background:white;
    padding:16px;
    margin-bottom:12px;
    border-radius:12px;
}

.match a{
    font-weight:bold;
    font-size:18px;
    text-decoration:none;
    color:#003566;
}

.meta{
    color:#555;
    margin-top:4px;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<h1>T20 World Cup Matches</h1>

<div id="matches">Loading matches...</div>

</div>

<script>

const FILES = [

"t20wc_2007_FULL.json",
"t20wc_2008_FULL.json",
"t20wc_2009_FULL.json",
"t20wc_2010_FULL.json",
"t20wc_2012_FULL.json",
"t20wc_2013_FULL.json",
"t20wc_2014_FULL.json",
"t20wc_2015_FULL.json",
"t20wc_2016_FULL.json",
"t20wc_2021_FULL.json",
"t20wc_2022_FULL.json",
"t20wc_2023_FULL.json",
"t20wc_2024_FULL.json",
"t20wc_2025_FULL.json"

];

const BASE =
"data/t20-world-cup/matches/";

async function loadMatches()
{
    let html="";

    for(const file of FILES)
    {
        const res = await fetch(BASE + file);

        if(!res.ok) continue;

        const data = await res.json();

        if(!data.matches) continue;

        data.matches.forEach((match,index)=>
        {
            const info = match.info;

            html+=`

            <div class="match">

            <a href="t20-world-cup-match.html?file=${file}&match=${index}">
            ${info.teams[0]} vs ${info.teams[1]}
            </a>

            <div class="meta">
            ${info.venue}
            </div>

            <div class="meta">
            ${info.dates[0]}
            </div>

            </div>

            `;
        });
    }

    document.getElementById("matches").innerHTML=html;
}

loadMatches();

</script>

</body>
</html>
