<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family:Inter,system-ui,Arial;
    margin:0;
    background:#f4f6f8;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px;
    border-bottom:1px solid #ddd;
    background:white;
}

.navbar a{
    text-decoration:none;
    font-weight:600;
    color:#0056d6;
}

.page{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

.hero{
    background:linear-gradient(90deg,#8b0000,#e10600);
    color:white;
    padding:40px;
    border-radius:22px;
    margin-bottom:25px;
}

.year-grid{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:25px;
}

.year-btn{
    background:#7a0000;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:12px;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
}

.year-btn.active{
    background:#ff3b3b;
}

.match{
    background:white;
    padding:16px;
    margin-bottom:12px;
    border-radius:14px;
}

.match a{
    font-weight:700;
    font-size:18px;
    text-decoration:none;
    color:#8b0000;
}

.meta{
    margin-top:4px;
    color:#555;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1>T20 World Cup</h1>
</div>

<div class="year-grid" id="yearGrid"></div>

<div id="matches"></div>

</div>

<script>

const YEARS =
[2007,2009,2010,2012,2014,2016,2021,2022,2024,2026];

const BASE =
"data/t20-world-cup/matches/";

const START_DATES =
{
2010:"2010-04-30",
2012:"2012-09-18",
2021:"2021-10-17",
2022:"2022-10-16"
};


/* ONLY APPLY TEAM FILTER TO 2021 AND 2022 */

const OFFICIAL_TEAMS =
{
2021:new Set([
"afghanistan","australia","bangladesh","england","india","new zealand","pakistan","south africa","sri lanka","west indies",
"namibia","scotland","ireland","netherlands","oman","papua new guinea"
]),

2022:new Set([
"afghanistan","australia","bangladesh","england","india","new zealand","pakistan","south africa","sri lanka","west indies",
"zimbabwe","ireland","netherlands","namibia","scotland","united arab emirates"
])
};


function normalize(name)
{
return name.toLowerCase().trim();
}


function buildYearButtons()
{
const grid=document.getElementById("yearGrid");

YEARS.forEach(year=>
{
const btn=document.createElement("button");

btn.className="year-btn";
btn.innerText=year;

btn.onclick=()=>
{
document.querySelectorAll(".year-btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

loadYear(year);
};

grid.appendChild(btn);
});
}


async function loadYear(year)
{

const file=`t20wc_${year}_FULL.json`;

const res=await fetch(BASE+file);

if(!res.ok)
{
document.getElementById("matches").innerHTML=
"No data found";
return;
}

const data=await res.json();

let matches=
Array.isArray(data)
? data
: data.matches;

if(!matches)
{
document.getElementById("matches").innerHTML=
"No matches found";
return;
}


/* DATE FILTER */

if(START_DATES[year])
{
const cutoff=new Date(START_DATES[year]);

matches=
matches.filter(match=>
new Date(match.info.dates[0])>=cutoff
);
}


/* TEAM FILTER ONLY FOR 2021 & 2022 */

if(OFFICIAL_TEAMS[year])
{
matches=
matches.filter(match=>
{
const t1=normalize(match.info.teams[0]);
const t2=normalize(match.info.teams[1]);

return OFFICIAL_TEAMS[year].has(t1)
&& OFFICIAL_TEAMS[year].has(t2);
});
}


let html="";

matches.forEach((match,index)=>
{
const info=match.info;

html+=`

<div class="match">

<a href="t20-world-cup-match.html?file=${file}&match=${index}">

${info.teams[0]} vs ${info.teams[1]}

</a>

<div class="meta">${info.venue}</div>

<div class="meta">${info.dates[0]}</div>

</div>

`;
});

document.getElementById("matches").innerHTML=
html || "No matches after filtering";

}


buildYearButtons();

loadYear(2024);

document.querySelectorAll(".year-btn")
.forEach(btn=>
{
if(btn.innerText=="2024")
btn.classList.add("active");
});

</script>

</body>
</html>
