<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Matches | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:#ffffff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px;
margin:20px;
border-radius:16px;
}

.year-bar{
margin:20px;
}

.year-btn{
background:#6a040f;
color:white;
border:none;
padding:10px 16px;
margin:4px;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.year-btn.active{
background:#d00000;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:16px;
margin:20px;
}

.summary-box{
background:white;
padding:16px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
text-align:center;
}

.summary-box .big{
font-size:24px;
font-weight:700;
color:#6a040f;
}

table{
width:95%;
margin:20px auto;
border-collapse:collapse;
background:white;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

tr:nth-child(even){
background:#eaf3ff;
}

tr:hover{
background:#f0f6ff;
}

a{
color:#6a040f;
font-weight:600;
text-decoration:none;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="hero">
<h2>T20 World Cup Matches</h2>
</div>

<div id="yearBar" class="year-bar"></div>

<div id="summary" class="summary"></div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Venue</th>
<th>Result</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<script>

const BASE="/data/t20-world-cup/matches/";

const VALID_YEARS=[
"2007","2009","2010","2012",
"2014","2016","2021","2022","2024"
];

let seasons=[];
let tbody=document.getElementById("tbody");
let summaryDiv=document.getElementById("summary");

init();

async function init(){

const files=await fetch(BASE+"index.json").then(r=>r.json());

const worldCupFiles=files.filter(file=>{
const year=file.match(/\d{4}/)?.[0];
return VALID_YEARS.includes(year);
});

for(const file of worldCupFiles){

const data=await fetch(BASE+file).then(r=>r.json());

const matches=data.filter(match=>isTournamentMatch(match));

const stats=calculateStats(matches);

seasons.push({
year:file.match(/\d{4}/)[0],
file:file,
matches:matches,
stats:stats
});

}

seasons.sort((a,b)=>b.year-a.year);

buildYearButtons();
showSeason(0);

}

function isTournamentMatch(match){

const event=match.info?.event;

if(!event) return false;

if(!event.group) return false;

const name=(event.name||"").toLowerCase();

if(name.includes("qualifier")) return false;

return true;

}

function calculateStats(matches){

let runs={};
let wickets={};
let winner="";

matches.forEach(match=>{

const group=match.info?.event?.group;

if(group==="Final")
winner=match.info.outcome?.winner||"—";

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

runs[d.batter]=(runs[d.batter]||0)+d.runs.batter;

if(d.wickets){
wickets[d.bowler]=(wickets[d.bowler]||0)+d.wickets.length;
}

});

});

});

});

const mostRuns=Object.entries(runs)
.sort((a,b)=>b[1]-a[1])[0];

const mostWkts=Object.entries(wickets)
.sort((a,b)=>b[1]-a[1])[0];

return{
winner:winner,
runs:mostRuns,
wkts:mostWkts
};

}

function buildYearButtons(){

const bar=document.getElementById("yearBar");

bar.innerHTML="";

seasons.forEach((season,index)=>{

const btn=document.createElement("button");

btn.className="year-btn";
btn.textContent=season.year;

if(index===0)
btn.classList.add("active");

btn.onclick=()=>{

document.querySelectorAll(".year-btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

showSeason(index);

};

bar.appendChild(btn);

});

}

function showSeason(index){

const season=seasons[index];

renderSummary(season.stats);

tbody.innerHTML="";

season.matches.forEach((match,i)=>{

const date=formatDate(match.info.dates[0]);
const teams=match.info.teams.join(" vs ");
const venue=match.info.venue||"—";

let result="—";

if(match.info.outcome?.winner){

if(match.info.outcome.by?.runs)
result=`${match.info.outcome.winner} won by ${match.info.outcome.by.runs} runs`;

else if(match.info.outcome.by?.wickets)
result=`${match.info.outcome.winner} won by ${match.info.outcome.by.wickets} wickets`;

}

const link=`t20wc-match.html?file=${season.file}&match=${i}`;

tbody.innerHTML+=`
<tr>
<td>${date}</td>
<td><a href="${link}">${teams}</a></td>
<td>${venue}</td>
<td>${result}</td>
</tr>
`;

});

}

function renderSummary(stats){

summaryDiv.innerHTML=`

<div class="summary-box">
<div class="big">${stats.winner}</div>
Winner
</div>

<div class="summary-box">
<div class="big">${stats.runs?stats.runs[0]:"—"}</div>
Most Runs (${stats.runs?stats.runs[1]:"—"})
</div>

<div class="summary-box">
<div class="big">${stats.wkts?stats.wkts[0]:"—"}</div>
Most Wickets (${stats.wkts?stats.wkts[1]:"—"})
</div>

`;

}

function formatDate(d){

return new Date(d).toLocaleDateString("en-GB",{
day:"2-digit",
month:"short",
year:"numeric"
});

}

</script>

</body>
</html>
