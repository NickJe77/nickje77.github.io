<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Matches | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family: Inter, system-ui, Arial;
    margin:0;
    background:#f4f6f8;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px;
    border-bottom:1px solid #ddd;
    background:white;
    font-weight:600;
}

.navbar a{
    text-decoration:none;
    color:#0056d6;
}

.page{
    max-width:1000px;
    margin:30px auto;
    padding:20px;
}

.match{
    background:white;
    padding:18px;
    margin-bottom:12px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.match a{
    font-size:18px;
    font-weight:700;
    text-decoration:none;
    color:#003566;
}

.match a:hover{
    color:#0077b6;
}

.meta{
    margin-top:4px;
    color:#555;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<h1>T20 World Cup Matches</h1>

<div id="matches">
Loading matches...
</div>

</div>

<script>

const INDEX_FILE =
    "data/icc_mens_t20_world_cup_male_json/index.json";

const DATA_FOLDER =
    "data/icc_mens_t20_world_cup_male_json/";

async function loadMatches()
{
    const res = await fetch(INDEX_FILE);

    const files = await res.json();

    let html = "";

    for(const file of files)
    {
        const path = DATA_FOLDER + file;

        try
        {
            const res = await fetch(path);

            if(!res.ok)
                continue;

            const match = await res.json();

            const info = match.info;

            html += `
            <div class="match">
                <a href="t20-world-cup-match.html?file=${file}">
                    ${info.teams[0]} vs ${info.teams[1]}
                </a>
                <div class="meta">
                    ${info.venue} — ${info.dates.join(", ")}
                </div>
            </div>
            `;
        }
        catch{}
    }

    document.getElementById("matches").innerHTML = html;
}

loadMatches();

</script>

</body>
</html>
