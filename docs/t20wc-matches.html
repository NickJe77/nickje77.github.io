<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Matches | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:#ffffff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px;
margin:20px;
border-radius:16px;
}

.year-bar{
margin:20px;
}

.year-btn{
background:#6a040f;
color:white;
border:none;
padding:10px 16px;
margin:4px;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.year-btn.active{
background:#d00000;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:16px;
margin:20px;
}

.summary-box{
background:white;
padding:18px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
text-align:center;
}

.summary-box .big{
font-size:22px;
font-weight:700;
color:#6a040f;
margin-top:6px;
}

.flag{
width:26px;
height:18px;
vertical-align:middle;
margin-right:6px;
border-radius:3px;
box-shadow:0 0 2px rgba(0,0,0,.3);
}

table{
width:95%;
margin:20px auto;
border-collapse:collapse;
background:white;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

tr:nth-child(even){
background:#eaf3ff;
}

tr.final{
background:#ffe9b3 !important;
font-weight:700;
}

tr:hover{
background:#f0f6ff;
}

a{
color:#6a040f;
font-weight:600;
text-decoration:none;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="hero">
<h2>T20 World Cup Matches</h2>
</div>

<div id="yearBar" class="year-bar"></div>

<div id="summary" class="summary"></div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Venue</th>
<th>Result</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<script>

const BASE="/data/t20-world-cup/matches/";
const FLAG_BASE="/images/flags/";

const COUNTRY_CODES={
"Afghanistan":"af","Australia":"au","Bangladesh":"bd","Canada":"ca",
"England":"gb","Hong Kong":"hk","India":"in","Ireland":"ie",
"Kenya":"ke","Namibia":"na","Nepal":"np","Netherlands":"nl",
"New Zealand":"nz","Oman":"om","Pakistan":"pk",
"Papua New Guinea":"pg","Scotland":"gb","South Africa":"za",
"Sri Lanka":"lk","United Arab Emirates":"ae",
"USA":"us","United States":"us","United States of America":"us",
"Uganda":"ug","West Indies":"jm","Zimbabwe":"zw"
};

const VALID_YEARS=["2007","2009","2010","2012","2014","2016","2021","2022","2024"];

let seasons=[];
let tbody=document.getElementById("tbody");
let summaryDiv=document.getElementById("summary");

init();

async function init(){

const files=await fetch(BASE+"index.json").then(r=>r.json());

const worldCupFiles=files.filter(file=>{
const year=file.match(/\d{4}/)?.[0];
return VALID_YEARS.includes(year);
});

for(const file of worldCupFiles){

const data=await fetch(BASE+file).then(r=>r.json());

const matches=data.filter(m=>m.info?.event?.group);

const stats=calculateStats(matches);

seasons.push({
year:file.match(/\d{4}/)[0],
file:file,
matches:matches,
stats:stats
});

}

seasons.sort((a,b)=>b.year-a.year);

buildYearButtons();
showSeason(0);

}

function flag(team){

const code=COUNTRY_CODES[team];
if(!code) return "";

return `<img class="flag" src="${FLAG_BASE}${code}.svg">`;

}

function calculateStats(matches){

let runs={},wkts={};
let winner="";

matches.forEach(match=>{

if(match.info.event.group==="Final")
winner=match.info.outcome?.winner;

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

runs[d.batter]=(runs[d.batter]||0)+d.runs.batter;

if(d.wickets)
wkts[d.bowler]=(wkts[d.bowler]||0)+d.wickets.length;

});

});

});

});

const topRuns=Object.entries(runs).sort((a,b)=>b[1]-a[1])[0];
const topWkts=Object.entries(wkts).sort((a,b)=>b[1]-a[1])[0];

return{
winner:winner,
runs:topRuns,
wkts:topWkts
};

}

function buildYearButtons(){

const bar=document.getElementById("yearBar");

seasons.forEach((season,index)=>{

const btn=document.createElement("button");

btn.className="year-btn";
btn.textContent=season.year;

if(index===0) btn.classList.add("active");

btn.onclick=()=>{
document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
showSeason(index);
};

bar.appendChild(btn);

});

}

function showSeason(index){

const season=seasons[index];

renderSummary(season.stats);

tbody.innerHTML="";

season.matches.forEach((match,i)=>{

const isFinal=match.info.event.group==="Final";

const date=formatDate(match.info.dates[0]);

const teams=match.info.teams.map(t=>flag(t)+t).join(" vs ");

const venue=match.info.venue;

let result="—";

if(match.info.outcome?.winner){

if(match.info.outcome.by?.runs)
result=`${match.info.outcome.winner} won by ${match.info.outcome.by.runs} runs`;

else
result=`${match.info.outcome.winner} won by ${match.info.outcome.by.wickets} wickets`;

}

const link=`t20wc-match.html?file=${season.file}&match=${i}`;

tbody.innerHTML+=`
<tr class="${isFinal?'final':''}">
<td>${date}</td>
<td><a href="${link}">${teams}</a></td>
<td>${venue}</td>
<td>${result}</td>
</tr>
`;

});

}

function renderSummary(stats){

summaryDiv.innerHTML=`

<div class="summary-box">
Winner
<div class="big">${flag(stats.winner)}${stats.winner||"—"}</div>
</div>

<div class="summary-box">
Most Runs
<div class="big">
<a href="t20-world-cup-player.html?player=${encodeURIComponent(stats.runs[0])}">
${stats.runs[0]}
</a>
(${stats.runs[1]})
</div>
</div>

<div class="summary-box">
Most Wickets
<div class="big">
<a href="t20-world-cup-player.html?player=${encodeURIComponent(stats.wkts[0])}">
${stats.wkts[0]}
</a>
(${stats.wkts[1]})
</div>
</div>

`;

}

function formatDate(d){

return new Date(d).toLocaleDateString("en-GB",{
day:"2-digit",
month:"short",
year:"numeric"
});

}

</script>

</body>
</html>
