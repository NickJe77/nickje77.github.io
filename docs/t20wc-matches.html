<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Matches | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
             "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
margin:0;
background:#f3f4f7;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:white;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
}

.hero h2{
margin:0;
font-size:36px;
}

.year-bar{
margin:20px;
text-align:center;
}

.year-btn{
background:#6a040f;
color:white;
border:none;
padding:10px 16px;
margin:4px;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.year-btn.active{
background:#d00000;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:16px;
margin:20px;
}

.summary-box{
background:#e7e7ec;
padding:18px;
border-radius:14px;
text-align:center;
}

.summary-box .big{
font-size:26px;
font-weight:700;
}

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

tr:nth-child(even){
background:#eef5ff;
}

tr.final{
background:#ffe9b3 !important;
font-weight:700;
cursor:pointer;
}

tr:hover{
background:#dde8ff;
cursor:pointer;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="t20wc.html">T20 World Cup</a>
<a href="t20wc-team.html">Teams</a>
<a href="t20-world-cup-player.html">Players</a>
</div>

<div class="hero">
<h2>T20 World Cup Matches</h2>
</div>

<div id="yearBar" class="year-bar"></div>
<div id="summary" class="summary"></div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Venue</th>
<th>Result</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>

const BASE="/data/t20-world-cup/matches/";

const VALID_EVENTS=[
"ICC World Twenty20",
"ICC Men's T20 World Cup"
];

let seasons=[];

const tbody=document.getElementById("tbody");
const summary=document.getElementById("summary");
const yearBar=document.getElementById("yearBar");

load();

async function load(){

const index=await fetch(BASE+"index.json").then(r=>r.json());

for(const file of index){

const season=await fetch(BASE+file).then(r=>r.json());

let matches=[];

/* EXACT SAME FILTER AS WORKING TEAM PAGE */

season.forEach((match,i)=>{

const event=match.info?.event?.name || "";

if(!VALID_EVENTS.includes(event)) return;

matches.push(match);

});

if(matches.length===0) continue;

matches.sort((a,b)=>
new Date(a.info.dates[0]) - new Date(b.info.dates[0])
);

const stats=calculateStats(matches);

seasons.push({
year:file.match(/\d{4}/)[0],
file:file,
matches:matches,
stats:stats
});

}

seasons.sort((a,b)=>b.year-a.year);

buildButtons();
showSeason(0);

}

function calculateStats(matches){

let runs={},wkts={};

const finalMatch=matches[matches.length-1];

const winner=finalMatch.info.outcome?.winner || "—";

matches.forEach(match=>{

match.innings?.forEach(inn=>{

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

runs[d.batter]=(runs[d.batter]||0)+(d.runs?.batter||0);

if(d.wickets)
wkts[d.bowler]=(wkts[d.bowler]||0)+d.wickets.length;

});

});

});

});

const topRuns=Object.entries(runs).sort((a,b)=>b[1]-a[1])[0]||["—",0];
const topWkts=Object.entries(wkts).sort((a,b)=>b[1]-a[1])[0]||["—",0];

return{winner,runs:topRuns,wkts:topWkts};

}

function buildButtons(){

yearBar.innerHTML="";

seasons.forEach((season,i)=>{

const btn=document.createElement("button");

btn.className="year-btn"+(i===0?" active":"");

btn.textContent=season.year;

btn.onclick=()=>{
document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
showSeason(i);
};

yearBar.appendChild(btn);

});

}

function showSeason(i){

const season=seasons[i];

summary.innerHTML=`
<div class="summary-box">
Winner<div class="big">${season.stats.winner}</div>
</div>
<div class="summary-box">
Most Runs<div class="big">${season.stats.runs[0]} (${season.stats.runs[1]})</div>
</div>
<div class="summary-box">
Most Wickets<div class="big">${season.stats.wkts[0]} (${season.stats.wkts[1]})</div>
</div>
`;

tbody.innerHTML="";

season.matches.forEach((m,idx)=>{

const isFinal=idx===season.matches.length-1;

let result="—";

if(m.info.outcome?.winner){

const margin=Object.entries(m.info.outcome.by||{})
.map(([k,v])=>`${v} ${k}`)
.join("");

result=`${m.info.outcome.winner} won by ${margin}`;
}

tbody.innerHTML+=`
<tr class="${isFinal?'final':''}"
onclick="location.href='t20-world-cup-match.html?file=${season.file}&match=${idx}'">
<td>${new Date(m.info.dates[0]).toLocaleDateString("en-GB")}</td>
<td>${m.info.teams.join(" vs ")}</td>
<td>${m.info.venue}</td>
<td>${result}</td>
</tr>
`;

});

}

</script>

</body>
</html>
