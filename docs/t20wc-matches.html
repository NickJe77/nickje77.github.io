<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Matches | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family: Inter, system-ui, Arial, sans-serif;
margin:0;
background:#f3f4f7;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:white;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
}

.year-bar{
padding:20px;
text-align:center;
}

.year-btn{
background:#6a040f;
color:white;
border:none;
padding:10px 18px;
margin:4px;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.year-btn.active{
background:#d00000;
}

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

tr:nth-child(even){
background:#eef5ff;
}

tr.final{
background:#ffe9b3 !important;
font-weight:700;
cursor:pointer;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="t20wc.html">T20 World Cup</a>
<a href="t20wc-matches.html">Matches</a>
<a href="t20wc-team.html">Teams</a>
<a href="t20-world-cup-player.html">Players</a>
</div>

<div class="hero">
<h2>T20 World Cup Matches</h2>
</div>

<div id="yearBar" class="year-bar"></div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Venue</th>
<th>Result</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>

const BASE="/data/t20-world-cup/matches/";

let ALL_MATCHES=[];
let SEASONS=[];

const tbody=document.getElementById("tbody");
const yearBar=document.getElementById("yearBar");

load();

async function load(){

const files=await fetch(BASE+"index.json").then(r=>r.json());

for(const file of files){

/* REMOVE 2015 COMPLETELY */

if(file.includes("2015"))
continue;

const season=await fetch(BASE+file).then(r=>r.json());

let matches=[];

if(Array.isArray(season))
matches=season;

else if(Array.isArray(season.matches))
matches=season.matches;

else
continue;


/* KEEP MATCHES UNLESS THEY ARE CLEARLY QUALIFIERS */

matches.forEach((match,i)=>{

const stage=(match.info.stage || "").toLowerCase();

if(
stage.includes("qualifier") ||
stage.includes("warm") ||
stage.includes("practice")
)
return;

/* KEEP MATCH */

match._file=file;
match._index=i;

ALL_MATCHES.push(match);

});

}

/* GROUP BY YEAR */

const years=[...new Set(
ALL_MATCHES.map(m=>m.info.dates[0].substring(0,4))
)];

years.sort((a,b)=>b-a);

years.forEach(year=>{

SEASONS.push({
year,
matches:ALL_MATCHES.filter(
m=>m.info.dates[0].startsWith(year)
)
});

});

buildButtons();

showSeason(0);

}

function buildButtons(){

yearBar.innerHTML="";

SEASONS.forEach((season,index)=>{

const btn=document.createElement("button");

btn.className="year-btn"+(index===0?" active":"");

btn.textContent=season.year;

btn.onclick=()=>{
document.querySelectorAll(".year-btn")
.forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
showSeason(index);
};

yearBar.appendChild(btn);

});

}

function showSeason(index){

const season=SEASONS[index];

tbody.innerHTML="";

season.matches.forEach((match,i)=>{

const isFinal=i===season.matches.length-1;

let result="—";

if(match.info.outcome?.winner){

const margin=
Object.entries(match.info.outcome.by||{})
.map(([k,v])=>`${v} ${k}`)
.join("");

result=`${match.info.outcome.winner} won by ${margin}`;

}

tbody.innerHTML+=`

<tr class="${isFinal?'final':''}"
onclick="location.href='t20-world-cup-match.html?file=${match._file}&match=${match._index}'">

<td>${new Date(match.info.dates[0]).toLocaleDateString("en-GB")}</td>

<td>${match.info.teams.join(" vs ")}</td>

<td>${match.info.venue}</td>

<td>${result}</td>

</tr>

`;

});

}

</script>

</body>
</html>
