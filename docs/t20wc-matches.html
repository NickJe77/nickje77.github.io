<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Matches</title>

<style>

body{
font-family:Inter,system-ui;
margin:0;
background:#fff;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px;
margin:20px;
border-radius:16px;
}

.year-btn{
padding:10px;
margin:5px;
background:#6a040f;
color:white;
border:none;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:10px;
border-bottom:1px solid #ddd;
}

tr:nth-child(even){
background:#eaf3ff;
}

</style>

</head>
<body>

<div class="hero">
<h2>T20 World Cup Matches</h2>
</div>

<div id="years"></div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Match</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>

const BASE="/data/t20-world-cup/matches/";

let seasons=[];

init();

async function init(){

const files=await fetch(BASE+"index.json").then(r=>r.json());

for(const file of files){

const matches=await fetch(BASE+file).then(r=>r.json());

seasons.push({file,matches});

}

buildButtons();

showSeason(0);

}

function buildButtons(){

const div=document.getElementById("years");

seasons.forEach((s,i)=>{

const btn=document.createElement("button");

btn.className="year-btn";

btn.textContent=s.file.match(/\d{4}/)[0];

btn.onclick=()=>showSeason(i);

div.appendChild(btn);

});

}

function showSeason(i){

const season=seasons[i];

tbody.innerHTML="";

season.matches.forEach((m,index)=>{

tbody.innerHTML+=`

<tr>

<td>${m.info.dates[0]}</td>

<td>

<a href="t20wc-match.html?file=${season.file}&match=${index}">
${m.info.teams.join(" vs ")}
</a>

</td>

</tr>

`;

});

}

</script>

</body>
</html>
