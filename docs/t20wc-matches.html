<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Matches | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:#ffffff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px;
margin:20px;
border-radius:16px;
}

.year-bar{
margin:20px;
}

.year-btn{
background:#6a040f;
color:white;
border:none;
padding:10px 16px;
margin:4px;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.year-btn.active{
background:#d00000;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:16px;
margin:20px;
}

.summary-box{
background:white;
padding:18px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
text-align:center;
}

.summary-box .big{
font-size:20px;
font-weight:700;
color:#6a040f;
margin-top:6px;
}

table{
width:95%;
margin:20px auto;
border-collapse:collapse;
background:white;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

tr:nth-child(even){
background:#eaf3ff;
}

tr.final{
background:#ffe9b3 !important;
font-weight:700;
}

a{
color:#6a040f;
font-weight:600;
text-decoration:none;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="hero">
<h2>T20 World Cup Matches</h2>
</div>

<div id="yearBar" class="year-bar"></div>

<div id="summary" class="summary"></div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Venue</th>
<th>Result</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<script>

const BASE="/data/t20-world-cup/matches/";

const TOURNAMENT_DATES={

2007:["2007-09-11","2007-09-24"],
2009:["2009-06-05","2009-06-21"],
2010:["2010-04-30","2010-05-16"],
2012:["2012-09-18","2012-10-07"],
2014:["2014-03-16","2014-04-06"],
2016:["2016-03-08","2016-04-03"],
2021:["2021-10-17","2021-11-14"],
2022:["2022-10-16","2022-11-13"],
2024:["2024-06-01","2024-06-29"]

};

let seasons=[];
let tbody=document.getElementById("tbody");
let summaryDiv=document.getElementById("summary");

init();

async function init(){

const files=await fetch(BASE+"index.json").then(r=>r.json());

for(const file of files){

const year=file.match(/\d{4}/)[0];

const start=new Date(TOURNAMENT_DATES[year][0]);
const end=new Date(TOURNAMENT_DATES[year][1]);

const data=await fetch(BASE+file).then(r=>r.json());

let matches=data.filter(match=>{

const matchDate=new Date(match.info.dates[0]);

return matchDate>=start && matchDate<=end;

});

matches.sort((a,b)=>
new Date(a.info.dates[0]) - new Date(b.info.dates[0])
);

if(matches.length===0) continue;

const stats=calculateStats(matches);

seasons.push({
year,
file,
matches,
stats
});

}

seasons.sort((a,b)=>b.year-a.year);

buildYearButtons();
showSeason(0);

}

function calculateStats(matches){

let runs={},wkts={};

const finalMatch=matches[matches.length-1];

const winner=finalMatch?.info.outcome?.winner || "—";

matches.forEach(match=>{

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

runs[d.batter]=(runs[d.batter]||0)+d.runs.batter;

if(d.wickets)
wkts[d.bowler]=(wkts[d.bowler]||0)+d.wickets.length;

});

});

});

});

const topRuns=Object.entries(runs).sort((a,b)=>b[1]-a[1])[0] || ["—",0];
const topWkts=Object.entries(wkts).sort((a,b)=>b[1]-a[1])[0] || ["—",0];

return{
winner,
runs:topRuns,
wkts:topWkts
};

}

function buildYearButtons(){

const bar=document.getElementById("yearBar");

bar.innerHTML="";

seasons.forEach((season,index)=>{

const btn=document.createElement("button");

btn.className="year-btn";
btn.textContent=season.year;

if(index===0) btn.classList.add("active");

btn.onclick=()=>{
document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
showSeason(index);
};

bar.appendChild(btn);

});

}

function showSeason(index){

const season=seasons[index];

renderSummary(season.stats);

tbody.innerHTML="";

season.matches.forEach((match,i)=>{

const isFinal=i===season.matches.length-1;

const link=`t20wc-match.html?file=${season.file}&match=${i}`;

tbody.innerHTML+=`
<tr class="${isFinal?'final':''}">
<td>${new Date(match.info.dates[0]).toLocaleDateString("en-GB")}</td>
<td><a href="${link}">${match.info.teams.join(" vs ")}</a></td>
<td>${match.info.venue}</td>
<td>${match.info.outcome?.winner || ""}</td>
</tr>
`;

});

}

function renderSummary(stats){

summaryDiv.innerHTML=`

<div class="summary-box">
Winner<div class="big">${stats.winner}</div>
</div>

<div class="summary-box">
Most Runs<div class="big">${stats.runs[0]} – ${stats.runs[1]}</div>
</div>

<div class="summary-box">
Most Wickets<div class="big">${stats.wkts[0]} – ${stats.wkts[1]}</div>
</div>

`;

}

</script>

</body>
</html>
