<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>W.S. Cox Plate Winners | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./css/racing.css">

<style>
body {
    background:#ffffff;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
}

.navbar {
    text-align:center;
    padding:16px 0;
    border-bottom:1px solid #ddd;
}

.navbar a {
    margin:0 18px;
    text-decoration:none;
    font-size:18px;
    font-weight:600;
    color:#0056d6;
}

.navbar a:hover {
    text-decoration:underline;
}

h1 {
    text-align:center;
    margin:30px 0 10px;
}

/* FILTERS */
.filter-bar {
    max-width:900px;
    margin:20px auto 10px;
    display:grid;
    grid-template-columns: 1fr 2fr 2fr 2fr;
    gap:16px;
    padding:0 20px;
}

.filter-bar label {
    font-weight:600;
    font-size:14px;
}

.filter-bar select,
.filter-bar input {
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
    height:42px;
    box-sizing:border-box;
}

/* TABLE */
.table-wrap {
    max-width:900px;
    margin:auto;
    padding:10px 20px 40px;
}

table {
    width:100%;
    border-collapse:collapse;
    font-size:15px;
    border-radius:10px;
    overflow:hidden;
}

th {
    padding:10px;
    background:#f3f8ff;
    border-bottom:1px solid #cfe0f5;
    text-align:left;
    font-weight:700;
}

td {
    padding:9px 10px;
    border-bottom:1px solid #e1ecfa;
}

tr:nth-child(even) {
    background:#f7fbff;
}

tr:hover {
    background:#eaf3ff;
}

/* column sizing */
th:nth-child(1), td:nth-child(1) { width:90px; }
th:nth-child(2), td:nth-child(2) { width:260px; }
th:nth-child(3), td:nth-child(3) { width:200px; }
th:nth-child(4), td:nth-child(4) { width:200px; }
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<h1>W.S. Cox Plate Winners</h1>

<div class="filter-bar">

  <div>
    <label>Year</label>
    <select id="yearFilter">
      <option value="">All</option>
    </select>
  </div>

  <div>
    <label>Winner</label>
    <input type="text" id="winnerFilter" placeholder="Type horse name">
  </div>

  <div>
    <label>Jockey</label>
    <input type="text" id="jockeyFilter" placeholder="Type jockey name">
  </div>

  <div>
    <label>Trainer</label>
    <input type="text" id="trainerFilter" placeholder="Type trainer name">
  </div>

</div>

<div class="table-wrap">
<table id="resultsTable">
<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Jockey</th>
<th>Trainer</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>
let allRows=[];

fetch("./data/vic-g1.json")
.then(res=>res.json())
.then(data=>{
 allRows=data.filter(r=>{
  if(!r.race||!r.finish) return false;
  const f=String(r.finish).toLowerCase().trim();
  return r.race.toLowerCase().includes("cox") && (f==="1"||f==="1st"||f==="01");
 }).sort((a,b)=>b.year-a.year);

 populateYearFilter();
 renderTable(allRows);
});

function populateYearFilter(){
 const years=[...new Set(allRows.map(r=>r.year))].sort((a,b)=>b-a);
 const sel=document.getElementById("yearFilter");
 years.forEach(y=>{
  const o=document.createElement("option");
  o.value=y;
  o.textContent=y;
