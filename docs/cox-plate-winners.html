<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>W.S. Cox Plate Winners | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./css/racing.css">

<style>
body {
    background:#ffffff;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
}

.navbar {
    text-align:center;
    padding:16px 0;
    border-bottom:1px solid #ddd;
}

.navbar a {
    margin:0 18px;
    text-decoration:none;
    font-size:18px;
    font-weight:600;
    color:#0056d6;
}

.navbar a:hover {
    text-decoration:underline;
}

h1 {
    text-align:center;
    margin:30px 0 20px;
}

/* tighter container */
.table-wrap {
    max-width:900px;
    margin:auto;
    padding:10px 20px 40px;
}

table {
    width:100%;
    border-collapse:collapse;
    font-size:15px;
}

/* tighter cells */
th, td {
    padding:8px 10px;
    border-bottom:1px solid #ccc;
    text-align:left;
}

/* tighter header */
th {
    background:#f3f3f3;
    font-weight:700;
}

/* subtle striping */
tr:nth-child(even) {
    background:#fafafa;
}

/* column balance */
th:nth-child(1), td:nth-child(1) { width:90px; }
th:nth-child(2), td:nth-child(2) { width:260px; }
th:nth-child(3), td:nth-child(3) { width:200px; }
th:nth-child(4), td:nth-child(4) { width:200px; }
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<h1>W.S. Cox Plate Winners</h1>

<div class="table-wrap">
<table id="resultsTable">
<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Jockey</th>
<th>Trainer</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>
fetch("./data/vic-g1.json")
.then(res => res.json())
.then(data => {

const table = document.querySelector("#resultsTable tbody");

data
.filter(r=>{
 if(!r.race||!r.finish) return false;
 const f=String(r.finish).toLowerCase().trim();
 return r.race.toLowerCase().includes("cox") && (f==="1"||f==="1st"||f==="01");
})
.sort((a,b)=>b.year-a.year)
.forEach(r=>{
 table.innerHTML+=`
 <tr>
  <td>${r.year}</td>
  <td>${r.horse}</td>
  <td>${r.jockey}</td>
  <td>${r.trainer}</td>
 </tr>`;
});
});
</script>

</body>
</html>
