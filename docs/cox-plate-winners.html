<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>W.S. Cox Plate Winners | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./css/racing.css">

<style>
body {
    background:#0b0b0b;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
}

h1 {
    text-align:center;
    margin:30px 0;
}

.table-wrap {
    max-width:1400px;
    margin:auto;
    padding:20px;
}

table {
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

th, td {
    padding:10px;
    border-bottom:1px solid #333;
    text-align:left;
}

th {
    background:#111;
}

tr:nth-child(even) {
    background:#111;
}

tr:hover {
    background:#1b1b1b;
}
</style>
</head>

<body>

<h1>W.S. Cox Plate Winners</h1>

<div class="table-wrap">
<table id="resultsTable">
<thead>
<tr>
<th>Year</th>
<th>Winner</th>
<th>Jockey</th>
<th>Trainer</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>
fetch("./data/vic-g1.json")
.then(res => res.json())
.then(data => {

    const table = document.querySelector("#resultsTable tbody");

    data
      .filter(r => r.race && r.race.toLowerCase().includes("cox"))
      .sort((a,b) => b.year - a.year)
      .forEach(r => {

        const year = r.year || r.Year || "";
        const winner = r.winner || r.Winner || r.horse || r.Horse || "";
        const jockey = r.jockey || r.Jockey || "";
        const trainer = r.trainer || r.Trainer || "";

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${year}</td>
          <td>${winner}</td>
          <td>${jockey}</td>
          <td>${trainer}</td>
        `;

        table.appendChild(row);
      });

});
</script>

</body>
</html>
