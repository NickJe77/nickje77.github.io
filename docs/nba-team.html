<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --soft:#eef2ff;
  --text:#0b1220;
}
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}
.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}
.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  background-size:400% 400%;
  animation:fadeGradient 10s ease infinite;
  color:#fff;
  padding:34px;
  border-radius:22px;
  margin-bottom:16px;
}
@keyframes fadeGradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
.top-stack{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}
.stats{
  background:var(--card);
  padding:16px 20px;
  border-radius:16px;
  display:flex;
  gap:30px;
  font-size:19px;
  font-weight:600;
  flex-wrap:wrap;
}
.stats strong{font-size:21px;}
.leaders-card{
  background:var(--card);
  padding:16px 18px;
  border-radius:16px;
}
.leaders-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}
.leader-box{
  background:var(--soft);
  padding:10px;
  border-radius:12px;
  border:1px solid #dfe6ff;
}
.leader-label{
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.6px;
}
.leader-player a{
  text-decoration:none;
  color:var(--nba-primary);
  font-weight:800;
}
.leader-player a:hover{text-decoration:underline;}
.leader-total{font-size:13px;font-weight:700;color:#20304f;}
.season-box{
  background:var(--card);
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
select{
  padding:8px 10px;
  border:1px solid #cfd6e3;
  border-radius:10px;
  font-size:14px;
  background:#fff;
}
.card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
}
table{width:100%;border-collapse:collapse;}
th{
  background:var(--nba-primary);
  color:#fff;
  padding:12px;
  font-size:14px;
  text-align:left;
}
td{
  padding:12px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}
tr:hover{background:#eef2ff;cursor:pointer;}
.muted{color:#6b7280;font-size:13px;}
.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  background:#0b1220;
  color:#fff;
  font-size:12px;
  font-weight:800;
}
.debug{
  background:#fff3f3;
  border:1px solid #ffd1d1;
  color:#7a1c1c;
  padding:10px 12px;
  border-radius:12px;
  margin:12px 0;
  display:none;
  white-space:pre-wrap;
  font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size:12px;
}
.loading{
  background:#fff;
  border:1px solid #e5e7eb;
  padding:10px 12px;
  border-radius:12px;
  margin:12px 0;
  display:block;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="teamName" style="margin:0;">Loading…</h1>
    <div class="muted" id="subTitle" style="margin-top:8px;color:rgba(255,255,255,.9);"></div>
  </div>

  <div class="loading" id="loadingBox">Loading team games & leaders…</div>
  <div class="debug" id="debugBox"></div>

  <div class="top-stack">

    <div class="stats">
      <div>Total Games: <strong id="totalGames">0</strong></div>
      <div>Wins: <strong id="wins">0</strong></div>
      <div>Losses: <strong id="losses">0</strong></div>
      <div><span class="badge" id="loadBadge">INIT</span></div>
    </div>

    <div class="leaders-card">
      <h2 style="margin:0 0 10px 0;">All-Time Franchise Leaders</h2>
      <div class="leaders-grid" id="leadersGrid"></div>
      <div class="muted" id="leadersNote" style="margin-top:10px;"></div>
    </div>

  </div>

  <div class="season-box">
    <strong>Select Season:</strong>
    <select id="seasonSelect">
      <option value="all">All Seasons</option>
    </select>
    <span class="muted" id="seasonHint"></span>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th style="width:120px;">Date</th>
          <th style="width:110px;">Season</th>
          <th style="width:140px;">Type</th>
          <th>Opponent</th>
          <th style="width:80px;">Result</th>
          <th style="width:110px;">Score</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const teamRaw = (params.get("team") || "").trim();

const elTeamName = document.getElementById("teamName");
const elSubTitle = document.getElementById("subTitle");
const elDebug = document.getElementById("debugBox");
const elLoading = document.getElementById("loadingBox");
const elBadge = document.getElementById("loadBadge");

const elTotal = document.getElementById("totalGames");
const elWins  = document.getElementById("wins");
const elLoss  = document.getElementById("losses");

const elLeadersGrid = document.getElementById("leadersGrid");
const elLeadersNote = document.getElementById("leadersNote");

const elSeasonSelect = document.getElementById("seasonSelect");
const elSeasonHint = document.getElementById("seasonHint");

const PATH_MASTER = "/data/nba/nba_games_master.json";

function seasonLabel(start){
  const next = String((Number(start)+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}
function normLetters(s){
  return (s || "").toLowerCase().replace(/[^a-z]/g,"").trim();
}
function showDebug(msg){
  elDebug.style.display = "block";
  elDebug.textContent = msg;
}
function setBadge(txt){
  elBadge.textContent = txt;
}
function hideLoading(){
  elLoading.style.display = "none";
}

let allGames = [];
let seasons = new Set();
let leaders = {}; // { player_name: {points,rebounds,assists,steals,blocks,games} }

function addLeaderRow(playerName, stat, total){
  const div = document.createElement("div");
  div.className = "leader-box";
  div.innerHTML = `
    <div class="leader-label">${stat.toUpperCase()}</div>
    <div class="leader-player">
      <a href="nba-player.html?player=${encodeURIComponent(playerName)}">${playerName}</a>
    </div>
    <div class="leader-total">${total.toLocaleString()}</div>
  `;
  elLeadersGrid.appendChild(div);
}

function computeTop(stat){
  let bestName = null;
  let bestVal = -Infinity;
  for(const [name, obj] of Object.entries(leaders)){
    const v = obj[stat] || 0;
    if(v > bestVal){
      bestVal = v;
      bestName = name;
    }
  }
  return { name: bestName, val: (bestVal === -Infinity ? 0 : bestVal) };
}

function renderLeaders(){
  elLeadersGrid.innerHTML = "";

  const categories = ["points","rebounds","assists","steals","blocks"];
  const any = Object.keys(leaders).length;

  if(!any){
    elLeadersNote.textContent = "No leader totals yet (this means player stats weren’t loaded from the per-game files).";
    return;
  }

  elLeadersNote.textContent = "Calculated from per-game player boxscore files.";

  for(const cat of categories){
    const top = computeTop(cat);
    if(top.name) addLeaderRow(top.name, cat, top.val);
  }
}

function renderGames(season){
  const body = document.getElementById("gamesBody");
  body.innerHTML = "";

  const filtered = season === "all" ? allGames : allGames.filter(g => String(g.season) === String(season));
  filtered.sort((a,b)=> (b.date || "").localeCompare(a.date || ""));

  let wins = 0, losses = 0;

  for(const g of filtered){
    if(g.result === "W") wins++; else losses++;

    const tr = document.createElement("tr");
    tr.onclick = () => location.href = `nba-game.html?game=${encodeURIComponent(g.id)}`;
    tr.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${seasonLabel(g.season)}</td>
      <td>${g.type || ""}</td>
      <td>${g.opponent || ""}</td>
      <td>${g.result || ""}</td>
      <td>${g.score || ""}</td>
    `;
    body.appendChild(tr);
  }

  elTotal.textContent = filtered.length;
  elWins.textContent = wins;
  elLoss.textContent = losses;
}

function fillSeasonSelect(){
  elSeasonSelect.innerHTML = "<option value='all'>All Seasons</option>";
  Array.from(seasons).sort((a,b)=>Number(b)-Number(a)).forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = seasonLabel(s);
    elSeasonSelect.appendChild(opt);
  });
  elSeasonHint.textContent = `${seasons.size} seasons found`;
}

async function fetchJson(url){
  const r = await fetch(url, { cache: "no-store" });
  if(!r.ok) throw new Error(`Fetch failed ${r.status} for ${url}`);
  return await r.json();
}

async function loadData(){

  elTeamName.textContent = teamRaw || "Team";
  elSubTitle.textContent = "Loading…";
  setBadge("LOADING");

  try{
    // 1) Load master
    const masterAny = await fetchJson(PATH_MASTER);

    // master could be [] OR {games:[...]} OR {data:[...]}
    const master = Array.isArray(masterAny)
      ? masterAny
      : (Array.isArray(masterAny.games) ? masterAny.games
        : (Array.isArray(masterAny.data) ? masterAny.data : []));

    if(!master.length){
      showDebug(
        `Loaded master JSON but found 0 games in it.\n` +
        `Master shape keys: ${Object.keys(masterAny || {}).join(", ")}`
      );
      setBadge("MASTER=0");
      hideLoading();
      return;
    }

    const teamKey = normLetters(teamRaw);

    // 2) Filter games for this team (robust match)
    const teamGames = [];
    for(const g of master){
      if(!g) continue;

      const home = normLetters(g.home_team);
      const away = normLetters(g.away_team);

      if(!home.includes(teamKey) && !away.includes(teamKey)) continue;

      const season = g.season;
      const gameId = g.game_id;

      if(!season || !gameId) continue;

      const isHome = home.includes(teamKey);
      const teamScore = isHome ? g.home_score : g.away_score;
      const oppScore  = isHome ? g.away_score : g.home_score;

      seasons.add(season);

      teamGames.push({
        id: String(gameId),
        date: g.date || "",
        season: season,
        type: g.game_type || "",
        opponent: isHome ? (g.away_team || "") : (g.home_team || ""),
        result: (Number(teamScore) > Number(oppScore)) ? "W" : "L",
        score: `${teamScore} - ${oppScore}`
      });
    }

    allGames = teamGames;

    if(!allGames.length){
      showDebug(
        `Master loaded (${master.length} games) but 0 matched this team.\n` +
        `Team from URL: "${teamRaw}" -> key="${teamKey}"\n` +
        `Example master row home/away fields might not be full team names.`
      );
      setBadge("MATCH=0");
      hideLoading();
      fillSeasonSelect();
      renderGames("all");
      renderLeaders();
      return;
    }

    // 3) Load per-game files ONLY for matching games to compute leaders
    // NOTE: sequential fetch (safe). This can take time for large teams/seasons.
    let loadedBoxscores = 0;
    let boxscoreFails = 0;

    for(const g of allGames){
      const url = `/data/nba/${g.season}/${g.id}.json`;
      try{
        const gameData = await fetchJson(url);
        loadedBoxscores++;

        const players = Array.isArray(gameData.players) ? gameData.players : [];
        for(const p of players){
          const pTeam = normLetters(p.team);
          if(!pTeam.includes(teamKey)) continue;

          const name = (p.player_name || "").trim();
          if(!name) continue;

          if(!leaders[name]){
            leaders[name] = { points:0, rebounds:0, assists:0, steals:0, blocks:0, games:0 };
          }

          leaders[name].points   += Number(p.points || 0);
          leaders[name].rebounds += Number(p.rebounds || 0);
          leaders[name].assists  += Number(p.assists || 0);
          leaders[name].steals   += Number(p.steals || 0);
          leaders[name].blocks   += Number(p.blocks || 0);
        }
      }catch(e){
        boxscoreFails++;
      }
    }

    elSubTitle.textContent = `Games: ${allGames.length.toLocaleString()} • Boxscores loaded: ${loadedBoxscores.toLocaleString()} • Failed: ${boxscoreFails.toLocaleString()}`;
    setBadge("OK");
    hideLoading();

    fillSeasonSelect();
    renderGames("all");
    renderLeaders();

  }catch(e){
    showDebug(String(e && e.stack ? e.stack : e));
    setBadge("ERROR");
    hideLoading();
  }
}

elSeasonSelect.addEventListener("change", (e)=> {
  renderGames(e.target.value);
});

loadData();
</script>

</body>
</html>
