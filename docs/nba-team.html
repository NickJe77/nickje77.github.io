<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root{
--bg:#f4f6f8;
--card:#ffffff;
--line:#e6e8ee;
}

body{
font-family:Inter,Arial;
margin:0;
background:var(--bg);
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid var(--line);
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#17408B;
}

.page{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

.hero{
padding:34px;
border-radius:22px;
margin-bottom:20px;
color:#fff;
font-weight:700;
}

.hero h1{
margin:0;
font-size:36px;
}

/* LEADERS */

.leaders-card{
background:#fff;
border-radius:16px;
padding:18px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.leaders-table{
width:100%;
border-collapse:collapse;
}

.leaders-table td{
padding:8px 6px;
border-bottom:1px solid #eee;
}

.leaders-table td:nth-child(1){
font-weight:600;
width:120px;
}

.leaders-table td:nth-child(3){
text-align:right;
font-weight:700;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:14px;
margin-bottom:20px;
}

.stat-box{
background:#fff;
border-radius:14px;
padding:16px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.stat-box span{
display:block;
font-size:26px;
font-weight:700;
}

.card{
background:var(--card);
border-radius:16px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#17408B;
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid var(--line);
}

tr:hover{
background:#eef2ff;
cursor:pointer;
}

.loading{
background:#fff;
padding:10px;
border:1px solid #e5e7eb;
border-radius:12px;
margin-bottom:16px;
}

select{
padding:8px 10px;
border:1px solid #cfd6e3;
border-radius:10px;
font-size:14px;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero" id="heroBox">
<h1 id="teamName">Loading…</h1>
</div>

<div class="leaders-card">
<h3>Franchise Leaders</h3>
<table class="leaders-table">
<tbody id="leadersBody"></tbody>
</table>
</div>

<div class="summary" id="summaryBox"></div>

<div class="loading" id="loadingBox">Loading games…</div>

<div class="card">
<table>

<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Type</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>
</div>

</div>

<script>

const teamRaw=new URLSearchParams(window.location.search).get("team")||"";

const PATH_LEADERS="/data/nba/team-leaders.json";
const PATH_SEASONS="/data/nba/seasons.json";

const elTeamName=document.getElementById("teamName");
const elBody=document.getElementById("gamesBody");
const elSummary=document.getElementById("summaryBox");
const elLoading=document.getElementById("loadingBox");

let allGames=[];
let currentSeason=null;

function norm(s){
return (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
}

/* LOAD LEADERS */

async function loadLeaders(){

try{

const leadersData=await fetch(PATH_LEADERS).then(r=>r.json());

const teamKey=norm(teamRaw);

let leaders=null;

for(const team in leadersData){
if(norm(team)===teamKey){
leaders=leadersData[team];
break;
}
}

const body=document.getElementById("leadersBody");

if(!leaders){
body.innerHTML="<tr><td colspan='3'>No leaders found.</td></tr>";
return;
}

const rows=[
["Points","pts"],
["Rebounds","reb"],
["Assists","ast"],
["Steals","stl"],
["Blocks","blk"]
];

for(const r of rows){

const stat=leaders[r[1]];
if(!stat) continue;

body.innerHTML+=`
<tr>
<td>${r[0]}</td>
<td>${stat.player}</td>
<td>${Number(stat.value).toLocaleString()}</td>
</tr>`;

}

}catch(e){

document.getElementById("leadersBody").innerHTML=
"<tr><td colspan='3'>leaders file not found</td></tr>";

}

}

/* REMOVE PRESEASON */

function isPreseason(type){
return (type||"").toLowerCase().includes("pre");
}

/* LOAD SEASON */

async function loadSeason(season){

currentSeason=Number(season);

allGames=[];

const indexRaw=await fetch(`/data/nba/${season}/index.json`).then(r=>r.json());

const games=await Promise.all(
(indexRaw.games||[]).map(id=>
fetch(`/data/nba/${season}/${id}.json`).then(r=>r.json()).catch(()=>null)
)
);

const teamKey=norm(teamRaw);

for(const g of games){

if(!g) continue;
if(isPreseason(g.game_type)) continue;

const home=norm(g.home_team);
const away=norm(g.away_team);

if(!home.includes(teamKey)&&!away.includes(teamKey)) continue;

const isHome=home.includes(teamKey);

const teamScore=isHome?g.home_score:g.away_score;
const oppScore=isHome?g.away_score:g.home_score;

allGames.push({
id:g.game_id,
date:g.date,
typeLabel:g.game_type,
opponent:isHome?g.away_team:g.home_team,
result:Number(teamScore)>Number(oppScore)?"W":"L",
score:`${teamScore} - ${oppScore}`,
teamScore:Number(teamScore),
oppScore:Number(oppScore)
});

}

render();

}

/* RENDER */

function render(){

let wins=0,losses=0,ptsFor=0,ptsAgainst=0;

for(const g of allGames){

if(g.result==="W")wins++; else losses++;

ptsFor+=g.teamScore;
ptsAgainst+=g.oppScore;

}

const games=wins+losses;

elSummary.innerHTML=`
<div class="stat-box"><span>${games}</span>Games</div>
<div class="stat-box"><span>${wins}</span>Wins</div>
<div class="stat-box"><span>${losses}</span>Losses</div>
<div class="stat-box"><span>${games?(wins/games).toFixed(3):"0.000"}</span>Win %</div>
`;

elBody.innerHTML="";

for(const g of allGames){

const tr=document.createElement("tr");

tr.onclick=()=>location.href=`nba-game.html?season=${currentSeason}&game=${g.id}`;

tr.innerHTML=`
<td>${g.date}</td>
<td>${currentSeason}</td>
<td>${g.typeLabel}</td>
<td>${g.opponent}</td>
<td>${g.result}</td>
<td>${g.score}</td>`;

elBody.appendChild(tr);

}

}

/* INIT */

async function init(){

elTeamName.textContent=teamRaw;

await loadLeaders();

const seasons=await fetch(PATH_SEASONS).then(r=>r.json());

seasons.sort((a,b)=>b-a);

if(seasons.length){
loadSeason(seasons[0]);
}

}

init();

</script>

</body>
</html>
