<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  background-size:400% 400%;
  animation:fadeGradient 10s ease infinite;
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:24px;
}

@keyframes fadeGradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.stats{
  display:flex;
  gap:40px;
  margin-bottom:30px;
  font-size:18px;
}

.card{
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--nba-primary);
  color:#fff;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid var(--line);
}

tr:hover{
  background:#eef2ff;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="teamName"></h1>
</div>

<div class="stats">
  <div>Total Games: <strong id="totalGames">0</strong></div>
  <div>Wins: <strong id="wins">0</strong></div>
  <div>Losses: <strong id="losses">0</strong></div>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Season</th>
        <th>Opponent</th>
        <th>Result</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="gamesBody"></tbody>
  </table>
</div>

</div>

<script>
const params=new URLSearchParams(window.location.search);
const team=(params.get("team")||"").trim();
document.getElementById("teamName").textContent=team;

const clean=s=>(s||"").toLowerCase().trim();

function normaliseDate(dateStr){
  if(!dateStr) return null;

  const cleaned=dateStr.trim().split(" ")[0];

  // YYYY-MM-DD
  if(cleaned.includes("-")){
    return cleaned;
  }

  // DD/MM/YYYY
  if(cleaned.includes("/")){
    const parts=cleaned.split("/");
    const day=parts[0].padStart(2,"0");
    const month=parts[1].padStart(2,"0");
    const year=parts[2];
    return `${year}-${month}-${day}`;
  }

  return null;
}

function seasonLabel(start){
  const next=String((start+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}

let allGames=[];

fetch("/data/nba/nba_games_master.json")
.then(r=>r.json())
.then(data=>{

  const t=clean(team);

  for(const game of data){

    const home=clean(game.home_team);
    const away=clean(game.away_team);

    if(home===t||away===t){

      const isoDate=normaliseDate(game.date);
      if(!isoDate) continue;

      const dateObj=new Date(isoDate);
      if(isNaN(dateObj)) continue;

      const month=dateObj.getMonth()+1;

      // Regular season only (exclude May & June)
      if(month>=5 && month<=6) continue;

      const year=dateObj.getFullYear();
      const season = month>=10 ? year : year-1;

      const isHome=home===t;
      const teamScore=Number(isHome?game.home_score:game.away_score)||0;
      const oppScore=Number(isHome?game.away_score:game.home_score)||0;

      allGames.push({
        id:game.game_id,
        displayDate:isoDate,
        season,
        opponent:isHome?game.away_team:game.home_team,
        result:teamScore>oppScore?"W":"L",
        score:`${teamScore} - ${oppScore}`
      });
    }
  }

  render();
});

function render(){

  const gamesBody=document.getElementById("gamesBody");

  allGames.sort((a,b)=>{
    return new Date(b.displayDate)-new Date(a.displayDate);
  });

  let wins=0,losses=0;
  let rows="";

  for(const g of allGames){

    if(g.result==="W")wins++;else losses++;

    rows+=`
      <tr onclick="location.href='nba-game.html?game=${g.id}'">
        <td>${g.displayDate}</td>
        <td>${seasonLabel(g.season)}</td>
        <td>${g.opponent}</td>
        <td>${g.result}</td>
        <td>${g.score}</td>
      </tr>`;
  }

  gamesBody.innerHTML=rows;
  document.getElementById("totalGames").textContent=allGames.length;
  document.getElementById("wins").textContent=wins;
  document.getElementById("losses").textContent=losses;
}
</script>

</body>
</html>
