<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --nba-primary:#17408B;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
}
body{font-family:Inter,Arial;margin:0;background:var(--bg);}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid var(--line);font-weight:700;}
.navbar a{text-decoration:none;color:var(--nba-primary);}
.page{max-width:1200px;margin:auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(270deg,#17408B,#C9082A,#17408B);color:#fff;padding:34px;border-radius:22px;margin-bottom:20px;}
.stats{background:var(--card);padding:16px;border-radius:16px;display:flex;gap:30px;margin-bottom:16px;flex-wrap:wrap;}
.filter-box{background:var(--card);padding:16px;border-radius:16px;margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.card{background:var(--card);border-radius:16px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{background:var(--nba-primary);color:#fff;padding:12px;text-align:left;}
td{padding:12px;border-bottom:1px solid var(--line);}
tr:hover{background:#eef2ff;cursor:pointer;}
.loading{background:#fff;padding:10px;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:16px;}
.notice{
  background:#fff3cd;
  border:1px solid #ffe69c;
  color:#664d03;
  padding:10px 12px;
  border-radius:12px;
  margin-bottom:16px;
  display:none;
  white-space:pre-wrap;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  font-size:12px;
}
select{
  padding:8px 10px;
  border:1px solid #cfd6e3;
  border-radius:10px;
  font-size:14px;
  background:#fff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="teamName" style="margin:0;">Loading…</h1>
    <div id="subTitle" style="margin-top:8px;opacity:.9;"></div>
  </div>

  <div class="loading" id="loadingBox">Loading games…</div>
  <div class="notice" id="noticeBox"></div>

  <div class="stats">
    <div>Total Games: <strong id="totalGames">0</strong></div>
    <div>Wins: <strong id="wins">0</strong></div>
    <div>Losses: <strong id="losses">0</strong></div>
  </div>

  <div class="filter-box">
    <strong>Season:</strong>
    <select id="seasonSelect"></select>

    <strong>Type:</strong>
    <select id="typeSelect">
      <option value="all">All</option>
      <option value="regular">Regular Season</option>
      <option value="playoffs">Playoffs</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th style="width:120px;">Date</th>
          <th style="width:110px;">Season</th>
          <th style="width:140px;">Type</th>
          <th>Opponent</th>
          <th style="width:80px;">Result</th>
          <th style="width:110px;">Score</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const teamRaw = (params.get("team") || "").trim();

const PATH_SEASONS = "/data/nba/seasons.json";

function norm(s){ return (s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function seasonLabel(start){
  const next = String((Number(start)+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}
function typeBucket(t){
  if(!t) return "regular";
  const s = String(t).toLowerCase();
  return s.includes("regular") ? "regular" : "playoffs";
}
function typeLabel(t){
  return typeBucket(t)==="regular" ? "Regular Season" : "Playoffs";
}

const elTeamName = document.getElementById("teamName");
const elSubTitle = document.getElementById("subTitle");
const elLoading  = document.getElementById("loadingBox");
const elNotice   = document.getElementById("noticeBox");

const elTotal = document.getElementById("totalGames");
const elWins  = document.getElementById("wins");
const elLoss  = document.getElementById("losses");

const elSeason = document.getElementById("seasonSelect");
const elType   = document.getElementById("typeSelect");
const elBody   = document.getElementById("gamesBody");

let currentSeason = null;
let allGames = [];
let seasonAvailability = new Map(); // season -> true/false

function showNotice(msg){
  elNotice.style.display = "block";
  elNotice.textContent = msg;
}
function hideNotice(){
  elNotice.style.display = "none";
  elNotice.textContent = "";
}

function normalizeArray(data){
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.games)) return data.games;
  if(data && Array.isArray(data.data)) return data.data;
  if(data && Array.isArray(data.items)) return data.items;
  return [];
}

async function fetchJsonStrict(url){
  // Strict JSON fetch: if server returns HTML or anything non-JSON, treat as failure.
  const r = await fetch(url, { cache: "no-store" });
  if(!r.ok) throw new Error(`Fetch failed ${r.status} for ${url}`);
  const ct = (r.headers.get("content-type") || "").toLowerCase();
  // GitHub Pages 404 often returns text/html
  if(!ct.includes("application/json") && !ct.includes("text/json") && !ct.includes("application/") && !ct.includes("json")){
    // still try to parse, but this helps detect obvious HTML
    const txt = await r.text();
    throw new Error(`Not JSON for ${url} (content-type: ${ct || "unknown"})\nFirst 80 chars: ${txt.slice(0,80)}`);
  }
  return await r.json();
}

function render(){
  let filtered = allGames;

  if(elType.value !== "all"){
    filtered = filtered.filter(g => g.typeBucket === elType.value);
  }

  filtered.sort((a,b)=> (b.date||"").localeCompare(a.date||""));

  elBody.innerHTML = "";
  let w=0,l=0;

  for(const g of filtered){
    if(g.result === "W") w++; else l++;
    const tr = document.createElement("tr");
    tr.onclick = ()=> location.href = `nba-game.html?game=${encodeURIComponent(g.id)}`;
    tr.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${seasonLabel(currentSeason)}</td>
      <td>${g.typeLabel}</td>
      <td>${g.opponent || ""}</td>
      <td>${g.result}</td>
      <td>${g.score}</td>
    `;
    elBody.appendChild(tr);
  }

  elTotal.textContent = filtered.length;
  elWins.textContent  = w;
  elLoss.textContent  = l;

  const seasonTxt = currentSeason ? seasonLabel(currentSeason) : "";
  const typeTxt = (elType.value==="all") ? "All" : (elType.value==="regular" ? "Regular Season" : "Playoffs");
  elSubTitle.textContent = `${seasonTxt} • ${typeTxt} • ${filtered.length.toLocaleString()} games shown`;
}

function setSeasonDropdown(seasons){
  elSeason.innerHTML = "";

  for(const s of seasons){
    const opt = document.createElement("option");
    opt.value = String(s);               // IMPORTANT: numeric season folder name
    opt.textContent = seasonLabel(s);    // display only
    elSeason.appendChild(opt);
  }
}

async function loadSeason(season){
  hideNotice();
  elLoading.style.display = "block";
  elLoading.textContent = `Loading ${seasonLabel(season)}…`;

  currentSeason = Number(season);
  allGames = [];

  try{
    const url = `/data/nba/${season}/index.json`;
    const raw = await fetchJsonStrict(url);
    const seasonData = normalizeArray(raw);

    const teamKey = norm(teamRaw);

    for(const g of seasonData){
      const home = norm(g.home_team);
      const away = norm(g.away_team);
      if(!home.includes(teamKey) && !away.includes(teamKey)) continue;

      const isHome = home.includes(teamKey);
      const teamScore = isHome ? g.home_score : g.away_score;
      const oppScore  = isHome ? g.away_score : g.home_score;

      allGames.push({
        id: g.game_id,
        date: g.date,
        typeBucket: typeBucket(g.game_type),
        typeLabel: typeLabel(g.game_type),
        opponent: isHome ? g.away_team : g.home_team,
        result: Number(teamScore) > Number(oppScore) ? "W" : "L",
        score: `${teamScore} - ${oppScore}`
      });
    }

    seasonAvailability.set(Number(season), true);
    render();
    elLoading.style.display = "none";

  }catch(e){
    seasonAvailability.set(Number(season), false);
    allGames = [];
    render();
    elLoading.style.display = "none";
    showNotice(
      `Could not load /data/nba/${season}/index.json\n` +
      `This usually means that season folder exists but index.json is missing, or the server returned HTML (404).\n\n` +
      `Error:\n${String(e)}`
    );
  }
}

async function pickFirstWorkingSeason(seasonsDesc){
  // Try newest->oldest until we find a season whose index.json is valid JSON.
  for(const s of seasonsDesc){
    try{
      await fetchJsonStrict(`/data/nba/${s}/index.json`);
      return s;
    }catch(_){
      // keep trying
    }
  }
  return seasonsDesc[0] || null;
}

async function init(){
  elTeamName.textContent = teamRaw || "Team";
  hideNotice();

  try{
    const seasonsRaw = await fetchJsonStrict(PATH_SEASONS);
    const seasons = normalizeArray(seasonsRaw).map(Number).filter(Boolean);

    // If you truly have data back to 1978 but it’s not in seasons.json, that’s separate,
    // but this page will work with whatever seasons.json lists.
    seasons.sort((a,b)=>b-a);

    setSeasonDropdown(seasons);

    elSeason.addEventListener("change", ()=> loadSeason(Number(elSeason.value)));
    elType.addEventListener("change", render);

    const first = await pickFirstWorkingSeason(seasons);
    if(first === null){
      showNotice("No seasons found in seasons.json");
      elLoading.style.display="none";
      return;
    }

    elSeason.value = String(first);
    await loadSeason(first);

  }catch(e){
    elLoading.style.display="none";
    showNotice(`Failed to load seasons list.\n${String(e)}`);
  }
}

init();
</script>

</body>
</html>
