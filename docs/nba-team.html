<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --soft:#eef2ff;
  --text:#0b1220;
}
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}
.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}
.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  background-size:400% 400%;
  animation:fadeGradient 10s ease infinite;
  color:#fff;
  padding:34px;
  border-radius:22px;
  margin-bottom:20px;
}
@keyframes fadeGradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
.stats{
  background:var(--card);
  padding:16px 20px;
  border-radius:16px;
  display:flex;
  gap:30px;
  font-size:18px;
  font-weight:600;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.stats strong{font-size:20px;}
.filter-box{
  background:var(--card);
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  align-items:center;
}
select{
  padding:8px 10px;
  border:1px solid #cfd6e3;
  border-radius:10px;
  font-size:14px;
  background:#fff;
}
.card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
}
table{width:100%;border-collapse:collapse;}
th{
  background:var(--nba-primary);
  color:#fff;
  padding:12px;
  font-size:14px;
  text-align:left;
}
td{
  padding:12px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}
tr:hover{background:#eef2ff;cursor:pointer;}
.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  background:#0b1220;
  color:#fff;
  font-size:12px;
  font-weight:800;
}
.loading{
  background:#fff;
  border:1px solid #e5e7eb;
  padding:10px 12px;
  border-radius:12px;
  margin-bottom:16px;
}
.error{
  background:#ffe5e5;
  border:1px solid #ffc1c1;
  color:#8a0000;
  padding:10px 12px;
  border-radius:12px;
  margin-bottom:16px;
  display:none;
  white-space:pre-wrap;
  font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size:12px;
}
.muted{color:rgba(255,255,255,.9);}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="teamName" style="margin:0;">Loading…</h1>
    <div class="muted" id="subTitle" style="margin-top:8px;"></div>
  </div>

  <div class="loading" id="loadingBox">Loading games…</div>
  <div class="error" id="errorBox"></div>

  <div class="stats">
    <div>Total Games: <strong id="totalGames">0</strong></div>
    <div>Wins: <strong id="wins">0</strong></div>
    <div>Losses: <strong id="losses">0</strong></div>
    <div><span class="badge" id="loadBadge">INIT</span></div>
  </div>

  <div class="filter-box">
    <strong>Season:</strong>
    <select id="seasonSelect">
      <option value="all">All Seasons</option>
    </select>

    <strong>Type:</strong>
    <select id="typeSelect">
      <option value="all">All</option>
      <option value="regular">Regular Season</option>
      <option value="playoffs">Playoffs</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th style="width:120px;">Date</th>
          <th style="width:110px;">Season</th>
          <th style="width:140px;">Type</th>
          <th>Opponent</th>
          <th style="width:80px;">Result</th>
          <th style="width:110px;">Score</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const teamRaw = (params.get("team") || "").trim();

const PATH_MASTER = "/data/nba/nba_games_master.json";

// We will TRY these team-map locations (no guessing required; it will pick the first that exists)
const TEAM_MAP_CANDIDATES = [
  "/data/nba/teams/teams.json",
  "/data/nba/teams.json",
  "/data/nba/team_names.json",
  "/data/nba/team-names.json"
];

const elTeamName = document.getElementById("teamName");
const elSubTitle = document.getElementById("subTitle");
const elLoading  = document.getElementById("loadingBox");
const elError    = document.getElementById("errorBox");
const elBadge    = document.getElementById("loadBadge");

const elTotal = document.getElementById("totalGames");
const elWins  = document.getElementById("wins");
const elLoss  = document.getElementById("losses");

const elSeasonSelect = document.getElementById("seasonSelect");
const elTypeSelect   = document.getElementById("typeSelect");
const elBody         = document.getElementById("gamesBody");

function setBadge(t){ elBadge.textContent = t; }
function showError(msg){
  elError.style.display = "block";
  elError.textContent = msg;
}
function clearError(){
  elError.style.display = "none";
  elError.textContent = "";
}
function hideLoading(){ elLoading.style.display = "none"; }

function seasonLabel(start){
  const next = String((Number(start)+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}
function normLetters(s){
  return (s || "").toLowerCase().replace(/[^a-z]/g,"").trim();
}
function typeBucket(gameType){
  const t = (gameType || "").toLowerCase();
  // treat empty as regular
  if(!t) return "regular";
  if(t.includes("regular")) return "regular";
  // anything else counts as playoffs (playoffs, postseason, finals, etc.)
  return "playoffs";
}
function typeLabel(gameType){
  const b = typeBucket(gameType);
  return b === "regular" ? "Regular Season" : "Playoffs";
}

async function fetchJson(url){
  const r = await fetch(url, { cache: "no-store" });
  if(!r.ok) throw new Error(`Fetch failed ${r.status} for ${url}`);
  return await r.json();
}
async function fetchOptionalJson(url){
  try{
    const r = await fetch(url, { cache: "no-store" });
    if(!r.ok) return null;
    return await r.json();
  }catch(_){
    return null;
  }
}

function coerceMaster(any){
  if(Array.isArray(any)) return any;
  if(any && Array.isArray(any.games)) return any.games;
  if(any && Array.isArray(any.data)) return any.data;
  if(any && Array.isArray(any.items)) return any.items;
  return [];
}

/* ---- TEAM NAME LOOKUP (full names) ----
   Works with:
   - array: [{name/full_name/nickname/code/abbrev/...}]
   - object wrappers: {teams:[...]} {data:[...]} etc.
   - map objects: {"Boston Celtics":"Boston Celtics"} or {"BOS":"Boston Celtics"} etc.
*/
function buildTeamLookup(teamsAny){
  const map = new Map();

  if(!teamsAny) return map;

  // if direct map
  if(teamsAny && typeof teamsAny === "object" && !Array.isArray(teamsAny)){
    const maybeArr = (Array.isArray(teamsAny.teams) ? teamsAny.teams :
                      Array.isArray(teamsAny.data) ? teamsAny.data :
                      Array.isArray(teamsAny.items) ? teamsAny.items : null);

    if(!maybeArr){
      // assume key->name map
      for(const [k,v] of Object.entries(teamsAny)){
        if(typeof v === "string"){
          map.set(normLetters(k), v);
        }else if(v && typeof v === "object"){
          const full = v.full_name || v.fullName || v.name || v.team || v.franchise;
          if(full) map.set(normLetters(k), full);
        }
      }
      return map;
    }else{
      teamsAny = maybeArr;
    }
  }

  if(Array.isArray(teamsAny)){
    for(const t of teamsAny){
      if(!t || typeof t !== "object") continue;
      const full = t.full_name || t.fullName || t.name || t.team || t.franchise || t.display_name || t.displayName;
      const nick = t.nickname || t.nick || t.short_name || t.shortName || t.abbrev_name || t.abbrevName;
      const code = t.code || t.abbrev || t.abbreviation || t.id;

      if(full){
        if(nick) map.set(normLetters(nick), full);
        if(code) map.set(normLetters(code), full);
        // also map full->full
        map.set(normLetters(full), full);
        // sometimes master uses "Celtics" etc.
        if(t.masCot || t.mascot) map.set(normLetters(t.mascot), full);
      }
    }
  }

  return map;
}

function fullTeamName(raw, teamLookup){
  const k = normLetters(raw);
  return teamLookup.get(k) || raw || "";
}

/* ---- PAGE DATA ---- */
let teamLookup = new Map();
let allGames = [];
let seasons = new Set();

function fillSeasonSelect(){
  elSeasonSelect.innerHTML = "<option value='all'>All Seasons</option>";
  Array.from(seasons).sort((a,b)=>Number(b)-Number(a)).forEach(s=>{
    const opt = document.createElement("option");
    opt.value = String(s);
    opt.textContent = seasonLabel(s);
    elSeasonSelect.appendChild(opt);
  });
}

function render(){
  const seasonFilter = elSeasonSelect.value;   // "all" or "2023"
  const typeFilter   = elTypeSelect.value;     // "all" | "regular" | "playoffs"

  let filtered = allGames;

  if(seasonFilter !== "all"){
    filtered = filtered.filter(g => String(g.seasonStart) === String(seasonFilter));
  }
  if(typeFilter !== "all"){
    filtered = filtered.filter(g => g.typeBucket === typeFilter);
  }

  // newest first
  filtered.sort((a,b)=> (b.date || "").localeCompare(a.date || ""));

  elBody.innerHTML = "";

  let w=0, l=0;

  for(const g of filtered){
    if(g.result === "W") w++; else l++;

    const tr = document.createElement("tr");
    tr.onclick = () => location.href = `nba-game.html?game=${encodeURIComponent(g.id)}`;
    tr.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${g.seasonLabel || ""}</td>
      <td>${g.typeLabel || ""}</td>
      <td>${g.opponentFull || g.opponentRaw || ""}</td>
      <td>${g.result || ""}</td>
      <td>${g.score || ""}</td>
    `;
    elBody.appendChild(tr);
  }

  elTotal.textContent = filtered.length;
  elWins.textContent  = w;
  elLoss.textContent  = l;

  // Subtitle: show what filters are applied
  const seasonText = (seasonFilter === "all") ? "All Seasons" : seasonLabel(seasonFilter);
  const typeText   = (typeFilter === "all") ? "All" : (typeFilter === "regular" ? "Regular Season" : "Playoffs");
  elSubTitle.textContent = `${seasonText} • ${typeText} • ${filtered.length.toLocaleString()} games shown`;
}

async function load(){
  clearError();
  elTeamName.textContent = teamRaw || "Team";
  elSubTitle.textContent = "Loading…";
  setBadge("LOADING");

  try{
    // 1) Load master
    const masterAny = await fetchJson(PATH_MASTER);
    const master = coerceMaster(masterAny);

    if(!master.length){
      showError(
        `Loaded master JSON but found 0 games.\n` +
        `Keys: ${Object.keys(masterAny || {}).join(", ")}`
      );
      setBadge("MASTER=0");
      hideLoading();
      return;
    }

    // 2) Try load a team map (first one that exists)
    for(const p of TEAM_MAP_CANDIDATES){
      const j = await fetchOptionalJson(p);
      if(j){
        teamLookup = buildTeamLookup(j);
        break;
      }
    }

    const teamKey = normLetters(teamRaw);

    allGames = [];
    seasons = new Set();

    for(const g of master){
      if(!g) continue;

      const homeRaw = g.home_team || "";
      const awayRaw = g.away_team || "";

      const homeKey = normLetters(homeRaw);
      const awayKey = normLetters(awayRaw);

      if(!homeKey.includes(teamKey) && !awayKey.includes(teamKey)) continue;

      const seasonStart = g.season;
      const gameId = g.game_id;

      if(!seasonStart || !gameId) continue;

      const isHome = homeKey.includes(teamKey);

      const teamScore = isHome ? g.home_score : g.away_score;
      const oppScore  = isHome ? g.away_score : g.home_score;

      const opponentRaw = isHome ? awayRaw : homeRaw;
      const opponentFull = fullTeamName(opponentRaw, teamLookup);

      seasons.add(seasonStart);

      const tb = typeBucket(g.game_type);

      allGames.push({
        id: String(gameId),
        date: g.date || "",
        seasonStart: seasonStart,
        seasonLabel: seasonLabel(seasonStart),
        typeRaw: g.game_type || "",
        typeBucket: tb,
        typeLabel: typeLabel(g.game_type),
        opponentRaw,
        opponentFull,
        result: (Number(teamScore) > Number(oppScore)) ? "W" : "L",
        score: `${teamScore} - ${oppScore}`
      });
    }

    if(!allGames.length){
      showError(
        `Master loaded (${master.length} games) but 0 matched this team.\n` +
        `Team from URL: "${teamRaw}" -> key="${teamKey}"\n` +
        `This usually means master uses a different team field (code vs name).`
      );
      setBadge("MATCH=0");
      hideLoading();
      fillSeasonSelect();
      render();
      return;
    }

    // If we have a map, upgrade the page title to full team name too (when possible)
    const teamFull = fullTeamName(teamRaw, teamLookup);
    elTeamName.textContent = teamFull || teamRaw;

    fillSeasonSelect();
    render();

    setBadge("OK");
    hideLoading();

  }catch(e){
    showError(String(e && e.stack ? e.stack : e));
    setBadge("ERROR");
    hideLoading();
  }
}

elSeasonSelect.addEventListener("change", render);
elTypeSelect.addEventListener("change", render);

load();
</script>

</body>
</html>
