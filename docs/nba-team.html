<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

h1{
  text-align:center;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:20px;
}

select{
  padding:8px 12px;
  font-size:16px;
  border-radius:6px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:15px;
  margin:25px 0;
}

.card{
  background:#e9edf3;
  padding:18px;
  border-radius:10px;
  text-align:center;
}

.card h2{
  margin:0;
  font-size:22px;
}

.card span{
  font-size:14px;
  color:#555;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  margin-top:15px;
}

th{
  background:#ddd;
  padding:10px;
  text-align:left;
}

td{
  padding:10px;
  border-bottom:1px solid #eee;
}

.section-title{
  margin-top:40px;
  font-size:22px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
  <a href="/nba-seasons.html">Seasons</a>
</div>

<div class="page">

<h1 id="teamName"></h1>
<div class="subtitle">Franchise History</div>

<div style="text-align:center;margin-bottom:20px;">
  Season:
  <select id="seasonFilter">
    <option value="all">All Seasons</option>
  </select>
</div>

<div class="summary-grid">
  <div class="card"><h2 id="seasonCount">0</h2><span>Seasons</span></div>
  <div class="card"><h2 id="gameCount">0</h2><span>Games</span></div>
  <div class="card"><h2 id="winCount">0</h2><span>Wins</span></div>
  <div class="card"><h2 id="lossCount">0</h2><span>Losses</span></div>
  <div class="card"><h2 id="pfTotal">0</h2><span>Points For</span></div>
  <div class="card"><h2 id="paTotal">0</h2><span>Points Against</span></div>
</div>

<div class="section-title">Season Summary</div>
<table>
  <thead>
    <tr>
      <th>Season</th>
      <th>Games</th>
      <th>Wins</th>
      <th>Losses</th>
      <th>PF</th>
      <th>PA</th>
    </tr>
  </thead>
  <tbody id="seasonSummaryBody"></tbody>
</table>

<div class="section-title">Recent Games</div>
<table>
  <thead>
    <tr>
      <th>Season</th>
      <th>Date</th>
      <th>Opponent</th>
      <th>Result</th>
      <th>Score</th>
    </tr>
  </thead>
  <tbody id="gamesBody"></tbody>
</table>

</div>

<script>

const MASTER_URL = "data/nba/nba_games_master.json";

const params = new URLSearchParams(window.location.search);
const team = decodeURIComponent(params.get("team") || "");
document.getElementById("teamName").textContent = team;

async function loadTeam(){

  const res = await fetch(MASTER_URL);
  const games = await res.json();

  // REMOVE EMPTY / NULL ROWS
  const cleanGames = games.filter(g =>
    g.home_team && g.away_team &&
    g.home_score != null &&
    g.away_score != null &&
    g.season != null
  );

  // FILTER TEAM GAMES
  const teamGames = cleanGames.filter(g =>
    g.home_team === team || g.away_team === team
  );

  if(teamGames.length === 0){
    alert("No games found for this team.");
    return;
  }

  const seasons = [...new Set(teamGames.map(g => g.season))].sort((a,b)=>b-a);

  const seasonFilter = document.getElementById("seasonFilter");
  seasons.forEach(season=>{
    const opt = document.createElement("option");
    opt.value = season;
    opt.textContent = season;
    seasonFilter.appendChild(opt);
  });

  function render(selectedSeason){

    let filtered = selectedSeason==="all"
      ? teamGames
      : teamGames.filter(g=>g.season==selectedSeason);

    let wins=0, losses=0, pf=0, pa=0;

    filtered.forEach(g=>{
      const isHome = g.home_team===team;
      const teamScore = isHome ? g.home_score : g.away_score;
      const oppScore = isHome ? g.away_score : g.home_score;
      pf+=teamScore;
      pa+=oppScore;
      if(teamScore>oppScore) wins++;
      else losses++;
    });

    document.getElementById("seasonCount").textContent =
      selectedSeason==="all" ? seasons.length : 1;

    document.getElementById("gameCount").textContent = filtered.length;
    document.getElementById("winCount").textContent = wins;
    document.getElementById("lossCount").textContent = losses;
    document.getElementById("pfTotal").textContent = pf;
    document.getElementById("paTotal").textContent = pa;

    const seasonBody = document.getElementById("seasonSummaryBody");
    seasonBody.innerHTML="";

    const grouped = {};
    filtered.forEach(g=>{
      if(!grouped[g.season]) grouped[g.season]=[];
      grouped[g.season].push(g);
    });

    Object.keys(grouped).sort((a,b)=>b-a).forEach(season=>{
      const games = grouped[season];
      let w=0,l=0,pf=0,pa=0;

      games.forEach(g=>{
        const isHome = g.home_team===team;
        const teamScore = isHome ? g.home_score : g.away_score;
        const oppScore = isHome ? g.away_score : g.home_score;
        pf+=teamScore;
        pa+=oppScore;
        if(teamScore>oppScore) w++; else l++;
      });

      seasonBody.innerHTML+=`
        <tr>
          <td>${season}</td>
          <td>${games.length}</td>
          <td>${w}</td>
          <td>${l}</td>
          <td>${pf}</td>
          <td>${pa}</td>
        </tr>
      `;
    });

    const gamesBody=document.getElementById("gamesBody");
    gamesBody.innerHTML="";

    filtered
      .sort((a,b)=> new Date(b.date)-new Date(a.date))
      .slice(0,50)
      .forEach(g=>{
        const isHome = g.home_team===team;
        const opponent = isHome ? g.away_team : g.home_team;
        const teamScore = isHome ? g.home_score : g.away_score;
        const oppScore = isHome ? g.away_score : g.home_score;
        const result = teamScore>oppScore ? "W" : "L";

        gamesBody.innerHTML+=`
          <tr>
            <td>${g.season}</td>
            <td>${g.date}</td>
            <td>${opponent}</td>
            <td>${result}</td>
            <td>${teamScore} – ${oppScore}</td>
          </tr>
        `;
      });
  }

  render("all");

  seasonFilter.addEventListener("change",()=>{
    render(seasonFilter.value);
  });

}

loadTeam();

</script>

</body>
</html>
