<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NBA Team Debug</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;margin:40px;}
</style>
</head>
<body>

<h1>NBA Full Load Test</h1>
<div id="output">Loading...</div>

<script>

const BASE="data/nba/";

async function fetchJSON(url){
try{
const r=await fetch(url,{cache:"no-store"});
if(!r.ok)return null;
return await r.json();
}catch{return null;}
}

async function run(){

let totalGames=0;

const seasons=await fetchJSON(BASE+"seasons.json");
if(!seasons){
document.getElementById("output").textContent="Failed to load seasons.json";
return;
}

for(const season of seasons){

const index=await fetchJSON(BASE+season+"/index.json");
if(!index||!index.games)continue;

for(const id of index.games){

const g=await fetchJSON(BASE+season+"/"+id+".json");
if(!g)continue;
if(g.game_type==="Preseason"||g.game_type==="All-Star")continue;

totalGames++;

}

}

document.getElementById("output").textContent=
"Total games loaded (all teams): "+totalGames;

}

run();

</script>

</body>
</html>
