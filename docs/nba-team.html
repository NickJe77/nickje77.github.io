<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;color:#111;}
  .navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
  .navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
  .page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}
  h1{text-align:center;margin:0 0 6px;}
  .subtitle{text-align:center;color:#666;margin:0 0 18px;}
  .status{text-align:center;color:#666;margin:8px 0 18px;font-size:14px;}
  .status.err{color:#b00020;font-weight:700;}
  .status.ok{color:#1b5e20;font-weight:700;}
  .filters{text-align:center;margin:10px 0 18px;}
  .filters label{font-weight:600;margin-right:8px;}
  select{padding:8px 14px;font-size:15px;border:1px solid #ccc;border-radius:10px;}
  .stats{display:flex;gap:18px;justify-content:center;margin:16px 0 22px;flex-wrap:wrap;}
  .stat{background:#f4f6fb;padding:12px 18px;border-radius:14px;text-align:center;min-width:140px;}
  .stat b{display:block;font-size:20px;margin-bottom:2px;}
  h2{margin:28px 0 10px;}
  table{width:100%;border-collapse:collapse;margin-bottom:26px;border-radius:14px;overflow:hidden;}
  th,td{border-bottom:1px solid #e2e2e2;padding:10px 10px;text-align:center;}
  th{background:#f0f0f0;font-weight:800;}
  tr:nth-child(even){background:#f6f9ff;}
  tr:hover{background:#e9f0ff;}
  td.left{text-align:left;}
  .smallnote{color:#666;font-size:13px;margin-top:-12px;margin-bottom:10px;}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;}
  .pill.w{background:#e8f5e9;color:#1b5e20;}
  .pill.l{background:#ffebee;color:#b71c1c;}
  .pill.ot{background:#fff8e1;color:#8a6d00;}
  .link{color:#0056d6;text-decoration:none;}
  .link:hover{text-decoration:underline;}
</style>
</head>

<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">
  <h1 id="teamName">NBA Team</h1>
  <div class="subtitle">Franchise History (Regular Season + Playoffs)</div>

  <div class="filters">
    <label for="seasonFilter">Season:</label>
    <select id="seasonFilter">
      <option value="">All Seasons</option>
    </select>
  </div>

  <div id="status" class="status">Loading…</div>

  <div class="stats">
    <div class="stat"><b id="seasons">0</b>Seasons</div>
    <div class="stat"><b id="games">0</b>Games</div>
    <div class="stat"><b id="wins">0</b>Wins</div>
    <div class="stat"><b id="losses">0</b>Losses</div>
    <div class="stat"><b id="pf">0</b>Points For</div>
    <div class="stat"><b id="pa">0</b>Points Against</div>
  </div>

  <h2>Season Summary</h2>
  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>Games</th>
        <th>Wins</th>
        <th>Losses</th>
        <th>PF</th>
        <th>PA</th>
      </tr>
    </thead>
    <tbody id="seasonTable"></tbody>
  </table>

  <h2>Games</h2>
  <div class="smallnote" id="gamesNote"></div>
  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>Date</th>
        <th>Opponent</th>
        <th>Result</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="gamesTable"></tbody>
  </table>
</div>

<script>
/**
 * PUT YOUR MASTER JSON HERE (single file)
 * Example: data/nba/nba_games_master.json
 */
const MASTER_URL = "data/nba/nba_games_master.json";

const params = new URLSearchParams(location.search);
const teamRaw = params.get("team") || "";
const team = decodeURIComponent(teamRaw || "").trim();

const $ = (id) => document.getElementById(id);
const statusEl = $("status");
const seasonFilter = $("seasonFilter");

$("teamName").textContent = team ? team : "Team not specified";

function setStatus(msg, kind){
  statusEl.textContent = msg;
  statusEl.className = "status" + (kind ? (" " + kind) : "");
}

function normName(s){
  return String(s || "").replace(/\s+/g, " ").trim().toLowerCase();
}

/**
 * Infer season from game_id when season is missing/null.
 * Your ids look like:
 *  - 24700017 => 1947 (2 + 47)
 *  - 27600004 => 1976 (2 + 76)
 *  - 12500007 => 2025 (1 + 25)
 * Rule: year = game_id[1:3] (YY). If YY >= 46 => 1900+YY else 2000+YY
 */
function inferSeasonFromGameId(gameId){
  const s = String(gameId || "");
  if(s.length < 3) return null;
  const yyStr = s.slice(1,3);
  const yy = parseInt(yyStr, 10);
  if(!Number.isFinite(yy)) return null;
  return (yy >= 46) ? (1900 + yy) : (2000 + yy);
}

function safeNum(x){
  const n = Number(x);
  return Number.isFinite(n) ? n : 0;
}

function parseDateForSort(d){
  // Supports YYYY-MM-DD and M/D/YYYY-ish. If garbage, return 0.
  const s = String(d || "").trim();
  if(!s) return 0;
  // ISO
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    const t = Date.parse(s);
    return Number.isFinite(t) ? t : 0;
  }
  // M/D/YYYY
  const parts = s.split("/");
  if(parts.length === 3){
    const m = parseInt(parts[0],10);
    const day = parseInt(parts[1],10);
    const y = parseInt(parts[2],10);
    if(Number.isFinite(m) && Number.isFinite(day) && Number.isFinite(y)){
      const t = Date.parse(`${y}-${String(m).padStart(2,"0")}-${String(day).padStart(2,"0")}`);
      return Number.isFinite(t) ? t : 0;
    }
  }
  const t = Date.parse(s);
  return Number.isFinite(t) ? t : 0;
}

let allGames = [];           // filtered to this team, normalized + derived fields
let seasonAgg = {};          // season -> stats
let seasonList = [];         // seasons available (desc)

function buildSeasonAgg(){
  seasonAgg = {};
  const seasonsSet = new Set();

  for(const g of allGames){
    const s = g.season;
    if(!Number.isFinite(s)) continue;
    seasonsSet.add(s);

    if(!seasonAgg[s]) seasonAgg[s] = { games:0, wins:0, losses:0, pf:0, pa:0 };
    const a = seasonAgg[s];
    a.games++;
    a.pf += g.teamScore;
    a.pa += g.oppScore;
    if(g.result === "W") a.wins++;
    else if(g.result === "L") a.losses++;
  }

  seasonList = Array.from(seasonsSet).sort((a,b)=>b-a);

  // Populate filter fresh
  seasonFilter.innerHTML = `<option value="">All Seasons</option>`;
  for(const s of seasonList){
    const opt = document.createElement("option");
    opt.value = String(s);
    opt.textContent = String(s);
    seasonFilter.appendChild(opt);
  }
}

function render(){
  const seasonVal = seasonFilter.value ? parseInt(seasonFilter.value, 10) : null;

  // Totals
  let totalGames=0, wins=0, losses=0, pf=0, pa=0;
  for(const [sStr, v] of Object.entries(seasonAgg)){
    const s = parseInt(sStr, 10);
    if(seasonVal && s !== seasonVal) continue;
    totalGames += v.games;
    wins += v.wins;
    losses += v.losses;
    pf += v.pf;
    pa += v.pa;
  }

  $("seasons").textContent = seasonVal ? 1 : seasonList.length;
  $("games").textContent = totalGames;
  $("wins").textContent = wins;
  $("losses").textContent = losses;
  $("pf").textContent = pf;
  $("pa").textContent = pa;

  // Season table
  const seasonBody = $("seasonTable");
  seasonBody.innerHTML = "";
  const seasonsToShow = seasonVal ? [seasonVal] : seasonList;

  for(const s of seasonsToShow){
    const v = seasonAgg[s];
    if(!v) continue;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s}</td>
      <td>${v.games}</td>
      <td>${v.wins}</td>
      <td>${v.losses}</td>
      <td>${v.pf}</td>
      <td>${v.pa}</td>
    `;
    seasonBody.appendChild(tr);
  }

  // Games table (limit for performance)
  const gamesBody = $("gamesTable");
  gamesBody.innerHTML = "";

  let filtered = allGames
    .filter(g => !seasonVal || g.season === seasonVal)
    .sort((a,b)=>parseDateForSort(b.date) - parseDateForSort(a.date));

  const LIMIT = 500; // keep browser fast
  const totalFiltered = filtered.length;
  if(totalFiltered > LIMIT) filtered = filtered.slice(0, LIMIT);

  $("gamesNote").textContent =
    totalFiltered > LIMIT
      ? `Showing latest ${LIMIT.toLocaleString()} of ${totalFiltered.toLocaleString()} games for speed. Use Season filter to narrow.`
      : (totalFiltered ? "" : "No games found.");

  for(const g of filtered){
    const opp = g.opponent || "";
    const pill = g.result === "W" ? `<span class="pill w">W</span>` : (g.result === "L" ? `<span class="pill l">L</span>` : `<span class="pill ot">${g.result}</span>`);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${Number.isFinite(g.season) ? g.season : ""}</td>
      <td>${g.date || ""}</td>
      <td class="left">${opp}</td>
      <td>${pill}</td>
      <td>${g.scoreText}</td>
    `;
    gamesBody.appendChild(tr);
  }

  // If we somehow have games but no seasons in agg (shouldn't happen), show it clearly
  if(allGames.length && seasonList.length === 0){
    setStatus(`Loaded ${allGames.length.toLocaleString()} games, but couldn’t derive seasons. Check game_id format.`, "err");
  } else {
    setStatus(`Loaded ${allGames.length.toLocaleString()} games for ${team}.`, "ok");
  }
}

async function load(){
  if(!team){
    setStatus("No team specified in URL (?team=...)", "err");
    return;
  }

  setStatus("Loading master games file…");

  let data;
  try{
    const res = await fetch(MASTER_URL, { cache: "no-store" });
    if(!res.ok){
      setStatus(`Could not load master JSON: ${MASTER_URL} (HTTP ${res.status})`, "err");
      return;
    }
    data = await res.json();
  }catch(e){
    setStatus(`Could not load master JSON (fetch failed). Path: ${MASTER_URL}`, "err");
    return;
  }

  if(!Array.isArray(data)){
    setStatus("Master JSON is not an array of games.", "err");
    return;
  }

  const tNorm = normName(team);
  const out = [];

  for(const raw of data){
    const home = raw.home_team ?? raw.homeTeam ?? raw.HOME_TEAM ?? "";
    const away = raw.away_team ?? raw.awayTeam ?? raw.AWAY_TEAM ?? "";

    const homeNorm = normName(home);
    const awayNorm = normName(away);

    if(homeNorm !== tNorm && awayNorm !== tNorm) continue;

    // Skip stuff you don’t want
    const gt = String(raw.game_type ?? raw.gameType ?? "").toLowerCase();
    if(gt.includes("preseason")) continue;
    if(gt.includes("all-star") || gt.includes("all star")) continue;

    const isHome = homeNorm === tNorm;

    const hs = raw.home_score ?? raw.homeScore;
    const as = raw.away_score ?? raw.awayScore;

    const homeScore = (hs === null || hs === undefined) ? null : Number(hs);
    const awayScore = (as === null || as === undefined) ? null : Number(as);

    const teamScore = isHome ? homeScore : awayScore;
    const oppScore  = isHome ? awayScore : homeScore;

    // derive season if missing
    let season = raw.season;
    season = (season === null || season === undefined || season === "" || season === "null") ? null : Number(season);
    if(!Number.isFinite(season)){
      season = inferSeasonFromGameId(raw.game_id ?? raw.gameId ?? "");
    }
    if(!Number.isFinite(season)) season = null;

    const opponent = isHome ? away : home;

    let result = "";
    if(Number.isFinite(teamScore) && Number.isFinite(oppScore)){
      result = teamScore > oppScore ? "W" : "L";
    }

    const date = raw.date ?? raw.gameDate ?? raw.gameDateTimeEst ?? "";

    out.push({
      game_id: String(raw.game_id ?? raw.gameId ?? ""),
      season,
      date: String(date || ""),
      opponent: String(opponent || ""),
      result,
      teamScore: Number.isFinite(teamScore) ? teamScore : 0,
      oppScore: Number.isFinite(oppScore) ? oppScore : 0,
      scoreText: (Number.isFinite(teamScore) && Number.isFinite(oppScore))
        ? `${teamScore} – ${oppScore}`
        : ""
    });
  }

  allGames = out;

  if(allGames.length === 0){
    setStatus(`Loaded master file (${data.length.toLocaleString()} records) but found 0 matches for "${team}".`, "err");
    $("seasonTable").innerHTML = "";
    $("gamesTable").innerHTML = "";
    return;
  }

  buildSeasonAgg();
  render();
}

seasonFilter.addEventListener("change", render);
load();
</script>

</body>
</html>
