<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  background-size:400% 400%;
  animation:fadeGradient 10s ease infinite;
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:24px;
}

@keyframes fadeGradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.stats{
  display:flex;
  gap:40px;
  margin-bottom:30px;
  font-size:18px;
}

.section-title{
  font-size:22px;
  font-weight:700;
  margin:30px 0 15px 0;
}

.card{
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--nba-primary);
  color:#fff;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid var(--line);
}

tr:hover{
  background:#eef2ff;
  cursor:pointer;
}

.season-box{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  margin-bottom:30px;
}

.season-box select{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  font-size:16px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="teamName"></h1>
</div>

<div class="stats">
  <div>Total Games: <strong id="totalGames">0</strong></div>
  <div>Wins: <strong id="wins">0</strong></div>
  <div>Losses: <strong id="losses">0</strong></div>
</div>

<div class="season-box">
  <strong>Select Season:</strong>
  <select id="seasonSelect">
    <option value="all">All Seasons</option>
  </select>
</div>

<div class="section-title">Regular Season Games</div>
<div class="card">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Season</th>
        <th>Opponent</th>
        <th>Result</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="gamesBody"></tbody>
  </table>
</div>

</div>

<script>
const params=new URLSearchParams(window.location.search);
const team=(params.get("team")||"").trim();
document.getElementById("teamName").textContent=team;

const clean=s=>(s||"").toLowerCase().trim();

function safeSeason(dateStr){
  if(!dateStr)return null;
  const cleaned=dateStr.trim().split(" ")[0];
  const parts=cleaned.split("/");
  if(parts.length<3)return null;
  const month=parseInt(parts[1]);
  const year=parseInt(parts[2]);
  if(isNaN(month)||isNaN(year))return null;
  return month>=10?year:year-1;
}

function seasonLabel(start){
  const next=String((start+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}

function isRegular(home,away){
  if(!home||!away)return false;
  if(home.includes("nan")||away.includes("nan"))return false;
  if(home.includes("all")||away.includes("all"))return false;
  return true;
}

let allGames=[];
let seasons=new Set();

fetch("/data/nba/nba_games_master.json")
.then(r=>r.json())
.then(data=>{

  const t=clean(team);

  for(const game of data){

    const home=clean(game.home_team);
    const away=clean(game.away_team);

    if(!isRegular(home,away))continue;

    if(home===t||away===t){

      const season=safeSeason(game.date);
      if(!season)continue;

      seasons.add(season);

      const isHome=home===t;
      const teamScore=Number(isHome?game.home_score:game.away_score)||0;
      const oppScore=Number(isHome?game.away_score:game.home_score)||0;

      allGames.push({
        id:game.game_id,
        date:(game.date||"").trim(),
        season,
        opponent:isHome?game.away_team:game.home_team,
        result:teamScore>oppScore?"W":"L",
        score:`${teamScore} - ${oppScore}`
      });
    }
  }

  buildSelector();
  render("all");
});

function buildSelector(){
  const select=document.getElementById("seasonSelect");
  Array.from(seasons)
    .sort((a,b)=>b-a)
    .forEach(s=>{
      const opt=document.createElement("option");
      opt.value=s;
      opt.textContent=seasonLabel(s);
      select.appendChild(opt);
    });

  select.addEventListener("change",e=>{
    render(e.target.value);
  });
}

function render(season){

  const gamesBody=document.getElementById("gamesBody");
  gamesBody.innerHTML="";

  const filtered=season==="all"
    ?allGames
    :allGames.filter(g=>g.season==season);

  document.getElementById("totalGames").textContent=filtered.length;

  let wins=0,losses=0;

  filtered.sort((a,b)=>{
    const da=a.date.split(" ")[0].split("/").reverse().join("-");
    const db=b.date.split(" ")[0].split("/").reverse().join("-");
    return new Date(db)-new Date(da);
  });

  let rows="";

  for(const g of filtered){

    if(g.result==="W")wins++;else losses++;

    const displayDate=g.date.split(" ")[0];

    rows+=`
      <tr onclick="location.href='nba-game.html?game=${g.id}'">
        <td>${displayDate}</td>
        <td>${seasonLabel(g.season)}</td>
        <td>${g.opponent}</td>
        <td>${g.result}</td>
        <td>${g.score}</td>
      </tr>`;
  }

  gamesBody.innerHTML=rows;

  document.getElementById("wins").textContent=wins;
  document.getElementById("losses").textContent=losses;
}
</script>

</body>
</html>
