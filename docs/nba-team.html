<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* PAGE */

.page{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#1D428A,#C8102E);
color:#fff;
padding:26px 30px;
border-radius:14px;
margin-bottom:24px;
box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.hero h1{
margin:0;
font-size:34px;
font-weight:800;
}

/* LEADERS */

.leaders-card{
background:#fff;
border-radius:16px;
padding:18px;
margin-bottom:22px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.leaders-card h3{
margin:0 0 14px;
}

.leaders-table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

.leaders-table td{
padding:9px;
border-bottom:1px solid #eee;
}

.leaders-table td:nth-child(1){
font-weight:700;
width:140px;
}

.leaders-table td:nth-child(3){
text-align:right;
font-weight:800;
}

.leaders-table a{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

.leaders-table a:hover{
text-decoration:underline;
}

/* FILTERS */

.filter-box{
background:#fff;
padding:16px;
border-radius:16px;
margin-bottom:20px;
display:flex;
gap:20px;
flex-wrap:wrap;
align-items:center;
box-shadow:0 4px 12px rgba(0,0,0,.05);
}

select,input{
padding:10px 12px;
border:1px solid #cfd6e3;
border-radius:10px;
font-size:14px;
background:#fff;
}

/* SEARCH */

.search-wrapper{
position:relative;
margin-left:auto;
}

.search-results{
position:absolute;
top:40px;
left:0;
right:0;
background:#fff;
border:1px solid #ddd;
border-radius:10px;
max-height:220px;
overflow-y:auto;
display:none;
z-index:1000;
}

.search-item{
padding:8px 12px;
cursor:pointer;
}

.search-item:hover{
background:#eef2ff;
}

/* TABLE */

.card{
background:#fff;
border-radius:16px;
overflow:hidden;
box-shadow:0 4px 12px rgba(0,0,0,.05);
}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

th{
background:#eef3ff;
color:#111;
padding:12px;
text-align:left;
font-weight:800;
}

td{
padding:12px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f8faff;
}

tr:hover{
background:#eaf0ff;
cursor:pointer;
}

/* LOADING */

.loading{
background:#fff;
padding:12px;
border-radius:12px;
margin-bottom:16px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero" id="heroBox">
<h1 id="teamName">Loading…</h1>
</div>

<div class="leaders-card">

<h3>Franchise Leaders</h3>

<table class="leaders-table">
<tbody id="leadersBody">
<tr><td colspan="3">Loading leaders…</td></tr>
</tbody>
</table>

</div>

<div class="loading" id="loadingBox">Loading games…</div>

<div class="filter-box">

<label>
Season:
<select id="seasonSelect"></select>
</label>

<label>
Type:
<select id="typeSelect">
<option value="all">All</option>
<option value="regular">Regular Season</option>
<option value="playoffs">Playoffs</option>
</select>
</label>

<div class="search-wrapper">
<input type="text" id="teamSearch" placeholder="Search team…">
<div class="search-results" id="searchResults"></div>
</div>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Type</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

</div>

<script>

const teamRaw = new URLSearchParams(window.location.search).get("team") || "";

const PATH_SEASONS = "/data/nba/seasons.json";
const PATH_LEADERS = "/data/nba/team-leaders.json";

function norm(s){
return (s || "").toLowerCase().replace(/[^a-z0-9]/g,"");
}

function seasonLabel(start){
const next = String((Number(start)+1)%100).padStart(2,"0");
return `${start}-${next}`;
}

function typeBucket(t){
if(!t) return "regular";
const s = t.toLowerCase();
if(s.includes("regular")) return "regular";
return "playoffs";
}

const elTeamName = document.getElementById("teamName");
const elLoading = document.getElementById("loadingBox");
const elSeason = document.getElementById("seasonSelect");
const elType = document.getElementById("typeSelect");
const elBody = document.getElementById("gamesBody");
const elLeaders = document.getElementById("leadersBody");

let allGames=[];
let currentSeason=null;

function render(){

let filtered=allGames;

if(elType.value!=="all"){
filtered=filtered.filter(g=>g.type===elType.value);
}

filtered.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

elBody.innerHTML="";

for(const g of filtered){

const tr=document.createElement("tr");

tr.onclick=()=>{
if(!g.id)return;
location.href=`nba-game.html?season=${currentSeason}&game=${g.id}`;
};

tr.innerHTML=`
<td>${g.date}</td>
<td>${seasonLabel(currentSeason)}</td>
<td>${g.typeLabel}</td>
<td>${g.opponent}</td>
<td>${g.result}</td>
<td>${g.score}</td>
`;

elBody.appendChild(tr);

}

}

async function loadSeason(season){

currentSeason=Number(season);
allGames=[];

elLoading.style.display="block";

const indexRaw=await fetch(`/data/nba/${season}/index.json`).then(r=>r.json());

const gameIds=indexRaw.games||[];

const teamKey=norm(teamRaw);

const games=await Promise.all(
gameIds.map(id=>
fetch(`/data/nba/${season}/${id}.json`)
.then(r=>r.json())
.catch(()=>null)
)
);

for(const g of games){

if(!g)continue;

if((g.game_type||"").toLowerCase().includes("pre"))continue;

const home=norm(g.home_team);
const away=norm(g.away_team);

if(home!==teamKey && away!==teamKey)continue;

const isHome=home===teamKey;

const teamScore=Number(isHome?g.home_score:g.away_score);
const oppScore=Number(isHome?g.away_score:g.home_score);

allGames.push({
id:g.game_id,
date:g.date,
type:typeBucket(g.game_type),
typeLabel:g.game_type,
opponent:isHome?g.away_team:g.home_team,
result:teamScore>oppScore?"W":"L",
score:`${teamScore} - ${oppScore}`
});

}

render();

elLoading.style.display="none";

}

async function init(){

elTeamName.textContent=teamRaw;

const seasons=await fetch(PATH_SEASONS).then(r=>r.json());

seasons.sort((a,b)=>b-a);

for(const s of seasons){

const opt=document.createElement("option");

opt.value=s;
opt.textContent=seasonLabel(s);

elSeason.appendChild(opt);

}

elSeason.addEventListener("change",()=>loadSeason(elSeason.value));

elType.addEventListener("change",render);

if(seasons.length){
loadSeason(seasons[0]);
}

}

init();

</script>

</body>
</html>
