<script>

const MASTER_URL = "PUT YOUR OLD WORKING JSON PATH HERE EXACTLY";

const params = new URLSearchParams(location.search);
const team = decodeURIComponent(params.get("team") || "").trim();

document.getElementById("teamName").textContent = team;

function norm(s){return String(s||"").trim().toLowerCase();}

function deriveSeason(game){
  if(game.season && Number(game.season)) return Number(game.season);

  const id = String(game.game_id||"");
  if(id.length < 3) return null;
  const yy = parseInt(id.slice(1,3));
  if(!yy && yy!==0) return null;

  return yy >= 46 ? 1900+yy : 2000+yy;
}

function parseDate(d){
  if(!d) return 0;
  const t = Date.parse(String(d).trim());
  return isNaN(t) ? 0 : t;
}

async function load(){

  const status = document.getElementById("status");

  let res;
  try{
    res = await fetch(MASTER_URL);
  }catch(e){
    status.textContent="Could not fetch master JSON.";
    status.className="status err";
    return;
  }

  if(!res.ok){
    status.textContent="Master JSON not found (404).";
    status.className="status err";
    return;
  }

  const data = await res.json();

  const games = [];

  for(const g of data){

    const home = g.home_team || "";
    const away = g.away_team || "";

    if(norm(home)!==norm(team) && norm(away)!==norm(team)) continue;

    const isHome = norm(home)===norm(team);

    const teamScore = isHome ? Number(g.home_score) : Number(g.away_score);
    const oppScore  = isHome ? Number(g.away_score) : Number(g.home_score);

    if(!Number.isFinite(teamScore) || !Number.isFinite(oppScore)) continue;

    const season = deriveSeason(g);

    games.push({
      season,
      date:g.date||"",
      sortDate:parseDate(g.date),
      opponent:isHome?away:home,
      result:teamScore>oppScore?"W":"L",
      pf:teamScore,
      pa:oppScore
    });
  }

  if(games.length===0){
    status.textContent="No games found.";
    status.className="status err";
    return;
  }

  status.textContent=`Loaded ${games.length.toLocaleString()} games.`;
  status.className="status ok";

  const seasonAgg={};

  for(const g of games){

    if(!seasonAgg[g.season]){
      seasonAgg[g.season]={games:0,wins:0,losses:0,pf:0,pa:0};
    }

    seasonAgg[g.season].games++;
    seasonAgg[g.season].pf+=g.pf;
    seasonAgg[g.season].pa+=g.pa;
    if(g.result==="W") seasonAgg[g.season].wins++;
    else seasonAgg[g.season].losses++;
  }

  const seasons=Object.keys(seasonAgg).map(Number).sort((a,b)=>b-a);

  const seasonFilter=document.getElementById("seasonFilter");
  seasonFilter.innerHTML='<option value="">All Seasons</option>';

  for(const s of seasons){
    const opt=document.createElement("option");
    opt.value=s;
    opt.textContent=s;
    seasonFilter.appendChild(opt);
  }

  function render(){

    const selected=Number(seasonFilter.value)||null;

    let totalGames=0,wins=0,losses=0,pf=0,pa=0;

    const seasonTable=document.getElementById("seasonTable");
    seasonTable.innerHTML="";

    for(const s of seasons){

      if(selected && s!==selected) continue;

      const row=seasonAgg[s];

      totalGames+=row.games;
      wins+=row.wins;
      losses+=row.losses;
      pf+=row.pf;
      pa+=row.pa;

      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${s}</td>
        <td>${row.games}</td>
        <td>${row.wins}</td>
        <td>${row.losses}</td>
        <td>${row.pf}</td>
        <td>${row.pa}</td>
      `;
      seasonTable.appendChild(tr);
    }

    document.getElementById("seasonCount").textContent=selected?1:seasons.length;
    document.getElementById("gamesCount").textContent=totalGames;
    document.getElementById("winsCount").textContent=wins;
    document.getElementById("lossesCount").textContent=losses;
    document.getElementById("pfCount").textContent=pf;
    document.getElementById("paCount").textContent=pa;

    const gamesTable=document.getElementById("gamesTable");
    gamesTable.innerHTML="";

    const filtered=games
      .filter(g=>!selected||g.season===selected)
      .sort((a,b)=>b.sortDate-a.sortDate)
      .slice(0,200);

    for(const g of filtered){
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${g.season}</td>
        <td>${g.date}</td>
        <td>${g.opponent}</td>
        <td>${g.result}</td>
        <td>${g.pf} – ${g.pa}</td>
      `;
      gamesTable.appendChild(tr);
    }
  }

  seasonFilter.addEventListener("change",render);
  render();
}

load();

</script>
