<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  background-size:400% 400%;
  animation:fadeGradient 10s ease infinite;
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:24px;
}

@keyframes fadeGradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.leaders{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  margin-bottom:25px;
}

.leader-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.leader-box{
  background:#eef2ff;
  padding:18px;
  border-radius:14px;
}

.leader-box h3{
  margin:0 0 8px 0;
}

.card{
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--nba-primary);
  color:#fff;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid var(--line);
}

tr:hover{
  background:#eef2ff;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="teamName"></h1>
</div>

<div class="leaders">
  <h2>All-Time Franchise Leaders</h2>
  <div class="leader-grid" id="leadersGrid">
    Loading leaders...
  </div>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Season</th>
        <th>Opponent</th>
        <th>Result</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="gamesBody"></tbody>
  </table>
</div>

</div>

<script>
const params=new URLSearchParams(window.location.search);
const team=(params.get("team")||"").trim();
document.getElementById("teamName").textContent=team;

const clean=s=>(s||"").toLowerCase().trim();

let playerTotals={};
let allGames=[];

async function load(){

  const master=await fetch("/data/nba/nba_games_master.json").then(r=>r.json());

  const t=clean(team);

  for(const game of master){

    if(clean(game.home_team)!==t && clean(game.away_team)!==t) continue;

    try{
      const full=await fetch(`/data/nba/${game.season}/${game.game_id}.json`).then(r=>r.json());

      if(full.game_type!=="Regular Season" && full.game_type!=="Playoffs") continue;

      const isHome=clean(game.home_team)===t;
      const teamScore=isHome?game.home_score:game.away_score;
      const oppScore=isHome?game.away_score:game.home_score;

      allGames.push({
        id:game.game_id,
        date:full.date,
        season:full.season,
        opponent:isHome?game.away_team:game.home_team,
        result:teamScore>oppScore?"W":"L",
        score:`${teamScore} - ${oppScore}`
      });

      for(const p of full.players||[]){
        if(clean(p.team)!==t) continue;

        if(!playerTotals[p.player_name]){
          playerTotals[p.player_name]={points:0,rebounds:0,assists:0,steals:0};
        }

        playerTotals[p.player_name].points+=p.points||0;
        playerTotals[p.player_name].rebounds+=p.rebounds||0;
        playerTotals[p.player_name].assists+=p.assists||0;
        playerTotals[p.player_name].steals+=p.steals||0;
      }

    }catch{}
  }

  renderLeaders();
  renderGames();
}

function renderLeaders(){

  const stats=["points","rebounds","assists","steals"];
  const grid=document.getElementById("leadersGrid");
  grid.innerHTML="";

  for(const stat of stats){

    let leader="";
    let high=0;

    for(const player in playerTotals){
      if(playerTotals[player][stat]>high){
        high=playerTotals[player][stat];
        leader=player;
      }
    }

    grid.innerHTML+=`
      <div class="leader-box">
        <h3>${stat.toUpperCase()}</h3>
        <strong>${leader||"N/A"}</strong><br>
        ${high}
      </div>`;
  }
}

function renderGames(){
  const body=document.getElementById("gamesBody");
  allGames.sort((a,b)=>new Date(b.date)-new Date(a.date));
  body.innerHTML=allGames.map(g=>`
    <tr onclick="location.href='nba-game.html?game=${g.id}'">
      <td>${g.date}</td>
      <td>${g.season}</td>
      <td>${g.opponent}</td>
      <td>${g.result}</td>
      <td>${g.score}</td>
    </tr>
  `).join("");
}

load();
</script>

</body>
</html>
