<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--nba-primary:#17408B;--bg:#f4f6f8;--card:#ffffff;--line:#e6e8ee;}
body{font-family:Inter,Arial;margin:0;background:var(--bg);}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid var(--line);font-weight:700;}
.navbar a{text-decoration:none;color:var(--nba-primary);}
.page{max-width:1200px;margin:auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(270deg,#17408B,#C9082A,#17408B);color:#fff;padding:34px;border-radius:22px;margin-bottom:20px;}
.hero h1{margin:0;font-size:36px;}
.leaders-card{background:#fff;border-radius:16px;padding:18px;margin-bottom:20px;}
.leaders-card h3{margin:0 0 12px;}
.leaders-table{width:100%;border-collapse:collapse;}
.leaders-table td{padding:8px;border-bottom:1px solid #eee;}
.leaders-table td:nth-child(1){font-weight:600;width:120px;}
.leaders-table td:nth-child(3){text-align:right;font-weight:700;}
.leaders-table a{color:#0056d6;text-decoration:none;font-weight:600;}
.leaders-table a:hover{text-decoration:underline;}
.filter-box{background:var(--card);padding:16px;border-radius:16px;margin-bottom:16px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;}
select{padding:8px 10px;border:1px solid #cfd6e3;border-radius:10px;font-size:14px;}
.card{background:var(--card);border-radius:16px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{background:var(--nba-primary);color:#fff;padding:12px;text-align:left;}
td{padding:12px;border-bottom:1px solid var(--line);}
tr:hover{background:#eef2ff;cursor:pointer;}
.loading{text-align:center;padding:20px;color:#666;}
.stat-wins{color:#008000;font-weight:800;}
.stat-loss{color:#d00;font-weight:800;}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div class="page">
  <div class="hero">
    <h1 id="teamName">Loading…</h1>
  </div>

  <div class="filter-box">
    <label>Season:
      <select id="seasonSelect"></select>
    </label>
    <label>Type:
      <select id="typeSelect">
        <option value="all">All Games</option>
        <option value="regular">Regular Season</option>
        <option value="playoffs">Playoffs</option>
      </select>
    </label>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Away</th>
          <th>Score</th>
          <th>Home</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody id="gamesBody">
        <tr><td colspan="5" class="loading">Loading games…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const R2      = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
const teamRaw = new URLSearchParams(location.search).get("team") || "";

const seasonSelect = document.getElementById("seasonSelect");
const typeSelect   = document.getElementById("typeSelect");
const gamesBody    = document.getElementById("gamesBody");
const teamNameEl   = document.getElementById("teamName");

let allGames = [];
let season   = 2026;

function fixName(str){
  if(!str) return str;
  try{
    const bytes = new Uint8Array(str.length);
    for(let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const decoded = new TextDecoder('utf-8').decode(bytes);
    if(decoded.includes('\ufffd')) return str;
    return decoded;
  }catch(e){ return str; }
}

teamNameEl.textContent = teamRaw;
document.title = `${teamRaw} | NBA Team`;

// Build season dropdown
for(let y = 2026; y >= 1977; y--){
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = `${y-1}-${y}`;
  if(y === season) opt.selected = true;
  seasonSelect.appendChild(opt);
}

seasonSelect.onchange = () => { season = parseInt(seasonSelect.value); loadSeason(); };
typeSelect.onchange   = renderGames;

async function loadSeason(){
  gamesBody.innerHTML = `<tr><td colspan="5" class="loading">Loading games…</td></tr>`;
  try{
    const res = await fetch(`${R2}/basketball/indexes/${season}.json`);
    if(!res.ok) throw new Error("Not found");
    allGames = await res.json();
    renderGames();
  }catch(err){
    gamesBody.innerHTML = `<tr><td colspan="5" class="loading">Failed to load games.</td></tr>`;
  }
}

function renderGames(){
  gamesBody.innerHTML = "";
  const typeFilter = typeSelect.value;

  let filtered = allGames.filter(g =>
    g.home === teamRaw || g.away === teamRaw
  );

  if(typeFilter === "regular") filtered = filtered.filter(g => !g.playoff);
  if(typeFilter === "playoffs") filtered = filtered.filter(g => g.playoff);

  if(!filtered.length){
    gamesBody.innerHTML = `<tr><td colspan="5" class="loading">No games found.</td></tr>`;
    return;
  }

  // Sort newest first
  filtered.sort((a,b) => new Date(b.date) - new Date(a.date));

  filtered.forEach(g => {
    const isHome    = g.home === teamRaw;
    const teamScore = isHome ? g.home_score : g.away_score;
    const oppScore  = isHome ? g.away_score : g.home_score;
    const result    = teamScore > oppScore ? "W" : teamScore < oppScore ? "L" : "D";
    const cls       = result === "W" ? "stat-wins" : result === "L" ? "stat-loss" : "";

    const tr = document.createElement("tr");
    tr.onclick = () => {
      window.location.href = `/nba-game.html?season=${season}&game=${g.game_id}`;
    };
    tr.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${g.away || ""}</td>
      <td>${g.away_score ?? "–"} – ${g.home_score ?? "–"}</td>
      <td>${g.home || ""}</td>
      <td class="${cls}">${result}</td>
    `;
    gamesBody.appendChild(tr);
  });
}

loadSeason();
</script>
</body>
</html>
