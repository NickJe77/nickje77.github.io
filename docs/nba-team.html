<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --soft:#eef2ff;
  --text:#0b1220;
}
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}
.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}
.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  background-size:400% 400%;
  animation:fadeGradient 10s ease infinite;
  color:#fff;
  padding:34px;
  border-radius:22px;
  margin-bottom:16px;
}
@keyframes fadeGradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
.top-stack{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}
.stats{
  background:var(--card);
  padding:16px 20px;
  border-radius:16px;
  display:flex;
  gap:30px;
  font-size:19px;
  font-weight:600;
  flex-wrap:wrap;
}
.stats strong{font-size:21px;}
.leaders-card{
  background:var(--card);
  padding:16px 18px;
  border-radius:16px;
}
.leaders-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}
.leader-box{
  background:var(--soft);
  padding:10px;
  border-radius:12px;
  border:1px solid #dfe6ff;
}
.leader-label{
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.6px;
}
.leader-player a{
  text-decoration:none;
  color:var(--nba-primary);
  font-weight:800;
}
.leader-total{
  font-size:13px;
  font-weight:700;
  color:#20304f;
}
.season-box{
  background:var(--card);
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
select{
  padding:8px 10px;
  border:1px solid #cfd6e3;
  border-radius:10px;
  font-size:14px;
  background:#fff;
}
.card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
}
table{width:100%;border-collapse:collapse;}
th{
  background:var(--nba-primary);
  color:#fff;
  padding:12px;
  font-size:14px;
  text-align:left;
}
td{
  padding:12px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}
tr:hover{background:#eef2ff;cursor:pointer;}
.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  background:#0b1220;
  color:#fff;
  font-size:12px;
  font-weight:800;
}
.loading{
  background:#fff;
  border:1px solid #e5e7eb;
  padding:10px 12px;
  border-radius:12px;
  margin:12px 0;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="teamName">Loading…</h1>
    <div id="subTitle" style="margin-top:8px;color:rgba(255,255,255,.9);"></div>
  </div>

  <div class="loading" id="loadingBox">Loading team data…</div>

  <div class="top-stack">

    <div class="stats">
      <div>Total Games: <strong id="totalGames">0</strong></div>
      <div>Wins: <strong id="wins">0</strong></div>
      <div>Losses: <strong id="losses">0</strong></div>
      <div><span class="badge" id="loadBadge">INIT</span></div>
    </div>

    <div class="leaders-card">
      <h2 style="margin:0 0 10px 0;">All-Time Franchise Leaders</h2>
      <div class="leaders-grid" id="leadersGrid"></div>
    </div>

  </div>

  <div class="season-box">
    <strong>Select Season:</strong>
    <select id="seasonSelect">
      <option value="all">All Seasons</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Season</th>
          <th>Type</th>
          <th>Opponent</th>
          <th>Result</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const teamRaw = (params.get("team") || "").trim();

const PATH_MASTER  = "/data/nba/nba_games_master.json";
const PATH_LEADERS = "/data/nba/team_leaders.json";

const elTeamName = document.getElementById("teamName");
const elSubTitle = document.getElementById("subTitle");
const elLoading  = document.getElementById("loadingBox");
const elBadge    = document.getElementById("loadBadge");
const elTotal    = document.getElementById("totalGames");
const elWins     = document.getElementById("wins");
const elLoss     = document.getElementById("losses");
const elGrid     = document.getElementById("leadersGrid");
const elSeason   = document.getElementById("seasonSelect");
const elBody     = document.getElementById("gamesBody");

function seasonLabel(start){
  const next = String((Number(start)+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}
function norm(s){
  return (s||"").toLowerCase().replace(/[^a-z]/g,"");
}
async function fetchJson(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("Fetch failed: "+url);
  return r.json();
}

let allGames = [];
let seasons = new Set();

function renderGames(season){
  elBody.innerHTML="";
  const list = season==="all" ? allGames : allGames.filter(g=>String(g.season)===season);
  let w=0,l=0;

  list.sort((a,b)=> (b.date||"").localeCompare(a.date||""));

  for(const g of list){
    if(g.result==="W") w++; else l++;
    const tr=document.createElement("tr");
    tr.onclick=()=>location.href=`nba-game.html?game=${g.id}`;
    tr.innerHTML=`<td>${g.date}</td>
                  <td>${seasonLabel(g.season)}</td>
                  <td>${g.type}</td>
                  <td>${g.opponent}</td>
                  <td>${g.result}</td>
                  <td>${g.score}</td>`;
    elBody.appendChild(tr);
  }
  elTotal.textContent=list.length;
  elWins.textContent=w;
  elLoss.textContent=l;
}

function renderLeaders(data){
  elGrid.innerHTML="";
  const teamKey = norm(teamRaw);
  const team = data.find(t=>norm(t.team)===teamKey);
  if(!team) return;

  for(const [stat,obj] of Object.entries(team.stats)){
    const div=document.createElement("div");
    div.className="leader-box";
    div.innerHTML=`
      <div class="leader-label">${stat.toUpperCase()}</div>
      <div class="leader-player">
        <a href="nba-player.html?player=${encodeURIComponent(obj.player)}">${obj.player}</a>
      </div>
      <div class="leader-total">${obj.total.toLocaleString()}</div>`;
    elGrid.appendChild(div);
  }
}

async function load(){
  elTeamName.textContent=teamRaw;
  elBadge.textContent="LOADING";

  const master = await fetchJson(PATH_MASTER);
  const leaders = await fetchJson(PATH_LEADERS);

  const teamKey = norm(teamRaw);

  for(const g of master){
    const home=norm(g.home_team);
    const away=norm(g.away_team);
    if(!home.includes(teamKey)&&!away.includes(teamKey)) continue;

    const isHome=home.includes(teamKey);
    const teamScore=isHome?g.home_score:g.away_score;
    const oppScore=isHome?g.away_score:g.home_score;

    seasons.add(g.season);

    allGames.push({
      id:g.game_id,
      date:g.date,
      season:g.season,
      type:g.game_type||"",
      opponent:isHome?g.away_team:g.home_team,
      result:Number(teamScore)>Number(oppScore)?"W":"L",
      score:`${teamScore} - ${oppScore}`
    });
  }

  for(const s of Array.from(seasons).sort((a,b)=>b-a)){
    const opt=document.createElement("option");
    opt.value=s;
    opt.textContent=seasonLabel(s);
    elSeason.appendChild(opt);
  }

  renderGames("all");
  renderLeaders(leaders);

  elSubTitle.textContent=`${allGames.length} games loaded`;
  elBadge.textContent="OK";
  elLoading.style.display="none";
}

elSeason.addEventListener("change",e=>renderGames(e.target.value));
load();
</script>

</body>
</html>
