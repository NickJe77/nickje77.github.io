<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team Debug</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;margin:40px;}
h1{margin-bottom:20px;}
</style>
</head>
<body>

<h1>NBA Debug Loader</h1>
<div id="output">Loading...</div>

<script>

const BASE = "data/nba/";
const output = document.getElementById("output");

async function run(){

let seasonList = [];

try{
const res = await fetch(BASE + "seasons.json");
seasonList = await res.json();
}catch(e){
output.textContent = "Failed loading seasons.json";
return;
}

let totalGames = 0;

for(const season of seasonList){

try{

const indexRes = await fetch(BASE + season + "/index.json");
if(!indexRes.ok) continue;

const index = await indexRes.json();
if(!index.games) continue;

for(const id of index.games){

const gameRes = await fetch(BASE + season + "/" + id + ".json");
if(!gameRes.ok) continue;

await gameRes.json();
totalGames++;

}

}catch(e){
continue;
}

}

output.textContent = "Total games successfully loaded: " + totalGames;

}

run();

</script>

</body>
</html>
