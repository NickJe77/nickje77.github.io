<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;margin-bottom:6px;}
.subtitle{text-align:center;color:#666;margin-bottom:20px;}
.stats{display:flex;gap:20px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
.stat{background:#f4f6fb;padding:12px 18px;border-radius:10px;text-align:center;min-width:120px;}
.stat b{display:block;font-size:18px;}
.filters{text-align:center;margin-bottom:20px;}
select{padding:8px 14px;font-size:15px;}
table{width:100%;border-collapse:collapse;margin-bottom:40px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:center;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
tr:hover{background:#e9f0ff;}
.error{color:#b00020;text-align:center;margin:14px 0 0;font-weight:600;}
.smallnote{color:#666;text-align:center;margin-top:6px;font-size:13px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="teamName"></h1>
<div class="subtitle">Franchise History (Regular Season + Playoffs)</div>

<div class="filters">
Season:
<select id="seasonFilter">
<option value="">All Seasons</option>
</select>
</div>

<div class="stats">
<div class="stat"><b id="seasons">0</b>Seasons</div>
<div class="stat"><b id="games">0</b>Games</div>
<div class="stat"><b id="wins">0</b>Wins</div>
<div class="stat"><b id="losses">0</b>Losses</div>
<div class="stat"><b id="pf">0</b>Points For</div>
<div class="stat"><b id="pa">0</b>Points Against</div>
</div>

<div id="errorBox" class="error"></div>
<div class="smallnote" id="noteBox"></div>

<h2>Season Summary</h2>
<table>
<thead>
<tr>
<th>Season</th>
<th>Games</th>
<th>Wins</th>
<th>Losses</th>
<th>PF</th>
<th>PA</th>
</tr>
</thead>
<tbody id="seasonTable"></tbody>
</table>

<h2>Games</h2>
<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

</div>

<script>
/*
  IMPORTANT:
  Your NBA JSON lives under /docs/data/nba/ (per your repo structure).
  So BASE must be "docs/data/nba/" for the live site to find the files.
*/
const BASE = "docs/data/nba/";

const params = new URLSearchParams(window.location.search);
const teamParam = params.get("team") || "";
const team = decodeURIComponent(teamParam.replace(/\+/g," ")).trim();

document.getElementById("teamName").textContent = team || "Team not specified";

const seasonFilter = document.getElementById("seasonFilter");
const errorBox = document.getElementById("errorBox");
const noteBox = document.getElementById("noteBox");

let seasonStats = {};     // {year:{games,wins,losses,pf,pa}}
let games = [];           // flat list of matched games
let seasonsSet = new Set();

const clean = (str) =>
  String(str || "")
    .replace(/\s+/g, " ")
    .replace(/\*/g, "")
    .trim()
    .toLowerCase();

async function safeFetchJson(url){
  try{
    const res = await fetch(url, { cache: "no-store" });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    return null;
  }
}

async function loadTeam(){

  if(!team){
    errorBox.textContent = "No team specified in URL (add ?team=Team%20Name).";
    return;
  }

  // Load seasons list
  const seasonsList = await safeFetchJson(BASE + "seasons.json");
  if(!Array.isArray(seasonsList)){
    errorBox.textContent = "Could not load seasons.json from " + BASE;
    return;
  }

  // Note so you can instantly confirm you're reading the right folder
  noteBox.textContent = "Data path: /" + BASE;

  const teamClean = clean(team);

  // Walk all seasons listed
  for(const season of seasonsList){

    const index = await safeFetchJson(BASE + season + "/index.json");
    if(!index || !Array.isArray(index.games)) continue;

    // Walk games in that season
    for(const id of index.games){

      const g = await safeFetchJson(BASE + season + "/" + id + ".json");
      if(!g) continue;

      // Skip preseason + all-star (regular + playoffs count)
      if(g.game_type === "Preseason") continue;
      if(g.game_type === "All-Star") continue;

      const home = clean(g.home_team);
      const away = clean(g.away_team);

      if(home !== teamClean && away !== teamClean) continue;

      const isHome = home === teamClean;

      const teamScore = isHome ? Number(g.home_score) : Number(g.away_score);
      const oppScore  = isHome ? Number(g.away_score) : Number(g.home_score);

      // Defensive: if scores missing, skip
      if(!Number.isFinite(teamScore) || !Number.isFinite(oppScore)) continue;

      const opponent = isHome ? g.away_team : g.home_team;
      const result = teamScore > oppScore ? "W" : "L";

      seasonsSet.add(season);

      if(!seasonStats[season]){
        seasonStats[season] = {games:0,wins:0,losses:0,pf:0,pa:0};
      }

      seasonStats[season].games++;
      seasonStats[season].pf += teamScore;
      seasonStats[season].pa += oppScore;

      if(result === "W") seasonStats[season].wins++;
      else seasonStats[season].losses++;

      games.push({
        season,
        date: g.date || "",
        opponent,
        result,
        score: teamScore + " – " + oppScore
      });
    }
  }

  if(games.length === 0){
    errorBox.textContent = "No games found for '" + team + "'.";
  }else{
    errorBox.textContent = "";
  }

  populateFilter();
  render();
}

function populateFilter(){
  // Reset options but keep "All"
  seasonFilter.innerHTML = '<option value="">All Seasons</option>';

  Array.from(seasonsSet)
    .sort((a,b)=>b-a)
    .forEach(s=>{
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s;
      seasonFilter.appendChild(opt);
    });
}

function render(){

  const seasonVal = seasonFilter.value;

  let totalGames=0,wins=0,losses=0,pf=0,pa=0;

  Object.entries(seasonStats).forEach(([s,v])=>{
    if(seasonVal && String(s) !== String(seasonVal)) return;
    totalGames += v.games;
    wins += v.wins;
    losses += v.losses;
    pf += v.pf;
    pa += v.pa;
  });

  document.getElementById("seasons").textContent = seasonVal ? 1 : seasonsSet.size;
  document.getElementById("games").textContent = totalGames;
  document.getElementById("wins").textContent = wins;
  document.getElementById("losses").textContent = losses;
  document.getElementById("pf").textContent = pf;
  document.getElementById("pa").textContent = pa;

  const seasonBody = document.getElementById("seasonTable");
  seasonBody.innerHTML = "";

  Object.entries(seasonStats)
    .sort((a,b)=>Number(b[0]) - Number(a[0]))
    .forEach(([s,v])=>{
      if(seasonVal && String(s) !== String(seasonVal)) return;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${s}</td>
        <td>${v.games}</td>
        <td>${v.wins}</td>
        <td>${v.losses}</td>
        <td>${v.pf}</td>
        <td>${v.pa}</td>
      `;
      seasonBody.appendChild(tr);
    });

  const gamesBody = document.getElementById("gamesTable");
  gamesBody.innerHTML = "";

  games
    .filter(g => !seasonVal || String(g.season) === String(seasonVal))
    .sort((a,b)=>new Date(b.date) - new Date(a.date))
    .forEach(g=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${g.season}</td>
        <td>${g.date}</td>
        <td>${g.opponent}</td>
        <td>${g.result}</td>
        <td>${g.score}</td>
      `;
      gamesBody.appendChild(tr);
    });
}

seasonFilter.addEventListener("change", render);

loadTeam();
</script>

</body>
</html>
