<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}
.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:6px;}
.subtitle{text-align:center;color:#666;margin-bottom:20px;}

.stats{
  display:flex;
  gap:20px;
  justify-content:center;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.stat{
  background:#f4f6fb;
  padding:12px 18px;
  border-radius:10px;
  text-align:center;
  min-width:120px;
}
.stat b{display:block;font-size:18px;}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:center;
}
th{
  background:#f0f0f0;
  position:sticky;
  top:0;
}
tr:nth-child(even){background:#f6f9ff;}
tr:hover{background:#e9f0ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="teamName"></h1>
<div class="subtitle">Team History</div>

<div class="stats">
  <div class="stat"><b id="seasons">0</b>Seasons</div>
  <div class="stat"><b id="games">0</b>Games</div>
  <div class="stat"><b id="wins">0</b>Wins</div>
  <div class="stat"><b id="losses">0</b>Losses</div>
  <div class="stat"><b id="pf">0</b>Points For</div>
  <div class="stat"><b id="pa">0</b>Points Against</div>
</div>

<h2 style="text-align:center;margin:30px 0 10px;">Games</h2>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Date</th>
  <th>Game</th>
  <th>Result</th>
  <th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const team = params.get("team");
document.getElementById("teamName").textContent = team;

const seasonFiles = [
  "nba_season_1976_77.json",
  "nba_season_1977_78.json",
  "nba_season_1978_79.json",
  "nba_season_1979_80.json",
  "nba_season_2023_24.json"
];

let games = [];

let seasonsSet = new Set();
let wins=0, losses=0, pf=0, pa=0;

async function loadTeam(){
  for(const file of seasonFiles){
    try{
      const res = await fetch("data/nba/" + file);
      const data = await res.json();

      data.games.forEach((g, index)=>{
        const isHome = g.home_team === team;
        const isAway = g.away_team === team;
        if(!isHome && !isAway) return;

        seasonsSet.add(data.season);

        const teamScore = isHome ? g.home_points : g.away_points;
        const oppScore = isHome ? g.away_points : g.home_points;

        pf += teamScore;
        pa += oppScore;

        const result = teamScore > oppScore ? "W" : "L";
        if(result==="W") wins++; else losses++;

        games.push({
          season: data.season,
          seasonParam: file.replace("nba_season_","").replace(".json",""),
          date: g.date || "",
          game: g.home_team + " vs " + g.away_team,
          result: result,
          score: teamScore + " – " + oppScore,
          gameIndex: index
        });
      });

    }catch(e){}
  }

  render();
}

function render(){
  document.getElementById("seasons").textContent = seasonsSet.size;
  document.getElementById("games").textContent = games.length;
  document.getElementById("wins").textContent = wins;
  document.getElementById("losses").textContent = losses;
  document.getElementById("pf").textContent = pf;
  document.getElementById("pa").textContent = pa;

  const tbody = document.getElementById("gamesTable");
  tbody.innerHTML="";

  games.forEach(g=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${g.season}</td>
      <td>${g.date}</td>
      <td>${g.game}</td>
      <td>${g.result}</td>
      <td>${g.score}</td>
    `;

    tr.onclick = () => {
      window.location.href =
        "nba-game.html?season=" +
        encodeURIComponent(g.seasonParam) +
        "&game=" + g.gameIndex;
    };

    tbody.appendChild(tr);
  });
}

loadTeam();
</script>

</body>
</html>
