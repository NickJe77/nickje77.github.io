<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

/* 🔥 Fading Gradient Header */
.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  background-size:400% 400%;
  animation:fadeGradient 10s ease infinite;
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:24px;
}

@keyframes fadeGradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.stats{
  display:flex;
  gap:40px;
  margin-bottom:30px;
  font-size:18px;
}

.stats strong{
  font-size:22px;
}

/* Season Selector Box */
.season-box{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  margin-bottom:30px;
}

.season-box select{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  font-size:16px;
}

.section-title{
  font-size:22px;
  font-weight:700;
  margin:30px 0 15px 0;
}

.card{
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--nba-primary);
  color:#fff;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid var(--line);
}

tr:hover{
  background:#eef2ff;
}

.leaders{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  margin-top:20px;
}

.leader-card{
  background:var(--card);
  padding:20px;
  border-radius:16px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  text-align:center;
}

.leader-card h3{
  margin:0 0 8px 0;
  font-size:16px;
  color:var(--nba-primary);
}

.leader-card strong{
  font-size:18px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="teamName"></h1>
  </div>

  <div class="stats">
    <div>Total Games: <strong id="totalGames">0</strong></div>
    <div>Wins: <strong id="wins">0</strong></div>
    <div>Losses: <strong id="losses">0</strong></div>
  </div>

  <div class="season-box">
    <label><strong>Select Season:</strong></label>
    <select id="seasonSelect">
      <option value="all">All Seasons</option>
    </select>
  </div>

  <div class="leaders" id="leaders" style="display:none;">
    <div class="leader-card">
      <h3>Most Points</h3>
      <strong id="leaderPoints">-</strong>
    </div>
    <div class="leader-card">
      <h3>Most Assists</h3>
      <strong id="leaderAssists">-</strong>
    </div>
    <div class="leader-card">
      <h3>Most Rebounds</h3>
      <strong id="leaderRebounds">-</strong>
    </div>
    <div class="leader-card">
      <h3>Most Blocks</h3>
      <strong id="leaderBlocks">-</strong>
    </div>
  </div>

  <div class="section-title">Games</div>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Season</th>
          <th>Opponent</th>
          <th>Result</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>
const params=new URLSearchParams(window.location.search);
const team=params.get("team")||"";
document.getElementById("teamName").textContent=team;

const clean=s=>(s??"").toLowerCase().trim();

function deriveSeason(dateStr){
  if(!dateStr)return null;
  const parts=dateStr.trim().split("/");
  const month=parseInt(parts[1]);
  const year=parseInt(parts[2]);
  if(month>=10)return year;
  return year-1;
}

function seasonLabel(start){
  const next=String((start+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}

let allGames=[];
let seasonSet=new Set();

fetch("/data/nba/nba_games_master.json")
.then(r=>r.json())
.then(data=>{
  const t=clean(team);

  data.forEach(game=>{
    const home=clean(game.home_team);
    const away=clean(game.away_team);

    if(home===t||away===t){
      const season=deriveSeason(game.date);
      if(!season)return;

      seasonSet.add(season);

      const isHome=home===t;
      const teamScore=isHome?game.home_score:game.away_score;
      const oppScore=isHome?game.away_score:game.home_score;

      allGames.push({
        ...game,
        season,
        opponent:isHome?game.away_team:game.home_team,
        result:teamScore>oppScore?"W":"L",
        score:`${teamScore} - ${oppScore}`
      });
    }
  });

  buildSeasonSelector();
  render("all");
});

function buildSeasonSelector(){
  const select=document.getElementById("seasonSelect");
  Array.from(seasonSet)
    .sort((a,b)=>b-a)
    .forEach(s=>{
      const opt=document.createElement("option");
      opt.value=s;
      opt.textContent=seasonLabel(s);
      select.appendChild(opt);
    });

  select.addEventListener("change",e=>{
    render(e.target.value);
  });
}

function render(selectedSeason){

  const gamesBody=document.getElementById("gamesBody");
  gamesBody.innerHTML="";

  const filtered=selectedSeason==="all"
    ?allGames
    :allGames.filter(g=>g.season==selectedSeason);

  document.getElementById("totalGames").textContent=filtered.length;

  let wins=0,losses=0;

  filtered.forEach(g=>{
    if(g.result==="W")wins++;else losses++;
    gamesBody.innerHTML+=`
      <tr>
        <td>${g.date.trim()}</td>
        <td>${seasonLabel(g.season)}</td>
        <td>${g.opponent}</td>
        <td>${g.result}</td>
        <td>${g.score}</td>
      </tr>`;
  });

  document.getElementById("wins").textContent=wins;
  document.getElementById("losses").textContent=losses;

  if(selectedSeason!=="all"){
    calculateLeaders(filtered);
  }else{
    document.getElementById("leaders").style.display="none";
  }
}

function calculateLeaders(games){
  let points=0,assists=0,rebounds=0,blocks=0;
  let pName="",aName="",rName="",bName="";

  games.forEach(game=>{
    if(!game.players)return;

    game.players.forEach(player=>{
      if(player.points>points){points=player.points;pName=player.player_name;}
      if(player.assists>assists){assists=player.assists;aName=player.player_name;}
      if(player.rebounds>rebounds){rebounds=player.rebounds;rName=player.player_name;}
      if(player.blocks>blocks){blocks=player.blocks;bName=player.player_name;}
    });
  });

  document.getElementById("leaderPoints").textContent=`${pName} (${points})`;
  document.getElementById("leaderAssists").textContent=`${aName} (${assists})`;
  document.getElementById("leaderRebounds").textContent=`${rName} (${rebounds})`;
  document.getElementById("leaderBlocks").textContent=`${bName} (${blocks})`;

  document.getElementById("leaders").style.display="grid";
}
</script>

</body>
</html>
