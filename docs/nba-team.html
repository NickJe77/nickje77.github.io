<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:var(--nba-primary);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:24px;
}

.stats{
  display:flex;
  gap:40px;
  margin-bottom:30px;
  font-size:18px;
}

.stats strong{
  font-size:22px;
}

.section-title{
  font-size:22px;
  font-weight:700;
  margin:30px 0 15px 0;
}

.card{
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--nba-primary);
  color:#fff;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid var(--line);
}

tr:hover{
  background:#eef2ff;
}

.no-data{
  background:var(--card);
  padding:30px;
  text-align:center;
  border-radius:18px;
  font-weight:600;
  margin-top:20px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="teamName"></h1>
  </div>

  <div class="stats">
    <div>Total Games: <strong id="totalGames">0</strong></div>
    <div>Wins: <strong id="wins">0</strong></div>
    <div>Losses: <strong id="losses">0</strong></div>
  </div>

  <div class="section-title">Season Summary</div>
  <div class="card">
    <table id="seasonTable">
      <thead>
        <tr>
          <th>Season</th>
          <th>Games</th>
          <th>Wins</th>
          <th>Losses</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section-title">Recent Games</div>
  <div class="card">
    <table id="gamesTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Season</th>
          <th>Opponent</th>
          <th>Result</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="noData" class="no-data" style="display:none;">
    No games found for this team.
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const team = params.get("team") || "";
document.getElementById("teamName").textContent = team;

const clean = s => (s ?? "").toLowerCase().trim();

function deriveSeasonFromDDMM(dateStr){
  if(!dateStr) return null;

  const cleaned = dateStr.trim();
  const parts = cleaned.split("/"); // DD/MM/YYYY

  if(parts.length < 3) return null;

  const day = parseInt(parts[0]);
  const month = parseInt(parts[1]);
  const year = parseInt(parts[2]);

  if(!year || !month) return null;

  // NBA season starts in October
  if(month >= 10) return year;
  return year - 1;
}

function seasonLabel(start){
  if(!start) return "";
  const next = String((start+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}

let seasonStats = {};
let teamGames = [];

fetch("/data/nba/nba_games_master.json")
.then(res => res.json())
.then(data => {

  const t = clean(team);

  data.forEach(game => {

    const home = clean(game.home_team);
    const away = clean(game.away_team);

    if(home === t || away === t){

      const seasonStart = deriveSeasonFromDDMM(game.date);
      if(!seasonStart) return;

      const isHome = home === t;
      const teamScore = isHome ? Number(game.home_score) : Number(game.away_score);
      const oppScore = isHome ? Number(game.away_score) : Number(game.home_score);
      const opponent = isHome ? game.away_team : game.home_team;

      if(!seasonStats[seasonStart]){
        seasonStats[seasonStart] = {games:0,wins:0,losses:0};
      }

      seasonStats[seasonStart].games++;

      if(teamScore > oppScore){
        seasonStats[seasonStart].wins++;
      } else {
        seasonStats[seasonStart].losses++;
      }

      teamGames.push({
        date:game.date.trim(),
        season:seasonStart,
        opponent:opponent,
        result:teamScore > oppScore ? "W" : "L",
        score:`${teamScore} - ${oppScore}`
      });
    }

  });

  render();

});

function render(){

  if(teamGames.length === 0){
    document.getElementById("noData").style.display="block";
    return;
  }

  document.getElementById("totalGames").textContent = teamGames.length;

  let totalW=0,totalL=0;
  const seasonBody=document.querySelector("#seasonTable tbody");
  seasonBody.innerHTML="";

  Object.keys(seasonStats)
  .map(Number)
  .sort((a,b)=>b-a)
  .forEach(start=>{
    const s=seasonStats[start];
    totalW+=s.wins;
    totalL+=s.losses;

    seasonBody.innerHTML+=`
      <tr>
        <td>${seasonLabel(start)}</td>
        <td>${s.games}</td>
        <td>${s.wins}</td>
        <td>${s.losses}</td>
      </tr>
    `;
  });

  document.getElementById("wins").textContent=totalW;
  document.getElementById("losses").textContent=totalL;

  const gamesBody=document.querySelector("#gamesTable tbody");
  gamesBody.innerHTML="";

  teamGames
  .sort((a,b)=>{
    const da = a.date.split("/").reverse().join("-");
    const db = b.date.split("/").reverse().join("-");
    return new Date(db) - new Date(da);
  })
  .slice(0,50)
  .forEach(g=>{
    gamesBody.innerHTML+=`
      <tr>
        <td>${g.date}</td>
        <td>${seasonLabel(g.season)}</td>
        <td>${g.opponent}</td>
        <td>${g.result}</td>
        <td>${g.score}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
