<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
}
body{font-family:Inter,Arial;margin:0;background:var(--bg);}
.navbar{
  display:flex;justify-content:center;gap:24px;
  padding:16px;background:#fff;
  border-bottom:1px solid var(--line);font-weight:700;
}
.navbar a{text-decoration:none;color:var(--nba-primary);}
.page{max-width:1200px;margin:auto;padding:30px 20px 60px;}
.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  color:#fff;padding:34px;border-radius:22px;margin-bottom:20px;
}
.stats{
  background:var(--card);
  padding:16px;border-radius:16px;
  display:flex;gap:30px;margin-bottom:16px;flex-wrap:wrap;
}
.filter-box{
  background:var(--card);
  padding:16px;border-radius:16px;
  margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap;
}
.card{background:var(--card);border-radius:16px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{background:var(--nba-primary);color:#fff;padding:12px;text-align:left;}
td{padding:12px;border-bottom:1px solid var(--line);}
tr:hover{background:#eef2ff;cursor:pointer;}
.loading{
  background:#fff;padding:10px;
  border:1px solid #e5e7eb;border-radius:12px;margin-bottom:16px;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
<h1 id="teamName">Loading…</h1>
</div>

<div class="loading" id="loadingBox">Loading games…</div>

<div class="stats">
<div>Total Games: <strong id="totalGames">0</strong></div>
<div>Wins: <strong id="wins">0</strong></div>
<div>Losses: <strong id="losses">0</strong></div>
</div>

<div class="filter-box">
Season:
<select id="seasonSelect"></select>

Type:
<select id="typeSelect">
<option value="all">All</option>
<option value="regular">Regular Season</option>
<option value="playoffs">Playoffs</option>
</select>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Type</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>

</div>

<script>
const teamRaw = new URLSearchParams(window.location.search).get("team") || "";
const PATH_SEASONS = "/data/nba/seasons.json";

function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
function seasonLabel(start){
  const next = String((Number(start)+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}
function typeBucket(t){
  if(!t) return "regular";
  const s = t.toLowerCase();
  if(s.includes("regular")) return "regular";
  return "playoffs";
}

const elTeamName=document.getElementById("teamName");
const elLoading=document.getElementById("loadingBox");
const elTotal=document.getElementById("totalGames");
const elWins=document.getElementById("wins");
const elLoss=document.getElementById("losses");
const elSeason=document.getElementById("seasonSelect");
const elType=document.getElementById("typeSelect");
const elBody=document.getElementById("gamesBody");

let allGames=[];
let currentSeason=null;

function render(){
  let filtered=allGames;

  if(elType.value!=="all"){
    filtered=filtered.filter(g=>g.type===elType.value);
  }

  filtered.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  elBody.innerHTML="";
  let w=0,l=0;

  for(const g of filtered){
    if(g.result==="W")w++;else l++;
    const tr=document.createElement("tr");
    tr.onclick=()=>location.href=`nba-game.html?game=${g.id}`;
    tr.innerHTML=`
      <td>${g.date}</td>
      <td>${seasonLabel(currentSeason)}</td>
      <td>${g.typeLabel}</td>
      <td>${g.opponent}</td>
      <td>${g.result}</td>
      <td>${g.score}</td>`;
    elBody.appendChild(tr);
  }

  elTotal.textContent=filtered.length;
  elWins.textContent=w;
  elLoss.textContent=l;
}

async function loadSeason(season){
  currentSeason=Number(season);
  allGames=[];
  elLoading.style.display="block";

  try{
    const indexRaw=await fetch(`/data/nba/${season}/index.json`).then(r=>r.json());
    const gameIds=indexRaw.games || [];

    const teamKey=norm(teamRaw);

    const games=await Promise.all(
      gameIds.map(id=>
        fetch(`/data/nba/${season}/${id}.json`)
        .then(r=>r.json())
        .catch(()=>null)
      )
    );

    for(const g of games){
      if(!g) continue;

      const home=norm(g.home_team);
      const away=norm(g.away_team);
      if(!home.includes(teamKey)&&!away.includes(teamKey))continue;

      const bucket=typeBucket(g.game_type);

      // REMOVE PRESEASON COMPLETELY
      if(g.game_type && g.game_type.toLowerCase().includes("pre")) continue;

      const isHome=home.includes(teamKey);
      const teamScore=isHome?g.home_score:g.away_score;
      const oppScore=isHome?g.away_score:g.home_score;

      allGames.push({
        id:g.game_id,
        date:g.date,
        type:bucket,
        typeLabel:g.game_type,
        opponent:isHome?g.away_team:g.home_team,
        result:Number(teamScore)>Number(oppScore)?"W":"L",
        score:`${teamScore} - ${oppScore}`
      });
    }

    render();
  }catch(e){
    console.error(e);
  }

  elLoading.style.display="none";
}

async function init(){
  elTeamName.textContent=teamRaw;

  const seasons=await fetch(PATH_SEASONS).then(r=>r.json());
  seasons.sort((a,b)=>b-a);

  for(const s of seasons){
    const opt=document.createElement("option");
    opt.value=s;
    opt.textContent=seasonLabel(s);
    elSeason.appendChild(opt);
  }

  elSeason.addEventListener("change",()=>loadSeason(elSeason.value));
  elType.addEventListener("change",render);

  if(seasons.length){
    loadSeason(seasons[0]);
  }
}

init();
</script>

</body>
</html>
