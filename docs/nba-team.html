<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NBA Team</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700}
.navbar a{text-decoration:none;color:#0056d6}
.page{max-width:1200px;margin:auto;padding:30px}
h1{text-align:center}
.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:30px 0}
.card{background:#e9edf3;border-radius:12px;padding:20px;text-align:center}
.card div:first-child{font-size:22px;font-weight:700}
table{width:100%;border-collapse:collapse;background:#fff;margin-bottom:40px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:center}
th{background:#f0f2f5}
</style>
</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/nba.html">NBA</a>
</div>

<div class="page">

<h1 id="teamTitle"></h1>

<div class="summary">
<div class="card"><div id="seasons">0</div><div>Seasons</div></div>
<div class="card"><div id="games">0</div><div>Games</div></div>
<div class="card"><div id="wins">0</div><div>Wins</div></div>
<div class="card"><div id="losses">0</div><div>Losses</div></div>
<div class="card"><div id="pf">0</div><div>Points For</div></div>
<div class="card"><div id="pa">0</div><div>Points Against</div></div>
</div>

<h2>Season Summary</h2>
<table>
<thead>
<tr>
<th>Season</th>
<th>Games</th>
<th>Wins</th>
<th>Losses</th>
<th>PF</th>
<th>PA</th>
</tr>
</thead>
<tbody id="seasonTable"></tbody>
</table>

<h2>Games</h2>
<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

</div>

<script>

const BASE="data/nba/";
const params=new URLSearchParams(window.location.search);
const teamName=decodeURIComponent(params.get("team")||"");
document.getElementById("teamTitle").textContent=teamName;

const teamKey=teamName.toLowerCase().split(" ").pop(); 
// Lakers / Celtics / Bulls etc.

let seasonStats={};
let seasonsSet=new Set();
let games=[];

async function fetchJSON(url){
try{
const r=await fetch(url,{cache:"no-store"});
if(!r.ok)return null;
return await r.json();
}catch{return null;}
}

async function run(){

const seasons=await fetchJSON(BASE+"seasons.json");
if(!seasons)return;

for(const season of seasons){

const index=await fetchJSON(BASE+season+"/index.json");
if(!index||!index.games)continue;

for(const id of index.games){

const g=await fetchJSON(BASE+season+"/"+id+".json");
if(!g)continue;
if(g.game_type==="Preseason"||g.game_type==="All-Star")continue;

const home=(g.home_team||"").toLowerCase();
const away=(g.away_team||"").toLowerCase();

if(!home.includes(teamKey)&&!away.includes(teamKey))continue;

const isHome=home.includes(teamKey);
const teamScore=isHome?g.home_score:g.away_score;
const oppScore=isHome?g.away_score:g.home_score;
const opponent=isHome?g.away_team:g.home_team;
const result=teamScore>oppScore?"W":"L";

seasonsSet.add(season);

if(!seasonStats[season])
seasonStats[season]={games:0,wins:0,losses:0,pf:0,pa:0};

seasonStats[season].games++;
seasonStats[season].pf+=teamScore;
seasonStats[season].pa+=oppScore;
if(result==="W")seasonStats[season].wins++;
else seasonStats[season].losses++;

games.push({season,date:g.date,opponent,result,score:teamScore+"-"+oppScore});
}
}

render();
}

function render(){

let totalGames=0,wins=0,losses=0,pf=0,pa=0;

Object.values(seasonStats).forEach(v=>{
totalGames+=v.games;
wins+=v.wins;
losses+=v.losses;
pf+=v.pf;
pa+=v.pa;
});

document.getElementById("seasons").textContent=seasonsSet.size;
document.getElementById("games").textContent=totalGames;
document.getElementById("wins").textContent=wins;
document.getElementById("losses").textContent=losses;
document.getElementById("pf").textContent=pf;
document.getElementById("pa").textContent=pa;

const seasonTable=document.getElementById("seasonTable");
seasonTable.innerHTML="";
Object.entries(seasonStats).sort((a,b)=>b[0]-a[0]).forEach(([s,v])=>{
seasonTable.innerHTML+=`<tr>
<td>${s}</td>
<td>${v.games}</td>
<td>${v.wins}</td>
<td>${v.losses}</td>
<td>${v.pf}</td>
<td>${v.pa}</td>
</tr>`;
});

const gamesTable=document.getElementById("gamesTable");
gamesTable.innerHTML="";
games.sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(g=>{
gamesTable.innerHTML+=`<tr>
<td>${g.season}</td>
<td>${g.date}</td>
<td>${g.opponent}</td>
<td>${g.result}</td>
<td>${g.score}</td>
</tr>`;
});
}

run();

</script>

</body>
</html>
