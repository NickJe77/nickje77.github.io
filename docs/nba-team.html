<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}

.page-wrap{
  max-width:1000px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:30px;}

.tile-wrap{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:30px;
}
.tile{
  border:1px solid #ddd;
  border-radius:10px;
  padding:16px;
  background:#f6f9ff;
  text-align:center;
}
.tile h3{
  margin:0 0 6px 0;
  font-size:14px;
  color:#555;
  font-weight:600;
}
.tile div{
  font-size:22px;
  font-weight:700;
}

.back-link{
  display:inline-block;
  margin-bottom:20px;
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
.back-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<a href="nba-teams.html" class="back-link">← Back to Teams</a>

<h1 id="teamName">NBA Team</h1>
<p id="teamInfo">Loading team profile…</p>

<div class="tile-wrap">
  <div class="tile">
    <h3>Founded</h3>
    <div id="tileFounded">—</div>
  </div>
  <div class="tile">
    <h3>Championships</h3>
    <div id="tileTitles">—</div>
  </div>
  <div class="tile">
    <h3>Finals Appearances</h3>
    <div id="tileFinals">—</div>
  </div>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const teamName = params.get("team");

const teamNameEl = document.getElementById("teamName");
const teamInfoEl = document.getElementById("teamInfo");

const tileFounded = document.getElementById("tileFounded");
const tileTitles = document.getElementById("tileTitles");
const tileFinals = document.getElementById("tileFinals");

if(!teamName){
  teamNameEl.textContent = "No team selected";
  teamInfoEl.textContent = "";
}else{
  teamNameEl.textContent = teamName;

  fetch("data/nba/teams.json")
    .then(r => r.json())
    .then(data => {
      const team = data.find(t => t.team === teamName);

      if(!team){
        teamInfoEl.textContent = "Team not found.";
        return;
      }

      teamInfoEl.textContent = `Franchise profile for the ${team.team}.`;

      tileFounded.textContent = team.founded || "—";
      tileTitles.textContent = team.titles ?? "—";
      tileFinals.textContent = team.finals ?? "—";
    })
    .catch(() => {
      teamInfoEl.textContent = "Error loading team data.";
    });
}
</script>

</body>
</html>
