<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NBA Team Raw Test</title>
</head>
<body>

<h1>Raw Team Names Test</h1>
<pre id="out">Loading...</pre>

<script>

const BASE="data/nba/";
const out=document.getElementById("out");

async function fetchJSON(url){
try{
const r=await fetch(url);
if(!r.ok)return null;
return await r.json();
}catch{return null;}
}

async function run(){

let text="";

const index=await fetchJSON(BASE+"1976/index.json");
if(!index){ out.textContent="Index failed"; return; }

let count=0;

for(const id of index.games){

if(count>50) break;

const g=await fetchJSON(BASE+"1976/"+id+".json");
if(!g) continue;

text+=g.home_team+"  |  "+g.away_team+"\n";
count++;
}

out.textContent=text;

}

run();

</script>

</body>
</html>
