<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --soft:#eef2ff;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  background-size:400% 400%;
  animation:fadeGradient 10s ease infinite;
  color:#fff;
  padding:34px;
  border-radius:22px;
  margin-bottom:16px;
}

@keyframes fadeGradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.top-stack{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-bottom:16px;
}

.stats{
  background:var(--card);
  padding:16px 20px;
  border-radius:16px;
  display:flex;
  gap:30px;
  font-size:19px;
  font-weight:600;
}

.stats strong{
  font-size:21px;
}

.leaders-card{
  background:var(--card);
  padding:16px 18px;
  border-radius:16px;
}

.leaders-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.leader-box{
  background:var(--soft);
  padding:10px;
  border-radius:12px;
  border:1px solid #dfe6ff;
}

.leader-label{
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
}

.leader-player a{
  text-decoration:none;
  color:var(--nba-primary);
  font-weight:800;
}

.leader-player a:hover{
  text-decoration:underline;
}

.leader-total{
  font-size:13px;
  font-weight:700;
}

.season-box{
  background:var(--card);
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
}

.card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--nba-primary);
  color:#fff;
  padding:12px;
}

td{
  padding:12px;
  border-bottom:1px solid var(--line);
}

tr:hover{
  background:#eef2ff;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="teamName"></h1>
  </div>

  <div class="top-stack">

    <div class="stats">
      <div>Total Games: <strong id="totalGames">0</strong></div>
      <div>Wins: <strong id="wins">0</strong></div>
      <div>Losses: <strong id="losses">0</strong></div>
    </div>

    <div class="leaders-card">
      <h2>All-Time Franchise Leaders</h2>
      <div class="leaders-grid" id="leadersGrid"></div>
    </div>

  </div>

  <div class="season-box">
    <strong>Select Season:</strong>
    <select id="seasonSelect">
      <option value="all">All Seasons</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Season</th>
          <th>Opponent</th>
          <th>Result</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const team = (params.get("team") || "").trim();
document.getElementById("teamName").textContent = team;

function seasonLabel(start){
  const next = String((start+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}

let allGames = [];
let seasons = new Set();
let totalsByPlayer = {};

async function loadData(){

  const masterRes = await fetch("data/nba/nba_games_master.json");
  if(!masterRes.ok) return;

  const master = await masterRes.json();

  for(const game of master){

    const home = game.home_team;
    const away = game.away_team;

    if(home !== team && away !== team) continue;

    seasons.add(game.season);

    const isHome = home === team;
    const teamScore = isHome ? game.home_score : game.away_score;
    const oppScore  = isHome ? game.away_score : game.home_score;

    allGames.push({
      id: game.game_id,
      date: game.date,
      season: game.season,
      opponent: isHome ? game.away_team : game.home_team,
      result: teamScore > oppScore ? "W" : "L",
      score: `${teamScore} - ${oppScore}`
    });

    try {
      const boxRes = await fetch(`data/nba/${game.season}/${game.game_id}.json`);
      if(!boxRes.ok) continue;
      const full = await boxRes.json();

      for(const p of (full.players || [])){
        if(p.team !== team) continue;

        const name = p.player_name;
        if(!totalsByPlayer[name]){
          totalsByPlayer[name] = {points:0,rebounds:0,assists:0,steals:0};
        }

        totalsByPlayer[name].points   += p.points   || 0;
        totalsByPlayer[name].rebounds += p.rebounds || 0;
        totalsByPlayer[name].assists  += p.assists  || 0;
        totalsByPlayer[name].steals   += p.steals   || 0;
      }

    } catch(e){
      continue;
    }
  }

  buildPage();
}

function buildPage(){

  const select = document.getElementById("seasonSelect");

  Array.from(seasons).sort((a,b)=>b-a).forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = seasonLabel(s);
    select.appendChild(opt);
  });

  renderGames("all");
  renderLeaders();
}

function renderGames(season){

  const body = document.getElementById("gamesBody");
  body.innerHTML = "";

  const filtered = season === "all"
    ? allGames
    : allGames.filter(g => g.season == season);

  let wins = 0;
  let losses = 0;

  filtered.forEach(g=>{
    if(g.result === "W") wins++; else losses++;

    body.innerHTML += `
      <tr onclick="location.href='nba-game.html?game=${g.id}'">
        <td>${g.date}</td>
        <td>${seasonLabel(g.season)}</td>
        <td>${g.opponent}</td>
        <td>${g.result}</td>
        <td>${g.score}</td>
      </tr>`;
  });

  document.getElementById("totalGames").textContent = filtered.length;
  document.getElementById("wins").textContent = wins;
  document.getElementById("losses").textContent = losses;
}

function renderLeaders(){

  const grid = document.getElementById("leadersGrid");

  function leader(stat){
    return Object.entries(totalsByPlayer)
      .sort((a,b)=>b[1][stat]-a[1][stat])[0];
  }

  const stats = ["points","rebounds","assists","steals"];
  const labels = ["Points","Rebounds","Assists","Steals"];

  grid.innerHTML = stats.map((s,i)=>{
    const top = leader(s);
    if(!top) return "";
    return `
      <div class="leader-box">
        <div class="leader-label">${labels[i]}</div>
        <div class="leader-player">
          <a href="nba-player.html?player=${encodeURIComponent(top[0])}">
            ${top[0]}
          </a>
        </div>
        <div class="leader-total">${top[1][s]}</div>
      </div>`;
  }).join("");
}

document.getElementById("seasonSelect")
  .addEventListener("change",e=>renderGames(e.target.value));

loadData();
</script>

</body>
</html>
