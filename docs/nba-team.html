<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root{
--bg:#f4f6f8;
--card:#ffffff;
--line:#e6e8ee;
}

body{
font-family:Inter,Arial;
margin:0;
background:var(--bg);
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid var(--line);
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#17408B;
}

.page{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
padding:34px;
border-radius:22px;
margin-bottom:20px;
color:#fff;
}

.hero h1{
margin:0;
font-size:36px;
}

/* LEADERS */

.leaders-card{
background:#fff;
border-radius:16px;
padding:18px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.leaders-table{
width:100%;
border-collapse:collapse;
}

.leaders-table td{
padding:8px 6px;
border-bottom:1px solid #eee;
}

.leaders-table td:nth-child(1){
font-weight:600;
width:120px;
}

.leaders-table td:nth-child(3){
text-align:right;
font-weight:700;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:14px;
margin-bottom:20px;
}

.stat-box{
background:#fff;
border-radius:14px;
padding:16px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.stat-box span{
display:block;
font-size:26px;
font-weight:700;
}

/* TABLE */

.card{
background:var(--card);
border-radius:16px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#17408B;
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid var(--line);
}

tr:hover{
background:#eef2ff;
cursor:pointer;
}

.loading{
background:#fff;
padding:10px;
border:1px solid #e5e7eb;
border-radius:12px;
margin-bottom:16px;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero" id="heroBox">
<h1 id="teamName">Loading…</h1>
</div>

<div class="leaders-card">
<h3>Franchise Leaders</h3>
<table class="leaders-table">
<tbody id="leadersBody"></tbody>
</table>
</div>

<div class="summary" id="summaryBox"></div>

<div class="loading" id="loadingBox">Loading games…</div>

<div class="card">
<table>
<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Type</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>

</div>

<script>

/* TEAM COLOURS */

const teamColours={
"Los Angeles Lakers":["#552583","#FDB927"],
"Boston Celtics":["#007A33","#BA9653"],
"Chicago Bulls":["#CE1141","#000"],
"Golden State Warriors":["#1D428A","#FFC72C"],
"Dallas Mavericks":["#00538C","#002B5E"],
"Miami Heat":["#98002E","#F9A01B"]
};

/* PAGE ELEMENTS */

const teamRaw=new URLSearchParams(window.location.search).get("team")||"";

const hero=document.getElementById("heroBox");
const teamName=document.getElementById("teamName");
const leadersBody=document.getElementById("leadersBody");
const gamesBody=document.getElementById("gamesBody");
const summaryBox=document.getElementById("summaryBox");

const PATH_SEASONS="/data/nba/seasons.json";
const PLAYERS_INDEX="/data/nba/players/index.json";

/* HERO COLOUR */

function setHero(team){

if(teamColours[team]){

const c=teamColours[team];

hero.style.background=
`linear-gradient(270deg,${c[0]},${c[1]},${c[0]})`;

}else{

hero.style.background="#17408B";

}

}

/* NAME NORMALISE */

function slug(name){

return name
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^\w\s-]/g,"")
.replace(/\s+/g,"-");

}

/* LOAD FRANCHISE LEADERS */

async function loadLeaders(){

const players=await fetch(PLAYERS_INDEX).then(r=>r.json());

let leaders={
pts:{player:"",value:0},
reb:{player:"",value:0},
ast:{player:"",value:0},
stl:{player:"",value:0},
blk:{player:"",value:0}
};

for(const name of players){

try{

const p=await fetch(`/data/nba/players/${slug(name)}.json`).then(r=>r.json());

if(!p.teams) continue;

const t=p.teams[teamRaw];

if(!t) continue;

if(t.pts>leaders.pts.value) leaders.pts={player:name,value:t.pts};
if(t.reb>leaders.reb.value) leaders.reb={player:name,value:t.reb};
if(t.ast>leaders.ast.value) leaders.ast={player:name,value:t.ast};
if(t.stl>leaders.stl.value) leaders.stl={player:name,value:t.stl};
if(t.blk>leaders.blk.value) leaders.blk={player:name,value:t.blk};

}catch(e){}

}

leadersBody.innerHTML=`
<tr><td>Points</td><td>${leaders.pts.player}</td><td>${leaders.pts.value.toLocaleString()}</td></tr>
<tr><td>Rebounds</td><td>${leaders.reb.player}</td><td>${leaders.reb.value.toLocaleString()}</td></tr>
<tr><td>Assists</td><td>${leaders.ast.player}</td><td>${leaders.ast.value.toLocaleString()}</td></tr>
<tr><td>Steals</td><td>${leaders.stl.player}</td><td>${leaders.stl.value.toLocaleString()}</td></tr>
<tr><td>Blocks</td><td>${leaders.blk.player}</td><td>${leaders.blk.value.toLocaleString()}</td></tr>
`;

}

/* REMOVE PRESEASON */

function isPreseason(type){

return (type||"").toLowerCase().includes("pre");

}

/* INIT */

async function init(){

teamName.textContent=teamRaw;

setHero(teamRaw);

await loadLeaders();

}

init();

</script>

</body>
</html>
