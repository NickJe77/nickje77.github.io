<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:auto;padding:30px 20px 60px;}

.team-header{
padding:30px;
border-radius:14px;
color:#fff;
text-align:center;
margin-bottom:25px;
background:#333;
}

.stats{display:flex;gap:20px;justify-content:center;margin-bottom:25px;flex-wrap:wrap;}
.stat{background:#fff;padding:14px 22px;border-radius:12px;text-align:center;min-width:120px;box-shadow:0 3px 8px rgba(0,0,0,0.05);}
.stat b{display:block;font-size:20px;}

table{width:100%;border-collapse:collapse;margin-bottom:40px;background:#fff;border-radius:12px;overflow:hidden;}
th,td{border-bottom:1px solid #eee;padding:10px;text-align:center;}
th{background:#f0f0f0;font-weight:700;}
tr:nth-child(even){background:#f9fbff;}
tr:hover{background:#eef4ff;}

.win{color:#008000;font-weight:700;}
.loss{color:#c00000;font-weight:700;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<div id="teamHeader" class="team-header"></div>

<div class="stats">
<div class="stat"><b id="games">0</b>Games</div>
<div class="stat"><b id="wins">0</b>Wins</div>
<div class="stat"><b id="losses">0</b>Losses</div>
<div class="stat"><b id="winpct">0.000</b>Win %</div>
</div>

<h2>Games</h2>
<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>

</div>

<script>

const BASE="data/nba/";
const params=new URLSearchParams(location.search);
const team=params.get("team");

document.getElementById("teamHeader").innerHTML="<h1>"+team+"</h1>";

async function loadTeam(){

const seasons = await fetch(BASE+"seasons.json").then(r=>r.json());

let games=[], wins=0, losses=0;

for(const season of seasons){

try{

const index=await fetch(BASE+season+"/index.json").then(r=>r.json());

for(const id of index.games){

const g=await fetch(BASE+season+"/"+id+".json").then(r=>r.json());

if(g.game_type==="Preseason") continue;
if(g.home_team!==team && g.away_team!==team) continue;

const isHome=g.home_team===team;
const teamScore=isHome?g.home_score:g.away_score;
const oppScore=isHome?g.away_score:g.home_score;

const result=teamScore>oppScore?"W":"L";
if(result==="W") wins++; else losses++;

games.push({
season,
date:g.date,
opponent:isHome?g.away_team:g.home_team,
result,
score:teamScore+" – "+oppScore,
game_id:g.game_id
});

}

}catch(e){}

}

render(games,wins,losses);
}

function render(games,wins,losses){

document.getElementById("games").textContent=games.length;
document.getElementById("wins").textContent=wins;
document.getElementById("losses").textContent=losses;
document.getElementById("winpct").textContent=games.length?(wins/games.length).toFixed(3):"0.000";

const body=document.getElementById("gamesBody");
body.innerHTML="";

games
.sort((a,b)=>new Date(b.date)-new Date(a.date))
.forEach(g=>{
body.innerHTML+=`
<tr onclick="location.href='nba-game.html?season=${g.season}&game=${g.game_id}'">
<td>${g.season}</td>
<td>${g.date}</td>
<td>${g.opponent}</td>
<td class="${g.result==='W'?'win':'loss'}">${g.result}</td>
<td>${g.score}</td>
</tr>`;
});

}

loadTeam();

</script>

</body>
</html>
