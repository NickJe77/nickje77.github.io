<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:6px;}
.subtitle{text-align:center;color:#666;margin-bottom:20px;}

.stats{
  display:flex;
  gap:20px;
  justify-content:center;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.stat{
  background:#f4f6fb;
  padding:12px 18px;
  border-radius:10px;
  text-align:center;
  min-width:120px;
}
.stat b{display:block;font-size:18px;}

.filters{
  text-align:center;
  margin-bottom:20px;
}

select{
  padding:8px 14px;
  font-size:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:40px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:center;
}
th{
  background:#f0f0f0;
  position:sticky;
  top:0;
}
tr:nth-child(even){background:#f6f9ff;}
tr:hover{background:#e9f0ff;}

a{color:#0056d6;text-decoration:none;font-weight:600;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="teamName"></h1>
<div class="subtitle">Franchise History (Regular Season)</div>

<div class="filters">
  Season:
  <select id="seasonFilter">
    <option value="">All Seasons</option>
  </select>
</div>

<div class="stats">
  <div class="stat"><b id="seasons">0</b>Seasons</div>
  <div class="stat"><b id="games">0</b>Games</div>
  <div class="stat"><b id="wins">0</b>Wins</div>
  <div class="stat"><b id="losses">0</b>Losses</div>
  <div class="stat"><b id="pf">0</b>Points For</div>
  <div class="stat"><b id="pa">0</b>Points Against</div>
</div>

<h2>Season Summary</h2>
<table>
<thead>
<tr>
  <th>Season</th>
  <th>Games</th>
  <th>Wins</th>
  <th>Losses</th>
  <th>PF</th>
  <th>PA</th>
</tr>
</thead>
<tbody id="seasonTable"></tbody>
</table>

<h2>Players</h2>
<table>
<thead>
<tr>
  <th>Player</th>
  <th>Games</th>
  <th>Points</th>
  <th>Rebounds</th>
  <th>Assists</th>
</tr>
</thead>
<tbody id="playersTable"></tbody>
</table>

<h2>Games (Regular Season)</h2>
<table>
<thead>
<tr>
  <th>Season</th>
  <th>Date</th>
  <th>Game</th>
  <th>Result</th>
  <th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const team = params.get("team");
document.getElementById("teamName").textContent = team;

const seasonFilter = document.getElementById("seasonFilter");

const seasonFiles = [
  "nba_season_1976_77.json",
  "nba_season_1977_78.json",
  "nba_season_1978_79.json",
  "nba_season_1979_80.json",
  "nba_season_2023_24.json"
];

let games = [];
let seasonStats = {};
let playerStats = {};
let seasonsSet = new Set();

function isPlayoffGame(g){
  return g.playoff === true || g.is_playoff === true || g.round === "Playoffs";
}

async function loadTeam(){
  for(const file of seasonFiles){
    try{
      const res = await fetch("data/nba/" + file);
      const data = await res.json();

      data.games.forEach((g, index)=>{
        if(isPlayoffGame(g)) return;

        const isHome = g.home_team === team;
        const isAway = g.away_team === team;
        if(!isHome && !isAway) return;

        const season = data.season;
        seasonsSet.add(season);

        if(!seasonStats[season]){
          seasonStats[season] = { games:0, wins:0, losses:0, pf:0, pa:0 };
        }

        const teamScore = isHome ? g.home_points : g.away_points;
        const oppScore = isHome ? g.away_points : g.home_points;
        const result = teamScore > oppScore ? "W" : "L";

        seasonStats[season].games++;
        seasonStats[season].pf += teamScore;
        seasonStats[season].pa += oppScore;
        if(result==="W") seasonStats[season].wins++;
        else seasonStats[season].losses++;

        if(Array.isArray(g.players)){
          g.players.forEach(p=>{
            if(p.team !== team) return;

            if(!playerStats[p.player]){
              playerStats[p.player] = { games:0, pts:0, reb:0, ast:0 };
            }
            playerStats[p.player].games++;
            playerStats[p.player].pts += p.pts||0;
            playerStats[p.player].reb += p.reb||0;
            playerStats[p.player].ast += p.ast||0;
          });
        }

        games.push({
          season: season,
          seasonParam: file.replace("nba_season_","").replace(".json",""),
          date: g.date || "",
          game: g.home_team + " vs " + g.away_team,
          result: result,
          score: teamScore + " – " + oppScore,
          gameIndex: index
        });
      });

    }catch(e){}
  }

  seasonsSet.forEach(s=>{
    const o=document.createElement("option");
    o.value=s;
    o.textContent=s;
    seasonFilter.appendChild(o);
  });

  render();
}

function render(){
  const seasonVal = seasonFilter.value;

  let totalGames=0,wins=0,losses=0,pf=0,pa=0;

  Object.entries(seasonStats).forEach(([s,v])=>{
    if(seasonVal && s!==seasonVal) return;
    totalGames+=v.games;
    wins+=v.wins;
    losses+=v.losses;
    pf+=v.pf;
    pa+=v.pa;
  });

  document.getElementById("seasons").textContent = seasonVal?1:seasonsSet.size;
  document.getElementById("games").textContent = totalGames;
  document.getElementById("wins").textContent = wins;
  document.getElementById("losses").textContent = losses;
  document.getElementById("pf").textContent = pf;
  document.getElementById("pa").textContent = pa;

  const seasonBody = document.getElementById("seasonTable");
  seasonBody.innerHTML="";
  Object.entries(seasonStats).forEach(([s,v])=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${s}</td>
      <td>${v.games}</td>
      <td>${v.wins}</td>
      <td>${v.losses}</td>
      <td>${v.pf}</td>
      <td>${v.pa}</td>
    `;
    seasonBody.appendChild(tr);
  });

  const playersBody = document.getElementById("playersTable");
  playersBody.innerHTML="";
  Object.entries(playerStats)
    .sort((a,b)=>b[1].pts-a[1].pts)
    .forEach(([name,v])=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td><a href="nba-player.html?player=${encodeURIComponent(name)}">${name}</a></td>
        <td>${v.games}</td>
        <td>${v.pts}</td>
        <td>${v.reb}</td>
        <td>${v.ast}</td>
      `;
      playersBody.appendChild(tr);
    });

  const gamesBody = document.getElementById("gamesTable");
  gamesBody.innerHTML="";
  games
    .filter(g=>!seasonVal || g.season===seasonVal)
    .forEach(g=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${g.season}</td>
        <td>${g.date}</td>
        <td>${g.game}</td>
        <td>${g.result}</td>
        <td>${g.score}</td>
      `;
      gamesBody.appendChild(tr);
    });
}

seasonFilter.addEventListener("change",render);
loadTeam();
</script>

</body>
</html>
