<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
  --soft:#eef2ff;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  background-size:400% 400%;
  animation:fadeGradient 10s ease infinite;
  color:#fff;
  padding:36px;
  border-radius:22px;
  margin-bottom:16px;
}

@keyframes fadeGradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.top-row{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  align-items:stretch;
  margin-bottom:16px;
}

/* ✅ COMPACT STATS */
.stats{
  flex:1;
  min-width:280px;
  background:var(--card);
  padding:14px 18px;
  border-radius:16px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  display:flex;
  gap:22px;
  align-items:center;
  font-size:15px;
  white-space:nowrap;
}

.stats strong{
  font-size:16px;
}

/* ✅ COMPACT LEADERS */
.leaders-card{
  flex:1.2;
  min-width:340px;
  background:var(--card);
  padding:16px 18px;
  border-radius:16px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.leaders-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.leaders-head h2{
  margin:0;
  font-size:15px;
  letter-spacing:.6px;
  text-transform:uppercase;
}

.leaders-actions{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.btn{
  border:none;
  background:var(--nba-primary);
  color:#fff;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
  font-size:12px;
}
.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.btn.secondary{
  background:#e9edf7;
  color:#0b1220;
  border:1px solid var(--line);
}

.leaders-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:8px;
  margin-top:10px;
}

.leader-box{
  background:var(--soft);
  padding:10px 12px;
  border-radius:12px;
  border:1px solid #dfe6ff;
}

.leader-label{
  font-weight:800;
  font-size:11px;
  letter-spacing:.6px;
  text-transform:uppercase;
  opacity:.8;
}

.leader-player{
  margin-top:4px;
  font-weight:800;
  font-size:14px;
}

.leader-total{
  margin-top:2px;
  font-size:13px;
  color:#333;
  font-weight:700;
}

.progress-wrap{
  margin-top:10px;
  background:#f3f5fb;
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 10px;
  display:none;
}

.progress-bar{
  height:8px;
  background:#dde3f5;
  border-radius:99px;
  overflow:hidden;
  margin-top:6px;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--nba-primary),var(--nba-secondary));
}

.progress-text{
  font-size:11px;
  color:#444;
  font-weight:700;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.season-box{
  background:var(--card);
  padding:16px;
  border-radius:16px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  margin-bottom:16px;
}

.season-box select{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid var(--line);
  font-size:15px;
}

.card{
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--nba-primary);
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid var(--line);
}

tr:nth-child(even){
  background:#f6f9ff;
}

tr:hover{
  background:#eef2ff;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="teamName"></h1>
  </div>

  <div class="top-row">
    <div class="stats">
      <div>Total Games: <strong id="totalGames">0</strong></div>
      <div>Wins: <strong id="wins">0</strong></div>
      <div>Losses: <strong id="losses">0</strong></div>
    </div>

    <div class="leaders-card">
      <div class="leaders-head">
        <h2>All-Time Franchise Leaders</h2>
        <div class="leaders-actions">
          <button class="btn" id="btnLoadLeaders">Load Leaders</button>
          <button class="btn secondary" id="btnClearCache">Clear Cache</button>
        </div>
      </div>

      <div class="leaders-grid" id="leadersGrid">
        <div class="leader-box">
          <div class="leader-label">Status</div>
          <div class="leader-player" id="leadersStatus">Not loaded</div>
          <div class="leader-total" style="opacity:.75;">Click “Load Leaders”</div>
        </div>
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-text">
          <div id="progressLeft">Preparing…</div>
          <div id="progressRight">0%</div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="season-box">
    <strong>Select Season:</strong>
    <select id="seasonSelect">
      <option value="all">All Seasons</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Season</th>
          <th>Opponent</th>
          <th>Result</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

</body>
</html>
