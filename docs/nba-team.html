<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
}

body{
  font-family:Inter,Arial;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}

.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  color:#fff;
  padding:34px;
  border-radius:22px;
  margin-bottom:20px;
}

.hero h1{
  margin:0;
  font-size:36px;
}

/* leaders */

.leaders-card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
}

.leaders-card h3{
  margin:0 0 12px;
}

.leaders-table{
  width:100%;
  border-collapse:collapse;
}

.leaders-table td{
  padding:8px;
  border-bottom:1px solid #eee;
}

.leaders-table td:nth-child(1){
  font-weight:600;
  width:120px;
}

.leaders-table td:nth-child(3){
  text-align:right;
  font-weight:700;
}

.leaders-table a{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}

.leaders-table a:hover{
  text-decoration:underline;
}

/* filters */

.filter-box{
  background:var(--card);
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  align-items:center;
}

select{
  padding:8px 10px;
  border:1px solid #cfd6e3;
  border-radius:10px;
  font-size:14px;
}

/* table */

.card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--nba-primary);
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid var(--line);
}

tr:hover{
  background:#eef2ff;
  cursor:pointer;
}

.loading{
  background:#fff;
  padding:10px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  margin-bottom:16px;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
<h1 id="teamName">Loading…</h1>
</div>

<div class="leaders-card">
<h3>Franchise Leaders</h3>
<table class="leaders-table">
<tbody id="leadersBody">
<tr><td colspan="3">Loading leaders…</td></tr>
</tbody>
</table>
</div>

<div class="loading" id="loadingBox">Loading games…</div>

<div class="filter-box">

<label>
Season:
<select id="seasonSelect"></select>
</label>

<label>
Type:
<select id="typeSelect">
<option value="all">All</option>
<option value="regular">Regular Season</option>
<option value="playoffs">Playoffs</option>
</select>
</label>

</div>

<div class="card">
<table>
<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Type</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>
</div>

</div>

<script>

const BASE="/data/nba/";
const teamRaw=new URLSearchParams(location.search).get("team")||"";

const seasonSelect=document.getElementById("seasonSelect");
const typeSelect=document.getElementById("typeSelect");
const gamesBody=document.getElementById("gamesBody");
const loadingBox=document.getElementById("loadingBox");
const teamName=document.getElementById("teamName");
const leadersBody=document.getElementById("leadersBody");

let season=2025;
let allGames=[];

function norm(s){
return (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
}

function seasonLabel(start){
const next=String((Number(start)+1)%100).padStart(2,"0");
return `${start}-${next}`;
}

/* LEADERS */

async function loadLeaders(){

try{

const data=await fetch("/data/nba/team-leaders.json").then(r=>r.json());

if(!data[teamRaw]){
leadersBody.innerHTML="<tr><td colspan='3'>No data</td></tr>";
return;
}

leadersBody.innerHTML="";

const leaders=data[teamRaw];

for(const stat in leaders){

const row=leaders[stat];

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${stat}</td>
<td><a href="nba-player.html?player=${encodeURIComponent(row.player)}">${row.player}</a></td>
<td>${row.value}</td>
`;

leadersBody.appendChild(tr);

}

}catch{

leadersBody.innerHTML="<tr><td colspan='3'>Error loading leaders</td></tr>";

}

}

/* LOAD SEASON */

async function loadSeason(){

loadingBox.style.display="block";
gamesBody.innerHTML="";

try{

let res=await fetch(`${BASE}${season}/games.json?${Date.now()}`);

if(res.ok){

allGames=await res.json();

}else{

const index=await fetch(`${BASE}${season}/index.json`).then(r=>r.json());

const ids=index.games||[];

allGames=await Promise.all(
ids.map(id=>fetch(`${BASE}${season}/${id}.json`).then(r=>r.json()))
);

}

}catch{

gamesBody.innerHTML="<tr><td colspan='6'>Error loading games</td></tr>";
return;

}

renderGames();
loadingBox.style.display="none";

}

/* RENDER */

function renderGames(){

gamesBody.innerHTML="";

const typeFilter=typeSelect.value;
const teamKey=norm(teamRaw);

const filtered=allGames.filter(g=>{

const type=(g.game_type||"").toLowerCase();

if(type.includes("preseason")) return false;

if(typeFilter==="regular" && !type.includes("regular")) return false;
if(typeFilter==="playoffs" && !type.includes("playoff")) return false;

const home=norm(g.home_team);
const away=norm(g.away_team);

return home===teamKey || away===teamKey;

});

filtered.sort((a,b)=>b.date.localeCompare(a.date));

filtered.forEach(g=>{

const home=norm(g.home_team)===teamKey;

const teamScore=home?g.home_score:g.away_score;
const oppScore=home?g.away_score:g.home_score;

const result=teamScore>oppScore?"W":"L";

const opponent=home?g.away_team:g.home_team;

const tr=document.createElement("tr");

tr.onclick=()=>{
location.href=`/nba-game.html?season=${season}&game=${g.game_id}`;
};

tr.innerHTML=`

<td>${(g.date||"").substring(0,10)}</td>
<td>${seasonLabel(season)}</td>
<td>${g.game_type||""}</td>
<td>${opponent}</td>
<td>${result}</td>
<td>${teamScore} - ${oppScore}</td>

`;

gamesBody.appendChild(tr);

});

}

/* INIT */

async function init(){

teamName.textContent=teamRaw;

for(let y=1976;y<=2026;y++){

const opt=document.createElement("option");
opt.value=y;
opt.textContent=seasonLabel(y);

seasonSelect.appendChild(opt);

}

seasonSelect.value=season;

seasonSelect.onchange=()=>{
season=seasonSelect.value;
loadSeason();
};

typeSelect.onchange=renderGames;

await loadSeason();
loadLeaders();

}

init();

</script>

</body>
</html>
