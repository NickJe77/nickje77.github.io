<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
  --soft:#eef2ff;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  background-size:400% 400%;
  animation:fadeGradient 10s ease infinite;
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:18px;
}

@keyframes fadeGradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.top-row{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  align-items:stretch;
  margin-bottom:18px;
}

.stats{
  flex:1;
  min-width:280px;
  background:var(--card);
  padding:18px 20px;
  border-radius:18px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  display:flex;
  gap:26px;
  align-items:center;
  flex-wrap:wrap;
  font-size:16px;
}

.stats strong{font-size:18px;}

.leaders-card{
  flex:1.2;
  min-width:340px;
  background:var(--card);
  padding:18px 20px;
  border-radius:18px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.leaders-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  flex-wrap:wrap;
}

.leaders-head h2{
  margin:0;
  font-size:16px;
  letter-spacing:.6px;
  text-transform:uppercase;
}

.leaders-actions{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.btn{
  border:none;
  background:var(--nba-primary);
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  font-size:13px;
}
.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.btn.secondary{
  background:#e9edf7;
  color:#0b1220;
  border:1px solid var(--line);
}

.leaders-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
  margin-top:12px;
}

.leader-box{
  background:var(--soft);
  padding:12px;
  border-radius:12px;
  border:1px solid #dfe6ff;
}

.leader-label{
  font-weight:800;
  font-size:12px;
  letter-spacing:.7px;
  text-transform:uppercase;
  opacity:.85;
}

.leader-player{
  margin-top:6px;
  font-weight:800;
  font-size:14px;
}
.leader-total{
  margin-top:4px;
  color:#333;
  font-weight:700;
}

.progress-wrap{
  margin-top:10px;
  background:#f3f5fb;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  display:none;
}

.progress-bar{
  height:10px;
  background:#dde3f5;
  border-radius:99px;
  overflow:hidden;
  margin-top:8px;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--nba-primary),var(--nba-secondary));
}

.progress-text{
  font-size:12px;
  color:#444;
  font-weight:700;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.season-box{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  margin-bottom:18px;
}

.season-box select{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  font-size:16px;
}

.card{
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--nba-primary);
  color:#fff;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid var(--line);
}

tr:nth-child(even){
  background:#f6f9ff;
}

tr:hover{
  background:#eef2ff;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="teamName"></h1>
  </div>

  <div class="top-row">
    <div class="stats">
      <div>Total Games: <strong id="totalGames">0</strong></div>
      <div>Wins: <strong id="wins">0</strong></div>
      <div>Losses: <strong id="losses">0</strong></div>
    </div>

    <div class="leaders-card">
      <div class="leaders-head">
        <h2>All-Time Franchise Leaders</h2>
        <div class="leaders-actions">
          <button class="btn" id="btnLoadLeaders">Load Leaders</button>
          <button class="btn secondary" id="btnClearCache" title="Clear saved leaders for this team">Clear Cache</button>
        </div>
      </div>

      <div class="leaders-grid" id="leadersGrid">
        <div class="leader-box">
          <div class="leader-label">Status</div>
          <div class="leader-player" id="leadersStatus">Not loaded</div>
          <div class="leader-total" style="opacity:.75;">Click “Load Leaders”</div>
        </div>
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-text">
          <div id="progressLeft">Preparing…</div>
          <div id="progressRight">0%</div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="season-box">
    <strong>Select Season:</strong>
    <select id="seasonSelect">
      <option value="all">All Seasons</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Season</th>
          <th>Opponent</th>
          <th>Result</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const team = (params.get("team") || "").trim();
document.getElementById("teamName").textContent = team;

const clean = s => (s || "").toLowerCase().trim();

function seasonLabel(start){
  const next = String((start+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}

let allGames = [];
let seasons = new Set();
let masterGamesForTeam = []; // {season, game_id, home_team, away_team, home_score, away_score, date?, game_type}

const gamesBody = document.getElementById("gamesBody");
const seasonSelect = document.getElementById("seasonSelect");

const btnLoadLeaders = document.getElementById("btnLoadLeaders");
const btnClearCache = document.getElementById("btnClearCache");
const leadersGrid = document.getElementById("leadersGrid");
const leadersStatus = document.getElementById("leadersStatus");

const progressWrap = document.getElementById("progressWrap");
const progressFill = document.getElementById("progressFill");
const progressLeft = document.getElementById("progressLeft");
const progressRight = document.getElementById("progressRight");

function setProgress(show, leftText, pct){
  progressWrap.style.display = show ? "block" : "none";
  if(leftText != null) progressLeft.textContent = leftText;
  if(pct != null){
    const p = Math.max(0, Math.min(100, pct));
    progressFill.style.width = p + "%";
    progressRight.textContent = p.toFixed(0) + "%";
  }
}

function cacheKeyForTeam(){
  // bump version if you change logic
  return `tsa_nba_leaders_v2__${team}`;
}

function renderLeaders(leaders){
  // leaders: {points:{player,total}, rebounds:{...}, assists:{...}, steals:{...}}
  const box = (label, obj) => `
    <div class="leader-box">
      <div class="leader-label">${label}</div>
      <div class="leader-player">${obj?.player || "-"}</div>
      <div class="leader-total">${(obj?.total ?? 0).toLocaleString()}</div>
    </div>
  `;

  leadersGrid.innerHTML = `
    ${box("Points", leaders.points)}
    ${box("Rebounds", leaders.rebounds)}
    ${box("Assists", leaders.assists)}
    ${box("Steals", leaders.steals)}
  `;
  leadersStatus.textContent = "Loaded";
}

function renderLeadersStatus(msg){
  leadersGrid.innerHTML = `
    <div class="leader-box">
      <div class="leader-label">Status</div>
      <div class="leader-player">${msg}</div>
      <div class="leader-total" style="opacity:.75;"> </div>
    </div>
  `;
  leadersStatus.textContent = msg;
}

async function loadMasterAndRenderGames(){
  // IMPORTANT: relative path (no leading slash)
  const res = await fetch("data/nba/nba_games_master.json");
  if(!res.ok) throw new Error("nba_games_master.json not found");
  const master = await res.json();

  const t = clean(team);

  for(const game of master){
    const gt = game.game_type || "Regular Season";
    if(gt !== "Regular Season" && gt !== "Playoffs") continue;

    const home = clean(game.home_team);
    const away = clean(game.away_team);
    if(home !== t && away !== t) continue;

    masterGamesForTeam.push(game);

    seasons.add(game.season);

    const isHome = home === t;
    const teamScore = isHome ? game.home_score : game.away_score;
    const oppScore  = isHome ? game.away_score : game.home_score;

    allGames.push({
      id: game.game_id,
      date: game.date || "",          // if missing, still ok
      season: game.season,
      opponent: isHome ? game.away_team : game.home_team,
      result: teamScore > oppScore ? "W" : "L",
      score: `${teamScore} - ${oppScore}`
    });
  }

  // build selector
  Array.from(seasons).sort((a,b)=>b-a).forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = seasonLabel(s);
    seasonSelect.appendChild(opt);
  });

  seasonSelect.addEventListener("change", e => renderGames(e.target.value));

  renderGames("all");

  // if cached leaders exist, show them instantly
  try{
    const cached = localStorage.getItem(cacheKeyForTeam());
    if(cached){
      const leaders = JSON.parse(cached);
      renderLeaders(leaders);
    }
  }catch(e){}
}

function renderGames(selectedSeason){
  gamesBody.innerHTML = "";

  const filtered = selectedSeason === "all"
    ? allGames
    : allGames.filter(g => String(g.season) === String(selectedSeason));

  // sort newest first if date exists, otherwise just keep order
  filtered.sort((a,b)=>{
    const da = Date.parse(a.date || "");
    const db = Date.parse(b.date || "");
    if(!isNaN(da) && !isNaN(db)) return db - da;
    return 0;
  });

  let wins = 0, losses = 0;

  for(const g of filtered){
    if(g.result === "W") wins++; else losses++;

    const tr = document.createElement("tr");
    tr.onclick = () => location.href = `nba-game.html?game=${g.id}`;
    tr.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${seasonLabel(Number(g.season))}</td>
      <td>${g.opponent}</td>
      <td>${g.result}</td>
      <td>${g.score}</td>
    `;
    gamesBody.appendChild(tr);
  }

  document.getElementById("totalGames").textContent = filtered.length;
  document.getElementById("wins").textContent = wins;
  document.getElementById("losses").textContent = losses;
}

function pickLeader(totalsByPlayer, statKey){
  let bestName = "";
  let bestVal = -1;
  for(const [name, stats] of Object.entries(totalsByPlayer)){
    const v = stats[statKey] || 0;
    if(v > bestVal){
      bestVal = v;
      bestName = name;
    }
  }
  return { player: bestName, total: Math.max(0, bestVal) };
}

// concurrency pool
async function poolMap(items, concurrency, mapper, onProgress){
  let i = 0;
  let done = 0;
  const results = new Array(items.length);

  async function worker(){
    while(true){
      const idx = i++;
      if(idx >= items.length) break;
      results[idx] = await mapper(items[idx], idx);
      done++;
      if(onProgress) onProgress(done, items.length);
    }
  }

  const workers = Array.from({length: Math.min(concurrency, items.length)}, () => worker());
  await Promise.all(workers);
  return results;
}

async function computeLeadersForTeam(){
  if(!masterGamesForTeam.length){
    renderLeadersStatus("No games found for team");
    return;
  }

  btnLoadLeaders.disabled = true;
  btnClearCache.disabled = true;

  renderLeadersStatus("Loading…");
  setProgress(true, "Preparing game list…", 0);

  // Only fetch game files for THIS team (still a lot, but not whole league)
  const t = clean(team);

  const gamesToFetch = masterGamesForTeam
    .filter(g => (g.game_type === "Regular Season" || g.game_type === "Playoffs"))
    .map(g => ({ season: g.season, game_id: g.game_id }));

  const totalsByPlayer = {}; // name -> {points, rebounds, assists, steals}

  const CONCURRENCY = 24; // safe-ish on GitHub Pages

  let lastPct = -1;

  await poolMap(
    gamesToFetch,
    CONCURRENCY,
    async (g) => {
      // relative path
      const url = `data/nba/${g.season}/${g.game_id}.json`;
      try{
        const r = await fetch(url);
        if(!r.ok) return null;
        const full = await r.json();

        const gt = full.game_type;
        if(gt !== "Regular Season" && gt !== "Playoffs") return null;

        const players = full.players || [];
        for(const p of players){
          // your per-game format uses: player_name, points, rebounds, assists, steals
          const pTeam = p.team;
          if(clean(pTeam) !== t) continue;

          const name = (p.player_name || p.player || "").trim();
          if(!name) continue;

          if(!totalsByPlayer[name]){
            totalsByPlayer[name] = {points:0, rebounds:0, assists:0, steals:0};
          }

          totalsByPlayer[name].points   += Number(p.points   ?? p.pts ?? 0) || 0;
          totalsByPlayer[name].rebounds += Number(p.rebounds ?? p.reb ?? 0) || 0;
          totalsByPlayer[name].assists  += Number(p.assists  ?? p.ast ?? 0) || 0;
          totalsByPlayer[name].steals   += Number(p.steals   ?? p.stl ?? 0) || 0;
        }

        return true;
      }catch(e){
        return null;
      }
    },
    (done, total) => {
      const pct = total ? (done/total)*100 : 0;
      const pctInt = Math.floor(pct);
      if(pctInt !== lastPct){
        lastPct = pctInt;
        setProgress(true, `Computing leaders… ${done.toLocaleString()} / ${total.toLocaleString()} games`, pct);
      }
    }
  );

  // if nothing aggregated, show message
  if(!Object.keys(totalsByPlayer).length){
    setProgress(false);
    renderLeadersStatus("No player stats found for this team");
    btnLoadLeaders.disabled = false;
    btnClearCache.disabled = false;
    return;
  }

  const leaders = {
    points:   pickLeader(totalsByPlayer, "points"),
    rebounds: pickLeader(totalsByPlayer, "rebounds"),
    assists:  pickLeader(totalsByPlayer, "assists"),
    steals:   pickLeader(totalsByPlayer, "steals")
  };

  // cache for instant future loads
  try{
    localStorage.setItem(cacheKeyForTeam(), JSON.stringify(leaders));
  }catch(e){}

  setProgress(false);
  renderLeaders(leaders);

  btnLoadLeaders.disabled = false;
  btnClearCache.disabled = false;
}

btnLoadLeaders.addEventListener("click", computeLeadersForTeam);

btnClearCache.addEventListener("click", ()=>{
  try{ localStorage.removeItem(cacheKeyForTeam()); }catch(e){}
  renderLeadersStatus("Cache cleared (click Load Leaders)");
});

loadMasterAndRenderGames().catch(()=>{
  gamesBody.innerHTML = "<tr><td colspan='5'>Failed to load team data</td></tr>";
  renderLeadersStatus("Failed to load master");
});
</script>

</body>
</html>
