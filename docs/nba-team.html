<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
}
body{
  font-family:Inter,Arial;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}

.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  color:#fff;
  padding:34px;
  border-radius:22px;
  margin-bottom:20px;
}

.hero h1{
  margin:0;
  font-size:36px;
}

/* leaders */

.leaders-card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
}

.leaders-card h3{
  margin:0 0 12px;
}

.leaders-table{
  width:100%;
  border-collapse:collapse;
}

.leaders-table td{
  padding:8px;
  border-bottom:1px solid #eee;
}

.leaders-table td:nth-child(1){
  font-weight:600;
  width:120px;
}

.leaders-table td:nth-child(3){
  text-align:right;
  font-weight:700;
}

.leaders-table a{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}

.leaders-table a:hover{
  text-decoration:underline;
}

/* filter */

.filter-box{
  background:var(--card);
  padding:16px;
  border-radius:16px;
  margin-bottom:16px;
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  align-items:center;
}

.card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--nba-primary);
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid var(--line);
}

tr:hover{
  background:#eef2ff;
  cursor:pointer;
}

.loading{
  background:#fff;
  padding:10px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  margin-bottom:16px;
}

select,input{
  padding:8px 10px;
  border:1px solid #cfd6e3;
  border-radius:10px;
  font-size:14px;
  background:#fff;
}

.search-wrapper{
  position:relative;
  margin-left:auto;
}

.search-results{
  position:absolute;
  top:38px;
  left:0;
  right:0;
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
  max-height:220px;
  overflow-y:auto;
  display:none;
  z-index:1000;
}

.search-item{
  padding:8px 12px;
  cursor:pointer;
}

.search-item:hover{
  background:#eef2ff;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero" id="heroBox">
<h1 id="teamName">Loading…</h1>
</div>

<div class="leaders-card">
<h3>Franchise Leaders</h3>
<table class="leaders-table">
<tbody id="leadersBody">
<tr><td colspan="3">Loading leaders…</td></tr>
</tbody>
</table>
</div>

<div class="loading" id="loadingBox">Loading games…</div>

<div class="filter-box">

<label>
Season:
<select id="seasonSelect"></select>
</label>

<label>
Type:
<select id="typeSelect">
<option value="all">All</option>
<option value="regular">Regular Season</option>
<option value="playoffs">Playoffs</option>
</select>
</label>

<div class="search-wrapper">
<input type="text" id="teamSearch" placeholder="Search team…">
<div class="search-results" id="searchResults"></div>
</div>

</div>

<div class="card">
<table>
<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Type</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>

</div>

<script>
const teamRaw = new URLSearchParams(window.location.search).get("team") || "";
const PATH_SEASONS = "/data/nba/seasons.json";

function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
function seasonLabel(start){
  const next = String((Number(start)+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}
function typeBucket(t){
  if(!t) return "regular";
  const s = t.toLowerCase();
  if(s.includes("regular")) return "regular";
  return "playoffs";
}
function slug(name){
  return (name||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\w\s-]/g,"")
    .replace(/\s+/g,"-");
}

const teamColours = {
  "Atlanta Hawks":["#E03A3E","#C1D32F"],
  "Boston Celtics":["#007A33","#BA9653"],
  "Brooklyn Nets":["#000000","#6C6C6C"],
  "Charlotte Hornets":["#1D1160","#00788C"],
  "Chicago Bulls":["#CE1141","#000000"],
  "Cleveland Cavaliers":["#860038","#FDBB30"],
  "Dallas Mavericks":["#00538C","#002B5E"],
  "Denver Nuggets":["#0E2240","#FEC524"],
  "Detroit Pistons":["#C8102E","#1D42BA"],
  "Golden State Warriors":["#1D428A","#FFC72C"],
  "Houston Rockets":["#CE1141","#000000"],
  "Indiana Pacers":["#002D62","#FDBB30"],
  "Los Angeles Clippers":["#C8102E","#1D428A"],
  "Los Angeles Lakers":["#552583","#FDB927"],
  "Memphis Grizzlies":["#5D76A9","#12173F"],
  "Miami Heat":["#98002E","#F9A01B"],
  "Milwaukee Bucks":["#00471B","#EEE1C6"],
  "Minnesota Timberwolves":["#0C2340","#236192"],
  "New Orleans Pelicans":["#0C2340","#C8102E"],
  "New York Knicks":["#006BB6","#F58426"],
  "Oklahoma City Thunder":["#007AC1","#EF3B24"],
  "Orlando Magic":["#0077C0","#C4CED4"],
  "Philadelphia 76ers":["#006BB6","#ED174C"],
  "Phoenix Suns":["#1D1160","#E56020"],
  "Portland Trail Blazers":["#E03A3E","#000000"],
  "Sacramento Kings":["#5A2D81","#63727A"],
  "San Antonio Spurs":["#C4CED4","#000000"],
  "Toronto Raptors":["#CE1141","#000000"],
  "Utah Jazz":["#002B5C","#F9A01B"],
  "Washington Wizards":["#002B5C","#E31837"]
};

const elTeamName=document.getElementById("teamName");
const elHero=document.getElementById("heroBox");
const elLoading=document.getElementById("loadingBox");
const elSeason=document.getElementById("seasonSelect");
const elType=document.getElementById("typeSelect");
const elBody=document.getElementById("gamesBody");
const elSearch=document.getElementById("teamSearch");
const elSearchResults=document.getElementById("searchResults");
const elLeaders=document.getElementById("leadersBody");

let allGames=[];
let currentSeason=null;
let allTeams=new Set();

function setHeroColours(team){
  if(teamColours[team]){
    const c=teamColours[team];
    elHero.style.background=`linear-gradient(270deg,${c[0]},${c[1]},${c[0]})`;
  }
}

function render(){
  let filtered=allGames;

  if(elType.value!=="all"){
    filtered=filtered.filter(g=>g.type===elType.value);
  }

  filtered.sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  elBody.innerHTML="";

  for(const g of filtered){
    const tr=document.createElement("tr");

    tr.onclick=()=>{
      if(!g.id) return;
      location.href=`nba-game.html?season=${currentSeason}&game=${g.id}`;
    };

    tr.innerHTML=`
      <td>${g.date}</td>
      <td>${seasonLabel(currentSeason)}</td>
      <td>${g.typeLabel}</td>
      <td>${g.opponent}</td>
      <td>${g.result}</td>
      <td>${g.score}</td>`;

    elBody.appendChild(tr);
  }

  if(!filtered.length){
    elBody.innerHTML="<tr><td colspan='6'>No games found.</td></tr>";
  }
}

function getMatchingTeamTotals(playerData, targetTeam){
  if(!playerData || !playerData.teams) return null;

  const targetKey = norm(targetTeam);

  for(const teamName in playerData.teams){
    if(norm(teamName) === targetKey){
      return playerData.teams[teamName];
    }
  }

  return null;
}

async function loadLeaders(){
  elLeaders.innerHTML="<tr><td colspan='3'>Loading leaders…</td></tr>";

  const leaders={
    pts:{player:"",value:0},
    reb:{player:"",value:0},
    ast:{player:"",value:0},
    stl:{player:"",value:0},
    blk:{player:"",value:0}
  };

  try{
    const res = await fetch("/data/nba/players/index.json");
    if(!res.ok){
      elLeaders.innerHTML="<tr><td colspan='3'>Leaders unavailable</td></tr>";
      return;
    }

    const players = await res.json();

    for(const name of players){
      try{
        const playerRes = await fetch(`/data/nba/players/${slug(name)}.json`);
        if(!playerRes.ok) continue;

        const playerData = await playerRes.json();
        const t = getMatchingTeamTotals(playerData, teamRaw);

        if(!t) continue;

        if((t.pts||0) > leaders.pts.value) leaders.pts={player:name,value:t.pts||0};
        if((t.reb||0) > leaders.reb.value) leaders.reb={player:name,value:t.reb||0};
        if((t.ast||0) > leaders.ast.value) leaders.ast={player:name,value:t.ast||0};
        if((t.stl||0) > leaders.stl.value) leaders.stl={player:name,value:t.stl||0};
        if((t.blk||0) > leaders.blk.value) leaders.blk={player:name,value:t.blk||0};
      }catch(e){}
    }

    const rows = [
      ["Points","pts"],
      ["Rebounds","reb"],
      ["Assists","ast"],
      ["Steals","stl"],
      ["Blocks","blk"]
    ];

    let html="";

    for(const [label,key] of rows){
      const item=leaders[key];
      html += `
        <tr>
          <td>${label}</td>
          <td>${item.player ? `<a href="nba-player.html?player=${encodeURIComponent(item.player)}">${item.player}</a>` : ""}</td>
          <td>${Number(item.value||0).toLocaleString()}</td>
        </tr>`;
    }

    elLeaders.innerHTML = html;
  }catch(e){
    elLeaders.innerHTML="<tr><td colspan='3'>Leaders unavailable</td></tr>";
  }
}

async function loadSeason(season){
  currentSeason=Number(season);
  allGames=[];
  elLoading.style.display="block";

  const indexRaw=await fetch(`/data/nba/${season}/index.json`).then(r=>r.json());
  const gameIds=indexRaw.games || [];
  const teamKey=norm(teamRaw);

  const games=await Promise.all(
    gameIds.map(id=>
      fetch(`/data/nba/${season}/${id}.json`)
      .then(r=>r.json())
      .catch(()=>null)
    )
  );

  for(const g of games){
    if(!g) continue;

    /* remove preseason */
    if((g.game_type||"").toLowerCase().includes("pre")) continue;

    allTeams.add(g.home_team);
    allTeams.add(g.away_team);

    const home=norm(g.home_team);
    const away=norm(g.away_team);

    if(!home.includes(teamKey) && !away.includes(teamKey)) continue;

    const isHome=home.includes(teamKey);
    const teamScore=isHome?g.home_score:g.away_score;
    const oppScore=isHome?g.away_score:g.home_score;

    allGames.push({
      id:g.game_id,
      date:g.date,
      type:typeBucket(g.game_type),
      typeLabel:g.game_type,
      opponent:isHome?g.away_team:g.home_team,
      result:Number(teamScore)>Number(oppScore)?"W":"L",
      score:`${teamScore} - ${oppScore}`
    });
  }

  render();
  elLoading.style.display="none";
}

function buildSearchResults(query){
  const q=norm(query);
  elSearchResults.innerHTML="";

  if(!q){
    elSearchResults.style.display="none";
    return;
  }

  const matches=[...allTeams]
    .filter(t=>norm(t).includes(q))
    .sort();

  for(const team of matches){
    const div=document.createElement("div");
    div.className="search-item";
    div.textContent=team;
    div.onclick=()=>location.href=`nba-team.html?team=${encodeURIComponent(team)}`;
    elSearchResults.appendChild(div);
  }

  elSearchResults.style.display=matches.length?"block":"none";
}

elSearch.addEventListener("input",e=>{
  buildSearchResults(e.target.value);
});

document.addEventListener("click",e=>{
  if(!e.target.closest(".search-wrapper")){
    elSearchResults.style.display="none";
  }
});

async function init(){
  elTeamName.textContent=teamRaw;
  setHeroColours(teamRaw);

  const seasons=await fetch(PATH_SEASONS).then(r=>r.json());
  seasons.sort((a,b)=>b-a);

  for(const s of seasons){
    const opt=document.createElement("option");
    opt.value=s;
    opt.textContent=seasonLabel(s);
    elSeason.appendChild(opt);
  }

  elSeason.addEventListener("change",()=>loadSeason(elSeason.value));
  elType.addEventListener("change",render);

  if(seasons.length){
    loadSeason(seasons[0]);
  }

  loadLeaders();
}

init();
</script>

</body>
</html>
