<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --soft:#eef2ff;
}
body{font-family:Inter,system-ui,Arial;margin:0;background:var(--bg);}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid var(--line);font-weight:700;}
.navbar a{text-decoration:none;color:var(--nba-primary);}
.page{max-width:1200px;margin:auto;padding:30px 20px;}
.hero{background:linear-gradient(270deg,#17408B,#C9082A,#17408B);color:#fff;padding:34px;border-radius:22px;margin-bottom:16px;}
.stats{background:var(--card);padding:16px;border-radius:16px;display:flex;gap:30px;font-weight:600;}
.leaders-card{background:var(--card);padding:16px;border-radius:16px;margin-top:16px;}
.leaders-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
.leader-box{background:var(--soft);padding:10px;border-radius:12px;}
.card{background:var(--card);border-radius:16px;margin-top:20px;}
table{width:100%;border-collapse:collapse;}
th{background:var(--nba-primary);color:#fff;padding:12px;}
td{padding:12px;border-bottom:1px solid var(--line);}
tr:hover{background:#eef2ff;cursor:pointer;}
select{padding:8px;border-radius:8px;margin:10px 0;}
</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">
<div class="hero"><h1 id="teamName"></h1></div>

<div class="stats">
<div>Total Games: <strong id="totalGames">0</strong></div>
<div>Wins: <strong id="wins">0</strong></div>
<div>Losses: <strong id="losses">0</strong></div>
</div>

<div class="leaders-card">
<h2>All-Time Franchise Leaders</h2>
<div class="leaders-grid" id="leadersGrid"></div>
</div>

<div>
<strong>Select Season:</strong>
<select id="seasonSelect">
<option value="all">All Seasons</option>
</select>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Type</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>

</div>

<script>

const params=new URLSearchParams(window.location.search);
const teamRaw=(params.get("team")||"").trim();
document.getElementById("teamName").textContent=teamRaw;

function normalize(s){return (s||"").toLowerCase().trim();}

let allGames=[];
let playerTotals={};
let seasons=new Set();

async function loadData(){

const masterRes=await fetch("data/nba/nba_games_master.json");
if(!masterRes.ok) return;

const master=await masterRes.json();
const team=normalize(teamRaw);

for(const game of master){

if(game.game_type!=="Regular Season" && game.game_type!=="Playoffs") continue;

const home=normalize(game.home_team);
const away=normalize(game.away_team);
if(home!==team && away!==team) continue;

seasons.add(game.season);

const isHome=home===team;
const teamScore=isHome?game.home_score:game.away_score;
const oppScore=isHome?game.away_score:game.home_score;

allGames.push(game);

const gameFile=await fetch(`data/nba/${game.season}/${game.game_id}.json`);
if(!gameFile.ok) continue;

const fullGame=await gameFile.json();

for(const p of fullGame.players){
if(normalize(p.team)!==team) continue;

if(!playerTotals[p.player_name]){
playerTotals[p.player_name]={points:0,rebounds:0,assists:0,steals:0,blocks:0};
}

playerTotals[p.player_name].points+=p.points||0;
playerTotals[p.player_name].rebounds+=p.rebounds||0;
playerTotals[p.player_name].assists+=p.assists||0;
playerTotals[p.player_name].steals+=p.steals||0;
playerTotals[p.player_name].blocks+=p.blocks||0;
}
}

buildPage();
}

function buildPage(){

const select=document.getElementById("seasonSelect");

Array.from(seasons).sort((a,b)=>b-a).forEach(s=>{
const opt=document.createElement("option");
opt.value=s;
opt.textContent=s;
select.appendChild(opt);
});

renderGames("all");
renderLeaders();
}

function renderGames(season){

const body=document.getElementById("gamesBody");
body.innerHTML="";

let wins=0;
let losses=0;

const filtered=season==="all"?allGames:allGames.filter(g=>g.season==season);

for(const game of filtered){

const isHome=normalize(game.home_team)===normalize(teamRaw);
const teamScore=isHome?game.home_score:game.away_score;
const oppScore=isHome?game.away_score:game.home_score;
const result=teamScore>oppScore?"W":"L";

if(result==="W") wins++; else losses++;

const tr=document.createElement("tr");
tr.onclick=()=>location.href=`nba-game.html?game=${game.game_id}`;
tr.innerHTML=`
<td>${game.date}</td>
<td>${game.season}</td>
<td>${game.game_type}</td>
<td>${isHome?game.away_team:game.home_team}</td>
<td>${result}</td>
<td>${teamScore} - ${oppScore}</td>
`;
body.appendChild(tr);
}

document.getElementById("totalGames").textContent=filtered.length;
document.getElementById("wins").textContent=wins;
document.getElementById("losses").textContent=losses;
}

function renderLeaders(){

const grid=document.getElementById("leadersGrid");
grid.innerHTML="";

["points","rebounds","assists","steals","blocks"].forEach(stat=>{
let leader=null;
let max=0;

for(const [name,stats] of Object.entries(playerTotals)){
if(stats[stat]>max){
max=stats[stat];
leader=name;
}
}

if(!leader) return;

const div=document.createElement("div");
div.className="leader-box";
div.innerHTML=`<strong>${leader}</strong><br>${stat.toUpperCase()}: ${max}`;
grid.appendChild(div);
});
}

document.getElementById("seasonSelect")
.addEventListener("change",e=>renderGames(e.target.value));

loadData();

</script>
</body>
</html>
