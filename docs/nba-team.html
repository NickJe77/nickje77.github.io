<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:22px;padding:32px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,5vw,38px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.filter-box{
  background:var(--surface);border:1px solid var(--line);padding:16px;border-radius:var(--radius);
  margin-bottom:18px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:center;
}
.filter-box label{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);}
select{
  padding:9px 14px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;
  font-family:var(--body);font-weight:600;color:var(--ink);background:var(--surface);cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#f9fbfd;cursor:pointer;}
.loading{text-align:center;padding:24px;color:var(--muted);font-style:italic;}
.stat-wins{color:#1e7a3d;font-weight:700;}
.stat-loss{color:#c0362c;font-weight:700;}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div class="page">
  <div class="hero">
    <span class="eyebrow">NBA</span>
    <h1 id="teamName">Loading…</h1>
  </div>

  <div class="filter-box">
    <label>Season:
      <select id="seasonSelect"></select>
    </label>
    <label>Type:
      <select id="typeSelect">
        <option value="all">All Games</option>
        <option value="regular">Regular Season</option>
        <option value="playoffs">Playoffs</option>
      </select>
    </label>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Away</th>
          <th>Score</th>
          <th>Home</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody id="gamesBody">
        <tr><td colspan="5" class="loading">Loading games…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const R2      = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
const teamRaw = new URLSearchParams(location.search).get("team") || "";

const seasonSelect = document.getElementById("seasonSelect");
const typeSelect   = document.getElementById("typeSelect");
const gamesBody    = document.getElementById("gamesBody");
const teamNameEl   = document.getElementById("teamName");

let allGames = [];
let season   = 2026;

function fixName(str){
  if(!str) return str;
  try{
    const bytes = new Uint8Array(str.length);
    for(let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const decoded = new TextDecoder('utf-8').decode(bytes);
    if(decoded.includes('\ufffd')) return str;
    return decoded;
  }catch(e){ return str; }
}

teamNameEl.textContent = teamRaw;
document.title = `${teamRaw} | NBA Team`;

// Build season dropdown
for(let y = 2026; y >= 1977; y--){
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = `${y-1}-${y}`;
  if(y === season) opt.selected = true;
  seasonSelect.appendChild(opt);
}

seasonSelect.onchange = () => { season = parseInt(seasonSelect.value); loadSeason(); };
typeSelect.onchange   = renderGames;

async function loadSeason(){
  gamesBody.innerHTML = `<tr><td colspan="5" class="loading">Loading games…</td></tr>`;
  try{
    const res = await fetch(`${R2}/basketball/indexes/${season}.json`);
    if(!res.ok) throw new Error("Not found");
    allGames = await res.json();
    renderGames();
  }catch(err){
    gamesBody.innerHTML = `<tr><td colspan="5" class="loading">Failed to load games.</td></tr>`;
  }
}

function renderGames(){
  gamesBody.innerHTML = "";
  const typeFilter = typeSelect.value;

  let filtered = allGames.filter(g =>
    g.home === teamRaw || g.away === teamRaw
  );

  if(typeFilter === "regular") filtered = filtered.filter(g => !g.playoff);
  if(typeFilter === "playoffs") filtered = filtered.filter(g => g.playoff);

  if(!filtered.length){
    gamesBody.innerHTML = `<tr><td colspan="5" class="loading">No games found.</td></tr>`;
    return;
  }

  // Sort newest first
  filtered.sort((a,b) => new Date(b.date) - new Date(a.date));

  filtered.forEach(g => {
    const isHome    = g.home === teamRaw;
    const teamScore = isHome ? g.home_score : g.away_score;
    const oppScore  = isHome ? g.away_score : g.home_score;
    const result    = teamScore > oppScore ? "W" : teamScore < oppScore ? "L" : "D";
    const cls       = result === "W" ? "stat-wins" : result === "L" ? "stat-loss" : "";

    const tr = document.createElement("tr");
    tr.onclick = () => {
      window.location.href = `/nba-game.html?season=${season}&game=${g.game_id}`;
    };
    tr.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${g.away || ""}</td>
      <td>${g.away_score ?? "–"} – ${g.home_score ?? "–"}</td>
      <td>${g.home || ""}</td>
      <td class="${cls}">${result}</td>
    `;
    gamesBody.appendChild(tr);
  });
}

loadSeason();
</script>
</body>
</html>
