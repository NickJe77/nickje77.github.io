<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
--nba-primary:#17408B;
--bg:#f4f6f8;
--card:#ffffff;
--line:#e6e8ee;
}

body{
font-family:Inter,Arial;
margin:0;
background:var(--bg);
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid var(--line);
font-weight:700;
}

.navbar a{
text-decoration:none;
color:var(--nba-primary);
}

.page{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

.hero{
background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
color:#fff;
padding:34px;
border-radius:22px;
margin-bottom:20px;
}

.hero h1{
margin:0;
font-size:36px;
}

/* leaders */

.leaders-card{
background:#fff;
border-radius:16px;
padding:18px;
margin-bottom:20px;
}

.leaders-card h3{
margin:0 0 12px;
}

.leaders-table{
width:100%;
border-collapse:collapse;
}

.leaders-table td{
padding:8px;
border-bottom:1px solid #eee;
}

.leaders-table td:nth-child(1){
font-weight:600;
width:120px;
}

.leaders-table td:nth-child(3){
text-align:right;
font-weight:700;
}

/* filters */

.filter-box{
background:var(--card);
padding:16px;
border-radius:16px;
margin-bottom:16px;
display:flex;
gap:20px;
flex-wrap:wrap;
align-items:center;
}

select,input{
padding:8px 10px;
border:1px solid #cfd6e3;
border-radius:10px;
font-size:14px;
background:#fff;
}

/* table */

.card{
background:var(--card);
border-radius:16px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:var(--nba-primary);
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid var(--line);
}

tr:hover{
background:#eef2ff;
cursor:pointer;
}

.loading{
background:#fff;
padding:10px;
border:1px solid #e5e7eb;
border-radius:12px;
margin-bottom:16px;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
<h1 id="teamName">Loading…</h1>
</div>

<div class="leaders-card">
<h3>Franchise Leaders</h3>

<table class="leaders-table">
<tbody id="leadersBody">
<tr><td colspan="3">Loading leaders…</td></tr>
</tbody>
</table>

</div>

<div class="loading" id="loadingBox">Loading games…</div>

<div class="filter-box">

<label>
Season:
<select id="seasonSelect"></select>
</label>

<label>
Type:
<select id="typeSelect">
<option value="all">All</option>
<option value="regular">Regular Season</option>
<option value="playoffs">Playoffs</option>
</select>
</label>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Type</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

</div>

<script>

const teamRaw = new URLSearchParams(window.location.search).get("team") || "";

const PATH_SEASONS = "data/nba/seasons.json";
const PATH_LEADERS = "data/nba/team-leaders.json";

function norm(s){
return (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

function seasonLabel(start){
const next = String((Number(start) + 1) % 100).padStart(2, "0");
return `${start}-${next}`;
}

function typeBucket(t){
if(!t) return "regular";
const s = String(t).toLowerCase();
if(s.includes("regular")) return "regular";
return "playoffs";
}

function unique(arr){
return [...new Set(arr)];
}

function teamVariants(name){
const raw = String(name || "").trim();
const variants = new Set();
const add = v => { if(v) variants.add(norm(v)); };

add(raw);

const replacements = [
[/^la lakers$/i, "Los Angeles Lakers"],
[/^los angeles lakers$/i, "LA Lakers"],
[/^la clippers$/i, "Los Angeles Clippers"],
[/^los angeles clippers$/i, "LA Clippers"],
[/^ny knicks$/i, "New York Knicks"],
[/^gs warriors$/i, "Golden State Warriors"],
[/^okc thunder$/i, "Oklahoma City Thunder"],
[/^no pelicans$/i, "New Orleans Pelicans"],
[/^nj nets$/i, "New Jersey Nets"],
[/^brooklyn nets$/i, "Brooklyn Nets"],
[/^new orleans hornets$/i, "NO Hornets"],
[/^new orleans pelicans$/i, "NO Pelicans"],
[/^new jersey nets$/i, "NJ Nets"],
[/^san antonio spurs$/i, "SA Spurs"],
[/^phoenix suns$/i, "PHX Suns"],
[/^philadelphia 76ers$/i, "76ers"],
[/^portland trail blazers$/i, "Portland Trail Blazers"],
[/^trail blazers$/i, "Portland Trail Blazers"]
];

for(const [pattern, replacement] of replacements){
if(pattern.test(raw)){
add(replacement);
}
if(pattern.test(replacement)){
add(raw);
}
}

if(/lakers/i.test(raw)){
add("LA Lakers");
add("Los Angeles Lakers");
}
if(/clippers/i.test(raw)){
add("LA Clippers");
add("Los Angeles Clippers");
}
if(/76ers/i.test(raw) || /philadelphia/i.test(raw)){
add("Philadelphia 76ers");
add("76ers");
}
if(/nets/i.test(raw)){
add("Brooklyn Nets");
add("New Jersey Nets");
add("NJ Nets");
}
if(/pelicans/i.test(raw) || /hornets/i.test(raw)){
add("New Orleans Pelicans");
add("NO Pelicans");
add("New Orleans Hornets");
add("NO Hornets");
}
if(/trailblazers/i.test(norm(raw)) || /blazers/i.test(raw)){
add("Portland Trail Blazers");
add("Trail Blazers");
}

return [...variants];
}

function matchesTeam(nameA, teamName){
const a = norm(nameA);
const vars = teamVariants(teamName);
return vars.includes(a);
}

function getSeasonArray(data){
if(Array.isArray(data)) return data;
if(Array.isArray(data?.seasons)) return data.seasons;
if(Array.isArray(data?.years)) return data.years;
if(Array.isArray(data?.data)) return data.data;
return [];
}

function getGamesArray(data){
if(Array.isArray(data)) return data;
if(Array.isArray(data?.games)) return data.games;
if(Array.isArray(data?.data)) return data.data;
return [];
}

function getLeadersRow(data, teamName){
const variants = teamVariants(teamName);

if(Array.isArray(data)){
return data.find(row => variants.includes(norm(row.team || row.team_name || row.name || row.franchise)));
}

if(Array.isArray(data?.teams)){
return data.teams.find(row => variants.includes(norm(row.team || row.team_name || row.name || row.franchise)));
}

if(Array.isArray(data?.data)){
return data.data.find(row => variants.includes(norm(row.team || row.team_name || row.name || row.franchise)));
}

if(data && typeof data === "object"){
for(const [key, value] of Object.entries(data)){
if(variants.includes(norm(key))) return value;
if(value && typeof value === "object"){
const rowTeam = value.team || value.team_name || value.name || value.franchise || "";
if(variants.includes(norm(rowTeam))) return value;
}
}
}

return null;
}

function firstDefined(row, keys){
for(const key of keys){
if(row && row[key] !== undefined && row[key] !== null && row[key] !== ""){
return row[key];
}
}
return "";
}

const elTeamName = document.getElementById("teamName");
const elSeason = document.getElementById("seasonSelect");
const elType = document.getElementById("typeSelect");
const elBody = document.getElementById("gamesBody");
const elLoading = document.getElementById("loadingBox");
const elLeaders = document.getElementById("leadersBody");

let allGames = [];
let currentSeason = null;

function render(){

let filtered = allGames.slice();

if(elType.value !== "all"){
filtered = filtered.filter(g => g.type === elType.value);
}

filtered.sort((a,b) => (b.date || "").localeCompare(a.date || ""));

elBody.innerHTML = "";

if(!filtered.length){
elBody.innerHTML = `<tr><td colspan="6">No games found.</td></tr>`;
return;
}

for(const g of filtered){

const tr = document.createElement("tr");

tr.onclick = () => {
location.href = `nba-game.html?season=${currentSeason}&game=${g.id}`;
};

tr.innerHTML = `
<td>${g.date || ""}</td>
<td>${seasonLabel(currentSeason)}</td>
<td>${g.typeLabel || ""}</td>
<td>${g.opponent || ""}</td>
<td>${g.result || ""}</td>
<td>${g.score || ""}</td>
`;

elBody.appendChild(tr);

}
}

async function loadSeason(season){

currentSeason = Number(season);
allGames = [];
elLoading.style.display = "block";
elLoading.textContent = "Loading games…";

try{
const res = await fetch(`data/nba/${season}.json`);
if(!res.ok) throw new Error(`Season fetch failed: ${res.status}`);
const data = await res.json();

const games = getGamesArray(data);

for(const g of games){

if((g.game_type || "").toLowerCase().includes("pre")) continue;

const homeTeam = g.home_team || g.homeTeam || g.home || "";
const awayTeam = g.away_team || g.awayTeam || g.away || "";

const isHome = matchesTeam(homeTeam, teamRaw);
const isAway = matchesTeam(awayTeam, teamRaw);

if(!isHome && !isAway) continue;

const homeScore = Number(g.home_score ?? g.homeScore ?? 0);
const awayScore = Number(g.away_score ?? g.awayScore ?? 0);

const teamScore = isHome ? homeScore : awayScore;
const oppScore = isHome ? awayScore : homeScore;

let result = "L";
if(teamScore > oppScore) result = "W";
if(teamScore === oppScore) result = "T";

allGames.push({
id: g.game_id || g.id || g.gameId || "",
date: g.date || g.game_date || "",
type: typeBucket(g.game_type || g.type || ""),
typeLabel: g.game_type || g.type || "",
opponent: isHome ? awayTeam : homeTeam,
result,
score: `${teamScore}-${oppScore}`
});
}

render();
elLoading.style.display = "none";

}catch(err){
elBody.innerHTML = `<tr><td colspan="6">Unable to load season data.</td></tr>`;
elLoading.style.display = "block";
elLoading.textContent = "Unable to load games.";
}
}

async function loadLeaders(){

try{
const res = await fetch(PATH_LEADERS);
if(!res.ok) throw new Error(`Leaders fetch failed: ${res.status}`);
const data = await res.json();

const row = getLeadersRow(data, teamRaw);

if(!row){
elLeaders.innerHTML = "<tr><td colspan='3'>No data</td></tr>";
return;
}

const pointsPlayer   = firstDefined(row, ["points_player","pts_player","scoring_player","pointsLeader"]);
const pointsValue    = firstDefined(row, ["points","pts","scoring","points_total"]);
const reboundsPlayer = firstDefined(row, ["rebounds_player","rebs_player","reb_player","reboundsLeader"]);
const reboundsValue  = firstDefined(row, ["rebounds","rebs","reb","rebounds_total"]);
const assistsPlayer  = firstDefined(row, ["assists_player","asts_player","ast_player","assistsLeader"]);
const assistsValue   = firstDefined(row, ["assists","asts","ast","assists_total"]);
const stealsPlayer   = firstDefined(row, ["steals_player","stl_player","stealsLeader"]);
const stealsValue    = firstDefined(row, ["steals","stl","steals_total"]);
const blocksPlayer   = firstDefined(row, ["blocks_player","blk_player","blocksLeader"]);
const blocksValue    = firstDefined(row, ["blocks","blk","blocks_total"]);

elLeaders.innerHTML = `
<tr><td>Points</td><td>${pointsPlayer || "-"}</td><td>${pointsValue || "-"}</td></tr>
<tr><td>Rebounds</td><td>${reboundsPlayer || "-"}</td><td>${reboundsValue || "-"}</td></tr>
<tr><td>Assists</td><td>${assistsPlayer || "-"}</td><td>${assistsValue || "-"}</td></tr>
<tr><td>Steals</td><td>${stealsPlayer || "-"}</td><td>${stealsValue || "-"}</td></tr>
<tr><td>Blocks</td><td>${blocksPlayer || "-"}</td><td>${blocksValue || "-"}</td></tr>
`;

}catch(err){
elLeaders.innerHTML = "<tr><td colspan='3'>Leader data unavailable</td></tr>";
}
}

async function init(){

elTeamName.textContent = teamRaw || "NBA Team";

await loadLeaders();

try{
const res = await fetch(PATH_SEASONS);
if(!res.ok) throw new Error(`Seasons fetch failed: ${res.status}`);
const seasonsRaw = await res.json();

let seasons = getSeasonArray(seasonsRaw)
.map(s => Number(s))
.filter(s => !Number.isNaN(s));

seasons = unique(seasons).sort((a,b) => b-a);

elSeason.innerHTML = "";

for(const s of seasons){
const opt = document.createElement("option");
opt.value = s;
opt.textContent = seasonLabel(s);
elSeason.appendChild(opt);
}

elSeason.addEventListener("change", () => loadSeason(elSeason.value));
elType.addEventListener("change", render);

if(seasons.length){
await loadSeason(seasons[0]);
}else{
elLoading.textContent = "No seasons found.";
elBody.innerHTML = `<tr><td colspan="6">No seasons found.</td></tr>`;
}

}catch(err){
elLoading.textContent = "Unable to load seasons.";
elBody.innerHTML = `<tr><td colspan="6">Unable to load seasons.</td></tr>`;
}
}

init();

</script>

</body>
</html>
