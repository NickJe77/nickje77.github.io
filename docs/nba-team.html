<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}

.stats{
  display:flex;
  gap:40px;
  font-size:18px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

th{
  background:#002D72;
  color:#fff;
  padding:10px;
  text-align:left;
}

td{
  padding:10px;
  border-bottom:1px solid #eee;
}

tr:hover{
  background:#f0f6ff;
}

.no-data{
  text-align:center;
  padding:30px;
  font-weight:600;
  background:#fff;
  border-radius:16px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="teamName"></h1>
</div>

<div class="stats">
  <div>Total Games: <strong id="totalGames">0</strong></div>
  <div>Wins: <strong id="wins">0</strong></div>
  <div>Losses: <strong id="losses">0</strong></div>
</div>

<h2>Season Summary</h2>
<table id="seasonTable">
<thead>
<tr>
<th>Season</th>
<th>Games</th>
<th>Wins</th>
<th>Losses</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2 style="margin-top:30px;">Recent Games</h2>
<table id="gamesTable">
<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div id="noData" class="no-data" style="display:none;">
No games found for this team.
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const team = params.get("team");

document.getElementById("teamName").textContent = team;

const clean = str => str ? str.toLowerCase().trim() : "";

let seasonStats = {};
let teamGames = [];

fetch("data/nba/nba_games_master.json")
.then(res => res.json())
.then(data => {

  data.forEach(game => {

    if(
      clean(game.home_team) === clean(team) ||
      clean(game.away_team) === clean(team)
    ){

      teamGames.push(game);

      const isHome = clean(game.home_team) === clean(team);
      const teamScore = isHome ? game.home_score : game.away_score;
      const oppScore = isHome ? game.away_score : game.home_score;
      const opponent = isHome ? game.away_team : game.home_team;

      if(!seasonStats[game.season]){
        seasonStats[game.season] = {games:0,wins:0,losses:0};
      }

      seasonStats[game.season].games++;

      if(teamScore > oppScore){
        seasonStats[game.season].wins++;
      } else {
        seasonStats[game.season].losses++;
      }

      game._opponent = opponent;
      game._result = teamScore > oppScore ? "W" : "L";
      game._score = `${teamScore} - ${oppScore}`;
    }

  });

  render();

});

function render(){

  if(teamGames.length === 0){
    document.getElementById("noData").style.display = "block";
    document.getElementById("seasonTable").style.display = "none";
    document.getElementById("gamesTable").style.display = "none";
    return;
  }

  document.getElementById("totalGames").textContent = teamGames.length;

  let totalWins = 0;
  let totalLosses = 0;

  const seasonBody = document.querySelector("#seasonTable tbody");

  Object.keys(seasonStats)
    .sort((a,b) => b - a)
    .forEach(season => {

      const s = seasonStats[season];
      totalWins += s.wins;
      totalLosses += s.losses;

      seasonBody.innerHTML += `
        <tr>
          <td>${season}</td>
          <td>${s.games}</td>
          <td>${s.wins}</td>
          <td>${s.losses}</td>
        </tr>
      `;
    });

  document.getElementById("wins").textContent = totalWins;
  document.getElementById("losses").textContent = totalLosses;

  const gamesBody = document.querySelector("#gamesTable tbody");

  teamGames
    .sort((a,b) => new Date(b.date) - new Date(a.date))
    .slice(0,50)
    .forEach(game => {

      gamesBody.innerHTML += `
        <tr>
          <td>${game.date}</td>
          <td>${game.season}</td>
          <td>${game._opponent}</td>
          <td>${game._result}</td>
          <td>${game._score}</td>
        </tr>
      `;
    });

}

</script>

</body>
</html>
