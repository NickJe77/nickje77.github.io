<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nba-primary:#17408B;
  --nba-secondary:#C9082A;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:var(--nba-primary);
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
  background-size:400% 400%;
  animation:fadeGradient 10s ease infinite;
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:24px;
}

@keyframes fadeGradient{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.stats{
  display:flex;
  gap:40px;
  margin-bottom:20px;
  font-size:18px;
}

.season-box{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  margin-bottom:25px;
}

.card{
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  margin-bottom:25px;
}

.leaders{
  padding:20px;
}

.leaders h2{
  margin-top:0;
}

.leader-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.leader-box{
  background:#eef2ff;
  padding:15px;
  border-radius:12px;
  font-weight:600;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--nba-primary);
  color:#fff;
  padding:14px;
  text-align:left;
}

td{
  padding:14px;
  border-bottom:1px solid var(--line);
}

tr:nth-child(even){
  background:#f6f9ff;
}

tr:hover{
  background:#e8f0ff;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="teamName"></h1>
</div>

<div class="card leaders">
  <h2>All-Time Franchise Leaders</h2>
  <div id="leadersBox">Loading leaders…</div>
</div>

<div class="stats">
  <div>Total Games: <strong id="totalGames">0</strong></div>
  <div>Wins: <strong id="wins">0</strong></div>
  <div>Losses: <strong id="losses">0</strong></div>
</div>

<div class="season-box">
  <strong>Select Season:</strong>
  <select id="seasonSelect">
    <option value="all">All Seasons</option>
  </select>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Date</th>
<th>Season</th>
<th>Opponent</th>
<th>Result</th>
<th>Score</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>

</div>

<script>
const params=new URLSearchParams(window.location.search);
const team=(params.get("team")||"").trim();
document.getElementById("teamName").textContent=team;

const clean=s=>(s||"").toLowerCase().trim();

function seasonLabel(start){
  const next=String((start+1)%100).padStart(2,"0");
  return `${start}-${next}`;
}

let allGames=[];
let seasons=new Set();

async function loadData(){

  const res = await fetch("/data/nba/nba_games_master.json");
  const master = await res.json();

  const t = clean(team);
  const totals={};

  for(const game of master){

    if(game.game_type!=="Regular Season") continue;

    const home=clean(game.home_team);
    const away=clean(game.away_team);

    if(home!==t && away!==t) continue;

    seasons.add(game.season);

    const isHome=home===t;
    const teamScore=isHome?game.home_score:game.away_score;
    const oppScore=isHome?game.away_score:game.home_score;

    allGames.push({
      id:game.game_id,
      date:game.date,
      season:game.season,
      opponent:isHome?game.away_team:game.home_team,
      result:teamScore>oppScore?"W":"L",
      score:`${teamScore} - ${oppScore}`
    });

    for(const p of (game.players||[])){
      if(clean(p.team)!==t) continue;

      if(!totals[p.player_name]){
        totals[p.player_name]={points:0,assists:0,rebounds:0,steals:0};
      }

      totals[p.player_name].points+=p.points||0;
      totals[p.player_name].assists+=p.assists||0;
      totals[p.player_name].rebounds+=p.rebounds||0;
      totals[p.player_name].steals+=p.steals||0;
    }
  }

  buildLeaders(totals);
  buildSelector();
  render("all");
}

function buildLeaders(totals){

  function leader(stat){
    return Object.entries(totals)
      .sort((a,b)=>b[1][stat]-a[1][stat])[0];
  }

  const pts=leader("points");
  const ast=leader("assists");
  const reb=leader("rebounds");
  const stl=leader("steals");

  document.getElementById("leadersBox").innerHTML=`
    <div class="leader-grid">
      <div class="leader-box">Points<br>${pts?.[0]||"-"} (${pts?.[1].points||0})</div>
      <div class="leader-box">Assists<br>${ast?.[0]||"-"} (${ast?.[1].assists||0})</div>
      <div class="leader-box">Rebounds<br>${reb?.[0]||"-"} (${reb?.[1].rebounds||0})</div>
      <div class="leader-box">Steals<br>${stl?.[0]||"-"} (${stl?.[1].steals||0})</div>
    </div>
  `;
}

function buildSelector(){
  const select=document.getElementById("seasonSelect");
  Array.from(seasons).sort((a,b)=>b-a).forEach(s=>{
    const opt=document.createElement("option");
    opt.value=s;
    opt.textContent=seasonLabel(s);
    select.appendChild(opt);
  });
  select.addEventListener("change",e=>render(e.target.value));
}

function render(selectedSeason){

  const gamesBody=document.getElementById("gamesBody");
  gamesBody.innerHTML="";

  const filtered = selectedSeason==="all"
    ? allGames
    : allGames.filter(g=>g.season==selectedSeason);

  filtered.sort((a,b)=>new Date(b.date)-new Date(a.date));

  let wins=0,losses=0;

  for(const g of filtered){

    if(g.result==="W")wins++;else losses++;

    gamesBody.innerHTML+=`
      <tr onclick="location.href='nba-game.html?game=${g.id}'">
        <td>${g.date}</td>
        <td>${seasonLabel(g.season)}</td>
        <td>${g.opponent}</td>
        <td>${g.result}</td>
        <td>${g.score}</td>
      </tr>`;
  }

  document.getElementById("totalGames").textContent=filtered.length;
  document.getElementById("wins").textContent=wins;
  document.getElementById("losses").textContent=losses;
}

loadData();
</script>

</body>
</html>
