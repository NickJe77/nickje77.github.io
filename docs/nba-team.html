<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* same CSS as before */
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</nav>

<div class="page">
  <div class="hero"><h1 id="teamName"></h1></div>

  <div class="stats">
    <div>Total Games: <strong id="totalGames">0</strong></div>
    <div>Wins: <strong id="wins">0</strong></div>
    <div>Losses: <strong id="losses">0</strong></div>
  </div>

  <div class="leaders-card">
    <h2>All-Time Franchise Leaders</h2>
    <div class="leaders-grid" id="leadersGrid"></div>
  </div>

  <div class="season-box">
    <strong>Select Season:</strong>
    <select id="seasonSelect"><option value="all">All Seasons</option></select>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th><th>Season</th><th>Type</th><th>Opponent</th><th>Result</th><th>Score</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const teamRaw = (params.get("team")||"").trim();
document.getElementById("teamName").textContent = teamRaw;

function normalize(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }

let allGames = [], seasons = new Set(), leaders = {};

async function loadData(){

  const master = await (await fetch("/data/nba/nba_games_master.json")).json();
  const team = normalize(teamRaw);

  for(const game of master){

    if(game.game_type !== "Regular Season" && game.game_type !== "Playoffs") continue;

    const home = normalize(game.home_team);
    const away = normalize(game.away_team);

    if(!home.includes(team) && !away.includes(team)) continue;

    seasons.add(game.season);

    const isHome = home.includes(team);
    const teamScore = isHome ? game.home_score : game.away_score;
    const oppScore  = isHome ? game.away_score : game.home_score;

    allGames.push({
      id: game.game_id,
      date: game.date,
      season: game.season,
      type: game.game_type,
      opponent: isHome ? game.away_team : game.home_team,
      result: teamScore > oppScore ? "W" : "L",
      score: `${teamScore} - ${oppScore}`
    });

    const gameRes = await fetch(`/data/nba/${game.season}/${game.game_id}.json`);
    if(!gameRes.ok) continue;
    const gameData = await gameRes.json();

    for(const p of gameData.players){
      if(!normalize(p.team).includes(team)) continue;
      if(!leaders[p.player_name]) leaders[p.player_name] = { points:0, rebounds:0, assists:0 };
      leaders[p.player_name].points += p.points||0;
      leaders[p.player_name].rebounds += p.rebounds||0;
      leaders[p.player_name].assists += p.assists||0;
    }
  }

  buildPage();
}

function buildPage(){

  const select = document.getElementById("seasonSelect");
  Array.from(seasons).sort((a,b)=>b-a).forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = `${s}-${String((s+1)%100).padStart(2,"0")}`;
    select.appendChild(opt);
  });

  renderGames("all");
  renderLeaders();
}

function renderGames(season){
  const body = document.getElementById("gamesBody");
  body.innerHTML = "";
  let wins=0, losses=0;

  allGames.filter(g => season==="all"||g.season==season)
          .sort((a,b)=> b.date.localeCompare(a.date))
          .forEach(g=>{
    if(g.result==="W") wins++; else losses++;
    const tr=document.createElement("tr");
    tr.onclick = ()=> location.href=`nba-game.html?game=${g.id}`;
    tr.innerHTML=`
      <td>${g.date}</td><td>${g.season}</td><td>${g.type}</td>
      <td>${g.opponent}</td><td>${g.result}</td><td>${g.score}</td>
    `;
    body.appendChild(tr);
  });

  document.getElementById("totalGames").textContent = wins+losses;
  document.getElementById("wins").textContent = wins;
  document.getElementById("losses").textContent = losses;
}

function renderLeaders(){
  const grid = document.getElementById("leadersGrid");
  grid.innerHTML = "";
  ["points","rebounds","assists"].forEach(stat=>{
    let best=null, max=-1;
    for(const name in leaders){
      if(leaders[name][stat]>max){
        max = leaders[name][stat];
        best = name;
      }
    }
    if(best){
      grid.innerHTML += `
        <div class="leader-box">
          <div class="leader-label">${stat.toUpperCase()}</div>
          <div>${best}</div>
          <div>${max}</div>
        </div>`;
    }
  });
}

document.getElementById("seasonSelect")
        .addEventListener("change",e=>renderGames(e.target.value));

loadData();
</script>

</body>
</html>
