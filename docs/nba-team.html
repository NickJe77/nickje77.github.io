<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NBA Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --nba-primary:#17408B;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
}
body{font-family:Inter,Arial;margin:0;background:var(--bg);}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid var(--line);font-weight:700;}
.navbar a{text-decoration:none;color:var(--nba-primary);}
.page{max-width:1200px;margin:auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(270deg,#17408B,#C9082A,#17408B);color:#fff;padding:34px;border-radius:22px;margin-bottom:20px;}
.stats{background:var(--card);padding:16px;border-radius:16px;display:flex;gap:30px;margin-bottom:16px;flex-wrap:wrap;}
.filter-box{background:var(--card);padding:16px;border-radius:16px;margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.card{background:var(--card);border-radius:16px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{background:var(--nba-primary);color:#fff;padding:12px;text-align:left;}
td{padding:12px;border-bottom:1px solid var(--line);}
tr:hover{background:#eef2ff;cursor:pointer;}
.loading{background:#fff;padding:10px;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:16px;}
.error{
  background:#ffe5e5;
  border:1px solid #ffc1c1;
  color:#8a0000;
  padding:10px 12px;
  border-radius:12px;
  margin-bottom:16px;
  display:none;
  white-space:pre-wrap;
  font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size:12px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="teamName">Loading…</h1>
    <div id="subTitle"></div>
  </div>

  <div class="loading" id="loadingBox">Loading games…</div>
  <div class="error" id="errorBox"></div>

  <div class="stats">
    <div>Total Games: <strong id="totalGames">0</strong></div>
    <div>Wins: <strong id="wins">0</strong></div>
    <div>Losses: <strong id="losses">0</strong></div>
  </div>

  <div class="filter-box">
    <strong>Season:</strong>
    <select id="seasonSelect"><option value="all">All Seasons</option></select>

    <strong>Type:</strong>
    <select id="typeSelect">
      <option value="all">All</option>
      <option value="regular">Regular Season</option>
      <option value="playoffs">Playoffs</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th style="width:120px;">Date</th>
          <th style="width:110px;">Season</th>
          <th style="width:140px;">Type</th>
          <th>Opponent</th>
          <th style="width:80px;">Result</th>
          <th style="width:110px;">Score</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>
const teamRaw = new URLSearchParams(window.location.search).get("team") || "";
const PATH_MASTER = "/data/nba/nba_games_master.json";

const FULL_TEAM_NAMES = {
  hawks:"Atlanta Hawks",
  celtics:"Boston Celtics",
  nets:"Brooklyn Nets",
  hornets:"Charlotte Hornets",
  bulls:"Chicago Bulls",
  cavaliers:"Cleveland Cavaliers",
  mavericks:"Dallas Mavericks",
  nuggets:"Denver Nuggets",
  pistons:"Detroit Pistons",
  warriors:"Golden State Warriors",
  rockets:"Houston Rockets",
  pacers:"Indiana Pacers",
  clippers:"Los Angeles Clippers",
  lakers:"Los Angeles Lakers",
  grizzlies:"Memphis Grizzlies",
  heat:"Miami Heat",
  bucks:"Milwaukee Bucks",
  timberwolves:"Minnesota Timberwolves",
  pelicans:"New Orleans Pelicans",
  knicks:"New York Knicks",
  thunder:"Oklahoma City Thunder",
  magic:"Orlando Magic",
  sixers:"Philadelphia 76ers",
  suns:"Phoenix Suns",
  blazers:"Portland Trail Blazers",
  kings:"Sacramento Kings",
  spurs:"San Antonio Spurs",
  raptors:"Toronto Raptors",
  jazz:"Utah Jazz",
  wizards:"Washington Wizards"
};

function norm(s){return (s||"").toLowerCase().replace(/[^a-z]/g,"");}
function fullName(raw){return FULL_TEAM_NAMES[norm(raw)] || raw;}

// Robust date parsing -> {y,m,d} or null
function parseYMD(dateStr){
  if(!dateStr) return null;
  const s = String(dateStr).trim();

  // YYYY-MM-DD
  if(s.includes("-")){
    const p = s.split("-");
    const y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
    if(!y || !m || !d) return null;
    return {y,m,d};
  }

  // slashed
  if(s.includes("/")){
    const p = s.split("/");
    // YYYY/MM/DD
    if(p[0].length === 4){
      const y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
      if(!y || !m || !d) return null;
      return {y,m,d};
    }
    // DD/MM/YYYY
    const d = Number(p[0]), m = Number(p[1]), y = Number(p[2]);
    if(!y || !m || !d) return null;
    return {y,m,d};
  }

  return null;
}

// NBA season START year from date (Oct-Dec => same year; otherwise previous year)
function seasonStartFromDate(ymd){
  if(!ymd) return null;
  return (ymd.m >= 10) ? ymd.y : (ymd.y - 1);
}

function seasonLabel(start){
  const n = String((Number(start)+1)%100).padStart(2,"0");
  return `${start}-${n}`;
}

function typeBucket(t){
  if(!t) return "regular";
  const s = String(t).toLowerCase();
  if(s.includes("regular")) return "regular";
  return "playoffs";
}
function typeLabel(t){
  return typeBucket(t)==="regular" ? "Regular Season" : "Playoffs";
}

const elTeamName=document.getElementById("teamName");
const elSubTitle=document.getElementById("subTitle");
const elLoading=document.getElementById("loadingBox");
const elError=document.getElementById("errorBox");
const elTotal=document.getElementById("totalGames");
const elWins=document.getElementById("wins");
const elLoss=document.getElementById("losses");
const elSeason=document.getElementById("seasonSelect");
const elType=document.getElementById("typeSelect");
const elBody=document.getElementById("gamesBody");

function showError(msg){
  elError.style.display = "block";
  elError.textContent = msg;
}
function hideError(){
  elError.style.display = "none";
  elError.textContent = "";
}

let allGames = [];
let seasons = new Set();

// Detect whether master "season" is start-year or end-year (or unusable) by sampling
function detectSeasonEncoding(games){
  // We compare given season vs seasonStartFromDate(date)
  // If many games have (givenSeason == computedStart+1) -> end-year encoding
  // If many games have (givenSeason == computedStart)   -> start-year encoding
  let startHits = 0;
  let endHits = 0;
  let checked = 0;

  for(const g of games){
    if(checked >= 250) break;
    const ymd = parseYMD(g.date);
    const start = seasonStartFromDate(ymd);
    const given = Number(g.season);
    if(!start || !given) continue;

    checked++;
    if(given === start) startHits++;
    if(given === start + 1) endHits++;
  }

  // Default: if we can’t tell, treat as start-year (least destructive)
  if(checked < 20) return "start";

  return (endHits > startHits) ? "end" : "start";
}

function normalizeSeasonStart(g, encoding){
  // If we can compute from date, use it as sanity; but primarily convert given season based on encoding
  const given = Number(g.season);
  if(!given) {
    // fallback to computed start if season missing
    const ymd = parseYMD(g.date);
    return seasonStartFromDate(ymd);
  }
  return (encoding === "end") ? (given - 1) : given;
}

function fillSeasonSelect(){
  elSeason.innerHTML = "<option value='all'>All Seasons</option>";
  Array.from(seasons).sort((a,b)=>Number(b)-Number(a)).forEach(s=>{
    const opt = document.createElement("option");
    opt.value = String(s);
    opt.textContent = seasonLabel(s);
    elSeason.appendChild(opt);
  });
}

function render(){
  let filtered = allGames;

  if(elSeason.value !== "all"){
    filtered = filtered.filter(g => String(g.seasonStart) === String(elSeason.value));
  }
  if(elType.value !== "all"){
    filtered = filtered.filter(g => g.typeBucket === elType.value);
  }

  filtered.sort((a,b)=> (b.date||"").localeCompare(a.date||""));

  elBody.innerHTML = "";
  let w=0,l=0;

  for(const g of filtered){
    if(g.result === "W") w++; else l++;
    const tr = document.createElement("tr");
    tr.onclick = () => location.href = `nba-game.html?game=${encodeURIComponent(g.id)}`;
    tr.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${g.seasonLabel || ""}</td>
      <td>${g.typeLabel || ""}</td>
      <td>${g.opponentFull || ""}</td>
      <td>${g.result || ""}</td>
      <td>${g.score || ""}</td>
    `;
    elBody.appendChild(tr);
  }

  elTotal.textContent = filtered.length;
  elWins.textContent = w;
  elLoss.textContent = l;

  const seasonTxt = (elSeason.value === "all") ? "All Seasons" : seasonLabel(Number(elSeason.value));
  const typeTxt = (elType.value === "all") ? "All" : (elType.value === "regular" ? "Regular Season" : "Playoffs");
  elSubTitle.textContent = `${seasonTxt} • ${typeTxt} • ${filtered.length.toLocaleString()} games shown`;
}

async function load(){
  hideError();
  elTeamName.textContent = fullName(teamRaw);

  try{
    const r = await fetch(PATH_MASTER, {cache:"no-store"});
    if(!r.ok) throw new Error(`Fetch failed ${r.status} for ${PATH_MASTER}`);
    const masterAny = await r.json();

    // master may be array or wrapper
    const master = Array.isArray(masterAny)
      ? masterAny
      : (Array.isArray(masterAny.games) ? masterAny.games
        : (Array.isArray(masterAny.data) ? masterAny.data
          : (Array.isArray(masterAny.items) ? masterAny.items : [])));

    if(!master.length){
      showError("Loaded master JSON but found 0 games.");
      elLoading.style.display="none";
      return;
    }

    const encoding = detectSeasonEncoding(master);

    const teamKey = norm(teamRaw);
    allGames = [];
    seasons = new Set();

    for(const g of master){
      const home = norm(g.home_team);
      const away = norm(g.away_team);
      if(!home.includes(teamKey) && !away.includes(teamKey)) continue;

      const isHome = home.includes(teamKey);
      const teamScore = isHome ? g.home_score : g.away_score;
      const oppScore  = isHome ? g.away_score : g.home_score;

      const seasonStart = normalizeSeasonStart(g, encoding);
      if(!seasonStart) continue;

      seasons.add(seasonStart);

      const oppRaw = isHome ? g.away_team : g.home_team;

      allGames.push({
        id: String(g.game_id),
        date: g.date || "",
        seasonStart,
        seasonLabel: seasonLabel(seasonStart),
        typeBucket: typeBucket(g.game_type),
        typeLabel: typeLabel(g.game_type),
        opponentFull: fullName(oppRaw),
        result: (Number(teamScore) > Number(oppScore)) ? "W" : "L",
        score: `${teamScore} - ${oppScore}`
      });
    }

    if(!allGames.length){
      showError(`Master loaded but 0 games matched team: ${teamRaw}`);
      elLoading.style.display="none";
      return;
    }

    fillSeasonSelect();
    render();

    elLoading.style.display="none";
  }catch(e){
    showError(String(e && e.stack ? e.stack : e));
    elLoading.style.display="none";
  }
}

elSeason.addEventListener("change", render);
elType.addEventListener("change", render);

load();
</script>

</body>
</html>
