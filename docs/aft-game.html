<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AFL Game</title>

<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;}
.page{max-width:1200px;margin:auto;padding:25px;}
h1{text-align:center;}

table{border-collapse:collapse;width:100%;background:#fff;}
th,td{border:1px solid #ccc;padding:6px 8px;text-align:center;}
th{background:#eee;}
td.left{text-align:left;font-weight:600;}
</style>
</head>

<body>
<div class="page">
<h1 id="title"></h1>
<table>
<thead>
<tr>
<th>Player</th>
<th>Team</th>
<th>D</th>
<th>G</th>
<th>B</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

<script>
const p=new URLSearchParams(location.search);
const season=p.get("season");
const round=p.get("round");
const team=p.get("team");
const opp=p.get("opp");

document.getElementById("title").textContent =
`${season} – ${round}: ${team} vs ${opp}`;

fetch(`data/afl/afl_${season}.json`)
.then(r=>r.json())
.then(data=>{
  const game=data.filter(x=>
    x.round===round &&
    (
      (x.played_for===team && x.played_against===opp) ||
      (x.played_for===opp && x.played_against===team)
    )
  );

  const tbody=document.getElementById("rows");
  game.forEach(p=>{
    tbody.innerHTML+=`
      <tr>
        <td class="left">${p.player}</td>
        <td>${p.played_for}</td>
        <td>${p.D||0}</td>
        <td>${p.G||0}</td>
        <td>${p.B||0}</td>
      </tr>`;
  });
});
</script>
</body>
</html>
