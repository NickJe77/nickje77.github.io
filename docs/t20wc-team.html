<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
             "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
margin:0;
background:#f3f4f7;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:white;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
}

.hero h1{
margin:0;
font-size:42px;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:0 20px 20px 20px;
}

.box{
background:#e7e7ec;
padding:18px;
border-radius:14px;
text-align:center;
}

.box .big{
font-size:30px;
font-weight:700;
}

.controls{
padding:20px;
display:flex;
justify-content:center;
}

select{
padding:14px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
width:320px;
background:white;
}

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

th{
background:#f1f1f1;
}

.result-win{
color:#008000;
font-weight:700;
}

.result-loss{
color:#c00000;
font-weight:700;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="t20wc.html">T20 World Cup</a>
<a href="t20wc-matches.html">Matches</a>
<a href="t20wc-team.html">Teams</a>
<a href="t20-world-cup-player.html">Players</a>
</div>

<div class="hero">
<h1 id="teamName">Loading...</h1>
</div>

<div id="summary" class="summary"></div>

<div class="controls">
<select id="teamSelect"></select>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Result</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>

const BASE="/data/t20-world-cup/matches/";


/* COUNTRY FLAGS */

const COUNTRY_CODES={
"Afghanistan":"AF",
"Australia":"AU",
"Bangladesh":"BD",
"Canada":"CA",
"England":"GB",
"India":"IN",
"Ireland":"IE",
"Namibia":"NA",
"Nepal":"NP",
"Netherlands":"NL",
"New Zealand":"NZ",
"Oman":"OM",
"Pakistan":"PK",
"Papua New Guinea":"PG",
"Scotland":"GB",
"South Africa":"ZA",
"Sri Lanka":"LK",
"United Arab Emirates":"AE",
"USA":"US",
"Uganda":"UG",
"West Indies":"JM",
"Zimbabwe":"ZW"
};

function flag(code){
return code.replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt()));
}

function getFlag(team){
return COUNTRY_CODES[team]?flag(COUNTRY_CODES[team]):"";
}


const teamName=document.getElementById("teamName");
const teamSelect=document.getElementById("teamSelect");
const tbody=document.getElementById("tbody");
const summary=document.getElementById("summary");

let ALL_MATCHES=[];

load();


async function load(){

const index=await fetch(BASE+"index.json").then(r=>r.json());

const teamsSet=new Set();

for(const file of index){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach((match,matchIndex)=>{

const event=(match.info?.event?.name || "").toLowerCase();

/* FINAL TOURNAMENT FILTER */

const isMainTournament=
(
event.includes("t20 world cup")
||
event.includes("world twenty20")
)
&& !event.includes("qualifier")
&& !event.includes("warm")
&& !event.includes("regional");

if(!isMainTournament) return;


match._file=file;
match._index=matchIndex;

ALL_MATCHES.push(match);

match.info.teams.forEach(t=>teamsSet.add(t));

});

}

const teams=[...teamsSet].sort();

teams.forEach(team=>{
teamSelect.innerHTML+=`<option value="${team}">
${getFlag(team)} ${team}
</option>`;
});

teamSelect.onchange=()=>showTeam(teamSelect.value);

showTeam(teams[0]);

}


function showTeam(team){

teamName.innerText=`${getFlag(team)} ${team}`;

tbody.innerHTML="";

let wins=0;
let losses=0;

const matches=ALL_MATCHES
.filter(m=>m.info.teams.includes(team))
.sort((a,b)=>new Date(b.info.dates[0])-new Date(a.info.dates[0]));

matches.forEach(m=>{

const opponent=m.info.teams.find(t=>t!==team);

let result="—";
let cls="";

if(m.info.outcome?.winner){

const margin=Object.entries(m.info.outcome.by||{})
.map(([k,v])=>`${v} ${k}`).join("");

if(m.info.outcome.winner===team){

result=`Won by ${margin}`;
cls="result-win";
wins++;

}else{

result=`Lost by ${margin}`;
cls="result-loss";
losses++;

}

}

tbody.innerHTML+=`
<tr onclick="location.href='t20-world-cup-match.html?file=${m._file}&match=${m._index}'">
<td>${new Date(m.info.dates[0]).toLocaleDateString("en-GB")}</td>
<td>${getFlag(opponent)} ${opponent}</td>
<td>${m.info.venue}</td>
<td class="${cls}">${result}</td>
</tr>
`;

});

const total=wins+losses;

summary.innerHTML=`
<div class="box"><div class="big">${total}</div>Matches</div>
<div class="box"><div class="big">${wins}</div>Wins</div>
<div class="box"><div class="big">${losses}</div>Losses</div>
<div class="box"><div class="big">${total?((wins/total)*100).toFixed(1):"—"}%</div>Win %</div>
`;

}

</script>

</body>
</html>
