<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
}

.page-wrap{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:40px;
  border-radius:20px;
  margin-bottom:20px;
}

.team-select{
  padding:10px;
  font-size:18px;
  margin-bottom:20px;
}

.year-btn{
  padding:10px;
  background:#6a040f;
  color:white;
  border:none;
  margin:4px;
  border-radius:8px;
  cursor:pointer;
}

.year-btn.active{
  background:#dc2f02;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

tr:nth-child(even){
  background:#eaf3ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1 id="teamName">Select Team</h1>
</div>

<select id="teamSelect" class="team-select"></select>

<div id="yearButtons"></div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Venue</th>
<th>Result</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

<script>

const INDEX="data/t20-world-cup/index.json";
const BASE="data/t20-world-cup/matches/";

let seasons=[];
let currentTeam=null;

const teamSelect=document.getElementById("teamSelect");
const table=document.getElementById("table");
const yearButtons=document.getElementById("yearButtons");

init();

async function init(){

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const matches=await fetch(BASE+file).then(r=>r.json());

seasons.push({
file:file,
year:file.match(/\d{4}/)[0],
matches:matches
});

}

seasons.sort((a,b)=>b.year-a.year);

buildTeams();

}

function buildTeams(){

const set=new Set();

seasons.forEach(s=>{

s.matches.forEach(m=>{
m.info.teams.forEach(t=>set.add(t));
});

});

teamSelect.innerHTML="<option>Select Team</option>";

[...set].sort().forEach(t=>{

const opt=document.createElement("option");
opt.value=t;
opt.textContent=t;
teamSelect.appendChild(opt);

});

}

teamSelect.onchange=()=>{

currentTeam=teamSelect.value;

document.getElementById("teamName").textContent=currentTeam;

buildYears();

};

function buildYears(){

yearButtons.innerHTML="";

seasons.forEach((s,si)=>{

const btn=document.createElement("button");

btn.className="year-btn";
btn.textContent=s.year;

btn.onclick=()=>{

document.querySelectorAll(".year-btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

showSeason(si);

};

yearButtons.appendChild(btn);

});

}

function showSeason(si){

table.innerHTML="";

seasons[si].matches.forEach((m,mi)=>{

if(!m.info.teams.includes(currentTeam)) return;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${m.info.dates[0]}</td>

<td>
<a href="t20wc-match.html?season=${si}&match=${mi}">
${m.info.teams.join(" vs ")}
</a>
</td>

<td>${m.info.venue||""}</td>

<td>${m.info.outcome?.winner||""}</td>

`;

table.appendChild(tr);

});

}

</script>

</body>
</html>
