<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
             "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
margin:0;
background:#f3f4f7;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:white;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
}

.hero h1{
margin:0;
font-size:42px;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:0 20px 20px 20px;
}

.box{
background:#e7e7ec;
padding:18px;
border-radius:14px;
text-align:center;
}

.box .big{
font-size:30px;
font-weight:700;
}

.controls{
padding:0 20px;
}

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

th{
background:#f1f1f1;
}

tr:hover{
background:#eef5ff;
cursor:pointer;
}

.result-win{
color:#008000;
font-weight:700;
}

.result-loss{
color:#c00000;
font-weight:700;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="t20wc.html">T20 World Cup</a>
<a href="t20wc-matches.html">Matches</a>
<a href="t20wc-team.html">Teams</a>
<a href="t20-world-cup-player.html">Players</a>
</div>

<div class="hero">
<h1 id="teamName">Loading...</h1>
</div>

<div id="summary" class="summary"></div>

<div class="controls">
<select id="teamSelect"></select>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Result</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>

const BASE="/data/t20-world-cup/matches/";

const teamName=document.getElementById("teamName");
const teamSelect=document.getElementById("teamSelect");
const tbody=document.getElementById("tbody");
const summary=document.getElementById("summary");

let ALL_MATCHES=[];

load();

async function load(){

const index=await fetch(BASE+"index.json").then(r=>r.json());

const teamsSet=new Set();

for(const file of index){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach((match,matchIndex)=>{

const stage=(match.info?.stage || "").toLowerCase();

const isMainMatch =
stage.includes("group")
|| stage.includes("super")
|| stage.includes("semi")
|| stage.includes("final");

if(!isMainMatch) return;

match._file=file;
match._index=matchIndex;

ALL_MATCHES.push(match);

match.info.teams.forEach(team=>teamsSet.add(team));

});

}

const teams=[...teamsSet].sort();

teams.forEach(team=>{
teamSelect.innerHTML+=`<option>${team}</option>`;
});

teamSelect.onchange=()=>showTeam(teamSelect.value);

showTeam(teams[0]);

}

function showTeam(team){

teamName.innerText=team;

tbody.innerHTML="";

let wins=0;
let losses=0;

const matches=ALL_MATCHES
.filter(m=>m.info.teams.includes(team))
.sort((a,b)=>new Date(b.info.dates[0])-new Date(a.info.dates[0]));

matches.forEach(match=>{

const opponent=match.info.teams.find(t=>t!==team);

let result="—";
let resultClass="";

if(match.info.outcome?.winner){

if(match.info.outcome.winner===team){

result="Win";
resultClass="result-win";
wins++;

}else{

result="Loss";
resultClass="result-loss";
losses++;

}

}

const tr=document.createElement("tr");

tr.onclick=()=>{
location.href=`t20-world-cup-match.html?file=${match._file}&match=${match._index}`;
};

tr.innerHTML=`
<td>${new Date(match.info.dates[0]).toLocaleDateString("en-GB")}</td>
<td>${opponent}</td>
<td>${match.info.venue}</td>
<td class="${resultClass}">${result}</td>
`;

tbody.appendChild(tr);

});

const total=wins+losses;

summary.innerHTML=`
<div class="box"><div class="big">${total}</div>Matches</div>
<div class="box"><div class="big">${wins}</div>Wins</div>
<div class="box"><div class="big">${losses}</div>Losses</div>
<div class="box"><div class="big">${total?((wins/total)*100).toFixed(1):"—"}%</div>Win %</div>
`;

}

</script>

</body>
</html>
