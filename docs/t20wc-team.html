<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>T20 World Cup Team</title>

<style>
body{
font-family:Inter;
margin:0;
background:#fff;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px;
margin:20px;
border-radius:16px;
font-size:28px;
font-weight:700;
}

select{
margin:20px;
padding:10px;
font-size:16px;
}

table{
width:calc(100% - 40px);
margin:20px;
border-collapse:collapse;
}

td,th{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left;
}

tr:nth-child(even){
background:#eaf3ff;
}

</style>

</head>

<body>

<div id="hero" class="hero">Loading teams...</div>

<select id="teamSelect"></select>

<table>

<thead>
<tr>
<th>Date</th>
<th>Match</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<script>

const BASE="/data/t20-world-cup/matches/";

const hero=document.getElementById("hero");
const teamSelect=document.getElementById("teamSelect");
const tbody=document.getElementById("tbody");

let ALL_MATCHES=[];

load();


async function load(){

try{

const index=await fetch(BASE+"index.json").then(r=>r.json());

const teamsSet=new Set();

for(const file of index){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{

ALL_MATCHES.push(match);

match.info.teams.forEach(team=>{
teamsSet.add(team);
});

});

}

const teams=[...teamsSet].sort();

teamSelect.innerHTML="";

teams.forEach(team=>{
teamSelect.innerHTML+=`<option value="${team}">${team}</option>`;
});

teamSelect.onchange=()=>{
showTeam(teamSelect.value);
};

if(teams.length>0){
showTeam(teams[0]);
}

}catch(e){

hero.innerHTML="Error loading team data";

console.error(e);

}

}


function showTeam(team){

hero.innerHTML=team;

tbody.innerHTML="";

const matches=ALL_MATCHES
.filter(m=>m.info.teams.includes(team))
.sort((a,b)=>new Date(b.info.dates[0]) - new Date(a.info.dates[0]));

matches.forEach(match=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${new Date(match.info.dates[0]).toLocaleDateString("en-GB")}</td>
<td>${match.info.teams.join(" vs ")}</td>
`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
