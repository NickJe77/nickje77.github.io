<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>T20 World Cup Team</title>

<style>
body{font-family:Inter;margin:0;background:#fff;}
.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px;
margin:20px;
border-radius:16px;
}
table{width:100%;border-collapse:collapse;}
td,th{padding:10px;border-bottom:1px solid #ddd;}
tr:nth-child(even){background:#eaf3ff;}
</style>

</head>

<body>

<div id="hero" class="hero">Select Team</div>

<select id="teamSelect"></select>

<table>
<thead>
<tr>
<th>Date</th>
<th>Match</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>

const BASE="/data/t20-world-cup/matches/";

const teamSelect=document.getElementById("teamSelect");

load();

async function load(){

const index=await fetch(BASE+"index.json").then(r=>r.json());

let teams=new Set();

let all=[];

for(const file of index){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(m=>{
m.info.teams.forEach(t=>teams.add(t));
all.push(m);
});

}

teams=[...teams].sort();

teams.forEach(t=>{
teamSelect.innerHTML+=`<option>${t}</option>`;
});

teamSelect.onchange=()=>{
show(teamSelect.value,all);
};

show(teams[0],all);

}

function show(team,all){

hero.innerHTML=team;

tbody.innerHTML="";

all.forEach(m=>{

if(m.info.teams.includes(team)){

tbody.innerHTML+=`
<tr>
<td>${m.info.dates[0]}</td>
<td>${m.info.teams.join(" vs ")}</td>
</tr>
`;

}

});

}

</script>

</body>
</html>
