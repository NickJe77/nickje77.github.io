<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Playoff Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}

h1{text-align:center;margin:0 0 10px;}
p{text-align:center;color:#555;margin:0 0 20px;}

details{
border:1px solid #ddd;
border-radius:8px;
padding:12px;
margin-bottom:14px;
}

summary{
font-weight:800;
font-size:20px;
cursor:pointer;
}

.round{
font-weight:800;
margin-top:12px;
}

.series{
padding:6px 0;
}

.winner{
font-weight:700;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<h1>NBA Playoff Series</h1>
<p>All NBA playoff series by season.</p>

<div id="out">Loading...</div>

</div>

<script>

const out = document.getElementById("out");

function seasonLabel(year){

year = Number(year);
const next = String((year+1)%100).padStart(2,"0");

return `${year}-${next}`;

}

async function loadSeries(){

const res = await fetch("/data/nba/playoff-series.json");

if(!res.ok){

out.innerHTML="<p>No playoff data found.</p>";
return;

}

const series = await res.json();

const seasons = {};

series.forEach(s=>{

if(!seasons[s.season]) seasons[s.season]=[];

seasons[s.season].push(s);

});

out.innerHTML="";

Object.keys(seasons)
.sort((a,b)=>b-a)
.forEach(season=>{

const seasonBlock = document.createElement("details");

const summary = document.createElement("summary");
summary.textContent = seasonLabel(season);

seasonBlock.appendChild(summary);

const rounds = {};

seasons[season].forEach(s=>{

if(!rounds[s.round]) rounds[s.round]=[];

rounds[s.round].push(s);

});

Object.keys(rounds).forEach(round=>{

const roundTitle = document.createElement("div");
roundTitle.className="round";
roundTitle.textContent = round;

seasonBlock.appendChild(roundTitle);

rounds[round].forEach(s=>{

const div = document.createElement("div");
div.className="series";

const winner =
s.team1_wins > s.team2_wins ? s.team1 : s.team2;

const loser =
s.team1_wins > s.team2_wins ? s.team2 : s.team1;

const w =
s.team1_wins > s.team2_wins ? s.team1_wins : s.team2_wins;

const l =
s.team1_wins > s.team2_wins ? s.team2_wins : s.team1_wins;

div.innerHTML = `
<span class="winner">${winner}</span> def.
${loser}
${w}-${l}
`;

seasonBlock.appendChild(div);

});

});

out.appendChild(seasonBlock);

});

}

loadSeries();

</script>

</body>
</html>
