<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Playoff Games | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;margin:0 0 10px;}
p{text-align:center;color:#555;margin:0 0 20px;}
details{border:1px solid #ddd;border-radius:8px;padding:10px;margin:0 0 14px;}
summary{font-weight:800;font-size:18px;cursor:pointer;}
.series-title{font-weight:700;margin:12px 0 6px;}
table{width:100%;border-collapse:collapse;margin-bottom:10px;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
.link{color:#0056d6;text-decoration:none;font-weight:600;}
.link:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">
<h1>NBA Playoff Games</h1>
<p>All playoff games by season.</p>

<div id="out">Loading...</div>
</div>

<script>

const START_YEAR = 1976;
const END_YEAR = 2025;
const out = document.getElementById("out");

async function loadPlayoffs(){

out.innerHTML = "";

for(let year = END_YEAR; year >= START_YEAR; year--){

try{

const indexRes = await fetch(`data/nba/${year}/index.json`);
if(!indexRes.ok) continue;

const index = await indexRes.json();
if(!index.games || !index.games.length) continue;

const gamePromises = index.games.map(id =>
fetch(`data/nba/${year}/${id}.json`)
.then(r => r.ok ? r.json() : null)
);

const games = (await Promise.all(gamePromises)).filter(Boolean);

const playoffGames = games
.filter(g => g.game_type === "Playoffs")
.sort((a,b)=> new Date(a.date) - new Date(b.date));

if(!playoffGames.length) continue;

// group by matchup
const seriesMap = {};

playoffGames.forEach(g=>{
const key = [g.home_team, g.away_team].sort().join("|");
if(!seriesMap[key]) seriesMap[key] = [];
seriesMap[key].push(g);
});

const seasonBlock = document.createElement("details");
seasonBlock.open = false;

const summary = document.createElement("summary");
summary.textContent = `${year}-${String(year+1).slice(2)}`;
seasonBlock.appendChild(summary);

Object.values(seriesMap).forEach(series=>{

series.sort((a,b)=> new Date(a.date) - new Date(b.date));

const title = document.createElement("div");
title.className = "series-title";
title.textContent = `${series[0].home_team} vs ${series[0].away_team}`;
seasonBlock.appendChild(title);

const table = document.createElement("table");
table.innerHTML = `
<thead>
<tr>
<th>Date</th>
<th>Result</th>
<th>Game</th>
</tr>
</thead>
<tbody></tbody>
`;

const tbody = table.querySelector("tbody");

series.forEach((g,i)=>{
const tr = document.createElement("tr");
tr.innerHTML = `
<td>${g.date}</td>
<td>${g.winner} ${g.home_score}–${g.away_score}</td>
<td><a class="link" href="nba-game.html?season=${year}&game=${g.game_id}">G${i+1}</a></td>
`;
tbody.appendChild(tr);
});

seasonBlock.appendChild(table);

});

out.appendChild(seasonBlock);

}catch(e){
continue;
}
}

if(!out.children.length){
out.innerHTML = "<p>No playoff data found.</p>";
}

}

loadPlayoffs();

</script>

</body>
</html>
