<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Playoff Games | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:28px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero p{margin:8px 0 0;color:rgba(255,255,255,.68);font-size:13.5px;}

.filters{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

details{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 20px;margin-bottom:18px;
}
summary{
  font-family:var(--display);font-size:18px;font-weight:600;cursor:pointer;
  letter-spacing:.01em;color:var(--ink);
}
.series-block{margin-top:16px;}
.series-title{font-weight:700;margin:14px 0 6px;color:var(--accent);font-size:14.5px;}
table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13.5px;}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);}
th{
  background:#f7f9fb;text-align:left;color:var(--muted);font-weight:600;
  font-family:var(--body);font-size:11px;letter-spacing:.04em;text-transform:uppercase;
}
td{color:#27313c;}
tbody tr{cursor:pointer;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.loading{text-align:center;padding:40px;color:var(--muted);font-style:italic;}
.winner{font-weight:700;color:var(--ink);}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div class="page-wrap">
  <div class="hero">
    <span class="eyebrow">NBA</span>
    <h1>NBA Playoff Games</h1>
    <p>Every NBA playoff game by season and series.</p>
  </div>

  <div class="filters">
    <select id="seasonSelect">
      <option value="">Select Season</option>
    </select>
  </div>

  <div id="out"><div class="loading">Select a season above.</div></div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

const seasonSelect = document.getElementById("seasonSelect");
const out          = document.getElementById("out");

for(let y = 2026; y >= 1977; y--){
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = `${y-1}-${y}`;
  seasonSelect.appendChild(opt);
}

seasonSelect.onchange = () => {
  const val = seasonSelect.value;
  if(val) loadSeason(parseInt(val));
};

function groupIntoSeries(games){
  const pairMap = {};
  games.forEach(g => {
    const key = [g.home, g.away].sort().join("|");
    if(!pairMap[key]) pairMap[key] = [];
    pairMap[key].push(g);
  });

  const series = [];

  Object.values(pairMap).forEach(pairGames => {
    pairGames.sort((a,b) => new Date(a.date) - new Date(b.date));

    let current = [pairGames[0]];
    for(let i = 1; i < pairGames.length; i++){
      const daysDiff = (new Date(pairGames[i].date) - new Date(pairGames[i-1].date)) / 86400000;
      if(daysDiff > 20){
        if(current.length >= 3) series.push(current);
        current = [pairGames[i]];
      } else {
        current.push(pairGames[i]);
      }
    }
    if(current.length >= 3) series.push(current);
  });

  series.sort((a,b) => new Date(a[0].date) - new Date(b[0].date));
  return series;
}

function renderSeason(season, games){
  const playoffGames = games.filter(g => g.playoff);
  if(!playoffGames.length) return null;

  const label   = `${season-1}-${season}`;
  const details = document.createElement("details");
  const summary = document.createElement("summary");
  summary.textContent = label;
  details.appendChild(summary);

  const seriesBlock = document.createElement("div");
  seriesBlock.className = "series-block";

  const allSeries = groupIntoSeries(playoffGames);

  if(!allSeries.length){
    const msg = document.createElement("p");
    msg.style.color = "#666";
    msg.textContent = "No playoff series found.";
    seriesBlock.appendChild(msg);
  }

  allSeries.forEach(seriesGames => {
    const teams = [...new Set([
      ...seriesGames.map(g => g.home),
      ...seriesGames.map(g => g.away)
    ])];

    const title = document.createElement("div");
    title.className = "series-title";
    title.textContent = `${teams[0]} vs ${teams[1] || ""}`;
    seriesBlock.appendChild(title);

    const table = document.createElement("table");
    table.innerHTML = `
      <thead>
        <tr>
          <th>Date</th>
          <th>Away</th>
          <th>Score</th>
          <th>Home</th>
          <th>Winner</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody = table.querySelector("tbody");
    seriesGames.forEach(g => {
      const winner = g.home_score > g.away_score ? g.home
                   : g.away_score > g.home_score ? g.away : "–";
      const tr = document.createElement("tr");
      tr.onclick = () => {
        window.location.href = `/nba-game.html?season=${season}&game=${g.game_id}`;
      };
      tr.innerHTML = `
        <td>${g.date || ""}</td>
        <td>${g.away || ""}</td>
        <td>${g.away_score ?? "–"} – ${g.home_score ?? "–"}</td>
        <td>${g.home || ""}</td>
        <td class="winner">${winner}</td>
      `;
      tbody.appendChild(tr);
    });

    seriesBlock.appendChild(table);
  });

  details.appendChild(seriesBlock);
  return details;
}

async function loadSeason(season){
  out.innerHTML = `<div class="loading">Loading ${season-1}-${season} playoffs...</div>`;
  try{
    const res = await fetch(`${R2}/basketball/indexes/${season}.json`);
    if(!res.ok) throw new Error("Not found");
    const games = await res.json();
    out.innerHTML = "";
    const block = renderSeason(season, games);
    if(block){
      block.open = true;
      out.appendChild(block);
    } else {
      out.innerHTML = `<div class="loading">No playoff games found.</div>`;
    }
  }catch(err){
    out.innerHTML = `<div class="loading">Failed to load season.</div>`;
  }
}
</script>
</body>
</html>
