<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Playoff Games | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(90deg,#1D428A,#C8102E);color:white;padding:26px 30px;border-radius:14px;margin-bottom:25px;box-shadow:0 6px 18px rgba(0,0,0,.12);}
.hero h1{margin:0;font-size:34px;font-weight:800;}
.hero p{margin:6px 0 0;opacity:.9;}
.filters{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
select{padding:10px 14px;border-radius:10px;border:1px solid #ccc;font-size:14px;background:#fff;}
details{background:#fff;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.05);padding:14px 18px;margin-bottom:18px;}
summary{font-size:20px;font-weight:800;cursor:pointer;}
.series-block{margin-top:16px;}
.series-title{font-weight:800;margin:14px 0 6px;color:#003a99;font-size:15px;}
table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:14px;}
th,td{padding:9px 10px;border-bottom:1px solid #eee;}
th{background:#eef3ff;text-align:left;font-weight:800;}
tr:nth-child(even){background:#f8faff;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#eaf0ff;}
.loading{text-align:center;padding:40px;color:#666;}
.winner{font-weight:800;}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div class="page-wrap">
  <div class="hero">
    <h1>NBA Playoff Games</h1>
    <p>Every NBA playoff game by season and series.</p>
  </div>

  <div class="filters">
    <select id="seasonSelect">
      <option value="">All Seasons</option>
    </select>
  </div>

  <div id="out"><div class="loading">Loading...</div></div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

const seasonSelect = document.getElementById("seasonSelect");
const out          = document.getElementById("out");

for(let y = 2026; y >= 1977; y--){
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = `${y-1}-${y}`;
  seasonSelect.appendChild(opt);
}

seasonSelect.onchange = () => {
  const val = seasonSelect.value;
  if(val) loadSeason(parseInt(val));
};

function groupIntoSeries(games){
  games.sort((a,b) => new Date(a.date) - new Date(b.date));

  const series = [];
  const used   = new Set();

  games.forEach((g, i) => {
    if(used.has(i)) return;
    const key     = [g.home, g.away].sort().join("|");
    const current = [g];
    used.add(i);

    for(let j = i+1; j < games.length; j++){
      if(used.has(j)) continue;
      const g2   = games[j];
      const key2 = [g2.home, g2.away].sort().join("|");
      if(key2 !== key) continue;
      const daysDiff = (new Date(g2.date) - new Date(current[current.length-1].date)) / 86400000;
      if(daysDiff <= 20){
        current.push(g2);
        used.add(j);
      }
    }

    // Only include series with 2+ games — single games are regular season
    if(current.length >= 2){
      series.push(current);
    }
  });

  return series;
}

function renderSeason(season, games){
  const playoffGames = games.filter(g => g.playoff);
  if(!playoffGames.length) return null;

  const label   = `${season-1}-${season}`;
  const details = document.createElement("details");
  const summary = document.createElement("summary");
  summary.textContent = label;
  details.appendChild(summary);

  const seriesBlock = document.createElement("div");
  seriesBlock.className = "series-block";

  const allSeries = groupIntoSeries(playoffGames);

  if(!allSeries.length){
    const msg = document.createElement("p");
    msg.textContent = "No playoff series found.";
    seriesBlock.appendChild(msg);
  }

  allSeries.forEach(seriesGames => {
    const teams = [...new Set([
      ...seriesGames.map(g => g.home),
      ...seriesGames.map(g => g.away)
    ])];

    const title = document.createElement("div");
    title.className = "series-title";
    title.textContent = teams.join(" vs ");
    seriesBlock.appendChild(title);

    const table = document.createElement("table");
    table.innerHTML = `
      <thead>
        <tr>
          <th>Date</th>
          <th>Away</th>
          <th>Score</th>
          <th>Home</th>
          <th>Winner</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody = table.querySelector("tbody");
    seriesGames.forEach(g => {
      const winner = g.home_score > g.away_score ? g.home
                   : g.away_score > g.home_score ? g.away : "–";
      const tr = document.createElement("tr");
      tr.onclick = () => {
        window.location.href = `/nba-game.html?season=${season}&game=${g.game_id}`;
      };
      tr.innerHTML = `
        <td>${g.date || ""}</td>
        <td>${g.away || ""}</td>
        <td>${g.away_score ?? "–"} – ${g.home_score ?? "–"}</td>
        <td>${g.home || ""}</td>
        <td class="winner">${winner}</td>
      `;
      tbody.appendChild(tr);
    });

    seriesBlock.appendChild(table);
  });

  details.appendChild(seriesBlock);
  return details;
}

async function loadSeason(season){
  out.innerHTML = `<div class="loading">Loading ${season-1}-${season} playoffs...</div>`;
  try{
    const res = await fetch(`${R2}/basketball/indexes/${season}.json`);
    if(!res.ok) throw new Error("Not found");
    const games = await res.json();
    out.innerHTML = "";
    const block = renderSeason(season, games);
    if(block){
      block.open = true;
      out.appendChild(block);
    } else {
      out.innerHTML = `<div class="loading">No playoff games found.</div>`;
    }
  }catch(err){
    out.innerHTML = `<div class="loading">Failed to load season.</div>`;
  }
}

loadSeason(2026);
seasonSelect.value = "2026";
</script>
</body>
</html>
