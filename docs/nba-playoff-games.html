<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Playoff Games | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#1D428A,#C8102E);
color:white;
padding:26px 30px;
border-radius:14px;
margin-bottom:25px;
box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.hero h1{
margin:0;
font-size:34px;
font-weight:800;
}

.hero p{
margin:6px 0 0;
opacity:.9;
}

/* SEASON BLOCK */

details{
background:#fff;
border-radius:14px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
padding:14px 18px;
margin-bottom:18px;
}

summary{
font-size:20px;
font-weight:800;
cursor:pointer;
}

.round-title{
font-weight:800;
margin:18px 0 6px;
color:#003a99;
}

.series-title{
font-weight:700;
margin:12px 0 6px;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
margin-bottom:14px;
font-size:14px;
}

th,td{
padding:9px 10px;
border-bottom:1px solid #eee;
}

th{
background:#eef3ff;
text-align:left;
}

tr:nth-child(even){
background:#f8faff;
}

tr:hover{
background:#eaf0ff;
cursor:pointer;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Playoff Games</h1>
<p>Every NBA playoff game by season and series.</p>
</div>

<div id="out">Loading...</div>

</div>

<script>

const out = document.getElementById("out");

/* season label */

function seasonLabel(year){
year = Number(year);
const next = String((year + 1) % 100).padStart(2,"0");
return `${year}-${next}`;
}

/* normalise round */

function normaliseRound(type){

type = type.toLowerCase();

if(type.includes("finals") && !type.includes("conference")) return "NBA Finals";
if(type.includes("conference finals")) return "Conference Finals";
if(type.includes("semifinals")) return "Conference Semifinals";
if(type.includes("first")) return "First Round";

return type;

}

/* load data */

async function loadPlayoffs(){

const res = await fetch("/data/nba/playoff-games.json");

if(!res.ok){
out.innerHTML = "<p>Playoff data not available.</p>";
return;
}

const games = await res.json();

const seasons = {};

games.forEach(g=>{

if(!seasons[g.season]) seasons[g.season] = [];
seasons[g.season].push(g);

});

out.innerHTML = "";

/* build seasons */

Object.keys(seasons)
.sort((a,b)=>b-a)
.forEach(season=>{

const seasonGames = seasons[season];

const seasonBlock = document.createElement("details");

const summary = document.createElement("summary");
summary.textContent = seasonLabel(season);

seasonBlock.appendChild(summary);

/* rounds */

const rounds = {};

seasonGames.forEach(g=>{

const round = normaliseRound(g.game_type);

if(!rounds[round]) rounds[round] = [];
rounds[round].push(g);

});

/* build rounds */

Object.keys(rounds).forEach(round=>{

const roundTitle = document.createElement("div");
roundTitle.className="round-title";
roundTitle.textContent=round;

seasonBlock.appendChild(roundTitle);

/* series */

const seriesMap = {};

rounds[round].forEach(g=>{

const key = [g.home_team,g.away_team].sort().join("|");

if(!seriesMap[key]) seriesMap[key] = [];

seriesMap[key].push(g);

});

/* build series */

Object.values(seriesMap).forEach(series=>{

series.sort((a,b)=> new Date(a.date) - new Date(b.date));

const title = document.createElement("div");
title.className="series-title";
title.textContent=`${series[0].home_team} vs ${series[0].away_team}`;

seasonBlock.appendChild(title);

/* table */

const table = document.createElement("table");

table.innerHTML=`
<thead>
<tr>
<th>Date</th>
<th>Score</th>
<th>Game</th>
</tr>
</thead>
<tbody></tbody>
`;

const tbody = table.querySelector("tbody");

series.forEach((g,i)=>{

const tr = document.createElement("tr");

tr.onclick = ()=>{
location.href=`nba-game.html?season=${season}&game=${g.game_id}`;
};

tr.innerHTML=`
<td>${g.date}</td>
<td>${g.home_team} ${g.home_score} – ${g.away_score} ${g.away_team}</td>
<td>Game ${i+1}</td>
`;

tbody.appendChild(tr);

});

seasonBlock.appendChild(table);

});

});

out.appendChild(seasonBlock);

});

}

loadPlayoffs();

</script>

</body>
</html>
