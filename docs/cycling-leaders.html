<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>TDF Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover{opacity:1;color:var(--accent);}

.page{max-width:900px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:36px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:10px;display:block;
}
h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,5vw,38px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.table-wrap{
  overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:center;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
td:first-child{text-align:left;font-weight:700;color:var(--ink);}
td a{color:inherit;text-decoration:none;}
td a:hover{color:var(--accent);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
</style>
</head>

<body>

<nav class="navbar">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
</nav>

<div class="page">

  <div class="hero">
    <span class="eyebrow">Tour de France</span>
    <h1>Tour de France Leaders</h1>
  </div>

  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Rider</th>
        <th>Wins</th>
        <th>Yellow</th>
        <th>Green</th>
        <th>Polka Dot</th>
        <th>White</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
  </div>

</div>

<script>

fetch("data/cycling/leaderboard.json")
.then(r=>r.json())
.then(data=>{

  const body=document.getElementById("body");

  data.forEach(d=>{

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td><a href="cycling-rider.html?name=${slug(d.Name)}">${d.Name}</a></td>
      <td>${d.Wins}</td>
      <td>${d.Yellow}</td>
      <td>${d.Green}</td>
      <td>${d.PolkaDot}</td>
      <td>${d.White}</td>
    `;

    body.appendChild(tr);
  });

});

function slug(name){
  return name.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

</script>

</body>
</html>
