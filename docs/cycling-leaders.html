<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>TDF Leaders | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">

<style>
body{font-family:system-ui;margin:0;padding:20px;}

.home-nav{
  display:flex;justify-content:center;gap:22px;padding:16px 0;
  border-bottom:1px solid #ddd;font-weight:600;
}

table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{padding:8px;border-bottom:1px solid #ddd;}
th{background:#111;color:#fff;}
</style>
</head>

<body>

<nav class="home-nav">
  <a href="./index.html">Home</a>
  <a href="./cycling.html">Cycling</a>
</nav>

<h1>Tour de France Leaders</h1>

<table>
<thead>
<tr>
<th>Rider</th>
<th>Wins</th>
<th>Yellow</th>
<th>Green</th>
<th>Polka Dot</th>
<th>White</th>
</tr>
</thead>

<tbody id="body"></tbody>
</table>

<script>

fetch("data/cycling/leaderboard.json")
.then(r=>r.json())
.then(data=>{

  const body=document.getElementById("body");

  data.forEach(d=>{

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td><a href="cycling-rider.html?name=${slug(d.Name)}">${d.Name}</a></td>
      <td>${d.Wins}</td>
      <td>${d.Yellow}</td>
      <td>${d.Green}</td>
      <td>${d.PolkaDot}</td>
      <td>${d.White}</td>
    `;

    body.appendChild(tr);
  });

});

function slug(name){
  return name.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

</script>

</body>
</html>
