<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>All-NBA Teams | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.container{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:22px;padding:32px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,5vw,38px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
  margin-bottom:20px;display:block;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

.team-block{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:18px;
}
.team-title{
  font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:12px;
  color:var(--ink);text-transform:uppercase;letter-spacing:.01em;
}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;}
tbody tr:last-child td,tr:last-child td{border-bottom:none;}
tr:hover td{background:#f9fbfd;}
.player-link{color:var(--ink);text-decoration:none;font-weight:700;}
.player-link:hover{color:var(--accent);}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div class="container">

  <div class="hero">
    <span class="eyebrow">NBA</span>
    <h1>All-NBA Teams</h1>
  </div>

  <select id="seasonSelect"></select>

  <div id="teams"></div>

</div>

<script>

const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

let DATA = [];
let playerIndex = [];

fetch(`${R2}/basketball/players/index.json`)
  .then(r => r.json())
  .then(idx => { playerIndex = idx; })
  .catch(() => {});

function findPlayerId(name){
  if(!name || !playerIndex.length) return null;
  const needle = name.toLowerCase().trim();
  const match = playerIndex.find(p => (p.name || "").toLowerCase().trim() === needle);
  return match ? match.id : null;
}

function slug(name){
  return name.toLowerCase()
    .replace(/[^a-z0-9 ]/g,"")
    .replace(/\s+/g,"-");
}

function renderSeason(season){
  const wrap = document.getElementById("teams");
  wrap.innerHTML = "";

  const seasonData = DATA.find(d => d.season === season);
  if(!seasonData) return;

  renderTeam("First Team", seasonData.first_team);
  renderTeam("Second Team", seasonData.second_team);
  renderTeam("Third Team", seasonData.third_team);
}

function renderTeam(title, players){
  if(!players || !players.length) return;

  const div = document.createElement("div");
  div.className = "team-block";

  const heading = document.createElement("div");
  heading.className = "team-title";
  heading.textContent = title;

  const table = document.createElement("table");

  players.forEach(p=>{
    const tr = document.createElement("tr");

    const td1 = document.createElement("td");
    const link = document.createElement("a");
    link.className = "player-link";
    const pid = findPlayerId(p.player);
    link.href = pid
      ? `/nba-player.html?id=${encodeURIComponent(pid)}`
      : `/nba-players-awards.html?player=${encodeURIComponent(p.player)}`;
    link.textContent = p.player;
    td1.appendChild(link);

    const td2 = document.createElement("td");
    td2.textContent = p.team;

    tr.appendChild(td1);
    tr.appendChild(td2);
    table.appendChild(tr);
  });

  div.appendChild(heading);
  div.appendChild(table);

  document.getElementById("teams").appendChild(div);
}

fetch("/data/nba/all_nba_teams.json")
  .then(r=>r.json())
  .then(data=>{
    DATA = data.sort((a,b)=> b.season.localeCompare(a.season));

    const select = document.getElementById("seasonSelect");

    DATA.forEach(d=>{
      const opt = document.createElement("option");
      opt.value = d.season;
      opt.textContent = d.season;
      select.appendChild(opt);
    });

    select.addEventListener("change", ()=>{
      renderSeason(select.value);
    });

    renderSeason(DATA[0].season);
  });

</script>

</body>
</html>
