<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
/* ALL YOUR CSS EXACTLY THE SAME */

.awards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.award-box{
  background:#eef3ff;
  border-radius:12px;
  padding:12px;
}

.award-name{
  font-weight:800;
  color:#003a99;
}
</style>
</head>
<body>

<!-- YOUR PAGE UNCHANGED ABOVE -->

<!-- 🔥 ADD THIS RIGHT UNDER HERO -->

<div class="section-card" id="awardsCard" style="display:none;">
  <div class="section-title">Awards</div>
  <div id="awardsContent"></div>
</div>

<!-- EVERYTHING ELSE STAYS EXACTLY THE SAME -->

<script>

/* YOUR ENTIRE EXISTING SCRIPT STAYS */

/* 🔥 ADD THIS AT VERY BOTTOM */

window.addEventListener("load", async function(){

  try{
    const res = await fetch("docs/data/nba/nba_awards.csv");
    if(!res.ok) return;

    const text = await res.text();
    const lines = text.split(/\r?\n/).filter(l => l.trim());

    const headers = lines[0].split(",");

    const slug = s => (s || "")
      .toLowerCase()
      .replace(/[^\w\s-]/g,"")
      .replace(/\s+/g,"-");

    const playerSlug = slug(document.getElementById("title").textContent);

    let grouped = {};

    for(let i=1;i<lines.length;i++){
      const parts = lines[i].split(",");
      const year = parts[0];

      for(let j=1;j<headers.length;j++){
        const player = parts[j];
        if(!player) continue;

        if(slug(player) === playerSlug){
          const award = headers[j].toUpperCase();
          if(!grouped[award]) grouped[award] = [];
          grouped[award].push(year);
        }
      }
    }

    if(!Object.keys(grouped).length) return;

    document.getElementById("awardsCard").style.display = "block";

    document.getElementById("awardsContent").innerHTML = `
      <div class="awards-grid">
        ${Object.keys(grouped).map(a => `
          <div class="award-box">
            <div class="award-name">${a}</div>
            <div>${grouped[a].sort((x,y)=>y-x).join(", ")}</div>
          </div>
        `).join("")}
      </div>
    `;

  }catch(e){
    console.log("Awards failed");
  }

});

</script>

</body>
</html>
