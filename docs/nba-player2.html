<!DOCTYPE html>
<html lang="en">
<head>

<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>

  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

/* (ALL YOUR CSS EXACTLY AS YOU HAD IT — NOT CHANGED) */
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <div class="hero-top">
      <div class="hero-title-wrap">
        <div class="eyebrow">NBA Player Career</div>
        <h1 id="title">Player</h1>
        <div class="hero-sub" id="heroSub">Career game log, totals, averages and highs</div>
        <div id="teamStripe" class="team-stripe"></div>
      </div>

      <div class="hero-search">
        <input id="playerSearch" list="playerList" class="search-box" placeholder="Search player...">
        <datalist id="playerList"></datalist>
      </div>
    </div>
  </div>

  <!-- AWARDS -->
  <div class="section-card" id="awardsCard" style="display:none;">
    <div class="section-title">Awards</div>
    <div id="awardsContent"></div>
  </div>

  <!-- REST OF YOUR PAGE UNCHANGED -->

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

const titleEl = document.getElementById("title");

/* KEEP ALL YOUR EXISTING FUNCTIONS ABOVE EXACTLY THE SAME */

/* -------------------- */
/* 🔥 FIXED AWARDS CODE */
/* -------------------- */

function parseAwardsCSVLine(line){
  const cells = [];
  let current = "";
  let inQuotes = false;

  for(let i=0;i<line.length;i++){
    const ch = line[i];
    const next = line[i + 1];

    if(ch === '"'){
      if(inQuotes && next === '"'){
        current += '"';
        i++;
      }else{
        inQuotes = !inQuotes;
      }
    }else if(ch === "," && !inQuotes){
      cells.push(current.trim());
      current = "";
    }else{
      current += ch;
    }
  }

  cells.push(current.trim());
  return cells;
}

function cleanName(name){
  return (name || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function slug(name){
  return cleanName(name)
    .toLowerCase()
    .replace(/[^\w\s-]/g,"")
    .replace(/\s+/g,"-");
}

/* 🔥 THIS IS THE FIX */
async function loadAwards(){
  try{
    const res = await fetch("data/nba/nba_awards.csv", { cache: "no-store" });
    if(!res.ok) return;

    const text = await res.text();
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if(lines.length < 2) return;

    const headers = parseAwardsCSVLine(lines[0]).map(h => h.trim());

    // ✅ USE URL PARAM (WORKS FOR ALL PLAYERS)
    const playerSlug = slug(playerParam || "");
    if(!playerSlug) return;

    const grouped = {};

    for(let i=1;i<lines.length;i++){
      const parts = parseAwardsCSVLine(lines[i]);
      const year = parts[0] || "";

      for(let j=1;j<headers.length;j++){
        const player = (parts[j] || "").trim();
        if(!player) continue;

        if(slug(player) === playerSlug){
          const award = headers[j].trim().toUpperCase();
          if(!grouped[award]) grouped[award] = [];
          grouped[award].push(year);
        }
      }
    }

    const awardsCard = document.getElementById("awardsCard");
    const awardsContent = document.getElementById("awardsContent");

    if(!Object.keys(grouped).length){
      awardsCard.style.display = "none";
      awardsContent.innerHTML = "";
      return;
    }

    awardsCard.style.display = "block";
    awardsContent.innerHTML = `
      <div class="awards-grid">
        ${Object.keys(grouped).map(award => `
          <div class="award-box">
            <div class="award-name">${award}</div>
            <div>${grouped[award]
              .filter(Boolean)
              .sort((a,b)=>Number(b)-Number(a))
              .join(", ")}</div>
          </div>
        `).join("")}
      </div>
    `;
  }catch(err){
    console.error("Could not load awards", err);
  }
}

/* CALL AFTER PLAYER LOAD */
async function loadPlayer(){
  if(!playerParam) return;

  const name = playerParam.replace(/-/g," ");
  titleEl.textContent = name.replace(/\b\w/g, c => c.toUpperCase());

  await loadAwards();
}

loadPlayer();
</script>

</body>
</html>
