<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>W.S. Cox Plate | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./css/racing.css">

<style>
body {
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#ffffff;
    color:#111;
}

.navbar {
    text-align:center;
    padding:16px 0;
    border-bottom:1px solid #ddd;
}

.navbar a {
    margin:0 18px;
    text-decoration:none;
    font-size:18px;
    font-weight:600;
    color:#0056d6;
}

.navbar a:hover {
    text-decoration:underline;
}

.header-hero {
    width:100%;
    height:340px;
    background:url("./images/cox-plate-header.jpg") center/cover no-repeat;
    position:relative;
}

.header-overlay {
    position:absolute;
    inset:0;
    background:linear-gradient(to right, rgba(0,0,0,0.6), rgba(0,0,0,0.1));
}

.page-title {
    position:absolute;
    bottom:30px;
    left:40px;
    font-size:42px;
    font-weight:bold;
    letter-spacing:2px;
    color:white;
}

.content-wrap {
    max-width:1200px;
    margin:auto;
    padding:40px;
}

.intro {
    font-size:18px;
    line-height:1.6;
    color:#333;
    margin-bottom:40px;
}

.tile-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:28px;
}

.tile {
    position:relative;
    overflow:hidden;
    border-radius:10px;
    cursor:pointer;
    background:#f2f2f2;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.tile img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.4s ease;
}

.tile:hover img {
    transform:scale(1.05);
}

.tile-title {
    position:absolute;
    bottom:0;
    width:100%;
    padding:14px;
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    font-size:18px;
    font-weight:bold;
    color:white;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>

  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="header-hero">
    <div class="header-overlay"></div>
    <div class="page-title">W.S. COX PLATE</div>
</div>

<div class="content-wrap">

<div class="intro">
The W.S. Cox Plate is Australia’s weight-for-age championship and one of the greatest races in world racing history.
From Phar Lap to Winx, legends have defined themselves on this stage at Moonee Valley.
</div>

<div class="tile-grid">

<div class="tile" onclick="location.href='cox-plate-winners.html'">
<img src="./images/tiles/cox-winners.jpg">
<div class="tile-title">Winners</div>
</div>

<div class="tile" onclick="location.href='cox-plate-jockeys.html'">
<img src="./images/tiles/cox-jockeys.jpg">
<div class="tile-title">Jockeys</div>
</div>

<div class="tile" onclick="location.href='cox-plate-trainers.html'">
<img src="./images/tiles/cox-trainers.jpg">
<div class="tile-title">Trainers</div>
</div>

</div>
</div>

</body>
</html>
