<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Davis Cup | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

.search-box{
  position:relative;
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  box-sizing:border-box;
  padding:14px 16px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:16px;
  background:#fff;
}

.suggestions{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  background:#fff;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.12);
  max-height:260px;
  overflow-y:auto;
  z-index:20;
}

.suggestions div{
  padding:12px 14px;
  cursor:pointer;
  border-bottom:1px solid #eee;
}

.suggestions div:last-child{
  border-bottom:none;
}

.suggestions div:hover{
  background:#f2f6ff;
}

.country-box{
  background:#fff;
  padding:22px;
  border-radius:18px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  margin-bottom:24px;
  text-align:center;
  font-size:30px;
  font-weight:800;
  min-height:34px;
}

.section-title{
  font-size:26px;
  font-weight:800;
  margin:0 0 14px 0;
}

.table-wrap{
  overflow-x:auto;
  margin-bottom:24px;
}

table{
  width:100%;
  min-width:760px;
  border-collapse:collapse;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

th{
  background:#111;
  color:#fff;
  padding:12px;
  font-size:16px;
}

td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:center;
}

td:first-child{
  text-align:left;
}

tbody tr:nth-child(even){
  background:#f2f6ff;
}

.player-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}

@media (max-width:768px){
  .country-box{
    font-size:24px;
    padding:18px;
  }

  th, td{
    font-size:14px;
    padding:8px;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="tennis.html">Tennis</a>
  <a href="tennis-players.html">Players</a>
</div>

<div class="wrap">

  <div class="search-box">
    <input id="countrySearch" type="text" placeholder="Search country...">
    <div id="suggestions" class="suggestions" style="display:none;"></div>
  </div>

  <div id="countryBox" class="country-box"></div>

  <h2 class="section-title">Results</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Opponent</th>
          <th>Player 1</th>
          <th>Player 2</th>
          <th>Winner</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="resultsTable"></tbody>
    </table>
  </div>

  <h2 class="section-title">Players</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Player</th>
        </tr>
      </thead>
      <tbody id="playersTable"></tbody>
    </table>
  </div>

</div>

<script>
const FLAGS = {
  "Australia":"🇦🇺",
  "Austria":"🇦🇹",
  "Argentina":"🇦🇷",
  "Belgium":"🇧🇪",
  "Belarus":"🇧🇾",
  "Brazil":"🇧🇷",
  "Bulgaria":"🇧🇬",
  "Canada":"🇨🇦",
  "Chile":"🇨🇱",
  "China":"🇨🇳",
  "Colombia":"🇨🇴",
  "Croatia":"🇭🇷",
  "Czech Republic":"🇨🇿",
  "Denmark":"🇩🇰",
  "Ecuador":"🇪🇨",
  "Egypt":"🇪🇬",
  "Finland":"🇫🇮",
  "France":"🇫🇷",
  "Germany":"🇩🇪",
  "Greece":"🇬🇷",
  "Hungary":"🇭🇺",
  "India":"🇮🇳",
  "Israel":"🇮🇱",
  "Italy":"🇮🇹",
  "Japan":"🇯🇵",
  "Kazakhstan":"🇰🇿",
  "Mexico":"🇲🇽",
  "Morocco":"🇲🇦",
  "Netherlands":"🇳🇱",
  "New Zealand":"🇳🇿",
  "Norway":"🇳🇴",
  "Peru":"🇵🇪",
  "Poland":"🇵🇱",
  "Portugal":"🇵🇹",
  "Romania":"🇷🇴",
  "Russia":"🇷🇺",
  "Serbia":"🇷🇸",
  "South Africa":"🇿🇦",
  "South Korea":"🇰🇷",
  "Spain":"🇪🇸",
  "Sweden":"🇸🇪",
  "Switzerland":"🇨🇭",
  "Tunisia":"🇹🇳",
  "Turkey":"🇹🇷",
  "Ukraine":"🇺🇦",
  "United Kingdom":"🇬🇧",
  "United States":"🇺🇸",
  "Uruguay":"🇺🇾",
  "Venezuela":"🇻🇪"
};

let davisMatches = [];
let playerCountries = {};
let countries = [];

async function fetchJsonWithFallback(primary, fallback){
  let res = await fetch(primary);
  if(!res.ok && fallback) res = await fetch(fallback);
  if(!res.ok) return null;
  return res.json();
}

async function loadData(){
  const pc = await fetchJsonWithFallback(
    "/data/tennis/player_countries.json",
    "/docs/data/tennis/player_countries.json"
  );
  playerCountries = pc || {};

  const years = [];
  for(let y = 2026; y >= 1968; y--) years.push(y);

  const requests = years.map(y =>
    fetchJsonWithFallback(
      `/data/tennis/seasons/${y}.json`,
      `/docs/data/tennis/seasons/${y}.json`
    )
  );

  const results = await Promise.all(requests);

  results.forEach(data => {
    if(!data) return;

    const games = Array.isArray(data) ? data : (data.matches || []);

    games.forEach(g => {
      const tournament = (g.tournament || "").toLowerCase();
      if(tournament.includes("davis cup")){
        davisMatches.push(g);
      }
    });
  });

  const countrySet = new Set();

  davisMatches.forEach(g => {
    const c1 = playerCountries[g.player1];
    const c2 = playerCountries[g.player2];
    if(c1) countrySet.add(c1);
    if(c2) countrySet.add(c2);
  });

  countries = [...countrySet].sort();
}

function renderSuggestions(value){
  const box = document.getElementById("suggestions");
  box.innerHTML = "";

  if(!value){
    box.style.display = "none";
    return;
  }

  const matches = countries
    .filter(c => c.toLowerCase().includes(value.toLowerCase()))
    .slice(0, 10);

  if(!matches.length){
    box.style.display = "none";
    return;
  }

  matches.forEach(country => {
    const div = document.createElement("div");
    const flag = FLAGS[country] || "";
    div.textContent = `${flag} ${country}`.trim();
    div.onclick = () => {
      document.getElementById("countrySearch").value = country;
      box.style.display = "none";
      renderCountry(country);
    };
    box.appendChild(div);
  });

  box.style.display = "block";
}

function renderCountry(country){
  const flag = FLAGS[country] || "";
  document.getElementById("countryBox").textContent = `${flag} ${country}`.trim();

  const games = davisMatches
    .filter(g => playerCountries[g.player1] === country || playerCountries[g.player2] === country)
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  const countryPlayers = new Set();

  const resultsHtml = games.map(g => {
    if(playerCountries[g.player1] === country) countryPlayers.add(g.player1);
    if(playerCountries[g.player2] === country) countryPlayers.add(g.player2);

    const opponent =
      playerCountries[g.player1] === country
        ? (playerCountries[g.player2] || "")
        : (playerCountries[g.player1] || "");

    const p1Link = `tennis-player.html?player=${encodeURIComponent(g.player1 || "")}`;
    const p2Link = `tennis-player.html?player=${encodeURIComponent(g.player2 || "")}`;

    return `
      <tr>
        <td>${g.date || ""}</td>
        <td>${opponent}</td>
        <td><a class="player-link" href="${p1Link}">${g.player1 || ""}</a></td>
        <td><a class="player-link" href="${p2Link}">${g.player2 || ""}</a></td>
        <td>${g.winner || ""}</td>
        <td>${g.score || ""}</td>
      </tr>
    `;
  }).join("");

  document.getElementById("resultsTable").innerHTML = resultsHtml;

  const playersHtml = [...countryPlayers]
    .sort()
    .map(player => `
      <tr>
        <td><a class="player-link" href="tennis-player.html?player=${encodeURIComponent(player)}">${player}</a></td>
      </tr>
    `)
    .join("");

  document.getElementById("playersTable").innerHTML = playersHtml;
}

async function init(){
  await loadData();

  const input = document.getElementById("countrySearch");
  const box = document.getElementById("suggestions");

  input.addEventListener("input", e => {
    renderSuggestions(e.target.value);
  });

  input.addEventListener("focus", e => {
    renderSuggestions(e.target.value);
  });

  document.addEventListener("click", e => {
    if(!e.target.closest(".search-box")){
      box.style.display = "none";
    }
  });

  document.getElementById("countryBox").textContent = "Select a country";
}

init();
</script>

</body>
</html>
