<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Davis Cup | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;}

.wrap{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

.select{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
margin-bottom:20px;
font-size:16px;
}

.country-box{
background:#fff;
padding:20px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
text-align:center;
font-size:26px;
font-weight:700;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

th{
background:#111;
color:#fff;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

tbody tr:nth-child(even){
background:#f2f6ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html">Tennis</a>
<a href="tennis-players.html">Players</a>
</div>

<div class="wrap">

<input id="countrySearch" class="select" placeholder="Search country...">

<div id="countryBox" class="country-box"></div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Player 1</th>
<th>Player 2</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

<script>

// -------------------------
// FLAG MAP (emoji)
// -------------------------
const FLAGS = {
"United States":"🇺🇸",
"Australia":"🇦🇺",
"Switzerland":"🇨🇭",
"Spain":"🇪🇸",
"France":"🇫🇷",
"Germany":"🇩🇪",
"United Kingdom":"🇬🇧",
"Serbia":"🇷🇸",
"Argentina":"🇦🇷",
"Canada":"🇨🇦",
"Italy":"🇮🇹",
"Japan":"🇯🇵",
"Croatia":"🇭🇷",
"Brazil":"🇧🇷",
"Belgium":"🇧🇪",
"Netherlands":"🇳🇱"
};

// -------------------------
// LOAD DATA
// -------------------------
let matches = [];
let playerCountries = {};

async function loadData(){

  // player → country map
  let pc = await fetch("/data/tennis/player_countries.json");
  if(!pc.ok) pc = await fetch("/docs/data/tennis/player_countries.json");
  playerCountries = await pc.json();

  // seasons
  for(let y=2026; y>=1968; y--){

    try{
      let res = await fetch(`/data/tennis/seasons/${y}.json`);
      if(!res.ok) res = await fetch(`/docs/data/tennis/seasons/${y}.json`);
      if(!res.ok) continue;

      let data = await res.json();
      let games = Array.isArray(data) ? data : (data.matches || []);

      games.forEach(g=>{
        if(g.tournament && g.tournament.includes("Davis Cup")){
          matches.push(g);
        }
      });

    }catch(e){continue;}

  }

  buildCountryList();
}

// -------------------------
// BUILD COUNTRY LIST
// -------------------------
function buildCountryList(){

  const countries = new Set();

  matches.forEach(m=>{
    const c1 = playerCountries[m.player1];
    const c2 = playerCountries[m.player2];

    if(c1) countries.add(c1);
    if(c2) countries.add(c2);
  });

  const input = document.getElementById("countrySearch");

  input.addEventListener("input", ()=>{
    const val = input.value.toLowerCase();

    const match = [...countries].find(c=>c.toLowerCase().includes(val));
    if(match) render(match);
  });

}

// -------------------------
// RENDER
// -------------------------
function render(country){

  const tbody = document.getElementById("table");
  tbody.innerHTML = "";

  const flag = FLAGS[country] || "";

  document.getElementById("countryBox").textContent = `${flag} ${country}`;

  let games = matches.filter(m=>{
    return playerCountries[m.player1] === country ||
           playerCountries[m.player2] === country;
  });

  // 🔥 SORT NEWEST → OLDEST
  games.sort((a,b)=> new Date(b.date) - new Date(a.date));

  games.forEach(g=>{

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${g.date || ""}</td>
      <td>${playerCountries[g.player1] === country ? playerCountries[g.player2] : playerCountries[g.player1]}</td>
      <td>${g.player1}</td>
      <td>${g.player2}</td>
      <td>${g.winner}</td>
      <td>${g.score || ""}</td>
    `;

    tbody.appendChild(tr);

  });

}

loadData();

</script>

</body>
</html>
