<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Records | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1300px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

.tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.tab{
  padding:10px 16px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:#2b004f;
  color:white;
  font-weight:600;
}
.tab:hover{background:#4b0082;}
.tab.active{background:#9d4edd;}

.panel{
  border:1px solid #ddd;
  border-radius:16px;
  padding:15px;
  background:#faf7ff;
  margin-bottom:15px;
}

.search-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}
.search-row input{
  flex:1;
  min-width:260px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}
.search-row a{
  display:inline-block;
  padding:10px 16px;
  background:#5a189a;
  color:white;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
}
.search-row a:hover{background:#7b2cbf;}
.smallnote{color:#666;margin-top:6px;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}

.player-link{
  color:#3b007a;
  font-weight:700;
  text-decoration:none;
}
.player-link:hover{text-decoration:underline;}

.match-link{
  color:#0056d6;
  font-weight:700;
  text-decoration:none;
}
.match-link:hover{text-decoration:underline;}

.badge{
  display:inline-block;
  padding:2px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  border:1px solid #ddd;
  background:#fff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>IPL Records</h1>
  <p>Best innings, best bowling figures, biggest partnerships and player profiles.</p>
</div>

<div class="tabs">
  <button class="tab active" data-tab="innings">Best Innings</button>
  <button class="tab" data-tab="bowling">Best Bowling</button>
  <button class="tab" data-tab="partnerships">Partnerships</button>
  <button class="tab" data-tab="players">Player Finder</button>
</div>

<div id="playerPanel" class="panel" style="display:none;">
  <div class="search-row">
    <input id="playerInput" list="playerList" placeholder="Type a player name…">
    <datalist id="playerList"></datalist>
    <a id="openPlayerBtn" href="ipl-player.html">Open Player</a>
  </div>
  <div class="smallnote">Start typing and choose a player from the list.</div>
</div>

<table>
<thead>
<tr id="theadRow"></tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";

const tabs = document.querySelectorAll(".tab");
const tbody = document.getElementById("tbody");
const theadRow = document.getElementById("theadRow");

const playerPanel = document.getElementById("playerPanel");
const playerInput = document.getElementById("playerInput");
const playerList = document.getElementById("playerList");
const openPlayerBtn = document.getElementById("openPlayerBtn");

let ALL_PLAYERS = new Set();
let BEST_INNINGS = [];
let BEST_BOWLING = [];
let BEST_PARTNERSHIPS = [];

function setActive(tabKey){
  tabs.forEach(b => b.classList.toggle("active", b.dataset.tab === tabKey));
  playerPanel.style.display = (tabKey === "players") ? "block" : "none";

  if(tabKey === "innings"){
    theadRow.innerHTML = `
      <th>Rank</th><th>Player</th><th>Runs</th><th>Balls</th><th>How Out</th><th>Season</th><th>Match</th>
    `;
    renderRows(BEST_INNINGS);
  }
  else if(tabKey === "bowling"){
    theadRow.innerHTML = `
      <th>Rank</th><th>Bowler</th><th>Figures</th><th>Overs</th><th>Season</th><th>Match</th>
    `;
    renderRows(BEST_BOWLING);
  }
  else if(tabKey === "partnerships"){
    theadRow.innerHTML = `
      <th>Rank</th><th>Batters</th><th>Runs</th><th>Team</th><th>Season</th><th>Match</th>
    `;
    renderRows(BEST_PARTNERSHIPS);
  }
  else{
    theadRow.innerHTML = `<th>Player Finder</th>`;
    tbody.innerHTML = `<tr><td>Use the search box above.</td></tr>`;
  }
}

tabs.forEach(btn=>{
  btn.addEventListener("click", ()=> setActive(btn.dataset.tab));
});

playerInput.addEventListener("input", ()=>{
  const val = playerInput.value.trim();
  openPlayerBtn.href = "ipl-player.html?player=" + encodeURIComponent(val);
});

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[m]));
}

function matchLink(file){
  return `<a class="match-link" href="ipl-match.html?file=${encodeURIComponent(file)}">Scorecard</a>`;
}
function playerLink(name){
  return `<a class="player-link" href="ipl-player.html?player=${encodeURIComponent(name)}">${escapeHtml(name)}</a>`;
}

function isWide(d){ return d.extras && d.extras.wides; }
function isLegalBall(d){ return !isWide(d); }

function bowlerGetsWicket(kind){
  const k=(kind||"").toLowerCase();
  return !["run out","retired hurt","obstructing the field"].includes(k);
}

function oversFromBalls(balls){
  const o=Math.floor(balls/6);
  const b=balls%6;
  return o+"."+b;
}

function renderRows(rows){
  tbody.innerHTML = rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("");
}

fetch(indexUrl)
.then(r=>r.json())
.then(files=>Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json()))))
.then(seasons=>{
  const inningsAgg=new Map();
  const bowlingAgg=new Map();
  const partnerships=[];

  seasons.forEach(matches=>{
    matches.forEach(match=>{
      const file=match.file;
      const season=match.info?.season || match.info?.dates?.[0]?.slice(0,4) || "";

      match.innings.forEach((inn,innIndex)=>{
        let currentPair=null;
        let currentRuns=0;
        let currentBatters=[];

        inn.overs.forEach(over=>{
          over.deliveries.forEach(d=>{
            const batter=d.batter;
            const non=d.non_striker;
            const bowler=d.bowler;

            ALL_PLAYERS.add(batter);
            ALL_PLAYERS.add(non);
            ALL_PLAYERS.add(bowler);

            const ikey=file+"|"+innIndex+"|"+batter;
            if(!inningsAgg.has(ikey)) inningsAgg.set(ikey,{batter,runs:0,balls:0,season,file,how:"not out"});
            const ib=inningsAgg.get(ikey);
            ib.runs+=d.runs.batter;
            if(!isWide(d)) ib.balls++;

            const bkey=file+"|"+innIndex+"|"+bowler;
            if(!bowlingAgg.has(bkey)) bowlingAgg.set(bkey,{bowler,wkts:0,runs:0,balls:0,season,file});
            const bw=bowlingAgg.get(bkey);
            bw.runs+=d.runs.total;
            if(isLegalBall(d)) bw.balls++;

            if(d.wickets){
              d.wickets.forEach(w=>{
                if(w.player_out){
                  ib.how=w.kind+" b "+bowler;
                }
                if(bowlerGetsWicket(w.kind)){
                  bw.wkts++;
                }
              });
            }

            const pair=[batter,non].sort().join(" & ");
            if(!currentPair){
              currentPair=pair;
              currentBatters=[batter,non];
              currentRuns=0;
            }else if(pair!==currentPair){
              partnerships.push({batters:currentBatters,runs:currentRuns,team:inn.team,season,file});
              currentPair=pair;
              currentBatters=[batter,non];
              currentRuns=0;
            }
            currentRuns+=d.runs.total;
          });
        });

        partnerships.push({batters:currentBatters,runs:currentRuns,team:inn.team,season,file});
      });
    });
  });

  const players=[...ALL_PLAYERS].sort();
  playerList.innerHTML=players.map(p=>`<option value="${escapeHtml(p)}"></option>`).join("");

  BEST_INNINGS=[...inningsAgg.values()]
    .sort((a,b)=>b.runs-a.runs)
    .slice(0,50)
    .map((x,i)=>[
      i+1,
      playerLink(x.batter),
      `<span class="badge">${x.runs}</span>`,
      x.balls,
      escapeHtml(x.how),
      escapeHtml(x.season),
      matchLink(x.file)
    ]);

  BEST_BOWLING=[...bowlingAgg.values()]
    .sort((a,b)=>b.wkts-a.wkts)
    .slice(0,50)
    .map((x,i)=>[
      i+1,
      playerLink(x.bowler),
      `<span class="badge">${x.wkts}/${x.runs}</span>`,
      oversFromBalls(x.balls),
      escapeHtml(x.season),
      matchLink(x.file)
    ]);

  BEST_PARTNERSHIPS=partnerships
    .sort((a,b)=>b.runs-a.runs)
    .slice(0,50)
    .map((p,i)=>[
      i+1,
      playerLink(p.batters[0])+" & "+playerLink(p.batters[1]),
      `<span class="badge">${p.runs}</span>`,
      escapeHtml(p.team),
      escapeHtml(p.season),
      matchLink(p.file)
    ]);

  setActive("innings");
});
</script>

</body>
</html>
