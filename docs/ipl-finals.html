<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:30px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:16px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:12px 14px;
  text-align:left;
}
th{
  background:#f3f6fb;
}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}

.winner{
  font-weight:600;
  color:#1a7f37;
}
.runnerup{
  color:#b42318;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>Indian Premier League Finals</h1>
  <p>Every IPL final with winner, runner-up and venue.</p>
</div>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Winner</th>
  <th>Runner-up</th>
  <th>Date</th>
  <th>Venue</th>
</tr>
</thead>
<tbody id="finalsTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const tableBody = document.getElementById("finalsTable");

const teamMap = {
  "Royal Challengers": "Royal Challengers Bengaluru",
  "Royal Challengers Bangalore": "Royal Challengers Bengaluru",
  "Rising Pune Supergiants": "Rising Pune Supergiant",
  "Rising Pune Supergiant": "Rising Pune Supergiant",
  "Rising Challengers": "Rising Pune Supergiant"
};

function normalizeTeam(name){
  return teamMap[name] || name;
}

fetch(indexUrl)
  .then(r=>r.json())
  .then(files=>Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json()))))
  .then(seasons=>{
    const finals = [];

    seasons.forEach(matches=>{
      if(!matches.length) return;

      matches.sort((a,b)=>new Date(b.date) - new Date(a.date));
      const finalMatch = matches[0];

      const season = finalMatch.date.slice(0,4);
      const teams = finalMatch.teams?.map(normalizeTeam) || [];
      const winner = normalizeTeam(finalMatch?.outcome?.winner || "");
      const runnerUp = teams.find(t=>t !== winner) || "";

      finals.push({
        season,
        winner,
        runnerUp,
        date: finalMatch.date,
        venue: finalMatch.venue || ""
      });
    });

    finals.sort((a,b)=>b.season - a.season);

    finals.forEach(f=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${f.season}</td>
        <td class="winner">${f.winner}</td>
        <td class="runnerup">${f.runnerUp}</td>
        <td>${f.date}</td>
        <td>${f.venue}</td>
      `;
      tableBody.appendChild(tr);
    });
  });
</script>

</body>
</html>
