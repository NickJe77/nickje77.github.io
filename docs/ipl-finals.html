<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Finals DEBUG</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:monospace;margin:0;padding:20px;background:#000;color:#0f0;}
</style>
</head>

<body>

<h1>IPL Finals DEBUG</h1>
<pre id="log">Starting…</pre>

<script>
const logBox = document.getElementById("log");

function log(msg){
  logBox.textContent += "\n" + msg;
}

const indexUrl = "data/ipl/index.json";
const seasonPath = "data/ipl/";
const matchPath = "data/ipl/matches/";

function calculateScore(match){
  let totals = {};
  let wickets = {};

  match.innings.forEach(inn=>{
    totals[inn.team] = 0;
    wickets[inn.team] = 0;
    inn.overs.forEach(o=>{
      o.deliveries.forEach(d=>{
        totals[inn.team] += d.runs?.total || 0;
        if(d.wickets) wickets[inn.team] += d.wickets.length;
      });
    });
  });

  const t = Object.keys(totals);
  return `${t[0]} ${totals[t[0]]}/${wickets[t[0]]} vs ${t[1]} ${totals[t[1]]}/${wickets[t[1]]}`;
}

log("Fetching index.json");

fetch(indexUrl)
.then(r=>{ log("index status "+r.status); return r.json(); })
.then(seasonFiles=>{
  log("Season files: "+seasonFiles.length);

  return Promise.all(seasonFiles.map(sf=>{
    log("Loading "+sf);
    return fetch(seasonPath+sf)
      .then(r=>{ log(sf+" status "+r.status); return r.json(); });
  }));
})
.then(seasons=>{
  return Promise.all(seasons.map(season=>{
    season.sort((a,b)=>new Date(b.date)-new Date(a.date));
    const finalSummary = season[0];
    log("Final summary file = "+finalSummary.file);

    return fetch(matchPath+finalSummary.file)
      .then(r=>{
        log("Match "+finalSummary.file+" status "+r.status);
        return r.json();
      })
      .then(fullMatch=>{
        const score = calculateScore(fullMatch);
        log("Score built: "+score);
      });
  }));
})
.catch(err=>{
  log("ERROR: "+err);
});
</script>

</body>
</html>
