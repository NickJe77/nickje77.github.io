<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Indian Premier League Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#ffffff;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:auto;
padding:30px 20px;
}

.hero{
background:linear-gradient(90deg,#3b007a,#7b2cbf);
color:white;
padding:40px 50px;
border-radius:24px;
margin-bottom:25px;
}

.hero h1{
margin:0;
font-size:46px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

th{
background:#f3f6fb;
}

tr:nth-child(even){
background:#f8fbff;
}

tr:hover{
background:#eef4ff;
}

.game-link{
color:inherit;
text-decoration:none;
}

.game-link:hover{
text-decoration:underline;
}

.winner{
font-weight:600;
color:#1a7f37;
}

.runnerup{
color:#b42318;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>Indian Premier League Finals</h1>
</div>

<table>

<thead>
<tr>
<th>Season</th>
<th>Winner</th>
<th>Runner-up</th>
<th>Result</th>
<th>Date</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="finalsTable"></tbody>

</table>

</div>

<script>

const indexUrl="data/ipl/index.json";
const basePath="data/ipl/";

const tableBody=document.getElementById("finalsTable");

let finalsData=[];

fetch(indexUrl)

.then(r=>r.json())

.then(files=>{

files.forEach(file=>{

fetch(basePath+file)

.then(r=>r.json())

.then(matches=>{

matches.forEach((match,i)=>{

if(match.info?.event?.stage!=="Final") return;

const date =
match.info.dates?.[0] || "";

const season =
date.slice(0,4);

const winner =
match.info.outcome?.winner || "—";

const runnerUp =
match.info.teams.find(
t=>t!==winner
);

let result="—";

if(match.info.outcome?.by){

if(match.info.outcome.by.runs)
result="won by "+
match.info.outcome.by.runs+" runs";

else if(match.info.outcome.by.wickets)
result="won by "+
match.info.outcome.by.wickets+" wickets";

}

finalsData.push({

season,
winner,
runnerUp,
result,
date,
venue:match.info.venue,
file,
index:i

});

render();

});

});

});

});

function render(){

finalsData.sort(
(a,b)=>a.season-b.season
);

tableBody.innerHTML="";

finalsData.forEach(f=>{

const tr=document.createElement("tr");

tr.innerHTML=`

<td>
<a class="game-link"
href="ipl-game.html?file=${encodeURIComponent(f.file)}&i=${f.index}">
${f.season}
</a>
</td>

<td class="winner">${f.winner}</td>

<td class="runnerup">${f.runnerUp}</td>

<td>${f.result}</td>

<td>${formatDate(f.date)}</td>

<td>${f.venue}</td>

`;

tableBody.appendChild(tr);

});

}

function formatDate(d){

return new Date(d)
.toLocaleDateString("en-GB",{
day:"2-digit",
month:"short",
year:"numeric"
});

}

</script>

</body>
</html>
