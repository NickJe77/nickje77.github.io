<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}
.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:30px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:16px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:12px 14px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}

.winner{font-weight:600;color:#1a7f37;}
.runnerup{color:#b42318;}
.score{font-weight:600;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>Indian Premier League Finals</h1>
  <p>Every IPL final with winner, runner-up, score and venue.</p>
</div>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Winner</th>
  <th>Runner-up</th>
  <th>Score</th>
  <th>Date</th>
  <th>Venue</th>
</tr>
</thead>
<tbody id="finalsTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const tableBody = document.getElementById("finalsTable");

function calculateScore(match){
  const totals = {};
  const wickets = {};

  match.innings.forEach(inn=>{
    const team = inn.team;
    totals[team] = 0;
    wickets[team] = 0;

    inn.overs.forEach(over=>{
      over.deliveries.forEach(d=>{
        totals[team] += d.runs?.total || 0;
        if(d.wickets){
          wickets[team] += d.wickets.length;
        }
      });
    });
  });

  const teams = Object.keys(totals);
  if(teams.length !== 2) return "";

  return `${teams[0]} ${totals[teams[0]]}/${wickets[teams[0]]} vs ${teams[1]} ${totals[teams[1]]}/${wickets[teams[1]]}`;
}

fetch(indexUrl)
  .then(r => r.json())
  .then(seasonFiles => {

    return Promise.all(
      seasonFiles.map(seasonFile =>
        fetch(basePath + seasonFile).then(r => r.json())
      )
    );

  })
  .then(seasons => {

    return Promise.all(seasons.map(seasonMatches => {

      if(!Array.isArray(seasonMatches) || seasonMatches.length === 0) return;

      // pick latest dated match = final
      seasonMatches.sort((a,b)=> new Date(b.date) - new Date(a.date));
      const finalSummary = seasonMatches[0];

      return fetch(basePath + finalSummary.file)
        .then(r => r.json())
        .then(fullMatch => {
          return {
            season: finalSummary.date.slice(0,4),
            winner: finalSummary.outcome.winner,
            runnerUp: finalSummary.teams.find(t=>t !== finalSummary.outcome.winner),
            score: calculateScore(fullMatch),
            date: finalSummary.date,
            venue: finalSummary.venue
          };
        });

    }));

  })
  .then(finals => {

    finals
      .filter(f => f)
      .sort((a,b)=> new Date(b.date) - new Date(a.date))
      .forEach(f => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${f.season}</td>
          <td class="winner">${f.winner}</td>
          <td class="runnerup">${f.runnerUp}</td>
          <td class="score">${f.score}</td>
          <td>${f.date}</td>
          <td>${f.venue}</td>
        `;
        tableBody.appendChild(tr);
      });

  });
</script>

</body>
</html>
