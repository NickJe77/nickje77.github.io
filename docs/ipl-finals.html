<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Indian Premier League Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:30px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:12px 14px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}

.winner{font-weight:600;color:#1a7f37;}
.runnerup{color:#b42318;}
.score{font-weight:600;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>Indian Premier League Finals</h1>
  <p>Every IPL final with winner, runner-up, score and venue.</p>
</div>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Winner</th>
  <th>Runner-up</th>
  <th>Score</th>
  <th>Date</th>
  <th>Venue</th>
</tr>
</thead>
<tbody id="finalsTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const matchPath = "data/ipl/matches/";
const tableBody = document.getElementById("finalsTable");

function calculateScore(match){
  const totals = {};
  const wickets = {};

  match.innings.forEach(inn=>{
    totals[inn.team] = 0;
    wickets[inn.team] = 0;

    inn.overs.forEach(o=>{
      o.deliveries.forEach(d=>{
        totals[inn.team] += d.runs?.total || 0;
        if(d.wickets){
          wickets[inn.team] += d.wickets.length;
        }
      });
    });
  });

  const teams = Object.keys(totals);
  if(teams.length !== 2) return "—";

  return `${teams[0]} ${totals[teams[0]]}/${wickets[teams[0]]} vs ${teams[1]} ${totals[teams[1]]}/${wickets[teams[1]]}`;
}

fetch(indexUrl)
  .then(r=>r.json())
  .then(files=>Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json()))))
  .then(seasons=>{
    return Promise.all(seasons.map(season=>{
      season.sort((a,b)=>new Date(b.date)-new Date(a.date));
      const finalSummary = season[0];

      return fetch(matchPath+finalSummary.file)
        .then(r=>r.json())
        .then(fullMatch=>{
          const winner = finalSummary.outcome.winner;
          const runnerUp = finalSummary.teams.find(t=>t!==winner);

          return {
            season: finalSummary.date.slice(0,4),
            winner,
            runnerUp,
            score: calculateScore(fullMatch),
            date: finalSummary.date,
            venue: finalSummary.venue
          };
        });
    }));
  })
  .then(finals=>{
    finals.forEach(f=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${f.season}</td>
        <td class="winner">${f.winner}</td>
        <td class="runnerup">${f.runnerUp}</td>
        <td class="score">${f.score}</td>
        <td>${formatDate(f.date)}</td>
        <td>${f.venue}</td>
      `;
      tableBody.appendChild(tr);
    });
  });

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
</script>

</body>
</html>
