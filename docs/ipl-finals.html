<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Indian Premier League Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --win:#1e7a3d;
  --loss:#b42318;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}
.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:26px 20px 70px;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:32px 34px;
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.eyebrow{
  display:block;
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(26px,5vw,38px);
  letter-spacing:.01em;
  text-transform:uppercase;
}

/* ── Table ────────────────────────────────────────────── */
table{
  width:100%;
  border-collapse:collapse;
  font-size:13.5px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}
th,td{
  border-bottom:1px solid var(--line);
  padding:11px 14px;
  text-align:left;
}
th{
  background:#f7f9fb;
  color:var(--muted);
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
}
td{
  color:#27313c;
  font-variant-numeric:tabular-nums;
}
tbody tr{ cursor:pointer; }
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f0f6ff;}
.winner{font-weight:700;color:var(--win);}
.runnerup{color:var(--loss);}
</style>
</head>
<body>
<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
</div>
<div class="page-wrap">
<div class="hero">
<span class="eyebrow">Cricket · IPL</span>
<h1>Indian Premier League Finals</h1>
</div>
<table>
<thead>
<tr>
<th>Season</th>
<th>Winner</th>
<th>Runner-up</th>
<th>Result</th>
<th>Date</th>
<th>Venue</th>
</tr>
</thead>
<tbody id="finalsTable"></tbody>
</table>
</div>
<script>
const indexUrl="data/ipl/index.json";
const basePath="data/ipl/";
const tableBody=document.getElementById("finalsTable");
let finalsData=[];
fetch(indexUrl)
.then(r=>r.json())
.then(files=>{
files.forEach(file=>{
fetch(basePath+file)
.then(r=>r.json())
.then(matches=>{
matches.forEach((match,i)=>{
if(match.info?.event?.stage!=="Final") return;
const date =
match.info.dates?.[0] || "";
const season =
date.slice(0,4);
const winner =
match.info.outcome?.winner || "—";
const runnerUp =
match.info.teams.find(
t=>t!==winner
);
let result="—";
if(match.info.outcome?.by){
if(match.info.outcome.by.runs)
result="won by "+
match.info.outcome.by.runs+" runs";
else if(match.info.outcome.by.wickets)
result="won by "+
match.info.outcome.by.wickets+" wickets";
}
finalsData.push({
season,
winner,
runnerUp,
result,
date,
venue:match.info.venue,
file,
index:i
});
render();
});
});
});
});
function render(){
finalsData.sort(
(a,b)=>a.season-b.season
);
tableBody.innerHTML="";
finalsData.forEach(f=>{
const tr=document.createElement("tr");
const link =
`ipl-game.html?file=${encodeURIComponent(f.file)}&i=${f.index}`;
tr.onclick=()=>{
window.location.href=link;
};
tr.innerHTML=`
<td>${f.season}</td>
<td class="winner">${f.winner}</td>
<td class="runnerup">${f.runnerUp}</td>
<td>${f.result}</td>
<td>${formatDate(f.date)}</td>
<td>${f.venue}</td>
`;
tableBody.appendChild(tr);
});
}
function formatDate(d){
return new Date(d)
.toLocaleDateString("en-GB",{
day:"2-digit",
month:"short",
year:"numeric"
});
}
</script>
</body>
</html>
