<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Finals DEBUG | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}
.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:40px;}
.hero p{margin-top:10px;font-size:18px;opacity:0.95;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:16px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:12px 14px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}

.debug{
  background:#111;
  color:#0f0;
  padding:15px;
  font-family: monospace;
  font-size:14px;
  margin-bottom:20px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>Indian Premier League Finals (DEBUG)</h1>
  <p>This page will show what data is loading.</p>
</div>

<div id="debug" class="debug">Starting debug…</div>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Winner</th>
  <th>Runner-up</th>
  <th>Score</th>
  <th>Date</th>
  <th>Venue</th>
</tr>
</thead>
<tbody id="finalsTable"></tbody>
</table>

</div>

<script>
const debugBox = document.getElementById("debug");
const tableBody = document.getElementById("finalsTable");

const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";

function log(msg){
  debugBox.textContent += "\n" + msg;
}

function calculateScore(match){
  const totals = {};
  const wickets = {};

  match.innings.forEach(inn=>{
    const team = inn.team;
    totals[team] = 0;
    wickets[team] = 0;

    inn.overs.forEach(over=>{
      over.deliveries.forEach(d=>{
        totals[team] += d.runs?.total || 0;
        if(d.wickets){
          wickets[team] += d.wickets.length;
        }
      });
    });
  });

  const teams = Object.keys(totals);
  if(teams.length !== 2) return "";

  return `${teams[0]} ${totals[teams[0]]}/${wickets[teams[0]]} vs ${teams[1]} ${totals[teams[1]]}/${wickets[teams[1]]}`;
}

log("Fetching index.json…");

fetch(indexUrl)
  .then(r=>{
    log("index.json status: " + r.status);
    return r.json();
  })
  .then(seasonFiles=>{
    log("index.json loaded. Seasons: " + seasonFiles.length);

    return Promise.all(
      seasonFiles.map(file=>{
        log("Loading season file: " + file);
        return fetch(basePath + file)
          .then(r=>{
            log("  " + file + " status: " + r.status);
            return r.json();
          });
      })
    );
  })
  .then(seasons=>{
    log("All season files loaded.");

    return Promise.all(seasons.map(seasonMatches=>{
      if(!seasonMatches || !seasonMatches.length){
        log("Season file EMPTY");
        return;
      }

      seasonMatches.sort((a,b)=> new Date(b.date) - new Date(a.date));
      const finalSummary = seasonMatches[0];

      log("Final summary file: " + finalSummary.file);

      return fetch(basePath + finalSummary.file)
        .then(r=>{
          log("  Loading match file: " + finalSummary.file + " status: " + r.status);
          return r.json();
        })
        .then(fullMatch=>{
          const row = {
            season: finalSummary.date.slice(0,4),
            winner: finalSummary.outcome.winner,
            runnerUp: finalSummary.teams.find(t=>t!==finalSummary.outcome.winner),
            score: calculateScore(fullMatch),
            date: finalSummary.date,
            venue: finalSummary.venue
          };

          log("Built row for season " + row.season);

          return row;
        });
    }));
  })
  .then(finals=>{
    log("Rendering table…");

    finals.filter(f=>f).forEach(f=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${f.season}</td>
        <td>${f.winner}</td>
        <td>${f.runnerUp}</td>
        <td>${f.score}</td>
        <td>${f.date}</td>
        <td>${f.venue}</td>
      `;
      tableBody.appendChild(tr);
    });

    log("DONE.");
  })
  .catch(err=>{
    log("ERROR: " + err);
  });
</script>

</body>
</html>
