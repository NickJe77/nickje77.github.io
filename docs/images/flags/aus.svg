<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="24" height="12" aria-label="Australia">
  <!-- Blue field -->
  <rect width="1200" height="600" fill="#012169"></rect>

  <!-- Canton (Union Jack area) -->
  <defs>
    <clipPath id="cantonClip">
      <rect x="0" y="0" width="600" height="300"></rect>
    </clipPath>

    <!-- 7-point star (outer radius = 100, inner radius = 4/9*100) -->
    <polygon id="star7" fill="#fff" points="0.000,-100.000 19.284,-40.043 78.183,-62.349 43.330,-9.890 97.493,22.252 34.748,27.711 43.388,90.097 0.000,44.444 -43.388,90.097 -34.748,27.711 -97.493,22.252 -43.330,-9.890 -78.183,-62.349 -19.284,-40.043"></polygon>

    <!-- 5-point star (outer radius = 100, inner radius = 4/9*100) -->
    <polygon id="star5" fill="#fff" points="0.000,-100.000 26.124,-35.956 95.106,-30.902 42.269,13.734 58.779,80.902 0.000,44.444 -58.779,80.902 -42.269,13.734 -95.106,-30.902 -26.124,-35.956"></polygon>
  </defs>

  <!-- Union Jack (simplified but correct-looking for web icons) -->
  <g clip-path="url(#cantonClip)">
    <rect x="0" y="0" width="600" height="300" fill="#012169"></rect>

    <!-- White diagonals -->
    <path d="M0 0 L600 300 M600 0 L0 300" stroke="#ffffff" stroke-width="60" stroke-linecap="square"></path>

    <!-- Red diagonals -->
    <path d="M0 0 L600 300 M600 0 L0 300" stroke="#c8102e" stroke-width="36" stroke-linecap="square"></path>

    <!-- White cross -->
    <path d="M300 0 V300 M0 150 H600" stroke="#ffffff" stroke-width="100" stroke-linecap="square"></path>

    <!-- Red cross -->
    <path d="M300 0 V300 M0 150 H600" stroke="#c8102e" stroke-width="60" stroke-linecap="square"></path>
  </g>

  <!-- Commonwealth Star (7-point) -->
  <!-- Diameter = 3/10 of flag height => 180, radius 90 => scale 0.9 -->
  <use href="#star7" transform="translate(300 450) scale(0.9)"></use>

  <!-- Southern Cross stars -->
  <!-- Big stars diameter = 1/7 of flag height => 85.714, radius 42.857 => scale 0.42857 -->
  <use href="#star7" transform="translate(900 500) scale(0.42857)"></use>   <!-- Alpha -->
  <use href="#star7" transform="translate(750 262.5) scale(0.42857)"></use> <!-- Beta -->
  <use href="#star7" transform="translate(900 100) scale(0.42857)"></use>   <!-- Gamma -->
  <use href="#star7" transform="translate(1033.333 222.5) scale(0.42857)"></use> <!-- Delta -->

  <!-- Small star (Epsilon) diameter = 1/24 of flag height => 25, radius 12.5 => scale 0.125 -->
  <use href="#star5" transform="translate(960 325) scale(0.125)"></use>
</svg>
