<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">

  <!-- Colors -->
  <!-- Saffron -->
  <rect x="0" y="0" width="900" height="200" fill="#FF9933"></rect>
  <!-- White -->
  <rect x="0" y="200" width="900" height="200" fill="#FFFFFF"></rect>
  <!-- Green -->
  <rect x="0" y="400" width="900" height="200" fill="#138808"></rect>

  <!-- Ashoka Chakra -->
  <g transform="translate(450 300)">
    <!-- Outer circle -->
    <circle r="75" fill="none" stroke="#000080" stroke-width="3"></circle>

    <!-- 24 spokes -->
    <g stroke="#000080" stroke-width="2">
      <line y1="0" y2="-75"></line>
      <line y1="0" y2="-75" transform="rotate(15)"></line>
      <line y1="0" y2="-75" transform="rotate(30)"></line>
      <line y1="0" y2="-75" transform="rotate(45)"></line>
      <line y1="0" y2="-75" transform="rotate(60)"></line>
      <line y1="0" y2="-75" transform="rotate(75)"></line>
      <line y1="0" y2="-75" transform="rotate(90)"></line>
      <line y1="0" y2="-75" transform="rotate(105)"></line>
      <line y1="0" y2="-75" transform="rotate(120)"></line>
      <line y1="0" y2="-75" transform="rotate(135)"></line>
      <line y1="0" y2="-75" transform="rotate(150)"></line>
      <line y1="0" y2="-75" transform="rotate(165)"></line>
      <line y1="0" y2="-75" transform="rotate(180)"></line>
      <line y1="0" y2="-75" transform="rotate(195)"></line>
      <line y1="0" y2="-75" transform="rotate(210)"></line>
      <line y1="0" y2="-75" transform="rotate(225)"></line>
      <line y1="0" y2="-75" transform="rotate(240)"></line>
      <line y1="0" y2="-75" transform="rotate(255)"></line>
      <line y1="0" y2="-75" transform="rotate(270)"></line>
      <line y1="0" y2="-75" transform="rotate(285)"></line>
      <line y1="0" y2="-75" transform="rotate(300)"></line>
      <line y1="0" y2="-75" transform="rotate(315)"></line>
      <line y1="0" y2="-75" transform="rotate(330)"></line>
      <line y1="0" y2="-75" transform="rotate(345)"></line>
    </g>
  </g>
</svg>
