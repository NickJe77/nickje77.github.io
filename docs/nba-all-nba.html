<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>All-NBA Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;color:#111;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1100px;margin:auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(90deg,#1D428A,#C8102E);color:white;padding:26px 30px;border-radius:14px;margin-bottom:25px;box-shadow:0 6px 18px rgba(0,0,0,.12);}
.hero h1{margin:0;font-size:34px;font-weight:800;}
.filters{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
select{padding:10px 14px;border-radius:10px;border:1px solid #ccc;font-size:14px;background:#fff;}
.season-block{background:#fff;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.05);padding:20px 24px;margin-bottom:20px;}
.season-title{font-size:22px;font-weight:800;margin-bottom:16px;color:#1D428A;}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.team-card{background:#eef3ff;border-radius:12px;padding:14px;}
.team-name{font-weight:800;color:#1D428A;margin-bottom:10px;font-size:15px;}
.player-row{padding:6px 0;border-bottom:1px solid #d8e4ff;display:flex;justify-content:space-between;align-items:center;}
.player-row:last-child{border-bottom:none;}
.player-link{color:#0056d6;text-decoration:none;font-weight:700;}
.player-link:hover{text-decoration:underline;}
.pos{color:#666;font-size:13px;}
.loading{text-align:center;padding:40px;color:#666;}
</style>
</head>
<body>
<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>
<div class="page-wrap">
  <div class="hero">
    <h1>All-NBA Teams</h1>
  </div>
  <div class="filters">
    <select id="seasonSelect">
      <option value="">All Seasons</option>
    </select>
  </div>
  <div id="out"><div class="loading">Loading...</div></div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
const seasonSelect = document.getElementById("seasonSelect");
const out          = document.getElementById("out");
let allData = [];

const NAME_FIX = {
  "doncilu01": "Luka Dončić",
  "jokicni01": "Nikola Jokić",
  "bogdaibo01": "Bogdan Bogdanović",
  "vucevni01": "Nikola Vučević",
  "porzikri01": "Kristaps Porziņģis",
  "nurkiju01": "Jusuf Nurkić",
  "saricda01": "Dario Šarić",
  "hezonja01": "Mario Hezonja",
  "sengunal01": "Alperen Şengün",
  "wembavi01": "Victor Wembanyama",
  "topicni01": "Nikola Topić",
  "zubaciv01": "Ivica Zubac",
};

function fixName(name, id){
  if(id && NAME_FIX[id]) return NAME_FIX[id];
  return name || "";
}

function seasonLabel(s){
  const y = parseInt(s);
  return `${y-1}-${String(y).slice(-2)}`;
}

function render(data){
  out.innerHTML = "";
  if(!data || !data.length){
    out.innerHTML = `<div class="loading">No data found.</div>`;
    return;
  }
  data.forEach(s => {
    const block = document.createElement("div");
    block.className = "season-block";
    block.innerHTML = `<div class="season-title">${seasonLabel(s.season)}</div>`;
    const grid = document.createElement("div");
    grid.className = "teams-grid";
    (s.teams || []).forEach(t => {
      const card = document.createElement("div");
      card.className = "team-card";
      card.innerHTML = `<div class="team-name">${t.team}</div>` +
        (t.players || []).map(p => `
          <div class="player-row">
            <a class="player-link" href="/nba-player.html?id=${encodeURIComponent(p.player_id || '')}">
              ${fixName(p.player, p.player_id)}
            </a>
            <span class="pos">${p.pos || ""}</span>
          </div>
        `).join("");
      grid.appendChild(card);
    });
    block.appendChild(grid);
    out.appendChild(block);
  });
}

seasonSelect.onchange = () => {
  const val = seasonSelect.value;
  render(val ? allData.filter(s => String(s.season) === val) : allData);
};

async function load(){
  try{
    const res = await fetch(`${R2}/basketball/allnba.json`);
    if(!res.ok) throw new Error("Not found");
    allData = await res.json();
    allData.sort((a,b) => b.season - a.season);
    allData.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s.season;
      opt.textContent = seasonLabel(s.season);
      seasonSelect.appendChild(opt);
    });
    render(allData);
  }catch(e){
    console.error(e);
    out.innerHTML = `<div class="loading">Failed to load All-NBA data.</div>`;
  }
}

load();
</script>
</body>
</html>
