<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>All-NBA Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:28px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.filters{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

.season-block{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:18px;
}
.season-title{
  font-family:var(--display);font-weight:600;font-size:18px;margin-bottom:14px;
  color:var(--ink);text-transform:uppercase;letter-spacing:.01em;
}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
.team-card{background:var(--accent-soft);border-radius:12px;padding:14px;}
.team-name{font-weight:700;color:var(--ink);margin-bottom:10px;font-size:14.5px;}
.player-row{
  padding:6px 0;border-bottom:1px solid rgba(201,154,61,.25);
  display:flex;justify-content:space-between;align-items:center;
}
.player-row:last-child{border-bottom:none;}
.player-link{color:var(--ink);text-decoration:none;font-weight:700;}
.player-link:hover{color:var(--accent);}
.pos{color:var(--muted);font-size:12.5px;}
.loading{text-align:center;padding:40px;color:var(--muted);font-style:italic;}
</style>
</head>
<body>
<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>
<div class="page-wrap">
  <div class="hero">
    <span class="eyebrow">NBA</span>
    <h1>All-NBA Teams</h1>
  </div>
  <div class="filters">
    <select id="seasonSelect">
      <option value="">All Seasons</option>
    </select>
  </div>
  <div id="out"><div class="loading">Loading...</div></div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
const seasonSelect = document.getElementById("seasonSelect");
const out          = document.getElementById("out");
let allData = [];

const NAME_FIX = {
  "doncilu01": "Luka Dončić",
  "jokicni01": "Nikola Jokić",
  "bogdaibo01": "Bogdan Bogdanović",
  "vucevni01": "Nikola Vučević",
  "porzikri01": "Kristaps Porziņģis",
  "nurkiju01": "Jusuf Nurkić",
  "saricda01": "Dario Šarić",
  "hezonja01": "Mario Hezonja",
  "sengunal01": "Alperen Şengün",
  "wembavi01": "Victor Wembanyama",
  "topicni01": "Nikola Topić",
  "zubaciv01": "Ivica Zubac",
};

function fixName(name, id){
  if(id && NAME_FIX[id]) return NAME_FIX[id];
  return name || "";
}

function seasonLabel(s){
  const y = parseInt(s);
  return `${y-1}-${String(y).slice(-2)}`;
}

function render(data){
  out.innerHTML = "";
  if(!data || !data.length){
    out.innerHTML = `<div class="loading">No data found.</div>`;
    return;
  }
  data.forEach(s => {
    const block = document.createElement("div");
    block.className = "season-block";
    block.innerHTML = `<div class="season-title">${seasonLabel(s.season)}</div>`;
    const grid = document.createElement("div");
    grid.className = "teams-grid";
    (s.teams || []).forEach(t => {
      const card = document.createElement("div");
      card.className = "team-card";
      card.innerHTML = `<div class="team-name">${t.team}</div>` +
        (t.players || []).map(p => `
          <div class="player-row">
            <a class="player-link" href="/nba-player.html?id=${encodeURIComponent(p.player_id || '')}">
              ${fixName(p.player, p.player_id)}
            </a>
            <span class="pos">${p.pos || ""}</span>
          </div>
        `).join("");
      grid.appendChild(card);
    });
    block.appendChild(grid);
    out.appendChild(block);
  });
}

seasonSelect.onchange = () => {
  const val = seasonSelect.value;
  render(val ? allData.filter(s => String(s.season) === val) : allData);
};

async function load(){
  try{
    const res = await fetch(`${R2}/basketball/allnba.json`);
    if(!res.ok) throw new Error("Not found");
    allData = await res.json();
    allData.sort((a,b) => b.season - a.season);
    allData.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s.season;
      opt.textContent = seasonLabel(s.season);
      seasonSelect.appendChild(opt);
    });
    render(allData);
  }catch(e){
    console.error(e);
    out.innerHTML = `<div class="loading">Failed to load All-NBA data.</div>`;
  }
}

load();
</script>
</body>
</html>
