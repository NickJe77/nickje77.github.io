<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>UFC Fighter | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;position:sticky;top:0;z-index:100;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));color:#fff;
  padding:40px 20px 34px;text-align:center;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(30px,6vw,46px);
  letter-spacing:.01em;text-transform:uppercase;line-height:1;
}
.hero-nickname{font-size:17px;color:rgba(255,255,255,.65);font-style:italic;margin:6px 0 0;}
.hero-meta{font-size:13.5px;opacity:.75;margin-top:10px;font-weight:500;}

.search-wrap{max-width:400px;margin:20px auto 0;position:relative;}
.search-input{
  width:100%;padding:12px 18px;border-radius:999px;border:none;font-size:14px;
  font-family:var(--body);font-weight:600;box-sizing:border-box;outline:none;
}
.search-results{
  position:absolute;top:100%;left:0;right:0;background:var(--surface);border-radius:14px;
  margin-top:8px;overflow:hidden;box-shadow:0 14px 30px -12px rgba(10,16,24,.4);z-index:999;
  display:none;max-height:280px;overflow-y:auto;
}
.search-item{
  padding:12px 18px;cursor:pointer;font-weight:700;color:var(--ink);
  border-bottom:1px solid var(--line);font-size:14px;
}
.search-item:hover{background:var(--accent-soft);}

.page-wrap{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}
.profile-grid{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;margin-bottom:22px;}

.record-big{font-family:var(--display);font-size:38px;font-weight:600;color:var(--ink);}
.record-label{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.04em;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center;}
.stat-box span{display:block;font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.stat-box label{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.section{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;margin-bottom:20px;
}
.section-title{
  font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;margin:0 0 16px;border-left:4px solid var(--accent);
  padding-left:12px;color:var(--muted);
}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 12px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;text-align:left;font-family:var(--body);
  border-bottom:1px solid var(--line);
}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tr:hover td{background:#f9fbfd;}
.tlink{color:var(--ink);font-weight:700;text-decoration:none;}
.tlink:hover{color:var(--accent);}
.result-W{color:#1e7a3d;font-weight:700;}
.result-L{color:#c0362c;font-weight:700;}
.result-NC{color:var(--muted);font-weight:600;}
.method-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:10.5px;font-weight:700;}
.method-KO{background:#fbe7e5;color:#c0362c;}
.method-Sub{background:#e6f4ea;color:#1e7a3d;}
.method-Dec{background:var(--accent-soft);color:var(--ink);}
.loading,.error{text-align:center;padding:80px;font-size:16px;font-weight:600;color:var(--muted);}
.error{color:#c0362c;}
@media(max-width:600px){.profile-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="ufc.html">UFC</a>
  <a href="ufc-events.html">Events</a>
  <a href="ufc-fighters.html">Fighters</a>
  <a href="ufc-records.html">Records</a>
</div>
<div id="hero" class="hero"><div class="loading">Loading fighter...</div></div>
<div id="pageWrap" class="page-wrap" style="display:none"></div>

<script>
var params    = new URLSearchParams(location.search);
var fighterId = params.get('id');
var allFighters = [];

fetch('/data/ufc/fighters.json')
  .then(function(r){ return r.json(); })
  .then(function(d){ allFighters = d; })
  .catch(function(){});

if(!fighterId){
  document.getElementById('hero').innerHTML = '<div class="error">No fighter specified.</div>';
} else {
  Promise.all([
    fetch('/data/ufc/fighters/'+fighterId+'.json').then(function(r){ if(!r.ok) throw new Error(); return r.json(); }),
    fetch('/data/ufc/fighters.json').then(function(r){ return r.json(); })
  ]).then(function(results){
    var fights = results[0];
    var index  = results[1];
    var info   = index.find(function(f){ return f.id===fighterId; }) || {};
    render(info, fights);
  }).catch(function(){
    document.getElementById('hero').innerHTML = '<div class="error">Fighter not found.</div>';
  });
}

function methodClass(method){
  if(!method) return '';
  var m = method.toUpperCase();
  if(m.includes('KO') || m.includes('TKO')) return 'method-KO';
  if(m.includes('SUB')) return 'method-Sub';
  return 'method-Dec';
}

function render(info, fights){
  var name     = info.name || fighterId;
  var nickname = info.nickname || '';
  var wc       = info.weight_class || '';
  var nat      = info.nationality || '';

  document.title = name + ' | UFC | The Sporting Almanac';

  // Record
  var wins=0, losses=0, nc=0;
  var koWins=0, subWins=0, decWins=0;
  fights.forEach(function(f){
    if(f.result==='W'){ wins++;
      if((f.method||'').toUpperCase().includes('KO')) koWins++;
      else if((f.method||'').toUpperCase().includes('SUB')) subWins++;
      else decWins++;
    }
    else if(f.result==='L') losses++;
    else nc++;
  });

  var headshotHtml = '';

  document.getElementById('hero').innerHTML =
    '<h1>'+name+'</h1>'+
    (nickname?'<div class="hero-nickname">"'+nickname+'"</div>':'')+
    '<div class="hero-meta">'+[wc,nat].filter(Boolean).join(' · ')+'</div>'+
    '<div class="search-wrap">'+
      '<input type="text" id="srch" class="search-input" placeholder="Search another fighter..." autocomplete="off">'+
      '<div class="search-results" id="srchRes"></div>'+
    '</div>';

  // Build search
  var srch = document.getElementById('srch');
  var srchRes = document.getElementById('srchRes');
  srch.addEventListener('input', function(){
    var q = this.value.toLowerCase().trim();
    if(!q){ srchRes.style.display='none'; return; }
    var matches = allFighters.filter(function(f){ return (f.name||'').toLowerCase().includes(q); }).slice(0,8);
    if(!matches.length){ srchRes.style.display='none'; return; }
    srchRes.innerHTML = matches.map(function(f){
      return '<div class="search-item" onclick="location.href=\'/ufc-fighter.html?id='+f.id+'\'">'+
        f.name+(f.nickname?' "'+f.nickname+'"':'')+
        '<small style="color:#888;margin-left:8px">'+f.weight_class+'</small></div>';
    }).join('');
    srchRes.style.display='block';
  });
  document.addEventListener('click',function(e){ if(!e.target.closest('.search-wrap')) srchRes.style.display='none'; });

  var html =
    '<div class="section">'+
      '<div class="record-big">'+wins+'–'+losses+(nc?'–'+nc:'')+'</div>'+
      '<div class="record-label">Win–Loss'+(nc?' ('+nc+' NC)':'')+'</div>'+
    '</div>'+
    '<div class="stats-grid">'+
      sbox(wins,'Wins')+sbox(losses,'Losses')+
      sbox(koWins,'KO/TKO')+sbox(subWins,'Submissions')+sbox(decWins,'Decisions')+
      (info.height?sbox(info.height,'Height'):'')+
      (info.weight?sbox(info.weight,'Weight'):'')+
      (info.reach?sbox(info.reach,'Reach'):'')+
      (info.stance?sbox(info.stance,'Stance'):'')+
    '</div>'+
    '<div class="section">'+
      '<div class="section-title">Fight History</div>'+
      '<div style="overflow-x:auto"><table>'+
        '<thead><tr><th>Date</th><th>Event</th><th>Opponent</th><th>Result</th><th>Method</th><th>Round</th><th>Time</th><th>Class</th></tr></thead>'+
        '<tbody>'+
        fights.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).map(function(f){
          return '<tr>'+
            '<td>'+f.date+'</td>'+
            '<td><a class="tlink" href="/ufc-event.html?id='+f.event_id+'">'+f.event_name+'</a></td>'+
            '<td><a class="tlink" href="/ufc-fighter.html?id='+f.opponent_id+'">'+f.opponent+'</a></td>'+
            '<td class="result-'+f.result+'">'+f.result+'</td>'+
            '<td><span class="method-badge '+methodClass(f.method)+'">'+f.method+'</span>'+
              (f.method_detail?' <span style="color:#888;font-size:12px">'+f.method_detail+'</span>':'')+
            '</td>'+
            '<td>'+f.round+'</td>'+
            '<td>'+f.time+'</td>'+
            '<td>'+f.weight_class+'</td>'+
            '</tr>';
        }).join('')+
        '</tbody></table></div>'+
    '</div>';

  var wrap = document.getElementById('pageWrap');
  wrap.innerHTML = html;
  wrap.style.display = 'block';
}

function sbox(val, label){
  return '<div class="stat-box"><span>'+val+'</span><label>'+label+'</label></div>';
}
</script>
</body>
</html>
