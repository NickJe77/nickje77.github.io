<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Slam | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#eceff3;
    --surface:#ffffff;
    --ink:#0f141a;
    --muted:#69727c;
    --faint:#9aa3ad;
    --line:#e3e8ee;
    --board:#0c130f;
    --board-2:#161f16;
    --accent:#c99a3d;
    --accent-soft:rgba(201,154,61,.16);
    --display:'Oswald',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
    --radius:16px;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:var(--body);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .navbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    font-weight:600;
    font-size:13.5px;
    position:sticky;
    top:0;
    z-index:50;
  }

  .navbar a{
    color:var(--ink);
    text-decoration:none;
    opacity:.7;
    transition:opacity .15s,color .15s;
  }

  .navbar a:hover,.navbar a.active{
    opacity:1;
    color:var(--accent);
  }

  .hero{
    background:linear-gradient(160deg,var(--board-2),var(--board));
    color:#fff;
    padding:40px 20px 32px;
    text-align:center;
  }

  .hero h1{
    margin:0;
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(26px,5vw,42px);
    letter-spacing:.01em;
    text-transform:uppercase;
    line-height:1.1;
  }

  .hero p{
    margin:10px auto 0;
    max-width:900px;
    font-size:14px;
    line-height:1.6;
    color:rgba(255,255,255,.68);
  }

  .container{
    max-width:1200px;
    margin:0 auto;
    padding:24px 16px 70px;
  }

  .top-links{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
  }

  .back{
    display:inline-block;
    text-decoration:none;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px 16px;
    font-family:var(--body);
  }
  .back:hover{border-color:var(--faint);}

  .summary{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;
    margin:0 0 18px;
  }

  .summary-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }

  .summary-label{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:8px;
  }

  .summary-value{
    font-family:var(--display);
    font-size:24px;
    font-weight:600;
    line-height:1.1;
    color:var(--ink);
  }

  .status{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 18px;
    margin-bottom:18px;
    font-weight:600;
    font-size:13.5px;
    color:var(--muted);
  }

  .status.error{
    border-color:#f1c0c0;
    background:#fff7f7;
    color:#8a1f1f;
  }

  .leaders-card,
  .table-wrap{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:18px;
  }

  .section-title{
    margin:0;
    padding:18px 20px 12px;
    font-family:var(--display);
    font-size:17px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.01em;
    color:var(--ink);
  }

  .leaders-list{
    padding:0 20px 20px;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .leader-item{
    background:var(--accent-soft);
    border-radius:12px;
    padding:14px;
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-weight:700;
    font-size:13.5px;
  }

  .leader-item span:last-child{
    color:var(--accent);
  }

  table{
    width:100%;
    border-collapse:collapse;
  }

  th, td{
    padding:11px 14px;
    text-align:left;
    border-top:1px solid var(--line);
    vertical-align:top;
    font-size:13.5px;
  }

  th{
    background:#f7f9fb;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    font-weight:600;
    border-top:none;
    font-family:var(--body);
  }

  td{color:#27313c;}

  tbody tr:hover td{
    background:#f9fbfd;
  }

  .row-link{
    color:inherit;
    text-decoration:none;
    font-weight:700;
  }
  .row-link:hover{color:var(--accent);}

  .empty{
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:36px 18px;
    text-align:center;
    color:var(--muted);
    font-weight:600;
  }

  @media (max-width: 900px){
    .summary{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }
    .leaders-list{
      grid-template-columns:1fr;
    }
  }

  @media (max-width: 700px){
    .summary{
      grid-template-columns:1fr;
    }
    .table-wrap{
      overflow-x:auto;
    }
    table{
      min-width:760px;
    }
  }
</style>
</head>

<body>

<nav class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./olympics.html">Olympics</a>
  <a href="./tennis.html" class="active">Tennis</a>
</nav>

<header class="hero">
  <h1 id="slamName">Loading...</h1>
  <p id="heroSub">Loading slam history...</p>
</header>

<div class="container">
  <div class="top-links">
    <a class="back" href="./tennis.html">← Back to Tennis</a>
  </div>

  <section class="summary">
    <div class="summary-card">
      <div class="summary-label">Titles Listed</div>
      <div class="summary-value" id="titlesCount">0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Unique Winners</div>
      <div class="summary-value" id="winnersCount">0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">First Year</div>
      <div class="summary-value" id="firstYear">-</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Latest Year</div>
      <div class="summary-value" id="latestYear">-</div>
    </div>
  </section>

  <div class="status" id="status">Loading slam history...</div>

  <div id="leadersWrap"></div>
  <div id="tableWrap"></div>
</div>

<script>
  const slam = new URLSearchParams(location.search).get('slam') || '';
  const START_YEAR = 1912;
  const CURRENT_YEAR = new Date().getFullYear();

  const slamNameEl = document.getElementById('slamName');
  const heroSubEl = document.getElementById('heroSub');
  const statusBox = document.getElementById('status');
  const leadersWrap = document.getElementById('leadersWrap');
  const tableWrap = document.getElementById('tableWrap');

  const titlesCountEl = document.getElementById('titlesCount');
  const winnersCountEl = document.getElementById('winnersCount');
  const firstYearEl = document.getElementById('firstYear');
  const latestYearEl = document.getElementById('latestYear');

  function text(v){
    if (v === null || v === undefined) return '';
    if (typeof v === 'string') return v.trim();
    if (typeof v === 'number') return String(v);
    return '';
  }

  function pick(obj, keys){
    if (!obj || typeof obj !== 'object') return '';
    for (const key of keys){
      if (obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== ''){
        return obj[key];
      }
    }
    return '';
  }

  function normaliseSurface(surface){
    const s = text(surface).toLowerCase();
    if (!s) return '';
    if (s.includes('hard')) return 'Hard';
    if (s.includes('clay')) return 'Clay';
    if (s.includes('grass')) return 'Grass';
    if (s.includes('carpet')) return 'Carpet';
    if (s.includes('indoor')) return 'Indoor';
    return text(surface);
  }

  function slugify(str){
    return text(str)
      .normalize('NFKD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  function objectToEvent(item, fallbackYear){
    if (!item || typeof item !== 'object') return null;

    const name = text(
      pick(item, [
        'event','event_name','name','tournament','tournament_name','competition',
        'title','Event','Tournament'
      ])
    );

    const winner = text(
      pick(item, [
        'winner','champion','singles_winner','mens_singles_winner','ladies_singles_winner',
        'winner_name','Champion'
      ])
    );

    const runnerUp = text(
      pick(item, [
        'runner_up','finalist','runnerup','runner','loser','opponent',
        'singles_runner_up','RunnerUp'
      ])
    );

    const surface = normaliseSurface(
      pick(item, ['surface','court_surface','Surface'])
    );

    const location = text(
      pick(item, ['location','venue','city','country','host','Location'])
    );

    const score = text(
      pick(item, ['score','final_score','championship_score','result','Score'])
    );

    const draw = text(
      pick(item, ['draw','draw_size'])
    );

    const category = text(
      pick(item, ['category','event_type','type','tour','level'])
    );

    const startDate = text(
      pick(item, ['start_date','date_start','start','from_date'])
    );

    const endDate = text(
      pick(item, ['end_date','date_end','end','to_date','date'])
    );

    const year = text(pick(item, ['year','season'])) || String(fallbackYear);

    if (!name && !winner && !runnerUp) return null;

    return {
      name: name || 'Unnamed Event',
      winner,
      runnerUp,
      surface,
      location,
      score,
      draw,
      category,
      start_date: startDate,
      end_date: endDate,
      date: endDate || startDate,
      year,
      slug: slugify(name || 'Unnamed Event')
    };
  }

  function extractEvents(data, year){
    if (Array.isArray(data)){
      return data.map(item => objectToEvent(item, year)).filter(Boolean);
    }

    if (data && typeof data === 'object'){
      const directKeys = [
        'events','tournaments','results','data','items','rows','competitions'
      ];

      for (const key of directKeys){
        if (Array.isArray(data[key])){
          return data[key].map(item => objectToEvent(item, year)).filter(Boolean);
        }
      }

      const values = Object.values(data);
      for (const val of values){
        if (Array.isArray(val)){
          const mapped = val.map(item => objectToEvent(item, year)).filter(Boolean);
          if (mapped.length) return mapped;
        }
      }

      const single = objectToEvent(data, year);
      if (single) return [single];
    }

    return [];
  }

  function isMatchingSlam(eventName, slamName){
    const e = text(eventName).toLowerCase();
    const s = text(slamName).toLowerCase();

    if (!e || !s) return false;
    if (e.includes(s)) return true;

    if (s === 'french open' && (e.includes('roland garros') || e.includes('french open'))) return true;
    if (s === 'australian open' && e.includes('australian open')) return true;
    if (s === 'wimbledon' && e.includes('wimbledon')) return true;
    if (s === 'us open' && e.includes('us open')) return true;

    return false;
  }

  function setStatus(message, isError = false){
    statusBox.textContent = message;
    statusBox.className = isError ? 'status error' : 'status';
  }

  function escapeHtml(value){
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderLeaders(events){
    const counts = {};
    for (const event of events){
      if (!event.winner) continue;
      counts[event.winner] = (counts[event.winner] || 0) + 1;
    }

    const leaders = Object.entries(counts)
      .sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .slice(0, 10);

    if (!leaders.length){
      leadersWrap.innerHTML = '';
      return;
    }

    leadersWrap.innerHTML = `
      <div class="leaders-card">
        <h2 class="section-title">Most Titles</h2>
        <div class="leaders-list">
          ${leaders.map(([name, total]) => `
            <div class="leader-item">
              <span>${escapeHtml(name)}</span>
              <span>${escapeHtml(total)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderTable(events){
    if (!events.length){
      tableWrap.innerHTML = `<div class="empty">No matching slam results found.</div>`;
      return;
    }

    tableWrap.innerHTML = `
      <div class="table-wrap">
        <h2 class="section-title">${escapeHtml(slam)} Results</h2>
        <table>
          <thead>
            <tr>
              <th>Year</th>
              <th>Event</th>
              <th>Winner</th>
              <th>Runner-Up</th>
              <th>Surface</th>
              <th>Location</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody>
            ${events.map(event => `
              <tr>
                <td>${escapeHtml(event.year || '-')}</td>
                <td>
                  <a class="row-link" href="./tennis-event.html?year=${encodeURIComponent(event.year)}&event=${encodeURIComponent(event.name)}">
                    ${escapeHtml(event.name)}
                  </a>
                </td>
                <td>${escapeHtml(event.winner || '-')}</td>
                <td>${escapeHtml(event.runnerUp || '-')}</td>
                <td>${escapeHtml(event.surface || '-')}</td>
                <td>${escapeHtml(event.location || '-')}</td>
                <td>${escapeHtml(event.score || '-')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function updateSummary(events){
    const winners = new Set(events.map(e => e.winner).filter(Boolean));
    const years = events.map(e => Number(e.year)).filter(n => !Number.isNaN(n));

    titlesCountEl.textContent = events.length.toLocaleString();
    winnersCountEl.textContent = winners.size.toLocaleString();
    firstYearEl.textContent = years.length ? Math.min(...years) : '-';
    latestYearEl.textContent = years.length ? Math.max(...years) : '-';
  }

  async function loadSlam(){
    if (!slam){
      slamNameEl.textContent = 'No Slam Specified';
      heroSubEl.textContent = 'Add ?slam=Wimbledon (or another Grand Slam name) to the URL.';
      setStatus('No slam specified.', true);
      return;
    }

    slamNameEl.textContent = slam;
    heroSubEl.textContent = `Every ${slam} champion on record, from ${START_YEAR} to present.`;
    setStatus(`Loading ${slam} history...`);

    const years = [];
    for (let y = CURRENT_YEAR; y >= START_YEAR; y--) years.push(y);

    const results = await Promise.all(
      years.map(y =>
        fetch(`/data/tennis/seasons/${y}.json`)
          .then(r => r.ok ? r.json() : null)
          .catch(() => null)
      )
    );

    let allEvents = [];
    results.forEach((data, i) => {
      if (!data) return;
      const events = extractEvents(data, years[i]);
      events.forEach(e => {
        if (isMatchingSlam(e.name, slam)) allEvents.push(e);
      });
    });

    allEvents.sort((a, b) => Number(b.year) - Number(a.year));

    if (!allEvents.length){
      setStatus(`No results found for "${slam}".`, true);
    } else {
      setStatus(`Showing ${allEvents.length.toLocaleString()} ${slam} result${allEvents.length === 1 ? '' : 's'}.`);
    }

    updateSummary(allEvents);
    renderLeaders(allEvents);
    renderTable(allEvents);
  }

  loadSlam();
</script>
</body>
</html>
