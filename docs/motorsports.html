<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Motorsports | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./home.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#eceff3;
      --surface:#ffffff;
      --ink:#0f141a;
      --muted:#69727c;
      --faint:#9aa3ad;
      --line:#e3e8ee;
      --board:#0c130f;
      --board-2:#161f16;
      --accent:#c99a3d;
      --accent-soft:rgba(201,154,61,.16);
      --display:'Oswald',system-ui,sans-serif;
      --body:'Inter',system-ui,sans-serif;
      --radius:16px;
    }
    *{box-sizing:border-box;}
    body{
      font-family:var(--body);
      margin:0;
      background:var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
    }
    /* NAVBAR */
    .home-nav{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:20px;
      padding:15px 20px;
      background:var(--surface);
      border-bottom:1px solid var(--line);
      font-weight:600;
    }
    .home-nav a{
      color:var(--ink);
      text-decoration:none;
      font-size:13.5px;
      opacity:.7;
      transition:opacity .15s,color .15s;
    }
    .home-nav a:hover,.home-nav a.active{
      opacity:1;
      color:var(--accent);
    }
    /* HERO */
    .hero{
      position:relative;
      background:linear-gradient(160deg,var(--board-2),var(--board));
      color:#fff;
      text-align:center;
      padding:44px 20px;
    }
    .eyebrow{
      display:block;
      font-family:var(--body);
      font-size:11.5px;
      font-weight:600;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--accent);
      margin-bottom:10px;
    }
    .hero h1{
      margin:0;
      font-family:var(--display);
      font-weight:600;
      font-size:clamp(28px,5vw,40px);
      letter-spacing:.01em;
      text-transform:uppercase;
    }
    /* GRID */
    .page{
      max-width:1100px;
      margin:0 auto;
      padding:30px 20px 70px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
    }
    /* TILE */
    .tile{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:120px;
      border-radius:var(--radius);
      text-decoration:none;
      background:var(--surface);
      border:1px solid var(--line);
      transition:transform .15s,border-color .15s,background .15s;
    }
    .tile:hover{
      transform:translateY(-3px);
      border-color:var(--accent);
      background:var(--accent-soft);
    }
    .tile-title{
      font-family:var(--display);
      font-weight:600;
      font-size:19px;
      letter-spacing:.01em;
      text-transform:uppercase;
      color:var(--ink);
    }
    .tile:hover .tile-title{
      color:var(--accent);
    }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav class="home-nav">
    <a href="./index.html">Home</a>
    <a href="./on-this-day.html">On This Day</a>
    <a href="./racing.html">Racing</a>
    <a href="./afl.html">AFL</a>
    <a href="./nrl.html">NRL</a>
    <a href="./football.html">Football</a>
    <a href="./cricket.html">Cricket</a>
    <a href="./motorsports.html" class="active">Motorsports</a>
    <a href="./nba.html">NBA</a>
    <a href="./nfl.html">NFL</a>
    <a href="./olympics.html">Olympics</a>
  </nav>
  <!-- HERO -->
  <div class="hero">
    <span class="eyebrow">The Sporting Almanac</span>
    <h1>Motorsports</h1>
  </div>
  <!-- GRID -->
  <div class="page">
    <div class="grid">
      <!-- F1 -->
      <a href="./f1.html" class="tile">
        <div class="tile-title">Formula 1</div>
      </a>
      <!-- Bathurst -->
      <a href="./bathurst.html" class="tile">
        <div class="tile-title">Bathurst 1000</div>
      </a>
    </div>
  </div>
</body>
</html>
