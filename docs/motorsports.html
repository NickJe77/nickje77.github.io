<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Motorsports | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./home.css">

  <style>

    body{
      font-family:Inter,system-ui,Arial;
      margin:0;
      background:#f4f6f8;
    }

    /* NAVBAR */
    .home-nav{
      display:flex;
      justify-content:center;
      gap:22px;
      padding:16px 0;
      background:#fff;
      border-bottom:1px solid #ddd;
      font-weight:600;
    }

    .home-nav a{
      color:#0056d6;
      text-decoration:none;
      font-size:18px;
    }

    /* HERO */
    .hero{
      background:linear-gradient(135deg,#002D72,#0056d6);
      color:#fff;
      text-align:center;
      padding:60px 20px 40px;
    }

    .hero h1{
      margin:0;
      font-size:36px;
    }

    /* GRID */
    .page{
      max-width:1100px;
      margin:auto;
      padding:40px 20px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:25px;
    }

    /* TILE (same feel as homepage) */
    .tile{
      position:relative;
      display:block;
      overflow:hidden;
      border-radius:12px;
      text-decoration:none;
    }

    .tile img{
      width:100%;
      height:240px;
      object-fit:cover;
      display:block;
      transition:transform .25s ease, box-shadow .25s ease;
      border-radius:12px;
    }

    .tile:hover img{
      transform:scale(1.03);
      box-shadow:0 12px 30px rgba(0,0,0,.18);
    }

    .tile-title{
      position:absolute;
      bottom:14px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,.85);
      color:#fff;
      padding:6px 14px;
      font-weight:700;
      font-size:12px;
      letter-spacing:1px;
      border-radius:20px;
      text-transform:uppercase;
      backdrop-filter:blur(4px);
    }

  </style>
</head>

<body>

  <!-- NAV -->
  <nav class="home-nav">
    <a href="./index.html">Home</a>
    <a href="./on-this-day.html">On This Day</a>
    <a href="./racing.html">Racing</a>
    <a href="./afl.html">AFL</a>
    <a href="./nrl.html">NRL</a>
    <a href="./football.html">Football</a>
    <a href="./cricket.html">Cricket</a>
    <a href="./motorsports.html" class="active">Motorsports</a>
    <a href="./nba.html">NBA</a>
    <a href="./nfl.html">NFL</a>
    <a href="./olympics.html">Olympics</a>
  </nav>

  <!-- HERO -->
  <div class="hero">
    <h1>Motorsports</h1>
  </div>

  <!-- GRID -->
  <div class="page">
    <div class="grid">

      <!-- F1 -->
      <a href="./f1.html" class="tile">
        <img src="./images/tile-f1.jpg" alt="Formula 1">
        <div class="tile-title">Formula 1</div>
      </a>

      <!-- Bathurst -->
      <a href="./bathurst.html" class="tile">
        <img src="./images/bathurst-hero.jpg" alt="Bathurst 1000">
        <div class="tile-title">Bathurst 1000</div>
      </a>

    </div>
  </div>

</body>
</html>
