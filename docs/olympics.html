<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Olympics | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:system-ui,Arial,sans-serif;
    margin:0;
    background:#f5f5f5;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:#111;
}
.navbar a{
    color:white;
    text-decoration:none;
    font-weight:600;
}

.hero{
    background:linear-gradient(90deg,#0085C7,#F4C300,#000,#009F3D,#DF0024);
    color:white;
    text-align:center;
    padding:40px 10px;
}

.container{
    max-width:1000px;
    margin:20px auto;
    padding:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    text-decoration:none;
    color:black;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
    transition:.2s;
}
.card:hover{
    transform:translateY(-4px);
}
.card h3{
    margin:0 0 8px 0;
}
</style>
</head>

<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/olympics.html">Olympics</a>
</div>

<div class="hero">
    <h1>Olympics</h1>
    <p>Explore Olympic history, results and records</p>
</div>

<div class="container">

<div class="grid">

<a href="/olympics-medals.html" class="card">
    <h3>Medal Table</h3>
    <p>All-time country medal standings</p>
</a>

<a href="/olympics-events.html" class="card">
    <h3>Events</h3>
    <p>Results by event</p>
</a>

<a href="/olympics-athletes.html" class="card">
    <h3>Athletes</h3>
    <p>Career medal records</p>
</a>

</div>

</div>

</body>
</html>
