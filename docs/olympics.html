    color:var(--ink);
    transition:.2s;
}
.card:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
    background:var(--accent-soft);
}
.card h3{
    margin:0 0 8px 0;
    font-family:var(--display);
    font-weight:600;
    font-size:18px;
    text-transform:uppercase;
    letter-spacing:.01em;
