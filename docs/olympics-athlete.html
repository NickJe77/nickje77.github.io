<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Olympic Athlete | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:20px;}
h1{text-align:center;}
.navbar{
  display:flex;justify-content:center;gap:22px;
  padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;}

.search-bar{
  text-align:center;margin:20px 0 10px;position:relative;
  max-width:400px;margin-left:auto;margin-right:auto;
}
.search-bar input{
  width:100%;padding:10px 14px;border-radius:8px;
  border:1px solid #ccc;font-size:15px;box-sizing:border-box;
}
.suggestions{
  position:absolute;top:100%;left:0;right:0;
  background:white;border:1px solid #ccc;border-top:none;
  border-radius:0 0 8px 8px;max-height:260px;overflow-y:auto;
  z-index:100;text-align:left;
}
.suggestions div{
  padding:9px 14px;cursor:pointer;font-size:14px;
}
.suggestions div:hover{background:#f0f4ff;}

.summary{
  max-width:600px;margin:20px auto;
  display:grid;grid-template-columns:repeat(4,1fr);
  text-align:center;gap:10px;
}
.card{
  background:#f5f7ff;padding:12px;border-radius:8px;font-weight:600;
}
.card span{display:block;font-size:22px;}
table{
  width:100%;max-width:900px;margin:20px auto;
  border-collapse:collapse;
}
th{background:#111;color:#fff;padding:10px;}
td{padding:10px;border-bottom:1px solid #ddd;text-align:center;}
td.event{text-align:left;}
td.event a{color:#1a56db;text-decoration:none;}
td.event a:hover{text-decoration:underline;}
tbody tr:nth-child(even){background:#f2f6ff;}
.gold{color:#c9a400;font-weight:700;}
.silver{color:#888;font-weight:700;}
.bronze{color:#b87333;font-weight:700;}
</style>
</head>
<body>
<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./olympics.html">Olympics</a>
  <a href="./olympics-athletes.html">Athletes</a>
</div>

<h1 id="name">Olympic Athlete</h1>

<div class="search-bar">
  <input id="athleteSearch" placeholder="Search athlete..." autocomplete="off">
  <div class="suggestions" id="suggestions" style="display:none"></div>
</div>

<div class="summary" id="summary"></div>
<table>
<thead>
<tr>
  <th>Year</th>
  <th>Sport</th>
  <th>Event</th>
  <th>Medal</th>
</tr>
</thead>
<tbody id="table-body"></tbody>
</table>
<script>
const params = new URLSearchParams(window.location.search);
let athleteName = decodeURIComponent(params.get("name")||"");
let allData = [];
let allNames = [];

/* LOAD */
fetch("/data/olympics/summer_olympic_medals.json")
.then(r=>r.json())
.then(data=>{
  allData = data;
  allNames = [...new Set(
    data
      .filter(r=>Number(r.year)!==2022)
      .map(r=>clean(r.athlete))
      .filter(Boolean)
  )].sort();

  if(athleteName){
    document.getElementById("athleteSearch").value = athleteName;
    build(athleteName);
  }
});

function clean(v){ return (v||"").toString().trim(); }

/* SEARCH */
const searchInput = document.getElementById("athleteSearch");
const suggestionsBox = document.getElementById("suggestions");

searchInput.addEventListener("input", ()=>{
  const q = searchInput.value.trim().toLowerCase();
  suggestionsBox.innerHTML = "";

  if(q.length < 2){
    suggestionsBox.style.display = "none";
    return;
  }

  const matches = allNames.filter(n=>n.toLowerCase().includes(q)).slice(0,10);

  if(!matches.length){
    suggestionsBox.style.display = "none";
    return;
  }

  matches.forEach(name=>{
    const div = document.createElement("div");
    div.textContent = name;
    div.addEventListener("mousedown", ()=>{
      searchInput.value = name;
      suggestionsBox.style.display = "none";
      selectAthlete(name);
    });
    suggestionsBox.appendChild(div);
  });

  suggestionsBox.style.display = "block";
});

searchInput.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    const q = searchInput.value.trim();
    suggestionsBox.style.display = "none";
    if(q) selectAthlete(q);
  }
});

searchInput.addEventListener("blur", ()=>{
  setTimeout(()=>{ suggestionsBox.style.display = "none"; }, 150);
});

function selectAthlete(name){
  athleteName = name;
  document.getElementById("name").innerText = name;
  const url = new URL(window.location);
  url.searchParams.set("name", name);
  window.history.pushState({}, "", url);
  build(name);
}

/* BUILD */
function build(name){
  let rows = allData.filter(r=>{
    if(Number(r.year) === 2022) return false;
    return clean(r.athlete) === name;
  });

  rows.sort((a,b)=>a.year-b.year);

  let g=0,s=0,b=0;
  rows.forEach(r=>{
    const m = (r.medal||"").toUpperCase();
    if(m==="GOLD") g++;
    if(m==="SILVER") s++;
    if(m==="BRONZE") b++;
  });

  renderSummary(g,s,b,g+s+b);
  renderTable(rows);
}

/* SUMMARY */
function renderSummary(g,s,b,t){
  document.getElementById("summary").innerHTML=`
    <div class="card">Gold<span>${g}</span></div>
    <div class="card">Silver<span>${s}</span></div>
    <div class="card">Bronze<span>${b}</span></div>
    <div class="card">Total<span>${t}</span></div>
  `;
}

/* TABLE */
function renderTable(rows){
  const tb = document.getElementById("table-body");
  tb.innerHTML="";
  rows.forEach(r=>{
    const medal = (r.medal||"").toUpperCase();
    const eventUrl = `olympics-event.html?event=${encodeURIComponent(clean(r.event))}&year=${r.year}`;
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r.year}</td>
      <td>${clean(r.sport)}</td>
      <td class="event"><a href="${eventUrl}">${clean(r.event)}</a></td>
      <td class="${medal.toLowerCase()}">${medal}</td>
    `;
    tb.appendChild(tr);
  });
}
</script>
</body>
</html>
