<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Olympic Athlete | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;flex-wrap:wrap;justify-content:center;gap:20px;
  padding:15px;background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{color:var(--ink);text-decoration:none;opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;text-align:center;padding:36px 20px;
}
.hero h1{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:clamp(24px,4.5vw,36px);letter-spacing:.01em;text-transform:uppercase;}
.hero p{margin:0;opacity:.68;font-size:13.5px;color:#fff;}

.search-wrap{
  max-width:500px;margin:22px auto 0;padding:0 20px;
  position:relative;
}
.search-wrap input{
  width:100%;padding:12px 18px;border-radius:999px;
  border:none;font-size:14px;box-sizing:border-box;outline:none;
  font-family:var(--body);font-weight:600;
}
.suggestions{
  position:absolute;top:100%;left:20px;right:20px;
  background:var(--surface);border-radius:14px;margin-top:8px;
  max-height:260px;overflow-y:auto;
  z-index:100;text-align:left;
  box-shadow:0 14px 30px -12px rgba(10,16,24,.4);
}
.suggestions div{
  padding:12px 16px;cursor:pointer;font-size:13.5px;font-weight:600;
  border-bottom:1px solid var(--line);
}
.suggestions div:last-child{border-bottom:none;}
.suggestions div:hover{background:var(--accent-soft);}

.container{
  max-width:900px;margin:0 auto;padding:26px 20px 70px;
}

/* SUMMARY CARDS */
.summary{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:12px;margin-bottom:22px;
}
.card{
  background:var(--surface);border:1px solid var(--line);padding:16px 12px;border-radius:var(--radius);
  font-weight:600;text-align:center;
  font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
}
.card span{display:block;font-family:var(--display);font-size:26px;margin-top:8px;font-weight:600;}
.card.gold-card  span{color:#a3821f;}
.card.silver-card span{color:var(--muted);}
.card.bronze-card span{color:#8a5225;}
.card.total-card  span{color:var(--accent);}

/* TABLE */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{
  width:100%;border-collapse:collapse;
}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;
  font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;
  text-align:center;font-family:var(--body);border-bottom:1px solid var(--line);
}
td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;font-size:13.5px;color:#27313c;}
td.event{text-align:left;}
td.event a{color:var(--ink);text-decoration:none;font-weight:700;}
td.event a:hover{color:var(--accent);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.gold  {color:#a3821f;font-weight:700;}
.silver{color:var(--muted);font-weight:700;}
.bronze{color:#8a5225;font-weight:700;}
</style>
</head>
<body>

<nav class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</nav>

<div class="hero">
  <h1 id="name">Olympic Athlete</h1>
  <p id="hero-sub">Search for an athlete below</p>

  <div class="search-wrap">
    <input id="athleteSearch" placeholder="Search athlete..." autocomplete="off">
    <div class="suggestions" id="suggestions" style="display:none"></div>
  </div>
</div>

<div class="container">

  <div class="summary" id="summary"></div>

  <div class="table-wrap">
  <table>
  <thead>
  <tr>
    <th>Year</th>
    <th>Sport</th>
    <th>Event</th>
    <th>Medal</th>
  </tr>
  </thead>
  <tbody id="table-body"></tbody>
  </table>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
let athleteName = decodeURIComponent(params.get("name")||"");
let allData = [];
let allNames = [];

/* LOAD */
fetch("/data/olympics/summer_olympic_medals.json")
.then(r=>r.json())
.then(data=>{
  allData = data;
  allNames = [...new Set(
    data
      .filter(r=>Number(r.year)!==2022)
      .map(r=>clean(r.athlete))
      .filter(Boolean)
  )].sort();

  if(athleteName){
    document.getElementById("athleteSearch").value = athleteName;
    build(athleteName);
  }
});

function clean(v){ return (v||"").toString().trim(); }

/* SEARCH */
const searchInput  = document.getElementById("athleteSearch");
const suggestionsBox = document.getElementById("suggestions");

searchInput.addEventListener("input", ()=>{
  const q = searchInput.value.trim().toLowerCase();
  suggestionsBox.innerHTML = "";

  if(q.length < 2){ suggestionsBox.style.display="none"; return; }

  const matches = allNames.filter(n=>n.toLowerCase().includes(q)).slice(0,10);
  if(!matches.length){ suggestionsBox.style.display="none"; return; }

  matches.forEach(name=>{
    const div = document.createElement("div");
    div.textContent = name;
    div.addEventListener("mousedown", ()=>{
      searchInput.value = name;
      suggestionsBox.style.display = "none";
      selectAthlete(name);
    });
    suggestionsBox.appendChild(div);
  });

  suggestionsBox.style.display = "block";
});

searchInput.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const q = searchInput.value.trim();
    suggestionsBox.style.display = "none";
    if(q) selectAthlete(q);
  }
});

searchInput.addEventListener("blur", ()=>{
  setTimeout(()=>{ suggestionsBox.style.display="none"; }, 150);
});

function selectAthlete(name){
  athleteName = name;
  document.getElementById("name").innerText = name;
  document.getElementById("hero-sub").innerText = "";
  const url = new URL(window.location);
  url.searchParams.set("name", name);
  window.history.pushState({}, "", url);
  build(name);
}

/* BUILD */
function build(name){
  document.getElementById("name").innerText = name;
  document.getElementById("hero-sub").innerText = "";

  let rows = allData.filter(r=>{
    if(Number(r.year)===2022) return false;
    return clean(r.athlete) === name;
  });

  rows.sort((a,b)=>a.year-b.year);

  let g=0,s=0,b=0;
  rows.forEach(r=>{
    const m = (r.medal||"").toUpperCase();
    if(m==="GOLD")   g++;
    if(m==="SILVER") s++;
    if(m==="BRONZE") b++;
  });

  renderSummary(g,s,b,g+s+b);
  renderTable(rows);
}

/* SUMMARY */
function renderSummary(g,s,b,t){
  document.getElementById("summary").innerHTML=`
    <div class="card gold-card">🥇 Gold<span>${g}</span></div>
    <div class="card silver-card">🥈 Silver<span>${s}</span></div>
    <div class="card bronze-card">🥉 Bronze<span>${b}</span></div>
    <div class="card total-card">Total<span>${t}</span></div>
  `;
}

/* TABLE */
function renderTable(rows){
  const tb = document.getElementById("table-body");
  tb.innerHTML="";
  rows.forEach(r=>{
    const medal = (r.medal||"").toUpperCase();
    const eventUrl = `olympics-event.html?event=${encodeURIComponent(clean(r.event))}&year=${r.year}`;
    const tr = document.createElement("tr");
    tr.innerHTML=`
      <td>${r.year}</td>
      <td>${clean(r.sport)}</td>
      <td class="event"><a href="${eventUrl}">${clean(r.event)}</a></td>
      <td class="${medal.toLowerCase()}">${medal}</td>
    `;
    tb.appendChild(tr);
  });
}
</script>
</body>
</html>
