<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:white;
  padding:26px 30px;
  border-radius:14px;
  margin-bottom:30px;
}

.hero h1{
  margin:0 0 6px;
  font-size:28px;
}

.hero p{
  margin:0;
  opacity:.9;
  font-size:14px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}

th{
  background:#f0f0f0;
  font-weight:700;
}

tr:nth-child(even){
  background:#f6f9ff;
}

.link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}

.link:hover{
  text-decoration:underline;
}

.games a{
  margin-right:6px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>NBA Finals</h1>
  <p>Championship series history from 1976–77 to present.</p>
</div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Champion</th>
<th>Runner-up</th>
<th>Series</th>
<th>Games</th>
</tr>
</thead>
<tbody id="finalsTable">
<tr><td colspan="5">Loading...</td></tr>
</tbody>
</table>

</div>

<script>

const START_YEAR = 1976;
const END_YEAR = 2025;
const tableBody = document.getElementById("finalsTable");

const conferenceMap = {
"Boston Celtics":"East","Brooklyn Nets":"East","New York Knicks":"East","Philadelphia 76ers":"East","Toronto Raptors":"East",
"Chicago Bulls":"East","Cleveland Cavaliers":"East","Detroit Pistons":"East","Indiana Pacers":"East","Milwaukee Bucks":"East",
"Atlanta Hawks":"East","Charlotte Hornets":"East","Miami Heat":"East","Orlando Magic":"East","Washington Wizards":"East",
"Denver Nuggets":"West","Minnesota Timberwolves":"West","Oklahoma City Thunder":"West","Portland Trail Blazers":"West",
"Utah Jazz":"West","Golden State Warriors":"West","LA Clippers":"West","Los Angeles Lakers":"West","Phoenix Suns":"West",
"Sacramento Kings":"West","Dallas Mavericks":"West","Houston Rockets":"West","Memphis Grizzlies":"West",
"New Orleans Pelicans":"West","San Antonio Spurs":"West"
};

async function loadFinals(){

tableBody.innerHTML = "";

for(let year = END_YEAR; year >= START_YEAR; year--){

try{

const indexRes = await fetch(`data/nba/${year}/index.json`);
if(!indexRes.ok) continue;

const index = await indexRes.json();
if(!index.games?.length) continue;

const games = (await Promise.all(
index.games.map(id =>
fetch(`data/nba/${year}/${id}.json`)
.then(r => r.ok ? r.json() : null)
)
)).filter(Boolean);

const playoffGames = games.filter(g => g.game_type === "Playoffs");

if(!playoffGames.length) continue;

const seriesMap = {};

playoffGames.forEach(g=>{
const key = [g.home_team, g.away_team].sort().join("|");
if(!seriesMap[key]) seriesMap[key] = [];
seriesMap[key].push(g);
});

const allSeries = Object.values(seriesMap);
if(!allSeries.length) continue;

// 1️⃣ Sort by number of games (longest first)
allSeries.sort((a,b)=>b.length - a.length);

let finalsSeries = allSeries[0];

// 2️⃣ Ensure East vs West matchup
const teamA = finalsSeries[0].home_team;
const teamB = finalsSeries[0].away_team;

const confA = conferenceMap[teamA];
const confB = conferenceMap[teamB];

if(confA === confB){
for(const series of allSeries){
const tA = series[0].home_team;
const tB = series[0].away_team;
if(conferenceMap[tA] && conferenceMap[tB] && conferenceMap[tA] !== conferenceMap[tB]){
finalsSeries = series;
break;
}
}
}

if(!finalsSeries) continue;

finalsSeries.sort((a,b)=> new Date(a.date) - new Date(b.date));

const wins = {};

finalsSeries.forEach(g=>{
if(g.winner)
wins[g.winner] = (wins[g.winner] || 0) + 1;
});

const teams = Object.keys(wins);
if(teams.length < 2) continue;

const champion = teams.sort((a,b)=>wins[b]-wins[a])[0];
const runnerUp = teams.find(t=>t!==champion);
const seriesResult = `${wins[champion]}-${wins[runnerUp]}`;

const gamesLinks = finalsSeries.map((g,i)=>
`<a class="link" href="nba-game.html?season=${year}&game=${g.game_id}">G${i+1}</a>`
).join(" ");

const tr = document.createElement("tr");
tr.innerHTML = `
<td>${year}-${String(year+1).slice(2)}</td>
<td>${champion}</td>
<td>${runnerUp}</td>
<td>${seriesResult}</td>
<td class="games">${gamesLinks}</td>
`;

tableBody.appendChild(tr);

}catch(e){
continue;
}
}

if(!tableBody.children.length){
tableBody.innerHTML = "<tr><td colspan='5'>No Finals data found.</td></tr>";
}

}

loadFinals();

</script>

</body>
</html>
