<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#17408B;
}

.page{
max-width:1100px;
margin:auto;
padding:30px 20px 60px;
}

.hero{
background:linear-gradient(270deg,#17408B,#C9082A,#17408B);
color:#fff;
padding:34px;
border-radius:22px;
margin-bottom:25px;
}

.hero h1{
margin:0;
font-size:34px;
}

.card{
background:#fff;
border-radius:16px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#17408B;
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #e6e8ee;
}

tr:hover{
background:#eef2ff;
cursor:pointer;
}

.loading{
padding:20px;
text-align:center;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
<h1>NBA Finals</h1>
</div>

<div class="card">

<table>

<thead>
<tr>
<th>Season</th>
<th>Champion</th>
<th>Runner Up</th>
<th>Series</th>
</tr>
</thead>

<tbody id="finalsBody">
<tr><td colspan="4" class="loading">Loading finals…</td></tr>
</tbody>

</table>

</div>

</div>

<script>

function seasonLabel(start){
const next = String((Number(start)+1)%100).padStart(2,"0");
return `${start}-${next}`;
}

async function loadFinals(){

const res = await fetch("/data/nba/finals.json");

if(!res.ok){
document.getElementById("finalsBody").innerHTML =
"<tr><td colspan='4'>Finals data not available.</td></tr>";
return;
}

const data = await res.json();

data.sort((a,b)=>b.season-a.season);

const body = document.getElementById("finalsBody");

body.innerHTML = "";

for(const row of data){

const tr = document.createElement("tr");

tr.onclick = ()=>{
location.href=`nba-season.html?season=${row.season}`;
};

tr.innerHTML = `
<td>${seasonLabel(row.season)}</td>
<td>${row.champion}</td>
<td>${row.runner_up}</td>
<td>${row.series}</td>
`;

body.appendChild(tr);
}

}

loadFinals();

</script>

</body>
</html>
