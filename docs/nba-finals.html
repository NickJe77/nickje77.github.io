<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1100px;margin:auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(90deg,#1D428A,#C8102E);color:white;padding:28px 34px;border-radius:18px;margin-bottom:25px;}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.05);}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;}
th{background:#eef3ff;}
tr:nth-child(even){background:#f8faff;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Finals</h1>
<p>Championship series history.</p>
</div>

<div class="card">

<table>
<thead>
<tr>
<th>Season</th>
<th>Champion</th>
<th>Runner-up</th>
<th>Series</th>
</tr>
</thead>

<tbody id="rows">
<tr><td colspan="4">Loading...</td></tr>
</tbody>

</table>

</div>

</div>

<script>

const rows=document.getElementById("rows");

async function load(){

rows.innerHTML="";

let finals=[];

try{
finals=await fetch("/data/nba/finals.json").then(r=>r.json());
}catch(e){
rows.innerHTML="<tr><td colspan='4'>Error loading finals.json</td></tr>";
return;
}

finals
.sort((a,b)=>b.season-a.season)
.forEach(f=>{

const season=`${f.season-1}-${String(f.season).slice(2)}`;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${season}</td>
<td>${f.champion}</td>
<td>${f.runner_up}</td>
<td>${f.series}</td>
`;

rows.appendChild(tr);

});

}

load();

</script>

</body>
</html>
