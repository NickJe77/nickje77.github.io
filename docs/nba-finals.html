<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}

/* HERO HEADER */
.hero{
  background:linear-gradient(90deg,#17408B,#C9082A);
  color:#fff;
  padding:36px 40px;
  border-radius:18px;
  margin-bottom:30px;
}

.hero h1{
  margin:0;
  font-size:34px;
  letter-spacing:.5px;
  font-weight:700;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}

th{
  background:#f0f0f0;
}

tr:nth-child(even){
  background:#f6f9ff;
}

.link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
.link:hover{
  text-decoration:underline;
}

.games a{
  margin-right:6px;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>NBA Finals</h1>
</div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Champion</th>
<th>Runner-up</th>
<th>Series</th>
<th>Games</th>
</tr>
</thead>
<tbody id="finalsTable"></tbody>
</table>

</div>

<script>

const START_YEAR = 1976;
const END_YEAR = 2025;
const tableBody = document.getElementById("finalsTable");

async function loadFinals(){

for(let year = END_YEAR; year >= START_YEAR; year--){

try{

const indexRes = await fetch(`data/nba/${year}/index.json`);
if(!indexRes.ok) continue;

const index = await indexRes.json();
if(!index.games || !index.games.length) continue;

const gamePromises = index.games.map(id =>
fetch(`data/nba/${year}/${id}.json`).then(r => r.ok ? r.json() : null)
);

const games = (await Promise.all(gamePromises)).filter(Boolean);

const playoffGames = games
.filter(g => g.game_type === "Playoffs")
.sort((a,b)=> new Date(a.date) - new Date(b.date));

if(!playoffGames.length) continue;

const seriesMap = {};

playoffGames.forEach(g=>{
const key = [g.home_team, g.away_team].sort().join("|");
if(!seriesMap[key]) seriesMap[key] = [];
seriesMap[key].push(g);
});

let finalsSeries = null;
let latestDate = 0;

Object.values(seriesMap).forEach(series=>{
const lastGame = series[series.length-1];
const lastDate = new Date(lastGame.date).getTime();

if(lastDate > latestDate){
latestDate = lastDate;
finalsSeries = series;
}
});

if(!finalsSeries) continue;

const wins = {};
finalsSeries.forEach(g=>{
wins[g.winner] = (wins[g.winner] || 0) + 1;
});

const teams = Object.keys(wins);
if(teams.length < 2) continue;

const champion = teams.sort((a,b)=>wins[b]-wins[a])[0];
const runnerUp = teams.find(t=>t!==champion);
const seriesResult = `${wins[champion]}-${wins[runnerUp]}`;

const gamesLinks = finalsSeries.map((g,i)=>
`<a class="link" href="nba-game.html?season=${year}&game=${g.game_id}">G${i+1}</a>`
).join(" ");

const tr = document.createElement("tr");
tr.innerHTML = `
<td>${year}-${String(year+1).slice(2)}</td>
<td>${champion}</td>
<td>${runnerUp}</td>
<td>${seriesResult}</td>
<td class="games">${gamesLinks}</td>
`;

tableBody.appendChild(tr);

}catch(e){
continue;
}
}

if(!tableBody.children.length){
tableBody.innerHTML = "<tr><td colspan='5'>No Finals data found.</td></tr>";
}

}

loadFinals();

</script>

</body>
</html>
