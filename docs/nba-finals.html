<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#ffffff;
color:#1f2937;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:700;
background:#fff;
}

.navbar a{
text-decoration:none;
color:#0056d6;
font-size:18px;
}

.navbar a:hover{
text-decoration:underline;
}

/* PAGE */

.page-wrap{
max-width:1100px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#17408B,#C9082A);
color:white;
padding:26px 28px 22px;
border-radius:16px;
margin-bottom:24px;
text-align:center;
box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.hero h1{
margin:0;
font-size:32px;
}

/* TABLE CARD */

.table-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
overflow:hidden;
box-shadow:0 6px 16px rgba(0,0,0,0.05);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:11px 12px;
border-bottom:1px solid #e5e7eb;
text-align:left;
}

th{
background:#17408B;
color:white;
font-size:14px;
font-weight:700;
}

td{
font-size:15px;
}

tr:nth-child(even){
background:#f8faff;
}

tr:hover{
background:#e9f0ff;
cursor:pointer;
}

.loading{
padding:20px;
text-align:center;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Finals</h1>
</div>

<div class="table-card">

<table>

<thead>
<tr>
<th>Season</th>
<th>Champion</th>
<th>Runner Up</th>
<th>Series</th>
</tr>
</thead>

<tbody id="finalsBody">
<tr><td colspan="4" class="loading">Loading finals…</td></tr>
</tbody>

</table>

</div>

</div>

<script>

function seasonLabel(start){
const next = String((Number(start)+1)%100).padStart(2,"0");
return `${start}-${next}`;
}

async function loadFinals(){

const res = await fetch("/data/nba/finals.json");

if(!res.ok){
document.getElementById("finalsBody").innerHTML =
"<tr><td colspan='4'>Finals data not available.</td></tr>";
return;
}

const data = await res.json();

data.sort((a,b)=>b.season-a.season);

const body = document.getElementById("finalsBody");

body.innerHTML = "";

for(const row of data){

const tr = document.createElement("tr");

tr.onclick = ()=>{
location.href=`nba-season.html?season=${row.season}`;
};

tr.innerHTML = `
<td>${seasonLabel(row.season)}</td>
<td>${row.champion}</td>
<td>${row.runner_up}</td>
<td>${row.series}</td>
`;

body.appendChild(tr);
}

}

loadFinals();

</script>

</body>
</html>
