<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:white;
  padding:26px 30px;
  border-radius:14px;
  margin-bottom:30px;
}

.hero h1{
  margin:0 0 6px;
  font-size:28px;
}

.hero p{
  margin:0;
  opacity:.9;
  font-size:14px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}

th{
  background:#f0f0f0;
  font-weight:700;
}

tr:nth-child(even){
  background:#f6f9ff;
}

.link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}

.link:hover{
  text-decoration:underline;
}

.games a{
  margin-right:6px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>NBA Finals</h1>
  <p>Championship series history from 1976–77 to present.</p>
</div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Champion</th>
<th>Runner-up</th>
<th>Series</th>
<th>Games</th>
</tr>
</thead>
<tbody id="finalsTable">
<tr><td colspan="5">Loading...</td></tr>
</tbody>
</table>

</div>

<script>
const START_YEAR = 1976;
const END_YEAR = new Date().getFullYear();
const tableBody = document.getElementById("finalsTable");

function getGameDate(g){
  // prefer g.date but support common alternates
  const d = g?.date || g?.date_iso || g?.game_date || g?.gameDate || "";
  const dt = new Date(d);
  return isNaN(dt.getTime()) ? null : dt;
}

async function loadFinals(){
  tableBody.innerHTML = "";

  for(let year = END_YEAR; year >= START_YEAR; year--){
    try{
      const indexRes = await fetch(`data/nba/${year}/index.json`);
      if(!indexRes.ok) continue;

      const index = await indexRes.json();
      if(!index.games?.length) continue;

      const games = (await Promise.all(
        index.games.map(id =>
          fetch(`data/nba/${year}/${id}.json`)
            .then(r => r.ok ? r.json() : null)
        )
      )).filter(Boolean);

      const playoffGames = games.filter(g => g.game_type === "Playoffs");
      if(!playoffGames.length) continue;

      // Group by matchup (series)
      const seriesMap = {};
      playoffGames.forEach(g=>{
        const a = g.home_team || "";
        const b = g.away_team || "";
        if(!a || !b) return;
        const key = [a,b].sort().join("|");
        if(!seriesMap[key]) seriesMap[key] = [];
        seriesMap[key].push(g);
      });

      const allSeries = Object.values(seriesMap);
      if(!allSeries.length) continue;

      // ✅ FINALS = series with latest ending date in the entire playoffs
      let finalsSeries = null;
      let finalsEnd = null;

      for(const series of allSeries){
        // sort by date so we can get end date reliably
        const dated = series
          .map(g => ({ g, dt: getGameDate(g) }))
          .filter(x => x.dt);

        if(!dated.length) continue;

        dated.sort((x,y)=>x.dt - y.dt);
        const endDt = dated[dated.length - 1].dt;

        if(!finalsEnd || endDt > finalsEnd){
          finalsEnd = endDt;
          finalsSeries = dated.map(x=>x.g);
        } else if(finalsEnd && endDt.getTime() === finalsEnd.getTime()){
          // tie-breaker: prefer longer series
          if(finalsSeries && series.length > finalsSeries.length){
            finalsSeries = dated.map(x=>x.g);
          }
        }
      }

      if(!finalsSeries || !finalsSeries.length) continue;

      finalsSeries.sort((a,b)=>{
        const da = getGameDate(a), db = getGameDate(b);
        if(!da && !db) return 0;
        if(!da) return 1;
        if(!db) return -1;
        return da - db;
      });

      // Determine the two finals teams from matchup
      const t1 = finalsSeries[0].home_team;
      const t2 = finalsSeries[0].away_team;

      // Count wins in finals series (only count winners that match either finals team)
      const wins = {};
      wins[t1] = 0;
      wins[t2] = 0;

      finalsSeries.forEach(g=>{
        const w = g.winner;
        if(w === t1) wins[t1] += 1;
        else if(w === t2) wins[t2] += 1;
      });

      // If winners missing, we can’t determine series score reliably
      // but we’ll still show teams and link games
      let champion = t1;
      let runnerUp = t2;
      let seriesResult = "-";

      if(wins[t1] !== wins[t2]){
        champion = wins[t1] > wins[t2] ? t1 : t2;
        runnerUp = champion === t1 ? t2 : t1;
        seriesResult = `${wins[champion]}-${wins[runnerUp]}`;
      }

      const gamesLinks = finalsSeries.map((g,i)=>
        `<a class="link" href="nba-game.html?season=${year}&game=${g.game_id}">G${i+1}</a>`
      ).join(" ");

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${year}-${String(year+1).slice(2)}</td>
        <td>${champion}</td>
        <td>${runnerUp}</td>
        <td>${seriesResult}</td>
        <td class="games">${gamesLinks}</td>
      `;

      tableBody.appendChild(tr);

    }catch(e){
      continue;
    }
  }

  if(!tableBody.children.length){
    tableBody.innerHTML = "<tr><td colspan='5'>No Finals data found.</td></tr>";
  }
}

loadFinals();
</script>

</body>
</html>
