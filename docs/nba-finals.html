<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:28px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;}

.final-row{cursor:pointer;}
.final-row:hover td{background:#f9fbfd;}

.series{background:#f7f9fb;}
.series td{padding:0;}
.series-table{width:100%;border-collapse:collapse;}
.series-table td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);}
.series-table tr{cursor:pointer;}
.series-table tr:hover td{background:#eef2f5;}

.loading{padding:24px;text-align:center;color:var(--muted);font-style:italic;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div class="page-wrap">

<div class="hero">
  <span class="eyebrow">NBA</span>
  <h1>NBA Finals</h1>
</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>Season</th>
<th>Champion</th>
<th>Runner Up</th>
<th>Series</th>
</tr>
</thead>

<tbody id="finalsBody">
<tr><td colspan="4" class="loading">Loading finals…</td></tr>
</tbody>

</table>

</div>

</div>

<script>

function seasonLabel(start){
const next = String((Number(start)+1)%100).padStart(2,"0");
return `${start}-${next}`;
}

async function loadFinals(){

const res = await fetch("/data/nba/finals.json");

if(!res.ok){
document.getElementById("finalsBody").innerHTML =
"<tr><td colspan='4'>Finals data not available.</td></tr>";
return;
}

const data = await res.json();

data.sort((a,b)=>b.season-a.season);

const body=document.getElementById("finalsBody");
body.innerHTML="";

for(const row of data){

const tr=document.createElement("tr");
tr.className="final-row";

tr.innerHTML=`
<td>${seasonLabel(row.season)}</td>
<td>${row.champion}</td>
<td>${row.runner_up}</td>
<td>${row.series}</td>
`;

body.appendChild(tr);

const seriesRow=document.createElement("tr");
seriesRow.className="series";
seriesRow.style.display="none";

seriesRow.innerHTML=`
<td colspan="4">
<table class="series-table" id="series-${row.season}">
</table>
</td>
`;

body.appendChild(seriesRow);

tr.onclick=()=>toggleSeries(row,seriesRow);

}

}

function toggleSeries(row,seriesRow){

if(seriesRow.style.display==="table-row"){
seriesRow.style.display="none";
return;
}

seriesRow.style.display="table-row";

const table=document.getElementById(`series-${row.season}`);

if(table.dataset.loaded) return;

table.innerHTML="";

row.games.forEach((id,index)=>{

const tr=document.createElement("tr");

tr.onclick=()=>{
window.location.href=`nba-game.html?season=${row.season}&game=${id}`;
};

tr.innerHTML=`
<td>Game ${index+1}</td>
<td>${row.champion} vs ${row.runner_up}</td>
`;

table.appendChild(tr);

});

table.dataset.loaded=true;

}

loadFinals();

</script>

</body>
</html>
