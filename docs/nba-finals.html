<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#fff;
color:#1f2937;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:700;
background:#fff;
}

.navbar a{
text-decoration:none;
color:#0056d6;
font-size:18px;
}

.navbar a:hover{text-decoration:underline}

.page-wrap{
max-width:1100px;
margin:auto;
padding:30px 20px 60px;
}

.hero{
background:linear-gradient(90deg,#17408B,#C9082A);
color:white;
padding:26px 28px 22px;
border-radius:16px;
margin-bottom:24px;
text-align:center;
box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.hero h1{
margin:0;
font-size:32px;
}

.table-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
overflow:hidden;
box-shadow:0 6px 16px rgba(0,0,0,0.05);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:11px 12px;
border-bottom:1px solid #e5e7eb;
text-align:left;
}

th{
background:#17408B;
color:white;
font-size:14px;
font-weight:700;
}

tr:nth-child(even){
background:#f8faff;
}

.final-row{
cursor:pointer;
}

.final-row:hover{
background:#e9f0ff;
}

.series{
background:#f9fbff;
}

.series td{
padding:0;
}

.series-table{
width:100%;
border-collapse:collapse;
}

.series-table td{
padding:10px 12px;
border-bottom:1px solid #eee;
}

.series-table tr{
cursor:pointer;
}

.series-table tr:hover{
background:#eef3ff;
}

.loading{
padding:20px;
text-align:center;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Finals</h1>
</div>

<div class="table-card">

<table>

<thead>
<tr>
<th>Season</th>
<th>Champion</th>
<th>Runner Up</th>
<th>Series</th>
</tr>
</thead>

<tbody id="finalsBody">
<tr><td colspan="4" class="loading">Loading finals…</td></tr>
</tbody>

</table>

</div>

</div>

<script>

function seasonLabel(start){
const next = String((Number(start)+1)%100).padStart(2,"0");
return `${start}-${next}`;
}

async function loadFinals(){

const res = await fetch("/data/nba/finals.json");

if(!res.ok){
document.getElementById("finalsBody").innerHTML =
"<tr><td colspan='4'>Finals data not available.</td></tr>";
return;
}

const data = await res.json();

data.sort((a,b)=>b.season-a.season);

const body=document.getElementById("finalsBody");
body.innerHTML="";

for(const row of data){

const tr=document.createElement("tr");
tr.className="final-row";

tr.innerHTML=`
<td>${seasonLabel(row.season)}</td>
<td>${row.champion}</td>
<td>${row.runner_up}</td>
<td>${row.series}</td>
`;

body.appendChild(tr);

const seriesRow=document.createElement("tr");
seriesRow.className="series";
seriesRow.style.display="none";

seriesRow.innerHTML=`
<td colspan="4">
<table class="series-table" id="series-${row.season}">
</table>
</td>
`;

body.appendChild(seriesRow);

tr.onclick=()=>toggleSeries(row,seriesRow);

}

}

function toggleSeries(row,seriesRow){

if(seriesRow.style.display==="table-row"){
seriesRow.style.display="none";
return;
}

seriesRow.style.display="table-row";

const table=document.getElementById(`series-${row.season}`);

if(table.dataset.loaded) return;

table.innerHTML="";

row.games.forEach((id,index)=>{

const tr=document.createElement("tr");

tr.onclick=()=>{
window.location.href=`nba-game.html?season=${row.season}&game=${id}`;
};

tr.innerHTML=`
<td>Game ${index+1}</td>
<td>${row.champion} vs ${row.runner_up}</td>
`;

table.appendChild(tr);

});

table.dataset.loaded=true;

}

loadFinals();

</script>

</body>
</html>
