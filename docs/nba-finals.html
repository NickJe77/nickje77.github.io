<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:30px;}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}
th{
  background:#f0f0f0;
}
tr:nth-child(even){
  background:#f6f9ff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<h1>NBA Finals</h1>
<p>Championship series from 1976–77 to the present day.</p>

<table>
  <thead>
    <tr>
      <th>Season</th>
      <th>Champion</th>
      <th>Runner-up</th>
      <th>Series</th>
      <th>Finals MVP</th>
    </tr>
  </thead>
  <tbody id="finalsTable"></tbody>
</table>

</div>

<script>
const tableBody = document.getElementById("finalsTable");

fetch("data/nba/finals.json")
  .then(r => r.json())
  .then(data => {

    const filtered = data.filter(f => {
      if(!f.season) return false;
      const startYear = parseInt(f.season.split("-")[0]);
      return startYear >= 1976;
    });

    filtered.forEach(finals => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${finals.season}</td>
        <td>${finals.champion || ""}</td>
        <td>${finals.runner_up || ""}</td>
        <td>${finals.series || ""}</td>
        <td>${finals.finals_mvp || ""}</td>
      `;
      tableBody.appendChild(tr);
    });
  })
  .catch(() => {
    tableBody.innerHTML = "<tr><td colspan='5'>No data available.</td></tr>";
  });
</script>

</body>
</html>
