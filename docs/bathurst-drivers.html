<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst Drivers | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:Inter,system-ui,Arial;
      margin:0;
      background:#f4f6f8;
    }

    .navbar{
      display:flex;
      justify-content:center;
      gap:24px;
      padding:16px 0;
      background:#fff;
      border-bottom:1px solid #ddd;
      font-weight:600;
    }

    .navbar a{
      text-decoration:none;
      color:#0056d6;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:15px;
    }

    .search{
      width:100%;
      padding:10px;
      font-size:16px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    .suggestions{
      background:#fff;
      border:1px solid #ccc;
      border-top:none;
      max-height:200px;
      overflow-y:auto;
      border-radius:0 0 8px 8px;
      position:relative;
      z-index:10;
      margin-bottom:10px;
    }

    .suggestion-item{
      padding:8px;
      cursor:pointer;
    }

    .suggestion-item:hover{
      background:#f2f6ff;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#fff;
      border-radius:10px;
      overflow:hidden;
    }

    th, td{
      padding:10px;
      text-align:left;
    }

    th{
      background:#002D72;
      color:#fff;
    }

    tbody tr:nth-child(even){
      background:#f2f6ff;
    }

    tbody tr:hover{
      background:#e0ecff;
    }

    .driver-link{
      color:#0056d6;
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="bathurst.html">Bathurst</a>
  <a href="/">Home</a>
</div>

<div class="container">
  <h1>Bathurst Drivers</h1>

  <input type="text" id="search" class="search" placeholder="Search driver...">
  <div id="suggestions" class="suggestions"></div>

  <table>
    <thead>
      <tr>
        <th>Driver</th>
        <th>Starts</th>
        <th>Wins</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

<script>

let drivers = {};
let driverList = [];

// LOAD DATA
fetch("/data/bathurst/winners.json")
  .then(res => res.json())
  .then(data => {

    data.forEach(r => {

      if(!r.driver) return;

      const splitDrivers = r.driver.split("/").map(d => d.trim());

      splitDrivers.forEach(d => {

        if(!drivers[d]){
          drivers[d] = {
            name: d,
            starts: 0,
            wins: 0
          };
        }

        drivers[d].starts++;
        drivers[d].wins++;

      });

    });

    driverList = Object.values(drivers);
    renderTable();

  });

// RENDER TABLE
function renderTable(filter=""){

  const tbody = document.getElementById("table");
  tbody.innerHTML = "";

  let list = driverList;

  if(filter){
    list = list.filter(d =>
      d.name.toLowerCase().includes(filter.toLowerCase())
    );
  }

  list.sort((a,b) => b.wins - a.wins);

  list.forEach(d => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <a class="driver-link" href="bathurst-driver.html?name=${encodeURIComponent(d.name)}">
          ${d.name}
        </a>
      </td>
      <td>${d.starts}</td>
      <td>${d.wins}</td>
    `;

    tbody.appendChild(tr);
  });
}

// PREDICTIVE SEARCH
const searchInput = document.getElementById("search");
const suggestions = document.getElementById("suggestions");

searchInput.addEventListener("input", e => {

  const value = e.target.value.toLowerCase();
  suggestions.innerHTML = "";

  if(!value){
    renderTable();
    return;
  }

  const matches = driverList
    .filter(d => d.name.toLowerCase().includes(value))
    .slice(0, 10);

  matches.forEach(d => {
    const div = document.createElement("div");
    div.className = "suggestion-item";
    div.textContent = d.name;

    div.onclick = () => {
      searchInput.value = d.name;
      suggestions.innerHTML = "";
      renderTable(d.name);
    };

    suggestions.appendChild(div);
  });

  renderTable(value);
});

// CLOSE DROPDOWN
document.addEventListener("click", e => {
  if(!e.target.closest(".search")){
    suggestions.innerHTML = "";
  }
});

</script>

</body>
</html>
