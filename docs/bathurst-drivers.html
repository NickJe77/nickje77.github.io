<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst Drivers | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#eceff3;
      --surface:#ffffff;
      --ink:#0f141a;
      --muted:#69727c;
      --faint:#9aa3ad;
      --line:#e3e8ee;
      --board:#0c130f;
      --board-2:#161f16;
      --accent:#c99a3d;
      --accent-soft:rgba(201,154,61,.16);
      --display:'Oswald',system-ui,sans-serif;
      --body:'Inter',system-ui,sans-serif;
      --radius:16px;
    }
    *{box-sizing:border-box;}
    body{
      font-family:var(--body);
      margin:0;
      background:var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
    }

    .navbar{
      display:flex;
      justify-content:center;
      gap:22px;
      padding:15px 0;
      background:var(--surface);
      border-bottom:1px solid var(--line);
      font-weight:600;
      font-size:13.5px;
    }
    .navbar a{
      text-decoration:none;
      color:var(--ink);
      opacity:.7;
      transition:opacity .15s,color .15s;
    }
    .navbar a:hover,.navbar a[aria-current="page"]{
      opacity:1;
      color:var(--accent);
    }

    .container{
      max-width:1100px;
      margin:0 auto;
      padding:26px 20px 70px;
    }

    /* ── Hero ─────────────────────────────────────────────── */
    .hero{
      position:relative;
      background:linear-gradient(160deg,var(--board-2),var(--board));
      color:#fff;
      padding:32px 34px;
      border-radius:var(--radius);
      margin-bottom:22px;
      text-align:center;
      box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
    }
    .hero .eyebrow{
      font-family:var(--body);
      font-size:11.5px;
      font-weight:600;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--accent);
      margin-bottom:10px;
    }
    .hero h1{
      margin:0;
      font-family:var(--display);
      font-weight:600;
      font-size:clamp(26px,5vw,40px);
      letter-spacing:.01em;
      text-transform:uppercase;
      color:#fff;
    }

    /* ── Search ───────────────────────────────────────────── */
    .search-wrap{ position:relative;margin-bottom:20px; }
    .search{
      width:100%;
      padding:11px 18px;
      font-family:var(--body);
      font-size:14px;
      font-weight:600;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--ink);
      outline:none;
    }
    .search:hover{ border-color:var(--faint); }
    .search:focus{ border-color:var(--accent); }

    .suggestions{
      background:var(--surface);
      border:1px solid var(--line);
      max-height:220px;
      overflow-y:auto;
      border-radius:14px;
      position:absolute;
      top:calc(100% + 6px);
      left:0;
      right:0;
      z-index:10;
      box-shadow:0 10px 24px -12px rgba(10,16,24,.25);
    }
    .suggestions:empty{ border:none;box-shadow:none; }

    .suggestion-item{
      padding:10px 16px;
      cursor:pointer;
      font-size:13.5px;
      font-weight:600;
      color:var(--ink);
    }
    .suggestion-item:hover{
      background:var(--accent-soft);
      color:var(--accent);
    }

    /* ── Table ────────────────────────────────────────────── */
    table{
      width:100%;
      border-collapse:collapse;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
    }

    th, td{
      padding:11px 14px;
      text-align:left;
      font-size:13.5px;
      border-bottom:1px solid var(--line);
    }

    th{
      background:#f7f9fb;
      color:var(--muted);
      font-family:var(--body);
      font-weight:600;
      font-size:11px;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    td{
      color:#27313c;
      font-variant-numeric:tabular-nums;
    }

    tbody tr:last-child td{ border-bottom:none; }
    tbody tr:hover td{ background:#f0f6ff; }

    .driver-link{
      color:var(--ink);
      text-decoration:none;
      font-weight:700;
    }
    .driver-link:hover{ color:var(--accent); }
  </style>
</head>

<body>

<div class="navbar">
  <a href="bathurst.html">Bathurst</a>
  <a href="/">Home</a>
</div>

<div class="container">
  <div class="hero">
    <div class="eyebrow">Bathurst</div>
    <h1>Drivers</h1>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" class="search" placeholder="Search driver...">
    <div id="suggestions" class="suggestions"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Driver</th>
        <th>Starts</th>
        <th>Wins</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

<script>

let drivers = {};
let driverList = [];

// LOAD DATA
fetch("/data/bathurst/winners.json")
  .then(res => res.json())
  .then(data => {

    data.forEach(r => {

      if(!r.driver) return;

      const splitDrivers = r.driver.split("/").map(d => d.trim());

      splitDrivers.forEach(d => {

        if(!drivers[d]){
          drivers[d] = {
            name: d,
            starts: 0,
            wins: 0
          };
        }

        drivers[d].starts++;
        drivers[d].wins++;

      });

    });

    driverList = Object.values(drivers);
    renderTable();

  });

// RENDER TABLE
function renderTable(filter=""){

  const tbody = document.getElementById("table");
  tbody.innerHTML = "";

  let list = driverList;

  if(filter){
    list = list.filter(d =>
      d.name.toLowerCase().includes(filter.toLowerCase())
    );
  }

  list.sort((a,b) => b.wins - a.wins);

  list.forEach(d => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <a class="driver-link" href="bathurst-driver.html?name=${encodeURIComponent(d.name)}">
          ${d.name}
        </a>
      </td>
      <td>${d.starts}</td>
      <td>${d.wins}</td>
    `;

    tbody.appendChild(tr);
  });
}

// PREDICTIVE SEARCH
const searchInput = document.getElementById("search");
const suggestions = document.getElementById("suggestions");

searchInput.addEventListener("input", e => {

  const value = e.target.value.toLowerCase();
  suggestions.innerHTML = "";

  if(!value){
    renderTable();
    return;
  }

  const matches = driverList
    .filter(d => d.name.toLowerCase().includes(value))
    .slice(0, 10);

  matches.forEach(d => {
    const div = document.createElement("div");
    div.className = "suggestion-item";
    div.textContent = d.name;

    div.onclick = () => {
      searchInput.value = d.name;
      suggestions.innerHTML = "";
      renderTable(d.name);
    };

    suggestions.appendChild(div);
  });

  renderTable(value);
});

// CLOSE DROPDOWN
document.addEventListener("click", e => {
  if(!e.target.closest(".search")){
    suggestions.innerHTML = "";
  }
});

</script>

</body>
</html>
