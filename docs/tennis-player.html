<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
"Segoe UI",Roboto,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

/* NAV */
.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
}

/* HERO */
.hero{
position:relative;
height:220px;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.6);
}

.hero h1{
position:relative;
z-index:2;
font-size:36px;
margin:0;
}

/* WRAP */
.wrap{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

/* STATS */
.stats{
display:flex;
gap:20px;
margin-bottom:20px;
}

.stat{
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
flex:1;
text-align:center;
}

.stat h2{
margin:0;
font-size:28px;
}

.stat p{
margin:5px 0 0;
color:#666;
}

/* FILTER */
.filter-bar{
margin-bottom:20px;
display:flex;
justify-content:flex-end;
}

select{
padding:10px 14px;
border-radius:10px;
border:1px solid #ccc;
font-size:14px;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

th{
background:#111;
color:#fff;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

td:first-child{
text-align:left;
}

.win{
color:#0a7f2e;
font-weight:700;
}

.loss{
color:#c62828;
font-weight:700;
}

tbody tr:nth-child(even){
background:#f2f6ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html">Tennis</a>
<a href="tennis-players.html">Players</a>
</div>

<div class="hero">
<img src="/images/tennis-hero.jpg">
<h1 id="playerName"></h1>
</div>

<div class="wrap">

<div class="stats">
<div class="stat"><h2 id="matches">0</h2><p>Matches</p></div>
<div class="stat"><h2 id="wins">0</h2><p>Wins</p></div>
<div class="stat"><h2 id="losses">0</h2><p>Losses</p></div>
</div>

<!-- ✅ TOURNAMENT FILTER -->
<div class="filter-bar">
<select id="tournamentFilter">
<option value="ALL">All Tournaments</option>
</select>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Tournament</th>
<th>Round</th>
<th>Opponent</th>
<th>Score</th>
<th>Result</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const player = decodeURIComponent(params.get("player") || "");

document.getElementById("playerName").textContent = player;

let matches = [];
let filteredMatches = [];

// LOAD DATA
async function loadData(){

  const years = [];
  for(let y=2026; y>=1968; y--){
    years.push(y);
  }

  const requests = years.map(y =>
    fetch(`/data/tennis/seasons/${y}.json`)
      .then(res => res.ok ? res.json() : null)
      .catch(()=>null)
  );

  const results = await Promise.all(requests);

  results.forEach(data => {

    if(!data) return;

    const games = Array.isArray(data) ? data : (data.matches || []);

    games.forEach(g=>{

      if(g.player1 === player || g.player2 === player){

        const opponent =
          g.player1 === player ? g.player2 : g.player1;

        const result =
          g.winner === player ? "W" : "L";

        matches.push({
          date:g.date,
          tournament:g.tournament,
          round:g.round,
          opponent,
          score:g.score,
          result
        });

      }

    });

  });

  buildTournamentFilter();
  applyFilter();

}

// BUILD TOURNAMENT DROPDOWN
function buildTournamentFilter(){

  const select = document.getElementById("tournamentFilter");

  const tournaments = [...new Set(matches.map(m=>m.tournament).filter(Boolean))].sort();

  tournaments.forEach(t=>{
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    select.appendChild(opt);
  });

  select.addEventListener("change", applyFilter);

}

// APPLY FILTER
function applyFilter(){

  const selected = document.getElementById("tournamentFilter").value;

  if(selected === "ALL"){
    filteredMatches = [...matches];
  } else {
    filteredMatches = matches.filter(m=>m.tournament === selected);
  }

  build();

}

// BUILD TABLE + STATS
function build(){

  filteredMatches.sort((a,b)=> new Date(b.date) - new Date(a.date));

  let wins = filteredMatches.filter(m=>m.result==="W").length;
  let losses = filteredMatches.length - wins;

  document.getElementById("matches").textContent = filteredMatches.length;
  document.getElementById("wins").textContent = wins;
  document.getElementById("losses").textContent = losses;

  const tbody = document.getElementById("table");
  tbody.innerHTML = "";

  const rows = filteredMatches.map(m=>{

    const date = m.date ? new Date(m.date).toLocaleDateString() : "";

    return `
      <tr>
        <td>${date}</td>
        <td>${m.tournament}</td>
        <td>${m.round}</td>
        <td>${m.opponent}</td>
        <td>${m.score || ""}</td>
        <td class="${m.result==="W"?"win":"loss"}">${m.result}</td>
      </tr>
    `;

  }).join("");

  tbody.innerHTML = rows;

}

loadData();

</script>

</body>
</html>
