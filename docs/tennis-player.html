<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
"Segoe UI",Roboto,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

/* NAV */
.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
}

/* HERO */
.hero{
position:relative;
height:220px;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.6);
}

.hero h1{
position:relative;
z-index:2;
font-size:36px;
margin:0;
}

/* WRAP */
.wrap{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

/* SEARCH */
.search-box{
margin-bottom:20px;
position:relative;
}

.search-box input{
width:100%;
padding:12px 14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.suggestions{
position:absolute;
top:100%;
left:0;
right:0;
background:#fff;
border-radius:10px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
max-height:250px;
overflow-y:auto;
z-index:10;
}

.suggestions div{
padding:10px;
cursor:pointer;
}

.suggestions div:hover{
background:#f2f6ff;
}

/* STATS */
.stats{
display:flex;
gap:20px;
margin-bottom:20px;
}

.stat{
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
flex:1;
text-align:center;
}

.stat h2{
margin:0;
font-size:28px;
}

.stat p{
margin:5px 0 0;
color:#666;
}

/* SLAMS */
.slams{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:25px;
}

.slam{
background:#fff;
padding:18px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
text-align:center;
}

.slam.win{
background:#e8f5e9;
border:2px solid #2e7d32;
}

/* FILTER */
.filter-bar{
margin-bottom:20px;
display:flex;
justify-content:flex-end;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

th{
background:#111;
color:#fff;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

td:first-child{ text-align:left; }

.win{ color:#0a7f2e; font-weight:700; }
.loss{ color:#c62828; font-weight:700; }

tbody tr:nth-child(even){ background:#f2f6ff; }

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html">Tennis</a>
<a href="tennis-players.html">Players</a>
</div>

<div class="hero">
<img src="/images/tennis-hero.jpg">
<h1 id="playerName"></h1>
</div>

<div class="wrap">

<!-- 🔥 SEARCH -->
<div class="search-box">
<input type="text" id="playerSearch" placeholder="Search player...">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="stats">
<div class="stat"><h2 id="matches">0</h2><p>Matches</p></div>
<div class="stat"><h2 id="wins">0</h2><p>Wins</p></div>
<div class="stat"><h2 id="losses">0</h2><p>Losses</p></div>
</div>

<div class="slams" id="slamsBox"></div>

<div class="filter-bar">
<select id="tournamentFilter">
<option value="ALL">All Tournaments</option>
</select>
</div>

<table>
<thead>
<tr>
<th>Date</th><th>Tournament</th><th>Round</th><th>Opponent</th><th>Score</th><th>Result</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const player = decodeURIComponent(params.get("player") || "");
document.getElementById("playerName").textContent = player;

let players = [];
let matches = [];
let filteredMatches = [];

const SLAM_MAP = {
  "Australian Open": ["Australian Open"],
  "French Open": ["French Open", "Roland Garros"],
  "Wimbledon": ["Wimbledon"],
  "US Open": ["US Open"]
};

// 🔥 LOAD PLAYER LIST
fetch("/data/tennis/players.json")
.then(res=>res.json())
.then(data=> players = data)
.catch(()=> players = []);

// 🔥 SEARCH LOGIC
const input = document.getElementById("playerSearch");
const suggestions = document.getElementById("suggestions");

input.addEventListener("input", ()=>{

  const val = input.value.toLowerCase();
  suggestions.innerHTML = "";

  if(!val) return;

  const filtered = players.filter(p=> p.toLowerCase().includes(val)).slice(0,10);

  filtered.forEach(p=>{
    const div = document.createElement("div");
    div.textContent = p;

    div.onclick = ()=>{
      window.location.href = `tennis-player.html?player=${encodeURIComponent(p)}`;
    };

    suggestions.appendChild(div);
  });

});

// LOAD DATA
async function loadData(){

  const years = [];
  for(let y=2026; y>=1968; y--) years.push(y);

  const results = await Promise.all(
    years.map(y =>
      fetch(`/data/tennis/seasons/${y}.json`)
      .then(res => res.ok ? res.json() : null)
      .catch(()=>null)
    )
  );

  results.forEach(data=>{
    if(!data) return;

    const games = Array.isArray(data) ? data : (data.matches || []);

    games.forEach(g=>{
      if(g.player1 === player || g.player2 === player){

        const opponent = g.player1 === player ? g.player2 : g.player1;
        const result = g.winner === player ? "W" : "L";

        matches.push({
          date:g.date,
          tournament:g.tournament,
          round:g.round,
          opponent,
          score:g.score,
          result
        });
      }
    });
  });

  buildSlams();
  buildTournamentFilter();
  applyFilter();
}

// SLAMS
function buildSlams(){

  const counts = {
    "Australian Open":0,
    "French Open":0,
    "Wimbledon":0,
    "US Open":0
  };

  matches.forEach(m=>{

    if(m.result !== "W") return;

    const round = (m.round || "").toLowerCase();
    if(!round.includes("final") && round !== "f") return;

    Object.keys(SLAM_MAP).forEach(slam=>{
      if(SLAM_MAP[slam].includes(m.tournament)){
        counts[slam]++;
      }
    });

  });

  document.getElementById("slamsBox").innerHTML =
    Object.keys(counts).map(s=>`
      <div class="slam ${counts[s] ? "win":""}">
        <h3>${s}</h3>
        <p>${counts[s]}</p>
      </div>
    `).join("");
}

// FILTER
function buildTournamentFilter(){
  const select = document.getElementById("tournamentFilter");

  [...new Set(matches.map(m=>m.tournament))].sort().forEach(t=>{
    const o = document.createElement("option");
    o.value=t; o.textContent=t;
    select.appendChild(o);
  });

  select.onchange = applyFilter;
}

function applyFilter(){
  const val = document.getElementById("tournamentFilter").value;
  filteredMatches = val==="ALL" ? matches : matches.filter(m=>m.tournament===val);
  build();
}

// TABLE
function build(){

  filteredMatches.sort((a,b)=> new Date(b.date)-new Date(a.date));

  document.getElementById("matches").textContent = filteredMatches.length;
  document.getElementById("wins").textContent = filteredMatches.filter(m=>m.result==="W").length;
  document.getElementById("losses").textContent = filteredMatches.filter(m=>m.result==="L").length;

  document.getElementById("table").innerHTML =
    filteredMatches.map(m=>`
      <tr>
        <td>${m.date||""}</td>
        <td>${m.tournament}</td>
        <td>${m.round}</td>
        <td>${m.opponent}</td>
        <td>${m.score||""}</td>
        <td class="${m.result==="W"?"win":"loss"}">${m.result}</td>
      </tr>
    `).join("");
}

loadData();

</script>

</body>
</html>
