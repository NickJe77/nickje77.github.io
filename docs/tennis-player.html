<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
font-family:var(--body);
margin:0;
background:var(--bg);
color:var(--ink);
-webkit-font-smoothing:antialiased;
}

/* NAV */
.navbar{
display:flex;
justify-content:center;
gap:20px;
padding:15px;
border-bottom:1px solid var(--line);
background:var(--surface);
font-weight:600;
font-size:13.5px;
flex-wrap:wrap;
}

.navbar a{
color:var(--ink);
text-decoration:none;
opacity:.7;
transition:opacity .15s,color .15s;
}
.navbar a:hover{opacity:1;color:var(--accent);}

/* HERO */
.hero{
position:relative;
height:200px;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
}

.hero img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(160deg,rgba(12,19,15,.75),rgba(12,19,15,.88));
}

.hero h1{
position:relative;
z-index:2;
font-family:var(--display);
font-weight:600;
font-size:clamp(26px,5vw,38px);
letter-spacing:.01em;
text-transform:uppercase;
margin:0;
}

/* WRAP */
.wrap{
max-width:1100px;
margin:auto;
padding:26px 20px 70px;
}

/* SEARCH */
.search-box{
margin-bottom:22px;
position:relative;
}

.search-box input{
width:100%;
padding:12px 18px;
border-radius:999px;
border:1px solid var(--line);
background:var(--surface);
font-family:var(--body);
font-size:14px;
font-weight:600;
color:var(--ink);
box-sizing:border-box;
}
.search-box input:hover{border-color:var(--faint);}
.search-box input:focus{outline:none;border-color:var(--accent);}

.suggestions{
position:absolute;
top:100%;
left:0;
right:0;
background:var(--surface);
border-radius:14px;
margin-top:8px;
box-shadow:0 14px 30px -12px rgba(10,16,24,.4);
max-height:250px;
overflow-y:auto;
z-index:10;
}

.suggestions div{
padding:12px 16px;
cursor:pointer;
font-weight:600;
font-size:13.5px;
border-bottom:1px solid var(--line);
}
.suggestions div:last-child{border-bottom:none;}

.suggestions div:hover{
background:var(--accent-soft);
}

/* STATS */
.stats{
display:flex;
gap:14px;
margin-bottom:20px;
}

.stat{
background:var(--surface);
border:1px solid var(--line);
padding:18px;
border-radius:var(--radius);
flex:1;
text-align:center;
}

.stat h2{
margin:0;
font-family:var(--display);
font-weight:600;
font-size:26px;
color:var(--ink);
}

.stat p{
margin:6px 0 0;
color:var(--muted);
font-size:12px;
font-weight:600;
text-transform:uppercase;
letter-spacing:.04em;
}

/* SLAMS */
.slams{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-bottom:22px;
}

.slam{
background:var(--surface);
border:1px solid var(--line);
padding:16px;
border-radius:var(--radius);
text-align:center;
}

.slam h3{
margin:0;
font-family:var(--body);
font-size:11px;
font-weight:600;
color:var(--muted);
text-transform:uppercase;
letter-spacing:.03em;
}

.slam p{
margin:8px 0 0;
font-family:var(--display);
font-size:22px;
font-weight:600;
color:var(--ink);
}

.slam.win{
background:var(--accent-soft);
border:1px solid var(--accent);
}

/* FILTER */
.filter-bar{
margin-bottom:16px;
display:flex;
justify-content:flex-end;
}

select{
padding:10px 16px;
border-radius:999px;
border:1px solid var(--line);
background:var(--surface);
font-family:var(--body);
font-size:13.5px;
font-weight:600;
color:var(--ink);
cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);}

table{
width:100%;
border-collapse:collapse;
background:var(--surface);
}

th{
background:#f7f9fb;
color:var(--muted);
padding:11px 14px;
font-size:11px;
font-weight:600;
text-transform:uppercase;
letter-spacing:.04em;
font-family:var(--body);
border-bottom:1px solid var(--line);
text-align:left;
}

td{
padding:11px 14px;
border-bottom:1px solid var(--line);
text-align:center;
font-size:13.5px;
color:#27313c;
}

td:first-child{ text-align:left; }

.win{ color:#1e7a3d; font-weight:700; }
.loss{ color:#c0362c; font-weight:700; }

tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}

@media(max-width:700px){
.slams{grid-template-columns:repeat(2,1fr);}
.stats{flex-wrap:wrap;}
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
<a href="nba.html">NBA</a>
<a href="nhl.html">NHL</a>
<a href="ufc.html">UFC</a>
<a href="nfl.html">NFL</a>
<a href="tennis.html">Tennis</a>
<a href="tennis-players.html">Players</a>
</div>

<div class="hero">
<img src="/images/tennis-hero.jpg">
<h1 id="playerName"></h1>
</div>

<div class="wrap">

<!-- SEARCH -->
<div class="search-box">
<input type="text" id="playerSearch" placeholder="Search player...">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="stats">
<div class="stat"><h2 id="matches">0</h2><p>Matches</p></div>
<div class="stat"><h2 id="wins">0</h2><p>Wins</p></div>
<div class="stat"><h2 id="losses">0</h2><p>Losses</p></div>
</div>

<div class="slams" id="slamsBox"></div>

<div class="filter-bar">
<select id="tournamentFilter">
<option value="ALL">All Tournaments</option>
</select>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Date</th><th>Tournament</th><th>Round</th><th>Opponent</th><th>Score</th><th>Result</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const player = decodeURIComponent(params.get("player") || "");
document.getElementById("playerName").textContent = player;

let players = [];
let matches = [];
let filteredMatches = [];

const SLAM_MAP = {
  "Australian Open": ["Australian Open"],
  "French Open": ["French Open", "Roland Garros"],
  "Wimbledon": ["Wimbledon"],
  "US Open": ["US Open"]
};

// LOAD PLAYERS
fetch("/data/tennis/players.json")
.then(res=>res.json())
.then(data=> players = data)
.catch(()=> players = []);

// SEARCH
const input = document.getElementById("playerSearch");
const suggestions = document.getElementById("suggestions");

input.addEventListener("input", ()=>{
  const val = input.value.toLowerCase();
  suggestions.innerHTML = "";

  if(!val) return;

  players
    .filter(p=> p.toLowerCase().includes(val))
    .slice(0,10)
    .forEach(p=>{
      const div = document.createElement("div");
      div.textContent = p;
      div.onclick = ()=> window.location.href = `tennis-player.html?player=${encodeURIComponent(p)}`;
      suggestions.appendChild(div);
    });
});

// LOAD DATA
async function loadData(){

  const years = [];
  for(let y=2026; y>=1968; y--) years.push(y);

  const results = await Promise.all(
    years.map(y =>
      fetch(`/data/tennis/seasons/${y}.json`)
      .then(res => res.ok ? res.json() : null)
      .catch(()=>null)
    )
  );

  results.forEach(data=>{
    if(!data) return;

    const games = Array.isArray(data) ? data : (data.matches || []);

    games.forEach(g=>{

      // 🚫 REMOVE DAVIS CUP
      const tournament = (g.tournament || "").toLowerCase();
      if(tournament.includes("davis cup")) return;

      if(g.player1 === player || g.player2 === player){

        const opponent = g.player1 === player ? g.player2 : g.player1;
        const result = g.winner === player ? "W" : "L";

        matches.push({
          date:g.date,
          tournament:g.tournament,
          round:g.round,
          opponent,
          score:g.score,
          result
        });

      }
    });
  });

  buildSlams();
  buildTournamentFilter();
  applyFilter();
}

// SLAMS
function buildSlams(){

  const counts = {
    "Australian Open":0,
    "French Open":0,
    "Wimbledon":0,
    "US Open":0
  };

  matches.forEach(m=>{
    if(m.result !== "W") return;

    const round = (m.round || "").toLowerCase();
    if(!round.includes("final") && round !== "f") return;

    Object.keys(SLAM_MAP).forEach(slam=>{
      if(SLAM_MAP[slam].includes(m.tournament)){
        counts[slam]++;
      }
    });
  });

  document.getElementById("slamsBox").innerHTML =
    Object.keys(counts).map(s=>`
      <div class="slam ${counts[s] ? "win":""}">
        <h3>${s}</h3>
        <p>${counts[s]}</p>
      </div>
    `).join("");
}

// FILTER
function buildTournamentFilter(){
  const select = document.getElementById("tournamentFilter");

  [...new Set(matches.map(m=>m.tournament))].sort().forEach(t=>{
    const o = document.createElement("option");
    o.value=t; o.textContent=t;
    select.appendChild(o);
  });

  select.onchange = applyFilter;
}

function applyFilter(){
  const val = document.getElementById("tournamentFilter").value;
  filteredMatches = val==="ALL" ? matches : matches.filter(m=>m.tournament===val);
  build();
}

// TABLE
function build(){

  filteredMatches.sort((a,b)=> new Date(b.date)-new Date(a.date));

  document.getElementById("matches").textContent = filteredMatches.length;
  document.getElementById("wins").textContent = filteredMatches.filter(m=>m.result==="W").length;
  document.getElementById("losses").textContent = filteredMatches.filter(m=>m.result==="L").length;

  document.getElementById("table").innerHTML =
    filteredMatches.map(m=>`
      <tr>
        <td>${m.date||""}</td>
        <td>${m.tournament}</td>
        <td>${m.round}</td>
        <td>${m.opponent}</td>
        <td>${m.score||""}</td>
        <td class="${m.result==="W"?"win":"loss"}">${m.result}</td>
      </tr>
    `).join("");
}

loadData();

</script>

</body>
</html>
