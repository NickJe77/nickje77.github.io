<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: system-ui, Arial, sans-serif;
  margin:0;
  background:#f5f5f5;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:white;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

h1{text-align:center;}

.controls{
  text-align:center;
  margin:20px 0;
}

select{
  padding:8px;
  margin:0 5px;
}

.summary{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  min-width:120px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.section{
  margin-top:30px;
}

.section h2{
  text-align:center;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th, td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{background:#fafafa;}

tr:hover{background:#f0f8ff;}

a.player-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="tennis.html">Tennis</a>
</div>

<div class="container">

<h1 id="playerName">Player</h1>

<div class="controls">
  <select id="surfaceFilter">
    <option value="">All Surfaces</option>
    <option>Hard</option>
    <option>Clay</option>
    <option>Grass</option>
  </select>

  <select id="yearFilter">
    <option value="">All Years</option>
  </select>
</div>

<!-- SUMMARY -->
<div class="summary">
  <div class="card"><h3>Matches</h3><div id="matches">0</div></div>
  <div class="card"><h3>Wins</h3><div id="wins">0</div></div>
  <div class="card"><h3>Losses</h3><div id="losses">0</div></div>
  <div class="card"><h3>Win %</h3><div id="winpct">0%</div></div>
  <div class="card"><h3>Titles</h3><div id="titles">0</div></div>
</div>

<!-- SURFACE BREAKDOWN -->
<div class="section">
  <h2>Surface Breakdown</h2>
  <div class="summary" id="surfaceBreakdown"></div>
</div>

<!-- HEAD TO HEAD -->
<div class="section">
  <h2>Top Opponents</h2>
  <table>
    <thead>
      <tr>
        <th>Opponent</th>
        <th>Matches</th>
        <th>Wins</th>
        <th>Losses</th>
      </tr>
    </thead>
    <tbody id="h2hTable"></tbody>
  </table>
</div>

<!-- MATCHES -->
<div class="section">
  <h2>Match Log</h2>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Tournament</th>
        <th>Surface</th>
        <th>Round</th>
        <th>Opponent</th>
        <th>Result</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

</div>

<script>

function getParam(name){
  return new URL(window.location.href).searchParams.get(name);
}

function slug(name){
  return name.toLowerCase().replace(/ /g,"-");
}

const playerName = getParam("player");
document.getElementById("playerName").textContent = playerName;

fetch(`data/tennis/players/${slug(playerName)}.json`)
.then(r=>r.json())
.then(data=>{

  const matches = data.matches;

  // year dropdown
  const years = [...new Set(matches.map(m=>m.date?.slice(0,4)))].filter(Boolean);
  const yearSelect = document.getElementById("yearFilter");

  years.sort().forEach(y=>{
    const o = document.createElement("option");
    o.textContent = y;
    yearSelect.appendChild(o);
  });

  function render(){

    const surface = document.getElementById("surfaceFilter").value;
    const year = document.getElementById("yearFilter").value;

    let filtered = matches;

    if(surface) filtered = filtered.filter(m=>m.surface===surface);
    if(year) filtered = filtered.filter(m=>m.date?.startsWith(year));

    let wins = 0, losses = 0, titles = 0;
    const surfaceStats = {};
    const h2h = {};

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    filtered.forEach(m=>{

      const isWin = m.player1 === playerName;
      const opponent = isWin ? m.player2 : m.player1;

      if(isWin) wins++; else losses++;

      // titles
      if(isWin && m.round === "F") titles++;

      // surface stats
      if(!surfaceStats[m.surface]) surfaceStats[m.surface] = {w:0,l:0};
      if(isWin) surfaceStats[m.surface].w++;
      else surfaceStats[m.surface].l++;

      // head to head
      if(!h2h[opponent]) h2h[opponent] = {w:0,l:0};
      if(isWin) h2h[opponent].w++;
      else h2h[opponent].l++;

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${m.date || ""}</td>
        <td>${m.tournament}</td>
        <td>${m.surface}</td>
        <td>${m.round}</td>
        <td><a class="player-link" href="tennis-player.html?player=${opponent}">${opponent}</a></td>
        <td>${isWin ? "W" : "L"}</td>
        <td>${m.score}</td>
      `;

      tbody.appendChild(tr);
    });

    // summary
    document.getElementById("matches").textContent = filtered.length;
    document.getElementById("wins").textContent = wins;
    document.getElementById("losses").textContent = losses;
    document.getElementById("titles").textContent = titles;

    const pct = filtered.length ? ((wins/filtered.length)*100).toFixed(1) : 0;
    document.getElementById("winpct").textContent = pct + "%";

    // surface breakdown
    const sb = document.getElementById("surfaceBreakdown");
    sb.innerHTML = "";

    Object.entries(surfaceStats).forEach(([surf,val])=>{
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h3>${surf}</h3>
        <div>${val.w}-${val.l}</div>
      `;
      sb.appendChild(card);
    });

    // head to head table (top 10)
    const h2hArr = Object.entries(h2h)
      .map(([name,val])=>({name,...val,total:val.w+val.l}))
      .sort((a,b)=>b.total-a.total)
      .slice(0,10);

    const h2hTable = document.getElementById("h2hTable");
    h2hTable.innerHTML = "";

    h2hArr.forEach(o=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><a class="player-link" href="tennis-player.html?player=${o.name}">${o.name}</a></td>
        <td>${o.total}</td>
        <td>${o.w}</td>
        <td>${o.l}</td>
      `;
      h2hTable.appendChild(tr);
    });

  }

  render();

  document.getElementById("surfaceFilter").onchange = render;
  document.getElementById("yearFilter").onchange = render;

});

</script>

</body>
</html>
