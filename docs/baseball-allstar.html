<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>MLB All-Star Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --al:#002d72;
  --nl:#c8102e;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:44px 20px;text-align:center;border-radius:var(--radius);margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4.5vw,40px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.page{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.year-select{
  padding:10px 16px;font-size:13.5px;border-radius:999px;border:1px solid var(--line);
  font-family:var(--body);font-weight:600;margin-bottom:22px;background:var(--surface);color:var(--ink);
  cursor:pointer;
}
.year-select:hover{border-color:var(--faint);}

.game-card{
  background:var(--surface);padding:22px;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:26px;
}
.game-card > div:first-child{
  font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);
}
.scoreline{
  font-family:var(--display);font-size:26px;font-weight:600;margin:12px 0 6px;color:var(--ink);
}
.meta{font-size:13px;color:var(--muted);}

.section-title{
  font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.02em;text-transform:uppercase;
  margin:26px 0 12px;color:var(--ink);display:flex;align-items:center;gap:8px;
}
.section-title.al::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--al);display:inline-block;}
.section-title.nl::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--nl);display:inline-block;}

.player-table{
  width:100%;border-collapse:collapse;margin-bottom:26px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
}
.player-table th{
  text-align:left;padding:10px 12px;background:#f7f9fb;border-bottom:1px solid var(--line);
  font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
}
.player-table td{
  padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;color:#27313c;
}
.player-table tr:last-child td{border-bottom:none;}
.player-table tr:hover td{background:#f0f6ff;}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-world-series.html">World Series</a>
</nav>

<div class="page">
  <div class="hero">
    <div class="eyebrow">Baseball</div>
    <h1>MLB All-Star Game</h1>
  </div>

  <select id="yearSelect" class="year-select"></select>
  <div id="content"></div>
</div>

<script>

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

(async function(){

  const yearSelect = document.getElementById("yearSelect");
  const content = document.getElementById("content");

  const allStarData = await fetchJSON("/data/baseball/allstar.json");
  if(!allStarData) return;

  const years = allStarData.map(g=>g.year).sort((a,b)=>b-a);

  years.forEach(y=>{
    const opt=document.createElement("option");
    opt.value=y;
    opt.textContent=y;
    yearSelect.appendChild(opt);
  });

  yearSelect.value = years[0];

  function leagueName(code){
    if(code==="AL") return "American League";
    if(code==="NL") return "National League";
    return code;
  }

  function getBatters(box, type){
    // Try every possible naming pattern
    const possibilities = [
      box[`batters_${type}`],
      box[`batters${type.charAt(0).toUpperCase()+type.slice(1)}`],
      box[`${type}_batters`],
      box[`${type}Batters`]
    ];

    for(let p of possibilities){
      if(Array.isArray(p)) return p;
    }

    return [];
  }

  function buildTable(players){
    let rows="";
    if(players.length){
      rows = players.map(p=>`
        <tr>
          <td>${p.name || ""}</td>
          <td>${p.AB ?? 0}</td>
          <td>${p.R ?? 0}</td>
          <td>${p.H ?? 0}</td>
          <td>${p.RBI ?? 0}</td>
        </tr>
      `).join("");
    } else {
      rows = `
        <tr>
          <td colspan="5" style="text-align:center;color:#888;">
            No batting data available
          </td>
        </tr>
      `;
    }

    return `
      <table class="player-table">
        <thead>
          <tr>
            <th>Player</th>
            <th>AB</th>
            <th>R</th>
            <th>H</th>
            <th>RBI</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    `;
  }

  async function renderYear(year){

    content.innerHTML="Loading...";

    const summary = allStarData.find(g=>g.year==year);
    const box = await fetchJSON(`/data/baseball/games/${year}/AS${year}.json`);

    if(!summary || !box){
      content.innerHTML="<p>No data available.</p>";
      return;
    }

    const homeLeague = summary.home_code;
    const awayLeague = summary.away_code;

    const homeName = leagueName(homeLeague);
    const awayName = leagueName(awayLeague);

    let AL_batters=[], NL_batters=[];

    if(homeLeague==="AL"){
      AL_batters = getBatters(box,"home");
      NL_batters = getBatters(box,"away");
    } else {
      AL_batters = getBatters(box,"away");
      NL_batters = getBatters(box,"home");
    }

    let html = `
      <div class="game-card">
        <div><strong>${year} All-Star Game</strong></div>
        <div class="scoreline">
          ${awayName} ${summary.away_score ?? "–"} –
          ${homeName} ${summary.home_score ?? "–"}
        </div>
      </div>
    `;

    html += `<div class="section-title al">American League Batters</div>`;
    html += buildTable(AL_batters);

    html += `<div class="section-title nl">National League Batters</div>`;
    html += buildTable(NL_batters);

    content.innerHTML = html;
  }

  renderYear(years[0]);

  yearSelect.addEventListener("change",()=>{
    renderYear(yearSelect.value);
  });

})();
</script>

</body>
</html>
