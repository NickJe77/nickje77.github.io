<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>MLB All-Star Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --line:#e6e8ee;
}
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.page{
  max-width:1100px;
  margin:auto;
  padding:30px;
}
.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:25px;
}
.hero h1{margin:0;font-size:32px;}
.year-select{
  padding:10px 14px;
  font-size:16px;
  border-radius:10px;
  border:1px solid var(--line);
  font-weight:600;
  margin-bottom:20px;
}
.game-card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  border:1px solid var(--line);
  margin-bottom:30px;
}
.scoreline{
  font-size:22px;
  font-weight:700;
  margin:10px 0;
}
.meta{
  font-size:14px;
  color:#555;
}
.section-title{
  font-size:20px;
  font-weight:700;
  margin:25px 0 10px;
}
.player-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:30px;
}
.player-table th{
  text-align:left;
  padding:8px;
  background:#f0f2f5;
  border-bottom:2px solid var(--line);
  font-size:14px;
}
.player-table td{
  padding:8px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}
.player-table tr:hover{
  background:#f9fbff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-world-series.html">World Series</a>
</div>

<div class="page">
  <div class="hero">
    <h1>MLB All-Star Game</h1>
  </div>

  <select id="yearSelect" class="year-select"></select>
  <div id="content"></div>
</div>

<script>

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

(async function(){

  const yearSelect = document.getElementById("yearSelect");
  const content = document.getElementById("content");

  const allStarData = await fetchJSON("/data/baseball/allstar.json");
  if(!allStarData) return;

  const years = allStarData.map(g=>g.year).sort((a,b)=>b-a);

  years.forEach(y=>{
    const opt=document.createElement("option");
    opt.value=y;
    opt.textContent=y;
    yearSelect.appendChild(opt);
  });

  yearSelect.value = years[0];

  function leagueName(code){
    if(code==="AL") return "American League";
    if(code==="NL") return "National League";
    return code;
  }

  function getBatters(box, type){
    // Try every possible naming pattern
    const possibilities = [
      box[`batters_${type}`],
      box[`batters${type.charAt(0).toUpperCase()+type.slice(1)}`],
      box[`${type}_batters`],
      box[`${type}Batters`]
    ];

    for(let p of possibilities){
      if(Array.isArray(p)) return p;
    }

    return [];
  }

  function buildTable(players){
    let rows="";
    if(players.length){
      rows = players.map(p=>`
        <tr>
          <td>${p.name || ""}</td>
          <td>${p.AB ?? 0}</td>
          <td>${p.R ?? 0}</td>
          <td>${p.H ?? 0}</td>
          <td>${p.RBI ?? 0}</td>
        </tr>
      `).join("");
    } else {
      rows = `
        <tr>
          <td colspan="5" style="text-align:center;color:#888;">
            No batting data available
          </td>
        </tr>
      `;
    }

    return `
      <table class="player-table">
        <thead>
          <tr>
            <th>Player</th>
            <th>AB</th>
            <th>R</th>
            <th>H</th>
            <th>RBI</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    `;
  }

  async function renderYear(year){

    content.innerHTML="Loading...";

    const summary = allStarData.find(g=>g.year==year);
    const box = await fetchJSON(`/data/baseball/games/${year}/AS${year}.json`);

    if(!summary || !box){
      content.innerHTML="<p>No data available.</p>";
      return;
    }

    const homeLeague = summary.home_code;
    const awayLeague = summary.away_code;

    const homeName = leagueName(homeLeague);
    const awayName = leagueName(awayLeague);

    let AL_batters=[], NL_batters=[];

    if(homeLeague==="AL"){
      AL_batters = getBatters(box,"home");
      NL_batters = getBatters(box,"away");
    } else {
      AL_batters = getBatters(box,"away");
      NL_batters = getBatters(box,"home");
    }

    let html = `
      <div class="game-card">
        <div><strong>${year} All-Star Game</strong></div>
        <div class="scoreline">
          ${awayName} ${summary.away_score ?? "–"} –
          ${homeName} ${summary.home_score ?? "–"}
        </div>
      </div>
    `;

    html += `<div class="section-title">American League Batters</div>`;
    html += buildTable(AL_batters);

    html += `<div class="section-title">National League Batters</div>`;
    html += buildTable(NL_batters);

    content.innerHTML = html;
  }

  renderYear(years[0]);

  yearSelect.addEventListener("change",()=>{
    renderYear(yearSelect.value);
  });

})();
</script>

</body>
</html>
