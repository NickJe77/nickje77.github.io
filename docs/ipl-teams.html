<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:30px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:16px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:12px 14px;
  text-align:left;
}
th{
  background:#f3f6fb;
}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff; cursor:pointer;}

.team-name{
  font-weight:600;
  color:#3b007a;
}
.titles{
  font-weight:600;
  color:#1a7f37;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>Indian Premier League Teams</h1>
  <p>All IPL teams and championship wins.</p>
</div>

<table>
<thead>
<tr>
  <th>Team</th>
  <th>Championships</th>
  <th>Years Won</th>
</tr>
</thead>
<tbody id="teamsTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const tableBody = document.getElementById("teamsTable");

let teamTitles = {};
let teamYears = {};

function normaliseTeam(name){
  const map = {
    "Rising Challengers": "Rising Pune Supergiant",
    "Rising Pune Supergiants": "Rising Pune Supergiant",
    "Royal Challengers": "Royal Challengers Bangalore",
    "Royal Challengers Bengaluru": "Royal Challengers Bangalore",
    "Delhi Daredevils": "Delhi Capitals",
    "Kings XI Punjab": "Punjab Kings",
    "Deccan Chargers": "Sunrisers Hyderabad"
  };
  return map[name] || name;
}

fetch(indexUrl)
  .then(r=>r.json())
  .then(files=>{
    return Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json())));
  })
  .then(seasons=>{
    seasons.forEach(matches=>{
      if(!matches.length) return;

      matches.sort((a,b)=>new Date(b.date)-new Date(a.date));
      const finalMatch = matches[0];
      let winner = finalMatch?.outcome?.winner;

      if(winner){
        winner = normaliseTeam(winner);
        teamTitles[winner] = (teamTitles[winner]||0)+1;
        teamYears[winner] = teamYears[winner] || [];
        teamYears[winner].push(finalMatch.date.slice(0,4));
      }

      matches.forEach(m=>{
        m.teams?.forEach(t=>{
          const team = normaliseTeam(t);
          if(!(team in teamTitles)){
            teamTitles[team] = teamTitles[team] || 0;
            teamYears[team] = teamYears[team] || [];
          }
        });
      });
    });

    const teams = Object.keys(teamTitles).sort((a,b)=>{
      if(teamTitles[b] !== teamTitles[a]){
        return teamTitles[b] - teamTitles[a];
      }
      return a.localeCompare(b);
    });

    teams.forEach(team=>{
      const tr = document.createElement("tr");
      tr.onclick = ()=>location.href = "ipl-team.html?team=" + encodeURIComponent(team);
      tr.innerHTML = `
        <td class="team-name">${team}</td>
        <td class="titles">${teamTitles[team]}</td>
        <td>${teamYears[team].join(", ") || "—"}</td>
      `;
      tableBody.appendChild(tr);
    });
  });
</script>

</body>
</html>
