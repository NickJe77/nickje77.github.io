<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Indian Premier League Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:26px 20px 70px;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:32px 34px;
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.eyebrow{
  display:block;
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(28px,5vw,40px);
  letter-spacing:.01em;
  text-transform:uppercase;
}
.hero p{
  margin-top:10px;
  font-size:14px;
  color:rgba(255,255,255,.75);
  font-weight:600;
}

/* ── Table ────────────────────────────────────────────── */
table{
  width:100%;
  border-collapse:collapse;
  font-size:13.5px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}
th,td{
  border-bottom:1px solid var(--line);
  padding:11px 14px;
  text-align:left;
}
th{
  background:#f7f9fb;
  color:var(--muted);
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
}
td{
  color:#27313c;
  font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f0f6ff;}

.team-link{
  color:var(--ink);
  font-weight:700;
  text-decoration:none;
}
.team-link:hover{color:var(--accent);}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <span class="eyebrow">Cricket</span>
  <h1>Indian Premier League Teams</h1>
  <p>All IPL teams, championships and win records.</p>
</div>

<table>
<thead>
<tr>
  <th>Team</th>
  <th>Titles</th>
  <th>Years Won</th>
  <th>Wins</th>
  <th>Losses</th>
  <th>Win %</th>
</tr>
</thead>
<tbody id="teamsTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const tableBody = document.getElementById("teamsTable");

fetch(indexUrl)
  .then(r => r.json())
  .then(files => Promise.all(files.map(f => fetch(basePath + f).then(r => r.json()))))
  .then(seasons => {

    const teams = {};

    seasons.forEach(matches => {
      if(!Array.isArray(matches)) return;

      matches.forEach(match => {
        const info = match.info;
        if(!info || !info.teams || info.teams.length < 2) return;

        const t1 = info.teams[0];
        const t2 = info.teams[1];
        const winner = info.outcome?.winner || null;

        if(!teams[t1]) teams[t1] = { wins:0, losses:0, titles:0, years:[] };
        if(!teams[t2]) teams[t2] = { wins:0, losses:0, titles:0, years:[] };

        if(winner){
          if(winner === t1){ teams[t1].wins++; teams[t2].losses++; }
          else if(winner === t2){ teams[t2].wins++; teams[t1].losses++; }
        }
      });

      const finalMatch = matches
        .filter(m => m?.info?.dates?.[0])
        .sort((a,b)=> new Date(b.info.dates[0]) - new Date(a.info.dates[0]))[0];

      if(finalMatch){
        const seasonYear = finalMatch.info.season || finalMatch.info.dates[0].slice(0,4);
        const champion = finalMatch.info.outcome?.winner || null;

        if(champion){
          if(!teams[champion]) teams[champion] = { wins:0, losses:0, titles:0, years:[] };
          teams[champion].titles++;
          if(!teams[champion].years.includes(seasonYear)){
            teams[champion].years.push(seasonYear);
          }
        }
      }
    });

    const rows = Object.entries(teams).map(([team,data])=>{
      const total = data.wins + data.losses;
      const pct = total ? ((data.wins/total)*100).toFixed(1) : "0.0";
      return { team, ...data, pct };
    });

    rows.sort((a,b)=> b.titles - a.titles || b.wins - a.wins);

    tableBody.innerHTML = "";
    rows.forEach(r=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <a class="team-link" href="ipl-team.html?team=${encodeURIComponent(r.team)}">
            ${r.team}
          </a>
        </td>
        <td>${r.titles}</td>
        <td>${r.years.join(", ")}</td>
        <td>${r.wins}</td>
        <td>${r.losses}</td>
        <td>${r.pct}%</td>
      `;
      tableBody.appendChild(tr);
    });

  });
</script>

</body>
</html>
