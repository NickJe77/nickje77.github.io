<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:30px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:16px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:12px 14px;
  text-align:left;
}
th{
  background:#f3f6fb;
}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}

.team-name{
  font-weight:600;
  color:#3b007a;
}
.team-name a{
  color:#3b007a;
  text-decoration:none;
}
.team-name a:hover{
  text-decoration:underline;
}

.titles{
  font-weight:600;
  color:#1a7f37;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1>Indian Premier League Teams</h1>
  <p>All IPL teams, championships and win records.</p>
</div>

<table>
<thead>
<tr>
  <th>Team</th>
  <th>Titles</th>
  <th>Years Won</th>
  <th>Wins</th>
  <th>Losses</th>
  <th>Win %</th>
</tr>
</thead>
<tbody id="teamsTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const tableBody = document.getElementById("teamsTable");

const teamMap = {
  "Royal Challengers": "Royal Challengers Bengaluru",
  "Royal Challengers Bangalore": "Royal Challengers Bengaluru",
  "Rising Pune Supergiants": "Rising Pune Supergiant",
  "Rising Pune Supergiant": "Rising Pune Supergiant",
  "Rising Challengers": "Rising Pune Supergiant"
};

function normalizeTeam(name){
  return teamMap[name] || name;
}

let stats = {};

function initTeam(team){
  if(!stats[team]){
    stats[team] = {
      titles: 0,
      years: [],
      wins: 0,
      losses: 0,
      games: 0
    };
  }
}

fetch(indexUrl)
  .then(r=>r.json())
  .then(files=>Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json()))))
  .then(seasons=>{
    seasons.forEach(matches=>{
      if(!matches.length) return;

      matches.sort((a,b)=>new Date(b.date)-new Date(a.date));
      const finalMatch = matches[0];
      const winner = normalizeTeam(finalMatch?.outcome?.winner || "");

      if(winner){
        initTeam(winner);
        stats[winner].titles++;
        stats[winner].years.push(finalMatch.date.slice(0,4));
      }

      matches.forEach(m=>{
        const teams = m.teams?.map(normalizeTeam) || [];
        const winner = normalizeTeam(m.outcome?.winner || "");

        teams.forEach(t=>{
          initTeam(t);
          stats[t].games++;
        });

        if(winner){
          initTeam(winner);
          stats[winner].wins++;

          teams.forEach(t=>{
            if(t !== winner){
              initTeam(t);
              stats[t].losses++;
            }
          });
        }
      });
    });

    const teams = Object.keys(stats)
      .sort((a,b)=> stats[b].titles - stats[a].titles);

    teams.forEach(team=>{
      const s = stats[team];
      const winPct = s.games ? ((s.wins / s.games) * 100).toFixed(1) : "0.0";

      const teamLink = `ipl-team.html?team=${encodeURIComponent(team)}`;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="team-name"><a href="${teamLink}">${team}</a></td>
        <td class="titles">${s.titles}</td>
        <td>${s.years.join(", ") || "—"}</td>
        <td>${s.wins}</td>
        <td>${s.losses}</td>
        <td>${winPct}%</td>
      `;
      tableBody.appendChild(tr);
    });
  });
</script>

</body>
</html>
