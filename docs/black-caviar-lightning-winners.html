<!DOCTYPE html>
<html>
<head>
<title>Black Caviar Lightning Winners</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="./css/racing.css">

<style>
body{font-family:Arial;margin:0;background:white;}

.navbar{text-align:center;padding:16px 0;border-bottom:1px solid #ddd;}
.navbar a{margin:0 18px;text-decoration:none;font-size:18px;font-weight:600;color:#0056d6;}

.filter-bar{
max-width:900px;margin:20px auto;
display:grid;grid-template-columns:repeat(4,1fr);
gap:16px;padding:0 20px;
}

input,select{height:36px;padding:6px 10px;border-radius:6px;border:1px solid #ccc;width:100%;}

.suggestions{position:absolute;background:white;border:1px solid #ccc;max-height:160px;overflow:auto;z-index:9999;width:100%;}
.suggestions div{padding:6px 10px;cursor:pointer;}
.suggestions div:hover{background:#eaf3ff;}

table{max-width:900px;margin:auto;width:100%;border-collapse:collapse;}
th{background:#f3f8ff;padding:10px;}
td{padding:9px;border-bottom:1px solid #e1ecfa;}
tr:nth-child(even){background:#f7fbff;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
<a href="f1.html">F1</a>
</div>

<h1 style="text-align:center">Black Caviar Lightning Winners</h1>

<div class="filter-bar">
<select id="yearFilter"><option value="">Year</option></select>

<div><input id="winnerFilter" placeholder="Winner"><div class="suggestions" id="winnerSug"></div></div>
<div><input id="jockeyFilter" placeholder="Jockey"><div class="suggestions" id="jockeySug"></div></div>
<div><input id="trainerFilter" placeholder="Trainer"><div class="suggestions" id="trainerSug"></div></div>
</div>

<table>
<thead><tr><th>Year</th><th>Winner</th><th>Jockey</th><th>Trainer</th></tr></thead>
<tbody id="body"></tbody>
</table>

<script>
const safe=v=>(v||"").toLowerCase().trim();
let all=[];

function isWinner(v){
v=safe(v);
return ["1","1st","first","winner","win","01","1.0"].includes(v);
}

fetch("./data/vic-g1.json").then(r=>r.json()).then(d=>{
all=d.filter(r=>safe(r.race).includes("black caviar lightning") && isWinner(r.finish))
.sort((a,b)=>b.year-a.year);

[...new Set(all.map(r=>r.year))].forEach(y=>yearFilter.innerHTML+=`<option>${y}</option>`);

setup(winnerFilter,winnerSug,[...new Set(all.map(r=>r.horse))]);
setup(jockeyFilter,jockeySug,[...new Set(all.map(r=>r.jockey))]);
setup(trainerFilter,trainerSug,[...new Set(all.map(r=>r.trainer))]);

render(all);
});

function render(r){body.innerHTML=r.map(x=>`<tr><td>${x.year}</td><td>${x.horse}</td><td>${x.jockey}</td><td>${x.trainer}</td></tr>`).join("");}
function apply(){render(all.filter(r=>(!yearFilter.value||r.year==yearFilter.value)&&(!winnerFilter.value||safe(r.horse).includes(safe(winnerFilter.value)))&&(!jockeyFilter.value||safe(r.jockey).includes(safe(jockeyFilter.value)))&&(!trainerFilter.value||safe(r.trainer).includes(safe(trainerFilter.value)))));}
yearFilter.onchange=winnerFilter.oninput=jockeyFilter.oninput=trainerFilter.oninput=apply;

function setup(i,b,l){
i.oninput=()=>{b.innerHTML="";let v=safe(i.value);if(!v)return;l.filter(x=>safe(x).includes(v)).slice(0,20).forEach(x=>{let d=document.createElement("div");d.textContent=x;d.onclick=()=>{i.value=x;b.innerHTML="";apply();};b.appendChild(d);});};
}
</script>

</body>
</html>
