<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>La Liga Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
font-family:var(--body);
margin:0;
background:var(--bg);
color:var(--ink);
-webkit-font-smoothing:antialiased;
}

.navbar{
display:flex;
justify-content:center;
gap:20px;
padding:15px;
background:var(--surface);
border-bottom:1px solid var(--line);
font-weight:600;
font-size:13.5px;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
color:var(--ink);
opacity:.7;
transition:opacity .15s,color .15s;
}
.navbar a:hover{opacity:1;color:var(--accent);}

.hero{
background:linear-gradient(160deg,var(--board-2),var(--board));
color:#fff;
padding:52px 20px 44px;
text-align:center;
}

.hero h1{
margin:0;
font-family:var(--display);
font-weight:600;
font-size:clamp(32px,6vw,48px);
letter-spacing:.01em;
text-transform:uppercase;
}

.hero p{
margin-top:12px;
font-size:14.5px;
color:rgba(255,255,255,.68);
}

.container{
max-width:1600px;
margin:0 auto;
padding:26px 20px 70px;
}

.search-wrap{
margin-bottom:24px;
display:flex;
justify-content:center;
}

#teamSearch{
width:100%;
max-width:480px;
padding:12px 18px;
font-size:14px;
border-radius:999px;
border:1px solid var(--line);
outline:none;
font-family:var(--body);
font-weight:600;
color:var(--ink);
background:var(--surface);
}

#teamSearch:hover{border-color:var(--faint);}
#teamSearch:focus{border-color:var(--accent);}

.team-count{
margin-bottom:20px;
font-size:13.5px;
font-weight:600;
color:var(--muted);
text-align:center;
}

.teams-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:16px;
}

.team-card{
background:var(--surface);
border:1px solid var(--line);
border-radius:var(--radius);
overflow:hidden;
text-decoration:none;
color:var(--ink);
transition:.2s ease;
display:block;
}

.team-card:hover{
transform:translateY(-3px);
border-color:var(--accent);
}

.team-band{
height:8px;
width:100%;
}

.team-content{
padding:20px;
}

.team-name{
font-family:var(--display);
font-weight:600;
font-size:19px;
margin-bottom:6px;
line-height:1.2;
text-transform:uppercase;
letter-spacing:.01em;
}

.team-meta{
font-size:12.5px;
color:var(--muted);
font-weight:600;
}

.no-results{
text-align:center;
font-size:15px;
font-weight:600;
padding:60px 20px;
color:var(--muted);
display:none;
}

</style>

</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
  <a href="laliga.html">La Liga</a>
  <a href="laliga-players.html">Players</a>
</div>

<div class="hero">
<h1>La Liga Teams</h1>
<p>Every club to play in La Liga, 1988/89 to current day</p>
</div>

<div class="container">

<div class="search-wrap">
<input type="text" id="teamSearch" placeholder="Search teams...">
</div>

<div class="team-count" id="teamCount"></div>
<div class="teams-grid" id="teamsGrid"></div>
<div class="no-results" id="noResults">No teams found</div>

</div>

<script>

const TEAMS = [
{name:"Alavés",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"Albacete",colour:"linear-gradient(90deg,#FFDD00,#004A97)"},
{name:"Almería",colour:"linear-gradient(90deg,#CC0000,#FFFFFF)"},
{name:"Athletic Club",colour:"linear-gradient(90deg,#CC0000,#FFFFFF)"},
{name:"Atlético de Madrid",colour:"linear-gradient(90deg,#CB3524,#FFFFFF)"},
{name:"Barcelona",colour:"linear-gradient(90deg,#A50044,#004D98)"},
{name:"Betis",colour:"linear-gradient(90deg,#00954C,#FFFFFF)"},
{name:"Cádiz",colour:"linear-gradient(90deg,#F4D03F,#002F6C)"},
{name:"Celta de Vigo",colour:"linear-gradient(90deg,#8DB7E2,#FFFFFF)"},
{name:"Córdoba",colour:"linear-gradient(90deg,#009A44,#FFFFFF)"},
{name:"Deportivo de La Coruña",colour:"linear-gradient(90deg,#FFFFFF,#0055A4)"},
{name:"Elche",colour:"linear-gradient(90deg,#007A33,#FFFFFF)"},
{name:"Espanyol",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"Getafe",colour:"linear-gradient(90deg,#005BAC,#FFFFFF)"},
{name:"Girona",colour:"linear-gradient(90deg,#CC0000,#FFFFFF)"},
{name:"Granada",colour:"linear-gradient(90deg,#CC0000,#FFFFFF)"},
{name:"Leganés",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"Levante",colour:"linear-gradient(90deg,#C8102E,#004EA8)"},
{name:"Málaga",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"Mallorca",colour:"linear-gradient(90deg,#E31837,#000000)"},
{name:"Murcia",colour:"linear-gradient(90deg,#CC0000,#FFFFFF)"},
{name:"Numancia",colour:"linear-gradient(90deg,#CC0000,#000000)"},
{name:"Osasuna",colour:"linear-gradient(90deg,#CC0000,#003DA5)"},
{name:"Oviedo",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"Rayo Vallecano",colour:"linear-gradient(90deg,#FFFFFF,#CC0000)"},
{name:"Racing de Santander",colour:"linear-gradient(90deg,#009A44,#FFFFFF)"},
{name:"Real Madrid",colour:"linear-gradient(90deg,#FFFFFF,#F0B400)"},
{name:"Real Sociedad",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"Real Valladolid",colour:"linear-gradient(90deg,#5B2D8E,#FFFFFF)"},
{name:"Real Zaragoza",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"Recreativo de Huelva",colour:"linear-gradient(90deg,#CC0000,#000000)"},
{name:"Sevilla",colour:"linear-gradient(90deg,#CC0000,#FFFFFF)"},
{name:"Sporting de Gijón",colour:"linear-gradient(90deg,#CC0000,#FFFFFF)"},
{name:"Tenerife",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"Valencia",colour:"linear-gradient(90deg,#FF6900,#000000)"},
{name:"Valladolid",colour:"linear-gradient(90deg,#5B2D8E,#FFFFFF)"},
{name:"Villarreal",colour:"linear-gradient(90deg,#FFD700,#003DA5)"},
{name:"Xerez",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
];

const grid      = document.getElementById("teamsGrid");
const search    = document.getElementById("teamSearch");
const count     = document.getElementById("teamCount");
const noResults = document.getElementById("noResults");

function renderTeams(filter=""){

  const filtered = TEAMS
    .sort((a,b) => a.name.localeCompare(b.name))
    .filter(team => team.name.toLowerCase().includes(filter.toLowerCase()));

  count.innerHTML = `${filtered.length} Teams`;

  if(filtered.length === 0){
    noResults.style.display = "block";
    grid.innerHTML = "";
    return;
  }

  noResults.style.display = "none";

  grid.innerHTML = filtered.map(team => `
    <a class="team-card" href="laliga-team.html?team=${encodeURIComponent(team.name)}">
      <div class="team-band" style="background:${team.colour};"></div>
      <div class="team-content">
        <div class="team-name">${team.name}</div>
        <div class="team-meta">View club stats, results and players</div>
      </div>
    </a>
  `).join('');

}

search.addEventListener("input", e => renderTeams(e.target.value));

renderTeams();

</script>

</body>
</html>
