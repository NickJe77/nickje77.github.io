<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals MVP | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1100px;margin:0 auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(90deg,#1D428A,#C8102E);color:white;padding:24px 30px;border-radius:12px;margin-bottom:25px;}
.hero h1{margin:0 0 6px;}
.hero p{margin:0;font-size:14px;opacity:.9;}
.controls{text-align:center;margin:0 0 18px;}
input{padding:8px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;min-width:260px;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
.player-link{color:#0056d6;text-decoration:none;font-weight:600;}
.player-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Finals MVP</h1>
<p>Finals MVP winners from 1976–present.</p>
</div>

<div class="controls">
<input id="q" placeholder="Search player or team…">
</div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Finals MVP</th>
<th>Champion</th>
</tr>
</thead>
<tbody id="rows">
<tr><td colspan="3">Loading...</td></tr>
</tbody>
</table>

</div>

<script>
const rows = document.getElementById("rows");
const q = document.getElementById("q");

const finalsMVP = {
"1976-77":"Bill Walton",
"1977-78":"Wes Unseld",
"1978-79":"Dennis Johnson",
"1979-80":"Magic Johnson",
"1980-81":"Cedric Maxwell",
"1981-82":"Magic Johnson",
"1982-83":"Moses Malone",
"1983-84":"Larry Bird",
"1984-85":"Kareem Abdul-Jabbar",
"1985-86":"Larry Bird",
"1986-87":"Magic Johnson",
"1987-88":"James Worthy",
"1988-89":"Joe Dumars",
"1989-90":"Isiah Thomas",
"1990-91":"Michael Jordan",
"1991-92":"Michael Jordan",
"1992-93":"Michael Jordan",
"1993-94":"Hakeem Olajuwon",
"1994-95":"Hakeem Olajuwon",
"1995-96":"Michael Jordan",
"1996-97":"Michael Jordan",
"1997-98":"Michael Jordan",
"1998-99":"Tim Duncan",
"1999-00":"Shaquille O'Neal",
"2000-01":"Shaquille O'Neal",
"2001-02":"Shaquille O'Neal",
"2002-03":"Tim Duncan",
"2003-04":"Chauncey Billups",
"2004-05":"Tim Duncan",
"2005-06":"Dwyane Wade",
"2006-07":"Tony Parker",
"2007-08":"Paul Pierce",
"2008-09":"Kobe Bryant",
"2009-10":"Kobe Bryant",
"2010-11":"Dirk Nowitzki",
"2011-12":"LeBron James",
"2012-13":"LeBron James",
"2013-14":"Kawhi Leonard",
"2014-15":"Andre Iguodala",
"2015-16":"LeBron James",
"2016-17":"Kevin Durant",
"2017-18":"Kevin Durant",
"2018-19":"Kawhi Leonard",
"2019-20":"LeBron James",
"2020-21":"Giannis Antetokounmpo",
"2021-22":"Stephen Curry",
"2022-23":"Nikola Jokić",
"2023-24":"Jaylen Brown",
"2024-25":"Shai Gilgeous-Alexander"
};

function seasonLabelFromStartYear(y){
  return `${y}-${String(y+1).slice(2)}`;  // 2024 -> 2024-25
}
function seasonLabelFromEndYear(y){
  return `${y-1}-${String(y).slice(2)}`;  // 2024 -> 2023-24
}
function possibleSeasonLabels(seasonValue){
  if(typeof seasonValue === "string" && seasonValue.includes("-")) return [seasonValue.trim()];

  const y = Number(seasonValue);
  if(!y || isNaN(y)) return [];
  return [seasonLabelFromEndYear(y), seasonLabelFromStartYear(y)];
}

let master = [];

async function build(){
  rows.innerHTML = "";
  master = [];

  let finals = [];
  try{
    const r = await fetch("/data/nba/finals.json");
    finals = r.ok ? await r.json() : [];
  }catch(e){
    finals = [];
  }

  // Build champion map that supports BOTH conventions
  const championMap = {};

  finals.forEach(f=>{
    const champ = (f.champion || f.winner || "").trim();
    if(!champ) return;

    const labels = possibleSeasonLabels(f.season);
    labels.forEach(lbl => {
      // only set if empty so we don't overwrite a correct mapping
      if(!championMap[lbl]) championMap[lbl] = champ;
    });
  });

  master = Object.entries(finalsMVP)
    .map(([season,mvp])=>({
      season,
      mvp,
      champion: championMap[season] || "",
      startYear: parseInt(season,10)
    }))
    .sort((a,b)=>b.startYear-a.startYear);

  render(master);
}

function render(data){
  const needle = (q.value||"").toLowerCase().trim();
  rows.innerHTML = "";

  data.forEach(f=>{
    const hay = [f.season,f.mvp,f.champion].join(" ").toLowerCase();
    if(needle && !hay.includes(needle)) return;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${f.season}</td>
      <td><a class="player-link" href="nba-player.html?player=${encodeURIComponent(f.mvp)}">${f.mvp}</a></td>
      <td>${f.champion || ""}</td>
    `;
    rows.appendChild(tr);
  });

  if(!rows.children.length){
    rows.innerHTML = "<tr><td colspan='3'>No matches.</td></tr>";
  }
}

q.addEventListener("input", ()=>render(master));
build();
</script>

</body>
</html>
