<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals MVP | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#fff;
color:#1f2937;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:700;
background:#fff;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.navbar a:hover{
text-decoration:underline;
}

.page-wrap{
max-width:1100px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#17408B,#C9082A);
color:white;
padding:26px 28px 22px;
border-radius:16px;
margin-bottom:24px;
text-align:center;
box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.hero h1{
margin:0 0 6px;
font-size:32px;
}

.hero p{
margin:0;
opacity:.9;
font-size:15px;
}

/* SEARCH */

.controls{
display:flex;
justify-content:center;
margin-bottom:22px;
}

input{
padding:10px 14px;
border-radius:10px;
border:1px solid #d1d5db;
font-size:14px;
min-width:280px;
}

/* TABLE CARD */

.table-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
overflow:hidden;
box-shadow:0 6px 16px rgba(0,0,0,0.05);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px 12px;
border-bottom:1px solid #e5e7eb;
text-align:left;
}

th{
background:#17408B;
color:white;
font-size:14px;
font-weight:700;
}

td{
font-size:15px;
}

tr:nth-child(even){
background:#f8faff;
}

tr:hover{
background:#e9f0ff;
}

.player-link{
color:#0056d6;
text-decoration:none;
font-weight:700;
}

.player-link:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Finals MVP</h1>
<p>Finals MVP winners from 1976–present</p>
</div>

<div class="controls">
<input id="q" placeholder="Search player or team…">
</div>

<div class="table-card">

<table>

<thead>
<tr>
<th>Season</th>
<th>Finals MVP</th>
<th>Champion</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>

</div>

<script>

const rows=document.getElementById("rows");
const q=document.getElementById("q");

const finalsData=[

{season:"2024-25",mvp:"Shai Gilgeous-Alexander",champion:"Oklahoma City Thunder"},
{season:"2023-24",mvp:"Jaylen Brown",champion:"Boston Celtics"},
{season:"2022-23",mvp:"Nikola Jokić",champion:"Denver Nuggets"},
{season:"2021-22",mvp:"Stephen Curry",champion:"Golden State Warriors"},
{season:"2020-21",mvp:"Giannis Antetokounmpo",champion:"Milwaukee Bucks"},
{season:"2019-20",mvp:"LeBron James",champion:"Los Angeles Lakers"},
{season:"2018-19",mvp:"Kawhi Leonard",champion:"Toronto Raptors"},
{season:"2017-18",mvp:"Kevin Durant",champion:"Golden State Warriors"},
{season:"2016-17",mvp:"Kevin Durant",champion:"Golden State Warriors"},
{season:"2015-16",mvp:"LeBron James",champion:"Cleveland Cavaliers"},
{season:"2014-15",mvp:"Andre Iguodala",champion:"Golden State Warriors"},
{season:"2013-14",mvp:"Kawhi Leonard",champion:"San Antonio Spurs"},
{season:"2012-13",mvp:"LeBron James",champion:"Miami Heat"},
{season:"2011-12",mvp:"LeBron James",champion:"Miami Heat"},
{season:"2010-11",mvp:"Dirk Nowitzki",champion:"Dallas Mavericks"},
{season:"2009-10",mvp:"Kobe Bryant",champion:"Los Angeles Lakers"},
{season:"2008-09",mvp:"Kobe Bryant",champion:"Los Angeles Lakers"},
{season:"2007-08",mvp:"Paul Pierce",champion:"Boston Celtics"},
{season:"2006-07",mvp:"Tony Parker",champion:"San Antonio Spurs"},
{season:"2005-06",mvp:"Dwyane Wade",champion:"Miami Heat"},
{season:"2004-05",mvp:"Tim Duncan",champion:"San Antonio Spurs"},
{season:"2003-04",mvp:"Chauncey Billups",champion:"Detroit Pistons"},
{season:"2002-03",mvp:"Tim Duncan",champion:"San Antonio Spurs"},
{season:"2001-02",mvp:"Shaquille O'Neal",champion:"Los Angeles Lakers"},
{season:"2000-01",mvp:"Shaquille O'Neal",champion:"Los Angeles Lakers"},
{season:"1999-00",mvp:"Shaquille O'Neal",champion:"Los Angeles Lakers"},
{season:"1998-99",mvp:"Tim Duncan",champion:"San Antonio Spurs"},
{season:"1997-98",mvp:"Michael Jordan",champion:"Chicago Bulls"},
{season:"1996-97",mvp:"Michael Jordan",champion:"Chicago Bulls"},
{season:"1995-96",mvp:"Michael Jordan",champion:"Chicago Bulls"},
{season:"1994-95",mvp:"Hakeem Olajuwon",champion:"Houston Rockets"},
{season:"1993-94",mvp:"Hakeem Olajuwon",champion:"Houston Rockets"},
{season:"1992-93",mvp:"Michael Jordan",champion:"Chicago Bulls"},
{season:"1991-92",mvp:"Michael Jordan",champion:"Chicago Bulls"},
{season:"1990-91",mvp:"Michael Jordan",champion:"Chicago Bulls"},
{season:"1989-90",mvp:"Isiah Thomas",champion:"Detroit Pistons"},
{season:"1988-89",mvp:"Joe Dumars",champion:"Detroit Pistons"},
{season:"1987-88",mvp:"James Worthy",champion:"Los Angeles Lakers"},
{season:"1986-87",mvp:"Magic Johnson",champion:"Los Angeles Lakers"},
{season:"1985-86",mvp:"Larry Bird",champion:"Boston Celtics"},
{season:"1984-85",mvp:"Kareem Abdul-Jabbar",champion:"Los Angeles Lakers"},
{season:"1983-84",mvp:"Larry Bird",champion:"Boston Celtics"},
{season:"1982-83",mvp:"Moses Malone",champion:"Philadelphia 76ers"},
{season:"1981-82",mvp:"Magic Johnson",champion:"Los Angeles Lakers"},
{season:"1980-81",mvp:"Cedric Maxwell",champion:"Boston Celtics"},
{season:"1979-80",mvp:"Magic Johnson",champion:"Los Angeles Lakers"},
{season:"1978-79",mvp:"Dennis Johnson",champion:"Seattle SuperSonics"},
{season:"1977-78",mvp:"Wes Unseld",champion:"Washington Bullets"},
{season:"1976-77",mvp:"Bill Walton",champion:"Portland Trail Blazers"}

];

function render(){

const needle=(q.value||"").toLowerCase();

rows.innerHTML="";

finalsData.forEach(d=>{

const text=(d.season+d.mvp+d.champion).toLowerCase();

if(needle && !text.includes(needle)) return;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${d.season}</td>
<td><a class="player-link" href="nba-player.html?player=${encodeURIComponent(d.mvp)}">${d.mvp}</a></td>
<td>${d.champion}</td>
`;

rows.appendChild(tr);

});

}

q.addEventListener("input",render);

render();

</script>

</body>
</html>
