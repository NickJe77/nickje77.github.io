<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals MVP | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1100px;margin:0 auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(90deg,#1D428A,#C8102E);color:white;padding:24px 30px;border-radius:12px;margin-bottom:25px;}
.hero h1{margin:0 0 6px;}
.hero p{margin:0;font-size:14px;opacity:.9;}
.controls{text-align:center;margin:0 0 18px;}
input{padding:8px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;min-width:260px;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
.player-link{color:#0056d6;text-decoration:none;font-weight:600;}
.player-link:hover{text-decoration:underline;}
.small{color:#666;font-size:13px;}
</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Finals MVP</h1>
<p>Finals MVP winners from 1976–present.</p>
</div>

<div class="controls">
<input id="q" placeholder="Search player or team…">
</div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Finals MVP</th>
<th class="small">Champion</th>
<th class="small">Runner-up</th>
<th class="small">Series</th>
</tr>
</thead>
<tbody id="rows">
<tr><td colspan="5">Loading...</td></tr>
</tbody>
</table>

</div>

<script>
const START_YEAR = 1976;
const END_YEAR = 2025; // keep as you had it
const rows = document.getElementById("rows");
const q = document.getElementById("q");

/* MVP lookup */
const finalsMVP = {
"1976-77":"Bill Walton",
"1977-78":"Wes Unseld",
"1978-79":"Dennis Johnson",
"1979-80":"Magic Johnson",
"1980-81":"Cedric Maxwell",
"1981-82":"Magic Johnson",
"1982-83":"Moses Malone",
"1983-84":"Larry Bird",
"1984-85":"Kareem Abdul-Jabbar",
"1985-86":"Larry Bird",
"1986-87":"Magic Johnson",
"1987-88":"James Worthy",
"1988-89":"Joe Dumars",
"1989-90":"Isiah Thomas",
"1990-91":"Michael Jordan",
"1991-92":"Michael Jordan",
"1992-93":"Michael Jordan",
"1993-94":"Hakeem Olajuwon",
"1994-95":"Hakeem Olajuwon",
"1995-96":"Michael Jordan",
"1996-97":"Michael Jordan",
"1997-98":"Michael Jordan",
"1998-99":"Tim Duncan",
"1999-00":"Shaquille O'Neal",
"2000-01":"Shaquille O'Neal",
"2001-02":"Shaquille O'Neal",
"2002-03":"Tim Duncan",
"2003-04":"Chauncey Billups",
"2004-05":"Tim Duncan",
"2005-06":"Dwyane Wade",
"2006-07":"Tony Parker",
"2007-08":"Paul Pierce",
"2008-09":"Kobe Bryant",
"2009-10":"Kobe Bryant",
"2010-11":"Dirk Nowitzki",
"2011-12":"LeBron James",
"2012-13":"LeBron James",
"2013-14":"Kawhi Leonard",
"2014-15":"Andre Iguodala",
"2015-16":"LeBron James",
"2016-17":"Kevin Durant",
"2017-18":"Kevin Durant",
"2018-19":"Kawhi Leonard",
"2019-20":"LeBron James",
"2020-21":"Giannis Antetokounmpo",
"2021-22":"Stephen Curry",
"2022-23":"Nikola Jokić",
"2023-24":"Jaylen Brown",
"2024-25":"Shai Gilgeous-Alexander"
};

function getGameDate(g){
  const d = g?.date || g?.date_iso || g?.game_date || g?.gameDate || "";
  const dt = new Date(d);
  return isNaN(dt.getTime()) ? null : dt;
}

let master = [];

async function loadData(){
  rows.innerHTML = "";
  master = [];

  for(let year=END_YEAR;year>=START_YEAR;year--){
    try{
      const indexRes=await fetch(`data/nba/${year}/index.json`);
      if(!indexRes.ok) continue;

      const index=await indexRes.json();
      if(!index.games?.length) continue;

      const games=(await Promise.all(
        index.games.map(id=>fetch(`data/nba/${year}/${id}.json`)
          .then(r=>r.ok?r.json():null))
      )).filter(Boolean);

      const playoffGames=games.filter(g=>g.game_type==="Playoffs");
      if(!playoffGames.length) continue;

      const seriesMap={};
      playoffGames.forEach(g=>{
        const a=g.home_team||"", b=g.away_team||"";
        if(!a||!b) return;
        const key=[a,b].sort().join("|");
        if(!seriesMap[key]) seriesMap[key]=[];
        seriesMap[key].push(g);
      });

      const allSeries=Object.values(seriesMap);
      if(!allSeries.length) continue;

      // ✅ Finals = series with the latest ending date
      let finalsSeries=null;
      let finalsEnd=null;

      for(const series of allSeries){
        const dated = series
          .map(x => ({ g:x, dt:getGameDate(x) }))
          .filter(x => x.dt);

        if(!dated.length) continue;

        dated.sort((x,y)=>x.dt - y.dt);
        const endDt = dated[dated.length-1].dt;

        if(!finalsEnd || endDt > finalsEnd){
          finalsEnd = endDt;
          finalsSeries = dated.map(x=>x.g);
        } else if(finalsEnd && endDt.getTime() === finalsEnd.getTime()){
          // tie-breaker: prefer longer series
          if(finalsSeries && series.length > finalsSeries.length){
            finalsSeries = dated.map(x=>x.g);
          }
        }
      }

      if(!finalsSeries || !finalsSeries.length) continue;

      finalsSeries.sort((a,b)=>{
        const da=getGameDate(a), db=getGameDate(b);
        if(!da && !db) return 0;
        if(!da) return 1;
        if(!db) return -1;
        return da - db;
      });

      const t1 = finalsSeries[0].home_team;
      const t2 = finalsSeries[0].away_team;

      const wins = {};
      wins[t1]=0; wins[t2]=0;

      finalsSeries.forEach(g=>{
        if(g.winner===t1) wins[t1]+=1;
        else if(g.winner===t2) wins[t2]+=1;
      });

      let champion=t1, runnerUp=t2, seriesResult="-";
      if(wins[t1] !== wins[t2]){
        champion = wins[t1] > wins[t2] ? t1 : t2;
        runnerUp = champion===t1 ? t2 : t1;
        seriesResult = `${wins[champion]}-${wins[runnerUp]}`;
      }

      const seasonLabel=`${year}-${String(year+1).slice(2)}`;

      master.push({
        season:seasonLabel,
        mvp:finalsMVP[seasonLabel]||"",
        champion,
        runnerUp,
        series:seriesResult
      });

    }catch(e){
      continue;
    }
  }

  render(master);
}

function render(data){
  const needle=(q.value||"").toLowerCase().trim();
  rows.innerHTML="";

  data.forEach(f=>{
    const hay=[f.season,f.mvp,f.champion,f.runnerUp,f.series].join(" ").toLowerCase();
    if(needle && !hay.includes(needle)) return;

    const link=f.mvp
      ? `<a class="player-link" href="nba-player.html?player=${encodeURIComponent(f.mvp)}">${f.mvp}</a>`
      : "";

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${f.season}</td>
      <td>${link}</td>
      <td class="small">${f.champion}</td>
      <td class="small">${f.runnerUp}</td>
      <td class="small">${f.series}</td>
    `;
    rows.appendChild(tr);
  });

  if(!rows.children.length){
    rows.innerHTML="<tr><td colspan='5'>No matches.</td></tr>";
  }
}

q.addEventListener("input",()=>render(master));
loadData();
</script>

</body>
</html>
