<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Finals MVP | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1100px;margin:auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(90deg,#1D428A,#C8102E);color:white;padding:24px 30px;border-radius:12px;margin-bottom:25px;}
.controls{text-align:center;margin-bottom:18px;}
input{padding:8px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;min-width:260px;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
.player-link{color:#0056d6;text-decoration:none;font-weight:600;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Finals MVP</h1>
<p>Finals MVP winners from 1976–present.</p>
</div>

<div class="controls">
<input id="q" placeholder="Search player or team…">
</div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Finals MVP</th>
<th>Champion</th>
</tr>
</thead>

<tbody id="rows">
<tr><td colspan="3">Loading...</td></tr>
</tbody>
</table>

</div>

<script>

const rows=document.getElementById("rows");
const q=document.getElementById("q");

const finalsMVP={
"1976-77":"Bill Walton",
"1977-78":"Wes Unseld",
"1978-79":"Dennis Johnson",
"1979-80":"Magic Johnson",
"1980-81":"Cedric Maxwell",
"1981-82":"Magic Johnson",
"1982-83":"Moses Malone",
"1983-84":"Larry Bird",
"1984-85":"Kareem Abdul-Jabbar",
"1985-86":"Larry Bird",
"1986-87":"Magic Johnson",
"1987-88":"James Worthy",
"1988-89":"Joe Dumars",
"1989-90":"Isiah Thomas",
"1990-91":"Michael Jordan",
"1991-92":"Michael Jordan",
"1992-93":"Michael Jordan",
"1993-94":"Hakeem Olajuwon",
"1994-95":"Hakeem Olajuwon",
"1995-96":"Michael Jordan",
"1996-97":"Michael Jordan",
"1997-98":"Michael Jordan",
"1998-99":"Tim Duncan",
"1999-00":"Shaquille O'Neal",
"2000-01":"Shaquille O'Neal",
"2001-02":"Shaquille O'Neal",
"2002-03":"Tim Duncan",
"2003-04":"Chauncey Billups",
"2004-05":"Tim Duncan",
"2005-06":"Dwyane Wade",
"2006-07":"Tony Parker",
"2007-08":"Paul Pierce",
"2008-09":"Kobe Bryant",
"2009-10":"Kobe Bryant",
"2010-11":"Dirk Nowitzki",
"2011-12":"LeBron James",
"2012-13":"LeBron James",
"2013-14":"Kawhi Leonard",
"2014-15":"Andre Iguodala",
"2015-16":"LeBron James",
"2016-17":"Kevin Durant",
"2017-18":"Kevin Durant",
"2018-19":"Kawhi Leonard",
"2019-20":"LeBron James",
"2020-21":"Giannis Antetokounmpo",
"2021-22":"Stephen Curry",
"2022-23":"Nikola Jokić",
"2023-24":"Jaylen Brown",
"2024-25":"Shai Gilgeous-Alexander"
};

async function build(){

let finals=[];

try{
finals=await fetch("/data/nba/finals.json").then(r=>r.json());
}catch(e){}

const championMap={};

finals.forEach(f=>{

const start = Number(f.season);
const next = String((start + 1) % 100).padStart(2,"0");

const season = `${start}-${next}`;

championMap[season] = f.champion;

});

const data=Object.entries(finalsMVP)
.map(([season,mvp])=>({
season,
mvp,
champion:championMap[season]||"",
year:parseInt(season)
}))
.sort((a,b)=>b.year-a.year);

render(data);

}

function render(data){

const needle=(q.value||"").toLowerCase();
rows.innerHTML="";

data.forEach(d=>{

const text=(d.season+d.mvp+d.champion).toLowerCase();
if(needle && !text.includes(needle)) return;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${d.season}</td>
<td><a class="player-link" href="nba-player.html?player=${encodeURIComponent(d.mvp)}">${d.mvp}</a></td>
<td>${d.champion}</td>
`;

rows.appendChild(tr);

});

}

q.addEventListener("input",build);

build();

</script>

</body>
</html>
