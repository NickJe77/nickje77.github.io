<!DOCTYPE html>
<html>
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Season</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1100px;margin:auto;padding:30px;}
.hero{background:linear-gradient(90deg,#0055A4,#00A651);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.match{background:white;padding:12px;border-radius:10px;margin-bottom:8px;cursor:pointer;}
.match:hover{background:#eaf3ff;}
</style>
</head>
<body>
<div class="page">
<div class="hero"><h1 id="title"></h1></div>
<div id="matches"></div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
const season=params.get("season");
document.getElementById("title").textContent="NRL "+season;

fetch("data/nrl/matches/"+season+".json")
.then(r=>r.json())
.then(d=>{
  const container=document.getElementById("matches");
  d.forEach(m=>{
    const div=document.createElement("div");
    div.className="match";
    div.textContent=m.home_team+" "+m.home_points+" - "+m.away_points+" "+m.away_team;
    div.onclick=()=>window.location="nrl-player.html?match="+m.match_id+"&season="+season;
    container.appendChild(div);
  });
});
</script>
</body>
</html>
