<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8" />
<title>NBA All-Star Games | The Sporting Almanac</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

.page-wrap{max-width:1000px;margin:0 auto;padding:26px 20px 70px;}

h1{
  font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);
  letter-spacing:.01em;text-transform:uppercase;margin:0;
}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:22px 26px 26px;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:8px;
}
.hero h1{color:#fff;}
.hero .sub{margin-top:10px;font-size:14px;color:rgba(255,255,255,.7);font-weight:600;}
.hero .mvp{margin-top:6px;font-size:13px;color:var(--accent);font-weight:600;}

.controls{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.segmented{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:20px;}
.seg-item{padding:8px 20px;border-radius:999px;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted);text-decoration:none;transition:background .15s,color .15s;}
.seg-item:hover{color:var(--ink);}
.seg-item.active{background:var(--accent-soft);color:var(--ink);}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);min-width:120px;
  cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

.card-title{
  font-family:var(--display);font-weight:600;font-size:14px;text-transform:uppercase;
  letter-spacing:.03em;color:var(--ink);margin:0 0 10px;
}
.card-title .score{color:var(--muted);font-weight:400;margin-left:8px;font-family:var(--body);}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
thead th{
  background:#f7f9fb;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);text-align:left;
}
th.center,td.center{text-align:center;}
td{color:#27313c;font-variant-numeric:tabular-nums;}
td.pos{text-align:center;font-weight:700;color:var(--muted);width:50px;}
td.player{font-weight:700;color:var(--ink);}
td.club{font-weight:600;}
tbody tr:hover td{background:#f9fbfd;}
tbody tr.totals td{border-top:2px solid var(--line);font-weight:700;}

.linescore-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;margin-bottom:20px;max-width:420px;}
.linescore-wrap table{font-size:13px;}
.linescore-wrap td.total{font-weight:700;}

.boxscores{display:grid;grid-template-columns:1fr;gap:20px;}

.meta-row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:20px;font-size:13px;color:var(--muted);}
.meta-row strong{color:var(--ink);}

.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;}
</style>
</head>
<body>
<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="afl-all-australian.html">All-Australian</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
  <a href="games.html" class="current">NBA</a>
  <a href="leaders.html">All-Star Leaders</a>
</nav>

<div class="page-wrap">

<div class="hero">
  <div class="eyebrow">NBA</div>
  <h1 id="heroTitle">All-Star Game</h1>
  <div class="sub" id="subLine"></div>
  <div class="mvp" id="mvpLine"></div>
</div>

<div class="segmented">
  <a href="games.html" class="seg-item active">Games</a>
  <a href="leaders.html" class="seg-item">Leaders</a>
</div>

<div class="controls">
  <select id="yearSelect"><option>Loading…</option></select>
  <select id="gameSelect" hidden></select>
</div>

<div id="lineScoreWrap"></div>
<div id="content"><div class="loading">Loading All-Star data…</div></div>

</div>

<script>
const yearSelect = document.getElementById("yearSelect");
const heroTitle  = document.getElementById("heroTitle");
const subLine    = document.getElementById("subLine");
const mvpLine    = document.getElementById("mvpLine");
const lineScoreWrap = document.getElementById("lineScoreWrap");
const content    = document.getElementById("content");

const STAT_COLS = [
  { key: 'mp', label: 'MP' }, { key: 'fg', label: 'FG' }, { key: 'fga', label: 'FGA' },
  { key: 'fg3', label: '3P' }, { key: 'fg3a', label: '3PA' }, { key: 'ft', label: 'FT' },
  { key: 'fta', label: 'FTA' }, { key: 'orb', label: 'ORB' }, { key: 'trb', label: 'TRB' },
  { key: 'ast', label: 'AST' }, { key: 'stl', label: 'STL' }, { key: 'blk', label: 'BLK' },
  { key: 'tov', label: 'TOV' }, { key: 'pf', label: 'PF' }, { key: 'pts', label: 'PTS' },
];

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

let DATA = null;
let currentYear = null;

fetch("data/nba/allstar.json")
  .then(r => { if(!r.ok) throw new Error("no data"); return r.json(); })
  .then(data => {
    DATA = data || {};
    const years = Object.keys(DATA).sort((a,b) => Number(b) - Number(a));

    if(!years.length){
      content.innerHTML = `<div class="loading">No All-Star data found in data/nba/allstar.json.</div>`;
      return;
    }

    yearSelect.innerHTML = "";
    years.forEach(y => {
      const opt = document.createElement("option");
      opt.value = y; opt.textContent = y;
      yearSelect.appendChild(opt);
    });
    yearSelect.onchange = () => { currentYear = yearSelect.value; currentGameNumber = null; render(); };
    currentYear = years[0];
    render();
  })
  .catch(() => {
    content.innerHTML = `<div class="loading">Couldn't load data/nba/allstar.json.</div>`;
  });

function renderLineScore(table){
  if(!table || !table.rows || !table.rows.length) { lineScoreWrap.innerHTML = ""; return; }
  const cols = Object.keys(table.rows[0] || {}).filter(k => k !== 'team' && k !== 'col_0');
  const rows = table.rows.filter(r => (r.team || r.col_0) && !/scoring/i.test(Object.values(r).join(' ')));

  // Some years (2025/2026 target-score mini-tournament games) only record
  // a single continuous scoring period, so every non-total column equals
  // the total - showing that as a "quarter breakdown" would be misleading
  // since we don't actually have separate period data for those games.
  const periodCols = cols.filter(c => c.toUpperCase() !== 'T');
  const isRedundant = periodCols.length > 0 && rows.every(r =>
    periodCols.every(c => !r[c] || r[c] === r['T'])
  );
  if (isRedundant) { lineScoreWrap.innerHTML = ""; return; }

  const headerRow = `<tr><th></th>${cols.map(c => `<th class="center">${esc(c)}</th>`).join('')}</tr>`;
  const bodyRows = rows
    .map(r => {
      const label = r.team || r.col_0 || '';
      return `<tr><td class="club">${esc(label)}</td>${cols.map(c => `<td class="center${c.toUpperCase()==='T' ? ' total':''}">${esc(r[c] ?? '')}</td>`).join('')}</tr>`;
    }).join('');
  if(!bodyRows){ lineScoreWrap.innerHTML = ""; return; }
  lineScoreWrap.innerHTML = `<div class="linescore-wrap"><table><thead>${headerRow}</thead><tbody>${bodyRows}</tbody></table></div>`;
}

function renderBoxTable(table, teamLabel, teamScore){
  const rows = (table.rows || []).filter(r => r.team_id);
  const totalsRow = (table.rows || []).find(r => !r.team_id && r.player);

  const bodyRows = rows.map(r => `
    <tr><td class="player">${esc(r.player)}</td>${STAT_COLS.map(c => `<td class="center">${esc(r[c.key] ?? '')}</td>`).join('')}</tr>
  `).join('');
  const totalsHtml = totalsRow ? `
    <tr class="totals"><td class="player">${esc(totalsRow.player)}</td>${STAT_COLS.map(c => `<td class="center">${esc(totalsRow[c.key] ?? '')}</td>`).join('')}</tr>
  ` : '';

  return `
    <div>
      <div class="card-title">${esc(teamLabel)}${teamScore != null ? `<span class="score">${esc(teamScore)}</span>` : ''}</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Player</th>${STAT_COLS.map(c => `<th class="center">${c.label}</th>`).join('')}</tr></thead>
          <tbody>${bodyRows}${totalsHtml}</tbody>
        </table>
      </div>
    </div>`;
}

let currentGameNumber = null;
const gameSelect = document.getElementById('gameSelect');

function getActiveGame(yearObj){
  if(yearObj.games && yearObj.games.length){
    const found = yearObj.games.find(g => g.game_number === currentGameNumber);
    return found || yearObj.games[yearObj.games.length - 1];
  }
  return { game_info: yearObj.game_info, tables: yearObj.tables };
}

function render(){
  if(currentYear == null || !DATA) return;
  const yearObj = DATA[currentYear];
  yearSelect.value = currentYear;

  if(!yearObj){
    content.innerHTML = `<div class="loading">No data found for ${esc(currentYear)}.</div>`;
    lineScoreWrap.innerHTML = "";
    heroTitle.textContent = "All-Star Game";
    subLine.textContent = "";
    mvpLine.textContent = "";
    gameSelect.hidden = true;
    return;
  }

  // Tournament years (2025+) have multiple games - show a selector,
  // defaulting to the Final so this matches every other year by default.
  if(yearObj.games && yearObj.games.length > 1){
    gameSelect.hidden = false;
    gameSelect.innerHTML = yearObj.games.map(g =>
      `<option value="${g.game_number}">${esc(g.label)}</option>`
    ).join('');
    if(currentGameNumber == null || !yearObj.games.some(g => g.game_number === currentGameNumber)){
      currentGameNumber = yearObj.games[yearObj.games.length - 1].game_number;
    }
    gameSelect.value = currentGameNumber;
  } else {
    gameSelect.hidden = true;
    currentGameNumber = null;
  }

  const activeGame = getActiveGame(yearObj);
  const gi = activeGame.game_info || {};
  const teams = gi.teams || [];
  const [a, b] = teams;

  heroTitle.textContent = `${currentYear} All-Star Game`;

  const scoreText = (a && b) ? `${a.team} ${a.score} – ${b.team} ${b.score}${gi.overtime ? ' (' + gi.overtime + ')' : ''}` : (gi.page_title || '');
  const metaParts = [scoreText, gi.date, gi.location].filter(Boolean);
  subLine.textContent = metaParts.join(' · ');
  mvpLine.textContent = gi.mvp ? `MVP: ${gi.mvp}` : '';

  const lineScoreTable = (activeGame.tables || []).find(t => t.table_id === 'line_score');
  renderLineScore(lineScoreTable);

  const rosterTables = (activeGame.tables || []).filter(t => t.table_id !== 'line_score' && t.rows && t.rows.length);

  if(!rosterTables.length){
    content.innerHTML = `<div class="loading">No box score available for ${esc(currentYear)}.</div>`;
    return;
  }

  const boxHtml = rosterTables.slice(0, 2).map((t, i) => {
    const teamInfo = teams[i];
    return renderBoxTable(t, (teamInfo && teamInfo.team) || t.table_id, teamInfo ? teamInfo.score : null);
  }).join('');

  content.innerHTML = `<div class="boxscores">${boxHtml}</div>`;
}

gameSelect.addEventListener('change', () => {
  currentGameNumber = Number(gameSelect.value);
  render();
});

</script>
</body>
</html>
