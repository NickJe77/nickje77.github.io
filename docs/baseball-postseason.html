<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>MLB Postseason | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page{max-width:1300px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:32px 34px;border-radius:var(--radius);margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,40px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

/* ── Controls ─────────────────────────────────────────── */
.year-select{
  padding:10px 18px;font-family:var(--body);font-size:13px;font-weight:600;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  margin-bottom:24px;cursor:pointer;
}
.year-select:hover{border-color:var(--faint);}
.year-select:focus{outline:none;border-color:var(--accent);}

/* ── Bracket ──────────────────────────────────────────── */
.bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
@media(max-width:1000px){.bracket{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.bracket{grid-template-columns:1fr;}}

.round{background:var(--surface);padding:16px;border-radius:var(--radius);border:1px solid var(--line);}
.round h3{
  margin:0 0 12px;font-family:var(--display);font-weight:600;font-size:13px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
}

.series{
  background:var(--bg);padding:12px;border-radius:10px;margin-bottom:10px;
  cursor:pointer;transition:background .15s,transform .15s;border:1px solid transparent;
}
.series:hover{background:var(--accent-soft);border-color:var(--accent);transform:translateY(-2px);}
.series:last-child{margin-bottom:0;}

.team{font-weight:700;color:var(--ink);font-size:14px;}
.runner-up{font-size:13px;color:var(--muted);margin-top:2px;}
.result{font-size:12px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums;}

.empty{padding:24px;text-align:center;color:var(--muted);font-size:14px;}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-world-series.html">World Series</a>
</div>

<div class="page">

  <div class="hero">
    <div class="eyebrow">MLB</div>
    <h1>Postseason</h1>
  </div>

  <select id="yearSelect" class="year-select"></select>

  <div id="bracketContainer" class="bracket"></div>

</div>

<script>

const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

(async function(){

  const postseason = await fetchJSON(`${R2}/baseball/postseason.json`);
  const teams = await fetchJSON(`${R2}/baseball/teams.json`);

  if(!postseason || !teams){
    document.getElementById("bracketContainer").innerHTML =
      "<p>Postseason data unavailable.</p>";
    return;
  }

  function getTeamName(code){
    const t = teams.find(x => x.codes.includes(code));
    return t ? t.name : code;
  }

  const roundOrder = ["WC","DS","CS","WS"];
  const roundNames = {
    WC:"Wild Card",
    DS:"Division Series",
    CS:"League Championship Series",
    WS:"World Series"
  };

  const yearSelect = document.getElementById("yearSelect");
  const bracketContainer = document.getElementById("bracketContainer");

  const years = [...new Set(postseason.map(d=>d.year))]
    .sort((a,b)=>b-a);

  years.forEach(y=>{
    const opt=document.createElement("option");
    opt.value=y;
    opt.textContent=y;
    yearSelect.appendChild(opt);
  });

  yearSelect.value = years[0];

  function renderBracket(year){

    bracketContainer.innerHTML="";

    roundOrder.forEach(r=>{
      const roundData = postseason.filter(d=>d.year===year && d.round===r);
      if(roundData.length===0) return;

      const roundDiv=document.createElement("div");
      roundDiv.className="round";
      roundDiv.innerHTML=`<h3>${roundNames[r]}</h3>`;

      roundData.forEach(s=>{
        const seriesDiv=document.createElement("div");
        seriesDiv.className="series";

        seriesDiv.innerHTML=`
          <div class="team">${getTeamName(s.champion_code)}</div>
          <div class="runner-up">${getTeamName(s.runner_up_code)}</div>
          <div class="result">${s.result}</div>
        `;

        seriesDiv.addEventListener("click",()=>{
          window.location.href =
            `baseball-series.html?year=${year}&round=${r}&team1=${s.champion_code}&team2=${s.runner_up_code}`;
        });

        roundDiv.appendChild(seriesDiv);
      });

      bracketContainer.appendChild(roundDiv);
    });
  }

  renderBracket(years[0]);

  yearSelect.addEventListener("change",()=>{
    renderBracket(Number(yearSelect.value));
  });

})();
</script>

</body>
</html>
