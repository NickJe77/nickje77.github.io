<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Postseason | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
  --alt:#dbe8ff;
}

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}

.year-select-wrap{
  margin-bottom:20px;
}

.year-select{
  padding:10px 14px;
  font-size:16px;
  border-radius:10px;
  border:1px solid var(--line);
  font-weight:600;
}

.round{
  margin-bottom:14px;
  padding:14px;
  border-radius:14px;
  background:#fff;
  border:1px solid var(--line);
}

.round h3{
  margin:0 0 8px 0;
  font-size:16px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.series{
  font-size:15px;
  margin:6px 0;
}

.series span{
  font-weight:700;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-world-series.html">World Series</a>
</div>

<div class="page">

  <div class="hero">
    <h1>MLB Postseason</h1>
  </div>

  <div class="year-select-wrap">
    <select id="yearSelect" class="year-select"></select>
  </div>

  <div id="postseasonContainer"></div>

</div>

<script>

async function loadData(){
  const res = await fetch("/data/baseball/postseason.json");
  return await res.json();
}

(async function(){

  const data = await loadData();
  const container = document.getElementById("postseasonContainer");
  const yearSelect = document.getElementById("yearSelect");

  const roundOrder = ["WC","DS","CS","WS"];
  const roundNames = {
    WC: "Wild Card",
    DS: "Division Series",
    CS: "League Championship Series",
    WS: "World Series"
  };

  // Extract unique years
  const years = [...new Set(data.map(d => d.year))]
    .sort((a,b) => b - a);

  // Populate dropdown
  years.forEach(y=>{
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    yearSelect.appendChild(opt);
  });

  // Default to most recent
  yearSelect.value = years[0];

  function renderYear(selectedYear){

    container.innerHTML = "";

    roundOrder.forEach(r=>{
      const series = data.filter(d => d.year === selectedYear && d.round === r);
      if(series.length === 0) return;

      const roundDiv = document.createElement("div");
      roundDiv.className = "round";
      roundDiv.innerHTML = `<h3>${roundNames[r]}</h3>`;

      series.forEach(s=>{
        const line = document.createElement("div");
        line.className = "series";
        line.innerHTML = `
          <span>${s.champion_code}</span>
          defeated
          ${s.runner_up_code}
          (${s.result})
        `;
        roundDiv.appendChild(line);
      });

      container.appendChild(roundDiv);
    });

  }

  renderYear(years[0]);

  yearSelect.addEventListener("change", ()=>{
    renderYear(yearSelect.value);
  });

})();

</script>

</body>
</html>
