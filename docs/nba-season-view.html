<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

h1{
  text-align:center;margin:0 0 20px;font-family:var(--display);font-weight:600;
  font-size:clamp(22px,4.5vw,32px);letter-spacing:.01em;text-transform:uppercase;color:var(--ink);
}

.filters{display:flex;gap:10px;justify-content:center;margin:0 0 24px;flex-wrap:wrap;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tr.game-row{cursor:pointer;}
tr.game-row:hover td{background:#f9fbfd;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div class="page-wrap">

<h1 id="title"></h1>

<div class="filters">
  <select id="teamFilter">
    <option value="">All Teams</option>
  </select>
  <select id="playerFilter">
    <option value="">All Players</option>
  </select>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Date</th>
  <th>Game</th>
  <th>Winner</th>
  <th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const seasonParam = params.get("season"); // eg 1976_77
const file = "data/nba/nba_season_" + seasonParam + ".json";

const teamSelect = document.getElementById("teamFilter");
const playerSelect = document.getElementById("playerFilter");
const gamesTable = document.getElementById("gamesTable");

let gamesData = [];

function cleanDate(raw){
  if(!raw) return "";
  let cleaned = raw.replace(/^t\s*/i, "Oct ");
  const parsed = new Date(cleaned);
  if(!isNaN(parsed)){
    return parsed.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
  }
  return cleaned;
}

fetch(file)
.then(r=>r.json())
.then(data=>{
  document.getElementById("title").textContent = "NBA Season " + data.season;
  gamesData = data.games || [];

  const teams=new Set(), players=new Set();

  gamesData.forEach(g=>{
    if(g.home_team) teams.add(g.home_team);
    if(g.away_team) teams.add(g.away_team);
    if(g.players){
      g.players.forEach(p=>{
        if(p.player) players.add(p.player);
      });
    }
  });

  [...teams].sort().forEach(t=>{
    teamFilter.add(new Option(t,t));
  });
  [...players].sort().forEach(p=>{
    playerFilter.add(new Option(p,p));
  });

  renderGames();
});

function renderGames(){
  const teamVal=teamFilter.value;
  const playerVal=playerFilter.value;
  gamesTable.innerHTML="";

  gamesData.filter((g)=>{
    let ok=true;
    if(teamVal){
      ok=g.home_team===teamVal||g.away_team===teamVal;
    }
    if(ok&&playerVal&&g.players){
      ok=g.players.some(p=>p.player===playerVal);
    }
    return ok;
  }).forEach((g,i)=>{
    const home=g.home_team||"", away=g.away_team||"";
    const hp=g.home_points??"", ap=g.away_points??"";
    const winner = hp>ap?home:away;

    const tr=document.createElement("tr");
    tr.className="game-row";
    tr.innerHTML=`
      <td>${cleanDate(g.date)}</td>
      <td>${home} vs ${away}</td>
      <td>${winner}</td>
      <td>${hp}–${ap}</td>
    `;

    tr.onclick=()=>{
      window.location.href=`nba-game.html?season=${seasonParam}&game=${i}`;
    };

    gamesTable.appendChild(tr);
  });
}

teamFilter.onchange=renderGames;
playerFilter.onchange=renderGames;
</script>

</body>
</html>
