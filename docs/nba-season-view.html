<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;margin-bottom:10px;}
.filters{display:flex;gap:16px;justify-content:center;margin:20px 0 30px;}
select{padding:8px 12px;font-size:15px;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:10px 12px;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
tr.game-row{cursor:pointer;}
tr.game-row:hover{background:#e9f1ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title"></h1>

<div class="filters">
  <select id="teamFilter">
    <option value="">All Teams</option>
  </select>
  <select id="playerFilter">
    <option value="">All Players</option>
  </select>
</div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Game</th>
  <th>Winner</th>
  <th>Score</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const seasonParam = params.get("season"); // eg 1976_77
const file = "data/nba/nba_season_" + seasonParam + ".json";

const teamSelect = document.getElementById("teamFilter");
const playerSelect = document.getElementById("playerFilter");
const gamesTable = document.getElementById("gamesTable");

let gamesData = [];

function cleanDate(raw){
  if(!raw) return "";
  let cleaned = raw.replace(/^t\s*/i, "Oct ");
  const parsed = new Date(cleaned);
  if(!isNaN(parsed)){
    return parsed.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
  }
  return cleaned;
}

fetch(file)
.then(r=>r.json())
.then(data=>{
  document.getElementById("title").textContent = "NBA Season " + data.season;
  gamesData = data.games || [];

  const teams=new Set(), players=new Set();

  gamesData.forEach(g=>{
    if(g.home_team) teams.add(g.home_team);
    if(g.away_team) teams.add(g.away_team);
    if(g.players){
      g.players.forEach(p=>{
        if(p.player) players.add(p.player);
      });
    }
  });

  [...teams].sort().forEach(t=>{
    teamFilter.add(new Option(t,t));
  });
  [...players].sort().forEach(p=>{
    playerFilter.add(new Option(p,p));
  });

  renderGames();
});

function renderGames(){
  const teamVal=teamFilter.value;
  const playerVal=playerFilter.value;
  gamesTable.innerHTML="";

  gamesData.filter((g)=>{
    let ok=true;
    if(teamVal){
      ok=g.home_team===teamVal||g.away_team===teamVal;
    }
    if(ok&&playerVal&&g.players){
      ok=g.players.some(p=>p.player===playerVal);
    }
    return ok;
  }).forEach((g,i)=>{
    const home=g.home_team||"", away=g.away_team||"";
    const hp=g.home_points??"", ap=g.away_points??"";
    const winner = hp>ap?home:away;

    const tr=document.createElement("tr");
    tr.className="game-row";
    tr.innerHTML=`
      <td>${cleanDate(g.date)}</td>
      <td>${home} vs ${away}</td>
      <td>${winner}</td>
      <td>${hp}–${ap}</td>
    `;

    tr.onclick=()=>{
      window.location.href=`nba-game.html?season=${seasonParam}&game=${i}`;
    };

    gamesTable.appendChild(tr);
  });
}

teamFilter.onchange=renderGames;
playerFilter.onchange=renderGames;
</script>

</body>
</html>
