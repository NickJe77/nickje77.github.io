<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Rugby Union Players | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
  body{font-family:Inter,system-ui,-apple-system,sans-serif;margin:0;background:#f4f6f8;color:#111;}
  .navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;position:sticky;top:0;z-index:100;}
  .navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
  .navbar a:hover{text-decoration:underline;}
  .hero{background:linear-gradient(135deg,#1a3a1a,#2d7a2d);color:white;padding:56px 20px 44px;text-align:center;}
  .hero h1{margin:0;font-size:60px;font-weight:900;letter-spacing:-2px;}
  .hero p{margin:12px 0 0;font-size:18px;opacity:.88;}
  .page-wrap{max-width:1400px;margin:0 auto;padding:28px 20px 60px;}
  .controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center;}
  .controls input{padding:12px 16px;border-radius:12px;border:1px solid #ddd;font-size:16px;font-weight:600;flex:1;min-width:220px;}
  .controls select{padding:11px 14px;border-radius:12px;border:1px solid #ddd;font-size:14px;font-weight:700;background:white;}
  .count{font-size:14px;font-weight:700;color:#888;}
  .players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .player-card{background:white;border-radius:16px;padding:20px;text-decoration:none;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.2s;display:block;border-left:4px solid #2d7a2d;}
  .player-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.12);}
  .player-name{font-size:17px;font-weight:900;margin-bottom:6px;}
  .player-meta{font-size:13px;color:#666;}
  .loading{text-align:center;padding:60px;font-size:18px;font-weight:700;color:#888;}
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="rugby.html">Rugby Union</a>
</div>
<div class="hero">
  <h1>Rugby Players</h1>
  <p>Every player in our Rugby Union database</p>
</div>
<div class="page-wrap">
  <div class="controls">
    <input type="text" id="search" placeholder="Search players..." oninput="render()">
    <select id="posFilter" onchange="render()">
      <option value="">All Positions</option>
      <option>prop</option><option>hooker</option><option>lock</option>
      <option>flanker</option><option>number 8</option><option>scrum-half</option>
      <option>fly-half</option><option>centre</option><option>wing</option>
      <option>fullback</option>
    </select>
    <div class="count" id="count"></div>
  </div>
  <div class="players-grid" id="grid"><div class="loading">Loading players...</div></div>
</div>
<script>
var allPlayers = [];

fetch('/data/rugby/players.json')
  .then(function(r){ return r.json(); })
  .then(function(data){
    allPlayers = data;
    render();
  });

function render(){
  var q   = document.getElementById('search').value.toLowerCase().trim();
  var pos = document.getElementById('posFilter').value.toLowerCase();

  var filtered = allPlayers.filter(function(p){
    if(q && !(p.name||'').toLowerCase().includes(q)) return false;
    if(pos && !(p.position||'').toLowerCase().includes(pos)) return false;
    return true;
  }).slice(0,200);

  document.getElementById('count').innerText = filtered.length.toLocaleString()+' players';
  document.getElementById('grid').innerHTML = filtered.map(function(p){
    return '<a class="player-card" href="/rugby-player.html?id='+p.id+'">'+
      '<div class="player-name">'+p.name+'</div>'+
      '<div class="player-meta">'+(p.position||'')+(p.height?' · '+p.height:'')+'</div>'+
      '</a>';
  }).join('') || '<div class="loading">No players found</div>';
}
</script>
</body>
</html>
