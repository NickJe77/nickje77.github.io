<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:10px;}
.subtitle{text-align:center;color:#666;margin-bottom:20px;}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:center;
}
th{
  background:#f0f0f0;
  position:sticky;
  top:0;
}
tr:nth-child(even){background:#f6f9ff;}

.bad{
  background:#fff3f3;
  border:1px solid #ffd0d0;
  color:#a40000;
  padding:10px 12px;
  border-radius:10px;
  max-width:900px;
  margin:0 auto 18px;
}

.game-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Player</h1>
<div class="subtitle" id="subtitle"></div>

<div id="errorBox" class="bad" style="display:none;"></div>

<table id="gamesTable" style="display:none;">
<thead>
<tr>
  <th>Season</th>
  <th>Game</th>
  <th>Team</th>
  <th>MIN</th>
  <th>PTS</th>
  <th>REB</th>
  <th>AST</th>
  <th>STL</th>
  <th>BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>

</div>

<script>
const BASE_PATH = "data/nba/";

const params = new URLSearchParams(window.location.search);
const playerName = params.get("player");

const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");
const errorBox = document.getElementById("errorBox");
const gamesTable = document.getElementById("gamesTable");
const gamesBody = document.getElementById("gamesBody");

function seasonToFile(season){
  return BASE_PATH + "nba_season_" + season.replace("-","_") + ".json";
}

/* AUTO DETECT SEASONS */
async function detectSeasons(){
  const years = [];
  for(let y=1976; y<=2030; y++){
    years.push(`${y}-${String(y+1).slice(2)}`);
  }

  const checks = years.map(season =>
    fetch(seasonToFile(season))
      .then(r => r.ok ? season : null)
      .catch(()=>null)
  );

  const results = await Promise.all(checks);
  return results.filter(Boolean);
}

function showError(msg){
  errorBox.style.display = "block";
  errorBox.textContent = msg;
}

async function loadPlayer(){
  if(!playerName){
    showError("Missing player parameter.");
    return;
  }

  titleEl.textContent = playerName;
  subtitleEl.textContent = "Career Game Log";

  const seasons = await detectSeasons();
  if(!seasons.length){
    showError("No season files found.");
    return;
  }

  let rows = [];

  for(const season of seasons){
    try{
      const res = await fetch(seasonToFile(season));
      if(!res.ok) continue;
      const data = await res.json();

      (data.games || []).forEach(g=>{
        (g.players || []).forEach(p=>{
          if(p.player === playerName){
            rows.push({
              season,
              game: `${g.home_team} vs ${g.away_team}`,
              team: p.team,
              min: p.min,
              pts: p.pts,
              reb: p.reb,
              ast: p.ast,
              stl: p.stl,
              blk: p.blk
            });
          }
        });
      });

    }catch(e){}
  }

  if(rows.length === 0){
    showError("No games found for this player.");
    return;
  }

  rows.sort((a,b)=>b.season.localeCompare(a.season));

  rows.forEach(r=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.season}</td>
      <td>
        <a class="game-link" href="nba-game.html?season=${encodeURIComponent(r.season)}&game=${encodeURIComponent(r.game)}">
          ${r.game}
        </a>
      </td>
      <td>${r.team}</td>
      <td>${r.min||""}</td>
      <td>${r.pts||""}</td>
      <td>${r.reb||""}</td>
      <td>${r.ast||""}</td>
      <td>${r.stl||""}</td>
      <td>${r.blk||""}</td>
    `;
    gamesBody.appendChild(tr);
  });

  gamesTable.style.display = "table";
}

loadPlayer();
</script>

</body>
</html>
