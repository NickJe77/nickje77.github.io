<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}

.page-wrap{
  max-width:1000px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:30px;}

.tile-wrap{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:30px;
}
.tile{
  border:1px solid #ddd;
  border-radius:10px;
  padding:16px;
  background:#f6f9ff;
  text-align:center;
}
.tile h3{
  margin:0 0 6px 0;
  font-size:14px;
  color:#555;
  font-weight:600;
}
.tile div{
  font-size:22px;
  font-weight:700;
}

.back-link{
  display:inline-block;
  margin-bottom:20px;
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
.back-link:hover{text-decoration:underline;}

.info{
  max-width:800px;
  margin:0 auto 30px;
  text-align:center;
  color:#444;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<a href="nba-league-leaders.html" class="back-link">← Back to League Leaders</a>

<h1 id="playerName">NBA Player</h1>
<p id="playerInfo">Loading player profile…</p>

<div class="tile-wrap">
  <div class="tile">
    <h3>Born</h3>
    <div id="tileBorn">—</div>
  </div>
  <div class="tile">
    <h3>Country</h3>
    <div id="tileCountry">—</div>
  </div>
  <div class="tile">
    <h3>Position</h3>
    <div id="tilePosition">—</div>
  </div>
  <div class="tile">
    <h3>NBA Debut</h3>
    <div id="tileDebut">—</div>
  </div>
  <div class="tile">
    <h3>Championships</h3>
    <div id="tileTitles">—</div>
  </div>
  <div class="tile">
    <h3>MVP Awards</h3>
    <div id="tileMvps">—</div>
  </div>
</div>

<div class="info" id="extraInfo"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerName = params.get("player");

const playerNameEl = document.getElementById("playerName");
const playerInfoEl = document.getElementById("playerInfo");

const tileBorn = document.getElementById("tileBorn");
const tileCountry = document.getElementById("tileCountry");
const tilePosition = document.getElementById("tilePosition");
const tileDebut = document.getElementById("tileDebut");
const tileTitles = document.getElementById("tileTitles");
const tileMvps = document.getElementById("tileMvps");
const extraInfo = document.getElementById("extraInfo");

if(!playerName){
  playerNameEl.textContent = "No player selected";
  playerInfoEl.textContent = "";
}else{
  playerNameEl.textContent = playerName;

  fetch("data/nba/players.json")
    .then(r => r.json())
    .then(data => {
      const player = data.find(p => p.player === playerName);

      if(!player){
        playerInfoEl.textContent = "Player not found.";
        return;
      }

      playerInfoEl.textContent = `Career profile for ${player.player}.`;

      tileBorn.textContent = player.born || "—";
      tileCountry.textContent = player.country || "—";
      tilePosition.textContent = player.position || "—";
      tileDebut.textContent = player.debut || "—";
      tileTitles.textContent = player.titles ?? "—";
      tileMvps.textContent = player.mvps ?? "—";

      let bio = [];
      if(player.height) bio.push(`Height: ${player.height}`);
      if(player.weight) bio.push(`Weight: ${player.weight}`);
      if(player.teams) bio.push(`Teams: ${player.teams.join(", ")}`);

      extraInfo.textContent = bio.join(" • ");
    })
    .catch(() => {
      playerInfoEl.textContent = "Error loading player data.";
    });
}
</script>

</body>
</html>
