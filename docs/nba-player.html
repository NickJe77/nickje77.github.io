<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:28px 30px;
  margin-bottom:24px;
}

.hero-title-wrap{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.eyebrow{
  font-size:12px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

#title{
  margin:0;
  font-size:42px;
  font-weight:800;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  margin-bottom:24px;
}

.table-wrap{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:12px 10px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{
  background:#eef3ff;
  color:#003a99;
  font-weight:800;
}

tbody tr:nth-child(even){
  background:#f8faff;
}

.clickable-row{
  cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<div class="hero">
<div class="hero-title-wrap">
<div class="eyebrow">NBA Player Career</div>
<h1 id="title">Player</h1>
</div>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

const gamesBody = document.getElementById("gamesBody");
const titleEl = document.getElementById("title");

let rows = [];

function slug(name){
  return name
  .toLowerCase()
  .replace(/[^\w\s-]/g,"")
  .replace(/\s+/g,"-");
}

function parseNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function getSeason(r){

  if(r.season) return r.season;

  const d = r.date || "";
  if(!d) return "";

  const year = Number(d.substring(0,4));
  const month = Number(d.substring(5,7));

  if(month >= 10){
    return year;
  }else{
    return year - 1;
  }
}

function getGameId(r){
  return r.game_id || r.game || r.id || r.gameId || "";
}

function getFilteredRows(){

  let filtered = rows.filter(r => r.team && r.opp);

  return filtered;
}

async function loadPlayer(){

  if(!playerParam) return;

  const playerName = decodeURIComponent(playerParam);

  titleEl.textContent = playerName;

  try{

    const res = await fetch(`/data/nba/players/${slug(playerName)}.json`);
    const data = await res.json();

    rows = Array.isArray(data.games) ? data.games : [];

    renderGames();

  }catch(err){
    console.error(err);
  }
}

function renderGames(){

  gamesBody.innerHTML = "";

  const filtered = getFilteredRows();

  filtered.forEach(r=>{

    const gameId = getGameId(r);

    const row = document.createElement("tr");

    if(gameId){
      row.className = "clickable-row";
    }

    row.innerHTML = `
<td>${getSeason(r)}</td>
<td>${(r.date || "").split("T")[0]}</td>
<td>${r.team || ""}</td>
<td>${r.opp || ""}</td>
<td>${parseNum(r.pts)}</td>
<td>${parseNum(r.reb)}</td>
<td>${parseNum(r.ast)}</td>
<td>${parseNum(r.stl)}</td>
<td>${parseNum(r.blk)}</td>
`;

    if(gameId){
      row.addEventListener("click", ()=>{
        window.location = "nba-game.html?game=" + encodeURIComponent(gameId);
      });
    }

    gamesBody.appendChild(row);

  });

}

loadPlayer();

</script>

</body>
</html>
