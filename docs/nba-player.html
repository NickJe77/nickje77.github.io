<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

/* NAV BAR */
.navbar{
  display:flex;
  justify-content:center;
  gap:30px;
  padding:14px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:20px;
}

h1{text-align:center;margin-bottom:10px;}

.stats-row{
  display:flex;
  gap:12px;
  justify-content:center;
  margin:12px 0;
  flex-wrap:wrap;
}

.stat-box{
  background:#f2f6ff;
  padding:10px 16px;
  border-radius:8px;
  text-align:center;
  min-width:110px;
}

.stat-box span{
  display:block;
  font-size:22px;
  font-weight:700;
}

.filter-row{
  text-align:center;
  margin:14px 0 18px;
  font-weight:600;
  color:#003a99;
}

select{
  padding:8px 14px;
  font-size:15px;
  border-radius:8px;
  border:2px solid #0056d6;
  background:#eef3ff;
  color:#003a99;
  font-weight:600;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:14px;
}

th,td{
  padding:6px 8px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

th{
  background:#eef3ff;
  cursor:pointer;
}

tr:nth-child(even){background:#f6f9ff;}

.bad{
  background:#ffe1e1;
  color:#900;
  padding:10px;
  text-align:center;
  border-radius:6px;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="../index.html">Home</a>
  <a href="../nba.html">NBA</a>
  <a href="../nba-seasons.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">Player</h1>

<div class="stats-row" id="totalsBoxes"></div>
<div class="stats-row" id="averagesBoxes"></div>
<div class="stats-row" id="highsBoxes"></div>

<div class="filter-row">
  Opposition:
  <select id="oppFilter">
    <option value="ALL">All teams</option>
  </select>
</div>

<div id="errorBox" class="bad" style="display:none;"></div>

<table>
<thead>
<tr>
  <th data-key="season">Season</th>
  <th data-key="date">Date</th>
  <th data-key="team">Team</th>
  <th data-key="opp">Opp</th>
  <th data-key="pts">PTS</th>
  <th data-key="reb">REB</th>
  <th data-key="ast">AST</th>
  <th data-key="stl">STL</th>
  <th data-key="blk">BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerName = decodeURIComponent(params.get("player") || "");

const titleEl = document.getElementById("title");
const totalsBoxes = document.getElementById("totalsBoxes");
const averagesBoxes = document.getElementById("averagesBoxes");
const highsBoxes = document.getElementById("highsBoxes");
const errorBox = document.getElementById("errorBox");
const gamesBody = document.getElementById("gamesBody");
const oppFilter = document.getElementById("oppFilter");

let rows = [];
let filteredRows = [];
let currentSort = { key:null, dir:"desc" };

function seasonToFile(season){
  return "../data/nba/nba_season_" + season.replace("-","_") + ".json";
}

function showError(msg){
  errorBox.style.display = "block";
  errorBox.textContent = msg;
}

/* CONVERT ANY DATE → D/M/YYYY */
function cleanDate(raw){
  if(!raw) return "";

  let s = raw.trim().toLowerCase();

  s = s.replace(/^t\s+/,"oct ");
  s = s.replace(/^ov\s+/,"nov ");
  s = s.replace(/^v\s+/,"nov ");

  const d = new Date(s);
  if(isNaN(d)) return raw;

  return d.getDate() + "/" + (d.getMonth()+1) + "/" + d.getFullYear();
}

async function loadSeasons(){
  const res = await fetch("../data/nba/seasons.json");
  if(!res.ok) throw new Error("seasons.json not found");
  return await res.json();
}

async function loadPlayer(){
  if(!playerName){
    showError("Missing ?player= in URL");
    return;
  }

  titleEl.textContent = playerName;

  let seasons;
  try{
    seasons = await loadSeasons();
  }catch(e){
    showError("Could not load seasons.json");
    return;
  }

  try{
    const responses = await Promise.all(
      seasons.map(s => fetch(seasonToFile(s)))
    );

    const jsons = await Promise.all(
      responses.filter(r=>r.ok).map(r=>r.json())
    );

    jsons.forEach((data, i)=>{
      const season = seasons[i];

      data.games.forEach(game=>{
        game.players.forEach(p=>{
          if(p.player === playerName){

            const home = game.home_team;
            const away = game.away_team;

            const isHome =
              home.toLowerCase().startsWith(p.team.toLowerCase());

            const opp = isHome ? away : home;

            rows.push({
              season: season,
              date: cleanDate(game.date),
              team: p.team,
              opp: opp,
              pts: Number(p.pts),
              reb: Number(p.reb),
              ast: Number(p.ast),
              stl: Number(p.stl),
              blk: Number(p.blk)
            });
          }
        });
      });
    });

  }catch(e){
    showError("Failed loading season files");
    return;
  }

  if(!rows.length){
    showError("No games found for: " + playerName);
    return;
  }

  buildOppFilter();
  applyFilter();
}

function buildOppFilter(){
  const teams = [...new Set(rows.map(r => r.opp))].sort();
  teams.forEach(t=>{
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    oppFilter.appendChild(opt);
  });
}

oppFilter.addEventListener("change", applyFilter);

function applyFilter(){
  const val = oppFilter.value;
  filteredRows = (val === "ALL") ? [...rows] : rows.filter(r => r.opp === val);
  render();
}

document.querySelectorAll("th[data-key]").forEach(th=>{
  th.addEventListener("click", ()=>{
    const key = th.dataset.key;
    currentSort.dir =
      (currentSort.key===key && currentSort.dir==="desc") ? "asc" : "desc";
    currentSort.key = key;

    filteredRows.sort((a,b)=>{
      if(a[key]<b[key]) return currentSort.dir==="asc"?-1:1;
      if(a[key]>b[key]) return currentSort.dir==="asc"?1:-1;
      return 0;
    });

    render();
  });
});

function render(){
  gamesBody.innerHTML="";

  let totals={pts:0,reb:0,ast:0,stl:0,blk:0};
  let highs={pts:0,reb:0,ast:0,stl:0,blk:0};

  filteredRows.forEach(r=>{
    totals.pts+=r.pts;
    totals.reb+=r.reb;
    totals.ast+=r.ast;
    totals.stl+=r.stl;
    totals.blk+=r.blk;

    highs.pts=Math.max(highs.pts,r.pts);
    highs.reb=Math.max(highs.reb,r.reb);
    highs.ast=Math.max(highs.ast,r.ast);
    highs.stl=Math.max(highs.stl,r.stl);
    highs.blk=Math.max(highs.blk,r.blk);

    gamesBody.innerHTML+=`
      <tr>
        <td>${r.season}</td>
        <td>${r.date}</td>
        <td>${r.team}</td>
        <td>${r.opp}</td>
        <td>${r.pts}</td>
        <td>${r.reb}</td>
        <td>${r.ast}</td>
        <td>${r.stl}</td>
        <td>${r.blk}</td>
      </tr>`;
  });

  const g = filteredRows.length || 1;

  totalsBoxes.innerHTML=`
    <div class="stat-box"><span>${filteredRows.length}</span>Games</div>
    <div class="stat-box"><span>${totals.pts}</span>Points</div>
    <div class="stat-box"><span>${totals.reb}</span>Rebounds</div>
    <div class="stat-box"><span>${totals.ast}</span>Assists</div>
    <div class="stat-box"><span>${totals.stl}</span>Steals</div>
    <div class="stat-box"><span>${totals.blk}</span>Blocks</div>`;

  averagesBoxes.innerHTML=`
    <div class="stat-box"><span>${(totals.pts/g).toFixed(1)}</span>Avg Pts</div>
    <div class="stat-box"><span>${(totals.reb/g).toFixed(1)}</span>Avg Reb</div>
    <div class="stat-box"><span>${(totals.ast/g).toFixed(1)}</span>Avg Ast</div>`;

  highsBoxes.innerHTML=`
    <div class="stat-box"><span>${highs.pts}</span>Career High PTS</div>
    <div class="stat-box"><span>${highs.reb}</span>Career High REB</div>
    <div class="stat-box"><span>${highs.ast}</span>Career High AST</div>
    <div class="stat-box"><span>${highs.stl}</span>Career High STL</div>
    <div class="stat-box"><span>${highs.blk}</span>Career High BLK</div>`;
}

loadPlayer();
</script>
</body>
</html>
