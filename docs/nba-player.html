<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.navbar a:hover{
  text-decoration:underline;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:28px 30px;
  margin-bottom:24px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
}

.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  flex-wrap:wrap;
}

.hero-title-wrap{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.eyebrow{
  font-size:12px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  opacity:.9;
}

#title{
  margin:0;
  font-size:42px;
  line-height:1.05;
  font-weight:800;
}

.hero-sub{
  font-size:15px;
  opacity:.95;
}

.hero-search{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.search-box{
  padding:12px 14px;
  border-radius:10px;
  border:none;
  font-size:14px;
  width:280px;
  outline:none;
}

.team-stripe{
  height:18px;
  width:180px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.25);
  margin-top:6px;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  margin-bottom:24px;
}

.section-title{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#666;
  margin-bottom:15px;
  text-transform:uppercase;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
  margin-bottom:14px;
}

.stat-box{
  background:#eef3ff;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.stat-box span{
  display:block;
  font-size:28px;
  line-height:1;
  font-weight:800;
  margin-bottom:6px;
  color:#0b3ea9;
}

.stat-box small{
  color:#666;
  font-size:12px;
  display:block;
  margin-top:4px;
  line-height:1.35;
}

.filters-bar{
  display:flex;
  flex-wrap:wrap;
  gap:12px 18px;
  align-items:center;
  margin-bottom:18px;
}

.filter-group{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  color:#003a99;
}

select{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
  background:#fff;
}

.table-wrap{
  background:#fff;
  border-radius:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  overflow:hidden;
}

.table-header{
  padding:20px 22px 10px;
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#666;
  text-transform:uppercase;
}

.table-scroll{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  min-width:900px;
}

th,td{
  padding:12px 10px;
  border-bottom:1px solid #eee;
  text-align:center;
  white-space:nowrap;
}

th{
  background:#eef3ff;
  color:#003a99;
  font-weight:800;
}

tbody tr:nth-child(even){
  background:#f8faff;
}

tbody tr:hover{
  background:#eaf2ff;
}

.clickable-row{
  cursor:pointer;
}

.name-note{
  color:#666;
  font-size:14px;
}

.empty-state{
  padding:24px;
  text-align:center;
  color:#666;
  font-weight:600;
}

@media (max-width: 800px){
  #title{
    font-size:32px;
  }

  .search-box{
    width:100%;
    max-width:100%;
  }

  .hero-search{
    width:100%;
  }
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <div class="hero-top">
      <div class="hero-title-wrap">
        <div class="eyebrow">NBA Player Career</div>
        <h1 id="title">Player</h1>
        <div class="hero-sub" id="heroSub">Career game log, totals, averages and highs</div>
        <div id="teamStripe" class="team-stripe"></div>
      </div>

      <div class="hero-search">
        <input id="playerSearch" list="playerList" class="search-box" placeholder="Search player...">
        <datalist id="playerList"></datalist>
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title">Career Summary</div>
    <div class="stats-grid" id="careerTotals"></div>
    <div class="stats-grid" id="careerAverages"></div>
    <div class="stats-grid" id="careerHighs"></div>
  </div>

  <div class="section-card">
    <div class="filters-bar">
      <div class="filter-group">
        <label for="teamFilter">Team:</label>
        <select id="teamFilter">
          <option value="ALL">All teams</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="oppFilter">Opposition:</label>
        <select id="oppFilter">
          <option value="ALL">All teams</option>
        </select>
      </div>

      <div class="name-note" id="filterNote">Filtered breakdown</div>
    </div>

    <div class="section-title">Filtered Results</div>
    <div class="stats-grid" id="oppTotals"></div>
    <div class="stats-grid" id="oppAverages"></div>
    <div class="stats-grid" id="oppHighs"></div>
  </div>

  <div class="table-wrap">
    <div class="table-header">Game Log</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Season</th>
            <th>Date</th>
            <th>Team</th>
            <th>Opp</th>
            <th>PTS</th>
            <th>REB</th>
            <th>AST</th>
            <th>STL</th>
            <th>BLK</th>
          </tr>
        </thead>
        <tbody id="gamesBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state" style="display:none;">No games found.</div>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

const titleEl = document.getElementById("title");
const heroSub = document.getElementById("heroSub");
const gamesBody = document.getElementById("gamesBody");
const teamFilter = document.getElementById("teamFilter");
const oppFilter = document.getElementById("oppFilter");
const stripe = document.getElementById("teamStripe");
const filterNote = document.getElementById("filterNote");
const emptyState = document.getElementById("emptyState");

let rows = [];
let currentTeam = "";
let playersLoaded = false;

const teamColours = {
  "Atlanta Hawks":["#E03A3E","#C1D32F"],
  "Boston Celtics":["#007A33","#BA9653"],
  "Brooklyn Nets":["#000000","#FFFFFF"],
  "Charlotte Hornets":["#1D1160","#00788C"],
  "Chicago Bulls":["#CE1141","#000000"],
  "Cleveland Cavaliers":["#860038","#FDBB30"],
  "Dallas Mavericks":["#00538C","#002B5E"],
  "Denver Nuggets":["#0E2240","#FEC524"],
  "Detroit Pistons":["#C8102E","#1D42BA"],
  "Golden State Warriors":["#1D428A","#FFC72C"],
  "Houston Rockets":["#CE1141","#000000"],
  "Indiana Pacers":["#002D62","#FDBB30"],
  "LA Clippers":["#C8102E","#1D428A"],
  "Los Angeles Lakers":["#552583","#FDB927"],
  "Memphis Grizzlies":["#5D76A9","#12173F"],
  "Miami Heat":["#98002E","#F9A01B"],
  "Milwaukee Bucks":["#00471B","#EEE1C6"],
  "Minnesota Timberwolves":["#0C2340","#236192"],
  "New Orleans Pelicans":["#0C2340","#C8102E"],
  "New York Knicks":["#006BB6","#F58426"],
  "Oklahoma City Thunder":["#007AC1","#EF3B24"],
  "Orlando Magic":["#0077C0","#C4CED4"],
  "Philadelphia 76ers":["#006BB6","#ED174C"],
  "Phoenix Suns":["#1D1160","#E56020"],
  "Portland Trail Blazers":["#E03A3E","#000000"],
  "Sacramento Kings":["#5A2D81","#63727A"],
  "San Antonio Spurs":["#C4CED4","#000000"],
  "Toronto Raptors":["#CE1141","#000000"],
  "Utah Jazz":["#002B5C","#F9A01B"],
  "Washington Wizards":["#002B5C","#E31837"]
};

function cleanName(name){
  return (name || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function slug(name){
  return cleanName(name)
    .toLowerCase()
    .replace(/[^\w\s-]/g,"")
    .replace(/\s+/g,"-");
}

function parseNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function stat(r, key){
  const map = {
    pts: ["pts", "points"],
    reb: ["reb", "rebounds"],
    ast: ["ast", "assists"],
    stl: ["stl", "steals"],
    blk: ["blk", "blocks"]
  };

  for(const k of map[key] || [key]){
    if(r[k] != null && r[k] !== ""){
      return parseNum(r[k]);
    }
  }

  return 0;
}

function normalizeRow(r){
  return {
    ...r,
    opp: r.opp || r.opponent || "",
    pts: stat(r, "pts"),
    reb: stat(r, "reb"),
    ast: stat(r, "ast"),
    stl: stat(r, "stl"),
    blk: stat(r, "blk")
  };
}

function cleanDate(d){
  return (d || "").split("T")[0];
}

function getSeason(r){
  if(r.season) return r.season;

  const d = cleanDate(r.date || r.game_date || "");
  if(!d) return "";

  const year = parseInt(d.substring(0,4),10);
  const month = parseInt(d.substring(5,7),10);

  if(month >= 10) return year;
  return year - 1;
}

function setStripe(team){
  if(teamColours[team]){
    stripe.style.background = `linear-gradient(90deg, ${teamColours[team][0]}, ${teamColours[team][1]})`;
    stripe.style.borderColor = "rgba(255,255,255,.35)";
  }else{
    stripe.style.background = "rgba(255,255,255,.25)";
    stripe.style.borderColor = "rgba(255,255,255,.35)";
  }
}

function normaliseDateValue(r){
  return cleanDate(r.date || r.game_date || "");
}

function sortRowsLatestFirst(data){
  return [...data].sort((a,b)=>{
    const da = normaliseDateValue(a);
    const db = normaliseDateValue(b);

    if(da && db && da !== db){
      return db.localeCompare(da);
    }

    const sa = parseNum(a.season);
    const sb = parseNum(b.season);
    if(sa !== sb) return sb - sa;

    return 0;
  });
}

function getLatestTeam(){
  if(!rows.length) return "";
  const sorted = sortRowsLatestFirst(rows);
  return sorted[0].team || "";
}

function isRegularOrPostseason(r){
  const team = String(r.team || "").toLowerCase();
  const opp = String(r.opp || "").toLowerCase();

  if(team === "world" || team === "usa") return false;
  if(opp === "world" || opp === "usa") return false;

  const type = String(
    r.game_type ||
    r.type ||
    r.season_type ||
    r.gameType ||
    r.seasonType ||
    ""
  ).toLowerCase();

  if(type.includes("preseason")) return false;
  if(type.includes("summer")) return false;
  if(type.includes("exhibition")) return false;
  if(type.includes("all-star")) return false;
  if(type.includes("rising")) return false;
  if(type.includes("celebrity")) return false;

  return true;
}

async function fetchJSON(paths){
  let lastError = null;

  for(const path of paths){
    try{
      const res = await fetch(path, { cache: "no-store" });
      if(res.ok){
        return await res.json();
      }
      lastError = new Error(`Failed ${path}: ${res.status}`);
    }catch(err){
      lastError = err;
    }
  }

  throw lastError || new Error("Unable to load JSON");
}

async function loadPlayers(){
  if(playersLoaded) return;

  try{
    const list = await fetchJSON([
      "/data/nba/players/index.json",
      "data/nba/players/index.json"
    ]);

    const dl = document.getElementById("playerList");
    dl.innerHTML = "";

    list.forEach(item=>{
      const name = typeof item === "string" ? item : (item.name || item.player || "");
      if(!name) return;
      const opt = document.createElement("option");
      opt.value = name;
      dl.appendChild(opt);
    });

    playersLoaded = true;
  }catch(err){
    console.error("Could not load player index", err);
  }
}

document.getElementById("playerSearch").addEventListener("change", e=>{
  const value = (e.target.value || "").trim();
  if(value){
    window.location = "nba-player.html?player=" + encodeURIComponent(value);
  }
});

async function loadPlayer(){
  if(!playerParam) return;

  const displayName = cleanName(decodeURIComponent(playerParam));
  titleEl.textContent = displayName;
  heroSub.textContent = "Career game log, totals, averages and highs for " + displayName;
  document.getElementById("playerSearch").value = "";

  try{
    const data = await fetchJSON([
      `/data/nba/players/${slug(displayName)}.json`,
      `data/nba/players/${slug(displayName)}.json`
    ]);

    rows = Array.isArray(data) ? data : (Array.isArray(data.games) ? data.games : []);
    rows = rows.map(normalizeRow);
    rows = rows.filter(r => r.team && r.opp);
    rows = rows.filter(isRegularOrPostseason);
    rows = sortRowsLatestFirst(rows);

    currentTeam = getLatestTeam();
    setStripe(currentTeam);

    buildFilters();
    renderCareer();
    renderFiltered();
    renderGames();
  }catch(err){
    console.error("Could not load player file", err);
    rows = [];
    renderCareer();
    renderFiltered();
    renderGames();
  }
}

teamFilter.addEventListener("change", ()=>{
  if(teamFilter.value === "ALL"){
    setStripe(currentTeam);
  }else{
    setStripe(teamFilter.value);
  }
  renderFiltered();
  renderGames();
});

oppFilter.addEventListener("change", ()=>{
  renderFiltered();
  renderGames();
});

function buildFilters(){
  teamFilter.innerHTML = `<option value="ALL">All teams</option>`;
  oppFilter.innerHTML = `<option value="ALL">All teams</option>`;

  const teams = [...new Set(rows.map(r => r.team).filter(Boolean))].sort();
  const opps = [...new Set(rows.map(r => r.opp).filter(Boolean))].sort();

  teams.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    teamFilter.appendChild(o);
  });

  opps.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    oppFilter.appendChild(o);
  });
}

function calcStats(data){
  let totals = { pts:0, reb:0, ast:0, stl:0, blk:0 };
  let highs = {
    pts:0, reb:0, ast:0, stl:0, blk:0,
    ptsOpp:"", rebOpp:"", astOpp:"", stlOpp:"", blkOpp:"",
    ptsDate:"", rebDate:"", astDate:"", stlDate:"", blkDate:""
  };
  let triple = 0;

  data.forEach(r=>{
    const pts = parseNum(r.pts);
    const reb = parseNum(r.reb);
    const ast = parseNum(r.ast);
    const stl = parseNum(r.stl);
    const blk = parseNum(r.blk);
    const opp = r.opp || "";
    const date = cleanDate(r.date || r.game_date || "");

    totals.pts += pts;
    totals.reb += reb;
    totals.ast += ast;
    totals.stl += stl;
    totals.blk += blk;

    if(pts > highs.pts){
      highs.pts = pts;
      highs.ptsOpp = opp;
      highs.ptsDate = date;
    }
    if(reb > highs.reb){
      highs.reb = reb;
      highs.rebOpp = opp;
      highs.rebDate = date;
    }
    if(ast > highs.ast){
      highs.ast = ast;
      highs.astOpp = opp;
      highs.astDate = date;
    }
    if(stl > highs.stl){
      highs.stl = stl;
      highs.stlOpp = opp;
      highs.stlDate = date;
    }
    if(blk > highs.blk){
      highs.blk = blk;
      highs.blkOpp = opp;
      highs.blkDate = date;
    }

    let cats = 0;
    if(pts >= 10) cats++;
    if(reb >= 10) cats++;
    if(ast >= 10) cats++;
    if(stl >= 10) cats++;
    if(blk >= 10) cats++;

    if(cats >= 3) triple++;
  });

  return { totals, highs, triple };
}

function statBox(value, label, note=""){
  return `
    <div class="stat-box">
      <span>${value}</span>
      ${label}
      ${note ? `<small>${note}</small>` : ``}
    </div>
  `;
}

function buildHighNote(date, opp){
  const parts = [];
  if(opp) parts.push(`vs ${opp}`);
  if(date) parts.push(date);
  return parts.join("<br>");
}

function renderCareer(){
  const { totals, highs, triple } = calcStats(rows);
  const g = rows.length || 1;

  document.getElementById("careerTotals").innerHTML = `
    ${statBox(rows.length, "Games")}
    ${statBox(totals.pts, "PTS")}
    ${statBox(totals.reb, "REB")}
    ${statBox(totals.ast, "AST")}
    ${statBox(totals.stl, "STL")}
    ${statBox(totals.blk, "BLK")}
    ${statBox(triple, "Triple Doubles")}
  `;

  document.getElementById("careerAverages").innerHTML = `
    ${statBox((totals.pts/g).toFixed(1), "Avg PTS")}
    ${statBox((totals.reb/g).toFixed(1), "Avg REB")}
    ${statBox((totals.ast/g).toFixed(1), "Avg AST")}
    ${statBox((totals.stl/g).toFixed(1), "Avg STL")}
    ${statBox((totals.blk/g).toFixed(1), "Avg BLK")}
  `;

  document.getElementById("careerHighs").innerHTML = `
    ${statBox(highs.pts, "Best PTS", buildHighNote(highs.ptsDate, highs.ptsOpp))}
    ${statBox(highs.reb, "Best REB", buildHighNote(highs.rebDate, highs.rebOpp))}
    ${statBox(highs.ast, "Best AST", buildHighNote(highs.astDate, highs.astOpp))}
    ${statBox(highs.stl, "Best STL", buildHighNote(highs.stlDate, highs.stlOpp))}
    ${statBox(highs.blk, "Best BLK", buildHighNote(highs.blkDate, highs.blkOpp))}
  `;
}

function getFilteredRows(){
  let filtered = [...rows];

  if(teamFilter.value !== "ALL"){
    filtered = filtered.filter(r => r.team === teamFilter.value);
  }

  if(oppFilter.value !== "ALL"){
    filtered = filtered.filter(r => r.opp === oppFilter.value);
  }

  return filtered;
}

function renderFiltered(){
  const filtered = getFilteredRows();
  const { totals, highs, triple } = calcStats(filtered);
  const g = filtered.length || 1;

  let noteParts = [];
  if(teamFilter.value !== "ALL") noteParts.push(teamFilter.value);
  if(oppFilter.value !== "ALL") noteParts.push("vs " + oppFilter.value);
  filterNote.textContent = noteParts.length ? noteParts.join(" • ") : "Filtered breakdown";

  document.getElementById("oppTotals").innerHTML = `
    ${statBox(filtered.length, "Games")}
    ${statBox(totals.pts, "PTS")}
    ${statBox(totals.reb, "REB")}
    ${statBox(totals.ast, "AST")}
    ${statBox(totals.stl, "STL")}
    ${statBox(totals.blk, "BLK")}
    ${statBox(triple, "Triple Doubles")}
  `;

  document.getElementById("oppAverages").innerHTML = `
    ${statBox((totals.pts/g).toFixed(1), "Avg PTS")}
    ${statBox((totals.reb/g).toFixed(1), "Avg REB")}
    ${statBox((totals.ast/g).toFixed(1), "Avg AST")}
    ${statBox((totals.stl/g).toFixed(1), "Avg STL")}
    ${statBox((totals.blk/g).toFixed(1), "Avg BLK")}
  `;

  document.getElementById("oppHighs").innerHTML = `
    ${statBox(highs.pts, "Best PTS", buildHighNote(highs.ptsDate, highs.ptsOpp))}
    ${statBox(highs.reb, "Best REB", buildHighNote(highs.rebDate, highs.rebOpp))}
    ${statBox(highs.ast, "Best AST", buildHighNote(highs.astDate, highs.astOpp))}
    ${statBox(highs.stl, "Best STL", buildHighNote(highs.stlDate, highs.stlOpp))}
    ${statBox(highs.blk, "Best BLK", buildHighNote(highs.blkDate, highs.blkOpp))}
  `;
}

function getGameId(r){
  return r.game_id || r.game || r.id || r.gameId || "";
}

function renderGames(){
  gamesBody.innerHTML = "";
  const filtered = getFilteredRows();

  emptyState.style.display = filtered.length ? "none" : "block";

  filtered.forEach(r=>{
    const gameId = getGameId(r);
    const cls = gameId ? "clickable-row" : "";
    const row = document.createElement("tr");
    row.className = cls;

    row.innerHTML = `
      <td>${getSeason(r)}</td>
      <td>${cleanDate(r.date || r.game_date || "")}</td>
      <td>${r.team || ""}</td>
      <td>${r.opp || ""}</td>
      <td>${parseNum(r.pts)}</td>
      <td>${parseNum(r.reb)}</td>
      <td>${parseNum(r.ast)}</td>
      <td>${parseNum(r.stl)}</td>
      <td>${parseNum(r.blk)}</td>
    `;

    if(gameId){
      row.addEventListener("click", ()=>{
        window.location = "nba-game.html?game=" + encodeURIComponent(gameId);
      });
    }

    gamesBody.appendChild(row);
  });
}

loadPlayers();
loadPlayer();
</script>

</body>
</html>
