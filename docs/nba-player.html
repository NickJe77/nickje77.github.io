<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}

.navbar{
display:flex;
justify-content:center;
gap:30px;
padding:14px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:auto;
padding:25px 20px 60px;
}

.header-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:15px;
}

.name-wrap{
display:flex;
align-items:center;
gap:14px;
}

#title{
font-size:40px;
font-weight:800;
margin:0;
}

/* TEAM BAR */

.team-bar{
display:flex;
height:22px;
border-radius:6px;
overflow:hidden;
border:1px solid #ccc;
width:180px;
}

.team-segment{
height:100%;
flex:1;
}

.search-box{
padding:10px 14px;
border-radius:10px;
border:1px solid #ccc;
font-size:14px;
width:260px;
}

.summary-container{
background:#fff;
border-radius:18px;
padding:22px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
margin-bottom:25px;
}

.section-title{
font-size:13px;
font-weight:700;
letter-spacing:1px;
color:#666;
margin-bottom:15px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:14px;
margin-bottom:16px;
}

.stat-box{
background:#eef3ff;
border-radius:14px;
padding:16px;
text-align:center;
}

.stat-box span{
display:block;
font-size:28px;
font-weight:800;
}

.filter-row{
margin-bottom:20px;
font-weight:700;
color:#003a99;
}

select{
padding:8px 14px;
border-radius:8px;
border:1px solid #ccc;
margin-right:10px;
}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
background:#fff;
border-radius:14px;
overflow:hidden;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

th{
background:#eef3ff;
}

tr:nth-child(even){
background:#f8faff;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<div class="header-row">

<div class="name-wrap">
<h1 id="title">Player</h1>
<div id="teamBar" class="team-bar"></div>
</div>

<input id="playerSearch" list="playerList" class="search-box" placeholder="Search player...">
<datalist id="playerList"></datalist>

</div>

<div class="summary-container">

<div class="section-title">CAREER SUMMARY</div>

<div class="stats-grid" id="careerTotals"></div>
<div class="stats-grid" id="careerAverages"></div>
<div class="stats-grid" id="careerHighs"></div>

</div>

<div class="summary-container">

<div class="filter-row">

Team: <select id="teamFilter">
<option value="ALL">All teams</option>
</select>

Opposition: <select id="oppFilter">
<option value="ALL">All teams</option>
</select>

</div>

<div class="section-title">FILTERED RESULTS</div>

<div class="stats-grid" id="oppTotals"></div>
<div class="stats-grid" id="oppAverages"></div>
<div class="stats-grid" id="oppHighs"></div>

</div>

<table>

<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

<script>

const params=new URLSearchParams(window.location.search);
const playerParam=params.get("player");

const titleEl=document.getElementById("title");
const gamesBody=document.getElementById("gamesBody");
const teamFilter=document.getElementById("teamFilter");
const oppFilter=document.getElementById("oppFilter");

let rows=[];

/* NBA TEAM COLOURS */

const teamColours={
"Atlanta Hawks":["#E03A3E","#C1D32F"],
"Boston Celtics":["#007A33","#BA9653"],
"Brooklyn Nets":["#000000","#FFFFFF"],
"Charlotte Hornets":["#1D1160","#00788C"],
"Chicago Bulls":["#CE1141","#000000"],
"Cleveland Cavaliers":["#860038","#FDBB30"],
"Dallas Mavericks":["#00538C","#002B5E"],
"Denver Nuggets":["#0E2240","#FEC524"],
"Detroit Pistons":["#C8102E","#1D42BA"],
"Golden State Warriors":["#1D428A","#FFC72C"],
"Houston Rockets":["#CE1141","#000000"],
"Indiana Pacers":["#002D62","#FDBB30"],
"LA Clippers":["#C8102E","#1D428A"],
"Los Angeles Lakers":["#552583","#FDB927"],
"Memphis Grizzlies":["#5D76A9","#12173F"],
"Miami Heat":["#98002E","#F9A01B"],
"Milwaukee Bucks":["#00471B","#EEE1C6"],
"Minnesota Timberwolves":["#0C2340","#236192"],
"New Orleans Pelicans":["#0C2340","#C8102E"],
"New York Knicks":["#006BB6","#F58426"],
"Oklahoma City Thunder":["#007AC1","#EF3B24"],
"Orlando Magic":["#0077C0","#C4CED4"],
"Philadelphia 76ers":["#006BB6","#ED174C"],
"Phoenix Suns":["#1D1160","#E56020"],
"Portland Trail Blazers":["#E03A3E","#000000"],
"Sacramento Kings":["#5A2D81","#63727A"],
"San Antonio Spurs":["#C4CED4","#000000"],
"Toronto Raptors":["#CE1141","#000000"],
"Utah Jazz":["#002B5C","#F9A01B"],
"Washington Wizards":["#002B5C","#E31837"]
};

function cleanName(name){
return name.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function slug(name){
return cleanName(name)
.toLowerCase()
.replace(/[^\w\s-]/g,"")
.replace(/\s+/g,"-");
}

/* BUILD TEAM BAR */

function buildTeamBar(){

const bar=document.getElementById("teamBar");
bar.innerHTML="";

let teams=[];

rows.forEach(g=>{
if(!teams.includes(g.team)){
teams.push(g.team);
}
});

teams.forEach(team=>{

if(!teamColours[team]) return;

const seg=document.createElement("div");
seg.className="team-segment";
seg.title=team;

seg.style.background=
`linear-gradient(90deg, ${teamColours[team][0]}, ${teamColours[team][1]})`;

bar.appendChild(seg);

});

}

async function loadPlayers(){

const res=await fetch("/data/nba/players/index.json");
const list=await res.json();

const dl=document.getElementById("playerList");

list.forEach(name=>{
const opt=document.createElement("option");
opt.value=name;
dl.appendChild(opt);
});

}

document.getElementById("playerSearch").addEventListener("change",e=>{
window.location="nba-player.html?player="+encodeURIComponent(e.target.value);
});

async function loadPlayer(){

if(!playerParam) return;

const displayName=cleanName(decodeURIComponent(playerParam));

titleEl.textContent=displayName;

document.getElementById("playerSearch").value="";

const res=await fetch(`/data/nba/players/${slug(displayName)}.json`);
const data=await res.json();

rows=data.games||[];

buildTeamBar();

buildFilters();
renderCareer();
renderFiltered();
renderGames();

}

function buildFilters(){

const teams=[...new Set(rows.map(r=>r.team))].sort();
const opps=[...new Set(rows.map(r=>r.opp))].sort();

teams.forEach(t=>{
let o=document.createElement("option");
o.value=t;
o.textContent=t;
teamFilter.appendChild(o);
});

opps.forEach(t=>{
let o=document.createElement("option");
o.value=t;
o.textContent=t;
oppFilter.appendChild(o);
});

}

teamFilter.addEventListener("change",()=>{
renderFiltered();
renderGames();
});

oppFilter.addEventListener("change",()=>{
renderFiltered();
renderGames();
});

function calcStats(data){

let totals={pts:0,reb:0,ast:0};
let highs={pts:0,reb:0,ast:0,ptsOpp:"",rebOpp:"",astOpp:""};
let triple=0;

data.forEach(r=>{

totals.pts+=r.pts;
totals.reb+=r.reb;
totals.ast+=r.ast;

if(r.pts>highs.pts){highs.pts=r.pts;highs.ptsOpp=r.opp;}
if(r.reb>highs.reb){highs.reb=r.reb;highs.rebOpp=r.opp;}
if(r.ast>highs.ast){highs.ast=r.ast;highs.astOpp=r.opp;}

let cats=0;

if(r.pts>=10)cats++;
if(r.reb>=10)cats++;
if(r.ast>=10)cats++;

if(cats>=3)triple++;

});

return {totals,highs,triple};

}

function renderCareer(){

const {totals,highs,triple}=calcStats(rows);

const g=rows.length||1;

document.getElementById("careerTotals").innerHTML=`
<div class="stat-box"><span>${rows.length}</span>Games</div>
<div class="stat-box"><span>${totals.pts}</span>PTS</div>
<div class="stat-box"><span>${totals.reb}</span>REB</div>
<div class="stat-box"><span>${totals.ast}</span>AST</div>
<div class="stat-box"><span>${triple}</span>Triple Doubles</div>
`;

document.getElementById("careerAverages").innerHTML=`
<div class="stat-box"><span>${(totals.pts/g).toFixed(1)}</span>Avg PTS</div>
<div class="stat-box"><span>${(totals.reb/g).toFixed(1)}</span>Avg REB</div>
<div class="stat-box"><span>${(totals.ast/g).toFixed(1)}</span>Avg AST</div>
`;

document.getElementById("careerHighs").innerHTML=`
<div class="stat-box"><span>${highs.pts}</span>Best PTS<br><small>vs ${highs.ptsOpp}</small></div>
<div class="stat-box"><span>${highs.reb}</span>Best REB<br><small>vs ${highs.rebOpp}</small></div>
<div class="stat-box"><span>${highs.ast}</span>Best AST<br><small>vs ${highs.astOpp}</small></div>
`;

}

function renderFiltered(){

let filtered=rows;

if(teamFilter.value!=="ALL"){
filtered=filtered.filter(r=>r.team===teamFilter.value);
}

if(oppFilter.value!=="ALL"){
filtered=filtered.filter(r=>r.opp===oppFilter.value);
}

const {totals,highs,triple}=calcStats(filtered);

const g=filtered.length||1;

document.getElementById("oppTotals").innerHTML=`
<div class="stat-box"><span>${filtered.length}</span>Games</div>
<div class="stat-box"><span>${totals.pts}</span>PTS</div>
<div class="stat-box"><span>${totals.reb}</span>REB</div>
<div class="stat-box"><span>${totals.ast}</span>AST</div>
<div class="stat-box"><span>${triple}</span>Triple Doubles</div>
`;

document.getElementById("oppAverages").innerHTML=`
<div class="stat-box"><span>${(totals.pts/g).toFixed(1)}</span>Avg PTS</div>
<div class="stat-box"><span>${(totals.reb/g).toFixed(1)}</span>Avg REB</div>
<div class="stat-box"><span>${(totals.ast/g).toFixed(1)}</span>Avg AST</div>
`;

document.getElementById("oppHighs").innerHTML=`
<div class="stat-box"><span>${highs.pts}</span>Best PTS<br><small>vs ${highs.ptsOpp}</small></div>
<div class="stat-box"><span>${highs.reb}</span>Best REB<br><small>vs ${highs.rebOpp}</small></div>
<div class="stat-box"><span>${highs.ast}</span>Best AST<br><small>vs ${highs.astOpp}</small></div>
`;

}

function renderGames(){

gamesBody.innerHTML="";

let filtered=rows;

if(teamFilter.value!=="ALL"){
filtered=filtered.filter(r=>r.team===teamFilter.value);
}

if(oppFilter.value!=="ALL"){
filtered=filtered.filter(r=>r.opp===oppFilter.value);
}

filtered.forEach(r=>{
gamesBody.innerHTML+=`
<tr>
<td>${r.season}</td>
<td>${r.date}</td>
<td>${r.team}</td>
<td>${r.opp}</td>
<td>${r.pts}</td>
<td>${r.reb}</td>
<td>${r.ast}</td>
<td>${r.stl}</td>
<td>${r.blk}</td>
</tr>`;
});

}

loadPlayers();
loadPlayer();

</script>

</body>
</html>
