<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
/* --- EXACT SAME STYLES (UNCHANGED) --- */
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:28px 30px;
  margin-bottom:24px;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  margin-bottom:24px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
}

.stat-box{
  background:#eef3ff;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.stat-box span{
  display:block;
  font-size:28px;
  font-weight:800;
}

.filters-bar{
  display:flex;
  gap:14px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

.table-wrap{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{
  background:#eef3ff;
}

tbody tr:nth-child(even){
  background:#f8faff;
}

.clickable-row{
  cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1 id="title">Player</h1>
    <input id="playerSearch" list="playerList" placeholder="Search player...">
    <datalist id="playerList"></datalist>
  </div>

  <div class="section-card">
    <h3>Career Summary</h3>
    <div id="careerTotals" class="stats-grid"></div>
  </div>

  <div class="section-card">
    <div class="filters-bar">
      <select id="teamFilter">
        <option value="ALL">All teams</option>
      </select>

      <select id="oppFilter">
        <option value="ALL">All opponents</option>
      </select>
    </div>

    <div id="oppTotals" class="stats-grid"></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Team</th>
          <th>Opp</th>
          <th>PTS</th>
          <th>REB</th>
          <th>AST</th>
          <th>STL</th>
          <th>BLK</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>

/* ---------- PARAM ---------- */
const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

/* ---------- ELEMENTS ---------- */
const gamesBody = document.getElementById("gamesBody");
const teamFilter = document.getElementById("teamFilter");
const oppFilter = document.getElementById("oppFilter");

let rows = [];

/* ---------- HELPERS ---------- */
function cleanName(name){
  return (name || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function slug(name){
  return cleanName(name)
    .toLowerCase()
    .replace(/[^\w\s-]/g,"")
    .replace(/\s+/g,"-");
}

function parseNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

/* 🔥 FIXED STAT MAPPER */
function stat(r, key){
  return parseNum(
    r[key] ??
    r[
      {
        pts: "points",
        reb: "rebounds",
        ast: "assists",
        stl: "steals",
        blk: "blocks"
      }[key]
    ]
  );
}

function cleanDate(d){
  return (d || "").split("T")[0];
}

/* ---------- LOAD PLAYER ---------- */
async function loadPlayer(){
  if(!playerParam) return;

  const name = decodeURIComponent(playerParam);

  document.getElementById("title").textContent = name;

  const res = await fetch(`/data/nba/players/${slug(name)}.json`);
  const data = await res.json();

  rows = data.games || [];

  buildFilters();
  renderTotals(rows);
  renderGames(rows);
}

/* ---------- FILTERS ---------- */
function buildFilters(){
  const teams = [...new Set(rows.map(r=>r.team))];
  const opps = [...new Set(rows.map(r=>r.opp))];

  teams.forEach(t=>{
    teamFilter.innerHTML += `<option>${t}</option>`;
  });

  opps.forEach(o=>{
    oppFilter.innerHTML += `<option>${o}</option>`;
  });
}

function getFiltered(){
  return rows.filter(r=>{
    return (teamFilter.value==="ALL"||r.team===teamFilter.value) &&
           (oppFilter.value==="ALL"||r.opp===oppFilter.value);
  });
}

teamFilter.onchange = ()=> renderAll();
oppFilter.onchange = ()=> renderAll();

/* ---------- RENDER ---------- */
function renderAll(){
  const f = getFiltered();
  renderTotals(f);
  renderGames(f);
}

function renderTotals(data){
  let pts=0,reb=0,ast=0;

  data.forEach(r=>{
    pts+=stat(r,"pts");
    reb+=stat(r,"reb");
    ast+=stat(r,"ast");
  });

  document.getElementById("careerTotals").innerHTML = `
    <div class="stat-box"><span>${data.length}</span>Games</div>
    <div class="stat-box"><span>${pts}</span>PTS</div>
    <div class="stat-box"><span>${reb}</span>REB</div>
    <div class="stat-box"><span>${ast}</span>AST</div>
  `;
}

function renderGames(data){
  gamesBody.innerHTML="";

  data.forEach(r=>{
    const row=document.createElement("tr");

    row.innerHTML=`
      <td>${cleanDate(r.date)}</td>
      <td>${r.team}</td>
      <td>${r.opp}</td>
      <td>${stat(r,"pts")}</td>
      <td>${stat(r,"reb")}</td>
      <td>${stat(r,"ast")}</td>
      <td>${stat(r,"stl")}</td>
      <td>${stat(r,"blk")}</td>
    `;

    gamesBody.appendChild(row);
  });
}

/* ---------- INIT ---------- */
loadPlayer();

</script>

</body>
</html>
