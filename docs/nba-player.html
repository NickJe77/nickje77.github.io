<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:20px;padding:15px;background:#fff;border-bottom:1px solid #ddd;}
.page{max-width:1100px;margin:auto;padding:20px;}
.hero{padding:25px;border-radius:12px;background:linear-gradient(90deg,#1D428A,#C8102E);color:#fff;margin-bottom:10px;}
.team-strip{height:6px;margin-bottom:20px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px;}
.stat-box{background:#fff;padding:10px;border-radius:8px;text-align:center;}
table{width:100%;border-collapse:collapse;background:#fff;}
td,th{padding:8px;border-bottom:1px solid #ddd;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page">

<div class="hero">
<h1 id="name">Loading...</h1>
</div>

<div id="teamStrip" class="team-strip"></div>

<div id="stats" class="stats"></div>

<table>
<thead>
<tr>
<th>Date</th><th>Team</th><th>Opp</th>
<th>PTS</th><th>REB</th><th>AST</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>

// normalize name safely
function clean(s){
  return (s||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"");
}

const params = new URLSearchParams(window.location.search);
const target = clean(params.get("player") || "");

// STEP 1: load index
fetch("data/nba/players/index.json")
.then(r=>r.json())
.then(list=>{

  // find correct player
  let match = list.find(p => clean(p.name) === target);

  if(!match){
    document.getElementById("name").innerText = "Player not found";
    return;
  }

  // STEP 2: load player file
  return fetch(`data/nba/players/${match.slug}.json`);

})
.then(r=>r.json())
.then(data=>{

  document.getElementById("name").innerText = data.name;

  const games = data.games || [];

  render(games);
  stats(games);
  color(games);

})
.catch(e=>{
  document.getElementById("name").innerText = "Failed to load player";
  console.log(e);
});

function get(g, keys){
  for(let k of keys){
    if(g[k] !== undefined) return g[k];
  }
  return 0;
}

function render(games){

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  games.sort((a,b)=> new Date(b.date) - new Date(a.date));

  games.forEach(g=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${g.date||""}</td>
      <td>${g.team||""}</td>
      <td>${g.opponent||""}</td>
      <td>${get(g,["pts","points"])}</td>
      <td>${get(g,["reb","rebounds"])}</td>
      <td>${get(g,["ast","assists"])}</td>
    `;

    tbody.appendChild(tr);
  });
}

function stats(games){

  let pts=0,reb=0,ast=0,td=0;

  games.forEach(g=>{
    const p=get(g,["pts","points"]);
    const r=get(g,["reb","rebounds"]);
    const a=get(g,["ast","assists"]);

    pts+=p; reb+=r; ast+=a;

    if([p,r,a].filter(x=>x>=10).length>=3) td++;
  });

  const n=games.length||1;

  document.getElementById("stats").innerHTML=`
    <div class="stat-box"><b>${(pts/n).toFixed(1)}</b>PPG</div>
    <div class="stat-box"><b>${(reb/n).toFixed(1)}</b>RPG</div>
    <div class="stat-box"><b>${(ast/n).toFixed(1)}</b>APG</div>
    <div class="stat-box"><b>${td}</b>Triple-Doubles</div>
  `;
}

function color(games){

  const map={
    "Dallas Mavericks":"#00538C",
    "Los Angeles Lakers":"#552583"
  };

  const team=games[0]?.team;
  document.getElementById("teamStrip").style.background = map[team]||"#333";
}

</script>

</body>
</html>
