<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;color:#111;}

.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}

.page-wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px;}

.hero{background:linear-gradient(90deg,#1D428A,#C8102E);color:#fff;border-radius:18px;padding:28px 30px;margin-bottom:24px;box-shadow:0 8px 24px rgba(0,0,0,.12);}

.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;}

.hero-title-wrap{display:flex;flex-direction:column;gap:8px;}

.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.9;}

#title{margin:0;font-size:42px;line-height:1.05;font-weight:800;}

.hero-sub{font-size:15px;opacity:.95;}

.hero-search{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.search-box{padding:12px 14px;border-radius:10px;border:none;font-size:14px;width:280px;outline:none;}

.section-card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:24px;}

.section-title{font-size:13px;font-weight:800;letter-spacing:1px;color:#666;margin-bottom:15px;text-transform:uppercase;}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:14px;}

.stat-box{background:#eef3ff;border-radius:14px;padding:16px;text-align:center;}
.stat-box span{display:block;font-size:28px;font-weight:800;margin-bottom:6px;color:#0b3ea9;}

.table-wrap{background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.05);overflow:hidden;}

.table-scroll{overflow-x:auto;}

table{width:100%;border-collapse:collapse;font-size:14px;}

th,td{padding:12px 10px;border-bottom:1px solid #eee;text-align:center;}

th{background:#eef3ff;color:#003a99;font-weight:800;}

tbody tr:nth-child(even){background:#f8faff;}
tbody tr:hover{background:#eaf2ff;}

.empty-state{padding:24px;text-align:center;color:#666;font-weight:600;}
</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<div class="hero">
<div class="hero-top">
<div class="hero-title-wrap">
<div class="eyebrow">NBA Player Career</div>
<h1 id="title">Player</h1>
<div class="hero-sub" id="heroSub">Career game log, totals, averages and highs</div>
</div>
</div>
</div>

<div class="section-card">
<div class="section-title">Career Summary</div>
<div class="stats-grid" id="careerTotals"></div>
<div class="stats-grid" id="careerAverages"></div>
</div>

<div class="table-wrap">

<div class="table-scroll">
<table>

<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>
</div>

<div id="emptyState" class="empty-state" style="display:none;">No games found.</div>

</div>

</div>

<script>

const params=new URLSearchParams(window.location.search)
const player=params.get("player")

const title=document.getElementById("title")
const heroSub=document.getElementById("heroSub")
const gamesBody=document.getElementById("gamesBody")
const emptyState=document.getElementById("emptyState")

let rows=[]

function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function date(d){return(d||"").split("T")[0]}

/* IMPORTANT FILTER */

function isRegularOrPostseason(r){

const team=(r.team||"").toLowerCase()
const opp=(r.opp||"").toLowerCase()

if(team==="world"||team==="usa") return false
if(opp==="world"||opp==="usa") return false

const type=String(
r.game_type||
r.type||
r.season_type||
r.gameType||
r.seasonType||
""
).toLowerCase()

if(type.includes("preseason")) return false
if(type.includes("summer")) return false
if(type.includes("exhibition")) return false
if(type.includes("all-star")) return false
if(type.includes("rising")) return false
if(type.includes("celebrity")) return false

return true
}

async function loadPlayer(){

if(!player) return

title.textContent=decodeURIComponent(player)
heroSub.textContent="Career game log for "+decodeURIComponent(player)

const slug=player.toLowerCase().replace(/[^\w\s-]/g,"").replace(/\s+/g,"-")

const res=await fetch(`/data/nba/players/${slug}.json`)
const data=await res.json()

rows=Array.isArray(data)?data:(data.games||[])

/* FILTER HERE */

rows=rows.filter(isRegularOrPostseason)

/* SORT NEWEST FIRST */

rows.sort((a,b)=>{
const da=(a.date||"").substring(0,10)
const db=(b.date||"").substring(0,10)
return db.localeCompare(da)
})

render()

}

function render(){

gamesBody.innerHTML=""

emptyState.style.display=rows.length?"none":"block"

let totals={pts:0,reb:0,ast:0,stl:0,blk:0}

rows.forEach(r=>{

totals.pts+=num(r.pts)
totals.reb+=num(r.reb)
totals.ast+=num(r.ast)
totals.stl+=num(r.stl)
totals.blk+=num(r.blk)

const tr=document.createElement("tr")

tr.innerHTML=`
<td>${r.season||""}</td>
<td>${date(r.date)}</td>
<td>${r.team}</td>
<td>${r.opp}</td>
<td>${num(r.pts)}</td>
<td>${num(r.reb)}</td>
<td>${num(r.ast)}</td>
<td>${num(r.stl)}</td>
<td>${num(r.blk)}</td>
`

gamesBody.appendChild(tr)

})

const g=rows.length||1

document.getElementById("careerTotals").innerHTML=`
<div class="stat-box"><span>${rows.length}</span>Games</div>
<div class="stat-box"><span>${totals.pts}</span>PTS</div>
<div class="stat-box"><span>${totals.reb}</span>REB</div>
<div class="stat-box"><span>${totals.ast}</span>AST</div>
<div class="stat-box"><span>${totals.stl}</span>STL</div>
<div class="stat-box"><span>${totals.blk}</span>BLK</div>
`

document.getElementById("careerAverages").innerHTML=`
<div class="stat-box"><span>${(totals.pts/g).toFixed(1)}</span>Avg PTS</div>
<div class="stat-box"><span>${(totals.reb/g).toFixed(1)}</span>Avg REB</div>
<div class="stat-box"><span>${(totals.ast/g).toFixed(1)}</span>Avg AST</div>
<div class="stat-box"><span>${(totals.stl/g).toFixed(1)}</span>Avg STL</div>
<div class="stat-box"><span>${(totals.blk/g).toFixed(1)}</span>Avg BLK</div>
`

}

loadPlayer()

</script>

</body>
</html>
