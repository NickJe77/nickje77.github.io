<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
/* ALL YOUR ORIGINAL STYLES — UNCHANGED */
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#f4f6f8;color:#111;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}
.page-wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px;}
.hero{background:linear-gradient(90deg,#1D428A,#C8102E);color:#fff;border-radius:18px;padding:28px 30px;margin-bottom:24px;box-shadow:0 8px 24px rgba(0,0,0,.12);}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;}
.hero-title-wrap{display:flex;flex-direction:column;gap:8px;}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.9;}
#title{margin:0;font-size:42px;line-height:1.05;font-weight:800;}
.hero-sub{font-size:15px;opacity:.95;}
.hero-search{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.search-box{padding:12px 14px;border-radius:10px;border:none;font-size:14px;width:280px;outline:none;}
.team-stripe{height:18px;width:180px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.25);margin-top:6px;}
.section-card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:24px;}
.section-title{font-size:13px;font-weight:800;letter-spacing:1px;color:#666;margin-bottom:15px;text-transform:uppercase;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:14px;}
.stat-box{background:#eef3ff;border-radius:14px;padding:16px;text-align:center;}
.stat-box span{display:block;font-size:28px;font-weight:800;margin-bottom:6px;color:#0b3ea9;}
.stat-box small{color:#666;font-size:12px;}
.filters-bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-bottom:18px;}
.filter-group{display:flex;align-items:center;gap:8px;font-weight:700;color:#003a99;}
select{padding:10px 12px;border-radius:10px;border:1px solid #ccc;font-size:14px;background:#fff;}
.table-wrap{background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.05);overflow:hidden;}
.table-header{padding:20px 22px 10px;font-size:13px;font-weight:800;letter-spacing:1px;color:#666;text-transform:uppercase;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:900px;}
th,td{padding:12px 10px;border-bottom:1px solid #eee;text-align:center;white-space:nowrap;}
th{background:#eef3ff;color:#003a99;font-weight:800;}
tbody tr:nth-child(even){background:#f8faff;}
tbody tr:hover{background:#eaf2ff;}
.clickable-row{cursor:pointer;}
.empty-state{padding:24px;text-align:center;color:#666;font-weight:600;}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1 id="title">Player</h1>
<input id="playerSearch" list="playerList" class="search-box">
<datalist id="playerList"></datalist>
</div>

<div class="table-wrap">
<div class="table-header">Game Log</div>
<div class="table-scroll">
<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>
<div id="emptyState" class="empty-state" style="display:none;">No games found.</div>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

const gamesBody = document.getElementById("gamesBody");
const emptyState = document.getElementById("emptyState");

let rows = [];

function cleanName(name){
  return (name || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function slug(name){
  return cleanName(name).toLowerCase().replace(/[^a-z0-9\s-]/g,"").replace(/\s+/g,"-");
}

function parseNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function normalizeRow(r){
  return {
    ...r,
    opp: r.opp || r.opponent || "",
    date: r.date || r.game_date || r.gameDate || "",
    pts: parseNum(r.pts || r.points),
    reb: parseNum(r.reb || r.rebounds),
    ast: parseNum(r.ast || r.assists),
    stl: parseNum(r.stl || r.steals),
    blk: parseNum(r.blk || r.blocks)
  };
}

function cleanDate(d){
  return (d || "").split("T")[0];
}

function getGameId(r){
  return r.game_id || r.game || r.id || r.gameId || "";
}

function sortRowsLatestFirst(data){
  return [...data].sort((a,b)=>{
    const da = cleanDate(a.date);
    const db = cleanDate(b.date);

    if(da && db && da !== db){
      return db.localeCompare(da);
    }

    const ga = String(getGameId(a));
    const gb = String(getGameId(b));

    return gb.localeCompare(ga);
  });
}

async function fetchJSON(paths){
  for(const path of paths){
    try{
      const res = await fetch(path);
      if(res.ok) return await res.json();
    }catch{}
  }
  throw new Error("fail");
}

async function loadPlayer(){
  if(!playerParam) return;

  const name = cleanName(decodeURIComponent(playerParam));

  try{
    const data = await fetchJSON([
      `/data/nba/players/${slug(name)}.json`,
      `data/nba/players/${slug(name)}.json`
    ]);

    rows = (Array.isArray(data) ? data : data.games || [])
      .map(normalizeRow)
      .filter(r => r.team || r.opp);   // 🔥 FIXED (NO DATA LOSS)

    rows = sortRowsLatestFirst(rows);

    renderGames();

  }catch(err){
    rows = [];
    renderGames();
  }
}

function renderGames(){
  gamesBody.innerHTML = "";
  emptyState.style.display = rows.length ? "none" : "block";

  rows.forEach(r=>{
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${r.season || ""}</td>
      <td>${cleanDate(r.date)}</td>
      <td>${r.team || ""}</td>
      <td>${r.opp || ""}</td>
      <td>${r.pts}</td>
      <td>${r.reb}</td>
      <td>${r.ast}</td>
      <td>${r.stl}</td>
      <td>${r.blk}</td>
    `;

    gamesBody.appendChild(row);
  });
}

loadPlayer();
</script>

</body>
</html>
