<script>

/* =========================
   🔥 ADD THIS AT VERY END ONLY
========================= */

(async function safeAwardsLoader(){

  function slugFix(name){
    return (name || "")
      .toLowerCase()
      .replace(/[^\w\s-]/g,"")
      .replace(/\s+/g,"-")
      .trim();
  }

  function parseCSVLine(line){
    const out = [];
    let cur = "";
    let inQuotes = false;

    for(let i=0;i<line.length;i++){
      const ch = line[i];
      const next = line[i+1];

      if(ch === '"'){
        if(inQuotes && next === '"'){
          cur += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if(ch === "," && !inQuotes){
        out.push(cur.trim());
        cur = "";
      } else {
        cur += ch;
      }
    }

    out.push(cur.trim());
    return out;
  }

  async function loadAwards(){
    try{
      const res = await fetch("/docs/data/nba/nba_awards.csv");
      if(!res.ok) return [];

      const text = await res.text();
      const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);

      const headers = parseCSVLine(lines[0]).map(h=>h.toLowerCase());

      const data = [];

      lines.slice(1).forEach(line=>{
        const values = parseCSVLine(line);
        while(values.length < headers.length) values.push("");

        const year = values[0];

        for(let i=1;i<headers.length;i++){
          const player = values[i];
          if(!player) continue;

          data.push({
            player: player.trim(),
            award: headers[i].toUpperCase(),
            year
          });
        }
      });

      return data;

    }catch(e){
      console.log("Awards error", e);
      return [];
    }
  }

  function renderAwardsSafe(data){
    const card = document.getElementById("awardsCard");
    const container = document.getElementById("awardsContent");
    const title = document.getElementById("title");

    if(!card || !container || !title) return;

    const playerSlug = slugFix(title.textContent);

    const awards = data.filter(a =>
      slugFix(a.player) === playerSlug
    );

    if(!awards.length){
      card.style.display = "none";
      return;
    }

    card.style.display = "block";

    const grouped = {};

    awards.forEach(a=>{
      if(!grouped[a.award]) grouped[a.award] = [];
      grouped[a.award].push(a.year);
    });

    container.innerHTML = `
      <div class="awards-grid">
        ${Object.keys(grouped).map(a => `
          <div class="award-box">
            <div class="award-name">${a}</div>
            <div>${grouped[a].sort((x,y)=>y-x).join(", ")}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

  /* 🔥 WAIT UNTIL YOUR PAGE FINISHES EVERYTHING */
  window.addEventListener("load", async ()=>{
    const data = await loadAwards();
    setTimeout(()=>renderAwardsSafe(data), 100);
  });

})();
</script>

</body>
