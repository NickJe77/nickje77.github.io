<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#ffffff;}

.navbar{
display:flex;
justify-content:center;
gap:30px;
padding:14px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1200px;margin:0 auto;padding:20px;}

.hero{
background:linear-gradient(90deg,#1D428A,#C8102E);
color:white;
padding:24px 30px;
border-radius:14px;
margin-bottom:20px;
}

.team-bar{
height:6px;
border-radius:4px;
margin-top:10px;
background:#17408B;
}

.stat-section{margin:18px 0;}
.stat-title{font-weight:700;margin-bottom:8px;}

.stats-row{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-bottom:10px;
}

.stat-box{
background:#eef3ff;
padding:10px 16px;
border-radius:10px;
text-align:center;
min-width:110px;
}

.stat-box span{
display:block;
font-size:20px;
font-weight:700;
}

.filter-row{
margin:20px 0;
font-weight:600;
color:#003a99;
}

select{
padding:8px 14px;
font-size:14px;
border-radius:8px;
border:1px solid #ccc;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
font-size:14px;
}

th,td{
padding:8px 10px;
border-bottom:1px solid #ddd;
text-align:center;
}

th{background:#eef3ff;font-weight:700;}

tr:nth-child(even){background:#f6f9ff;}

tr.clickable{cursor:pointer;}
tr.clickable:hover{background:#e6f0ff;}

.bad{
background:#ffe1e1;
color:#900;
padding:10px;
text-align:center;
border-radius:6px;
margin-top:12px;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1 id="title">Player</h1>
<div class="team-bar"></div>
</div>

<div id="errorBox" class="bad" style="display:none;"></div>

<!-- CAREER STATS -->
<div class="stat-section">
<div class="stat-title">Career Totals</div>
<div class="stats-row" id="careerTotals"></div>
</div>

<div class="stat-section">
<div class="stat-title">Career Averages</div>
<div class="stats-row" id="careerAverages"></div>
</div>

<div class="stat-section">
<div class="stat-title">Career Bests</div>
<div class="stats-row" id="careerHighs"></div>
</div>

<!-- OPP FILTER -->
<div class="filter-row">
Opposition:
<select id="oppFilter">
<option value="ALL">All teams</option>
</select>
</div>

<!-- OPP STATS -->
<div class="stat-section">
<div class="stat-title">Vs Selected Opposition</div>
<div class="stats-row" id="oppTotals"></div>
<div class="stats-row" id="oppAverages"></div>
<div class="stats-row" id="oppHighs"></div>
</div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>

</div>

<script>
// KEEPING YOUR ORIGINAL FETCH LOGIC

const params=new URLSearchParams(window.location.search);
const playerName=decodeURIComponent(params.get("player")||"");

const titleEl=document.getElementById("title");
const errorBox=document.getElementById("errorBox");
const gamesBody=document.getElementById("gamesBody");
const oppFilter=document.getElementById("oppFilter");

let rows=[];
let filteredRows=[];

const START_SEASON=1976;
const END_SEASON=new Date().getFullYear();

async function loadPlayer(){

if(!playerName){
errorBox.style.display="block";
errorBox.textContent="Missing ?player=";
return;
}

titleEl.textContent=playerName;

for(let season=START_SEASON;season<=END_SEASON;season++){

try{
const indexRes=await fetch(`data/nba/${season}/index.json`);
if(!indexRes.ok) continue;

const index=await indexRes.json();

for(const id of index.games){

try{
const gameRes=await fetch(`data/nba/${season}/${id}.json`);
if(!gameRes.ok) continue;

const game=await gameRes.json();

if(game.game_type!=="Regular Season" && game.game_type!=="Playoffs") continue;

for(const p of game.players||[]){

const name=p.player_name||p.player||p.name||"";

if(name.toLowerCase().trim()===playerName.toLowerCase().trim()){

const isHome=game.home_team===p.team;
const opp=isHome?game.away_team:game.home_team;

rows.push({
season:game.season,
date:game.date,
team:p.team,
opp,
pts:p.points||0,
reb:p.rebounds||0,
ast:p.assists||0,
stl:p.steals||0,
blk:p.blocks||0
});
}
}

}catch(e){}
}

}catch(e){}
}

if(!rows.length){
errorBox.style.display="block";
errorBox.textContent="No games found.";
return;
}

buildOppFilter();
render();
}

function buildOppFilter(){
const teams=[...new Set(rows.map(r=>r.opp))].sort();
teams.forEach(t=>{
const opt=document.createElement("option");
opt.value=t;
opt.textContent=t;
oppFilter.appendChild(opt);
});
}

oppFilter.addEventListener("change",render);

function render(){

const selected=(oppFilter.value==="ALL")
? rows
: rows.filter(r=>r.opp===oppFilter.value);

gamesBody.innerHTML="";

let totals={pts:0,reb:0,ast:0};
let highs={pts:0,reb:0,ast:0};

for(const r of rows){
totals.pts+=r.pts;
totals.reb+=r.reb;
totals.ast+=r.ast;

highs.pts=Math.max(highs.pts,r.pts);
highs.reb=Math.max(highs.reb,r.reb);
highs.ast=Math.max(highs.ast,r.ast);
}

const g=rows.length||1;

document.getElementById("careerTotals").innerHTML=`
<div class="stat-box"><span>${rows.length}</span>Games</div>
<div class="stat-box"><span>${totals.pts}</span>PTS</div>
<div class="stat-box"><span>${totals.reb}</span>REB</div>
<div class="stat-box"><span>${totals.ast}</span>AST</div>
`;

document.getElementById("careerAverages").innerHTML=`
<div class="stat-box"><span>${(totals.pts/g).toFixed(1)}</span>Avg PTS</div>
<div class="stat-box"><span>${(totals.reb/g).toFixed(1)}</span>Avg REB</div>
<div class="stat-box"><span>${(totals.ast/g).toFixed(1)}</span>Avg AST</div>
`;

document.getElementById("careerHighs").innerHTML=`
<div class="stat-box"><span>${highs.pts}</span>Best PTS</div>
<div class="stat-box"><span>${highs.reb}</span>Best REB</div>
<div class="stat-box"><span>${highs.ast}</span>Best AST</div>
`;

// OPP stats
let oTotals={pts:0,reb:0,ast:0};
let oHighs={pts:0,reb:0,ast:0};

for(const r of selected){
oTotals.pts+=r.pts;
oTotals.reb+=r.reb;
oTotals.ast+=r.ast;

oHighs.pts=Math.max(oHighs.pts,r.pts);
oHighs.reb=Math.max(oHighs.reb,r.reb);
oHighs.ast=Math.max(oHighs.ast,r.ast);
}

const og=selected.length||1;

document.getElementById("oppTotals").innerHTML=`
<div class="stat-box"><span>${selected.length}</span>Games</div>
<div class="stat-box"><span>${oTotals.pts}</span>PTS</div>
<div class="stat-box"><span>${oTotals.reb}</span>REB</div>
<div class="stat-box"><span>${oTotals.ast}</span>AST</div>
`;

document.getElementById("oppAverages").innerHTML=`
<div class="stat-box"><span>${(oTotals.pts/og).toFixed(1)}</span>Avg PTS</div>
<div class="stat-box"><span>${(oTotals.reb/og).toFixed(1)}</span>Avg REB</div>
<div class="stat-box"><span>${(oTotals.ast/og).toFixed(1)}</span>Avg AST</div>
`;

document.getElementById("oppHighs").innerHTML=`
<div class="stat-box"><span>${oHighs.pts}</span>Best PTS</div>
<div class="stat-box"><span>${oHighs.reb}</span>Best REB</div>
<div class="stat-box"><span>${oHighs.ast}</span>Best AST</div>
`;

selected.forEach(r=>{
gamesBody.innerHTML+=`
<tr class="clickable" onclick="window.location='nba-game.html?season=${r.season}&date=${r.date}'">
<td>${r.season}</td>
<td>${r.date}</td>
<td>${r.team}</td>
<td>${r.opp}</td>
<td>${r.pts}</td>
<td>${r.reb}</td>
<td>${r.ast}</td>
<td>${r.stl}</td>
<td>${r.blk}</td>
</tr>`;
});

}

loadPlayer();
</script>

</body>
</html>
