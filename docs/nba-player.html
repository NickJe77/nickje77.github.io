<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}

.navbar{
  display:flex;justify-content:center;gap:22px;
  padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;
}

.page-wrap{max-width:1200px;margin:auto;padding:28px 20px 60px;}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;border-radius:18px;padding:26px;margin-bottom:10px;
}

.team-strip{
  height:6px;border-radius:0 0 18px 18px;margin-bottom:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:12px;margin-bottom:20px;
}

.stat-box{
  background:#fff;border-radius:10px;padding:12px;text-align:center;
}

.stat-box b{font-size:20px;display:block;}

.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}

select,input{padding:8px;border-radius:8px;border:1px solid #ccc;}

table{width:100%;border-collapse:collapse;background:#fff;}
th,td{padding:10px;border-bottom:1px solid #ddd;}
tr:nth-child(even){background:#f0f6ff;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1 id="playerName">Loading...</h1>
</div>

<div id="teamStrip" class="team-strip"></div>

<div class="stats" id="stats"></div>

<div class="controls">
<select id="teamFilter"><option value="all">All Teams</option></select>
<select id="oppFilter"><option value="all">All Opponents</option></select>
</div>

<table>
<thead>
<tr>
<th>Date</th><th>Team</th><th>Opp</th>
<th>PTS</th><th>REB</th><th>AST</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const slug = params.get("player");

let data = null;

fetch(`docs/data/nba/players/${slug}.json`)
.then(r=>r.json())
.then(p=>{

  data = p;
  document.getElementById("playerName").innerText = p.name || slug;

  const games = p.games || [];

  buildFilters(games);
  render(games);
  buildStats(games);
  setTeamColor(games);

})
.catch(()=>{
  document.getElementById("playerName").innerText = "Failed to load player";
});

function get(g, keys){
  for(let k of keys){
    if(g[k] !== undefined) return g[k];
  }
  return 0;
}

function buildFilters(games){

  const tSet=new Set(), oSet=new Set();

  games.forEach(g=>{
    tSet.add(get(g,["team"]));
    oSet.add(get(g,["opponent"]));
  });

  const tSel=document.getElementById("teamFilter");
  const oSel=document.getElementById("oppFilter");

  tSet.forEach(t=>{
    const o=document.createElement("option");
    o.value=t;o.textContent=t;tSel.appendChild(o);
  });

  oSet.forEach(t=>{
    const o=document.createElement("option");
    o.value=t;o.textContent=t;oSel.appendChild(o);
  });

  tSel.onchange=()=>render(games);
  oSel.onchange=()=>render(games);
}

function render(games){

  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  const tVal=document.getElementById("teamFilter").value;
  const oVal=document.getElementById("oppFilter").value;

  games
  .filter(g=>{
    return (tVal==="all"||g.team===tVal) &&
           (oVal==="all"||g.opponent===oVal);
  })
  .sort((a,b)=> new Date(b.date)-new Date(a.date))
  .forEach(g=>{

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${g.date}</td>
      <td>${g.team}</td>
      <td>${g.opponent}</td>
      <td>${get(g,["pts","points"])}</td>
      <td>${get(g,["reb","rebounds"])}</td>
      <td>${get(g,["ast","assists"])}</td>
    `;

    tbody.appendChild(tr);
  });
}

function buildStats(games){

  let pts=0,reb=0,ast=0,td=0;

  games.forEach(g=>{
    const p=get(g,["pts","points"]);
    const r=get(g,["reb","rebounds"]);
    const a=get(g,["ast","assists"]);

    pts+=p; reb+=r; ast+=a;

    if([p,r,a].filter(x=>x>=10).length>=3) td++;
  });

  const n=games.length||1;

  const html=`
    <div class="stat-box"><b>${(pts/n).toFixed(1)}</b>PPG</div>
    <div class="stat-box"><b>${(reb/n).toFixed(1)}</b>RPG</div>
    <div class="stat-box"><b>${(ast/n).toFixed(1)}</b>APG</div>
    <div class="stat-box"><b>${td}</b>Triple-Doubles</div>
  `;

  document.getElementById("stats").innerHTML=html;
}

function setTeamColor(games){

  const colors={
    "Dallas Mavericks":"#00538C",
    "Los Angeles Lakers":"#552583",
    "Phoenix Suns":"#E56020"
  };

  const team=games[0]?.team;
  const color=colors[team]||"#333";

  document.getElementById("teamStrip").style.background=color;
}

</script>

</body>
</html>
