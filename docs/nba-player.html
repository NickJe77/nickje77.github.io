<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  padding:28px;
  border-radius:18px;
  margin-bottom:24px;
}

.hero h1{
  margin:0;
  font-size:40px;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  margin-bottom:24px;
}

.section-title{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#666;
  margin-bottom:15px;
  text-transform:uppercase;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
}

.stat-box{
  background:#eef3ff;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.stat-box span{
  font-size:28px;
  font-weight:800;
  display:block;
}

.table-wrap{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px 10px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{
  background:#eef3ff;
  font-weight:800;
}

tbody tr:nth-child(even){
  background:#f8faff;
}

.clickable-row{
  cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1 id="title">Player</h1>
</div>

<div class="section-card">
<div class="section-title">Career Totals</div>
<div class="stats-grid" id="careerTotals"></div>
</div>

<div class="section-card">
<div class="section-title">Career Averages</div>
<div class="stats-grid" id="careerAverages"></div>
</div>

<div class="section-card">
<div class="section-title">Career Highs</div>
<div class="stats-grid" id="careerHighs"></div>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

const titleEl = document.getElementById("title");
const gamesBody = document.getElementById("gamesBody");

let rows = [];

function slug(name){
  return name.toLowerCase()
  .replace(/[^\w\s-]/g,"")
  .replace(/\s+/g,"-");
}

function parseNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function getSeason(r){

  if(r.season) return r.season;

  const d=(r.date||"").split("T")[0];
  if(!d) return "";

  const year=parseInt(d.substring(0,4));
  const month=parseInt(d.substring(5,7));

  if(month>=10) return year;
  return year-1;
}

function calcStats(data){

let totals={pts:0,reb:0,ast:0,stl:0,blk:0};
let highs={pts:0,reb:0,ast:0,stl:0,blk:0};

data.forEach(r=>{

const pts=parseNum(r.pts);
const reb=parseNum(r.reb);
const ast=parseNum(r.ast);
const stl=parseNum(r.stl);
const blk=parseNum(r.blk);

totals.pts+=pts;
totals.reb+=reb;
totals.ast+=ast;
totals.stl+=stl;
totals.blk+=blk;

if(pts>highs.pts) highs.pts=pts;
if(reb>highs.reb) highs.reb=reb;
if(ast>highs.ast) highs.ast=ast;
if(stl>highs.stl) highs.stl=stl;
if(blk>highs.blk) highs.blk=blk;

});

return {totals,highs};

}

function renderCareer(){

const {totals,highs}=calcStats(rows);
const g=rows.length||1;

document.getElementById("careerTotals").innerHTML=`
<div class="stat-box"><span>${rows.length}</span>Games</div>
<div class="stat-box"><span>${totals.pts}</span>PTS</div>
<div class="stat-box"><span>${totals.reb}</span>REB</div>
<div class="stat-box"><span>${totals.ast}</span>AST</div>
<div class="stat-box"><span>${totals.stl}</span>STL</div>
<div class="stat-box"><span>${totals.blk}</span>BLK</div>
`;

document.getElementById("careerAverages").innerHTML=`
<div class="stat-box"><span>${(totals.pts/g).toFixed(1)}</span>PTS</div>
<div class="stat-box"><span>${(totals.reb/g).toFixed(1)}</span>REB</div>
<div class="stat-box"><span>${(totals.ast/g).toFixed(1)}</span>AST</div>
<div class="stat-box"><span>${(totals.stl/g).toFixed(1)}</span>STL</div>
<div class="stat-box"><span>${(totals.blk/g).toFixed(1)}</span>BLK</div>
`;

document.getElementById("careerHighs").innerHTML=`
<div class="stat-box"><span>${highs.pts}</span>PTS</div>
<div class="stat-box"><span>${highs.reb}</span>REB</div>
<div class="stat-box"><span>${highs.ast}</span>AST</div>
<div class="stat-box"><span>${highs.stl}</span>STL</div>
<div class="stat-box"><span>${highs.blk}</span>BLK</div>
`;

}

function renderGames(){

gamesBody.innerHTML="";

rows.forEach(r=>{

if(!r.team || !r.opp) return;

const row=document.createElement("tr");

row.innerHTML=`
<td>${getSeason(r)}</td>
<td>${(r.date||"").split("T")[0]}</td>
<td>${r.team||""}</td>
<td>${r.opp||""}</td>
<td>${parseNum(r.pts)}</td>
<td>${parseNum(r.reb)}</td>
<td>${parseNum(r.ast)}</td>
<td>${parseNum(r.stl)}</td>
<td>${parseNum(r.blk)}</td>
`;

gamesBody.appendChild(row);

});

}

async function loadPlayer(){

if(!playerParam) return;

const name=decodeURIComponent(playerParam);
titleEl.textContent=name;

const res=await fetch(`/data/nba/players/${slug(name)}.json`);
const data=await res.json();

rows=Array.isArray(data.games)?data.games:[];

renderCareer();
renderGames();

}

loadPlayer();

</script>

</body>
</html>
