<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.page-wrap{
  max-width:1200px;
  margin:auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:26px;
  margin-bottom:24px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

select,input{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

tr:nth-child(even){
  background:#f0f6ff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
</div>

<div class="controls">
  <input id="playerSearch" list="players" placeholder="Search player...">
  <datalist id="players"></datalist>

  <select id="teamFilter">
    <option value="all">All Teams</option>
  </select>

  <select id="oppFilter">
    <option value="all">All Opponents</option>
  </select>
</div>

<table id="gamesTable">
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

// 🔥 ONLY FIX — NORMALISE SLUG (THIS IS WHAT BROKE YOUR PAGE)
function fixSlug(s){
  return (s || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

const params = new URLSearchParams(window.location.search);
const slug = fixSlug(params.get("player"));

// EVERYTHING BELOW IS YOUR ORIGINAL LOGIC — NOT CHANGED

let playerData = null;

async function loadPlayer(){

  if(!slug) return;

  try{
    const res = await fetch(`docs/data/nba/players/${slug}.json`);
    playerData = await res.json();

    document.getElementById("playerName").innerText = playerData.name;

    buildFilters();
    renderGames();

  }catch(e){
    document.getElementById("playerName").innerText = "Failed to load player";
  }
}

function buildFilters(){

  const teamSet = new Set();
  const oppSet = new Set();

  (playerData.games || []).forEach(g=>{
    teamSet.add(g.team);
    oppSet.add(g.opponent);
  });

  const tSel = document.getElementById("teamFilter");
  const oSel = document.getElementById("oppFilter");

  teamSet.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    tSel.appendChild(o);
  });

  oppSet.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    oSel.appendChild(o);
  });

  tSel.onchange = renderGames;
  oSel.onchange = renderGames;
}

function renderGames(){

  const tbody = document.querySelector("#gamesTable tbody");
  tbody.innerHTML = "";

  let games = playerData.games || [];

  games.sort((a,b)=> new Date(b.date) - new Date(a.date));

  games.forEach(g=>{

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${g.season}</td>
      <td>${g.date}</td>
      <td>${g.team}</td>
      <td>${g.opponent}</td>
      <td>${g.pts}</td>
      <td>${g.reb}</td>
      <td>${g.ast}</td>
      <td>${g.stl}</td>
      <td>${g.blk}</td>
    `;

    tbody.appendChild(tr);
  });

}

loadPlayer();

</script>

</body>
</html>
