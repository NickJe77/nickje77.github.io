<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:28px 30px;
  margin-bottom:24px;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  margin-bottom:24px;
}

.section-title{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#666;
  margin-bottom:15px;
  text-transform:uppercase;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
}

.stat-box{
  background:#eef3ff;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.table-wrap{
  background:#fff;
  border-radius:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:12px 10px;
  border-bottom:1px solid #eee;
  text-align:center;
}

tbody tr:nth-child(even){
  background:#f8faff;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <h1 id="title">Player</h1>
  </div>

  <!-- CAREER -->
  <div class="section-card">
    <div class="section-title">Career Summary</div>
    <div class="stats-grid" id="careerTotals"></div>
  </div>

  <!-- FILTERED -->
  <div class="section-card">
    <div class="section-title">Filtered Results</div>
    <div class="stats-grid" id="oppTotals"></div>
  </div>

  <!-- 🔥 AWARDS (NEW) -->
  <div class="section-card" id="awardsCard" style="display:none;">
    <div class="section-title">Awards</div>
    <div id="awardsContent"></div>
  </div>

  <!-- GAME LOG -->
  <div class="table-wrap">
    <div class="section-title" style="padding:20px;">Game Log</div>
    <table>
      <thead>
        <tr>
          <th>Season</th>
          <th>Date</th>
          <th>Team</th>
          <th>Opp</th>
          <th>PTS</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>

let rows = [];
let awardsData = [];

function slug(name){
  return (name || "")
    .toLowerCase()
    .replace(/[^\w\s-]/g,"")
    .replace(/\s+/g,"-");
}

/* =========================
   LOAD AWARDS CSV
========================= */
async function loadAwardsCSV(){
  try{
    const res = await fetch("/data/nba/nba_awards.csv");
    const text = await res.text();

    const lines = text.split("\n").map(l => l.trim()).filter(l => l);
    const headers = lines[0].split(",").map(h => h.trim().toLowerCase());

    awardsData = lines.slice(1).map(line => {
      const values = line.split(",").map(v => v.trim());
      let obj = {};
      headers.forEach((h,i)=> obj[h] = values[i] || "");
      return obj;
    });

  }catch(e){
    awardsData = [];
  }
}

/* =========================
   MATCH PLAYER
========================= */
function getPlayerAwards(playerSlug){
  return awardsData.filter(a => slug(a.player) === playerSlug);
}

/* =========================
   RENDER AWARDS
========================= */
function renderAwards(playerSlug){
  const card = document.getElementById("awardsCard");
  const container = document.getElementById("awardsContent");

  const awards = getPlayerAwards(playerSlug);

  if(!awards.length){
    card.style.display = "none";
    return;
  }

  card.style.display = "block";

  const grouped = {};

  awards.forEach(a=>{
    if(!grouped[a.award]) grouped[a.award] = [];
    grouped[a.award].push(a.year);
  });

  let html = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;">`;

  Object.keys(grouped).forEach(award=>{
    html += `
      <div style="background:#eef3ff;border-radius:12px;padding:12px;">
        <strong>${award}</strong><br>
        ${grouped[award].sort((a,b)=>b-a).join(", ")}
      </div>
    `;
  });

  html += `</div>`;

  container.innerHTML = html;
}

/* =========================
   LOAD PLAYER
========================= */
async function loadPlayer(){

  const params = new URLSearchParams(window.location.search);
  const playerParam = params.get("player");

  if(!playerParam) return;

  document.getElementById("title").textContent = playerParam.replace(/-/g," ");

  const res = await fetch(`/data/nba/players/${playerParam}.json`);
  const data = await res.json();

  rows = data;

  await loadAwardsCSV();

  renderAwards(playerParam); // 🔥 HERE

  const body = document.getElementById("gamesBody");

  rows.forEach(r=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.season}</td>
      <td>${r.date}</td>
      <td>${r.team}</td>
      <td>${r.opp}</td>
      <td>${r.pts}</td>
    `;
    body.appendChild(tr);
  });
}

loadPlayer();

</script>

</body>
</html>
