<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:6px;}
.subtitle{text-align:center;color:#666;margin-bottom:12px;}

.filters{
  text-align:center;
  margin-bottom:20px;
}
select{
  padding:8px 14px;
  font-size:15px;
}

.stats{
  display:flex;
  gap:20px;
  justify-content:center;
  margin-bottom:30px;
}
.stat{
  background:#f4f6fb;
  padding:12px 18px;
  border-radius:10px;
  text-align:center;
}
.stat b{display:block;font-size:18px;}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:center;
}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="playerName"></h1>
<div class="subtitle">Career Game Log</div>

<!-- OPPOSITION FILTER -->
<div class="filters">
  <select id="oppositionFilter">
    <option value="">All Opponents</option>
  </select>
</div>

<div class="stats">
  <div class="stat"><b id="games">0</b>Games</div>
  <div class="stat"><b id="points">0</b>Points</div>
  <div class="stat"><b id="rebounds">0</b>Rebounds</div>
  <div class="stat"><b id="assists">0</b>Assists</div>
</div>

<table>
<thead>
<tr>
  <th>Season</th>
  <th>Date</th>
  <th>Game</th>
  <th>MIN</th>
  <th>PTS</th>
  <th>REB</th>
  <th>AST</th>
  <th>STL</th>
  <th>BLK</th>
  <th>TO</th>
  <th>PF</th>
</tr>
</thead>
<tbody id="logTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const player = params.get("player");

document.getElementById("playerName").textContent = player;

const oppositionSelect = document.getElementById("oppositionFilter");
const logTable = document.getElementById("logTable");

const seasonFiles = [
  "nba_season_1976_77.json",
  "nba_season_1977_78.json",
  "nba_season_1978_79.json",
  "nba_season_1979_80.json",
  "nba_season_2023_24.json"
];

let allGames = [];

/* DATE FIX */
function cleanDate(raw){
  if(!raw) return "";
  let cleaned = raw.replace(/^t\s*/i, "Oct ");
  const parsed = new Date(cleaned);
  if(!isNaN(parsed)){
    return parsed.toLocaleDateString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });
  }
  return cleaned;
}

async function loadPlayer(){
  const opponents = new Set();

  for(const file of seasonFiles){
    try{
      const res = await fetch("data/nba/" + file);
      const data = await res.json();

      data.games.forEach(g=>{
        g.players.forEach(p=>{
          if(p.player === player){

            const opponent =
              g.home_team === p.team
                ? g.away_team
                : g.home_team;

            opponents.add(opponent);

            allGames.push({
              season: data.season,
              date: cleanDate(g.date),
              game: g.home_team + " vs " + g.away_team,
              opponent: opponent,
              min: p.min || "",
              pts: p.pts || 0,
              reb: p.reb || 0,
              ast: p.ast || 0,
              stl: p.stl || 0,
              blk: p.blk || 0,
              to: p.to || 0,
              pf: p.pf || 0
            });
          }
        });
      });

    }catch(e){}
  }

  opponents.forEach(team=>{
    const o=document.createElement("option");
    o.value=team;
    o.textContent=team;
    oppositionSelect.appendChild(o);
  });

  renderTable();
}

function renderTable(){
  const opponentVal = oppositionSelect.value;

  logTable.innerHTML="";

  let games=0, pts=0, reb=0, ast=0;

  allGames
    .filter(g=>{
      return !opponentVal || g.opponent === opponentVal;
    })
    .forEach(g=>{
      games++;
      pts+=g.pts;
      reb+=g.reb;
      ast+=g.ast;

      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${g.season}</td>
        <td>${g.date}</td>
        <td>${g.game}</td>
        <td>${g.min}</td>
        <td>${g.pts}</td>
        <td>${g.reb}</td>
        <td>${g.ast}</td>
        <td>${g.stl}</td>
        <td>${g.blk}</td>
        <td>${g.to}</td>
        <td>${g.pf}</td>
      `;
      logTable.appendChild(tr);
    });

  document.getElementById("games").textContent = games;
  document.getElementById("points").textContent = pts;
  document.getElementById("rebounds").textContent = reb;
  document.getElementById("assists").textContent = ast;
}

oppositionSelect.addEventListener("change",renderTable);

loadPlayer();
</script>

</body>
</html>
