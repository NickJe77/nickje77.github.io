<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Debug</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;margin:20px;background:#f4f6f8;}
pre{background:#000;color:#0f0;padding:15px;overflow:auto;height:400px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
td,th{border:1px solid #ccc;padding:6px;}
</style>
</head>
<body>

<h1 id="title">Loading...</h1>

<h3>RAW JSON (proves data is loading)</h3>
<pre id="raw"></pre>

<h3>Parsed Games</h3>
<table>
<thead>
<tr>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>

const params = new URLSearchParams(window.location.search);
const slug = params.get("player");

const path = `docs/data/nba/players/${slug}.json`;

document.getElementById("title").innerText = path;

// 🔥 FETCH
fetch(path)
.then(r=>{
  if(!r.ok){
    throw new Error("404 / BAD PATH");
  }
  return r.json();
})
.then(data=>{

  console.log("DATA LOADED:", data);

  // SHOW RAW JSON
  document.getElementById("raw").textContent =
    JSON.stringify(data, null, 2);

  const games = data.games || data || [];

  const tbody = document.getElementById("tbody");

  games.forEach(g=>{

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${g.date || g.game_date || ""}</td>
      <td>${g.team || ""}</td>
      <td>${g.opponent || ""}</td>
      <td>${g.pts || g.points || ""}</td>
    `;

    tbody.appendChild(tr);
  });

})
.catch(e=>{
  document.getElementById("raw").textContent =
    "ERROR: " + e.message;
});

</script>

</body>
</html>
