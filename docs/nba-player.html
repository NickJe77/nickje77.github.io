<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.page-wrap{
  max-width:1200px;
  margin:auto;
  padding:28px 20px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  padding:30px;
  border-radius:18px;
  margin-bottom:12px;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

.section-title{
  font-weight:800;
  margin-bottom:12px;
  font-size:13px;
  letter-spacing:1px;
}

.awards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.award-box{
  background:#eef3ff;
  border-radius:12px;
  padding:12px;
}

.award-name{
  font-weight:800;
  color:#003a99;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<!-- HERO -->
<div class="hero">
  <h1 id="title"></h1>
</div>

<!-- ✅ AWARDS NOW UNDER HEADER -->
<div class="section-card" id="awardsCard" style="display:none;">
  <div class="section-title">Awards</div>
  <div id="awardsContent"></div>
</div>

<!-- KEEP REST SIMPLE BUT WORKING -->
<div class="section-card">
  <div class="section-title">Career Summary</div>
  <div id="careerTotals"></div>
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

let awardsData = [];

function slug(name){
  return (name || "")
    .toLowerCase()
    .replace(/[^\w\s-]/g,"")
    .replace(/\s+/g,"-");
}

/* ===== FIXED CSV (NOW SUPPORTS ROTY TOO) ===== */
async function loadAwardsCSV(){
  try{
    const res = await fetch("/docs/data/nba/nba_awards.csv");
    if(!res.ok) return;

    const text = await res.text();
    const lines = text.split("\n").map(l=>l.trim()).filter(l=>l);

    const headers = lines[0].split(",").map(h=>h.trim().toLowerCase());

    awardsData = [];

    lines.slice(1).forEach(line=>{
      const values = line.split(",").map(v=>v.trim());

      let row = {};
      headers.forEach((h,i)=> row[h] = values[i] || "");

      const year = row.year;

      Object.keys(row).forEach(key=>{
        if(key === "year") return;

        const player = row[key];
        if(!player) return;

        awardsData.push({
          player,
          award: key.toUpperCase(), // includes ROTY automatically
          year
        });
      });
    });

  }catch(e){
    console.log("Awards failed");
  }
}

function renderAwards(playerSlug){
  const card = document.getElementById("awardsCard");
  const container = document.getElementById("awardsContent");

  const awards = awardsData.filter(a => slug(a.player) === playerSlug);

  if(!awards.length){
    card.style.display = "none";
    return;
  }

  card.style.display = "block";

  const grouped = {};

  awards.forEach(a=>{
    if(!grouped[a.award]) grouped[a.award] = [];
    grouped[a.award].push(a.year);
  });

  let html = `<div class="awards-grid">`;

  Object.keys(grouped).forEach(award=>{
    html += `
      <div class="award-box">
        <div class="award-name">${award}</div>
        <div>${grouped[award].sort((a,b)=>b-a).join(", ")}</div>
      </div>
    `;
  });

  html += `</div>`;

  container.innerHTML = html;
}

async function init(){
  if(!playerParam) return;

  document.getElementById("title").textContent =
    playerParam.replace(/-/g," ");

  await loadAwardsCSV();
  renderAwards(playerParam);
}

init();

</script>

</body>
</html>
