<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#ffffff;}
.navbar{display:flex;justify-content:center;gap:30px;padding:14px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:20px;}
h1{text-align:center;margin-bottom:10px;}
.stats-row{display:flex;gap:12px;justify-content:center;margin:12px 0;flex-wrap:wrap;}
.stat-box{background:#f2f6ff;padding:10px 16px;border-radius:8px;text-align:center;min-width:110px;}
.stat-box span{display:block;font-size:22px;font-weight:700;}
.filter-row{text-align:center;margin:14px 0 18px;font-weight:600;color:#003a99;}
select{padding:8px 14px;font-size:15px;border-radius:8px;border:2px solid #0056d6;background:#eef3ff;color:#003a99;font-weight:600;cursor:pointer;}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;}
th,td{padding:6px 8px;border-bottom:1px solid #ddd;text-align:center;}
th{background:#eef3ff;}
tr:nth-child(even){background:#f6f9ff;}
.bad{background:#ffe1e1;color:#900;padding:10px;text-align:center;border-radius:6px;margin-top:12px;}
</style>
</head>

<body>

<div class="navbar">
<a href="../index.html">Home</a>
<a href="../nba.html">NBA</a>
<a href="../nba-seasons.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">Player</h1>

<div class="stats-row" id="totalsBoxes"></div>
<div class="stats-row" id="averagesBoxes"></div>
<div class="stats-row" id="highsBoxes"></div>

<div class="filter-row">
Opposition:
<select id="oppFilter">
<option value="ALL">All teams</option>
</select>
</div>

<div id="errorBox" class="bad" style="display:none;"></div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>

</div>

<script>
const params=new URLSearchParams(window.location.search);
const playerName=decodeURIComponent(params.get("player")||"");

const titleEl=document.getElementById("title");
const totalsBoxes=document.getElementById("totalsBoxes");
const averagesBoxes=document.getElementById("averagesBoxes");
const highsBoxes=document.getElementById("highsBoxes");
const errorBox=document.getElementById("errorBox");
const gamesBody=document.getElementById("gamesBody");
const oppFilter=document.getElementById("oppFilter");

let rows=[];
let filteredRows=[];

const START_SEASON=1976;
const END_SEASON=new Date().getFullYear();

async function loadPlayer(){

if(!playerName){
errorBox.style.display="block";
errorBox.textContent="Missing ?player=";
return;
}

titleEl.textContent=playerName;

for(let season=START_SEASON;season<=END_SEASON;season++){

try{
const indexRes=await fetch(`../data/nba/${season}/index.json`);
if(!indexRes.ok) continue;

const index=await indexRes.json();

for(const id of index.games){

try{
const gameRes=await fetch(`../data/nba/${season}/${id}.json`);
if(!gameRes.ok) continue;

const game=await gameRes.json();

if(game.game_type!=="Regular Season" && game.game_type!=="Playoffs") continue;

for(const p of game.players||[]){

const name =
p.player_name ||
p.player ||
p.name ||
"";

if(name.toLowerCase().trim()===playerName.toLowerCase().trim()){

const isHome=game.home_team===p.team;
const opp=isHome?game.away_team:game.home_team;

rows.push({
season:game.season,
date:game.date,
team:p.team,
opp,
pts:p.points||0,
reb:p.rebounds||0,
ast:p.assists||0,
stl:p.steals||0,
blk:p.blocks||0
});
}
}

}catch(e){}
}

}catch(e){}
}

if(!rows.length){
errorBox.style.display="block";
errorBox.textContent="No games found.";
return;
}

buildOppFilter();
filteredRows=rows;
render();
}

function buildOppFilter(){
const teams=[...new Set(rows.map(r=>r.opp))].sort();
teams.forEach(t=>{
const opt=document.createElement("option");
opt.value=t;
opt.textContent=t;
oppFilter.appendChild(opt);
});
}

oppFilter.addEventListener("change",()=>{
const val=oppFilter.value;
filteredRows=(val==="ALL")?rows:rows.filter(r=>r.opp===val);
render();
});

function render(){

gamesBody.innerHTML="";

let totals={pts:0,reb:0,ast:0,stl:0,blk:0};
let highs={pts:0,reb:0,ast:0,stl:0,blk:0};

for(const r of filteredRows){

totals.pts+=r.pts;
totals.reb+=r.reb;
totals.ast+=r.ast;
totals.stl+=r.stl;
totals.blk+=r.blk;

highs.pts=Math.max(highs.pts,r.pts);
highs.reb=Math.max(highs.reb,r.reb);
highs.ast=Math.max(highs.ast,r.ast);
highs.stl=Math.max(highs.stl,r.stl);
highs.blk=Math.max(highs.blk,r.blk);

gamesBody.innerHTML+=`
<tr>
<td>${r.season}</td>
<td>${r.date}</td>
<td>${r.team}</td>
<td>${r.opp}</td>
<td>${r.pts}</td>
<td>${r.reb}</td>
<td>${r.ast}</td>
<td>${r.stl}</td>
<td>${r.blk}</td>
</tr>`;
}

const g=filteredRows.length;

totalsBoxes.innerHTML=`
<div class="stat-box"><span>${g}</span>Games</div>
<div class="stat-box"><span>${totals.pts}</span>Points</div>
<div class="stat-box"><span>${totals.reb}</span>Rebounds</div>
<div class="stat-box"><span>${totals.ast}</span>Assists</div>
<div class="stat-box"><span>${totals.stl}</span>Steals</div>
<div class="stat-box"><span>${totals.blk}</span>Blocks</div>`;

averagesBoxes.innerHTML=`
<div class="stat-box"><span>${(totals.pts/g).toFixed(1)}</span>Avg Pts</div>
<div class="stat-box"><span>${(totals.reb/g).toFixed(1)}</span>Avg Reb</div>
<div class="stat-box"><span>${(totals.ast/g).toFixed(1)}</span>Avg Ast</div>`;

highsBoxes.innerHTML=`
<div class="stat-box"><span>${highs.pts}</span>Career High PTS</div>
<div class="stat-box"><span>${highs.reb}</span>Career High REB</div>
<div class="stat-box"><span>${highs.ast}</span>Career High AST</div>
<div class="stat-box"><span>${highs.stl}</span>Career High STL</div>
<div class="stat-box"><span>${highs.blk}</span>Career High BLK</div>`;
}

loadPlayer();
</script>

</body>
</html>
