<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}
.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:20px;
}
h1{text-align:center;margin-bottom:10px;}
.stats-row{
  display:flex;
  gap:12px;
  justify-content:center;
  margin:12px 0;
  flex-wrap:wrap;
}
.stat-box{
  background:#f2f6ff;
  padding:10px 16px;
  border-radius:8px;
  text-align:center;
  min-width:110px;
}
.stat-box span{
  display:block;
  font-size:22px;
  font-weight:700;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  font-size:14px;
}
th,td{
  padding:6px 8px;
  border-bottom:1px solid #ddd;
  text-align:center;
}
th{
  cursor:pointer;
  background:#eef3ff;
}
tr:nth-child(even){background:#f6f9ff;}
.bad{
  background:#ffe1e1;
  color:#900;
  padding:10px;
  text-align:center;
  border-radius:6px;
  margin-top:12px;
}
</style>
</head>

<body>
<div class="page-wrap">

<h1 id="title">Player</h1>

<div class="stats-row" id="totalsBoxes"></div>
<div class="stats-row" id="averagesBoxes"></div>
<div class="stats-row" id="highsBoxes"></div>

<div id="errorBox" class="bad" style="display:none;"></div>

<table>
<thead>
<tr>
  <th data-key="season">Season</th>
  <th data-key="date">Date</th>
  <th data-key="team">Team</th>
  <th data-key="opp">Opp</th>
  <th data-key="pts">PTS</th>
  <th data-key="reb">REB</th>
  <th data-key="ast">AST</th>
  <th data-key="stl">STL</th>
  <th data-key="blk">BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerName = params.get("player");

const titleEl = document.getElementById("title");
const totalsBoxes = document.getElementById("totalsBoxes");
const averagesBoxes = document.getElementById("averagesBoxes");
const highsBoxes = document.getElementById("highsBoxes");
const errorBox = document.getElementById("errorBox");
const gamesBody = document.getElementById("gamesBody");

let rows=[];
let currentSort={key:null,dir:"desc"};

function seasonToFile(season){
  return "/docs/data/nba/nba_season_" + season.replace("-","_") + ".json";
}

function showError(msg){
  errorBox.style.display="block";
  errorBox.textContent=msg;
}

async function detectSeasons(){
  const seasons=[];
  for(let y=1970;y<=2030;y++){
    const s=`${y}-${String(y+1).slice(2)}`;
    try{
      const r=await fetch(seasonToFile(s));
      if(r.ok) seasons.push(s);
    }catch(e){}
  }
  return seasons;
}

async function loadPlayer(){
  if(!playerName){
    showError("Missing player.");
    return;
  }

  titleEl.textContent=playerName;

  const seasonFiles=await detectSeasons();

  for(const season of seasonFiles){
    try{
      const res=await fetch(seasonToFile(season));
      if(!res.ok) continue;

      const data=await res.json();

      data.games.forEach(g=>{
        if(g.player===playerName){
          rows.push({
            season:season,
            date:g.date||"",
            team:g.team||"",
            opp:g.opp||"",
            pts:Number(g.pts)||0,
            reb:Number(g.reb)||0,
            ast:Number(g.ast)||0,
            stl:Number(g.stl)||0,
            blk:Number(g.blk)||0
          });
        }
      });

    }catch(e){}
  }

  if(!rows.length){
    showError("No games found for this player.");
    return;
  }

  render();
}

function render(){
  gamesBody.innerHTML="";

  let totals={pts:0,reb:0,ast:0,stl:0,blk:0};
  let highs={pts:0,reb:0,ast:0,stl:0,blk:0};

  rows.forEach(r=>{
    totals.pts+=r.pts;
    totals.reb+=r.reb;
    totals.ast+=r.ast;
    totals.stl+=r.stl;
    totals.blk+=r.blk;

    highs.pts=Math.max(highs.pts,r.pts);
    highs.reb=Math.max(highs.reb,r.reb);
    highs.ast=Math.max(highs.ast,r.ast);
    highs.stl=Math.max(highs.stl,r.stl);
    highs.blk=Math.max(highs.blk,r.blk);

    gamesBody.innerHTML+=`
      <tr>
        <td>${r.season}</td>
        <td>${r.date}</td>
        <td>${r.team}</td>
        <td>${r.opp}</td>
        <td>${r.pts}</td>
        <td>${r.reb}</td>
        <td>${r.ast}</td>
        <td>${r.stl}</td>
        <td>${r.blk}</td>
      </tr>`;
  });

  const g=rows.length;

  totalsBoxes.innerHTML=`
    <div class="stat-box"><span>${g}</span>Games</div>
    <div class="stat-box"><span>${totals.pts}</span>Points</div>
    <div class="stat-box"><span>${totals.reb}</span>Rebounds</div>
    <div class="stat-box"><span>${totals.ast}</span>Assists</div>
    <div class="stat-box"><span>${totals.stl}</span>Steals</div>
    <div class="stat-box"><span>${totals.blk}</span>Blocks</div>`;

  averagesBoxes.innerHTML=`
    <div class="stat-box"><span>${(totals.pts/g).toFixed(1)}</span>Avg Pts</div>
    <div class="stat-box"><span>${(totals.reb/g).toFixed(1)}</span>Avg Reb</div>
    <div class="stat-box"><span>${(totals.ast/g).toFixed(1)}</span>Avg Ast</div>`;

  highsBoxes.innerHTML=`
    <div class="stat-box"><span>${highs.pts}</span>Career High PTS</div>
    <div class="stat-box"><span>${highs.reb}</span>Career High REB</div>
    <div class="stat-box"><span>${highs.ast}</span>Career High AST</div>
    <div class="stat-box"><span>${highs.stl}</span>Career High STL</div>
    <div class="stat-box"><span>${highs.blk}</span>Career High BLK</div>`;
}

document.querySelectorAll("th[data-key]").forEach(th=>{
  th.addEventListener("click",()=>{
    const key=th.dataset.key;
    currentSort.dir =
      currentSort.key===key && currentSort.dir==="asc" ? "desc" : "asc";
    currentSort.key=key;

    rows.sort((a,b)=>{
      if(a[key]<b[key]) return currentSort.dir==="asc"?-1:1;
      if(a[key]>b[key]) return currentSort.dir==="asc"?1:-1;
      return 0;
    });

    render();
  });
});

loadPlayer();
</script>
</body>
</html>
