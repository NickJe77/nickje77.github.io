<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.page-wrap{
  max-width:1200px;
  margin:auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:26px;
  margin-bottom:24px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

select,input{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

tr:nth-child(even){
  background:#f0f6ff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
</div>

<div class="controls">
  <input id="playerSearch" list="players" placeholder="Search player...">
  <datalist id="players"></datalist>

  <select id="teamFilter">
    <option value="all">All Teams</option>
  </select>

  <select id="oppFilter">
    <option value="all">All Opponents</option>
  </select>
</div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>

// 🔒 GLOBAL ERROR GUARD (prevents blank page)
window.addEventListener("error", e => console.log("JS error:", e.message));
window.addEventListener("unhandledrejection", e => console.log("Promise error:", e.reason));

let player = null;

const params = new URLSearchParams(window.location.search);
const slug = params.get("player");

// LOAD PLAYER LIST
async function loadList(){
  try{
    const res = await fetch("docs/data/nba/players/index.json");
    const list = await res.json();

    const dl = document.getElementById("players");

    list.forEach(p=>{
      const o = document.createElement("option");
      o.value = p.name;
      dl.appendChild(o);
    });

  }catch(e){
    console.log("Index load failed");
  }
}

// SEARCH
document.getElementById("playerSearch").addEventListener("change", e=>{
  const val = e.target.value.toLowerCase().replace(/\s+/g,"-");
  window.location = "?player=" + val;
});

// LOAD PLAYER
async function loadPlayer(){

  if(!slug) return;

  try{
    const res = await fetch(`docs/data/nba/players/${slug}.json`);
    player = await res.json();

    document.getElementById("playerName").innerText = player.name || "Player";

    buildFilters();
    render();

  }catch(e){
    console.log("Player load failed");
  }
}

// FILTERS
function buildFilters(){

  const teamSet = new Set();
  const oppSet = new Set();

  (player.games || []).forEach(g=>{
    if(g.team) teamSet.add(g.team);
    if(g.opponent) oppSet.add(g.opponent);
  });

  const tSel = document.getElementById("teamFilter");
  const oSel = document.getElementById("oppFilter");

  teamSet.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    tSel.appendChild(o);
  });

  oppSet.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    oSel.appendChild(o);
  });

  tSel.onchange = render;
  oSel.onchange = render;
}

// RENDER
function render(){

  if(!player || !player.games) return;

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  const tVal = document.getElementById("teamFilter").value;
  const oVal = document.getElementById("oppFilter").value;

  let games = player.games.filter(g=>{
    return (tVal==="all" || g.team===tVal) &&
           (oVal==="all" || g.opponent===oVal);
  });

  // 🔥 FIX: SAFE SORT (prevents Feb cutoff)
  games.sort((a,b)=>{
    const da = new Date(a.date || a.game_date || 0);
    const db = new Date(b.date || b.game_date || 0);
    return db - da;
  });

  games.forEach(g=>{

    try{

      const pts = g.pts ?? g.points ?? 0;
      const reb = g.reb ?? g.rebounds ?? 0;
      const ast = g.ast ?? g.assists ?? 0;
      const stl = g.stl ?? g.steals ?? 0;
      const blk = g.blk ?? g.blocks ?? 0;

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${g.season || ""}</td>
        <td>${g.date || ""}</td>
        <td>${g.team || ""}</td>
        <td>${g.opponent || ""}</td>
        <td>${pts}</td>
        <td>${reb}</td>
        <td>${ast}</td>
        <td>${stl}</td>
        <td>${blk}</td>
      `;

      tbody.appendChild(tr);

    }catch(e){
      console.log("Skipped bad game", g);
    }

  });

}

loadList();
loadPlayer();

</script>

</body>
</html>
