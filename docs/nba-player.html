<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}

.navbar{
display:flex;
justify-content:center;
gap:30px;
padding:14px 0;
border-bottom:1px solid #ddd;
font-weight:600;
background:#fff;
}

.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1200px;margin:auto;padding:25px 20px 60px;}

.header-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:15px;
}

.name-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}

#title{font-size:40px;font-weight:800;margin:0;}

.team-stripe{
height:22px;
width:140px;
border-radius:6px;
border:1px solid #ccc;
}

.search-box{
padding:10px 14px;
border-radius:10px;
border:1px solid #ccc;
font-size:14px;
width:260px;
}

.summary-container{
background:#fff;
border-radius:18px;
padding:22px;
box-shadow:0 4px 12px rgba(0,0,0,.05);
margin-bottom:25px;
}

.section-title{
font-size:13px;
font-weight:700;
letter-spacing:1px;
color:#666;
margin-bottom:15px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:14px;
margin-bottom:16px;
}

.stat-box{
background:#eef3ff;
border-radius:14px;
padding:16px;
text-align:center;
}

.stat-box span{
display:block;
font-size:28px;
font-weight:800;
}

.filter-row{
margin:10px 0 18px;
font-weight:700;
color:#003a99;
}

select{
padding:8px 14px;
font-size:14px;
border-radius:8px;
border:1px solid #ccc;
margin-right:10px;
}

table{
width:100%;
border-collapse:collapse;
font-size:14px;
background:#fff;
border-radius:14px;
overflow:hidden;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

th{background:#eef3ff;font-weight:700;}

tr:nth-child(even){background:#f8faff;}

tr.clickable{cursor:pointer;}

tr.clickable:hover{background:#e6f0ff;}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<div class="header-row">

<div class="name-wrap">
<h1 id="title">Player</h1>
<div id="teamStripe" class="team-stripe"></div>
</div>

<input id="playerSearch" list="playerList" class="search-box" placeholder="Search player...">
<datalist id="playerList"></datalist>

</div>

<div class="summary-container">
<div class="section-title">CAREER SUMMARY</div>
<div class="stats-grid" id="careerTotals"></div>
<div class="stats-grid" id="careerAverages"></div>
<div class="stats-grid" id="careerHighs"></div>
</div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>

</div>

<script>

const TEAM_COLORS={
"Dallas Mavericks":["#00538C","#002B5E","#B8C4CA"],
"Los Angeles Lakers":["#552583","#FDB927","#000000"],
"Golden State Warriors":["#1D428A","#FFC72C","#FFFFFF"],
"Boston Celtics":["#007A33","#BA9653","#FFFFFF"],
"Chicago Bulls":["#CE1141","#000000","#FFFFFF"]
};

const params=new URLSearchParams(window.location.search);
let playerName=decodeURIComponent(params.get("player")||"");

const titleEl=document.getElementById("title");
const stripe=document.getElementById("teamStripe");
const gamesBody=document.getElementById("gamesBody");

let rows=[];

/* PLAYER SEARCH */

async function loadPlayerList(){

const res=await fetch("/data/nba/players/index.json");
const list=await res.json();

const dl=document.getElementById("playerList");

list.forEach(p=>{
const o=document.createElement("option");
o.value=p;
dl.appendChild(o);
});

}

document.getElementById("playerSearch").addEventListener("change",e=>{
const name=e.target.value;
window.location="?player="+encodeURIComponent(name);
});

/* SLUG */

function slug(name){
return name
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^\w\s-]/g,"")
.replace(/\s+/g,"-");
}

/* LOAD PLAYER */

async function loadPlayer(){

if(!playerName)return;

titleEl.textContent=playerName;

const res=await fetch(`/data/nba/players/${slug(playerName)}.json`);
const data=await res.json();

rows=data.games||[];

setTeamStripe();
renderCareer();
renderGames();

}

/* CURRENT TEAM */

function setTeamStripe(){

let latest=rows.reduce((a,b)=>{

let da=new Date(a.date);
let db=new Date(b.date);

return db>da?b:a;

});

const colors=TEAM_COLORS[latest.team];

if(!colors)return;

stripe.style.background=
`linear-gradient(90deg,
${colors[0]} 33%,
${colors[1]} 33% 66%,
${colors[2]} 66%)`;

}

/* CAREER STATS */

function renderCareer(){

let totals={pts:0,reb:0,ast:0};
let highs={pts:0,reb:0,ast:0,ptsOpp:"",rebOpp:"",astOpp:""};
let triple=0;

rows.forEach(r=>{

totals.pts+=r.pts;
totals.reb+=r.reb;
totals.ast+=r.ast;

if(r.pts>highs.pts){highs.pts=r.pts;highs.ptsOpp=r.opp;}
if(r.reb>highs.reb){highs.reb=r.reb;highs.rebOpp=r.opp;}
if(r.ast>highs.ast){highs.ast=r.ast;highs.astOpp=r.opp;}

let cats=0;

if(r.pts>=10)cats++;
if(r.reb>=10)cats++;
if(r.ast>=10)cats++;

if(cats>=3)triple++;

});

const g=rows.length||1;

document.getElementById("careerTotals").innerHTML=`
<div class="stat-box"><span>${rows.length}</span>Games</div>
<div class="stat-box"><span>${totals.pts}</span>PTS</div>
<div class="stat-box"><span>${totals.reb}</span>REB</div>
<div class="stat-box"><span>${totals.ast}</span>AST</div>
<div class="stat-box"><span>${triple}</span>Triple Doubles</div>
`;

document.getElementById("careerAverages").innerHTML=`
<div class="stat-box"><span>${(totals.pts/g).toFixed(1)}</span>Avg PTS</div>
<div class="stat-box"><span>${(totals.reb/g).toFixed(1)}</span>Avg REB</div>
<div class="stat-box"><span>${(totals.ast/g).toFixed(1)}</span>Avg AST</div>
`;

document.getElementById("careerHighs").innerHTML=`
<div class="stat-box"><span>${highs.pts}</span>Best PTS<br><small>vs ${highs.ptsOpp}</small></div>
<div class="stat-box"><span>${highs.reb}</span>Best REB<br><small>vs ${highs.rebOpp}</small></div>
<div class="stat-box"><span>${highs.ast}</span>Best AST<br><small>vs ${highs.astOpp}</small></div>
`;

}

/* GAME TABLE */

function renderGames(){

gamesBody.innerHTML="";

rows.forEach(r=>{
gamesBody.innerHTML+=`
<tr class="clickable">
<td>${r.season}</td>
<td>${r.date}</td>
<td>${r.team}</td>
<td>${r.opp}</td>
<td>${r.pts}</td>
<td>${r.reb}</td>
<td>${r.ast}</td>
<td>${r.stl}</td>
<td>${r.blk}</td>
</tr>`;
});

}

/* INIT */

loadPlayerList();
loadPlayer();

</script>

</body>
</html>
