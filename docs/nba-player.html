<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.navbar a:hover{
  text-decoration:underline;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:28px 30px;
  margin-bottom:24px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
}

.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  flex-wrap:wrap;
}

.hero-title-wrap{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.eyebrow{
  font-size:12px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  opacity:.9;
}

#title{
  margin:0;
  font-size:42px;
  line-height:1.05;
  font-weight:800;
}

.hero-sub{
  font-size:15px;
  opacity:.95;
}

.hero-search{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.search-box{
  padding:12px 14px;
  border-radius:10px;
  border:none;
  font-size:14px;
  width:280px;
  outline:none;
}

.team-stripe{
  height:18px;
  width:180px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.25);
  margin-top:6px;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  margin-bottom:24px;
}

.section-title{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#666;
  margin-bottom:15px;
  text-transform:uppercase;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
  margin-bottom:14px;
}

.stat-box{
  background:#eef3ff;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.stat-box span{
  display:block;
  font-size:28px;
  line-height:1;
  font-weight:800;
  margin-bottom:6px;
  color:#0b3ea9;
}

.stat-box small{
  color:#666;
  font-size:12px;
  display:block;
  margin-top:4px;
  line-height:1.35;
}

.filters-bar{
  display:flex;
  flex-wrap:wrap;
  gap:12px 18px;
  align-items:center;
  margin-bottom:18px;
}

.filter-group{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  color:#003a99;
}

select{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
  background:#fff;
}

.table-wrap{
  background:#fff;
  border-radius:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  overflow:hidden;
}

.table-header{
  padding:20px 22px 10px;
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#666;
  text-transform:uppercase;
}

.table-scroll{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  min-width:900px;
}

th,td{
  padding:12px 10px;
  border-bottom:1px solid #eee;
  text-align:center;
  white-space:nowrap;
}

th{
  background:#eef3ff;
  color:#003a99;
  font-weight:800;
}

tbody tr:nth-child(even){
  background:#f8faff;
}

tbody tr:hover{
  background:#eaf2ff;
}

.clickable-row{
  cursor:pointer;
}

.name-note{
  color:#666;
  font-size:14px;
}

.empty-state{
  padding:24px;
  text-align:center;
  color:#666;
  font-weight:600;
}

@media (max-width: 800px){
  #title{
    font-size:32px;
  }

  .search-box{
    width:100%;
    max-width:100%;
  }

  .hero-search{
    width:100%;
  }
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <div class="hero-top">
      <div class="hero-title-wrap">
        <div class="eyebrow">NBA Player Career</div>
        <h1 id="title">Player</h1>
        <div class="hero-sub" id="heroSub">Career game log, totals, averages and highs</div>
        <div id="teamStripe" class="team-stripe"></div>
      </div>

      <div class="hero-search">
        <input id="playerSearch" list="playerList" class="search-box" placeholder="Search player...">
        <datalist id="playerList"></datalist>
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title">Career Summary</div>
    <div class="stats-grid" id="careerTotals"></div>
    <div class="stats-grid" id="careerAverages"></div>
    <div class="stats-grid" id="careerHighs"></div>
  </div>

  <div class="section-card">
    <div class="filters-bar">
      <div class="filter-group">
        <label for="teamFilter">Team:</label>
        <select id="teamFilter">
          <option value="ALL">All teams</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="oppFilter">Opposition:</label>
        <select id="oppFilter">
          <option value="ALL">All teams</option>
        </select>
      </div>

      <div class="name-note" id="filterNote">Filtered breakdown</div>
    </div>

    <div class="section-title">Filtered Results</div>
    <div class="stats-grid" id="oppTotals"></div>
    <div class="stats-grid" id="oppAverages"></div>
    <div class="stats-grid" id="oppHighs"></div>
  </div>

  <div class="table-wrap">
    <div class="table-header">Game Log</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Season</th>
            <th>Date</th>
            <th>Team</th>
            <th>Opp</th>
            <th>PTS</th>
            <th>REB</th>
            <th>AST</th>
            <th>STL</th>
            <th>BLK</th>
          </tr>
        </thead>
        <tbody id="gamesBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state" style="display:none;">No games found.</div>
  </div>

</div>

<script>
/* everything above unchanged */

function renderGames(){
  gamesBody.innerHTML = "";

  let filtered = getFilteredRows();

  /* ensure only regular season and postseason games */
  filtered = filtered.filter(r=>{
    const type = (r.game_type || r.type || "").toLowerCase();
    if(!type) return true;
    return type.includes("regular") || type.includes("post");
  });

  /* ensure latest → earliest */
  filtered = sortRowsLatestFirst(filtered);

  emptyState.style.display = filtered.length ? "none" : "block";

  filtered.forEach(r=>{
    const gameId = getGameId(r);
    const cls = gameId ? "clickable-row" : "";
    const row = document.createElement("tr");
    row.className = cls;

    row.innerHTML = `
      <td>${getSeason(r)}</td>
      <td>${cleanDate(r.date || "")}</td>
      <td>${r.team || ""}</td>
      <td>${r.opp || ""}</td>
      <td>${parseNum(r.pts)}</td>
      <td>${parseNum(r.reb)}</td>
      <td>${parseNum(r.ast)}</td>
      <td>${parseNum(r.stl)}</td>
      <td>${parseNum(r.blk)}</td>
    `;

    if(gameId){
      row.addEventListener("click", ()=>{
        window.location = "nba-game.html?game=" + encodeURIComponent(gameId);
      });
    }

    gamesBody.appendChild(row);
  });
}

loadPlayers();
loadPlayer();
</script>

</body>
</html>
