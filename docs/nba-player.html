<!DOCTYPE html>

<html lang="en">
<head>

<style>

body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}

.navbar{
display:flex;
justify-content:center;
gap:30px;
padding:14px 0;
border-bottom:1px solid #ddd;

font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:auto;
padding:25px 20px 60px;
}

.header-row{
display:flex;

}

.search-box{

.summary-container{

box-shadow:0 4px 12px rgba(0,0,0,.05);

border-radius:14px;
overflow:hidden;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;

}

th{

}

}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<div class="header-row">

<div class="name-wrap">
<h1 id="title">Player</h1>
<div id="teamStripe" class="team-stripe"></div>
</div>

<input id="playerSearch" list="playerList" class="search-box" placeholder="Search player...">
<datalist id="playerList"></datalist>

</div>

<!-- CAREER SUMMARY -->

<div class="summary-container">

<div class="section-title">CAREER SUMMARY</div>

<div class="stats-grid" id="careerTotals"></div>
<div class="stats-grid" id="careerAverages"></div>
<div class="stats-grid" id="careerHighs"></div>

</div>

<!-- FILTERED RESULTS -->

<div class="summary-container">

<div class="filter-row">

Team: <select id="teamFilter">

<option value="ALL">All teams</option>
</select>

Opposition: <select id="oppFilter">

<option value="ALL">All teams</option>
</select>

</div>

<div class="section-title">FILTERED RESULTS</div>

<div class="stats-grid" id="oppTotals"></div>
<div class="stats-grid" id="oppAverages"></div>
<div class="stats-grid" id="oppHighs"></div>

</div>

<table>

<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

<script>

const params=new URLSearchParams(window.location.search);
const playerName=decodeURIComponent(params.get("player")||"");

const titleEl=document.getElementById("title");
const gamesBody=document.getElementById("gamesBody");
const teamFilter=document.getElementById("teamFilter");
const oppFilter=document.getElementById("oppFilter");

let rows=[];

/* NBA TEAM COLOURS */

const TEAM_COLORS={
"Atlanta Hawks":["#E03A3E","#C1D32F","#000000"],
"Boston Celtics":["#007A33","#BA9653","#FFFFFF"],
"Brooklyn Nets":["#000000","#FFFFFF","#777777"],
"Charlotte Hornets":["#1D1160","#00788C","#A1A1A4"],
"Chicago Bulls":["#CE1141","#000000","#FFFFFF"],
"Cleveland Cavaliers":["#6F263D","#FFB81C","#041E42"],
"Dallas Mavericks":["#00538C","#002B5E","#B8C4CA"],
"Denver Nuggets":["#0E2240","#FEC524","#8B2131"],
"Detroit Pistons":["#C8102E","#1D42BA","#BEC0C2"],
"Golden State Warriors":["#1D428A","#FFC72C","#FFFFFF"],
"Houston Rockets":["#CE1141","#000000","#C4CED4"],
"Indiana Pacers":["#002D62","#FDBB30","#BEC0C2"],
"Los Angeles Clippers":["#C8102E","#1D428A","#FFFFFF"],
"Los Angeles Lakers":["#552583","#FDB927","#000000"],
"Memphis Grizzlies":["#5D76A9","#12173F","#F5B112"],
"Miami Heat":["#98002E","#F9A01B","#000000"],
"Milwaukee Bucks":["#00471B","#EEE1C6","#0077C0"],
"Minnesota Timberwolves":["#0C2340","#236192","#9EA2A2"],
"New Orleans Pelicans":["#0C2340","#C8102E","#85714D"],
"New York Knicks":["#006BB6","#F58426","#BEC0C2"],
"Oklahoma City Thunder":["#007AC1","#EF3B24","#FDBB30"],
"Orlando Magic":["#0077C0","#C4CED4","#000000"],
"Philadelphia 76ers":["#006BB6","#ED174C","#FFFFFF"],
"Phoenix Suns":["#1D1160","#E56020","#000000"],
"Portland Trail Blazers":["#E03A3E","#000000","#FFFFFF"],
"Sacramento Kings":["#5A2D81","#63727A","#000000"],
"San Antonio Spurs":["#000000","#C4CED4","#FFFFFF"],
"Toronto Raptors":["#CE1141","#000000","#A1A1A4"],
"Utah Jazz":["#002B5C","#00471B","#F9A01B"],
"Washington Wizards":["#002B5C","#E31837","#FFFFFF"]
};

function slug(name){
return name
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^\w\s-]/g,"")
.replace(/\s+/g,"-");
}

/* TEAM STRIPE */

function setStripe(){

if(rows.length===0) return;

let latest=rows[0];

for(const r of rows){
if(new Date(r.date)>new Date(latest.date)){
latest=r;
}
}

const colors=TEAM_COLORS[latest.team];
if(!colors) return;

document.getElementById("teamStripe").style.background=
`linear-gradient(90deg,${colors[0]} 33%,${colors[1]} 33% 66%,${colors[2]} 66%)`;

}

async function loadPlayers(){
const res=await fetch("/data/nba/players/index.json");
const list=await res.json();

const dl=document.getElementById("playerList");
dl.innerHTML="";

list.forEach(name=>{
const opt=document.createElement("option");
opt.value=name;
dl.appendChild(opt);
});
}

document.getElementById("playerSearch").addEventListener("change",e=>{
window.location="nba-player.html?player="+encodeURIComponent(e.target.value);
});

async function loadPlayer(){

titleEl.textContent=playerName;

const res=await fetch(`/data/nba/players/${slug(playerName)}.json`);
const data=await res.json();

rows=data.games||[];

buildFilters();

renderCareer();
renderFiltered();
renderGames();
setStripe();

}

/* YOUR EXISTING FUNCTIONS BELOW (UNCHANGED) */

loadPlayers();
loadPlayer();

</script>

</body>
</html>
