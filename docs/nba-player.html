<script>

/* =========================
   🔥 NEW: AWARDS LOGIC ONLY
========================= */

let awardsData = [];

async function loadAwardsCSV(){
  try{
    const res = await fetch("/data/nba/nba_awards.csv");
    const text = await res.text();

    const lines = text.split("\n").map(l => l.trim()).filter(l => l);
    const headers = lines[0].split(",").map(h => h.trim().toLowerCase());

    awardsData = lines.slice(1).map(line => {
      const values = line.split(",").map(v => v.trim());
      let obj = {};
      headers.forEach((h,i)=> obj[h] = values[i] || "");
      return obj;
    });

  }catch(e){
    awardsData = [];
  }
}

function getPlayerAwards(playerSlug){
  return awardsData.filter(a => slug(a.player) === playerSlug);
}

function renderAwards(playerSlug){
  const card = document.getElementById("awardsCard");
  const container = document.getElementById("awardsContent");

  if(!card || !container) return;

  const awards = getPlayerAwards(playerSlug);

  if(!awards.length){
    card.style.display = "none";
    return;
  }

  card.style.display = "block";

  const grouped = {};

  awards.forEach(a=>{
    if(!grouped[a.award]) grouped[a.award] = [];
    grouped[a.award].push(a.year);
  });

  let html = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;">`;

  Object.keys(grouped).forEach(award=>{
    html += `
      <div style="background:#eef3ff;border-radius:14px;padding:14px;">
        <div style="font-weight:800;color:#003a99;">${award}</div>
        <div>${grouped[award].sort((a,b)=>b-a).join(", ")}</div>
      </div>
    `;
  });

  html += `</div>`;

  container.innerHTML = html;
}

/* =========================
