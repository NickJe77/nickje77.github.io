<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.navbar a:hover{
  text-decoration:underline;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:28px 30px;
  margin-bottom:24px;
}

#title{
  margin:0;
  font-size:42px;
  font-weight:800;
}

.hero-search{
  margin-top:14px;
}

.search-box{
  padding:12px 14px;
  border-radius:10px;
  border:none;
  font-size:14px;
  width:280px;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  margin-bottom:24px;
}

.section-title{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#666;
  margin-bottom:15px;
  text-transform:uppercase;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
}

.stat-box{
  background:#eef3ff;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.stat-box span{
  display:block;
  font-size:28px;
  font-weight:800;
  color:#0b3ea9;
}

.table-wrap{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:12px 10px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{
  background:#eef3ff;
  color:#003a99;
  font-weight:800;
}

tbody tr:nth-child(even){
  background:#f8faff;
}

tbody tr:hover{
  background:#eaf2ff;
}

.clickable-row{
  cursor:pointer;
}
</style>
</head>
<body>

<div class="navbar">
<a href="nba.html">NBA</a>
<a href="nba-seasons.html">Seasons</a>
<a href="nba-teams.html">Teams</a>
<a href="nba-players.html">Players</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1 id="title">NBA Player</h1>

<div class="hero-search">
<input id="playerSearch" class="search-box" placeholder="Search player...">
</div>
</div>

<div class="section-card">
<div class="section-title">Career Totals</div>

<div class="stats-grid" id="careerStats"></div>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
<th>MIN</th>
</tr>
</thead>

<tbody id="gamesTable"></tbody>

</table>
</div>

</div>

<script>

const params = new URLSearchParams(location.search)
const player = params.get("player")

if(!player){
document.getElementById("title").innerText="Player not found"
throw "No player"
}

document.getElementById("title").innerText = player

let games = []

function isRegularOrPostseason(r){

  const team = String(r.team || "").toLowerCase();
  const opp  = String(r.opp || "").toLowerCase();

  if(team === "world" || team === "usa") return false;
  if(opp === "world" || opp === "usa") return false;

  const type = String(
    r.game_type ||
    r.type ||
    r.season_type ||
    r.gameType ||
    r.seasonType ||
    ""
  ).toLowerCase();

  if(type.includes("preseason")) return false;
  if(type.includes("summer")) return false;
  if(type.includes("exhibition")) return false;
  if(type.includes("all-star")) return false;
  if(type.includes("rising")) return false;
  if(type.includes("celebrity")) return false;

  return true;
}

async function loadPlayer(){

const res = await fetch(`docs/data/nba/players/${player}.json`)
const data = await res.json()

games = data.games.filter(isRegularOrPostseason)

renderStats()
renderTable()

}

function renderStats(){

let pts=0,reb=0,ast=0,stl=0,blk=0

games.forEach(g=>{
pts+=g.pts||0
reb+=g.reb||0
ast+=g.ast||0
stl+=g.stl||0
blk+=g.blk||0
})

const stats=[
["Points",pts],
["Rebounds",reb],
["Assists",ast],
["Steals",stl],
["Blocks",blk]
]

const grid=document.getElementById("careerStats")

grid.innerHTML=""

stats.forEach(s=>{
grid.innerHTML+=`
<div class="stat-box">
<span>${s[1]}</span>
<small>${s[0]}</small>
</div>
`
})

}

function renderTable(){

const body=document.getElementById("gamesTable")

body.innerHTML=""

games.forEach(g=>{

const tr=document.createElement("tr")
tr.className="clickable-row"

tr.onclick=()=>{

location.href=`nba-game.html?game=${g.game_id}`

}

tr.innerHTML=`
<td>${g.date||""}</td>
<td>${g.team||""}</td>
<td>${g.opp||""}</td>
<td>${g.pts||0}</td>
<td>${g.reb||0}</td>
<td>${g.ast||0}</td>
<td>${g.stl||0}</td>
<td>${g.blk||0}</td>
<td>${g.min||0}</td>
`

body.appendChild(tr)

})

}

loadPlayer()

</script>

</body>
</html>
