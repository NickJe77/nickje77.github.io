<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
/* (UNCHANGED — your styling exactly preserved) */
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

/* KEEPING ALL YOUR CSS EXACTLY AS IS */
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <div class="hero-top">
      <div class="hero-title-wrap">
        <div class="eyebrow">NBA Player Career</div>
        <h1 id="title">Player</h1>
        <div class="hero-sub" id="heroSub">Career game log, totals, averages and highs</div>
        <div id="teamStripe" class="team-stripe"></div>
      </div>

      <div class="hero-search">
        <input id="playerSearch" list="playerList" class="search-box" placeholder="Search player...">
        <datalist id="playerList"></datalist>
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title">Career Summary</div>
    <div class="stats-grid" id="careerTotals"></div>
    <div class="stats-grid" id="careerAverages"></div>
    <div class="stats-grid" id="careerHighs"></div>
  </div>

  <div class="section-card">
    <div class="filters-bar">
      <div class="filter-group">
        <label>Team:</label>
        <select id="teamFilter"><option value="ALL">All teams</option></select>
      </div>

      <div class="filter-group">
        <label>Opposition:</label>
        <select id="oppFilter"><option value="ALL">All teams</option></select>
      </div>

      <div class="name-note" id="filterNote">Filtered breakdown</div>
    </div>

    <div class="section-title">Filtered Results</div>
    <div class="stats-grid" id="oppTotals"></div>
    <div class="stats-grid" id="oppAverages"></div>
    <div class="stats-grid" id="oppHighs"></div>
  </div>

  <div class="table-wrap">
    <div class="table-header">Game Log</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Season</th>
            <th>Date</th>
            <th>Team</th>
            <th>Opp</th>
            <th>PTS</th>
            <th>REB</th>
            <th>AST</th>
            <th>STL</th>
            <th>BLK</th>
          </tr>
        </thead>
        <tbody id="gamesBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state" style="display:none;">No games found.</div>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

const titleEl = document.getElementById("title");
const heroSub = document.getElementById("heroSub");
const gamesBody = document.getElementById("gamesBody");
const teamFilter = document.getElementById("teamFilter");
const oppFilter = document.getElementById("oppFilter");
const stripe = document.getElementById("teamStripe");
const filterNote = document.getElementById("filterNote");
const emptyState = document.getElementById("emptyState");

let rows = [];

/* ---------- FIXED FILTER ---------- */
function isValidGame(r){

  const team = String(r.team || "").toLowerCase();
  const opp = String(r.opp || "").toLowerCase();

  if(["world","usa","stars","stripes"].includes(team)) return false;
  if(["world","usa","stars","stripes"].includes(opp)) return false;

  const mins = Number(r.minutes || 0);
  if(!mins || mins === 0) return false;

  return true;
}

/* ---------- SORT ---------- */
function sortRowsLatestFirst(data){
  return [...data].sort((a,b)=>{
    const da = new Date(a.date || 0).getTime();
    const db = new Date(b.date || 0).getTime();
    return db - da;
  });
}

function cleanDate(d){
  return (d || "").split("T")[0];
}

function getSeason(r){
  if(r.season) return r.season;

  const d = cleanDate(r.date || "");
  if(!d) return "";

  const year = parseInt(d.substring(0,4));
  const month = parseInt(d.substring(5,7));

  return month >= 10 ? year : year - 1;
}

/* ---------- LOAD ---------- */
async function loadPlayer(){

  if(!playerParam) return;

  const name = decodeURIComponent(playerParam);

  titleEl.textContent = name;
  heroSub.textContent = "Career game log for " + name;

  try{
    const res = await fetch(`data/nba/players/${name.toLowerCase().replace(/[^a-z0-9]+/g,"-")}.json`);
    const data = await res.json();

    rows = (data.games || []);

    /* 🔥 KEY FIXES */
    rows = rows.filter(isValidGame);
    rows = sortRowsLatestFirst(rows);

    renderGames();

  }catch(err){
    console.error(err);
  }
}

/* ---------- RENDER ---------- */
function renderGames(){

  gamesBody.innerHTML = "";

  if(!rows.length){
    emptyState.style.display = "block";
    return;
  }

  emptyState.style.display = "none";

  rows.forEach(r=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${getSeason(r)}</td>
      <td>${cleanDate(r.date)}</td>
      <td>${r.team}</td>
      <td>${r.opp}</td>
      <td>${r.pts}</td>
      <td>${r.reb}</td>
      <td>${r.ast}</td>
      <td>${r.stl}</td>
      <td>${r.blk}</td>
    `;

    gamesBody.appendChild(tr);
  });
}

loadPlayer();
</script>

</body>
</html>
