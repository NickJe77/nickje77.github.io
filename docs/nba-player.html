<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.page-wrap{
  max-width:1200px;
  margin:auto;
  padding:28px 20px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  padding:30px;
  border-radius:18px;
  margin-bottom:12px;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

.section-title{
  font-weight:800;
  margin-bottom:12px;
  font-size:13px;
  letter-spacing:1px;
}

.awards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.award-box{
  background:#eef3ff;
  border-radius:12px;
  padding:12px;
}

.award-name{
  font-weight:800;
  color:#003a99;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<!-- HERO -->
<div class="hero">
  <h1 id="title"></h1>
</div>

<!-- AWARDS -->
<div class="section-card" id="awardsCard" style="display:none;">
  <div class="section-title">Awards</div>
  <div id="awardsContent"></div>
</div>

<!-- KEEP YOUR EXISTING PAGE CONTENT -->
<div class="section-card">
  <div class="section-title">Career Summary</div>
  <div id="careerTotals"></div>
</div>

</div>

<script>

/* =========================
   EXISTING PLAYER PARAM
========================= */
const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

/* =========================
   HELPERS
========================= */
function slug(name){
  return (name || "")
    .toLowerCase()
    .replace(/[^\w\s-]/g,"")
    .replace(/\s+/g,"-");
}

/* =========================
   SAFE CSV PARSER
========================= */
function parseCSVLine(line){
  const out = [];
  let cur = "";
  let inQuotes = false;

  for(let i=0;i<line.length;i++){
    const ch = line[i];
    const next = line[i+1];

    if(ch === '"'){
      if(inQuotes && next === '"'){
        cur += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if(ch === "," && !inQuotes){
      out.push(cur.trim());
      cur = "";
    } else {
      cur += ch;
    }
  }

  out.push(cur.trim());
  return out;
}

/* =========================
   LOAD AWARDS
========================= */
let awardsData = [];

async function loadAwardsCSV(){
  try{
    const res = await fetch("/docs/data/nba/nba_awards.csv");
    if(!res.ok) return;

    const text = await res.text();
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);

    const headers = parseCSVLine(lines[0]).map(h=>h.toLowerCase());

    awardsData = [];

    lines.slice(1).forEach(line=>{
      const values = parseCSVLine(line);

      while(values.length < headers.length) values.push("");

      const year = values[0];

      for(let i=1;i<headers.length;i++){
        const player = values[i];
        if(!player) continue;

        awardsData.push({
          player: player.trim(),
          award: headers[i].toUpperCase(),
          year
        });
      }
    });

  }catch(e){
    console.log("Awards failed", e);
  }
}

/* =========================
   RENDER AWARDS
========================= */
function renderAwards(){
  const card = document.getElementById("awardsCard");
  const container = document.getElementById("awardsContent");

  if(!card || !container) return;

  const playerSlug = slug(playerParam);

  const awards = awardsData.filter(a => slug(a.player) === playerSlug);

  if(!awards.length){
    card.style.display = "none";
    return;
  }

  card.style.display = "block";

  const grouped = {};

  awards.forEach(a=>{
    if(!grouped[a.award]) grouped[a.award] = [];
    grouped[a.award].push(a.year);
  });

  let html = `<div class="awards-grid">`;

  Object.keys(grouped).forEach(award=>{
    html += `
      <div class="award-box">
        <div class="award-name">${award}</div>
        <div>${grouped[award].sort((a,b)=>b-a).join(", ")}</div>
      </div>
    `;
  });

  html += `</div>`;

  container.innerHTML = html;
}

/* =========================
   INIT (NON-BREAKING)
========================= */
async function init(){
  if(!playerParam) return;

  document.getElementById("title").textContent =
    playerParam.replace(/-/g," ");

  await loadAwardsCSV();
  renderAwards();
}

init();

</script>

</body>
</html>
