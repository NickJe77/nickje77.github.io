<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.page-wrap{
  max-width:1200px;
  margin:auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:26px;
  margin-bottom:24px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

select,input{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

tr:nth-child(even){
  background:#f0f6ff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
</div>

<div class="controls">
  <input id="playerSearch" list="players" placeholder="Search player...">
  <datalist id="players"></datalist>

  <select id="teamFilter">
    <option value="all">All Teams</option>
  </select>

  <select id="oppFilter">
    <option value="all">All Opponents</option>
  </select>
</div>

<table id="gamesTable">
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

function normalize(s){
  return (s || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}

const params = new URLSearchParams(window.location.search);
const raw = params.get("player") || "";

let data = null;

// 🔥 LOAD INDEX FIRST (this is the fix)
fetch("docs/data/nba/players/index.json")
.then(r=>r.json())
.then(list=>{

  // build search list
  const dl = document.getElementById("players");
  list.forEach(p=>{
    const o = document.createElement("option");
    o.value = p.name;
    dl.appendChild(o);
  });

  // find correct player file regardless of slug issues
  const target = normalize(raw);

  let match = list.find(p => normalize(p.slug || p.name) === target);

  if(!match){
    document.getElementById("playerName").innerText = "Player not found";
    return;
  }

  loadPlayer(match.slug || normalize(match.name));

});

// SEARCH
document.getElementById("playerSearch").addEventListener("change", e=>{
  const val = normalize(e.target.value);
  window.location = "?player=" + val;
});

function loadPlayer(slug){

  fetch(`docs/data/nba/players/${slug}.json`)
  .then(r=>r.json())
  .then(p=>{

    data = p;
    document.getElementById("playerName").innerText = p.name || slug;

    buildFilters();
    render();

  })
  .catch(()=>{
    document.getElementById("playerName").innerText = "Failed to load player";
  });

}

function get(g, keys){
  for(let k of keys){
    if(g && g[k] !== undefined && g[k] !== null) return g[k];
  }
  return "";
}

function buildFilters(){

  const tSet = new Set();
  const oSet = new Set();

  (data.games || []).forEach(g=>{
    tSet.add(get(g,["team","team_name","tm"]));
    oSet.add(get(g,["opponent","opp"]));
  });

  const tSel = document.getElementById("teamFilter");
  const oSel = document.getElementById("oppFilter");

  tSet.forEach(t=>{
    if(!t) return;
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    tSel.appendChild(o);
  });

  oSet.forEach(t=>{
    if(!t) return;
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    oSel.appendChild(o);
  });

  tSel.onchange = render;
  oSel.onchange = render;
}

function render(){

  const tbody = document.querySelector("#gamesTable tbody");
  tbody.innerHTML = "";

  const tVal = document.getElementById("teamFilter").value;
  const oVal = document.getElementById("oppFilter").value;

  let games = (data.games || []).filter(g=>{
    const team = get(g,["team","team_name","tm"]);
    const opp  = get(g,["opponent","opp"]);
    return (tVal==="all" || team===tVal) &&
           (oVal==="all" || opp===oVal);
  });

  games.sort((a,b)=>{
    return new Date(get(b,["date","game_date"])) - new Date(get(a,["date","game_date"]));
  });

  games.forEach(g=>{

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${get(g,["season","year"])}</td>
      <td>${get(g,["date","game_date"])}</td>
      <td>${get(g,["team","team_name","tm"])}</td>
      <td>${get(g,["opponent","opp"])}</td>
      <td>${get(g,["pts","points"])}</td>
      <td>${get(g,["reb","rebounds"])}</td>
      <td>${get(g,["ast","assists"])}</td>
      <td>${get(g,["stl","steals"])}</td>
      <td>${get(g,["blk","blocks"])}</td>
    `;

    tbody.appendChild(tr);
  });

}

</script>

</body>
</html>
