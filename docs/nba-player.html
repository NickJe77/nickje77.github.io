<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>

body{

  margin:0;

  display:flex;

  padding:12px 14px;

  border:none;

  width:280px;

}

.team-stripe{
  height:18px;
  width:180px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.25);
  margin-top:6px;
}

/* rest unchanged */

</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

  <div class="hero">
    <div class="hero-top">
      <div class="hero-title-wrap">
        <div class="eyebrow">NBA Player Career</div>
        <h1 id="title">Player</h1>
        <div class="hero-sub" id="heroSub">Career game log, totals, averages and highs</div>
        <div id="teamStripe" class="team-stripe"></div>
      </div>

      <div class="hero-search">
        <input id="playerSearch" list="playerList" class="search-box" placeholder="Search player...">
        <datalist id="playerList"></datalist>
      </div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title">Career Summary</div>
    <div class="stats-grid" id="careerTotals"></div>
    <div class="stats-grid" id="careerAverages"></div>
    <div class="stats-grid" id="careerHighs"></div>
  </div>

  <div class="section-card">
    <div class="filters-bar">
      <div class="filter-group">
        <label for="teamFilter">Team:</label>
        <select id="teamFilter">
          <option value="ALL">All teams</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="oppFilter">Opposition:</label>
        <select id="oppFilter">
          <option value="ALL">All teams</option>
        </select>
      </div>

      <div class="name-note" id="filterNote">Filtered breakdown</div>
    </div>

    <div class="section-title">Filtered Results</div>
    <div class="stats-grid" id="oppTotals"></div>
    <div class="stats-grid" id="oppAverages"></div>
    <div class="stats-grid" id="oppHighs"></div>
  </div>

  <div class="table-wrap">
    <div class="table-header">Game Log</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Season</th>
            <th>Date</th>
            <th>Team</th>
            <th>Opp</th>
            <th>PTS</th>
            <th>REB</th>
            <th>AST</th>
            <th>STL</th>
            <th>BLK</th>
          </tr>
        </thead>
        <tbody id="gamesBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state" style="display:none;">No games found.</div>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

const titleEl = document.getElementById("title");
const heroSub = document.getElementById("heroSub");
const gamesBody = document.getElementById("gamesBody");
const teamFilter = document.getElementById("teamFilter");
const oppFilter = document.getElementById("oppFilter");
const stripe = document.getElementById("teamStripe");
const filterNote = document.getElementById("filterNote");
const emptyState = document.getElementById("emptyState");

let rows = [];
let currentTeam = "";
let playersLoaded = false;

async function fetchJSON(paths){
  for(const path of paths){
    try{
      const res = await fetch(path, { cache:"no-store" });
      if(res.ok) return await res.json();
    }catch{}
  }
  throw new Error("load fail");
}

function cleanName(n){
  return (n||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function slug(n){
  return cleanName(n).toLowerCase().replace(/[^\w\s-]/g,"").replace(/\s+/g,"-");
}

async function loadPlayer(){
  if(!playerParam) return;

  const name = cleanName(decodeURIComponent(playerParam));
  titleEl.textContent = name;
  heroSub.textContent = "Career game log, totals, averages and highs for "+name;

  try{
    const data = await fetchJSON([
      `/docs/data/nba/players/${slug(name)}.json`,
      `docs/data/nba/players/${slug(name)}.json`
    ]);

    rows = Array.isArray(data) ? data : (data.games || []);
    renderGames();

  }catch(e){
    rows = [];
    renderGames();
  }
}

function renderGames(){
  gamesBody.innerHTML="";
  emptyState.style.display = rows.length ? "none" : "block";

  rows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r.season||""}</td>
      <td>${(r.date||"").split("T")[0]}</td>
      <td>${r.team||""}</td>
      <td>${r.opp||r.opponent||""}</td>
      <td>${r.pts||r.points||0}</td>
      <td>${r.reb||r.rebounds||0}</td>
      <td>${r.ast||r.assists||0}</td>
      <td>${r.stl||r.steals||0}</td>
      <td>${r.blk||r.blocks||0}</td>
    `;
    gamesBody.appendChild(tr);
  });
}

loadPlayer();
</script>

</body>
</html>
