<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:6px;}
.subtitle{text-align:center;color:#666;margin-bottom:10px;}

.stats-row{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:20px 0;
  flex-wrap:wrap;
}
.stat-box{
  background:#f4f6fb;
  padding:12px 18px;
  border-radius:10px;
  min-width:150px;
  text-align:center;
  font-weight:600;
}
.stat-box span{
  display:block;
  font-size:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:center;
}
th{
  background:#f0f0f0;
  position:sticky;
  top:0;
  cursor:pointer;
}
tr:nth-child(even){background:#f6f9ff;}

.bad{
  background:#fff3f3;
  border:1px solid #ffd0d0;
  color:#a40000;
  padding:10px 12px;
  border-radius:10px;
  max-width:900px;
  margin:0 auto 18px;
}

.game-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Player</h1>
<div class="subtitle">Career Game Log</div>

<div class="stats-row" id="totalsBoxes"></div>
<div class="stats-row" id="averagesBoxes"></div>

<div id="errorBox" class="bad" style="display:none;"></div>

<table id="gamesTable" style="display:none;">
<thead>
<tr>
  <th data-key="season">Season</th>
  <th>Game</th>
  <th>Team</th>
  <th data-key="min">MIN</th>
  <th data-key="pts">PTS</th>
  <th data-key="reb">REB</th>
  <th data-key="ast">AST</th>
  <th data-key="stl">STL</th>
  <th data-key="blk">BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerName = params.get("player");

const titleEl = document.getElementById("title");
const totalsBoxes = document.getElementById("totalsBoxes");
const averagesBoxes = document.getElementById("averagesBoxes");
const errorBox = document.getElementById("errorBox");
const gamesTable = document.getElementById("gamesTable");
const gamesBody = document.getElementById("gamesBody");

const seasonFiles = [
  "1976-77","1977-78","1978-79","1979-80","1981-82","2023-24"
];

function seasonToFile(season){
  return "data/nba/nba_season_" + season.replace("-","_") + ".json";
}

function showError(msg){
  errorBox.style.display = "block";
  errorBox.textContent = msg;
}

let rows = [];
let currentSort = {key:null, dir:"desc"};

async function loadPlayer(){
  if(!playerName){
    showError("Missing player parameter.");
    return;
  }

  titleEl.textContent = playerName;

  for(const season of seasonFiles){
    try{
      const res = await fetch(seasonToFile(season));
      if(!res.ok) continue;
      const data = await res.json();

      (data.games || []).forEach(g=>{
        (g.players || []).forEach(p=>{
          if(p.player === playerName){
            rows.push({
              season,
              game: `${g.home_team} vs ${g.away_team}`,
              team: p.team,
              min: parseFloat(p.min)||0,
              pts: parseInt(p.pts)||0,
              reb: parseInt(p.reb)||0,
              ast: parseInt(p.ast)||0,
              stl: parseInt(p.stl)||0,
              blk: parseInt(p.blk)||0
            });
          }
        });
      });

    }catch(e){}
  }

  if(rows.length === 0){
    showError("No games found for this player.");
    return;
  }

  render();
  gamesTable.style.display = "table";
}

function render(){
  gamesBody.innerHTML = "";

  let totals = {min:0,pts:0,reb:0,ast:0,stl:0,blk:0};

  rows.forEach(r=>{
    totals.min+=r.min;
    totals.pts+=r.pts;
    totals.reb+=r.reb;
    totals.ast+=r.ast;
    totals.stl+=r.stl;
    totals.blk+=r.blk;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.season}</td>
      <td><a class="game-link" href="nba-game.html?season=${encodeURIComponent(r.season)}&game=${encodeURIComponent(r.game)}">${r.game}</a></td>
      <td>${r.team}</td>
      <td>${r.min}</td>
      <td>${r.pts}</td>
      <td>${r.reb}</td>
      <td>${r.ast}</td>
      <td>${r.stl}</td>
      <td>${r.blk}</td>
    `;
    gamesBody.appendChild(tr);
  });

  const games = rows.length;

  totalsBoxes.innerHTML = `
    <div class="stat-box"><span>${games}</span>Games</div>
    <div class="stat-box"><span>${totals.pts}</span>Points</div>
    <div class="stat-box"><span>${totals.reb}</span>Rebounds</div>
    <div class="stat-box"><span>${totals.ast}</span>Assists</div>
  `;

  averagesBoxes.innerHTML = `
    <div class="stat-box"><span>${(totals.pts/games).toFixed(1)}</span>Avg Points</div>
    <div class="stat-box"><span>${(totals.reb/games).toFixed(1)}</span>Avg Rebounds</div>
    <div class="stat-box"><span>${(totals.ast/games).toFixed(1)}</span>Avg Assists</div>
  `;
}

document.querySelectorAll("th[data-key]").forEach(th=>{
  th.addEventListener("click",()=>{
    const key = th.dataset.key;

    if(currentSort.key === key){
      currentSort.dir = currentSort.dir === "desc" ? "asc" : "desc";
    } else {
      currentSort.key = key;
      currentSort.dir = "desc"; // highest first
    }

    rows.sort((a,b)=>{
      return currentSort.dir === "desc"
        ? b[key] - a[key]
        : a[key] - b[key];
    });

    render();
  });
});

loadPlayer();
</script>

</body>
</html>
