<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:28px 30px;
  margin-bottom:16px;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  margin-bottom:24px;
}

.section-title{
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#666;
  margin-bottom:15px;
  text-transform:uppercase;
}

.awards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.award-box{
  background:#eef3ff;
  border-radius:14px;
  padding:14px;
}

.award-name{
  font-weight:800;
  color:#003a99;
  margin-bottom:6px;
}

.award-years{
  font-size:13px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

  <!-- HERO -->
  <div class="hero">
    <h1 id="title">Player</h1>
  </div>

  <!-- ✅ MOVED AWARDS HERE -->
  <div class="section-card" id="awardsCard" style="display:none;">
    <div class="section-title">Awards</div>
    <div id="awardsContent"></div>
  </div>

  <!-- REST OF PAGE UNCHANGED -->
  <div class="section-card">
    <div class="section-title">Career Summary</div>
    <div id="careerTotals"></div>
  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

let awardsData = [];

function slug(name){
  return (name || "")
    .toLowerCase()
    .replace(/[^\w\s-]/g,"")
    .replace(/\s+/g,"-");
}

async function loadAwardsCSV(){
  const res = await fetch("/docs/data/nba/nba_awards.csv");
  const text = await res.text();

  const lines = text.split("\n").map(l => l.trim()).filter(l => l);
  const headers = lines[0].split(",").map(h => h.trim().toLowerCase());

  awardsData = [];

  lines.slice(1).forEach(line=>{
    const values = line.split(",").map(v => v.trim());

    let row = {};
    headers.forEach((h,i)=> row[h] = values[i] || "");

    const year = row.year;

    Object.keys(row).forEach(key=>{
      if(key === "year") return;

      const player = row[key];
      if(!player) return;

      awardsData.push({
        player,
        award: key.toUpperCase(),
        year
      });
    });
  });
}

function renderAwards(playerSlug){
  const card = document.getElementById("awardsCard");
  const container = document.getElementById("awardsContent");

  const awards = awardsData.filter(a => slug(a.player) === playerSlug);

  if(!awards.length){
    card.style.display = "none";
    return;
  }

  card.style.display = "block";

  const grouped = {};

  awards.forEach(a=>{
    if(!grouped[a.award]) grouped[a.award] = [];
    grouped[a.award].push(a.year);
  });

  let html = `<div class="awards-grid">`;

  Object.keys(grouped).forEach(award=>{
    html += `
      <div class="award-box">
        <div class="award-name">${award}</div>
        <div class="award-years">${grouped[award].sort((a,b)=>b-a).join(", ")}</div>
      </div>
    `;
  });

  html += `</div>`;

  container.innerHTML = html;
}

async function init(){
  if(!playerParam) return;

  document.getElementById("title").textContent =
    playerParam.replace(/-/g," ");

  await loadAwardsCSV();
  renderAwards(playerParam);
}

init();

</script>

</body>
</html>
