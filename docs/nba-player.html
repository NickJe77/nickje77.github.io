<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:28px 30px;
  margin-bottom:24px;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  margin-bottom:24px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:14px;
}

.stat-box{
  background:#eef3ff;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.table-wrap{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
}

.table-scroll{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:center;
}

.clickable-row{
  cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1 id="title">Player</h1>
</div>

<div class="section-card">
<div id="careerTotals" class="stats-grid"></div>
</div>

<div class="table-wrap">
<div class="table-scroll">
<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");
const gamesBody = document.getElementById("gamesBody");

let rows = [];

function getGameId(r){
  return (r.game_id || r.game || r.id || r.gameId || "")
    .toString()
    .trim()
    .replace(/[^\w]/g,"");
}

function cleanDate(d){
  return (d || "").split("T")[0];
}

function getSeason(r){
  if(r.season) return r.season;
  const d = cleanDate(r.date || "");
  if(!d) return "";
  const y = parseInt(d.substring(0,4));
  const m = parseInt(d.substring(5,7));
  return m >= 10 ? y : y - 1;
}

function renderGames(){
  gamesBody.innerHTML = "";

  rows.forEach(r=>{
    const gameId = getGameId(r);

    const row = document.createElement("tr");

    if(gameId && gameId.length >= 6){
      row.className = "clickable-row";
      row.onclick = ()=>{
        window.location = "nba-game.html?game=" + encodeURIComponent(gameId);
      };
    }

    row.innerHTML = `
      <td>${getSeason(r)}</td>
      <td>${cleanDate(r.date)}</td>
      <td>${r.team}</td>
      <td>${r.opp}</td>
      <td>${r.pts}</td>
      <td>${r.reb}</td>
      <td>${r.ast}</td>
      <td>${r.stl}</td>
      <td>${r.blk}</td>
    `;

    gamesBody.appendChild(row);
  });
}

async function loadPlayer(){
  const res = await fetch(`docs/data/nba/players/${playerParam}.json`);
  const data = await res.json();
  rows = Array.isArray(data) ? data : data.games;
  renderGames();
}

loadPlayer();
</script>

</body>
</html>
