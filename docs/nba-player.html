<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.navbar a:hover{
  text-decoration:underline;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:28px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  border-radius:18px;
  padding:28px 30px;
  margin-bottom:24px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
}

.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  flex-wrap:wrap;
}

.hero-title-wrap{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.eyebrow{
  font-size:12px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  opacity:.9;
}

#title{
  margin:0;
  font-size:42px;
  line-height:1.05;
  font-weight:800;
}

.hero-sub{
  font-size:15px;
  opacity:.95;
}

.hero-search{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.search-box{
  padding:12px 14px;
  border-radius:10px;
  border:none;
  font-size:14px;
  width:280px;
  outline:none;
}

.section-card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  margin-bottom:24px;
}

.table-wrap{
  background:#fff;
  border-radius:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
  overflow:hidden;
}

.table-header{
  padding:20px 22px 10px;
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#666;
  text-transform:uppercase;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:12px 10px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{
  background:#eef3ff;
  color:#003a99;
  font-weight:800;
}

tbody tr:nth-child(even){
  background:#f8faff;
}

tbody tr:hover{
  background:#eaf2ff;
}

.empty-state{
  padding:24px;
  text-align:center;
  color:#666;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<div class="hero">
<div class="hero-top">

<div class="hero-title-wrap">
<div class="eyebrow">NBA Player Career</div>
<h1 id="title">Player</h1>
<div class="hero-sub" id="heroSub">Career game log</div>
</div>

<div class="hero-search">
<input id="playerSearch" list="playerList" class="search-box" placeholder="Search player...">
<datalist id="playerList"></datalist>
</div>

</div>
</div>

<div class="table-wrap">

<div class="table-header">Game Log</div>

<table>

<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

<div id="emptyState" class="empty-state" style="display:none;">No games found.</div>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const playerParam = params.get("player");

const titleEl = document.getElementById("title");
const heroSub = document.getElementById("heroSub");
const gamesBody = document.getElementById("gamesBody");
const emptyState = document.getElementById("emptyState");

let rows = [];
let playersLoaded = false;

function cleanName(name){
  return (name || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function slug(name){
  return cleanName(name)
    .toLowerCase()
    .replace(/[^\w\s-]/g,"")
    .replace(/\s+/g,"-");
}

function parseNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function cleanDate(d){
  return (d || "").split("T")[0];
}

function sortRowsLatestFirst(data){
  return [...data].sort((a,b)=>{
    const da = cleanDate(a.date || a.game_date || "");
    const db = cleanDate(b.date || b.game_date || "");
    return db.localeCompare(da);
  });
}

async function fetchJSON(paths){

for(const p of paths){

try{
const res = await fetch(p,{cache:"no-store"});
if(res.ok) return await res.json();
}catch{}

}

throw new Error("JSON load failed");

}

async function loadPlayers(){

if(playersLoaded) return;

try{

const list = await fetchJSON([
"/data/nba/players/index.json",
"data/nba/players/index.json"
]);

const dl = document.getElementById("playerList");

list.forEach(item=>{

const name = typeof item==="string" ? item : item.name;

const opt=document.createElement("option");
opt.value=name;
dl.appendChild(opt);

});

playersLoaded=true;

}catch(e){console.error(e);}

}

document.getElementById("playerSearch").addEventListener("change",e=>{
const v=e.target.value.trim();
if(v) window.location="nba-player.html?player="+encodeURIComponent(v);
});

async function loadPlayer(){

if(!playerParam) return;

const displayName = decodeURIComponent(playerParam);

titleEl.textContent = displayName;
heroSub.textContent = "Career game log for " + displayName;

try{

const data = await fetchJSON([
`/data/nba/players/${slug(displayName)}.json`,
`data/nba/players/${slug(displayName)}.json`
]);

rows = Array.isArray(data) ? data : (data.games || []);

rows = rows.filter(r => r.team && r.opp);

/* REMOVE ALL STAR / EXHIBITION */

rows = rows.filter(r => {

const team=(r.team||"").toLowerCase();
const opp=(r.opp||"").toLowerCase();

if(team==="world" || team==="usa") return false;
if(opp==="world" || opp==="usa") return false;

const type=String(
r.game_type ||
r.type ||
r.season_type ||
""
).toLowerCase();

if(type.includes("preseason")) return false;
if(type.includes("all-star")) return false;
if(type.includes("all star")) return false;
if(type.includes("summer")) return false;
if(type.includes("exhibition")) return false;

return true;

});

rows = sortRowsLatestFirst(rows);

renderGames();

}catch(e){

console.error(e);
rows=[];
renderGames();

}

}

function renderGames(){

gamesBody.innerHTML="";

if(!rows.length){

emptyState.style.display="block";
return;

}

emptyState.style.display="none";

rows.forEach(r=>{

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${r.season || ""}</td>
<td>${cleanDate(r.date || r.game_date || "")}</td>
<td>${r.team || ""}</td>
<td>${r.opp || ""}</td>
<td>${parseNum(r.pts)}</td>
<td>${parseNum(r.reb)}</td>
<td>${parseNum(r.ast)}</td>
<td>${parseNum(r.stl)}</td>
<td>${parseNum(r.blk)}</td>

`;

gamesBody.appendChild(tr);

});

}

loadPlayers();
loadPlayer();

</script>

</body>
</html>
