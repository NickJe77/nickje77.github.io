<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player Career | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.page-wrap{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#1D428A,#C8102E);
  color:#fff;
  padding:24px;
  border-radius:14px;
  margin-bottom:25px;
}

select,input{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  margin:6px 6px 12px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

tr:nth-child(even){
  background:#f0f6ff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="playerName">Player</h1>
  <div>Career game log</div>
</div>

<input id="playerSearch" list="players" placeholder="Search player...">
<datalist id="players"></datalist>

<br>

<label>Team:</label>
<select id="teamFilter"><option value="all">All teams</option></select>

<label>Opponent:</label>
<select id="oppFilter"><option value="all">All teams</option></select>

<h2>Game Log</h2>

<table id="gamesTable">
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Team</th>
<th>Opp</th>
<th>PTS</th>
<th>REB</th>
<th>AST</th>
<th>STL</th>
<th>BLK</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

let playerData = null;

const params = new URLSearchParams(window.location.search);
let playerSlug = params.get("player");

async function loadPlayersList(){
  try{
    const res = await fetch("docs/data/nba/players/index.json");
    const list = await res.json();

    const dl = document.getElementById("players");

    list.forEach(p=>{
      const opt = document.createElement("option");
      opt.value = p.name;
      opt.dataset.slug = p.slug;
      dl.appendChild(opt);
    });

  }catch(e){
    console.log("Player index failed", e);
  }
}

document.getElementById("playerSearch").addEventListener("change", e=>{
  const val = e.target.value.toLowerCase();
  window.location = "?player=" + val.replace(/\s+/g,"-");
});

async function loadPlayer(){

  if(!playerSlug){
    console.log("No player slug");
    return;
  }

  try{
    const res = await fetch(`docs/data/nba/players/${playerSlug}.json`);
    playerData = await res.json();

    document.getElementById("playerName").innerText = playerData.name || "Unknown";

    buildFilters();
    renderGames();

  }catch(e){
    console.error("PLAYER LOAD FAILED", e);
  }
}

function buildFilters(){

  const teamSet = new Set();
  const oppSet = new Set();

  (playerData.games || []).forEach(g=>{
    if(g.team) teamSet.add(g.team);
    if(g.opponent) oppSet.add(g.opponent);
  });

  const teamSel = document.getElementById("teamFilter");
  const oppSel = document.getElementById("oppFilter");

  teamSet.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    teamSel.appendChild(o);
  });

  oppSet.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    oppSel.appendChild(o);
  });

  teamSel.onchange = renderGames;
  oppSel.onchange = renderGames;
}

function renderGames(){

  if(!playerData || !playerData.games){
    console.log("No games");
    return;
  }

  const tbody = document.querySelector("#gamesTable tbody");
  tbody.innerHTML = "";

  const teamVal = document.getElementById("teamFilter").value;
  const oppVal = document.getElementById("oppFilter").value;

  const games = playerData.games.filter(g=>{
    return (teamVal==="all" || g.team===teamVal) &&
           (oppVal==="all" || g.opponent===oppVal);
  });

  // SORT NEWEST FIRST (fix your "missing recent games" issue)
  games.sort((a,b)=> new Date(b.date) - new Date(a.date));

  games.forEach(g=>{

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${g.season || ""}</td>
      <td>${g.date || ""}</td>
      <td>${g.team || ""}</td>
      <td>${g.opponent || ""}</td>
      <td>${g.points ?? g.pts ?? 0}</td>
      <td>${g.rebounds ?? g.reb ?? 0}</td>
      <td>${g.assists ?? g.ast ?? 0}</td>
      <td>${g.steals ?? g.stl ?? 0}</td>
      <td>${g.blocks ?? g.blk ?? 0}</td>
    `;

    tbody.appendChild(tr);
  });

}

loadPlayersList();
loadPlayer();

</script>

</body>
</html>
