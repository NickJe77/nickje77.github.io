<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:6px;}
.subtitle{text-align:center;color:#666;margin-bottom:14px;}

.controls{
  text-align:center;
  margin-bottom:12px;
}

select{
  padding:6px 10px;
  font-size:14px;
}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:center;
}
th{
  background:#f0f0f0;
  position:sticky;
  top:0;
}
tr:nth-child(even){background:#f6f9ff;}

tfoot td{
  font-weight:700;
  background:#eaf0ff;
}

.bad{
  background:#fff3f3;
  border:1px solid #ffd0d0;
  color:#a40000;
  padding:10px 12px;
  border-radius:10px;
  max-width:900px;
  margin:0 auto 18px;
}

.game-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}

.team-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<h1 id="title">NBA Player</h1>
<div class="subtitle" id="subtitle"></div>

<div class="controls">
  Season:
  <select id="seasonFilter">
    <option value="all">All Seasons</option>
  </select>
</div>

<div id="errorBox" class="bad" style="display:none;"></div>

<table id="gamesTable" style="display:none;">
<thead>
<tr>
  <th>Season</th>
  <th>Game</th>
  <th>Team</th>
  <th>MIN</th>
  <th>PTS</th>
  <th>REB</th>
  <th>AST</th>
  <th>STL</th>
  <th>BLK</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
<tfoot>
<tr id="totalsRow"></tr>
</tfoot>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const playerName = params.get("player");

const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");
const errorBox = document.getElementById("errorBox");
const gamesTable = document.getElementById("gamesTable");
const gamesBody = document.getElementById("gamesBody");
const totalsRow = document.getElementById("totalsRow");
const seasonFilter = document.getElementById("seasonFilter");

const seasonFiles = [
  "1976-77","1977-78","1978-79","1979-80","1981-82","2023-24"
];

let allRows = [];

function seasonToFile(season){
  return "data/nba/nba_season_" + season.replace("-","_") + ".json";
}

function showError(msg){
  errorBox.style.display = "block";
  errorBox.textContent = msg;
}

async function loadPlayer(){
  if(!playerName){
    showError("Missing player parameter.");
    return;
  }

  titleEl.textContent = playerName;
  subtitleEl.textContent = "Career Game Log";

  for(const season of seasonFiles){
    try{
      const res = await fetch(seasonToFile(season));
      if(!res.ok) continue;
      const data = await res.json();

      (data.games || []).forEach(g=>{
        (g.players || []).forEach(p=>{
          if(p.player === playerName){
            allRows.push({
              season,
              game: `${g.home_team} vs ${g.away_team}`,
              team: p.team,
              min: Number(p.min)||0,
              pts: Number(p.pts)||0,
              reb: Number(p.reb)||0,
              ast: Number(p.ast)||0,
              stl: Number(p.stl)||0,
              blk: Number(p.blk)||0
            });
          }
        });
      });

    }catch(e){}
  }

  if(allRows.length === 0){
    showError("No games found for this player.");
    return;
  }

  // newest first
  allRows.sort((a,b)=>b.season.localeCompare(a.season));

  // populate season dropdown
  [...new Set(allRows.map(r=>r.season))].forEach(season=>{
    const opt = document.createElement("option");
    opt.value = season;
    opt.textContent = season;
    seasonFilter.appendChild(opt);
  });

  seasonFilter.addEventListener("change", renderTable);

  renderTable();
}

function renderTable(){
  const filter = seasonFilter.value;
  const rows = filter==="all" ? allRows : allRows.filter(r=>r.season===filter);

  gamesBody.innerHTML = "";
  totalsRow.innerHTML = "";

  let totals = {min:0,pts:0,reb:0,ast:0,stl:0,blk:0};

  rows.forEach(r=>{
    totals.min += r.min;
    totals.pts += r.pts;
    totals.reb += r.reb;
    totals.ast += r.ast;
    totals.stl += r.stl;
    totals.blk += r.blk;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.season}</td>
      <td>
        <a class="game-link" href="nba-game.html?season=${encodeURIComponent(r.season)}&game=${encodeURIComponent(r.game)}">
          ${r.game}
        </a>
      </td>
      <td>
        <a class="team-link" href="nba-team.html?team=${encodeURIComponent(r.team)}">
          ${r.team}
        </a>
      </td>
      <td>${r.min}</td>
      <td>${r.pts}</td>
      <td>${r.reb}</td>
      <td>${r.ast}</td>
      <td>${r.stl}</td>
      <td>${r.blk}</td>
    `;
    gamesBody.appendChild(tr);
  });

  totalsRow.innerHTML = `
    <td colspan="3">TOTAL</td>
    <td>${totals.min}</td>
    <td>${totals.pts}</td>
    <td>${totals.reb}</td>
    <td>${totals.ast}</td>
    <td>${totals.stl}</td>
    <td>${totals.blk}</td>
  `;

  gamesTable.style.display = "table";
}

loadPlayer();
</script>

</body>
</html>
