<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Race Result | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="racing.css">
<link rel="stylesheet" href="archive.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#0f141a; --muted:#69727c; --faint:#9aa3ad;
  --line:#e3e8ee; --board:#0c130f; --board-2:#161f16; --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16); --win-bg:#e6f4ea; --win-text:#1e7a3d;
  --display:'Oswald',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --radius:16px;
}
*{box-sizing:border-box;}
body{ font-size:15px; font-family:var(--body); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; margin:0; }

#global-nav nav{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;}
#global-nav nav a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
#global-nav nav a:hover{opacity:1;}

.page{ max-width:1100px; margin:0 auto; padding:26px 20px 70px; }

.hero{
  position:relative; background:linear-gradient(160deg,var(--board-2),var(--board)); color:#fff;
  border-radius:var(--radius); margin-bottom:22px; box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  padding:24px 28px;
}
.eyebrow{
  font-family:var(--body); font-size:11.5px; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--accent); margin-bottom:14px; text-align:center;
}
.nav-header{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
.nav-header a{
  color:rgba(255,255,255,.75); text-decoration:none; font-family:var(--body); font-weight:600;
  font-size:13px; white-space:nowrap; transition:color .15s;
}
.nav-header a:hover{ color:var(--accent); }
.nav-header a:empty{ visibility:hidden; }
h1{
  margin:0; text-align:center; flex:1; font-family:var(--display); font-weight:600;
  font-size:clamp(20px,4vw,30px); letter-spacing:.01em; text-transform:uppercase; color:#fff;
}
.race-meta{ text-align:center; color:rgba(255,255,255,.65); font-size:12.5px; margin-top:10px; }

.section-title{
  font-family:var(--display); font-weight:600; font-size:16px; text-transform:uppercase;
  letter-spacing:.02em; color:var(--ink); margin:26px 0 10px;
}

.table-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--faint); border-radius:var(--radius); margin-top:24px; }
table{ width:100%; border-collapse:collapse; min-width:600px; }
th, td{ padding:11px 14px; text-align:left; font-size:13.5px; border-bottom:1px solid var(--line); white-space:nowrap; }
th{ background:#f7f9fb; color:var(--muted); font-family:var(--body); font-weight:600; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
td{ color:#27313c; font-variant-numeric:tabular-nums; }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover td{ background:#f9fbfd; }

.grade-pill{ display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700; }
.grade-G1{background:#fbe7e5;color:#c0362c;}
.grade-G2{background:var(--accent-soft);color:#8a6a25;}
.grade-G3{background:#e6f0fb;color:#2a5d8f;}
.grade-LR{background:#eceef0;color:var(--muted);}

.boxes-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:10px; }
@media (max-width:900px){ .boxes-grid{ grid-template-columns:1fr 1fr; } }
@media (max-width:520px){ .boxes-grid{ grid-template-columns:1fr; } }

.summary-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:10px; }
@media (max-width:820px){ .summary-grid{ grid-template-columns:1fr; } }

.box{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.box-header{
  padding:12px 16px; font-family:var(--display); font-weight:600; font-size:13px;
  text-transform:uppercase; letter-spacing:.02em; color:#fff;
}
.box-G1 .box-header{ background:#c0362c; }
.box-G2 .box-header{ background:#a5791f; }
.box-G3 .box-header{ background:#2a5d8f; }
.box-LR .box-header{ background:var(--muted); }

.winner-row{ padding:10px 16px; border-bottom:1px solid var(--line); font-size:13.5px; cursor:pointer; }
.winner-row:hover{ background:#f9fbfd; }
.winner-row:last-child{ border-bottom:none; }
.race-names{ font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.4; }

.summary-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 16px; border-bottom:1px solid var(--line); font-size:13.5px;
}
.summary-row:last-child{ border-bottom:none; }
.summary-name{ color:var(--ink); }
.summary-count{
  font-family:var(--display); font-weight:600; font-size:12px; color:var(--muted);
  background:#f2f4f6; border-radius:999px; padding:2px 10px; white-space:nowrap;
}

.horse-link{ color:var(--ink); text-decoration:none; }
.horse-link:hover{ color:var(--accent); }

.loading{ text-align:center; color:var(--muted); font-style:italic; padding:20px; font-size:13px; }

.search-box{ max-width:420px; margin:0 auto 22px; }
.search-box input{
  width:100%; padding:11px 16px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); font-family:var(--body); font-size:13.5px; color:var(--ink);
  box-sizing:border-box;
}
.search-box input:focus{ outline:none; border-color:var(--faint); }
</style>
</head>

<body>

<div id="global-nav"></div>

<div class="page">

  <div class="hero">
    <div class="eyebrow">Australian Stakes Races</div>
    <h1 id="title">Loading...</h1>
    <div class="race-meta" id="race-meta"></div>
  </div>

  <div class="search-box">
    <input type="text" id="tableSearch" placeholder="Search by winner, jockey, trainer or track...">
  </div>

  <div class="section-title">Race History</div>
  <div class="summary-grid">
    <div class="box">
      <div class="box-header" style="background:var(--ink);">Leading Trainers (3 or more wins)</div>
      <div id="leadingTrainers"><div class="loading">Loading...</div></div>
    </div>
    <div class="box">
      <div class="box-header" style="background:var(--ink);">Leading Jockeys (3 or more wins)</div>
      <div id="leadingJockeys"><div class="loading">Loading...</div></div>
    </div>
    <div class="box" id="multipleWinnersBox">
      <div class="box-header" style="background:var(--ink);">Multiple Winners</div>
      <div id="multipleWinners"><div class="loading">Loading...</div></div>
    </div>
  </div>

  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Track</th>
        <th>Grade</th>
        <th>Winner</th>
        <th>Margin</th>
        <th>SP</th>
        <th>Jockey</th>
        <th>Trainer</th>
      </tr>
    </thead>
    <tbody id="results">
      <tr><td colspan="8" class="loading">Loading...</td></tr>
    </tbody>
  </table>
  </div>

</div>

<script>

const GRADE_LABELS = { G1: "Group 1", G2: "Group 2", G3: "Group 3", LR: "Listed" };

const params = new URLSearchParams(window.location.search);
const raceName = params.get("race");

if(!raceName){
  document.getElementById("title").textContent = "No race selected";
  throw new Error("Missing race parameter");
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const lines = text.trim().replace(/\r/g,"").split("\n");
  const headers = lines[0].split(",").map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const values = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    let obj = {};
    headers.forEach((h,i)=>{ obj[h] = (values[i]||"").replace(/^"|"$/g,"").trim(); });
    return obj;
  });
}

function dateToSortable(d){
  const [day, month, year] = d.split("/").map(Number);
  return year * 10000 + month * 100 + day;
}

function horseLink(name){
  if(!name) return "";
  return `<a class="horse-link" href="australia-stakes-winners-horse.html?horse=${encodeURIComponent(name)}">${name}</a>`;
}

// Tallies how many times each value in `field` appears across every
// running of this race (e.g. every Trainer, every Jockey, every
// Winner), sorted most wins first. `minCount` lets "Multiple Winners"
// filter down to only horses that have actually won more than once,
// while trainers/jockeys show everyone.
// Splits a co-training credit like "Peter & Paul Snowden" into
// ["Peter Snowden", "Paul Snowden"] -- shared surnames are often
// written once, at the end, for everyone who has that surname.
// Handles mixed cases too: "David & Ben Hayes & Tom Dabernig" correctly
// gives David and Ben the Hayes surname while leaving Tom Dabernig's
// own surname alone. Verified against all 94 distinct multi-trainer
// strings actually present in this dataset.
// Confirmed same real trainer/operation recorded under two different
// strings in this data -- merge here rather than in the split logic
// above, so this also correctly applies if the name ever appears
// inside a joint credit.
const TRAINER_NAME_CANONICAL = {
  "team hawkes": "John Hawkes",
};
function canonicalTrainer(name){
  return TRAINER_NAME_CANONICAL[name.trim().toLowerCase()] || name;
}

function splitTrainerNames(raw){
  // Confirmed real case this needs to handle: "Ben, Will & JD Hayes"
  // (three people -- comma between the first two, "&" before the
  // last), not just simple two-person "&" joins.
  const segments = raw.split(/[,&]/).map(s => s.replace(/\s+/g, " ").trim()).filter(Boolean);
  const result = new Array(segments.length);
  let currentSurname = null;
  for(let i = segments.length - 1; i >= 0; i--){
    const words = segments[i].split(/\s+/);
    if(words.length === 1){
      result[i] = currentSurname ? `${words[0]} ${currentSurname}` : words[0];
    }else{
      result[i] = segments[i];
      currentSurname = words[words.length - 1];
    }
  }
  return result.map(canonicalTrainer);
}

function tallyField(runnings, field, minCount=1, splitPartners=false){
  const counts = {};
  runnings.forEach(r => {
    const raw = (r[field] || "").trim();
    if(!raw) return;
    // Trainer credits are often multiple people joined with "&" (e.g.
    // "Peter Moody & Katerine Coleman", "David & Ben Hayes & Tom
    // Dabernig") -- confirmed common in this data (1,798 rows across
    // the full dataset). Without splitting, Peter Moody's solo wins and
    // his co-trained wins get counted as two different "people" instead
    // of one trainer's true total. Each named person gets full credit
    // for the win, not a fraction of it. Jockey/Winner never use this
    // joined format, so splitPartners defaults off for those.
    const names = splitPartners ? splitTrainerNames(raw) : [raw];
    names.forEach(key => {
      counts[key] = (counts[key] || 0) + 1;
    });
  });
  return Object.entries(counts)
    .filter(([, count]) => count >= minCount)
    .sort((a, b) => b[1] - a[1])
    .map(([name, count]) => ({ name, count }));
}

function renderSummaryBox(elementId, entries, noun, linkToHorse=false, hideBoxId=null){
  const container = document.getElementById(elementId);
  if(!entries.length){
    if(hideBoxId){
      document.getElementById(hideBoxId).style.display = "none";
      return;
    }
    container.innerHTML = '<div class="loading">None on record.</div>';
    return;
  }
  if(hideBoxId){
    document.getElementById(hideBoxId).style.display = "";
  }
  container.innerHTML = entries.map(e => `
    <div class="summary-row">
      <div class="summary-name">${linkToHorse ? horseLink(e.name) : e.name}</div>
      <div class="summary-count">${e.count} ${noun}${e.count !== 1 ? "s" : ""}</div>
    </div>
  `).join("");
}

// Every row in this CSV is already a race winner -- there's no separate
// "Position" field, since this data only ever records who won, not a
// full field of placings. The page shows every winner of the named race
// across every year it's been run, most recent first.
fetch("/data/australia-stakes.csv")
  .then(res => res.text())
  .then(text => {
    const allData = parseCSV(text);
    const runnings = allData.filter(r => r["Race"] === raceName);

    if(runnings.length === 0){
      document.getElementById("title").textContent = "Race not found";
      document.getElementById("results").innerHTML = '<tr><td colspan="8" class="loading">No results found for this race.</td></tr>';
      ["leadingTrainers","leadingJockeys","multipleWinners"].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="loading">No data available.</div>';
      });
      return;
    }

    runnings.sort((a,b) => dateToSortable(b.Date) - dateToSortable(a.Date));

    document.getElementById("title").textContent = raceName;
    document.getElementById("race-meta").textContent =
      `${runnings.length} running${runnings.length !== 1 ? "s" : ""} on record — ${runnings[runnings.length-1].Date} to ${runnings[0].Date}`;

    function renderTable(rows){
      const tbody = document.getElementById("results");
      tbody.innerHTML = "";
      if(!rows.length){
        tbody.innerHTML = '<tr><td colspan="8" class="loading">No matching results.</td></tr>';
        return;
      }
      rows.forEach(r => {
        const grade = r["Race Grade"];
        const gradeLabel = GRADE_LABELS[grade] || grade;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.Date}</td>
          <td>${r.Track}</td>
          <td><span class="grade-pill grade-${grade}">${gradeLabel}</span></td>
          <td>${horseLink(r.Winner)}</td>
          <td>${r.Margin}</td>
          <td>${r.SP}</td>
          <td>${r.Jockey}</td>
          <td>${r.Trainer}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    renderTable(runnings);

    // Search filters only the table below -- the leader boxes always
    // reflect the race's FULL history regardless of what's searched,
    // since "leading trainer" shouldn't change based on a text filter.
    document.getElementById("tableSearch").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if(!q){ renderTable(runnings); return; }
      const filtered = runnings.filter(r =>
        (r.Winner || "").toLowerCase().includes(q) ||
        (r.Jockey || "").toLowerCase().includes(q) ||
        (r.Trainer || "").toLowerCase().includes(q) ||
        (r.Track || "").toLowerCase().includes(q)
      );
      renderTable(filtered);
    });

    // Top 10 by wins for trainers/jockeys (a long-running race can have
    // dozens of one-time winners, which isn't useful to show in full).
    // Multiple Winners has no cap -- it's already a short, meaningful
    // list since it only includes horses with 2+ wins.
    renderSummaryBox("leadingTrainers", tallyField(runnings, "Trainer", 3, true), "win");
    renderSummaryBox("leadingJockeys", tallyField(runnings, "Jockey", 3), "win");
    renderSummaryBox("multipleWinners", tallyField(runnings, "Winner", 2), "win", true, "multipleWinnersBox");
  })
  .catch(err => {
    console.error(err);
    document.getElementById("title").textContent = "Error loading race data";
    document.getElementById("results").innerHTML = '<tr><td colspan="8" class="loading">Could not load data.</td></tr>';
    ["leadingTrainers","leadingJockeys","multipleWinners"].forEach(id => {
      document.getElementById(id).innerHTML = '<div class="loading">Could not load data.</div>';
    });
  });

/* LOAD NAV BAR */
fetch("g1-archive.html")
  .then(res => res.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const nav = doc.querySelector("nav");
    if(nav){ document.getElementById("global-nav").innerHTML = nav.outerHTML; }
  });

</script>

</body>
</html>
