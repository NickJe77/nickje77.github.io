\<!DOCTYPE html>
<html>
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Game</title>

<style>
body{font-family:system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:22px;padding:14px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:17px;}
.navbar a:hover{text-decoration:underline;}

.page{max-width:1200px;margin:auto;padding:25px;}
h1{text-align:center;margin-bottom:6px;}
.meta{text-align:center;color:#555;margin-bottom:18px;}
.final-score{text-align:center;font-size:22px;font-weight:700;margin-bottom:20px;}

.teams-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:800px){.teams-wrap{grid-template-columns:1fr;}}

.team-box{background:#fff;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.08);overflow:hidden;}

.team-header{padding:12px;text-align:center;font-weight:700;font-size:18px;}
.team-stripe{height:16px;margin:0 12px 12px;border-radius:6px;border:1px solid #ccc;}

table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #ddd;padding:6px 8px;text-align:center;font-size:14px;}
th{background:#f3f6fb;cursor:pointer;user-select:none;}
td.left{text-align:left;font-weight:600;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#e8f0ff;}

.sort-indicator{font-size:11px;margin-left:4px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="afl.html">AFL</a>
</div>

<div class="page">

<h1 id="title"></h1>
<div class="meta" id="venueLine"></div>
<div class="final-score" id="finalScore"></div>

<div class="teams-wrap">

<div class="team-box">
<div class="team-header" id="teamAName"></div>
<div class="team-stripe" id="teamAStripe"></div>
<table id="teamATable">
<thead>
<tr>
<th data-col="player">Player</th>
<th data-col="K">K</th>
<th data-col="HB">H</th>
<th data-col="D">D</th>
<th data-col="G">G</th>
<th data-col="B">B</th>
</tr>
</thead>
<tbody id="teamARows"></tbody>
</table>
</div>

<div class="team-box">
<div class="team-header" id="teamBName"></div>
<div class="team-stripe" id="teamBStripe"></div>
<table id="teamBTable">
<thead>
<tr>
<th data-col="player">Player</th>
<th data-col="K">K</th>
<th data-col="HB">H</th>
<th data-col="D">D</th>
<th data-col="G">G</th>
<th data-col="B">B</th>
</tr>
</thead>
<tbody id="teamBRows"></tbody>
</table>
</div>

</div>
</div>

<script>

const teamStripes={
"Carlton":"repeating-linear-gradient(90deg,#001A3D 0 24px,#ffffff 24px 48px,#001A3D 48px 72px)",
"Collingwood":"repeating-linear-gradient(90deg,#000000 0 24px,#ffffff 24px 48px,#000000 48px 72px)",
"Richmond":"repeating-linear-gradient(90deg,#FFD200 0 24px,#000 24px 48px,#FFD200 48px 72px)",
"Essendon":"repeating-linear-gradient(90deg,#CC2031 0 24px,#000 24px 48px,#CC2031 48px 72px)",
"Geelong":"repeating-linear-gradient(90deg,#1C3C63 0 24px,#ffffff 24px 48px,#1C3C63 48px 72px)",
"Sydney":"repeating-linear-gradient(90deg,#ED171F 0 24px,#ffffff 24px 48px,#ED171F 48px 72px)",
"West Coast":"repeating-linear-gradient(90deg,#002B5C 0 24px,#FFD200 24px 48px,#002B5C 48px 72px)",
"Adelaide":"repeating-linear-gradient(90deg,#002B5C 0 24px,#FFD200 24px 48px,#CC2031 48px 72px)",
"Port Adelaide":"repeating-linear-gradient(90deg,#1C1C1C 0 24px,#00B2A9 24px 48px,#ffffff 48px 72px)",
"Brisbane":"repeating-linear-gradient(90deg,#7C003E 0 24px,#FFD200 24px 48px,#005BAC 48px 72px)",
"Hawthorn":"repeating-linear-gradient(90deg,#4D2004 0 24px,#FFD200 24px 48px,#4D2004 48px 72px)",
"Melbourne":"repeating-linear-gradient(90deg,#002B5C 0 24px,#ED171F 24px 48px,#002B5C 48px 72px)",
"Western Bulldogs":"repeating-linear-gradient(90deg,#1E3A8A 0 24px,#ED171F 24px 48px,#ffffff 48px 72px)",
"Gold Coast":"repeating-linear-gradient(90deg,#B90A32 0 24px,#FFD200 24px 48px,#B90A32 48px 72px)",
"GWS":"repeating-linear-gradient(90deg,#F47920 0 24px,#000 24px 48px,#ffffff 48px 72px)",
"St Kilda":"repeating-linear-gradient(90deg,#000 0 24px,#ED171F 24px 48px,#ffffff 48px 72px)",
"Fremantle":"repeating-linear-gradient(90deg,#2B004F 0 24px,#ffffff 24px 48px,#2B004F 48px 72px)",
"North Melbourne":"repeating-linear-gradient(90deg,#0A2E8A 0 24px,#ffffff 24px 48px,#0A2E8A 48px 72px)"
};

const params=new URLSearchParams(location.search);
const matchId=params.get("match");

const startYear=1990;
const endYear=new Date().getFullYear();

async function loadGame(){

const year=params.get("year");

/* FAST PATH */
if(year){
  try{
    const res=await fetch(`/data/afl/afl_${year}.json`);
    if(res.ok){
      const data=await res.json();
      const game=data.filter(x=>String(x.match_id)===String(matchId));
      if(game.length){
        buildGame(year,game);
        return;
      }
    }
  }catch(e){console.error(e);}
}

/* FALLBACK (old behaviour) */
for(let y=startYear;y<=endYear;y++){
  try{
    const res=await fetch(`/data/afl/afl_${y}.json`);
    if(!res.ok) continue;

    const data=await res.json();
    const game=data.filter(x=>String(x.match_id)===String(matchId));

    if(game.length){
      buildGame(y,game);
      return;
    }

  }catch(e){}
}

}

function buildGame(season,game){

const info=game[0];

const teams=[...new Set(game.map(p=>p.played_for))];

const teamA=teams[0];
const teamB=teams[1];

const teamAPlayers=game.filter(p=>p.played_for===teamA);
const teamBPlayers=game.filter(p=>p.played_for===teamB);

const teamAScore=teamAPlayers.reduce((s,p)=>s+(p.G||0)*6+(p.B||0),0);
const teamBScore=teamBPlayers.reduce((s,p)=>s+(p.G||0)*6+(p.B||0),0);

document.getElementById("title").textContent=
`${season} – ${info.round}: ${teamA} vs ${teamB}`;

document.getElementById("venueLine").textContent=
`Venue: ${info.venue} · Crowd: ${Number(info.crowd||0).toLocaleString()}`;

document.getElementById("finalScore").textContent=
`${teamA} ${teamAScore} – ${teamBScore} ${teamB}`;

document.getElementById("teamAName").textContent=teamA;
document.getElementById("teamBName").textContent=teamB;

document.getElementById("teamAStripe").style.background=teamStripes[teamA]||"#999";
document.getElementById("teamBStripe").style.background=teamStripes[teamB]||"#999";

renderTable("teamARows",teamAPlayers,"teamATable");
renderTable("teamBRows",teamBPlayers,"teamBTable");

}

function renderTable(tbodyId,players,tableId){

players.sort((a,b)=>b.D-a.D);

const tbody=document.getElementById(tbodyId);
tbody.innerHTML="";

players.forEach(p=>{

const tr=document.createElement("tr");

tr.onclick=()=>location.href=`afl-player.html?name=${encodeURIComponent(p.player)}`;

tr.innerHTML=`
<td class="left">${p.player}</td>
<td>${p.K||0}</td>
<td>${p.HB||0}</td>
<td>${p.D||0}</td>
<td>${p.G||0}</td>
<td>${p.B||0}</td>`;

tbody.appendChild(tr);

});

enableSorting(tableId,players);

}

function enableSorting(tableId,players){

const table=document.getElementById(tableId);
const headers=table.querySelectorAll("th");

let sortState={};

headers.forEach(th=>{

th.onclick=()=>{

const col=th.dataset.col;
if(!col) return;

const asc=sortState[col]===true;

sortState={};
sortState[col]=!asc;

players.sort((a,b)=>{

if(col==="player")
return asc?a.player.localeCompare(b.player):b.player.localeCompare(a.player);

return asc?(a[col]||0)-(b[col]||0):(b[col]||0)-(a[col]||0);

});

headers.forEach(h=>h.querySelector(".sort-indicator")?.remove());

const indicator=document.createElement("span");
indicator.className="sort-indicator";
indicator.textContent=!asc?"▼":"▲";

th.appendChild(indicator);

renderTable(table.querySelector("tbody").id,players,tableId);

};

});

}

loadGame();

</script>

</body>
</html>
