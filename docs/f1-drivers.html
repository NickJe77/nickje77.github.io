<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Formula 1 Drivers | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: system-ui, Arial, sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:900px;
  margin:0 auto;
  padding:30px 20px;
}

h1{
  text-align:center;
  margin-bottom:15px;
}

.controls{
  text-align:center;
  margin-bottom:15px;
}
.controls input{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
  width:250px;
}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:10px;
  text-align:left;
}
th{
  background:#f0f0f0;
}
tr:nth-child(even){
  background:#f6f9ff;
}

a.driver-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
a.driver-link:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">
  <h1>Formula 1 Drivers</h1>

  <div class="controls">
    <input id="filterBox" placeholder="Filter driver…">
  </div>

  <table>
    <thead>
      <tr>
        <th>Driver</th>
      </tr>
    </thead>
    <tbody id="driverTable"></tbody>
  </table>
</div>

<script>
const startYear = 1950;
const endYear = new Date().getFullYear();

const tableBody = document.getElementById("driverTable");
const filterBox = document.getElementById("filterBox");

let drivers = new Set();

function cleanDriver(name){
  return String(name || "").replace(/\s[A-Z]{3}$/, "");
}

async function loadDrivers(){
  for(let y = startYear; y <= endYear; y++){
    try{
      const r = await fetch(`data/f1/${y}.json`);
      if(!r.ok) continue;
      const d = await r.json();

      (d.races || []).forEach(race=>{
        (race.results || []).forEach(r=>{
          const name = cleanDriver(r.driver);
          if(name) drivers.add(name);
        });
      });
    }catch(e){}
  }
  render();
}

function render(){
  const filter = filterBox.value.toLowerCase();
  tableBody.innerHTML = "";

  [...drivers]
    .sort((a,b)=>a.localeCompare(b))
    .filter(d=>d.toLowerCase().includes(filter))
    .forEach(name=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <a class="driver-link" href="f1-driver.html?driver=${encodeURIComponent(name)}">
            ${name}
          </a>
        </td>
      `;
      tableBody.appendChild(tr);
    });
}

filterBox.addEventListener("input", render);

loadDrivers();
</script>

</body>
</html>
