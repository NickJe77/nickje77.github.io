<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Formula 1 Drivers | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:36px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
p.lead{text-align:center;color:var(--muted);margin:0 0 22px;font-size:14.5px;}

.controls{display:flex;justify-content:center;margin-bottom:20px;}
input{
  padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink);width:280px;max-width:100%;
}
input:hover{border-color:var(--faint);}
input:focus{outline:none;border-color:var(--accent);}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;cursor:pointer;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);user-select:none;
}
th:hover{color:var(--ink);}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}

a.driver-link{color:var(--ink);text-decoration:none;font-weight:700;}
a.driver-link:hover{color:var(--accent);}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div class="page-wrap">

<div class="hero">
  <span class="eyebrow">Formula 1</span>
  <h1>Formula 1 Drivers</h1>
</div>

<p class="lead">Career statistics across all Formula 1 seasons.</p>

<div class="controls">
  <input id="filterBox" type="text" placeholder="Filter driver…">
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th onclick="setSort('driver')">Driver</th>
  <th onclick="setSort('starts')">Starts</th>
  <th onclick="setSort('wins')">Wins</th>
  <th onclick="setSort('points')">Points</th>
  <th onclick="setSort('pps')">Pts / Start</th>
</tr>
</thead>
<tbody id="driverTable"></tbody>
</table>
</div>
</div>

<script>
const startYear = 1950;
const endYear = new Date().getFullYear();

const tableBody = document.getElementById("driverTable");
const filterBox = document.getElementById("filterBox");

let currentStats = {};
let sortKey = "points";
let sortDir = "desc";

function cleanDriver(name){
  return String(name||"").replace(/\s[A-Z]{3}$/,"");
}

async function loadAll(){
  const stats = {};

  for(let y=startYear;y<=endYear;y++){
    try{
      const r = await fetch(`data/f1/${y}.json`);
      if(!r.ok) continue;
      const d = await r.json();

      (d.races||[]).forEach(race=>{
        (race.results||[]).forEach(r=>{
          const driver = cleanDriver(r.driver);
          if(!driver) return;

          if(!stats[driver]){
            stats[driver]={driver, starts:0, wins:0, points:0, pps:0};
          }

          stats[driver].starts++;
          if(Number(r.position)===1) stats[driver].wins++;
          stats[driver].points += Number(r.points)||0;
        });
      });
    }catch(e){}
  }

  Object.values(stats).forEach(d=>{
    d.pps = d.starts ? d.points / d.starts : 0;
  });

  currentStats = stats;
  renderTable();
}

function setSort(key){
  if(sortKey === key){
    sortDir = sortDir === "asc" ? "desc" : "asc";
  }else{
    sortKey = key;
    sortDir = key === "driver" ? "asc" : "desc";
  }
  renderTable();
}

function renderTable(){
  const filter = filterBox.value.toLowerCase();
  tableBody.innerHTML="";

  let rows = Object.values(currentStats)
    .filter(r => r.driver.toLowerCase().includes(filter));

  rows.sort((a,b)=>{
    let v1 = a[sortKey];
    let v2 = b[sortKey];

    if(sortKey === "driver"){
      return sortDir==="asc"
        ? v1.localeCompare(v2)
        : v2.localeCompare(v1);
    }else{
      return sortDir==="asc"
        ? v1 - v2
        : v2 - v1;
    }
  });

  rows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>
        <a class="driver-link" href="f1-driver.html?driver=${encodeURIComponent(r.driver)}">
          ${r.driver}
        </a>
      </td>
      <td>${r.starts}</td>
      <td>${r.wins}</td>
      <td>${r.points.toFixed(1)}</td>
      <td>${r.pps.toFixed(2)}</td>
    `;
    tableBody.appendChild(tr);
  });
}

filterBox.addEventListener("input", renderTable);

loadAll();
</script>

</body>
</html>
