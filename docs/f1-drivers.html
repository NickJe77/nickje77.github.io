<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Formula 1 Drivers | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: system-ui, Arial, sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:6px;}
p{text-align:center;color:#555;margin-bottom:20px;}

.controls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:20px;
}

select,input{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{
  background:#f0f0f0;
  cursor:pointer;
}
tr:nth-child(even){background:#f6f9ff;}

a.driver-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
a.driver-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">
<h1>Formula 1 Drivers</h1>
<p>Career statistics across all Formula 1 seasons.</p>

<div class="controls">
  <input id="filterBox" type="text" placeholder="Filter driver…">
</div>

<table>
<thead>
<tr>
  <th onclick="setSort('driver')">Driver</th>
  <th onclick="setSort('starts')">Starts</th>
  <th onclick="setSort('wins')">Wins</th>
  <th onclick="setSort('points')">Points</th>
  <th onclick="setSort('pps')">Pts / Start</th>
</tr>
</thead>
<tbody id="driverTable"></tbody>
</table>
</div>

<script>
const startYear = 1950;
const endYear = new Date().getFullYear();

const tableBody = document.getElementById("driverTable");
const filterBox = document.getElementById("filterBox");

let currentStats = {};
let sortKey = "points";
let sortDir = "desc";

function cleanDriver(name){
  return String(name||"").replace(/\s[A-Z]{3}$/,"");
}

async function loadAll(){
  const stats = {};

  for(let y=startYear;y<=endYear;y++){
    try{
      const r = await fetch(`data/f1/${y}.json`);
      if(!r.ok) continue;
      const d = await r.json();

      (d.races||[]).forEach(race=>{
        (race.results||[]).forEach(r=>{
          const driver = cleanDriver(r.driver);
          if(!driver) return;

          if(!stats[driver]){
            stats[driver]={driver, starts:0, wins:0, points:0, pps:0};
          }

          stats[driver].starts++;
          if(Number(r.position)===1) stats[driver].wins++;
          stats[driver].points += Number(r.points)||0;
        });
      });
    }catch(e){}
  }

  Object.values(stats).forEach(d=>{
    d.pps = d.starts ? d.points / d.starts : 0;
  });

  currentStats = stats;
  renderTable();
}

function setSort(key){
  if(sortKey === key){
    sortDir = sortDir === "asc" ? "desc" : "asc";
  }else{
    sortKey = key;
    sortDir = key === "driver" ? "asc" : "desc";
  }
  renderTable();
}

function renderTable(){
  const filter = filterBox.value.toLowerCase();
  tableBody.innerHTML="";

  let rows = Object.values(currentStats)
    .filter(r => r.driver.toLowerCase().includes(filter));

  rows.sort((a,b)=>{
    let v1 = a[sortKey];
    let v2 = b[sortKey];

    if(sortKey === "driver"){
      return sortDir==="asc"
        ? v1.localeCompare(v2)
        : v2.localeCompare(v1);
    }else{
      return sortDir==="asc"
        ? v1 - v2
        : v2 - v1;
    }
  });

  rows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>
        <a class="driver-link" href="f1-driver.html?driver=${encodeURIComponent(r.driver)}">
          ${r.driver}
        </a>
      </td>
      <td>${r.starts}</td>
      <td>${r.wins}</td>
      <td>${r.points.toFixed(1)}</td>
      <td>${r.pps.toFixed(2)}</td>
    `;
    tableBody.appendChild(tr);
  });
}

filterBox.addEventListener("input", renderTable);

loadAll();
</script>

</body>
</html>
