<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Women's T20 World Cup | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

/* UNIFIED HERO */

.hero{
  background:linear-gradient(90deg,#7b1fa2,#e91e63);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:25px;
}

.year-grid{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-bottom:18px;
}

/* UNIFIED YEAR BUTTONS */

.year-btn{
  background:#7b1fa2;
  color:#fff;
  border:none;
  padding:12px 22px;
  border-radius:12px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
}

.year-btn.active{
  background:#e91e63;
}

.match{
  background:#fff;
  padding:16px;
  margin-bottom:12px;
  border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.match a{
  font-weight:800;
  font-size:18px;
  text-decoration:none;
  color:#7b1fa2;
}

.match a:hover{
  text-decoration:underline;
}

.meta{
  margin-top:4px;
  color:#555;
}

</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="womens-t20-world-cup.html">Women's T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1>Women's T20 World Cup</h1>
</div>

<div class="year-grid" id="yearGrid"></div>

<div id="matches"></div>

</div>

<script>

const MATCH_PATH = "data/womens-t20-world-cup/matches/";

const YEARS = [2014,2016,2018,2020,2023,2024];

function buildYearButtons()
{
  const grid = document.getElementById("yearGrid");

  YEARS.forEach(year =>
  {
    const btn = document.createElement("button");

    btn.className = "year-btn";
    btn.innerText = year;

    btn.onclick = () =>
    {
      document.querySelectorAll(".year-btn")
      .forEach(b => b.classList.remove("active"));

      btn.classList.add("active");

      loadYear(year);
    };

    grid.appendChild(btn);
  });
}

async function loadYear(year)
{
  try
  {
    const file = `wt20wc_${year}_FULL.json`;

    const fullPath = MATCH_PATH + file;

    const res = await fetch(fullPath);

    if(!res.ok)
      throw new Error("File not found: " + fullPath);

    const data = await res.json();

    const matches = Array.isArray(data) ? data : data.matches;

    let html = "";

    matches.forEach((match,index)=>
    {
      const info = match.info;

      html += `
      <div class="match">

        <a href="womens-t20wc-match.html?file=${fullPath}&match=${index}">
          ${info.teams[0]} vs ${info.teams[1]}
        </a>

        <div class="meta">${info.venue || ""}</div>
        <div class="meta">${info.dates?.[0] || ""}</div>

      </div>
      `;
    });

    document.getElementById("matches").innerHTML = html;

  }
  catch(err)
  {
    document.getElementById("matches").innerHTML =
    "<b>Error loading season.</b><br>" + err.message;
  }
}

buildYearButtons();

loadYear(2024);

document.querySelectorAll(".year-btn")
.forEach(btn =>
{
  if(btn.innerText=="2024")
    btn.classList.add("active");
});

</script>

</body>
</html>
