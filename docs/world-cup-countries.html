<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Football World Cup – Countries | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#1fa25c;
  --league:#a8790a;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{color:var(--ink);text-decoration:none;opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:44px 20px;text-align:center;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,4.5vw,40px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

.country-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.country-tile{
  position:relative;height:100px;border:4px solid var(--line);border-radius:var(--radius);
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:600;text-align:center;overflow:hidden;
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}
.country-tile:hover{
  transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(10,16,24,.2);
  background:var(--ink);color:#fff;
}
.country-tile .label{
  position:relative;z-index:2;padding:0 8px;font-size:15px;letter-spacing:.01em;text-transform:uppercase;
}
</style>
</head>
<body>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="world-cup-countries.html">Countries</a>
</nav>

<div class="hero">
  <div class="eyebrow">Football</div>
  <h1>World Cup – Countries</h1>
</div>

<div class="page-wrap">
<div id="countries" class="country-grid"></div>
</div>

<script>
const COUNTRY_PAGE = "world-cup-country.html";
let countrySet = new Set();
/* ---------- NORMALISATION ---------- */
function normalizeCountry(name){
 if(!name) return "";
 let n=String(name).replace(/\u00A0/g," ").trim();
 let k=n.toLowerCase();
 if(k.includes("west germany")) return "Germany";
 if(k==="frg") return "Germany";
 if(k.includes("federal republic")) return "Germany";
 if(k.includes("fr germany")) return "Germany";
 return n;
}
const countryCodes={
"Brazil":"BR","Germany":"DE","Italy":"IT","Argentina":"AR","France":"FR",
"England":"GB","Spain":"ES","Netherlands":"NL","Uruguay":"UY","Portugal":"PT",
"Belgium":"BE","Croatia":"HR","Mexico":"MX","USA":"US","United States":"US",
"Japan":"JP","South Korea":"KR","Korea Republic":"KR","Australia":"AU",
"Austria":"AT","Switzerland":"CH","Sweden":"SE","Norway":"NO","Denmark":"DK",
"Poland":"PL","Czech Republic":"CZ","Czechoslovakia":"CZ","Russia":"RU",
"Ukraine":"UA","Turkey":"TR","Greece":"GR","Scotland":"GB","Wales":"GB",
"Ireland":"IE","Northern Ireland":"GB","Morocco":"MA","Cameroon":"CM",
"Nigeria":"NG","Ghana":"GH","Senegal":"SN","Tunisia":"TN","Algeria":"DZ",
"Iran":"IR","Iraq":"IQ","Saudi Arabia":"SA","Qatar":"QA","China":"CN",
"South Africa":"ZA","New Zealand":"NZ","Canada":"CA",
"Costa Rica":"CR","Honduras":"HN","Panama":"PA","Jamaica":"JM",
"Trinidad and Tobago":"TT","Colombia":"CO","Chile":"CL","Peru":"PE",
"Paraguay":"PY","Ecuador":"EC","Bolivia":"BO","Venezuela":"VE"
};
// Each country's recognized NATIONAL/SPORTING colours — not just a literal
// reading of the flag's stripes. Several nations' actual identity colours
// differ a lot from their flag (Australia is green-and-gold, not the flag's
// navy/red/white; the Netherlands is orange, not the flag's red/white/blue;
// Italy's Azzurri wear blue, not the flag's green/white/red; etc).
const flagColours = {
"Brazil":["#009739","#FEDD00"],"Germany":["#FFFFFF","#000000"],"Italy":["#0068A8","#FFFFFF"],
"Argentina":["#75AADB","#FFFFFF"],"France":["#0055A4","#FFFFFF","#EF4135"],"England":["#FFFFFF","#CE1124"],
"Spain":["#C60B1E","#FFC400"],"Netherlands":["#FF7900","#21468B"],"Uruguay":["#75AADB","#FFFFFF"],
"Portugal":["#CE1126","#046A38"],"Belgium":["#ED2939","#000000"],"Croatia":["#FF0000","#FFFFFF","#171796"],
"Mexico":["#006847","#FFFFFF"],"USA":["#3C3B6E","#FFFFFF","#B22234"],"United States":["#3C3B6E","#FFFFFF","#B22234"],
"Japan":["#0056A8","#FFFFFF"],"South Korea":["#CD2E3A","#0047A0"],"Korea Republic":["#CD2E3A","#0047A0"],
"Australia":["#00843D","#FFCD00"],"Austria":["#ED2939","#FFFFFF"],"Switzerland":["#FF0000","#FFFFFF"],
"Sweden":["#006AA7","#FECC00"],"Norway":["#EF2B2D","#002868"],"Denmark":["#C60C30","#FFFFFF"],
"Poland":["#FFFFFF","#DC143C"],"Czech Republic":["#D7141A","#FFFFFF","#11457E"],"Czechoslovakia":["#D7141A","#FFFFFF","#11457E"],
"Russia":["#FFFFFF","#0039A6","#D52B1E"],"Ukraine":["#005BBB","#FFD500"],"Turkey":["#E30A17","#FFFFFF"],
"Greece":["#0D5EAF","#FFFFFF"],"Scotland":["#0065BF","#FFFFFF"],"Wales":["#D30731","#00B140"],
"Ireland":["#169B62","#FF883E"],"Northern Ireland":["#009739","#FFFFFF"],"Morocco":["#C1272D","#006233"],
"Cameroon":["#007A5E","#CE1126"],"Nigeria":["#008751","#FFFFFF"],"Ghana":["#CE1126","#FCD116"],
"Senegal":["#00853F","#FDEF42"],"Tunisia":["#E70013","#FFFFFF"],"Algeria":["#006233","#FFFFFF"],
"Iran":["#239F40","#DA0000"],"Iraq":["#CE1126","#000000"],"Saudi Arabia":["#006C35","#FFFFFF"],
"Qatar":["#8A1538","#FFFFFF"],"China":["#DE2910","#FFDE00"],"South Africa":["#007A4D","#FFB612"],
"New Zealand":["#000000","#FFFFFF"],"Canada":["#FF0000","#FFFFFF"],"Costa Rica":["#002B7F","#FFFFFF","#CE1126"],
"Honduras":["#0073CF","#FFFFFF"],"Panama":["#005293","#FFFFFF","#DA121A"],"Jamaica":["#FED100","#009B3A"],
"Trinidad and Tobago":["#CE1126","#000000"],"Colombia":["#FCD116","#003893"],"Chile":["#D52B1E","#FFFFFF","#0039A6"],
"Peru":["#D91023","#FFFFFF"],"Paraguay":["#D52B1E","#0038A8"],"Ecuador":["#FFDD00","#034EA2"],
"Bolivia":["#D52B1E","#007934"],"Venezuela":["#7B1113","#FFFFFF"]
};
function flagBorderStyle(country){
 const colours = flagColours[country] || ["#c7ccd3","#9aa3ad"];
 const n = colours.length;
 const stops = colours.map((c, i) => {
  const start = (i / n * 100).toFixed(2);
  const end = ((i + 1) / n * 100).toFixed(2);
  return `${c} ${start}%, ${c} ${end}%`;
 }).join(", ");
 return `linear-gradient(90deg, ${stops}) 1`;
}
fetch("data/world-cup.json",{cache:"no-store"})
.then(r=>r.json())
.then(data=>{
 data.forEach(r=>{
  if(r.Team) countrySet.add(normalizeCountry(r.Team));
  if(r.Team__1) countrySet.add(normalizeCountry(r.Team__1));
 });
 buildCountries();
});
function buildCountries(){
 const box=document.getElementById("countries");
 Array.from(countrySet)
  .filter(c=>c.length>0)
  .sort((a,b)=>a.localeCompare(b))
  .forEach(c=>{
   const d=document.createElement("div");
   d.className="country-tile";
   d.style.borderImage = flagBorderStyle(c);
   d.innerHTML=`<span class="label">${c}</span>`;
   d.onclick=()=>{
    window.location.href = COUNTRY_PAGE + "?team=" + encodeURIComponent(c);
   };
   box.appendChild(d);
  });
}
</script>
</body>
</html>
