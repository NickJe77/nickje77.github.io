<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Football World Cup – Countries | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="football.html">Football</a>
  <a href="football-world-cup.html">World Cup</a>
</div>

<div class="page-wrap">

<h1>Football World Cup – Countries</h1>

<p>
Select a country to view its Football World Cup tournament history and performance record.
</p>

<select id="countrySelect" onchange="showCountry()">
  <option value="">Select a country…</option>
  <option value="Brazil">Brazil</option>
  <option value="Germany">Germany</option>
  <option value="Argentina">Argentina</option>
  <option value="France">France</option>
  <option value="Italy">Italy</option>
  <option value="England">England</option>
</select>

<div id="output" class="placeholder">
  Country performance will appear here.
</div>

</div>

<script>
const data={
  "Brazil":{appearances:22,titles:5,finals:7,best:"Champions",first:1930,last:2022},
  "Germany":{appearances:20,titles:4,finals:8,best:"Champions",first:1934,last:2022},
  "Argentina":{appearances:18,titles:3,finals:6,best:"Champions",first:1930,last:2022},
  "France":{appearances:16,titles:2,finals:4,best:"Champions",first:1930,last:2022},
  "Italy":{appearances:18,titles:4,finals:6,best:"Champions",first:1934,last:2014},
  "England":{appearances:16,titles:1,finals:1,best:"Champions",first:1950,last:2022}
};

function showCountry(){
  const c=document.getElementById("countrySelect").value;
  const out=document.getElementById("output");

  if(!c){
    out.innerHTML="Country performance will appear here.";
    return;
  }

  const d=data[c];

  out.innerHTML=`
    <table class="stats-table">
      <tr><th colspan="2">${c} — Football World Cup Record</th></tr>
      <tr><td>Appearances</td><td>${d.appearances}</td></tr>
      <tr><td>World Cup Titles</td><td>${d.titles}</td></tr>
      <tr><td>Finals Played</td><td>${d.finals}</td></tr>
      <tr><td>Best Finish</td><td>${d.best}</td></tr>
      <tr><td>First Appearance</td><td>${d.first}</td></tr>
      <tr><td>Most Recent Appearance</td><td>${d.last}</td></tr>
    </table>
  `;
}
</script>

</body>
</html>
