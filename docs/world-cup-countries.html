<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Cup Countries | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1000px;
  margin:0 auto;
  padding:30px 20px;
}

select{
  padding:10px;
  font-size:16px;
  margin-bottom:20px;
  width:320px;
}

.stats-table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

.stats-table th{
  background:#f0f0f0;
  text-align:left;
  padding:10px;
  font-weight:700;
}

.stats-table td{
  border-bottom:1px solid #ddd;
  padding:10px;
}

.stats-table tr:nth-child(even) td{
  background:#f3f7ff;
}

.placeholder{
  color:#666;
  font-style:italic;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="football-world-cup.html">World Cup</a>
</div>

<div class="page-wrap">

<h1>World Cup Countries</h1>

<p>
Select a country to view its World Cup tournament history and performance record.
</p>

<select id="countrySelect" onchange="showCountry()">
  <option value="">Select a country…</option>
  <option value="Brazil">Brazil</option>
  <option value="Germany">Germany</option>
  <option value="Argentina">Argentina</option>
  <option value="France">France</option>
  <option value="Italy">Italy</option>
  <option value="England">England</option>
</select>

<div id="output" class="placeholder">
  Country performance will appear here.
</div>

</div>

<script>
/* TEMP DATA — replace with JSON later */
const data={
  "Brazil":{
    appearances:22,
    titles:5,
    finals:7,
    best:"Champions",
    first:1930,
    last:2022
  },
  "Germany":{
    appearances:20,
    titles:4,
    finals:8,
    best:"Champions",
    first:1934,
    last:2022
  },
  "Argentina":{
    appearances:18,
    titles:3,
    finals:6,
    best:"Champions",
    first:1930,
    last:2022
  },
  "France":{
    appearances:16,
    titles:2,
    finals:4,
    best:"Champions",
    first:1930,
    last:2022
  },
  "Italy":{
    appearances:18,
    titles:4,
    finals:6,
    best:"Champions",
    first:1934,
    last:2014
  },
  "England":{
    appearances:16,
    titles:1,
    finals:1,
    best:"Champions",
    first:1950,
    last:2022
  }
};

function showCountry(){
  const c=document.getElementById("countrySelect").value;
  const out=document.getElementById("output");

  if(!c){
    out.innerHTML="Country performance will appear here.";
    out.className="placeholder";
    return;
  }

  const d=data[c];

  out.className="";
  out.innerHTML=`
    <table class="stats-table">
      <tr><th colspan="2">${c} — World Cup Record</th></tr>
      <tr><td>Appearances</td><td>${d.appearances}</td></tr>
      <tr><td>World Cup Titles</td><td>${d.titles}</td></tr>
      <tr><td>Finals Played</td><td>${d.finals}</td></tr>
      <tr><td>Best Finish</td><td>${d.best}</td></tr>
      <tr><td>First Appearance</td><td>${d.first}</td></tr>
      <tr><td>Most Recent Appearance</td><td>${d.last}</td></tr>
    </table>
  `;
}
</script>

</body>
</html>
