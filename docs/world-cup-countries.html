<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Football World Cup – Countries | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}

.navbar{
display:flex;justify-content:center;gap:22px;
padding:16px;border-bottom:1px solid #ddd;font-weight:600;
}

.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}

h1{text-align:center;margin-bottom:30px;}

.country-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
}

.country-tile{
position:relative;
border:1px solid #ddd;
border-radius:10px;
padding:22px 10px;
text-align:center;
font-weight:700;
cursor:pointer;
background:#fafafa;
overflow:hidden;
transition:all .2s ease;
}

.country-tile:hover{
background:#0056d6;
color:white;
border-color:#0056d6;
}

.country-tile .flag{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:64px;
opacity:0.15;
pointer-events:none;
}

.country-tile .label{
position:relative;
z-index:2;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="worldcupcountries.html">Countries</a>
</div>

<div class="page-wrap">

<h1>Football World Cup – Countries</h1>

<div id="countries" class="country-grid"></div>

</div>

<script>
let countrySet=new Set();

const countryCodes={
"Brazil":"BR","Germany":"DE","Italy":"IT","Argentina":"AR","France":"FR",
"England":"GB","Spain":"ES","Netherlands":"NL","Uruguay":"UY","Portugal":"PT",
"Belgium":"BE","Croatia":"HR","Mexico":"MX","USA":"US","United States":"US",
"Japan":"JP","South Korea":"KR","Korea Republic":"KR","Australia":"AU",
"Denmark":"DK","Sweden":"SE","Norway":"NO","Switzerland":"CH","Austria":"AT",
"Poland":"PL","Czech Republic":"CZ","Czechoslovakia":"CZ",
"Yugoslavia":"RS","Serbia":"RS","Slovenia":"SI","Scotland":"GB",
"Wales":"GB","Morocco":"MA","Cameroon":"CM","Nigeria":"NG","Ghana":"GH",
"Senegal":"SN","Tunisia":"TN","Algeria":"DZ","Iran":"IR","Iraq":"IQ",
"Saudi Arabia":"SA","Qatar":"QA","China":"CN","Russia":"RU","Ukraine":"UA",
"Turkey":"TR","Greece":"GR","Colombia":"CO","Chile":"CL","Peru":"PE",
"Paraguay":"PY","Ecuador":"EC","Costa Rica":"CR","Honduras":"HN",
"Panama":"PA","Jamaica":"JM","Trinidad and Tobago":"TT","Canada":"CA"
};

function flagEmoji(code){
 if(!code) return "";
 return code.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt()));
}

fetch("data/world-cup.json",{cache:"no-store"})
.then(r=>r.json())
.then(data=>{
 data.forEach(r=>{
  if(r.Team) countrySet.add(r.Team);
  if(r.Team__1) countrySet.add(r.Team__1);
 });
 buildCountries();
});

function buildCountries(){
 const box=document.getElementById("countries");

 Array.from(countrySet)
  .sort((a,b)=>a.localeCompare(b))
  .forEach(c=>{
   const code=countryCodes[c];
   const flag=flagEmoji(code);

   const d=document.createElement("div");
   d.className="country-tile";

   d.innerHTML=`
    <span class="flag">${flag}</span>
    <span class="label">${c}</span>
   `;

   d.onclick=()=>{
    window.location.href="world-cup-country.html?team="+encodeURIComponent(c);
   };

   box.appendChild(d);
  });
}
</script>

</body>
</html>
