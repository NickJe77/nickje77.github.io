<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hong Kong International Races | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="home.css" />

  <style>
    /* PAGE-ONLY STYLES */

    .hk-hero {
      width: 100%;
      height: 460px;
      background: url("images/hk-hero.jpg") center / cover no-repeat;
      border-radius: 20px;
      margin-bottom: 60px;
    }

    .hk-intro {
      text-align: center;
      max-width: 1100px;
      margin: 0 auto 70px;
    }

    .hk-intro h1 {
      font-size: 46px;
      margin-bottom: 16px;
    }

    .hk-intro p {
      font-size: 18px;
      color: #444;
    }

    /* BIG TILES – NO TEXT */
    .hk-tiles {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 48px;
      max-width: 1600px;
      margin: 0 auto 90px;
    }

    .hk-tile {
      position: relative;
      height: 520px;
      border-radius: 28px;
      overflow: hidden;
      text-decoration: none;
      box-shadow: 0 22px 48px rgba(0,0,0,0.25);
    }

    .hk-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 1100px) {
      .hk-tiles {
        grid-template-columns: 1fr;
      }
      .hk-tile {
        height: 420px;
      }
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <div class="hk-hero"></div>

  <!-- INTRO -->
  <div class="hk-intro">
    <h1>Hong Kong International Races</h1>
    <p>
      Every December, the racing world turns its attention to Hong Kong for one of the most prestigious days on the global racing calendar.
    </p>
  </div>

  <!-- TILES -->
  <div class="hk-tiles">

    <a class="hk-tile" href="hong-kong-winners.html">
      <img src="images/hong-kong-winners.jpg" alt="Hong Kong Winners">
    </a>

    <a class="hk-tile" href="hk-jockeys-trainers.html">
      <img src="images/hong-kong-jockeys-trainers.jpg" alt="Jockeys & Trainers">
    </a>

    <a class="hk-tile" href="hk-jockeys-challenge.html">
      <img src="images/hong-kong-challenge.jpg" alt="International Jockeys Challenge">
    </a>

  </div>

</body>
</html>
