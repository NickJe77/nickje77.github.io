<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races | The Sporting Almanac</title>

    <label>Year</label>
    <select id="yearFilter">

    <label>Race</label>

  <div class="filter-group">
    <label>Winner</label>
    <input id="winnerFilter" type="text">
  </div>

<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
