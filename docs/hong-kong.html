<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hong Kong International Races</title>

  <!-- EXISTING GLOBAL CSS ONLY -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- TOP NAV (unchanged behaviour) -->
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="racing.html">Racing</a>
  </nav>

  <!-- HEADER / HERO (ONLY CHANGE IS HEIGHT CONTROL) -->
  <header class="page-hero" style="width:100%; overflow:hidden;">
    <img
      src="images/hk-hero.jpg"
      alt="Hong Kong International Races"
      style="
        width:100%;
        height:300px;
        object-fit:cover;
        display:block;
      "
    />
  </header>

  <!-- INTRO -->
  <main>
    <section style="
      max-width:1100px;
      margin:30px auto 10px;
      padding:0 20px;
      text-align:center;
    ">
      <h1>Hong Kong International Races</h1>
      <p style="margin-top:10px;">
        Every December, the racing world turns its eye to Hong Kong for one of the biggest days in world racing.
      </p>
    </section>

    <!-- TILES (ALL 3 – NOTHING REMOVED) -->
    <section style="
      max-width:1200px;
      margin:30px auto 50px;
      padding:0 20px;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
      gap:20px;
    ">

      <a href="hk-winners.html" style="display:block; overflow:hidden; border-radius:12px;">
        <img
          src="images/tile-winners.jpg"
          alt="Winners"
          style="width:100%; aspect-ratio:16/9; object-fit:cover; display:block;"
        />
      </a>

      <a href="hk-jockeys-trainers.html" style="display:block; overflow:hidden; border-radius:12px;">
        <img
          src="images/tile-jockeys-trainers.jpg"
          alt="Jockeys & Trainers"
          style="width:100%; aspect-ratio:16/9; object-fit:cover; display:block;"
        />
      </a>

      <a href="hk-jockeys-challenge.html" style="display:block; overflow:hidden; border-radius:12px;">
        <img
          src="images/tile-jockeys-challenge.jpg"
          alt="International Jockeys Challenge"
          style="width:100%; aspect-ratio:16/9; object-fit:cover; display:block;"
        />
      </a>

    </section>
  </main>

</body>
</html>
