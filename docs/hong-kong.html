<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hong Kong International Races | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- GLOBAL SITE CSS (UNCHANGED) -->
  <link rel="stylesheet" href="home.css" />

  <style>
    /* 🔒 SCOPED ONLY TO THIS PAGE */
    .hk-hero {
      width: 100%;
      height: 380px;
      background: url("images/hk-hero.jpg") center / cover no-repeat;
      border-radius: 18px;
      margin-bottom: 40px;
    }

    .hk-intro {
      text-align: center;
      max-width: 900px;
      margin: 0 auto 50px;
    }

    .hk-intro h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hk-intro p {
      font-size: 18px;
      color: #444;
    }

    .hk-tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      max-width: 1200px;
      margin: 0 auto 60px;
    }

    .hk-tile {
      position: relative;
      height: 340px;
      border-radius: 22px;
      overflow: hidden;
      text-decoration: none;
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
    }

    .hk-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hk-tile-label {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 22px;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
    }

    @media (max-width: 1000px) {
      .hk-tiles {
        grid-template-columns: 1fr;
      }
      .hk-tile {
        height: 300px;
      }
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <div class="hk-hero"></div>

  <!-- INTRO -->
  <div class="hk-intro">
    <h1>Hong Kong International Races</h1>
    <p>
      Every December, the racing world turns its attention to Hong Kong for one of the most prestigious days on the global racing calendar.
    </p>
  </div>

  <!-- TILES -->
  <div class="hk-tiles">

    <!-- WINNERS -->
    <a class="hk-tile" href="hong-kong-winners.html">
      <img src="images/hong-kong-winners.jpg" alt="Hong Kong Winners">
      <div class="hk-tile-label">Winners</div>
    </a>

    <!-- JOCKEYS & TRAINERS -->
    <a class="hk-tile" href="hk-jockeys-trainers.html">
      <img src="images/hong-kong-jockeys-trainers.jpg" alt="Jockeys & Trainers">
      <div class="hk-tile-label">Jockeys &amp; Trainers</div>
    </a>

    <!-- INTERNATIONAL JOCKEYS CHALLENGE -->
    <a class="hk-tile" href="hk-jockeys-challenge.html">
      <img src="images/hong-kong-challenge.jpg" alt="International Jockeys Challenge">
      <div class="hk-tile-label">International Jockeys Challenge</div>
    </a>

  </div>

</body>
</html>
