<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hong Kong International Races | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="home.css" />

  <style>
    /* PAGE ONLY — DOES NOT TOUCH OTHER PAGES */

    .hk-hero {
      width: 100%;
      height: 420px;
      background: url("images/hk-hero.jpg") center / cover no-repeat;
      border-radius: 18px;
      margin-bottom: 50px;
    }

    .hk-intro {
      text-align: center;
      max-width: 1000px;
      margin: 0 auto 60px;
    }

    .hk-intro h1 {
      font-size: 44px;
      margin-bottom: 14px;
    }

    .hk-intro p {
      font-size: 18px;
      color: #444;
    }

    /* 🔥 FIX: BIGGER TILES */
    .hk-tiles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 36px;
      max-width: 1400px;
      margin: 0 auto 80px;
    }

    .hk-tile {
      position: relative;
      height: 420px; /* WAS TOO SMALL — FIXED */
      border-radius: 26px;
      overflow: hidden;
      text-decoration: none;
      box-shadow: 0 18px 40px rgba(0,0,0,0.22);
    }

    .hk-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hk-tile-label {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 26px;
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.85),
        rgba(0,0,0,0)
      );
    }

    @media (max-width: 1100px) {
      .hk-tiles {
        grid-template-columns: 1fr;
      }
      .hk-tile {
        height: 360px;
      }
    }
  </style>
</head>

<body>

  <div class="hk-hero"></div>

  <div class="hk-intro">
    <h1>Hong Kong International Races</h1>
    <p>
      Every December, the racing world turns its attention to Hong Kong for one of the most prestigious days on the global racing calendar.
    </p>
  </div>

  <div class="hk-tiles">

    <a class="hk-tile" href="hong-kong-winners.html">
      <img src="images/hong-kong-winners.jpg" alt="Hong Kong Winners">
      <div class="hk-tile-label">Winners</div>
    </a>

    <a class="hk-tile" href="hk-jockeys-trainers.html">
      <img src="images/hong-kong-jockeys-trainers.jpg" alt="Jockeys & Trainers">
      <div class="hk-tile-label">Jockeys &amp; Trainers</div>
    </a>

    <a class="hk-tile" href="hk-jockeys-challenge.html">
      <img src="images/hong-kong-challenge.jpg" alt="International Jockeys Challenge">
      <div class="hk-tile-label">International Jockeys Challenge</div>
    </a>

  </div>

</body>
</html>
