<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="racing.css">

  <style>
    .hk-hero {
      max-width: 1200px;
      margin: 36px auto 50px;
      padding: 0 24px;
    }

    .hk-hero img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .page-intro {
      max-width: 900px;
      margin: 0 auto 40px;
      padding: 0 24px;
      text-align: center;
    }

    .page-intro h1 {
      font-size: 36px;
      margin-bottom: 14px;
    }

    .page-intro p {
      font-size: 18px;
      color: #444;
      line-height: 1.6;
    }

    .hk-tiles {
      max-width: 1200px;
      margin: 0 auto 80px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
    }

    .hk-tile {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      text-decoration: none;
      color: #fff;
    }

    .hk-tile img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .hk-tile span {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 18px;
      background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
      font-size: 20px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav class="home-nav">
    <a href="index.html">Home</a>
    <a href="racing.html">Racing</a>
    <a href="hong-kong.html" class="active">Hong Kong</a>
  </nav>

  <!-- HERO -->
  <div class="hk-hero">
    <img src="images/carnival-hong-kong.jpg" alt="Hong Kong International Races">
  </div>

  <!-- INTRO -->
  <div class="page-intro">
    <h1>Hong Kong International Races</h1>
    <p>
      Every December, the racing world turns its attention to Hong Kong for one
      of the most prestigious international race days on the calendar.
    </p>
  </div>

  <!-- TILES -->
  <div class="hk-tiles">

    <a href="hong-kong-winners.html" class="hk-tile">
      <img src="images/hong-kong-winners-hero.jpg" alt="HKIR Winners">
      <span>Winners</span>
    </a>

    <a href="hk-jockeys-trainers.html" class="hk-tile">
      <img src="images/hong-kong-jockeys-trainers.jpg" alt="Jockeys & Trainers">
      <span>Jockeys & Trainers</span>
    </a>

    <a href="hk-jockeys-challenge.html" class="hk-tile">
      <img src="images/hong-kong-challenge.jpg" alt="International Jockeys Challenge">
      <span>International Jockeys Challenge</span>
    </a>

  </div>

</body>
</html>
