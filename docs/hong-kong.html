<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- existing global styles -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="racing.css">

  <style>
    .hk-hero {
      max-width: 1200px;
      margin: 40px auto 60px;
      padding: 0 24px;
    }

    .hk-hero img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.2);
    }

    .hk-intro {
      max-width: 900px;
      margin: 0 auto 60px;
      padding: 0 24px;
      text-align: center;
    }

    .hk-intro h1 {
      font-size: 38px;
      margin-bottom: 14px;
    }

    .hk-intro p {
      font-size: 18px;
      line-height: 1.6;
      color: #444;
    }

    .hk-tiles {
      max-width: 1200px;
      margin: 0 auto 100px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
    }

    .hk-tile {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(0,0,0,0.18);
    }

    .hk-tile img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      display: block;
    }

    .hk-tile-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 22px;
      background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0));
      color: #fff;
      font-size: 22px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .hk-hero img { height: 300px; }
      .hk-tile img { height: 300px; }
    }
  </style>
</head>

<body>

<nav class="home-nav">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="hong-kong.html" class="active">Hong Kong</a>
</nav>

<!-- HERO -->
<div class="hk-hero">
  <img src="images/hk-hero.jpg" alt="Hong Kong International Races">
</div>

<!-- INTRO -->
<div class="hk-intro">
  <h1>Hong Kong International Races</h1>
  <p>
    Every December, the racing world turns its attention to Hong Kong for one of
    the most prestigious days on the global racing calendar.
  </p>
</div>

<!-- TILES -->
<div class="hk-tiles">

  <a class="hk-tile" href="hong-kong-winners.html">
    <img src="images/hong-kong-winners-hero.jpg" alt="Hong Kong Winners">
    <div class="hk-tile-label">Winners</div>
  </a>

  <a class="hk-tile" href="hk-jockeys-trainers.html">
    <img src="images/hong-kong-jockeys-trainers.jpg" alt="Jockeys and Trainers">
    <div class="hk-tile-label">Jockeys &amp; Trainers</div>
  </a>

  <a class="hk-tile" href="hk-jockeys-challenge.html">
    <img src="images/hong-kong-jockeys-challenge.jpg" alt="International Jockeys Challenge">
    <div class="hk-tile-label">International Jockeys Challenge</div>
  </a>

</div>

</body>
</html>
