<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hong Kong International Races | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- GLOBAL SITE CSS -->
  <link rel="stylesheet" href="home.css" />

  <style>
    /* ===============================
       HONG KONG PAGE ONLY
       =============================== */

    body {
      margin: 0;
      background: #f1f1f1;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    /* NAV */
    .site-nav {
      display: flex;
      justify-content: center;
      gap: 32px;
      padding: 18px 0;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .site-nav a {
      text-decoration: none;
      font-weight: 600;
      color: #1f4ed8;
      font-size: 17px;
    }

    .site-nav a:hover {
      text-decoration: underline;
    }

    /* HERO */
    .hk-hero {
      width: 100%;
      height: 260px; /* ✅ smaller */
      background: url("images/hk-hero.jpg") center / cover no-repeat;
      border-radius: 0 0 24px 24px;
    }

    /* INTRO */
    .hk-intro {
      text-align: center;
      max-width: 1000px;
      margin: 40px auto 70px;
      padding: 0 20px;
    }

    .hk-intro h1 {
      font-size: 42px;
      margin-bottom: 14px;
    }

    .hk-intro p {
      font-size: 17px;
      color: #444;
    }

    /* TILES */
    .hk-tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px;
      max-width: 1350px;
      margin: 0 auto 90px;
      padding: 0 20px;
    }

    .hk-tile {
      aspect-ratio: 2 / 3;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 18px 36px rgba(0,0,0,0.22);
      background: #000;
    }

    .hk-tile img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    @media (max-width: 1200px) {
      .hk-tiles {
        grid-template-columns: 1fr;
        max-width: 520px;
      }
    }
  </style>
</head>

<body>

  <!-- SITE NAV (THIS WAS MISSING) -->
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="racing.html">Racing</a>
    <a href="hong-kong.html">Hong Kong</a>
    <a href="hk-jockeys-challenge.html">Jockeys Challenge</a>
  </nav>

  <!-- HERO -->
  <div class="hk-hero"></div>

  <!-- INTRO -->
  <div class="hk-intro">
    <h1>Hong Kong International Races</h1>
    <p>
      Every December, the racing world turns its attention to Hong Kong for one of the most prestigious days on the global racing calendar.
    </p>
  </div>

  <!-- TILES -->
  <div class="hk-tiles">

    <a class="hk-tile" href="hong-kong-winners.html">
      <img src="images/hong-kong-winners.jpg" alt="Hong Kong Winners">
    </a>

    <a class="hk-tile" href="hk-jockeys-trainers.html">
      <img src="images/hong-kong-jockeys-trainers.jpg" alt="Jockeys & Trainers">
    </a>

    <a class="hk-tile" href="hk-jockeys-challenge.html">
      <img src="images/hong-kong-challenge.jpg" alt="International Jockeys Challenge">
    </a>

  </div>

</body>
</html>
