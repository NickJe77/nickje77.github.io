<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong Racing Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../racing.css">

  <style>
    .g1-hero {
      position: relative;
      max-width: 1200px;
      margin: 36px auto 40px;
      padding: 0 24px;
    }

    .g1-hero img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .g1-hero-text {
      position: absolute;
      left: 48px;
      bottom: 36px;
      pointer-events: none;
    }

    .g1-hero-text h1 {
      margin: 0;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 4px 14px rgba(0,0,0,0.55);
    }

    .filters {
      max-width: 1200px;
      margin: 0 auto 30px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      align-items: end;
    }

    .filters select,
    .filters input {
      height: 46px;
      padding: 10px 14px;
      border-radius: 10px;
      font-family: inherit;
    }

    .archive-table {
      max-width: 1200px;
      margin: 0 auto 80px;
      padding: 0 24px;
      border: 1px solid #d6e4f2;
      border-radius: 14px;
      overflow-x: auto;
    }

    .archive-table table {
      width: 100%;
      border-collapse: collapse;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
    }

    .archive-table thead {
      background: #f3f7fc;
    }

    .archive-table th,
    .archive-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #e1e8f0;
      text-align: left;
    }

    .archive-table tbody tr:nth-child(even) {
      background: #f5f9ff;
    }
  </style>
</head>

<body>

<nav class="home-nav">
  <a href="../index.html">Home</a>
  <a href="../racing.html">Racing</a>
  <a href="g1-archive.html">G1 Archive</a>
  <a href="hong-kong.html" class="active">Hong Kong</a>
</nav>

<div class="g1-hero">
  <img src="../images/carnival-hong-kong.jpg" alt="Hong Kong Racing">
  <div class="g1-hero-text">
    <h1>Hong Kong</h1>
  </div>
</div>

<div class="filters">
  <div>
    <label>Year</label>
    <select id="yearFilter">
      <option value="">All</option>
    </select>
  </div>

  <div>
    <label>Race</label>
    <input id="raceFilter" type="text" list="raceList">
    <datalist id="raceList"></datalist>
  </div>

  <div>
    <label>Winner</label>
    <input id="winnerFilter" type="text" list="winnerList">
    <datalist id="winnerList"></datalist>
  </div>
</div>

<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="hong-kong.js" defer></script>

</body>
</html>
