<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">

  <!-- HONG KONG LAYOUT (MATCHES BREEDERS CUP) -->
  <style>
    .filters {
      grid-template-columns: 1fr 1fr 1fr;
      align-items: end;
    }

    .filters select,
    .filters input {
      width: 100%;
      height: 46px;
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .archive-table {
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
    }

    .archive-table table {
      width: 100%;
      table-layout: fixed;
    }

    /* Year – slim */
    .archive-table th:nth-child(1),
    .archive-table td:nth-child(1) {
      width: 70px;
      white-space: nowrap;
    }

    /* Race – wide */
    .archive-table th:nth-child(2),
    .archive-table td:nth-child(2) {
      width: 260px;
      white-space: normal;
      word-break: break-word;
    }

    /* Track – skinnier */
    .archive-table th:nth-child(3),
    .archive-table td:nth-child(3) {
      width: 120px;
      white-space: normal;
      word-break: break-word;
    }

    /* Winner – slightly wider */
    .archive-table th:nth-child(4),
    .archive-table td:nth-child(4) {
      width: 160px;
      white-space: nowrap;
    }

    /* Trainer – wrap */
    .archive-table th:nth-child(5),
    .archive-table td:nth-child(5) {
      width: 180px;
      white-space: normal;
      word-break: break-word;
    }

    /* Jockey */
    .archive-table th:nth-child(6),
    .archive-table td:nth-child(6) {
      white-space: nowrap;
    }
  </style>
</head>
<body>

<nav>
  <a href="../index.html">Home</a>
  <a href="g1-archive.html">G1 Archive</a>
  <a href="breeders-cup.html">Breeders’ Cup</a>
  <a href="hong-kong.html">Hong Kong</a>
</nav>

<div class="g1-hero">
  <img src="../images/hong-kong-hero.jpg" alt="Hong Kong International Races">
  <div class="g1-hero-text">
    <h1>Hong Kong International Races</h1>
    <p>
      A complete archive of Hong Kong’s major international races,
      searchable by year, race and winner.
    </p>
  </div>
</div>

<!-- FILTERS -->
<div class="filters">
  <div class="filter-group">
    <label for="yearFilter">Year</label>
    <select id="yearFilter">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="raceFilter">Race</label>
    <input id="raceFilter" type="text" list="raceList" placeholder="Type race name">
    <datalist id="raceList"></datalist>
  </div>

  <div class="filter-group">
    <label for="winnerFilter">Winner</label>
    <input id="winnerFilter" type="text" list="winnerList" placeholder="Type horse name">
    <datalist id="winnerList"></datalist>
  </div>
</div>

<!-- TABLE -->
<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Track</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="hong-kong.js" defer></script>

</body>
</html>
