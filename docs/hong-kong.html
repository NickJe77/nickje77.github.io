<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Global styles -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="racing.css">

  <style>
    /* ---------- HERO ---------- */
    .g1-hero {
      position: relative;
      max-width: 1200px;
      margin: 36px auto 40px;
      padding: 0 24px;
    }

    .g1-hero img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .g1-hero-text {
      position: absolute;
      left: 48px;
      bottom: 36px;
      pointer-events: none;
    }

    .g1-hero-text h1 {
      margin: 0;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow:
        0 4px 14px rgba(0,0,0,0.55),
        0 1px 2px rgba(0,0,0,0.75);
    }

    /* ---------- FILTERS ---------- */
    .filters {
      max-width: 1200px;
      margin: 0 auto 30px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      align-items: end;
    }

    .filters label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .filters select,
    .filters input {
      width: 100%;
      height: 46px;
      padding: 10px 14px;
      border-radius: 10px;
      box-sizing: border-box;
      font-family: inherit;
    }

    /* ---------- TABLE ---------- */
    .archive-table {
      max-width: 1200px;
      margin: 0 auto 80px;
      padding: 0 24px;
      overflow-x: auto;
      border: 1px solid #d6e4f2;
      border-radius: 14px;
    }

    .archive-table table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;               /* ⬅️ LARGER TEXT */
      line-height: 1.4;
    }

    .archive-table thead {
      background: #f3f7fc;
    }

    .archive-table th,
    .archive-table td {
      padding: 14px 12px;            /* ⬅️ A bit more breathing room */
      border-bottom: 1px solid #e1e8f0;
      vertical-align: top;
      font-weight: 400;
    }

    .archive-table th {
      font-weight: 600;
    }

    .archive-table tbody tr:nth-child(even) {
      background: #f5f9ff;
    }

    /* ---------- COLUMN WIDTHS (TIGHTER) ---------- */
    .archive-table th:nth-child(1),
    .archive-table td:nth-child(1) { width: 80px; }

    .archive-table th:nth-child(2),
    .archive-table td:nth-child(2) { width: 280px; }

    .archive-table th:nth-child(3),
    .archive-table td:nth-child(3) { width: 240px; }

    .archive-table th:nth-child(4),
    .archive-table td:nth-child(4) { width: 200px; }

    .archive-table th:nth-child(5),
    .archive-table td:nth-child(5) { width: 180px; }
  </style>
</head>

<body>

<!-- NAV -->
<nav class="home-nav">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="g1-archive.html">G1 Archive</a>
  <a href="hong-kong.html" class="active">Hong Kong</a>
</nav>

<!-- HERO -->
<div class="g1-hero">
  <img src="hong-kong-hero.jpg" alt="Hong Kong International Races">
  <div class="g1-hero-text">
    <h1>HONG KONG</h1>
  </div>
</div>

<!-- FILTERS -->
<div class="filters">
  <div>
    <label for="yearFilter">Year</label>
    <select id="yearFilter">
      <option value="">All</option>
    </select>
  </div>

  <div>
    <label for="raceFilter">Race</label>
    <input id="raceFilter" type="text" placeholder="Type race name">
  </div>

  <div>
    <label for="winnerFilter">Winner</label>
    <input id="winnerFilter" type="text" placeholder="Type horse name">
  </div>
</div>

<!-- TABLE -->
<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
</div>

<script>
fetch('../data/hong-kong-results.json')
  .then(res => res.json())
  .then(data => {

    // Newest → Oldest
    data.sort((a, b) => b.year - a.year);

    const tbody = document.getElementById('resultsBody');
    const yearFilter = document.getElementById('yearFilter');
    const raceFilter = document.getElementById('raceFilter');
    const winnerFilter = document.getElementById('winnerFilter');

    [...new Set(data.map(d => d.year))].forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      yearFilter.appendChild(opt);
    });

    function render() {
      tbody.innerHTML = '';
      data.filter(d =>
        (!yearFilter.value || d.year == yearFilter.value) &&
        (!raceFilter.value || d.race.toLowerCase().includes(raceFilter.value.toLowerCase())) &&
        (!winnerFilter.value || d.winner.toLowerCase().includes(winnerFilter.value.toLowerCase()))
      ).forEach(d => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${d.year}</td>
          <td>${d.race}</td>
          <td>${d.winner}</td>
          <td>${d.trainer}</td>
          <td>${d.jockey}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    yearFilter.onchange = render;
    raceFilter.oninput = render;
    winnerFilter.oninput = render;

    render();
  });
</script>

</body>
</html>
