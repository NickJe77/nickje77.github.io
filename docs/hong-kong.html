<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Races | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Global styles -->
  <link rel="stylesheet" href="../style.css">

  <!-- Shared racing styles -->
  <link rel="stylesheet" href="../racing.css">

  <style>
    /* ---------- HERO ---------- */

    .g1-hero {
      max-width: 1200px;
      margin: 36px auto 40px;
      padding: 0 24px;
    }

    .g1-hero img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
      display: block;
    }

    /* ---------- FILTERS ---------- */

    .filters {
      max-width: 1200px;
      margin: 0 auto 30px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      align-items: end;
    }

    .filters label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .filters select,
    .filters input {
      width: 100%;
      height: 46px;
      padding: 10px 14px;
      border-radius: 10px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 15px;
    }

    /* ---------- TABLE (MATCH G1 ARCHIVE) ---------- */

    .archive-table {
      max-width: 1200px;
      margin: 20px auto 80px;
      padding: 0 24px;
      overflow-x: auto;
      border: 1px solid #d6e4f2;
      border-radius: 14px;
    }

    .archive-table table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
    }

    .archive-table thead {
      background: #f3f7fc;
    }

    .archive-table th,
    .archive-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #e1e8f0;
      text-align: left;
      vertical-align: top;
      font-weight: 400;
    }

    .archive-table th {
      font-weight: 600;
    }

    .archive-table tbody tr:nth-child(even) {
      background: #f5f9ff;
    }

    /* Column widths */
    .archive-table th:nth-child(1),
    .archive-table td:nth-child(1) { width: 70px; }

    .archive-table th:nth-child(2),
    .archive-table td:nth-child(2) { width: 260px; }

    .archive-table th:nth-child(3),
    .archive-table td:nth-child(3) { width: 200px; }

    .archive-table th:nth-child(4),
    .archive-table td:nth-child(4) { width: 200px; }

    .archive-table th:nth-child(5),
    .archive-table td:nth-child(5) { width: 160px; }
  </style>
</head>

<body>

<!-- NAV -->
<nav class="home-nav">
  <a href="../index.html">Home</a>
  <a href="../racing.html">Racing</a>
  <a href="g1-archive.html">G1 Archive</a>
  <a href="hong-kong.html" class="active">Hong Kong</a>
</nav>

<!-- HERO (IMAGE ONLY — NO TEXT OVERLAY) -->
<div class="g1-hero">
  <img src="../images/carnival-hong-kong.jpg" alt="Hong Kong International Races">
</div>

<!-- FILTERS -->
<div class="filters">
  <div class="filter-group">
    <label for="yearFilter">Year</label>
    <select id="yearFilter">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="raceFilter">Race</label>
    <input id="raceFilter" type="text" list="raceList" placeholder="Type race name">
    <datalist id="raceList"></datalist>
  </div>

  <div class="filter-group">
    <label for="winnerFilter">Winner</label>
    <input id="winnerFilter" type="text" list="winnerList" placeholder="Type horse name">
    <datalist id="winnerList"></datalist>
  </div>
</div>

<!-- TABLE -->
<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="hong-kong.js" defer></script>

</body>
</html>
