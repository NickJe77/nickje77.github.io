<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hong Kong International Races | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="home.css" />

  <style>
    /* ===== PAGE-ONLY STYLES ===== */

    .hk-hero {
      width: 100%;
      height: 420px;
      background: url("images/hk-hero.jpg") center / cover no-repeat;
      border-radius: 20px;
      margin-bottom: 50px;
    }

    .hk-intro {
      text-align: center;
      max-width: 1000px;
      margin: 0 auto 60px;
    }

    .hk-intro h1 {
      font-size: 44px;
      margin-bottom: 14px;
    }

    .hk-intro p {
      font-size: 17px;
      color: #444;
    }

    /* ===== TILE GRID (SCALED DOWN) ===== */
    .hk-tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px;                    /* smaller spacing */
      max-width: 1350px;            /* 🔽 reduced from 1700 */
      margin: 0 auto 80px;
    }

    .hk-tile {
      display: block;
      aspect-ratio: 2 / 3;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 18px 36px rgba(0,0,0,0.22);
      text-decoration: none;
      background: #000;
    }

    .hk-tile img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    @media (max-width: 1200px) {
      .hk-tiles {
        grid-template-columns: 1fr;
        max-width: 520px;          /* smaller mobile tile */
      }
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <div class="hk-hero"></div>

  <!-- INTRO -->
  <div class="hk-intro">
    <h1>Hong Kong International Races</h1>
    <p>
      Every December, the racing world turns its attention to Hong Kong for one of the most prestigious days on the global racing calendar.
    </p>
  </div>

  <!-- TILES -->
  <div class="hk-tiles">

    <a class="hk-tile" href="hong-kong-winners.html">
      <img src="images/hong-kong-winners.jpg" alt="Hong Kong Winners">
    </a>

    <a class="hk-tile" href="hk-jockeys-trainers.html">
      <img src="images/hong-kong-jockeys-trainers.jpg" alt="Jockeys & Trainers">
    </a>

    <a class="hk-tile" href="hk-jockeys-challenge.html">
      <img src="images/hong-kong-challenge.jpg" alt="International Jockeys Challenge">
    </a>

  </div>

</body>
</html>
