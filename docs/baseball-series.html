<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --line:#e6e8ee;
}
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.page{
  max-width:1100px;
  margin:auto;
  padding:30px;
}
.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:25px;
}
.games{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.game{
  background:#fff;
  padding:20px;
  border-radius:16px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:.2s;
}
.game:hover{
  background:#eaf3ff;
  transform:translateY(-2px);
}
.team-row{
  display:flex;
  justify-content:space-between;
  font-weight:700;
  font-size:18px;
}
.meta{
  font-size:13px;
  color:#666;
  margin-top:8px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html">Postseason</a>
</div>

<div class="page">
  <div class="hero">
    <h1 id="seriesTitle">Loading...</h1>
    <div id="seriesSubtitle"></div>
  </div>
  <div class="games" id="gamesContainer"></div>
</div>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

async function fetchCSV(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  const text = await r.text();
  return text.split("\n").map(row => row.split(","));
}

function normalizeGame(raw, gameIdFallback){
  const gid = raw?.game_id || gameIdFallback || "";
  const home = raw?.home_code || raw?.home || "";
  const away = raw?.away_code || raw?.away || "";

  const season = raw?.season != null ? String(raw.season)
                 : gid.substring(3,7);

  let date = raw?.date || "";
  if(!date && gid.length >= 11){
    const yyyy = gid.substring(3,7);
    const mm = gid.substring(7,9);
    const dd = gid.substring(9,11);
    date = `${yyyy}-${mm}-${dd}`;
  }

  const homeScore = raw?.home_score ?? raw?.home_runs ?? null;
  const awayScore = raw?.away_score ?? raw?.away_runs ?? null;

  const venueCode = raw?.venue ?? raw?.venue_code ?? null;

  return { gid, home, away, season, date, homeScore, awayScore, venueCode };
}

(async function(){

  const year  = getParam("year");
  const team1 = getParam("team1");
  const team2 = getParam("team2");

  const title = document.getElementById("seriesTitle");
  const sub   = document.getElementById("seriesSubtitle");
  const container = document.getElementById("gamesContainer");

  title.textContent = `${team1} vs ${team2}`;
  sub.textContent   = `Postseason ${year}`;

  // ROOT-RELATIVE PATHS — WORKS WITH OR WITHOUT /docs
  const base = window.location.origin + window.location.pathname.replace(/baseball-series\.html.*/, "");

  const [index, teams, parks] = await Promise.all([
    fetchJSON("data/baseball/postseason-games/index.json"),
    fetchJSON("data/baseball/teams.json"),
    fetchCSV("data/baseball/ballparks.csv")
  ]);

  if(!index){
    container.innerHTML = "<div>Index failed to load.</div>";
    return;
  }

  const teamMap = {};
  if(teams){
    teams.forEach(t => teamMap[t.code] = t.name);
  }

  const parkMap = {};
  if(parks){
    parks.slice(1).forEach(row => {
      parkMap[row[0]] = row[1];
    });
  }

  const yearIds = index.filter(id => id.substring(3,7) === String(year));
  const games = [];

  for(const gameId of yearIds){
    const raw = await fetchJSON(`data/baseball/postseason-games/${gameId}.json`);
    if(!raw) continue;

    const g = normalizeGame(raw, gameId);

    if(
      (g.home === team1 && g.away === team2) ||
      (g.home === team2 && g.away === team1)
    ){
      games.push(g);
    }
  }

  if(!games.length){
    container.innerHTML = "<div>No games found.</div>";
    return;
  }

  games.sort((a,b)=> a.date.localeCompare(b.date));

  games.forEach((g) => {

    const homeName = teamMap[g.home] || g.home;
    const awayName = teamMap[g.away] || g.away;

    const scoreText =
      g.homeScore != null && g.awayScore != null
      ? `${g.awayScore} – ${g.homeScore}`
      : "";

    const venueText =
      g.venueCode && parkMap[g.venueCode]
      ? parkMap[g.venueCode]
      : "";

    const div = document.createElement("div");
    div.className = "game";

    div.innerHTML = `
      <div class="team-row">
        <span>${awayName}</span>
        <span>${scoreText}</span>
      </div>
      <div class="team-row">
        <span>${homeName}</span>
        <span></span>
      </div>
      <div class="meta">
        ${g.date}${venueText ? " • " + venueText : ""}
      </div>
    `;

    div.onclick = () => {
      window.location.href =
        `postseason-game.html?game=${g.gid}`;
    };

    container.appendChild(div);
  });

})();
</script>

</body>
</html>
