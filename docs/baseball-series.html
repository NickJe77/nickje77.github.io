<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --line:#e6e8ee;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1100px;
  margin:auto;
  padding:30px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:25px;
}

.games{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.game{
  background:#fff;
  padding:18px;
  border-radius:16px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:.2s;
}

.game:hover{
  background:#eaf3ff;
  transform:translateY(-2px);
}

.game-header{
  font-size:13px;
  color:#555;
  margin-bottom:8px;
}

.score-row{
  display:flex;
  justify-content:space-between;
  font-weight:600;
  font-size:16px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html">Postseason</a>
</div>

<div class="page">
  <div class="hero">
    <h1 id="seriesTitle">Loading...</h1>
    <div id="seriesSubtitle"></div>
  </div>
  <div class="games" id="gamesContainer"></div>
</div>

<script>

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

(async function(){

  const year = getParam("year");
  const team1 = getParam("team1");
  const team2 = getParam("team2");

  const container = document.getElementById("gamesContainer");

  if(!year || !team1 || !team2){
    document.getElementById("seriesTitle").textContent = "Series Not Found";
    return;
  }

  document.getElementById("seriesTitle").textContent =
    `${team1} vs ${team2}`;

  document.getElementById("seriesSubtitle").textContent =
    `Postseason ${year}`;

  const postseason = await fetchJSON("data/baseball/postseason.json");
  if(!postseason){
    document.getElementById("seriesTitle").textContent = "Postseason data missing";
    return;
  }

  // Find exact series
  const series = postseason.find(s =>
    String(s.year) === String(year) &&
    (
      (s.team1 === team1 && s.team2 === team2) ||
      (s.team1 === team2 && s.team2 === team1)
    )
  );

  if(!series){
    document.getElementById("seriesTitle").textContent = "Series Not Found";
    return;
  }

  if(!series.games || !series.games.length){
    container.innerHTML = "<div>No games found.</div>";
    return;
  }

  const games = [];

  for(const gameId of series.games){
    const g = await fetchJSON(`data/baseball/postseason-games/${gameId}.json`);
    if(g) games.push(g);
  }

  games.sort((a,b)=> new Date(a.date) - new Date(b.date));

  games.forEach((g,index)=>{

    const div = document.createElement("div");
    div.className = "game";

    div.innerHTML = `
      <div class="game-header">
        Game ${index+1} • ${g.date || ""}
      </div>
      <div class="score-row">
        <span>${g.away_team}</span>
        <span>${g.away_score ?? ""}</span>
      </div>
      <div class="score-row">
        <span>${g.home_team}</span>
        <span>${g.home_score ?? ""}</span>
      </div>
    `;

    div.addEventListener("click",()=>{
      window.location.href =
        `postseason-game.html?game=${g.game_id}`;
    });

    container.appendChild(div);

  });

})();
</script>

</body>
</html>
