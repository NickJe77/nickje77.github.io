<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.page{
  max-width:1100px;
  margin:auto;
  padding:30px;
}
.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:25px;
}
.games{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.game{
  background:#fff;
  padding:18px;
  border-radius:16px;
  border:1px solid #e6e8ee;
  cursor:pointer;
}
.debug{
  background:#000;
  color:#0f0;
  padding:10px;
  font-size:13px;
  margin-bottom:20px;
  border-radius:8px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html">Postseason</a>
</div>

<div class="page">
  <div id="debug" class="debug">Loading debug...</div>

  <div class="hero">
    <h1 id="seriesTitle">Loading...</h1>
    <div id="seriesSubtitle"></div>
  </div>

  <div class="games" id="gamesContainer"></div>
</div>

<script>

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

(async function(){

  const year  = getParam("year");
  const team1 = getParam("team1");
  const team2 = getParam("team2");

  const debug = document.getElementById("debug");
  const title = document.getElementById("seriesTitle");
  const sub   = document.getElementById("seriesSubtitle");
  const container = document.getElementById("gamesContainer");

  debug.innerHTML =
    "URL VALUES → year=" + year +
    " | team1=" + team1 +
    " | team2=" + team2;

  if(!year || !team1 || !team2){
    title.textContent = "Series Not Found";
    return;
  }

  title.textContent = team1 + " vs " + team2;
  sub.textContent   = "Postseason " + year;

  const index = await fetchJSON("data/baseball/postseason-games/index.json");

  if(!index){
    debug.innerHTML += "<br>Index failed to load.";
    return;
  }

  debug.innerHTML += "<br>Total index entries: " + index.length;

  const games = [];

  for(const gameId of index){

    const g = await fetchJSON("data/baseball/postseason-games/" + gameId + ".json");
    if(!g) continue;

    if(
      String(g.season) === String(year) &&
      (
        (g.home_code === team1 && g.away_code === team2) ||
        (g.home_code === team2 && g.away_code === team1)
      )
    ){
      games.push(g);
    }
  }

  debug.innerHTML += "<br>Matched games: " + games.length;

  if(!games.length){
    container.innerHTML = "<div>No games found.</div>";
    return;
  }

  games.sort((a,b)=> a.date.localeCompare(b.date));

  games.forEach((g,index)=>{

    const div = document.createElement("div");
    div.className = "game";
    div.innerHTML =
      "<div>Game " + (index+1) + "</div>" +
      "<div>" + g.away_code + " @ " + g.home_code + "</div>" +
      "<div>" + g.date + "</div>";

    container.appendChild(div);
  });

})();
</script>

</body>
</html>
