<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --line:#e6e8ee;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1100px;
  margin:auto;
  padding:30px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:25px;
}

.hero h1{margin:0;font-size:32px;}
.subtitle{margin-top:6px;opacity:.9;}

.games{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.game{
  background:#fff;
  padding:18px;
  border-radius:16px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:.2s;
}

.game:hover{
  background:#eaf3ff;
  transform:translateY(-2px);
}

.game-header{
  font-size:13px;
  color:#555;
  margin-bottom:8px;
}

.score-row{
  display:flex;
  justify-content:space-between;
  font-weight:600;
  font-size:16px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html">Postseason</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="seriesTitle">Loading...</h1>
    <div class="subtitle" id="seriesSubtitle"></div>
  </div>

  <div class="games" id="gamesContainer"></div>

</div>

<script>

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

(async function(){

  const year = getParam("year");
  const team1 = getParam("team1");
  const team2 = getParam("team2");

  document.getElementById("seriesTitle").textContent =
    `${team1} vs ${team2}`;

  document.getElementById("seriesSubtitle").textContent =
    `Postseason ${year}`;

  // Fetch list of files dynamically using known postseason.json
  const postseason = await fetchJSON("data/baseball/postseason.json");
  if(!postseason) return;

  // We assume files exist because we generated them.
  const container = document.getElementById("gamesContainer");

  // We cannot list folder contents from browser,
  // so we attempt sequential fetches using postseason.json
  const yearSeries = postseason.filter(d => String(d.year) === String(year));

  let games = [];

  for(const s of yearSeries){

    const match =
      (s.champion_code === team1 && s.runner_up_code === team2) ||
      (s.champion_code === team2 && s.runner_up_code === team1);

    if(!match) continue;

    // Try loading potential games by brute forcing postseason-games folder
    // Since filenames are already known from JSON generator,
    // we rely on postseason.json to guide filtering later.
  }

  // Instead of index.json, we hard fetch all game files via known structure
  // Since browser cannot read directory, we use postseason.json as driver
  // So we rely on your previous filtering logic

  const seasonData = await fetchJSON(`data/baseball/seasons/${year}.json`);
  if(!seasonData) return;

  games = seasonData.filter(g =>
    (g.home_code === team1 && g.away_code === team2) ||
    (g.home_code === team2 && g.away_code === team1)
  );

  games.sort((a,b)=> new Date(a.date) - new Date(b.date));

  games.forEach((g,index)=>{

    const div = document.createElement("div");
    div.className = "game";

    div.innerHTML = `
      <div class="game-header">
        Game ${index+1} • ${g.date}
      </div>
      <div class="score-row">
        <span>${g.away_code}</span>
        <span>@</span>
        <span>${g.home_code}</span>
      </div>
    `;

    div.addEventListener("click",()=>{
      window.location.href = `postseason-game.html?game=${g.game_id}`;
    });

    container.appendChild(div);

  });

})();
</script>

</body>
</html>
