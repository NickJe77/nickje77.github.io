<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>MLB Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;
  padding:15px;background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{ text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s; }
.navbar a:hover,.navbar a[aria-current="page"]{ opacity:1;color:var(--accent); }

.page{ max-width:1000px;margin:0 auto;padding:26px 20px 70px; }

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:32px 34px;border-radius:var(--radius);margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,4.5vw,36px);
  letter-spacing:.01em;text-transform:uppercase;
}
.hero .sub{ margin-top:8px;font-size:13px;color:rgba(255,255,255,.7);font-weight:600; }
.series-score{
  margin-top:14px;font-family:var(--display);font-size:22px;font-weight:600;
  color:#fff;font-variant-numeric:tabular-nums;
}

/* ── Game cards ───────────────────────────────────────── */
.series-games{ display:flex;flex-direction:column;gap:14px; }

.game-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:20px;cursor:pointer;
  transition:transform .15s,background .15s,border-color .15s;
}
.game-card:hover{ transform:translateY(-2px);background:var(--accent-soft);border-color:var(--accent); }

.topline{ display:flex;justify-content:space-between;align-items:center;margin-bottom:12px; }

.badge{
  font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;background:var(--accent-soft);color:var(--accent);
  padding:4px 12px;border-radius:999px;
}

.meta{ font-size:12.5px;color:var(--muted); }

.row{
  display:flex;justify-content:space-between;align-items:center;
  font-weight:600;font-size:15px;line-height:1.6;color:var(--ink);
}

.score{ font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums; }
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html" aria-current="page">Postseason</a>
</div>

<div class="page">
  <div class="hero">
    <div class="eyebrow">MLB Postseason</div>
    <h1 id="seriesTitle">Loading...</h1>
    <div class="sub" id="seriesSubtitle"></div>
    <div class="series-score" id="seriesScore"></div>
  </div>

  <div id="games" class="series-games"></div>
</div>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function fetchJSON(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) return null;
  return await r.json();
}

async function fetchText(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) return null;
  return await r.text();
}

async function pickBase(){
  const ok = await fetch("data/baseball/teams.json",{cache:"no-store"})
    .then(r=>r.ok)
    .catch(()=>false);
  return ok ? "data/baseball/" : "docs/data/baseball/";
}

function buildTeamMap(teamsArray){
  const map = {};
  for(const team of teamsArray){
    if(!team.codes) continue;
    for(const code of team.codes){
      map[code] = team.name;
    }
  }
  return map;
}

function buildParkMap(csvText){
  const map = {};
  if(!csvText) return map;

  const lines = csvText.split(/\r?\n/);
  for(let i=1;i<lines.length;i++){
    const line = lines[i].trim();
    if(!line) continue;
    const parts = line.split(",");
    const parkId = parts[0]?.trim();
    const parkName = parts[1]?.trim();
    if(parkId) map[parkId] = parkName || parkId;
  }
  return map;
}

function roundLabel(code){
  const map = {
    "WC": "Wild Card",
    "DS": "Division Series",
    "CS": "Championship Series",
    "WS": "World Series"
  };
  return map[code] || code;
}

(async function(){

  const year  = getParam("year");
  const team1 = getParam("team1");
  const team2 = getParam("team2");
  const round = getParam("round") || "";

  const base = await pickBase();

  const [meta, teamsRaw, parksCSV] = await Promise.all([
    fetchJSON(base + "postseason_meta.json"),
    fetchJSON(base + "teams.json"),
    fetchText(base + "ballparks.csv")
  ]);

  const teamMap = buildTeamMap(teamsRaw);
  const parkMap = buildParkMap(parksCSV);

  const team1Name = teamMap[team1] || team1;
  const team2Name = teamMap[team2] || team2;

  document.getElementById("seriesTitle").textContent =
    `${team1Name} vs ${team2Name}`;

  document.getElementById("seriesSubtitle").textContent =
    `Postseason ${year} • ${roundLabel(round)}`;

  const container = document.getElementById("games");
  container.innerHTML = "";

  const seriesGames = meta.filter(g =>
    String(g.season) === String(year) &&
    (
      (g.home === team1 && g.away === team2) ||
      (g.home === team2 && g.away === team1)
    )
  );

  if(!seriesGames.length){
    container.innerHTML =
      "<div class='game-card'>No games found.</div>";
    return;
  }

  seriesGames.sort((a,b)=> (a.date||"").localeCompare(b.date||""));

  // Calculate series score
  let team1Wins = 0;
  let team2Wins = 0;

  seriesGames.forEach(g=>{
    if(g.home_score > g.away_score){
      if(g.home === team1) team1Wins++;
      if(g.home === team2) team2Wins++;
    } else {
      if(g.away === team1) team1Wins++;
      if(g.away === team2) team2Wins++;
    }
  });

  document.getElementById("seriesScore").textContent =
    `${team1Name} ${team1Wins} – ${team2Wins} ${team2Name}`;

  // Render games
  seriesGames.forEach((g,idx)=>{

    const homeName = teamMap[g.home] || g.home;
    const awayName = teamMap[g.away] || g.away;
    const venueName = parkMap[g.venue] || g.venue || "";

    const card = document.createElement("div");
    card.className = "game-card";

    card.innerHTML = `
      <div class="topline">
        <span class="badge">Game ${idx+1}</span>
        <span class="meta">
          ${g.date || ""}${venueName ? " • " + venueName : ""}
        </span>
      </div>

      <div class="row">
        <span>${awayName}</span>
        <span class="score">${g.away_score}</span>
      </div>

      <div class="row">
        <span>${homeName}</span>
        <span class="score">${g.home_score}</span>
      </div>
    `;

    card.onclick = ()=>{
      window.location.href =
        "postseason-game.html?game=" + g.game_id;
    };

    container.appendChild(card);
  });

})();
</script>

</body>
</html>
