<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>MLB Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
}

body{font-family:Inter,system-ui,Arial;margin:0;background:var(--bg);}

.navbar{
  display:flex;justify-content:center;gap:24px;
  padding:16px;background:#fff;border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{ text-decoration:none;color:#0056d6; }

.page{ max-width:1000px;margin:auto;padding:30px 20px; }

.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;padding:30px;border-radius:20px;margin-bottom:25px;
}

.hero h1{ margin:0;font-size:40px; }

.hero .sub{ margin-top:8px;font-weight:700;opacity:.9; }

.series-games{
  display:flex;flex-direction:column;gap:16px;
}

.game-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:20px;cursor:pointer;transition:.2s;
}

.game-card:hover{ transform:translateY(-3px);background:#eef5ff; }

.topline{ display:flex;justify-content:space-between;margin-bottom:10px; }

.badge{
  font-size:12px;font-weight:900;
  background:#eef2ff;padding:4px 10px;border-radius:999px;
}

.meta{ font-size:13px;color:#666; }

.row{
  display:flex;justify-content:space-between;
  font-weight:800;font-size:18px;line-height:1.4;
}

.score{ font-weight:900; }

.series-score{
  margin-top:12px;
  font-size:18px;
  font-weight:900;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html">Postseason</a>
</div>

<div class="page">
  <div class="hero">
    <h1 id="seriesTitle">Loading...</h1>
    <div class="sub" id="seriesSubtitle"></div>
    <div class="series-score" id="seriesScore"></div>
  </div>

  <div id="games" class="series-games"></div>
</div>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function fetchJSON(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) return null;
  return await r.json();
}

async function fetchText(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) return null;
  return await r.text();
}

async function pickBase(){
  const ok = await fetch("data/baseball/teams.json",{cache:"no-store"})
    .then(r=>r.ok)
    .catch(()=>false);
  return ok ? "data/baseball/" : "docs/data/baseball/";
}

function buildTeamMap(teamsArray){
  const map = {};
  for(const team of teamsArray){
    if(!team.codes) continue;
    for(const code of team.codes){
      map[code] = team.name;
    }
  }
  return map;
}

function buildParkMap(csvText){
  const map = {};
  if(!csvText) return map;

  const lines = csvText.split(/\r?\n/);
  for(let i=1;i<lines.length;i++){
    const line = lines[i].trim();
    if(!line) continue;
    const parts = line.split(",");
    const parkId = parts[0]?.trim();
    const parkName = parts[1]?.trim();
    if(parkId) map[parkId] = parkName || parkId;
  }
  return map;
}

function roundLabel(code){
  const map = {
    "WC": "Wild Card",
    "DS": "Division Series",
    "CS": "Championship Series",
    "WS": "World Series"
  };
  return map[code] || code;
}

(async function(){

  const year  = getParam("year");
  const team1 = getParam("team1");
  const team2 = getParam("team2");
  const round = getParam("round") || "";

  const base = await pickBase();

  const [meta, teamsRaw, parksCSV] = await Promise.all([
    fetchJSON(base + "postseason_meta.json"),
    fetchJSON(base + "teams.json"),
    fetchText(base + "ballparks.csv")
  ]);

  const teamMap = buildTeamMap(teamsRaw);
  const parkMap = buildParkMap(parksCSV);

  const team1Name = teamMap[team1] || team1;
  const team2Name = teamMap[team2] || team2;

  document.getElementById("seriesTitle").textContent =
    `${team1Name} vs ${team2Name}`;

  document.getElementById("seriesSubtitle").textContent =
    `Postseason ${year} • ${roundLabel(round)}`;

  const container = document.getElementById("games");
  container.innerHTML = "";

  const seriesGames = meta.filter(g =>
    String(g.season) === String(year) &&
    (
      (g.home === team1 && g.away === team2) ||
      (g.home === team2 && g.away === team1)
    )
  );

  if(!seriesGames.length){
    container.innerHTML =
      "<div class='game-card'>No games found.</div>";
    return;
  }

  seriesGames.sort((a,b)=> (a.date||"").localeCompare(b.date||""));

  // Calculate series score
  let team1Wins = 0;
  let team2Wins = 0;

  seriesGames.forEach(g=>{
    if(g.home_score > g.away_score){
      if(g.home === team1) team1Wins++;
      if(g.home === team2) team2Wins++;
    } else {
      if(g.away === team1) team1Wins++;
      if(g.away === team2) team2Wins++;
    }
  });

  document.getElementById("seriesScore").textContent =
    `${team1Name} ${team1Wins} – ${team2Wins} ${team2Name}`;

  // Render games
  seriesGames.forEach((g,idx)=>{

    const homeName = teamMap[g.home] || g.home;
    const awayName = teamMap[g.away] || g.away;
    const venueName = parkMap[g.venue] || g.venue || "";

    const card = document.createElement("div");
    card.className = "game-card";

    card.innerHTML = `
      <div class="topline">
        <span class="badge">Game ${idx+1}</span>
        <span class="meta">
          ${g.date || ""}${venueName ? " • " + venueName : ""}
        </span>
      </div>

      <div class="row">
        <span>${awayName}</span>
        <span class="score">${g.away_score}</span>
      </div>

      <div class="row">
        <span>${homeName}</span>
        <span class="score">${g.home_score}</span>
      </div>
    `;

    card.onclick = ()=>{
      window.location.href =
        "postseason-game.html?game=" + g.game_id;
    };

    container.appendChild(card);
  });

})();
</script>

</body>
</html>
