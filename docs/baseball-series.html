<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--line);
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1000px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:25px;
}

.series-games{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.game-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  cursor:pointer;
  transition:.2s;
}

.game-card:hover{
  transform:translateY(-3px);
  background:#eef5ff;
}

.matchup{
  display:flex;
  justify-content:space-between;
  font-weight:700;
  font-size:18px;
}

.meta{
  font-size:13px;
  color:#666;
  margin-top:8px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html">Postseason</a>
</div>

<div class="page">
  <div class="hero">
    <h1 id="seriesTitle">Loading...</h1>
    <div id="seriesSubtitle"></div>
  </div>
  <div id="games" class="series-games"></div>
</div>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

async function fetchCSV(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  const text = await r.text();
  return text.split("\n").map(r=>r.split(","));
}

(async function(){

  const year  = getParam("year");
  const team1 = getParam("team1");
  const team2 = getParam("team2");

  document.getElementById("seriesTitle").textContent =
    `${team1} vs ${team2}`;

  document.getElementById("seriesSubtitle").textContent =
    `Postseason ${year}`;

  const base = window.location.pathname.includes("/docs/")
    ? "/docs/data/baseball/"
    : "/data/baseball/";

  const index = await fetchJSON(base + "postseason-games/index.json");
  const teams = await fetchJSON(base + "teams.json");
  const parks = await fetchCSV(base + "ballparks.csv");

  if(!index) return;

  // teams.json assumed to be OBJECT:
  // { "ARI": "Arizona Diamondbacks", ... }

  const parkMap = {};
  if(parks){
    parks.slice(1).forEach(r=>{
      const teamCode = r[2];   // adjust if your csv uses different column
      const parkName = r[1];
      parkMap[teamCode] = parkName;
    });
  }

  const games = [];
  const yearIds = index.filter(id=>id.substring(3,7)===year);

  for(const id of yearIds){
    const raw = await fetchJSON(base + "postseason-games/" + id + ".json");
    if(!raw) continue;

    const home = raw.home;
    const away = raw.away;

    if(
      (home===team1 && away===team2) ||
      (home===team2 && away===team1)
    ){
      games.push({id, raw});
    }
  }

  games.sort((a,b)=>a.id.localeCompare(b.id));

  const container = document.getElementById("games");

  games.forEach(g=>{

    const raw = g.raw;

    const home = raw.home;
    const away = raw.away;

    const homeName = teams?.[home] || home;
    const awayName = teams?.[away] || away;

    const score =
      raw.home_score!=null && raw.away_score!=null
      ? `${raw.away_score} – ${raw.home_score}`
      : "";

    const venue = parkMap[home] || "";

    const date =
      raw.date ||
      `${g.id.substring(3,7)}-${g.id.substring(7,9)}-${g.id.substring(9,11)}`;

    const card = document.createElement("div");
    card.className = "game-card";

    card.innerHTML = `
      <div class="matchup">
        <span>${awayName}</span>
        <span>${score}</span>
      </div>
      <div class="matchup">
        <span>${homeName}</span>
        <span></span>
      </div>
      <div class="meta">
        ${date}${venue ? " • " + venue : ""}
      </div>
    `;

    card.onclick = ()=>{
      window.location.href =
        "postseason-game.html?game=" + g.id;
    };

    container.appendChild(card);
  });

})();
</script>

</body>
</html>
