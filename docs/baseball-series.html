<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
}
body{font-family:Inter,system-ui,Arial;margin:0;background:var(--bg);}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid var(--line);font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1000px;margin:auto;padding:30px 20px;}
.hero{background:linear-gradient(90deg,var(--blue),var(--red));color:#fff;padding:30px;border-radius:20px;margin-bottom:25px;}
.series-games{display:flex;flex-direction:column;gap:16px;}
.game-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:.2s;}
.game-card:hover{transform:translateY(-3px);background:#eef5ff;}
.matchup{display:flex;justify-content:space-between;font-weight:800;font-size:18px;}
.meta{font-size:13px;color:#666;margin-top:8px;}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html">Postseason</a>
</div>

<div class="page">
  <div class="hero">
    <h1 id="seriesTitle">Loading...</h1>
    <div id="seriesSubtitle"></div>
  </div>
  <div id="games" class="series-games"></div>
</div>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function fetchJSON(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) return null;
  return await r.json();
}

async function pickBase(){
  const try1 = await fetch("data/baseball/teams.json").then(r=>r.ok).catch(()=>false);
  if(try1) return "data/baseball/";
  return "docs/data/baseball/";
}

(async function(){

  const year  = getParam("year");
  const team1 = getParam("team1");
  const team2 = getParam("team2");

  document.getElementById("seriesTitle").textContent =
    `${team1} vs ${team2}`;
  document.getElementById("seriesSubtitle").textContent =
    `Postseason ${year}`;

  const base = await pickBase();

  const teams = await fetchJSON(base + "teams.json");
  const seasonGames = await fetchJSON(base + "seasons/" + year + ".json");

  if(!seasonGames){
    document.getElementById("games").innerHTML =
      "<div class='game-card'>Season file missing.</div>";
    return;
  }

  const container = document.getElementById("games");

  const seriesGames = seasonGames.filter(g =>
    g.game_id &&
    (
      (g.home_code===team1 && g.away_code===team2) ||
      (g.home_code===team2 && g.away_code===team1)
    )
    && g.postseason === true
  );

  seriesGames.sort((a,b)=>a.date.localeCompare(b.date));

  seriesGames.forEach((g,idx)=>{

    const homeName = teams[g.home_code] || g.home_code;
    const awayName = teams[g.away_code] || g.away_code;

    const card = document.createElement("div");
    card.className = "game-card";

    card.innerHTML = `
      <div class="matchup">
        <span>${awayName}</span>
        <span>${g.away_score} – ${g.home_score}</span>
      </div>
      <div class="matchup">
        <span>${homeName}</span>
        <span></span>
      </div>
      <div class="meta">
        ${g.date} • ${g.venue}
      </div>
    `;

    card.onclick = ()=>{
      window.location.href =
        "postseason-game.html?game=" + g.game_id;
    };

    container.appendChild(card);
  });

})();
</script>

</body>
</html>
