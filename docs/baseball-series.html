<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --line:#e6e8ee;
}
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.page{
  max-width:1100px;
  margin:auto;
  padding:30px;
}
.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:25px;
}
.games{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.game{
  background:#fff;
  padding:18px;
  border-radius:16px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:.2s;
}
.game:hover{
  background:#eaf3ff;
  transform:translateY(-2px);
}
.game-header{
  font-size:13px;
  color:#555;
  margin-bottom:8px;
}
.score-row{
  display:flex;
  justify-content:space-between;
  font-weight:600;
  font-size:16px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html">Postseason</a>
</div>

<div class="page">
  <div class="hero">
    <h1 id="seriesTitle">Loading...</h1>
    <div id="seriesSubtitle"></div>
  </div>
  <div class="games" id="gamesContainer"></div>
</div>

<script>

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

(async function(){

  const year  = getParam("year");
  const team1 = getParam("team1");
  const team2 = getParam("team2");

  const title = document.getElementById("seriesTitle");
  const sub   = document.getElementById("seriesSubtitle");
  const container = document.getElementById("gamesContainer");

  if(!year || !team1 || !team2){
    title.textContent = "Series Not Found";
    return;
  }

  title.textContent = `${team1} vs ${team2}`;
  sub.textContent   = `Postseason ${year}`;

  // Confirm series exists in postseason.json
  const postseason = await fetchJSON("data/baseball/postseason.json");
  if(!postseason){
    title.textContent = "Postseason data missing";
    return;
  }

  const seriesExists = postseason.find(s =>
    s.year === year &&
    (
      (s.champion_code === team1 && s.runner_up_code === team2) ||
      (s.champion_code === team2 && s.runner_up_code === team1)
    )
  );

  if(!seriesExists){
    title.textContent = "Series Not Found";
    return;
  }

  // Load index file
  const index = await fetchJSON("data/baseball/postseason-games/index.json");
  if(!index){
    container.innerHTML = "<div>Game index missing.</div>";
    return;
  }

  const games = [];

  for(const gameId of index){

    // Extract year from filename
    const gameYear = gameId.substring(3,7);
    if(gameYear !== year) continue;

    const g = await fetchJSON(`data/baseball/postseason-games/${gameId}.json`);
    if(!g) continue;

    if(
      (g.home === team1 && g.away === team2) ||
      (g.home === team2 && g.away === team1)
    ){
      games.push(g);
    }
  }

  if(!games.length){
    container.innerHTML = "<div>No games found.</div>";
    return;
  }

  // Sort chronologically by game_id
  games.sort((a,b)=> a.game_id.localeCompare(b.game_id));

  games.forEach((g,index)=>{

    const div = document.createElement("div");
    div.className = "game";

    div.innerHTML = `
      <div class="game-header">
        Game ${index+1}
      </div>
      <div class="score-row">
        <span>${g.away}</span>
        <span></span>
      </div>
      <div class="score-row">
        <span>${g.home}</span>
        <span></span>
      </div>
    `;

    div.onclick = () => {
      window.location.href =
        `postseason-game.html?game=${g.game_id}`;
    };

    container.appendChild(div);

  });

})();
</script>

</body>
</html>
