<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Series | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --line:#e6e8ee;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1100px;
  margin:auto;
  padding:30px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:25px;
}

.games{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.game{
  background:#fff;
  padding:18px;
  border-radius:16px;
  border:1px solid var(--line);
  cursor:pointer;
  transition:.2s;
}

.game:hover{
  background:#eaf3ff;
  transform:translateY(-2px);
}

.game-header{
  font-size:13px;
  color:#555;
  margin-bottom:8px;
}

.score-row{
  display:flex;
  justify-content:space-between;
  font-weight:600;
  font-size:16px;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html">Postseason</a>
</div>

<div class="page">
  <div class="hero">
    <h1 id="seriesTitle">Loading...</h1>
    <div id="seriesSubtitle"></div>
  </div>
  <div class="games" id="gamesContainer"></div>
</div>

<script>

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

(async function(){

  const year = getParam("year");
  const team1 = getParam("team1");
  const team2 = getParam("team2");

  const container = document.getElementById("gamesContainer");

  document.getElementById("seriesTitle").textContent =
    `${team1} vs ${team2}`;

  document.getElementById("seriesSubtitle").textContent =
    `Postseason ${year}`;

  let games = [];

  // Attempt up to 50 postseason games for that year
  // (more than enough for any year)
  for(let i = 0; i < 50; i++){

    // We don’t know exact IDs, so we brute test by scanning known patterns
    // Instead we fetch every file that matches year by scanning alphabetically

    // Since filenames are not enumerable, we attempt fetch by year prefix
    // by trying every team prefix found in postseason.json

  }

  // Instead: brute load all possible game files for year by
  // fetching every postseason game file once using a known list

  // Safer approach: load postseason.json to get teams involved

  const postseason = await fetchJSON("data/baseball/postseason.json");
  if(!postseason) return;

  const yearSeries = postseason.filter(s => String(s.year) === String(year));

  // Load all postseason game files for this year
  // We do this by testing game_id patterns from 000 to 999

  for(let day = 1; day <= 31; day++){
    for(let month = 9; month <= 11; month++){

      const mm = String(month).padStart(2,"0");
      const dd = String(day).padStart(2,"0");

      const possibleId1 = `${team1}${year}${mm}${dd}0`;
      const possibleId2 = `${team2}${year}${mm}${dd}0`;

      const g1 = await fetchJSON(`data/baseball/postseason-games/${possibleId1}.json`);
      if(g1 &&
        ((g1.home === team1 && g1.away === team2) ||
         (g1.home === team2 && g1.away === team1))){
        games.push(g1);
      }

      const g2 = await fetchJSON(`data/baseball/postseason-games/${possibleId2}.json`);
      if(g2 &&
        ((g2.home === team1 && g2.away === team2) ||
         (g2.home === team2 && g2.away === team1))){
        games.push(g2);
      }

    }
  }

  games.sort((a,b)=> new Date(a.date) - new Date(b.date));

  games.forEach((g,index)=>{

    const div = document.createElement("div");
    div.className = "game";

    div.innerHTML = `
      <div class="game-header">
        Game ${index+1} • ${g.date || ""}
      </div>
      <div class="score-row">
        <span>${g.away}</span>
        <span></span>
      </div>
      <div class="score-row">
        <span>${g.home}</span>
        <span></span>
      </div>
    `;

    div.addEventListener("click",()=>{
      window.location.href =
        `postseason-game.html?game=${g.game_id}`;
    });

    container.appendChild(div);

  });

})();
</script>

</body>
</html>
