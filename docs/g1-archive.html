<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>G1 Racing Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Global site styles -->
  <link rel="stylesheet" href="../style.css">

  <!-- G1 ARCHIVE – LOCAL TWEAKS ONLY -->
  <style>
    /* ---------- HERO ---------- */

    .g1-hero {
      max-width: 1200px;
      margin: 36px auto 24px;
      padding: 0 24px;
      position: relative;
    }

    .g1-hero img {
      width: 100%;
      height: 340px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .g1-hero-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: 0 40px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
    }

    .g1-hero-text h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .g1-hero-text p {
      font-size: 18px;
      max-width: 720px;
    }

    /* ---------- FILTERS ---------- */

    .filters {
      max-width: 1200px;
      margin: 40px auto 30px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      align-items: end;
    }

    .filter-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .filters select,
    .filters input {
      width: 100%;
      height: 46px;
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 10px;
      box-sizing: border-box;
    }

    /* ---------- TABLE ---------- */

    .archive-table {
      max-width: 1200px;
      margin: 0 auto 80px;
      padding: 0 24px;
      overflow-x: auto;
    }

    .archive-table table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
    }

    .archive-table th,
    .archive-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e5e5;
      vertical-align: top;
    }

    .archive-table th {
      font-weight: 600;
      background: #f7f7f7;
      text-align: left;
    }

    /* Column sizing */
    .archive-table th:nth-child(1),
    .archive-table td:nth-child(1) { width: 70px; white-space: nowrap; }

    .archive-table th:nth-child(2),
    .archive-table td:nth-child(2) { white-space: nowrap; }

    .archive-table th:nth-child(3),
    .archive-table td:nth-child(3) {
      width: 180px;
      white-space: normal;
      word-break: break-word;
    }

    .archive-table th:nth-child(4),
    .archive-table td:nth-child(4) { white-space: nowrap; }

    .archive-table th:nth-child(5),
    .archive-table td:nth-child(5) {
      width: 180px;
      white-space: normal;
      word-break: break-word;
    }

    .archive-table th:nth-child(6),
    .archive-table td:nth-child(6) { white-space: nowrap; }

    .archive-table th:nth-child(7),
    .archive-table td:nth-child(7) {
      width: 120px;
      white-space: normal;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <!-- NAV (CONSISTENT WITH HOME / RACING) -->
  <nav class="home-nav">
    <a href="../index.html">Home</a>
    <a href="../racing.html">Racing</a>
    <a href="g1-archive.html" class="active">G1 Archive</a>
    <a href="../breeders-cup.html">Breeders’ Cup</a>
  </nav>

  <!-- HERO -->
  <div class="g1-hero">
    <img src="../images/g1-hero.jpg" alt="Group 1 Racing">
    <div class="g1-hero-text">
      <h1>Group 1 Racing Archive</h1>
      <p>
        A complete historical archive of worldwide Group 1 racing results,
        searchable by year, race and winner.
      </p>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <div class="filter-group">
      <label for="yearFilter">Year</label>
      <select id="yearFilter">
        <option value="">All</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="raceFilter">Race</label>
      <input id="raceFilter" type="text" list="raceList" placeholder="Type race name">
      <datalist id="raceList"></datalist>
    </div>

    <div class="filter-group">
      <label for="winnerFilter">Winner</label>
      <input id="winnerFilter" type="text" list="winnerList" placeholder="Type horse name">
      <datalist id="winnerList"></datalist>
    </div>
  </div>

  <!-- TABLE -->
  <div class="archive-table">
    <table>
      <thead>
        <tr>
          <th>Year</th>
          <th>Race</th>
          <th>Track</th>
          <th>Winner</th>
          <th>Trainer</th>
          <th>Jockey</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="g1-results.js" defer></script>

</body>
</html>
