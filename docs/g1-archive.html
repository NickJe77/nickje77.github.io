<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>G1 Racing Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../racing.css">

  <style>
    .g1-hero {
      max-width: 1200px;
      margin: 36px auto 24px;
      padding: 0 24px;
    }

    .g1-hero img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .filters {
      max-width: 1200px;
      margin: 40px auto 10px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      align-items: end;
    }

    .filter-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .filters select,
    .filters input {
      width: 100%;
      height: 42px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background: #ffffff;
      color: #111;
      font-weight: 600;
    }

    .filters select option {
      background: #ffffff;
      color: #111;
    }

    #resultCounter {
      max-width: 1200px;
      margin: 0 auto 20px;
      padding: 0 24px;
      font-weight: 700;
      font-size: 14px;
      color: #444;
    }

    .archive-table {
      max-width: 1200px;
      margin: 0 auto 80px;
      padding: 0 24px;
      overflow-x: auto;
    }

    .archive-table table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      border: 1px solid #cfdff1;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      font-size: 14px;
    }

    .archive-table th,
    .archive-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #e5e5e5;
      vertical-align: top;
    }

    .archive-table th {
      font-weight: 600;
      background: #f2f6fb;
      text-align: left;
    }

    .archive-table tbody tr:nth-child(even) {
      background: #f4f8ff;
    }

    .archive-table th:nth-child(1),
    .archive-table td:nth-child(1) {
      width: 70px;
      white-space: nowrap;
    }

    .archive-table th:nth-child(7),
    .archive-table td:nth-child(7) {
      width: 60px;
      text-align: center;
    }

    .flag {
      font-size: 18px;
      line-height: 1;
    }
  </style>
</head>

<body>

  <nav class="home-nav">
    <a href="../index.html">Home</a>
    <a href="../racing.html">Racing</a>
    <a href="g1-archive.html" class="active">G1 Archive</a>
    <a href="../breeders-cup.html">Breeders’ Cup</a>
  </nav>

  <div class="g1-hero">
    <img src="../images/g1-hero.jpg" alt="Group 1 Racing Archive">
  </div>

  <div class="filters">
    <div class="filter-group">
      <label for="yearFilter">Year</label>
      <select id="yearFilter">
        <option value="">All</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="raceFilter">Race</label>
      <input id="raceFilter" type="text" list="raceList" placeholder="Race">
      <datalist id="raceList"></datalist>
    </div>

    <div class="filter-group">
      <label for="winnerFilter">Winner</label>
      <input id="winnerFilter" type="text" list="winnerList" placeholder="Winner">
      <datalist id="winnerList"></datalist>
    </div>

    <div class="filter-group">
      <label for="jockeyFilter">Jockey</label>
      <input id="jockeyFilter" type="text" list="jockeyList" placeholder="Jockey">
      <datalist id="jockeyList"></datalist>
    </div>

    <div class="filter-group">
      <label for="countryFilter">Country</label>
      <input id="countryFilter" type="text" list="countryList" placeholder="Country">
      <datalist id="countryList"></datalist>
    </div>
  </div>

  <div id="resultCounter">Showing 0 results</div>

  <div class="archive-table">
    <table>
      <thead>
        <tr>
          <th>Year</th>
          <th>Race</th>
          <th>Track</th>
          <th>Winner</th>
          <th>Trainer</th>
          <th>Jockey</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    let fullData = [];

    fetch("g1-results.json")
      .then(res => res.json())
      .then(data => {
        fullData = data.sort((a,b) => b.year - a.year);
        populateFilters(fullData);
        applyFilters();
      });

    function populateFilters(data) {
      const years = [...new Set(data.map(d => d.year))].sort((a,b)=>b-a);
      const yearSelect = document.getElementById("yearFilter");

      years.forEach(y=>{
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        yearSelect.appendChild(opt);
      });
    }

    function applyFilters() {
      const year = document.getElementById("yearFilter").value;
      const race = document.getElementById("raceFilter").value.toLowerCase();
      const winner = document.getElementById("winnerFilter").value.toLowerCase();
      const jockey = document.getElementById("jockeyFilter").value.toLowerCase();
      const country = document.getElementById("countryFilter").value.toLowerCase();

      let filtered = fullData.filter(row =>
        (!year || row.year == year) &&
        (!race || row.race.toLowerCase().includes(race)) &&
        (!winner || row.winner.toLowerCase().includes(winner)) &&
        (!jockey || row.jockey.toLowerCase().includes(jockey)) &&
        (!country || row.country.toLowerCase().includes(country))
      );

      renderTable(filtered);

      document.getElementById("resultCounter").textContent =
        "Showing " + filtered.length + " result" +
        (filtered.length !== 1 ? "s" : "");
    }

    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      data.forEach(row=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.year}</td>
          <td>${row.race}</td>
          <td>${row.track}</td>
          <td>${row.winner}</td>
          <td>${row.trainer}</td>
          <td>${row.jockey}</td>
          <td>${row.country}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.querySelectorAll(".filters input, .filters select")
      .forEach(el => el.addEventListener("input", applyFilters));
  </script>

</body>
</html>
