<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group 1 Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- GLOBAL NAV -->
  <nav>
    <a href="index.html">Home</a>
    <a href="racing.html">Racing</a>
    <a href="g1-archive.html">G1 Archive</a>
  </nav>

  <!-- HERO -->
  <section class="g1-hero">
    <img src="images/g1-hero.jpg" alt="Group 1 Racing">
    <div class="g1-hero-text">
      <h1>Group 1 Racing Archive</h1>
      <p>
        A complete, year-by-year record of the world’s premier Group 1
        Thoroughbred races — results, winners, jockeys and trainers.
      </p>
    </div>
  </section>

  <main>

    <!-- FILTER BAR -->
    <section class="filters">
      <label>
        Year
        <select disabled>
          <option>All</option>
        </select>
      </label>

      <label>
        Race
        <select disabled>
          <option>All</option>
        </select>
      </label>

      <label>
        Winner
        <select disabled>
          <option>All</option>
        </select>
      </label>
    </section>

    <!-- RESULTS TABLE -->
    <section class="results">
      <table>
        <thead>
          <tr>
            <th>Year</th>
            <th>Race</th>
            <th>Track</th>
            <th>Winner</th>
            <th>Jockey</th>
            <th>Trainer</th>
            <th>Country</th>
          </tr>
        </thead>
        <tbody id="results-body">
          <!-- Rows populated by JS -->
        </tbody>
      </table>
    </section>

  </main>

  <script src="g1-results.js"></script>

</body>
</html>
