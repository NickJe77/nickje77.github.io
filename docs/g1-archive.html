<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>G1 Racing Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../racing.css">

  <style>
    .g1-hero {
      max-width: 1200px;
      margin: 36px auto 24px;
      padding: 0 24px;
    }

    .g1-hero img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .filters {
      max-width: 1200px;
      margin: 40px auto 30px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      align-items: end;
    }

    .filter-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .filters select,
    .filters input {
      width: 100%;
      height: 46px;
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .archive-table {
      max-width: 1200px;
      margin: 0 auto 80px;
      padding: 0 24px;
      overflow-x: auto;
    }

    .archive-table table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      border: 1px solid #cfdff1;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .archive-table th,
    .archive-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e5e5;
      vertical-align: top;
    }

    .archive-table th {
      font-weight: 600;
      background: #f2f6fb;
      text-align: left;
    }

    .archive-table tbody tr:nth-child(even) {
      background: #f4f8ff;
    }
  </style>
</head>

<body>

  <nav class="home-nav">
    <a href="../index.html">Home</a>
    <a href="../racing.html">Racing</a>
    <a href="g1-archive.html" class="active">G1 Archive</a>
    <a href="../breeders-cup.html">Breeders’ Cup</a>
  </nav>

  <div class="g1-hero">
    <img src="../images/g1-hero.jpg" alt="Group 1 Racing Archive">
  </div>

  <div class="filters">
    <div class="filter-group">
      <label for="yearFilter">Year</label>
      <select id="yearFilter">
        <option value="">All</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="raceFilter">Race</label>
      <input id="raceFilter" type="text" list="raceList" placeholder="Type race name">
      <datalist id="raceList"></datalist>
    </div>

    <div class="filter-group">
      <label for="winnerFilter">Winner</label>
      <input id="winnerFilter" type="text" list="winnerList" placeholder="Type horse name">
      <datalist id="winnerList"></datalist>
    </div>

    <div class="filter-group">
      <label for="jockeyFilter">Jockey</label>
      <input id="jockeyFilter" type="text" list="jockeyList" placeholder="Type jockey name">
      <datalist id="jockeyList"></datalist>
    </div>
  </div>

  <div class="archive-table">
    <table>
      <thead>
        <tr>
          <th>Year</th>
          <th>Race</th>
          <th>Track</th>
          <th>Winner</th>
          <th>Trainer</th>
          <th>Jockey</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="g1-results.js" defer></script>

</body>
</html>
