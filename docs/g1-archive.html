<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>G1 Racing Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">

  <!-- LOCAL TABLE + FILTER TWEAKS -->
  <style>
    /* Make all filter inputs the same width */
    .filters {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .filters select,
    .filters input {
      width: 100%;
    }

    /* Centre table and prevent overflow */
    .archive-table {
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
    }

    .archive-table table {
      width: 100%;
      table-layout: fixed;
    }

    /* Slim Year + Track columns */
    .archive-table th:nth-child(1),
    .archive-table td:nth-child(1) {
      width: 80px;
    }

    .archive-table th:nth-child(3),
    .archive-table td:nth-child(3) {
      width: 120px;
    }

    /* Allow Country to wrap */
    .archive-table th:last-child,
    .archive-table td:last-child {
      white-space: normal;
      width: 120px;
    }
  </style>
</head>
<body>

<nav>
  <a href="../index.html">Home</a>
  <a href="g1-archive.html">G1 Archive</a>
  <a href="../breeders-cup.html">Breeders’ Cup</a>
</nav>

<div class="g1-hero">
  <img src="../images/g1-hero.jpg" alt="Group 1 Racing">
  <div class="g1-hero-text">
    <h1>Group 1 Racing Archive</h1>
    <p>
      A complete historical archive of worldwide Group 1 racing results,
      searchable by year, race and winner.
    </p>
  </div>
</div>

<!-- FILTERS -->
<div class="filters">
  <div class="filter-group">
    <label for="yearFilter">Year</label>
    <select id="yearFilter">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="raceFilter">Race</label>
    <input id="raceFilter" type="text" list="raceList" placeholder="Type race name">
    <datalist id="raceList"></datalist>
  </div>

  <div class="filter-group">
    <label for="winnerFilter">Winner</label>
    <input id="winnerFilter" type="text" list="winnerList" placeholder="Type horse name">
    <datalist id="winnerList"></datalist>
  </div>
</div>

<!-- TABLE -->
<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Track</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="g1-results.js" defer></script>

</body>
</html>
