<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>G1 Racing Archive | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="racing.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}

/* ── Hero ─────────────────────────────────────────────── */
.g1-hero{
  max-width:1180px;
  margin:0 auto;
  padding:0 20px;
}
.g1-hero .hero-inner{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);
  padding:32px 34px;
  color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-top:26px;
}
.g1-hero .eyebrow{
  display:block;
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.g1-hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(26px,5vw,38px);
  letter-spacing:.01em;
  text-transform:uppercase;
}

/* ── Filters ──────────────────────────────────────────── */
.filters{
  max-width:1180px;
  margin:26px auto 10px;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.filter-group label{
  display:block;
  font-family:var(--display);
  font-weight:600;
  font-size:11px;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
}
.filters select,
.filters input{
  width:100%;
  height:42px;
  padding:8px 16px;
  font-size:13.5px;
  font-family:var(--body);
  font-weight:600;
  border-radius:999px;
  border:1px solid var(--line);
  box-sizing:border-box;
  background:var(--surface);
  color:var(--ink);
}
.filters select:hover,
.filters input:hover{
  border-color:var(--faint);
}
.filters select:focus,
.filters input:focus{
  outline:none;
  border-color:var(--accent);
}
.filters select option{
  background:var(--surface);
  color:var(--ink);
}

#resultCounter{
  max-width:1180px;
  margin:16px auto 20px;
  padding:0 20px;
  text-align:center;
  font-weight:600;
  font-size:13px;
  color:var(--muted);
}

/* ── Table ────────────────────────────────────────────── */
.archive-table{
  max-width:1180px;
  margin:0 auto 80px;
  padding:0 20px;
  overflow-x:auto;
}
.archive-table table{
  width:100%;
  table-layout:fixed;
  border-collapse:collapse;
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--surface);
  font-size:13.5px;
}
.archive-table th,
.archive-table td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  text-align:left;
}
.archive-table th{
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  background:#f7f9fb;
  color:var(--muted);
}
.archive-table td{
  color:#27313c;
}
.archive-table tbody tr:last-child td{
  border-bottom:none;
}
.archive-table tbody tr:hover td{
  background:#f0f6ff;
}
</style>
</head>
<body>
<nav class="home-nav">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="g1-archive.html" class="active">G1 Archive</a>
  <a href="breeders-cup.html">Breeders’ Cup</a>
</nav>
<div class="g1-hero">
  <div class="hero-inner">
    <span class="eyebrow">Racing</span>
    <h1>G1 Racing Archive</h1>
  </div>
</div>
<div class="filters">
  <!-- ROW 1 -->
  <div class="filter-group">
    <label for="yearFilter">Year</label>
    <select id="yearFilter">
      <option value="">All</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="raceFilter">Race</label>
    <input id="raceFilter" type="text" placeholder="Race">
  </div>
  <div class="filter-group">
    <label for="winnerFilter">Winner</label>
    <input id="winnerFilter" type="text" placeholder="Winner">
  </div>
  <!-- ROW 2 -->
  <div class="filter-group">
    <label for="jockeyFilter">Jockey</label>
    <input id="jockeyFilter" type="text" placeholder="Jockey">
  </div>
  <div class="filter-group">
    <label for="trainerFilter">Trainer</label>
    <input id="trainerFilter" type="text" placeholder="Trainer">
  </div>
  <div class="filter-group">
    <label for="countryFilter">Country</label>
    <input id="countryFilter" type="text" placeholder="Country">
  </div>
</div>
<div id="resultCounter">Showing 0 results</div>
<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Track</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody id="g1Body"></tbody>
  </table>
</div>
<script src="g1-results.js" defer></script>
</body>
</html>
