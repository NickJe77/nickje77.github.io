<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group 1 Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="racing.html">Racing</a>
    <a href="g1-archive.html">G1 Archive</a>
  </nav>

  <section class="g1-hero">
    <img src="images/g1-hero.jpg" alt="Group 1 Racing">
    <div class="g1-hero-text">
      <h1>Group 1 Racing Archive</h1>
      <p>
        A complete, year-by-year record of the world’s premier Group 1 Thoroughbred races —
        results, winners, jockeys and trainers.
      </p>
    </div>
  </section>

  <main>

    <!-- FILTER BAR -->
    <section class="filters">

      <!-- Year stays a normal dropdown -->
      <div class="filter-group">
        <label for="yearSelect">Year</label>
        <select id="yearSelect" disabled>
          <option value="all">All</option>
        </select>
      </div>

      <!-- Race becomes an autocomplete dropdown -->
      <div class="filter-group autocomplete">
        <label for="raceInput">Race</label>
        <input id="raceInput" type="text" placeholder="All" autocomplete="off">
        <div id="raceList" class="autocomplete-list" aria-label="Race suggestions"></div>
      </div>

      <!-- Winner becomes an autocomplete dropdown -->
      <div class="filter-group autocomplete">
        <label for="winnerInput">Winner</label>
        <input id="winnerInput" type="text" placeholder="All" autocomplete="off">
        <div id="winnerList" class="autocomplete-list" aria-label="Winner suggestions"></div>
      </div>

    </section>

    <section class="results">
      <table>
        <thead>
          <tr>
            <th>Year</th>
            <th>Race</th>
            <th>Track</th>
            <th>Winner</th>
            <th>Jockey</th>
            <th>Trainer</th>
            <th>Country</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </section>

  </main>

  <script src="g1-results.js"></script>
</body>
</html>
