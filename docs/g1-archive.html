<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>G1 Racing Archive | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="racing.css">

<style>

.g1-hero{
  max-width:1200px;
  margin:36px auto 24px;
  padding:0 24px;
}

.g1-hero img{
  width:100%;
  height:360px;
  object-fit:cover;
  border-radius:18px;
  box-shadow:0 12px 28px rgba(0,0,0,0.18);
}

/* 2 rows, 3 columns each */
.filters{
  max-width:1200px;
  margin:40px auto 10px;
  padding:0 24px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.filter-group label{
  display:block;
  font-weight:600;
  margin-bottom:4px;
  font-size:14px;
}

.filters select,
.filters input{
  width:100%;
  height:42px;
  padding:8px 12px;
  font-size:14px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
  background:#fff;
  color:#111;
  font-weight:600;
}

/* Dropdown text visibility fix */
.filters select option{
  background:#fff;
  color:#111;
}

#resultCounter{
  max-width:1200px;
  margin:18px auto 25px;
  padding:0 24px;
  text-align:center;
  font-weight:800;
  font-size:14px;
  color:#444;
}

.archive-table{
  max-width:1200px;
  margin:0 auto 80px;
  padding:0 24px;
  overflow-x:auto;
}

.archive-table table{
  width:100%;
  table-layout:fixed;
  border-collapse:collapse;
  border:1px solid #cfdff1;
  border-radius:10px;
  overflow:hidden;
  background:#fff;
  font-size:14px;
}

.archive-table th,
.archive-table td{
  padding:8px 10px;
  border-bottom:1px solid #e5e5e5;
  vertical-align:top;
}

.archive-table th{
  font-weight:700;
  background:#f2f6fb;
  text-align:left;
}

.archive-table tbody tr:nth-child(even){
  background:#f4f8ff;
}

</style>
</head>

<body>

<nav class="home-nav">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="g1-archive.html" class="active">G1 Archive</a>
  <a href="breeders-cup.html">Breeders’ Cup</a>
</nav>

<div class="g1-hero">
  <img src="images/g1-hero.jpg" alt="Group 1 Racing Archive">
</div>

<div class="filters">

  <!-- ROW 1 -->
  <div class="filter-group">
    <label for="yearFilter">Year</label>
    <select id="yearFilter">
      <option value="">All</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="raceFilter">Race</label>
    <input id="raceFilter" type="text" placeholder="Race">
  </div>

  <div class="filter-group">
    <label for="winnerFilter">Winner</label>
    <input id="winnerFilter" type="text" placeholder="Winner">
  </div>

  <!-- ROW 2 -->
  <div class="filter-group">
    <label for="jockeyFilter">Jockey</label>
    <input id="jockeyFilter" type="text" placeholder="Jockey">
  </div>

  <div class="filter-group">
    <label>Trainer</label>
    <!-- Trainer is displayed but NOT wired in JS yet -->
    <input type="text" disabled placeholder="Trainer filter (coming)">
  </div>

  <div class="filter-group">
    <label for="countryFilter">Country</label>
    <input id="countryFilter" type="text" placeholder="Country">
  </div>

</div>

<div id="resultCounter">Showing 0 results</div>

<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Track</th>
        <th>Winner</th>
        <th>Trainer</th>
        <th>Jockey</th>
        <th>Country</th>
      </tr>
    </thead>
    <tbody id="g1Body"></tbody>
  </table>
</div>

<script src="g1-results.js" defer></script>

</body>
</html>
