<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>G1 Racing Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="g1-archive.html">G1 Archive</a>
  <a href="breeders-cup.html">Breeders’ Cup</a>
</nav>

<div class="g1-hero">
  <img src="images/g1-hero.jpg" alt="Group 1 Racing">
  <div class="g1-hero-text">
    <h1>Group 1 Racing Archive</h1>
    <p>
      A complete historical archive of worldwide Group 1 racing results,
      searchable by year, race, horse, trainer and jockey.
    </p>
  </div>
</div>

<div class="filters">
  <div class="filter-group">
    <label for="year">Year</label>
    <select id="year"></select>
  </div>

  <div class="filter-group">
    <label for="race">Race</label>
    <select id="race"></select>
  </div>

  <div class="filter-group">
    <label for="horse">Horse</label>
    <input id="horse" type="text" placeholder="Search horse">
  </div>
</div>

<div class="archive-table">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Race</th>
        <th>Track</th>
        <th>Winner</th>
        <th>Country</th>
        <th>Trainer</th>
        <th>Jockey</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="docs/g1-archive.js" defer></script>

</body>
</html>
