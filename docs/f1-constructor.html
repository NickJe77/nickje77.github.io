<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Formula 1 Constructor | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.hero{width:100%;height:220px;position:relative;overflow:hidden;}
.hero img{width:100%;height:100%;object-fit:cover;display:block;}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(12,19,15,.55),rgba(12,19,15,.75));
}
.hero-caption{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;z-index:2;color:#fff;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero-caption h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

.stat-boxes{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:24px;
}
.stat{
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  text-align:center;background:var(--surface);
}
.stat h3{
  margin:0 0 6px;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
}
.stat div{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);}

.year-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px;}
.year-btn{
  padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;font-family:var(--body);font-weight:600;font-size:13.5px;color:var(--ink);
  transition:background .15s,border-color .15s,color .15s;
}
.year-btn:hover{border-color:var(--faint);}
.year-btn.active{background:var(--board);color:#fff;border-color:var(--board);}

h2{
  font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;
  letter-spacing:.02em;color:var(--ink);margin:0 0 12px;
}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:center;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:center;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}

.driver-link{color:var(--ink);text-decoration:none;font-weight:700;}
.driver-link:hover{color:var(--accent);}
.flag{font-size:16px;margin-right:6px;}
</style>
</head>

<body>

<div class="hero">
  <img src="images/f1-header.jpg" alt="Formula 1">
  <div class="hero-caption">
    <span class="eyebrow">Formula 1</span>
    <h1 id="teamName">Constructor</h1>
  </div>
</div>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</div>

<div class="page-wrap">

<div class="stat-boxes">
  <div class="stat"><h3>Races</h3><div id="totalRaces">—</div></div>
  <div class="stat"><h3>Wins</h3><div id="totalWins">—</div></div>
  <div class="stat"><h3>Points</h3><div id="totalPoints">—</div></div>
</div>

<div class="year-grid" id="yearGrid"></div>

<h2>Drivers</h2>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Driver</th>
  <th>Championships</th>
  <th>Wins</th>
  <th>Poles</th>
  <th>Wins from Pole</th>
  <th>Points</th>
</tr>
</thead>
<tbody id="driverTable"></tbody>
</table>
</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const rawTeam = decodeURIComponent(params.get("team") || "");
const team = normalizeConstructor(rawTeam);
document.getElementById("teamName").textContent = team;

const yearGrid = document.getElementById("yearGrid");
const driverTable = document.getElementById("driverTable");

const totalRaces = document.getElementById("totalRaces");
const totalWins = document.getElementById("totalWins");
const totalPoints = document.getElementById("totalPoints");

const startYear = 1950;
const endYear = new Date().getFullYear();

let allData = [];
let currentYear = "all";

/* NATIONALITIES */
const driverNation = {
  "Lewis Hamilton":"British","Sebastian Vettel":"German","Fernando Alonso":"Spanish",
  "Max Verstappen":"Dutch","Michael Schumacher":"German","Ayrton Senna":"Brazilian",
  "Nico Rosberg":"German","Kimi Räikkönen":"Finnish","Jenson Button":"British",
  "Daniel Ricciardo":"Australian","Valtteri Bottas":"Finnish","Felipe Massa":"Brazilian",
  "Charles Leclerc":"Monegasque","Carlos Sainz":"Spanish","Lando Norris":"British",
  "George Russell":"British","Oscar Piastri":"Australian","Sergio Pérez":"Mexican",
  "Nigel Mansell":"British","Alain Prost":"French","Jackie Stewart":"British",
  "Nelson Piquet":"Brazilian","Juan Manuel Fangio":"Argentine","Mika Häkkinen":"Finnish"
};

const flagMap={
  "British":"🇬🇧","German":"🇩🇪","French":"🇫🇷","Italian":"🇮🇹",
  "Spanish":"🇪🇸","Brazilian":"🇧🇷","Australian":"🇦🇺","Dutch":"🇳🇱",
  "Finnish":"🇫🇮","Mexican":"🇲🇽","Monegasque":"🇲🇨","Argentine":"🇦🇷"
};

function cleanDriver(name){
  return String(name||"").replace(/\s[A-Z]{3}$/,"");
}

/* ROBUST CONSTRUCTOR NORMALISER */
function normalizeConstructor(name){
  const n = String(name||"").toLowerCase();

  if(n.includes("red bull")) return "Red Bull";
  if(n.includes("oracle")) return "Red Bull";
  if(n.includes("rbpt")) return "Red Bull";

  if(n.includes("ferrari")) return "Ferrari";
  if(n.includes("mercedes")) return "Mercedes";
  if(n.includes("mclaren")) return "McLaren";
  if(n.includes("williams")) return "Williams";
  if(n.includes("benetton")) return "Benetton";
  if(n.includes("renault")) return "Renault";
  if(n.includes("alpine")) return "Alpine";
  if(n.includes("lotus")) return "Lotus";
  if(n.includes("brabham")) return "Brabham";
  if(n.includes("sauber")) return "Sauber";
  if(n.includes("toro rosso")) return "Toro Rosso";
  if(n.includes("alpha")) return "AlphaTauri";
  if(n.includes("aston")) return "Aston Martin";

  return name;
}

/* YEAR BUTTONS */
const allBtn=document.createElement("button");
allBtn.textContent="All Seasons";
allBtn.className="year-btn active";
allBtn.onclick=()=>selectYear("all");
yearGrid.appendChild(allBtn);

for(let y=startYear;y<=endYear;y++){
  const btn=document.createElement("button");
  btn.textContent=y;
  btn.className="year-btn";
  btn.onclick=()=>selectYear(y);
  btn.id="year-"+y;
  yearGrid.appendChild(btn);
}

function setActiveYear(y){
  document.querySelectorAll(".year-btn").forEach(b=>b.classList.remove("active"));
  if(y==="all") allBtn.classList.add("active");
  else document.getElementById("year-"+y)?.classList.add("active");
}

/* LOAD ALL SEASONS */
async function loadAll(){
  const promises=[];
  for(let y=startYear;y<=endYear;y++){
    promises.push(fetch(`data/f1/${y}.json`).then(r=>r.ok?r.json():null));
  }
  allData=(await Promise.all(promises)).filter(x=>x);
  render();
}

function selectYear(y){
  currentYear=y;
  setActiveYear(y);
  render();
}

/* CHAMPION */
function getSeasonChampion(seasonData){
  const totals={};
  (seasonData.races||[]).forEach(race=>{
    (race.results||[]).forEach(r=>{
      const d=cleanDriver(r.driver);
      totals[d]=(totals[d]||0)+(Number(r.points)||0);
    });
  });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1])[0]?.[0]||"";
}

function getChampionConstructor(seasonData, champion){
  for(const race of seasonData.races){
    for(const r of race.results){
      if(cleanDriver(r.driver)===champion){
        return normalizeConstructor(r.team);
      }
    }
  }
  return "";
}

function render(){
  let seasons=allData;
  if(currentYear!=="all"){
    seasons=allData.filter(d=>String(d.season)===String(currentYear));
  }

  let races=0,wins=0,points=0;
  const drivers={};

  seasons.forEach(data=>{
    const champion = getSeasonChampion(data);
    const champTeam = getChampionConstructor(data, champion);

    if(champTeam===team){
      if(!drivers[champion]){
        drivers[champion]={wins:0,points:0,poles:0,winsFromPole:0,championships:0,nationality:driverNation[champion]||""};
      }
      drivers[champion].championships++;
    }

    (data.races||[]).forEach(race=>{
      (race.results||[]).forEach(r=>{
        const teamName = normalizeConstructor(r.team);
        if(teamName!==team) return;

        const driver=cleanDriver(r.driver);
        const nat=driverNation[driver]||"";

        if(!drivers[driver]){
          drivers[driver]={wins:0,points:0,poles:0,winsFromPole:0,championships:0,nationality:nat};
        }

        races++;
        points+=Number(r.points)||0;
        drivers[driver].points+=Number(r.points)||0;

        if(Number(r.grid)===1) drivers[driver].poles++;

        if(Number(r.position)===1){
          wins++;
          drivers[driver].wins++;
          if(Number(r.grid)===1) drivers[driver].winsFromPole++;
        }
      });
    });
  });

  totalRaces.textContent=races;
  totalWins.textContent=wins;
  totalPoints.textContent=points.toFixed(1);

  driverTable.innerHTML="";
  Object.entries(drivers)
    .sort((a,b)=>b[1].championships - a[1].championships)
    .forEach(([name,s])=>{
      const flag=flagMap[s.nationality]||"";
      const link=`f1-driver.html?driver=${encodeURIComponent(name)}`;

      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td><span class="flag">${flag}</span><a class="driver-link" href="${link}">${name}</a></td>
        <td>${s.championships}</td>
        <td>${s.wins}</td>
        <td>${s.poles}</td>
        <td>${s.winsFromPole}</td>
        <td>${s.points.toFixed(1)}</td>
      `;
      driverTable.appendChild(tr);
    });
}

loadAll();
</script>

</body>
</html>
