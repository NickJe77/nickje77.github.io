<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Player Compare</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:20px;}

.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:30px;
}

select{
padding:12px;
font-size:16px;
width:100%;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

td.label{
text-align:left;
font-weight:700;
background:#fafafa;
}

tbody tr:nth-child(even){
background:#eef4ff;
}

.better{
font-weight:700;
color:#0056d6;
}
</style>
</head>

<body>

<h1>AFL Player Compare</h1>

<div class="controls">
<select id="player1"></select>
<select id="player2"></select>
</div>

<div id="result"></div>

<script>

const player1 = document.getElementById("player1");
const player2 = document.getElementById("player2");
const result = document.getElementById("result");

let allGames = [];
let players = [];

/* 🔥 SAME LOGIC AS YOUR PLAYER PAGE */
const years=[];
for(let y=1990;y<=2026;y++) years.push(y);

Promise.all(
years.map(y=>fetch(`/data/afl/afl_${y}.json`).then(r=>r.json()).catch(()=>[]))
).then(data=>{

allGames = data.flat();

/* build player list */
players = [...new Set(allGames.map(p=>p.player))].sort();

player1.innerHTML = `<option value="">Select Player</option>`;
player2.innerHTML = `<option value="">Select Player</option>`;

players.forEach(p=>{
player1.innerHTML += `<option value="${p}">${p}</option>`;
player2.innerHTML += `<option value="${p}">${p}</option>`;
});

});

/* compare */
player1.onchange = compare;
player2.onchange = compare;

function compare(){

const p1 = player1.value;
const p2 = player2.value;

if(!p1 || !p2) return;

const g1 = allGames.filter(g=>g.player===p1);
const g2 = allGames.filter(g=>g.player===p2);

function stats(g){

const games = g.length;
const d = g.map(x=>+x.D||0);
const goals = g.map(x=>+x.G||0);

return {
games,
bestD: Math.max(...d,0),
bestG: Math.max(...goals,0),
avgD: games ? (d.reduce((a,b)=>a+b,0)/games).toFixed(1) : 0,
avgG: games ? (goals.reduce((a,b)=>a+b,0)/games).toFixed(2) : 0
};

}

const s1 = stats(g1);
const s2 = stats(g2);

const rows = [
["Games", s1.games, s2.games],
["Best Disposals", s1.bestD, s2.bestD],
["Best Goals", s1.bestG, s2.bestG],
["Avg Disposals", s1.avgD, s2.avgD],
["Avg Goals", s1.avgG, s2.avgG]
];

let html = `
<table>
<thead>
<tr>
<th>${p1}</th>
<th></th>
<th>${p2}</th>
</tr>
</thead>
<tbody>
`;

rows.forEach(r=>{

let b1 = r[1] > r[2] ? "better" : "";
let b2 = r[2] > r[1] ? "better" : "";

html += `
<tr>
<td class="${b1}">${r[1]}</td>
<td class="label">${r[0]}</td>
<td class="${b2}">${r[2]}</td>
</tr>
`;

});

html += "</tbody></table>";

result.innerHTML = html;

}

</script>

</body>
</html>
