<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFL Player Compare | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui,Arial,sans-serif;
  margin:0;
  padding:20px;
}

h1{text-align:center;}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

/* selectors */
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin:30px 0;
}

select{
  padding:12px;
  font-size:16px;
  width:100%;
}

/* table */
.compare-table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

.compare-table th,
.compare-table td{
  padding:14px;
  border-bottom:1px solid #ddd;
}

.compare-table th{
  background:#f4f6f8;
}

.compare-table td{
  text-align:center;
}

.compare-table td.label{
  font-weight:700;
  background:#fafafa;
  text-align:left;
}

/* zebra */
.compare-table tr:nth-child(even){
  background:#eef4ff;
}

/* highlight */
.better{
  font-weight:700;
  color:#0056d6;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="afl.html">AFL</a>
</div>

<h1>Player Compare</h1>

<div class="controls">
<select id="player1"></select>
<select id="player2"></select>
</div>

<div id="result"></div>

<script>

const player1 = document.getElementById("player1");
const player2 = document.getElementById("player2");
const result = document.getElementById("result");

let players = {};

/* LOAD PLAYERS (FIXED) */
async function loadPlayers(){

try{

const res = await fetch("data/afl/players.json");
if(!res.ok) throw new Error("No players file");

const data = await res.json();

data.forEach(p=>{

const name =
  p.name ||
  p.player ||
  p.full_name ||
  "";

if(!name) return;

players[name.toLowerCase()] = {
  name: name,
  games: p.games || 0,
  best_disposals: p.best_disposals || p.disposals_high || 0,
  best_goals: p.best_goals || p.goals_high || 0,
  avg_disposals: p.avg_disposals || p.disposals_avg || 0,
  avg_goals: p.avg_goals || p.goals_avg || 0
};

});

const list = Object.values(players).sort((a,b)=>a.name.localeCompare(b.name));

player1.innerHTML = `<option value="">Select Player</option>`;
player2.innerHTML = `<option value="">Select Player</option>`;

list.forEach(p=>{
player1.innerHTML += `<option value="${p.name.toLowerCase()}">${p.name}</option>`;
player2.innerHTML += `<option value="${p.name.toLowerCase()}">${p.name}</option>`;
});

}catch(e){
result.innerHTML = "<p>Failed to load players.</p>";
console.error(e);
}

}

loadPlayers();

player1.onchange = compare;
player2.onchange = compare;

/* COMPARE */
function compare(){

const p1 = players[player1.value];
const p2 = players[player2.value];

if(!p1 || !p2) return;

const stats = [
  {label:"Games", key:"games"},
  {label:"Best Disposals", key:"best_disposals"},
  {label:"Best Goals", key:"best_goals"},
  {label:"Avg Disposals", key:"avg_disposals"},
  {label:"Avg Goals", key:"avg_goals"}
];

let html = `
<table class="compare-table">
<thead>
<tr>
<th>${p1.name}</th>
<th></th>
<th>${p2.name}</th>
</tr>
</thead>
<tbody>
`;

stats.forEach(s=>{

let v1 = p1[s.key] ?? 0;
let v2 = p2[s.key] ?? 0;

let better1 = v1 > v2 ? "better" : "";
let better2 = v2 > v1 ? "better" : "";

html += `
<tr>
<td class="${better1}">${v1}</td>
<td class="label">${s.label}</td>
<td class="${better2}">${v2}</td>
</tr>
`;

});

html += `</tbody></table>`;

result.innerHTML = html;

}

</script>

</body>
</html>
