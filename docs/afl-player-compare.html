<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Player Compare | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --board-line:rgba(255,255,255,.10);
  --accent:#e0b94a;
  --accent-soft:rgba(224,185,74,.18);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

.page{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:26px 26px 30px;text-align:center;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:8px;
}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,38px);letter-spacing:.01em;text-transform:uppercase;color:#fff;}

/* ── Controls ─────────────────────────────────────────── */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
@media(max-width:600px){.controls{grid-template-columns:1fr;}}
input{
  padding:12px 16px;font-family:var(--body);font-size:14px;font-weight:500;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
input:focus{outline:none;border-color:var(--faint);}

/* ── Comparison card ──────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.header{
  display:grid;grid-template-columns:1fr 1fr 1fr;padding:18px;border-bottom:1px solid var(--line);
  text-align:center;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.01em;
  text-transform:uppercase;background:#f7f9fb;
}
.stripe{height:8px;margin-top:10px;border-radius:6px;}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:13px 18px;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row:nth-child(even){background:#f9fafc;}
.label{text-align:center;font-family:var(--display);font-weight:500;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
.val{text-align:center;font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums;}
.win{color:var(--accent);font-weight:700;}
</style>
</head>
<body>
<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html" class="current">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</nav>
<div class="page">

<div class="hero">
  <div class="eyebrow">AFL</div>
  <h1>Player Compare</h1>
</div>

<div class="controls">
<input id="player1" list="playerList" placeholder="Search player...">
<input id="player2" list="playerList" placeholder="Search player...">
<datalist id="playerList"></datalist>
</div>
<div id="result"></div>
</div>
<script>
const teamColours={
"Adelaide":"#002b5c,#e21937,#fdb827","Brisbane":"#7c0a02,#fdb827,#002b5c",
"Carlton":"#031a29,#ffffff","Collingwood":"#000000,#ffffff","Essendon":"#cc2031,#000000",
"Fremantle":"#2a0f5a,#ffffff","Geelong":"#002b5c,#ffffff","Gold Coast":"#c8102e,#fdb827",
"GWS":"#f37021,#333333,#ffffff","Hawthorn":"#4b2c20,#fdb827","Melbourne":"#001a33,#c8102e",
"North Melbourne":"#003a8f,#ffffff","Port Adelaide":"#008aab,#000000,#ffffff",
"Richmond":"#ffd100,#000000","St Kilda":"#ed1b2e,#000000,#ffffff",
"Sydney":"#e1251b,#ffffff","West Coast":"#003087,#f2a900","Western Bulldogs":"#003087,#c8102e,#ffffff"
};

// ---------------------------------------------------------------------
// Normalization / dedup -- ported from afl-player.html so this page's
// totals match the player page's totals instead of being computed from
// raw, un-deduplicated, un-normalized records. This page previously had
// NONE of this: it counted every raw row as a "game" with no protection
// against duplicate records, renamed clubs splitting a career in two,
// or the same person appearing under two different name spellings.
// ---------------------------------------------------------------------
const PLAYER_NAME_ALIASES = {
  "Luke D-Uniacke": "Luke Davies-Uniacke",
  "Cooper D-Tytler": "Cooper Duff-Tytler",
  "Bailey Williams": "Bailey J. Williams",
};
const TEAM_NAME_CANONICAL = {
  'footscray': 'Western Bulldogs',
  'south melbourne': 'Sydney',
  'brisbane bears': 'Brisbane',
  'kangaroos': 'North Melbourne',
};
const ROUND_NAME_CANONICAL = {
  'ef': 'Elimination Final', 'round ef': 'Elimination Final', 'elimination final': 'Elimination Final',
  'sf': 'Semi Final',        'round sf': 'Semi Final',        'semi final': 'Semi Final',
  'qf': 'Qualifying Final',  'round qf': 'Qualifying Final',  'qualifying final': 'Qualifying Final',
  'pf': 'Preliminary Final', 'round pf': 'Preliminary Final', 'preliminary final': 'Preliminary Final',
  'gf': 'Grand Final',       'round gf': 'Grand Final',       'grand final': 'Grand Final',
};
function normalizeDashes(str) {
  return str ? str.replace(/[\u2013\u2014]/g, '-') : str;
}
function normalizeTeam(t) {
  if (!t) return t;
  const dashed = normalizeDashes(t).trim();
  return TEAM_NAME_CANONICAL[dashed.toLowerCase()] || dashed;
}
function normalizeName(str) {
  if (!str) return str;
  str = normalizeDashes(str);
  str = str.replace(/\u2019/g, "'");
  str = str.replace(/\bO([A-Z][a-z])/g, "O'$1");
  return str;
}
function normalizeRound(r) {
  if (!r) return r;
  const key = r.trim().toLowerCase();
  return ROUND_NAME_CANONICAL[key] || r.trim();
}
function normalizeGame(g) {
  if (g.player)         g.player         = normalizeName(g.player);
  if (g.played_for)     g.played_for     = normalizeTeam(g.played_for);
  if (g.played_against) g.played_against = normalizeTeam(g.played_against);
  if (g.home_team)      g.home_team      = normalizeTeam(g.home_team);
  if (g.away_team)      g.away_team      = normalizeTeam(g.away_team);
  if (g.round)           g.round          = normalizeRound(g.round);
  if (g.player === 'Gary Ablett' && g.season >= 2000) g.player = 'Gary Ablett Jnr';
  if (g.player && PLAYER_NAME_ALIASES[g.player]) g.player = PLAYER_NAME_ALIASES[g.player];
  return g;
}
// Same dedup logic as afl-player.html: matches on season+round+teams+score
// (score included so drawn-Grand-Final-then-replay pairs, which share a
// season/round/teams, aren't wrongly collapsed into one), and separately
// drops a blank-round row when a properly-labeled sibling of the same
// match exists (an orphaned duplicate, not a second game).
function dedupeGames(games) {
  const scoreKeyOf = g => {
    const hs = g.home_points != null ? g.home_points : g.home_score;
    const as = g.away_points != null ? g.away_points : g.away_score;
    return g.season + '__' + g.played_for + '__' + g.played_against + '__' + hs + '__' + as;
  };
  const hasLabeledRound = new Set();
  games.forEach(g => { if (g.round) hasLabeledRound.add(scoreKeyOf(g)); });

  const seen = new Set();
  const out = [];
  games.forEach(g => {
    if (!g.round && hasLabeledRound.has(scoreKeyOf(g))) return;
    const hs = g.home_points != null ? g.home_points : g.home_score;
    const as = g.away_points != null ? g.away_points : g.away_score;
    const key = g.season + '__' + g.round + '__' + g.played_for + '__' + g.played_against + '__' + hs + '__' + as;
    if (seen.has(key)) return;
    seen.add(key);
    out.push(g);
  });
  return out;
}

const input1=document.getElementById("player1");
const input2=document.getElementById("player2");
const list=document.getElementById("playerList");
const result=document.getElementById("result");
let allGames=[];

const years=[];
for(let y=1965;y<=new Date().getFullYear();y++) years.push(y);

Promise.all(
  years.map(y=>fetch(`/data/afl/afl_${y}.json`).then(r=>r.json()).catch(()=>[]))
).then(data=>{
  allGames=data.flat().map(normalizeGame);
  const players=[...new Set(allGames.map(p=>p.player))].sort();
  players.forEach(p=>{const o=document.createElement("option");o.value=p;list.appendChild(o);});
});

input1.onchange=compare;
input2.onchange=compare;

function getTeam(games){
  let latest=games[0];
  games.forEach(g=>{if(g.season>latest.season) latest=g;});
  return latest.played_for;
}

function stripe(team){
  if(!teamColours[team]) return "";
  const colours=teamColours[team].split(",");
  let gradient="linear-gradient(90deg,";
  const steps=colours.length;
  colours.forEach((c,i)=>{
    const start=(i/steps)*100, end=((i+1)/steps)*100;
    gradient+=`${c} ${start}%, ${c} ${end}%,`;
  });
  return `<div class="stripe" style="background:${gradient.slice(0,-1)});"></div>`;
}

function stats(g){
  const games=g.length;
  const d=g.map(x=>+x.D||0), goals=g.map(x=>+x.G||0);
  const kicks=g.map(x=>+x.K||0), handballs=g.map(x=>+x.HB||0), marks=g.map(x=>+x.M||0);
  const br=g.map(x=>+x.BR||0);
  return{
    games,
    bestD:Math.max(...d,0), bestG:Math.max(...goals,0),
    bestK:Math.max(...kicks,0), bestH:Math.max(...handballs,0), bestM:Math.max(...marks,0),
    avgD:games?(d.reduce((a,b)=>a+b,0)/games).toFixed(1):0,
    avgG:games?(goals.reduce((a,b)=>a+b,0)/games).toFixed(2):0,
    brTotal:br.reduce((a,b)=>a+b,0),
    avgBR:games?(br.reduce((a,b)=>a+b,0)/games).toFixed(2):0
  };
}

function headToHead(p1,p2){
  const g1=dedupeGames(allGames.filter(g=>g.player===p1&&g.played_against===p2));
  const g2=dedupeGames(allGames.filter(g=>g.player===p2&&g.played_against===p1));
  if(!g1.length||!g2.length) return null;
  return{
    games:g1.length,
    avgD1:(g1.reduce((a,x)=>a+(+x.D||0),0)/g1.length).toFixed(1),
    avgD2:(g2.reduce((a,x)=>a+(+x.D||0),0)/g2.length).toFixed(1),
    avgG1:(g1.reduce((a,x)=>a+(+x.G||0),0)/g1.length).toFixed(2),
    avgG2:(g2.reduce((a,x)=>a+(+x.G||0),0)/g2.length).toFixed(2)
  };
}

function compare(){
  const p1=normalizeName(input1.value), p2=normalizeName(input2.value);
  if(!p1||!p2) return;
  const g1=dedupeGames(allGames.filter(g=>g.player===p1));
  const g2=dedupeGames(allGames.filter(g=>g.player===p2));
  if(!g1.length||!g2.length){result.innerHTML="<p>Player not found</p>";return;}
  const s1=stats(g1), s2=stats(g2);
  const team1=getTeam(g1), team2=getTeam(g2);
  const h2h=headToHead(p1,p2);

  const rows=[
    ["Games",s1.games,s2.games],
    ["Best Disposals",s1.bestD,s2.bestD],
    ["Best Goals",s1.bestG,s2.bestG],
    ["Most Kicks",s1.bestK,s2.bestK],
    ["Most Handballs",s1.bestH,s2.bestH],
    ["Most Marks",s1.bestM,s2.bestM],
    ["Avg Disposals",s1.avgD,s2.avgD],
    ["Avg Goals",s1.avgG,s2.avgG],
    ["Brownlow Votes",s1.brTotal,s2.brTotal],
    ["Avg Brownlow",s1.avgBR,s2.avgBR]
  ];

  let html=`<div class="card">
    <div class="header">
      <div>${p1}${stripe(team1)}</div>
      <div></div>
      <div>${p2}${stripe(team2)}</div>
    </div>`;

  rows.forEach(r=>{
    const w1=r[1]>r[2]?"win":"", w2=r[2]>r[1]?"win":"";
    html+=`<div class="row">
      <div class="val ${w1}">${r[1]}</div>
      <div class="label">${r[0]}</div>
      <div class="val ${w2}">${r[2]}</div>
    </div>`;
  });

  if(h2h){
    html+=`<div class="row"><div></div><div class="label">Head to Head (${h2h.games} games)</div><div></div></div>
    <div class="row"><div>${h2h.avgD1}</div><div class="label">Avg Disposals</div><div>${h2h.avgD2}</div></div>
    <div class="row"><div>${h2h.avgG1}</div><div class="label">Avg Goals</div><div>${h2h.avgG2}</div></div>`;
  }

  html+="</div>";
  result.innerHTML=html;
}
</script>
</body>
</html>
