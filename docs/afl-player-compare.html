<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>AFL Player Compare | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <style>
    body{
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin:0;
      padding:0;
    }

    .navbar{
      display:flex;
      justify-content:center;
      gap:22px;
      padding:16px 0;
      border-bottom:1px solid #ddd;
      font-weight:600;
    }

    .navbar a{
      text-decoration:none;
      color:#0056d6;
      font-size:18px;
    }

    .navbar a:hover{
      text-decoration:underline;
    }

    .page-wrap{
      max-width:1200px;
      margin:0 auto;
      padding:30px 20px 60px;
    }

    h1{
      text-align:center;
      margin:0 0 10px;
    }

    .intro{
      text-align:center;
      max-width:900px;
      margin:0 auto 30px;
      color:#444;
      line-height:1.5;
    }

    .controls{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-bottom:30px;
    }

    .control-box{
      border:1px solid #ddd;
      border-radius:10px;
      padding:18px;
      background:#fff;
    }

    .control-box label{
      display:block;
      font-weight:700;
      margin-bottom:8px;
    }

    .control-box select{
      width:100%;
      padding:12px;
      font-size:16px;
      border:1px solid #ccc;
      border-radius:8px;
      background:#fff;
    }

    .status{
      text-align:center;
      padding:16px;
      border:1px solid #ddd;
      border-radius:10px;
      background:#fafafa;
      color:#444;
      margin-bottom:20px;
    }

    .compare-table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
    }

    .compare-table th,
    .compare-table td{
      border-bottom:1px solid #ddd;
      padding:14px 12px;
    }

    .compare-table th{
      background:#f4f6f8;
      font-weight:700;
      text-align:center;
    }

    .compare-table td{
      text-align:center;
    }

    .compare-table td.category{
      text-align:left;
      font-weight:700;
      background:#fafafa;
      width:28%;
    }

    .compare-table tbody tr:nth-child(even){
      background:#eef4ff;
    }

    .better{
      font-weight:700;
      color:#0056d6;
    }

    .player-head{
      font-size:20px;
    }

    @media (max-width:700px){
      .controls{
        grid-template-columns:1fr;
      }

      .compare-table th,
      .compare-table td{
        padding:10px 8px;
        font-size:14px;
      }

      .player-head{
        font-size:16px;
      }
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="afl.html">AFL</a>
</div>

<div class="page-wrap">
  <h1>AFL Player Compare</h1>
  <p class="intro">
    Compare two AFL players side by side across key career statistics.
  </p>

  <div class="controls">
    <div class="control-box">
      <label for="player1">Player 1</label>
      <select id="player1">
        <option value="">Loading players...</option>
      </select>
    </div>

    <div class="control-box">
      <label for="player2">Player 2</label>
      <select id="player2">
        <option value="">Loading players...</option>
      </select>
    </div>
  </div>

  <div id="status" class="status">Loading players...</div>
  <div id="result"></div>
</div>

<script>
  const player1Select = document.getElementById("player1");
  const player2Select = document.getElementById("player2");
  const statusBox = document.getElementById("status");
  const resultBox = document.getElementById("result");

  const players = {};

  function toNumber(v){
    if(v === null || v === undefined || v === "") return 0;
    const n = Number(String(v).replace(/[^0-9.\-]/g, ""));
    return Number.isFinite(n) ? n : 0;
  }

  function fmt(v){
    return Number.isInteger(v) ? String(v) : v.toFixed(1);
  }

  async function fetchPlayersData(){
    const paths = [
      "/data/afl/players.json",
      "data/afl/players.json",
      "./data/afl/players.json"
    ];

    for(const path of paths){
      try{
        const res = await fetch(path);
        if(res.ok){
          return await res.json();
        }
      }catch(err){}
    }

    return null;
  }

  function normalisePlayer(raw){
    const name =
      raw.name ||
      raw.player ||
      raw.full_name ||
      raw.player_name ||
      "";

    if(!name) return null;

    return {
      name: name,
      games: toNumber(raw.games),
      best_disposals: toNumber(raw.best_disposals ?? raw.disposals_high ?? raw.high_disposals ?? raw.most_disposals),
      best_goals: toNumber(raw.best_goals ?? raw.goals_high ?? raw.high_goals ?? raw.most_goals),
      avg_disposals: toNumber(raw.avg_disposals ?? raw.disposals_avg ?? raw.average_disposals),
      avg_goals: toNumber(raw.avg_goals ?? raw.goals_avg ?? raw.average_goals)
    };
  }

  function populateDropdowns(list){
    player1Select.innerHTML = `<option value="">Select Player</option>`;
    player2Select.innerHTML = `<option value="">Select Player</option>`;

    list.forEach(p => {
      const option1 = document.createElement("option");
      option1.value = p.name.toLowerCase();
      option1.textContent = p.name;
      player1Select.appendChild(option1);

      const option2 = document.createElement("option");
      option2.value = p.name.toLowerCase();
      option2.textContent = p.name;
      player2Select.appendChild(option2);
    });
  }

  function betterClass(a, b){
    if(a > b) return ["better", ""];
    if(b > a) return ["", "better"];
    return ["", ""];
  }

  function comparePlayers(){
    const p1 = players[player1Select.value];
    const p2 = players[player2Select.value];

    if(!p1 || !p2){
      resultBox.innerHTML = "";
      statusBox.textContent = "Select two players to compare.";
      return;
    }

    statusBox.textContent = `${p1.name} vs ${p2.name}`;

    const rows = [
      { label: "Games", a: p1.games, b: p2.games },
      { label: "Best Disposals", a: p1.best_disposals, b: p2.best_disposals },
      { label: "Best Goals", a: p1.best_goals, b: p2.best_goals },
      { label: "Avg Disposals", a: p1.avg_disposals, b: p2.avg_disposals },
      { label: "Avg Goals", a: p1.avg_goals, b: p2.avg_goals }
    ];

    let html = `
      <table class="compare-table">
        <thead>
          <tr>
            <th class="player-head">${p1.name}</th>
            <th>Category</th>
            <th class="player-head">${p2.name}</th>
          </tr>
        </thead>
        <tbody>
    `;

    rows.forEach(row => {
      const [classA, classB] = betterClass(row.a, row.b);

      html += `
        <tr>
          <td class="${classA}">${fmt(row.a)}</td>
          <td class="category">${row.label}</td>
          <td class="${classB}">${fmt(row.b)}</td>
        </tr>
      `;
    });

    html += `
        </tbody>
      </table>
    `;

    resultBox.innerHTML = html;
  }

  async function init(){
    statusBox.textContent = "Loading players...";

    const data = await fetchPlayersData();

    if(!Array.isArray(data)){
      player1Select.innerHTML = `<option value="">No players found</option>`;
      player2Select.innerHTML = `<option value="">No players found</option>`;
      statusBox.textContent = "Failed to load players.";
      return;
    }

    data.forEach(raw => {
      const p = normalisePlayer(raw);
      if(!p) return;
      players[p.name.toLowerCase()] = p;
    });

    const list = Object.values(players).sort((a, b) => a.name.localeCompare(b.name));

    if(!list.length){
      player1Select.innerHTML = `<option value="">No players found</option>`;
      player2Select.innerHTML = `<option value="">No players found</option>`;
      statusBox.textContent = "Failed to load players.";
      return;
    }

    populateDropdowns(list);
    statusBox.textContent = "Select two players to compare.";
  }

  player1Select.addEventListener("change", comparePlayers);
  player2Select.addEventListener("change", comparePlayers);

  init();
</script>

</body>
</html>
