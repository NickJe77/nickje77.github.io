<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:900px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:28px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero p{margin:8px 0 0;color:rgba(255,255,255,.68);font-size:13.5px;}

.table-wrap{
  background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
}
table{width:100%;border-collapse:collapse;}
tbody tr{position:relative;border-bottom:1px solid var(--line);}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#f9fbfd;}

.team-cell{position:relative;padding:16px 0 16px 28px;}
.team-link{
  text-decoration:none;font-family:var(--body);font-size:15.5px;font-weight:700;
  color:var(--ink);display:block;transition:color .15s ease;
}
.team-link:hover{color:var(--accent);}

.team-stripe{position:absolute;left:0;top:0;bottom:0;width:10px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
<a href="nba-season.html">Seasons</a>
</div>

<div class="page-wrap">

<div class="hero">
  <span class="eyebrow">NBA</span>
  <h1>NBA Teams</h1>
  <p>All NBA franchises.</p>
</div>

<div class="table-wrap">

<table>
<tbody id="teamTable"></tbody>
</table>

</div>

</div>

<script>

const teams = [
{ name:"Atlanta Hawks", colors:["#E03A3E","#C1D32F","#26282A"] },
{ name:"Boston Celtics", colors:["#007A33","#BA9653","#000000"] },
{ name:"Brooklyn Nets", colors:["#000000","#FFFFFF"] },
{ name:"Charlotte Hornets", colors:["#1D1160","#00788C","#A1A1A4"] },
{ name:"Chicago Bulls", colors:["#CE1141","#000000"] },
{ name:"Cleveland Cavaliers", colors:["#860038","#FDBB30","#041E42"] },
{ name:"Dallas Mavericks", colors:["#00538C","#002B5E","#B8C4CA"] },
{ name:"Denver Nuggets", colors:["#0E2240","#FEC524","#8B2131"] },
{ name:"Detroit Pistons", colors:["#C8102E","#1D42BA"] },
{ name:"Golden State Warriors", colors:["#1D428A","#FFC72C"] },
{ name:"Houston Rockets", colors:["#CE1141","#000000"] },
{ name:"Indiana Pacers", colors:["#002D62","#FDBB30"] },
{ name:"LA Clippers", colors:["#C8102E","#1D428A","#BEC0C2"] },
{ name:"Los Angeles Lakers", colors:["#552583","#FDB927","#000000"] },
{ name:"Memphis Grizzlies", colors:["#5D76A9","#12173F","#F5B112"] },
{ name:"Miami Heat", colors:["#98002E","#F9A01B","#000000"] },
{ name:"Milwaukee Bucks", colors:["#00471B","#EEE1C6","#0077C0"] },
{ name:"Minnesota Timberwolves", colors:["#0C2340","#236192","#9EA2A2"] },
{ name:"New Orleans Pelicans", colors:["#0C2340","#C8102E","#85714D"] },
{ name:"New York Knicks", colors:["#F58426","#006BB6"] },
{ name:"Oklahoma City Thunder", colors:["#007AC1","#EF3B24","#002D62"] },
{ name:"Orlando Magic", colors:["#0077C0","#C4CED4","#000000"] },
{ name:"Philadelphia 76ers", colors:["#006BB6","#ED174C","#002B5C"] },
{ name:"Phoenix Suns", colors:["#1D1160","#E56020","#000000"] },
{ name:"Portland Trail Blazers", colors:["#E03A3E","#000000"] },
{ name:"Sacramento Kings", colors:["#5A2D81","#63727A","#000000"] },
{ name:"San Antonio Spurs", colors:["#C4CED4","#000000"] },
{ name:"Toronto Raptors", colors:["#CE1141","#000000","#A1A1A4"] },
{ name:"Utah Jazz", colors:["#002B5C","#00471B","#F9A01B"] },
{ name:"Washington Wizards", colors:["#002B5C","#E31837","#C4CED4"] }
];

const tableBody = document.getElementById("teamTable");

teams.sort((a,b)=>a.name.localeCompare(b.name));

teams.forEach(team=>{

const tr = document.createElement("tr");

const gradient = `linear-gradient(180deg, ${team.colors.join(",")})`;

tr.innerHTML = `
<td class="team-cell">
<span class="team-stripe" style="background:${gradient}"></span>
<a class="team-link" href="nba-team.html?team=${encodeURIComponent(team.name)}">
${team.name}
</a>
</td>
`;

tableBody.appendChild(tr);

});

</script>

</body>
</html>
