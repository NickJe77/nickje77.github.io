<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:30px;}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}

.team-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
.team-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<h1>NBA Teams</h1>
<p>Franchise list from your NBA season data.</p>

<table>
  <thead>
    <tr>
      <th>Team</th>
    </tr>
  </thead>
  <tbody id="teamTable"></tbody>
</table>

</div>

<script>
const tableBody = document.getElementById("teamTable");

function seasonToFile(season){
  return "docs/data/nba/nba_season_" + season.replace("-","_") + ".json";
}

async function loadTeams(){
  const res = await fetch("docs/data/nba/seasons.json");
  if(!res.ok){
    tableBody.innerHTML = "<tr><td>Could not load seasons.json</td></tr>";
    return;
  }

  const seasons = await res.json();

  const files = await Promise.all(
    seasons.map(s => fetch(seasonToFile(s)))
  );

  const jsons = await Promise.all(
    files.filter(r => r.ok).map(r => r.json())
  );

  const teams = new Set();

  jsons.forEach(seasonData=>{
    seasonData.games.forEach(game=>{
      teams.add(game.home_team);
      teams.add(game.away_team);
    });
  });

  const sortedTeams = [...teams].sort();

  sortedTeams.forEach(team=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        <a class="team-link" href="nba-team.html?team=${encodeURIComponent(team)}">
          ${team}
        </a>
      </td>
    `;
    tableBody.appendChild(tr);
  });
}

loadTeams();
</script>

</body>
</html>
