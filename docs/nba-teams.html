<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}
.navbar a:hover{text-decoration:underline;}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:30px;}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}

.team-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
.team-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-seasons.html">Seasons</a>
</div>

<div class="page-wrap">
<h1>NBA Teams</h1>
<p>Franchise list from your NBA season data.</p>

<table>
<thead>
<tr>
  <th>Team</th>
</tr>
</thead>
<tbody id="teamTable">
<tr><td>Loading teams…</td></tr>
</tbody>
</table>
</div>

<script>
const tableBody = document.getElementById("teamTable");

async function loadTeams(){
  try{
    const seasonsRes = await fetch("docs/data/nba/seasons.json");
    if(!seasonsRes.ok) throw new Error("seasons.json not found");

    const seasons = await seasonsRes.json();
    const teamSet = new Set();

    for(const season of seasons){
      const seasonFile = "docs/data/nba/nba_season_" + season.replace("-","_") + ".json";

      const res = await fetch(seasonFile);
      if(!res.ok) continue;

      const data = await res.json();

      data.games.forEach(game=>{
        teamSet.add(game.home_team);
        teamSet.add(game.away_team);
      });
    }

    const teams = Array.from(teamSet).sort();

    tableBody.innerHTML = "";

    if(!teams.length){
      tableBody.innerHTML = "<tr><td>No teams found.</td></tr>";
      return;
    }

    teams.forEach(team=>{
      const urlTeam = encodeURIComponent(team);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <a class="team-link" href="nba-team.html?team=${urlTeam}">
            ${team}
          </a>
        </td>
      `;
      tableBody.appendChild(tr);
    });

  }catch(err){
    console.error(err);
    tableBody.innerHTML = "<tr><td>Could not load seasons.json</td></tr>";
  }
}

loadTeams();
</script>

</body>
</html>
