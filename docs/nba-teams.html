<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#fff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:10px;}
p{text-align:center;color:#555;margin-bottom:30px;}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}
th{
  background:#f0f0f0;
  cursor:pointer;
}
tr:nth-child(even){background:#f6f9ff;}

.team-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
.team-link:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<h1>NBA Teams</h1>
<p>Franchise records from the modern NBA era (1976–77 to present).</p>

<table>
  <thead>
    <tr>
      <th data-key="team">Team</th>
      <th data-key="founded">Founded</th>
      <th data-key="titles">Championships</th>
      <th data-key="finals">Finals Appearances</th>
    </tr>
  </thead>
  <tbody id="teamTable"></tbody>
</table>

</div>

<script>
const tableBody = document.getElementById("teamTable");

let teams = [];
let currentSort = { key: null, dir: "asc" };

function render(){
  tableBody.innerHTML = "";

  teams.forEach(team => {
    if(team.active === false) return;

    const urlTeam = encodeURIComponent(team.team);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        <a class="team-link" href="nba-team.html?team=${urlTeam}">
          ${team.team}
        </a>
      </td>
      <td>${team.founded || ""}</td>
      <td>${team.titles ?? ""}</td>
      <td>${team.finals ?? ""}</td>
    `;
    tableBody.appendChild(tr);
  });
}

fetch("data/nba/teams.json")
  .then(r => r.json())
  .then(data => {
    teams = data.filter(t => t.active !== false);
    render();
  })
  .catch(() => {
    tableBody.innerHTML = "<tr><td colspan='4'>No data available.</td></tr>";
  });

document.querySelectorAll("th[data-key]").forEach(th=>{
  th.addEventListener("click", ()=>{
    const key = th.dataset.key;

    currentSort.dir =
      (currentSort.key === key && currentSort.dir === "asc") ? "desc" : "asc";
    currentSort.key = key;

    teams.sort((a,b)=>{
      const av = a[key] ?? "";
      const bv = b[key] ?? "";

      if(typeof av === "number" && typeof bv === "number"){
        return currentSort.dir==="asc" ? av-bv : bv-av;
      }

      return currentSort.dir==="asc"
        ? String(av).localeCompare(String(bv))
        : String(bv).localeCompare(String(av));
    });

    render();
  });
});
</script>

</body>
</html>
