<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NBA Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#0056d6;
  --blue2:#003a99;
  --line:#ddd;
  --muted:#6b7280;
  --bg:#ffffff;
  --row:#f6f9ff;
  --head:#eef3ff;
}

body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:var(--bg);
  color:#111;
}

/* NAV BAR */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid var(--line);
  font-weight:600;
}
.navbar a{
  color:var(--blue);
  text-decoration:none;
  font-size:18px;
}
.navbar a:hover{text-decoration:underline;}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:28px 20px 60px;
}

h1{
  text-align:center;
  margin:6px 0 6px;
  font-size:44px;
  letter-spacing:-0.5px;
}
.sub{
  text-align:center;
  color:var(--muted);
  margin:0 0 22px;
  font-size:18px;
}

.controls{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  margin:14px 0 14px;
}

.search{
  flex:1 1 260px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#f7f9ff;
  border:2px solid var(--head);
  border-radius:12px;
  padding:10px 12px;
}
.search input{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  font-size:15px;
}
.pill{
  flex:0 0 auto;
  background:var(--head);
  color:var(--blue2);
  border:1px solid #d7e3ff;
  padding:8px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:13px;
}

.table-wrap{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}
thead th{
  background:var(--head);
  padding:12px 14px;
  text-align:left;
  position:sticky;
  top:0;
  z-index:2;
  border-bottom:1px solid #d7e3ff;
}
tbody td{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
}
tbody tr:nth-child(even){background:var(--row);}

.team-link{
  color:var(--blue);
  text-decoration:none;
  font-weight:700;
}
.team-link:hover{text-decoration:underline;}

.note{
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.bad{
  background:#ffe1e1;
  color:#900;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #ffc7c7;
  text-align:center;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
  <a href="nba-seasons.html">Seasons</a>
</div>

<div class="page-wrap">
  <h1>NBA Teams</h1>
  <div class="sub">Franchise list from your NBA season data (1976–77 onward).</div>

  <div class="controls">
    <div class="search">
      <span style="color:var(--muted);font-weight:700;">Search</span>
      <input id="searchBox" type="text" placeholder="Type a team name… (e.g. Bulls)" />
    </div>
    <div class="pill" id="countPill">Loading…</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Team</th></tr>
      </thead>
      <tbody id="teamTable">
        <tr><td>Loading teams…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="note">Click a team to open its team page.</div>
</div>

<script>
const tableBody = document.getElementById("teamTable");
const countPill = document.getElementById("countPill");
const searchBox = document.getElementById("searchBox");

let allTeams = [];

function renderTeams(list){
  tableBody.innerHTML = "";

  if(!list.length){
    tableBody.innerHTML = `<tr><td class="bad">No matching teams.</td></tr>`;
    countPill.textContent = "0 teams";
    return;
  }

  list.forEach(team=>{
    const urlTeam = encodeURIComponent(team);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        <a class="team-link" href="nba-team.html?team=${urlTeam}">${team}</a>
      </td>
    `;
    tableBody.appendChild(tr);
  });

  countPill.textContent = `${list.length} team${list.length===1?"":"s"}`;
}

async function loadTeams(){
  try{
    const seasonsRes = await fetch("data/nba/seasons.json", {cache:"no-store"});
    if(!seasonsRes.ok) throw new Error("seasons.json not found");

    const seasons = await seasonsRes.json();
    const teamSet = new Set();

    for(const season of seasons){
      const seasonFile = "data/nba/nba_season_" + season.replace("-","_") + ".json";
      const res = await fetch(seasonFile, {cache:"no-store"});
      if(!res.ok) continue;

      const data = await res.json();
      if(!data || !Array.isArray(data.games)) continue;

      data.games.forEach(g=>{
        if(g && g.home_team) teamSet.add(g.home_team);
        if(g && g.away_team) teamSet.add(g.away_team);
      });
    }

    allTeams = Array.from(teamSet).filter(Boolean).sort((a,b)=>a.localeCompare(b));
    renderTeams(allTeams);

  }catch(err){
    console.error(err);
    tableBody.innerHTML = `<tr><td class="bad">Could not load seasons.json</td></tr>`;
    countPill.textContent = "Error";
  }
}

searchBox.addEventListener("input", ()=>{
  const q = searchBox.value.trim().toLowerCase();
  if(!q){ renderTeams(allTeams); return; }
  renderTeams(allTeams.filter(t => t.toLowerCase().includes(q)));
});

loadTeams();
</script>

</body>
</html>
