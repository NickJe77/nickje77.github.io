<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NRL Premiers | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 60px;
}

.hero{
  background:linear-gradient(90deg,#00643C,#003B1F);
  color:white;
  padding:35px;
  border-radius:20px;
  margin-bottom:30px;
}

.hero h1{
  margin:0;
  font-size:40px;
}

.hero p{
  margin:8px 0 0 0;
  opacity:0.9;
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

th, td{
  padding:14px;
  border-bottom:1px solid var(--line);
  font-size:15px;
}

th{
  background:#eef1f6;
  font-weight:700;
  cursor:pointer;
  text-align:left;
}

tbody tr:nth-child(even){
  background:#f5f8ff;
}

tbody tr:hover{
  background:#e8f0ff;
}

.team-link{
  text-decoration:none;
  color:#0056d6;
  font-weight:600;
}

.team-link:hover{
  text-decoration:underline;
}

.loading{
  padding:40px;
  text-align:center;
}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">

<div class="hero">
  <h1>NRL Premiers</h1>
  <p>Premiers, Runners-Up and Minor Premiers by Season</p>
</div>

<table>
<thead>
<tr>
<th onclick="sortTable('season')">Season</th>
<th onclick="sortTable('premier')">Premiers</th>
<th onclick="sortTable('runner')">Runners-Up</th>
<th onclick="sortTable('minor')">Minor Premiers</th>
</tr>
</thead>
<tbody id="premiersTable">
<tr><td colspan="4" class="loading">Loading...</td></tr>
</tbody>
</table>

</div>

<script>

let dataRows = [];
let currentSort = null;
let sortAsc = false;

fetch("data/nrl/Premiers.csv")
.then(res => res.text())
.then(text => {

  const rows = text.trim().split("\n");
  const headers = rows[0].split(",");

  for(let i=1;i<rows.length;i++){
    const cols = rows[i].split(",");

    dataRows.push({
      season: cols[0],
      premier: cols[1],
      runner: cols[2],
      minor: cols[3]
    });
  }

  renderTable();
});

function renderTable(){

  const tbody = document.getElementById("premiersTable");

  tbody.innerHTML = dataRows.map(row=>`
    <tr>
      <td>${row.season}</td>
      <td><a class="team-link" href="nrl-team.html?team=${encodeURIComponent(row.premier)}">${row.premier}</a></td>
      <td><a class="team-link" href="nrl-team.html?team=${encodeURIComponent(row.runner)}">${row.runner}</a></td>
      <td><a class="team-link" href="nrl-team.html?team=${encodeURIComponent(row.minor)}">${row.minor}</a></td>
    </tr>
  `).join("");
}

function sortTable(key){

  sortAsc = currentSort === key ? !sortAsc : false;
  currentSort = key;

  dataRows.sort((a,b)=>{
    if(a[key] < b[key]) return sortAsc ? -1 : 1;
    if(a[key] > b[key]) return sortAsc ? 1 : -1;
    return 0;
  });

  renderTable();
}

</script>

</body>
</html>
