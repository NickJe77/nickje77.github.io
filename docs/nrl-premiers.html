<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Winners & Awards | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c1118;
  --board-2:#141c26;
  --board-line:rgba(255,255,255,.10);
  --win:#ffffff;
  --lose:rgba(255,255,255,.42);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

.page{max-width:900px;margin:0 auto;padding:26px 20px 70px;}

h1{
  font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,38px);
  letter-spacing:.01em;text-transform:uppercase;text-align:center;margin:6px 0 24px;
}

.season-select{
  display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:26px;
  font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;
}

select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink);
  cursor:pointer;
}
select:hover{border-color:var(--faint);}

.section{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-top:20px;
}

.section-title{
  padding:15px 18px;border-bottom:1px solid var(--line);
  font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);background:#f7f9fb;
}

.row{
  display:grid;grid-template-columns:1fr 1fr;padding:15px 18px;border-bottom:1px solid var(--line);
  align-items:center;
}
.row:last-child{border-bottom:none;}

.row div:first-child{
  font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.02em;color:var(--muted);
  text-transform:uppercase;
}

.row div:last-child{
  font-size:14.5px;color:var(--ink);
}

.link{
  text-decoration:none;color:var(--ink);font-weight:600;
}
.link:hover{color:#0056d6;text-decoration:underline;}

.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">

<h1>NRL Winners & Awards</h1>

<div class="season-select">
  Season
  <select id="seasonSelect"></select>
</div>

<div class="section">
  <div class="section-title">Team Honours</div>
  <div id="teamHonours"></div>
</div>

<div class="section">
  <div class="section-title">Individual Awards</div>
  <div id="individualAwards"></div>
</div>

</div>

<script>

let premiersData = [];
let cliveData = [];
let dallyData = [];

const seasonSelect = document.getElementById("seasonSelect");
const teamHonours = document.getElementById("teamHonours");
const individualAwards = document.getElementById("individualAwards");

Promise.all([
  fetch("data/nrl/Premiers.csv").then(r=>r.text()),
  fetch("data/nrl/Clive Churchill.csv").then(r=>r.text()),
  fetch("data/nrl/Dally M.csv").then(r=>r.text())
])
.then(([premiersCSV, cliveCSV, dallyCSV])=>{

  premiersData = parseCSV(premiersCSV);
  cliveData = parseCSV(cliveCSV);
  dallyData = parseCSV(dallyCSV);

  const seasons = premiersData
    .map(r=>r.year)
    .sort((a,b)=>b-a);

  seasonSelect.innerHTML = seasons
    .map(s=>`<option value="${s}">${s}</option>`)
    .join("");

  seasonSelect.value = seasons[0];
  seasonSelect.onchange = renderSeason;

  renderSeason();
});

function parseCSV(text){
  const rows = text.trim().split("\n");
  const headers = rows[0].split(",");

  return rows.slice(1).map(r=>{
    const cols = r.split(",");
    let obj = {};
    headers.forEach((h,i)=>{
      obj[h.trim().toLowerCase()] = cols[i]?.trim();
    });
    return obj;
  });
}

function renderSeason(){

  const season = seasonSelect.value;

  const p = premiersData.find(r=>r.year === season);
  const c = cliveData.find(r=>r.year === season);
  const d = dallyData.find(r=>r.year === season);

  teamHonours.innerHTML = `
    <div class="row">
      <div>Premiers</div>
      <div><a class="link" href="nrl-team.html?team=${encodeURIComponent(p.premier)}">${p.premier}</a></div>
    </div>
    <div class="row">
      <div>Runner-up</div>
      <div><a class="link" href="nrl-team.html?team=${encodeURIComponent(p["runners up"])}">${p["runners up"]}</a></div>
    </div>
    <div class="row">
      <div>Minor Premiers</div>
      <div><a class="link" href="nrl-team.html?team=${encodeURIComponent(p["minor premier"])}">${p["minor premier"]}</a></div>
    </div>
  `;

  individualAwards.innerHTML = `
    <div class="row">
      <div>Clive Churchill Medal</div>
      <div>
        ${c ? `<a class="link" href="nrl-player.html?player=${encodeURIComponent(c.recipient)}">${c.recipient}</a> (${c.team})` : "-"}
      </div>
    </div>
    <div class="row">
      <div>Dally M Medal</div>
      <div>
        ${d ? `<a class="link" href="nrl-player.html?player=${encodeURIComponent(d.player)}">${d.player}</a> (${d.team})` : "-"}
      </div>
    </div>
  `;
}

</script>

</body>
</html>
