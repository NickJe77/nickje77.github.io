<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Winners & Awards | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:#f4f6f8;
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:28px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1100px;
  margin:auto;
  padding:40px 20px 80px;
}

h1{
  text-align:center;
  font-size:40px;
  margin-bottom:20px;
}

.season-select{
  text-align:center;
  margin-bottom:30px;
  font-size:18px;
}

select{
  padding:6px 10px;
  font-size:16px;
  border-radius:6px;
  border:1px solid #ccc;
}

.section{
  margin-top:30px;
}

.section-title{
  background:#cfd6e2;
  padding:14px 16px;
  font-weight:700;
  letter-spacing:1px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  padding:16px;
  border-bottom:1px solid #ddd;
}

.row div:first-child{
  font-weight:500;
}

.row div:last-child{
  font-style:italic;
  color:#555;
}

.link{
  text-decoration:none;
  color:#0056d6;
}

.link:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">

<h1>NRL Winners & Awards</h1>

<div class="season-select">
  Season:
  <select id="seasonSelect"></select>
</div>

<div class="section">
  <div class="section-title">TEAM HONOURS</div>
  <div id="teamHonours"></div>
</div>

<div class="section">
  <div class="section-title">INDIVIDUAL AWARDS</div>
  <div id="individualAwards"></div>
</div>

</div>

<script>

let premiersData = [];
let cliveData = [];
let dallyData = [];

const seasonSelect = document.getElementById("seasonSelect");
const teamHonours = document.getElementById("teamHonours");
const individualAwards = document.getElementById("individualAwards");

Promise.all([
  fetch("data/nrl/Premiers.csv").then(r=>r.text()),
  fetch("data/nrl/Clive Churchill.csv").then(r=>r.text()),
  fetch("data/nrl/Dally M.csv").then(r=>r.text())
])
.then(([premiersCSV, cliveCSV, dallyCSV])=>{

  premiersData = parseCSV(premiersCSV);
  cliveData = parseCSV(cliveCSV);
  dallyData = parseCSV(dallyCSV);

  const seasons = premiersData
    .map(r=>r.year)
    .sort((a,b)=>b-a);

  seasonSelect.innerHTML = seasons
    .map(s=>`<option value="${s}">${s}</option>`)
    .join("");

  seasonSelect.value = seasons[0];
  seasonSelect.onchange = renderSeason;

  renderSeason();
});

function parseCSV(text){
  const rows = text.trim().split("\n");
  const headers = rows[0].split(",");

  return rows.slice(1).map(r=>{
    const cols = r.split(",");
    let obj = {};
    headers.forEach((h,i)=>{
      obj[h.trim().toLowerCase()] = cols[i]?.trim();
    });
    return obj;
  });
}

function renderSeason(){

  const season = seasonSelect.value;

  const p = premiersData.find(r=>r.year === season);
  const c = cliveData.find(r=>r.year === season);
  const d = dallyData.find(r=>r.year === season);

  teamHonours.innerHTML = `
    <div class="row">
      <div>Premiers</div>
      <div><a class="link" href="nrl-team.html?team=${encodeURIComponent(p.premier)}">${p.premier}</a></div>
    </div>
    <div class="row">
      <div>Runner-up</div>
      <div><a class="link" href="nrl-team.html?team=${encodeURIComponent(p["runners up"])}">${p["runners up"]}</a></div>
    </div>
    <div class="row">
      <div>Minor Premiers</div>
      <div><a class="link" href="nrl-team.html?team=${encodeURIComponent(p["minor premier"])}">${p["minor premier"]}</a></div>
    </div>
  `;

  individualAwards.innerHTML = `
    <div class="row">
      <div>Clive Churchill Medal</div>
      <div>
        ${c ? `<a class="link" href="nrl-player.html?player=${encodeURIComponent(c.recipient)}">${c.recipient}</a> (${c.team})` : "-"}
      </div>
    </div>
    <div class="row">
      <div>Dally M Medal</div>
      <div>
        ${d ? `<a class="link" href="nrl-player.html?player=${encodeURIComponent(d.player)}">${d.player}</a> (${d.team})` : "-"}
      </div>
    </div>
  `;
}

</script>

</body>
</html>
