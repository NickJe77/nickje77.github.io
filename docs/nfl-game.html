<!DOCTYPE html>

<style>

body{

.container{

padding:24px;

}

margin-top:35px;
margin-bottom:15px;
font-size:28px;
}

h3{
margin-top:28px;

color:#013369;
}

table{

border-collapse:collapse;
margin-bottom:24px;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;

font-size:15px;
}

background:#013369;
color:white;
}

tbody tr:nth-child(even){
background:#eef5ff;
}

tbody tr:hover{
background:#dbeafe;
}

.team{
text-align:left;
font-weight:700;
}

.player-link{
color:#013369;
text-decoration:none;
font-weight:700;
}

.player-link:hover{

}

font-size:28px;
}

.hero-round{

}

th,td{
padding:10px;
font-size:13px;
}

.container{
padding:14px;
overflow-x:auto;
}

table{
min-width:900px;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero">

<div class="hero-content">

<div id="heroScore" class="hero-score">
Loading...
</div>

<div id="heroRound" class="hero-round"></div>

</div>

</div>

<div class="container">

<h2>Final Score</h2>

<table>

<thead>
<tr>
<th class="team">Team</th>
<th>Final</th>
</tr>
</thead>

<tbody id="scoreTable"></tbody>

</table>

<h2>Passing</h2>

<h3 id="passingTeam1"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>CMP</th>
<th>ATT</th>
<th>YDS</th>
<th>TD</th>
<th>INT</th>
<th>RTG</th>
</tr>
</thead>
<tbody id="passingTable1"></tbody>
</table>

<h3 id="passingTeam2"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>CMP</th>
<th>ATT</th>
<th>YDS</th>
<th>TD</th>
<th>INT</th>
<th>RTG</th>
</tr>
</thead>
<tbody id="passingTable2"></tbody>
</table>

<h2>Rushing</h2>

<h3 id="rushingTeam1"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>ATT</th>
<th>YDS</th>
<th>TD</th>
<th>LONG</th>
</tr>
</thead>
<tbody id="rushingTable1"></tbody>
</table>

<h3 id="rushingTeam2"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>ATT</th>
<th>YDS</th>
<th>TD</th>
<th>LONG</th>
</tr>
</thead>
<tbody id="rushingTable2"></tbody>
</table>

<h2>Receiving</h2>

<h3 id="receivingTeam1"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>REC</th>
<th>YDS</th>
<th>TD</th>
<th>LONG</th>
</tr>
</thead>
<tbody id="receivingTable1"></tbody>
</table>

<h3 id="receivingTeam2"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>REC</th>
<th>YDS</th>
<th>TD</th>
<th>LONG</th>
</tr>
</thead>
<tbody id="receivingTable2"></tbody>
</table>

</div>

<script>

const params = new URLSearchParams(location.search);

const season = params.get("season");
const gameID = params.get("game");

function slugify(name){
return name
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");
}

function hasPassingStats(s){
return Number(s.pass_att || 0) > 0;
}

function hasRushingStats(s){
return Number(s.rush_att || 0) > 0;
}

function hasReceivingStats(s){
return Number(s.rec || 0) > 0;
}

async function loadGame(){

const seasonRes = await fetch(`/data/nfl/seasons/${season}.json`);
const seasonData = await seasonRes.json();

const game = seasonData.games.find(
g => String(g.game_id) === String(gameID)
);

if(!game) return;

const boxRes = await fetch(`/data/nfl/boxscores/${season}/${gameID}.json`);
const box = await boxRes.json();

const players = [
...(box.passing || []),
...(box.rushing || []),
...(box.receiving || [])
];

const TEAM_MAP = {
"Arizona Cardinals":"ARI",
"Atlanta Falcons":"ATL",
"Baltimore Ravens":"BAL",
"Buffalo Bills":"BUF",
"Carolina Panthers":"CAR",
"Chicago Bears":"CHI",
"Cincinnati Bengals":"CIN",
"Cleveland Browns":"CLE",
"Dallas Cowboys":"DAL",
"Denver Broncos":"DEN",
"Detroit Lions":"DET",
"Green Bay Packers":"GB",
"Houston Texans":"HOU",
"Indianapolis Colts":"IND",
"Jacksonville Jaguars":"JAX",
"Kansas City Chiefs":"KC",
"Las Vegas Raiders":"LV",
"Los Angeles Chargers":"LAC",
"Los Angeles Rams":"LAR",
"Miami Dolphins":"MIA",
"Minnesota Vikings":"MIN",
"New England Patriots":"NE",
"New Orleans Saints":"NO",
"New York Giants":"NYG",
"New York Jets":"NYJ",
"Philadelphia Eagles":"PHI",
"Pittsburgh Steelers":"PIT",
"San Francisco 49ers":"SF",
"Seattle Seahawks":"SEA",
"Tampa Bay Buccaneers":"TB",
"Tennessee Titans":"TEN",
"Washington Commanders":"WAS"
};

const team1Code = TEAM_MAP[game.team1] || "";
const team2Code = TEAM_MAP[game.team2] || "";

const score1 = parseInt(game.score1 || 0);
const score2 = parseInt(game.score2 || 0);

let winner, loser, ws, ls;

if(score1 >= score2){

winner = game.team1;
loser = game.team2;
ws = score1;
ls = score2;

}else{

winner = game.team2;
loser = game.team1;
ws = score2;
ls = score1;

}

document.getElementById("heroScore").innerHTML =
`${winner} ${ws} — ${ls} ${loser}`;

let roundText = game.week || "";

const lowerRound = String(roundText).toLowerCase();

if(
lowerRound.includes("wild") ||
lowerRound.includes("divisional") ||
lowerRound.includes("conference") ||
lowerRound.includes("super bowl")
){
document.getElementById("heroRound").innerHTML = roundText;
}else{
document.getElementById("heroRound").innerHTML = `Week ${roundText}`;
}

document.getElementById("scoreTable").innerHTML = `
<tr>
<td class="team">${game.team1}</td>
<td><b>${game.score1}</b></td>
</tr>

<tr>
<td class="team">${game.team2}</td>
<td><b>${game.score2}</b></td>
</tr>
`;

document.getElementById("passingTeam1").innerText = game.team1;
document.getElementById("passingTeam2").innerText = game.team2;

document.getElementById("rushingTeam1").innerText = game.team1;
document.getElementById("rushingTeam2").innerText = game.team2;

document.getElementById("receivingTeam1").innerText = game.team1;
document.getElementById("receivingTeam2").innerText = game.team2;

/* PASSING */

let passingHTML1 = "";
let passingHTML2 = "";

players
.filter(p => hasPassingStats(p.stats || {}))
.forEach(p=>{

const s = p.stats || {};

const row = `
<tr>
<td class="team">
<a class="player-link"
href="nfl-player.html?player=${slugify(p.player)}">
${p.player}
</a>
</td>
<td>${s.pass_cmp || ""}</td>
<td>${s.pass_att || ""}</td>
<td>${s.pass_yds || ""}</td>
<td>${s.pass_td || ""}</td>
<td>${s.pass_int || ""}</td>
<td>${s.pass_rating || ""}</td>
</tr>
`;

const team = (s.team || "").trim();

if(team === team1Code){
passingHTML1 += row;
}

if(team === team2Code){
passingHTML2 += row;
}

});

document.getElementById("passingTable1").innerHTML = passingHTML1;
document.getElementById("passingTable2").innerHTML = passingHTML2;

/* RUSHING */

let rushingHTML1 = "";
let rushingHTML2 = "";

players
.filter(p => hasRushingStats(p.stats || {}))
.forEach(p=>{

const s = p.stats || {};

const row = `
<tr>
<td class="team">
<a class="player-link"
href="nfl-player.html?player=${slugify(p.player)}">
${p.player}
</a>
</td>
<td>${s.rush_att || ""}</td>
<td>${s.rush_yds || ""}</td>
<td>${s.rush_td || ""}</td>
<td>${s.rush_long || ""}</td>
</tr>
`;

const team = (s.team || "").trim();

if(team === team1Code){
rushingHTML1 += row;
}

if(team === team2Code){
rushingHTML2 += row;
}

});

document.getElementById("rushingTable1").innerHTML = rushingHTML1;
document.getElementById("rushingTable2").innerHTML = rushingHTML2;

/* RECEIVING */

let receivingHTML1 = "";
let receivingHTML2 = "";

players
.filter(p => hasReceivingStats(p.stats || {}))
.forEach(p=>{

const s = p.stats || {};

const row = `
<tr>
<td class="team">
<a class="player-link"
href="nfl-player.html?player=${slugify(p.player)}">
${p.player}
</a>
</td>
<td>${s.rec || ""}</td>
<td>${s.rec_yds || ""}</td>
<td>${s.rec_td || ""}</td>
<td>${s.rec_long || ""}</td>
</tr>
`;

const team = (s.team || "").trim();

if(team === team1Code){
receivingHTML1 += row;
}

if(team === team2Code){
receivingHTML2 += row;
}

});

document.getElementById("receivingTable1").innerHTML = receivingHTML1;
document.getElementById("receivingTable2").innerHTML = receivingHTML2;

}

loadGame();

</script>

</body>
</html>
