<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NFL Game</title>

<style>

body{
font-family:Inter;
background:#f4f6f8;
margin:0;
}

.header{
background:#d50a0a;
color:white;
padding:20px;
font-size:28px;
}

.container{
max-width:1000px;
margin:20px auto;
background:white;
padding:20px;
border-radius:12px;
}

</style>
</head>
<body>

<div class="header" id="title">
Game
</div>

<div class="container" id="content">
Loading...
</div>

<script>

const params=new URLSearchParams(location.search);

const year=params.get("year");

const id=params.get("id");

fetch(`data/nfl/nfl_${year}.json`)
.then(r=>r.json())
.then(data=>{

const game=data.games.find(g=>g.game_id===id);

document.getElementById("title").innerHTML=id;

document.getElementById("content").innerHTML=
`<pre>${JSON.stringify(game,null,2)}</pre>`;

});

</script>

</body>
</html>
