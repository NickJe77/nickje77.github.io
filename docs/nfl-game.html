<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f3f4f7;
}


/* NAV */

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
}

.navbar a{
  text-decoration:none;
  color:#013369;
  font-weight:600;
}


/* HERO */

.hero{
  background:linear-gradient(90deg,#013369,#d50a0a);
  color:white;
  padding:40px;
  text-align:center;
}

.hero-score{
  font-size:34px;
  font-weight:700;
}

.hero-round{
  margin-top:8px;
  font-size:18px;
  opacity:.95;
}


/* CONTENT */

.container{
  max-width:900px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{
  background:#f8fafc;
}

.team{
  text-align:left;
  font-weight:600;
}

</style>
</head>

<body>


<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>


<div class="hero">

<div id="heroScore" class="hero-score">
Loading...
</div>

<div id="heroRound" class="hero-round">
</div>

</div>


<div class="container">

<h2>Score Summary</h2>

<table>

<thead>
<tr>
<th class="team">Team</th>
<th>1</th>
<th>2</th>
<th>3</th>
<th>4</th>
<th>Final</th>
</tr>
</thead>

<tbody id="scoreTable">
</tbody>

</table>

</div>



<script>

const params=new URLSearchParams(location.search);

const year=parseInt(params.get("year"));
const gameID=params.get("id");


function playoffStructure(year){

if(year<=1977)
return {wild:0,div:4,conf:2,sb:1};

if(year<=1989)
return {wild:4,div:4,conf:2,sb:1};

if(year<=2001)
return {wild:6,div:4,conf:2,sb:1};

if(year<=2019)
return {wild:4,div:4,conf:2,sb:1};

return {wild:6,div:4,conf:2,sb:1};

}


async function loadGame(){

const res=await fetch("data/nfl/nfl_"+year+".json");

const data=await res.json();

const games=data.games.filter(g =>
g &&
g.game_id &&
g.score &&
g.score.length>=2 &&
g.score[0]["Unnamed: 1"]
);


// sort chronologically

games.sort((a,b)=>a.game_id.localeCompare(b.game_id));


// assign rounds

const structure=playoffStructure(year);

const roundMap={};

let i=games.length-1;

roundMap[games[i--].game_id]="Super Bowl";

for(let x=0;x<structure.conf;x++)
roundMap[games[i--].game_id]="Conference Championship";

for(let x=0;x<structure.div;x++)
roundMap[games[i--].game_id]="Divisional";

for(let x=0;x<structure.wild;x++)
roundMap[games[i--].game_id]="Wild Card";


// find current game

const game=games.find(g=>g.game_id===gameID);

if(!game) return;


// extract teams

const team1=game.score[0]["Unnamed: 1"];
const team2=game.score[1]["Unnamed: 1"];

const s1=parseInt(game.score[0]["Final"]);
const s2=parseInt(game.score[1]["Final"]);


// hero score

document.getElementById("heroScore").innerHTML=
team1+" "+s1+" — "+s2+" "+team2;


// hero round

const round=roundMap[gameID]||"Regular Season";

document.getElementById("heroRound").innerHTML=round;


// table

document.getElementById("scoreTable").innerHTML=
`
<tr>
<td class="team">${team1}</td>
<td>${game.score[0]["1"]}</td>
<td>${game.score[0]["2"]}</td>
<td>${game.score[0]["3"]}</td>
<td>${game.score[0]["4"]}</td>
<td><b>${s1}</b></td>
</tr>

<tr>
<td class="team">${team2}</td>
<td>${game.score[1]["1"]}</td>
<td>${game.score[1]["2"]}</td>
<td>${game.score[1]["3"]}</td>
<td>${game.score[1]["4"]}</td>
<td><b>${s2}</b></td>
</tr>
`;

}


loadGame();

</script>


</body>
</html>
