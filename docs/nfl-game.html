<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f3f4f7;color:#111;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:white;border-bottom:1px solid #ddd;}
.navbar a{color:#013369;text-decoration:none;font-weight:700;}
.hero{position:relative;background-image:url('/images/nfl_hero.jpg?v=2');background-size:cover;background-position:center;padding:70px 20px;text-align:center;overflow:hidden;}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(1,51,105,.72),rgba(213,10,10,.72));}
.hero-content{position:relative;z-index:2;color:white;}
.hero-score{font-size:42px;font-weight:900;margin-bottom:12px;text-shadow:0 3px 10px rgba(0,0,0,.35);}
.hero-round{font-size:20px;font-weight:700;}
.container{max-width:1200px;margin:30px auto;background:white;padding:24px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
h2{margin-top:35px;margin-bottom:15px;font-size:28px;}
h3{margin-top:28px;margin-bottom:12px;font-size:22px;color:#013369;}
table{width:100%;border-collapse:collapse;margin-bottom:24px;}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:center;font-size:15px;}
th{background:#013369;color:white;}
tbody tr:nth-child(even){background:#eef5ff;}
tbody tr:hover{background:#dbeafe;}
.team{text-align:left;font-weight:700;}
.player-link{color:#013369;text-decoration:none;font-weight:700;}
.player-link:hover{text-decoration:underline;}
.empty{color:#777;font-style:italic;text-align:left;}
@media(max-width:700px){
.hero-score{font-size:28px;}
.hero-round{font-size:16px;}
th,td{padding:10px;font-size:13px;}
.container{padding:14px;overflow-x:auto;}
table{min-width:900px;}
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero">
<div class="hero-content">
<div id="heroScore" class="hero-score">Loading...</div>
<div id="heroRound" class="hero-round"></div>
</div>
</div>

<div class="container">

<h2>Final Score</h2>
<table>
<thead>
<tr><th class="team">Team</th><th>Final</th></tr>
</thead>
<tbody id="scoreTable"></tbody>
</table>

<h2>Passing</h2>
<h3 id="passingTeam1"></h3>
<table>
<thead>
<tr>
<th class="team">Player</th><th>CMP</th><th>ATT</th><th>YDS</th><th>TD</th><th>INT</th><th>RTG</th>
</tr>
</thead>
<tbody id="passingTable1"></tbody>
</table>

<h3 id="passingTeam2"></h3>
<table>
<thead>
<tr>
<th class="team">Player</th><th>CMP</th><th>ATT</th><th>YDS</th><th>TD</th><th>INT</th><th>RTG</th>
</tr>
</thead>
<tbody id="passingTable2"></tbody>
</table>

<h2>Rushing</h2>
<h3 id="rushingTeam1"></h3>
<table>
<thead>
<tr>
<th class="team">Player</th><th>ATT</th><th>YDS</th><th>TD</th><th>LONG</th>
</tr>
</thead>
<tbody id="rushingTable1"></tbody>
</table>

<h3 id="rushingTeam2"></h3>
<table>
<thead>
<tr>
<th class="team">Player</th><th>ATT</th><th>YDS</th><th>TD</th><th>LONG</th>
</tr>
</thead>
<tbody id="rushingTable2"></tbody>
</table>

<h2>Receiving</h2>
<h3 id="receivingTeam1"></h3>
<table>
<thead>
<tr>
<th class="team">Player</th><th>REC</th><th>YDS</th><th>TD</th><th>LONG</th>
</tr>
</thead>
<tbody id="receivingTable1"></tbody>
</table>

<h3 id="receivingTeam2"></h3>
<table>
<thead>
<tr>
<th class="team">Player</th><th>REC</th><th>YDS</th><th>TD</th><th>LONG</th>
</tr>
</thead>
<tbody id="receivingTable2"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(location.search);
const season = params.get("season");
const gameID = params.get("game");

const TEAM_MAP = {
"Arizona Cardinals":"ARI","Atlanta Falcons":"ATL","Baltimore Ravens":"BAL","Buffalo Bills":"BUF",
"Carolina Panthers":"CAR","Chicago Bears":"CHI","Cincinnati Bengals":"CIN","Cleveland Browns":"CLE",
"Dallas Cowboys":"DAL","Denver Broncos":"DEN","Detroit Lions":"DET","Green Bay Packers":"GB",
"Houston Texans":"HOU","Indianapolis Colts":"IND","Jacksonville Jaguars":"JAX","Kansas City Chiefs":"KC",
"Las Vegas Raiders":"LV","Los Angeles Chargers":"LAC","Los Angeles Rams":"LAR","Miami Dolphins":"MIA",
"Minnesota Vikings":"MIN","New England Patriots":"NE","New Orleans Saints":"NO","New York Giants":"NYG",
"New York Jets":"NYJ","Philadelphia Eagles":"PHI","Pittsburgh Steelers":"PIT","San Francisco 49ers":"SF",
"Seattle Seahawks":"SEA","Tampa Bay Buccaneers":"TB","Tennessee Titans":"TEN","Washington Commanders":"WAS"
};

function slugify(name){
return String(name || "").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

function val(...items){
for(const x of items){
if(x !== undefined && x !== null && x !== "") return x;
}
return "";
}

function num(x){
const n = Number(x);
return Number.isFinite(n) ? n : 0;
}

function normalTeam(t){
t = String(t || "").trim();
return TEAM_MAP[t] || t;
}

function getPlayerTeam(p){
const s = p.stats || {};
return normalTeam(
val(
p.team,
p.team_code,
p.teamCode,
p.played_for,
p.playedFor,
s.team,
s.team_code,
s.teamCode,
s.played_for,
s.playedFor
)
);
}

function playerName(p){
return val(p.player,p.name,p.player_name,p.playerName);
}

function hasPassingStats(p){
const s = p.stats || p;
return num(val(s.pass_att,s.att,s.attempts)) > 0;
}

function hasRushingStats(p){
const s = p.stats || p;
return num(val(s.rush_att,s.att,s.attempts)) > 0;
}

function hasReceivingStats(p){
const s = p.stats || p;
return num(val(s.rec,s.receptions)) > 0;
}

function emptyRow(cols){
return `<tr><td class="empty" colspan="${cols}">No stats listed</td></tr>`;
}

function makePlayerLink(name){
return `<a class="player-link" href="nfl-player.html?player=${slugify(name)}">${name}</a>`;
}

async function loadGame(){
const seasonRes = await fetch(`/data/nfl/seasons/${season}.json?v=${Date.now()}`);
const seasonData = await seasonRes.json();

const games = seasonData.games || seasonData || [];
const game = games.find(g => String(val(g.game_id,g.id,g.game)) === String(gameID));
if(!game){
document.getElementById("heroScore").innerHTML = "Game not found";
return;
}

const boxRes = await fetch(`/data/nfl/boxscores/${season}/${gameID}.json?v=${Date.now()}`);
const box = await boxRes.json();

const team1 = val(game.team1,game.home_team,game.home);
const team2 = val(game.team2,game.away_team,game.away);
const team1Code = TEAM_MAP[team1] || team1;
const team2Code = TEAM_MAP[team2] || team2;

const score1 = parseInt(val(game.score1,game.home_score,0),10);
const score2 = parseInt(val(game.score2,game.away_score,0),10);

let winner = score1 >= score2 ? team1 : team2;
let loser = score1 >= score2 ? team2 : team1;
let ws = score1 >= score2 ? score1 : score2;
let ls = score1 >= score2 ? score2 : score1;

document.getElementById("heroScore").innerHTML = `${winner} ${ws} — ${ls} ${loser}`;

let roundText = val(game.week,game.round,"");
let lowerRound = String(roundText).toLowerCase();

document.getElementById("heroRound").innerHTML =
lowerRound.includes("wild") ||
lowerRound.includes("divisional") ||
lowerRound.includes("conference") ||
lowerRound.includes("super bowl")
? roundText
: `Week ${roundText}`;

document.getElementById("scoreTable").innerHTML = `
<tr><td class="team">${team1}</td><td><b>${score1}</b></td></tr>
<tr><td class="team">${team2}</td><td><b>${score2}</b></td></tr>
`;

["passing","rushing","receiving"].forEach(type=>{
document.getElementById(`${type}Team1`).innerText = team1;
document.getElementById(`${type}Team2`).innerText = team2;
});

const passing = box.passing || [];
const rushing = box.rushing || [];
const receiving = box.receiving || [];

let passingHTML1 = "";
let passingHTML2 = "";

passing.filter(hasPassingStats).forEach(p=>{
const s = p.stats || p;
const name = playerName(p);
const row = `
<tr>
<td class="team">${makePlayerLink(name)}</td>
<td>${val(s.pass_cmp,s.cmp,s.completed)}</td>
<td>${val(s.pass_att,s.att,s.attempts)}</td>
<td>${val(s.pass_yds,s.yds,s.yards)}</td>
<td>${val(s.pass_td,s.td)}</td>
<td>${val(s.pass_int,s.int)}</td>
<td>${val(s.pass_rating,s.rating,s.rtg)}</td>
</tr>`;
const team = getPlayerTeam(p);
if(team === team1Code || team === team1) passingHTML1 += row;
if(team === team2Code || team === team2) passingHTML2 += row;
});

document.getElementById("passingTable1").innerHTML = passingHTML1 || emptyRow(7);
document.getElementById("passingTable2").innerHTML = passingHTML2 || emptyRow(7);

let rushingHTML1 = "";
let rushingHTML2 = "";

rushing.filter(hasRushingStats).forEach(p=>{
const s = p.stats || p;
const name = playerName(p);
const row = `
<tr>
<td class="team">${makePlayerLink(name)}</td>
<td>${val(s.rush_att,s.att,s.attempts)}</td>
<td>${val(s.rush_yds,s.yds,s.yards)}</td>
<td>${val(s.rush_td,s.td)}</td>
<td>${val(s.rush_long,s.long)}</td>
</tr>`;
const team = getPlayerTeam(p);
if(team === team1Code || team === team1) rushingHTML1 += row;
if(team === team2Code || team === team2) rushingHTML2 += row;
});

document.getElementById("rushingTable1").innerHTML = rushingHTML1 || emptyRow(5);
document.getElementById("rushingTable2").innerHTML = rushingHTML2 || emptyRow(5);

let receivingHTML1 = "";
let receivingHTML2 = "";

receiving.filter(hasReceivingStats).forEach(p=>{
const s = p.stats || p;
const name = playerName(p);
const row = `
<tr>
<td class="team">${makePlayerLink(name)}</td>
<td>${val(s.rec,s.receptions)}</td>
<td>${val(s.rec_yds,s.yds,s.yards)}</td>
<td>${val(s.rec_td,s.td)}</td>
<td>${val(s.rec_long,s.long)}</td>
</tr>`;
const team = getPlayerTeam(p);
if(team === team1Code || team === team1) receivingHTML1 += row;
if(team === team2Code || team === team2) receivingHTML2 += row;
});

document.getElementById("receivingTable1").innerHTML = receivingHTML1 || emptyRow(5);
document.getElementById("receivingTable2").innerHTML = receivingHTML2 || emptyRow(5);
}

loadGame();
</script>

</body>
</html>
