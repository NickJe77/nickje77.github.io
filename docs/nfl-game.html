<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
}

.navbar a{
  text-decoration:none;
  color:#013369;
  font-weight:600;
}

.hero{
  background:linear-gradient(90deg,#013369,#d50a0a);
  color:white;
  padding:40px;
  text-align:center;
}

.hero-score{
  font-size:36px;
  font-weight:700;
  margin-bottom:6px;
}

.hero-type{
  font-size:18px;
  opacity:.9;
}

.container{
  max-width:1000px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:12px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.tab{
  background:#e5e7eb;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.tab.active{
  background:#013369;
  color:white;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{
  background:#f8fafc;
}

.team{
  text-align:left;
  font-weight:600;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero">

<div class="hero-score" id="heroScore">
Loading...
</div>

<div class="hero-type" id="heroType">
</div>

</div>

<div class="container">

<div class="tabs">
<div class="tab active">Score</div>
<div class="tab">Team Stats</div>
<div class="tab">Passing</div>
<div class="tab">Rushing</div>
<div class="tab">Receiving</div>
</div>

<h2>Score Summary</h2>

<table id="scoreTable">

<thead>
<tr>
<th class="team">Team</th>
<th>1</th>
<th>2</th>
<th>3</th>
<th>4</th>
<th>Final</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>

const params = new URLSearchParams(location.search);

const year = params.get("year");
const id = params.get("id");

async function loadGame(){

const res = await fetch("data/nfl/nfl_"+year+".json");

const data = await res.json();

const game = data.games.find(g=>g.game_id===id);

if(!game) return;


// extract teams

const team1 = game.score[0]["Unnamed: 1"];
const team2 = game.score[1]["Unnamed: 1"];

const score1 = game.score[0]["Final"];
const score2 = game.score[1]["Final"];


// hero header

document.getElementById("heroScore").innerHTML =
team1+" "+score1+" — "+score2+" "+team2;

document.getElementById("heroType").innerHTML =
"Regular Season";


// score table

const tbody = document.querySelector("#scoreTable tbody");

tbody.innerHTML=`
<tr>
<td class="team">${team1}</td>
<td>${game.score[0]["1"]}</td>
<td>${game.score[0]["2"]}</td>
<td>${game.score[0]["3"]}</td>
<td>${game.score[0]["4"]}</td>
<td><b>${score1}</b></td>
</tr>

<tr>
<td class="team">${team2}</td>
<td>${game.score[1]["1"]}</td>
<td>${game.score[1]["2"]}</td>
<td>${game.score[1]["3"]}</td>
<td>${game.score[1]["4"]}</td>
<td><b>${score2}</b></td>
</tr>
`;

}

loadGame();

</script>

</body>
</html>
