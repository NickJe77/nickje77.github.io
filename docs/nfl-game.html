<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NFL Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
}

.navbar a{
color:#013369;
text-decoration:none;
font-weight:700;
}

.hero{
position:relative;
background-image:url('/images/nfl_hero.jpg?v=2');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
padding:70px 20px;
text-align:center;
overflow:hidden;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(rgba(1,51,105,.72),rgba(213,10,10,.72));
}

.hero-content{
position:relative;
z-index:2;
color:white;
}

.hero-score{
font-size:42px;
font-weight:900;
margin-bottom:12px;
text-shadow:0 3px 10px rgba(0,0,0,.35);
}

.hero-round{
font-size:20px;
font-weight:700;
}

.container{
max-width:1200px;
margin:30px auto;
background:white;
padding:24px;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
margin-top:35px;
margin-bottom:15px;
font-size:28px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:center;
font-size:15px;
}

th{
background:#013369;
color:white;
}

tbody tr:nth-child(even){
background:#eef5ff;
}

tbody tr:hover{
background:#dbeafe;
}

.team{
text-align:left;
font-weight:700;
}

.player-link{
color:#013369;
text-decoration:none;
font-weight:700;
}

.player-link:hover{
text-decoration:underline;
}

@media(max-width:700px){

.hero-score{
font-size:28px;
}

.hero-round{
font-size:16px;
}

th,td{
padding:10px;
font-size:13px;
}

.container{
padding:14px;
overflow-x:auto;
}

table{
min-width:900px;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero">

  <div class="hero-content">

    <div id="heroScore" class="hero-score">
      Loading...
    </div>

    <div id="heroRound" class="hero-round"></div>

  </div>

</div>

<div class="container">

<h2>Final Score</h2>

<table>

<thead>
<tr>
<th class="team">Team</th>
<th>Final</th>
</tr>
</thead>

<tbody id="scoreTable"></tbody>

</table>

<h2>Passing</h2>

<table>

<thead>
<tr>
<th class="team">Player</th>
<th>Team</th>
<th>CMP</th>
<th>ATT</th>
<th>YDS</th>
<th>TD</th>
<th>INT</th>
<th>RTG</th>
</tr>
</thead>

<tbody id="passingTable"></tbody>

</table>

<h2>Rushing</h2>

<table>

<thead>
<tr>
<th class="team">Player</th>
<th>Team</th>
<th>ATT</th>
<th>YDS</th>
<th>TD</th>
<th>LONG</th>
</tr>
</thead>

<tbody id="rushingTable"></tbody>

</table>

<h2>Receiving</h2>

<table>

<thead>
<tr>
<th class="team">Player</th>
<th>Team</th>
<th>REC</th>
<th>YDS</th>
<th>TD</th>
<th>LONG</th>
</tr>
</thead>

<tbody id="receivingTable"></tbody>

</table>

</div>

<script>

const params = new URLSearchParams(location.search);

const season = params.get("season");
const gameID = params.get("game");

function slugify(name){
return name
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");
}

async function loadGame(){

/* LOAD SEASON */

const seasonRes = await fetch(`/data/nfl/seasons/${season}.json`);
const seasonData = await seasonRes.json();

const game = seasonData.games.find(
g => String(g.game_id) === String(gameID)
);

if(!game) return;

/* LOAD BOXSCORE */

const boxRes = await fetch(`/data/nfl/boxscores/${season}/${gameID}.json`);
const box = await boxRes.json();

/* DETERMINE WINNER */

const score1 = parseInt(game.score1 || 0);
const score2 = parseInt(game.score2 || 0);

let winner, loser, ws, ls;

if(score1 >= score2){

winner = game.team1;
loser = game.team2;
ws = score1;
ls = score2;

}else{

winner = game.team2;
loser = game.team1;
ws = score2;
ls = score1;

}

/* HERO */

document.getElementById("heroScore").innerHTML =
`${winner} ${ws} — ${ls} ${loser}`;

document.getElementById("heroRound").innerHTML =
`Week ${game.week}`;

/* SCORE TABLE */

document.getElementById("scoreTable").innerHTML = `
<tr>
<td class="team">${game.team1}</td>
<td><b>${game.score1}</b></td>
</tr>

<tr>
<td class="team">${game.team2}</td>
<td><b>${game.score2}</b></td>
</tr>
`;

/* PASSING */

let passingHTML = "";

(box.passing || []).forEach(p=>{

const s = p.stats || {};

passingHTML += `
<tr>

<td class="team">
<a class="player-link"
href="nfl-player.html?player=${slugify(p.player)}">
${p.player}
</a>
</td>

<td>${s.team || ""}</td>
<td>${s.pass_cmp || ""}</td>
<td>${s.pass_att || ""}</td>
<td>${s.pass_yds || ""}</td>
<td>${s.pass_td || ""}</td>
<td>${s.pass_int || ""}</td>
<td>${s.pass_rating || ""}</td>

</tr>
`;

});

document.getElementById("passingTable").innerHTML = passingHTML;

/* RUSHING */

let rushingHTML = "";

(box.rushing || []).forEach(p=>{

const s = p.stats || {};

rushingHTML += `
<tr>

<td class="team">
<a class="player-link"
href="nfl-player.html?player=${slugify(p.player)}">
${p.player}
</a>
</td>

<td>${s.team || ""}</td>
<td>${s.rush_att || ""}</td>
<td>${s.rush_yds || ""}</td>
<td>${s.rush_td || ""}</td>
<td>${s.rush_long || ""}</td>

</tr>
`;

});

document.getElementById("rushingTable").innerHTML = rushingHTML;

/* RECEIVING */

let receivingHTML = "";

(box.receiving || []).forEach(p=>{

const s = p.stats || {};

receivingHTML += `
<tr>

<td class="team">
<a class="player-link"
href="nfl-player.html?player=${slugify(p.player)}">
${p.player}
</a>
</td>

<td>${s.team || ""}</td>
<td>${s.rec || ""}</td>
<td>${s.rec_yds || ""}</td>
<td>${s.rec_td || ""}</td>
<td>${s.rec_long || ""}</td>

</tr>
`;

});

document.getElementById("receivingTable").innerHTML = receivingHTML;

}

loadGame();

</script>

</body>
</html>
