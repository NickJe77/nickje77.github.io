<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
}

.navbar a{
  text-decoration:none;
  color:#013369;
  font-weight:600;
}

.hero{
  background:linear-gradient(90deg,#013369,#d50a0a);
  color:white;
  padding:40px;
  text-align:center;
}

.hero-score{
  font-size:34px;
  font-weight:700;
}

.hero-round{
  margin-top:8px;
  font-size:18px;
  opacity:.95;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{
  background:#f8fafc;
}

.team{
  text-align:left;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero">
<div id="heroScore" class="hero-score">Loading...</div>
<div id="heroRound" class="hero-round"></div>
</div>

<div class="container">

<h2>Score</h2>

<table>
<thead>
<tr>
<th class="team">Team</th>
<th>Final</th>
</tr>
</thead>

<tbody id="scoreTable"></tbody>
</table>

</div>

<script>

const params=new URLSearchParams(location.search);

const season=params.get("season");
const gameID=params.get("id");

async function loadGame(){

const res=await fetch(`data/nfl/seasons/${season}.json`);
const data=await res.json();

const game=data.games.find(g=>String(g.game_id)===String(gameID));

if(!game) return;

// hero

document.getElementById("heroScore").innerHTML=
`${game.home_team} ${game.home_score} — ${game.away_score} ${game.away_team}`;

document.getElementById("heroRound").innerHTML=game.game_type;

// table

document.getElementById("scoreTable").innerHTML=`
<tr>
<td class="team">${game.home_team}</td>
<td><b>${game.home_score}</b></td>
</tr>

<tr>
<td class="team">${game.away_team}</td>
<td><b>${game.away_score}</b></td>
</tr>
`;

}

loadGame();

</script>

</body>
</html>
