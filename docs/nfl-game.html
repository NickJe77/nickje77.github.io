<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NFL Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f3f4f7;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
}

.navbar a{
  text-decoration:none;
  color:#013369;
  font-weight:600;
}

.hero{
  background:linear-gradient(90deg,#013369,#d50a0a);
  color:white;
  padding:30px;
  text-align:center;
}

.hero h1{
  margin:0;
  font-size:32px;
}

.hero h2{
  margin:5px 0 0 0;
  font-weight:400;
}

.container{
  max-width:1100px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:12px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.tab{
  padding:10px 20px;
  background:#e5e7eb;
  cursor:pointer;
  border-radius:6px;
  font-weight:600;
}

.tab.active{
  background:#013369;
  color:white;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:8px;
  border-bottom:1px solid #eee;
}

th{
  background:#f8fafc;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.section-title{
  font-size:20px;
  margin:15px 0;
  color:#013369;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero">
<h1 id="teams">Loading...</h1>
<h2 id="gameinfo"></h2>
</div>

<div class="container">

<div class="tabs">

<div class="tab active" onclick="showTab('score')">Score</div>
<div class="tab" onclick="showTab('teamstats')">Team Stats</div>
<div class="tab" onclick="showTab('passing')">Passing</div>
<div class="tab" onclick="showTab('rushing')">Rushing</div>
<div class="tab" onclick="showTab('receiving')">Receiving</div>

</div>

<div id="score" class="section active">
<div class="section-title">Score Summary</div>
<table><thead></thead><tbody></tbody></table>
</div>

<div id="teamstats" class="section">
<div class="section-title">Team Stats</div>
<table><thead></thead><tbody></tbody></table>
</div>

<div id="passing" class="section">
<div class="section-title">Passing</div>
<table><thead></thead><tbody></tbody></table>
</div>

<div id="rushing" class="section">
<div class="section-title">Rushing</div>
<table><thead></thead><tbody></tbody></table>
</div>

<div id="receiving" class="section">
<div class="section-title">Receiving</div>
<table><thead></thead><tbody></tbody></table>
</div>

</div>

<script>

const params = new URLSearchParams(location.search);

const year = params.get("year");
const id = params.get("id");

fetch(`data/nfl/nfl_${year}.json`)
.then(r=>r.json())
.then(data=>{

const game = data.games.find(g=>g.game_id===id);

if(!game){
document.getElementById("teams").innerHTML="Game not found";
return;
}

let away="";
let home="";
let awayScore="";
let homeScore="";

if(game.score && game.score.length>=2){

away=game.score[0].Tm;
home=game.score[1].Tm;

awayScore=game.score[0].Final;
homeScore=game.score[1].Final;

}

document.getElementById("teams").innerHTML =
`${away} ${awayScore} — ${homeScore} ${home}`;

document.getElementById("gameinfo").innerHTML =
game.round ? game.round : "Regular Season";

buildTable("score", game.score);
buildTable("teamstats", game.team_stats);
buildTable("passing", game.passing);
buildTable("rushing", game.rushing);
buildTable("receiving", game.receiving);

});

function showTab(id){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

document.getElementById(id).classList.add("active");

event.target.classList.add("active");

}

function buildTable(id, data){

if(!data || data.length==0) return;

const section=document.getElementById(id);

const table=section.querySelector("table");

const thead=table.querySelector("thead");
const tbody=table.querySelector("tbody");

thead.innerHTML="";
tbody.innerHTML="";

const headers=Object.keys(data[0]);

const tr=document.createElement("tr");

headers.forEach(h=>{
const th=document.createElement("th");
th.innerHTML=h;
tr.appendChild(th);
});

thead.appendChild(tr);

data.forEach(row=>{

const tr=document.createElement("tr");

headers.forEach(h=>{
const td=document.createElement("td");
td.innerHTML=row[h];
tr.appendChild(td);
});

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
