<!DOCTYPE html>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;

border-bottom:1px solid #ddd;
}

.navbar a{

}

.hero-round{

}

.container{
max-width:1200px;
margin:30px auto;
background:white;
padding:24px;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
margin-top:35px;
margin-bottom:15px;
font-size:28px;
}

h3{
margin-top:28px;
margin-bottom:12px;
font-size:22px;
color:#013369;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:24px;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:center;
font-size:15px;
}

th{
background:#013369;
color:white;
}

tbody tr:nth-child(even){
background:#eef5ff;
}

tbody tr:hover{
background:#dbeafe;
}

.team{
text-align:left;
font-weight:700;
}

.player-link{
color:#013369;
text-decoration:none;
font-weight:700;
}

.player-link:hover{
text-decoration:underline;
}

.empty{
color:#777;
font-style:italic;
text-align:left;
}

@media(max-width:700px){

.hero-score{
font-size:28px;
}

.hero-round{
font-size:16px;
}

th,td{
padding:10px;
font-size:13px;
}

.container{
padding:14px;
overflow-x:auto;
}

table{
min-width:900px;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nfl.html">NFL</a>
</div>

<div class="hero">

<div class="hero-content">

<div id="heroScore" class="hero-score">
Loading...
</div>

<div id="heroRound" class="hero-round"></div>

</div>

</div>

<div class="container">

<h2>Final Score</h2>

<table>
<thead>
<tr>
<th class="team">Team</th>
<th>Final</th>
</tr>
</thead>
<tbody id="scoreTable"></tbody>
</table>

<h2>Passing</h2>

<h3 id="passingTeam1"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>CMP</th>
<th>ATT</th>
<th>YDS</th>
<th>TD</th>
<th>INT</th>
<th>RTG</th>
</tr>
</thead>
<tbody id="passingTable1"></tbody>
</table>

<h3 id="passingTeam2"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>CMP</th>
<th>ATT</th>
<th>YDS</th>
<th>TD</th>
<th>INT</th>
<th>RTG</th>
</tr>
</thead>
<tbody id="passingTable2"></tbody>
</table>

<h2>Rushing</h2>

<h3 id="rushingTeam1"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>ATT</th>
<th>YDS</th>
<th>TD</th>
<th>LONG</th>
</tr>
</thead>
<tbody id="rushingTable1"></tbody>
</table>

<h3 id="rushingTeam2"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>ATT</th>
<th>YDS</th>
<th>TD</th>
<th>LONG</th>
</tr>
</thead>
<tbody id="rushingTable2"></tbody>
</table>

<h2>Receiving</h2>

<h3 id="receivingTeam1"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>REC</th>
<th>YDS</th>
<th>TD</th>
<th>LONG</th>
</tr>
</thead>
<tbody id="receivingTable1"></tbody>
</table>

<h3 id="receivingTeam2"></h3>

<table>
<thead>
<tr>
<th class="team">Player</th>
<th>REC</th>
<th>YDS</th>
<th>TD</th>
<th>LONG</th>
</tr>
</thead>
<tbody id="receivingTable2"></tbody>
</table>

</div>

<script>

const params = new URLSearchParams(location.search);

const season = params.get("season");
const gameID = params.get("game");

const REVERSE_TEAM_MAP = {
"ARI":"Arizona Cardinals",
"ATL":"Atlanta Falcons",
"BAL":"Baltimore Ravens",
"BUF":"Buffalo Bills",
"CAR":"Carolina Panthers",
"CHI":"Chicago Bears",
"CIN":"Cincinnati Bengals",
"CLE":"Cleveland Browns",
"DAL":"Dallas Cowboys",
"DEN":"Denver Broncos",
"DET":"Detroit Lions",
"GB":"Green Bay Packers",
"HOU":"Houston Texans",
"IND":"Indianapolis Colts",
"JAX":"Jacksonville Jaguars",
"KC":"Kansas City Chiefs",
"LV":"Las Vegas Raiders",
"LAC":"Los Angeles Chargers",
"LAR":"Los Angeles Rams",
"MIA":"Miami Dolphins",
"MIN":"Minnesota Vikings",
"NE":"New England Patriots",
"NO":"New Orleans Saints",
"NYG":"New York Giants",
"NYJ":"New York Jets",
"PHI":"Philadelphia Eagles",
"PIT":"Pittsburgh Steelers",
"SF":"San Francisco 49ers",
"SEA":"Seattle Seahawks",
"TB":"Tampa Bay Buccaneers",
"TEN":"Tennessee Titans",
"WAS":"Washington Commanders"
};

function slugify(name){

return String(name || "")
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"");

}

function makePlayerLink(name){

return `
<a class="player-link"
href="nfl-player.html?player=${slugify(name)}">
${name}
</a>
`;

}

function emptyRow(cols){

return `
<tr>
<td class="empty" colspan="${cols}">
No stats listed
</td>
</tr>
`;

}

async function loadGame(){

const seasonRes =
await fetch(`/data/nfl/seasons/${season}.json?v=${Date.now()}`);

const seasonData = await seasonRes.json();

const games =
seasonData.games ||
seasonData ||
[];

const game = games.find(
g => String(g.game_id) === String(gameID)
);

if(!game){

document.getElementById("heroScore").innerHTML =
"Game not found";

return;

}

const boxRes =
await fetch(`/data/nfl/boxscores/${season}/${gameID}.json?v=${Date.now()}`);

const box = await boxRes.json();

/* EVERYTHING STORED HERE */

const players = box.passing || [];

/* GET TEAMS DIRECTLY FROM PLAYER DATA */

const allTeams = [
...new Set(
players
.map(p => (p.stats || {}).team)
.filter(Boolean)
)
];

const team1Code = allTeams[0] || "";
const team2Code = allTeams[1] || "";

const team1 =
REVERSE_TEAM_MAP[team1Code] || team1Code;

const team2 =
REVERSE_TEAM_MAP[team2Code] || team2Code;

const score1 =
parseInt(game.score1 || game.home_score || 0);

const score2 =
parseInt(game.score2 || game.away_score || 0);

let winner, loser, ws, ls;

if(score1 >= score2){

winner = team1;
loser = team2;
ws = score1;
ls = score2;

}else{

winner = team2;
loser = team1;
ws = score2;
ls = score1;

}

document.getElementById("heroScore").innerHTML =
`${winner} ${ws} — ${ls} ${loser}`;

let roundText =
game.week ||
game.round ||
"";

const lowerRound =
String(roundText).toLowerCase();

if(
lowerRound.includes("wild") ||
lowerRound.includes("divisional") ||
lowerRound.includes("conference") ||
lowerRound.includes("super bowl")
){

document.getElementById("heroRound").innerHTML =
roundText;

}else{

document.getElementById("heroRound").innerHTML =
`Week ${roundText}`;

}

document.getElementById("scoreTable").innerHTML = `
<tr>
<td class="team">${team1}</td>
<td><b>${score1}</b></td>
</tr>

<tr>
<td class="team">${team2}</td>
<td><b>${score2}</b></td>
</tr>
`;

document.getElementById("passingTeam1").innerText =
team1;

document.getElementById("passingTeam2").innerText =
team2;

document.getElementById("rushingTeam1").innerText =
team1;

document.getElementById("rushingTeam2").innerText =
team2;

document.getElementById("receivingTeam1").innerText =
team1;

document.getElementById("receivingTeam2").innerText =
team2;

/* PASSING */

let passingHTML1 = "";
let passingHTML2 = "";

players.forEach(p=>{

const s = p.stats || {};

if(Number(s.pass_att || 0) <= 0) return;

const row = `
<tr>
<td class="team">
${makePlayerLink(p.player)}
</td>
<td>${s.pass_cmp || ""}</td>
<td>${s.pass_att || ""}</td>
<td>${s.pass_yds || ""}</td>
<td>${s.pass_td || ""}</td>
<td>${s.pass_int || ""}</td>
<td>${s.pass_rating || ""}</td>
</tr>
`;

if(s.team === team1Code){
passingHTML1 += row;
}

if(s.team === team2Code){
passingHTML2 += row;
}

});

document.getElementById("passingTable1").innerHTML =
passingHTML1 || emptyRow(7);

document.getElementById("passingTable2").innerHTML =
passingHTML2 || emptyRow(7);

/* RUSHING */

let rushingHTML1 = "";
let rushingHTML2 = "";

players.forEach(p=>{

const s = p.stats || {};

if(Number(s.rush_att || 0) <= 0) return;

const row = `
<tr>
<td class="team">
${makePlayerLink(p.player)}
</td>
<td>${s.rush_att || ""}</td>
<td>${s.rush_yds || ""}</td>
<td>${s.rush_td || ""}</td>
<td>${s.rush_long || ""}</td>
</tr>
`;

if(s.team === team1Code){
rushingHTML1 += row;
}

if(s.team === team2Code){
rushingHTML2 += row;
}

});

document.getElementById("rushingTable1").innerHTML =
rushingHTML1 || emptyRow(5);

document.getElementById("rushingTable2").innerHTML =
rushingHTML2 || emptyRow(5);

/* RECEIVING */

let receivingHTML1 = "";
let receivingHTML2 = "";

players.forEach(p=>{

const s = p.stats || {};

if(Number(s.rec || 0) <= 0) return;

const row = `
<tr>
<td class="team">
${makePlayerLink(p.player)}
</td>
<td>${s.rec || ""}</td>
<td>${s.rec_yds || ""}</td>
<td>${s.rec_td || ""}</td>
<td>${s.rec_long || ""}</td>
</tr>
`;

if(s.team === team1Code){
receivingHTML1 += row;
}

if(s.team === team2Code){
receivingHTML2 += row;
}

});

document.getElementById("receivingTable1").innerHTML =
receivingHTML1 || emptyRow(5);

document.getElementById("receivingTable2").innerHTML =
receivingHTML2 || emptyRow(5);

}

loadGame();

</script>

</body>
</html>
