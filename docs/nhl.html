  <link rel="stylesheet" href="style.css">
  <style>
  body{
    font-family:Inter,system-ui;

    background:#f4f6f8;
  }
  .page{
    max-width:1200px;
    margin:auto;

  .hero{
    background:linear-gradient(135deg,#041E42,#0072CE);
    color:white;
    padding:40px;
    border-radius:20px;
    margin-bottom:20px;
  }
  .hero h1{
    margin:0;

  }
  .hero p{
    margin:10px 0 0;
    font-size:18px;
    opacity:.9;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:15px;
  }
  .tile{
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
  }
  .tile:hover{

<body>
<div class="page">
  <div class="hero">
    <h1>NHL History & Records</h1>
    <p>National Hockey League seasons, results and Stanley Cup champions.</p>
  </div>
  <div id="seasons" class="grid">
    Loading seasons...
  </div>
</div>
<script>
async function loadSeasons(){
  const res = await fetch("/data/nhl/index.json");
  const seasons = await res.json();
  const container = document.getElementById("seasons");
  container.innerHTML="";
  seasons.reverse().forEach(season=>{
    const div=document.createElement("div");
    div.className="tile";
    div.innerText=season.season;
    div.onclick=()=>{
      location.href=`nhl-season.html?season=${season.season}`;
    };
    container.appendChild(div);
  });
}
loadSeasons();
</script>
