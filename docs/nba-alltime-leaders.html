<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Leaders Since 1976 | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#fff;color:#1f2937;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:700;background:#fff;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}
.page-wrap{max-width:1100px;margin:0 auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(90deg,#17408B,#C9082A);color:white;border-radius:16px;padding:26px;margin-bottom:25px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,0.08);}
.hero h1{margin:0 0 6px;font-size:32px;}
.subtitle{opacity:.9;font-size:15px;}
.controls{margin-bottom:25px;}
.mode-buttons,.stat-buttons{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
button{padding:9px 14px;border-radius:10px;border:1px solid #d1d5db;background:#f4f6f8;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;}
button:hover{background:#e8edf5;}
button.active{background:#17408B;color:#fff;border-color:#17408B;}
.table-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,0.05);}
table{width:100%;border-collapse:collapse;}
th,td{padding:11px 12px;border-bottom:1px solid #e5e7eb;}
th{background:#17408B;color:#fff;font-weight:700;text-align:left;font-size:14px;}
td{font-size:15px;}
tr:nth-child(even){background:#f8faff;}
tr:hover{background:#e9f0ff;}
.rank{width:60px;font-weight:700;}
.value{text-align:right;font-weight:700;color:#17408B;}
.player-link{color:#0056d6;font-weight:700;text-decoration:none;}
.player-link:hover{text-decoration:underline;}
.loading{padding:20px;text-align:center;color:#666;}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div class="page-wrap">
  <div class="hero">
    <h1>NBA Statistical Leaders</h1>
    <div class="subtitle">Since 1976 • Top 15 • Regular Season</div>
  </div>

  <div class="controls">
    <div class="mode-buttons">
      <button data-mode="totals" class="active">Totals</button>
      <button data-mode="per_game">Per Game</button>
      <button data-mode="per_36">Per 36 Min</button>
    </div>
    <div class="stat-buttons">
      <button data-stat="points" class="active">Points</button>
      <button data-stat="rebounds">Rebounds</button>
      <button data-stat="assists">Assists</button>
      <button data-stat="steals">Steals</button>
      <button data-stat="blocks">Blocks</button>
      <button data-stat="triple_doubles">Triple Doubles</button>
    </div>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th class="rank">Rank</th>
          <th>Player</th>
          <th>GP</th>
          <th class="value">Value</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="4" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

let data = null;
let mode = "totals";
let stat = "points";

const rowsEl       = document.getElementById("rows");
const modeButtons  = [...document.querySelectorAll(".mode-buttons button")];
const statButtons  = [...document.querySelectorAll(".stat-buttons button")];

function fixName(str){
  if(!str) return str;
  try{
    const bytes = new Uint8Array(str.length);
    for(let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const decoded = new TextDecoder('utf-8').decode(bytes);
    if(decoded.includes('\ufffd')) return str;
    return decoded;
  }catch(e){ return str; }
}

modeButtons.forEach(b => {
  b.addEventListener("click", () => {
    modeButtons.forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    mode = b.dataset.mode;
    // Hide triple doubles for per_game and per_36
    document.querySelector('[data-stat="triple_doubles"]').style.display =
      mode === "totals" ? "" : "none";
    if(mode !== "totals" && stat === "triple_doubles"){
      stat = "points";
      statButtons.forEach(x => x.classList.remove("active"));
      document.querySelector('[data-stat="points"]').classList.add("active");
    }
    render();
  });
});

statButtons.forEach(b => {
  b.addEventListener("click", () => {
    statButtons.forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    stat = b.dataset.stat;
    render();
  });
});

function render(){
  rowsEl.innerHTML = "";
  if(!data || !data[mode] || !data[mode][stat]){
    rowsEl.innerHTML = `<tr><td colspan="4" class="loading">No data available.</td></tr>`;
    return;
  }
  data[mode][stat].forEach((r, i) => {
    const tr = document.createElement("tr");
    const name = fixName(r.player);
    tr.innerHTML = `
      <td class="rank">${i+1}</td>
      <td><a class="player-link" href="/nba-player.html?id=${encodeURIComponent(r.player_id)}">${name}</a></td>
      <td>${r.gp}</td>
      <td class="value">${r.value}</td>
    `;
    rowsEl.appendChild(tr);
  });
}

async function load(){
  try{
    const res = await fetch(`${R2}/basketball/stat-leaders.json`);
    if(!res.ok) throw new Error("Not found");
    data = await res.json();
    render();
  }catch(e){
    rowsEl.innerHTML = `<tr><td colspan="4" class="loading">Unable to load data.</td></tr>`;
  }
}

load();
</script>
</body>
</html>
