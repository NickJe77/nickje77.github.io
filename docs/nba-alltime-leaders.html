<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Leaders Since 1976 | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#fff;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1100px;
margin:0 auto;
padding:30px 20px 60px;
}

h1{
text-align:center;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

.mode-buttons{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:18px;
flex-wrap:wrap;
}

.stat-buttons{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:25px;
flex-wrap:wrap;
}

button{
padding:8px 14px;
border-radius:8px;
border:1px solid #ccc;
background:#f5f5f5;
cursor:pointer;
font-size:14px;
}

button.active{
background:#222;
color:#fff;
border-color:#222;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:30px;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:left;
}

th{
background:#f0f0f0;
}

tr:nth-child(even){
background:#f6f9ff;
}

.player-link{
color:#0056d6;
font-weight:600;
text-decoration:none;
}

.player-link:hover{
text-decoration:underline;
}

.small{
color:#666;
font-size:13px;
}

.related{
border-top:1px solid #ddd;
padding-top:25px;
}

.related h3{
margin-bottom:10px;
}

.related ul{
padding-left:18px;
}

.related li{
margin-bottom:6px;
}

.related a{
color:#0056d6;
text-decoration:none;
}

.related a:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<h1>NBA Statistical Leaders</h1>
<div class="subtitle">Since 1976 • Top 15</div>

<div class="mode-buttons">
<button data-mode="totals" class="active">Totals</button>
<button data-mode="per_game">Per Game</button>
<button data-mode="per_36">Per 36</button>
</div>

<div class="stat-buttons">
<button data-stat="points" class="active">Points</button>
<button data-stat="rebounds">Rebounds</button>
<button data-stat="assists">Assists</button>
<button data-stat="steals">Steals</button>
<button data-stat="blocks">Blocks</button>
<button data-stat="triple_doubles">Triple Doubles</button>
</div>

<table>
<thead>
<tr>
<th>Rank</th>
<th>Player</th>
<th class="small">Value</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>


<div class="related">

<h3>Related Records</h3>

<ul>
<li><a href="nba-season-records.html?stat=points">Highest scoring seasons</a></li>
<li><a href="nba-game-records.html?stat=points">Most points in a game</a></li>
<li><a href="nba-50-point-games.html">Most 50-point games</a></li>
<li><a href="nba-playoff-records.html?stat=points">Most playoff points</a></li>
</ul>

</div>

</div>


<script>

let data=null
let mode="totals"
let stat="points"

const rows=document.getElementById("rows")

const modeButtons=[...document.querySelectorAll(".mode-buttons button")]
const statButtons=[...document.querySelectorAll(".stat-buttons button")]


fetch("data/nba/stat_leaders.json")
.then(r=>r.json())
.then(d=>{
data=d
render()
})
.catch(()=>{
rows.innerHTML="<tr><td colspan='3'>Unable to load data.</td></tr>"
})


modeButtons.forEach(b=>{
b.addEventListener("click",()=>{
modeButtons.forEach(x=>x.classList.remove("active"))
b.classList.add("active")
mode=b.dataset.mode
render()
})
})


statButtons.forEach(b=>{
b.addEventListener("click",()=>{
statButtons.forEach(x=>x.classList.remove("active"))
b.classList.add("active")
stat=b.dataset.stat
render()
})
})


function render(){

rows.innerHTML=""

if(!data || !data[mode] || !data[mode][stat]){
rows.innerHTML="<tr><td colspan='3'>No data available.</td></tr>"
return
}

data[mode][stat].forEach((r,i)=>{

const tr=document.createElement("tr")

const link=r.player
? `<a class="player-link" href="nba-player.html?player=${encodeURIComponent(r.player)}">${r.player}</a>`
: ""

tr.innerHTML=`
<td>${i+1}</td>
<td>${link}</td>
<td class="small">${r.value}</td>
`

rows.appendChild(tr)

})

}

</script>

</body>
</html>
