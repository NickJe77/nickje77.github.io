<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Leaders Since 1976 | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#ffffff;
color:#1f2937;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:700;
background:#fff;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.navbar a:hover{
text-decoration:underline;
}

.page-wrap{
max-width:1100px;
margin:0 auto;
padding:30px 20px 60px;
}

.hero{
background:linear-gradient(90deg,#17408B,#C9082A);
color:white;
border-radius:16px;
padding:26px 26px 22px;
margin-bottom:25px;
text-align:center;
box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.hero h1{
margin:0 0 6px;
font-size:32px;
}

.subtitle{
opacity:.9;
font-size:15px;
}

.controls{
margin-bottom:25px;
}

.mode-buttons,
.stat-buttons{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:14px;
flex-wrap:wrap;
}

button{
padding:9px 14px;
border-radius:10px;
border:1px solid #d1d5db;
background:#f4f6f8;
cursor:pointer;
font-size:14px;
font-weight:600;
transition:all .15s ease;
}

button:hover{
background:#e8edf5;
}

button.active{
background:#17408B;
color:#fff;
border-color:#17408B;
}

.table-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
overflow:hidden;
box-shadow:0 6px 16px rgba(0,0,0,0.05);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:11px 12px;
border-bottom:1px solid #e5e7eb;
}

th{
background:#17408B;
color:#fff;
font-weight:700;
text-align:left;
font-size:14px;
}

td{
font-size:15px;
}

tr:nth-child(even){
background:#f8faff;
}

tr:hover{
background:#e9f0ff;
}

.rank{
width:60px;
font-weight:700;
}

.value{
text-align:right;
font-weight:700;
color:#17408B;
}

.player-link{
color:#0056d6;
font-weight:700;
text-decoration:none;
}

.player-link:hover{
text-decoration:underline;
}

.related{
border-top:1px solid #e5e7eb;
margin-top:30px;
padding-top:22px;
}

.related h3{
margin-bottom:10px;
font-size:18px;
}

.related ul{
padding-left:18px;
}

.related li{
margin-bottom:6px;
}

.related a{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

.related a:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Statistical Leaders</h1>
<div class="subtitle">Since 1976 • Top 15</div>
</div>

<div class="controls">

<div class="mode-buttons">
<button data-mode="totals" class="active">Totals</button>
<button data-mode="per_game">Per Game</button>
<button data-mode="per_36">Per 36</button>
</div>

<div class="stat-buttons">
<button data-stat="points" class="active">Points</button>
<button data-stat="rebounds">Rebounds</button>
<button data-stat="assists">Assists</button>
<button data-stat="steals">Steals</button>
<button data-stat="blocks">Blocks</button>
<button data-stat="triple_doubles">Triple Doubles</button>
</div>

</div>

<div class="table-card">

<table>
<thead>
<tr>
<th class="rank">Rank</th>
<th>Player</th>
<th class="value">Value</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

</div>


<div class="related">

<h3>Related Records</h3>

<ul>
<li><a href="nba-season-records.html?stat=points">Highest scoring seasons</a></li>
<li><a href="nba-game-records.html?stat=points">Most points in a game</a></li>
<li><a href="nba-50-point-games.html">Most 50-point games</a></li>
<li><a href="nba-playoff-records.html?stat=points">Most playoff points</a></li>
</ul>

</div>

</div>


<script>

let data=null
let mode="totals"
let stat="points"

const rows=document.getElementById("rows")

const modeButtons=[...document.querySelectorAll(".mode-buttons button")]
const statButtons=[...document.querySelectorAll(".stat-buttons button")]


fetch("data/nba/stat_leaders.json")
.then(r=>r.json())
.then(d=>{
data=d
render()
})
.catch(()=>{
rows.innerHTML="<tr><td colspan='3'>Unable to load data.</td></tr>"
})


modeButtons.forEach(b=>{
b.addEventListener("click",()=>{
modeButtons.forEach(x=>x.classList.remove("active"))
b.classList.add("active")
mode=b.dataset.mode
render()
})
})


statButtons.forEach(b=>{
b.addEventListener("click",()=>{
statButtons.forEach(x=>x.classList.remove("active"))
b.classList.add("active")
stat=b.dataset.stat
render()
})
})


function render(){

rows.innerHTML=""

if(!data || !data[mode] || !data[mode][stat]){
rows.innerHTML="<tr><td colspan='3'>No data available.</td></tr>"
return
}

data[mode][stat].forEach((r,i)=>{

const tr=document.createElement("tr")

const link=r.player
? `<a class="player-link" href="nba-player.html?player=${encodeURIComponent(r.player)}">${r.player}</a>`
: ""

tr.innerHTML=`
<td class="rank">${i+1}</td>
<td>${link}</td>
<td class="value">${r.value}</td>
`

rows.appendChild(tr)

})

}

</script>

</body>
</html>
