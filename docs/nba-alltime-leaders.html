<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Leaders Since 1976 | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:28px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.subtitle{opacity:.68;font-size:13.5px;color:#fff;}

.controls{margin-bottom:22px;}
.mode-buttons,.stat-buttons{display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
button{
  padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);
  transition:all .15s;
}
button:hover{border-color:var(--faint);}
button.active{background:var(--board);color:#fff;border-color:var(--board);}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);}
th{
  background:#f7f9fb;color:var(--muted);font-weight:600;text-align:left;
  font-family:var(--body);font-size:11px;letter-spacing:.04em;text-transform:uppercase;
}
td{font-size:13.5px;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.rank{width:60px;font-weight:700;color:var(--ink);}
.value{text-align:right;font-weight:700;color:var(--accent);}
.player-link{color:var(--ink);font-weight:700;text-decoration:none;}
.player-link:hover{color:var(--accent);}
.loading{padding:20px;text-align:center;color:var(--muted);font-style:italic;}
</style>
</head>
<body>
<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>
<div class="page-wrap">
  <div class="hero">
    <span class="eyebrow">NBA</span>
    <h1>NBA Statistical Leaders</h1>
    <div class="subtitle">Since 1976 • Top 15 • Regular Season</div>
  </div>
  <div class="controls">
    <div class="mode-buttons">
      <button data-mode="totals" class="active">Totals</button>
      <button data-mode="per_game">Per Game</button>
      <button data-mode="per_36">Per 36 Min</button>
    </div>
    <div class="stat-buttons">
      <button data-stat="points" class="active">Points</button>
      <button data-stat="rebounds">Rebounds</button>
      <button data-stat="assists">Assists</button>
      <button data-stat="steals">Steals</button>
      <button data-stat="blocks">Blocks</button>
      <button data-stat="triple_doubles">Triple Doubles</button>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="rank">Rank</th>
          <th>Player</th>
          <th>GP</th>
          <th class="value">Value</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="4" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
let data = null;
let mode = "totals";
let stat = "points";
const rowsEl      = document.getElementById("rows");
const modeButtons = [...document.querySelectorAll(".mode-buttons button")];
const statButtons = [...document.querySelectorAll(".stat-buttons button")];

const NAME_FIX = {
  "doncilu01": "Luka Dončić",
  "jokicni01": "Nikola Jokić",
  "bogdaibo01": "Bogdan Bogdanović",
  "vucevni01": "Nikola Vučević",
  "porzikri01": "Kristaps Porziņģis",
  "nurkiju01": "Jusuf Nurkić",
  "saricda01": "Dario Šarić",
  "hezonja01": "Mario Hezonja",
  "sengunal01": "Alperen Şengün",
  "wembavi01": "Victor Wembanyama",
  "topicni01": "Nikola Topić",
  "zubaciv01": "Ivica Zubac",
};

function fixName(str, id){
  if(id && NAME_FIX[id]) return NAME_FIX[id];
  if(!str) return str;
  try{
    const bytes = new Uint8Array(str.length);
    for(let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const decoded = new TextDecoder('utf-8').decode(bytes);
    if(decoded.includes('\ufffd')) return str;
    return decoded;
  }catch(e){ return str; }
}

modeButtons.forEach(b => {
  b.addEventListener("click", () => {
    modeButtons.forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    mode = b.dataset.mode;
    document.querySelector('[data-stat="triple_doubles"]').style.display = mode === "totals" ? "" : "none";
    if(mode !== "totals" && stat === "triple_doubles"){
      stat = "points";
      statButtons.forEach(x => x.classList.remove("active"));
      document.querySelector('[data-stat="points"]').classList.add("active");
    }
    render();
  });
});

statButtons.forEach(b => {
  b.addEventListener("click", () => {
    statButtons.forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    stat = b.dataset.stat;
    render();
  });
});

function render(){
  rowsEl.innerHTML = "";
  if(!data || !data[mode] || !data[mode][stat]){
    rowsEl.innerHTML = `<tr><td colspan="4" class="loading">No data available.</td></tr>`;
    return;
  }
  data[mode][stat].forEach((r, i) => {
    const tr   = document.createElement("tr");
    const name = fixName(r.player, r.player_id);
    tr.innerHTML = `
      <td class="rank">${i+1}</td>
      <td><a class="player-link" href="/nba-player.html?id=${encodeURIComponent(r.player_id)}">${name}</a></td>
      <td>${r.gp}</td>
      <td class="value">${r.value}</td>
    `;
    rowsEl.appendChild(tr);
  });
}

async function load(){
  try{
    const res = await fetch(`${R2}/basketball/stat-leaders.json`);
    if(!res.ok) throw new Error("Not found");
    data = await res.json();
    render();
  }catch(e){
    rowsEl.innerHTML = `<tr><td colspan="4" class="loading">Unable to load data.</td></tr>`;
  }
}
load();
</script>
</body>
</html>
