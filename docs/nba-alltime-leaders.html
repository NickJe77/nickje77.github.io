<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA All-Time Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1100px;margin:0 auto;padding:30px 20px 60px;}
h1{text-align:center;margin:0 0 10px;}
p{text-align:center;color:#555;margin:0 0 18px;}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;}
button{padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#f5f5f5;cursor:pointer;font-size:14px;}
button.active{background:#222;color:#fff;border-color:#222;}
table{width:100%;border-collapse:collapse;}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
.player-link{color:#0056d6;text-decoration:none;font-weight:600;}
.player-link:hover{text-decoration:underline;}
.small{color:#666;font-size:13px;}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">
  <h1>NBA All-Time Leaders</h1>
  <p>Career totals (top lists) — buildable over time.</p>

  <div class="controls">
    <button data-stat="points" class="active">Points</button>
    <button data-stat="rebounds">Rebounds</button>
    <button data-stat="assists">Assists</button>
    <button data-stat="steals">Steals</button>
    <button data-stat="blocks">Blocks</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Player</th>
        <th class="small">Total</th>
        <th class="small">From–To</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
let data=null;
let current="points";
const rows=document.getElementById("rows");
const buttons=[...document.querySelectorAll("button")];

fetch("data/nba/all_time_leaders.json")
  .then(r=>r.json())
  .then(d=>{ data=d; render(); })
  .catch(()=>{ rows.innerHTML="<tr><td colspan='4'>No data available.</td></tr>"; });

buttons.forEach(b=>{
  b.addEventListener("click", ()=>{
    buttons.forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    current=b.dataset.stat;
    render();
  });
});

function render(){
  rows.innerHTML="";
  if(!data || !data[current]){
    rows.innerHTML="<tr><td colspan='4'>No data available.</td></tr>";
    return;
  }

  data[current].slice(0,50).forEach((r,i)=>{
    const link = r.player
      ? `<a class="player-link" href="nba-player.html?player=${encodeURIComponent(r.player)}">${r.player}</a>`
      : "";
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${i+1}</td>
      <td>${link}</td>
      <td class="small">${r.total ?? ""}</td>
      <td class="small">${r.from || ""}${(r.from||r.to) ? "–" : ""}${r.to || ""}</td>
    `;
    rows.appendChild(tr);
  });
}
</script>

</body>
</html>
