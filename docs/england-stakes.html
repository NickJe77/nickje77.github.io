<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>England Stakes Results | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="racing.css">
<link rel="stylesheet" href="archive.css">
</head>

<body class="archive-page">

<div class="filters-wrapper">
  <div id="resultCount">Results: 0</div>
  <pre id="debug" style="margin:20px;padding:12px;border:1px solid #ccc;"></pre>
</div>

<table>
  <tbody id="results-body"></tbody>
</table>

<script>
const COUNTRY = "England";
const debug = document.getElementById("debug");

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const lines = text.trim().replace(/\r/g,"").split("\n");
  const headers = lines[0].split(",").map(h=>h.trim());

  return lines.slice(1).map(line=>{
    const values = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    let obj = {};
    headers.forEach((h,i)=>{
      obj[h] = (values[i]||"").replace(/^"|"$/g,"").trim();
    });
    return obj;
  });
}

fetch("/docs/data/worldwide_stakes_races.csv")
  .then(r=>r.text())
  .then(text=>{
    const raw = parseCSV(text);

    debug.textContent =
      "Rows loaded: " + raw.length + "\n" +
      "First row keys: " + Object.keys(raw[0]).join(" | ") + "\n" +
      "First row COUNTRY value: [" + raw[0][Object.keys(raw[0])[0]] + "]";

    const filtered = raw.filter(r =>
      (r.COUNTRY || "").trim().toLowerCase().includes("england")
    );

    document.getElementById("resultCount").textContent =
      "Results: " + filtered.length;
  })
  .catch(err=>{
    debug.textContent = "ERROR: " + err;
  });
</script>

</body>
</html>
