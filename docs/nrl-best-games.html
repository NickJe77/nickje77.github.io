<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Best Individual Games | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c1118;
  --board-2:#141c26;
  --board-line:rgba(255,255,255,.10);
  --win:#ffffff;
  --lose:rgba(255,255,255,.42);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

.page{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero header (matches other pages) ───────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:22px 26px 26px;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);
  margin-bottom:8px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,38px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero .subtitle{opacity:.6;margin-top:8px;font-size:13.5px;font-weight:500;}

/* ── Controls ─────────────────────────────────────────── */
.controls{display:flex;justify-content:flex-end;margin-bottom:14px;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;
}
select:hover{border-color:var(--faint);}

.table-wrap{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;}
th{
  background:#f7f9fb;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
}
.numeric{text-align:center;}
td{color:#27313c;font-variant-numeric:tabular-nums;}
td strong{color:var(--ink);font-weight:700;}
tbody tr:hover{background:#f0f6ff;cursor:pointer;}

.loading{text-align:center;padding:40px;color:var(--muted);font-size:15px;}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">

  <div class="hero">
    <div class="eyebrow">NRL</div>
    <h1>Best Individual Games</h1>
    <div class="subtitle">Greatest single-game performances in NRL history</div>
  </div>

  <div class="controls">
    <select id="sortSelect">
      <option value="points_desc">Most Points</option>
      <option value="tries_desc">Most Tries</option>
      <option value="goals_desc">Most Goals</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Season</th>
          <th>Date</th>
          <th>Player</th>
          <th>Team</th>
          <th>Opponent</th>
          <th class="numeric">Tries</th>
          <th class="numeric">Goals</th>
          <th class="numeric">Points</th>
        </tr>
      </thead>
      <tbody id="gamesTable">
        <tr><td colspan="8" class="loading">Loading performances...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>

const startYear = 1998;
const currentYear = new Date().getFullYear();
let allPerformances = [];

// season files store full ISO timestamps for recent games — show just the date
function fmtDate(d){ return d ? String(d).split("T")[0] : ""; }

// FIX: the raw per-player "points" field in the data isn't reliable (it can
// read 0 even when tries/conversions are present), so recompute it from the
// scoring components instead, using standard NRL scoring values.
function computePoints(pl){
  const tries        = pl.tries         || 0;
  const conversions  = pl.conversions   || 0;
  const penaltyGoals = pl.penalty_goals || 0;
  const fieldGoals   = pl.field_goals   || 0;
  return tries*4 + conversions*2 + penaltyGoals*2 + fieldGoals*1;
}

async function loadAllSeasons(){

  let files = [];
  for(let y = startYear; y <= currentYear; y++){
    files.push(`/data/nrl/seasons/${y}.json`);
  }

  const responses = await Promise.all(
    files.map(file =>
      fetch(file)
        .then(res => res.ok ? res.json() : null)
        .catch(() => null)
    )
  );

  responses.forEach(seasonData => {

    if(!seasonData || !Array.isArray(seasonData)) return;

    // each entry is a MATCH; the per-player rows live in match.players[]
    seasonData.forEach(match => {

      const players = match.players || [];
      players.forEach(pl => {

        const team     = pl.played_for;
        // no played_against in the data — derive the opponent from the match teams
        const opponent = team === match.home_team ? match.away_team : match.home_team;
        // "goals" = 2-point kicks (conversions + penalty goals)
        const goals    = (pl.conversions || 0) + (pl.penalty_goals || 0);

        allPerformances.push({
          season:   match.season,
          date:     match.date,
          match_id: match.match_id,
          player:   pl.player,
          team:     team,
          opponent: opponent,
          tries:    pl.tries  || 0,
          goals:    goals,
          points:   computePoints(pl)
        });

      });

    });

  });

  sortPerformances("points_desc");
}

function sortPerformances(type){

  if(type === "points_desc"){
    allPerformances.sort((a,b)=>b.points - a.points || b.tries - a.tries);
  }
  if(type === "tries_desc"){
    allPerformances.sort((a,b)=>b.tries - a.tries || b.points - a.points);
  }
  if(type === "goals_desc"){
    allPerformances.sort((a,b)=>b.goals - a.goals || b.points - a.points);
  }

  renderTable();
}

function renderTable(){

  const tbody = document.getElementById("gamesTable");
  tbody.innerHTML = "";

  allPerformances.slice(0,200).forEach(p => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${p.season}</td>
      <td>${fmtDate(p.date)}</td>
      <td>${p.player}</td>
      <td>${p.team}</td>
      <td>${p.opponent}</td>
      <td class="numeric">${p.tries}</td>
      <td class="numeric">${p.goals}</td>
      <td class="numeric"><strong>${p.points}</strong></td>
    `;

    tr.onclick = () => {
      window.location.href =
        `nrl-game.html?season=${p.season}&match=${p.match_id}`;
    };

    tbody.appendChild(tr);
  });

}

document.getElementById("sortSelect").addEventListener("change", e=>{
  sortPerformances(e.target.value);
});

loadAllSeasons();

</script>

</body>
</html>
