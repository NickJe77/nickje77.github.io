<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Best Individual Games | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --nrl-green:#00543C;
  --nrl-dark:#002f26;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#111;
  --line:#e5e7eb;
}
body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text);}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,var(--nrl-dark),var(--nrl-green));color:white;padding:40px;border-radius:18px;margin-bottom:20px;}
.hero h1{margin:0;font-size:42px;}
.subtitle{opacity:.85;margin-top:6px;}
.controls{display:flex;justify-content:flex-end;margin-bottom:14px;}
select{padding:10px;border-radius:8px;border:1px solid #ccc;font-size:14px;}
.table-wrap{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.05);}
table{width:100%;border-collapse:collapse;}
th, td{padding:14px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;}
th{background:#fafafa;font-weight:700;}
.numeric{text-align:center;}
tr:hover{background:#f0f9f6;cursor:pointer;}
.loading{text-align:center;padding:40px;font-size:18px;}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">

  <div class="hero">
    <h1>NRL Best Individual Games</h1>
    <div class="subtitle">Greatest single-game performances in NRL history</div>
  </div>

  <div class="controls">
    <select id="sortSelect">
      <option value="points_desc">Most Points</option>
      <option value="tries_desc">Most Tries</option>
      <option value="goals_desc">Most Goals</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Season</th>
          <th>Date</th>
          <th>Player</th>
          <th>Team</th>
          <th>Opponent</th>
          <th class="numeric">Tries</th>
          <th class="numeric">Goals</th>
          <th class="numeric">Points</th>
        </tr>
      </thead>
      <tbody id="gamesTable">
        <tr><td colspan="8" class="loading">Loading performances...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>

const startYear = 1998;
const currentYear = new Date().getFullYear();
let allPerformances = [];

// season files store full ISO timestamps for recent games — show just the date
function fmtDate(d){ return d ? String(d).split("T")[0] : ""; }

async function loadAllSeasons(){

  let files = [];
  for(let y = startYear; y <= currentYear; y++){
    files.push(`/data/nrl/seasons/${y}.json`);
  }

  const responses = await Promise.all(
    files.map(file =>
      fetch(file)
        .then(res => res.ok ? res.json() : null)
        .catch(() => null)
    )
  );

  responses.forEach(seasonData => {

    if(!seasonData || !Array.isArray(seasonData)) return;

    // each entry is a MATCH; the per-player rows live in match.players[]
    seasonData.forEach(match => {

      const players = match.players || [];
      players.forEach(pl => {

        const team     = pl.played_for;
        // no played_against in the data — derive the opponent from the match teams
        const opponent = team === match.home_team ? match.away_team : match.home_team;
        // "goals" = 2-point kicks (conversions + penalty goals)
        const goals    = (pl.conversions || 0) + (pl.penalty_goals || 0);

        allPerformances.push({
          season:   match.season,
          date:     match.date,
          match_id: match.match_id,
          player:   pl.player,
          team:     team,
          opponent: opponent,
          tries:    pl.tries  || 0,
          goals:    goals,
          points:   pl.points || 0
        });

      });

    });

  });

  sortPerformances("points_desc");
}

function sortPerformances(type){

  if(type === "points_desc"){
    allPerformances.sort((a,b)=>b.points - a.points || b.tries - a.tries);
  }
  if(type === "tries_desc"){
    allPerformances.sort((a,b)=>b.tries - a.tries || b.points - a.points);
  }
  if(type === "goals_desc"){
    allPerformances.sort((a,b)=>b.goals - a.goals || b.points - a.points);
  }

  renderTable();
}

function renderTable(){

  const tbody = document.getElementById("gamesTable");
  tbody.innerHTML = "";

  allPerformances.slice(0,200).forEach(p => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${p.season}</td>
      <td>${fmtDate(p.date)}</td>
      <td>${p.player}</td>
      <td>${p.team}</td>
      <td>${p.opponent}</td>
      <td class="numeric">${p.tries}</td>
      <td class="numeric">${p.goals}</td>
      <td class="numeric"><strong>${p.points}</strong></td>
    `;

    tr.onclick = () => {
      window.location.href =
        `nrl-game.html?season=${p.season}&match=${p.match_id}`;
    };

    tbody.appendChild(tr);
  });

}

document.getElementById("sortSelect").addEventListener("change", e=>{
  sortPerformances(e.target.value);
});

loadAllSeasons();

</script>

</body>
</html>
