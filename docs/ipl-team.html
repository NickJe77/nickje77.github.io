<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:46px;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:12px 14px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="teamName">Team</h1>
</div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Opponent</th>
  <th>Venue</th>
  <th>Result</th>
</tr>
</thead>
<tbody id="matchesTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const team = params.get("team");

const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";

document.getElementById("teamName").textContent = team || "Team";

fetch(indexUrl)
  .then(r=>r.json())
  .then(files=>Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json()))))
  .then(seasons=>{
    const tableBody = document.getElementById("matchesTable");
    tableBody.innerHTML = "";

    seasons.forEach(matches=>{
      if(!Array.isArray(matches)) return;

      matches.forEach(match=>{
        const info = match.info;
        if(!info || !info.teams || info.teams.length < 2) return;

        if(!info.teams.includes(team)) return;

        const opponent = info.teams.find(t=>t!==team);
        const winner = info.outcome?.winner || "";
        let result = "No result";

        if(winner){
          result = winner === team ? "Won" : "Lost";
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${formatDate(info.dates[0])}</td>
          <td>${opponent}</td>
          <td>${info.venue || ""}</td>
          <td>${result}</td>
        `;
        tableBody.appendChild(tr);
      });
    });
  });

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
</script>

</body>
</html>
