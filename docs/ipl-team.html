<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:white;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:35px 40px;
  border-radius:22px;
  margin-bottom:25px;
}
.hero h1{
  margin:0;
  font-size:42px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}
th,td{
  padding:10px 12px;
  border-bottom:1px solid #ddd;
  text-align:left;
}
th{
  background:#f3f6fb;
}
tr:nth-child(even){
  background:#f8fbff;
}
.winner{
  font-weight:600;
  color:#1a7f37;
}
.loser{
  color:#b91c1c;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="ipl.html">IPL Hub</a>
  <a href="ipl-teams.html">Teams</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="teamName">Team</h1>
</div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Opponent</th>
  <th>Venue</th>
  <th>Result</th>
</tr>
</thead>
<tbody id="matchesTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const team = params.get("team");

document.getElementById("teamName").textContent = team;

const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const tableBody = document.getElementById("matchesTable");

fetch(indexUrl)
  .then(r=>r.json())
  .then(files=>{
    return Promise.all(
      files.map(f => fetch(basePath + f).then(r => r.json()))
    );
  })
  .then(seasons=>{
    let allMatches = [];

    seasons.forEach(season=>{
      season.forEach(match=>{
        if(match.teams && match.teams.includes(team)){
          allMatches.push(match);
        }
      });
    });

    allMatches.sort((a,b)=>new Date(b.date) - new Date(a.date));

    allMatches.forEach(m=>{
      const opponent = m.teams.find(t => t !== team) || "";
      const result = m.outcome?.winner === team ? "Won" : "Lost";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${formatDate(m.date)}</td>
        <td>${opponent}</td>
        <td>${m.venue || ""}</td>
        <td class="${result === "Won" ? "winner" : "loser"}">${result}</td>
      `;
      tableBody.appendChild(tr);
    });
  });

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}
</script>

</body>
</html>
