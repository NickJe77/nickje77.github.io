<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

.filter-bar{
  margin-bottom:20px;
  display:flex;
  gap:12px;
  align-items:center;
}
.filter-bar select{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.stat{
  background:#f4efff;
  border:1px solid #ddd;
  border-radius:16px;
  padding:20px;
  text-align:center;
}
.stat h3{margin:0;font-size:28px;color:#3b007a;}
.stat span{display:block;margin-top:6px;color:#555;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:10px 12px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}

.result-win{color:#1a7f37;font-weight:600;}
.result-loss{color:#b42318;font-weight:600;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="teamName">Team</h1>
  <p>Indian Premier League team history</p>
</div>

<div class="filter-bar">
  <label for="seasonSelect"><strong>Season:</strong></label>
  <select id="seasonSelect">
    <option value="all">All seasons</option>
  </select>
</div>

<div class="stat-grid">
  <div class="stat"><h3 id="titles">0</h3><span>Titles</span></div>
  <div class="stat"><h3 id="matches">0</h3><span>Matches</span></div>
  <div class="stat"><h3 id="wins">0</h3><span>Wins</span></div>
  <div class="stat"><h3 id="losses">0</h3><span>Losses</span></div>
  <div class="stat"><h3 id="winPct">0%</h3><span>Win %</span></div>
</div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Opponent</th>
  <th>Result</th>
  <th>Venue</th>
</tr>
</thead>
<tbody id="matchesTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const params = new URLSearchParams(window.location.search);
const requestedTeam = params.get("team");

const teamMap = {
  "Royal Challengers": "Royal Challengers Bengaluru",
  "Royal Challengers Bangalore": "Royal Challengers Bengaluru",
  "Rising Pune Supergiants": "Rising Pune Supergiant",
  "Rising Pune Supergiant": "Rising Pune Supergiant",
  "Rising Challengers": "Rising Pune Supergiant"
};

function normalizeTeam(name){
  return teamMap[name] || name;
}

document.getElementById("teamName").textContent = requestedTeam || "Team";

let allMatches = [];
let seasonSet = new Set();
let titlesBySeason = {};

fetch(indexUrl)
  .then(r=>r.json())
  .then(files=>Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json()))))
  .then(seasons=>{
    seasons.forEach(matches=>{
      if(!matches.length) return;

      matches.sort((a,b)=>new Date(b.date)-new Date(a.date));
      const finalMatch = matches[0];
      const seasonYear = finalMatch.date.slice(0,4);
      const winner = normalizeTeam(finalMatch?.outcome?.winner || "");

      if(winner === requestedTeam){
        titlesBySeason[seasonYear] = 1;
      }

      matches.forEach(m=>{
        const teams = m.teams?.map(normalizeTeam) || [];
        if(!teams.includes(requestedTeam)) return;

        const opponent = teams.find(t=>t!==requestedTeam) || "";
        const winTeam = normalizeTeam(m.outcome?.winner || "");

        let result = "—";
        if(winTeam === requestedTeam) result = "Win";
        else if(winTeam === opponent) result = "Loss";

        const season = m.date?.slice(0,4) || "";
        seasonSet.add(season);

        allMatches.push({
          date: m.date,
          season,
          opponent,
          result,
          venue: m.venue || ""
        });
      });
    });

    const seasonSelect = document.getElementById("seasonSelect");
    Array.from(seasonSet).sort((a,b)=>b-a).forEach(y=>{
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      seasonSelect.appendChild(opt);
    });

    seasonSelect.addEventListener("change", renderTable);
    renderTable();
  });

function renderTable(){
  const season = document.getElementById("seasonSelect").value;
  const tbody = document.getElementById("matchesTable");
  tbody.innerHTML = "";

  let filtered = allMatches;
  let titlesCount = 0;

  if(season !== "all"){
    filtered = allMatches.filter(m=>m.season === season);
    titlesCount = titlesBySeason[season] || 0;
  } else {
    titlesCount = Object.values(titlesBySeason).length;
  }

  filtered.sort((a,b)=>new Date(b.date)-new Date(a.date));

  let wins = filtered.filter(m=>m.result==="Win").length;
  let losses = filtered.filter(m=>m.result==="Loss").length;
  let total = filtered.length;
  let winPct = total ? ((wins/total)*100).toFixed(1) : "0.0";

  document.getElementById("titles").textContent = titlesCount;
  document.getElementById("matches").textContent = total;
  document.getElementById("wins").textContent = wins;
  document.getElementById("losses").textContent = losses;
  document.getElementById("winPct").textContent = winPct + "%";

  filtered.forEach(m=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${m.date}</td>
      <td>${m.opponent}</td>
      <td class="${m.result==="Win"?"result-win":"result-loss"}">${m.result}</td>
      <td>${m.venue}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>

</body>
</html>
