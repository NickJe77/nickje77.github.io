<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:18px;opacity:0.95;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:12px 14px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
tr:hover{background:#eef4ff;}

.match-link{
  color:inherit;
  text-decoration:none;
  display:block;
  width:100%;
}
.match-link:hover{ text-decoration:underline; }

.badge{
  display:inline-block;
  padding:2px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  border:1px solid #ddd;
  background:#fff;
}
.badge.win{ color:#1a7f37; }
.badge.loss{ color:#b42318; }
.badge.nr{ color:#555; }

.note{
  color:#666;
  margin:10px 0 0;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="teamName">Team</h1>
  <p class="note">Click any match to open the full scorecard.</p>
</div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Opponent</th>
  <th>Venue</th>
  <th>Result</th>
</tr>
</thead>
<tbody id="matchesTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const team = params.get("team");

const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";

document.getElementById("teamName").textContent = team || "Team";

fetch(indexUrl)
  .then(r => r.json())
  .then(files => Promise.all(files.map(f => fetch(basePath + f).then(r => r.json()))))
  .then(seasons => {
    const rows = [];

    seasons.forEach(matches => {
      if(!Array.isArray(matches)) return;

      matches.forEach(m => {
        const info = m?.info;
        if(!info || !Array.isArray(info.teams) || info.teams.length < 2) return;
        if(!info.teams.includes(team)) return;

        const opponent = info.teams.find(t => t !== team) || "";
        const date = info.dates?.[0] || "";
        const venue = info.venue || "";
        const winner = info.outcome?.winner || "";

        let resultText = "No result";
        let resultClass = "nr";
        if(winner){
          if(winner === team){ resultText = "Won"; resultClass = "win"; }
          else { resultText = "Lost"; resultClass = "loss"; }
        }

        rows.push({
          date,
          opponent,
          venue,
          file: m.file || "",
          resultText,
          resultClass
        });
      });
    });

    // Sort newest first (safe sort even if date missing)
    rows.sort((a,b) => new Date(b.date || "1900-01-01") - new Date(a.date || "1900-01-01"));

    const tableBody = document.getElementById("matchesTable");
    tableBody.innerHTML = "";

    rows.forEach(r => {
      const link = r.file ? `ipl-match.html?file=${encodeURIComponent(r.file)}` : "#";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <a class="match-link" href="${link}">${formatDate(r.date)}</a>
        </td>
        <td>
          <a class="match-link" href="${link}">${escapeHtml(r.opponent)}</a>
        </td>
        <td>
          <a class="match-link" href="${link}">${escapeHtml(r.venue)}</a>
        </td>
        <td>
          <a class="match-link" href="${link}">
            <span class="badge ${r.resultClass}">${r.resultText}</span>
          </a>
        </td>
      `;
      tableBody.appendChild(tr);
    });
  })
  .catch(err => {
    console.error(err);
  });

function formatDate(d){
  if(!d) return "—";
  const dt = new Date(d);
  if(isNaN(dt)) return "—";
  return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

function escapeHtml(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
