<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>IPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --win:#1e7a3d;
  --loss:#b42318;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:26px 20px 70px;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:32px 34px;
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.eyebrow{
  display:block;
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(28px,5vw,40px);
  letter-spacing:.01em;
  text-transform:uppercase;
}
.note{
  margin:10px 0 0;
  font-size:14px;
  color:rgba(255,255,255,.75);
  font-weight:600;
}

/* ── Table ────────────────────────────────────────────── */
table{
  width:100%;
  border-collapse:collapse;
  font-size:13.5px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}
th,td{
  border-bottom:1px solid var(--line);
  padding:0;
  text-align:left;
}
th{
  background:#f7f9fb;
  color:var(--muted);
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  padding:11px 14px;
}
td{
  color:#27313c;
  font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f0f6ff;}

.match-link{
  color:inherit;
  text-decoration:none;
  display:block;
  width:100%;
  padding:11px 14px;
  box-sizing:border-box;
}

.badge{
  display:inline-block;
  padding:3px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  border:1px solid var(--line);
  background:var(--surface);
}
.badge.win{ color:var(--win); border-color:var(--win); }
.badge.loss{ color:var(--loss); border-color:var(--loss); }
.badge.nr{ color:var(--muted); }
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <span class="eyebrow">Cricket · IPL</span>
  <h1 id="teamName">Team</h1>
  <p class="note">Click any match to open the full scorecard.</p>
</div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Opponent</th>
  <th>Venue</th>
  <th>Result</th>
</tr>
</thead>
<tbody id="matchesTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const team = params.get("team");

const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";

document.getElementById("teamName").textContent = team || "Team";

fetch(indexUrl)
  .then(r => r.json())
  .then(files => Promise.all(files.map(f => fetch(basePath + f).then(r => r.json()))))
  .then(seasons => {
    const rows = [];

    seasons.forEach(matches => {
      if(!Array.isArray(matches)) return;

      matches.forEach(m => {
        const info = m?.info;
        if(!info || !Array.isArray(info.teams) || info.teams.length < 2) return;
        if(!info.teams.includes(team)) return;

        const opponent = info.teams.find(t => t !== team) || "";
        const date = info.dates?.[0] || "";
        const venue = info.venue || "";
        const winner = info.outcome?.winner || "";

        let resultText = "No result";
        let resultClass = "nr";
        if(winner){
          if(winner === team){ resultText = "Won"; resultClass = "win"; }
          else { resultText = "Lost"; resultClass = "loss"; }
        }

        rows.push({
          date,
          opponent,
          venue,
          file: m.file || "",
          resultText,
          resultClass
        });
      });
    });

    // Sort newest first (safe sort even if date missing)
    rows.sort((a,b) => new Date(b.date || "1900-01-01") - new Date(a.date || "1900-01-01"));

    const tableBody = document.getElementById("matchesTable");
    tableBody.innerHTML = "";

    rows.forEach(r => {
      const link = r.file ? `ipl-match.html?file=${encodeURIComponent(r.file)}` : "#";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <a class="match-link" href="${link}">${formatDate(r.date)}</a>
        </td>
        <td>
          <a class="match-link" href="${link}">${escapeHtml(r.opponent)}</a>
        </td>
        <td>
          <a class="match-link" href="${link}">${escapeHtml(r.venue)}</a>
        </td>
        <td>
          <a class="match-link" href="${link}">
            <span class="badge ${r.resultClass}">${r.resultText}</span>
          </a>
        </td>
      `;
      tableBody.appendChild(tr);
    });
  })
  .catch(err => {
    console.error(err);
  });

function formatDate(d){
  if(!d) return "—";
  const dt = new Date(d);
  if(isNaN(dt)) return "—";
  return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

function escapeHtml(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
