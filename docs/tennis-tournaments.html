<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Tournaments | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:var(--body);
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:15px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
  flex-wrap:wrap;
}

.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}

.navbar a:hover,.navbar a.active{
  opacity:1;
  color:var(--accent);
}

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:40px 20px;
  text-align:center;
}

.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(26px,5vw,38px);
  letter-spacing:.01em;
  text-transform:uppercase;
}

.hero p{
  margin-top:8px;
  font-size:14px;
  color:rgba(255,255,255,.68);
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:26px 20px 70px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:22px;
}

select,input{
  padding:11px 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  font-family:var(--body);
  font-size:13.5px;
  font-weight:600;
  color:var(--ink);
}

select:hover,input:hover{border-color:var(--faint);}
select:focus,input:focus{outline:none;border-color:var(--accent);}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:var(--accent);
}

.event-name{
  font-family:var(--display);
  font-size:17px;
  font-weight:600;
  margin-bottom:10px;
  color:var(--ink);
}

.pill{
  display:inline-block;
  padding:5px 12px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--ink);
  font-size:11px;
  font-weight:700;
}

.empty-state{
  grid-column:1 / -1;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:24px;
  color:var(--muted);
  text-align:center;
  font-weight:600;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr;}
  .controls{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
<a href="nba.html">NBA</a>
<a href="nhl.html">NHL</a>
<a href="ufc.html">UFC</a>
<a href="nfl.html">NFL</a>
<a href="tennis.html">Tennis</a>
<a href="tennis-tournaments.html" class="active">Tournaments</a>
</nav>

<header class="hero">
<h1>Tournaments</h1>
<p>Browse all ATP &amp; WTA events by season</p>
</header>

<div class="wrap">

<div class="controls">
<select id="yearSelect"></select>
<input id="searchInput" placeholder="Search tournaments">
<select id="surfaceSelect">
<option value="all">All Surfaces</option>
</select>
</div>

<div id="grid" class="grid"></div>

</div>

<script>
const yearSelect = document.getElementById("yearSelect");
const grid = document.getElementById("grid");

let rawEvents = [];

// YEARS
for(let y=new Date().getFullYear(); y>=1968; y--){
  let o=document.createElement("option");
  o.value=y;
  o.textContent=y;
  yearSelect.appendChild(o);
}

// LOAD YEAR
async function loadYear(year){
  let data = [];

  try{
    let res = await fetch(`/data/tennis/seasons/${year}.json`);
    if(!res.ok){
      res = await fetch(`/docs/data/tennis/seasons/${year}.json`);
    }
    if(!res.ok){
      rawEvents = [];
      populateSurface();
      applyFilters();
      return;
    }
    data = await res.json();
  }catch(err){
    rawEvents = [];
    populateSurface();
    applyFilters();
    return;
  }

  const matches = Array.isArray(data) ? data : (data.matches || []);
  const map = {};

  matches.forEach(m=>{
    if(!m.score || !m.score.includes("-")) return;

    const name = (m.tournament || m.event || "Unknown").trim();

    // remove Davis Cup from this page
    if(name.toLowerCase().includes("davis cup")) return;

    const surface = (m.surface || "").trim();
    const date = m.date || "";

    if(!map[name]){
      map[name] = {name, surface, year, date};
    }else{
      if(date && (!map[name].date || date < map[name].date)){
        map[name].date = date;
      }
    }
  });

  rawEvents = Object.values(map).sort((a,b)=>{
    if(!a.date) return 1;
    if(!b.date) return -1;
    return new Date(a.date) - new Date(b.date);
  });

  populateSurface();
  applyFilters();
}

// SURFACE FILTER
function populateSurface(){
  const surfaces = [...new Set(rawEvents.map(e=>e.surface).filter(Boolean))].sort();

  const select = document.getElementById("surfaceSelect");
  select.innerHTML = '<option value="all">All Surfaces</option>';

  surfaces.forEach(s=>{
    const opt=document.createElement("option");
    opt.value=s;
    opt.textContent=s;
    select.appendChild(opt);
  });
}

// FILTERS
function applyFilters(){
  const q = document.getElementById("searchInput").value.toLowerCase();
  const surface = document.getElementById("surfaceSelect").value;

  const filtered = rawEvents.filter(e=>{
    const matchSearch = !q || e.name.toLowerCase().includes(q);
    const matchSurface = surface==="all" || e.surface===surface;
    return matchSearch && matchSurface;
  });

  render(filtered);
}

// RENDER
function render(events){
  grid.innerHTML = "";

  if(!events.length){
    grid.innerHTML = `<div class="empty-state">No tournaments found for this year.</div>`;
    return;
  }

  events.forEach(e => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="event-name">${e.name}</div>
      <div class="pill">${e.surface || ""}</div>
    `;

    card.onclick = () => {
      window.location = `tennis-event.html?tournament=${encodeURIComponent(e.name)}&year=${e.year}`;
    };

    grid.appendChild(card);
  });
}

// EVENTS
yearSelect.onchange = ()=>loadYear(yearSelect.value);
document.getElementById("searchInput").oninput = applyFilters;
document.getElementById("surfaceSelect").onchange = applyFilters;

// INIT
yearSelect.value = new Date().getFullYear();
loadYear(yearSelect.value);
</script>

</body>
</html>
