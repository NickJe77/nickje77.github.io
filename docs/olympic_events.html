<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Olympic Events | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: system-ui, Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}

/* NAV */
.navbar{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:#111;
}
.navbar a{
    color:white;
    text-decoration:none;
    font-weight:600;
}

/* HERO */
.hero{
    background:linear-gradient(90deg,#0085C7,#F4C300,#000,#009F3D,#DF0024);
    color:white;
    text-align:center;
    padding:30px 10px;
}
.hero h1{
    margin:0;
}

/* CONTENT */
.container{
    max-width:1100px;
    margin:20px auto;
    padding:10px;
}

/* FILTERS */
.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}
select{
    padding:6px;
}

/* EVENTS */
.event{
    background:white;
    margin-bottom:12px;
    padding:12px;
    border-radius:10px;
}

.event h3{
    margin:0 0 8px 0;
}

.medals{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.medal{
    flex:1;
    min-width:200px;
    padding:8px;
    border-radius:6px;
    background:#f2f2f2;
}

.gold{border-left:5px solid gold;}
.silver{border-left:5px solid silver;}
.bronze{border-left:5px solid #cd7f32;}

</style>
</head>

<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/olympics.html">Olympics</a>
</div>

<div class="hero">
    <h1>Olympic Events</h1>
    <p>Results by Event</p>
</div>

<div class="container">

<div class="controls">
    <select id="year"></select>
    <select id="sport"></select>
</div>

<div id="events"></div>

</div>

<script>

let data = [];

async function load(){
    const res = await fetch("data/olympics/olympic_events.json");
    data = await res.json();

    buildFilters();
    render();
}

function buildFilters(){
    const years = [...new Set(data.map(d=>d.year))].sort((a,b)=>b-a);
    const sports = [...new Set(data.map(d=>d.sport))].sort();

    const yearSelect = document.getElementById("year");
    const sportSelect = document.getElementById("sport");

    yearSelect.innerHTML = '<option value="">All Years</option>';
    sportSelect.innerHTML = '<option value="">All Sports</option>';

    years.forEach(y=>{
        yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
    });

    sports.forEach(s=>{
        sportSelect.innerHTML += `<option value="${s}">${s}</option>`;
    });

    yearSelect.addEventListener("change", render);
    sportSelect.addEventListener("change", render);
}

function render(){
    const year = document.getElementById("year").value;
    const sport = document.getElementById("sport").value;

    let filtered = data;

    if(year) filtered = filtered.filter(d=>d.year == year);
    if(sport) filtered = filtered.filter(d=>d.sport == sport);

    const container = document.getElementById("events");
    container.innerHTML = "";

    filtered.forEach(e=>{
        const div = document.createElement("div");
        div.className = "event";

        div.innerHTML = `
            <h3>${e.year} – ${e.event}</h3>
            <div>${e.sport}</div>

            <div class="medals">
                <div class="medal gold">
                    <b>Gold</b><br>${(e.gold || []).join("<br>")}
                </div>
                <div class="medal silver">
                    <b>Silver</b><br>${(e.silver || []).join("<br>")}
                </div>
                <div class="medal bronze">
                    <b>Bronze</b><br>${(e.bronze || []).join("<br>")}
                </div>
            </div>
        `;

        container.appendChild(div);
    });
}

load();

</script>

</body>
</html>
