<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Rugby Union | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8J9ZPKDDH"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N8J9ZPKDDH');</script>
  <link rel="stylesheet" href="style.css">
  <style>
  body{font-family:Inter,system-ui,-apple-system,sans-serif;margin:0;background:#f4f6f8;color:#111;}
  .navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;position:sticky;top:0;z-index:100;}
  .navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
  .navbar a:hover{text-decoration:underline;}
  .hero{background:linear-gradient(135deg,#1a3a1a,#2d7a2d);color:white;padding:70px 20px 56px;text-align:center;}
  .hero h1{margin:0;font-size:72px;font-weight:900;letter-spacing:-3px;line-height:1;}
  .hero p{margin:14px 0 0;font-size:19px;opacity:.88;font-weight:600;}
  .page-wrap{max-width:1200px;margin:0 auto;padding:40px 20px 60px;}
  .comp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:40px;}
  .comp-tile{background:white;border-radius:18px;padding:28px 24px;text-decoration:none;color:#111;box-shadow:0 3px 12px rgba(0,0,0,.07);transition:.2s;border-top:5px solid #2d7a2d;display:block;}
  .comp-tile:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.13);}
  .comp-tile h2{margin:0 0 8px;font-size:19px;font-weight:900;}
  .comp-tile p{margin:0;font-size:13px;color:#666;}
  .section{background:white;border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:24px;}
  .section-title{font-size:18px;font-weight:900;margin:0 0 18px;border-left:5px solid #2d7a2d;padding-left:12px;color:#111;}
  .match-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:10px;background:#f8f9fb;margin-bottom:8px;text-decoration:none;color:#111;transition:.15s;}
  .match-row:hover{background:#e8f5e8;}
  .match-teams{font-weight:800;font-size:15px;}
  .match-score{font-size:15px;font-weight:900;color:#2d7a2d;}
  .match-meta{font-size:12px;color:#888;margin-top:3px;}
  .match-date{font-size:13px;font-weight:700;color:#2d7a2d;white-space:nowrap;}
  .loading{text-align:center;padding:40px;color:#888;font-weight:700;}
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="rugby.html">Rugby Union</a>
  <a href="rugby-players.html">Players</a>
</div>

<div class="hero">
  <h1>Rugby Union</h1>
  <p>World Cup, Six Nations, Super Rugby and more — every match from 1978</p>
</div>

<div class="page-wrap">
  <div class="comp-grid" id="compGrid"><div class="loading">Loading...</div></div>

  <div class="section">
    <div class="section-title">Recent Results</div>
    <div id="recentMatches"><div class="loading">Loading...</div></div>
  </div>
</div>

<script>
var COMP_COLOURS = {
  "164205": "#8B0000",
  "180659": "#003087",
  "244293": "#1a1a1a",
  "242041": "#00529b",
  "267979": "#6f1a35",
  "270557": "#1d4f91",
  "271937": "#c8102e",
};

fetch('/data/rugby/index.json')
  .then(function(r){ return r.json(); })
  .then(function(comps){
    document.getElementById('compGrid').innerHTML = comps.map(function(c){
      var colour = COMP_COLOURS[c.id] || '#2d7a2d';
      return '<a class="comp-tile" href="/rugby-competition.html?id='+c.id+'" style="border-top-color:'+colour+'">'+
        '<h2>'+c.name+'</h2>'+
        '<p>View all seasons and results</p>'+
        '</a>';
    }).join('');

    // Load recent results from all competitions
    var allMatches = [];
    var promises = comps.map(function(c){
      return fetch('/data/rugby/'+c.id+'/index.json')
        .then(function(r){ return r.json(); })
        .then(function(seasons){
          var latest = seasons[seasons.length-1];
          if(!latest) return;
          return fetch('/data/rugby/'+c.id+'/'+latest.year+'.json')
            .then(function(r){ return r.json(); })
            .then(function(matches){
              matches.forEach(function(m){ m._comp = c.name; m._compId = c.id; });
              allMatches = allMatches.concat(matches);
            });
        }).catch(function(){});
    });

    return Promise.all(promises).then(function(){
      var now = new Date().toISOString().slice(0,10);
      var recent = allMatches
        .filter(function(m){ return m.date && m.date <= now && m.home_score != null; })
        .sort(function(a,b){ return b.date.localeCompare(a.date); })
        .slice(0,10);

      document.getElementById('recentMatches').innerHTML = recent.map(function(m){
        return '<a class="match-row" href="/rugby-competition.html?id='+m._compId+'">'+
          '<div>'+
            '<div class="match-teams">'+m.home_team+' v '+m.away_team+'</div>'+
            '<div class="match-meta">'+m._comp+'</div>'+
          '</div>'+
          '<div style="text-align:right">'+
            '<div class="match-score">'+m.home_score+' – '+m.away_score+'</div>'+
            '<div class="match-date">'+m.date+'</div>'+
          '</div>'+
          '</a>';
      }).join('') || '<div class="loading">No recent results</div>';
    });
  })
  .catch(function(){
    document.getElementById('compGrid').innerHTML = '<div class="loading">Run the rugby scraper first.</div>';
  });
</script>
</body>
</html>
