<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>J-League Players | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --league:#c99a3d;
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:44px 20px;text-align:center;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,5.5vw,52px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero p{margin-top:10px;font-size:14px;font-weight:600;color:rgba(255,255,255,.65);}

.container{max-width:1600px;margin:0 auto;padding:26px 20px 70px;}

.search-wrap{margin-bottom:22px;display:flex;justify-content:center;}
#playerSearch{
  width:100%;max-width:480px;padding:12px 18px;font-size:14px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);outline:none;
  font-family:var(--body);font-weight:600;color:var(--ink);
}
#playerSearch:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

.player-count{margin-bottom:20px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.03em;}

.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.player-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
  text-decoration:none;color:var(--ink);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
  display:block;
}
.player-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(10,16,24,.2);border-color:var(--faint);}
.player-name{
  font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:6px;letter-spacing:.01em;
  text-transform:uppercase;color:var(--ink);
}
.player-meta{font-size:12.5px;color:var(--muted);font-weight:600;}
.player-stats{display:flex;gap:14px;margin-top:14px;}
.player-stat{text-align:center;}
.player-stat-value{font-family:var(--display);font-weight:600;font-size:19px;color:var(--league);}
.player-stat-label{font-size:10px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;}

.no-results{text-align:center;font-family:var(--display);font-size:18px;letter-spacing:.01em;text-transform:uppercase;padding:60px 20px;color:var(--muted);display:none;}
.loading{text-align:center;padding:60px;font-size:14px;color:var(--muted);}

@media(max-width:900px){
  .hero h1{font-size:32px;}
  .hero p{font-size:13px;}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/epl.html">EPL</a>
  <a href="/jleague.html">J-League</a>
  <a href="/jleague-teams.html">Teams</a>
  <a href="/nba.html">NBA</a>
  <a href="/afl.html">AFL</a>
</div>

<div class="hero">
  <div class="eyebrow">Football</div>
  <h1>J-League Players</h1>
  <p>Every player in J-League history from 1993 to present</p>
</div>

<div class="container">
  <div class="search-wrap">
    <input type="text" id="playerSearch" placeholder="Search players...">
  </div>
  <div class="player-count" id="playerCount"></div>
  <div class="players-grid" id="playersGrid">
    <div class="loading">Loading players...</div>
  </div>
  <div class="no-results" id="noResults">No players found</div>
</div>

<script>

function slugify(str){
  return (str || '')
    .toLowerCase()
    .replace(/&/g,'and')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-|-$/g,'');
}

function playerSlug(p){
  return slugify(p.name || '');
}

const grid      = document.getElementById("playersGrid");
const search    = document.getElementById("playerSearch");
const count     = document.getElementById("playerCount");
const noResults = document.getElementById("noResults");

let allPlayers = [];

async function loadPlayers(){
  try{
    const res = await fetch("/data/jleague/players.json");
    if(!res.ok) throw new Error("Failed to load players");
    allPlayers = await res.json();
    renderPlayers();
  }catch(err){
    grid.innerHTML = `<div class="loading">Failed to load players</div>`;
    console.error(err);
  }
}

function renderPlayers(filter=""){
  const filtered = allPlayers.filter(p =>
    (p.name || '').toLowerCase().includes(filter.toLowerCase()) ||
    (p.teams || []).some(t => t.toLowerCase().includes(filter.toLowerCase()))
  );

  count.textContent = `${filtered.length} Players`;

  if(filtered.length === 0){
    noResults.style.display = "block";
    grid.innerHTML = "";
    return;
  }

  noResults.style.display = "none";

  grid.innerHTML = filtered.map(p => {
    const team = (p.teams && p.teams[p.teams.length - 1]) || '';
    return `
      <a class="player-card" href="/jleague-player.html?player=${encodeURIComponent(playerSlug(p))}">
        <div class="player-name">${p.name}</div>
        <div class="player-meta">${team}</div>
        <div class="player-stats">
          <div class="player-stat">
            <div class="player-stat-value">${p.goals || 0}</div>
            <div class="player-stat-label">Goals</div>
          </div>
          <div class="player-stat">
            <div class="player-stat-value">${p.seasons ? p.seasons.length : 0}</div>
            <div class="player-stat-label">Seasons</div>
          </div>
          <div class="player-stat">
            <div class="player-stat-value">${p.yellow_cards || 0}</div>
            <div class="player-stat-label">Yellows</div>
          </div>
          <div class="player-stat">
            <div class="player-stat-value">${p.red_cards || 0}</div>
            <div class="player-stat-label">Reds</div>
          </div>
        </div>
      </a>
    `;
  }).join('');
}

search.addEventListener("input", e => renderPlayers(e.target.value));

loadPlayers();

</script>

</body>
</html>
