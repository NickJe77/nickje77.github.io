/* NAVBAR */

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  background:white;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;

  font-size:18px;
}

/* HERO */

.hero{

.hero h1{

/* PAGE */

.page{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
}

/* TILE */

.tile{
  background:white;
  border-radius:18px;
  overflow:hidden;
  text-decoration:none;
  color:black;
  box-shadow:0 4px 14px rgba(0,0,0,0.08);
  transition:.2s;
}

.tile:hover{
  transform:translateY(-6px);
}

.tile img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.tile-content{
  padding:20px;
}

.tile-content h2{
  margin:0;
  font-size:24px;
}

.tile-content p{
  margin-top:8px;
  color:#666;
}
