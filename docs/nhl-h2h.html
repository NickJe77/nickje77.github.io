<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>NHL Head to Head | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8J9ZPKDDH"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N8J9ZPKDDH');</script>

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;position:sticky;top:0;z-index:100;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));color:#fff;
  padding:44px 20px;text-align:center;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,6vw,42px);
  letter-spacing:.01em;text-transform:uppercase;
}
.hero p{margin:8px 0 0;font-size:14.5px;color:rgba(255,255,255,.68);}
.picker{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:26px;}
.picker select{
  padding:11px 16px;border-radius:999px;border:none;font-size:14px;font-weight:600;
  min-width:220px;background:#fff;color:var(--ink);cursor:pointer;font-family:var(--body);
}
.vs{font-family:var(--display);font-size:20px;font-weight:600;color:#fff;}
.btn{
  padding:11px 26px;border-radius:999px;border:none;background:var(--accent);color:var(--ink);
  font-size:13.5px;font-weight:700;cursor:pointer;transition:.2s;font-family:var(--body);
}
.btn:hover{opacity:.9;}

.page-wrap{max-width:1300px;margin:0 auto;padding:28px 20px 70px;}
.h2h-header{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin-bottom:22px;}
.team-banner{border-radius:var(--radius);padding:26px 20px;text-align:center;color:#fff;}
.team-banner h2{margin:0;font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;}
.team-banner p{margin:6px 0 0;font-size:13.5px;opacity:.85;font-weight:600;}
.h2h-score{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;text-align:center;}
.h2h-nums{display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--display);font-size:40px;font-weight:600;line-height:1;}
.h2h-label{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);margin-top:8px;letter-spacing:.06em;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:22px;}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 12px;text-align:center;}
.stat-box b{
  display:block;font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;font-weight:600;margin-bottom:6px;font-family:var(--body);
}
.stat-num{font-family:var(--display);font-size:28px;font-weight:600;line-height:1;color:var(--ink);}

.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
.section-title{
  font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 16px;
  border-left:4px solid var(--accent);padding-left:12px;color:var(--ink);
  text-transform:uppercase;letter-spacing:.01em;
}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;background:var(--surface);}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;text-align:left;white-space:nowrap;
  font-family:var(--body);border-bottom:1px solid var(--line);
}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tr:hover td{background:#f9fbfd;cursor:pointer;}
.score{font-weight:700;text-align:center;color:var(--ink);}
.result-w{color:#1e7a3d;font-weight:700;}
.result-l{color:#c0362c;font-weight:700;}
.team-link{color:var(--ink);font-weight:700;text-decoration:none;}
.team-link:hover{color:var(--accent);}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:10.5px;font-weight:700;text-transform:uppercase;}
.badge-reg{background:var(--accent-soft);color:var(--ink);}
.badge-po{background:#fbe7e5;color:#c0362c;}
.loading{text-align:center;padding:60px;font-size:15px;font-weight:600;color:var(--muted);}
.progress-wrap{background:var(--line);border-radius:999px;height:8px;max-width:300px;margin:12px auto 0;}
.progress-bar{background:var(--board);height:8px;border-radius:999px;transition:width .15s;}
.hidden{display:none;}
@media(max-width:800px){
  .h2h-header{grid-template-columns:1fr;}
  .vs{display:none;}
  .picker{flex-direction:column;}
  .picker select{min-width:260px;width:100%;}
}
</style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="nba.html">NBA</a>
  <a href="nhl.html">NHL</a>
</div>

<div class="hero">
  <h1>Head to Head</h1>
  <p>Compare any two NHL franchises across all seasons</p>
  <div class="picker">
    <select id="team1Sel"><option value="">Select Team 1...</option></select>
    <div class="vs">VS</div>
    <select id="team2Sel"><option value="">Select Team 2...</option></select>
    <button class="btn" onclick="loadH2H()">Compare</button>
  </div>
</div>

<div class="page-wrap">
  <div id="loadingDiv" class="hidden">
    <div class="loading">Loading match data...
      <div class="progress-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
    </div>
  </div>
  <div id="resultsDiv" class="hidden"></div>
</div>

<script>
var TEAM_NAMES = {
  "ANA":"Anaheim Ducks","ARI":"Arizona Coyotes","ATL":"Atlanta Thrashers",
  "BOS":"Boston Bruins","BUF":"Buffalo Sabres","CGY":"Calgary Flames",
  "CAR":"Carolina Hurricanes","CHI":"Chicago Blackhawks","COL":"Colorado Avalanche",
  "CBJ":"Columbus Blue Jackets","DAL":"Dallas Stars","DET":"Detroit Red Wings",
  "EDM":"Edmonton Oilers","FLA":"Florida Panthers","LAK":"Los Angeles Kings",
  "MIN":"Minnesota Wild","MTL":"Montreal Canadiens","NSH":"Nashville Predators",
  "NJD":"New Jersey Devils","NYI":"New York Islanders","NYR":"New York Rangers",
  "OTT":"Ottawa Senators","PHI":"Philadelphia Flyers","PHX":"Phoenix Coyotes",
  "PIT":"Pittsburgh Penguins","SJS":"San Jose Sharks","SEA":"Seattle Kraken",
  "STL":"St. Louis Blues","TBL":"Tampa Bay Lightning","TOR":"Toronto Maple Leafs",
  "UTA":"Utah Hockey Club","VAN":"Vancouver Canucks","VGK":"Vegas Golden Knights",
  "WSH":"Washington Capitals","WPG":"Winnipeg Jets",
  "QUE":"Quebec Nordiques","HFD":"Hartford Whalers","MNS":"Minnesota North Stars",
  "KCS":"Kansas City Scouts","CLR":"Colorado Rockies","OAK":"Oakland Seals",
  "CAL":"California Golden Seals","CLE":"Cleveland Barons","ATF":"Atlanta Flames",
  "CGS":"California Golden Seals","WIN":"Winnipeg Jets (old)"
};

var TEAM_COLOURS = {
  "ANA":["#F47A38","#B09057"],"ARI":["#8C2633","#E2D6B5"],"BOS":["#FFB81C","#000000"],
  "BUF":["#003087","#FCB514"],"CGY":["#C8102E","#F1BE48"],"CAR":["#CC0000","#000000"],
  "CHI":["#CF0A2C","#000000"],"COL":["#6F263D","#236192"],"CBJ":["#002654","#CE1126"],
  "DAL":["#006847","#8F8F8C"],"DET":["#CE1126","#FFFFFF"],"EDM":["#041E42","#FF4C00"],
  "FLA":["#041E42","#C8102E"],"LAK":["#111111","#A2AAAD"],"MIN":["#154734","#A6192E"],
  "MTL":["#AF1E2D","#192168"],"NSH":["#FFB81C","#041E42"],"NJD":["#CE1126","#000000"],
  "NYI":["#003087","#FC4C02"],"NYR":["#0038A8","#CE1126"],"OTT":["#C2912C","#000000"],
  "PHI":["#F74902","#000000"],"PIT":["#FCB514","#000000"],"SJS":["#006D75","#EA7200"],
  "SEA":["#001628","#99D9D9"],"STL":["#002F87","#FCB514"],"TBL":["#002868","#FFFFFF"],
  "TOR":["#003E7E","#FFFFFF"],"UTA":["#010101","#69B3E7"],"VAN":["#00205B","#00843D"],
  "VGK":["#B4975A","#333F42"],"WSH":["#041E42","#C8102E"],"WPG":["#041E42","#004C97"]
};

var NHL_TEAMS = [
  "ANA","ARI","ATL","BOS","BUF","CAR","CBJ","CGY","CGS","CHI",
  "CLE","CLR","COL","DAL","DET","EDM","FLA","HFD","KCS","LAK",
  "MIN","MNS","MTL","NJD","NSH","NYI","NYR","OAK","OTT",
  "PHI","PHX","PIT","QUE","SEA","SJS","STL","TBL","TOR","UTA",
  "VAN","VGK","WPG","WSH"
].filter(function(v,i,a){ return a.indexOf(v)===i; })
 .sort(function(a,b){ return tn(a)<tn(b)?-1:1; });

function tn(code){ return TEAM_NAMES[code]||code; }
function gtype(g){
  if(g.game_type) return g.game_type;
  return String(g.game_id||'').slice(4,6)==='03'?'P':'R';
}

// Populate dropdowns
var s1 = document.getElementById('team1Sel');
var s2 = document.getElementById('team2Sel');
NHL_TEAMS.forEach(function(code){
  s1.innerHTML += '<option value="'+code+'">'+tn(code)+'</option>';
  s2.innerHTML += '<option value="'+code+'">'+tn(code)+'</option>';
});

// URL params
var params = new URLSearchParams(window.location.search);
if(params.get('team1')) s1.value = params.get('team1');
if(params.get('team2')) s2.value = params.get('team2');
if(params.get('team1') && params.get('team2')) loadH2H();

var allSeasons = [];
var allGames   = [];
var dataLoaded = false;

function loadH2H(){
  var t1 = s1.value, t2 = s2.value;
  if(!t1||!t2){ alert('Please select both teams'); return; }
  if(t1===t2){ alert('Please select two different teams'); return; }

  var url = new URL(window.location);
  url.searchParams.set('team1',t1);
  url.searchParams.set('team2',t2);
  window.history.pushState({},'',url);

  document.getElementById('resultsDiv').className = 'hidden';
  document.getElementById('loadingDiv').className = '';
  document.getElementById('pbar').style.width = '0%';

  if(dataLoaded){
    renderH2H(t1, t2);
    return;
  }

  fetch('/data/nhl/index.json')
    .then(function(r){ return r.json(); })
    .then(function(index){
      allSeasons = index.filter(function(s){ return s.games > 0; });
      var done = 0;
      var promises = allSeasons.map(function(s){
        return fetch('/data/nhl/seasons/'+s.season+'.json')
          .then(function(r){ return r.json(); })
          .then(function(games){
            games.forEach(function(g){ g._season = s.season; allGames.push(g); });
          }).catch(function(){})
          .finally(function(){
            done++;
            var bar = document.getElementById('pbar');
            if(bar) bar.style.width = Math.round((done/allSeasons.length)*100)+'%';
          });
      });
      return Promise.all(promises);
    })
    .then(function(){
      dataLoaded = true;
      renderH2H(t1, t2);
    });
}

function renderH2H(t1, t2){
  var h2h = allGames.filter(function(g){
    return (g.home_team===t1&&g.away_team===t2)||(g.home_team===t2&&g.away_team===t1);
  });

  var reg = h2h.filter(function(g){ return gtype(g)==='R'; });
  var po  = h2h.filter(function(g){ return gtype(g)==='P'; });

  function calcStats(team, games){
    var w=0,l=0,gf=0,ga=0;
    games.forEach(function(g){
      var isHome = g.home_team===team;
      var tf = isHome?(g.home_score||0):(g.away_score||0);
      var ta = isHome?(g.away_score||0):(g.home_score||0);
      gf+=tf; ga+=ta;
      if(tf>ta) w++; else if(ta>tf) l++;
    });
    return {w:w,l:l,gf:gf,ga:ga};
  }

  var s1all = calcStats(t1, h2h);
  var s2all = calcStats(t2, h2h);
  var draws = h2h.length - s1all.w - s2all.w;

  var c1 = TEAM_COLOURS[t1]||['#041E42','#0072CE'];
  var c2 = TEAM_COLOURS[t2]||['#C8102E','#000000'];
  var g1 = 'linear-gradient(135deg,'+c1[0]+','+c1[1]+')';
  var g2 = 'linear-gradient(135deg,'+c2[0]+','+c2[1]+')';

  var gameRows = h2h.slice().sort(function(a,b){
    if(a._season!==b._season) return b._season-a._season;
    return 0;
  }).map(function(g){
    var isT1Home = g.home_team===t1;
    var t1g = isT1Home?(g.home_score||0):(g.away_score||0);
    var t2g = isT1Home?(g.away_score||0):(g.home_score||0);
    var res = t1g>t2g?'W':t1g<t2g?'L':'T';
    var rcls = t1g>t2g?'result-w':'result-l';
    var badge = gtype(g)==='P'
      ? '<span class="badge badge-po">Playoff</span>'
      : '<span class="badge badge-reg">Regular</span>';
    var home = g.home_team, away = g.away_team;
    return '<tr onclick="window.location.href=\'/nhl-season.html?season='+g._season+'\'">' +
      '<td>'+g._season+'–'+String(g._season+1).slice(2)+'</td>' +
      '<td><a class="team-link" href="/nhl-franchise.html?team='+encodeURIComponent(home)+'">'+tn(home)+'</a></td>' +
      '<td class="score">'+g.home_score+' – '+g.away_score+'</td>' +
      '<td><a class="team-link" href="/nhl-franchise.html?team='+encodeURIComponent(away)+'">'+tn(away)+'</a></td>' +
      '<td class="'+rcls+'">'+res+'</td>' +
      '<td>'+badge+'</td>' +
      '</tr>';
  }).join('');

  var html =
    '<div class="h2h-header">' +
      '<div class="team-banner" style="background:'+g1+'">' +
        '<h2>'+tn(t1)+'</h2>' +
        '<p>'+s1all.w+'W – '+s1all.l+'L</p>' +
      '</div>' +
      '<div class="h2h-score">' +
        '<div class="h2h-nums">' +
          '<span style="color:#16a34a">'+s1all.w+'</span>' +
          '<span style="color:#aaa;font-size:28px">–</span>' +
          '<span style="color:#888;font-size:32px">'+draws+'</span>' +
          '<span style="color:#aaa;font-size:28px">–</span>' +
          '<span style="color:#dc2626">'+s2all.w+'</span>' +
        '</div>' +
        '<div class="h2h-label">'+h2h.length+' meetings</div>' +
      '</div>' +
      '<div class="team-banner" style="background:'+g2+'">' +
        '<h2>'+tn(t2)+'</h2>' +
        '<p>'+s2all.w+'W – '+s2all.l+'L</p>' +
      '</div>' +
    '</div>' +

    '<div class="stat-grid">' +
      sbox('Meetings', h2h.length) +
      sbox('Regular Season', reg.length) +
      sbox('Playoff Games', po.length) +
      sbox(tn(t1)+' Goals', s1all.gf) +
      sbox(tn(t2)+' Goals', s2all.gf) +
      sbox(tn(t1)+' Avg', h2h.length?(s1all.gf/h2h.length).toFixed(1):'–') +
      sbox(tn(t2)+' Avg', h2h.length?(s2all.gf/h2h.length).toFixed(1):'–') +
    '</div>' +

    '<div class="section">' +
      '<div class="section-title">All Meetings</div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr>' +
          '<th>Season</th><th>Home</th><th style="text-align:center">Score</th>' +
          '<th>Away</th><th>'+tn(t1)+' Result</th><th>Type</th>' +
        '</tr></thead>' +
        '<tbody>'+(gameRows||'<tr><td colspan="6" style="text-align:center;color:#888">No meetings found.</td></tr>')+'</tbody>' +
      '</table></div>' +
    '</div>';

  var rd = document.getElementById('resultsDiv');
  rd.innerHTML = html;
  rd.className = '';
  document.getElementById('loadingDiv').className = 'hidden';
}

function sbox(label, val){
  return '<div class="stat-box"><b>'+label+'</b><div class="stat-num">'+val+'</div></div>';
}
</script>
</body>
</html>
