<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>AFL Best Individual Games | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --board-line:rgba(255,255,255,.10);
  --accent:#e0b94a;
  --accent-soft:rgba(224,185,74,.18);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:26px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

.page-wrap{max-width:1000px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;text-align:center;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:26px;padding:26px 26px 30px;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:8px;
}
h1{margin:0 0 8px;font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);letter-spacing:.01em;text-transform:uppercase;color:#fff;}
.hero p{margin:0;color:rgba(255,255,255,.6);font-size:13.5px;}

/* ── Controls ─────────────────────────────────────────── */
.controls-row{text-align:center;margin-bottom:20px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
select{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;margin-left:8px;
}
select:hover{border-color:var(--faint);}
#loadingMsg{margin-top:10px;color:var(--muted);font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;}

/* ── Table ────────────────────────────────────────────── */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left;}
th{
  background:#f7f9fb;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
}
td{color:#27313c;font-variant-numeric:tabular-nums;}
.rank{width:44px;text-align:center;font-weight:700;color:var(--faint);}
.stat{width:70px;text-align:center;font-weight:700;color:var(--ink);}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:#f0f6ff;}
</style>
</head>
<body>
<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html" class="current">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="f1.html">F1</a>
</nav>
<div class="page-wrap">

<div class="hero">
  <div class="eyebrow">AFL</div>
  <h1>Best Individual Games</h1>
  <p>Top 10 individual performances since 1965 (VFL/AFL era)</p>
</div>

<div class="controls-row">
  Show top 10 by:
  <select id="statSelect" disabled>
    <option value="G">Goals</option>
    <option value="D">Disposals</option>
    <option value="K">Kicks</option>
    <option value="HB">Handballs</option>
    <option value="M">Marks</option>
    <option value="HO">Hit Outs</option>
  </select>
  <div id="loadingMsg">Loading AFL data…</div>
</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th class="rank">#</th>
      <th>Player</th>
      <th>Team</th>
      <th>Opponent</th>
      <th>Season</th>
      <th>Round</th>
      <th class="stat">Stat</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>
</div>
</div>
<script>
const statSelect = document.getElementById("statSelect");
const tableBody  = document.getElementById("tableBody");
const loadingMsg = document.getElementById("loadingMsg");
let allData = [];
let dataLoaded = false;
async function loadAllSeasons(){
  const startYear = 1965;
  const endYear = new Date().getFullYear();
  const requests = [];
  for(let y=startYear; y<=endYear; y++){
    requests.push(fetch(`data/afl/afl_${y}.json`).then(r=>r.ok?r.json():[]).catch(()=>[]));
  }
  const results = await Promise.all(requests);
  results.forEach(s => s.forEach(r => allData.push(r)));
  dataLoaded = true;
  statSelect.disabled = false;
  loadingMsg.style.display = "none";
  updateTable();
}
loadAllSeasons();
statSelect.addEventListener("change", updateTable);
function cleanRound(val){
  if(!val) return "";
  return String(val).replace(/^Round\s*/i, "");
}
function gameLink(r){
  return `afl-game.html?year=${r.season}&home=${encodeURIComponent(r.home_team)}&away=${encodeURIComponent(r.away_team)}&round=${encodeURIComponent(r.round)}`;
}
function updateTable(){
  if(!dataLoaded) return;
  const stat = statSelect.value;
  const rows = allData
    .filter(r => Number(r[stat]) > 0)
    .sort((a,b) => Number(b[stat]) - Number(a[stat]))
    .slice(0,10);
  tableBody.innerHTML = "";
  rows.forEach((r,i)=>{
    const tr = document.createElement("tr");
    tr.onclick = () => location.href = gameLink(r);
    tr.innerHTML = `
      <td class="rank">${i+1}</td>
      <td>${r.player}</td>
      <td>${r.played_for}</td>
      <td>${r.played_against}</td>
      <td>${r.season}</td>
      <td>${cleanRound(r.round)}</td>
      <td class="stat">${r[stat]}</td>`;
    tableBody.appendChild(tr);
  });
}
</script>
</body>
</html>
