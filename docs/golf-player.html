<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Players | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#0c6f3c;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e3e7eb;
  --zebra:#f3f8f4;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.hero{
  background:linear-gradient(135deg,#08552d,#0c6f3c);
  color:#fff;
  text-align:center;
  padding:40px 20px;
}

.hero h1{
  margin:0;
  font-size:40px;
}

.page{
  max-width:1000px;
  margin:auto;
  padding:25px;
}

.search-box{
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:10px;
}

.table-card{
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:var(--green);
  color:#fff;
}

th, td{
  padding:12px;
  font-size:14px;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}

.player-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/majors.html">Majors</a>
  <a href="/players.html">Players</a>
</div>

<div class="hero">
  <h1>Golf Players</h1>
</div>

<div class="page">

<div class="search-box">
  <input id="search" placeholder="Search player...">
</div>

<div class="table-card">
<table>
<thead>
<tr>
  <th>Player</th>
  <th>Wins</th>
  <th>Majors</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>
function clean(name){
  if(!name) return "";

  name = String(name);

  // remove brackets
  name = name.replace(/\s*\(.*?\)/g,"");

  // remove junk
  name = name.replace(/\*/g,"").trim();

  if(name.toLowerCase() === "not played") return "";

  // split combo names
  if(name.includes(" / ")) name = name.split(" / ")[0];
  if(name.includes("/")) name = name.split("/")[0];
  if(name.includes(" & ")) name = name.split(" & ")[0];
  if(name.includes("&")) name = name.split("&")[0];
  if(name.includes(" and ")) name = name.split(" and ")[0];
  if(name.includes(" And ")) name = name.split(" And ")[0];

  // 🔥 NORMALISE CASE
  name = name.toLowerCase()
    .split(" ")
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(" ");

  // 🔥 FIX COMMON NAMES
  if(name === "Rory Mcilroy") name = "Rory McIlroy";

  return name.trim();
}

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-");
}

async function load(){
  const res = await fetch("/data/golf/pga_winners.json");
  const data = await res.json();

  const players = {};

  data.forEach(d=>{
    let name = clean(d.winner);
    if(!name) return;

    // 🔥 FORCE MERGE USING LOWERCASE KEY
    const key = name.toLowerCase();

    if(!players[key]){
      players[key] = {
        name: name,
        wins: 0,
        majors: 0
      };
    }

    players[key].wins++;

    if(d.major === true){
      players[key].majors++;
    }
  });

  const list = Object.values(players)
    .sort((a,b)=>b.wins-a.wins);

  const tbody = document.getElementById("tbody");

  function render(filter=""){
    tbody.innerHTML="";

    list
      .filter(p=>p.name.toLowerCase().includes(filter))
      .forEach(p=>{
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td><a class="player-link" href="/golf-player.html?player=${slug(p.name)}">${p.name}</a></td>
          <td>${p.wins}</td>
          <td>${p.majors}</td>
        `;

        tbody.appendChild(tr);
      });
  }

  render();

  document.getElementById("search").addEventListener("input", e=>{
    render(e.target.value.toLowerCase());
  });
}

load();
</script>

</body>
</html>
