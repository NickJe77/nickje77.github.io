<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* KEEP YOUR EXISTING CSS */
</style>
</head>

<body>

<!-- KEEP YOUR EXISTING HTML -->

<script>
function cleanPlayerName(name){
  if(!name) return "";

  return name
    .replace(/\./g,". ")
    .replace(/\s+/g," ")
    .replace(/\b([a-z])/g,l=>l.toUpperCase())
    .replace(/\s*\(.*?\)/g,"")
    .replace(/\*/g,"")
    .trim();
}

function cleanTournament(name){
  if(!name) return "";
  return name
    .replace(/Augusta National.*$/i,"")
    .replace(/ - .*$/i,"")
    .trim();
}

function slug(name){
  return String(name||"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function isMajor(name){
  if(!name) return false;
  const n=name.toLowerCase();
  return (
    n.includes("masters") ||
    n.includes("us open") ||
    n.includes("open championship") ||
    n.includes("pga championship")
  );
}

async function fetchData(){
  let res=await fetch("/data/golf/pga_winners.json");
  if(!res.ok) res=await fetch("/docs/data/golf/pga_winners.json");
  if(!res.ok) return [];
  return await res.json();
}

async function load(){
  const params=new URLSearchParams(location.search);
  const playerSlug=slug(params.get("player")||"");

  const data=await fetchData();

  let playerName="";
  const wins=[];

  data.forEach(d=>{
    const winner=cleanPlayerName(d.winner);

    if(!winner) return;

    if(slug(winner)===playerSlug){
      playerName=winner;

      const tournament=cleanTournament(d.event||"");

      wins.push({
        year:d.year,
        tournament,
        isMajor:isMajor(tournament)
      });
    }
  });

  if(!playerName){
    document.getElementById("playerName").innerText="Player not found";
    return;
  }

  document.getElementById("playerName").innerText=playerName;

  /* 🔥 DEDUPE */
  const seen=new Set();
  const uniqueWins=wins.filter(w=>{
    const key=w.year+"|"+w.tournament.toLowerCase();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  const totalWins=uniqueWins.length;
  const majors=uniqueWins.filter(w=>w.isMajor).length;

  document.getElementById("summary").innerText=
    totalWins+" wins / "+majors+" majors";

  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  uniqueWins
    .sort((a,b)=>b.year-a.year)
    .forEach(w=>{
      const tr=document.createElement("tr");

      tr.innerHTML=`
        <td>${w.year}</td>
        <td>${!w.isMajor ? w.tournament : ""}</td>
        <td>${w.isMajor ? w.tournament : ""}</td>
      `;

      tbody.appendChild(tr);
    });

  document.querySelector(".table-card").style.display="block";
}

load();
</script>

</body>
</html>
