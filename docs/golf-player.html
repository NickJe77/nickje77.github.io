<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui;
  margin:0;
  background:#f4f6f8;
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
}
.navbar a{
  color:#0f6b3f;
  text-decoration:none;
  font-weight:600;
}

/* HERO */
.hero{
  background:linear-gradient(90deg,#0f6b3f,#198754);
  color:white;
  padding:40px;
  text-align:center;
}
.hero h1{
  margin:0;
  font-size:36px;
}
.hero p{
  margin-top:10px;
  font-size:18px;
  opacity:0.95;
}

/* PAGE */
.page{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

/* TABLE */
.table-card{
  display:none;
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
}

th{
  background:#0f6b3f;
  color:white;
  text-align:left;
}

tr:nth-child(even){
  background:#f6faf7;
}

</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
</div>

<div class="hero">
  <h1 id="playerName">Loading...</h1>
  <p id="summary"></p>
</div>

<div class="page">

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Year</th>
          <th>Tournament</th>
          <th>Major</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>

function cleanPlayerName(name){
  if(!name) return "";
  return name
    .replace(/\./g,". ")
    .replace(/\s+/g," ")
    .replace(/\b([a-z])/g,l=>l.toUpperCase())
    .replace(/\s*\(.*?\)/g,"")
    .replace(/\*/g,"")
    .trim();
}

function cleanTournament(name){
  if(!name) return "";
  return name
    .replace(/Augusta National.*$/i,"")
    .replace(/ - .*$/i,"")
    .trim();
}

function slug(name){
  return String(name||"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/-+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function isMajor(name){
  if(!name) return false;
  const n=name.toLowerCase();
  return (
    n.includes("masters") ||
    n.includes("us open") ||
    n.includes("open championship") ||
    n.includes("pga championship")
  );
}

async function fetchData(){
  let res=await fetch("/data/golf/pga_winners.json");
  if(!res.ok) res=await fetch("/docs/data/golf/pga_winners.json");
  if(!res.ok) return [];
  return await res.json();
}

async function load(){

  const params=new URLSearchParams(location.search);
  const rawPlayer=params.get("player") || "";
  const playerSlug=slug(rawPlayer);

  const data=await fetchData();

  let playerName="";
  const wins=[];

  data.forEach(d=>{
    const winner=cleanPlayerName(d.winner);
    if(!winner) return;

    const winnerSlug=slug(winner);

    if(
      winnerSlug===playerSlug ||
      winner.toLowerCase()===decodeURIComponent(rawPlayer).toLowerCase()
    ){
      playerName=winner;

      const tournament=cleanTournament(d.event||"");

      wins.push({
        year:d.year,
        tournament,
        isMajor:isMajor(tournament)
      });
    }
  });

  if(!playerName){
    document.getElementById("playerName").innerText="Player not found";
    return;
  }

  document.getElementById("playerName").innerText=playerName;

  const seen=new Set();
  const uniqueWins=wins.filter(w=>{
    const key=w.year+"|"+w.tournament.toLowerCase();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  const totalWins=uniqueWins.length;
  const majors=uniqueWins.filter(w=>w.isMajor).length;

  document.getElementById("summary").innerText=
    totalWins+" wins / "+majors+" majors";

  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  uniqueWins
    .sort((a,b)=>b.year-a.year)
    .forEach(w=>{
      const tr=document.createElement("tr");

      tr.innerHTML=`
        <td>${w.year}</td>
        <td>${!w.isMajor ? w.tournament : ""}</td>
        <td>${w.isMajor ? w.tournament : ""}</td>
      `;

      tbody.appendChild(tr);
    });

  document.querySelector(".table-card").style.display="block";
}

load();

</script>

</body>
</html>
