<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Players | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#0c6f3c;
  --green-dark:#08552d;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e3e7eb;
  --zebra:#f3f8f4;
  --blue:#0056d6;
  --text:#1e1e1e;
  --muted:#6b7280;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:var(--blue);
  text-decoration:none;
  font-size:18px;
}

.hero{
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  color:#fff;
  text-align:center;
  padding:42px 20px 34px;
}

.hero h1{
  margin:0 0 10px;
  font-size:40px;
}

.hero p{
  margin:0;
  font-size:16px;
  opacity:.95;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:24px;
}

.controls{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:22px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:14px;
}

.control-group{
  display:flex;
  flex-direction:column;
  gap:8px;
}

label{
  font-size:13px;
  font-weight:700;
  color:#344054;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.search-wrap{
  position:relative;
}

.search-wrap input{
  width:100%;
  padding:14px 14px;
  border:1px solid #cfd6de;
  border-radius:12px;
  font-size:16px;
  background:#fff;
}

.search-wrap input:focus,
select:focus{
  outline:none;
  border-color:#6aa884;
  box-shadow:0 0 0 3px rgba(12,111,60,.12);
}

select{
  width:100%;
  padding:14px 14px;
  border:1px solid #cfd6de;
  border-radius:12px;
  font-size:16px;
  background:#fff;
  color:var(--text);
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:22px;
}

.summary-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
}

.summary-label{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:8px;
}

.summary-value{
  font-size:30px;
  font-weight:800;
  color:var(--green);
}

.table-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}

.table-header{
  padding:16px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.table-header h2{
  margin:0;
  font-size:22px;
}

.table-header .sub{
  color:var(--muted);
  font-size:14px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:var(--green);
  color:#fff;
}

th, td{
  padding:14px 14px;
  font-size:15px;
  text-align:left;
  white-space:nowrap;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}

tbody tr:hover{
  background:#eaf5ed;
}

.player-link{
  color:var(--blue);
  text-decoration:none;
  font-weight:700;
}

.player-link:hover{
  text-decoration:underline;
}

.muted{
  color:var(--muted);
}

.empty{
  padding:36px 20px;
  text-align:center;
  color:var(--muted);
  display:none;
}

@media (max-width:900px){
  .controls{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:32px;
  }
}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/majors.html">Majors</a>
  <a href="/players.html">Players</a>
</div>

<div class="hero">
  <h1>Golf Players</h1>
  <p>Career wins and major titles</p>
</div>

<div class="page">

  <div class="controls">
    <div class="control-group">
      <label for="playerSearch">Search player</label>
      <div class="search-wrap">
        <input id="playerSearch" type="text" list="playerSuggestions" placeholder="Start typing a player name...">
        <datalist id="playerSuggestions"></datalist>
      </div>
    </div>

    <div class="control-group">
      <label for="majorFilter">Filter</label>
      <select id="majorFilter">
        <option value="all">All players</option>
        <option value="majors">Major winners only</option>
        <option value="nonmajors">No majors</option>
      </select>
    </div>
  </div>

  <div class="summary">
    <div class="summary-card">
      <div class="summary-label">Players shown</div>
      <div class="summary-value" id="playersShown">0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Total wins shown</div>
      <div class="summary-value" id="winsShown">0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Major wins shown</div>
      <div class="summary-value" id="majorsShown">0</div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <h2>Players</h2>
      <div class="sub" id="tableSub">Loading players...</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th>Wins</th>
            <th>Majors</th>
            <th>First Win</th>
            <th>Last Win</th>
          </tr>
        </thead>
        <tbody id="playersBody"></tbody>
      </table>
      <div class="empty" id="emptyState">No players found</div>
    </div>
  </div>

</div>

<script>
const DATA_URL = "/data/golf/pga_winners.json";

function slugify(name){
  return String(name || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/&/g, "and")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}

function cleanWinnerName(name){
  if(name === null || name === undefined) return "";

  let n = String(name).trim();

  if(!n) return "";

  n = n.replace(/\s*\(.*?\)/g, "");
  n = n.replace(/\*/g, "");
  n = n.replace(/\s+/g, " ").trim();

  const lowered = n.toLowerCase();

  if(
    lowered === "not played" ||
    lowered === "-" ||
    lowered === "—" ||
    lowered === "nan" ||
    lowered === "undefined" ||
    lowered === "null"
  ){
    return "";
  }

  if(n.includes(" / ")) n = n.split(" / ")[0].trim();
  if(n.includes("/")) n = n.split("/")[0].trim();
  if(n.includes(" & ")) n = n.split(" & ")[0].trim();
  if(n.includes("&")) n = n.split("&")[0].trim();
  if(n.includes(" and ")) n = n.split(" and ")[0].trim();

  return n;
}

function isMajorEvent(event){
  return [
    "Masters Tournament",
    "PGA Championship",
    "U.S. Open",
    "The Open Championship"
  ].includes(event);
}

let allPlayers = [];

function buildPlayers(rows){
  const map = new Map();

  rows.forEach(row => {
    const name = cleanWinnerName(row.winner);
    if(!name) return;

    const year = Number(row.year) || 0;
    const event = row.event || "";
    const major = Boolean(row.major) || isMajorEvent(event);

    if(!map.has(name)){
      map.set(name, {
        name,
        wins: 0,
        majors: 0,
        firstWin: year || null,
        lastWin: year || null
      });
    }

    const p = map.get(name);
    p.wins += 1;
    if(major) p.majors += 1;

    if(year){
      if(p.firstWin === null || year < p.firstWin) p.firstWin = year;
      if(p.lastWin === null || year > p.lastWin) p.lastWin = year;
    }
  });

  return [...map.values()].sort((a,b) => {
    if(b.wins !== a.wins) return b.wins - a.wins;
    if(b.majors !== a.majors) return b.majors - a.majors;
    return a.name.localeCompare(b.name);
  });
}

function renderSuggestions(players){
  const datalist = document.getElementById("playerSuggestions");
  datalist.innerHTML = "";

  players.forEach(player => {
    if(!player.name) return;
    const option = document.createElement("option");
    option.value = player.name;
    datalist.appendChild(option);
  });
}

function renderTable(){
  const search = document.getElementById("playerSearch").value.trim().toLowerCase();
  const filter = document.getElementById("majorFilter").value;
  const tbody = document.getElementById("playersBody");
  const empty = document.getElementById("emptyState");
  const sub = document.getElementById("tableSub");

  let filtered = allPlayers.filter(player => {
    const matchesSearch = !search || player.name.toLowerCase().includes(search);

    let matchesFilter = true;
    if(filter === "majors") matchesFilter = player.majors > 0;
    if(filter === "nonmajors") matchesFilter = player.majors === 0;

    return matchesSearch && matchesFilter;
  });

  tbody.innerHTML = "";

  if(filtered.length === 0){
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
  }

  filtered.forEach(player => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><a class="player-link" href="/golf-player.html?player=${slugify(player.name)}">${player.name}</a></td>
      <td>${player.wins}</td>
      <td>${player.majors}</td>
      <td>${player.firstWin || ""}</td>
      <td>${player.lastWin || ""}</td>
    `;
    tbody.appendChild(tr);
  });

  const totalWins = filtered.reduce((sum, p) => sum + p.wins, 0);
  const totalMajors = filtered.reduce((sum, p) => sum + p.majors, 0);

  document.getElementById("playersShown").textContent = filtered.length.toLocaleString();
  document.getElementById("winsShown").textContent = totalWins.toLocaleString();
  document.getElementById("majorsShown").textContent = totalMajors.toLocaleString();

  sub.textContent = `${filtered.length.toLocaleString()} players`;
}

async function loadPlayers(){
  try{
    const res = await fetch(DATA_URL);
    const data = await res.json();

    allPlayers = buildPlayers(data);
    renderSuggestions(allPlayers);
    renderTable();
  }catch(err){
    document.getElementById("tableSub").textContent = "Failed to load players";
    document.getElementById("emptyState").style.display = "block";
    console.error(err);
  }
}

document.getElementById("playerSearch").addEventListener("input", renderTable);
document.getElementById("majorFilter").addEventListener("change", renderTable);

loadPlayers();
</script>

</body>
</html>
