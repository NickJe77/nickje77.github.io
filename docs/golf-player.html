<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#0c6f3c;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e3e7eb;
  --zebra:#f3f8f4;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.hero{
  background:linear-gradient(135deg,#08552d,#0c6f3c);
  color:#fff;
  text-align:center;
  padding:40px 20px;
}

.hero h1{
  margin:0;
  font-size:34px;
}

.summary{
  margin-top:10px;
  font-size:16px;
  opacity:.9;
}

.page{
  max-width:1000px;
  margin:auto;
  padding:25px;
}

.search-box{
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:10px;
}

.table-card{
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:var(--green);
  color:#fff;
}

th, td{
  padding:12px;
  font-size:14px;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/majors.html">Majors</a>
  <a href="/players.html">Players</a>
</div>

<div class="hero">
  <h1 id="playerName">Loading...</h1>
  <div class="summary" id="summary"></div>
</div>

<div class="page">

<div class="search-box">
  <input id="search" placeholder="Search player and press Enter...">
</div>

<div class="table-card">
<table>
<thead>
<tr>
  <th>Year</th>
  <th>Tournament</th>
  <th>Major</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>
function clean(name){
  if(!name) return "";

  name = String(name)
    .replace(/\s*\(.*?\)/g,"")
    .replace(/\*/g,"")
    .trim();

  if(!name || name === "--") return "";

  // split combo winners
  name = name.split(/\/|&| and /i)[0].trim();

  // normalise case
  name = name.toLowerCase()
    .split(" ")
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(" ");

  // fix known names
  if(name === "Rory Mcilroy") name = "Rory McIlroy";

  return name;
}

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-");
}

async function load(){
  const params = new URLSearchParams(location.search);
  const playerSlug = params.get("player");

  if(!playerSlug){
    document.getElementById("playerName").innerText = "Player not found";
    return;
  }

  const res = await fetch("/data/golf/pga_winners.json");
  const data = await res.json();

  let playerName = "";
  const wins = [];

  data.forEach(d=>{
    const name = clean(d.winner);
    if(!name) return;

    if(slug(name) === playerSlug){
      playerName = name;

      wins.push({
        year: d.year,
        tournament: d.tournament,
        major: d.major === true
      });
    }
  });

  if(!playerName){
    document.getElementById("playerName").innerText = "Player not found";
    return;
  }

  // sort latest first
  wins.sort((a,b)=>b.year - a.year);

  document.getElementById("playerName").innerText = playerName;

  const totalWins = wins.length;
  const majors = wins.filter(w=>w.major).length;

  document.getElementById("summary").innerText =
    totalWins + " wins / " + majors + " majors";

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  wins.forEach(w=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${w.year}</td>
      <td>${w.tournament}</td>
      <td>${w.major ? "Yes" : ""}</td>
    `;

    tbody.appendChild(tr);
  });

  // SEARCH (press Enter)
  const players = [...new Set(
    data.map(d=>clean(d.winner)).filter(n=>n)
  )].sort();

  const search = document.getElementById("search");

  search.addEventListener("keydown", e=>{
    if(e.key === "Enter"){
      const val = search.value.toLowerCase();

      const match = players.find(p => p.toLowerCase() === val);

      if(match){
        location.href = "/golf-player.html?player=" + slug(match);
      }
    }
  });
}

load();
</script>

</body>
</html>
