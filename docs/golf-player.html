<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:36px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,5vw,38px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}
.hero p{
  margin-top:10px;font-size:14.5px;color:rgba(255,255,255,.7);
}

.page{max-width:900px;margin:0 auto;padding:26px 20px 70px;}

.table-wrap{
  display:none;
  overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
</div>

<div class="hero">
  <span class="eyebrow">The Sporting Almanac</span>
  <h1 id="playerName">Loading...</h1>
  <p id="summary"></p>
</div>

<div class="page">

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Year</th>
          <th>Tournament</th>
          <th>Major</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>

function cleanPlayerName(name){
  if(!name) return "";
  return name
    .replace(/\./g,". ")
    .replace(/\s+/g," ")
    .replace(/\b([a-z])/g,l=>l.toUpperCase())
    .replace(/\s*\(.*?\)/g,"")
    .replace(/\*/g,"")
    .trim();
}

function cleanTournament(name){
  if(!name) return "";
  return name
    .replace(/Augusta National.*$/i,"")
    .replace(/ - .*$/i,"")
    .trim();
}

function slug(name){
  return String(name||"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/-+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function isMajor(name){
  if(!name) return false;
  const n=name.toLowerCase();
  return (
    n.includes("masters") ||
    n.includes("us open") ||
    n.includes("open championship") ||
    n.includes("pga championship")
  );
}

async function fetchData(){
  let res=await fetch("/data/golf/pga_winners.json");
  if(!res.ok) res=await fetch("/docs/data/golf/pga_winners.json");
  if(!res.ok) return [];
  return await res.json();
}

async function load(){

  const params=new URLSearchParams(location.search);
  const rawPlayer=params.get("player") || "";
  const playerSlug=slug(rawPlayer);

  const data=await fetchData();

  let playerName="";
  const wins=[];

  data.forEach(d=>{
    const winner=cleanPlayerName(d.winner);
    if(!winner) return;

    const winnerSlug=slug(winner);

    if(
      winnerSlug===playerSlug ||
      winner.toLowerCase()===decodeURIComponent(rawPlayer).toLowerCase()
    ){
      playerName=winner;

      const tournament=cleanTournament(d.event||"");

      wins.push({
        year:d.year,
        tournament,
        isMajor:isMajor(tournament)
      });
    }
  });

  if(!playerName){
    document.getElementById("playerName").innerText="Player not found";
    return;
  }

  document.getElementById("playerName").innerText=playerName;

  const seen=new Set();
  const uniqueWins=wins.filter(w=>{
    const key=w.year+"|"+w.tournament.toLowerCase();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  const totalWins=uniqueWins.length;
  const majors=uniqueWins.filter(w=>w.isMajor).length;

  document.getElementById("summary").innerText=
    totalWins+" wins / "+majors+" majors";

  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  uniqueWins
    .sort((a,b)=>b.year-a.year)
    .forEach(w=>{
      const tr=document.createElement("tr");

      tr.innerHTML=`
        <td>${w.year}</td>
        <td>${!w.isMajor ? w.tournament : ""}</td>
        <td>${w.isMajor ? w.tournament : ""}</td>
      `;

      tbody.appendChild(tr);
    });

  document.querySelector(".table-wrap").style.display="block";
}

load();

</script>

</body>
</html>
