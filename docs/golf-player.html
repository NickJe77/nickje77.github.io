<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#0c6f3c;
  --green-dark:#08552d;
  --gold:#d9b44a;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e3e7eb;
  --zebra:#f3f8f4;
  --blue:#0056d6;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:var(--blue);
  text-decoration:none;
  font-size:18px;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#08552d,#0c6f3c);
  color:#fff;
  text-align:center;
  padding:35px 20px 25px;
  border-bottom:4px solid var(--gold);
}

.hero h1{
  margin:0;
  font-size:40px;
}

.hero .wins{
  margin-top:10px;
  font-size:18px;
}

/* SEARCH */
.search-bar{
  margin-top:18px;
  display:flex;
  justify-content:center;
}

.search-wrap{
  position:relative;
  width:320px;
}

.search-wrap input{
  width:100%;
  padding:10px 12px;
  border-radius:8px;
  border:none;
  font-size:14px;
}

/* AUTOCOMPLETE */
.suggestions{
  position:absolute;
  top:42px;
  left:0;
  right:0;
  background:#fff;
  border:1px solid #ccc;
  border-radius:8px;
  max-height:220px;
  overflow-y:auto;
  display:none;
  z-index:10;
}

.suggestions div{
  padding:10px;
  cursor:pointer;
}

.suggestions div:hover{
  background:#eee;
}

/* PAGE */
.page{
  max-width:900px;
  margin:auto;
  padding:25px;
}

/* TABLE */
.table-card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:var(--green);
  color:#fff;
}

th,td{
  padding:12px;
  font-size:14px;
  text-align:left;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}

.year{
  width:100px;
  font-weight:700;
}

.tournament{
  color:var(--blue);
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/golf-majors.html">Majors</a>
</div>

<div class="hero">
  <h1 id="playerName">Player</h1>
  <div class="wins" id="winsText"></div>

  <!-- SEARCH -->
  <div class="search-bar">
    <div class="search-wrap">
      <input type="text" id="playerSearch" placeholder="Search player">
      <div id="playerSuggestions" class="suggestions"></div>
    </div>
  </div>
</div>

<div class="page">

<div class="table-card">
<table>
<thead>
<tr>
  <th>Year</th>
  <th>Tournament</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>
const majorsList = [
  "Masters Tournament",
  "PGA Championship",
  "U.S. Open",
  "The Open Championship"
];

let allPlayers = [];

function getParam(name){
  const url=new URL(window.location.href);
  return url.searchParams.get(name);
}

async function load(){
  const player=getParam("player");
  document.getElementById("playerName").textContent=player;

  const res=await fetch("/data/golf/pga_winners.json");
  const data=await res.json();

  // build player list
  allPlayers=[...new Set(data.map(d=>d.winner))].sort();

  const wins=data
    .filter(d=>d.winner===player)
    .filter(d=>{
      const w=(d.winner||"").toLowerCase();
      return !w.includes("cancel") && !w.includes("postpon");
    })
    .sort((a,b)=>b.year-a.year);

  const totalWins = wins.length;
  const majorWins = wins.filter(w => majorsList.includes(w.event)).length;

  document.getElementById("winsText").textContent =
    `${totalWins} wins / ${majorWins} ${majorWins===1?"major":"majors"}`;

  const tbody=document.getElementById("tableBody");

  wins.forEach(w=>{
    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td class="year">${w.year}</td>
      <td class="tournament">${w.event}</td>
    `;

    tbody.appendChild(tr);
  });

  setupSearch();
}

/* SEARCH */
function setupSearch(){
  const input=document.getElementById("playerSearch");
  const box=document.getElementById("playerSuggestions");

  input.addEventListener("input",()=>{
    const val=input.value.toLowerCase();
    box.innerHTML="";

    if(!val){
      box.style.display="none";
      return;
    }

    const matches=allPlayers
      .filter(p=>p.toLowerCase().includes(val))
      .slice(0,10);

    matches.forEach(m=>{
      const div=document.createElement("div");
      div.textContent=m;

      div.onclick=()=>{
        window.location.href="/golf-player.html?player="+encodeURIComponent(m);
      };

      box.appendChild(div);
    });

    box.style.display="block";
  });
}

load();
</script>

</body>
</html>
