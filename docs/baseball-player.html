<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
  --soft:#f0f6ff;
}
body{font-family:Inter,system-ui,Arial;margin:0;background:var(--bg);color:var(--text);}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1400px;margin:auto;padding:20px;}

.hero{
  background:linear-gradient(90deg,var(--blue), #3a256e, var(--red));
  color:white;
  padding:30px;
  border-radius:20px 20px 0 0;
}
.hero h1{margin:0;font-size:40px;}

.section{background:var(--card);padding:20px;border-radius:18px;margin-bottom:18px;}

.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.card{background:var(--soft);border-radius:14px;padding:16px;text-align:center;}
.card .value{font-size:26px;font-weight:900;}
.card .label{margin-top:6px;font-size:12px;color:#555;}

.controls{display:flex;gap:14px;margin-bottom:14px;}
select{padding:10px 14px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:14px;}

table{width:100%;border-collapse:collapse;}
th{background:var(--blue);color:white;padding:10px;}
td{padding:8px;border-bottom:1px solid #eee;text-align:center;}
tr:nth-child(even){background:#f7fbff;}
.game-row{cursor:pointer;}
.game-row:hover{background:#eaf3ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
  <a href="/baseball-leaders.html">Leaders</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
</div>

<div class="section">
  <h2>Career</h2>
  <div class="cards" id="careerCards"></div>
</div>

<div class="section">
  <h2>Games</h2>

  <div class="controls">
    <select id="seasonSelect">
      <option value="all">All Seasons</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Team</th>
        <th>Opponent</th>
        <th>AB</th>
        <th>H</th>
        <th>HR</th>
        <th>AVG</th>
      </tr>
    </thead>
    <tbody id="gameBody"></tbody>
  </table>
</div>

</div>

<script>
(async function(){

function avg(h,ab){return ab?(h/ab).toFixed(3):"0.000";}
function formatDate(d){
  const dt=new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString("en-AU",{year:"numeric",month:"short",day:"numeric"});
}
async function safeFetch(url){
  const r=await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

const qs=new URLSearchParams(location.search);
const playerId=qs.get("player");
if(!playerId){
  document.getElementById("playerName").textContent="Player not found";
  return;
}

const playersIndex=await safeFetch("/data/baseball/players.json");
const playerMeta=playersIndex.find(p=>String(p.player_id)===String(playerId));
if(!playerMeta){
  document.getElementById("playerName").textContent="Player not found";
  return;
}
document.getElementById("playerName").textContent=playerMeta.name;

const teamsData=await safeFetch("/data/baseball/teams.json");
let TEAM_LOOKUP={};
teamsData.forEach(t=>t.codes.forEach(c=>TEAM_LOOKUP[c]=t.name));
function teamName(code){return TEAM_LOOKUP[code]||code;}

const seasons=await safeFetch("/data/baseball/index.json");
const seasonSelect=document.getElementById("seasonSelect");

seasons.sort((a,b)=>b-a).forEach(y=>{
  seasonSelect.innerHTML+=`<option value="${y}">${y}</option>`;
});

let games=[];
let career={games:0,ab:0,h:0,hr:0};

async function loadSeason(year){

  const data=await safeFetch(`/data/baseball/seasons/${year}.json`);
  if(!data) return;

  data.forEach(g=>{
    let player =
      g[5].find(p=>p[0]===playerId) ||
      g[6].find(p=>p[0]===playerId);

    if(!player) return;

    const teamCode =
      g[5].some(p=>p[0]===playerId)
      ? g[3]
      : g[4];

    const oppCode =
      teamCode===g[3] ? g[4] : g[3];

    games.push({
      date:g[1],
      season:g[2],
      team:teamCode,
      opponent:oppCode,
      AB:player[1],
      H:player[2],
      HR:player[3]
    });

    career.games++;
    career.ab+=player[1];
    career.h+=player[2];
    career.hr+=player[3];
  });
}

async function loadAllSeasons(){
  games=[];
  career={games:0,ab:0,h:0,hr:0};

  for(const y of seasons){
    await loadSeason(y);
  }
  render();
}

function render(){

  document.getElementById("careerCards").innerHTML=`
  <div class="card"><div class="value">${career.games}</div><div class="label">Games</div></div>
  <div class="card"><div class="value">${career.ab}</div><div class="label">AB</div></div>
  <div class="card"><div class="value">${career.h}</div><div class="label">Hits</div></div>
  <div class="card"><div class="value">${career.hr}</div><div class="label">HR</div></div>
  <div class="card"><div class="value">${avg(career.h,career.ab)}</div><div class="label">AVG</div></div>
  `;

  games.sort((a,b)=>new Date(b.date)-new Date(a.date));

  document.getElementById("gameBody").innerHTML=
    games.map(g=>`
    <tr class="game-row">
      <td>${formatDate(g.date)}</td>
      <td>${teamName(g.team)}</td>
      <td>${teamName(g.opponent)}</td>
      <td>${g.AB}</td>
      <td>${g.H}</td>
      <td>${g.HR}</td>
      <td>${avg(g.H,g.AB)}</td>
    </tr>`).join("");
}

seasonSelect.onchange=async()=>{
  const val=seasonSelect.value;
  games=[];
  career={games:0,ab:0,h:0,hr:0};

  if(val==="all"){
    await loadAllSeasons();
  }else{
    await loadSeason(val);
    render();
  }
};

await loadAllSeasons();

})();
</script>

</body>
</html>
