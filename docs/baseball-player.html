<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
  --soft:#f0f6ff;
}

body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,var(--blue), #3a256e, var(--red));
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:20px;
}

.hero h1{
  margin:0;
  font-size:40px;
}

/* resized properly */
.search-wrap{
  display:flex;
  gap:10px;
  min-width:300px;
}

.search{
  width:100%;
  padding:16px 18px;
  border-radius:14px;
  border:2px solid rgba(255,255,255,0.45);
  font-size:18px;
  background:rgba(255,255,255,0.15);
  color:white;
  font-weight:600;
  height:52px;
}

.btn{
  padding:0 20px;
  border-radius:14px;
  border:2px solid rgba(255,255,255,0.45);
  background:rgba(255,255,255,0.18);
  color:white;
  font-weight:800;
  font-size:16px;
  height:52px;
  cursor:pointer;
}

.section{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.card{
  background:var(--soft);
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.card .value{
  font-size:26px;
  font-weight:900;
}

/* team & opponent dropdown resized */
select{
  padding:14px 16px;
  border-radius:12px;
  border:1px solid var(--line);
  font-weight:700;
  font-size:16px;
  height:48px;
  margin-bottom:14px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--blue);
  color:white;
  padding:10px;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
  <div class="search-wrap">
    <input id="playerSearch" class="search" list="playerList" placeholder="Search player name..." />
    <datalist id="playerList"></datalist>
    <button id="goBtn" class="btn">Go</button>
  </div>
</div>

<div class="section">
  <h2>Career</h2>
  <div class="cards" id="careerCards"></div>
</div>

<div class="section">
  <h2>By Team</h2>
  <select id="teamSelect"></select>
  <div class="cards" id="teamCards"></div>
</div>

<div class="section">
  <h2>Vs Opponent</h2>
  <select id="oppSelect"></select>
  <div class="cards" id="oppCards"></div>
</div>

<div class="section">
  <h2>Season Breakdown</h2>
  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>Team</th>
        <th>G</th>
        <th>PA</th>
        <th>AB</th>
        <th>H</th>
        <th>HR</th>
        <th>BB</th>
        <th>SO</th>
        <th>AVG</th>
      </tr>
    </thead>
    <tbody id="seasonBody"></tbody>
  </table>
</div>

</div>

<script>
(function(){

const qs = new URLSearchParams(location.search);
const playerId = qs.get("player");

if(!playerId){
  document.getElementById("playerName").textContent="Player Not Found";
  return;
}

function fmt(n){return Number(n||0).toLocaleString();}
function avg(h,ab){return ab?(h/ab).toFixed(3):"0.000";}

async function safeFetch(url){
  const r=await fetch(url);
  if(!r.ok) return null;
  return r.json();
}

function resolvePlayerName(players,id){
  return players.find(p =>
    String(p.player_id)===String(id) ||
    String(p.playerId)===String(id) ||
    String(p.id)===String(id) ||
    String(p.bbref_id)===String(id) ||
    String(p.key)===String(id)
  );
}

async function init(){

const players=await safeFetch("./data/baseball/players.json");
if(players){
  const list=document.getElementById("playerList");
  list.innerHTML=players.map(p=>`<option value="${p.player_name||p.name}"></option>`).join("");

  const match=resolvePlayerName(players,playerId);
  if(match){
    document.getElementById("playerName").textContent =
      match.player_name || match.name || match.full_name || "Unknown Player";
  }
}

const seasons=await safeFetch("./data/baseball/index.json");
if(!seasons) return;

let career={games:0,plate_appearances:0,at_bats:0,hits:0,home_runs:0,walks:0,strikeouts:0};
let teamAgg=new Map();
let seasonRows=[];

for(const s of seasons){
  const data=await safeFetch(`./data/baseball/players/${s}.json`);
  if(!data) continue;

  const row=data.find(p =>
    String(p.player_id)===String(playerId) ||
    String(p.playerId)===String(playerId) ||
    String(p.id)===String(playerId)
  );
  if(!row) continue;

  seasonRows.push({...row,season:s});

  for(const k in career){
    career[k]+=row[k]||0;
  }

  if(!teamAgg.has(row.team)){
    teamAgg.set(row.team,{games:0,hits:0,home_runs:0,walks:0,at_bats:0});
  }
  const t=teamAgg.get(row.team);
  t.games+=row.games||0;
  t.hits+=row.hits||0;
  t.home_runs+=row.home_runs||0;
  t.walks+=row.walks||0;
  t.at_bats+=row.at_bats||0;
}

document.getElementById("careerCards").innerHTML=`
<div class="card"><div class="value">${fmt(career.games)}</div><div>Games</div></div>
<div class="card"><div class="value">${fmt(career.hits)}</div><div>Hits</div></div>
<div class="card"><div class="value">${fmt(career.home_runs)}</div><div>HR</div></div>
<div class="card"><div class="value">${avg(career.hits,career.at_bats)}</div><div>AVG</div></div>
`;

const teamSelect=document.getElementById("teamSelect");
teamSelect.innerHTML=[...teamAgg.keys()].map(t=>`<option value="${t}">${t}</option>`).join("");
teamSelect.onchange=()=>{
  const t=teamAgg.get(teamSelect.value);
  if(!t) return;
  document.getElementById("teamCards").innerHTML=`
  <div class="card"><div class="value">${fmt(t.games)}</div><div>Games</div></div>
  <div class="card"><div class="value">${fmt(t.hits)}</div><div>Hits</div></div>
  <div class="card"><div class="value">${fmt(t.home_runs)}</div><div>HR</div></div>
  <div class="card"><div class="value">${avg(t.hits,t.at_bats)}</div><div>AVG</div></div>
  `;
};
if(teamSelect.value) teamSelect.onchange();

document.getElementById("seasonBody").innerHTML=seasonRows.map(r=>`
<tr>
<td>${r.season}</td>
<td>${r.team}</td>
<td>${r.games}</td>
<td>${r.plate_appearances}</td>
<td>${r.at_bats}</td>
<td>${r.hits}</td>
<td>${r.home_runs}</td>
<td>${r.walks}</td>
<td>${r.strikeouts}</td>
<td>${avg(r.hits,r.at_bats)}</td>
</tr>`).join("");

const oppData=await safeFetch(`./data/baseball/opponents/${playerId}.json`);
if(oppData){
  const sel=document.getElementById("oppSelect");
  sel.innerHTML=oppData.map(o=>`<option value="${o.opponent}">${o.opponent}</option>`).join("");
  sel.onchange=()=>{
    const d=oppData.find(o=>o.opponent===sel.value);
    if(!d) return;
    document.getElementById("oppCards").innerHTML=`
    <div class="card"><div class="value">${fmt(d.games)}</div><div>Games</div></div>
    <div class="card"><div class="value">${fmt(d.hits)}</div><div>Hits</div></div>
    <div class="card"><div class="value">${fmt(d.home_runs)}</div><div>HR</div></div>
    <div class="card"><div class="value">${avg(d.hits,d.at_bats)}</div><div>AVG</div></div>
    `;
  };
  if(sel.value) sel.onchange();
}

}

init();

})();
</script>

</body>
</html>
