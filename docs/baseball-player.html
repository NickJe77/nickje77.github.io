<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:40px;
}

.hero select{
margin-top:10px;
padding:8px;
border-radius:8px;
border:none;
}

.card{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:16px;
}

.card h3{
margin:0 0 12px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.right{text-align:right;}

</style>
</head>
<body>

<div class="page">

<div class="hero">

<h1 id="playerName">Loading...</h1>

<select id="seasonSelect"></select>

</div>

<div class="card">

<h3>Season Stats</h3>

<table>

<thead>
<tr>
<th>Team</th>
<th class="right">G</th>
<th class="right">AB</th>
<th class="right">H</th>
<th class="right">HR</th>
<th class="right">RBI</th>
<th class="right">AVG</th>
</tr>
</thead>

<tbody id="seasonBody"></tbody>

</table>

</div>

<div class="card">

<h3>Game Log</h3>

<table>

<thead>
<tr>
<th>Date</th>
<th>Team</th>
<th>Opponent</th>
<th class="right">AB</th>
<th class="right">H</th>
<th class="right">HR</th>
<th class="right">RBI</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

</div>

<script>

const player=new URLSearchParams(location.search).get("player");

playerName.textContent=player;

let currentSeason;
let SEASONS=[];

async function init(){

SEASONS=await fetch("data/baseball/index.json")
.then(r=>r.json());

SEASONS.sort((a,b)=>b-a);

seasonSelect.innerHTML=
SEASONS.map(s=>`<option>${s}</option>`).join("");

currentSeason=SEASONS[0];

seasonSelect.value=currentSeason;

seasonSelect.onchange=()=>{

currentSeason=seasonSelect.value;
loadSeason();

};

loadSeason();

}

async function loadSeason(){

const games=await fetch(
`data/baseball/seasons/${currentSeason}.json`
).then(r=>r.json());

const playerGames=[];

const boxes=await Promise.all(

games.map(g=>
fetch(`data/baseball/boxscores/${g.date}_${g.away_code}_${g.home_code}.json`)
.then(r=>r.json())
)

);

boxes.forEach(box=>{

(box.batting||[]).forEach(p=>{

if(p.player!=player)return;

playerGames.push({

date:box.date,
team:p.team,
opponent:
p.team==box.home_code?
box.away_team:box.home_team,
AB:p.AB||0,
H:p.H||0,
HR:p.HR||0,
RBI:p.RBI||0,
gameId:
`${box.date}_${box.away_code}_${box.home_code}`

});

});

});

/* STATS */

let ab=0,h=0,hr=0,rbi=0;

playerGames.forEach(g=>{

ab+=g.AB;
h+=g.H;
hr+=g.HR;
rbi+=g.RBI;

});

seasonBody.innerHTML=`

<tr>

<td>${playerGames[0]?.team||""}</td>

<td class="right">${playerGames.length}</td>

<td class="right">${ab}</td>

<td class="right">${h}</td>

<td class="right">${hr}</td>

<td class="right">${rbi}</td>

<td class="right">${ab?(h/ab).toFixed(3):".000"}</td>

</tr>

`;

/* GAME LOG */

gamesBody.innerHTML="";

playerGames.forEach(g=>{

gamesBody.innerHTML+=`

<tr>

<td class="click"
onclick="location.href='baseball-game.html?id=${g.gameId}'">
${g.date}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.team}'">
${g.team}
</td>

<td>${g.opponent}</td>

<td class="right">${g.AB}</td>
<td class="right">${g.H}</td>
<td class="right">${g.HR}</td>
<td class="right">${g.RBI}</td>

</tr>

`;

});

}

init();

</script>

</body>
</html>
