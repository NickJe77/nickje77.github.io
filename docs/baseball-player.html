<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  :root{
    --blue:#002D72;
    --red:#C8102E;
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#0b1220;
    --muted:#667085;
    --line:#e6e8ee;
    --soft:#f0f6ff;
    --chip:#eef2ff;
  }

  body{
    font-family: Inter, system-ui, Arial, sans-serif;
    margin:0;
    background:var(--bg);
    color:var(--text);
  }

  .navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px;
    background:#fff;
    border-bottom:1px solid #ddd;
    font-weight:700;
  }
  .navbar a{ text-decoration:none; color:#0056d6; }

  .page{
    max-width:1200px;
    margin:auto;
    padding:20px;
  }

  .hero{
    background:linear-gradient(90deg,var(--blue), #3a256e, var(--red));
    color:white;
    padding:28px 30px;
    border-radius:20px;
    margin-bottom:16px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
  }

  .hero h1{
    margin:0;
    font-size:38px;
    letter-spacing:-0.5px;
  }

  .hero-right{
    min-width:340px;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:flex-end;
  }

  .search-wrap{
    width:100%;
    max-width:420px;
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:flex-end;
  }

  .search{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.35);
    outline:none;
    font-size:14px;
    background:rgba(255,255,255,0.10);
    color:white;
  }
  .search::placeholder{ color:rgba(255,255,255,0.8); }

  .btn{
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.12);
    color:white;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{ background:rgba(255,255,255,0.18); }

  .meta-line{
    font-size:13px;
    opacity:0.92;
    text-align:right;
    min-height:16px;
  }

  .section{
    background:var(--card);
    padding:18px;
    border-radius:18px;
    margin-bottom:16px;
    box-shadow:0 1px 0 rgba(15,23,42,0.04);
  }

  .section h2{
    margin:0 0 14px 0;
    font-size:22px;
    letter-spacing:-0.2px;
  }

  .cards{
    display:grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap:14px;
  }

  .card{
    background:var(--soft);
    border-radius:14px;
    padding:16px;
    text-align:center;
    border:1px solid #e8efff;
  }

  .card .value{
    font-size:28px;
    font-weight:900;
    line-height:1.1;
  }
  .card .label{
    margin-top:6px;
    font-size:12px;
    color:#4b5563;
    letter-spacing:0.2px;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }

  select{
    padding:8px 10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    font-size:13px;
    outline:none;
  }

  .pill{
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    background:var(--chip);
    border:1px solid #e2e8ff;
    font-size:12px;
    color:#334155;
    font-weight:800;
  }

  table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    overflow:hidden;
    border-radius:14px;
    border:1px solid var(--line);
    background:#fff;
  }

  thead th{
    background:var(--blue);
    color:white;
    padding:12px 10px;
    text-align:left;
    font-size:13px;
    letter-spacing:0.2px;
    user-select:none;
    cursor:pointer;
    white-space:nowrap;
  }

  thead th:hover{ filter:brightness(1.07); }

  tbody td{
    padding:10px 10px;
    border-bottom:1px solid #eef0f5;
    font-size:14px;
    white-space:nowrap;
  }

  tbody tr:nth-child(even){ background:#f7fbff; }
  tbody tr:last-child td{ border-bottom:none; }

  .muted{ color:var(--muted); font-size:13px; }
  .note{ margin-top:10px; font-size:12px; color:var(--muted); line-height:1.35; }

  @media (max-width: 980px){
    .cards{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero{ flex-direction:column; align-items:flex-start; }
    .hero-right{ align-items:flex-start; min-width:unset; width:100%; }
    .search-wrap{ max-width:520px; justify-content:flex-start; }
    .meta-line{ text-align:left; }
  }
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

  <div class="hero">
    <div>
      <h1 id="playerName">Loading…</h1>
    </div>

    <div class="hero-right">
      <div class="search-wrap">
        <input id="playerSearch" class="search" list="playerNameHints" placeholder="Search player name (e.g. Shohei Ohtani)..." />
        <datalist id="playerNameHints"></datalist>
        <button id="goBtn" class="btn">Go</button>
      </div>
      <div class="meta-line" id="statusLine"></div>
    </div>
  </div>

  <!-- 1) CAREER -->
  <div class="section">
    <h2>Career Summary</h2>
    <div class="cards" id="careerCards"></div>
  </div>

  <!-- 2) BY TEAM -->
  <div class="section">
    <h2>By Team</h2>
    <div class="controls">
      <select id="teamSelect"></select>
      <span class="pill" id="teamHint">Loading…</span>
      <span class="muted" id="teamSubHint"></span>
    </div>
    <div class="cards" id="teamCards"></div>
  </div>

  <!-- 3) VS OPPONENT -->
  <div class="section">
    <h2>Vs Selected Opponent</h2>
    <div class="controls">
      <select id="oppSelect"></select>
      <span class="pill" id="oppHint">Loading…</span>
      <span class="muted" id="oppSubHint"></span>
    </div>
    <div class="cards" id="oppCards"></div>
    <div class="note" id="oppNote">
      Opponent stats are built from your <b>boxscores</b>. First load may take a while. After that it’s cached in your browser for this player.
    </div>
  </div>

  <!-- SEASON TABLE -->
  <div class="section">
    <h2>Season Breakdown</h2>
    <div class="muted" id="seasonCount"></div>

    <div style="margin-top:12px; overflow:auto;">
      <table id="seasonTable">
        <thead>
          <tr>
            <th data-key="season">Season</th>
            <th data-key="team">Team</th>
            <th data-key="games">G</th>
            <th data-key="plate_appearances">PA</th>
            <th data-key="at_bats">AB</th>
            <th data-key="hits">H</th>
            <th data-key="home_runs">HR</th>
            <th data-key="walks">BB</th>
            <th data-key="strikeouts">SO</th>
            <th data-key="avg">AVG</th>
          </tr>
        </thead>
        <tbody id="seasonBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
(function(){
  // =========================
  // TEAM CODE -> FULL NAME
  // (Retrosheet-ish codes + modern)
  // =========================
  const TEAM_NAME = {
    // Modern / common
    "ANA":"Los Angeles Angels",
    "ARI":"Arizona Diamondbacks",
    "ATL":"Atlanta Braves",
    "BAL":"Baltimore Orioles",
    "BOS":"Boston Red Sox",
    "CHA":"Chicago White Sox",
    "CHN":"Chicago Cubs",
    "CIN":"Cincinnati Reds",
    "CLE":"Cleveland Guardians",
    "COL":"Colorado Rockies",
    "DET":"Detroit Tigers",
    "HOU":"Houston Astros",
    "KCA":"Kansas City Royals",
    "LAN":"Los Angeles Dodgers",
    "MIA":"Miami Marlins",
    "MIL":"Milwaukee Brewers",
    "MIN":"Minnesota Twins",
    "NYA":"New York Yankees",
    "NYN":"New York Mets",
    "OAK":"Oakland Athletics",
    "PHI":"Philadelphia Phillies",
    "PIT":"Pittsburgh Pirates",
    "SDN":"San Diego Padres",
    "SEA":"Seattle Mariners",
    "SFN":"San Francisco Giants",
    "SLN":"St. Louis Cardinals",
    "TBA":"Tampa Bay Rays",
    "TEX":"Texas Rangers",
    "TOR":"Toronto Blue Jays",
    "WAS":"Washington Nationals",

    // Older / Retrosheet-like
    "BRO":"Brooklyn Dodgers",
    "BSN":"Boston Braves",
    "NY1":"New York Giants",
    "NY2":"New York Yankees",
    "NY3":"New York Mets",
    "PHA":"Philadelphia Athletics",
    "PHN":"Philadelphia Phillies",
    "SL4":"St. Louis Browns",
    "SL5":"St. Louis Cardinals",
    "WS1":"Washington Senators",
    "WS2":"Washington Senators",
    "WSH":"Washington Nationals",
    "CAL":"California Angels",
    "MON":"Montreal Expos",
    "FLO":"Florida Marlins",
    "TBD":"Tampa Bay Rays",

    // You may have other 3-char codes in your datasets; they’ll fall back to code itself.
  };

  function fullTeamName(code){
    const c = (code===undefined || code===null) ? "" : String(code).trim();
    if(!c) return "—";
    return TEAM_NAME[c] || c;
  }

  // =========================
  // DOM
  // =========================
  const qs = new URLSearchParams(location.search);
  let playerId = (qs.get("player") || "").trim();

  const elName = document.getElementById("playerName");
  const elStatus = document.getElementById("statusLine");

  const elCareerCards = document.getElementById("careerCards");

  const elTeamCards = document.getElementById("teamCards");
  const elTeamSelect = document.getElementById("teamSelect");
  const elTeamHint = document.getElementById("teamHint");
  const elTeamSubHint = document.getElementById("teamSubHint");

  const elOppCards = document.getElementById("oppCards");
  const elOppSelect = document.getElementById("oppSelect");
  const elOppHint = document.getElementById("oppHint");
  const elOppSubHint = document.getElementById("oppSubHint");

  const elSeasonBody = document.getElementById("seasonBody");
  const elSeasonCount = document.getElementById("seasonCount");

  const elSearch = document.getElementById("playerSearch");
  const elGo = document.getElementById("goBtn");
  const elHints = document.getElementById("playerNameHints");

  // =========================
  // STATE
  // =========================
  let seasonsList = [];
  let seasonRows = []; // per season stats row
  let teamAgg = new Map(); // team -> totals
  let oppAgg = new Map();  // oppTeam -> totals

  let career = { games:0, plate_appearances:0, at_bats:0, hits:0, home_runs:0, walks:0, strikeouts:0 };

  // Sorting
  let sortKey = "season";
  let sortDir = "desc";

  // =========================
  // HELPERS
  // =========================
  function setStatus(msg){ elStatus.textContent = msg || ""; }

  function fmtInt(n){
    const v = Number(n || 0);
    return isFinite(v) ? v.toLocaleString("en-US") : "0";
  }

  function fmtAvg(h, ab){
    const H = Number(h || 0), AB = Number(ab || 0);
    if(!AB) return "0.000";
    return (H/AB).toFixed(3);
  }

  function renderCards(container, cards){
    container.innerHTML = cards.map(c => `
      <div class="card">
        <div class="value">${c.value}</div>
        <div class="label">${c.label}</div>
      </div>
    `).join("");
  }

  function safeNum(x){
    const n = Number(x || 0);
    return isFinite(n) ? n : 0;
  }

  async function safeFetchJson(url){
    const res = await fetch(url, { cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status} ${url}`);
    return await res.json();
  }

  async function mapLimit(items, limit, worker){
    const results = [];
    let i = 0;

    const runners = new Array(Math.min(limit, items.length)).fill(0).map(async () => {
      while(i < items.length){
        const idx = i++;
        try{
          results[idx] = await worker(items[idx], idx);
        }catch(e){
          results[idx] = null;
        }
      }
    });

    await Promise.all(runners);
    return results;
  }

  function addToCareer(row){
    career.games += safeNum(row.games);
    career.plate_appearances += safeNum(row.plate_appearances);
    career.at_bats += safeNum(row.at_bats);
    career.hits += safeNum(row.hits);
    career.home_runs += safeNum(row.home_runs);
    career.walks += safeNum(row.walks);
    career.strikeouts += safeNum(row.strikeouts);
  }

  function addToAgg(map, key, row){
    const k = (key===undefined || key===null) ? "" : String(key).trim();
    if(!map.has(k)){
      map.set(k, { games:0, plate_appearances:0, at_bats:0, hits:0, home_runs:0, walks:0, strikeouts:0 });
    }
    const t = map.get(k);
    t.games += safeNum(row.games);
    t.plate_appearances += safeNum(row.plate_appearances);
    t.at_bats += safeNum(row.at_bats);
    t.hits += safeNum(row.hits);
    t.home_runs += safeNum(row.home_runs);
    t.walks += safeNum(row.walks);
    t.strikeouts += safeNum(row.strikeouts);
  }

  // =========================
  // RENDER
  // =========================
  function renderCareer(){
    const avg = fmtAvg(career.hits, career.at_bats);
    renderCards(elCareerCards, [
      { label:"Games", value: fmtInt(career.games) },
      { label:"Plate Appearances", value: fmtInt(career.plate_appearances) },
      { label:"Hits", value: fmtInt(career.hits) },
      { label:"Home Runs", value: fmtInt(career.home_runs) },
      { label:"Batting Avg", value: avg }
    ]);
  }

  function renderTeam(teamKey){
    const t = teamAgg.get(teamKey);
    elTeamHint.textContent = fullTeamName(teamKey);
    elTeamSubHint.textContent = t ? "" : "No data";
    renderCards(elTeamCards, [
      { label:"Games", value: fmtInt(t ? t.games : 0) },
      { label:"Hits", value: fmtInt(t ? t.hits : 0) },
      { label:"Home Runs", value: fmtInt(t ? t.home_runs : 0) },
      { label:"Walks", value: fmtInt(t ? t.walks : 0) },
      { label:"Strikeouts", value: fmtInt(t ? t.strikeouts : 0) }
    ]);
  }

  function renderOpponent(oppKey){
    const t = oppAgg.get(oppKey);
    elOppHint.textContent = fullTeamName(oppKey);
    elOppSubHint.textContent = t ? "" : "No data";
    renderCards(elOppCards, [
      { label:"Games", value: fmtInt(t ? t.games : 0) },
      { label:"Hits", value: fmtInt(t ? t.hits : 0) },
      { label:"Home Runs", value: fmtInt(t ? t.home_runs : 0) },
      { label:"Walks", value: fmtInt(t ? t.walks : 0) },
      { label:"Strikeouts", value: fmtInt(t ? t.strikeouts : 0) }
    ]);
  }

  function sortRows(rows){
    const dir = (sortDir === "asc") ? 1 : -1;
    return rows.slice().sort((a,b) => {
      let av = a[sortKey];
      let bv = b[sortKey];

      if(sortKey === "team"){
        av = fullTeamName(av);
        bv = fullTeamName(bv);
        return av.localeCompare(bv) * dir;
      }

      if(sortKey === "season"){
        av = Number(av||0); bv = Number(bv||0);
        return (av - bv) * dir;
      }

      if(sortKey === "avg"){
        av = Number(av||0); bv = Number(bv||0);
        return (av - bv) * dir;
      }

      av = Number(av||0); bv = Number(bv||0);
      return (av - bv) * dir;
    });
  }

  function renderSeasonTable(){
    const sorted = sortRows(seasonRows);
    elSeasonCount.textContent = `${sorted.length.toLocaleString("en-US")} seasons found`;

    elSeasonBody.innerHTML = sorted.map(r => `
      <tr>
        <td><b>${r.season}</b></td>
        <td>${fullTeamName(r.team)}</td>
        <td>${fmtInt(r.games)}</td>
        <td>${fmtInt(r.plate_appearances)}</td>
        <td>${fmtInt(r.at_bats)}</td>
        <td>${fmtInt(r.hits)}</td>
        <td>${fmtInt(r.home_runs)}</td>
        <td>${fmtInt(r.walks)}</td>
        <td>${fmtInt(r.strikeouts)}</td>
        <td>${Number(r.avg||0).toFixed(3)}</td>
      </tr>
    `).join("");
  }

  function wireSorting(){
    const ths = document.querySelectorAll("#seasonTable thead th");
    ths.forEach(th => {
      th.addEventListener("click", () => {
        const key = th.getAttribute("data-key");
        if(!key) return;

        if(sortKey === key){
          sortDir = (sortDir === "asc") ? "desc" : "asc";
        }else{
          sortKey = key;
          sortDir = (key === "season") ? "desc" : "desc";
        }
        renderSeasonTable();
      });
    });
  }

  // =========================
  // SEARCH BY NAME (find player_id)
  // =========================
  async function buildHints(){
    // Lightweight autocomplete from latest season only (fast)
    try{
      const latest = seasonsList[0];
      const arr = await safeFetchJson(`./data/baseball/players/${latest}.json`);
      const top = (arr || []).slice(0, 800); // keep light
      elHints.innerHTML = top
        .filter(x => x && x.player_name)
        .map(x => `<option value="${String(x.player_name).replace(/"/g,'&quot;')}"></option>`)
        .join("");
    }catch(e){
      // ignore
    }
  }

  async function resolvePlayerIdFromName(name){
    const target = String(name || "").trim().toLowerCase();
    if(!target) return null;

    // If they typed an ID, allow it
    if(/^[a-z0-9]{5,10}$/i.test(target) && !target.includes(" ")){
      return String(name).trim();
    }

    setStatus("Searching name…");

    let found = null;

    // Scan seasons (newest -> oldest) until we find the name
    await mapLimit(seasonsList, 6, async (seasonStr, idx) => {
      if(found) return;

      let arr;
      try{
        arr = await safeFetchJson(`./data/baseball/players/${seasonStr}.json`);
      }catch(e){
        return;
      }

      const hit = (arr || []).find(p => (p && p.player_name && String(p.player_name).trim().toLowerCase() === target));
      if(hit && hit.player_id){
        found = String(hit.player_id).trim();
      }

      if(idx % 12 === 0){
        setStatus(`Searching name… (${idx+1}/${seasonsList.length})`);
      }
    });

    return found;
  }

  function wireSearch(){
    if(playerId) elSearch.value = "";

    async function go(){
      const q = (elSearch.value || "").trim();
      if(!q) return;

      const resolved = await resolvePlayerIdFromName(q);
      if(!resolved){
        setStatus("Name not found (check spelling)");
        return;
      }
      location.href = `./player.html?player=${encodeURIComponent(resolved)}`;
    }

    elGo.addEventListener("click", go);
    elSearch.addEventListener("keydown", (e) => {
      if(e.key === "Enter") go();
    });
  }

  // =========================
  // LOAD SEASON TOTALS (fast path)
  // =========================
  async function loadSeasonTotals(){
    if(!playerId){
      setStatus("Missing ?player= in the URL");
      elName.textContent = "Unknown Player";
      return;
    }

    setStatus("Loading seasons…");
    seasonsList = [];
    try{
      seasonsList = await safeFetchJson("./data/baseball/index.json");
    }catch(e){
      setStatus("Could not load ./data/baseball/index.json");
      return;
    }

    seasonsList = (seasonsList || []).map(s => String(s)).filter(Boolean);
    // newest first for hints + nice UX
    seasonsList.sort((a,b) => Number(b) - Number(a));

    await buildHints();

    // reset state
    seasonRows = [];
    teamAgg = new Map();
    career = { games:0, plate_appearances:0, at_bats:0, hits:0, home_runs:0, walks:0, strikeouts:0 };

    setStatus(`Scanning ${seasonsList.length} seasons…`);

    let firstPlayerName = null;

    await mapLimit(seasonsList, 6, async (seasonStr, idx) => {
      let arr;
      try{
        arr = await safeFetchJson(`./data/baseball/players/${seasonStr}.json`);
      }catch(e){
        return;
      }

      const row = (arr || []).find(x => x && String(x.player_id) === String(playerId));
      if(!row) return;

      if(!firstPlayerName && row.player_name) firstPlayerName = String(row.player_name);

      const out = {
        season: Number(seasonStr) || seasonStr,
        team: (row.team !== undefined ? row.team : ""),
        games: safeNum(row.games),
        plate_appearances: safeNum(row.plate_appearances),
        at_bats: safeNum(row.at_bats),
        hits: safeNum(row.hits),
        home_runs: safeNum(row.home_runs),
        walks: safeNum(row.walks),
        strikeouts: safeNum(row.strikeouts),
        avg: Number(fmtAvg(row.hits, row.at_bats))
      };

      seasonRows.push(out);
      addToCareer(out);
      addToAgg(teamAgg, out.team, out);

      if(idx % 10 === 0){
        setStatus(`Scanning… (${idx+1}/${seasonsList.length})`);
      }
    });

    // name display
    elName.textContent = firstPlayerName || playerId;

    // render
    renderCareer();
    renderSeasonTable();

    // team selector
    const teams = Array.from(teamAgg.keys()).sort((a,b) => fullTeamName(a).localeCompare(fullTeamName(b)));
    elTeamSelect.innerHTML = teams.map(t => `<option value="${String(t).replace(/"/g,'&quot;')}">${fullTeamName(t)}</option>`).join("");
    const firstTeam = teams[0] || "";
    elTeamSelect.value = firstTeam;
    renderTeam(firstTeam);

    elTeamSelect.addEventListener("change", () => renderTeam(elTeamSelect.value));

    setStatus("Loading opponent breakdown…");
  }

  // =========================
  // OPPONENT TOTALS (slow path)
  // Uses boxscores + season schedules
  // Caches in localStorage per player_id
  // =========================
  function cacheKeyOpp(pid){ return `tsa_oppAgg_${pid}`; }

  function tryLoadOppCache(){
    try{
      const raw = localStorage.getItem(cacheKeyOpp(playerId));
      if(!raw) return false;
      const parsed = JSON.parse(raw);
      if(!parsed || typeof parsed !== "object") return false;

      oppAgg = new Map();
      Object.keys(parsed).forEach(k => oppAgg.set(k, parsed[k]));
      return oppAgg.size > 0;
    }catch(e){
      return false;
    }
  }

  function saveOppCache(){
    try{
      const obj = {};
      for(const [k,v] of oppAgg.entries()) obj[k] = v;
      localStorage.setItem(cacheKeyOpp(playerId), JSON.stringify(obj));
    }catch(e){}
  }

  function extractPlayerBatLine(box, pid){
    // Look through any arrays of objects that have player_id and batting fields.
    const wanted = String(pid);

    function looksLikeBatLine(o){
      if(!o || typeof o !== "object") return false;
      if(String(o.player_id || "") !== wanted) return false;

      const keys = Object.keys(o);
      // must have at least one of these
      return keys.includes("at_bats") || keys.includes("hits") || keys.includes("home_runs") || keys.includes("walks") || keys.includes("strikeouts") || keys.includes("plate_appearances");
    }

    // direct common keys first
    const commonKeys = ["batters_home", "batters_away", "batting_home", "batting_away", "batting", "home_batting", "away_batting"];
    for(const k of commonKeys){
      const v = box[k];
      if(Array.isArray(v)){
        const hit = v.find(looksLikeBatLine);
        if(hit) return hit;
      }
    }

    // generic scan
    for(const k of Object.keys(box)){
      const v = box[k];
      if(Array.isArray(v) && v.length && typeof v[0] === "object"){
        const hit = v.find(looksLikeBatLine);
        if(hit) return hit;
      }
      if(v && typeof v === "object" && !Array.isArray(v)){
        // check nested one level
        for(const kk of Object.keys(v)){
          const vv = v[kk];
          if(Array.isArray(vv) && vv.length && typeof vv[0] === "object"){
            const hit = vv.find(looksLikeBatLine);
            if(hit) return hit;
          }
        }
      }
    }

    return null;
  }

  async function fetchBoxscore(season, date, away, home){
    // try both filename orders
    const a = `./data/baseball/boxscores/${season}/${date}_${away}_${home}.json`;
    const b = `./data/baseball/boxscores/${season}/${date}_${home}_${away}.json`;
    try{
      return await safeFetchJson(a);
    }catch(e1){
      return await safeFetchJson(b);
    }
  }

  async function buildOpponentTotals(){
    if(!playerId) return;

    // cached?
    if(tryLoadOppCache()){
      // build selector + render instantly
      const opps = Array.from(oppAgg.keys()).sort((a,b) => fullTeamName(a).localeCompare(fullTeamName(b)));
      elOppSelect.innerHTML = opps.map(o => `<option value="${String(o).replace(/"/g,'&quot;')}">${fullTeamName(o)}</option>`).join("");
      const firstOpp = opps[0] || "";
      elOppSelect.value = firstOpp;
      renderOpponent(firstOpp);
      elOppSelect.addEventListener("change", () => renderOpponent(elOppSelect.value));
      setStatus("Done.");
      return;
    }

    // Only scan seasons where the player exists (from seasonRows)
    const seasonsToScan = seasonRows.map(r => String(r.season)).filter(Boolean).sort((a,b) => Number(b) - Number(a));

    oppAgg = new Map();

    // For progress
    let seasonsDone = 0;

    await mapLimit(seasonsToScan, 2, async (seasonStr) => {
      // load season schedule to know game dates + teams
      let schedule;
      try{
        schedule = await safeFetchJson(`./data/baseball/seasons/${seasonStr}.json`);
      }catch(e){
        seasonsDone++;
        setStatus(`Opponent scan… (${seasonsDone}/${seasonsToScan.length})`);
        return;
      }

      const games = Array.isArray(schedule) ? schedule : [];
      let scanned = 0;

      // Scan games with moderate concurrency
      await mapLimit(games, 6, async (g) => {
        const date = String(g.date || "").trim();
        const home = String(g.home_code || "").trim();
        const away = String(g.away_code || "").trim();
        if(!date || !home || !away) return;

        let box;
        try{
          box = await fetchBoxscore(seasonStr, date, away, home);
        }catch(e){
          return;
        }

        const line = extractPlayerBatLine(box, playerId);
        if(!line) return;

        // Determine opponent: if player on home, opponent is away (best-effort: compare line.team if exists)
        let playerTeam = (line.team !== undefined && line.team !== null) ? String(line.team).trim() : "";

        // If no team on line, infer by checking which side array he appears in
        // (still best-effort; if your schema is different, this will still often work)
        let opponent = "";
        if(playerTeam){
          opponent = (playerTeam === home) ? away : (playerTeam === away ? home : (home && away ? (home === playerTeam ? away : home) : ""));
        }else{
          opponent = away; // fallback
          playerTeam = home; // fallback
        }

        const row = {
          games: safeNum(line.games || 1),
          plate_appearances: safeNum(line.plate_appearances),
          at_bats: safeNum(line.at_bats),
          hits: safeNum(line.hits),
          home_runs: safeNum(line.home_runs),
          walks: safeNum(line.walks),
          strikeouts: safeNum(line.strikeouts)
        };

        addToAgg(oppAgg, opponent, row);

        scanned++;
        if(scanned % 60 === 0){
          setStatus(`Opponent scan ${seasonStr}… ${scanned}/${games.length}`);
        }
      });

      seasonsDone++;
      setStatus(`Opponent scan… (${seasonsDone}/${seasonsToScan.length})`);
    });

    // Save cache
    saveOppCache();

    // Build opponent selector
    const opps = Array.from(oppAgg.keys()).sort((a,b) => fullTeamName(a).localeCompare(fullTeamName(b)));
    elOppSelect.innerHTML = opps.map(o => `<option value="${String(o).replace(/"/g,'&quot;')}">${fullTeamName(o)}</option>`).join("");
    const firstOpp = opps[0] || "";
    elOppSelect.value = firstOpp;
    renderOpponent(firstOpp);

    elOppSelect.addEventListener("change", () => renderOpponent(elOppSelect.value));

    setStatus("Done.");
  }

  // =========================
  // INIT
  // =========================
  async function init(){
    wireSorting();
    wireSearch();

    if(!playerId){
      elName.textContent = "Player";
      setStatus("Missing ?player=");
      return;
    }

    // Make sure we have seasons list early for search hints
    try{
      seasonsList = await safeFetchJson("./data/baseball/index.json");
      seasonsList = (seasonsList || []).map(s => String(s)).filter(Boolean).sort((a,b) => Number(b) - Number(a));
      await buildHints();
    }catch(e){
      // ignore
    }

    await loadSeasonTotals();
    await buildOpponentTotals();
  }

  init();
})();
</script>
