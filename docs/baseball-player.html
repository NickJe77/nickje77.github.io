<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
font-size:18px;
}

.page{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#BA0C2F);
color:white;
padding:40px;
border-radius:18px;
text-align:center;
box-shadow:0 4px 14px rgba(0,0,0,0.2);
}

.hero .teams{
font-size:34px;
font-weight:700;
}

.hero .score{
font-size:64px;
font-weight:800;
margin-top:10px;
}

.hero .date{
font-size:18px;
margin-top:10px;
opacity:0.9;
}

.card{
background:white;
padding:18px;
border-radius:14px;
margin-top:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.error{
background:white;
padding:40px;
border-radius:14px;
text-align:center;
color:#c62828;
font-size:22px;
font-weight:700;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div id="content">

<div class="hero">
<div id="teams" class="teams"></div>
<div id="score" class="score"></div>
<div id="date" class="date"></div>
</div>

<div id="battingCard" class="card"></div>

<div id="pitchingCard" class="card"></div>

</div>

</div>

<script>

const params = new URLSearchParams(location.search);
const id = params.get("id");

const teamsEl = document.getElementById("teams");
const scoreEl = document.getElementById("score");
const dateEl = document.getElementById("date");

const battingCard = document.getElementById("battingCard");
const pitchingCard = document.getElementById("pitchingCard");

if(!id){

document.getElementById("content").innerHTML =
"<div class='error'>Game ID missing</div>";

throw new Error();

}

async function loadGame(){

try{

const year = id.substring(0,4);

const res =
await fetch(`/data/baseball/boxscores/${year}/${id}.json`);

if(!res.ok) throw new Error();

const game = await res.json();

render(game);

}catch{

document.getElementById("content").innerHTML =
"<div class='error'>Game not found</div>";

}

}

function render(game){

teamsEl.textContent =
game.away_team + " @ " + game.home_team;

scoreEl.textContent =
game.away_score + " - " + game.home_score;

dateEl.textContent =
game.date;

/* BATTING */

if(game.batters){

let html =
"<h2>Batting</h2><table>";

html +=
"<tr><th>Player</th><th>Team</th><th>AB</th><th>H</th><th>RBI</th></tr>";

game.batters.forEach(p=>{

html +=
`<tr>
<td>${p.name}</td>
<td>${p.team}</td>
<td>${p.ab}</td>
<td>${p.h}</td>
<td>${p.rbi}</td>
</tr>`;

});

html += "</table>";

battingCard.innerHTML = html;

}

/* PITCHING */

if(game.pitchers){

let html =
"<h2>Pitching</h2><table>";

html +=
"<tr><th>Pitcher</th><th>Team</th><th>IP</th><th>H</th><th>R</th></tr>";

game.pitchers.forEach(p=>{

html +=
`<tr>
<td>${p.name}</td>
<td>${p.team}</td>
<td>${p.ip}</td>
<td>${p.h}</td>
<td>${p.r}</td>
</tr>`;

});

html += "</table>";

pitchingCard.innerHTML = html;

}

}

loadGame();

</script>

</body>
</html>
