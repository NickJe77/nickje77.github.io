<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --muted:#667085;
  --line:#e6e8ee;
  --soft:#f0f6ff;
  --chip:#eef2ff;
}

body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.navbar a:hover{ text-decoration:underline; }

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,var(--blue), #3a256e, var(--red));
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
}

.hero h1{
  margin:0;
  font-size:40px;
  letter-spacing:-0.5px;
}

.hero-right{
  flex:1;
  min-width:260px;
  max-width:560px;
}

.search-wrap{
  display:flex;
  gap:10px;
}

.search{
  width:100%;
  padding:22px 24px;
  border-radius:18px;
  border:2px solid rgba(255,255,255,0.45);
  outline:none;
  font-size:24px;
  background:rgba(255,255,255,0.15);
  color:white;
  font-weight:700;
}

.search::placeholder{
  color:rgba(255,255,255,0.9);
}

.btn{
  padding:22px 26px;
  border-radius:18px;
  border:2px solid rgba(255,255,255,0.45);
  background:rgba(255,255,255,0.18);
  color:white;
  font-weight:900;
  font-size:18px;
  cursor:pointer;
}

.section{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
}

.section h2{
  margin:0 0 14px 0;
  font-size:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

.controls{
  display:flex;
  gap:10px;
}

select{
  padding:10px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  font-weight:700;
}

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.card{
  background:var(--soft);
  border-radius:14px;
  padding:16px;
  text-align:center;
  border:1px solid #e8efff;
}

.card .value{
  font-size:28px;
  font-weight:900;
}

.card .label{
  margin-top:6px;
  font-size:12px;
  color:#555;
}

table{
  width:100%;
  border-collapse:collapse;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

th{
  background:var(--blue);
  color:white;
  padding:10px;
  text-align:left;
  font-size:13px;
  cursor:pointer;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
}

tr:nth-child(even){background:#f7fbff;}

.note{
  color:#666;
  font-size:13px;
  margin-top:8px;
}

@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr);}
  .search{font-size:22px;}
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
  <div>
    <h1 id="playerName">Loading...</h1>
  </div>
  <div class="hero-right">
    <div class="search-wrap">
      <input id="playerSearch" class="search" list="playerList" placeholder="Search player name..." />
      <datalist id="playerList"></datalist>
      <button id="goBtn" class="btn">Go</button>
    </div>
  </div>
</div>

<div class="section">
  <h2>Career</h2>
  <div class="cards" id="careerCards"></div>
  <div class="note" id="statusNote"></div>
</div>

<div class="section">
  <h2>
    <span>By Team</span>
    <span class="controls">
      <select id="teamSelect"></select>
    </span>
  </h2>
  <div class="cards" id="teamCards"></div>
</div>

<div class="section">
  <h2>
    <span>Vs Opponent</span>
    <span class="controls">
      <select id="oppSelect"></select>
    </span>
  </h2>
  <div class="cards" id="oppCards"></div>
</div>

<div class="section">
  <h2>Season Breakdown</h2>
  <table id="seasonTable">
    <thead>
      <tr>
        <th data-key="season">Season</th>
        <th data-key="team">Team</th>
        <th data-key="games">G</th>
        <th data-key="plate_appearances">PA</th>
        <th data-key="at_bats">AB</th>
        <th data-key="hits">H</th>
        <th data-key="home_runs">HR</th>
        <th data-key="walks">BB</th>
        <th data-key="strikeouts">SO</th>
        <th data-key="avg">AVG</th>
      </tr>
    </thead>
    <tbody id="seasonBody"></tbody>
  </table>
</div>

</div>

<script>
(function(){

const qs = new URLSearchParams(location.search);
const playerIdRaw = qs.get("player");
const playerId = playerIdRaw ? String(playerIdRaw) : "";

const statusNote = document.getElementById("statusNote");

if(!playerId){
  document.getElementById("playerName").textContent = "Player Not Found";
  statusNote.textContent = "Missing ?player= in the URL.";
  return;
}

/*
  Team codes: your dataset uses several “old style” 3-letter codes (LAN, SLN, CHN, NYA, etc).
  This map supports both modern and those codes.
*/
const TEAM_NAMES = {
  // Common Retrosheet/Lahman-style codes
  "ANA":"Los Angeles Angels","LAA":"Los Angeles Angels","CAL":"California Angels",
  "ARI":"Arizona Diamondbacks",
  "ATL":"Atlanta Braves","BSN":"Boston Braves","MLN":"Milwaukee Braves",
  "BAL":"Baltimore Orioles","SLB":"St. Louis Browns",
  "BOS":"Boston Red Sox",
  "BRO":"Brooklyn Dodgers","LAN":"Los Angeles Dodgers","LAD":"Los Angeles Dodgers",
  "CHN":"Chicago Cubs","CHC":"Chicago Cubs",
  "CHA":"Chicago White Sox","CHW":"Chicago White Sox",
  "CIN":"Cincinnati Reds",
  "CLE":"Cleveland Guardians","CLV":"Cleveland Indians",
  "COL":"Colorado Rockies",
  "DET":"Detroit Tigers",
  "HOU":"Houston Astros",
  "KCA":"Kansas City Royals","KC":"Kansas City Royals",
  "MIA":"Miami Marlins","FLO":"Florida Marlins",
  "MIL":"Milwaukee Brewers",
  "MIN":"Minnesota Twins",
  "MON":"Montreal Expos",
  "NYA":"New York Yankees","NYY":"New York Yankees",
  "NYN":"New York Mets","NYM":"New York Mets",
  "OAK":"Oakland Athletics",
  "PHI":"Philadelphia Phillies",
  "PIT":"Pittsburgh Pirates",
  "SDN":"San Diego Padres","SD":"San Diego Padres",
  "SEA":"Seattle Mariners",
  "SFN":"San Francisco Giants","SF":"San Francisco Giants",
  "SLN":"St. Louis Cardinals","STL":"St. Louis Cardinals",
  "TBA":"Tampa Bay Rays","TB":"Tampa Bay Rays",
  "TEX":"Texas Rangers",
  "TOR":"Toronto Blue Jays",
  "WAS":"Washington Nationals","WSH":"Washington Nationals"
};

function teamFull(code){
  const c = (code==null) ? "" : String(code).trim();
  return TEAM_NAMES[c] || c;
}

function fmt(n){ return Number(n||0).toLocaleString(); }
function avg(h,ab){ return ab ? (h/ab).toFixed(3) : "0.000"; }

let seasonRows=[];
let teamAgg=new Map();
let oppAgg=new Map();
let career={games:0,plate_appearances:0,at_bats:0,hits:0,home_runs:0,walks:0,strikeouts:0};

async function safeFetch(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

// Fetch many URLs in batches (parallel, but not insane)
async function fetchInBatches(urls, batchSize){
  const out = new Array(urls.length).fill(null);
  for(let i=0;i<urls.length;i+=batchSize){
    const slice = urls.slice(i, i+batchSize);
    const res = await Promise.all(slice.map(u => safeFetch(u)));
    for(let j=0;j<res.length;j++){
      out[i+j] = res[j];
    }
    statusNote.textContent = `Loading seasons… ${Math.min(i+batchSize, urls.length)}/${urls.length}`;
  }
  return out;
}

async function loadPlayersIndex(){
  const arr = await safeFetch("./data/baseball/players.json");
  if(!arr){
    document.getElementById("playerName").textContent = `Player ${playerId}`;
    return;
  }

  const list=document.getElementById("playerList");
  list.innerHTML=arr.map(p=>`<option value="${p.player_name}"></option>`).join("");
  window.playersIndex=arr;

  const match = arr.find(p => String(p.player_id) === String(playerId));
  if(match){
    document.getElementById("playerName").textContent = match.player_name;
  }else{
    document.getElementById("playerName").textContent = `Player ${playerId}`;
  }
}

function findPlayerIdByName(name){
  if(!window.playersIndex) return "";
  const n = name.toLowerCase();
  const hit = window.playersIndex.find(p => String(p.player_name||"").toLowerCase() === n);
  return hit ? String(hit.player_id) : "";
}

document.getElementById("goBtn").onclick=()=>{
  const name=document.getElementById("playerSearch").value.trim();
  const id=findPlayerIdByName(name);
  if(id) location.href=`player.html?player=${encodeURIComponent(id)}`;
};

function addToAgg(agg, row){
  agg.games += (row.games||0);
  agg.plate_appearances += (row.plate_appearances||0);
  agg.at_bats += (row.at_bats||0);
  agg.hits += (row.hits||0);
  agg.home_runs += (row.home_runs||0);
  agg.walks += (row.walks||0);
  agg.strikeouts += (row.strikeouts||0);
}

async function loadSeasons(){
  const seasons = await safeFetch("./data/baseball/index.json");
  if(!seasons){
    statusNote.textContent = "Missing ./data/baseball/index.json";
    return;
  }

  // Build URLs for each season player file
  const urls = seasons.map(s => `./data/baseball/players/${s}.json`);

  // Batch size: tune if needed. 12 is fast but safe.
  const batchSize = 12;
  const seasonData = await fetchInBatches(urls, batchSize);

  for(let i=0;i<seasons.length;i++){
    const s = seasons[i];
    const data = seasonData[i];
    if(!data) continue;

    const row = data.find(p => String(p.player_id) === String(playerId));
    if(!row) continue;

    seasonRows.push({...row, season:s});

    addToAgg(career, row);

    const tcode = row.team;
    if(!teamAgg.has(tcode)){
      teamAgg.set(tcode, {games:0,plate_appearances:0,at_bats:0,hits:0,home_runs:0,walks:0,strikeouts:0});
    }
    addToAgg(teamAgg.get(tcode), row);
  }

  // Sort season rows newest-first (keeps your screenshot ordering)
  seasonRows.sort((a,b)=>Number(b.season)-Number(a.season));

  renderCareer();
  renderSeason();
  buildTeamSelector();

  statusNote.textContent = `Loaded ${seasonRows.length} seasons for this player.`;
}

function renderCareer(){
  document.getElementById("careerCards").innerHTML=`
  <div class="card"><div class="value">${fmt(career.games)}</div><div class="label">Games</div></div>
  <div class="card"><div class="value">${fmt(career.hits)}</div><div class="label">Hits</div></div>
  <div class="card"><div class="value">${fmt(career.home_runs)}</div><div class="label">HR</div></div>
  <div class="card"><div class="value">${avg(career.hits,career.at_bats)}</div><div class="label">AVG</div></div>
  <div class="card"><div class="value">${fmt(career.walks)}</div><div class="label">BB</div></div>
  `;
}

function renderSeason(){
  document.getElementById("seasonBody").innerHTML=seasonRows.map(r=>`
  <tr>
    <td>${r.season}</td>
    <td>${teamFull(r.team)}</td>
    <td>${r.games||0}</td>
    <td>${r.plate_appearances||0}</td>
    <td>${r.at_bats||0}</td>
    <td>${r.hits||0}</td>
    <td>${r.home_runs||0}</td>
    <td>${r.walks||0}</td>
    <td>${r.strikeouts||0}</td>
    <td>${avg(r.hits||0, r.at_bats||0)}</td>
  </tr>`).join("");
}

function buildTeamSelector(){
  const sel=document.getElementById("teamSelect");
  const keys = [...teamAgg.keys()];

  if(keys.length === 0){
    sel.innerHTML = `<option value="">No team data</option>`;
    document.getElementById("teamCards").innerHTML = "";
    return;
  }

  // Sort options by full name
  keys.sort((a,b)=> teamFull(a).localeCompare(teamFull(b)));

  sel.innerHTML = keys.map(t=>`<option value="${t}">${teamFull(t)}</option>`).join("");

  sel.onchange=()=>renderTeam(sel.value);

  // initial
  renderTeam(sel.value);
}

function renderTeam(tcode){
  const t = teamAgg.get(tcode);
  if(!t) return;
  document.getElementById("teamCards").innerHTML=`
  <div class="card"><div class="value">${fmt(t.games)}</div><div class="label">Games</div></div>
  <div class="card"><div class="value">${fmt(t.hits)}</div><div class="label">Hits</div></div>
  <div class="card"><div class="value">${fmt(t.home_runs)}</div><div class="label">HR</div></div>
  <div class="card"><div class="value">${fmt(t.walks)}</div><div class="label">BB</div></div>
  <div class="card"><div class="value">${avg(t.hits, t.at_bats)}</div><div class="label">AVG</div></div>
  `;
}

async function loadOpponents(){
  const data = await safeFetch(`./data/baseball/opponents/${playerId}.json`);
  if(!data || !Array.isArray(data) || data.length===0){
    const sel=document.getElementById("oppSelect");
    sel.innerHTML = `<option value="">No opponent data</option>`;
    document.getElementById("oppCards").innerHTML = "";
    return;
  }

  data.forEach(o=>oppAgg.set(o.opponent, o));

  const sel=document.getElementById("oppSelect");
  // Sort by full name
  const opts = data.map(o=>o.opponent).sort((a,b)=>teamFull(a).localeCompare(teamFull(b)));
  sel.innerHTML = opts.map(code=>`<option value="${code}">${teamFull(code)}</option>`).join("");

  sel.onchange=()=>renderOpponent(sel.value);
  renderOpponent(sel.value);
}

function renderOpponent(code){
  const d=oppAgg.get(code);
  if(!d) return;
  document.getElementById("oppCards").innerHTML=`
  <div class="card"><div class="value">${fmt(d.games)}</div><div class="label">Games</div></div>
  <div class="card"><div class="value">${fmt(d.hits)}</div><div class="label">Hits</div></div>
  <div class="card"><div class="value">${fmt(d.home_runs)}</div><div class="label">HR</div></div>
  <div class="card"><div class="value">${fmt(d.walks)}</div><div class="label">BB</div></div>
  <div class="card"><div class="value">${avg(d.hits||0, d.at_bats||0)}</div><div class="label">AVG</div></div>
  `;
}

async function init(){
  await loadPlayersIndex();
  await loadSeasons();
  await loadOpponents();
}

init();

})();
</script>

</body>
</html>
