<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  :root{
    --blue:#002D72;
    --red:#C8102E;
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#0b1220;
    --muted:#667085;
    --line:#e6e8ee;
    --soft:#f0f6ff;
    --chip:#eef2ff;
  }

  body{
    font-family: Inter, system-ui, Arial, sans-serif;
    margin:0;
    background:var(--bg);
    color:var(--text);
  }

  .navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px;
    background:#fff;
    border-bottom:1px solid #ddd;
    font-weight:700;
  }
  .navbar a{ text-decoration:none; color:#0056d6; }
  .navbar a:hover{ text-decoration:underline; }

  .page{
    max-width:1200px;
    margin:auto;
    padding:20px;
  }

  .hero{
    background:linear-gradient(90deg,var(--blue), #3a256e, var(--red));
    color:white;
    padding:28px 30px;
    border-radius:20px;
    margin-bottom:16px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
  }

  .hero h1{
    margin:0 0 8px 0;
    font-size:38px;
    letter-spacing:-0.5px;
  }

  .hero .meta{
    font-size:14px;
    opacity:0.92;
  }

  .hero-right{
    min-width:320px;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:flex-end;
  }

  .search-wrap{
    width:100%;
    max-width:420px;
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:flex-end;
  }

  .search{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.35);
    outline:none;
    font-size:14px;
    background:rgba(255,255,255,0.10);
    color:white;
  }
  .search::placeholder{ color:rgba(255,255,255,0.85); }

  .btn{
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.12);
    color:white;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{ background:rgba(255,255,255,0.18); }

  .section{
    background:var(--card);
    padding:18px;
    border-radius:18px;
    margin-bottom:16px;
    box-shadow:0 1px 0 rgba(15,23,42,0.04);
  }

  .section h2{
    margin:0 0 14px 0;
    font-size:22px;
    letter-spacing:-0.2px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  select{
    padding:9px 10px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#fff;
    font-size:13px;
    outline:none;
    font-weight:700;
  }

  .pill{
    display:inline-block;
    padding:5px 10px;
    border-radius:999px;
    background:var(--chip);
    border:1px solid #e2e8ff;
    font-size:12px;
    color:#334155;
    font-weight:800;
  }

  .cards{
    display:grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap:14px;
  }

  .card{
    background:var(--soft);
    border-radius:14px;
    padding:16px;
    text-align:center;
    border:1px solid #e8efff;
  }

  .card .value{
    font-size:28px;
    font-weight:900;
    line-height:1.1;
  }
  .card .label{
    margin-top:6px;
    font-size:12px;
    color:#4b5563;
    letter-spacing:0.2px;
  }

  .muted{ color:var(--muted); font-size:13px; }

  table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    overflow:hidden;
    border-radius:14px;
    border:1px solid var(--line);
    background:#fff;
  }

  thead th{
    background:var(--blue);
    color:white;
    padding:12px 10px;
    text-align:left;
    font-size:13px;
    letter-spacing:0.2px;
    user-select:none;
    cursor:pointer;
    white-space:nowrap;
  }
  thead th.sortable:hover{ filter:brightness(1.08); }

  tbody td{
    padding:10px 10px;
    border-bottom:1px solid #eef0f5;
    font-size:14px;
    white-space:nowrap;
  }
  tbody tr:nth-child(even){ background:#f7fbff; }
  tbody tr:last-child td{ border-bottom:none; }

  .footer-note{
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
    line-height:1.35;
  }

  @media (max-width: 980px){
    .cards{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hero{ flex-direction:column; align-items:flex-start; }
    .hero-right{ align-items:flex-start; min-width:unset; width:100%; }
    .search-wrap{ max-width:520px; justify-content:flex-start; }
  }
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

  <div class="hero">
    <div>
      <h1 id="playerName">Loading...</h1>
      <div class="meta" id="playerMeta"></div>
    </div>

    <div class="hero-right">
      <div class="search-wrap">
        <input id="playerSearch" class="search" list="playerList" placeholder="Search player name (e.g. Jackie Robinson)..." />
        <datalist id="playerList"></datalist>
        <button id="goBtn" class="btn">Go</button>
      </div>
      <div class="meta" id="statusLine"></div>
    </div>
  </div>

  <!-- 1) CAREER -->
  <div class="section">
    <h2>Career</h2>
    <div class="cards" id="careerCards"></div>
  </div>

  <!-- 2) BY TEAM -->
  <div class="section">
    <h2>
      <span>By Team</span>
      <span class="controls">
        <select id="teamSelect"></select>
        <span class="pill" id="teamHint">Loading…</span>
      </span>
    </h2>
    <div class="cards" id="teamCards"></div>
  </div>

  <!-- 3) VS OPPONENT -->
  <div class="section">
    <h2>
      <span>Vs Opponent</span>
      <span class="controls">
        <select id="oppSelect"></select>
        <span class="pill" id="oppHint">Loading…</span>
      </span>
    </h2>
    <div class="cards" id="oppCards"></div>
    <div class="footer-note">
      Opponent stats are loaded from <b>./data/baseball/opponents/&lt;player_id&gt;.json</b> (prebuilt from Retrosheet events).
    </div>
  </div>

  <!-- 4) SEASON BREAKDOWN -->
  <div class="section">
    <h2>Season Breakdown</h2>
    <div class="muted" id="seasonCount"></div>
    <div style="margin-top:12px; overflow:auto;">
      <table id="seasonTable">
        <thead>
          <tr>
            <th class="sortable" data-key="season">Season</th>
            <th class="sortable" data-key="team">Team</th>
            <th class="sortable" data-key="games">G</th>
            <th class="sortable" data-key="plate_appearances">PA</th>
            <th class="sortable" data-key="at_bats">AB</th>
            <th class="sortable" data-key="hits">H</th>
            <th class="sortable" data-key="home_runs">HR</th>
            <th class="sortable" data-key="walks">BB</th>
            <th class="sortable" data-key="strikeouts">SO</th>
            <th class="sortable" data-key="avg">AVG</th>
          </tr>
        </thead>
        <tbody id="seasonBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const playerId = (qs.get("player") || "").trim();

  const elName = document.getElementById("playerName");
  const elMeta = document.getElementById("playerMeta");
  const elStatus = document.getElementById("statusLine");

  const elCareerCards = document.getElementById("careerCards");

  const elTeamCards = document.getElementById("teamCards");
  const elTeamSelect = document.getElementById("teamSelect");
  const elTeamHint = document.getElementById("teamHint");

  const elOppCards = document.getElementById("oppCards");
  const elOppSelect = document.getElementById("oppSelect");
  const elOppHint = document.getElementById("oppHint");

  const elSeasonBody = document.getElementById("seasonBody");
  const elSeasonCount = document.getElementById("seasonCount");

  const elSearch = document.getElementById("playerSearch");
  const elList = document.getElementById("playerList");
  const elGo = document.getElementById("goBtn");

  // --- TEAM CODE -> FULL NAME (Retrosheet-ish + modern MLB) ---
  // This is a best-effort map. If a code is not found, it will fall back to the code itself.
  const TEAM_NAMES = {
    // Modern-ish
    "ARI":"Arizona Diamondbacks","ATL":"Atlanta Braves","BAL":"Baltimore Orioles","BOS":"Boston Red Sox","CHA":"Chicago White Sox","CHN":"Chicago Cubs",
    "CIN":"Cincinnati Reds","CLE":"Cleveland Guardians","COL":"Colorado Rockies","DET":"Detroit Tigers","HOU":"Houston Astros","KCA":"Kansas City Royals",
    "ANA":"Los Angeles Angels","LAA":"Los Angeles Angels","LAN":"Los Angeles Dodgers","LAD":"Los Angeles Dodgers","MIA":"Miami Marlins","MIL":"Milwaukee Brewers",
    "MIN":"Minnesota Twins","NYA":"New York Yankees","NYN":"New York Mets","OAK":"Oakland Athletics","PHI":"Philadelphia Phillies","PIT":"Pittsburgh Pirates",
    "SDN":"San Diego Padres","SEA":"Seattle Mariners","SFN":"San Francisco Giants","SLN":"St. Louis Cardinals","TBA":"Tampa Bay Rays","TEX":"Texas Rangers",
    "TOR":"Toronto Blue Jays","WAS":"Washington Nationals",

    // Common Retrosheet historic codes/franchises
    "CAL":"California Angels","MON":"Montreal Expos","FLO":"Florida Marlins","TBD":"Tampa Bay Devil Rays",
    "KCA":"Kansas City Royals","KCN":"Kansas City Royals",
    "MLA":"Milwaukee Braves","BSN":"Boston Braves",
    "BRO":"Brooklyn Dodgers","NY1":"New York Giants","NY4":"New York Yankees","NY5":"New York Yankees","NY6":"New York Yankees",
    "PHA":"Philadelphia Athletics","PHN":"Philadelphia Phillies",
    "WS1":"Washington Senators","WS2":"Washington Senators","WSH":"Washington Senators",
    "SLA":"St. Louis Browns",
    "SEP":"Seattle Pilots"
  };

  // Sorting state
  let sortKey = "season";
  let sortDir = "desc";

  // Data holders
  let seasonRows = [];
  let teamAgg = new Map();
  let oppAgg = new Map();

  let career = { games:0, plate_appearances:0, at_bats:0, hits:0, home_runs:0, walks:0, strikeouts:0 };

  let playersIndex = []; // [{player_id, player_name}...]

  function setStatus(msg){
    elStatus.textContent = msg || "";
  }

  function fmtInt(n){
    const v = Number(n || 0);
    return isFinite(v) ? v.toLocaleString("en-US") : "0";
  }

  function fmtAvg(h, ab){
    const H = Number(h || 0), AB = Number(ab || 0);
    if(!AB) return "0.000";
    return (H/AB).toFixed(3);
  }

  function teamFull(code){
    const c = (code===undefined || code===null) ? "" : String(code).trim();
    if(!c) return "—";
    return TEAM_NAMES[c] || c;
  }

  function renderCards(container, cards){
    container.innerHTML = cards.map(c => `
      <div class="card">
        <div class="value">${c.value}</div>
        <div class="label">${c.label}</div>
      </div>
    `).join("");
  }

  function renderCareer(){
    const avg = fmtAvg(career.hits, career.at_bats);
    renderCards(elCareerCards, [
      { label:"Games", value: fmtInt(career.games) },
      { label:"Plate Appearances", value: fmtInt(career.plate_appearances) },
      { label:"Hits", value: fmtInt(career.hits) },
      { label:"Home Runs", value: fmtInt(career.home_runs) },
      { label:"Batting Avg", value: avg }
    ]);
  }

  function renderTeam(teamKey){
    const t = teamAgg.get(teamKey);
    if(!t){
      elTeamHint.textContent = "No data";
      renderCards(elTeamCards, [
        { label:"Games", value:"0" },
        { label:"Hits", value:"0" },
        { label:"Home Runs", value:"0" },
        { label:"Walks", value:"0" },
        { label:"Strikeouts", value:"0" }
      ]);
      return;
    }

    elTeamHint.textContent = teamFull(teamKey);

    renderCards(elTeamCards, [
      { label:"Games", value: fmtInt(t.games) },
      { label:"PA", value: fmtInt(t.plate_appearances) },
      { label:"Hits", value: fmtInt(t.hits) },
      { label:"Home Runs", value: fmtInt(t.home_runs) },
      { label:"AVG", value: fmtAvg(t.hits, t.at_bats) }
    ]);
  }

  function renderOpponent(oppKey){
    const t = oppAgg.get(oppKey);
    if(!t){
      elOppHint.textContent = "No data";
      renderCards(elOppCards, [
        { label:"Games", value:"0" },
        { label:"Hits", value:"0" },
        { label:"Home Runs", value:"0" },
        { label:"Walks", value:"0" },
        { label:"Strikeouts", value:"0" }
      ]);
      return;
    }

    elOppHint.textContent = teamFull(oppKey);

    renderCards(elOppCards, [
      { label:"Games", value: fmtInt(t.games) },
      { label:"PA", value: fmtInt(t.plate_appearances) },
      { label:"Hits", value: fmtInt(t.hits) },
      { label:"Home Runs", value: fmtInt(t.home_runs) },
      { label:"AVG", value: fmtAvg(t.hits, t.at_bats) }
    ]);
  }

  function sortRows(rows){
    const dir = (sortDir === "asc") ? 1 : -1;

    return rows.slice().sort((a,b) => {
      let av = a[sortKey];
      let bv = b[sortKey];

      if(sortKey === "season"){
        av = Number(av||0); bv = Number(bv||0);
        return (av - bv) * dir;
      }

      if(sortKey === "team"){
        av = teamFull(av);
        bv = teamFull(bv);
        return av.localeCompare(bv) * dir;
      }

      if(sortKey === "avg"){
        av = Number(av||0); bv = Number(bv||0);
        return (av - bv) * dir;
      }

      av = Number(av||0); bv = Number(bv||0);
      return (av - bv) * dir;
    });
  }

  function renderSeasonTable(){
    const sorted = sortRows(seasonRows);
    elSeasonCount.textContent = `${sorted.length.toLocaleString("en-US")} seasons found`;

    elSeasonBody.innerHTML = sorted.map(r => `
      <tr>
        <td><b>${r.season}</b></td>
        <td>${teamFull(r.team)}</td>
        <td>${fmtInt(r.games)}</td>
        <td>${fmtInt(r.plate_appearances)}</td>
        <td>${fmtInt(r.at_bats)}</td>
        <td>${fmtInt(r.hits)}</td>
        <td>${fmtInt(r.home_runs)}</td>
        <td>${fmtInt(r.walks)}</td>
        <td>${fmtInt(r.strikeouts)}</td>
        <td>${(Number(r.avg||0)).toFixed(3)}</td>
      </tr>
    `).join("");
  }

  function wireSorting(){
    const ths = document.querySelectorAll("#seasonTable thead th.sortable");
    ths.forEach(th => {
      th.addEventListener("click", () => {
        const key = th.getAttribute("data-key");
        if(!key) return;

        if(sortKey === key){
          sortDir = (sortDir === "asc") ? "desc" : "asc";
        }else{
          sortKey = key;
          sortDir = "desc";
        }
        renderSeasonTable();
      });
    });
  }

  async function mapLimit(items, limit, worker){
    const results = [];
    let i = 0;
    const runners = new Array(Math.min(limit, items.length)).fill(0).map(async () => {
      while(i < items.length){
        const idx = i++;
        try{ results[idx] = await worker(items[idx], idx); }
        catch(e){ results[idx] = null; }
      }
    });
    await Promise.all(runners);
    return results;
  }

  async function safeFetchJson(url){
    const res = await fetch(url, { cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status} ${url}`);
    return await res.json();
  }

  async function loadPlayersIndex(){
    // Used for NAME SEARCH + displaying the correct player name
    // Expected: ./data/baseball/players.json -> [{player_id, player_name}] or similar
    try{
      const arr = await safeFetchJson("./data/baseball/players.json");
      playersIndex = (arr || []).map(p => ({
        player_id: String(p.player_id || p.id || "").trim(),
        player_name: String(p.player_name || p.name || "").trim()
      })).filter(p => p.player_id && p.player_name);

      // Build datalist for autocomplete (name (id))
      elList.innerHTML = playersIndex.slice(0, 50000).map(p => {
        const label = `${p.player_name} (${p.player_id})`;
        return `<option value="${label.replace(/"/g,'&quot;')}"></option>`;
      }).join("");
    }catch(e){
      playersIndex = [];
      elList.innerHTML = "";
    }
  }

  function findPlayerIdFromSearchText(txt){
    const t = String(txt || "").trim();
    if(!t) return "";

    // If user picked "Name (id)" from datalist
    const m = t.match(/\(([^()]+)\)\s*$/);
    if(m && m[1]) return String(m[1]).trim();

    const q = t.toLowerCase();

    // Exact name match
    let hit = playersIndex.find(p => p.player_name.toLowerCase() === q);
    if(hit) return hit.player_id;

    // Starts-with match
    hit = playersIndex.find(p => p.player_name.toLowerCase().startsWith(q));
    if(hit) return hit.player_id;

    // Contains match
    hit = playersIndex.find(p => p.player_name.toLowerCase().includes(q));
    if(hit) return hit.player_id;

    // If they typed an actual id
    hit = playersIndex.find(p => p.player_id.toLowerCase() === q);
    if(hit) return hit.player_id;

    return "";
  }

  async function loadPlayerHeader(){
    // Default
    elName.textContent = playerId || "Unknown Player";
    elMeta.textContent = "";

    // Use playersIndex if available
    if(playersIndex.length && playerId){
      const p = playersIndex.find(x => x.player_id === String(playerId));
      if(p){
        elName.textContent = p.player_name;
        return;
      }
    }

    // As fallback, try reading players.json directly (if not loaded yet)
    if(playerId){
      try{
        const arr = await safeFetchJson("./data/baseball/players.json");
        const p = (arr || []).find(x => String(x.player_id || x.id) === String(playerId));
        if(p){
          elName.textContent = p.player_name || p.name || playerId;
        }
      }catch(e){}
    }
  }

  function resetAll(){
    seasonRows = [];
    teamAgg = new Map();
    oppAgg = new Map();
    career = { games:0, plate_appearances:0, at_bats:0, hits:0, home_runs:0, walks:0, strikeouts:0 };

    elSeasonBody.innerHTML = "";
    elSeasonCount.textContent = "";
    elTeamSelect.innerHTML = "";
    elOppSelect.innerHTML = "";
    elTeamHint.textContent = "Loading…";
    elOppHint.textContent = "Loading…";
    renderCards(elCareerCards, []);
    renderCards(elTeamCards, []);
    renderCards(elOppCards, []);
  }

  function addToCareer(row){
    career.games += Number(row.games || 0);
    career.plate_appearances += Number(row.plate_appearances || 0);
    career.at_bats += Number(row.at_bats || 0);
    career.hits += Number(row.hits || 0);
    career.home_runs += Number(row.home_runs || 0);
    career.walks += Number(row.walks || 0);
    career.strikeouts += Number(row.strikeouts || 0);
  }

  function addToTeam(team, row){
    const key = String(team || "").trim();
    if(!teamAgg.has(key)){
      teamAgg.set(key, { games:0, plate_appearances:0, at_bats:0, hits:0, home_runs:0, walks:0, strikeouts:0 });
    }
    const t = teamAgg.get(key);
    t.games += Number(row.games || 0);
    t.plate_appearances += Number(row.plate_appearances || 0);
    t.at_bats += Number(row.at_bats || 0);
    t.hits += Number(row.hits || 0);
    t.home_runs += Number(row.home_runs || 0);
    t.walks += Number(row.walks || 0);
    t.strikeouts += Number(row.strikeouts || 0);
  }

  function setUpTeamSelector(){
    const teams = Array.from(teamAgg.keys()).filter(Boolean).sort((a,b) => teamFull(a).localeCompare(teamFull(b)));

    if(!teams.length){
      elTeamSelect.innerHTML = "<option value=''>No teams</option>";
      renderTeam("");
      return;
    }

    elTeamSelect.innerHTML = teams.map(t => `<option value="${t.replace(/"/g,'&quot;')}">${teamFull(t)}</option>`).join("");
    elTeamSelect.value = teams[0];
    renderTeam(teams[0]);

    elTeamSelect.onchange = () => renderTeam(elTeamSelect.value);
  }

  async function loadOpponentSplits(){
    // Loads prebuilt opponent JSON: ./data/baseball/opponents/{playerId}.json
    oppAgg = new Map();

    if(!playerId){
      elOppSelect.innerHTML = "<option value=''>No player</option>";
      elOppHint.textContent = "No player";
      return;
    }

    setStatus("Loading opponent splits…");

    try{
      const arr = await safeFetchJson(`./data/baseball/opponents/${encodeURIComponent(playerId)}.json`);
      (arr || []).forEach(r => {
        const opp = String(r.opponent || "").trim();
        if(!opp) return;
        oppAgg.set(opp, {
          games: Number(r.games || 0),
          plate_appearances: Number(r.plate_appearances || 0),
          at_bats: Number(r.at_bats || 0),
          hits: Number(r.hits || 0),
          home_runs: Number(r.home_runs || 0),
          walks: Number(r.walks || 0),
          strikeouts: Number(r.strikeouts || 0)
        });
      });

      const opps = Array.from(oppAgg.keys()).sort((a,b) => teamFull(a).localeCompare(teamFull(b)));

      if(!opps.length){
        elOppSelect.innerHTML = "<option value=''>No opponent data</option>";
        elOppHint.textContent = "No opponent data";
        renderOpponent("");
        return;
      }

      elOppSelect.innerHTML = opps.map(o => `<option value="${o.replace(/"/g,'&quot;')}">${teamFull(o)}</option>`).join("");
      elOppSelect.value = opps[0];
      renderOpponent(opps[0]);

      elOppSelect.onchange = () => renderOpponent(elOppSelect.value);
      setStatus("Done.");
    }catch(e){
      elOppSelect.innerHTML = "<option value=''>Opponent file missing</option>";
      elOppHint.textContent = "Opponent file missing";
      renderOpponent("");
      setStatus("Opponent file missing for this player.");
    }
  }

  async function loadSeasonsAndStats(){
    if(!playerId){
      setStatus("Missing ?player= in the URL");
      return;
    }

    setStatus("Loading seasons…");

    let seasons = [];
    try{
      seasons = await safeFetchJson("./data/baseball/index.json");
    }catch(e){
      setStatus("Could not load ./data/baseball/index.json");
      return;
    }

    seasons = (seasons || []).map(s => String(s)).filter(Boolean);

    setStatus(`Scanning ${seasons.length} seasons…`);

    await mapLimit(seasons, 8, async (seasonStr, idx) => {
      const url = `./data/baseball/players/${seasonStr}.json`;
      let arr;
      try{
        arr = await safeFetchJson(url);
      }catch(e){
        return;
      }

      const row = (arr || []).find(x => String(x.player_id) === String(playerId));
      if(!row) return;

      const out = {
        season: Number(seasonStr) || seasonStr,
        team: String(row.team || "").trim(),
        games: Number(row.games || 0),
        plate_appearances: Number(row.plate_appearances || 0),
        at_bats: Number(row.at_bats || 0),
        hits: Number(row.hits || 0),
        home_runs: Number(row.home_runs || 0),
        walks: Number(row.walks || 0),
        strikeouts: Number(row.strikeouts || 0),
        avg: Number(fmtAvg(row.hits, row.at_bats))
      };

      seasonRows.push(out);
      addToCareer(out);
      addToTeam(out.team, out);

      if(idx % 10 === 0){
        setStatus(`Scanning… (${idx+1}/${seasons.length})`);
      }
    });

    setStatus("Rendering…");
    renderCareer();
    setUpTeamSelector();
    renderSeasonTable();
  }

  function wireSearch(){
    // Pre-fill input with current player name if possible
    if(playersIndex.length && playerId){
      const p = playersIndex.find(x => x.player_id === String(playerId));
      if(p) elSearch.value = `${p.player_name} (${p.player_id})`;
      else elSearch.value = "";
    }

    function go(){
      const typed = (elSearch.value || "").trim();
      const pid = findPlayerIdFromSearchText(typed);
      if(!pid){
        setStatus("No match found. Try a different name.");
        return;
      }
      location.href = `./player.html?player=${encodeURIComponent(pid)}`;
    }

    elGo.addEventListener("click", go);
    elSearch.addEventListener("keydown", (e) => {
      if(e.key === "Enter") go();
    });
  }

  async function init(){
    resetAll();
    wireSorting();

    await loadPlayersIndex();
    wireSearch();

    await loadPlayerHeader();

    // Main content
    await loadSeasonsAndStats();

    // Opponents (prebuilt, should be fast)
    await loadOpponentSplits();

    // No player ID line under name (requested)
    elMeta.textContent = "";
  }

  init();
})();
</script>

</body>
</html>
