<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --soft:#f0f6ff;
}
body{font-family:Inter,system-ui,Arial;margin:0;background:var(--bg);}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1400px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,var(--blue),#3a256e,var(--red));color:white;padding:30px;border-radius:20px;margin-bottom:18px;}
.hero h1{margin:0;font-size:40px;}
.section{background:var(--card);padding:20px;border-radius:18px;margin-bottom:18px;}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.card{background:var(--soft);border-radius:14px;padding:16px;text-align:center;}
.card .value{font-size:26px;font-weight:900;}
.card .label{margin-top:6px;font-size:12px;color:#555;}
.controls{display:flex;gap:12px;margin-bottom:14px;}
select{padding:8px 12px;border-radius:8px;border:1px solid var(--line);font-weight:700;}
table{width:100%;border-collapse:collapse;}
th{background:var(--blue);color:white;padding:10px;}
td{padding:8px;border-bottom:1px solid #eee;text-align:center;}
tr:nth-child(even){background:#f7fbff;}
.postseason-row{background:#fff4e6;font-weight:700;}
</style>
</head>
<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
  <a href="/baseball-leaders.html">Leaders</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
</div>

<div class="section">
  <h2>Career</h2>
  <div class="cards" id="careerCards"></div>
</div>

<div class="section">
  <h2>By Opponent</h2>
  <table>
    <thead>
      <tr>
        <th>Opponent</th>
        <th>G</th>
        <th>AB</th>
        <th>H</th>
        <th>HR</th>
        <th>AVG</th>
      </tr>
    </thead>
    <tbody id="oppBody"></tbody>
  </table>
</div>

<div class="section">
  <h2>Filters</h2>
  <div class="controls">
    <select id="typeSel">
      <option value="All">All Games</option>
      <option value="Regular">Regular Season</option>
      <option value="Postseason">Postseason</option>
    </select>
    <select id="seasonSel">
      <option value="All">All Seasons</option>
    </select>
  </div>
</div>

<div class="section">
  <h2>Games</h2>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Team</th>
        <th>Opponent</th>
        <th>AB</th>
        <th>H</th>
        <th>HR</th>
        <th>AVG</th>
      </tr>
    </thead>
    <tbody id="gameBody"></tbody>
  </table>
</div>

</div>

<script>
(async function(){

function avg(h,ab){return ab?(h/ab).toFixed(3):"0.000";}
async function safeFetch(u){try{const r=await fetch(u);if(!r.ok)return null;return await r.json();}catch{return null;}}

const qs=new URLSearchParams(location.search);
const param=qs.get("player");
if(!param){document.getElementById("playerName").textContent="Player not found";return;}

const players=await safeFetch("/data/baseball/players.json");
const meta=players.find(p=>String(p.player_id)===String(param)||p.name.toLowerCase()===param.toLowerCase());
if(!meta){document.getElementById("playerName").textContent="Player not found";return;}
const playerId=meta.player_id;
document.getElementById("playerName").textContent=meta.name;

const teamsData=await safeFetch("/data/baseball/teams.json");
const TEAM_LOOKUP={};
teamsData.forEach(t=>t.codes.forEach(c=>TEAM_LOOKUP[c]=t.name));
function teamName(c){return TEAM_LOOKUP[c]||c;}

const seasons=await safeFetch("/data/baseball/index.json");
const seasonSel=document.getElementById("seasonSel");
seasons.sort((a,b)=>b-a).forEach(y=>{
  if(y>=1947) seasonSel.innerHTML+=`<option value="${y}">${y}</option>`;
});

let games=[];

/* REGULAR */
const seasonResults=await Promise.all(
  seasons.filter(y=>y>=1947).map(y=>safeFetch(`/data/baseball/seasons/${y}.json`))
);

seasonResults.forEach(data=>{
  if(!data) return;
  data.forEach(g=>{
    const homeBat=g[9]||[];
    const awayBat=g[10]||[];
    const homePlayer=homeBat.find(p=>String(p[0])===playerId);
    const awayPlayer=awayBat.find(p=>String(p[0])===playerId);
    if(!homePlayer&&!awayPlayer)return;
    const isHome=!!homePlayer;
    const p=homePlayer||awayPlayer;
    games.push({
      date:g[1],
      season:g[2],
      type:"Regular",
      team:isHome?g[3]:g[4],
      opponent:isHome?g[4]:g[3],
      AB:Number(p[1])||0,
      H:Number(p[2])||0,
      HR:Number(p[3])||0
    });
  });
});

/* POSTSEASON */
const postMeta=await safeFetch("/data/baseball/postseason_meta.json");
const postBoxes=await Promise.all(
  postMeta.map(m=>safeFetch(`/data/baseball/postseason-games/${m.game_id}.json`))
);
postBoxes.forEach(box=>{
  if(!box||!box.batting)return;
  const pstats=box.batting[playerId];
  if(!pstats)return;
  games.push({
    date:box.date,
    season:box.season,
    type:"Postseason",
    team:box.home,
    opponent:box.away,
    AB:Number(pstats.AB)||0,
    H:Number(pstats.H)||0,
    HR:Number(pstats.HR)||0
  });
});

function render(){

  const type=document.getElementById("typeSel").value;
  const season=document.getElementById("seasonSel").value;

  let filtered=games.filter(g=>{
    if(type!=="All"&&g.type!==type)return false;
    if(season!=="All"&&g.season!=season)return false;
    return true;
  });

  let career={g:0,ab:0,h:0,hr:0};
  let oppStats={};

  filtered.forEach(g=>{
    career.g++;career.ab+=g.AB;career.h+=g.H;career.hr+=g.HR;
    if(!oppStats[g.opponent])oppStats[g.opponent]={g:0,ab:0,h:0,hr:0};
    oppStats[g.opponent].g++;
    oppStats[g.opponent].ab+=g.AB;
    oppStats[g.opponent].h+=g.H;
    oppStats[g.opponent].hr+=g.HR;
  });

  document.getElementById("careerCards").innerHTML=`
  <div class="card"><div class="value">${career.g}</div><div class="label">Games</div></div>
  <div class="card"><div class="value">${career.ab}</div><div class="label">AB</div></div>
  <div class="card"><div class="value">${career.h}</div><div class="label">Hits</div></div>
  <div class="card"><div class="value">${career.hr}</div><div class="label">HR</div></div>
  <div class="card"><div class="value">${avg(career.h,career.ab)}</div><div class="label">AVG</div></div>
  `;

  document.getElementById("oppBody").innerHTML=
  Object.entries(oppStats).map(([opp,s])=>`
  <tr>
    <td>${teamName(opp)}</td>
    <td>${s.g}</td>
    <td>${s.ab}</td>
    <td>${s.h}</td>
    <td>${s.hr}</td>
    <td>${avg(s.h,s.ab)}</td>
  </tr>
  `).join("");

  filtered.sort((a,b)=>new Date(b.date)-new Date(a.date));

  document.getElementById("gameBody").innerHTML=
  filtered.map(g=>`
  <tr class="${g.type==='Postseason'?'postseason-row':''}">
    <td>${g.date}</td>
    <td>${g.type}</td>
    <td>${teamName(g.team)}</td>
    <td>${teamName(g.opponent)}</td>
    <td>${g.AB}</td>
    <td>${g.H}</td>
    <td>${g.HR}</td>
    <td>${avg(g.H,g.AB)}</td>
  </tr>
  `).join("");
}

document.getElementById("typeSel").onchange=render;
document.getElementById("seasonSel").onchange=render;

render();

})();
</script>

</body>
</html>
