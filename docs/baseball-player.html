<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
margin:0;
font-size:36px;
}

.section{
background:white;
padding:18px;
border-radius:16px;
margin-bottom:16px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#002D72;
color:white;
padding:10px;
text-align:left;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f0f6ff;
}

a{
color:#0056d6;
text-decoration:none;
font-weight:700;
}

</style>

</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/baseball.html">Baseball</a>
<a href="/baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading...</h1>
<div id="playerMeta"></div>
</div>

<div class="section">
<h2>Career Batting Totals</h2>
<div id="battingTotals"></div>
</div>

<div class="section">
<h2>Career Pitching Totals</h2>
<div id="pitchingTotals"></div>
</div>

<div class="section">
<h2>Game Log</h2>
<div id="gameLog"></div>
</div>

</div>

<script>

/* GLOBAL DATA */

let PLAYER_ID=null
let PLAYER_NAME=""
let ALL_GAMES=[]

/* HELPERS */

function param(name){

return new URLSearchParams(location.search).get(name)

}

function seasonFromGameId(id){

return id.substring(3,7)

}

/* LOAD PLAYER NAME */

async function loadPlayer(){

PLAYER_ID=param("player")

const res=await fetch("/data/baseball/players.json")

const players=await res.json()

const player=players.find(p=>p.player_id===PLAYER_ID)

PLAYER_NAME=player?.name || PLAYER_ID

document.getElementById("playerName").textContent=PLAYER_NAME

document.getElementById("playerMeta").textContent=
"Player ID: "+PLAYER_ID

}

/* LOAD ALL GAMES */

async function loadAllGames(){

const res=await fetch("/data/baseball/index.json")

const seasons=await res.json()

for(const season of seasons){

const res2=await fetch(`/data/baseball/seasons/${season}.json`)

const games=await res2.json()

ALL_GAMES.push(...games)

}

}

/* LOAD PLAYER GAME DATA */

async function loadPlayerGames(){

let battingTotals={}
let pitchingTotals={}

let log=[]

for(const game of ALL_GAMES){

const id=game.game_id

const season=seasonFromGameId(id)

const res=await fetch(`/data/baseball/games/${season}/${id}.json`)

if(!res.ok) continue

const data=await res.json()

/* batting */

data.batters_home?.forEach(p=>{
if(p.player_id===PLAYER_ID){

addStats(battingTotals,p)

log.push({
game:id,
team:data.home_code,
type:"Batting",
stats:p
})

}
})

data.batters_away?.forEach(p=>{
if(p.player_id===PLAYER_ID){

addStats(battingTotals,p)

log.push({
game:id,
team:data.away_code,
type:"Batting",
stats:p
})

}
})

/* pitching */

data.pitchers_home?.forEach(p=>{
if(p.player_id===PLAYER_ID){

addStats(pitchingTotals,p)

log.push({
game:id,
team:data.home_code,
type:"Pitching",
stats:p
})

}
})

data.pitchers_away?.forEach(p=>{
if(p.player_id===PLAYER_ID){

addStats(pitchingTotals,p)

log.push({
game:id,
team:data.away_code,
type:"Pitching",
stats:p
})

}
})

}

renderTotals("battingTotals",battingTotals)
renderTotals("pitchingTotals",pitchingTotals)
renderLog(log)

}

/* ADD STATS */

function addStats(total,stats){

for(const k in stats){

if(k==="player_id") continue

if(!isNaN(stats[k])){

total[k]=(total[k]||0)+Number(stats[k])

}

}

}

/* RENDER TOTALS */

function renderTotals(id,stats){

const table=document.createElement("table")

table.innerHTML=
`
<tr>
${Object.keys(stats).map(k=>`<th>${k}</th>`).join("")}
</tr>
<tr>
${Object.values(stats).map(v=>`<td>${v}</td>`).join("")}
</tr>
`

document.getElementById(id).appendChild(table)

}

/* RENDER LOG */

function renderLog(log){

const table=document.createElement("table")

table.innerHTML=
`
<tr>
<th>Game</th>
<th>Team</th>
<th>Type</th>
</tr>
${log.map(g=>`
<tr>
<td>
<a href="/baseball-game.html?game=${g.game}">
${g.game}
</a>
</td>
<td>${g.team}</td>
<td>${g.type}</td>
</tr>
`).join("")}
`

document.getElementById("gameLog").appendChild(table)

}

/* INIT */

async function init(){

await loadPlayer()

await loadAllGames()

await loadPlayerGames()

}

init()

</script>

</body>
</html>
