<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --muted:#667085;
  --line:#e6e8ee;
  --soft:#f0f6ff;
}

body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.navbar a:hover{ text-decoration:underline; }

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,var(--blue), #3a256e, var(--red));
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
}

.hero h1{
  margin:0;
  font-size:40px;
  letter-spacing:-0.5px;
}

.hero-right{
  flex:1;
  min-width:260px;
  max-width:560px;
}

.search-wrap{
  display:flex;
  gap:12px;
}

/* Enlarged for mobile usability */
.search{
  width:100%;
  padding:22px 24px;
  border-radius:18px;
  border:2px solid rgba(255,255,255,0.45);
  outline:none;
  font-size:22px;
  background:rgba(255,255,255,0.15);
  color:white;
  font-weight:700;
  min-height:64px;
}

.search::placeholder{
  color:rgba(255,255,255,0.9);
}

.btn{
  padding:22px 26px;
  border-radius:18px;
  border:2px solid rgba(255,255,255,0.45);
  background:rgba(255,255,255,0.18);
  color:white;
  font-weight:900;
  font-size:18px;
  cursor:pointer;
  min-height:64px;
}

.section{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
}

.section h2{
  margin:0 0 14px 0;
  font-size:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

.controls{
  display:flex;
  gap:10px;
}

select{
  padding:10px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  font-weight:700;
}

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.card{
  background:var(--soft);
  border-radius:14px;
  padding:16px;
  text-align:center;
  border:1px solid #e8efff;
}

.card .value{
  font-size:28px;
  font-weight:900;
}

.card .label{
  margin-top:6px;
  font-size:12px;
  color:#555;
}

table{
  width:100%;
  border-collapse:collapse;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

th{
  background:var(--blue);
  color:white;
  padding:10px;
  text-align:left;
  font-size:13px;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
}

tr:nth-child(even){background:#f7fbff;}

@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
  <div>
    <h1 id="playerName">Loading...</h1>
  </div>
  <div class="hero-right">
    <div class="search-wrap">
      <input id="playerSearch" class="search" list="playerList" placeholder="Search player name..." />
      <datalist id="playerList"></datalist>
      <button id="goBtn" class="btn">Go</button>
    </div>
  </div>
</div>

<div class="section">
  <h2>Career</h2>
  <div class="cards" id="careerCards"></div>
</div>

<div class="section">
  <h2>
    <span>By Team</span>
    <span class="controls">
      <select id="teamSelect"></select>
    </span>
  </h2>
  <div class="cards" id="teamCards"></div>
</div>

<div class="section">
  <h2>
    <span>Vs Opponent</span>
    <span class="controls">
      <select id="oppSelect"></select>
    </span>
  </h2>
  <div class="cards" id="oppCards"></div>
</div>

<div class="section">
  <h2>Season Breakdown</h2>
  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>Team</th>
        <th>G</th>
        <th>PA</th>
        <th>AB</th>
        <th>H</th>
        <th>HR</th>
        <th>BB</th>
        <th>SO</th>
        <th>AVG</th>
      </tr>
    </thead>
    <tbody id="seasonBody"></tbody>
  </table>
</div>

</div>

<script>
(function(){

const qs = new URLSearchParams(location.search);
const playerId = qs.get("player");

if(!playerId){
  document.getElementById("playerName").textContent="Player Not Found";
  return;
}

function fmt(n){return Number(n||0).toLocaleString();}
function avg(h,ab){return ab?(h/ab).toFixed(3):"0.000";}

async function safeFetch(url){
  const r=await fetch(url);
  if(!r.ok) return null;
  return r.json();
}

async function init(){

const players=await safeFetch("./data/baseball/players.json");
if(players){
  const list=document.getElementById("playerList");
  list.innerHTML=players.map(p=>`<option value="${p.player_name}"></option>`).join("");

  // FIXED string-safe ID comparison
  const match=players.find(p=>String(p.player_id)===String(playerId));
  if(match) document.getElementById("playerName").textContent=match.player_name;
}

const seasons=await safeFetch("./data/baseball/index.json");
if(!seasons) return;

let career={games:0,plate_appearances:0,at_bats:0,hits:0,home_runs:0,walks:0,strikeouts:0};
let rows=[];
let teamAgg=new Map();

for(const s of seasons){
  const data=await safeFetch(`./data/baseball/players/${s}.json`);
  if(!data) continue;

  const row=data.find(p=>String(p.player_id)===String(playerId));
  if(!row) continue;

  rows.push({...row,season:s});

  career.games+=row.games||0;
  career.plate_appearances+=row.plate_appearances||0;
  career.at_bats+=row.at_bats||0;
  career.hits+=row.hits||0;
  career.home_runs+=row.home_runs||0;
  career.walks+=row.walks||0;
  career.strikeouts+=row.strikeouts||0;

  if(!teamAgg.has(row.team)){
    teamAgg.set(row.team,{games:0,hits:0,home_runs:0,walks:0,at_bats:0});
  }
  const t=teamAgg.get(row.team);
  t.games+=row.games||0;
  t.hits+=row.hits||0;
  t.home_runs+=row.home_runs||0;
  t.walks+=row.walks||0;
  t.at_bats+=row.at_bats||0;
}

document.getElementById("careerCards").innerHTML=`
<div class="card"><div class="value">${fmt(career.games)}</div><div class="label">Games</div></div>
<div class="card"><div class="value">${fmt(career.hits)}</div><div class="label">Hits</div></div>
<div class="card"><div class="value">${fmt(career.home_runs)}</div><div class="label">HR</div></div>
<div class="card"><div class="value">${avg(career.hits,career.at_bats)}</div><div class="label">AVG</div></div>
`;

document.getElementById("seasonBody").innerHTML=rows.map(r=>`
<tr>
<td>${r.season}</td>
<td>${r.team}</td>
<td>${r.games}</td>
<td>${r.plate_appearances}</td>
<td>${r.at_bats}</td>
<td>${r.hits}</td>
<td>${r.home_runs}</td>
<td>${r.walks}</td>
<td>${r.strikeouts}</td>
<td>${avg(r.hits,r.at_bats)}</td>
</tr>`).join("");

}

init();

})();
</script>

</body>
</html>
