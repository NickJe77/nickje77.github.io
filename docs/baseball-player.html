<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.hero h1{
margin:0;
font-size:36px;
}

.section{
background:white;
padding:18px;
border-radius:16px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#002D72;
color:white;
padding:10px;
text-align:left;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f0f6ff;
}

a{
color:#0056d6;
text-decoration:none;
font-weight:700;
}

</style>

</head>

<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="name">Loading...</h1>
<div id="meta"></div>
</div>

<div class="section">
<h2>Career Batting Totals</h2>
<div id="batting"></div>
</div>

<div class="section">
<h2>Career Pitching Totals</h2>
<div id="pitching"></div>
</div>

<div class="section">
<h2>Game Log</h2>
<div id="games"></div>
</div>

</div>

<script>

const playerId =
new URLSearchParams(location.search).get("player")

let playerName=""

/* LOAD PLAYER NAME */

async function loadPlayerName(){

const res=
await fetch("./data/baseball/players.json")

const players=
await res.json()

const p=
players.find(x=>x.player_id===playerId)

playerName=
p?.name || playerId

document.getElementById("name").textContent=
playerName

document.getElementById("meta").textContent=
"Player ID: "+playerId

}

/* LOAD ALL SEASONS */

async function loadAllGames(){

const index=
await fetch("./data/baseball/index.json")
.then(r=>r.json())

let battingTotals={}
let pitchingTotals={}
let games=[]

for(const season of index){

const seasonGames=
await fetch(`./data/baseball/seasons/${season}.json`)
.then(r=>r.json())

for(const g of seasonGames){

const gameId =
g.home_code +
g.date.replaceAll("-","") +
"0"

const year =
g.date.substring(0,4)

try{

const game=
await fetch(`./data/baseball/games/${year}/${gameId}.json`)
.then(r=>r.json())

/* BATTING */

const batters=[
...(game.batters_home||[]),
...(game.batters_away||[])
]

for(const b of batters){

if(b.player_id===playerId){

for(const stat in b){

if(stat==="player_id") continue

battingTotals[stat] =
(battingTotals[stat]||0) +
(b[stat]||0)

}

games.push({
date:g.date,
team:g.home_code===game.home_code ?
g.home_code :
g.away_code,
gameId
})

}

}

/* PITCHING */

const pitchers=[
...(game.pitchers_home||[]),
...(game.pitchers_away||[])
]

for(const p of pitchers){

if(p.player_id===playerId){

for(const stat in p){

if(stat==="player_id") continue

pitchingTotals[stat] =
(pitchingTotals[stat]||0) +
(p[stat]||0)

}

}

}

}catch{}

}

}

renderTotals("batting",battingTotals)
renderTotals("pitching",pitchingTotals)
renderGames(games)

}

/* RENDER TOTALS */

function renderTotals(id,totals){

if(Object.keys(totals).length===0){

document.getElementById(id).textContent=
"No data"

return

}

let html="<table><thead><tr>"

for(const stat in totals){

html+=`<th>${stat}</th>`

}

html+="</tr></thead><tbody><tr>"

for(const stat in totals){

html+=`<td>${totals[stat]}</td>`

}

html+="</tr></tbody></table>"

document.getElementById(id).innerHTML=
html

}

/* GAME LOG */

function renderGames(games){

if(games.length===0){

document.getElementById("games").textContent=
"No games found"

return

}

let html=
"<table><thead><tr>"+
"<th>Date</th>"+
"<th>Team</th>"+
"</tr></thead><tbody>"

games
.sort((a,b)=>b.date.localeCompare(a.date))
.forEach(g=>{

html+=
`<tr>
<td>
<a href="./baseball-game.html?game=${g.gameId}">
${g.date}
</a>
</td>
<td>${g.team}</td>
</tr>`

})

html+="</tbody></table>"

document.getElementById("games").innerHTML=
html

}

/* INIT */

async function init(){

await loadPlayerName()

await loadAllGames()

}

init()

</script>

</body>
</html>
