<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --soft:#f0f6ff;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1600px;
  margin:auto;
  padding:14px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),#3a256e,var(--red));
  color:white;
  padding:24px;
  border-radius:20px;
  margin-bottom:14px;
}

.hero h1{
  margin:0;
  font-size:42px;
}

.section{
  background:var(--card);
  padding:14px;
  border-radius:16px;
  margin-bottom:14px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.card{
  background:var(--soft);
  border-radius:12px;
  padding:14px;
  text-align:center;
}

.card .value{
  font-size:24px;
  font-weight:900;
}

.card .label{
  margin-top:4px;
  font-size:12px;
  color:#555;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--blue);
  color:white;
  padding:8px;
  font-size:12px;
}

td{
  padding:7px;
  border-bottom:1px solid #eee;
  text-align:center;
  font-size:12px;
}

tr:nth-child(even){
  background:#f7fbff;
}

.postseason-row{
  background:#fff4e6;
  font-weight:700;
}

/* MOBILE */

@media(max-width:900px){

.navbar{
  gap:12px;
  padding:12px;
}

.navbar a{
  font-size:12px;
}

.page{
  padding:8px;
}

.hero{
  padding:16px;
  border-radius:16px;
}

.hero h1{
  font-size:28px;
}

.section{
  padding:10px;
  border-radius:12px;
}

.cards{
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.card{
  padding:10px;
}

.card .value{
  font-size:18px;
}

.card .label{
  font-size:10px;
}

th{
  font-size:10px;
  padding:6px 4px;
}

td{
  font-size:10px;
  padding:5px 4px;
}

}

</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
  <a href="/baseball-leaders.html">Leaders</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
</div>

<div class="section">

  <h2>Career</h2>

  <div class="cards" id="careerCards"></div>

</div>

<div class="section">

  <h2>Games</h2>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Team</th>
          <th>Opponent</th>
          <th>AB</th>
          <th>H</th>
          <th>HR</th>
          <th>AVG</th>
        </tr>
      </thead>

      <tbody id="gameBody"></tbody>

    </table>

  </div>

</div>

</div>

<script>
(async function(){

function avg(h,ab){
  return ab?(h/ab).toFixed(3):"0.000";
}

async function safeFetch(u){
  try{
    const r=await fetch(u);
    if(!r.ok)return null;
    return await r.json();
  }catch{
    return null;
  }
}

const qs = new URLSearchParams(location.search);

const rawPlayer =
  decodeURIComponent(qs.get("player") || "").trim();

const playerName =
  rawPlayer.toLowerCase();

document.getElementById("playerName").textContent =
  rawPlayer || "Player";

const seasons =
  await safeFetch("/data/baseball/index.json") || [];

let games=[];

/* LOOP SEASONS */

for(const year of seasons){

  const seasonGames =
    await safeFetch(`/data/baseball/seasons/${year}.json`);

  if(!seasonGames) continue;

  for(const g of seasonGames){

    const file =
      g.game_file ||
      g.filename ||
      g.file;

    if(!file) continue;

    const box =
      await safeFetch(`/data/baseball/boxscores/${year}/${file}`);

    if(!box) continue;

    const plays =
      box.liveData?.plays?.allPlays || [];

    const gameStats = {
      AB:0,
      H:0,
      HR:0
    };

    let foundPlayer = false;
    let isTop = false;

    for(const play of plays){

      const batter =
        play.matchup?.batter?.fullName || "";

      if(
        batter.toLowerCase() !== playerName
      ) continue;

      foundPlayer = true;

      isTop =
        play.about?.isTopInning || false;

      const eventType =
        play.result?.eventType || "";

      const isAB = ![
        "walk",
        "intent_walk",
        "hit_by_pitch",
        "sac_bunt",
        "sac_fly"
      ].includes(eventType);

      if(isAB){
        gameStats.AB++;
      }

      if([
        "single",
        "double",
        "triple",
        "home_run"
      ].includes(eventType)){
        gameStats.H++;
      }

      if(eventType === "home_run"){
        gameStats.HR++;
      }

    }

    if(!foundPlayer) continue;

    games.push({

      date:
        box.date ||
        g.date ||
        "",

      type:"Regular",

      team:
        isTop
          ? box.away_team?.code
          : box.home_team?.code,

      opponent:
        isTop
          ? box.home_team?.code
          : box.away_team?.code,

      AB:gameStats.AB,
      H:gameStats.H,
      HR:gameStats.HR

    });

  }

}

/* SORT */

games.sort(
  (a,b)=>
    new Date(b.date)-new Date(a.date)
);

/* TOTALS */

const totals = {
  games:games.length,
  AB:0,
  H:0,
  HR:0
};

games.forEach(g=>{

  totals.AB += g.AB;
  totals.H += g.H;
  totals.HR += g.HR;

});

/* CAREER CARDS */

document.getElementById("careerCards").innerHTML = `

<div class="card">
  <div class="value">${totals.games}</div>
  <div class="label">Games</div>
</div>

<div class="card">
  <div class="value">${totals.AB}</div>
  <div class="label">At Bats</div>
</div>

<div class="card">
  <div class="value">${totals.H}</div>
  <div class="label">Hits</div>
</div>

<div class="card">
  <div class="value">${totals.HR}</div>
  <div class="label">Home Runs</div>
</div>

<div class="card">
  <div class="value">${avg(totals.H,totals.AB)}</div>
  <div class="label">AVG</div>
</div>

`;

/* GAMES TABLE */

document.getElementById("gameBody").innerHTML =
games.map(g=>`

<tr>

<td>${g.date}</td>
<td>${g.type}</td>
<td>${g.team || ""}</td>
<td>${g.opponent || ""}</td>
<td>${g.AB}</td>
<td>${g.H}</td>
<td>${g.HR}</td>
<td>${avg(g.H,g.AB)}</td>

</tr>

`).join("");

})();
</script>

</body>
</html>
