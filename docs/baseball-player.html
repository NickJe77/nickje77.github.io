<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8" />
  <title>Player | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>

:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --soft:#f0f6ff;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:#111;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:28px;
  padding:18px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
  font-size:15px;
}

.page{
  max-width:1700px;
  margin:auto;
  padding:18px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),#472a84,var(--red));
  color:#fff;
  padding:34px;
  border-radius:22px;
  margin-bottom:18px;
}

.hero h1{
  margin:0;
  font-size:56px;
  font-weight:900;
}

.section{
  background:#fff;
  padding:18px;
  border-radius:20px;
  margin-bottom:18px;
}

.section h2{
  margin-top:0;
  margin-bottom:16px;
  font-size:24px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.card{
  background:#eef4ff;
  border-radius:16px;
  padding:22px;
  text-align:center;
}

.card .value{
  font-size:42px;
  font-weight:900;
  line-height:1;
}

.card .label{
  margin-top:10px;
  font-size:14px;
  color:#666;
  font-weight:600;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--blue);
  color:#fff;
  padding:12px;
  font-size:14px;
  white-space:nowrap;
}

td{
  padding:12px;
  border-bottom:1px solid #e6e6e6;
  text-align:center;
  font-size:14px;
}

tr:nth-child(even){
  background:#f7fbff;
}

.loading{
  padding:30px;
  text-align:center;
  font-size:22px;
  font-weight:800;
}

@media(max-width:900px){

.navbar{
  gap:14px;
  padding:14px;
}

.navbar a{
  font-size:12px;
}

.page{
  padding:10px;
}

.hero{
  padding:20px;
}

.hero h1{
  font-size:34px;
}

.section{
  padding:12px;
}

.section h2{
  font-size:20px;
}

.cards{
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card{
  padding:14px;
}

.card .value{
  font-size:26px;
}

.card .label{
  font-size:11px;
}

th{
  font-size:11px;
  padding:7px;
}

td{
  font-size:11px;
  padding:7px;
}

}

</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
  <a href="/baseball-leaders.html">Leaders</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
</div>

<div class="section">

  <h2>Career</h2>

  <div class="cards" id="careerCards">

    <div class="loading">
      Loading player data...
    </div>

  </div>

</div>

<div class="section">

  <h2>Games</h2>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>Date</th>
          <th>Season</th>
          <th>Team</th>
          <th>Opponent</th>
          <th>AB</th>
          <th>H</th>
          <th>HR</th>
          <th>AVG</th>
        </tr>
      </thead>

      <tbody id="gameBody"></tbody>

    </table>

  </div>

</div>

</div>

<script>

(async function(){

function avg(h,ab){
  return ab ? (h/ab).toFixed(3) : "0.000";
}

async function safeFetch(url){

  try{

    const r = await fetch(url);

    if(!r.ok) return null;

    return await r.json();

  }catch{

    return null;

  }

}

function slugify(name){

  return name
    .toLowerCase()
    .replace(/[^\w\s-]/g,"")
    .replace(/\s+/g,"-");

}

/* TEAM NAMES */

const teamNames = {

  ARI:"Arizona Diamondbacks",
  ATL:"Atlanta Braves",
  BAL:"Baltimore Orioles",
  BOS:"Boston Red Sox",
  CHC:"Chicago Cubs",
  CHW:"Chicago White Sox",
  CIN:"Cincinnati Reds",
  CLE:"Cleveland Guardians",
  COL:"Colorado Rockies",
  DET:"Detroit Tigers",
  HOU:"Houston Astros",
  KAN:"Kansas City Royals",
  KC:"Kansas City Royals",
  LAA:"Los Angeles Angels",
  LAD:"Los Angeles Dodgers",
  MIA:"Miami Marlins",
  MIL:"Milwaukee Brewers",
  MIN:"Minnesota Twins",
  NYM:"New York Mets",
  NYY:"New York Yankees",
  ATH:"Athletics",
  OAK:"Athletics",
  PHI:"Philadelphia Phillies",
  PIT:"Pittsburgh Pirates",
  SDP:"San Diego Padres",
  SD:"San Diego Padres",
  SEA:"Seattle Mariners",
  SFG:"San Francisco Giants",
  SF:"San Francisco Giants",
  STL:"St Louis Cardinals",
  TB:"Tampa Bay Rays",
  TBR:"Tampa Bay Rays",
  TEX:"Texas Rangers",
  TOR:"Toronto Blue Jays",
  WSN:"Washington Nationals",
  WAS:"Washington Nationals"

};

const qs = new URLSearchParams(location.search);

const rawPlayer =
  decodeURIComponent(
    qs.get("player") || ""
  ).trim();

document.getElementById("playerName").textContent =
  rawPlayer || "Player";

const slug = slugify(rawPlayer);

/* LOAD PLAYER FILE */

const player =
  await safeFetch(
    `/data/baseball/players/${slug}.json`
  );

if(!player){

  document.getElementById("careerCards").innerHTML = `
    <div class="loading">
      No player data found
    </div>
  `;

  return;

}

const games = player.games || [];

/* SORT */

games.sort((a,b)=>
  new Date(b.date) - new Date(a.date)
);

/* TOTALS */

const totals = {
  games:games.length,
  AB:0,
  H:0,
  HR:0
};

games.forEach(g=>{

  totals.AB += Number(g.AB || 0);
  totals.H += Number(g.H || 0);
  totals.HR += Number(g.HR || 0);

});

/* CARDS */

document.getElementById("careerCards").innerHTML = `

<div class="card">
  <div class="value">${totals.games}</div>
  <div class="label">Games</div>
</div>

<div class="card">
  <div class="value">${totals.AB}</div>
  <div class="label">At Bats</div>
</div>

<div class="card">
  <div class="value">${totals.H}</div>
  <div class="label">Hits</div>
</div>

<div class="card">
  <div class="value">${totals.HR}</div>
  <div class="label">Home Runs</div>
</div>

<div class="card">
  <div class="value">${avg(totals.H,totals.AB)}</div>
  <div class="label">AVG</div>
</div>

`;

/* TABLE */

document.getElementById("gameBody").innerHTML =
games.map(g=>`

<tr>

<td>${g.date || ""}</td>

<td>${g.season || ""}</td>

<td>
  ${
    teamNames[g.team]
    || g.team
    || ""
  }
</td>

<td>
  ${
    teamNames[g.opponent]
    || g.opponent
    || ""
  }
</td>

<td>${g.AB || 0}</td>
<td>${g.H || 0}</td>
<td>${g.HR || 0}</td>

<td>
  ${
    avg(
      g.H || 0,
      g.AB || 0
    )
  }
</td>

</tr>

`).join("");

})();
</script>

</body>
</html>
