<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --muted:#667085;
  --line:#e6e8ee;
  --soft:#f0f6ff;
  --chip:#eef2ff;
}

body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.navbar a:hover{ text-decoration:underline; }

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,var(--blue), #3a256e, var(--red));
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
}

.hero h1{
  margin:0;
  font-size:40px;
  letter-spacing:-0.5px;
}

.hero-right{
  flex:1;
  min-width:260px;
  max-width:500px;
}

.search-wrap{
  display:flex;
  gap:10px;
}

.search{
  width:100%;
  padding:18px 20px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.35);
  outline:none;
  font-size:20px;
  background:rgba(255,255,255,0.15);
  color:white;
  font-weight:600;
}

.search::placeholder{
  color:rgba(255,255,255,0.9);
}

.btn{
  padding:18px 22px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.35);
  background:rgba(255,255,255,0.18);
  color:white;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
}

.section{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
}

.section h2{
  margin:0 0 14px 0;
  font-size:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

.controls{
  display:flex;
  gap:10px;
}

select{
  padding:10px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  font-weight:700;
}

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.card{
  background:var(--soft);
  border-radius:14px;
  padding:16px;
  text-align:center;
  border:1px solid #e8efff;
}

.card .value{
  font-size:28px;
  font-weight:900;
}

.card .label{
  margin-top:6px;
  font-size:12px;
  color:#555;
}

table{
  width:100%;
  border-collapse:collapse;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

th{
  background:var(--blue);
  color:white;
  padding:10px;
  text-align:left;
  font-size:13px;
  cursor:pointer;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
}

tr:nth-child(even){background:#f7fbff;}

@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr);}
  .search{font-size:22px;}
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
  <div>
    <h1 id="playerName">Loading...</h1>
  </div>
  <div class="hero-right">
    <div class="search-wrap">
      <input id="playerSearch" class="search" list="playerList" placeholder="Search player name..." />
      <datalist id="playerList"></datalist>
      <button id="goBtn" class="btn">Go</button>
    </div>
  </div>
</div>

<div class="section">
  <h2>Career</h2>
  <div class="cards" id="careerCards"></div>
</div>

<div class="section">
  <h2>
    <span>By Team</span>
    <span class="controls">
      <select id="teamSelect"></select>
    </span>
  </h2>
  <div class="cards" id="teamCards"></div>
</div>

<div class="section">
  <h2>
    <span>Vs Opponent</span>
    <span class="controls">
      <select id="oppSelect"></select>
    </span>
  </h2>
  <div class="cards" id="oppCards"></div>
</div>

<div class="section">
  <h2>Season Breakdown</h2>
  <table id="seasonTable">
    <thead>
      <tr>
        <th>Season</th>
        <th>Team</th>
        <th>G</th>
        <th>PA</th>
        <th>AB</th>
        <th>H</th>
        <th>HR</th>
        <th>BB</th>
        <th>SO</th>
        <th>AVG</th>
      </tr>
    </thead>
    <tbody id="seasonBody"></tbody>
  </table>
</div>

</div>

<script>
(function(){

const qs = new URLSearchParams(location.search);
const playerId = qs.get("player");

if(!playerId){
  document.getElementById("playerName").textContent = "Player Not Found";
  return;
}

const TEAM_NAMES={
"SEA":"Seattle Mariners","SFN":"San Francisco Giants",
"LAN":"Los Angeles Dodgers","ANA":"Los Angeles Angels",
"NYA":"New York Yankees","CHN":"Chicago Cubs",
"BOS":"Boston Red Sox","ATL":"Atlanta Braves"
};

function teamFull(c){return TEAM_NAMES[c]||c;}
function fmt(n){return Number(n||0).toLocaleString();}
function avg(h,ab){return ab? (h/ab).toFixed(3):"0.000";}

let seasonRows=[];
let teamAgg=new Map();
let oppAgg=new Map();
let career={games:0,plate_appearances:0,at_bats:0,hits:0,home_runs:0,walks:0,strikeouts:0};

async function safeFetch(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return await r.json();
}

async function loadPlayersIndex(){
  const arr = await safeFetch("./data/baseball/players.json");
  if(!arr) return;

  const list=document.getElementById("playerList");
  list.innerHTML=arr.map(p=>`<option value="${p.player_name}"></option>`).join("");
  window.playersIndex=arr;

  const match = arr.find(p=>p.player_id===playerId);
  if(match){
    document.getElementById("playerName").textContent = match.player_name;
  }
}

function findPlayerIdByName(name){
  name=name.toLowerCase();
  const hit=window.playersIndex.find(p=>p.player_name.toLowerCase()===name);
  return hit?hit.player_id:"";
}

document.getElementById("goBtn").onclick=()=>{
  const name=document.getElementById("playerSearch").value.trim();
  const id=findPlayerIdByName(name);
  if(id) location.href=`player.html?player=${id}`;
};

async function loadSeasons(){
  const seasons = await safeFetch("./data/baseball/index.json");
  if(!seasons) return;

  for(const s of seasons){
    const data = await safeFetch(`./data/baseball/players/${s}.json`);
    if(!data) continue;

    const row = data.find(p=>p.player_id===playerId);
    if(!row) continue;

    seasonRows.push({...row,season:s});

    career.games+=row.games||0;
    career.plate_appearances+=row.plate_appearances||0;
    career.at_bats+=row.at_bats||0;
    career.hits+=row.hits||0;
    career.home_runs+=row.home_runs||0;
    career.walks+=row.walks||0;
    career.strikeouts+=row.strikeouts||0;

    if(!teamAgg.has(row.team)){
      teamAgg.set(row.team,{
        games:0,plate_appearances:0,at_bats:0,
        hits:0,home_runs:0,walks:0,strikeouts:0
      });
    }

    const t = teamAgg.get(row.team);
    t.games+=row.games||0;
    t.plate_appearances+=row.plate_appearances||0;
    t.at_bats+=row.at_bats||0;
    t.hits+=row.hits||0;
    t.home_runs+=row.home_runs||0;
    t.walks+=row.walks||0;
    t.strikeouts+=row.strikeouts||0;
  }

  renderCareer();
  renderSeason();
  buildTeamSelector();
}

function renderCareer(){
  document.getElementById("careerCards").innerHTML=`
  <div class="card"><div class="value">${fmt(career.games)}</div><div class="label">Games</div></div>
  <div class="card"><div class="value">${fmt(career.plate_appearances)}</div><div class="label">PA</div></div>
  <div class="card"><div class="value">${fmt(career.hits)}</div><div class="label">Hits</div></div>
  <div class="card"><div class="value">${fmt(career.home_runs)}</div><div class="label">HR</div></div>
  <div class="card"><div class="value">${avg(career.hits,career.at_bats)}</div><div class="label">AVG</div></div>
  `;
}

function renderSeason(){
  document.getElementById("seasonBody").innerHTML=seasonRows.map(r=>`
  <tr>
  <td>${r.season}</td>
  <td>${teamFull(r.team)}</td>
  <td>${r.games}</td>
  <td>${r.plate_appearances}</td>
  <td>${r.at_bats}</td>
  <td>${r.hits}</td>
  <td>${r.home_runs}</td>
  <td>${r.walks}</td>
  <td>${r.strikeouts}</td>
  <td>${avg(r.hits,r.at_bats)}</td>
  </tr>`).join("");
}

function buildTeamSelector(){
  const sel=document.getElementById("teamSelect");
  sel.innerHTML=[...teamAgg.keys()].map(t=>`<option value="${t}">${teamFull(t)}</option>`).join("");

  sel.onchange=()=>{
    const t = teamAgg.get(sel.value);
    if(!t) return;
    document.getElementById("teamCards").innerHTML=`
    <div class="card"><div class="value">${fmt(t.games)}</div><div class="label">Games</div></div>
    <div class="card"><div class="value">${fmt(t.hits)}</div><div class="label">Hits</div></div>
    <div class="card"><div class="value">${fmt(t.home_runs)}</div><div class="label">HR</div></div>
    <div class="card"><div class="value">${fmt(t.walks)}</div><div class="label">BB</div></div>
    <div class="card"><div class="value">${avg(t.hits,t.at_bats)}</div><div class="label">AVG</div></div>
    `;
  };

  if(sel.value) sel.onchange();
}

async function loadOpponents(){
  const data = await safeFetch(`./data/baseball/opponents/${playerId}.json`);
  if(!data) return;

  data.forEach(o=>oppAgg.set(o.opponent,o));
  const sel=document.getElementById("oppSelect");
  sel.innerHTML=data.map(o=>`<option value="${o.opponent}">${teamFull(o.opponent)}</option>`).join("");

  sel.onchange=()=>renderOpponent(sel.value);
  if(sel.value) sel.onchange();
}

function renderOpponent(o){
  const d=oppAgg.get(o);
  if(!d) return;
  document.getElementById("oppCards").innerHTML=`
  <div class="card"><div class="value">${fmt(d.games)}</div><div class="label">Games</div></div>
  <div class="card"><div class="value">${fmt(d.hits)}</div><div class="label">Hits</div></div>
  <div class="card"><div class="value">${fmt(d.home_runs)}</div><div class="label">HR</div></div>
  <div class="card"><div class="value">${fmt(d.walks)}</div><div class="label">BB</div></div>
  <div class="card"><div class="value">${avg(d.hits,d.at_bats)}</div><div class="label">AVG</div></div>
  `;
}

async function init(){
  await loadPlayersIndex();
  await loadSeasons();
  await loadOpponents();
}

init();

})();
</script>

</body>
</html>
