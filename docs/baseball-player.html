<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:white;padding:30px;border-radius:20px;margin-bottom:20px;}
.section{background:white;padding:18px;border-radius:16px;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;}
th{background:#002D72;color:white;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
</style>
</head>

<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading...</h1>
<div id="meta"></div>
</div>

<div class="section">
<h2>Career Batting Totals</h2>
<div id="batting">Loading...</div>
</div>

</div>

<script>

const playerId = new URLSearchParams(window.location.search).get("player")

let totals = {
games:0,
plate_appearances:0,
at_bats:0,
hits:0,
home_runs:0,
walks:0,
strikeouts:0
}

async function loadPlayer(){

if(!playerId){
document.getElementById("playerName").textContent="No player selected"
return
}

document.getElementById("meta").textContent = "Player ID: " + playerId

try{

const seasons = await fetch("./data/baseball/index.json").then(r=>r.json())

for(const season of seasons){

try{

const seasonData = await fetch(`./data/baseball/players/${season}.json`).then(r=>r.json())

const player = seasonData.find(p=>p.player_id===playerId)

if(player){

totals.games += player.games || 0
totals.plate_appearances += player.plate_appearances || 0
totals.at_bats += player.at_bats || 0
totals.hits += player.hits || 0
totals.home_runs += player.home_runs || 0
totals.walks += player.walks || 0
totals.strikeouts += player.strikeouts || 0

if(document.getElementById("playerName").textContent==="Loading..."){
document.getElementById("playerName").textContent = player.player_name || playerId
}

}

}catch(e){}

}

render()

}catch(err){
document.getElementById("batting").innerHTML="Failed to load player data."
}

}

function render(){

let html="<table><thead><tr>"

for(const stat in totals){
html+=`<th>${stat.replaceAll("_"," ").toUpperCase()}</th>`
}

html+="</tr></thead><tbody><tr>"

for(const stat in totals){
html+=`<td>${totals[stat]}</td>`
}

html+="</tr></tbody></table>"

document.getElementById("batting").innerHTML = html

}

loadPlayer()

</script>

</body>
</html>
