<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
  --soft:#f0f6ff;
}
body{font-family:Inter,system-ui,Arial;margin:0;background:var(--bg);color:var(--text);}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,var(--blue), #3a256e, var(--red));color:white;padding:30px;border-radius:20px;margin-bottom:18px;}
.hero h1{margin:0;font-size:40px;}
.section{background:var(--card);padding:20px;border-radius:18px;margin-bottom:18px;}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.card{background:var(--soft);border-radius:14px;padding:16px;text-align:center;}
.card .value{font-size:26px;font-weight:900;}
.card .label{margin-top:6px;font-size:12px;color:#555;}
select{padding:14px 16px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:16px;height:48px;margin-bottom:14px;}
table{width:100%;border-collapse:collapse;}
th{background:var(--blue);color:white;padding:10px;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f7fbff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
  <a href="/baseball-leaders.html">Leaders</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
</div>

<div class="section">
  <h2>Career</h2>
  <div class="cards" id="careerCards"></div>
</div>

<div class="section">
  <h2>By Team</h2>
  <select id="teamSelect"></select>
  <div class="cards" id="teamCards"></div>
</div>

<div class="section">
  <h2>Season Breakdown</h2>
  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>Team</th>
        <th>G</th>
        <th>PA</th>
        <th>AB</th>
        <th>H</th>
        <th>HR</th>
        <th>BB</th>
        <th>SO</th>
        <th>AVG</th>
      </tr>
    </thead>
    <tbody id="seasonBody"></tbody>
  </table>
</div>

</div>

<script>
(async function(){

function fmt(n){return Number(n||0).toLocaleString();}
function avg(h,ab){return ab?(h/ab).toFixed(3):"0.000";}

async function safeFetch(url){
  try{
    const r = await fetch(url);
    if(!r.ok) return null;
    return r.json();
  }catch{
    return null;
  }
}

const qs = new URLSearchParams(location.search);
const playerId = qs.get("player");

if(!playerId){
  document.getElementById("playerName").textContent="Player not found";
  return;
}

const playersIndex = await safeFetch("/data/baseball/players.json");
if(!playersIndex){
  document.getElementById("playerName").textContent="Players file not found";
  return;
}

const playerMeta = playersIndex.find(p=>String(p.player_id)===String(playerId));
if(!playerMeta){
  document.getElementById("playerName").textContent="Player not found";
  return;
}

document.getElementById("playerName").textContent = playerMeta.name;

/* ---- LOAD TEAM LOOKUP ---- */

const teamsData = await safeFetch("/data/baseball/teams.json");
let TEAM_LOOKUP = {};
if(teamsData){
  teamsData.forEach(t=>{
    if(Array.isArray(t.codes)){
      t.codes.forEach(code=>{
        TEAM_LOOKUP[code] = t.name;
      });
    }
  });
}

function teamName(code){
  return TEAM_LOOKUP[code] || code;
}

/* ---- LOAD SEASONS ---- */

const seasons = await safeFetch("/data/baseball/index.json");
if(!seasons) return;

let career={games:0,plate_appearances:0,at_bats:0,hits:0,home_runs:0,walks:0,strikeouts:0};
let teamAgg=new Map();
let seasonRows=[];

for(const s of seasons){

  const data=await safeFetch(`/data/baseball/players/${s}.json`);
  if(!data) continue;

  const row=data.find(p=>String(p.player_id)===String(playerId));
  if(!row) continue;

  seasonRows.push({...row,season:s});

  for(const k in career){
    career[k]+=row[k]||0;
  }

  const teamFull = teamName(row.team);

  if(!teamAgg.has(teamFull)){
    teamAgg.set(teamFull,{games:0,at_bats:0,hits:0,home_runs:0});
  }

  const t=teamAgg.get(teamFull);
  t.games+=row.games||0;
  t.at_bats+=row.at_bats||0;
  t.hits+=row.hits||0;
  t.home_runs+=row.home_runs||0;
}

/* ---- CAREER ---- */

document.getElementById("careerCards").innerHTML=`
  <div class="card"><div class="value">${fmt(career.games)}</div><div class="label">Games</div></div>
  <div class="card"><div class="value">${fmt(career.at_bats)}</div><div class="label">AB</div></div>
  <div class="card"><div class="value">${fmt(career.hits)}</div><div class="label">Hits</div></div>
  <div class="card"><div class="value">${fmt(career.home_runs)}</div><div class="label">HR</div></div>
  <div class="card"><div class="value">${avg(career.hits,career.at_bats)}</div><div class="label">AVG</div></div>
`;

/* ---- BY TEAM ---- */

const teamSelect=document.getElementById("teamSelect");
teamSelect.innerHTML=[...teamAgg.keys()].map(t=>`<option value="${t}">${t}</option>`).join("");

teamSelect.onchange=()=>{
  const t=teamAgg.get(teamSelect.value);
  if(!t) return;
  document.getElementById("teamCards").innerHTML=`
    <div class="card"><div class="value">${fmt(t.games)}</div><div class="label">Games</div></div>
    <div class="card"><div class="value">${fmt(t.at_bats)}</div><div class="label">AB</div></div>
    <div class="card"><div class="value">${fmt(t.hits)}</div><div class="label">Hits</div></div>
    <div class="card"><div class="value">${fmt(t.home_runs)}</div><div class="label">HR</div></div>
    <div class="card"><div class="value">${avg(t.hits,t.at_bats)}</div><div class="label">AVG</div></div>
  `;
};
if(teamSelect.value) teamSelect.onchange();

/* ---- SEASON TABLE ---- */

document.getElementById("seasonBody").innerHTML=seasonRows
.sort((a,b)=>b.season-a.season)
.map(r=>`
  <tr>
    <td>${r.season}</td>
    <td>${teamName(r.team)}</td>
    <td>${r.games}</td>
    <td>${r.plate_appearances}</td>
    <td>${r.at_bats}</td>
    <td>${r.hits}</td>
    <td>${r.home_runs}</td>
    <td>${r.walks}</td>
    <td>${r.strikeouts}</td>
    <td>${avg(r.hits,r.at_bats)}</td>
  </tr>
`).join("");

})();
</script>

</body>
</html>
