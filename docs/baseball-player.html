<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --soft:#f0f6ff;
}
body{font-family:Inter,system-ui,Arial;margin:0;background:var(--bg);}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1400px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,var(--blue),#3a256e,var(--red));color:white;padding:30px;border-radius:20px;margin-bottom:18px;}
.hero h1{margin:0;font-size:40px;}
.section{background:var(--card);padding:20px;border-radius:18px;margin-bottom:18px;}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.card{background:var(--soft);border-radius:14px;padding:16px;text-align:center;}
.card .value{font-size:26px;font-weight:900;}
.card .label{margin-top:6px;font-size:12px;color:#555;}
.controls{display:flex;gap:12px;margin-bottom:14px;}
select{padding:8px 12px;border-radius:8px;border:1px solid var(--line);font-weight:700;}
table{width:100%;border-collapse:collapse;}
th{background:var(--blue);color:white;padding:10px;}
td{padding:8px;border-bottom:1px solid #eee;text-align:center;}
tr:nth-child(even){background:#f7fbff;}
.postseason-row{background:#fff4e6;font-weight:700;}
</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
  <a href="/baseball-leaders.html">Leaders</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
</div>

<div class="section">
  <h2>Career</h2>
  <div class="cards" id="careerCards"></div>
</div>

<div class="section">
  <h2>Games</h2>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Team</th>
        <th>Opponent</th>
        <th>AB</th>
        <th>H</th>
        <th>HR</th>
        <th>AVG</th>
      </tr>
    </thead>
    <tbody id="gameBody"></tbody>
  </table>
</div>

</div>

<script>
(async function(){

function avg(h,ab){return ab?(h/ab).toFixed(3):"0.000";}
async function safeFetch(u){try{const r=await fetch(u);if(!r.ok)return null;return await r.json();}catch{return null;}}

const qs=new URLSearchParams(location.search);
const playerId=qs.get("player");

const players=await safeFetch("/data/baseball/players.json");
const meta=players.find(p=>p.player_id===playerId);
document.getElementById("playerName").textContent=meta?.name||"Player";

const seasons=await safeFetch("/data/baseball/index.json");

let games=[];

/* REGULAR (ROBUST FIX) */
for(const y of seasons){

  const index = await safeFetch(`/data/baseball/boxscores/${y}/index.json`);
  if(!index) continue;

  for(const gid in index){

    const file=index[gid];
    const box=await safeFetch(`/data/baseball/boxscores/${y}/${file}`);
    if(!box) continue;

    // 🔥 SUPPORT ALL POSSIBLE STRUCTURES
    const homeList = box.batters_home || box.batting_home || [];
    const awayList = box.batters_away || box.batting_away || [];

    const home = homeList.find(p=>String(p.player_id||p[0])===playerId);
    const away = awayList.find(p=>String(p.player_id||p[0])===playerId);

    if(!home && !away) continue;

    const isHome = !!home;
    const p = home || away;

    games.push({
      date: box.date,
      type:"Regular",
      team: isHome ? box.home_code : box.away_code,
      opponent: isHome ? box.away_code : box.home_code,
      AB: Number(p.AB||p[1])||0,
      H: Number(p.H||p[2])||0,
      HR: Number(p.HR||p[3])||0
    });
  }
}

/* POSTSEASON (UNCHANGED) */
const postMeta=await safeFetch("/data/baseball/postseason_meta.json");
const postBoxes=await Promise.all(
  postMeta.map(m=>safeFetch(`/data/baseball/postseason-games/${m.game_id}.json`))
);

postBoxes.forEach(box=>{
  if(!box||!box.batting)return;
  const pstats=box.batting[playerId];
  if(!pstats)return;
  games.push({
    date: box.date,
    type:"Postseason",
    team:box.home,
    opponent:box.away,
    AB:Number(pstats.AB)||0,
    H:Number(pstats.H)||0,
    HR:Number(pstats.HR)||0
  });
});

/* RENDER */
games.sort((a,b)=>new Date(b.date)-new Date(a.date));

document.getElementById("gameBody").innerHTML =
games.map(g=>`
<tr class="${g.type==='Postseason'?'postseason-row':''}">
<td>${g.date||""}</td>
<td>${g.type}</td>
<td>${g.team}</td>
<td>${g.opponent}</td>
<td>${g.AB}</td>
<td>${g.H}</td>
<td>${g.HR}</td>
<td>${avg(g.H,g.AB)}</td>
</tr>
`).join("");

})();
</script>

</body>
</html>
