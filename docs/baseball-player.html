<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
  --soft:#f0f6ff;
}
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
.hero{
  background:linear-gradient(90deg,var(--blue), #3a256e, var(--red));
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:20px;
}
.hero h1{
  margin:0;
  font-size:40px;
}
.search-wrap{
  display:flex;
  gap:10px;
  min-width:420px;
}
.search{
  width:100%;
  padding:18px 22px;
  border-radius:16px;
  border:2px solid rgba(255,255,255,0.45);
  font-size:20px;
  background:rgba(255,255,255,0.15);
  color:white;
  font-weight:600;
  height:56px;
}
.btn{
  padding:0 22px;
  border-radius:16px;
  border:2px solid rgba(255,255,255,0.45);
  background:rgba(255,255,255,0.18);
  color:white;
  font-weight:800;
  font-size:16px;
  height:56px;
  cursor:pointer;
}
.section{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}
.card{
  background:var(--soft);
  border-radius:14px;
  padding:16px;
  text-align:center;
}
.card .value{
  font-size:26px;
  font-weight:900;
}
.card .label{
  margin-top:6px;
  font-size:12px;
  color:#555;
}
select{
  padding:14px 16px;
  border-radius:12px;
  border:1px solid var(--line);
  font-weight:700;
  font-size:16px;
  height:48px;
  margin-bottom:14px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th{
  background:var(--blue);
  color:white;
  padding:10px;
}
td{
  padding:8px;
  border-bottom:1px solid #eee;
}
tr:nth-child(even){background:#f7fbff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
  <div class="search-wrap">
    <input id="playerSearch" class="search" list="playerList" placeholder="Search player name..." />
    <datalist id="playerList"></datalist>
    <button id="goBtn" class="btn">Go</button>
  </div>
</div>

<div class="section">
  <h2>Career</h2>
  <div class="cards" id="careerCards"></div>
</div>

<div class="section">
  <h2>By Team</h2>
  <select id="teamSelect"></select>
  <div class="cards" id="teamCards"></div>
</div>

<div class="section">
  <h2>Vs Opponent</h2>
  <select id="oppSelect"></select>
  <div class="cards" id="oppCards"></div>
</div>

<div class="section">
  <h2>Season Breakdown</h2>
  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>Team</th>
        <th>G</th>
        <th>PA</th>
        <th>AB</th>
        <th>H</th>
        <th>HR</th>
        <th>BB</th>
        <th>SO</th>
        <th>AVG</th>
      </tr>
    </thead>
    <tbody id="seasonBody"></tbody>
  </table>
</div>

</div>

<script>

const TEAM_NAMES = {
"ANA":"Los Angeles Angels","LAA":"Los Angeles Angels","CAL":"California Angels",

"CHW":"Chicago White Sox","CHA":"Chicago White Sox",
"CIN":"Cincinnati Reds",

"COL":"Colorado Rockies",

"HOU":"Houston Astros",
"KCA":"Kansas City Royals","KC":"Kansas City Royals",
"LAD":"Los Angeles Dodgers","LAN":"Los Angeles Dodgers",
"MIA":"Miami Marlins","FLO":"Florida Marlins",

function teamFull(code){

}

})();
</script>

</body>
</html>
