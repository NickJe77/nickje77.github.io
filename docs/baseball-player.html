<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8" />
  <title>Player | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e3e7ee;
  --soft:#eef5ff;
  --text:#111827;
  --muted:#5b6472;
}

*{box-sizing:border-box;}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:28px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:800;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
  font-size:17px;
}

.page{
  max-width:1700px;
  margin:0 auto;
  padding:24px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),#3a256e,var(--red));
  color:white;
  padding:34px 38px;
  border-radius:22px;
  margin-bottom:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.hero h1{
  margin:0;
  font-size:48px;
  line-height:1.05;
  font-weight:950;
  letter-spacing:-1px;
}

.section{
  background:var(--card);
  padding:24px;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 6px 18px rgba(15,23,42,.06);
}

.section h2{
  margin:0 0 18px;
  font-size:30px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:12px;
}

.card{
  background:var(--soft);
  border-radius:14px;
  padding:18px 12px;
  text-align:center;
}

.card .value{
  font-size:30px;
  font-weight:950;
}

.card .label{
  margin-top:7px;
  font-size:13px;
  color:var(--muted);
  font-weight:800;
  text-transform:uppercase;
}

.controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.controls select,
.controls input{
  height:44px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:0 12px;
  font-size:16px;
  font-weight:700;
  background:#fff;
}

.controls input{
  min-width:260px;
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:14px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1180px;
}

thead th{
  background:var(--blue);
  color:white;
  padding:13px 12px;
  font-size:15px;
  text-align:center;
  white-space:nowrap;
}

td{
  padding:13px 12px;
  border-bottom:1px solid #e9edf3;
  text-align:center;
  font-size:16px;
  font-weight:650;
  white-space:nowrap;
}

td.left{
  text-align:left;
}

tbody tr:nth-child(even){
  background:#f6faff;
}

tbody tr:hover{
  background:#eaf3ff;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  background:#eef2ff;
  color:#1e3a8a;
  font-weight:900;
}

.empty{
  padding:28px;
  font-size:20px;
  font-weight:900;
}

@media(max-width:1000px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }
  .hero h1{
    font-size:36px;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
  <a href="/baseball-leaders.html">Leaders</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="playerName">Loading...</h1>
  </div>

  <div class="section">
    <h2>Career</h2>
    <div class="cards" id="careerCards"></div>
  </div>

  <div class="section">

    <h2>Games</h2>

    <div class="controls">
      <select id="seasonFilter">
        <option value="">All seasons</option>
      </select>
      <select id="teamFilter">
        <option value="">All teams</option>
      </select>
      <input id="searchBox" placeholder="Search opponent..." />
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Season</th>
            <th>Team</th>
            <th>Opponent</th>
            <th>AB</th>
            <th>R</th>
            <th>H</th>
            <th>RBI</th>
            <th>HR</th>
            <th>BB</th>
            <th>SO</th>
            <th>AVG</th>
          </tr>
        </thead>
        <tbody id="gameBody"></tbody>
      </table>
    </div>

  </div>

</div>

<script>

(async function(){

const TEAM_NAMES = {
  ARI:"Arizona Diamondbacks",
  ATL:"Atlanta Braves",
  BAL:"Baltimore Orioles",
  BOS:"Boston Red Sox",
  CHC:"Chicago Cubs",
  CHN:"Chicago Cubs",
  CHW:"Chicago White Sox",
  CHA:"Chicago White Sox",
  CIN:"Cincinnati Reds",
  CLE:"Cleveland Guardians",
  COL:"Colorado Rockies",
  DET:"Detroit Tigers",
  HOU:"Houston Astros",
  KC:"Kansas City Royals",
  KCA:"Kansas City Royals",
  LAA:"Los Angeles Angels",
  ANA:"Los Angeles Angels",
  CAL:"California Angels",
  LAD:"Los Angeles Dodgers",
  LAN:"Los Angeles Dodgers",
  MIA:"Miami Marlins",
  FLO:"Florida Marlins",
  MIL:"Milwaukee Brewers",
  MLN:"Milwaukee Braves",
  MIN:"Minnesota Twins",
  NYM:"New York Mets",
  NYN:"New York Mets",
  NYY:"New York Yankees",
  NYA:"New York Yankees",
  ATH:"Athletics",
  OAK:"Athletics",
  PHA:"Philadelphia Athletics",
  PHI:"Philadelphia Phillies",
  PIT:"Pittsburgh Pirates",
  SD:"San Diego Padres",
  SDN:"San Diego Padres",
  SEA:"Seattle Mariners",
  SF:"San Francisco Giants",
  SFN:"San Francisco Giants",
  STL:"St Louis Cardinals",
  SLN:"St Louis Cardinals",
  TB:"Tampa Bay Rays",
  TBA:"Tampa Bay Rays",
  TEX:"Texas Rangers",
  TOR:"Toronto Blue Jays",
  WSH:"Washington Nationals",
  WAS:"Washington Nationals",
  MON:"Montreal Expos",
  BRO:"Brooklyn Dodgers",
  BSN:"Boston Braves",
  NY1:"New York Giants",
  SLA:"St Louis Browns",
  WS1:"Washington Senators",
  WS2:"Washington Senators",
  KC1:"Kansas City Athletics",
  SE1:"Seattle Pilots",
  BLN:"Baltimore Orioles",
};

function n(v){ return Number(v||0); }

function avg(h,ab){ return ab?(h/ab).toFixed(3):"0.000"; }

function slugify(name){
  return String(name||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\w\s-]/g,"")
    .trim()
    .replace(/\s+/g,"-");
}

function teamName(t){
  if(!t) return "";
  if(typeof t==="object") return t.name||TEAM_NAMES[t.code]||t.code||"";
  return TEAM_NAMES[t]||t;
}

async function safeFetch(url){
  try{
    const r=await fetch(url);
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

const qs=new URLSearchParams(location.search);
const rawPlayer=decodeURIComponent(qs.get("player")||"").trim();
const slug=slugify(rawPlayer);

document.getElementById("playerName").textContent=rawPlayer||"Player";

const player=await safeFetch(`/data/baseball/players/${slug}.json`);

if(!player){
  document.getElementById("careerCards").innerHTML=`<div class="empty">No player data found.</div>`;
  return;
}

document.getElementById("playerName").textContent=player.name||rawPlayer;

let games=[];
if(Array.isArray(player.games)) games=player.games.slice();

games=games.map(g=>({
  date:g.date,
  season:g.season,
  team:teamName(g.team),
  opponent:teamName(g.opponent),
  AB:n(g.AB),
  R:n(g.R),
  H:n(g.H),
  RBI:n(g.RBI),
  HR:n(g.HR),
  BB:n(g.BB),
  SO:n(g.SO)
}));

games.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));

const seasonFilter=document.getElementById("seasonFilter");
const teamFilter=document.getElementById("teamFilter");
const searchBox=document.getElementById("searchBox");

[...new Set(games.map(g=>String(g.season||"")).filter(Boolean))]
  .sort((a,b)=>Number(b)-Number(a))
  .forEach(s=>{
    const o=document.createElement("option");
    o.value=s; o.textContent=s;
    seasonFilter.appendChild(o);
  });

[...new Set(games.map(g=>g.team).filter(Boolean))]
  .sort()
  .forEach(t=>{
    const o=document.createElement("option");
    o.value=t; o.textContent=t;
    teamFilter.appendChild(o);
  });

function totalsFor(list){
  const t={games:list.length,AB:0,R:0,H:0,RBI:0,HR:0,BB:0,SO:0};
  list.forEach(g=>{
    t.AB+=n(g.AB); t.R+=n(g.R); t.H+=n(g.H);
    t.RBI+=n(g.RBI); t.HR+=n(g.HR); t.BB+=n(g.BB); t.SO+=n(g.SO);
  });
  t.AVG=avg(t.H,t.AB);
  return t;
}

function renderCards(list){
  const t=totalsFor(list);
  document.getElementById("careerCards").innerHTML=`
    <div class="card"><div class="value">${t.games}</div><div class="label">Games</div></div>
    <div class="card"><div class="value">${t.AB}</div><div class="label">AB</div></div>
    <div class="card"><div class="value">${t.R}</div><div class="label">Runs</div></div>
    <div class="card"><div class="value">${t.H}</div><div class="label">Hits</div></div>
    <div class="card"><div class="value">${t.RBI}</div><div class="label">RBI</div></div>
    <div class="card"><div class="value">${t.HR}</div><div class="label">HR</div></div>
    <div class="card"><div class="value">${t.BB}</div><div class="label">Walks</div></div>
    <div class="card"><div class="value">${t.AVG}</div><div class="label">AVG</div></div>
  `;
}

function renderTable(){
  const season=seasonFilter.value;
  const team=teamFilter.value;
  const search=searchBox.value.trim().toLowerCase();

  const filtered=games.filter(g=>{
    if(season&&String(g.season||"")!==season) return false;
    if(team&&g.team!==team) return false;
    if(search&&!g.opponent.toLowerCase().includes(search)) return false;
    return true;
  });

  renderCards(filtered);

  if(!filtered.length){
    document.getElementById("gameBody").innerHTML=`<tr><td colspan="12" class="empty">No games found.</td></tr>`;
    return;
  }

  document.getElementById("gameBody").innerHTML=filtered.map(g=>`
    <tr>
      <td>${g.date||""}</td>
      <td><span class="badge">${g.season||""}</span></td>
      <td class="left">${g.team}</td>
      <td class="left">${g.opponent}</td>
      <td>${n(g.AB)}</td>
      <td>${n(g.R)}</td>
      <td>${n(g.H)}</td>
      <td>${n(g.RBI)}</td>
      <td>${n(g.HR)}</td>
      <td>${n(g.BB)}</td>
      <td>${n(g.SO)}</td>
      <td>${avg(n(g.H),n(g.AB))}</td>
    </tr>
  `).join("");
}

seasonFilter.addEventListener("change",renderTable);
teamFilter.addEventListener("change",renderTable);
searchBox.addEventListener("input",renderTable);

renderTable();

})();
</script>

</body>
</html>
