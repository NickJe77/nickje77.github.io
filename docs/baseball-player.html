<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8" />
  <title>Player | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}

*{box-sizing:border-box;}

body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:32px 34px;border-radius:var(--radius);margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,44px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

/* ── Sections ─────────────────────────────────────────── */
.section{
  background:var(--surface);border:1px solid var(--line);padding:22px;
  border-radius:var(--radius);margin-bottom:22px;
}
.section h2{
  margin:0 0 16px;font-family:var(--display);font-weight:600;font-size:19px;
  letter-spacing:.02em;text-transform:uppercase;color:var(--ink);
}

/* ── Career cards ─────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;}
.card{
  background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:16px 10px;text-align:center;
}
.card .value{
  font-family:var(--display);font-weight:600;font-size:26px;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.card .label{
  margin-top:6px;font-size:11px;color:var(--muted);font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;
}
.card .sub{margin-top:4px;font-size:10.5px;color:var(--faint);font-weight:500;}
/* NEW: fantasy cards stand out */
.card.fp{background:var(--ink);border-color:var(--ink);}
.card.fp .value{color:#fff;}
.card.fp .label{color:rgba(255,255,255,.7);}
.card.fp .sub{color:rgba(255,255,255,.5);}

/* ── Controls ─────────────────────────────────────────── */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.controls select,
.controls input{
  height:40px;border:1px solid var(--line);border-radius:999px;padding:0 16px;
  font-family:var(--body);font-size:13px;font-weight:600;background:var(--surface);color:var(--ink);
}
.controls select{cursor:pointer;}
.controls select:hover,.controls input:hover{border-color:var(--faint);}
.controls select:focus,.controls input:focus{outline:none;border-color:var(--accent);}
.controls input{min-width:220px;}

/* ── Table ────────────────────────────────────────────── */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;min-width:1080px;}
thead th{
  background:#f7f9fb;color:var(--muted);padding:11px 12px;font-family:var(--body);
  font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  text-align:center;white-space:nowrap;border-bottom:1px solid var(--line);
}
td{
  padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;
  font-size:13.5px;color:#27313c;font-variant-numeric:tabular-nums;white-space:nowrap;
}
td.left{text-align:left;}
th.fp,td.fp{background:var(--accent-soft);}
td.fp{font-weight:700;color:var(--ink);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f0f6ff;}
tbody tr:hover td.fp{background:rgba(200,16,46,.18);}

.badge{
  display:inline-block;padding:4px 10px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;
}

.empty{padding:26px;text-align:center;font-size:14px;font-weight:600;color:var(--muted);}
.fp-note{font-size:12px;color:var(--muted);margin:14px 2px 0;line-height:1.5;}
</style>
</head>

<body>

<nav class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
  <a href="/baseball-leaders.html">Leaders</a>
</nav>

<div class="page">

  <div class="hero">
    <div class="eyebrow">Baseball</div>
    <h1 id="playerName">Loading...</h1>
  </div>

  <div class="section">
    <h2>Career</h2>
    <div class="cards" id="careerCards"></div>
  </div>

  <div class="section">

    <h2>Games</h2>

    <div class="controls">
      <select id="seasonFilter">
        <option value="">All seasons</option>
      </select>
      <select id="teamFilter">
        <option value="">All teams</option>
      </select>
      <input id="searchBox" placeholder="Search opponent..." />
    </div>

    <div class="table-wrap">
      <table>
        <thead id="gameHead"></thead>
        <tbody id="gameBody"></tbody>
      </table>
    </div>

    <div class="fp-note">
      FP = fantasy points (DraftKings hitter scoring): 1B 3 · 2B 5 · 3B 8 · HR 10 · RBI 2 · R 2 · BB 2 · HBP 2 · SB 5.
      “–” means that game doesn’t record the doubles and triples needed to score it.
    </div>

  </div>

</div>

<script>

const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
// Missed in the earlier pass across the other baseball pages -- same
// fix: without this, a CDN/browser cache can keep serving a player's
// old data indefinitely even after the underlying R2 file is corrected.
const DATA_VERSION = Date.now();
(async function(){

const TEAM_NAMES = {
  ARI:"Arizona Diamondbacks",
  ATL:"Atlanta Braves",
  BAL:"Baltimore Orioles",
  BOS:"Boston Red Sox",
  CHC:"Chicago Cubs",
  CHN:"Chicago Cubs",
  CHW:"Chicago White Sox",
  CHA:"Chicago White Sox",
  CIN:"Cincinnati Reds",
  CLE:"Cleveland Guardians",
  COL:"Colorado Rockies",
  DET:"Detroit Tigers",
  HOU:"Houston Astros",
  KC:"Kansas City Royals",
  KCA:"Kansas City Royals",
  LAA:"Los Angeles Angels",
  ANA:"Los Angeles Angels",
  CAL:"California Angels",
  LAD:"Los Angeles Dodgers",
  LAN:"Los Angeles Dodgers",
  MIA:"Miami Marlins",
  FLO:"Florida Marlins",
  MIL:"Milwaukee Brewers",
  MLN:"Milwaukee Braves",
  MIN:"Minnesota Twins",
  NYM:"New York Mets",
  NYN:"New York Mets",
  NYY:"New York Yankees",
  NYA:"New York Yankees",
  ATH:"Athletics",
  OAK:"Athletics",
  PHA:"Philadelphia Athletics",
  PHI:"Philadelphia Phillies",
  PIT:"Pittsburgh Pirates",
  SD:"San Diego Padres",
  SDN:"San Diego Padres",
  SEA:"Seattle Mariners",
  SF:"San Francisco Giants",
  SFN:"San Francisco Giants",
  STL:"St Louis Cardinals",
  SLN:"St Louis Cardinals",
  TB:"Tampa Bay Rays",
  TBA:"Tampa Bay Rays",
  TEX:"Texas Rangers",
  TOR:"Toronto Blue Jays",
  WSH:"Washington Nationals",
  WAS:"Washington Nationals",
  MON:"Montreal Expos",
  BRO:"Brooklyn Dodgers",
  BSN:"Boston Braves",
  NY1:"New York Giants",
  SLA:"St Louis Browns",
  WS1:"Washington Senators",
  WS2:"Washington Senators",
  KC1:"Kansas City Athletics",
  SE1:"Seattle Pilots",
  BLN:"Baltimore Orioles",
};

function n(v){ return Number(v||0); }

function avg(h,ab){ return ab?(h/ab).toFixed(3):"0.000"; }

function slugify(name){
  return String(name||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g,"")
    .replace(/[^\w\s-]/g,"")
    .trim()
    .replace(/\s+/g,"-");
}

function teamName(t){
  if(!t) return "";
  if(typeof t==="object") return t.name||TEAM_NAMES[t.code]||t.code||"";
  return TEAM_NAMES[t]||t;
}

async function safeFetch(url){
  try{
    const r=await fetch(url);
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

// NEW: is a stat actually recorded in this game's data (not just missing)?
const has=(g,k)=>g&&g[k]!==undefined&&g[k]!==null&&g[k]!=="";
// accept a few spellings for the extra-base / running stats
const pickKey=(g,keys)=>keys.find(k=>has(g,k));

// NEW: DraftKings hitter fantasy points — only when doubles and triples are recorded,
// otherwise singles can't be told apart from extra-base hits.
function fantasyPoints(g){
  if(!g.hasDetail) return null;
  const singles=g.H-g.D-g.T-g.HR;
  return 3*singles+5*g.D+8*g.T+10*g.HR+2*g.RBI+2*g.R+2*g.BB+2*g.HBP+5*g.SB;
}

const qs=new URLSearchParams(location.search);
const rawPlayer=decodeURIComponent(qs.get("player")||"").trim();
const slug=slugify(rawPlayer);

document.getElementById("playerName").textContent=rawPlayer||"Player";

const player=await safeFetch(`${R2}/baseball/players/${slug}.json?v=${DATA_VERSION}`);

if(!player){
  document.getElementById("careerCards").innerHTML=`<div class="empty">No player data found.</div>`;
  return;
}

document.getElementById("playerName").textContent=player.name||rawPlayer;

let games=[];
if(Array.isArray(player.games)) games=player.games.slice();

games=games.map(g=>{
  const kD=pickKey(g,["2B","D","doubles"]);
  const kT=pickKey(g,["3B","T","triples"]);
  const kSB=pickKey(g,["SB","stolenBases"]);
  const kHBP=pickKey(g,["HBP","hitByPitch"]);
  const row={
    date:g.date,
    season:g.season,
    team:teamName(g.team),
    opponent:teamName(g.opponent),
    AB:n(g.AB),
    R:n(g.R),
    H:n(g.H),
    RBI:n(g.RBI),
    HR:n(g.HR),
    BB:n(g.BB),
    SO:n(g.SO),
    D:kD?n(g[kD]):0,
    T:kT?n(g[kT]):0,
    SB:kSB?n(g[kSB]):0,
    HBP:kHBP?n(g[kHBP]):0,
    hasD:!!kD, hasSB:!!kSB,
    hasDetail:!!(kD&&kT)&&["R","RBI","HR"].every(k=>has(g,k)),
  };
  row.FP=fantasyPoints(row);
  return row;
});

games.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));

// show 2B / 3B / SB columns only if the data has them
const showXBH=games.some(g=>g.hasD);
const showSB=games.some(g=>g.hasSB);

const seasonFilter=document.getElementById("seasonFilter");
const teamFilter=document.getElementById("teamFilter");
const searchBox=document.getElementById("searchBox");

[...new Set(games.map(g=>String(g.season||"")).filter(Boolean))]
  .sort((a,b)=>Number(b)-Number(a))
  .forEach(s=>{
    const o=document.createElement("option");
    o.value=s; o.textContent=s;
    seasonFilter.appendChild(o);
  });

[...new Set(games.map(g=>g.team).filter(Boolean))]
  .sort()
  .forEach(t=>{
    const o=document.createElement("option");
    o.value=t; o.textContent=t;
    teamFilter.appendChild(o);
  });

const COLS=[
  ["AB","AB"],["R","R"],["H","H"],
  ...(showXBH?[["D","2B"],["T","3B"]]:[]),
  ["HR","HR"],["RBI","RBI"],["BB","BB"],["SO","SO"],
  ...(showSB?[["SB","SB"]]:[]),
];

document.getElementById("gameHead").innerHTML=`
  <tr>
    <th>Date</th>
    <th>Season</th>
    <th>Team</th>
    <th>Opponent</th>
    ${COLS.map(c=>`<th>${c[1]}</th>`).join("")}
    <th>AVG</th>
    <th class="fp" title="Fantasy points">FP</th>
  </tr>`;

function totalsFor(list){
  const t={games:list.length,AB:0,R:0,H:0,RBI:0,HR:0,BB:0,SO:0,FP:0,fpGames:0,bestFP:null,bestGame:null};
  list.forEach(g=>{
    t.AB+=n(g.AB); t.R+=n(g.R); t.H+=n(g.H);
    t.RBI+=n(g.RBI); t.HR+=n(g.HR); t.BB+=n(g.BB); t.SO+=n(g.SO);
    if(g.FP!=null){
      t.FP+=g.FP; t.fpGames++;
      if(t.bestFP===null||g.FP>t.bestFP){ t.bestFP=g.FP; t.bestGame=g; }
    }
  });
  t.AVG=avg(t.H,t.AB);
  return t;
}

function renderCards(list){
  const t=totalsFor(list);
  const fpCards=t.fpGames?`
    <div class="card fp"><div class="value">${t.FP.toLocaleString()}</div><div class="label">Fantasy Pts</div></div>
    <div class="card fp"><div class="value">${(t.FP/t.fpGames).toFixed(1)}</div><div class="label">Avg Fantasy</div>${t.fpGames<t.games?`<div class="sub">over ${t.fpGames} games</div>`:""}</div>
    <div class="card fp"><div class="value">${t.bestFP}</div><div class="label">Best Fantasy</div><div class="sub">${t.bestGame?`vs ${t.bestGame.opponent} ${t.bestGame.date||""}`:""}</div></div>`:"";
  document.getElementById("careerCards").innerHTML=`
    <div class="card"><div class="value">${t.games}</div><div class="label">Games</div></div>
    <div class="card"><div class="value">${t.AB}</div><div class="label">AB</div></div>
    <div class="card"><div class="value">${t.R}</div><div class="label">Runs</div></div>
    <div class="card"><div class="value">${t.H}</div><div class="label">Hits</div></div>
    <div class="card"><div class="value">${t.RBI}</div><div class="label">RBI</div></div>
    <div class="card"><div class="value">${t.HR}</div><div class="label">HR</div></div>
    <div class="card"><div class="value">${t.BB}</div><div class="label">Walks</div></div>
    <div class="card"><div class="value">${t.AVG}</div><div class="label">AVG</div></div>
    ${fpCards}
  `;
}

function renderTable(){
  const season=seasonFilter.value;
  const team=teamFilter.value;
  const search=searchBox.value.trim().toLowerCase();

  const filtered=games.filter(g=>{
    if(season&&String(g.season||"")!==season) return false;
    if(team&&g.team!==team) return false;
    if(search&&!g.opponent.toLowerCase().includes(search)) return false;
    return true;
  });

  renderCards(filtered);

  if(!filtered.length){
    document.getElementById("gameBody").innerHTML=`<tr><td colspan="${COLS.length+6}" class="empty">No games found.</td></tr>`;
    return;
  }

  document.getElementById("gameBody").innerHTML=filtered.map(g=>`
    <tr>
      <td>${g.date||""}</td>
      <td><span class="badge">${g.season||""}</span></td>
      <td class="left">${g.team}</td>
      <td class="left">${g.opponent}</td>
      ${COLS.map(c=>`<td>${n(g[c[0]])}</td>`).join("")}
      <td>${avg(n(g.H),n(g.AB))}</td>
      <td class="fp">${g.FP==null?"–":g.FP}</td>
    </tr>
  `).join("");
}

seasonFilter.addEventListener("change",renderTable);
teamFilter.addEventListener("change",renderTable);
searchBox.addEventListener("input",renderTable);

renderTable();

})();
</script>

</body>
</html>
