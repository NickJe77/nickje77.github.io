<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --soft:#f0f6ff;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{color:#0056d6;text-decoration:none;}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),#3a256e,var(--red));
  color:#fff;
  padding:28px;
  border-radius:20px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.hero h1{margin:0;font-size:36px;}

.search{
  padding:10px 14px;
  border-radius:12px;
  border:none;
  font-size:14px;
  width:220px;
}

.section{
  background:#fff;
  padding:18px;
  border-radius:18px;
  margin-bottom:18px;
}

.section-title{
  font-size:14px;
  font-weight:800;
  color:#6b7280;
  margin-bottom:14px;
  letter-spacing:1px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.summary-box{
  background:var(--soft);
  padding:16px;
  border-radius:14px;
  text-align:center;
  border:1px solid #e8efff;
}

.summary-box .value{
  font-size:28px;
  font-weight:900;
}

.summary-box .label{
  font-size:12px;
  margin-top:4px;
  color:#555;
}

.selector-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

select{
  padding:6px 10px;
  border-radius:10px;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}

th{
  background:var(--blue);
  color:#fff;
  padding:10px;
  text-align:left;
  font-size:13px;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
}

tr:nth-child(even){background:#f7fbff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading...</h1>
  <input id="playerSearch" class="search" placeholder="Search player..." />
</div>

<!-- CAREER -->
<div class="section">
  <div class="section-title">CAREER SUMMARY</div>
  <div class="summary-grid" id="careerSummary"></div>
</div>

<!-- BY TEAM -->
<div class="section">
  <div class="section-title">BY TEAM</div>

  <div class="selector-row">
    <select id="teamSelect"></select>
  </div>

  <div class="summary-grid" id="teamSummary"></div>
</div>

<!-- VS OPPONENT -->
<div class="section">
  <div class="section-title">VS SELECTED OPPONENT</div>

  <div class="selector-row">
    <select id="oppSelect"></select>
  </div>

  <div class="summary-grid" id="oppSummary"></div>
</div>

<!-- SEASON TABLE -->
<div class="section">
  <div class="section-title">SEASON BREAKDOWN</div>
  <table>
    <thead>
      <tr>
        <th>Season</th>
        <th>Team</th>
        <th>G</th>
        <th>PA</th>
        <th>AB</th>
        <th>H</th>
        <th>HR</th>
        <th>BB</th>
        <th>SO</th>
        <th>AVG</th>
      </tr>
    </thead>
    <tbody id="seasonBody"></tbody>
  </table>
</div>

</div>

<script>
const playerId = new URLSearchParams(location.search).get("player");
const seasonBody = document.getElementById("seasonBody");
const teamSelect = document.getElementById("teamSelect");
const oppSelect = document.getElementById("oppSelect");

let seasonRows=[];
let teamAgg=new Map();
let oppAgg=new Map();
let career={games:0,plate_appearances:0,at_bats:0,hits:0,home_runs:0,walks:0,strikeouts:0};

function fmt(n){return Number(n||0).toLocaleString();}
function avg(h,ab){return ab? (h/ab).toFixed(3):"0.000";}

async function loadPlayer(){
  const seasons=await fetch("./data/baseball/index.json").then(r=>r.json());

  for(const s of seasons){
    try{
      const data=await fetch(`./data/baseball/players/${s}.json`).then(r=>r.json());
      const row=data.find(p=>p.player_id===playerId);
      if(!row) continue;

      seasonRows.push({...row,season:s});

      career.games+=row.games;
      career.plate_appearances+=row.plate_appearances;
      career.at_bats+=row.at_bats;
      career.hits+=row.hits;
      career.home_runs+=row.home_runs;
      career.walks+=row.walks;
      career.strikeouts+=row.strikeouts;

      if(!teamAgg.has(row.team)) teamAgg.set(row.team,{...row});
      else{
        const t=teamAgg.get(row.team);
        t.games+=row.games;
        t.plate_appearances+=row.plate_appearances;
        t.at_bats+=row.at_bats;
        t.hits+=row.hits;
        t.home_runs+=row.home_runs;
        t.walks+=row.walks;
        t.strikeouts+=row.strikeouts;
      }

    }catch{}
  }

  renderCareer();
  renderSeasonTable();
  buildTeamSelector();
}

function renderCareer(){
  document.getElementById("careerSummary").innerHTML=`
  <div class="summary-box"><div class="value">${fmt(career.games)}</div><div class="label">Games</div></div>
  <div class="summary-box"><div class="value">${fmt(career.plate_appearances)}</div><div class="label">Plate Appearances</div></div>
  <div class="summary-box"><div class="value">${fmt(career.hits)}</div><div class="label">Hits</div></div>
  <div class="summary-box"><div class="value">${fmt(career.home_runs)}</div><div class="label">Home Runs</div></div>
  <div class="summary-box"><div class="value">${avg(career.hits,career.at_bats)}</div><div class="label">Batting Avg</div></div>
  `;
}

function renderSeasonTable(){
  seasonBody.innerHTML=seasonRows.map(r=>`
    <tr>
      <td>${r.season}</td>
      <td>${r.team}</td>
      <td>${r.games}</td>
      <td>${r.plate_appearances}</td>
      <td>${r.at_bats}</td>
      <td>${r.hits}</td>
      <td>${r.home_runs}</td>
      <td>${r.walks}</td>
      <td>${r.strikeouts}</td>
      <td>${avg(r.hits,r.at_bats)}</td>
    </tr>
  `).join("");
}

function buildTeamSelector(){
  teamSelect.innerHTML=[...teamAgg.keys()].map(t=>`<option value="${t}">${t}</option>`).join("");
  renderTeam(teamSelect.value);
  teamSelect.addEventListener("change",()=>renderTeam(teamSelect.value));
}

function renderTeam(team){
  const t=teamAgg.get(team);
  document.getElementById("teamSummary").innerHTML=`
  <div class="summary-box"><div class="value">${fmt(t.games)}</div><div class="label">Games</div></div>
  <div class="summary-box"><div class="value">${fmt(t.hits)}</div><div class="label">Hits</div></div>
  <div class="summary-box"><div class="value">${fmt(t.home_runs)}</div><div class="label">Home Runs</div></div>
  <div class="summary-box"><div class="value">${avg(t.hits,t.at_bats)}</div><div class="label">Batting Avg</div></div>
  <div class="summary-box"></div>
  `;
}

loadPlayer();
</script>

</body>
</html>
