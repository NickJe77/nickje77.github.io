<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.section{
background:white;
padding:20px;
border-radius:16px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#002D72;
color:white;
}

</style>

</head>

<body>

<div class="navbar">
<a href="/index.html">Home</a>
<a href="/baseball.html">Baseball</a>
<a href="/baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading...</h1>
<div id="playerMeta"></div>
</div>

<div class="section">
<h2>Career Totals</h2>
<table>
<thead>
<tr>
<th>Games</th>
<th>AB</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="careerTotals"></tbody>
</table>
</div>

<div class="section">
<h2>Game Log</h2>
<table>
<thead>
<tr>
<th>Date</th>
<th>Game</th>
<th>AB</th>
<th>H</th>
<th>BB</th>
<th>SO</th>
</tr>
</thead>
<tbody id="gameLog"></tbody>
</table>
</div>

</div>

<script>

let PLAYER_ID;
let PLAYER_INFO={};

function getPlayerId(){

return new URLSearchParams(window.location.search).get("player");

}

async function loadPlayerInfo(){

const res=await fetch("/data/baseball/players.json");

const players=await res.json();

players.forEach(p=>{

PLAYER_INFO[p.player_id]=p;

});

}

async function loadAllGames(){

const res=await fetch("/data/baseball/index.json");

return await res.json();

}

async function loadGame(gameId){

const season=gameId.substring(3,7);

const res=await fetch(`/data/baseball/games/${season}/${gameId}.json`);

return await res.json();

}

async function build(){

PLAYER_ID=getPlayerId();

await loadPlayerInfo();

const info=PLAYER_INFO[PLAYER_ID];

document.getElementById("playerName").textContent=info.name;

let totals={
games:0,
AB:0,
H:0,
BB:0,
SO:0
};

const gameIndex=await loadAllGames();

for(const g of gameIndex){

const game=await loadGame(g.game_id);

let found=false;
let stats=null;

if(game.batters_home){

stats=game.batters_home.find(p=>p.player_id===PLAYER_ID);

if(stats) found=true;

}

if(!found && game.batters_away){

stats=game.batters_away.find(p=>p.player_id===PLAYER_ID);

if(stats) found=true;

}

if(found){

totals.games++;

totals.AB+=stats.AB||0;
totals.H+=stats.H||0;
totals.BB+=stats.BB||0;
totals.SO+=stats.SO||0;

addGameLog(game,stats);

}

}

renderTotals(totals);

}

function renderTotals(t){

document.getElementById("careerTotals").innerHTML=`
<tr>
<td>${t.games}</td>
<td>${t.AB}</td>
<td>${t.H}</td>
<td>${t.BB}</td>
<td>${t.SO}</td>
</tr>
`;

}

function addGameLog(game,stats){

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${game.date||""}</td>
<td>
<a href="/baseball-game.html?game=${game.game_id}">
${game.away_code} @ ${game.home_code}
</a>
</td>
<td>${stats.AB||0}</td>
<td>${stats.H||0}</td>
<td>${stats.BB||0}</td>
<td>${stats.SO||0}</td>
`;

document.getElementById("gameLog").appendChild(tr);

}

build();

</script>

</body>
</html>
