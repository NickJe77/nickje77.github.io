<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
  --soft:#f0f6ff;
}

body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,var(--blue), #3a256e, var(--red));
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:20px;
}

.hero h1{
  margin:0;
  font-size:40px;
}

/* keep your sizing */
.search-wrap{
  display:flex;
  gap:10px;
  min-width:420px;
}

.search{
  width:100%;
  padding:18px 22px;
  border-radius:16px;
  border:2px solid rgba(255,255,255,0.45);
  font-size:20px;
  background:rgba(255,255,255,0.15);
  color:white;
  font-weight:600;
  height:56px;
  outline:none;
}

.btn{
  padding:0 22px;
  border-radius:16px;
  border:2px solid rgba(255,255,255,0.45);
  background:rgba(255,255,255,0.18);
  color:white;
  font-weight:800;
  font-size:16px;
  height:56px;
  cursor:pointer;
}

.section{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.card{
  background:var(--soft);
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.card .value{
  font-size:26px;
  font-weight:900;
}

.card .label{
  margin-top:6px;
  font-size:12px;
  color:#555;
}

select{
  padding:14px 16px;
  border-radius:12px;
  border:1px solid var(--line);
  font-weight:700;
  font-size:16px;
  height:48px;
  margin-bottom:14px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--blue);
  color:white;
  padding:10px;
  text-align:left;
}

td{
  padding:8px;
  border-bottom:1px solid #eee;
}

tr:nth-child(even){background:#f7fbff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="playerName">Loading...</h1>
    <div class="search-wrap">
      <input id="playerSearch" class="search" list="playerList" placeholder="Search player name..." />
      <datalist id="playerList"></datalist>
      <button id="goBtn" class="btn">Go</button>
    </div>
  </div>

  <div class="section">
    <h2>Career</h2>
    <div class="cards" id="careerCards"></div>
  </div>

  <div class="section">
    <h2>By Team</h2>
    <select id="teamSelect"></select>
    <div class="cards" id="teamCards"></div>
  </div>

  <div class="section">
    <h2>Vs Opponent</h2>
    <select id="oppSelect"></select>
    <div class="cards" id="oppCards"></div>
  </div>

  <div class="section">
    <h2>Season Breakdown</h2>
    <table>
      <thead>
        <tr>
          <th>Season</th>
          <th>Team</th>
          <th>G</th>
          <th>PA</th>
          <th>AB</th>
          <th>H</th>
          <th>HR</th>
          <th>BB</th>
          <th>SO</th>
          <th>AVG</th>
        </tr>
      </thead>
      <tbody id="seasonBody"></tbody>
    </table>
  </div>

</div>

<script>
(function(){

const qs = new URLSearchParams(location.search);
const playerId = qs.get("player");

const TEAM_NAMES = {
  // Retrosheet-style commonly used in your data
  "ANA":"Los Angeles Angels","CAL":"California Angels","LAA":"Los Angeles Angels",
  "ARI":"Arizona Diamondbacks",
  "ATL":"Atlanta Braves","BSN":"Boston Braves","MLN":"Milwaukee Braves",
  "BAL":"Baltimore Orioles","SLB":"St. Louis Browns",
  "BOS":"Boston Red Sox",
  "BRO":"Brooklyn Dodgers","LAN":"Los Angeles Dodgers","LAD":"Los Angeles Dodgers",
  "CHN":"Chicago Cubs","CHC":"Chicago Cubs",
  "CHA":"Chicago White Sox","CHW":"Chicago White Sox",
  "CIN":"Cincinnati Reds",
  "CLE":"Cleveland Guardians","CLV":"Cleveland Indians",
  "COL":"Colorado Rockies",
  "DET":"Detroit Tigers",
  "HOU":"Houston Astros",
  "KCA":"Kansas City Royals","KC":"Kansas City Royals",
  "MIA":"Miami Marlins","FLO":"Florida Marlins",
  "MIL":"Milwaukee Brewers",
  "MIN":"Minnesota Twins",
  "MON":"Montreal Expos",
  "NYA":"New York Yankees","NYY":"New York Yankees",
  "NYN":"New York Mets","NYM":"New York Mets",
  "OAK":"Oakland Athletics",
  "PHI":"Philadelphia Phillies",
  "PIT":"Pittsburgh Pirates",
  "SDN":"San Diego Padres","SD":"San Diego Padres",
  "SEA":"Seattle Mariners",
  "SFN":"San Francisco Giants","SF":"San Francisco Giants",
  "SLN":"St. Louis Cardinals","STL":"St. Louis Cardinals",
  "TBA":"Tampa Bay Rays","TB":"Tampa Bay Rays",
  "TEX":"Texas Rangers",
  "TOR":"Toronto Blue Jays",
  "WAS":"Washington Nationals","WSH":"Washington Nationals"
};

function teamFull(code){
  const c = (code==null) ? "" : String(code).trim();
  return TEAM_NAMES[c] || c;
}

function fmt(n){ return Number(n||0).toLocaleString(); }
function avg(h,ab){ return ab ? (h/ab).toFixed(3) : "0.000"; }

async function safeFetch(url){
  const r = await fetch(url);
  if(!r.ok) return null;
  return r.json();
}

let playersIndex = [];

function getPlayerIdFromObj(p){
  return p.player_id ?? p.playerId ?? p.id ?? p.bbref_id ?? p.key ?? "";
}

function getPlayerNameFromObj(p){
  return p.player_name ?? p.name ?? p.full_name ?? p.playerName ?? "";
}

/* ===== SEARCH (the tiny change) ===== */
function wireSearch(){
  const goBtn = document.getElementById("goBtn");
  const input = document.getElementById("playerSearch");

  function handleSearch(){
    const q = input.value.trim().toLowerCase();
    if(!q || !playersIndex.length) return;

    // exact match first
    let hit = playersIndex.find(p => getPlayerNameFromObj(p).toLowerCase() === q);

    // fallback: startsWith match (helps if user selects from datalist but spacing differs)
    if(!hit){
      hit = playersIndex.find(p => getPlayerNameFromObj(p).toLowerCase().startsWith(q));
    }

    if(hit){
      const id = getPlayerIdFromObj(hit);
      if(id !== "" && id != null){
        location.href = `player.html?player=${encodeURIComponent(String(id))}`;
      }
    }
  }

  goBtn.addEventListener("click", handleSearch);
  input.addEventListener("keydown", (e)=>{ if(e.key === "Enter") handleSearch(); });
}

/* ===== PAGE DATA LOGIC (unchanged/kept intact) ===== */
async function init(){
  if(!playerId){
    document.getElementById("playerName").textContent = "Player Not Found";
    return;
  }

  // Load players index (for header name + search)
  const players = await safeFetch("./data/baseball/players.json");
  if(players && Array.isArray(players)){
    playersIndex = players;

    const list = document.getElementById("playerList");
    list.innerHTML = playersIndex.map(p => {
      const n = getPlayerNameFromObj(p);
      return n ? `<option value="${n.replace(/"/g,'&quot;')}"></option>` : "";
    }).join("");

    const match = playersIndex.find(p => String(getPlayerIdFromObj(p)) === String(playerId));
    if(match){
      const name = getPlayerNameFromObj(match);
      if(name) document.getElementById("playerName").textContent = name;
    }
  }

  wireSearch();

  const seasons = await safeFetch("./data/baseball/index.json");
  if(!seasons || !Array.isArray(seasons)){
    // keep page alive even if index missing
    if(document.getElementById("playerName").textContent === "Loading..."){
      document.getElementById("playerName").textContent = "Player";
    }
    return;
  }

  let career = {games:0, plate_appearances:0, at_bats:0, hits:0, home_runs:0, walks:0, strikeouts:0};
  let teamAgg = new Map();
  let seasonRows = [];

  for(const s of seasons){
    const data = await safeFetch(`./data/baseball/players/${s}.json`);
    if(!data || !Array.isArray(data)) continue;

    const row = data.find(p => String(getPlayerIdFromObj(p)) === String(playerId));
    if(!row) continue;

    seasonRows.push({...row, season:s});

    career.games += row.games || 0;
    career.plate_appearances += row.plate_appearances || 0;
    career.at_bats += row.at_bats || 0;
    career.hits += row.hits || 0;
    career.home_runs += row.home_runs || 0;
    career.walks += row.walks || 0;
    career.strikeouts += row.strikeouts || 0;

    const code = row.team;
    if(!teamAgg.has(code)){
      teamAgg.set(code, {games:0, plate_appearances:0, at_bats:0, hits:0, home_runs:0, walks:0, strikeouts:0});
    }
    const t = teamAgg.get(code);
    t.games += row.games || 0;
    t.plate_appearances += row.plate_appearances || 0;
    t.at_bats += row.at_bats || 0;
    t.hits += row.hits || 0;
    t.home_runs += row.home_runs || 0;
    t.walks += row.walks || 0;
    t.strikeouts += row.strikeouts || 0;
  }

  // Career cards (includes AB)
  document.getElementById("careerCards").innerHTML = `
    <div class="card"><div class="value">${fmt(career.games)}</div><div class="label">Games</div></div>
    <div class="card"><div class="value">${fmt(career.at_bats)}</div><div class="label">AB</div></div>
    <div class="card"><div class="value">${fmt(career.hits)}</div><div class="label">Hits</div></div>
    <div class="card"><div class="value">${fmt(career.home_runs)}</div><div class="label">HR</div></div>
    <div class="card"><div class="value">${avg(career.hits, career.at_bats)}</div><div class="label">AVG</div></div>
  `;

  // Team selector + cards (full names)
  const teamSelect = document.getElementById("teamSelect");
  const teamKeys = [...teamAgg.keys()];
  teamSelect.innerHTML = teamKeys.map(c => `<option value="${c}">${teamFull(c)}</option>`).join("");
  teamSelect.onchange = () => {
    const t = teamAgg.get(teamSelect.value);
    if(!t) return;
    document.getElementById("teamCards").innerHTML = `
      <div class="card"><div class="value">${fmt(t.games)}</div><div class="label">Games</div></div>
      <div class="card"><div class="value">${fmt(t.at_bats)}</div><div class="label">AB</div></div>
      <div class="card"><div class="value">${fmt(t.hits)}</div><div class="label">Hits</div></div>
      <div class="card"><div class="value">${fmt(t.home_runs)}</div><div class="label">HR</div></div>
      <div class="card"><div class="value">${avg(t.hits, t.at_bats)}</div><div class="label">AVG</div></div>
    `;
  };
  if(teamKeys.length){
    teamSelect.value = teamKeys[0];
    teamSelect.onchange();
  }else{
    document.getElementById("teamCards").innerHTML = "";
  }

  // Season breakdown (full names)
  // sort newest first if numeric seasons
  seasonRows.sort((a,b)=>Number(b.season)-Number(a.season));
  document.getElementById("seasonBody").innerHTML = seasonRows.map(r => `
    <tr>
      <td>${r.season}</td>
      <td>${teamFull(r.team)}</td>
      <td>${r.games||0}</td>
      <td>${r.plate_appearances||0}</td>
      <td>${r.at_bats||0}</td>
      <td>${r.hits||0}</td>
      <td>${r.home_runs||0}</td>
      <td>${r.walks||0}</td>
      <td>${r.strikeouts||0}</td>
      <td>${avg(r.hits||0, r.at_bats||0)}</td>
    </tr>
  `).join("");

  // Opponents (full names + AB)
  const oppData = await safeFetch(`./data/baseball/opponents/${playerId}.json`);
  const oppSelect = document.getElementById("oppSelect");
  if(oppData && Array.isArray(oppData) && oppData.length){
    oppSelect.innerHTML = oppData.map(o => `<option value="${o.opponent}">${teamFull(o.opponent)}</option>`).join("");
    oppSelect.onchange = () => {
      const d = oppData.find(o => o.opponent === oppSelect.value);
      if(!d) return;
      document.getElementById("oppCards").innerHTML = `
        <div class="card"><div class="value">${fmt(d.games)}</div><div class="label">Games</div></div>
        <div class="card"><div class="value">${fmt(d.at_bats)}</div><div class="label">AB</div></div>
        <div class="card"><div class="value">${fmt(d.hits)}</div><div class="label">Hits</div></div>
        <div class="card"><div class="value">${fmt(d.home_runs)}</div><div class="label">HR</div></div>
        <div class="card"><div class="value">${avg(d.hits||0, d.at_bats||0)}</div><div class="label">AVG</div></div>
      `;
    };
    oppSelect.value = oppData[0].opponent;
    oppSelect.onchange();
  }else{
    oppSelect.innerHTML = `<option value="">No opponent data</option>`;
    document.getElementById("oppCards").innerHTML = "";
  }
}

init();

})();
</script>

</body>
</html>
