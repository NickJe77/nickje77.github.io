<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Supercars Driver | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#eceff3;
      --surface:#ffffff;
      --ink:#0f141a;
      --muted:#69727c;
      --faint:#9aa3ad;
      --line:#e3e8ee;
      --board:#0c130f;
      --board-2:#161f16;
      --accent:#c99a3d;
      --accent-soft:rgba(201,154,61,.16);
      --win-bg:#e6f4ea;
      --win-text:#1e7a3d;
      --display:'Oswald',system-ui,sans-serif;
      --body:'Inter',system-ui,sans-serif;
      --radius:16px;
    }
    *{box-sizing:border-box;}
    body{
      font-family:var(--body);
      margin:0;
      background:var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
    }
    .navbar{
      display:flex;
      justify-content:center;
      gap:22px;
      padding:15px 0;
      background:var(--surface);
      border-bottom:1px solid var(--line);
      font-weight:600;
      font-size:13.5px;
    }
    .navbar a{
      text-decoration:none;
      color:var(--ink);
      opacity:.7;
      transition:opacity .15s,color .15s;
    }
    .navbar a:hover,.navbar a[aria-current="page"]{
      opacity:1;
      color:var(--accent);
    }
    .container{
      max-width:1000px;
      margin:0 auto;
      padding:26px 20px 70px;
    }

    .hero{
      position:relative;
      background:linear-gradient(160deg,var(--board-2),var(--board));
      color:#fff;
      padding:32px 34px;
      border-radius:var(--radius);
      margin-bottom:22px;
      text-align:center;
      box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
    }
    .hero .eyebrow{
      font-family:var(--body);
      font-size:11.5px;
      font-weight:600;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--accent);
      margin-bottom:10px;
    }
    .hero h1{
      margin:0;
      font-family:var(--display);
      font-weight:600;
      font-size:clamp(26px,5vw,40px);
      letter-spacing:.01em;
      text-transform:uppercase;
      color:#fff;
    }

    .summary{
      display:flex;
      justify-content:center;
      gap:14px;
      margin-bottom:22px;
      flex-wrap:wrap;
    }
    .summary div{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px 28px;
      text-align:center;
      font-weight:600;
      color:var(--muted);
      font-size:13px;
    }
    .summary span{
      display:block;
      font-family:var(--display);
      font-weight:600;
      font-size:26px;
      color:var(--ink);
      margin-top:4px;
      font-variant-numeric:tabular-nums;
    }

    .table-wrap{
      overflow-x:auto;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
    }
    table{
      width:100%;
      border-collapse:collapse;
    }
    th, td{
      padding:11px 14px;
      text-align:left;
      font-size:13.5px;
      border-bottom:1px solid var(--line);
      white-space:nowrap;
    }
    th{
      background:#f7f9fb;
      color:var(--muted);
      font-family:var(--body);
      font-weight:600;
      font-size:11px;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    td{
      color:#27313c;
      font-variant-numeric:tabular-nums;
    }
    td:first-child{
      font-weight:700;
      color:var(--ink);
    }
    tbody tr{ cursor:pointer; }
    tbody tr:last-child td{ border-bottom:none; }
    tbody tr:hover td{ background:#f9fbfd; }
    .win td{
      background:var(--win-bg) !important;
      font-weight:600;
      color:var(--win-text);
    }
    .win td:first-child{ color:var(--win-text); }

    .loading{
      text-align:center;
      color:var(--muted);
      font-style:italic;
      padding:20px;
    }
  </style>
</head>
<body>
<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./supercars.html">Supercars</a>
</div>
<div class="container">
  <div class="hero">
    <div class="eyebrow">V8 Supercars</div>
    <h1 id="name">Loading...</h1>
  </div>
  <div class="summary">
    <div>Starts<span id="starts">0</span></div>
    <div>Wins<span id="wins">0</span></div>
  </div>
  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Event</th>
        <th>Race</th>
        <th>Finish</th>
        <th>Car #</th>
      </tr>
    </thead>
    <tbody id="table">
      <tr><td colspan="5" class="loading">Loading...</td></tr>
    </tbody>
  </table>
  </div>
</div>
<script>
// -------------------------
// GET DRIVER FROM URL
// -------------------------
const params = new URLSearchParams(window.location.search);
const slug = params.get("driver") || "";
function deslug(s){
  return s
    .split("-")
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(" ");
}
const driverNameGuess = deslug(slug);
document.getElementById("name").innerText = driverNameGuess || "Driver";

// -------------------------
// LOAD PRE-BUILT DRIVER INDEX
// -------------------------
// Unlike Bathurst's driver page (which fetches every season file and
// filters client-side -- fine for ~60 one-race seasons), Supercars has
// thousands of races across 29 years, so re-fetching everything per
// driver lookup would be far too slow/heavy. This instead expects a
// single pre-built /data/supercars/drivers.json with each driver's race
// history already embedded:
//   [{ "name": "Craig Lowndes", "starts": 612, "wins": 106,
//      "races": [{ "year":2026, "event_name":"...", "race_label":"R2", "finishing_position":"1", "car_number":"88", "url":"..." }, ...] }, ...]
// Generate this with build_supercars_index.py.
fetch("/data/supercars/drivers.json")
  .then(res => res.json())
  .then(drivers => {
    const match = drivers.find(
      d => d.name.toLowerCase().trim() === driverNameGuess.toLowerCase().trim()
    );

    if(!match){
      document.getElementById("name").innerText = driverNameGuess || "Driver not found";
      document.getElementById("table").innerHTML =
        '<tr><td colspan="5" class="loading">No results found for this driver.</td></tr>';
      return;
    }

    document.getElementById("name").innerText = match.name;
    document.getElementById("starts").innerText = match.starts;
    document.getElementById("wins").innerText = match.wins;

    const tbody = document.getElementById("table");
    tbody.innerHTML = "";

    const races = (match.races || []).slice().sort((a,b) => {
      if(b.year !== a.year) return b.year - a.year;
      return String(a.event_name || "").localeCompare(String(b.event_name || ""));
    });

    races.forEach(r => {
      const tr = document.createElement("tr");
      if(String(r.finishing_position) === "1"){
        tr.classList.add("win");
      }
      tr.innerHTML = `
        <td>${r.year}</td>
        <td>${r.event_name || ""}</td>
        <td>${r.race_label || ""}</td>
        <td>${r.finishing_position || ""}</td>
        <td>${r.car_number || ""}</td>
      `;
      tr.onclick = () => {
        window.location.href = `./supercars-race.html?year=${r.year}&url=${encodeURIComponent(r.url)}`;
      };
      tbody.appendChild(tr);
    });
  })
  .catch(err => {
    document.getElementById("name").innerText = "Error loading driver";
    console.error(err);
  });
</script>
</body>
</html>
