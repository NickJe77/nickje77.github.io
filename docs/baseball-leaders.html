<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Baseball Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}

.page{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:36px 20px;text-align:center;border-radius:var(--radius);margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4.5vw,40px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

/* ── Controls ─────────────────────────────────────────── */
.controls{background:var(--surface);border:1px solid var(--line);padding:16px;border-radius:var(--radius);margin-bottom:26px;display:flex;justify-content:center;}
.controls select{
  font-family:var(--body);font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;
  border:1px solid var(--line);min-width:160px;cursor:pointer;background:var(--surface);color:var(--ink);
}
.controls select:hover{border-color:var(--faint);}

.sectionTitle{
  font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.01em;text-transform:uppercase;
  margin:30px 0 12px;text-align:center;color:var(--ink);
}

table{
  width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;margin-bottom:26px;
}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:center;font-size:13.5px;}
th{
  background:#f7f9fb;color:var(--muted);font-family:var(--body);font-weight:600;font-size:11px;
  letter-spacing:.04em;text-transform:uppercase;
}
td{color:#27313c;font-variant-numeric:tabular-nums;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f0f6ff;}
.playerLink{color:var(--ink);font-weight:700;cursor:pointer;}
.playerLink:hover{color:var(--accent);text-decoration:underline;}
.loading{text-align:center;padding:40px;font-size:14px;font-weight:600;color:var(--muted);}
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-seasons.html">Seasons</a>
  <a href="baseball-players.html">Players</a>
  <a href="baseball-standings.html">Standings</a>
  <a href="baseball-leaders.html">Leaders</a>
</nav>

<div class="page">

  <div class="hero">
    <div class="eyebrow">Baseball</div>
    <h1>Yearly Leaders</h1>
  </div>

  <div class="controls">
    <select id="yearSel"></select>
  </div>

  <div id="leadersContainer"><div class="loading">Loading...</div></div>

</div>

<script>

async function init(){
  const years = await fetch("data/baseball/index.json").then(r=>r.json());
  years.sort((a,b)=>b-a);

  const sel = document.getElementById("yearSel");
  sel.innerHTML = years.map(y=>`<option>${y}</option>`).join("");
  sel.onchange = ()=> loadYear(parseInt(sel.value));
  loadYear(years[0]);
}

async function loadYear(year){
  document.getElementById("leadersContainer").innerHTML = '<div class="loading">Loading...</div>';
  try {
    const players = await fetch(`data/baseball/seasons/${year}.json`).then(r=>r.json());
    renderLeaders(players);
  } catch(e) {
    document.getElementById("leadersContainer").innerHTML = '<div class="loading">No data for this season.</div>';
  }
}

function renderLeaders(players){
  const container = document.getElementById("leadersContainer");
  container.innerHTML = "";

  const maxGames = Math.max(...players.map(p=>p.games||0));
  const minAB = Math.ceil(maxGames * 3.1);

  function makeTable(title, data, statLabel){
    if(!data.length) return;
    let html = `<div class="sectionTitle">${title}</div><table><thead><tr><th>Rank</th><th>Player</th><th>Team</th><th>${statLabel}</th></tr></thead><tbody>`;
    data.forEach((p,i)=>{
      html += `<tr>
        <td>${i+1}</td>
        <td class="playerLink" onclick="location.href='baseball-player.html?player=${encodeURIComponent(p.player_id)}'">${p.player_name}</td>
        <td>${p.team||""}</td>
        <td>${p.display}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML += html;
  }

  function top(arr, valueFn, filterFn, n=10){
    let list = filterFn ? arr.filter(filterFn) : [...arr];
    list = list.map(p=>({...p, ...valueFn(p)}));
    list.sort((a,b)=>b.sortVal - a.sortVal);
    return list.slice(0,n);
  }

  // Batting Average
  makeTable("Batting Average", top(players,
    p=>{ const avg=p.AB ? p.H/p.AB : 0; return {sortVal:avg, display:avg.toFixed(3)}; },
    p=>p.AB>=minAB
  ), "AVG");

  // Home Runs
  makeTable("Home Runs", top(players,
    p=>({sortVal:p.HR||0, display:p.HR||0})
  ), "HR");

  // RBI
  makeTable("RBI", top(players,
    p=>({sortVal:p.RBI||0, display:p.RBI||0})
  ), "RBI");

  // Hits
  makeTable("Hits", top(players,
    p=>({sortVal:p.H||0, display:p.H||0})
  ), "H");

  // Walks
  makeTable("Walks", top(players,
    p=>({sortVal:p.BB||0, display:p.BB||0})
  ), "BB");

  // Strikeouts (batting)
  makeTable("Strikeouts", top(players,
    p=>({sortVal:p.SO||0, display:p.SO||0})
  ), "SO");

  // Runs
  makeTable("Runs", top(players,
    p=>({sortVal:p.R||0, display:p.R||0})
  ), "R");
}

init();

</script>

</body>
</html>
