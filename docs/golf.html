<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}

.page{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.filters{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

select,input{
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:10px;
  overflow:hidden;
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  background:#f0f3f7;
}

tr:nth-child(even){
  background:#f9fbff;
}

a{
  color:#0056d6;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
</div>

<div class="page">

  <h1>PGA Tour Winners</h1>

  <div class="filters">
    <select id="yearFilter">
      <option value="all">All Years</option>
    </select>

    <input 
      id="tournamentSearch" 
      placeholder="Search tournament..."
      list="tournamentList"
    >
    <datalist id="tournamentList"></datalist>
  </div>

  <table>
    <thead>
      <tr>
        <th>Year</th>
        <th>Tournament</th>
        <th>Winner</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

</div>

<script>
let data=[];
let players=[];

/* PLAYER CLEAN */
function cleanPlayerName(name){
  if(!name) return "";
  return name
    .replace(/\./g,". ")
    .replace(/\s+/g," ")
    .replace(/\b([a-z])/g,l=>l.toUpperCase())
    .replace(/\s*\(.*?\)/g,"")
    .replace(/\*/g,"")
    .trim();
}

/* TOURNAMENT CLEAN */
function cleanTournament(name){
  if(!name) return "";
  return name
    .replace(/Augusta National.*$/i,"")
    .replace(/ - .*$/i,"")
    .trim();
}

async function load(){
  const res=await fetch("/data/golf/pga_winners.json");
  data=await res.json();

  data.sort((a,b)=>b.year-a.year);

  players=[...new Set(
    data.map(d=>cleanPlayerName(d.winner))
      .filter(n=>n && n!=="TBD")
  )].sort();

  populateFilters();
  render();
}

function populateFilters(){
  const years=[...new Set(data.map(d=>d.year))].sort((a,b)=>b-a);
  const tournaments=[...new Set(data.map(d=>cleanTournament(d.event)))].sort();

  const yearSelect=document.getElementById("yearFilter");
  const list=document.getElementById("tournamentList");

  if(!yearSelect || !list) return;

  years.forEach(y=>{
    const o=document.createElement("option");
    o.value=y;
    o.textContent=y;
    yearSelect.appendChild(o);
  });

  tournaments.forEach(t=>{
    const o=document.createElement("option");
    o.value=t;
    list.appendChild(o);
  });
}

function render(){
  const yearEl=document.getElementById("yearFilter");
  const searchEl=document.getElementById("tournamentSearch");

  if(!yearEl || !searchEl) return;

  const year=yearEl.value;
  const search=searchEl.value.toLowerCase();

  const seen=new Set();

  let filtered=data.filter(d=>{
    const event=cleanTournament(d.event||"");
    const key=d.year+"|"+event.toLowerCase();

    if(seen.has(key)) return false;
    seen.add(key);

    return (year==="all" || d.year==year) &&
           (!search || event.toLowerCase().includes(search));
  });

  draw(filtered);
}

function draw(rows){
  const tbody=document.getElementById("tableBody");
  if(!tbody) return;

  tbody.innerHTML="";

  rows.forEach(r=>{
    const event=cleanTournament(r.event);
    const winner=cleanPlayerName(r.winner);

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${r.year}</td>
      <td>
        <a href="/golf-tournament.html?tournament=${encodeURIComponent(event)}">
          ${event}
        </a>
      </td>
      <td>
        ${winner
          ? `<a href="/golf-player.html?player=${encodeURIComponent(winner)}">${winner}</a>`
          : '<span style="color:#999;">TBD</span>'}
      </td>
    `;

    tbody.appendChild(tr);
  });
}

/* FIX: WAIT FOR DOM */
document.addEventListener("DOMContentLoaded", () => {

  const yearEl=document.getElementById("yearFilter");
  const searchEl=document.getElementById("tournamentSearch");

  if(yearEl) yearEl.addEventListener("change",render);
  if(searchEl) searchEl.addEventListener("input",render);

  load();

});
</script>

</body>
</html>
