<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#0c6f3c;
  --green-dark:#08552d;
  --gold:#d9b44a;
  --blue:#0056d6;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e3e7eb;
  --text:#1f2937;
  --muted:#6b7280;
  --zebra:#f3f8f4;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:var(--blue);
  text-decoration:none;
  font-size:18px;
}

/* HERO WITH IMAGE */
.hero{
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;

  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("/images/golf-hero.jpg");

  background-size:cover;
  background-position:center;
  border-bottom:4px solid var(--gold);
}

.hero h1{
  margin:0;
  font-size:52px;
  letter-spacing:1px;
}

.hero p{
  margin-top:8px;
  font-size:16px;
  opacity:.9;
}

/* PAGE */
.page{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

/* FILTER CARD */
.controls-card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
  border:1px solid var(--line);
}

.controls-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.controls-title{
  font-size:22px;
  font-weight:700;
  color:var(--green-dark);
}

.result-count{
  font-size:14px;
  color:var(--muted);
  font-weight:600;
}

.controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

select,input{
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}

/* TABLE */
.table-card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--line);
}

.table-header{
  padding:16px;
  font-weight:700;
  color:var(--green-dark);
  border-bottom:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:var(--green);
  color:#fff;
}

th,td{
  padding:12px 14px;
  font-size:14px;
  text-align:left;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}

tbody tr:hover{
  background:#e3efe7;
}

/* COLUMN WIDTHS */
.col-year{
  width:90px;
  font-weight:700;
}

.col-tournament{
  width:55%;
}

.col-winner{
  width:30%;
}

/* LINKS */
.tournament-link{
  color:var(--blue);
  font-weight:600;
  text-decoration:none;
}

.tournament-link:hover{
  text-decoration:underline;
}

.player-link{
  color:#111;
  font-weight:600;
  text-decoration:none;
}

.player-link:hover{
  text-decoration:underline;
  color:var(--blue);
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/golf-majors.html">Majors</a>
  <a href="/golf-player.html">Players</a>
  <a href="/nba.html">NBA</a>
  <a href="/baseball.html">Baseball</a>
</div>

<div class="hero">
  <div>
    <h1>Golf</h1>
    <p>PGA Tour tournament winners</p>
  </div>
</div>

<div class="page">

<div class="controls-card">
  <div class="controls-top">
    <div class="controls-title">Tournament Winners</div>
    <div class="result-count" id="count">Loading...</div>
  </div>

  <div class="controls">
    <select id="yearFilter">
      <option value="all">All Years</option>
    </select>

    <input 
      type="text" 
      id="tournamentSearch" 
      list="tournamentList"
      placeholder="Search tournament"
    >
    <datalist id="tournamentList"></datalist>
  </div>
</div>

<div class="table-card">
  <div class="table-header">PGA Results</div>

  <table>
    <thead>
      <tr>
        <th class="col-year">Year</th>
        <th class="col-tournament">Tournament</th>
        <th class="col-winner">Winner</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

</div>

<script>
let data=[];

async function load(){
  const res=await fetch("/data/golf/pga_winners.json");
  data=await res.json();

  data.sort((a,b)=>b.year-a.year);

  populateFilters();
  render();
}

function populateFilters(){
  const years=[...new Set(data.map(d=>d.year))].sort((a,b)=>b-a);
  const tournaments=[...new Set(data.map(d=>d.event))].sort();

  const yearSelect=document.getElementById("yearFilter");
  const list=document.getElementById("tournamentList");

  years.forEach(y=>{
    const o=document.createElement("option");
    o.value=y;
    o.textContent=y;
    yearSelect.appendChild(o);
  });

  tournaments.forEach(t=>{
    const o=document.createElement("option");
    o.value=t;
    list.appendChild(o);
  });
}

function render(){
  const year=document.getElementById("yearFilter").value;
  const search=document.getElementById("tournamentSearch").value.toLowerCase();

  let filtered=data
    .filter(d=>{
      return (year==="all" || d.year==year) &&
             (!search || d.event.toLowerCase().includes(search));
    })
    .filter(d=>{
      const w=(d.winner||"").toLowerCase();
      return !w.includes("cancel");
    });

  draw(filtered);

  document.getElementById("count").textContent = filtered.length+" tournaments";
}

function draw(rows){
  const tbody=document.getElementById("tableBody");
  tbody.innerHTML="";

  rows.forEach(r=>{
    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td class="col-year">${r.year}</td>
      <td class="col-tournament">
        <a class="tournament-link" href="/golf-tournament.html?tournament=${encodeURIComponent(r.event)}">
          ${r.event}
        </a>
      </td>
      <td class="col-winner">
        <a class="player-link" href="/golf-player.html?player=${encodeURIComponent(r.winner)}">
          ${r.winner}
        </a>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

document.getElementById("yearFilter").addEventListener("change",render);
document.getElementById("tournamentSearch").addEventListener("input",render);

load();
</script>

</body>
</html>
