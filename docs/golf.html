<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf Tournament | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui;
margin:0;
background:#f4f6f8;
}

/* NAV */
.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
}
.navbar a{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

/* HERO */
.hero{
background:linear-gradient(90deg,#0f6b3f,#198754);
color:white;
padding:40px;
text-align:center;
}
.hero h1{
margin:0;
font-size:36px;
}

/* PAGE */
.page{
max-width:1000px;
margin:auto;
padding:30px;
}

/* TABLE */
.table-wrap{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 6px 18px rgba(0,0,0,0.06);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#0f6b3f;
color:white;
}

tr:nth-child(even){
background:#f6faf7;
}

</style>
</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/golf.html">Golf</a>
<a href="/golf-majors.html">Majors</a>
<a href="/golf-players.html">Players</a>
</div>

<div class="hero">
<h1 id="title">Loading...</h1>
</div>

<div class="page">

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Year</th>
<th>Winner</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>

/* GET URL PARAM */
function getParam(name){
const url=new URL(window.location.href);
return url.searchParams.get(name);
}

/* NORMALISE STRING */
function clean(str){
return (str||"")
.toLowerCase()
.replace(/\s+/g," ")
.trim();
}

async function load(){

const tournamentParam=getParam("tournament");

if(!tournamentParam){
document.getElementById("title").textContent="Tournament not found";
return;
}

const decoded=decodeURIComponent(tournamentParam);

const res=await fetch("/data/golf/pga_winners.json");
const data=await res.json();

/* MATCH PROPERLY */
const rows=data.filter(d=>clean(d.event)===clean(decoded));

if(rows.length===0){
document.getElementById("title").textContent="Tournament not found";
return;
}

/* SORT */
rows.sort((a,b)=>b.year-a.year);

/* SET TITLE */
document.getElementById("title").textContent=rows[0].event;

/* DRAW TABLE */
const tbody=document.getElementById("tableBody");
tbody.innerHTML="";

rows.forEach(r=>{
const tr=document.createElement("tr");

tr.innerHTML=`
<td>${r.year}</td>
<td>
<a href="/golf-player.html?player=${encodeURIComponent(r.winner)}">
${r.winner}
</a>
</td>
`;

tbody.appendChild(tr);
});

}

load();

</script>

</body>
</html>
