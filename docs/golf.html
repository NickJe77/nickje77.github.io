<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Golf | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --green:#0b6b3a;
  --bg:#f4f6f8;
  --card:#ffffff;
  --zebra:#f2f6ff;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

/* HERO */
.hero{
  position:relative;
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  text-align:center;
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("https://images.unsplash.com/photo-1599058917212-d750089bc07b?q=80&w=1400");
  background-size:cover;
  background-position:center;
}

.hero h1{
  font-size:42px;
  margin:0;
}

/* PAGE */
.page{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

/* TOGGLE */
.toggle{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.toggle button{
  padding:8px 14px;
  border:none;
  border-radius:20px;
  background:#ddd;
  cursor:pointer;
  font-weight:600;
}

.toggle button.active{
  background:var(--green);
  color:#fff;
}

/* FILTERS */
.filters{
  display:flex;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.filters input,
.filters select{
  padding:8px 10px;
  font-size:14px;
  border:1px solid #ccc;
  border-radius:6px;
}

/* TABLE */
.table-card{
  background:var(--card);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:#f0f2f5;
}

th, td{
  padding:10px;
  font-size:14px;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}

.tournament{
  color:#0056d6;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/majors.html">Majors</a>
  <a href="/players.html">Players</a>
  <a href="/nba.html">NBA</a>
  <a href="/baseball.html">Baseball</a>
</div>

<div class="hero">
  <h1>Golf</h1>
</div>

<div class="page">

<div class="toggle">
  <button class="active" id="allBtn">All Results</button>
  <button id="tournamentBtn">By Tournament</button>
</div>

<div class="filters">
  <input type="text" id="search" placeholder="Search tournament or winner">
  
  <select id="yearFilter">
    <option value="all">All Years</option>
  </select>
</div>

<div class="table-card">
<table>
<thead>
<tr>
  <th>Year</th>
  <th>Date</th>
  <th>Tournament</th>
  <th>Winner</th>
  <th>Score</th>
  <th>Venue</th>
  <th>Country</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>
let data = [];
let mode = "all";

async function loadData(){
  const res = await fetch("/data/golf/pga_winners.json");
  data = await res.json();

  populateYearFilter();
  renderTable(data);
}

function populateYearFilter(){
  const years = [...new Set(data.map(d => d.year))].sort((a,b)=>b-a);
  const select = document.getElementById("yearFilter");

  years.forEach(y=>{
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    select.appendChild(opt);
  });
}

function renderTable(rows){
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  rows.forEach(r=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${r.year}</td>
      <td>${r.date || ""}</td>
      <td class="tournament">${r.event}</td>
      <td>${r.winner}</td>
      <td>${r.score || ""}</td>
      <td>${r.venue || ""}</td>
      <td>${r.country || ""}</td>
    `;

    tbody.appendChild(tr);
  });
}

function applyFilters(){
  let filtered = [...data];

  const search = document.getElementById("search").value.toLowerCase();
  const year = document.getElementById("yearFilter").value;

  if(search){
    filtered = filtered.filter(d =>
      (d.event || "").toLowerCase().includes(search) ||
      (d.winner || "").toLowerCase().includes(search)
    );
  }

  if(year !== "all"){
    filtered = filtered.filter(d => d.year == year);
  }

  renderTable(filtered);
}

/* TOGGLE */
document.getElementById("allBtn").onclick = () => {
  mode = "all";
  document.getElementById("allBtn").classList.add("active");
  document.getElementById("tournamentBtn").classList.remove("active");
  renderTable(data);
};

document.getElementById("tournamentBtn").onclick = () => {
  mode = "tournament";

  document.getElementById("tournamentBtn").classList.add("active");
  document.getElementById("allBtn").classList.remove("active");

  const grouped = {};
  data.forEach(d=>{
    if(!grouped[d.event]) grouped[d.event] = d;
  });

  renderTable(Object.values(grouped));
};

document.getElementById("search").addEventListener("input", applyFilters);
document.getElementById("yearFilter").addEventListener("change", applyFilters);

loadData();
</script>

</body>
</html>
