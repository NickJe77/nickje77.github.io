<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#0c6f3c;
  --green-dark:#08552d;
  --gold:#d9b44a;
  --blue:#0056d6;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e3e7eb;
  --text:#1f2937;
  --muted:#6b7280;
  --zebra:#f3f8f4;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:var(--blue);
  text-decoration:none;
  font-size:18px;
}

.hero{
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("/images/golf-hero.jpg");
  background-size:cover;
  background-position:center;
  border-bottom:4px solid var(--gold);
}

.hero h1{
  margin:0;
  font-size:52px;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

.controls-card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
  border:1px solid var(--line);
}

.controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

select,input{
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}

.autocomplete{ position:relative; }

.suggestions{
  position:absolute;
  top:40px;
  left:0;
  right:0;
  background:#fff;
  border:1px solid #ccc;
  border-radius:8px;
  max-height:220px;
  overflow-y:auto;
  display:none;
  z-index:10;
}

.suggestions div{
  padding:10px;
  cursor:pointer;
}

.suggestions div:hover{ background:#eee; }

.table-card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--line);
}

thead{
  background:var(--green);
  color:#fff;
}

th,td{
  padding:12px;
  font-size:14px;
  text-align:left;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}

.col-year{width:90px;font-weight:700;}
.col-tournament{width:55%;}
.col-winner{width:30%;}

.tournament-link{
  color:var(--blue);
  font-weight:600;
  text-decoration:none;
}

.player-link{
  color:#111;
  font-weight:600;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/golf-majors.html">Majors</a>
  <a href="/golf-player.html">Players</a>
</div>

<div class="hero">
  <h1>Golf</h1>
</div>

<div class="page">

<div class="controls-card">
  <div class="controls">

    <select id="yearFilter">
      <option value="all">All Years</option>
    </select>

    <input type="text" id="tournamentSearch" list="tournamentList" placeholder="Search tournament">
    <datalist id="tournamentList"></datalist>

    <div class="autocomplete">
      <input type="text" id="playerSearch" placeholder="Search player">
      <div id="playerSuggestions" class="suggestions"></div>
    </div>

  </div>
</div>

<div class="table-card">
<table>
<thead>
<tr>
  <th class="col-year">Year</th>
  <th class="col-tournament">Tournament</th>
  <th class="col-winner">Winner</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>
let data=[];
let players=[];

async function load(){
  const res=await fetch("/data/golf/pga_winners.json");
  data=await res.json();

  data.sort((a,b)=>b.year-a.year);

  players=[...new Set(data.map(d=>d.winner).filter(Boolean))].sort();

  populateFilters();
  render();
}

function populateFilters(){
  const years=[...new Set(data.map(d=>d.year))].sort((a,b)=>b-a);
  const tournaments=[...new Set(data.map(d=>d.event))].sort();

  const yearSelect=document.getElementById("yearFilter");
  const list=document.getElementById("tournamentList");

  years.forEach(y=>{
    const o=document.createElement("option");
    o.value=y;
    o.textContent=y;
    yearSelect.appendChild(o);
  });

  tournaments.forEach(t=>{
    const o=document.createElement("option");
    o.value=t;
    list.appendChild(o);
  });
}

function render(){
  const year=document.getElementById("yearFilter").value;
  const search=document.getElementById("tournamentSearch").value.toLowerCase();

  let filtered=data
    .filter(d=>{
      return (year==="all" || d.year==year) &&
             (!search || (d.event||"").toLowerCase().includes(search));
    })
    .filter(d=>{
      const w=(d.winner||"").toLowerCase();
      return !w.includes("cancel");
    });

  draw(filtered);
}

function draw(rows){
  const tbody=document.getElementById("tableBody");
  tbody.innerHTML="";

  rows.forEach(r=>{

    let event = r.event || "";

    if(event.includes("Golf Club") && event.includes(" - ")){
      event = event.split("Golf Club")[0] + "Golf Club";
    }

    if(!event && r.major){
      event = r.major;
    }

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td class="col-year">${r.year}</td>
      <td class="col-tournament">
        <a class="tournament-link" href="/golf-tournament.html?tournament=${encodeURIComponent(event)}">
          ${event}
        </a>
      </td>
      <td class="col-winner">
        ${r.winner 
          ? `<a class="player-link" href="/golf-player.html?player=${encodeURIComponent(r.winner)}">${r.winner}</a>` 
          : '<span style="color:#999;">TBD</span>'}
      </td>
    `;

    tbody.appendChild(tr);
  });
}

/* PLAYER AUTOCOMPLETE */
const input=document.getElementById("playerSearch");
const box=document.getElementById("playerSuggestions");

input.addEventListener("input",()=>{
  const val=input.value.toLowerCase();
  box.innerHTML="";

  if(!val){
    box.style.display="none";
    return;
  }

  const matches=players.filter(p=>p.toLowerCase().includes(val)).slice(0,10);

  matches.forEach(m=>{
    const div=document.createElement("div");
    div.textContent=m;

    div.onclick=()=>{
      window.location.href="/golf-player.html?player="+encodeURIComponent(m);
    };

    box.appendChild(div);
  });

  box.style.display="block";
});

// 🔥 FIX: FILTER EVENTS NOW WORK
document.getElementById("yearFilter").addEventListener("change", render);
document.getElementById("tournamentSearch").addEventListener("input", render);

load();
</script>

</body>
</html>
