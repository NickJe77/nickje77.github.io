<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --green:#0b6b3a;
  --green2:#157a44;
  --bg:#f4f6f8;
  --card:#ffffff;
  --zebra:#eaf4ee;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

/* HERO */
.hero{
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:linear-gradient(135deg,var(--green),var(--green2));
}

.hero h1{
  margin:0;
  font-size:36px;
}

/* PAGE */
.page{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

/* CONTROLS */
.controls{
  display:flex;
  gap:12px;
  margin-bottom:20px;
}

select, input{
  padding:8px 10px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:14px;
}

/* AUTOCOMPLETE */
.autocomplete{
  position:relative;
}

.suggestions{
  position:absolute;
  top:36px;
  left:0;
  right:0;
  background:#fff;
  border:1px solid #ccc;
  border-radius:6px;
  max-height:200px;
  overflow-y:auto;
  display:none;
  z-index:10;
}

.suggestions div{
  padding:8px;
  cursor:pointer;
}

.suggestions div:hover{
  background:#eee;
}

/* TABLE */
.table-card{
  background:var(--card);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.06);
}

thead{
  background:var(--green);
  color:#fff;
}

th, td{
  padding:10px;
  font-size:14px;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}

.tournament{
  color:#0056d6;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/golf.html">Golf</a>
  <a href="/majors.html">Majors</a>
  <a href="/players.html">Players</a>
  <a href="/nba.html">NBA</a>
  <a href="/baseball.html">Baseball</a>
</div>

<div class="hero">
  <h1>Golf</h1>
</div>

<div class="page">

<div class="controls">
  <select id="yearFilter">
    <option value="all">All Years</option>
  </select>

  <div class="autocomplete">
    <input type="text" id="tournamentSearch" placeholder="Search tournament">
    <div id="suggestions" class="suggestions"></div>
  </div>
</div>

<div class="table-card">
<table>
<thead>
<tr>
  <th>Year</th>
  <th>Tournament</th>
  <th>Winner</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>
let data = [];
let tournaments = [];
let selectedTournament = "";

async function loadData(){
  const res = await fetch("/data/golf/pga_winners.json");
  data = await res.json();

  tournaments = [...new Set(data.map(d=>d.event))].sort();

  populateYears();
  render();
}

function populateYears(){
  const years = [...new Set(data.map(d=>d.year))].sort((a,b)=>b-a);
  const select = document.getElementById("yearFilter");

  years.forEach(y=>{
    const opt=document.createElement("option");
    opt.value=y;
    opt.textContent=y;
    select.appendChild(opt);
  });
}

function render(){
  let filtered=[...data];

  const year=document.getElementById("yearFilter").value;

  if(year!=="all"){
    filtered=filtered.filter(d=>d.year==year);
  }

  if(selectedTournament){
    filtered=filtered.filter(d=>d.event===selectedTournament);
  }

  draw(filtered);
}

function draw(rows){
  const tbody=document.getElementById("tableBody");
  tbody.innerHTML="";

  rows.forEach(r=>{
    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${r.year}</td>
      <td class="tournament">${r.event}</td>
      <td>${r.winner}</td>
    `;

    tbody.appendChild(tr);
  });
}

/* AUTOCOMPLETE */
const input=document.getElementById("tournamentSearch");
const suggestions=document.getElementById("suggestions");

input.addEventListener("input",()=>{
  const val=input.value.toLowerCase();
  suggestions.innerHTML="";

  if(!val){
    suggestions.style.display="none";
    selectedTournament="";
    render();
    return;
  }

  const matches=tournaments.filter(t=>t.toLowerCase().includes(val)).slice(0,20);

  matches.forEach(m=>{
    const div=document.createElement("div");
    div.textContent=m;
    div.onclick=()=>{
      input.value=m;
      selectedTournament=m;
      suggestions.style.display="none";
      render();
    };
    suggestions.appendChild(div);
  });

  suggestions.style.display="block";
});

document.getElementById("yearFilter").addEventListener("change",render);

loadData();
</script>

</body>
</html>
