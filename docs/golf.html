<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Golf | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --green:#0c6f3c;
      --green-dark:#08552d;
      --green-soft:#edf6ef;
      --gold:#d9b44a;
      --blue:#0056d6;
      --bg:#f4f6f8;
      --card:#ffffff;
      --line:#e3e7eb;
      --text:#1f2937;
      --muted:#6b7280;
      --zebra:#f3f8f4;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:Inter,system-ui,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .navbar{
      display:flex;
      justify-content:center;
      gap:24px;
      padding:16px 0;
      background:#fff;
      border-bottom:1px solid #ddd;
      font-weight:600;
    }

    .navbar a{
      color:var(--blue);
      text-decoration:none;
      font-size:18px;
    }

    .hero{
      background:
        linear-gradient(135deg, rgba(8,85,45,.96), rgba(12,111,60,.92)),
        radial-gradient(circle at top right, rgba(255,255,255,.14), transparent 34%);
      color:#fff;
      text-align:center;
      padding:42px 20px 38px;
      border-bottom:4px solid var(--gold);
    }

    .hero h1{
      margin:0 0 8px;
      font-size:54px;
      line-height:1;
      letter-spacing:.5px;
    }

    .hero p{
      margin:0;
      font-size:18px;
      color:rgba(255,255,255,.9);
    }

    .page{
      max-width:1280px;
      margin:0 auto;
      padding:28px 24px 40px;
    }

    .controls-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px 18px 16px;
      box-shadow:0 3px 12px rgba(0,0,0,.04);
      margin-bottom:22px;
    }

    .controls-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }

    .controls-title{
      font-size:26px;
      font-weight:800;
      color:var(--green-dark);
      margin:0;
    }

    .controls-sub{
      font-size:14px;
      color:var(--muted);
      margin:4px 0 0;
    }

    .result-count{
      font-size:15px;
      color:var(--muted);
      font-weight:600;
      white-space:nowrap;
    }

    .controls{
      display:grid;
      grid-template-columns: 180px minmax(260px, 420px);
      gap:14px;
      align-items:end;
    }

    .control-group label{
      display:block;
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#5d6775;
      margin:0 0 7px;
    }

    select,
    input{
      width:100%;
      height:46px;
      border:1px solid #cfd6dd;
      border-radius:12px;
      padding:0 14px;
      font-size:17px;
      background:#fff;
      color:var(--text);
      outline:none;
      transition:border-color .15s ease, box-shadow .15s ease;
    }

    select:focus,
    input:focus{
      border-color:var(--green);
      box-shadow:0 0 0 3px rgba(12,111,60,.12);
    }

    .table-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 3px 12px rgba(0,0,0,.04);
    }

    .table-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:18px 20px 14px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }

    .table-header h2{
      margin:0;
      font-size:22px;
      color:var(--green-dark);
    }

    .table-header .range{
      font-size:14px;
      color:var(--muted);
      font-weight:600;
    }

    .table-wrap{
      width:100%;
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      table-layout:auto;
    }

    thead th{
      background:var(--green);
      color:#fff;
      text-align:left;
      padding:14px 16px;
      font-size:15px;
      font-weight:800;
      border-right:1px solid rgba(255,255,255,.18);
    }

    thead th:last-child{
      border-right:none;
    }

    tbody td{
      padding:14px 16px;
      font-size:15px;
      border-top:1px solid #eef2f4;
      vertical-align:middle;
    }

    tbody tr:nth-child(even){
      background:var(--zebra);
    }

    tbody tr:hover{
      background:#e8f3eb;
    }

    .col-year{
      width:110px;
      white-space:nowrap;
      font-weight:700;
      color:#273444;
    }

    .col-winner{
      width:28%;
      font-weight:600;
    }

    .tournament-link{
      color:var(--blue);
      text-decoration:none;
      font-weight:700;
    }

    .tournament-link:hover{
      text-decoration:underline;
    }

    .empty{
      padding:24px 20px 30px;
      text-align:center;
      color:var(--muted);
      font-size:16px;
      display:none;
      background:#fff;
    }

    @media (max-width: 820px){
      .hero{
        padding:34px 16px 30px;
      }

      .hero h1{
        font-size:40px;
      }

      .hero p{
        font-size:16px;
      }

      .page{
        padding:20px 14px 32px;
      }

      .controls{
        grid-template-columns:1fr;
      }

      .controls-title{
        font-size:22px;
      }

      .table-header{
        padding:16px 16px 12px;
      }

      thead th,
      tbody td{
        padding:12px 12px;
        font-size:14px;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="/">Home</a>
    <a href="/golf.html">Golf</a>
    <a href="/majors.html">Majors</a>
    <a href="/players.html">Players</a>
    <a href="/nba.html">NBA</a>
    <a href="/baseball.html">Baseball</a>
  </div>

  <div class="hero">
    <h1>Golf</h1>
    <p>PGA tournament winners across every available season.</p>
  </div>

  <div class="page">
    <div class="controls-card">
      <div class="controls-top">
        <div>
          <h2 class="controls-title">Tournament Winners</h2>
          <p class="controls-sub">Filter by year or jump straight to a tournament.</p>
        </div>
        <div class="result-count" id="resultCount">Loading...</div>
      </div>

      <div class="controls">
        <div class="control-group">
          <label for="yearFilter">Year</label>
          <select id="yearFilter">
            <option value="all">All Years</option>
          </select>
        </div>

        <div class="control-group">
          <label for="tournamentSearch">Tournament</label>
          <input
            type="text"
            id="tournamentSearch"
            list="tournamentList"
            placeholder="Start typing a tournament name"
            autocomplete="off"
          >
          <datalist id="tournamentList"></datalist>
        </div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h2>PGA Results</h2>
        <div class="range" id="rangeText"></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-year">Year</th>
              <th>Tournament</th>
              <th class="col-winner">Winner</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="empty" id="emptyState">No tournaments match that filter.</div>
    </div>
  </div>

  <script>
    let allData = [];

    async function loadData(){
      const res = await fetch('/data/golf/pga_winners.json');
      allData = await res.json();

      allData.sort((a, b) => {
        if (b.year !== a.year) return b.year - a.year;
        return (a.event || '').localeCompare(b.event || '');
      });

      populateYears();
      populateTournamentList(allData);
      renderTable();
    }

    function populateYears(){
      const yearFilter = document.getElementById('yearFilter');
      const years = [...new Set(allData.map(row => row.year))].sort((a,b) => b-a);

      years.forEach(year => {
        const opt = document.createElement('option');
        opt.value = year;
        opt.textContent = year;
        yearFilter.appendChild(opt);
      });
    }

    function populateTournamentList(rows){
      const list = document.getElementById('tournamentList');
      list.innerHTML = '';

      const tournaments = [...new Set(rows.map(row => row.event).filter(Boolean))].sort((a,b) => a.localeCompare(b));

      tournaments.forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        list.appendChild(option);
      });
    }

    function getFilteredRows(){
      const year = document.getElementById('yearFilter').value;
      const tournamentText = document.getElementById('tournamentSearch').value.trim().toLowerCase();

      return allData.filter(row => {
        const yearMatch = year === 'all' || String(row.year) === year;
        const tournamentMatch = !tournamentText || (row.event || '').toLowerCase().includes(tournamentText);
        return yearMatch && tournamentMatch;
      });
    }

    function renderTable(){
      const rows = getFilteredRows();
      const tbody = document.getElementById('tableBody');
      const empty = document.getElementById('emptyState');
      const resultCount = document.getElementById('resultCount');
      const rangeText = document.getElementById('rangeText');

      tbody.innerHTML = '';

      if (!rows.length){
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
      }

      rows.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="col-year">${row.year ?? ''}</td>
          <td><a class="tournament-link" href="#">${row.event ?? ''}</a></td>
          <td class="col-winner">${row.winner ?? ''}</td>
        `;
        tbody.appendChild(tr);
      });

      resultCount.textContent = `${rows.length.toLocaleString()} tournaments`;
      updateRangeText(rows);
    }

    function updateRangeText(rows){
      const rangeText = document.getElementById('rangeText');

      if (!rows.length){
        rangeText.textContent = 'No results';
        return;
      }

      const years = rows.map(r => Number(r.year)).filter(Boolean);
      const minYear = Math.min(...years);
      const maxYear = Math.max(...years);

      rangeText.textContent = minYear === maxYear ? `${minYear}` : `${minYear}–${maxYear}`;
    }

    document.getElementById('yearFilter').addEventListener('change', renderTable);
    document.getElementById('tournamentSearch').addEventListener('input', renderTable);

    loadData();
  </script>
</body>
</html>
