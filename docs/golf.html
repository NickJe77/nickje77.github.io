<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Golf | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* KEEP YOUR EXISTING CSS EXACTLY */
</style>
</head>

<body>

<!-- KEEP ALL YOUR EXISTING HTML ABOVE -->

<script>
let data=[];
let players=[];

/* 🔥 PLAYER NAME CLEANER */
function cleanPlayerName(name){
  if(!name) return "";

  return name
    .replace(/\./g,". ")
    .replace(/\s+/g," ")
    .replace(/\b([a-z])/g,l=>l.toUpperCase())
    .replace(/\s*\(.*?\)/g,"")
    .replace(/\*/g,"")
    .trim();
}

/* 🔥 TOURNAMENT CLEANER */
function cleanTournament(name){
  if(!name) return "";
  return name
    .replace(/Augusta National.*$/i,"")
    .replace(/ - .*$/i,"")
    .trim();
}

async function load(){
  const res=await fetch("/data/golf/pga_winners.json");
  data=await res.json();

  data.sort((a,b)=>b.year-a.year);

  /* 🔥 FIXED PLAYER LIST */
  players=[...new Set(
    data.map(d=>cleanPlayerName(d.winner))
      .filter(n=>n && n!=="TBD")
  )].sort();

  populateFilters();
  render();
}

function populateFilters(){
  const years=[...new Set(data.map(d=>d.year))].sort((a,b)=>b-a);
  const tournaments=[...new Set(data.map(d=>cleanTournament(d.event)))].sort();

  const yearSelect=document.getElementById("yearFilter");
  const list=document.getElementById("tournamentList");

  years.forEach(y=>{
    const o=document.createElement("option");
    o.value=y;
    o.textContent=y;
    yearSelect.appendChild(o);
  });

  tournaments.forEach(t=>{
    const o=document.createElement("option");
    o.value=t;
    list.appendChild(o);
  });
}

function render(){
  const year=document.getElementById("yearFilter").value;
  const search=document.getElementById("tournamentSearch").value.toLowerCase();

  const seen=new Set();

  let filtered=data.filter(d=>{
    const event=cleanTournament(d.event||"");
    const key=d.year+"|"+event.toLowerCase();

    if(seen.has(key)) return false;
    seen.add(key);

    return (year==="all" || d.year==year) &&
           (!search || event.toLowerCase().includes(search));
  });

  draw(filtered);
}

function draw(rows){
  const tbody=document.getElementById("tableBody");
  tbody.innerHTML="";

  rows.forEach(r=>{
    const event=cleanTournament(r.event);
    const winner=cleanPlayerName(r.winner);

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${r.year}</td>
      <td>
        <a href="/golf-tournament.html?tournament=${encodeURIComponent(event)}">
          ${event}
        </a>
      </td>
      <td>
        ${winner
          ? `<a href="/golf-player.html?player=${encodeURIComponent(winner)}">${winner}</a>`
          : '<span style="color:#999;">TBD</span>'}
      </td>
    `;

    tbody.appendChild(tr);
  });
}

/* FILTER EVENTS */
document.getElementById("yearFilter").addEventListener("change",render);
document.getElementById("tournamentSearch").addEventListener("input",render);

load();
</script>

</body>
</html>
