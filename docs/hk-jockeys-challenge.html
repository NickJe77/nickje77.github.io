<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hong Kong International Jockeys Challenge | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Global styles (unchanged) -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="racing.css">

  <style>
    body {
      background-color: #f1f1f1;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .page-wrap {
      max-width: 1200px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }

    .page-title {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 30px;
    }

    /* ---------- TABLE ---------- */

    .archive-table {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #d6e4f2;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      background: #f3f7fc;
    }

    th, td {
      padding: 16px 18px;
      text-align: left;
      border-bottom: 1px solid #e1e8f0;
      font-size: 16px;
    }

    th {
      font-weight: 600;
    }

    tbody tr:nth-child(even) {
      background: #f7fbff;
    }

    /* Column widths */
    th:nth-child(1), td:nth-child(1) {
      width: 140px;
    }

    th:nth-child(2), td:nth-child(2) {
      width: auto;
    }

    @media (max-width: 700px) {
      .page-title {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav class="home-nav">
    <a href="index.html">Home</a>
    <a href="racing.html">Racing</a>
    <a href="hong-kong.html">Hong Kong</a>
    <a href="hk-jockeys-challenge.html" class="active">Jockeys Challenge</a>
  </nav>

  <div class="page-wrap">
    <h1 class="page-title">Hong Kong International Jockeys Challenge</h1>

    <div class="archive-table">
      <table>
        <thead>
          <tr>
            <th>Year</th>
            <th>Winner</th>
          </tr>
        </thead>
        <tbody id="jc-body">
          <tr>
            <td colspan="2">Loading data…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- DATA + SCRIPT -->
  <script>
    fetch("data/hk-jockeys-challenge.json")
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("jc-body");
        tbody.innerHTML = "";

        data
          .sort((a, b) => b.year - a.year)
          .forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${row.year}</td>
              <td>${row.winner}</td>
            `;
            tbody.appendChild(tr);
          });
      })
      .catch(() => {
        document.getElementById("jc-body").innerHTML =
          `<tr><td colspan="2">Unable to load data.</td></tr>`;
      });
  </script>

</body>
</html>
