<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

input, select{
  padding:8px 12px;
  font-size:15px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:12px;
  width:100%;
  max-width:360px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-bottom:28px;
}

.summary-box{
  border:1px solid #ddd;
  border-radius:14px;
  padding:10px 12px;
  background:#faf7ff;
}
.summary-box strong{
  display:block;
  margin-bottom:4px;
  font-size:14px;
}
.summary-box span{
  font-size:18px;
  font-weight:600;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{
  background:#f3f6fb;
  cursor:pointer;
}
th.sort-active{
  color:#3b007a;
  text-decoration:underline;
}

th#batHeader, th#bowlHeader,
td.batCol, td.bowlCol{
  min-width:110px;
}

tr:nth-child(even){background:#f8fbff;}
a{color:#3b007a;text-decoration:none;font-weight:600;}
a:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="ipl-player.html">IPL Players</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="playerName">Select an IPL Player</h1>
  <p>Career summary and match list.</p>

  <input type="text" id="playerSearch" placeholder="Type player name…">

  <select id="playerSelect">
    <option value="">— Select Player —</option>
  </select>
</div>

<div class="summary-grid">
  <div class="summary-box"><strong>Matches</strong><span id="matchesBox">—</span></div>
  <div class="summary-box"><strong>Runs</strong><span id="runsBox">—</span></div>
  <div class="summary-box"><strong>Wickets</strong><span id="wicketsBox">—</span></div>
  <div class="summary-box"><strong>Strike Rate</strong><span id="srBox">—</span></div>
  <div class="summary-box"><strong>Average</strong><span id="avgBox">—</span></div>
  <div class="summary-box"><strong>50s</strong><span id="fiftiesBox">—</span></div>
  <div class="summary-box"><strong>100s</strong><span id="hundredsBox">—</span></div>
  <div class="summary-box"><strong>Economy</strong><span id="econBox">—</span></div>
  <div class="summary-box"><strong>Best Score</strong><span id="bestScoreBox">—</span></div>
  <div class="summary-box"><strong>Best Bowling</strong><span id="bestBowlBox">—</span></div>
</div>

<h2>Matches</h2>
<table>
<thead>
<tr>
  <th>Date</th>
  <th>Match</th>
  <th>Team</th>
  <th>Opposition</th>
  <th>Venue</th>
  <th>Bat</th>
  <th>Bowl</th>
</tr>
</thead>
<tbody id="matchesTable"></tbody>
</table>

</div>

<script>
const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const namesUrl = "data/ipl/player-names.json";

const playerNameEl = document.getElementById("playerName");
const matchesBox = document.getElementById("matchesBox");
const runsBox = document.getElementById("runsBox");
const wicketsBox = document.getElementById("wicketsBox");
const srBox = document.getElementById("srBox");
const avgBox = document.getElementById("avgBox");
const fiftiesBox = document.getElementById("fiftiesBox");
const hundredsBox = document.getElementById("hundredsBox");
const econBox = document.getElementById("econBox");
const bestScoreBox = document.getElementById("bestScoreBox");
const bestBowlBox = document.getElementById("bestBowlBox");

const tableBody = document.getElementById("matchesTable");
const playerSelect = document.getElementById("playerSelect");
const playerSearch = document.getElementById("playerSearch");

let allMatches = [];
let nameMap = {};
let allPlayers = [];
let matchRows = [];

Promise.all([
  fetch(namesUrl).then(r=>r.json()),
  fetch(indexUrl).then(r=>r.json())
])
.then(([names, files])=>{
  nameMap = names;
  return Promise.all(
    files.filter(f=>f.includes("_FULL.json"))
      .map(f => fetch(basePath+f).then(r=>r.json()).then(data => ({file:f, data})))
  );
})
.then(seasons=>{
  const playerSet = new Set();

  seasons.forEach(season=>{
    season.data.forEach((match,i)=>{
      allMatches.push({match, file:season.file, index:i});

      let innings = Array.isArray(match.innings) ? match.innings : Object.values(match.innings);
      innings.forEach(inn=>{
        inn.overs?.forEach(o=>{
          o.deliveries?.forEach(d=>{
            if(d.batter) playerSet.add(d.batter);
            if(d.bowler) playerSet.add(d.bowler);
          });
        });
      });
    });
  });

  allPlayers = [...playerSet].sort();
  buildDropdown(allPlayers);

  playerSelect.addEventListener("change", ()=>{
    loadPlayer(playerSelect.value);
  });

  playerSearch.addEventListener("input", ()=>{
    renderFilteredDropdown(playerSearch.value);
  });
});

function buildDropdown(list){
  allPlayers = list;
  renderFilteredDropdown("");
}

function renderFilteredDropdown(filter){
  playerSelect.innerHTML = `<option value="">— Select Player —</option>`;
  const term = filter.toLowerCase();

  allPlayers
    .filter(p => (nameMap[p] || p).toLowerCase().includes(term))
    .forEach(p=>{
      const opt=document.createElement("option");
      opt.value=p;
      opt.textContent=nameMap[p]||p;
      playerSelect.appendChild(opt);
    });
}

function loadPlayer(player){
  matchRows=[];
  let matches=0,runs=0,balls=0,wkts=0,outs=0;

  allMatches.forEach(obj=>{
    const match=obj.match;
    let batRuns=0,batBalls=0,bowlWkts=0,bowlRuns=0,wasOut=false;
    let team="—",opp="—";

    let innings = Array.isArray(match.innings)?match.innings:Object.values(match.innings);

    innings.forEach(inn=>{
      const battingTeam=inn.team;
      const bowlingTeam=match.info.teams.find(t=>t!==battingTeam);

      inn.overs?.forEach(o=>{
        o.deliveries?.forEach(d=>{
          if(d.batter===player){
            batRuns+=d.runs.batter;
            if(!d.extras?.wides) batBalls++;
            team=battingTeam;
            opp=bowlingTeam;
          }
          if(d.bowler===player){
            bowlRuns+=d.runs.total;
            bowlWkts+=d.wickets?.length||0;
          }
          if(d.wickets){
            d.wickets.forEach(w=>{
              if(w.player_out===player) wasOut=true;
            });
          }
        });
      });
    });

    if(batRuns>0||bowlWkts>0){
      matches++; runs+=batRuns; balls+=batBalls; wkts+=bowlWkts; if(wasOut) outs++;
      matchRows.push({
        file:obj.file,
        index:obj.index,
        date:match.info.dates[0],
        teams:match.info.teams.join(" vs "),
        venue:match.info.venue||"—",
        team,opp,batRuns,batBalls,bowlWkts,bowlRuns
      });
    }
  });

  playerNameEl.textContent=nameMap[player]||player;
  matchesBox.textContent=matches;
  runsBox.textContent=runs;
  wicketsBox.textContent=wkts;
  srBox.textContent=balls?((runs/balls)*100).toFixed(1):"—";
  avgBox.textContent=outs?(runs/outs).toFixed(2):"—";

  renderTable();
}

function renderTable(){
  tableBody.innerHTML="";
  matchRows.forEach(m=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${new Date(m.date).toLocaleDateString()}</td>
      <td><a href="ipl-game.html?file=${encodeURIComponent(m.file)}&i=${m.index}">${m.teams}</a></td>
      <td>${m.team}</td>
      <td>${m.opp}</td>
      <td>${m.venue}</td>
      <td>${m.batRuns?m.batRuns+" ("+m.batBalls+")":"—"}</td>
      <td>${m.bowlWkts?m.bowlWkts+" / "+m.bowlRuns:"—"}</td>
    `;
    tableBody.appendChild(tr);
  });
}
</script>

</body>
</html>
