<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

select{
  padding:10px 14px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:15px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
  margin-bottom:30px;
}
.summary-box{
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  background:#faf7ff;
}
.summary-box strong{display:block;margin-bottom:6px;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{background:#f3f6fb;}
tr:nth-child(even){background:#f8fbff;}
a{color:#3b007a;text-decoration:none;font-weight:600;}
a:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="playerName">Select an IPL Player</h1>
  <p>Career summary and match list.</p>
  <select id="playerSelect">
    <option value="">— Select Player —</option>
  </select>
</div>

<div class="summary-grid">
  <div class="summary-box"><strong>Matches</strong><span id="matchesBox">—</span></div>
  <div class="summary-box"><strong>Runs</strong><span id="runsBox">—</span></div>
  <div class="summary-box"><strong>Wickets</strong><span id="wicketsBox">—</span></div>
  <div class="summary-box"><strong>Strike Rate</strong><span id="srBox">—</span></div>
</div>

<h2>Matches</h2>
<table>
<thead>
<tr>
  <th>Date</th>
  <th>Match</th>
  <th>Venue</th>
  <th>Bat</th>
  <th>Bowl</th>
</tr>
</thead>
<tbody id="matchesTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
let playerParam = params.get("player");

const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const namesUrl = "data/ipl/player-names.json";

const playerNameEl = document.getElementById("playerName");
const matchesBox = document.getElementById("matchesBox");
const runsBox = document.getElementById("runsBox");
const wicketsBox = document.getElementById("wicketsBox");
const srBox = document.getElementById("srBox");
const tableBody = document.getElementById("matchesTable");
const playerSelect = document.getElementById("playerSelect");

let allMatches = [];
let nameMap = {};
let allPlayers = [];
let typedBuffer = "";
let bufferTimer = null;

Promise.all([
  fetch(namesUrl).then(r=>r.json()),
  fetch(indexUrl).then(r=>r.json())
])
.then(([names, files])=>{
  nameMap = names;

  const fullFiles = files.filter(f => f.includes("_FULL.json"));
  return Promise.all(fullFiles.map(f=>fetch(basePath+f).then(r=>r.json())));
})
.then(seasons=>{
  const playerSet = new Set();

  seasons.forEach(season=>{
    season.forEach(match=>{
      allMatches.push(match);
      match.innings.forEach(inn=>{
        inn.overs.forEach(over=>{
          over.deliveries.forEach(d=>{
            if(d.batter) playerSet.add(d.batter);
            if(d.bowler) playerSet.add(d.bowler);
          });
        });
      });
    });
  });

  allPlayers = Array.from(playerSet).sort();
  buildDropdown(allPlayers);

  if(playerParam){
    playerSelect.value = playerParam;
    loadPlayer(playerParam);
  }

  playerSelect.addEventListener("change", ()=>{
    const p = playerSelect.value;
    if(p){
      window.location.href = "ipl-player.html?player=" + encodeURIComponent(p);
    }
  });

  // predictive typing on the SAME selector
  playerSelect.addEventListener("keydown", (e)=>{
    if(e.key.length === 1 && /[a-zA-Z ]/.test(e.key)){
      typedBuffer += e.key.toLowerCase();
      filterDropdown();
    }
    if(e.key === "Backspace"){
      typedBuffer = typedBuffer.slice(0, -1);
      filterDropdown();
    }

    clearTimeout(bufferTimer);
    bufferTimer = setTimeout(()=>{ typedBuffer = ""; }, 1000);
  });
});

function buildDropdown(list){
  playerSelect.innerHTML = `<option value="">— Select Player —</option>`;
  list.forEach(p=>{
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = nameMap[p] || p;
    playerSelect.appendChild(opt);
  });
}

function filterDropdown(){
  const filtered = allPlayers.filter(p=>{
    const display = (nameMap[p] || p).toLowerCase();
    return display.startsWith(typedBuffer);
  });
  buildDropdown(filtered);
}

function loadPlayer(player){
  let matches = 0;
  let runs = 0;
  let balls = 0;
  let wkts = 0;
  let matchRows = [];

  allMatches.forEach(match=>{
    let didPlay = false;
    let batRuns = 0;
    let batBalls = 0;
    let bowlWkts = 0;
    let bowlRuns = 0;

    match.innings.forEach(inn=>{
      inn.overs.forEach(over=>{
        over.deliveries.forEach(d=>{
          if(d.batter === player){
            batRuns += d.runs.batter;
            if(!d.extras?.wides) batBalls++;
            didPlay = true;
          }
          if(d.bowler === player){
            if(!d.extras?.byes && !d.extras?.legbyes){
              bowlRuns += d.runs.total;
            }
            if(d.wickets){
              d.wickets.forEach(w=>{
                if(w.kind !== "run out") bowlWkts++;
              });
            }
            didPlay = true;
          }
        });
      });
    });

    if(didPlay){
      matches++;
      runs += batRuns;
      balls += batBalls;
      wkts += bowlWkts;

      matchRows.push({
        date: match.info.dates[0],
        teams: match.info.teams.join(" vs "),
        venue: match.info.venue || "—",
        bat: batRuns ? batRuns+" ("+batBalls+")" : "—",
        bowl: bowlWkts ? bowlWkts+" / "+bowlRuns : "—",
        file: match.file
      });
    }
  });

  playerNameEl.textContent = nameMap[player] || player;
  matchesBox.textContent = matches;
  runsBox.textContent = runs;
  wicketsBox.textContent = wkts;
  srBox.textContent = balls ? ((runs/balls)*100).toFixed(1) : "—";

  tableBody.innerHTML = "";

  matchRows
    .sort((a,b)=>new Date(a.date)-new Date(b.date))
    .forEach(m=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${formatDate(m.date)}</td>
        <td><a href="ipl-match.html?file=${encodeURIComponent(m.file)}">${m.teams}</a></td>
        <td>${m.venue}</td>
        <td>${m.bat}</td>
        <td>${m.bowl}</td>
      `;
      tableBody.appendChild(tr);
    });
}

function formatDate(d){
  return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
</script>

</body>
</html>
