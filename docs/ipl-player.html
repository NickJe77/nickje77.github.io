<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:600}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px}
.hero{background:linear-gradient(90deg,#3b007a,#7b2cbf);color:#fff;padding:40px 50px;border-radius:24px;margin-bottom:20px}
.hero h1{margin:0;font-size:46px}
.hero p{margin-top:10px;font-size:20px;opacity:.95}
select{padding:8px 12px;font-size:15px;border-radius:10px;border:1px solid #ccc;margin-top:12px}

.section{margin-top:40px}
h2{color:#3b007a}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left}
th{background:#f3f6fb}
tr:nth-child(even){background:#f8fbff}

.bar{height:18px;background:#7b2cbf;border-radius:6px}

</style>
</head>

<body>
<div class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">
<div class="hero">
<h1 id="playerName">Select an IPL Player</h1>
<p>Career breakdown and advanced stats.</p>
<select id="playerSelect"><option value="">— Select Player —</option></select>
</div>

<div class="section">
<h2>Milestones</h2>
<table>
<thead><tr><th>Score</th><th>Date</th><th>Match</th></tr></thead>
<tbody id="milestonesTable"></tbody>
</table>
</div>

<div class="section">
<h2>Season by Season</h2>
<table>
<thead><tr><th>Season</th><th>Matches</th><th>Runs</th><th>Wickets</th><th>Avg</th><th>SR</th></tr></thead>
<tbody id="seasonTable"></tbody>
</table>
</div>

<div class="section">
<h2>Top Partnerships</h2>
<table>
<thead><tr><th>Partner</th><th>Runs</th><th>Match</th></tr></thead>
<tbody id="partnershipTable"></tbody>
</table>
</div>

<div class="section">
<h2>Run Distribution (Wagon Style)</h2>
<div id="wagon"></div>
</div>
</div>

<script>
const params=new URLSearchParams(location.search);
const player=params.get("player");

const indexUrl="data/ipl/index.json";
const basePath="data/ipl/";
const namesUrl="data/ipl/player-names.json";

const playerNameEl=document.getElementById("playerName");
const playerSelect=document.getElementById("playerSelect");

const milestonesTable=document.getElementById("milestonesTable");
const seasonTable=document.getElementById("seasonTable");
const partnershipTable=document.getElementById("partnershipTable");
const wagon=document.getElementById("wagon");

let nameMap={},allMatches=[];

Promise.all([
fetch(namesUrl).then(r=>r.json()),
fetch(indexUrl).then(r=>r.json())
]).then(([names,files])=>{
nameMap=names;
const fullFiles=files.filter(f=>f.includes("_FULL.json"));
return Promise.all(fullFiles.map(f=>fetch(basePath+f).then(r=>r.json())));
}).then(seasons=>{
const players=new Set();

seasons.forEach(season=>{
season.forEach(match=>{
allMatches.push(match);
const inns=Array.isArray(match.innings)?match.innings:Object.values(match.innings);
inns.forEach(inn=>{
inn.overs.forEach(o=>{
o.deliveries.forEach(d=>{
if(d.batter)players.add(d.batter);
if(d.bowler)players.add(d.bowler);
});
});
});
});
});

[...players].sort().forEach(p=>{
const opt=document.createElement("option");
opt.value=p;
opt.textContent=nameMap[p]||p;
playerSelect.appendChild(opt);
});

if(player){
playerSelect.value=player;
loadPlayer(player);
}

playerSelect.onchange=()=>location.href="ipl-player.html?player="+encodeURIComponent(playerSelect.value);
});

function loadPlayer(player){
playerNameEl.textContent=nameMap[player]||player;

let milestones=[],seasonStats={},partnerships={},runDist={0:0,1:0,2:0,3:0,4:0,6:0};

allMatches.forEach(match=>{
const date=match.info.dates[0];
const season=date.slice(0,4);
const teams=match.info.teams.join(" vs ");
let batRuns=0,balls=0,partner=null,partRuns=0;

seasonStats[season]=seasonStats[season]||{runs:0,wkts:0,balls:0,matches:0};

const inns=Array.isArray(match.innings)?match.innings:Object.values(match.innings);

inns.forEach(inn=>{
inn.overs.forEach(o=>{
o.deliveries.forEach(d=>{
if(d.batter===player){
batRuns+=d.runs.batter;
seasonStats[season].runs+=d.runs.batter;
seasonStats[season].balls++;
runDist[d.runs.batter]=(runDist[d.runs.batter]||0)+1;
if(d.non_striker){
if(!partner||partner!==d.non_striker){
partner=d.non_striker;
partRuns=0;
}
partRuns+=d.runs.total;
const key=partner+"|"+teams;
partnerships[key]=(partnerships[key]||0)+d.runs.total;
}
}
if(d.wickets){
d.wickets.forEach(w=>{
if(w.player_out===player){
if(batRuns>=50)milestones.push({score:batRuns,date,match:teams});
}
});
}
});
});
});

if(batRuns>0){
seasonStats[season].matches++;
if(batRuns>=50)milestones.push({score:batRuns,date,match:teams});
}
});

milestonesTable.innerHTML=milestones.map(m=>`<tr><td>${m.score}</td><td>${m.date}</td><td>${m.match}</td></tr>`).join("");

Object.entries(seasonStats).forEach(([s,obj])=>{
const avg=obj.matches?(obj.runs/obj.matches).toFixed(2):"—";
const sr=obj.balls?(obj.runs/obj.balls*100).toFixed(1):"—";
seasonTable.innerHTML+=`<tr><td>${s}</td><td>${obj.matches}</td><td>${obj.runs}</td><td>${obj.wkts}</td><td>${avg}</td><td>${sr}</td></tr>`;
});

Object.entries(partnerships).sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(([k,v])=>{
const [p,m]=k.split("|");
partnershipTable.innerHTML+=`<tr><td>${nameMap[p]||p}</td><td>${v}</td><td>${m}</td></tr>`;
});

const max=Math.max(...Object.values(runDist));
Object.entries(runDist).forEach(([r,v])=>{
const w=(v/max*100).toFixed(0);
wagon.innerHTML+=`<div>${r} runs<div class="bar" style="width:${w}%"></div></div>`;
});
}
</script>
</body>
</html>
