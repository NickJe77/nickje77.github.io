<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f6f7f9;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px;
  border-radius:24px;
}
.hero h1{
  margin:0;
  font-size:38px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
  margin-top:20px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
}

.table-wrap{
  margin-top:30px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{background:#f1f4f8;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="ipl.html">IPL</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading…</h1>
</div>

<div class="stats" id="careerStats"></div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Runs</th>
<th>Balls</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>
</div>

</div>

<script>
(async function(){

const params = new URLSearchParams(location.search);
const slug = params.get("player");

if(!slug){
  document.getElementById("playerName").textContent="No player specified";
  return;
}

// ---------------- CLEAN FUNCTION ----------------
function clean(n){
  return (n||"")
    .toLowerCase()
    .replace(/[^a-z]/g,"");
}

// ---------------- SLUG → INITIALS ----------------
function slugToInitials(slug){
  return slug
    .replace(/-/g," ")
    .replace(/\b\w/g,c=>c.toUpperCase());
}

// LOAD JSON
const nameMap =
  await fetch("/data/ipl/player-names.json")
  .then(r=>r.json());

let playerName = null;
let initials = slugToInitials(slug);

// FIND PLAYER
for(const [shortName, fullName] of Object.entries(nameMap)){
  if(clean(shortName) === clean(initials)){
    playerName = fullName;
    initials = shortName;
    break;
  }
}

if(!playerName){
  document.getElementById("playerName").textContent="Player not found";
  return;
}

document.getElementById("playerName").textContent = playerName;

// 🔥 MATCH USING CLEANED NAME (THIS FIXES MISSING DATA)
const target = clean(initials);

let games=[];

// LOAD INDEX
const index =
  await fetch("/data/ipl/index.json")
  .then(r=>r.json());

// LOAD MATCHES
for(const file of index){

  if(!file.includes("_FULL.json")) continue;

  const matches =
    await fetch("/data/ipl/"+file)
    .then(r=>r.json());

  matches.forEach(match=>{

    match.innings.forEach(inn=>{

      let runs=0;
      let balls=0;
      let played=false;

      inn.overs.forEach(o=>{
        o.deliveries.forEach(d=>{

          if(clean(d.batter) === target){
            played=true;
            runs+=d.runs.batter || 0;
            if(!d.extras?.wides) balls++;
          }

        });
      });

      if(played){
        games.push({
          season:match.info.season,
          date:match.info.dates?.[0] || "",
          opp:match.info.teams.find(t=>t!==inn.team),
          runs,
          balls
        });
      }

    });

  });

}

// TOTALS
const totalRuns = games.reduce((a,b)=>a+b.runs,0);
const totalBalls = games.reduce((a,b)=>a+b.balls,0);

document.getElementById("careerStats").innerHTML=`
<div class="stat"><h3>${games.length}</h3><span>Matches</span></div>
<div class="stat"><h3>${totalRuns}</h3><span>Runs</span></div>
<div class="stat"><h3>${totalBalls}</h3><span>Balls</span></div>
`;

document.getElementById("gamesTable").innerHTML =
games.map(g=>`
<tr>
<td>${g.season}</td>
<td>${g.date}</td>
<td>${g.opp}</td>
<td>${g.runs}</td>
<td>${g.balls}</td>
</tr>
`).join("");

})();
</script>

</body>
</html>
