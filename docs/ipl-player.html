<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui;margin:0;background:#fff}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;font-weight:600}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px}
.hero{background:linear-gradient(90deg,#3b007a,#7b2cbf);color:#fff;padding:40px;border-radius:24px;margin-bottom:20px}
.hero h1{margin:0;font-size:46px}
.hero p{margin-top:10px;font-size:20px;opacity:.95}

input, select{
  padding:12px 16px;
  font-size:17px;
  border-radius:14px;
  border:1px solid #ccc;
  width:100%;
  max-width:480px;
  margin-top:14px;
  box-sizing:border-box;
}

.controls-row{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  align-items:center;
  margin: 14px 0 6px 0;
}

.tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.tab-btn{
  border:1px solid rgba(255,255,255,0.55);
  background:rgba(255,255,255,0.18);
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}
.tab-btn.active{
  background:#fff;
  color:#3b007a;
  border-color:#fff;
}

.filter-inline{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.filter-inline label{
  font-weight:700;
  color:#fff;
  opacity:.95;
}

.filter-inline select{
  margin-top:0;
  max-width:320px;
}

.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.summary-box{border:1px solid #ddd;border-radius:14px;padding:10px;background:#faf7ff}
.summary-box strong{display:block;font-size:14px}
.summary-box span{font-size:18px;font-weight:600}

.sub-summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin: 0 0 22px 0;
}
.sub-summary .summary-box{background:#f6fbff}

.note{
  font-size:14px;
  color:#444;
  margin: 6px 0 16px 0;
}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f3f6fb}
tr:nth-child(even){background:#f8fbff}
a{color:#3b007a;font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}

.small{font-size:12px; opacity:.75}
.right{text-align:right}
.center{text-align:center}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="ipl-player.html">IPL Players</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="playerName">Search IPL Player</h1>
  <p>Career summary and match list.</p>

  <input id="playerInput" list="playerList" placeholder="Type player name…">
  <datalist id="playerList"></datalist>

  <div class="controls-row">
    <div class="tabs">
      <button class="tab-btn active" id="tabBat">Batting</button>
      <button class="tab-btn" id="tabBowl">Bowling</button>
    </div>

    <div class="filter-inline">
      <label for="oppSelect">Opposition:</label>
      <select id="oppSelect" disabled>
        <option value="">All</option>
      </select>
    </div>
  </div>

  <div class="small" id="loadStatus"></div>
</div>

<!-- Overall career (always stays visible) -->
<div class="summary-grid">
  <div class="summary-box"><strong>Matches</strong><span id="matchesBox">—</span></div>
  <div class="summary-box"><strong>Runs</strong><span id="runsBox">—</span></div>
  <div class="summary-box"><strong>Wickets</strong><span id="wicketsBox">—</span></div>
  <div class="summary-box"><strong>Bat Strike Rate</strong><span id="srBox">—</span></div>
  <div class="summary-box"><strong>Bat Average</strong><span id="avgBox">—</span></div>
</div>

<!-- Tab-specific mini summary -->
<div class="sub-summary" id="batSummary">
  <div class="summary-box"><strong>Innings</strong><span id="innBox">—</span></div>
  <div class="summary-box"><strong>Not Outs</strong><span id="noBox">—</span></div>
  <div class="summary-box"><strong>50s</strong><span id="fiftyBox">—</span></div>
  <div class="summary-box"><strong>100s</strong><span id="hundredBox">—</span></div>
</div>

<div class="sub-summary" id="bowlSummary" style="display:none;">
  <div class="summary-box"><strong>Overs</strong><span id="oversBox">—</span></div>
  <div class="summary-box"><strong>Runs Conceded</strong><span id="concededBox">—</span></div>
  <div class="summary-box"><strong>Economy</strong><span id="econBox">—</span></div>
  <div class="summary-box"><strong>Bowling SR</strong><span id="bowlSrBox">—</span></div>
</div>

<div class="note" id="noteLine"></div>

<h2 id="matchesTitle">Matches (Batting)</h2>
<table>
  <thead id="tableHead"></thead>
  <tbody id="matchesTable"></tbody>
</table>

</div>

<script>
const indexUrl="data/ipl/index.json";
const basePath="data/ipl/";
const namesUrl="data/ipl/player-names.json";

const playerInput=document.getElementById("playerInput");
const playerList=document.getElementById("playerList");
const playerNameEl=document.getElementById("playerName");
const tableBody=document.getElementById("matchesTable");
const tableHead=document.getElementById("tableHead");

const matchesBox=document.getElementById("matchesBox");
const runsBox=document.getElementById("runsBox");
const wicketsBox=document.getElementById("wicketsBox");
const srBox=document.getElementById("srBox");
const avgBox=document.getElementById("avgBox");

const innBox=document.getElementById("innBox");
const noBox=document.getElementById("noBox");
const fiftyBox=document.getElementById("fiftyBox");
const hundredBox=document.getElementById("hundredBox");

const oversBox=document.getElementById("oversBox");
const concededBox=document.getElementById("concededBox");
const econBox=document.getElementById("econBox");
const bowlSrBox=document.getElementById("bowlSrBox");

const tabBat=document.getElementById("tabBat");
const tabBowl=document.getElementById("tabBowl");
const matchesTitle=document.getElementById("matchesTitle");
const oppSelect=document.getElementById("oppSelect");
const loadStatus=document.getElementById("loadStatus");
const noteLine=document.getElementById("noteLine");

let nameMap={}, allMatches=[], allPlayers=[];
let currentPlayer=null;
let currentRows=[]; // rows for current player (all opponents)
let currentMode="bat"; // bat | bowl

function setStatus(msg){ loadStatus.textContent = msg || ""; }

function normalizeIndex(raw){
  if(Array.isArray(raw)) return raw;
  if(typeof raw === "string") return raw.split(",").map(s=>s.trim()).filter(Boolean);
  if(raw && Array.isArray(raw.files)) return raw.files;
  return [];
}

function getInningsArray(match){
  const inns = match.innings;
  if(Array.isArray(inns)) return inns;
  if(inns && typeof inns === "object") return Object.values(inns);
  return [];
}

function isWide(del){
  return !!(del.extras && (del.extras.wides || del.extras.wide));
}
function isNoBall(del){
  return !!(del.extras && (del.extras.noballs || del.extras.noball));
}
function legalBallForBat(del){
  // batter ball faced excludes wides; no-balls still count as a ball faced in many feeds,
  // but cricsheet deliveries are “ball events” and no-ball is not a legal ball.
  // For batting balls faced, count if NOT wide.
  return !isWide(del);
}
function legalBallForBowl(del){
  // legal delivery excludes wides and no-balls
  return !isWide(del) && !isNoBall(del);
}
function bowlerRunsConceded(del){
  // Bowler is not charged byes/legbyes
  const total = (del.runs && typeof del.runs.total === "number") ? del.runs.total : 0;
  const byes = del.extras?.byes || 0;
  const legbyes = del.extras?.legbyes || 0;
  return total - byes - legbyes;
}
function wicketCreditedToBowler(w){
  if(!w || !w.kind) return false;
  const k = String(w.kind).toLowerCase();
  return !(k.includes("run out") || k.includes("retired") || k.includes("obstruct") || k.includes("hit wicket")===false ? false : false) 
    ? true : true;
}
// The above is messy; do proper list:
function wicketCountsForBowler(w){
  if(!w || !w.kind) return false;
  const k = String(w.kind).toLowerCase();
  if(k === "run out") return false;
  if(k === "retired hurt" || k === "retired notout" || k === "retired out") return false;
  if(k === "obstructing the field") return false;
  // hit wicket IS credited to bowler
  return true;
}
function isDismissalForBatting(w){
  if(!w || !w.kind) return true;
  const k = String(w.kind).toLowerCase();
  if(k === "retired hurt" || k === "retired notout") return false;
  return true;
}

function formatDateISO(d){
  const dt = new Date(d);
  if(isNaN(dt)) return d || "—";
  return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

function oversFromBalls(balls){
  const o = Math.floor(balls/6);
  const b = balls % 6;
  return `${o}.${b}`;
}

Promise.all([
  fetch(namesUrl).then(r=>r.json()),
  fetch(indexUrl).then(r=>r.json())
]).then(([names,rawIndex])=>{
  nameMap = names || {};
  const files = normalizeIndex(rawIndex);

  // If you truly have _FULL.json files, keep that filter. Otherwise load everything.
  const picked = files.filter(f=>String(f).includes("_FULL.json"));
  const finalFiles = picked.length ? picked : files;

  setStatus(`Loading IPL matches… (${finalFiles.length} files)`);

  return Promise.all(
    finalFiles.map(f=>
      fetch(basePath+f)
        .then(r=>r.json())
        .then(data=>({file:f,data}))
        .catch(err=>({file:f,data:null,error:String(err)}))
    )
  );
}).then(seasons=>{
  const set = new Set();

  seasons.forEach(season=>{
    if(!season.data) return;

    // data shape could be array OR {matches:[...]} OR {games:[...]}
    let matchesArr = null;
    if(Array.isArray(season.data)) matchesArr = season.data;
    else if(Array.isArray(season.data.matches)) matchesArr = season.data.matches;
    else if(Array.isArray(season.data.games)) matchesArr = season.data.games;

    if(!matchesArr) return;

    matchesArr.forEach((match,i)=>{
      allMatches.push({match,file:season.file,index:i});

      const inns = getInningsArray(match);
      inns.forEach(inn=>{
        inn.overs?.forEach(o=>{
          o.deliveries?.forEach(d=>{
            if(d.batter) set.add(d.batter);
            if(d.bowler) set.add(d.bowler);
          });
        });
      });

      // also pull from info.players lists if present
      const pl = match?.info?.players;
      if(pl && typeof pl === "object"){
        Object.values(pl).forEach(arr=>{
          if(Array.isArray(arr)) arr.forEach(p=>set.add(p));
        });
      }
    });
  });

  allPlayers = [...set].sort((a,b)=> (nameMap[a]||a).localeCompare(nameMap[b]||b));
  buildList();
  setStatus(`Loaded players: ${allPlayers.length.toLocaleString()} • Matches: ${allMatches.length.toLocaleString()}`);
});

function buildList(){
  playerList.innerHTML="";
  allPlayers.forEach(p=>{
    const opt=document.createElement("option");
    opt.value=nameMap[p]||p;
    playerList.appendChild(opt);
  });
}

playerInput.addEventListener("change",()=>{
  const typed = (playerInput.value||"").trim().toLowerCase();
  const found = allPlayers.find(p => (nameMap[p]||p).toLowerCase() === typed);
  if(found) loadPlayer(found);
});

tabBat.addEventListener("click", ()=>{
  currentMode = "bat";
  tabBat.classList.add("active");
  tabBowl.classList.remove("active");
  document.getElementById("batSummary").style.display="";
  document.getElementById("bowlSummary").style.display="none";
  matchesTitle.textContent = "Matches (Batting)";
  renderCurrent();
});

tabBowl.addEventListener("click", ()=>{
  currentMode = "bowl";
  tabBowl.classList.add("active");
  tabBat.classList.remove("active");
  document.getElementById("batSummary").style.display="none";
  document.getElementById("bowlSummary").style.display="";
  matchesTitle.textContent = "Matches (Bowling)";
  renderCurrent();
});

oppSelect.addEventListener("change", ()=>{
  renderCurrent();
});

function loadPlayer(player){
  currentPlayer = player;
  oppSelect.disabled = true;
  oppSelect.innerHTML = `<option value="">All</option>`;
  noteLine.textContent = "";

  // Career aggregates
  let matches=0;

  let batRuns=0, batBalls=0, outs=0, innsCount=0, notOuts=0, fifties=0, hundreds=0;

  let bowlWkts=0, bowlBalls=0, bowlConceded=0;

  const rows = [];

  allMatches.forEach(obj=>{
    const match = obj.match;
    const matchDate = match?.info?.dates?.[0] || "";
    const venue = match?.info?.venue || "—";
    const teams = match?.info?.teams || [];
    const matchName = Array.isArray(teams) ? teams.join(" vs ") : "Match";

    let team="—", opp="—";

    // Per match stats
    let mBatRuns=0, mBatBalls=0, mWasOut=false, mBatted=false;
    let mBowlWkts=0, mBowlBalls=0, mBowlConceded=0, mBowled=false;

    const inns = getInningsArray(match);

    inns.forEach(inn=>{
      const batTeam = inn.team;
      const bowlTeam = Array.isArray(match?.info?.teams) ? match.info.teams.find(t=>t!==batTeam) : "—";

      inn.overs?.forEach(o=>{
        o.deliveries?.forEach(del=>{
          // batting
          if(del.batter === player){
            mBatted = true;
            if(team === "—") { team = batTeam; opp = bowlTeam || "—"; }
            mBatRuns += (del.runs?.batter || 0);
            if(legalBallForBat(del)) mBatBalls += 1;
          }

          // bowling
          if(del.bowler === player){
            mBowled = true;
            if(team === "—") { team = bowlTeam || "—"; opp = batTeam || "—"; }
            if(legalBallForBowl(del)) mBowlBalls += 1;
            mBowlConceded += bowlerRunsConceded(del);

            if(Array.isArray(del.wickets)){
              del.wickets.forEach(w=>{
                // only count wickets credited to bowler
                if(wicketCountsForBowler(w)) mBowlWkts += 1;
              });
            }
          }

          // dismissal
          if(Array.isArray(del.wickets)){
            del.wickets.forEach(w=>{
              if(w?.player_out === player && isDismissalForBatting(w)){
                mWasOut = true;
              }
            });
          }
        });
      });
    });

    const participated = mBatted || mBowled || mWasOut;
    if(!participated) return;

    matches += 1;

    // batting career
    if(mBatted || mWasOut){
      innsCount += 1;
      batRuns += mBatRuns;
      batBalls += mBatBalls;
      if(mWasOut) outs += 1;
      else notOuts += 1;

      if(mBatRuns >= 100) hundreds += 1;
      else if(mBatRuns >= 50) fifties += 1;
    }

    // bowling career
    if(mBowled){
      bowlWkts += mBowlWkts;
      bowlBalls += mBowlBalls;
      bowlConceded += mBowlConceded;
    }

    rows.push({
      ...obj,
      date: matchDate,
      matchName,
      venue,
      team,
      opp,
      // batting
      batRuns: mBatRuns,
      batBalls: mBatBalls,
      wasOut: mWasOut,
      // bowling
      bowlWkts: mBowlWkts,
      bowlBalls: mBowlBalls,
      bowlConceded: mBowlConceded
    });
  });

  // Save rows
  currentRows = rows;

  // Update name
  playerNameEl.textContent = nameMap[player] || player;

  // Career headline boxes (always visible)
  matchesBox.textContent = matches ? matches : "0";
  runsBox.textContent = batRuns ? batRuns : "0";
  wicketsBox.textContent = bowlWkts ? bowlWkts : "0";
  srBox.textContent = batBalls ? ((batRuns / batBalls) * 100).toFixed(1) : "—";
  avgBox.textContent = outs ? (batRuns / outs).toFixed(2) : (batRuns ? "∞" : "—");

  // Bat tab mini
  innBox.textContent = innsCount ? innsCount : "0";
  noBox.textContent = notOuts ? notOuts : "0";
  fiftyBox.textContent = fifties ? fifties : "0";
  hundredBox.textContent = hundreds ? hundreds : "0";

  // Bowl tab mini
  oversBox.textContent = bowlBalls ? oversFromBalls(bowlBalls) : "0.0";
  concededBox.textContent = bowlConceded ? bowlConceded : "0";
  econBox.textContent = bowlBalls ? ( (bowlConceded / (bowlBalls/6)) ).toFixed(2) : "—";
  bowlSrBox.textContent = bowlWkts ? ( (bowlBalls / bowlWkts) ).toFixed(1) : "—";

  // Opposition dropdown options
  const oppSet = new Set();
  rows.forEach(r=>{ if(r.opp && r.opp !== "—") oppSet.add(r.opp); });
  const opps = [...oppSet].sort((a,b)=>a.localeCompare(b));
  oppSelect.innerHTML = `<option value="">All</option>` + opps.map(o=>`<option value="${escapeHtml(o)}">${o}</option>`).join("");
  oppSelect.disabled = false;

  // Helpful line
  noteLine.textContent = `Showing matches where the player batted and/or bowled. Use Opposition filter to narrow the match list (career stats stay the same).`;

  renderCurrent();
}

function renderCurrent(){
  if(!currentPlayer) return;

  const selectedOpp = oppSelect.value || "";
  const filtered = selectedOpp ? currentRows.filter(r=>r.opp===selectedOpp) : currentRows.slice();

  // Sort newest first (like most player pages)
  filtered.sort((a,b)=> new Date(b.date) - new Date(a.date));

  if(currentMode === "bat"){
    tableHead.innerHTML = `
      <tr>
        <th>Date</th>
        <th>Match</th>
        <th>Team</th>
        <th>Opposition</th>
        <th>Venue</th>
        <th class="right">Runs</th>
        <th class="right">Balls</th>
        <th class="right">SR</th>
        <th class="center">Out</th>
      </tr>
    `;

    renderBatTable(filtered);

  }else{
    tableHead.innerHTML = `
      <tr>
        <th>Date</th>
        <th>Match</th>
        <th>Team</th>
        <th>Opposition</th>
        <th>Venue</th>
        <th class="right">Overs</th>
        <th class="right">Runs</th>
        <th class="right">Wkts</th>
        <th class="right">Econ</th>
      </tr>
    `;

    renderBowlTable(filtered);
  }
}

function renderBatTable(rows){
  tableBody.innerHTML = "";
  rows.forEach(r=>{
    const dt = formatDateISO(r.date);
    const link = `ipl-game.html?file=${encodeURIComponent(r.file)}&i=${encodeURIComponent(r.index)}`;
    const runs = (r.batBalls || r.wasOut) ? r.batRuns : "—";
    const balls = (r.batBalls || r.wasOut) ? r.batBalls : "—";
    const sr = (r.batBalls && r.batBalls>0) ? ((r.batRuns/r.batBalls)*100).toFixed(1) : "—";
    const out = (r.batBalls || r.wasOut) ? (r.wasOut ? "Yes" : "No") : "—";

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${dt}</td>
      <td><a href="${link}">${r.match.match?.info?.teams ? r.match.match.info.teams.join(" vs ") : r.matchName}</a></td>
      <td>${r.team || "—"}</td>
      <td>${r.opp || "—"}</td>
      <td>${r.venue || "—"}</td>
      <td class="right">${runs}</td>
      <td class="right">${balls}</td>
      <td class="right">${sr}</td>
      <td class="center">${out}</td>
    `;
    tableBody.appendChild(tr);
  });
}

function renderBowlTable(rows){
  tableBody.innerHTML = "";
  rows.forEach(r=>{
    const dt = formatDateISO(r.date);
    const link = `ipl-game.html?file=${encodeURIComponent(r.file)}&i=${encodeURIComponent(r.index)}`;

    const bowled = r.bowlBalls && r.bowlBalls > 0;
    const overs = bowled ? oversFromBalls(r.bowlBalls) : "—";
    const runs = bowled ? r.bowlConceded : "—";
    const wkts = bowled ? r.bowlWkts : "—";
    const econ = bowled ? (r.bowlConceded / (r.bowlBalls/6)).toFixed(2) : "—";

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${dt}</td>
      <td><a href="${link}">${r.match.match?.info?.teams ? r.match.match.info.teams.join(" vs ") : r.matchName}</a></td>
      <td>${r.team || "—"}</td>
      <td>${r.opp || "—"}</td>
      <td>${r.venue || "—"}</td>
      <td class="right">${overs}</td>
      <td class="right">${runs}</td>
      <td class="right">${wkts}</td>
      <td class="right">${econ}</td>
    `;
    tableBody.appendChild(tr);
  });
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
</script>

</body>
</html>
