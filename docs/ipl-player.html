<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}

.page{
  max-width:1200px;
  margin:0 auto;
  padding:26px 20px 70px;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:32px 34px;
  border-radius:var(--radius);
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.eyebrow{
  display:block;
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(26px,5vw,38px);
  letter-spacing:.01em;
  text-transform:uppercase;
}

/* ── Tabs ─────────────────────────────────────────────── */
.tabs{
  display:inline-flex;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px;
  gap:4px;
  margin-top:20px;
}
.tab{
  padding:8px 18px;
  border-radius:999px;
  font-family:var(--body);
  font-weight:600;
  font-size:13px;
  color:var(--muted);
  cursor:pointer;
  user-select:none;
  transition:background .15s,color .15s;
}
.tab:hover{ color:var(--ink); }
.tab.active{
  background:var(--accent-soft);
  color:var(--ink);
}

/* ── Controls ─────────────────────────────────────────── */
.controls{
  margin-top:16px;
}
.controls select{
  padding:9px 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  font-family:var(--body);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.controls select:hover{ border-color:var(--faint); }
.controls select:focus{ outline:none;border-color:var(--accent); }

/* ── Stat cards ───────────────────────────────────────── */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin-top:20px;
}
.stat{
  background:var(--surface);
  border:1px solid var(--line);
  padding:18px;
  border-radius:14px;
  text-align:center;
}
.stat h3{
  margin:0 0 6px;
  font-family:var(--display);
  font-weight:600;
  font-size:28px;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.stat span{
  font-family:var(--display);
  font-size:11px;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--muted);
}
.stat small{
  display:block;
  margin-top:6px;
  color:var(--faint);
  font-size:12px;
}

/* ── Table ────────────────────────────────────────────── */
.table-wrap{
  margin-top:22px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  text-align:center;
  font-size:13.5px;
}

th{
  background:#f7f9fb;
  color:var(--muted);
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
}

td{
  color:#27313c;
  font-variant-numeric:tabular-nums;
}

tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f0f6ff;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="ipl.html">IPL</a>
</div>

<div class="page">

<div class="hero">
<span class="eyebrow">Cricket · IPL</span>
<h1 id="playerName">Loading…</h1>
<div class="tabs">
<div class="tab active" id="batTab">Batting</div>
<div class="tab" id="bowlTab">Bowling</div>
</div>
</div>

<div class="controls">
<select id="oppFilter">
<option value="">All Opponents</option>
</select>
</div>

<div class="stats" id="careerStats"></div>

<div class="table-wrap">
<table>
<thead>
<tr id="tableHead">
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Runs</th>
<th>Balls</th>
<th>SR</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>
</div>

</div>

<script>
(async function(){

const slug = new URLSearchParams(location.search).get("player");

function clean(n){
  return (n||"").toLowerCase().replace(/[^a-z]/g,"");
}

function slugToInitials(slug){
  return (slug || "").replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}

const nameMap = await fetch("/data/ipl/player-names.json").then(r=>r.json());

let playerName = null;
let initials = slugToInitials(slug);

for(const [shortName, fullName] of Object.entries(nameMap)){
  if(clean(shortName) === clean(initials)){
    playerName = fullName;
    initials = shortName;
    break;
  }
}

if(!playerName){
  document.getElementById("playerName").textContent = "Player not found";
  return;
}

document.getElementById("playerName").textContent = playerName;

const targetInitials = clean(initials);
const targetFullName = clean(playerName);

function playerMatches(name){
  const c = clean(name);
  return c === targetInitials || c === targetFullName;
}

const index = await fetch("/data/ipl/index.json").then(r=>r.json());

const allMatchesArrays = await Promise.all(
  index
    .filter(file => file.includes("_FULL.json"))
    .map(file => fetch("/data/ipl/" + file).then(r => r.json()))
);

let batting = [];
let bowling = [];
let opponents = new Set();

allMatchesArrays.forEach(matches=>{
  matches.forEach(match=>{
    (match.innings || []).forEach(inn=>{

      let batRuns = 0;
      let batBalls = 0;
      let batted = false;

      let bowlRuns = 0;
      let bowlBalls = 0;
      let wkts = 0;

      (inn.overs || []).forEach(over=>{
        (over.deliveries || []).forEach(d=>{

          if(playerMatches(d.batter)){
            batted = true;
            batRuns += d.runs?.batter || 0;
            if(!d.extras?.wides) batBalls++;
          }

          if(playerMatches(d.bowler)){
            bowlBalls++;
            bowlRuns += d.runs?.total || 0;
            if(Array.isArray(d.wickets)) wkts += d.wickets.length;
          }

        });
      });

      const opp = match.info?.teams?.find(t => t !== inn.team) || "";
      if(opp) opponents.add(opp);

      if(batted){
        batting.push({
          season: match.info?.season || "",
          date: match.info?.dates?.[0] || "",
          opp,
          runs: batRuns,
          balls: batBalls
        });
      }

      if(bowlBalls > 0){
        bowling.push({
          season: match.info?.season || "",
          date: match.info?.dates?.[0] || "",
          opp,
          wkts,
          runs: bowlRuns,
          balls: bowlBalls
        });
      }

    });
  });
});

batting.sort((a,b) => String(b.date).localeCompare(String(a.date)));
bowling.sort((a,b) => String(b.date).localeCompare(String(a.date)));

const filter = document.getElementById("oppFilter");
[...opponents].sort().forEach(o=>{
  const opt = document.createElement("option");
  opt.value = o;
  opt.textContent = o;
  filter.appendChild(opt);
});

let mode = "bat";

function render(){
  const opp = filter.value;

  if(mode === "bat"){
    let data = batting.slice();
    if(opp) data = data.filter(g => g.opp === opp);

    const totalRuns = data.reduce((a,b)=>a+b.runs,0);
    const totalBalls = data.reduce((a,b)=>a+b.balls,0);
    const sr = totalBalls ? (totalRuns/totalBalls*100).toFixed(1) : "0.0";
    const hsObj = data.reduce((max,g)=> g.runs > max.runs ? g : max, {runs:0, opp:""});

    document.getElementById("careerStats").innerHTML = `
      <div class="stat"><h3>${data.length}</h3><span>Games</span></div>
      <div class="stat"><h3>${totalRuns}</h3><span>Runs</span></div>
      <div class="stat"><h3>${sr}</h3><span>Strike Rate</span></div>
      <div class="stat">
        <h3>${hsObj.runs}</h3>
        <span>Highest Score</span>
        <small>vs ${hsObj.opp || ""}</small>
      </div>
    `;

    document.getElementById("tableHead").innerHTML = `
      <th>Season</th>
      <th>Date</th>
      <th>Opponent</th>
      <th>Runs</th>
      <th>Balls</th>
      <th>SR</th>
    `;

    document.getElementById("gamesTable").innerHTML = data.map(g=>{
      const rowSr = g.balls ? (g.runs/g.balls*100).toFixed(1) : "0.0";
      return `
        <tr>
          <td>${g.season}</td>
          <td>${g.date}</td>
          <td>${g.opp}</td>
          <td>${g.runs}</td>
          <td>${g.balls}</td>
          <td>${rowSr}</td>
        </tr>
      `;
    }).join("");

  } else {
    let data = bowling.slice();
    if(opp) data = data.filter(g => g.opp === opp);

    const totalWkts = data.reduce((a,b)=>a+b.wkts,0);
    const totalRuns = data.reduce((a,b)=>a+b.runs,0);

    const best = data.reduce((best,g)=>{
      if(g.wkts > best.wkts) return g;
      if(g.wkts === best.wkts && g.wkts > 0 && g.runs < best.runs) return g;
      return best;
    }, {wkts:0, runs:999999, opp:""});

    const bestLabel = best.wkts > 0 ? `${best.wkts}/${best.runs}` : "0/0";

    document.getElementById("careerStats").innerHTML = `
      <div class="stat"><h3>${data.length}</h3><span>Games</span></div>
      <div class="stat"><h3>${totalWkts}</h3><span>Wickets</span></div>
      <div class="stat"><h3>${totalRuns}</h3><span>Runs Conceded</span></div>
      <div class="stat">
        <h3>${bestLabel}</h3>
        <span>Best Bowling</span>
        <small>vs ${best.opp || ""}</small>
      </div>
    `;

    document.getElementById("tableHead").innerHTML = `
      <th>Season</th>
      <th>Date</th>
      <th>Opponent</th>
      <th>Wkts</th>
      <th>Runs</th>
      <th>Balls</th>
    `;

    document.getElementById("gamesTable").innerHTML = data.map(g=>`
      <tr>
        <td>${g.season}</td>
        <td>${g.date}</td>
        <td>${g.opp}</td>
        <td>${g.wkts}</td>
        <td>${g.runs}</td>
        <td>${g.balls}</td>
      </tr>
    `).join("");
  }
}

document.getElementById("batTab").onclick = () => {
  mode = "bat";
  document.getElementById("batTab").classList.add("active");
  document.getElementById("bowlTab").classList.remove("active");
  render();
};

document.getElementById("bowlTab").onclick = () => {
  mode = "bowl";
  document.getElementById("bowlTab").classList.add("active");
  document.getElementById("batTab").classList.remove("active");
  render();
};

filter.onchange = render;

render();

})();
</script>

</body>
</html>
