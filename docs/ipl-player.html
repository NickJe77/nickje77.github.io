<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f6f7f9;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page{max-width:1200px;margin:30px auto;padding:0 20px;}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px;
  border-radius:24px;
}
.hero h1{margin:0;font-size:38px;}
.hero p{margin-top:8px;font-size:18px;opacity:.9;}

.controls{
  margin:20px 0;
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
select,button{
  padding:8px 12px;
  font-size:16px;
  border-radius:8px;
}
.tab-btn{
  border:1px solid #bbb;
  background:#fff;
  cursor:pointer;
}
.tab-btn.active{
  background:#3b007a;
  color:#fff;
  border-color:#3b007a;
}

.section-title{
  margin:30px 0 10px;
  font-weight:700;
  color:#555;
  text-align:center;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}
.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
}
.stat h3{margin:0;font-size:28px;}
.stat span{font-size:14px;color:#666;}

.table-wrap{
  margin-top:30px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}
table{width:100%;border-collapse:collapse;}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:center;}
th{background:#f1f4f8;}
td:nth-child(3),td:nth-child(4){text-align:left;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="ipl.html">IPL</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="playerName">Loading…</h1>
  <p>IPL batting & bowling performance by opposition</p>
</div>

<div class="controls">
  Opposition:
  <select id="oppSelect"></select>

  <button class="tab-btn" id="batBtn">Batting</button>
  <button class="tab-btn" id="bowlBtn">Bowling</button>
</div>

<div class="section-title">CAREER SUMMARY</div>
<div class="stats" id="careerStats"></div>

<div class="section-title" id="vsTitle">VS OPPOSITION</div>
<div class="stats" id="vsStats"></div>

<div class="table-wrap">
<table>
<thead id="tableHead"></thead>
<tbody id="gamesTable"></tbody>
</table>
</div>

</div>

<script>
(async function(){

const params = new URLSearchParams(location.search);
const player = params.get("player");

if(!player){
  document.getElementById("playerName").textContent="No player specified";
  return;
}

document.getElementById("playerName").textContent = player;

const P = player.toLowerCase();

let battingGames=[];
let bowlingGames=[];
let currentTab="bat";

/* ---------- LOAD IPL INDEX ---------- */

const raw = await fetch("data/ipl/index.json").then(r=>r.json());

const index = Array.isArray(raw)
  ? raw
  : typeof raw==="string"
    ? raw.split(",").map(s=>s.trim())
    : raw.files || [];

/* ---------- DISMISSAL FORMAT ---------- */

function abbrOut(kind){
  if(!kind) return "not out";
  const k=kind.toLowerCase();
  if(k==="caught") return "c";
  if(k==="bowled") return "b";
  if(k==="lbw") return "lbw";
  if(k==="caught and bowled") return "c&b";
  if(k==="run out") return "ro";
  return k;
}

/* ---------- LOAD ALL MATCHES ---------- */

for(const file of index){

  if(!file.includes("_FULL.json")) continue;

  const rawData = await fetch("data/ipl/"+file).then(r=>r.json());

  const matches =
    Array.isArray(rawData)
      ? rawData
      : rawData.matches || rawData.games || [];

  matches.forEach(match=>{

    match.innings.forEach(inn=>{

      let batRuns=0,batBalls=0,batOut="not out",batted=false;
      let bowlBalls=0,bowlRuns=0,bowlWkts=0;

      inn.overs.forEach(o=>{

        o.deliveries.forEach(d=>{

          if(d.batter?.toLowerCase()===P){
            batted=true;
            batRuns+=d.runs.batter;
            if(!d.extras?.wides) batBalls++;
          }

          if(d.bowler?.toLowerCase()===P){
            bowlBalls++;
            if(!d.extras?.byes && !d.extras?.legbyes)
              bowlRuns+=d.runs.total;
          }

          d.wickets?.forEach(w=>{

            if(w.player_out?.toLowerCase()===P)
              batOut=abbrOut(w.kind);

            if(w.bowler?.toLowerCase()===P)
              bowlWkts++;

          });

        });

      });

      const opponent =
        match.info.teams.find(t=>t!==inn.team);

      if(batted){
        battingGames.push({
          season:match.info.season,
          date:match.info.dates[0],
          opp:opponent,
          venue:match.info.venue,
          r:batRuns,
          b:batBalls,
          sr:batBalls?((batRuns/batBalls)*100).toFixed(1):"—",
          out:batOut
        });
      }

      if(bowlBalls){
        bowlingGames.push({
          season:match.info.season,
          date:match.info.dates[0],
          opp:opponent,
          venue:match.info.venue,
          o:(bowlBalls/6).toFixed(1),
          balls:bowlBalls,
          r:bowlRuns,
          w:bowlWkts,
          econ:((bowlRuns/(bowlBalls/6))).toFixed(2)
        });
      }

    });

  });

}

/* ---------- AUTO TAB ---------- */

const totalBowlBalls =
  bowlingGames.reduce((a,b)=>a+b.balls,0);

if(totalBowlBalls>=30){
  currentTab="bowl";
  bowlBtn.classList.add("active");
}else{
  batBtn.classList.add("active");
}

/* ---------- OPPONENT SELECT ---------- */

const oppSel=document.getElementById("oppSelect");

["All",
 ...new Set([...battingGames,...bowlingGames].map(g=>g.opp))
].forEach(o=>{

  const opt=document.createElement("option");
  opt.value=o;
  opt.textContent=o;
  oppSel.appendChild(opt);

});

/* ---------- STAT FUNCTIONS ---------- */

function batStats(list){

  const runs=list.reduce((a,b)=>a+b.r,0);

  const balls=list.reduce((a,b)=>a+b.b,0);

  const outs=list.filter(g=>g.out!=="not out").length;

  return{
    m:list.length,
    r:runs,
    a:outs?(runs/outs).toFixed(2):"—",
    s:balls?((runs/balls)*100).toFixed(1):"—",
    h:list.length?Math.max(...list.map(g=>g.r)):"—"
  };
}

function bowlStats(list){

  const balls=list.reduce((a,b)=>a+b.balls,0);

  const runs=list.reduce((a,b)=>a+b.r,0);

  const wkts=list.reduce((a,b)=>a+b.w,0);

  const five=list.filter(g=>g.w>=5).length;

  const best=list.reduce((best,g)=>{

    if(!best) return g;

    if(g.w>best.w || (g.w===best.w && g.r<best.r))
      return g;

    return best;

  },null);

  return{
    m:list.length,
    o:(balls/6).toFixed(1),
    w:wkts,
    a:wkts?(runs/wkts).toFixed(2):"—",
    e:balls?((runs/(balls/6))).toFixed(2):"—",
    f:five,
    bf:best?`${best.w}/${best.r}`:"—"
  };
}

/* ---------- RENDER ---------- */

function render(){

  const opp=oppSel.value;

  const all =
    currentTab==="bat"
      ? battingGames
      : bowlingGames;

  const list =
    opp==="All"
      ? all
      : all.filter(g=>g.opp===opp);

  vsTitle.textContent =
    opp==="All"
      ? "VS OPPOSITION"
      : "VS "+opp.toUpperCase();

/* BAT */

if(currentTab==="bat"){

const c=batStats(battingGames);
const v=batStats(list);

careerStats.innerHTML=`
<div class="stat"><h3>${c.m}</h3><span>Matches</span></div>
<div class="stat"><h3>${c.r}</h3><span>Runs</span></div>
<div class="stat"><h3>${c.a}</h3><span>Average</span></div>
<div class="stat"><h3>${c.s}</h3><span>Strike Rate</span></div>
<div class="stat"><h3>${c.h}</h3><span>High Score</span></div>
`;

vsStats.innerHTML=`
<div class="stat"><h3>${v.m}</h3><span>Matches</span></div>
<div class="stat"><h3>${v.r}</h3><span>Runs</span></div>
<div class="stat"><h3>${v.a}</h3><span>Average</span></div>
<div class="stat"><h3>${v.s}</h3><span>Strike Rate</span></div>
<div class="stat"><h3>${v.h}</h3><span>High Score</span></div>
`;

tableHead.innerHTML=`
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>R</th>
<th>B</th>
<th>SR</th>
<th>Out</th>
</tr>`;

gamesTable.innerHTML=list.map(g=>`
<tr>
<td>${g.season}</td>
<td>${g.date}</td>
<td>${g.opp}</td>
<td>${g.venue}</td>
<td>${g.r}</td>
<td>${g.b}</td>
<td>${g.sr}</td>
<td>${g.out}</td>
</tr>`).join("");

}

/* BOWL */

else{

const c=bowlStats(bowlingGames);
const v=bowlStats(list);

careerStats.innerHTML=`
<div class="stat"><h3>${c.m}</h3><span>Matches</span></div>
<div class="stat"><h3>${c.o}</h3><span>Overs</span></div>
<div class="stat"><h3>${c.w}</h3><span>Wickets</span></div>
<div class="stat"><h3>${c.a}</h3><span>Average</span></div>
<div class="stat"><h3>${c.e}</h3><span>Economy</span></div>
<div class="stat"><h3>${c.f}</h3><span>5-fors</span></div>
<div class="stat"><h3>${c.bf}</h3><span>Best</span></div>
`;

vsStats.innerHTML=`
<div class="stat"><h3>${v.m}</h3><span>Matches</span></div>
<div class="stat"><h3>${v.o}</h3><span>Overs</span></div>
<div class="stat"><h3>${v.w}</h3><span>Wickets</span></div>
<div class="stat"><h3>${v.a}</h3><span>Average</span></div>
<div class="stat"><h3>${v.e}</h3><span>Economy</span></div>
<div class="stat"><h3>${v.f}</h3><span>5-fors</span></div>
<div class="stat"><h3>${v.bf}</h3><span>Best</span></div>
`;

tableHead.innerHTML=`
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>O</th>
<th>R</th>
<th>W</th>
<th>Econ</th>
</tr>`;

gamesTable.innerHTML=list.map(g=>`
<tr>
<td>${g.season}</td>
<td>${g.date}</td>
<td>${g.opp}</td>
<td>${g.venue}</td>
<td>${g.o}</td>
<td>${g.r}</td>
<td>${g.w}</td>
<td>${g.econ}</td>
</tr>`).join("");

}

}

batBtn.onclick=()=>{
currentTab="bat";
batBtn.classList.add("active");
bowlBtn.classList.remove("active");
render();
};

bowlBtn.onclick=()=>{
currentTab="bowl";
bowlBtn.classList.add("active");
batBtn.classList.remove("active");
render();
};

oppSel.onchange=render;

render();

})();
</script>

</body>
</html>
