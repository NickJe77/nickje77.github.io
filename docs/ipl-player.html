<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui;margin:0;background:#fff}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;font-weight:600}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px}
.hero{background:linear-gradient(90deg,#3b007a,#7b2cbf);color:#fff;padding:40px;border-radius:24px;margin-bottom:20px}
.hero h1{margin:0;font-size:46px}
.hero p{margin-top:10px;font-size:20px;opacity:.95}

input,select{
  padding:10px 14px;
  font-size:16px;
  border-radius:12px;
  border:1px solid #ccc;
  width:100%;
  max-width:420px;
  margin-top:14px;
}

.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}
.summary-box{border:1px solid #ddd;border-radius:14px;padding:10px;background:#faf7ff}
.summary-box strong{display:block;font-size:14px}
.summary-box span{font-size:18px;font-weight:600}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #ddd;padding:8px 10px;text-align:left}
th{background:#f3f6fb}
tr:nth-child(even){background:#f8fbff}
a{color:#3b007a;font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="ipl-player.html">IPL Players</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="playerName">Search IPL Player</h1>
  <p>Career summary and match list.</p>

  <input id="playerSearch" placeholder="Type player name...">
  <select id="playerSelect" size="6"></select>
</div>

<div class="summary-grid">
  <div class="summary-box"><strong>Matches</strong><span id="matchesBox">—</span></div>
  <div class="summary-box"><strong>Runs</strong><span id="runsBox">—</span></div>
  <div class="summary-box"><strong>Wickets</strong><span id="wicketsBox">—</span></div>
  <div class="summary-box"><strong>Strike Rate</strong><span id="srBox">—</span></div>
  <div class="summary-box"><strong>Average</strong><span id="avgBox">—</span></div>
</div>

<h2>Matches</h2>
<table>
<thead>
<tr>
  <th>Date</th>
  <th>Match</th>
  <th>Team</th>
  <th>Opposition</th>
  <th>Venue</th>
  <th>Bat</th>
  <th>Bowl</th>
</tr>
</thead>
<tbody id="matchesTable"></tbody>
</table>

</div>

<script>
const indexUrl="data/ipl/index.json";
const basePath="data/ipl/";
const namesUrl="data/ipl/player-names.json";

const playerSearch=document.getElementById("playerSearch");
const playerSelect=document.getElementById("playerSelect");
const playerNameEl=document.getElementById("playerName");
const tableBody=document.getElementById("matchesTable");

const matchesBox=document.getElementById("matchesBox");
const runsBox=document.getElementById("runsBox");
const wicketsBox=document.getElementById("wicketsBox");
const srBox=document.getElementById("srBox");
const avgBox=document.getElementById("avgBox");

let nameMap={}, allMatches=[], allPlayers=[];

Promise.all([
 fetch(namesUrl).then(r=>r.json()),
 fetch(indexUrl).then(r=>r.json())
]).then(([names,files])=>{
 nameMap=names;
 return Promise.all(
  files.filter(f=>f.includes("_FULL.json"))
   .map(f=>fetch(basePath+f).then(r=>r.json()).then(data=>({file:f,data})))
 );
}).then(seasons=>{
 const set=new Set();
 seasons.forEach(season=>{
  season.data.forEach((match,i)=>{
   allMatches.push({match,file:season.file,index:i});
   let inns=Array.isArray(match.innings)?match.innings:Object.values(match.innings);
   inns.forEach(inn=>{
    inn.overs?.forEach(o=>{
     o.deliveries?.forEach(d=>{
      if(d.batter) set.add(d.batter);
      if(d.bowler) set.add(d.bowler);
     });
    });
   });
  });
 });
 allPlayers=[...set].sort();
 renderDropdown("");
});

playerSearch.addEventListener("input",()=>{
 renderDropdown(playerSearch.value);
});

playerSelect.addEventListener("change",()=>{
 const p=playerSelect.value;
 if(p) loadPlayer(p);
});

function renderDropdown(filter){
 const term=filter.toLowerCase();
 playerSelect.innerHTML="";
 allPlayers
  .filter(p=>(nameMap[p]||p).toLowerCase().includes(term))
  .forEach(p=>{
   const opt=document.createElement("option");
   opt.value=p;
   opt.textContent=nameMap[p]||p;
   playerSelect.appendChild(opt);
  });
}

function loadPlayer(player){
 let rows=[],matches=0,runs=0,balls=0,wkts=0,outs=0;

 allMatches.forEach(obj=>{
  const match=obj.match;
  let batRuns=0,batBalls=0,bowlWkts=0,bowlRuns=0,wasOut=false;
  let team="—",opp="—";

  let inns=Array.isArray(match.innings)?match.innings:Object.values(match.innings);
  inns.forEach(inn=>{
   const batTeam=inn.team;
   const bowlTeam=match.info.teams.find(t=>t!==batTeam);
   inn.overs?.forEach(o=>{
    o.deliveries?.forEach(d=>{
     if(d.batter===player){batRuns+=d.runs.batter;batBalls++;team=batTeam;opp=bowlTeam}
     if(d.bowler===player){bowlRuns+=d.runs.total;bowlWkts+=d.wickets?.length||0}
     if(d.wickets)d.wickets.forEach(w=>{if(w.player_out===player)wasOut=true});
    });
   });
  });

  if(batRuns||bowlWkts){
   matches++;runs+=batRuns;balls+=batBalls;wkts+=bowlWkts;if(wasOut)outs++;
   rows.push({...obj,batRuns,batBalls,bowlWkts,bowlRuns,team,opp});
  }
 });

 playerNameEl.textContent=nameMap[player]||player;
 matchesBox.textContent=matches;
 runsBox.textContent=runs;
 wicketsBox.textContent=wkts;
 srBox.textContent=balls?((runs/balls)*100).toFixed(1):"—";
 avgBox.textContent=outs?(runs/outs).toFixed(2):"—";

 tableBody.innerHTML="";
 rows.forEach(m=>{
  tableBody.innerHTML+=`
   <tr>
    <td>${new Date(m.match.info.dates[0]).toLocaleDateString()}</td>
    <td><a href="ipl-game.html?file=${m.file}&i=${m.index}">${m.match.info.teams.join(" vs ")}</a></td>
    <td>${m.team}</td>
    <td>${m.opp}</td>
    <td>${m.match.info.venue||"—"}</td>
    <td>${m.batRuns||"—"}</td>
    <td>${m.bowlWkts?m.bowlWkts+"/"+m.bowlRuns:"—"}</td>
   </tr>`;
 });
}
</script>
</body>
</html>
