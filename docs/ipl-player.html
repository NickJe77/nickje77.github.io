<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f6f7f9;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px;
  border-radius:24px;
}

.hero h1{
  margin:0;
  font-size:38px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.tab{
  padding:10px 16px;
  background:#eee;
  border-radius:10px;
  cursor:pointer;
}

.tab.active{
  background:#0056d6;
  color:#fff;
}

.controls{
  margin-top:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
  margin-top:20px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
}

.table-wrap{
  margin-top:30px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{background:#f1f4f8;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="ipl.html">IPL</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading…</h1>
</div>

<div class="tabs">
<div class="tab active" id="batTab">Batting</div>
<div class="tab" id="bowlTab">Bowling</div>
</div>

<div class="controls">
<select id="oppFilter">
<option value="">All Opponents</option>
</select>
</div>

<div class="stats" id="careerStats"></div>

<div class="table-wrap">
<table>
<thead id="thead"></thead>
<tbody id="gamesTable"></tbody>
</table>
</div>

</div>

<script>
(async function(){

const slug = new URLSearchParams(location.search).get("player");

function clean(n){
  return (n||"").toLowerCase().replace(/[^a-z]/g,"");
}

function slugToInitials(slug){
  return slug.replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}

// LOAD NAME MAP
const nameMap = await fetch("/data/ipl/player-names.json").then(r=>r.json());

let playerName=null;
let initials = slugToInitials(slug);

for(const [shortName, fullName] of Object.entries(nameMap)){
  if(clean(shortName) === clean(initials)){
    playerName = fullName;
    initials = shortName;
    break;
  }
}

if(!playerName){
  document.getElementById("playerName").textContent="Player not found";
  return;
}

document.getElementById("playerName").textContent = playerName;

const target = clean(initials);

// LOAD INDEX
const index = await fetch("/data/ipl/index.json").then(r=>r.json());

// LOAD ALL MATCHES FAST
const matchData = await Promise.all(
  index.filter(f=>f.includes("_FULL.json"))
       .map(f=>fetch("/data/ipl/"+f).then(r=>r.json()))
);

let batting=[], bowling=[], opponents=new Set();

matchData.forEach(matches=>{
  matches.forEach(match=>{
    match.innings.forEach(inn=>{

      let batRuns=0, batBalls=0, played=false;
      let bowlRuns=0, bowlBalls=0, wkts=0;

      inn.overs.forEach(o=>{
        o.deliveries.forEach(d=>{

          // batting
          if(clean(d.batter) === target){
            played=true;
            batRuns+=d.runs.batter || 0;
            if(!d.extras?.wides) batBalls++;
          }

          // bowling
          if(clean(d.bowler) === target){
            bowlRuns+=d.runs.total || 0;
            bowlBalls++;
            if(d.wickets) wkts+=d.wickets.length;
          }

        });
      });

      const opp = match.info.teams.find(t=>t!==inn.team);
      opponents.add(opp);

      if(played){
        batting.push({
          season:match.info.season,
          date:match.info.dates?.[0],
          opp,
          runs:batRuns,
          balls:batBalls
        });
      }

      if(bowlBalls){
        bowling.push({
          season:match.info.season,
          date:match.info.dates?.[0],
          opp,
          runs:bowlRuns,
          balls:bowlBalls,
          wkts
        });
      }

    });
  });
});

// BUILD FILTER
const filter=document.getElementById("oppFilter");
[...opponents].sort().forEach(o=>{
  const opt=document.createElement("option");
  opt.value=o;
  opt.textContent=o;
  filter.appendChild(opt);
});

let mode="bat";

function render(){

  let data = mode==="bat" ? batting : bowling;
  const opp = filter.value;

  if(opp) data = data.filter(g=>g.opp===opp);

  if(mode==="bat"){

    document.getElementById("thead").innerHTML=`
    <tr>
    <th>Season</th><th>Date</th><th>Opponent</th>
    <th>Runs</th><th>Balls</th><th>SR</th>
    </tr>`;

    document.getElementById("gamesTable").innerHTML =
    data.map(g=>{
      const sr = g.balls ? (g.runs/g.balls*100).toFixed(1) : 0;
      return `
      <tr>
      <td>${g.season}</td>
      <td>${g.date}</td>
      <td>${g.opp}</td>
      <td>${g.runs}</td>
      <td>${g.balls}</td>
      <td>${sr}</td>
      </tr>`;
    }).join("");

  } else {

    document.getElementById("thead").innerHTML=`
    <tr>
    <th>Season</th><th>Date</th><th>Opponent</th>
    <th>Wkts</th><th>Runs</th>
    </tr>`;

    document.getElementById("gamesTable").innerHTML =
    data.map(g=>`
      <tr>
      <td>${g.season}</td>
      <td>${g.date}</td>
      <td>${g.opp}</td>
      <td>${g.wkts}</td>
      <td>${g.runs}</td>
      </tr>
    `).join("");
  }
}

// EVENTS
document.getElementById("batTab").onclick=()=>{
  mode="bat";
  document.getElementById("batTab").classList.add("active");
  document.getElementById("bowlTab").classList.remove("active");
  render();
};

document.getElementById("bowlTab").onclick=()=>{
  mode="bowl";
  document.getElementById("bowlTab").classList.add("active");
  document.getElementById("batTab").classList.remove("active");
  render();
};

filter.onchange = render;

// INIT
render();

})();
</script>

</body>
</html>
