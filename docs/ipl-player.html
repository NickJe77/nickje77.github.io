<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f6f7f9;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px;
  border-radius:24px;
}
.hero h1{
  margin:0;
  font-size:38px;
}

.tabs{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.tab{
  padding:10px 16px;
  background:#eee;
  border-radius:10px;
  cursor:pointer;
  user-select:none;
}

.tab.active{
  background:#0056d6;
  color:#fff;
}

.controls{
  margin-top:20px;
}

.controls select{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #ccc;
  background:#fff;
  font-size:16px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
  margin-top:20px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
}

.stat h3{
  margin:0 0 6px;
  font-size:30px;
}

.table-wrap{
  margin-top:30px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

th{
  background:#f1f4f8;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="ipl.html">IPL</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading…</h1>
</div>

<div class="tabs">
  <div class="tab active" id="batTab">Batting</div>
  <div class="tab" id="bowlTab">Bowling</div>
</div>

<div class="controls">
  <select id="oppFilter">
    <option value="">All Opponents</option>
  </select>
</div>

<div class="stats" id="careerStats"></div>

<div class="table-wrap">
<table>
<thead>
<tr id="tableHead">
  <th>Season</th>
  <th>Date</th>
  <th>Opponent</th>
  <th>Runs</th>
  <th>Balls</th>
  <th>SR</th>
</tr>
</thead>
<tbody id="gamesTable"></tbody>
</table>
</div>

</div>

<script>
(async function(){

const slug = new URLSearchParams(location.search).get("player");

if(!slug){
  document.getElementById("playerName").textContent = "No player specified";
  return;
}

function clean(n){
  return (n || "").toLowerCase().replace(/[^a-z]/g, "");
}

function slugToInitials(value){
  return (value || "")
    .replace(/-/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

const nameMap = await fetch("/data/ipl/player-names.json").then(r => r.json());

let playerName = null;
let initials = slugToInitials(slug);

for(const [shortName, fullName] of Object.entries(nameMap)){
  if(clean(shortName) === clean(initials)){
    playerName = fullName;
    initials = shortName;
    break;
  }
}

if(!playerName){
  document.getElementById("playerName").textContent = "Player not found";
  return;
}

document.getElementById("playerName").textContent = playerName;

const targetInitials = clean(initials);
const targetFullName = clean(playerName);

const index = await fetch("/data/ipl/index.json").then(r => r.json());

const allMatchesArrays = await Promise.all(
  index
    .filter(file => file.includes("_FULL.json"))
    .map(file => fetch("/data/ipl/" + file).then(r => r.json()))
);

let batting = [];
let bowling = [];
let opponents = new Set();

function playerMatchesName(name){
  const c = clean(name);
  return c === targetInitials || c === targetFullName;
}

allMatchesArrays.forEach(matches => {
  matches.forEach(match => {
    (match.innings || []).forEach(inn => {

      let batRuns = 0;
      let batBalls = 0;
      let batted = false;

      let bowlRuns = 0;
      let bowlBalls = 0;
      let wkts = 0;

      (inn.overs || []).forEach(over => {
        (over.deliveries || []).forEach(d => {

          if(playerMatchesName(d.batter)){
            batted = true;
            batRuns += (d.runs && typeof d.runs.batter === "number") ? d.runs.batter : 0;
            if(!(d.extras && d.extras.wides)) batBalls++;
          }

          if(playerMatchesName(d.bowler)){
            bowlBalls++;
            bowlRuns += (d.runs && typeof d.runs.total === "number") ? d.runs.total : 0;

            if(Array.isArray(d.wickets)){
              wkts += d.wickets.length;
            }
          }

        });
      });

      const opp = (match.info && Array.isArray(match.info.teams))
        ? match.info.teams.find(t => t !== inn.team) || ""
        : "";

      if(opp) opponents.add(opp);

      if(batted){
        batting.push({
          season: match.info?.season || "",
          date: match.info?.dates?.[0] || "",
          opp,
          runs: batRuns,
          balls: batBalls
        });
      }

      if(bowlBalls > 0){
        bowling.push({
          season: match.info?.season || "",
          date: match.info?.dates?.[0] || "",
          opp,
          wkts,
          runs: bowlRuns,
          balls: bowlBalls
        });
      }

    });
  });
});

batting.sort((a,b) => String(b.date).localeCompare(String(a.date)));
bowling.sort((a,b) => String(b.date).localeCompare(String(a.date)));

const oppFilter = document.getElementById("oppFilter");
[...opponents].sort().forEach(opp => {
  const opt = document.createElement("option");
  opt.value = opp;
  opt.textContent = opp;
  oppFilter.appendChild(opt);
});

let mode = "bat";

function renderStatsAndTable(){
  const selectedOpp = oppFilter.value;

  if(mode === "bat"){
    let data = batting.slice();
    if(selectedOpp) data = data.filter(g => g.opp === selectedOpp);

    const totalRuns = data.reduce((a,b) => a + b.runs, 0);
    const totalBalls = data.reduce((a,b) => a + b.balls, 0);
    const strikeRate = totalBalls ? (totalRuns / totalBalls * 100).toFixed(1) : "0.0";
    const highestScore = data.length ? Math.max(...data.map(g => g.runs)) : 0;

    document.getElementById("careerStats").innerHTML = `
      <div class="stat"><h3>${data.length}</h3><span>Games</span></div>
      <div class="stat"><h3>${totalRuns}</h3><span>Runs</span></div>
      <div class="stat"><h3>${totalBalls}</h3><span>Balls</span></div>
      <div class="stat"><h3>${strikeRate}</h3><span>Strike Rate</span></div>
      <div class="stat"><h3>${highestScore}</h3><span>Highest Score</span></div>
    `;

    document.getElementById("tableHead").innerHTML = `
      <th>Season</th>
      <th>Date</th>
      <th>Opponent</th>
      <th>Runs</th>
      <th>Balls</th>
      <th>SR</th>
    `;

    document.getElementById("gamesTable").innerHTML = data.map(g => {
      const sr = g.balls ? (g.runs / g.balls * 100).toFixed(1) : "0.0";
      return `
        <tr>
          <td>${g.season}</td>
          <td>${g.date}</td>
          <td>${g.opp}</td>
          <td>${g.runs}</td>
          <td>${g.balls}</td>
          <td>${sr}</td>
        </tr>
      `;
    }).join("");
  } else {
    let data = bowling.slice();
    if(selectedOpp) data = data.filter(g => g.opp === selectedOpp);

    const matches = data.length;
    const totalWkts = data.reduce((a,b) => a + b.wkts, 0);
    const totalRunsConceded = data.reduce((a,b) => a + b.runs, 0);

    let bestWkts = 0;
    let bestRuns = 0;

    data.forEach(g => {
      if(
        g.wkts > bestWkts ||
        (g.wkts === bestWkts && g.wkts > 0 && g.runs < bestRuns)
      ){
        bestWkts = g.wkts;
        bestRuns = g.runs;
      }
    });

    const bestBowling = bestWkts > 0 ? `${bestWkts}/${bestRuns}` : "0/0";

    document.getElementById("careerStats").innerHTML = `
      <div class="stat"><h3>${matches}</h3><span>Games</span></div>
      <div class="stat"><h3>${totalWkts}</h3><span>Wickets</span></div>
      <div class="stat"><h3>${totalRunsConceded}</h3><span>Runs Conceded</span></div>
      <div class="stat"><h3>${bestBowling}</h3><span>Best Bowling</span></div>
    `;

    document.getElementById("tableHead").innerHTML = `
      <th>Season</th>
      <th>Date</th>
      <th>Opponent</th>
      <th>Wkts</th>
      <th>Runs</th>
      <th>Balls</th>
    `;

    document.getElementById("gamesTable").innerHTML = data.map(g => `
      <tr>
        <td>${g.season}</td>
        <td>${g.date}</td>
        <td>${g.opp}</td>
        <td>${g.wkts}</td>
        <td>${g.runs}</td>
        <td>${g.balls}</td>
      </tr>
    `).join("");
  }
}

document.getElementById("batTab").onclick = () => {
  mode = "bat";
  document.getElementById("batTab").classList.add("active");
  document.getElementById("bowlTab").classList.remove("active");
  renderStatsAndTable();
};

document.getElementById("bowlTab").onclick = () => {
  mode = "bowl";
  document.getElementById("bowlTab").classList.add("active");
  document.getElementById("batTab").classList.remove("active");
  renderStatsAndTable();
};

oppFilter.onchange = renderStatsAndTable;

renderStatsAndTable();

})();
</script>

</body>
</html>
