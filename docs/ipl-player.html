<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Inter, system-ui, Arial, sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#3b007a,#7b2cbf);
  color:white;
  padding:40px 50px;
  border-radius:24px;
  margin-bottom:20px;
}
.hero h1{margin:0;font-size:46px;}
.hero p{margin-top:10px;font-size:20px;opacity:0.95;}

select{
  padding:8px 12px;
  font-size:15px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:12px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-bottom:28px;
}

.summary-box{
  border:1px solid #ddd;
  border-radius:14px;
  padding:10px 12px;
  background:#faf7ff;
}
.summary-box strong{
  display:block;
  margin-bottom:4px;
  font-size:14px;
}
.summary-box span{
  font-size:18px;
  font-weight:600;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
}
th{
  background:#f3f6fb;
  cursor:pointer;
}
th.sort-active{
  color:#3b007a;
  text-decoration:underline;
}
tr:nth-child(even){background:#f8fbff;}
a{color:#3b007a;text-decoration:none;font-weight:600;}
a:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <h1 id="playerName">Select an IPL Player</h1>
  <p>Career summary and match list.</p>
  <select id="playerSelect">
    <option value="">— Select Player —</option>
  </select>
</div>

<div class="summary-grid">
  <div class="summary-box"><strong>Matches</strong><span id="matchesBox">—</span></div>
  <div class="summary-box"><strong>Runs</strong><span id="runsBox">—</span></div>
  <div class="summary-box"><strong>Wickets</strong><span id="wicketsBox">—</span></div>
  <div class="summary-box"><strong>Strike Rate</strong><span id="srBox">—</span></div>
  <div class="summary-box"><strong>Average</strong><span id="avgBox">—</span></div>
  <div class="summary-box"><strong>50s</strong><span id="fiftiesBox">—</span></div>
  <div class="summary-box"><strong>100s</strong><span id="hundredsBox">—</span></div>
  <div class="summary-box"><strong>Economy</strong><span id="econBox">—</span></div>
  <div class="summary-box"><strong>Best Score</strong><span id="bestScoreBox">—</span></div>
  <div class="summary-box"><strong>Best Bowling</strong><span id="bestBowlBox">—</span></div>
</div>

<h2>Matches</h2>
<table>
<thead>
<tr>
  <th id="dateHeader">Date</th>
  <th>Match</th>
  <th>Team</th>
  <th>Opposition</th>
  <th>Venue</th>
  <th id="batHeader">Bat</th>
  <th id="bowlHeader">Bowl</th>
</tr>
</thead>
<tbody id="matchesTable"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
let playerParam = params.get("player");

const indexUrl = "data/ipl/index.json";
const basePath = "data/ipl/";
const namesUrl = "data/ipl/player-names.json";

const playerNameEl = document.getElementById("playerName");
const matchesBox = document.getElementById("matchesBox");
const runsBox = document.getElementById("runsBox");
const wicketsBox = document.getElementById("wicketsBox");
const srBox = document.getElementById("srBox");
const avgBox = document.getElementById("avgBox");
const fiftiesBox = document.getElementById("fiftiesBox");
const hundredsBox = document.getElementById("hundredsBox");
const econBox = document.getElementById("econBox");
const bestScoreBox = document.getElementById("bestScoreBox");
const bestBowlBox = document.getElementById("bestBowlBox");

const tableBody = document.getElementById("matchesTable");
const playerSelect = document.getElementById("playerSelect");

const batHeader = document.getElementById("batHeader");
const bowlHeader = document.getElementById("bowlHeader");
const dateHeader = document.getElementById("dateHeader");

let allMatches = [];
let nameMap = {};
let allPlayers = [];
let matchRows = [];
let sortMode = "date";

Promise.all([
  fetch(namesUrl).then(r=>r.json()),
  fetch(indexUrl).then(r=>r.json())
])
.then(([names, files])=>{
  nameMap = names;
  const fullFiles = files.filter(f => f.includes("_FULL.json"));
  return Promise.all(fullFiles.map(f=>fetch(basePath+f).then(r=>r.json())));
})
.then(seasons=>{
  const playerSet = new Set();

  seasons.forEach(season=>{
    season.forEach(match=>{
      allMatches.push(match);

      let inningsList = Array.isArray(match.innings) ? match.innings : Object.values(match.innings);

      inningsList.forEach(inn=>{
        inn.overs?.forEach(over=>{
          over.deliveries?.forEach(d=>{
            if(d.batter) playerSet.add(d.batter);
            if(d.bowler) playerSet.add(d.bowler);
          });
        });
      });
    });
  });

  allPlayers = Array.from(playerSet).sort();
  buildDropdown(allPlayers);

  if(playerParam){
    playerSelect.value = playerParam;
    loadPlayer(playerParam);
  }

  playerSelect.addEventListener("change", ()=>{
    const p = playerSelect.value;
    if(p){
      window.location.href = "ipl-player.html?player=" + encodeURIComponent(p);
    }
  });

  batHeader.addEventListener("click", ()=>{
    sortMode = sortMode === "bat" ? "date" : "bat";
    renderTable();
  });

  bowlHeader.addEventListener("click", ()=>{
    sortMode = sortMode === "bowl" ? "date" : "bowl";
    renderTable();
  });

  dateHeader.addEventListener("click", ()=>{
    sortMode = "date";
    renderTable();
  });
});

function buildDropdown(list){
  playerSelect.innerHTML = `<option value="">— Select Player —</option>`;
  list.forEach(p=>{
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = nameMap[p] || p;
    playerSelect.appendChild(opt);
  });
}

function loadPlayer(player){
  let matches = 0, runs = 0, balls = 0, wkts = 0, outs = 0;
  let fifties = 0, hundreds = 0;
  let bestScore = 0, bestBowlWkts = 0, bestBowlRuns = 999;
  let bowlBalls = 0;

  matchRows = [];

  allMatches.forEach(match=>{
    let batRuns = 0, batBalls = 0, bowlWkts = 0, bowlRuns = 0, wasOut = false;
    let team = "—", opp = "—";

    let inningsList = Array.isArray(match.innings) ? match.innings : Object.values(match.innings);

    inningsList.forEach(inn=>{
      const battingTeam = inn.team;
      const teams = match.info.teams;
      const bowlingTeam = teams.find(t=>t !== battingTeam);

      inn.overs?.forEach(over=>{
        over.deliveries?.forEach(d=>{
          if(d.batter === player){
            batRuns += d.runs.batter;
            if(!d.extras?.wides) batBalls++;
            team = battingTeam;
            opp = bowlingTeam;
          }

          if(d.wickets){
            d.wickets.forEach(w=>{
              if(w.player_out === player && w.kind !== "run out") wasOut = true;
            });
          }

          if(d.bowler === player){
            if(!d.extras?.byes && !d.extras?.legbyes){
              bowlRuns += d.runs.total;
            }
            bowlBalls++;
            team = bowlingTeam;
            opp = battingTeam;
            if(d.wickets){
              d.wickets.forEach(w=>{
                if(w.kind !== "run out") bowlWkts++;
              });
            }
          }
        });
      });
    });

    if(batRuns || bowlWkts || wasOut){
      matches++;
      runs += batRuns;
      balls += batBalls;
      wkts += bowlWkts;
      bowlBalls += bowlBalls;
      if(wasOut) outs++;

      if(batRuns >= 100) hundreds++;
      else if(batRuns >= 50) fifties++;

      if(batRuns > bestScore) bestScore = batRuns;

      if(bowlWkts > bestBowlWkts || (bowlWkts === bestBowlWkts && bowlRuns < bestBowlRuns)){
        bestBowlWkts = bowlWkts;
        bestBowlRuns = bowlRuns;
      }

      matchRows.push({
        date: match.info.dates[0],
        teams: match.info.teams.join(" vs "),
        venue: match.info.venue || "—",
        team, opp,
        batRuns, batBalls,
        bowlWkts, bowlRuns
      });
    }
  });

  playerNameEl.textContent = nameMap[player] || player;
  matchesBox.textContent = matches;
  runsBox.textContent = runs;
  wicketsBox.textContent = wkts;
  srBox.textContent = balls ? ((runs/balls)*100).toFixed(1) : "—";
  avgBox.textContent = outs ? (runs/outs).toFixed(2) : "—";
  fiftiesBox.textContent = fifties;
  hundredsBox.textContent = hundreds;
  econBox.textContent = bowlBalls ? ( ( (bestBowlRuns + runs) / bowlBalls ) * 6 ).toFixed(2) : "—";
  bestScoreBox.textContent = bestScore || "—";
  bestBowlBox.textContent = bestBowlWkts ? bestBowlWkts+" / "+bestBowlRuns : "—";

  sortMode = "date";
  renderTable();
}

function renderTable(){
  tableBody.innerHTML="";
  let rows=[...matchRows];
  document.querySelectorAll("th").forEach(th=>th.classList.remove("sort-active"));

  if(sortMode==="bat"){
    batHeader.classList.add("sort-active");
    rows.sort((a,b)=>b.batRuns-a.batRuns);
  }else if(sortMode==="bowl"){
    bowlHeader.classList.add("sort-active");
    rows.sort((a,b)=>b.bowlWkts-a.bowlWkts || a.bowlRuns-b.bowlRuns);
  }else{
    dateHeader.classList.add("sort-active");
    rows.sort((a,b)=>new Date(a.date)-new Date(b.date));
  }

  rows.forEach(m=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${new Date(m.date).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}</td>
      <td>${m.teams}</td>
      <td>${m.team}</td>
      <td>${m.opp}</td>
      <td>${m.venue}</td>
      <td>${m.batRuns ? m.batRuns+" ("+m.batBalls+")" : "—"}</td>
      <td>${m.bowlWkts ? m.bowlWkts+" / "+m.bowlRuns : "—"}</td>
    `;
    tableBody.appendChild(tr);
  });
}
</script>

</body>
</html>
