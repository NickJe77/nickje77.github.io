<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>IPL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#f6f7f9;}

.navbar{display:flex;justify-content:center;gap:24px;padding:16px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.page{max-width:1200px;margin:30px auto;padding:0 20px;}

.hero{background:linear-gradient(90deg,#3b007a,#7b2cbf);color:white;padding:40px;border-radius:24px;}
.hero h1{margin:0;font-size:38px;}

.tabs{
  display:flex;
  gap:10px;
  margin-top:20px;
}
.tab{
  padding:10px 16px;
  background:#eee;
  border-radius:10px;
  cursor:pointer;
}
.tab.active{
  background:#0056d6;
  color:white;
}

.controls{
  margin-top:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
  margin-top:20px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
}

.table-wrap{
  margin-top:30px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}

table{width:100%;border-collapse:collapse;}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:center;}
th{background:#f1f4f8;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="ipl.html">IPL</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading…</h1>
</div>

<div class="tabs">
<div class="tab active" id="batTab">Batting</div>
<div class="tab" id="bowlTab">Bowling</div>
</div>

<div class="controls">
<select id="oppFilter">
<option value="">All Opponents</option>
</select>
</div>

<div class="stats" id="careerStats"></div>

<div class="table-wrap">
<table>
<thead id="tableHead"></thead>
<tbody id="gamesTable"></tbody>
</table>
</div>

</div>

<script>
(async function(){

const params = new URLSearchParams(location.search);
const slug = params.get("player");

function norm(name){
  return name.toLowerCase().replace(/[^a-z]/g,"");
}

function slugToName(s){
  return s.replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}

// NAME MAP
const nameMap = await fetch("/data/ipl/player-names.json").then(r=>r.json());
let reverseMap = {};
Object.entries(nameMap).forEach(([full, s])=> reverseMap[s]=full);

let playerName = reverseMap[slug] || slugToName(slug);
document.getElementById("playerName").textContent = playerName;

const P = norm(playerName);

// LOAD INDEX
const index = await fetch("/data/ipl/index.json").then(r=>r.json());

let batting=[];
let bowling=[];
let opponents=new Set();

// LOAD MATCHES
for(const file of index){

  if(!file.includes("_FULL.json")) continue;

  const matches = await fetch("/data/ipl/"+file).then(r=>r.json());

  matches.forEach(match=>{

    match.innings.forEach(inn=>{

      let batRuns=0, batBalls=0, out=false;
      let bowlRuns=0, bowlBalls=0, wkts=0;

      inn.overs.forEach(o=>{
        o.deliveries.forEach(d=>{

          // BATTING
          if(norm(d.batter||"")===P){
            batRuns+=d.runs.batter||0;
            if(!d.extras?.wides) batBalls++;
            if(d.wickets) out=true;
          }

          // BOWLING
          if(norm(d.bowler||"")===P){
            bowlRuns+=d.runs.total||0;
            bowlBalls++;
            if(d.wickets) wkts+=d.wickets.length;
          }

        });
      });

      const opp = match.info.teams.find(t=>t!==inn.team);
      opponents.add(opp);

      if(batBalls>0){
        batting.push({
          season:match.info.season,
          date:match.info.dates?.[0]||"",
          opp,
          runs:batRuns,
          balls:batBalls
        });
      }

      if(bowlBalls>0){
        bowling.push({
          season:match.info.season,
          date:match.info.dates?.[0]||"",
          opp,
          runs:bowlRuns,
          balls:bowlBalls,
          wkts
        });
      }

    });

  });
}

// ---------------- FILTER DROPDOWN ----------------
const oppFilter = document.getElementById("oppFilter");
[...opponents].sort().forEach(o=>{
  const opt=document.createElement("option");
  opt.value=o;
  opt.textContent=o;
  oppFilter.appendChild(opt);
});

// ---------------- STATE ----------------
let mode="bat";

// ---------------- RENDER ----------------
function render(){

  const opp = oppFilter.value;

  let data = mode==="bat"?batting:bowling;
  if(opp) data = data.filter(g=>g.opp===opp);

  if(mode==="bat"){

    const runs = data.reduce((a,b)=>a+b.runs,0);
    const balls = data.reduce((a,b)=>a+b.balls,0);
    const sr = balls? (runs/balls*100).toFixed(1):0;
    const hs = Math.max(...data.map(g=>g.runs),0);

    document.getElementById("careerStats").innerHTML=`
    <div class="stat"><h3>${data.length}</h3><span>Matches</span></div>
    <div class="stat"><h3>${runs}</h3><span>Runs</span></div>
    <div class="stat"><h3>${sr}</h3><span>Strike Rate</span></div>
    <div class="stat"><h3>${hs}</h3><span>Highest Score</span></div>
    `;

    document.getElementById("tableHead").innerHTML=`
    <tr><th>Season</th><th>Date</th><th>Opp</th><th>Runs</th><th>Balls</th></tr>
    `;

    document.getElementById("gamesTable").innerHTML =
    data.map(g=>`
    <tr>
    <td>${g.season}</td>
    <td>${g.date}</td>
    <td>${g.opp}</td>
    <td>${g.runs}</td>
    <td>${g.balls}</td>
    </tr>
    `).join("");

  }else{

    const runs = data.reduce((a,b)=>a+b.runs,0);
    const wkts = data.reduce((a,b)=>a+b.wkts,0);

    let best = "0/0";
    data.forEach(g=>{
      if(g.wkts>0){
        if(best==="0/0" || g.wkts>parseInt(best)){
          best = `${g.wkts}/${g.runs}`;
        }
      }
    });

    document.getElementById("careerStats").innerHTML=`
    <div class="stat"><h3>${data.length}</h3><span>Matches</span></div>
    <div class="stat"><h3>${wkts}</h3><span>Wickets</span></div>
    <div class="stat"><h3>${runs}</h3><span>Runs Conceded</span></div>
    <div class="stat"><h3>${best}</h3><span>Best Bowling</span></div>
    `;

    document.getElementById("tableHead").innerHTML=`
    <tr><th>Season</th><th>Date</th><th>Opp</th><th>Wkts</th><th>Runs</th></tr>
    `;

    document.getElementById("gamesTable").innerHTML =
    data.map(g=>`
    <tr>
    <td>${g.season}</td>
    <td>${g.date}</td>
    <td>${g.opp}</td>
    <td>${g.wkts}</td>
    <td>${g.runs}</td>
    </tr>
    `).join("");
  }
}

// ---------------- EVENTS ----------------
document.getElementById("batTab").onclick=()=>{
  mode="bat";
  document.getElementById("batTab").classList.add("active");
  document.getElementById("bowlTab").classList.remove("active");
  render();
};

document.getElementById("bowlTab").onclick=()=>{
  mode="bowl";
  document.getElementById("bowlTab").classList.add("active");
  document.getElementById("batTab").classList.remove("active");
  render();
};

oppFilter.onchange = render;

// INITIAL RENDER
render();

})();
</script>

</body>
</html>
