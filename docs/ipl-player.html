<script>
(async function(){

const params = new URLSearchParams(location.search);
const player = params.get("player");

if(!player){
  document.getElementById("playerName").textContent="No player specified";
  return;
}

/* LOAD NAME MAP */
const nameMap =
  await fetch("data/ipl/player-names.json")
  .then(r=>r.json());

const displayName = nameMap[player] || player;

document.getElementById("playerName").textContent = displayName;

const P = player.toLowerCase();

let battingGames=[];
let bowlingGames=[];
let currentTab="bat";

/* LOAD INDEX */
const raw =
  await fetch("data/ipl/index.json")
  .then(r=>r.json());

const index =
  Array.isArray(raw)
    ? raw
    : typeof raw==="string"
      ? raw.split(",").map(s=>s.trim())
      : raw.files || [];

/* DISMISSAL FORMAT */
function abbrOut(kind){
  if(!kind) return "not out";
  const k=kind.toLowerCase();
  if(k==="caught") return "c";
  if(k==="bowled") return "b";
  if(k==="lbw") return "lbw";
  if(k==="caught and bowled") return "c&b";
  if(k==="run out") return "ro";
  return k;
}

/* LOAD MATCHES */
for(const file of index){

  if(!file.includes("_FULL.json")) continue;

  const rawData =
    await fetch("data/ipl/"+file)
    .then(r=>r.json());

  const matches =
    Array.isArray(rawData)
      ? rawData
      : rawData.matches || rawData.games || [];

  matches.forEach(match=>{

    match.innings.forEach(inn=>{

      let batRuns=0,batBalls=0,batOut="not out",batted=false;
      let bowlBalls=0,bowlRuns=0,bowlWkts=0;

      inn.overs.forEach(o=>{

        o.deliveries.forEach(d=>{

          if(d.batter?.toLowerCase()===P){
            batted=true;
            batRuns+=d.runs.batter;
            if(!d.extras?.wides) batBalls++;
          }

          if(d.bowler?.toLowerCase()===P){
            bowlBalls++;
            if(!d.extras?.byes && !d.extras?.legbyes)
              bowlRuns+=d.runs.total;
          }

          d.wickets?.forEach(w=>{

            if(w.player_out?.toLowerCase()===P)
              batOut=abbrOut(w.kind);

            if(w.bowler?.toLowerCase()===P)
              bowlWkts++;

          });

        });

      });

      const opponent =
        match.info.teams.find(t=>t!==inn.team);

      if(batted){
        battingGames.push({
          season:match.info.season,
          date:match.info.dates[0],
          opp:opponent,
          venue:match.info.venue,
          r:batRuns,
          b:batBalls,
          sr:batBalls?((batRuns/batBalls)*100).toFixed(1):"—",
          out:batOut
        });
      }

      if(bowlBalls){
        bowlingGames.push({
          season:match.info.season,
          date:match.info.dates[0],
          opp:opponent,
          venue:match.info.venue,
          o:(bowlBalls/6).toFixed(1),
          balls:bowlBalls,
          r:bowlRuns,
          w:bowlWkts,
          econ:((bowlRuns/(bowlBalls/6))).toFixed(2)
        });
      }

    });

  });

}

/* AUTO TAB */
const totalBowlBalls =
  bowlingGames.reduce((a,b)=>a+b.balls,0);

if(totalBowlBalls>=30){
  currentTab="bowl";
  bowlBtn.classList.add("active");
}else{
  batBtn.classList.add("active");
}

/* OPPONENT DROPDOWN */
const oppSel=document.getElementById("oppSelect");

["All",
 ...new Set([...battingGames,...bowlingGames].map(g=>g.opp))
].forEach(o=>{

  const opt=document.createElement("option");
  opt.value=o;
  opt.textContent=o;
  oppSel.appendChild(opt);

});

/* STATS FUNCTIONS */

function batStats(list){
  const runs=list.reduce((a,b)=>a+b.r,0);
  const balls=list.reduce((a,b)=>a+b.b,0);
  const outs=list.filter(g=>g.out!=="not out").length;

  return{
    m:list.length,
    r:runs,
    a:outs?(runs/outs).toFixed(2):"—",
    s:balls?((runs/balls)*100).toFixed(1):"—",
    h:list.length?Math.max(...list.map(g=>g.r)):"—"
  };
}

function bowlStats(list){
  const balls=list.reduce((a,b)=>a+b.balls,0);
  const runs=list.reduce((a,b)=>a+b.r,0);
  const wkts=list.reduce((a,b)=>a+b.w,0);
  const five=list.filter(g=>g.w>=5).length;

  const best=list.reduce((best,g)=>{
    if(!best) return g;
    if(g.w>best.w || (g.w===best.w && g.r<best.r)) return g;
    return best;
  },null);

  return{
    m:list.length,
    o:(balls/6).toFixed(1),
    w:wkts,
    a:wkts?(runs/wkts).toFixed(2):"—",
    e:balls?((runs/(balls/6))).toFixed(2):"—",
    f:five,
    bf:best?`${best.w}/${best.r}`:"—"
  };
}

/* RENDER FUNCTION (unchanged except uses displayName already set) */

function render(){

  const opp=oppSel.value;

  const all =
    currentTab==="bat"
      ? battingGames
      : bowlingGames;

  const list =
    opp==="All"
      ? all
      : all.filter(g=>g.opp===opp);

  vsTitle.textContent =
    opp==="All"
      ? "VS OPPOSITION"
      : "VS "+opp.toUpperCase();

/* rest unchanged */

}

batBtn.onclick=()=>{
currentTab="bat";
batBtn.classList.add("active");
bowlBtn.classList.remove("active");
render();
};

bowlBtn.onclick=()=>{
currentTab="bowl";
bowlBtn.classList.add("active");
batBtn.classList.remove("active");
render();
};

oppSel.onchange=render;

render();

})();
</script>
