<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Breeders’ Cup Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="racing.html">Racing</a>
    <a href="g1-archive.html">G1 Archive</a>
    <a href="breeders-cup.html">Breeders’ Cup</a>
  </nav>

  <section class="g1-hero">
    <img src="images/breeders-cup-hero.jpg" alt="Breeders’ Cup">
    <div class="g1-hero-text">
      <h1>Breeders’ Cup Archive</h1>
      <p>
        A complete record of Breeders’ Cup races across all years and divisions —
        winners, jockeys, trainers and host venues.
      </p>
    </div>
  </section>

  <main>
    <table style="width:100%; border-collapse:collapse;">
      <thead>
        <tr>
          <th>Year</th>
          <th>Race</th>
          <th>Track</th>
          <th>Winner</th>
          <th>Jockey</th>
          <th>Trainer</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </main>

  <script>
    fetch("breeders-cup-results.json")
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("results-body");
        tbody.innerHTML = "";

        data.forEach(row => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.year}</td>
            <td>${row.race}</td>
            <td>${row.track}</td>
            <td>${row.winner}</td>
            <td>${row.jockey}</td>
            <td>${row.trainer}</td>
          `;
          tbody.appendChild(tr);
        });
      });
  </script>

</body>
</html>
