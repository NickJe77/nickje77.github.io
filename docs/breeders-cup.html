<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Breeders’ Cup Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Global base styles -->
  <link rel="stylesheet" href="../style.css">

  <!-- Shared nav + font styles -->
  <link rel="stylesheet" href="../racing.css">

  <!-- BREEDERS’ CUP – LOCAL TWEAKS ONLY -->
  <style>
    /* ---------- HERO ---------- */

    .g1-hero {
      max-width: 1200px;
      margin: 36px auto 24px;
      padding: 0 24px;
    }

    .g1-hero img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    /* ---------- FILTERS ---------- */

    .filters {
      max-width: 1200px;
      margin: 40px auto 30px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      align-items: end;
    }

    .filter-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .filters select,
    .filters input {
      width: 100%;
      height: 46px;
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 10px;
      box-sizing: border-box;
    }

    /* ---------- TABLE ---------- */

    .archive-table {
      max-width: 1200px;
      margin: 0 auto 80px;
      padding: 0 24px;
      overflow-x: auto;
    }

    .archive-table table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      border: 1px solid #cfdff1;     /* outer border */
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .archive-table th,
    .archive-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e5e5;
      vertical-align: top;
    }

    .archive-table th {
      font-weight: 600;
      background: #f2f6fb;
      text-align: left;
    }

    /* Zebra striping */
    .archive-table tbody tr:nth-child(even) {
      background: #f4f8ff;
    }

    /* Column sizing (UNCHANGED LOGIC) */

    .archive-table th:nth-child(1),
    .archive-table td:nth-child(1) {
      width: 70px;
      white-space: nowrap;
    }

    .archive-table th:nth-child(2),
    .archive-table td:nth-child(2) {
      width: 260px;
      white-space: normal;
      word-break: break-word;
    }

    .archive-table th:nth-child(3),
    .archive-table td:nth-child(3) {
      width: 120px;
      white-space: normal;
      word-break: break-word;
    }

    .archive-table th:nth-child(4),
    .archive-table td:nth-child(4) {
      width: 160px;
      white-space: nowrap;
    }

    .archive-table th:nth-child(5),
    .archive-table td:nth-child(5) {
      width: 180px;
      white-space: normal;
      word-break: break-word;
    }

    .archive-table th:nth-child(6),
    .archive-table td:nth-child(6) {
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- NAV (CONSISTENT WITH REST OF SITE) -->
  <nav class="home-nav">
    <a href="../index.html">Home</a>
    <a href="../racing.html">Racing</a>
    <a href="../g1-archive.html">G1 Archive</a>
    <a href="breeders-cup.html" class="active">Breeders’ Cup</a>
  </nav>

  <!-- HERO (IMAGE ONLY) -->
  <div class="g1-hero">
    <img src="../images/breeders-cup-hero.jpg" alt="Breeders’ Cup Racing">
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <div class="filter-group">
      <label for="yearFilter">Year</label>
      <select id="yearFilter">
        <option value="">All</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="raceFilter">Race</label>
      <input id="raceFilter" type="text" list="raceList" placeholder="Type race name">
      <datalist id="raceList"></datalist>
    </div>

    <div class="filter-group">
      <label for="winnerFilter">Winner</label>
      <input id="winnerFilter" type="text" list="winnerList" placeholder="Type horse name">
      <datalist id="winnerList"></datalist>
    </div>
  </div>

  <!-- TABLE -->
  <div class="archive-table">
    <table>
      <thead>
        <tr>
          <th>Year</th>
          <th>Race</th>
          <th>Track</th>
          <th>Winner</th>
          <th>Trainer</th>
          <th>Jockey</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="breeders-cup.js" defer></script>

</body>
</html>
