<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Breeders’ Cup Archive | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="racing.html">Racing</a>
    <a href="g1-archive.html">G1 Archive</a>
    <a href="breeders-cup.html">Breeders’ Cup</a>
  </nav>

  <section class="g1-hero">
    <img src="images/breeders-cup-hero.jpg" alt="Breeders’ Cup">
    <div class="g1-hero-text">
      <h1>Breeders’ Cup Archive</h1>
      <p>
        A complete record of Breeders’ Cup races across all years and divisions —
        winners, jockeys, trainers and host venues.
      </p>
    </div>
  </section>

  <main>

    <!-- FILTER BAR -->
    <section class="filters">

      <div class="filter-group">
        <label for="yearSelect">Year</label>
        <select id="yearSelect" disabled>
          <option value="all">All</option>
        </select>
      </div>

      <div class="filter-group autocomplete">
        <label for="raceInput">Race</label>
        <input id="raceInput" type="text" placeholder="All" autocomplete="off">
        <div id="raceList" class="autocomplete-list"></div>
      </div>

      <div class="filter-group autocomplete">
        <label for="winnerInput">Winner</label>
        <input id="winnerInput" type="text" placeholder="All" autocomplete="off">
        <div id="winnerList" class="autocomplete-list"></div>
      </div>

    </section>

    <!-- RESULTS TABLE -->
    <section class="results">
      <table>
        <thead>
          <tr>
            <th>Year</th>
            <th>Race</th>
            <th>Track</th>
            <th>Winner</th>
            <th>Jockey</th>
            <th>Trainer</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </section>

  </main>

  <!-- cache-busted on purpose -->
  <script src="breeders-cup-results.js?v=2"></script>
</body>
</html>
