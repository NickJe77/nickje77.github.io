<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>UEFA Euro – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#1fa25c;
  --accent-soft:rgba(31,162,92,.16);
  --league:#a8790a;
  --league-soft:rgba(168,121,10,.1);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{color:var(--ink);text-decoration:none;opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:44px 20px;text-align:center;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4.5vw,42px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

/* ── Year tiles ───────────────────────────────────────── */
.year-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-bottom:26px;}
.year-tile{
  background:var(--surface);border:1px solid var(--line);color:var(--ink);text-align:center;
  padding:12px;border-radius:var(--radius);font-family:var(--display);font-weight:600;font-size:15px;
  cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.year-tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,16,24,.2);border-color:var(--league);}
.year-tile.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ── Summary ──────────────────────────────────────────── */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:22px;}
.summary h2{
  margin:0 0 16px;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.01em;
  text-transform:uppercase;color:var(--ink);
}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}

.summary-box{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  font-weight:600;font-size:13.5px;color:var(--ink);position:relative;overflow:hidden;
}

.flag-bg{
  position:absolute;font-size:88px;opacity:.14;right:6px;bottom:-6px;pointer-events:none;filter:saturate(1.2);
}
.flag-row{display:inline-flex;gap:8px;vertical-align:middle;margin-left:4px;}
.flag-icon{font-size:36px;line-height:1;}

/* ── Matches ──────────────────────────────────────────── */
.match{
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;
  background:var(--surface);display:block;text-decoration:none;color:inherit;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.match:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,16,24,.18);border-color:var(--faint);}
.match h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.01em;color:var(--ink);}
.small{font-size:12.5px;color:var(--muted);font-weight:600;}

.team-link{color:var(--league);text-decoration:none;font-weight:700;}
.team-link:hover{color:var(--accent);text-decoration:underline;}
</style>
</head>

<body>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="euro.html">Euro</a>
<a href="euro-countries.html">Countries</a>
</nav>

<div class="hero">
  <div class="eyebrow">Football</div>
  <h1>Euro – By Year</h1>
</div>

<div class="page-wrap">
<div id="years" class="year-grid"></div>
<div id="output"></div>
</div>

<script>
const COUNTRY_PAGE="euro-country.html";
const countryCodes={"Albania": "AL", "Austria": "AT", "Belgium": "BE", "Bulgaria": "BG", "Croatia": "HR", "Czech Republic": "CZ", "Denmark": "DK", "England": "GB", "Finland": "FI", "France": "FR", "Georgia": "GE", "Germany": "DE", "Greece": "GR", "Hungary": "HU", "Iceland": "IS", "Ireland": "IE", "Italy": "IT", "Latvia": "LV", "N. Ireland": "GB", "Netherlands": "NL", "North Macedonia": "MK", "Norway": "NO", "Poland": "PL", "Portugal": "PT", "Romania": "RO", "Russia": "RU", "Scotland": "GB", "Serbia": "RS", "Slovakia": "SK", "Slovenia": "SI", "Spain": "ES", "Sweden": "SE", "Switzerland": "CH", "Turkey": "TR", "Ukraine": "UA", "Wales": "GB", "CIS": "", "CSSR": "", "USSR": "", "Yugoslavia": ""};
function flagEmoji(code){
 if(!code) return "";
 return code.replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt()));
}
function getFlag(name){
 return flagEmoji(countryCodes[name]);
}

/* Single host keeps the decorative faint background flag. Multiple
   co-hosts (e.g. 2000 Netherlands/Belgium, 2008 Austria/Switzerland,
   2012 Poland/Ukraine) get a normal, fully visible inline row instead. */
function buildHostFlags(hostStr){
 const parts = (hostStr || "").split("/").map(h=>h.trim()).filter(Boolean);
 if(!parts.length) return { bg:"", inline:"" };
 if(parts.length === 1){
  return { bg:`<span class="flag-bg">${getFlag(parts[0])}</span>`, inline:"" };
 }
 const inline = `<span class="flag-row">${parts.map(p=>`<span class="flag-icon">${getFlag(p)}</span>`).join("")}</span>`;
 return { bg:"", inline };
}

// Confirmed real tournament years and hosts (matches the actual
// worldfootball.net season dropdown, checked directly against a
// screenshot of it).
const YEARS = [1960,1964,1968,1972,1976,1980,1984,1988,1992,1996,2000,2004,2008,2012,2016,2020,2024];
const HOSTS = {
  1960:"France",1964:"Spain",1968:"Italy",1972:"Belgium",1976:"Yugoslavia",
  1980:"Italy",1984:"France",1988:"West Germany",1992:"Sweden",1996:"England",
  2000:"Netherlands/Belgium",2004:"Portugal",2008:"Austria/Switzerland",
  2012:"Poland/Ukraine",2016:"France",2020:"Pan-Europe",2024:"Germany"
};

function buildYears(){
 const box=document.getElementById("years");
 [...YEARS].reverse().forEach(y=>{
  const d=document.createElement("div");
  d.className="year-tile";
  d.textContent=y;
  d.onclick=()=>loadYear(y,d);
  box.appendChild(d);
 });
}

function sortByRealDate(games){
  return [...games].sort((a,b)=>{
    const [da,ma,ya] = a.date.split(".").map(Number);
    const [db,mb,yb] = b.date.split(".").map(Number);
    return (ya*10000+ma*100+da) - (yb*10000+mb*100+db);
  });
}

function loadYear(year,btn){
 document.querySelectorAll(".year-tile").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 const out=document.getElementById("output");
 out.innerHTML="<div style='text-align:center;padding:30px;color:var(--muted);'>Loading...</div>";

 Promise.all([
   fetch(`data/uefaeuro/seasons/${year}.json`).then(r=>r.json()),
   fetch("data/uefaeuro/players.json").then(r=>r.json()),
 ]).then(([seasonData, players])=>{
   const games = sortByRealDate(seasonData.games || seasonData);
   out.innerHTML="";
   buildSummary(year, games, players, out);
   buildMatches(year, games, out);
 });
}

/* ---------- SUMMARY ---------- */
function buildSummary(year, games, players, out){
 const host = HOSTS[year] || "Unknown";
 const final = games[games.length-1];
 const winner = final.home_score > final.away_score ? final.home_team
              : final.away_score > final.home_score ? final.away_team
              : "Draw";
 const runnerUp = winner === "Draw" ? "" : (winner === final.home_team ? final.away_team : final.home_team);

 // Top scorers for this specific tournament: sum each player's
 // season_stats entry matching this year across whichever team they
 // played for (a player only ever has one team per season here).
 const goals = {};
 players.forEach(p=>{
  p.season_stats.forEach(s=>{
   if(String(s.season)===String(year) && s.goals>0){
    goals[p.name] = (goals[p.name]||0) + s.goals;
   }
  });
 });
 const topGoals = Object.entries(goals).sort((a,b)=>b[1]-a[1]).slice(0,5);

 const hostFlags = buildHostFlags(host);

 const summary=document.createElement("div");
 summary.className="summary";
 summary.innerHTML=`
  <h2>${year} Euro Summary</h2>
  <div class="summary-grid">
   <div class="summary-box">${hostFlags.bg}Host: ${host} ${hostFlags.inline}</div>
   <div class="summary-box"><span class="flag-bg">${getFlag(winner)}</span>Winner: ${winner}</div>
   <div class="summary-box"><span class="flag-bg">${getFlag(runnerUp)}</span>Runner-up: ${runnerUp||"—"}</div>
   <div class="summary-box">
    Top Scorers:<br>
    ${topGoals.length ? topGoals.map(g=>`${g[0]} – ${g[1]}`).join("<br>") : "None on record"}
   </div>
  </div>
 `;
 out.appendChild(summary);
}

/* ---------- MATCHES ---------- */
function buildMatches(year, games, out){
 games.forEach(m=>{
  const div=document.createElement("a");
  div.className="match";
  div.style.display="block";
  div.style.textDecoration="none";
  div.style.color="inherit";
  div.href=`euro-match.html?season=${year}&match=${m.game_id}`;

  const result = m.home_score===m.away_score ? "Draw"
               : (m.home_score>m.away_score ? m.home_team : m.away_team);

  div.innerHTML=`
   <h3>
    <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.home_team)}" onclick="event.stopPropagation()">${m.home_team}</a>
    ${m.home_score}-${m.away_score}
    <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.away_team)}" onclick="event.stopPropagation()">${m.away_team}</a>
   </h3>
   <div class="small">${m.date}</div>
   <div class="small">${result==="Draw" ? "Draw" : `Winner: ${result}`}</div>
  `;

  out.appendChild(div);
 });
}

buildYears();

const requestedYear = new URLSearchParams(location.search).get("year");
if(requestedYear && YEARS.includes(Number(requestedYear))){
  const tile = [...document.querySelectorAll(".year-tile")]
    .find(el => el.textContent === String(requestedYear));
  if(tile) loadYear(Number(requestedYear), tile);
}

</script>

</body>
</html>
