<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

/* NAV */
.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;}

.wrap{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

/* SEARCH */
.search-row{
display:flex;
gap:20px;
margin-bottom:20px;
}

.search-box{
flex:1;
position:relative;
min-width:0;
}

.search-box input{
width:100%;
padding:14px 16px;
border-radius:12px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

/* SUGGESTIONS */
.suggestions{
position:absolute;
top:100%;
left:0;
right:0;
background:#fff;
border-radius:10px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
max-height:200px;
overflow-y:auto;
z-index:10;
}

.suggestions div{
padding:10px;
cursor:pointer;
}
.suggestions div:hover{background:#f2f6ff;}

/* FILTERS */
.filters{
display:flex;
gap:12px;
margin-bottom:20px;
align-items:center;
}

.filters .search-box{
flex:1;
max-width:calc(100% - 170px);
}

#surfaceFilter{
width:160px;
flex-shrink:0;
}

/* SELECT */
select{
padding:14px;
border-radius:12px;
border:1px solid #ccc;
font-size:16px;
min-height:48px;
width:100%;
}

/* H2H */
.h2h{
display:flex;
justify-content:space-between;
align-items:center;
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
margin-bottom:25px;
}

.h2h div{
flex:1;
text-align:center;
font-size:22px;
font-weight:700;
}

/* TABLE */
.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
min-width:700px;
}

th{
background:#111;
color:#fff;
padding:12px;
position:sticky;
top:0;
}

td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

td:first-child{text-align:left;}

tbody tr:nth-child(even){background:#f2f6ff;}
.win{color:#0a7f2e;font-weight:700;}

/* MOBILE */
@media (max-width:768px){
.search-row{flex-direction:column;}
.filters{flex-direction:column;}
.filters .search-box{max-width:none;}
#surfaceFilter{width:100%;}
.h2h{flex-direction:column;}
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html">Tennis</a>
<a href="tennis-players.html">Players</a>
</div>

<div class="wrap">

<!-- PLAYER SEARCH -->
<div class="search-row">
<div class="search-box">
<input id="p1" placeholder="Player 1">
<div id="s1" class="suggestions"></div>
</div>

<div class="search-box">
<input id="p2" placeholder="Player 2">
<div id="s2" class="suggestions"></div>
</div>
</div>

<!-- FILTERS -->
<div class="filters">
<div class="search-box">
<input id="tournamentSearch" placeholder="Search tournament...">
<div id="tournamentSuggestions" class="suggestions"></div>
</div>

<div>
<select id="surfaceFilter">
<option value="ALL">All Surfaces</option>
<option value="Hard">Hard</option>
<option value="Clay">Clay</option>
<option value="Grass">Grass</option>
</select>
</div>
</div>

<!-- H2H -->
<div class="h2h">
<div id="name1">-</div>
<div id="score">0 - 0</div>
<div id="name2">-</div>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Date</th>
<th>Tournament</th>
<th>Surface</th>
<th>Round</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>

<script>

let players = [];
let allMatches = [];
let tournaments = [];
let selectedTournament = "ALL";

/* CLEAN */
function clean(name){
  return (name || "").toLowerCase().trim();
}

/* SURFACE DETECTION */
function getSurface(t){
  t = (t||"").toLowerCase();
  if(t.includes("wimbledon")) return "Grass";
  if(t.includes("french") || t.includes("roland")) return "Clay";
  if(t.includes("us open") || t.includes("australian")) return "Hard";
  return "Hard";
}

/* PLAYERS */
fetch("/data/tennis/players.json")
.then(r=>r.json())
.then(d=>players=d);

/* PLAYER SEARCH */
function setupSearch(id, boxId){
  const input = document.getElementById(id);
  const box = document.getElementById(boxId);

  input.addEventListener("input", ()=>{
    const val = input.value.toLowerCase();
    box.innerHTML="";

    if(!val) return;

    players.filter(p=>p.toLowerCase().includes(val)).slice(0,10).forEach(p=>{
      const div=document.createElement("div");
      div.textContent=p;
      div.onclick=()=>{
        input.value=p;
        box.innerHTML="";
        run();
      };
      box.appendChild(div);
    });
  });
}

setupSearch("p1","s1");
setupSearch("p2","s2");

/* TOURNAMENT SEARCH */
const tInput=document.getElementById("tournamentSearch");
const tBox=document.getElementById("tournamentSuggestions");

tInput.addEventListener("input",()=>{
  const val=tInput.value.toLowerCase();
  tBox.innerHTML="";

  if(!val){
    selectedTournament="ALL";
    run();
    return;
  }

  tournaments.filter(t=>t.toLowerCase().includes(val)).slice(0,10).forEach(t=>{
    const div=document.createElement("div");
    div.textContent=t;
    div.onclick=()=>{
      tInput.value=t;
      selectedTournament=t;
      tBox.innerHTML="";
      run();
    };
    tBox.appendChild(div);
  });
});

/* LOAD */
async function load(){

  const years=[];
  for(let y=2026;y>=1968;y--) years.push(y);

  const res=await Promise.all(
    years.map(y =>
      fetch(`/data/tennis/seasons/${y}.json`)
      .then(r=>r.ok?r.json():null)
      .catch(()=>null)
    )
  );

  res.forEach(data=>{
    if(!data) return;

    const games=Array.isArray(data)?data:(data.matches||[]);

    games.forEach(g=>{
      const t=(g.tournament||"").toLowerCase();
      if(t.includes("davis cup")) return;

      allMatches.push(g);
    });
  });

  tournaments=[...new Set(allMatches.map(m=>m.tournament))].sort();

  run();
}

/* RUN */
function run(){

  const p1=clean(document.getElementById("p1").value);
  const p2=clean(document.getElementById("p2").value);
  const sFilter=document.getElementById("surfaceFilter").value;

  if(!p1 || !p2) return;

  let p1w=0,p2w=0;
  let h2h=[];

  allMatches.forEach(g=>{

    const gp1=clean(g.player1);
    const gp2=clean(g.player2);

    if(
      (gp1===p1 && gp2===p2) ||
      (gp1===p2 && gp2===p1)
    ){

      const surface = (g.surface || getSurface(g.tournament)).trim();

      if(selectedTournament!=="ALL" && g.tournament!==selectedTournament) return;
      if(sFilter!=="ALL" && surface!==sFilter) return;

      h2h.push({...g, surface});

      if(clean(g.winner)===p1) p1w++;
      if(clean(g.winner)===p2) p2w++;

    }

  });

  document.getElementById("name1").textContent=document.getElementById("p1").value;
  document.getElementById("name2").textContent=document.getElementById("p2").value;
  document.getElementById("score").textContent=`${p1w} - ${p2w}`;

  document.getElementById("table").innerHTML =
    h2h.sort((a,b)=>new Date(b.date)-new Date(a.date))
    .map(g=>`
      <tr>
        <td>${g.date||""}</td>
        <td>${g.tournament}</td>
        <td>${g.surface}</td>
        <td>${g.round}</td>
        <td class="win">${g.winner}</td>
        <td>${g.score||""}</td>
      </tr>
    `).join("");
}

load();

</script>

</body>
</html>
