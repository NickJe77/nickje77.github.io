<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body {
  font-family: var(--body);
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* NAV */
.navbar {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 15px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  font-weight: 600;
  font-size: 13.5px;
  flex-wrap: wrap;
}
.navbar a { color: var(--ink); text-decoration: none; opacity:.7; transition:opacity .15s,color .15s; }
.navbar a:hover { opacity:1; color:var(--accent); }

.hero{
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:36px 20px;
  text-align:center;
}
.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;
  text-transform:uppercase;
}
.hero p{margin-top:8px;font-size:13.5px;color:rgba(255,255,255,.68);}

.wrap {
  max-width: 1100px;
  margin: auto;
  padding: 26px 20px 70px;
}

/* SEARCH */
.search-row {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}

.search-box {
  flex: 1;
  position: relative;
  min-width: 0;
}

.search-box input {
  width: 100%;
  padding: 12px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background:var(--surface);
  font-family:var(--body);
  font-size: 14px;
  font-weight:600;
  color:var(--ink);
  box-sizing: border-box;
}
.search-box input:hover{border-color:var(--faint);}
.search-box input:focus{outline:none;border-color:var(--accent);}

/* SUGGESTIONS */
.suggestions {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--surface);
  border-radius: 14px;
  margin-top:8px;
  box-shadow: 0 14px 30px -12px rgba(10,16,24,.4);
  max-height: 200px;
  overflow-y: auto;
  z-index: 10;
}

.suggestions div {
  padding: 12px 16px;
  cursor: pointer;
  font-weight:600;
  font-size:13.5px;
  border-bottom:1px solid var(--line);
}
.suggestions div:last-child{border-bottom:none;}
.suggestions div:hover { background: var(--accent-soft); }

/* FILTERS */
.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 22px;
  align-items: center;
}

.filters .search-box {
  flex: 1;
  max-width: calc(100% - 170px);
}

#surfaceFilter {
  width: 160px;
  flex-shrink: 0;
}

/* SELECT */
select {
  padding: 11px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background:var(--surface);
  font-family:var(--body);
  font-size: 13.5px;
  font-weight:600;
  color:var(--ink);
  min-height: 42px;
  width: 100%;
  cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

/* H2H */
.h2h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--surface);
  border:1px solid var(--line);
  padding: 20px;
  border-radius: var(--radius);
  margin-bottom: 22px;
}

.h2h div {
  flex: 1;
  text-align: center;
  font-family:var(--display);
  font-size: 22px;
  font-weight: 600;
  color:var(--ink);
}

/* TABLE */
.table-wrap { overflow-x: auto; border-radius:var(--radius); border:1px solid var(--line); }

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
  min-width: 700px;
}

th {
  background: #f7f9fb;
  color:var(--muted);
  padding: 11px 14px;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.04em;
  font-family:var(--body);
  border-bottom:1px solid var(--line);
  text-align:left;
}

td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  text-align: center;
  font-size:13.5px;
  color:#27313c;
}

td:first-child { text-align: left; }

tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.win { color: #1e7a3d; font-weight: 700; }

/* MOBILE */
@media (max-width: 768px) {
  .search-row { flex-direction: column; }
  .filters { flex-direction: column; }
  .filters .search-box { max-width: none; }
  #surfaceFilter { width: 100%; }
  .h2h { flex-direction: column; gap:10px; }
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="nba.html">NBA</a>
  <a href="nhl.html">NHL</a>
  <a href="ufc.html">UFC</a>
  <a href="nfl.html">NFL</a>
  <a href="tennis.html">Tennis</a>
  <a href="tennis-players.html">Players</a>
</div>

<div class="hero">
  <h1>Head to Head</h1>
  <p>Compare any two players across their careers</p>
</div>

<div class="wrap">

  <!-- PLAYER SEARCH -->
  <div class="search-row">
    <div class="search-box">
      <input id="p1" placeholder="Player 1">
      <div id="s1" class="suggestions"></div>
    </div>
    <div class="search-box">
      <input id="p2" placeholder="Player 2">
      <div id="s2" class="suggestions"></div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <div class="search-box">
      <input id="tournamentSearch" placeholder="Search tournament...">
      <div id="tournamentSuggestions" class="suggestions"></div>
    </div>
    <div>
      <select id="surfaceFilter">
        <option value="ALL">All Surfaces</option>
        <option value="Hard">Hard</option>
        <option value="Clay">Clay</option>
        <option value="Grass">Grass</option>
      </select>
    </div>
  </div>

  <!-- H2H -->
  <div class="h2h">
    <div id="name1">-</div>
    <div id="score">0 - 0</div>
    <div id="name2">-</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Tournament</th>
          <th>Surface</th>
          <th>Round</th>
          <th>Winner</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>
  </div>

</div>

<script>

let players = [];
let allMatches = [];
let tournaments = [];
let selectedTournament = "ALL";

function clean(name) {
  return (name || "").toLowerCase().trim();
}

/* PLAYERS */
fetch("/data/tennis/players.json")
  .then(r => r.json())
  .then(d => players = d);

/* PLAYER SEARCH */
function setupSearch(id, boxId) {
  const input = document.getElementById(id);
  const box = document.getElementById(boxId);

  input.addEventListener("input", () => {
    const val = input.value.toLowerCase();
    box.innerHTML = "";
    if (!val) return;

    players.filter(p => p.toLowerCase().includes(val)).slice(0, 10).forEach(p => {
      const div = document.createElement("div");
      div.textContent = p;
      div.onclick = () => {
        input.value = p;
        box.innerHTML = "";
        run();
      };
      box.appendChild(div);
    });
  });
}

setupSearch("p1", "s1");
setupSearch("p2", "s2");

/* TOURNAMENT SEARCH */
const tInput = document.getElementById("tournamentSearch");
const tBox = document.getElementById("tournamentSuggestions");

tInput.addEventListener("input", () => {
  const val = tInput.value.toLowerCase();
  tBox.innerHTML = "";

  if (!val) {
    selectedTournament = "ALL";
    run();
    return;
  }

  tournaments.filter(t => t.toLowerCase().includes(val)).slice(0, 10).forEach(t => {
    const div = document.createElement("div");
    div.textContent = t;
    div.onclick = () => {
      tInput.value = t;
      selectedTournament = t;
      tBox.innerHTML = "";
      run();
    };
    tBox.appendChild(div);
  });
});

/* SURFACE FILTER */
document.getElementById("surfaceFilter").addEventListener("change", run);

/* LOAD */
async function load() {
  const years = [];
  for (let y = 2026; y >= 1968; y--) years.push(y);

  const res = await Promise.all(
    years.map(y =>
      fetch(`/data/tennis/seasons/${y}.json`)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
    )
  );

  res.forEach(data => {
    if (!data) return;
    const games = Array.isArray(data) ? data : (data.matches || []);
    games.forEach(g => {
      const t = (g.tournament || "").toLowerCase();
      if (t.includes("davis cup")) return;
      allMatches.push(g);
    });
  });

  tournaments = [...new Set(allMatches.map(m => m.tournament))].sort();
  run();
}

/* RUN */
function run() {
  const p1 = clean(document.getElementById("p1").value);
  const p2 = clean(document.getElementById("p2").value);
  const sFilter = document.getElementById("surfaceFilter").value;

  if (!p1 || !p2) return;

  let p1w = 0, p2w = 0;
  let h2h = [];

  allMatches.forEach(g => {
    const gp1 = clean(g.player1);
    const gp2 = clean(g.player2);

    if (
      (gp1 === p1 && gp2 === p2) ||
      (gp1 === p2 && gp2 === p1)
    ) {
      // Use surface from data directly — no guessing
      const surface = g.surface || "";

      if (selectedTournament !== "ALL" && g.tournament !== selectedTournament) return;
      if (sFilter !== "ALL" && surface !== sFilter) return;

      h2h.push({ ...g, surface });

      if (clean(g.winner) === p1) p1w++;
      if (clean(g.winner) === p2) p2w++;
    }
  });

  document.getElementById("name1").textContent = document.getElementById("p1").value;
  document.getElementById("name2").textContent = document.getElementById("p2").value;
  document.getElementById("score").textContent = `${p1w} - ${p2w}`;

  document.getElementById("table").innerHTML =
    h2h.sort((a, b) => new Date(b.date) - new Date(a.date))
      .map(g => `
        <tr>
          <td>${g.date || ""}</td>
          <td>${g.tournament}</td>
          <td>${g.surface || ""}</td>
          <td>${g.round}</td>
          <td class="win">${g.winner}</td>
          <td>${g.score || ""}</td>
        </tr>
      `).join("");
}

load();

</script>

</body>
</html>
