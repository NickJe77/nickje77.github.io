<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Tennis Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;}

.wrap{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

/* SEARCH */
.search-row{
display:flex;
gap:20px;
margin-bottom:20px;
}

.search-box{
flex:1;
position:relative;
}

.search-box input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
}

.suggestions{
position:absolute;
top:100%;
left:0;
right:0;
background:#fff;
border-radius:10px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
max-height:200px;
overflow-y:auto;
z-index:10;
}

.suggestions div{
padding:10px;
cursor:pointer;
}
.suggestions div:hover{background:#f2f6ff;}

/* FILTERS */
.filters{
display:flex;
gap:15px;
margin-bottom:20px;
}

select{
padding:10px;
border-radius:10px;
border:1px solid #ccc;
}

/* H2H */
.h2h{
display:flex;
justify-content:space-between;
align-items:center;
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
margin-bottom:20px;
}

.h2h div{
flex:1;
text-align:center;
font-size:22px;
font-weight:700;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

th{
background:#111;
color:#fff;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
text-align:center;
}

td:first-child{text-align:left;}

.win{color:#0a7f2e;font-weight:700;}

tbody tr:nth-child(even){background:#f2f6ff;}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="tennis.html">Tennis</a>
<a href="tennis-players.html">Players</a>
</div>

<div class="wrap">

<!-- SEARCH -->
<div class="search-row">
<div class="search-box">
<input id="p1" placeholder="Player 1">
<div id="s1" class="suggestions"></div>
</div>

<div class="search-box">
<input id="p2" placeholder="Player 2">
<div id="s2" class="suggestions"></div>
</div>
</div>

<!-- FILTERS -->
<div class="filters">
<select id="tournamentFilter">
<option value="ALL">All Tournaments</option>
</select>

<select id="surfaceFilter">
<option value="ALL">All Surfaces</option>
<option value="Hard">Hard</option>
<option value="Clay">Clay</option>
<option value="Grass">Grass</option>
</select>
</div>

<!-- H2H -->
<div class="h2h">
<div id="name1">-</div>
<div id="score">0 - 0</div>
<div id="name2">-</div>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Tournament</th>
<th>Surface</th>
<th>Round</th>
<th>Winner</th>
<th>Score</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

<script>

let players = [];
let matches = [];

// LOAD PLAYERS
fetch("/data/tennis/players.json")
.then(r=>r.json())
.then(d=>players=d);

// AUTOCOMPLETE
function setupSearch(inputId, suggestionId){
  const input = document.getElementById(inputId);
  const box = document.getElementById(suggestionId);

  input.addEventListener("input", ()=>{
    const val = input.value.toLowerCase();
    box.innerHTML = "";

    if(!val) return;

    players
      .filter(p=>p.toLowerCase().includes(val))
      .slice(0,10)
      .forEach(p=>{
        const div = document.createElement("div");
        div.textContent = p;
        div.onclick = ()=>{
          input.value = p;
          box.innerHTML = "";
          run();
        };
        box.appendChild(div);
      });
  });
}

setupSearch("p1","s1");
setupSearch("p2","s2");

// LOAD DATA
async function load(){

  const years = [];
  for(let y=2026;y>=1968;y--) years.push(y);

  const res = await Promise.all(
    years.map(y =>
      fetch(`/data/tennis/seasons/${y}.json`)
      .then(r=>r.ok?r.json():null)
      .catch(()=>null)
    )
  );

  res.forEach(data=>{
    if(!data) return;

    const games = Array.isArray(data)?data:(data.matches||[]);

    games.forEach(g=>{

      const tournament = (g.tournament||"").toLowerCase();

      if(tournament.includes("davis cup")) return;

      matches.push(g);

    });

  });

  buildTournamentFilter();
}

function buildTournamentFilter(){

  const select = document.getElementById("tournamentFilter");

  const tournaments = [...new Set(matches.map(m=>m.tournament).filter(Boolean))].sort();

  tournaments.forEach(t=>{
    const o = document.createElement("option");
    o.value = t;
    o.textContent = t;
    select.appendChild(o);
  });

  select.onchange = run;
  document.getElementById("surfaceFilter").onchange = run;
}

// RUN H2H
function run(){

  const p1 = document.getElementById("p1").value;
  const p2 = document.getElementById("p2").value;

  if(!p1 || !p2) return;

  const tournamentFilter = document.getElementById("tournamentFilter").value;
  const surfaceFilter = document.getElementById("surfaceFilter").value;

  document.getElementById("name1").textContent = p1;
  document.getElementById("name2").textContent = p2;

  let h2h = [];
  let p1w=0, p2w=0;

  matches.forEach(g=>{

    if(
      (g.player1===p1 && g.player2===p2) ||
      (g.player1===p2 && g.player2===p1)
    ){

      // tournament filter
      if(tournamentFilter !== "ALL" && g.tournament !== tournamentFilter) return;

      // surface filter (if exists)
      if(surfaceFilter !== "ALL" && g.surface !== surfaceFilter) return;

      h2h.push(g);

      if(g.winner===p1) p1w++;
      if(g.winner===p2) p2w++;

    }

  });

  document.getElementById("score").textContent = `${p1w} - ${p2w}`;

  document.getElementById("table").innerHTML = h2h
    .sort((a,b)=> new Date(b.date)-new Date(a.date))
    .map(g=>`
      <tr>
        <td>${g.date||""}</td>
        <td>${g.tournament}</td>
        <td>${g.surface||""}</td>
        <td>${g.round}</td>
        <td class="win">${g.winner}</td>
        <td>${g.score||""}</td>
      </tr>
    `).join("");

}

// INIT
load();

</script>

</body>
</html>
