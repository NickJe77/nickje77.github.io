<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#eef1f5;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.hero{
padding:36px 20px;
text-align:center;
color:white;
}

.hero h1{
margin:0;
font-size:46px;
font-weight:900;
line-height:1;
}

.hero p{
margin-top:10px;
font-size:16px;
font-weight:700;
opacity:.95;
}

.container{
max-width:1450px;
margin:22px auto;
padding:0 16px 40px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:14px;
margin-bottom:22px;
}

.stat-card{
background:white;
border-radius:16px;
padding:20px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
text-align:center;
}

.stat-value{
font-size:32px;
font-weight:900;
line-height:1;
margin-bottom:8px;
}

.stat-label{
font-size:11px;
font-weight:900;
letter-spacing:.6px;
text-transform:uppercase;
color:#666;
}

.section{
background:white;
border-radius:18px;
padding:22px;
margin-bottom:22px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.section-title{
font-size:24px;
font-weight:900;
margin-bottom:18px;
}

.filters{
margin-bottom:18px;
}

select{
padding:12px 14px;
border-radius:10px;
border:1px solid #ccc;
font-size:14px;
font-weight:800;
background:white;
min-width:260px;
}

.tables-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:18px;
}

table{
width:100%;
border-collapse:collapse;
table-layout:fixed;
}

th{
background:#e9eef5;
padding:12px;
font-size:12px;
font-weight:900;
text-transform:uppercase;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #ececec;
font-size:14px;
font-weight:600;
}

tr:nth-child(even){
background:#f8fbff;
}

.player-link{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.player-link:hover{
text-decoration:underline;
}

.loading,
.error{
padding:120px 20px;
text-align:center;
font-size:34px;
font-weight:900;
}

.error{
color:#d90429;
}

.games-table td{
font-size:13px;
}

.result-win{
font-weight:900;
color:#008000;
}

.result-loss{
font-weight:900;
color:#d90429;
}

.result-draw{
font-weight:900;
color:#d68910;
}

@media(max-width:900px){

.hero h1{
font-size:34px;
}

.hero p{
font-size:14px;
}

.section-title{
font-size:20px;
}

.stat-value{
font-size:24px;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/epl-teams.html">Teams</a>
<a href="/epl-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div id="page">

<div class="loading">
Loading Team...
</div>

</div>

<script>

const TEAM_COLOURS = {

"Arsenal":"linear-gradient(135deg,#EF0107,#9C0000)",
"Aston Villa":"linear-gradient(135deg,#670E36,#95BFE5)",
"Bournemouth":"linear-gradient(135deg,#DA291C,#000000)",
"Brentford":"linear-gradient(135deg,#E30613,#111111)",
"Brighton & Hove Albion":"linear-gradient(135deg,#0057B8,#FFCD00)",
"Chelsea":"linear-gradient(135deg,#034694,#001C58)",
"Crystal Palace":"linear-gradient(135deg,#1B458F,#C4122E)",
"Everton":"linear-gradient(135deg,#003399,#001C58)",
"Fulham":"linear-gradient(135deg,#111111,#FFFFFF)",
"Ipswich Town":"linear-gradient(135deg,#005BAC,#FFFFFF)",
"Leicester City":"linear-gradient(135deg,#003090,#FDBE11)",
"Liverpool":"linear-gradient(135deg,#C8102E,#00B2A9)",
"Manchester City":"linear-gradient(135deg,#6CABDD,#1C2C5B)",
"Manchester United":"linear-gradient(135deg,#DA291C,#FBE122)",
"Newcastle United":"linear-gradient(135deg,#111111,#666666)",
"Norwich City":"linear-gradient(135deg,#00A650,#FFF200)",
"Nottingham Forest":"linear-gradient(135deg,#DD0000,#FFFFFF)",
"Southampton":"linear-gradient(135deg,#D71920,#FFFFFF)",
"Tottenham Hotspur":"linear-gradient(135deg,#132257,#FFFFFF)",
"West Ham United":"linear-gradient(135deg,#7A263A,#1BB1E7)",
"Wimbledon":"linear-gradient(135deg,#003399,#FFCC00)",
"Wolverhampton Wanderers":"linear-gradient(135deg,#FDB913,#231F20)"

};

const params = new URLSearchParams(window.location.search);

const teamName = params.get("team");

const page = document.getElementById("page");

async function loadTeam(){

try{

const teamsResponse =
await fetch("/data/epl/teams.json");

const teams =
await teamsResponse.json();

const seasons = [];

for(let start=1992; start<=2026; start++){

const end = start + 1;

const seasonId = `${start}-${end}`;

try{

const res =
await fetch(`/data/epl/seasons/${seasonId}.json`);

if(res.ok){

const data = await res.json();

if(Array.isArray(data)){

data.forEach(g=>{

g.season = seasonId;

});

seasons.push(...data);

}

}

}catch(err){

console.log("Missing season",seasonId);

}

}

const team =
teams.find(t=>{

const name =
t.team || t.name || "";

return (
name.toLowerCase() === teamName.toLowerCase()
);

});

if(!team){

page.innerHTML = `
<div class="error">
Team Not Found
</div>
`;

return;

}

const allGames = [];

seasons.forEach(game=>{

const home =
(game.home_team || "").trim();

const away =
(game.away_team || "").trim();

if(
home === team.team ||
away === team.team
){

allGames.push(game);

}

});

const opponents = [

"All Opponents",

...new Set(

allGames.map(g=>{

if(g.home_team === team.team){

return g.away_team;

}

return g.home_team;

})

)

].filter(Boolean).sort();

function buildHeadToHead(opponent){

let games = 0;
let wins = 0;
let draws = 0;
let losses = 0;
let goals = 0;

const filteredGames = [];

allGames.forEach(game=>{

const home =
game.home_team;

const away =
game.away_team;

const homeGoals =
Number(game.home_score || 0);

const awayGoals =
Number(game.away_score || 0);

const isTeamHome =
home === team.team;

const opponentName =
isTeamHome ? away : home;

if(
opponent !== "All Opponents" &&
opponentName !== opponent
){
return;
}

filteredGames.push(game);

games++;

const teamGoals =
isTeamHome ? homeGoals : awayGoals;

const oppGoals =
isTeamHome ? awayGoals : homeGoals;

goals += teamGoals;

if(teamGoals > oppGoals){
wins++;
}else if(teamGoals < oppGoals){
losses++;
}else{
draws++;
}

});

return {
games,
wins,
draws,
losses,
goals,
filteredGames
};

}

const allStats =
buildHeadToHead("All Opponents");

const playerTotals = {};

allGames.forEach(game=>{

const homePlayers =
game.home_players || [];

const awayPlayers =
game.away_players || [];

const relevantPlayers =
game.home_team === team.team
? homePlayers
: awayPlayers;

relevantPlayers.forEach(player=>{

const playerName =
player.player ||
player.name ||
player.player_name;

if(!playerName) return;

if(!playerTotals[playerName]){

playerTotals[playerName] = {

goals:0,
yellow:0,
red:0

};

}

playerTotals[playerName].goals +=
Number(player.goals || 0);

playerTotals[playerName].yellow +=
Number(player.yellow_cards || player.yellow || 0);

playerTotals[playerName].red +=
Number(player.red_cards || player.red || 0);

});

});

const topScorers =
Object.entries(playerTotals)
.sort((a,b)=>b[1].goals - a[1].goals)
.slice(0,10);

const yellowCards =
Object.entries(playerTotals)
.sort((a,b)=>b[1].yellow - a[1].yellow)
.slice(0,10);

const redCards =
Object.entries(playerTotals)
.sort((a,b)=>b[1].red - a[1].red)
.slice(0,10);

function buildRows(rows,type){

if(rows.length === 0){

return `
<tr>
<td colspan="2">
No player data found
</td>
</tr>
`;

}

return rows.map(player=>`

<tr>

<td>

<a
class="player-link"
href="/epl-player.html?player=${encodeURIComponent(player[0])}"
>

${player[0]}

</a>

</td>

<td>${player[1][type]}</td>

</tr>

`).join("");

}

function buildGamesRows(games){

if(games.length === 0){

return `
<tr>
<td colspan="5">
No games found
</td>
</tr>
`;

}

return games
.slice(0,50)
.map(game=>{

const isHome =
game.home_team === team.team;

const teamGoals =
isHome
? Number(game.home_score || 0)
: Number(game.away_score || 0);

const oppGoals =
isHome
? Number(game.away_score || 0)
: Number(game.home_score || 0);

let resultClass = "result-draw";
let resultText = "D";

if(teamGoals > oppGoals){
resultClass = "result-win";
resultText = "W";
}else if(teamGoals < oppGoals){
resultClass = "result-loss";
resultText = "L";
}

const opponent =
isHome
? game.away_team
: game.home_team;

return `

<tr>

<td>${game.season || ""}</td>

<td>${opponent}</td>

<td>${teamGoals}-${oppGoals}</td>

<td class="${resultClass}">
${resultText}
</td>

<td>
<a
class="player-link"
href="/epl-game.html?match=${game.match_id}"
>
View
</a>
</td>

</tr>

`;

}).join("");

}

page.innerHTML = `

<div
class="hero"
style="
background:${TEAM_COLOURS[team.team] || 'linear-gradient(135deg,#111,#555)'};
"
>

<h1>${team.team}</h1>

<p>
Premier League Club Profile
</p>

</div>

<div class="container">

<div class="stats-grid">

<div class="stat-card">
<div class="stat-value">${team.seasons || 0}</div>
<div class="stat-label">Seasons</div>
</div>

<div class="stat-card">
<div class="stat-value">${allStats.games}</div>
<div class="stat-label">Games</div>
</div>

<div class="stat-card">
<div class="stat-value">${allStats.goals}</div>
<div class="stat-label">Goals</div>
</div>

<div class="stat-card">
<div class="stat-value">${allStats.wins}</div>
<div class="stat-label">Wins</div>
</div>

<div class="stat-card">
<div class="stat-value">${allStats.draws}</div>
<div class="stat-label">Draws</div>
</div>

<div class="stat-card">
<div class="stat-value">${allStats.losses}</div>
<div class="stat-label">Losses</div>
</div>

</div>

<div class="section">

<div class="filters">

<select id="oppositionSelect">

${opponents.map(o=>`
<option value="${o}">
${o}
</option>
`).join("")}

</select>

</div>

<div class="section-title">
Vs Selected Opponent
</div>

<div class="stats-grid">

<div class="stat-card">
<div class="stat-value" id="oppGames">
${allStats.games}
</div>
<div class="stat-label">Games</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppWins">
${allStats.wins}
</div>
<div class="stat-label">Wins</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppDraws">
${allStats.draws}
</div>
<div class="stat-label">Draws</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppLosses">
${allStats.losses}
</div>
<div class="stat-label">Losses</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppGoals">
${allStats.goals}
</div>
<div class="stat-label">Goals</div>
</div>

</div>

</div>

<div class="tables-grid">

<div class="section">

<div class="section-title">
Leading Scorers
</div>

<table>

<thead>

<tr>
<th>Player</th>
<th>Goals</th>
</tr>

</thead>

<tbody>

${buildRows(topScorers,"goals")}

</tbody>

</table>

</div>

<div class="section">

<div class="section-title">
Yellow Card Leaders
</div>

<table>

<thead>

<tr>
<th>Player</th>
<th>Yellow</th>
</tr>

</thead>

<tbody>

${buildRows(yellowCards,"yellow")}

</tbody>

</table>

</div>

<div class="section">

<div class="section-title">
Red Card Leaders
</div>

<table>

<thead>

<tr>
<th>Player</th>
<th>Red</th>
</tr>

</thead>

<tbody>

${buildRows(redCards,"red")}

</tbody>

</table>

</div>

</div>

<div class="section">

<div class="section-title">
Results Vs Selected Opponent
</div>

<table class="games-table">

<thead>

<tr>

<th>Season</th>
<th>Opponent</th>
<th>Score</th>
<th>Result</th>
<th></th>

</tr>

</thead>

<tbody id="gamesBody">

${buildGamesRows(allStats.filteredGames)}

</tbody>

</table>

</div>

</div>

`;

const oppositionSelect =
document.getElementById("oppositionSelect");

oppositionSelect.addEventListener("change",()=>{

const stats =
buildHeadToHead(oppositionSelect.value);

document.getElementById("oppGames").textContent =
stats.games;

document.getElementById("oppWins").textContent =
stats.wins;

document.getElementById("oppDraws").textContent =
stats.draws;

document.getElementById("oppLosses").textContent =
stats.losses;

document.getElementById("oppGoals").textContent =
stats.goals;

document.getElementById("gamesBody").innerHTML =
buildGamesRows(stats.filteredGames);

});

}catch(err){

console.error(err);

page.innerHTML = `
<div class="error">
Failed To Load Team Data
</div>
`;

}

}

loadTeam();

</script>

</body>
</html>
