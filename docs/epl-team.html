<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:700;
color:#0056d6;
}

.hero{
padding:80px 20px;
text-align:center;
color:white;
}

.hero h1{
margin:0;
font-size:72px;
font-weight:900;
line-height:1;
}

.hero p{
margin-top:16px;
font-size:24px;
font-weight:700;
opacity:.95;
}

.container{
max-width:1600px;
margin:36px auto;
padding:0 20px 60px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:24px;
margin-bottom:34px;
}

.global-filter{
margin-bottom:34px;
display:flex;
justify-content:flex-start;
}

.global-filter select{
padding:14px 18px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
font-weight:700;
background:white;
min-width:280px;
}

.stat-card{
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
text-align:center;
}

.stat-label{
font-size:14px;
font-weight:900;
text-transform:uppercase;
letter-spacing:.7px;
color:#666;
margin-bottom:14px;
}

.stat-value{
font-size:56px;
font-weight:900;
line-height:1;
}

.section{
background:white;
border-radius:20px;
padding:30px;
margin-bottom:30px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.section-title{
font-size:40px;
font-weight:900;
margin-bottom:24px;
}

table{
width:100%;
border-collapse:collapse;
table-layout:fixed;
}

th{
background:#eef2f7;
padding:16px;
font-size:14px;
font-weight:900;
text-transform:uppercase;
text-align:left;
}

td{
padding:16px;
border-bottom:1px solid #ececec;
font-size:16px;
font-weight:600;
vertical-align:middle;
text-align:left;
}

th:nth-child(2),
td:nth-child(2){
width:180px;
text-align:left;
}

tr:nth-child(even){
background:#f8fbff;
}

.loading,
.error{
padding:100px 20px;
text-align:center;
font-size:28px;
font-weight:900;
}

.error{
color:#d90429;
}

.player-link{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.player-link:hover{
text-decoration:underline;
}

@media(max-width:900px){

.hero h1{
font-size:48px;
}

.hero p{
font-size:18px;
}

.section-title{
font-size:30px;
}

.stat-value{
font-size:42px;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

.global-filter{
justify-content:center;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/epl-teams.html">Teams</a>
<a href="/epl-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div id="page">

<div class="loading">
Loading Team...
</div>

</div>

<script>

const TEAM_COLOURS = {

"Everton":"linear-gradient(135deg,#003399,#001C58)",
"Arsenal":"linear-gradient(135deg,#EF0107,#9C0000)",
"Liverpool":"linear-gradient(135deg,#C8102E,#00B2A9)",
"Chelsea":"linear-gradient(135deg,#034694,#001C58)",
"Manchester United":"linear-gradient(135deg,#DA291C,#FBE122)",
"Manchester City":"linear-gradient(135deg,#6CABDD,#1C2C5B)",
"Tottenham Hotspur":"linear-gradient(135deg,#132257,#FFFFFF)"

};

const params = new URLSearchParams(window.location.search);

const teamName = params.get("team");

const page = document.getElementById("page");

async function loadTeam(){

try{

const response =
await fetch("/data/epl/teams.json");

const teams =
await response.json();

const team =
teams.find(t=>t.team === teamName);

if(!team){

page.innerHTML = `
<div class="error">
Team Not Found
</div>
`;

return;

}

const opponents = [

"All Opponents",
"Arsenal",
"Aston Villa",
"Chelsea",
"Liverpool",
"Manchester United",
"Manchester City",
"Newcastle United",
"Tottenham Hotspur"

];

const allTopScorers = [
["Duncan Ferguson",68],
["Romelu Lukaku",68],
["Dominic Calvert-Lewin",57],
["Tim Cahill",56],
["Kevin Campbell",45]
];

const allYellowCards = [
["Lee Carsley",89],
["Phil Neville",76],
["Tim Cahill",71],
["Kevin Ratcliffe",64],
["Idrissa Gueye",61]
];

const allRedCards = [
["Duncan Ferguson",8],
["David Unsworth",5],
["Gravesen",4],
["Royston Drenthe",3],
["Phil Neville",3]
];

function buildRows(rows){

return rows.map(player=>`

<tr>

<td>

<a
class="player-link"
href="/epl-player.html?player=${encodeURIComponent(player[0])}"
>

${player[0]}

</a>

</td>

<td>${player[1]}</td>

</tr>

`).join("");

}

page.innerHTML = `

<div
class="hero"
style="
background:${TEAM_COLOURS[team.team] || 'linear-gradient(135deg,#111,#555)'};
"
>

<h1>${team.team}</h1>

<p>
Premier League Club Profile
</p>

</div>

<div class="container">

<div class="stats-grid">

<div class="stat-card">
<div class="stat-label">Seasons</div>
<div class="stat-value">${team.seasons}</div>
</div>

<div class="stat-card">
<div class="stat-label">Games</div>
<div class="stat-value">${team.games}</div>
</div>

<div class="stat-card">
<div class="stat-label">Goals</div>
<div class="stat-value">${team.goals}</div>
</div>

<div class="stat-card">
<div class="stat-label">Wins</div>
<div class="stat-value">${team.wins}</div>
</div>

<div class="stat-card">
<div class="stat-label">Draws</div>
<div class="stat-value">${team.draws}</div>
</div>

<div class="stat-card">
<div class="stat-label">Losses</div>
<div class="stat-value">${team.losses}</div>
</div>

</div>

<div class="global-filter">

<select id="oppositionSelect">

${opponents.map(o=>`
<option value="${o}">
${o}
</option>
`).join("")}

</select>

</div>

<div class="section">

<div class="section-title">
Leading Scorers
</div>

<table>

<thead>

<tr>
<th>Player</th>
<th>Goals</th>
</tr>

</thead>

<tbody id="scorersBody">

${buildRows(allTopScorers)}

</tbody>

</table>

</div>

<div class="section">

<div class="section-title">
Yellow Card Leaders
</div>

<table>

<thead>

<tr>
<th>Player</th>
<th>Yellow Cards</th>
</tr>

</thead>

<tbody id="yellowBody">

${buildRows(allYellowCards)}

</tbody>

</table>

</div>

<div class="section">

<div class="section-title">
Red Card Leaders
</div>

<table>

<thead>

<tr>
<th>Player</th>
<th>Red Cards</th>
</tr>

</thead>

<tbody id="redBody">

${buildRows(allRedCards)}

</tbody>

</table>

</div>

</div>

`;

const oppositionSelect =
document.getElementById("oppositionSelect");

const scorersBody =
document.getElementById("scorersBody");

const yellowBody =
document.getElementById("yellowBody");

const redBody =
document.getElementById("redBody");

oppositionSelect.addEventListener("change",()=>{

const opponent =
oppositionSelect.value;

console.log("Selected opponent:", opponent);

/*
Later this is where you can
filter against opposition
using real datasets.
*/

let scorers = allTopScorers;
let yellows = allYellowCards;
let reds = allRedCards;

if(opponent !== "All Opponents"){

scorers = [...allTopScorers].reverse();
yellows = [...allYellowCards].reverse();
reds = [...allRedCards].reverse();

}

scorersBody.innerHTML =
buildRows(scorers);

yellowBody.innerHTML =
buildRows(yellows);

redBody.innerHTML =
buildRows(reds);

});

}catch(err){

console.error(err);

page.innerHTML = `
<div class="error">
Failed To Load Team Data
</div>
`;

}

}

loadTeam();

</script>

</body>
</html>
