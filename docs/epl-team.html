<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:700;
color:#0056d6;
}

.hero{
padding:80px 20px;
text-align:center;
color:white;
}

.hero h1{
margin:0;
font-size:72px;
font-weight:900;
line-height:1;
}

.hero p{
margin-top:16px;
font-size:24px;
font-weight:700;
opacity:.95;
}

.container{
max-width:1600px;
margin:36px auto;
padding:0 20px 60px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:24px;
margin-bottom:34px;
}

.stat-card{
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
text-align:center;
}

.stat-label{
font-size:14px;
font-weight:900;
text-transform:uppercase;
letter-spacing:.7px;
color:#666;
margin-bottom:14px;
}

.stat-value{
font-size:56px;
font-weight:900;
line-height:1;
}

.section{
background:white;
border-radius:20px;
padding:30px;
margin-bottom:30px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.section-title{
font-size:40px;
font-weight:900;
margin-bottom:24px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#eef2f7;
padding:16px;
font-size:14px;
font-weight:900;
text-transform:uppercase;
text-align:left;
}

td{
padding:16px;
border-bottom:1px solid #ececec;
font-size:16px;
font-weight:600;
}

tr:nth-child(even){
background:#f8fbff;
}

.loading,
.error{
padding:100px 20px;
text-align:center;
font-size:28px;
font-weight:900;
}

.error{
color:#d90429;
}

.result-win{
color:#009944;
font-weight:900;
}

.result-loss{
color:#d90429;
font-weight:900;
}

.result-draw{
color:#e67e22;
font-weight:900;
}

@media(max-width:900px){

.hero h1{
font-size:48px;
}

.hero p{
font-size:18px;
}

.section-title{
font-size:30px;
}

.stat-value{
font-size:42px;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/epl-teams.html">Teams</a>
<a href="/epl-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div id="page">

<div class="loading">
Loading Team...
</div>

</div>

<script>

const TEAM_COLOURS = {

"Everton":"linear-gradient(135deg,#003399,#001C58)",
"Arsenal":"linear-gradient(135deg,#EF0107,#9C0000)",
"Liverpool":"linear-gradient(135deg,#C8102E,#00B2A9)",
"Chelsea":"linear-gradient(135deg,#034694,#001C58)",
"Manchester United":"linear-gradient(135deg,#DA291C,#FBE122)",
"Manchester City":"linear-gradient(135deg,#6CABDD,#1C2C5B)",
"Tottenham Hotspur":"linear-gradient(135deg,#132257,#FFFFFF)"

};

const params = new URLSearchParams(window.location.search);

const teamName = params.get("team");

const page = document.getElementById("page");

async function loadTeam(){

try{

const response =
await fetch("/data/epl/teams.json");

const teams =
await response.json();

const team =
teams.find(t=>t.team === teamName);

if(!team){

page.innerHTML = `
<div class="error">
Team Not Found
</div>
`;

return;

}

page.innerHTML = `

<div
class="hero"
style="
background:${TEAM_COLOURS[team.team] || 'linear-gradient(135deg,#111,#555)'};
"
>

<h1>${team.team}</h1>

<p>
Premier League Club Profile
</p>

</div>

<div class="container">

<div class="stats-grid">

<div class="stat-card">
<div class="stat-label">Seasons</div>
<div class="stat-value">${team.seasons}</div>
</div>

<div class="stat-card">
<div class="stat-label">Games</div>
<div class="stat-value">${team.games}</div>
</div>

<div class="stat-card">
<div class="stat-label">Goals</div>
<div class="stat-value">${team.goals}</div>
</div>

<div class="stat-card">
<div class="stat-label">Wins</div>
<div class="stat-value">${team.wins}</div>
</div>

<div class="stat-card">
<div class="stat-label">Draws</div>
<div class="stat-value">${team.draws}</div>
</div>

<div class="stat-card">
<div class="stat-label">Losses</div>
<div class="stat-value">${team.losses}</div>
</div>

</div>

<div class="section">

<div class="section-title">
Club Summary
</div>

<table>

<tbody>

<tr>
<td><strong>Club</strong></td>
<td>${team.team}</td>
</tr>

<tr>
<td><strong>Premier League Seasons</strong></td>
<td>${team.seasons}</td>
</tr>

<tr>
<td><strong>Games Played</strong></td>
<td>${team.games}</td>
</tr>

<tr>
<td><strong>Total Goals</strong></td>
<td>${team.goals}</td>
</tr>

<tr>
<td><strong>Wins</strong></td>
<td>${team.wins}</td>
</tr>

<tr>
<td><strong>Draws</strong></td>
<td>${team.draws}</td>
</tr>

<tr>
<td><strong>Losses</strong></td>
<td>${team.losses}</td>
</tr>

</tbody>

</table>

</div>

</div>

`;

}catch(err){

console.error(err);

page.innerHTML = `
<div class="error">
Failed To Load Team Data
</div>
`;

}

}

loadTeam();

</script>

</body>
</html>
