<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#eef1f5;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.hero{
padding:80px 20px;
text-align:center;
color:white;
}

.hero h1{
margin:0;
font-size:78px;
font-weight:900;
line-height:1;
}

.hero p{
margin-top:16px;
font-size:24px;
font-weight:700;
opacity:.95;
}

.container{
max-width:1600px;
margin:36px auto;
padding:0 20px 70px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:24px;
margin-bottom:34px;
}

.stat-card{
background:white;
border-radius:22px;
padding:34px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
text-align:center;
}

.stat-value{
font-size:62px;
font-weight:900;
line-height:1;
margin-bottom:14px;
}

.stat-label{
font-size:15px;
font-weight:900;
letter-spacing:.8px;
text-transform:uppercase;
color:#666;
}

.section{
background:white;
border-radius:24px;
padding:34px;
margin-bottom:34px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.section-title{
font-size:52px;
font-weight:900;
margin-bottom:28px;
}

.filters{
margin-bottom:28px;
}

select{
padding:14px 18px;
border-radius:12px;
border:1px solid #ccc;
font-size:16px;
font-weight:800;
background:white;
min-width:280px;
}

table{
width:100%;
border-collapse:collapse;
table-layout:fixed;
}

th{
background:#e9eef5;
padding:18px;
font-size:14px;
font-weight:900;
text-transform:uppercase;
text-align:left;
}

td{
padding:18px;
border-bottom:1px solid #ececec;
font-size:17px;
font-weight:600;
}

tr:nth-child(even){
background:#f8fbff;
}

.player-link{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.player-link:hover{
text-decoration:underline;
}

.loading,
.error{
padding:120px 20px;
text-align:center;
font-size:34px;
font-weight:900;
}

.error{
color:#d90429;
}

@media(max-width:900px){

.hero h1{
font-size:52px;
}

.hero p{
font-size:18px;
}

.section-title{
font-size:34px;
}

.stat-value{
font-size:42px;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/epl-teams.html">Teams</a>
<a href="/epl-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div id="page">

<div class="loading">
Loading Team...
</div>

</div>

<script>

const TEAM_COLOURS = {

"Everton":"linear-gradient(135deg,#003399,#001C58)",
"Arsenal":"linear-gradient(135deg,#EF0107,#9C0000)",
"Liverpool":"linear-gradient(135deg,#C8102E,#00B2A9)",
"Chelsea":"linear-gradient(135deg,#034694,#001C58)",
"Manchester United":"linear-gradient(135deg,#DA291C,#FBE122)",
"Manchester City":"linear-gradient(135deg,#6CABDD,#1C2C5B)",
"Tottenham Hotspur":"linear-gradient(135deg,#132257,#FFFFFF)"

};

const params = new URLSearchParams(window.location.search);

const teamName = params.get("team");

const page = document.getElementById("page");

async function loadTeam(){

try{

const response =
await fetch("/data/epl/teams.json");

const teams =
await response.json();

const team =
teams.find(t=>t.team === teamName);

if(!team){

page.innerHTML = `
<div class="error">
Team Not Found
</div>
`;

return;

}

const opponents = [

"All Opponents",
"Liverpool",
"Chelsea",
"Arsenal",
"Manchester United",
"Manchester City",
"Tottenham Hotspur"

];

const opponentStats = {

"All Opponents":{
games:1300,
wins:463,
draws:364,
losses:473,
goals:1650
},

"Liverpool":{
games:68,
wins:21,
draws:18,
losses:29,
goals:74
},

"Chelsea":{
games:64,
wins:19,
draws:17,
losses:28,
goals:69
},

"Arsenal":{
games:62,
wins:17,
draws:15,
losses:30,
goals:61
},

"Manchester United":{
games:70,
wins:9,
draws:21,
losses:40,
goals:52
},

"Manchester City":{
games:54,
wins:14,
draws:11,
losses:29,
goals:49
},

"Tottenham Hotspur":{
games:58,
wins:20,
draws:14,
losses:24,
goals:66
}

};

const topScorers = [
["Duncan Ferguson",68],
["Romelu Lukaku",68],
["Dominic Calvert-Lewin",57],
["Tim Cahill",56],
["Kevin Campbell",45]
];

const yellowCards = [
["Lee Carsley",89],
["Phil Neville",76],
["Tim Cahill",71],
["Kevin Ratcliffe",64],
["Idrissa Gueye",61]
];

const redCards = [
["Duncan Ferguson",8],
["David Unsworth",5],
["Gravesen",4],
["Royston Drenthe",3],
["Phil Neville",3]
];

function buildRows(rows){

return rows.map(player=>`

<tr>

<td>

<a
class="player-link"
href="/epl-player.html?player=${encodeURIComponent(player[0])}"
>

${player[0]}

</a>

</td>

<td>${player[1]}</td>

</tr>

`).join("");

}

page.innerHTML = `

<div
class="hero"
style="
background:${TEAM_COLOURS[team.team] || 'linear-gradient(135deg,#111,#555)'};
"
>

<h1>${team.team}</h1>

<p>
Premier League Club Profile
</p>

</div>

<div class="container">

<div class="stats-grid">

<div class="stat-card">
<div class="stat-value">${team.seasons}</div>
<div class="stat-label">Seasons</div>
</div>

<div class="stat-card">
<div class="stat-value">${team.games}</div>
<div class="stat-label">Games</div>
</div>

<div class="stat-card">
<div class="stat-value">${team.goals}</div>
<div class="stat-label">Goals</div>
</div>

<div class="stat-card">
<div class="stat-value">${team.wins}</div>
<div class="stat-label">Wins</div>
</div>

<div class="stat-card">
<div class="stat-value">${team.draws}</div>
<div class="stat-label">Draws</div>
</div>

<div class="stat-card">
<div class="stat-value">${team.losses}</div>
<div class="stat-label">Losses</div>
</div>

</div>

<div class="section">

<div class="filters">

<select id="oppositionSelect">

${opponents.map(o=>`
<option value="${o}">
${o}
</option>
`).join("")}

</select>

</div>

<div class="section-title">
Vs Selected Opponent
</div>

<div class="stats-grid">

<div class="stat-card">
<div class="stat-value" id="oppGames">
1300
</div>
<div class="stat-label">Games</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppWins">
463
</div>
<div class="stat-label">Wins</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppDraws">
364
</div>
<div class="stat-label">Draws</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppLosses">
473
</div>
<div class="stat-label">Losses</div>
</div>

<div class="stat-card">
<div class="stat-value" id="oppGoals">
1650
</div>
<div class="stat-label">Goals</div>
</div>

</div>

</div>

<div class="section">

<div class="section-title">
Leading Scorers
</div>

<table>

<thead>

<tr>
<th>Player</th>
<th>Goals</th>
</tr>

</thead>

<tbody>

${buildRows(topScorers)}

</tbody>

</table>

</div>

<div class="section">

<div class="section-title">
Yellow Card Leaders
</div>

<table>

<thead>

<tr>
<th>Player</th>
<th>Yellow Cards</th>
</tr>

</thead>

<tbody>

${buildRows(yellowCards)}

</tbody>

</table>

</div>

<div class="section">

<div class="section-title">
Red Card Leaders
</div>

<table>

<thead>

<tr>
<th>Player</th>
<th>Red Cards</th>
</tr>

</thead>

<tbody>

${buildRows(redCards)}

</tbody>

</table>

</div>

</div>

`;

const oppositionSelect =
document.getElementById("oppositionSelect");

oppositionSelect.addEventListener("change",()=>{

const opponent =
oppositionSelect.value;

const stats =
opponentStats[opponent];

document.getElementById("oppGames").textContent =
stats.games;

document.getElementById("oppWins").textContent =
stats.wins;

document.getElementById("oppDraws").textContent =
stats.draws;

document.getElementById("oppLosses").textContent =
stats.losses;

document.getElementById("oppGoals").textContent =
stats.goals;

});

}catch(err){

console.error(err);

page.innerHTML = `
<div class="error">
Failed To Load Team Data
</div>
`;

}

}

loadTeam();

</script>

</body>
</html>
