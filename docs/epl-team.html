<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:700;
color:#0056d6;
}

.hero{
padding:80px 20px;
text-align:center;
color:white;
}

.hero h1{
margin:0;
font-size:72px;
font-weight:900;
line-height:1;
}

.hero p{
margin-top:16px;
font-size:24px;
font-weight:700;
opacity:.95;
}

.container{
max-width:1500px;
margin:36px auto;
padding:0 20px 60px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:24px;
margin-bottom:34px;
}

.stat-card{
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
text-align:center;
}

.stat-label{
font-size:14px;
font-weight:900;
text-transform:uppercase;
letter-spacing:.7px;
color:#666;
margin-bottom:14px;
}

.stat-value{
font-size:56px;
font-weight:900;
line-height:1;
}

.section{
background:white;
border-radius:20px;
padding:30px;
margin-bottom:30px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.section-title{
font-size:40px;
font-weight:900;
margin-bottom:24px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#eef2f7;
padding:16px;
font-size:14px;
font-weight:900;
text-transform:uppercase;
text-align:left;
}

td{
padding:16px;
border-bottom:1px solid #ececec;
font-size:16px;
font-weight:600;
}

tr:nth-child(even){
background:#f8fbff;
}

.loading,
.error{
padding:100px 20px;
text-align:center;
font-size:28px;
font-weight:900;
}

.error{
color:#d90429;
}

@media(max-width:900px){

.hero h1{
font-size:48px;
}

.hero p{
font-size:18px;
}

.section-title{
font-size:30px;
}

.stat-value{
font-size:42px;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/epl-teams.html">Teams</a>
<a href="/epl-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div id="page">

<div class="loading">
Loading Team...
</div>

</div>

<script>

const TEAM_COLOURS = {

"Arsenal":"linear-gradient(135deg,#EF0107,#9C0000)",
"Aston Villa":"linear-gradient(135deg,#670E36,#95BFE5)",
"Barnsley":"linear-gradient(135deg,#B5121B,#7A0000)",
"Birmingham City":"linear-gradient(135deg,#0057B8,#003B7A)",
"Blackburn Rovers":"linear-gradient(135deg,#0094D9,#004B87)",
"Blackpool":"linear-gradient(135deg,#FF7F00,#000000)",
"Bolton Wanderers":"linear-gradient(135deg,#ffffff,#1B458F)",
"Bournemouth":"linear-gradient(135deg,#DA291C,#000000)",
"Bradford City":"linear-gradient(135deg,#B5121B,#F4C542)",
"Brentford":"linear-gradient(135deg,#E30613,#111111)",
"Brighton & Hove Albion":"linear-gradient(135deg,#0057B8,#FFFFFF)",
"Burnley":"linear-gradient(135deg,#6C1D45,#99D6EA)",
"Cardiff City":"linear-gradient(135deg,#0070B5,#FFFFFF)",
"Charlton Athletic":"linear-gradient(135deg,#D71920,#111111)",
"Chelsea":"linear-gradient(135deg,#034694,#001C58)",
"Coventry City":"linear-gradient(135deg,#87CEEB,#005BAC)",
"Crystal Palace":"linear-gradient(135deg,#1B458F,#C4122E)",
"Derby County":"linear-gradient(135deg,#FFFFFF,#000000)",
"Everton":"linear-gradient(135deg,#003399,#001C58)",
"Fulham":"linear-gradient(135deg,#FFFFFF,#000000)",
"Huddersfield Town":"linear-gradient(135deg,#0E63AD,#FFFFFF)",
"Hull City":"linear-gradient(135deg,#F0A500,#000000)",
"Ipswich Town":"linear-gradient(135deg,#005BAC,#FFFFFF)",
"Leeds United":"linear-gradient(135deg,#FFCD00,#1D428A)",
"Leicester City":"linear-gradient(135deg,#003090,#FDBE11)",
"Liverpool":"linear-gradient(135deg,#C8102E,#00B2A9)",
"Luton Town":"linear-gradient(135deg,#FF6B00,#002D72)",
"Manchester City":"linear-gradient(135deg,#6CABDD,#1C2C5B)",
"Manchester United":"linear-gradient(135deg,#DA291C,#FBE122)",
"Middlesbrough":"linear-gradient(135deg,#D71920,#FFFFFF)",
"Newcastle United":"linear-gradient(135deg,#000000,#666666)",
"Norwich City":"linear-gradient(135deg,#FFF200,#00A650)",
"Nottingham Forest":"linear-gradient(135deg,#DD0000,#FFFFFF)",
"Oldham Athletic":"linear-gradient(135deg,#1B75BC,#FFFFFF)",
"Portsmouth":"linear-gradient(135deg,#003DA5,#FFFFFF)",
"Queens Park Rangers":"linear-gradient(135deg,#005CAB,#FFFFFF)",
"Reading":"linear-gradient(135deg,#0054A6,#FFFFFF)",
"Sheffield United":"linear-gradient(135deg,#EE2737,#111111)",
"Sheffield Wednesday":"linear-gradient(135deg,#0067B1,#FFFFFF)",
"Southampton":"linear-gradient(135deg,#D71920,#FFFFFF)",
"Stoke City":"linear-gradient(135deg,#E03A3E,#FFFFFF)",
"Sunderland":"linear-gradient(135deg,#EB172B,#FFFFFF)",
"Swansea City":"linear-gradient(135deg,#FFFFFF,#000000)",
"Swindon Town":"linear-gradient(135deg,#E4002B,#FFFFFF)",
"Tottenham Hotspur":"linear-gradient(135deg,#132257,#FFFFFF)",
"Watford":"linear-gradient(135deg,#FBEE23,#ED2127)",
"West Bromwich Albion":"linear-gradient(135deg,#122F67,#FFFFFF)",
"West Ham United":"linear-gradient(135deg,#7A263A,#1BB1E7)",
"Wigan Athletic":"linear-gradient(135deg,#005BAC,#FFFFFF)",
"Wimbledon":"linear-gradient(135deg,#1E3A8A,#F4C542)",
"Wolverhampton Wanderers":"linear-gradient(135deg,#FDB913,#231F20)"

};

const params = new URLSearchParams(window.location.search);

const teamName = params.get("team");

const page = document.getElementById("page");

if(!teamName){

page.innerHTML = `
<div class="error">
No Team Selected
</div>
`;

throw new Error("No Team Selected");

}

async function loadTeam(){

try{

const response =
await fetch("/data/epl/teams.json");

if(!response.ok){

throw new Error("teams.json missing");

}

const teams =
await response.json();

const team =
teams.find(t=>
t.team === teamName
);

if(!team){

page.innerHTML = `
<div class="error">
Team Not Found
</div>
`;

return;

}

page.innerHTML = `

<div
class="hero"
style="
background:${TEAM_COLOURS[team.team] || 'linear-gradient(135deg,#111,#555)'};
"
>

<h1>
${team.team}
</h1>

<p>
Premier League Club Profile
</p>

</div>

<div class="container">

<div class="stats-grid">

<div class="stat-card">

<div class="stat-label">
Seasons
</div>

<div class="stat-value">
${team.seasons || 0}
</div>

</div>

<div class="stat-card">

<div class="stat-label">
Games
</div>

<div class="stat-value">
${team.games || 0}
</div>

</div>

<div class="stat-card">

<div class="stat-label">
Goals
</div>

<div class="stat-value">
${team.goals || 0}
</div>

</div>

<div class="stat-card">

<div class="stat-label">
Wins
</div>

<div class="stat-value">
${team.wins || 0}
</div>

</div>

<div class="stat-card">

<div class="stat-label">
Draws
</div>

<div class="stat-value">
${team.draws || 0}
</div>

</div>

<div class="stat-card">

<div class="stat-label">
Losses
</div>

<div class="stat-value">
${team.losses || 0}
</div>

</div>

</div>

<div class="section">

<div class="section-title">
Club Summary
</div>

<table>

<tbody>

<tr>
<td><strong>Club</strong></td>
<td>${team.team}</td>
</tr>

<tr>
<td><strong>Premier League Seasons</strong></td>
<td>${team.seasons || 0}</td>
</tr>

<tr>
<td><strong>Games Played</strong></td>
<td>${team.games || 0}</td>
</tr>

<tr>
<td><strong>Total Goals</strong></td>
<td>${team.goals || 0}</td>
</tr>

<tr>
<td><strong>Wins</strong></td>
<td>${team.wins || 0}</td>
</tr>

<tr>
<td><strong>Draws</strong></td>
<td>${team.draws || 0}</td>
</tr>

<tr>
<td><strong>Losses</strong></td>
<td>${team.losses || 0}</td>
</tr>

</tbody>

</table>

</div>

</div>

`;

}catch(err){

console.error(err);

page.innerHTML = `

<div class="error">
Failed To Load Team Data
</div>

`;

}

}

loadTeam();

</script>

</body>
</html>
