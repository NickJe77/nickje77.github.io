<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Team | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:700;
color:#0056d6;
}

.hero{
padding:80px 20px;
text-align:center;
color:white;
}

.hero h1{
margin:0;
font-size:72px;
font-weight:900;
line-height:1;
}

.hero p{
margin-top:16px;
font-size:24px;
font-weight:700;
opacity:.95;
}

.container{
max-width:1600px;
margin:36px auto;
padding:0 20px 60px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:24px;
margin-bottom:34px;
}

.stat-card{
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
text-align:center;
}

.stat-label{
font-size:14px;
font-weight:900;
text-transform:uppercase;
letter-spacing:.7px;
color:#666;
margin-bottom:14px;
}

.stat-value{
font-size:56px;
font-weight:900;
line-height:1;
}

.section{
background:white;
border-radius:20px;
padding:30px;
margin-bottom:30px;
box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.section-title{
font-size:40px;
font-weight:900;
margin-bottom:24px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#eef2f7;
padding:16px;
font-size:14px;
font-weight:900;
text-transform:uppercase;
text-align:left;
}

td{
padding:16px;
border-bottom:1px solid #ececec;
font-size:16px;
font-weight:600;
}

tr:nth-child(even){
background:#f8fbff;
}

.loading,
.error{
padding:100px 20px;
text-align:center;
font-size:28px;
font-weight:900;
}

.error{
color:#d90429;
}

.player-link{
text-decoration:none;
font-weight:800;
color:#0056d6;
}

.player-link:hover{
text-decoration:underline;
}

.result-win{
color:#009944;
font-weight:900;
}

.result-loss{
color:#d90429;
font-weight:900;
}

.result-draw{
color:#e67e22;
font-weight:900;
}

@media(max-width:900px){

.hero h1{
font-size:48px;
}

.hero p{
font-size:18px;
}

.section-title{
font-size:30px;
}

.stat-value{
font-size:42px;
}

table{
display:block;
overflow-x:auto;
white-space:nowrap;
}

}

</style>

</head>

<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/epl-teams.html">Teams</a>
<a href="/epl-players.html">Players</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
</div>

<div id="page">

<div class="loading">
Loading Team...
</div>

</div>

<script>

const TEAM_COLOURS = {

"Everton":"linear-gradient(135deg,#003399,#001C58)",
"Arsenal":"linear-gradient(135deg,#EF0107,#9C0000)",
"Liverpool":"linear-gradient(135deg,#C8102E,#00B2A9)",
"Chelsea":"linear-gradient(135deg,#034694,#001C58)",
"Manchester United":"linear-gradient(135deg,#DA291C,#FBE122)",
"Manchester City":"linear-gradient(135deg,#6CABDD,#1C2C5B)",
"Tottenham Hotspur":"linear-gradient(135deg,#132257,#FFFFFF)"

};

const params = new URLSearchParams(window.location.search);

const teamName = params.get("team");

const page = document.getElementById("page");

async function loadTeam(){

try{

const teamsResponse =
await fetch("/data/epl/teams.json");

const teams =
await teamsResponse.json();

const team =
teams.find(t=>t.team === teamName);

if(!team){

page.innerHTML = `
<div class="error">
Team Not Found
</div>
`;

return;

}

const matchFiles = [];

for(let yr=1992; yr<=2025; yr++){

const end =
String(yr+1).slice(-2);

const season =
`${yr}-${end}`;

for(let i=1;i<=500;i++){

const num =
String(i).padStart(4,"0");

matchFiles.push(
`/data/epl/matches/${season}/${season}_${num}.json`
);

}

}

const topScorers = {};
const yellowCards = {};
const redCards = {};

const recentMatches = [];

for(const file of matchFiles){

try{

const res = await fetch(file);

if(!res.ok) continue;

const game = await res.json();

const home = game.home_team || "";
const away = game.away_team || "";

if(
home !== teamName &&
away !== teamName
){
continue;
}

const homeGoals =
Number(game.home_score || 0);

const awayGoals =
Number(game.away_score || 0);

const opponent =
home === teamName
? away
: home;

let result = "D";

if(home === teamName){

if(homeGoals > awayGoals) result = "W";
if(homeGoals < awayGoals) result = "L";

}else{

if(awayGoals > homeGoals) result = "W";
if(awayGoals < homeGoals) result = "L";

}

recentMatches.push({

opponent,
result,
score:
`${homeGoals}-${awayGoals}`

});

(game.scorers || []).forEach(s=>{

const scorer =
typeof s === "string"
? s
: s.player || s.name || "";

if(!scorer) return;

topScorers[scorer] =
(topScorers[scorer] || 0) + 1;

});

(game.yellow_cards || []).forEach(c=>{

const player =
typeof c === "string"
? c
: c.player || c.name || "";

if(!player) return;

yellowCards[player] =
(yellowCards[player] || 0) + 1;

});

(game.red_cards || []).forEach(c=>{

const player =
typeof c === "string"
? c
: c.player || c.name || "";

if(!player) return;

redCards[player] =
(redCards[player] || 0) + 1;

});

}catch(err){}

}

const scorersTable =
Object.entries(topScorers)
.sort((a,b)=>b[1]-a[1])
.slice(0,20);

const yellowTable =
Object.entries(yellowCards)
.sort((a,b)=>b[1]-a[1])
.slice(0,10);

const redTable =
Object.entries(redCards)
.sort((a,b)=>b[1]-a[1])
.slice(0,10);

page.innerHTML = `

<div
class="hero"
style="
background:${TEAM_COLOURS[team.team] || 'linear-gradient(135deg,#111,#555)'};
"
>

<h1>${team.team}</h1>

<p>Premier League Club Profile</p>

</div>

<div class="container">

<div class="stats-grid">

<div class="stat-card">
<div class="stat-label">Seasons</div>
<div class="stat-value">${team.seasons}</div>
</div>

<div class="stat-card">
<div class="stat-label">Games</div>
<div class="stat-value">${team.games}</div>
</div>

<div class="stat-card">
<div class="stat-label">Goals</div>
<div class="stat-value">${team.goals}</div>
</div>

<div class="stat-card">
<div class="stat-label">Wins</div>
<div class="stat-value">${team.wins}</div>
</div>

<div class="stat-card">
<div class="stat-label">Draws</div>
<div class="stat-value">${team.draws}</div>
</div>

<div class="stat-card">
<div class="stat-label">Losses</div>
<div class="stat-value">${team.losses}</div>
</div>

</div>

<div class="section">

<div class="section-title">
Top Scorers
</div>

<table>

<thead>

<tr>
<th>Player</th>
<th>Goals</th>
</tr>

</thead>

<tbody>

${scorersTable.map(s=>`

<tr>

<td>
<a
class="player-link"
href="/epl-player.html?player=${encodeURIComponent(s[0])}"
>
${s[0]}
</a>
</td>

<td>${s[1]}</td>

</tr>

`).join("")}

</tbody>

</table>

</div>

<div class="section">

<div class="section-title">
Card Leaders
</div>

<table>

<thead>

<tr>
<th>Player</th>
<th>Yellow Cards</th>
<th>Red Cards</th>
</tr>

</thead>

<tbody>

${yellowTable.map(y=>`

<tr>

<td>${y[0]}</td>

<td>${y[1]}</td>

<td>${redCards[y[0]] || 0}</td>

</tr>

`).join("")}

</tbody>

</table>

</div>

<div class="section">

<div class="section-title">
Recent Matches
</div>

<table>

<thead>

<tr>
<th>Opponent</th>
<th>Score</th>
<th>Result</th>
</tr>

</thead>

<tbody>

${recentMatches.slice(-20).reverse().map(g=>`

<tr>

<td>
vs ${g.opponent}
</td>

<td>
${g.score}
</td>

<td class="
${g.result==="W" ? "result-win" : ""}
${g.result==="L" ? "result-loss" : ""}
${g.result==="D" ? "result-draw" : ""}
">
${g.result}
</td>

</tr>

`).join("")}

</tbody>

</table>

</div>

</div>

`;

}catch(err){

console.error(err);

page.innerHTML = `
<div class="error">
Failed To Load Team Data
</div>
`;

}

}

loadTeam();

</script>

</body>
</html>
