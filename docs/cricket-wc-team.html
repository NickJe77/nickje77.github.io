<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>World Cup Team | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Inter, system-ui, Arial, sans-serif; margin: 0; background: #ffffff; }
    .navbar { display: flex; justify-content: center; gap: 22px; padding: 16px 0; border-bottom: 1px solid #ddd; font-weight: 600; }
    .navbar a { color: #0056d6; text-decoration: none; font-size: 18px; }
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .hero { background: linear-gradient(90deg, #004d00, #006400); color: white; padding: 40px 50px; border-radius: 24px; margin-bottom: 24px; }
    .hero h1 { margin: 0; font-size: 46px; }
    .hero p { margin-top: 10px; font-size: 18px; opacity: 0.95; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 32px; }
    @media(min-width: 900px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card.full-width { grid-column: 1 / -1; max-width: 280px; margin: 0 auto; width: 100%; }
    @media(min-width: 900px) { .stat-card.full-width { grid-column: auto; max-width: none; margin: 0; } }
    .stat-card { background: #f0f9f0; border: 1px solid #c8e6c9; border-radius: 14px; padding: 18px 20px; }
    .stat-card h3 { margin: 0 0 12px; font-size: 15px; color: #004d00; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-card ol { margin: 0; padding-left: 20px; }
    .stat-card li { font-size: 14px; padding: 3px 0; color: #222; }
    .stat-card li span { float: right; font-weight: 700; color: #004d00; }
    .stat-card a { color: #004d00; text-decoration: none; }
    .stat-card a:hover { text-decoration: underline; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { border-bottom: 1px solid #ddd; padding: 12px 14px; text-align: left; }
    th { background: #f3f6fb; }
    tr:nth-child(even) { background: #f6fbf6; }
    tr:hover { background: #edf7ed; }
    .match-link { color: inherit; text-decoration: none; display: block; width: 100%; }
    .match-link:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid #ddd; background: #fff; }
    .badge.win  { color: #1a7f37; }
    .badge.loss { color: #b42318; }
    .badge.nr   { color: #555; }
    h2 { color: #004d00; margin: 0 0 16px; }
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>
<div class="page-wrap">
  <div class="hero">
    <h1 id="teamName">Team</h1>
    <p>Click any match to open the full scorecard.</p>
  </div>

  <div class="stats-grid" id="statsGrid" style="display:none">
    <div class="stat-card">
      <h3>🏏 Top Run Scorers</h3>
      <ol id="topRuns"></ol>
    </div>
    <div class="stat-card">
      <h3>⚡ Top Wicket Takers</h3>
      <ol id="topWickets"></ol>
    </div>
    <div class="stat-card">
      <h3>🧤 Catches & Stumpings</h3>
      <ol id="topFielding"></ol>
    </div>
    <div class="stat-card full-width">
      <h3>💨 Best Strike Rate <small style="font-weight:400;font-size:11px">(min 100 balls)</small></h3>
      <ol id="topSR"></ol>
    </div>
  </div>

  <h2>Match Results</h2>
  <table>
    <thead>
      <tr>
        <th>Year</th><th>Date</th><th>Opponent</th><th>Ground</th><th>Result</th>
      </tr>
    </thead>
    <tbody id="matchesTable"></tbody>
  </table>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const team   = params.get("team") || "";
document.getElementById("teamName").textContent = team;
document.title = `${team} | World Cup | The Sporting Almanac`;

const TOURNAMENTS = [
  { year: "1975", file: "wc_1975" },
  { year: "1979", file: "wc_1979" },
  { year: "1983", file: "wc_1983" },
  { year: "1987", file: "wc_1987_1988" },
  { year: "1992", file: "wc_1991_1992" },
  { year: "1996", file: "wc_1995_1996" },
  { year: "1999", file: "wc_1999" },
  { year: "2003", file: "wc_2002_2003" },
  { year: "2007", file: "wc_2006_2007" },
  { year: "2011", file: "wc_2010_2011" },
  { year: "2015", file: "wc_2014_2015" },
  { year: "2019", file: "wc_2019" },
  { year: "2023", file: "wc_2023" },
];

const basePath = "data/cricket/world-cup/scorecards/";

Promise.all(
  TOURNAMENTS.map(t =>
    fetch(`${basePath}${t.file}.json`)
      .then(r => r.json())
      .then(data => ({ t, matches: data.matches || [] }))
      .catch(() => ({ t, matches: [] }))
  )
).then(results => {
  const rows = [];
  const runs     = {};  // player -> total runs
  const balls    = {};  // player -> total balls
  const wickets  = {};  // player -> total wickets
  const fielding = {};  // player -> catches + stumpings

  results.forEach(({ t, matches }) => {
    matches.forEach(m => {
      const parts = m.teams.split(" v ");
      if (parts.length !== 2) return;
      const t1 = parts[0].trim();
      const t2 = parts[1].trim();
      if (t1 !== team && t2 !== team) return;

      const opponent    = t1 === team ? t2 : t1;
      const result      = m.result || "";
      let resultText    = "No result", resultClass = "nr";
      if (result.includes(team + " won"))  { resultText = "Won";  resultClass = "win"; }
      else if (result.includes(" won"))    { resultText = "Lost"; resultClass = "loss"; }
      rows.push({ year: t.year, file: t.file, code: m.match_code, date: m.date, opponent, ground: m.ground, resultText, resultClass });

      // Stats from innings
      const sc = m.scorecard;
      if (!sc || !sc.innings) return;

      sc.innings.forEach(inn => {
        const isTeamBatting  = inn.team === team;
        const isTeamBowling  = !isTeamBatting;

        if (isTeamBatting) {
          // Batting stats
          inn.batting.forEach(b => {
            if (!b.batsman || b.batsman === "[unknown]") return;
            runs[b.batsman]  = (runs[b.batsman]  || 0) + (b.runs || 0);
            balls[b.batsman] = (balls[b.batsman] || 0) + (b.balls_faced || 0);
          });
          // Catches from fielding (team players catching for opponents)
        }

        if (isTeamBowling) {
          // Bowling stats
          inn.bowling.forEach(b => {
            if (!b.bowler) return;
            wickets[b.bowler] = (wickets[b.bowler] || 0) + (b.wickets || 0);
          });
        }

        // Fielding: catches & stumpings from dismissals in any innings
        // When this team is bowling, the fielders are from this team
        if (isTeamBowling) {
          inn.batting.forEach(b => {
            const d = b.dismissal || "";
            // "c FielderName b Bowler" or "st FielderName b Bowler"
            const catchM  = d.match(/^c\s+([^b]+?)\s+b\s+/i);
            const stumpM  = d.match(/^st\s+([^b]+?)\s+b\s+/i);
            const fielder = (catchM || stumpM)?.[1]?.trim();
            if (fielder && fielder !== "" && fielder !== "sub") {
              fielding[fielder] = (fielding[fielder] || 0) + 1;
            }
          });
        }
      });
    });
  });

  // Render stats cards
  function playerLink(name) {
    return `<a href="cricket-wc-player.html?player=${encodeURIComponent(name)}">${name}</a>`;
  }

  function renderList(elId, entries, valFn) {
    const top5 = entries.slice(0, 5);
    document.getElementById(elId).innerHTML = top5.map(([name, val]) =>
      `<li>${playerLink(name)} <span>${valFn(val)}</span></li>`
    ).join("") || "<li>No data</li>";
  }

  const topRuns = Object.entries(runs).sort((a,b) => b[1]-a[1]);
  const topWkts = Object.entries(wickets).sort((a,b) => b[1]-a[1]);
  const topFld  = Object.entries(fielding).sort((a,b) => b[1]-a[1]);
  const topSR   = Object.entries(runs)
    .filter(([p]) => (balls[p] || 0) >= 100)
    .map(([p, r]) => [p, r / (balls[p] || 1) * 100])
    .sort((a,b) => b[1]-a[1]);

  renderList("topRuns",    topRuns, v => v + " runs");
  renderList("topWickets", topWkts, v => v + " wkts");
  renderList("topFielding",topFld,  v => v);
  renderList("topSR",      topSR,   v => v.toFixed(2));

  document.getElementById("statsGrid").style.display = "grid";

  // Render matches table
  const tableBody = document.getElementById("matchesTable");
  if (!rows.length) {
    tableBody.innerHTML = `<tr><td colspan="5">No matches found for ${escapeHtml(team)}.</td></tr>`;
    return;
  }

  tableBody.innerHTML = rows.map(r => {
    const href = `cricket-wc-match.html?file=${encodeURIComponent(r.file)}&code=${encodeURIComponent(r.code)}`;
    return `
      <tr>
        <td><a class="match-link" href="${href}">${r.year}</a></td>
        <td><a class="match-link" href="${href}">${formatDate(r.date)}</a></td>
        <td><a class="match-link" href="${href}">${escapeHtml(r.opponent)}</a></td>
        <td><a class="match-link" href="${href}">${escapeHtml(r.ground)}</a></td>
        <td><a class="match-link" href="${href}"><span class="badge ${r.resultClass}">${r.resultText}</span></a></td>
      </tr>`;
  }).join("");
});

function formatDate(d) {
  if (!d) return "—";
  const [day, mon, yr] = d.split("/");
  const dt = new Date(`${yr}-${mon}-${day}`);
  return isNaN(dt) ? d : dt.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

function escapeHtml(str) {
  return String(str || "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
</script>
</body>
</html>
