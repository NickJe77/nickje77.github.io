<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --zebra:#f0f6ff;
  --hover:#e0ecff;
}

body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#ffffff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 40px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:white;
  padding:32px;
  border-radius:18px;
  margin-bottom:20px;
}
.hero h1{
  margin:0;
  font-size:42px;
}

.card{
  background:var(--card);
  border-radius:14px;
  border:1px solid var(--line);
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

th{
  background:#f0f3f7;
  font-weight:700;
}

tbody tr:nth-child(even){
  background:var(--zebra);
}

tbody tr{
  cursor:pointer;
}

tbody tr:hover{
  background:var(--hover);
}

.score{
  font-weight:700;
}

.error{
  background:#ffe5e5;
  padding:14px;
  border-radius:8px;
  margin-bottom:15px;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="seasonTitle">MLB Season</h1>
</div>

<div id="errorBox"></div>

<div class="card">
<table>
<thead>
<tr>
  <th>Date</th>
  <th>Away</th>
  <th>Home</th>
  <th>Score</th>
  <th>Venue</th>
  <th>Attendance</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const season = params.get("season");

if(!season){
  document.getElementById("errorBox").innerHTML =
    `<div class="error">No season specified</div>`;
}else{

document.getElementById("seasonTitle").textContent =
  "MLB Season " + season;

Promise.all([
  fetch("data/baseball/seasons/" + season + ".json").then(r=>{
    if(!r.ok) throw new Error();
    return r.json();
  }),
  fetch("data/baseball/teams.json").then(r=>r.json()),
  fetch("data/baseball/ballparks.csv").then(r=>r.text())
])
.then(([seasonData, teamNames, ballparkCSV])=>{

  const parkMap = {};
  const lines = ballparkCSV.trim().split("\n");
  lines.forEach(line=>{
    const parts = line.split(",");
    if(parts.length >= 2){
      parkMap[parts[0].trim()] = parts[1].trim();
    }
  });

  const tbody = document.getElementById("gamesBody");
  tbody.innerHTML = "";

  seasonData.forEach(game=>{

    // Use real game_id if exists, otherwise construct it
    let gameId = game.game_id;

    if(!gameId && game.home_code && game.date){
      const ymd = game.date.replace(/-/g,"");
      gameId = game.home_code + ymd + "0";
    }

    const link =
      "baseball-game.html?season=" +
      season +
      "&game=" +
      gameId;

    const awayName =
      teamNames[game.away_code] ||
      game.away_team ||
      game.away_code;

    const homeName =
      teamNames[game.home_code] ||
      game.home_team ||
      game.home_code;

    const venueName =
      parkMap[game.venue] ||
      game.venue ||
      "";

    const score =
      (game.away_score !== undefined &&
       game.home_score !== undefined)
        ? game.away_score + "-" + game.home_score
        : "";

    const tr = document.createElement("tr");
    tr.onclick = () => {
      if(gameId){
        window.location.href = link;
      }
    };

    tr.innerHTML = `
      <td>${game.date}</td>
      <td>${awayName}</td>
      <td>${homeName}</td>
      <td class="score">${score}</td>
      <td>${venueName}</td>
      <td>${game.attendance ? Number(game.attendance).toLocaleString() : ""}</td>
    `;

    tbody.appendChild(tr);

  });

})
.catch(()=>{
  document.getElementById("errorBox").innerHTML =
    `<div class="error">Could not load season file for ${season}</div>`;
});

}
</script>

</body>
</html>
