<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --line:#e6e8ee;
  --zebra:#f0f6ff;
  --hover:#e0ecff;
}
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}
.page{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 40px;
}
.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:white;
  padding:32px;
  border-radius:18px;
  margin-bottom:20px;
}
.hero h1{
  margin:0;
  font-size:42px;
}
.card{
  background:var(--card);
  border-radius:14px;
  border:1px solid var(--line);
  overflow:hidden;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:12px;
  border-bottom:1px solid var(--line);
  font-size:14px;
  text-align:center;
}
th{
  background:#f0f3f7;
  font-weight:700;
}
tbody tr:nth-child(even){
  background:var(--zebra);
}
tbody tr:hover{
  background:var(--hover);
}
.score{
  font-weight:700;
}
a.game-link{
  display:block;
  color:inherit;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="seasonTitle">MLB Season</h1>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Away</th>
          <th>Home</th>
          <th>Score</th>
          <th>Venue</th>
          <th>Attendance</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const season = params.get("season");

document.getElementById("seasonTitle").textContent =
  season ? "MLB Season " + season : "Season Not Found";

if(!season){
  console.error("No season provided");
} else {
  Promise.all([
    fetch("/data/baseball/seasons/" + season + ".json").then(r => r.json()),
    fetch("/data/baseball/teams.json").then(r => r.json()),
    fetch("/data/baseball/ballparks.csv").then(r => r.text())
  ]).then(([seasonData, teamNames, ballparkCSV]) => {

    const parkMap = {};
    ballparkCSV.trim().split("\n").forEach((line, i) => {
      if(i === 0) return;
      const parts = line.split(",");
      if(parts.length >= 2){
        parkMap[parts[0].trim()] = parts.slice(1).join(",").trim();
      }
    });

    function teamName(code){
      const t = teamNames.find(t => Array.isArray(t.codes) && t.codes.includes(code));
      return t ? t.name : code;
    }

    const tbody = document.getElementById("gamesBody");
    tbody.innerHTML = "";

    let games = [];

    if(Array.isArray(seasonData)){
      games = seasonData.map(g => ({
        game_id: g[0],
        date: g[1],
        home_team: teamName(g[3]),
        away_team: teamName(g[4]),
        venue: g[5],
        attendance: g[6],
        away_score: g[7],
        home_score: g[8]
      }));
    } else if(seasonData && Array.isArray(seasonData.games)){
      games = seasonData.games.map(g => ({
        game_id: g.game_id,
        date: g.date,
        home_team: g.home_team || teamName(g.home_code),
        away_team: g.away_team || teamName(g.away_code),
        venue: g.venue || "",
        attendance: g.attendance || "",
        away_score: g.away_score,
        home_score: g.home_score
      }));
    }

    if(!games.length){
      console.error("NO GAMES FOUND", seasonData);
      return;
    }

    games.sort((a,b)=> new Date(a.date) - new Date(b.date));

    games.forEach(g => {
      const score =
        (g.away_score != null && g.home_score != null)
        ? `${g.away_score}-${g.home_score}`
        : "";

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td><a class="game-link" href="baseball-game.html?game=${encodeURIComponent(g.game_id)}&season=${encodeURIComponent(season)}">${g.date}</a></td>
        <td>${g.away_team || ""}</td>
        <td>${g.home_team || ""}</td>
        <td class="score">${score}</td>
        <td>${parkMap[g.venue] || g.venue || ""}</td>
        <td>${g.attendance ? Number(g.attendance).toLocaleString() : ""}</td>
      `;

      tbody.appendChild(tr);
    });

  }).catch(err=>{
    console.error("LOAD ERROR:", err);
  });
}
</script>

</body>
</html>
