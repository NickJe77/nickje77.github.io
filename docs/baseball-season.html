<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLB Season | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Inter,system-ui,sans-serif;
    background:#f4f6f8;
}

.nav{
    background:white;
    border-bottom:1px solid #dfe5ec;
    padding:16px 10px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.nav a{
    color:#0056d6;
    text-decoration:none;
    font-weight:700;
    margin:0 18px;
    font-size:15px;
}

/* ---------------- LAYOUT ---------------- */

.layout{
    display:flex;
    gap:20px;
    max-width:1600px;
    margin:0 auto;
    padding:20px;
    align-items:flex-start;
}

.ad-col{
    width:160px;
    min-width:160px;
    position:sticky;
    top:80px;
}

.ad-slot{
    width:160px;
    min-height:600px;
    background:white;
    border-radius:16px;
    border:1px dashed #dce3eb;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#bbb;
    font-size:11px;
    text-align:center;
}

.page{
    flex:1;
    min-width:0;
}

/* ---------------- HERO ---------------- */

.hero{
    background:linear-gradient(135deg,#002f87,#d90429);
    border-radius:30px;
    padding:42px;
    color:white;
    margin-bottom:25px;
}

.hero h1{
    margin:0;
    font-size:58px;
    line-height:1;
}

/* ---------------- YEAR TABS ---------------- */

.year-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:22px;
}

.year-tab{
    background:white;
    padding:8px 14px;
    border-radius:12px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    border:1px solid #dce3eb;
}

.year-tab.active{
    background:#0056d6;
    color:white;
}

/* ---------------- FILTERS ---------------- */

.filters{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
    align-items:center;
}

.filters input,
.filters select{
    padding:8px 12px;
    border:1px solid #dce3eb;
    border-radius:10px;
    font-size:13px;
    font-family:inherit;
    background:white;
    outline:none;
}

.filters input{
    width:200px;
}

.filter-count{
    font-size:12px;
    color:#666;
    margin-left:auto;
}

/* ---------------- TABLE ---------------- */

.table-wrap{
    background:white;
    border-radius:22px;
    overflow-x:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
}

th{
    background:#0056d6;
    color:white;
    padding:12px 14px;
    text-align:left;
    font-size:13px;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
}

th:hover{
    background:#0047b8;
}

th .sort-arrow{
    margin-left:4px;
    opacity:0.6;
}

td{
    padding:12px 14px;
    border-bottom:1px solid #edf2f7;
    font-size:13px;
}

tr:nth-child(even){
    background:#f7fbff;
}

tbody tr{
    cursor:pointer;
    transition:.15s;
}

tbody tr:hover{
    background:#eaf2ff;
}

.score{
    font-weight:700;
    white-space:nowrap;
}

.no-results{
    text-align:center;
    padding:40px;
    color:#999;
    font-size:14px;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:900px){

.layout{
    padding:10px;
    gap:0;
}

.ad-col{
    display:none;
}

.hero{
    padding:22px;
    border-radius:22px;
    margin-bottom:18px;
}

.hero h1{
    font-size:34px;
}

.nav{
    padding:12px 6px;
}

.nav a{
    margin:0 8px;
    font-size:12px;
}

.year-tabs{
    gap:6px;
    margin-bottom:16px;
}

.year-tab{
    font-size:10px;
    padding:6px 8px;
    border-radius:10px;
}

th{
    font-size:10px;
    padding:8px 6px;
}

td{
    font-size:10px;
    padding:8px 6px;
}

.filters input{
    width:140px;
}

}

</style>
</head>

<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="baseball-seasons.html">Seasons</a>
    <a href="baseball-players.html">Players</a>
</div>

<div class="layout">

    <!-- LEFT AD -->
    <div class="ad-col">
        <div class="ad-slot">Ad</div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="page">

        <div class="hero">
            <h1 id="heroTitle">MLB Season</h1>
        </div>

        <div class="year-tabs" id="yearTabs"></div>

        <div class="filters">
            <input
                type="text"
                id="searchInput"
                placeholder="Search team or venue…"
                oninput="applyFilters()"
            />
            <select id="statusFilter" onchange="applyFilters()">
                <option value="">All statuses</option>
                <option value="Final">Final</option>
                <option value="Live">Live</option>
                <option value="Scheduled">Scheduled</option>
                <option value="Postponed">Postponed</option>
            </select>
            <span class="filter-count" id="filterCount"></span>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortBy('date')">Date <span class="sort-arrow" id="sort-date">↕</span></th>
                        <th onclick="sortBy('away_team')">Away <span class="sort-arrow" id="sort-away_team">↕</span></th>
                        <th onclick="sortBy('home_team')">Home <span class="sort-arrow" id="sort-home_team">↕</span></th>
                        <th>Score</th>
                        <th onclick="sortBy('venue')">Venue <span class="sort-arrow" id="sort-venue">↕</span></th>
                    </tr>
                </thead>
                <tbody id="gamesBody"></tbody>
            </table>
        </div>

    </div>

    <!-- RIGHT AD -->
    <div class="ad-col">
        <div class="ad-slot">Ad</div>
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
let season = params.get("season") || "2026";

document.getElementById("heroTitle").innerText = `MLB ${season} Season`;

const years = [];
for(let y = 2026; y >= 1901; y--){
    years.push(String(y));
}

let allGames = [];
let sortKey = "date";
let sortDir = 1;
let VENUE_NAMES = {};

const TEAM_NAMES = {
    "ARI": "Arizona Diamondbacks",
    "ATL": "Atlanta Braves",
    "BAL": "Baltimore Orioles",
    "BOS": "Boston Red Sox",
    "CHC": "Chicago Cubs",
    "CHW": "Chicago White Sox",
    "CIN": "Cincinnati Reds",
    "CLE": "Cleveland Guardians",
    "COL": "Colorado Rockies",
    "DET": "Detroit Tigers",
    "HOU": "Houston Astros",
    "KAN": "Kansas City Royals",
    "LAA": "Los Angeles Angels",
    "LAD": "Los Angeles Dodgers",
    "MIA": "Miami Marlins",
    "MIL": "Milwaukee Brewers",
    "MIN": "Minnesota Twins",
    "NYM": "New York Mets",
    "NYY": "New York Yankees",
    "ATH": "Athletics",
    "PHI": "Philadelphia Phillies",
    "PIT": "Pittsburgh Pirates",
    "SD":  "San Diego Padres",
    "SEA": "Seattle Mariners",
    "SF":  "San Francisco Giants",
    "STL": "St. Louis Cardinals",
    "TB":  "Tampa Bay Rays",
    "TEX": "Texas Rangers",
    "TOR": "Toronto Blue Jays",
    "WSH": "Washington Nationals",
    "ANA": "Los Angeles Angels",
    "CAL": "California Angels",
    "FLA": "Florida Marlins",
    "MON": "Montreal Expos",
    "OAK": "Oakland Athletics",
    "SFN": "San Francisco Giants",
    "SDN": "San Diego Padres",
    "SLN": "St. Louis Cardinals",
    "NYN": "New York Mets",
    "NYA": "New York Yankees",
    "CHN": "Chicago Cubs",
    "CHA": "Chicago White Sox",
    "KCA": "Kansas City Royals",
    "LAN": "Los Angeles Dodgers",
    "TBA": "Tampa Bay Rays",
    "WAS": "Washington Nationals"
};

async function loadBallparks(){
    try{
        const res = await fetch("/data/baseball/ballparks.csv");
        const text = await res.text();
        const lines = text.trim().split("\n").slice(1);
        lines.forEach(line => {
            const cols = line.split(",");
            const id   = cols[0].trim();
            const name = cols[1].trim();
            if(id && name) VENUE_NAMES[id] = name;
        });
    } catch(err){
        console.error("Could not load ballparks.csv", err);
    }
}

function resolveTeamName(game, side){
    const nameKey = side + "_team";
    const codeKey = side + "_code";
    const raw  = game[nameKey] || "";
    const code = game[codeKey] || "";
    if(raw && raw.includes(" ")){
        return raw;
    }
    const lookup = raw || code;
    return TEAM_NAMES[lookup] || lookup;
}

function resolveVenue(game){
    const v = game.venue || "";
    if(v && !v.includes(" ")){
        return VENUE_NAMES[v] || v;
    }
    return v;
}

function renderYearTabs(){
    const wrap = document.getElementById("yearTabs");
    wrap.innerHTML = "";
    years.forEach(year => {
        const div = document.createElement("div");
        div.className = "year-tab" + (year === season ? " active" : "");
        div.innerText = year;
        div.onclick = () => {
            window.location.href = `baseball-season.html?season=${year}`;
        };
        wrap.appendChild(div);
    });
}

function sortBy(key){
    if(sortKey === key){
        sortDir *= -1;
    } else {
        sortKey = key;
        sortDir = 1;
    }
    document.querySelectorAll(".sort-arrow").forEach(el => el.innerText = "↕");
    const arrow = document.getElementById(`sort-${key}`);
    if(arrow) arrow.innerText = sortDir === 1 ? "↑" : "↓";
    applyFilters();
}

function applyFilters(){
    const search = document.getElementById("searchInput").value.toLowerCase();
    const status = document.getElementById("statusFilter").value.toLowerCase();

    let filtered = allGames.filter(game => {
        const home  = resolveTeamName(game, "home");
        const away  = resolveTeamName(game, "away");
        const venue = resolveVenue(game);
        const matchSearch = !search || [
            home, away, venue, game.date || ""
        ].some(v => v.toLowerCase().includes(search));
        const matchStatus = !status ||
            (game.status || "").toLowerCase().includes(status);
        return matchSearch && matchStatus;
    });

    filtered.sort((a, b) => {
        let av = a[sortKey] || "";
        let bv = b[sortKey] || "";
        return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });

    renderGames(filtered);
}

async function loadSeason(){
    try{
        const res = await fetch(`/data/baseball/seasons/${season}.json`);
        if(!res.ok) throw new Error("Season not found");
        allGames = await res.json();
        applyFilters();
    } catch(err){
        console.error(err);
        document.getElementById("gamesBody").innerHTML =
            `<tr><td colspan="5" class="no-results">Could not load season data.</td></tr>`;
    }
}

function getGameFile(game){
    return game.game_file || game.filename || game.file || "";
}

function renderGames(games){
    const body = document.getElementById("gamesBody");
    document.getElementById("filterCount").innerText =
        `${games.length} game${games.length !== 1 ? "s" : ""}`;

    if(!games.length){
        body.innerHTML =
            `<tr><td colspan="5" class="no-results">No games match your search.</td></tr>`;
        return;
    }

    body.innerHTML = "";

    games.forEach(game => {
        const home     = resolveTeamName(game, "home");
        const away     = resolveTeamName(game, "away");
        const venue    = resolveVenue(game);
        const gameFile = getGameFile(game);
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${game.date || ""}</td>
            <td>${away}</td>
            <td>${home}</td>
            <td class="score">${game.away_score ?? 0} – ${game.home_score ?? 0}</td>
            <td>${venue}</td>
        `;
        tr.onclick = () => {
            if(!gameFile) return;
            window.location.href =
                `baseball-game.html?season=${season}&game=${encodeURIComponent(gameFile)}`;
        };
        body.appendChild(tr);
    });
}

renderYearTabs();
loadBallparks().then(() => loadSeason());

</script>

</body>
</html>
