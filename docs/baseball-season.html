<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
  --alt:#dbe8ff;
  --hover:#c5dbff;
}

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:var(--bg);
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}

.table-wrap{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--blue);
  color:#fff;
  padding:14px;
  text-align:left;
  font-size:16px;
}

td{
  padding:14px;
  border-bottom:1px solid #eee;
  font-size:16px;
}

tbody tr:nth-child(even){
  background:var(--alt);
}

tbody tr:hover{
  background:var(--hover);
  cursor:pointer;
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="mlb.html">MLB</a>
</div>

<div class="page">
  <div class="hero">
    <h1 id="seasonTitle">MLB Season</h1>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Away</th>
          <th>Home</th>
          <th>Score</th>
          <th>Venue</th>
          <th>Attendance</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const season = params.get("season");
document.getElementById("seasonTitle").textContent = "MLB Season " + season;

fetch(`/data/baseball/seasons/${season}.json`)
.then(r => r.json())
.then(seasonData => {

  const tbody = document.getElementById("gamesBody");

  seasonData.forEach(game => {

    const ymd = game.date.replace(/-/g, "");
    const baseId = game.home_code + ymd;

    // Try standard + possible alternates
    const possibleIds = [
      baseId + "0",
      baseId + "1",
      baseId + "2",
      baseId + "3"
    ];

    const link =
      `baseball-game.html?season=${season}&game=${possibleIds[0]}`;

    const tr = document.createElement("tr");

    tr.onclick = () => {
      window.location.href = link;
    };

    tr.innerHTML = `
      <td>${game.date}</td>
      <td>${game.away_team}</td>
      <td>${game.home_team}</td>
      <td>${game.away_score} - ${game.home_score}</td>
      <td>${game.venue}</td>
      <td>${game.attendance ? Number(game.attendance).toLocaleString() : ""}</td>
    `;

    tbody.appendChild(tr);
  });

});
</script>

</body>
</html>
