<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
}
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
  font-size:17px;
}
.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}
.hero h1{
  margin:0;
  font-size:28px;
}
.table-wrap{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--line);
}
table{
  width:100%;
  border-collapse:collapse;
}
th{
  background:var(--blue);
  color:#fff;
  padding:12px;
  text-align:left;
  font-size:14px;
}
td{
  padding:12px;
  border-bottom:1px solid #eee;
  font-size:14px;
}
tbody tr:nth-child(even){
  background:#fafafa;
}
tbody tr{
  cursor:pointer;
}
tbody tr:hover{
  background:#eef2ff;
}
.error{
  padding:20px;
  background:#fff3f3;
  border:1px solid #ffb3b3;
  border-radius:12px;
  color:#a10000;
  font-weight:700;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="mlb.html">MLB</a>
</div>

<div class="page">

  <div class="hero">
    <h1 id="seasonTitle">MLB Season</h1>
  </div>

  <div id="errorBox"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Away</th>
          <th>Home</th>
          <th>Score</th>
          <th>Venue</th>
          <th>Attendance</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const season = params.get("season");

if(!season){
  document.getElementById("errorBox").innerHTML =
    `<div class="error">No season specified</div>`;
  throw new Error("No season parameter");
}

document.getElementById("seasonTitle").textContent =
  "MLB Season " + season;

Promise.all([
  fetch(`data/baseball/seasons/${season}.json`).then(r=>{
    if(!r.ok) throw new Error("Season file not found");
    return r.json();
  }),
  fetch(`data/baseball/team-names.json`).then(r=>r.json()),
  fetch(`data/baseball/ballpark.csv`).then(r=>r.text())
])
.then(([seasonData, teamNames, ballparkCSV]) => {

  const parkMap = {};
  const lines = ballparkCSV.split("\n");

  lines.forEach(line=>{
    const parts = line.split(",");
    if(parts.length >= 2){
      parkMap[parts[0].trim()] = parts[1].trim();
    }
  });

  const tbody = document.getElementById("gamesBody");
  tbody.innerHTML = "";

  seasonData.forEach(game => {

    const ymd = game.date.replace(/-/g,"");
    const gameId = game.home_code + ymd + "0";

    const link =
      `baseball-game.html?season=${season}&game=${gameId}`;

    const awayName =
      teamNames[game.away_code] || game.away_team || game.away_code;

    const homeName =
      teamNames[game.home_code] || game.home_team || game.home_code;

    const venueName =
      parkMap[game.venue] || game.venue || "";

    const score =
      (game.away_score !== undefined &&
       game.home_score !== undefined)
        ? game.away_score + "-" + game.home_score
        : "";

    const tr = document.createElement("tr");
    tr.onclick = () => window.location.href = link;

    tr.innerHTML = `
      <td>${game.date}</td>
      <td>${awayName}</td>
      <td>${homeName}</td>
      <td>${score}</td>
      <td>${venueName}</td>
      <td>${game.attendance ? Number(game.attendance).toLocaleString() : ""}</td>
    `;

    tbody.appendChild(tr);
  });

})
.catch(()=>{
  document.getElementById("errorBox").innerHTML =
    `<div class="error">Could not load season file for ${season}</div>`;
});
</script>

</body>
</html>
