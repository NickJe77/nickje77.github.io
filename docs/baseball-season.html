<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.summaryRow{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:16px;
margin-bottom:16px;
}

.summaryCard{
background:white;
padding:16px;
border-radius:12px;
font-weight:700;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:12px;
}

.tab{
background:white;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.tab.active{
background:#002D72;
color:white;
}

.section{display:none;}
.section.active{display:block;}

.tableCard{
background:white;
padding:16px;
border-radius:12px;
margin-bottom:16px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.leagueTitle{
font-size:22px;
font-weight:800;
margin-bottom:10px;
}

.divisionTitle{
font-size:18px;
font-weight:800;
margin:12px 0 6px;
color:#002D72;
}

.right{text-align:right;}

</style>
</head>
<body>

<div class="page">

<div class="hero">
<h1 id="title"></h1>
</div>

<div class="summaryRow">

<div class="summaryCard">
World Series Champion
<div id="wsWinner"></div>
</div>

<div class="summaryCard">
American League Champion
<div id="alWinner"></div>
</div>

<div class="summaryCard">
National League Champion
<div id="nlWinner"></div>
</div>

</div>

<div class="tabs">

<div class="tab active" onclick="showTab('games',this)">Games</div>
<div class="tab" onclick="showTab('standings',this)">Standings</div>
<div class="tab" onclick="showTab('playoffs',this)">Playoffs</div>

</div>

<!-- GAMES -->

<div id="games" class="section active">

<div class="tableCard">

<table>
<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th class="right">Score</th>
<th>Home</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

</div>

<!-- STANDINGS -->

<div id="standings" class="section">

<div id="standingsContainer"></div>

</div>

<!-- PLAYOFFS -->

<div id="playoffs" class="section">

<div class="tableCard">

<table>
<thead>
<tr>
<th>Round</th>
<th>Winner</th>
</tr>
</thead>

<tbody id="playoffsBody"></tbody>

</table>

</div>

</div>

</div>

<script>

/* TEAM STRUCTURE */

const STRUCTURE={

AL:{
East:["BAL","BOS","NYY","TB","TOR"],
Central:["CWS","CLE","DET","KC","MIN"],
West:["HOU","LAA","OAK","SEA","TEX"]
},

NL:{
East:["ATL","MIA","NYM","PHI","WSH"],
Central:["CHC","CIN","MIL","PIT","STL"],
West:["ARI","COL","LAD","SD","SF"]
}

};

function leagueOf(code){

for(const league in STRUCTURE)
for(const div in STRUCTURE[league])
if(STRUCTURE[league][div].includes(code))
return league;

}

function divisionOf(code){

for(const league in STRUCTURE)
for(const div in STRUCTURE[league])
if(STRUCTURE[league][div].includes(code))
return div;

}

/* TABS */

function showTab(name,el){

document.querySelectorAll(".section")
.forEach(s=>s.classList.remove("active"));

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document.getElementById(name).classList.add("active");

el.classList.add("active");

}

const year=new URLSearchParams(location.search).get("year");

title.textContent=year+" MLB Season";

/* WINNER */

function winner(g){
return g.away_score>g.home_score
?g.away_team:g.home_team;
}

/* CHAMPIONS */

function detectChampions(games){

let al,nl;

games.forEach(g=>{

if(leagueOf(g.away_code)=="AL" &&
leagueOf(g.home_code)=="AL")
al=winner(g);

if(leagueOf(g.away_code)=="NL" &&
leagueOf(g.home_code)=="NL")
nl=winner(g);

});

const ws=winner(games[games.length-1]);

wsWinner.textContent=ws;
alWinner.textContent=al;
nlWinner.textContent=nl;

playoffsBody.innerHTML=`
<tr><td>American League Champion</td><td>${al}</td></tr>
<tr><td>National League Champion</td><td>${nl}</td></tr>
<tr><td>World Series Champion</td><td>${ws}</td></tr>
`;

}

/* STANDINGS */

function buildStandings(games){

const stats={};

games.forEach(g=>{

stats[g.away_code]??={
team:g.away_team,
code:g.away_code,
w:0,l:0,
league:leagueOf(g.away_code),
division:divisionOf(g.away_code)
};

stats[g.home_code]??={
team:g.home_team,
code:g.home_code,
w:0,l:0,
league:leagueOf(g.home_code),
division:divisionOf(g.home_code)
};

if(g.away_score>g.home_score){

stats[g.away_code].w++;
stats[g.home_code].l++;

}else{

stats[g.home_code].w++;
stats[g.away_code].l++;

}

});

/* GROUP */

const container=document.getElementById("standingsContainer");

for(const league in STRUCTURE){

const leagueDiv=document.createElement("div");

leagueDiv.innerHTML=
`<div class="leagueTitle">${league} League</div>`;

for(const division in STRUCTURE[league]){

const teams=STRUCTURE[league][division]
.map(code=>stats[code])
.filter(Boolean)
.sort((a,b)=>(b.w/(b.w+b.l))-(a.w/(a.w+a.l)));

const divBlock=document.createElement("div");

divBlock.innerHTML=
`<div class="divisionTitle">${division}</div>
<div class="tableCard">
<table>
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>%</th>
</tr>
</thead>
<tbody>
${teams.map(t=>`
<tr>
<td class="click"
onclick="location.href='baseball-team.html?team=${t.code}'">
${t.team}
</td>
<td>${t.w}</td>
<td>${t.l}</td>
<td>${(t.w/(t.w+t.l)).toFixed(3)}</td>
</tr>
`).join("")}
</tbody>
</table>
</div>`;

leagueDiv.appendChild(divBlock);

}

container.appendChild(leagueDiv);

}

}

/* LOAD */

async function load(){

const games=await fetch(
`data/baseball/seasons/${year}.json`
).then(r=>r.json());

games.forEach(g=>{

const id=
`${g.date}_${g.away_code}_${g.home_code}`;

gamesBody.innerHTML+=`
<tr>
<td>${g.date}</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.away_code}'">
${g.away_team}
</td>

<td class="click right"
onclick="location.href='baseball-game.html?id=${id}'">
${g.away_score}-${g.home_score}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.home_code}'">
${g.home_team}
</td>

<td>${g.venue||""}</td>

</tr>
`;

});

detectChampions(games);

buildStandings(games);

}

load();

</script>

</body>
</html>
