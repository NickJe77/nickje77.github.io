<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Arial;
margin:0;
background:#f4f6f8;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px 0;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
font-size:18px;
}

/* PAGE */

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:42px;
}

/* SUMMARY */

.summaryRow{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:16px;
margin-bottom:18px;
}

.summaryCard{
background:white;
padding:16px;
border-radius:14px;
}

.summaryLabel{
font-size:12px;
font-weight:800;
color:#666;
}

.summaryValue{
font-size:20px;
font-weight:800;
}

/* TABS */

.tabs{
display:flex;
gap:8px;
margin-bottom:12px;
}

.tab{
padding:10px 18px;
background:white;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.tab.active{
background:#002D72;
color:white;
}

/* TABLE */

.tableCard{
background:white;
padding:16px;
border-radius:14px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.right{
text-align:right;
}

.section{
display:none;
}

.section.active{
display:block;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading Season...</h1>
</div>

<div class="summaryRow">

<div class="summaryCard">
<div class="summaryLabel">World Series Champion</div>
<div class="summaryValue" id="wsWinner"></div>
</div>

<div class="summaryCard">
<div class="summaryLabel">American League Champion</div>
<div class="summaryValue" id="alWinner"></div>
</div>

<div class="summaryCard">
<div class="summaryLabel">National League Champion</div>
<div class="summaryValue" id="nlWinner"></div>
</div>

</div>

<div class="tabs">

<div class="tab active" onclick="showTab('games')">Games</div>
<div class="tab" onclick="showTab('standings')">Standings</div>
<div class="tab" onclick="showTab('playoffs')">Playoffs</div>

</div>

<div id="games" class="section active">
<div class="tableCard">

<table>
<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th class="right">Score</th>
<th>Home</th>
<th>Venue</th>
<th class="right">Attendance</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>
</div>

<div id="standings" class="section">
<div class="tableCard">

<table>
<thead>
<tr>
<th>Team</th>
<th class="right">W</th>
<th class="right">L</th>
<th class="right">%</th>
</tr>
</thead>

<tbody id="standingsBody"></tbody>

</table>

</div>
</div>

<div id="playoffs" class="section">
<div class="tableCard">

<table>
<thead>
<tr>
<th>Round</th>
<th>Winner</th>
<th>Loser</th>
<th>Score</th>
</tr>
</thead>

<tbody id="playoffsBody"></tbody>

</table>

</div>
</div>

</div>

<script>

const LEAGUE={
ARI:"NL",ATL:"NL",CHC:"NL",CIN:"NL",COL:"NL",
LAD:"NL",MIA:"NL",MIL:"NL",NYM:"NL",PHI:"NL",
PIT:"NL",SD:"NL",SF:"NL",STL:"NL",WSH:"NL",

BAL:"AL",BOS:"AL",CWS:"AL",CLE:"AL",DET:"AL",
HOU:"AL",KC:"AL",LAA:"AL",MIN:"AL",NYY:"AL",
OAK:"AL",SEA:"AL",TB:"AL",TEX:"AL",TOR:"AL"
};

function showTab(name){

document.querySelectorAll(".section")
.forEach(s=>s.classList.remove("active"));

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document.getElementById(name).classList.add("active");

event.target.classList.add("active");

}

const params=new URLSearchParams(location.search);

const year=params.get("year");

document.getElementById("title").textContent=
`${year} MLB Season`;

let PARKS={};

async function loadBallparks(){

const res=await fetch("data/baseball/ballparks.csv");

const text=await res.text();

text.split("\n").slice(1).forEach(r=>{

const cols=r.split(",");

PARKS[cols[0]]=cols[1];

});

}

function parkName(code){

return PARKS[code]||code;

}

function getWinner(g){

return Number(g.away_score)>Number(g.home_score)
?g.away_team:g.home_team;

}

function detectChampions(games){

let ws="",al="",nl="";

games.forEach(g=>{

if(LEAGUE[g.away_code]==="AL" &&
LEAGUE[g.home_code]==="AL")
al=getWinner(g);

if(LEAGUE[g.away_code]==="NL" &&
LEAGUE[g.home_code]==="NL")
nl=getWinner(g);

});

ws=getWinner(games[games.length-1]);

wsWinner.textContent=ws;
alWinner.textContent=al;
nlWinner.textContent=nl;

}

async function loadSeason(){

await loadBallparks();

const data=await fetch(
`data/baseball/seasons/${year}.json`
).then(r=>r.json());

const games=Array.isArray(data)?data:data.games||[];

detectChampions(games);

/* GAMES */

games.forEach(g=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${g.date}</td>
<td class="click">${g.away_team}</td>
<td class="right">${g.away_score}-${g.home_score}</td>
<td class="click">${g.home_team}</td>
<td>${parkName(g.venue)}</td>
<td class="right">${g.attendance||""}</td>
`;

gamesBody.appendChild(tr);

});

/* STANDINGS */

(data.standings||[]).forEach(s=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${s.team}</td>
<td class="right">${s.wins}</td>
<td class="right">${s.losses}</td>
<td class="right">${s.pct}</td>
`;

standingsBody.appendChild(tr);

});

/* PLAYOFFS */

(data.playoffs||[]).forEach(p=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${p.round}</td>
<td>${p.winner}</td>
<td>${p.loser}</td>
<td>${p.score}</td>
`;

playoffsBody.appendChild(tr);

});

}

loadSeason();

</script>

</body>
</html>
