<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLB Season | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Inter,system-ui,sans-serif;
    background:#f4f6f8;
}

/* ---------------- NAV ---------------- */

.nav{
    background:white;
    border-bottom:1px solid #dfe5ec;
    padding:16px 10px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.nav a{
    color:#0056d6;
    text-decoration:none;
    font-weight:700;
    margin:0 18px;
    font-size:15px;
}

/* ---------------- PAGE ---------------- */

.page{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

/* ---------------- HERO ---------------- */

.hero{
    background:linear-gradient(135deg,#002f87,#d90429);
    border-radius:30px;
    padding:42px;
    color:white;
    margin-bottom:25px;
}

.hero h1{
    margin:0;
    font-size:58px;
    line-height:1;
}

/* ---------------- YEAR TABS ---------------- */

.year-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:22px;
}

.year-tab{
    background:white;
    padding:8px 14px;
    border-radius:12px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    border:1px solid #dce3eb;
}

.year-tab.active{
    background:#0056d6;
    color:white;
}

/* ---------------- TABLE ---------------- */

.table-wrap{
    background:white;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0056d6;
    color:white;
    padding:12px;
    text-align:left;
    font-size:13px;
}

td{
    padding:12px;
    border-bottom:1px solid #edf2f7;
    font-size:13px;
}

tr:nth-child(even){
    background:#f7fbff;
}

tbody tr{
    cursor:pointer;
    transition:.15s;
}

tbody tr:hover{
    background:#eaf2ff;
}

.score{
    font-weight:700;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:900px){

.hero{
    padding:28px;
    border-radius:24px;
}

.hero h1{
    font-size:36px;
}

.nav a{
    margin:0 10px;
    font-size:13px;
}

th{
    font-size:11px;
    padding:10px 6px;
}

td{
    font-size:11px;
    padding:10px 6px;
}

.year-tab{
    font-size:11px;
    padding:6px 10px;
}

}

</style>
</head>

<body>

<!-- NAV -->

<div class="nav">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="baseball-seasons.html">Seasons</a>
    <a href="baseball-players.html">Players</a>
</div>

<div class="page">

    <!-- HERO -->

    <div class="hero">
        <h1 id="heroTitle">MLB Season</h1>
    </div>

    <!-- YEARS -->

    <div class="year-tabs" id="yearTabs"></div>

    <!-- TABLE -->

    <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Away</th>
                    <th>Home</th>
                    <th>Score</th>
                    <th>Venue</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="gamesBody"></tbody>

        </table>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

let season = params.get("season") || "2026";

document.getElementById("heroTitle").innerText =
    `MLB ${season} Season`;

const years = [];

for(let y=2026; y>=1901; y--){
    years.push(String(y));
}

/* ---------------- YEAR TABS ---------------- */

function renderYearTabs(){

    const wrap = document.getElementById("yearTabs");

    wrap.innerHTML = "";

    years.forEach(year=>{

        const div = document.createElement("div");

        div.className =
            "year-tab" +
            (year === season ? " active" : "");

        div.innerText = year;

        div.onclick = ()=>{
            window.location.href =
                `baseball-season.html?season=${year}`;
        };

        wrap.appendChild(div);

    });

}

/* ---------------- LOAD ---------------- */

async function loadSeason(){

    try{

        const res = await fetch(
            `/data/baseball/seasons/${season}.json`
        );

        if(!res.ok){
            throw new Error("Season not found");
        }

        const games = await res.json();

        renderGames(games);

    }catch(err){

        console.error(err);

    }

}

/* ---------------- GAME FILE ---------------- */

function getGameFile(game){

    if(game.game_file)
        return game.game_file;

    if(game.filename)
        return game.filename;

    if(game.file)
        return game.file;

    return "";

}

/* ---------------- TABLE ---------------- */

function renderGames(games){

    const body =
        document.getElementById("gamesBody");

    body.innerHTML = "";

    games.forEach(game=>{

        const tr = document.createElement("tr");

        const gameFile = getGameFile(game);

        tr.innerHTML = `
            <td>${game.date || ""}</td>

            <td>${game.away_team || ""}</td>

            <td>${game.home_team || ""}</td>

            <td class="score">
                ${(game.away_score ?? 0)}
                -
                ${(game.home_score ?? 0)}
            </td>

            <td>${game.venue || ""}</td>

            <td>${game.status || ""}</td>
        `;

        tr.onclick = ()=>{

            if(!gameFile) return;

            window.location.href =
                `baseball-game.html?season=${season}&game=${encodeURIComponent(gameFile)}`;

        };

        body.appendChild(tr);

    });

}

renderYearTabs();
loadSeason();

</script>

</body>
</html>
