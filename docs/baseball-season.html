<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.tableCard{
background:white;
padding:16px;
border-radius:12px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.click:hover{
text-decoration:underline;
}

.error{
color:red;
font-weight:700;
padding:20px;
text-align:center;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
</div>

<div class="tableCard">

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Score</th>
<th>Home</th>
</tr>
</thead>

<tbody id="gamesBody">
<tr><td colspan="4">Loading games...</td></tr>
</tbody>

</table>

</div>

</div>

<script>

const params = new URLSearchParams(location.search);
const year = params.get("year");

const title = document.getElementById("title");
const gamesBody = document.getElementById("gamesBody");

if(!year){

title.textContent="Season not specified";

gamesBody.innerHTML =
"<tr><td colspan='4' class='error'>Missing season parameter</td></tr>";

throw new Error("Missing year parameter");

}

title.textContent = year + " MLB Season";

async function loadSeason(){

try{

const res =
await fetch("data/baseball/seasons/" + year + ".json");

if(!res.ok)
throw new Error("Season file missing");

const games =
await res.json();

renderGames(games);

}catch(e){

console.error(e);

gamesBody.innerHTML =
"<tr><td colspan='4' class='error'>Failed to load season file</td></tr>";

}

}

function renderGames(games){

gamesBody.innerHTML="";

games.forEach(g=>{

const gameId =
encodeURIComponent(`${g.date}_${g.away_code}_${g.home_code}`);

const row = document.createElement("tr");

row.innerHTML = `
<td>${g.date}</td>
<td class="click">${g.away_team}</td>
<td class="click">${g.away_score}-${g.home_score}</td>
<td class="click">${g.home_team}</td>
`;

row.children[1].onclick = ()=>{
location.href = "baseball-team.html?team=" + g.away_code;
};

row.children[2].onclick = ()=>{
location.href = "baseball-game.html?id=" + gameId;
};

row.children[3].onclick = ()=>{
location.href = "baseball-team.html?team=" + g.home_code;
};

gamesBody.appendChild(row);

});

}

loadSeason();

</script>

</body>
</html>
