<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:14px;
}

.controls{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

.controls label{
  font-weight:700;
}

.controls input{
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
  min-width:200px;
}

.controls button{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  background:#0056d6;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.controls button:hover{
  background:#003ea3;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

th{
  background:#002D72;
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:10px;
  border-bottom:1px solid #eee;
}

tr:nth-child(even){
  background:#f0f6ff;
}

tr:hover{
  background:#e3efff;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Season</h1>
</div>

<div class="controls">
<label>Team 1:</label>
<input list="teamList" id="team1" placeholder="Select team">

<label>Team 2:</label>
<input list="teamList" id="team2" placeholder="Select team">

<button onclick="applyFilter()">Search</button>
<button onclick="clearFilter()">Clear</button>

<datalist id="teamList"></datalist>
</div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Home</th>
<th>Score</th>
</tr>
</thead>

<tbody id="tbody">
</tbody>

</table>

</div>

<script>

let allGames = [];

async function loadSeason(){

const params=new URLSearchParams(window.location.search);
const season=params.get("season");

if(!season){
alert("Missing season parameter");
return;
}

document.getElementById("title").textContent=season+" Season";

const res=await fetch(`data/baseball/seasons/${season}.json`);

if(!res.ok){
alert("Season file not found");
return;
}

allGames=await res.json();

populateTeams(allGames);
renderGames(allGames);

}

function populateTeams(games){

const set=new Set();

games.forEach(g=>{
set.add(g.away_team);
set.add(g.home_team);
});

const list=document.getElementById("teamList");
list.innerHTML="";

[...set].sort().forEach(team=>{
const option=document.createElement("option");
option.value=team;
list.appendChild(option);
});

}

function renderGames(games){

const tbody=document.getElementById("tbody");
tbody.innerHTML="";

games.forEach(game=>{

const id=`${game.date}_${game.away_code}_${game.home_code}`;

const tr=document.createElement("tr");

tr.onclick=()=>{
window.location.href=`baseball-game.html?id=${id}`;
};

tr.innerHTML=`
<td>${game.date}</td>
<td>${game.away_team}</td>
<td>${game.home_team}</td>
<td>${game.away_score} - ${game.home_score}</td>
`;

tbody.appendChild(tr);

});

}

function applyFilter(){

const t1=document.getElementById("team1").value;
const t2=document.getElementById("team2").value;

const filtered=allGames.filter(g=>{

if(t1 && t2){
return (
(g.away_team===t1 && g.home_team===t2) ||
(g.away_team===t2 && g.home_team===t1)
);
}

if(t1){
return g.away_team===t1 || g.home_team===t1;
}

return true;

});

renderGames(filtered);

}

function clearFilter(){

document.getElementById("team1").value="";
document.getElementById("team2").value="";
renderGames(allGames);

}

loadSeason();

</script>

</body>
</html>
