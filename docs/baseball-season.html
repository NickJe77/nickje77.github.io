<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:30px;border-radius:20px;margin-bottom:14px;}
.hero h1{margin:0;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;}
th{background:#002D72;color:#fff;padding:12px;text-align:left;}
td{padding:10px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
a{color:#0056d6;font-weight:700;text-decoration:none;}
</style>
</head>

<body>

<div class="navbar">
<a href="./index.html">Home</a>
<a href="./baseball.html">Baseball</a>
<a href="./baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="seasonTitle">Loading...</h1>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Home</th>
<th>Score</th>
</tr>
</thead>
<tbody id="seasonBody"></tbody>
</table>

</div>

<script>

function param(name){
return new URLSearchParams(location.search).get(name)
}

async function loadSeason(){

const season=param("season")

if(!season){
document.getElementById("seasonTitle").textContent="Season Not Found"
return
}

document.getElementById("seasonTitle").textContent=`${season} Season`

const res=await fetch(`./data/baseball/seasons/${season}.json`)

if(!res.ok){
document.getElementById("seasonTitle").textContent="Season Not Found"
return
}

const games=await res.json()

document.getElementById("seasonBody").innerHTML=
games.map(g=>`
<tr>
<td>${g.date}</td>
<td>${g.away_team}</td>
<td>${g.home_team}</td>
<td>
<a href="./baseball-game.html?game=${g.game_id}">
${g.away_score} - ${g.home_score}
</a>
</td>
</tr>
`).join("")

}

loadSeason()

</script>

</body>
</html>
