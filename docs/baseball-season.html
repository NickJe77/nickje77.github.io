<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.summaryRow{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:16px;
margin-bottom:16px;
}

.summaryCard{
background:white;
padding:16px;
border-radius:12px;
font-weight:700;
}

.tableCard{
background:white;
padding:16px;
border-radius:12px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

</style>
</head>
<body>

<div class="navbar">

<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-players.html">Players</a>

</div>

<div class="page">

<div class="hero">
<h1 id="title"></h1>
</div>

<div class="summaryRow">

<div class="summaryCard">
World Series Champion
<div id="wsWinner"></div>
</div>

<div class="summaryCard">
American League Champion
<div id="alWinner"></div>
</div>

<div class="summaryCard">
National League Champion
<div id="nlWinner"></div>
</div>

</div>

<div class="tableCard">

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Score</th>
<th>Home</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

</div>

<script>

const year=new URLSearchParams(location.search).get("year");

title.textContent=year+" MLB Season";

const AL=["BAL","BOS","NYY","TB","TOR","CWS","CLE","DET","KC","MIN","HOU","LAA","OAK","SEA","TEX"];

function league(code){
return AL.includes(code)?"AL":"NL";
}

let ALL_GAMES=[];

/* LOAD SEASON */

async function loadSeason(){

/* load regular season */

const regular=await fetch(
`data/baseball/seasons/${year}.json`
).then(r=>r.json());

ALL_GAMES=[...regular];

/* load playoffs from boxscores */

for(const g of regular){

const id=`${g.date}_${g.away_code}_${g.home_code}`;

try{

const box=await fetch(
`data/baseball/boxscores/${id}.json`
).then(r=>r.json());

if(box.date.startsWith(year+"-10") ||
box.date.startsWith(year+"-11")){

ALL_GAMES.push(box);

}

}catch{}

}

/* sort */

ALL_GAMES.sort((a,b)=>a.date.localeCompare(b.date));

render();

detectChampions();

}

function render(){

gamesBody.innerHTML="";

ALL_GAMES.forEach(g=>{

const id=`${g.date}_${g.away_code}_${g.home_code}`;

gamesBody.innerHTML+=`

<tr>

<td>${g.date}</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.away_code}'">
${g.away_team}
</td>

<td class="click"
onclick="location.href='baseball-game.html?id=${id}'">
${g.away_score}-${g.home_score}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.home_code}'">
${g.home_team}
</td>

</tr>

`;

});

}

function detectChampions(){

const ws=ALL_GAMES[ALL_GAMES.length-1];

wsWinner.textContent=
ws.away_score>ws.home_score?
ws.away_team:ws.home_team;

for(let i=ALL_GAMES.length-1;i>=0;i--){

const g=ALL_GAMES[i];

if(league(g.away_code)=="AL" &&
league(g.home_code)=="AL"){

alWinner.textContent=
g.away_score>g.home_score?
g.away_team:g.home_team;

break;

}

}

for(let i=ALL_GAMES.length-1;i>=0;i--){

const g=ALL_GAMES[i];

if(league(g.away_code)=="NL" &&
league(g.home_code)=="NL"){

nlWinner.textContent=
g.away_score>g.home_score?
g.away_team:g.home_team;

break;

}

}

}

loadSeason();

</script>

</body>
</html>
