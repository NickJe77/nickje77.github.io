<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#ffffff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#ffffff;
}

th, td{
  padding:10px;
  border-bottom:1px solid #e6e8ee;
  text-align:left;
  font-size:14px;
}

th{
  background:#f0f3f7;
  font-weight:700;
}

tbody tr:nth-child(even){
  background:#f0f6ff;
}

tbody tr{
  cursor:pointer;
}

tbody tr:hover{
  background:#e0ecff;
}

.score{
  font-weight:700;
}

.error{
  background:#ffe5e5;
  padding:15px;
  border-radius:8px;
  margin-bottom:20px;
  font-weight:600;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
</div>

<div class="page">

<h1 id="seasonTitle">MLB Season</h1>
<div id="errorBox"></div>

<table>
<thead>
<tr>
  <th>Date</th>
  <th>Away</th>
  <th>Home</th>
  <th>Score</th>
  <th>Venue</th>
  <th>Attendance</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const season = params.get("season");

if (!season) {
  document.getElementById("errorBox").innerHTML =
    `<div class="error">No season specified</div>`;
} else {

  document.getElementById("seasonTitle").textContent =
    "MLB Season " + season;

  Promise.all([
    fetch(`data/baseball/seasons/${season}.json`).then(r=>{
      if(!r.ok) throw new Error("Season file not found");
      return r.json();
    }),
    fetch(`data/baseball/team-names.json`).then(r=>r.json()),
    fetch(`data/baseball/ballpark.csv`).then(r=>r.text())
  ])
  .then(([seasonData, teamNames, ballparkCSV])=>{

    // Build ballpark map
    const parkMap = {};
    const lines = ballparkCSV.trim().split("\n");

    lines.forEach(line=>{
      const parts = line.split(",");
      if(parts.length >= 2){
        parkMap[parts[0].trim()] = parts[1].trim();
      }
    });

    const tbody = document.getElementById("gamesBody");
    tbody.innerHTML = "";

    seasonData.forEach(game=>{

      // Use real game_id if present
      const gameId = game.game_id
        ? game.game_id
        : (game.home_code + game.date.replace(/-/g,"") + "0");

      const link =
        "baseball-game.html?season=" +
        season +
        "&game=" +
        gameId;

      const awayName =
        teamNames[game.away_code] ||
        game.away_team ||
        game.away_code;

      const homeName =
        teamNames[game.home_code] ||
        game.home_team ||
        game.home_code;

      const venueName =
        parkMap[game.venue] ||
        game.venue ||
        "";

      const score =
        (game.away_score !== undefined &&
         game.home_score !== undefined)
          ? game.away_score + "-" + game.home_score
          : "";

      const tr = document.createElement("tr");
      tr.onclick = () => window.location.href = link;

      tr.innerHTML = `
        <td>${game.date}</td>
        <td>${awayName}</td>
        <td>${homeName}</td>
        <td class="score">${score}</td>
        <td>${venueName}</td>
        <td>${game.attendance ? Number(game.attendance).toLocaleString() : ""}</td>
      `;

      tbody.appendChild(tr);

    });

  })
  .catch(()=>{
    document.getElementById("errorBox").innerHTML =
      `<div class="error">Could not load season file for ${season}</div>`;
  });

}
</script>

</body>
</html>
