<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLB Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.page{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}
.hero h1{
  margin:0;
  font-size:32px;
}
.meta{
  margin-top:8px;
  opacity:.9;
}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}
th{
  background:#002D72;
  color:#fff;
  padding:10px;
}
td{
  padding:8px;
  border-bottom:1px solid #eee;
}
tr:nth-child(even){
  background:#f7fbff;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="gameTitle">Loading...</h1>
  <div class="meta" id="gameMeta"></div>
</div>

<table>
<thead>
<tr>
  <th>Stat</th>
  <th>Value</th>
</tr>
</thead>
<tbody id="gameBody"></tbody>
</table>

</div>

<script>
(async function(){

async function safeFetch(url){
  try{
    const r = await fetch(url);
    if(!r.ok) return null;
    return r.json();
  }catch{
    return null;
  }
}

const qs = new URLSearchParams(location.search);
const season = qs.get("season");
const file = qs.get("file");

if(!season || !file){
  document.getElementById("gameTitle").textContent="Game Not Found";
  return;
}

const data = await safeFetch(`/data/baseball/games/${season}/${file}`);

if(!data){
  document.getElementById("gameTitle").textContent="Game Not Found";
  return;
}

/* If your game file is a single object */
const game = Array.isArray(data) ? data[0] : data;

document.getElementById("gameTitle").textContent =
  game.away_team + " at " + game.home_team;

document.getElementById("gameMeta").textContent =
  game.date + " • " + game.venue + " • Attendance: " +
  Number(game.attendance || 0).toLocaleString();

document.getElementById("gameBody").innerHTML = `
<tr><td>Away Score</td><td>${game.away_score}</td></tr>
<tr><td>Home Score</td><td>${game.home_score}</td></tr>
<tr><td>Game Length (min)</td><td>${game.game_length_minutes}</td></tr>
`;

})();
</script>

</body>
</html>
