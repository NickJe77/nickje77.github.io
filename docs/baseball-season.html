<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;}
.page{max-width:1200px;margin:0 auto;padding:22px 18px;}
.hero{background:linear-gradient(90deg,#002D72,#C8102E);color:#fff;padding:32px;border-radius:22px;margin-bottom:14px;}
.hero h1{margin:0;font-size:40px;}
.tabs{display:flex;gap:10px;margin:12px 0 14px;}
.tab{background:#fff;border:1px solid #ddd;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer;}
.tab.active{background:#eaf3ff;border-color:#bcd6ff;}
.card{background:#fff;border-radius:16px;padding:14px;}
table{width:100%;border-collapse:collapse;background:#fff;}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid #f1f1f1;}
th{background:#002D72;color:#fff;position:sticky;top:0;}
tbody tr:nth-child(even){background:#eaf3ff;}
tbody tr:hover{background:#d6e6ff;}
.click{color:#0056d6;font-weight:700;cursor:pointer;}
.small{opacity:0.8;font-size:13px;margin-top:6px;}
</style>
</head>
<body>

<div class="page">
  <div class="hero">
    <h1 id="title">Season</h1>
    <div class="small">Click a game to open the game page • Click a team name to open the team page</div>
  </div>

  <div class="tabs">
    <div id="tabGames" class="tab active">Games</div>
    <div id="tabStandings" class="tab">Standings</div>
  </div>

  <div id="panelGames" class="card">
    <table>
      <thead>
        <tr>
          <th style="width:110px;">Date</th>
          <th>Away</th>
          <th style="width:110px;">Score</th>
          <th>Home</th>
          <th style="width:90px;">Venue</th>
          <th style="width:110px;">Attendance</th>
        </tr>
      </thead>
      <tbody id="gamesBody"></tbody>
    </table>
  </div>

  <div id="panelStandings" class="card" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>Team</th>
          <th style="width:70px;">W</th>
          <th style="width:70px;">L</th>
          <th style="width:90px;">PCT</th>
          <th style="width:90px;">RS</th>
          <th style="width:90px;">RA</th>
          <th style="width:90px;">DIFF</th>
        </tr>
      </thead>
      <tbody id="standingsBody"></tbody>
    </table>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const year = params.get("year");

document.getElementById("title").textContent = `${year} Season`;

const tabGames = document.getElementById("tabGames");
const tabStandings = document.getElementById("tabStandings");
const panelGames = document.getElementById("panelGames");
const panelStandings = document.getElementById("panelStandings");

function show(which){
  tabGames.classList.toggle("active", which==="games");
  tabStandings.classList.toggle("active", which==="standings");
  panelGames.style.display = which==="games" ? "block":"none";
  panelStandings.style.display = which==="standings" ? "block":"none";
}

tabGames.onclick = ()=> show("games");
tabStandings.onclick = ()=> show("standings");

function fmt(n){
  if(n===null || n===undefined) return "";
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

async function loadGames(){
  const res = await fetch(`data/baseball/seasons/${year}.json`);
  const games = await res.json();
  const tb = document.getElementById("gamesBody");
  tb.innerHTML = "";

  games.forEach(g=>{
    const tr = document.createElement("tr");

    const away = `<span class="click" data-team="${g.away_code}">${g.away_team}</span>`;
    const home = `<span class="click" data-team="${g.home_code}">${g.home_team}</span>`;

    tr.innerHTML = `
      <td>${g.date}</td>
      <td>${away}</td>
      <td><span class="click" data-game="${g.id}">${g.away_score} - ${g.home_score}</span></td>
      <td>${home}</td>
      <td>${g.venue || ""}</td>
      <td>${fmt(g.attendance)}</td>
    `;

    tr.querySelectorAll("[data-team]").forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); location.href = `baseball-team.html?team=${el.dataset.team}`; };
    });

    tr.querySelector("[data-game]").onclick = (e)=>{
      e.stopPropagation();
      location.href = `baseball-game.html?year=${year}&id=${g.id}`;
    };

    tb.appendChild(tr);
  });
}

async function loadStandings(){
  const res = await fetch(`data/baseball/standings/${year}.json`);
  const rows = await res.json();
  const tb = document.getElementById("standingsBody");
  tb.innerHTML = "";

  rows.forEach(r=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="click" data-team="${r.team_code}">${r.team_name}</span></td>
      <td>${r.W}</td>
      <td>${r.L}</td>
      <td>${r.PCT}</td>
      <td>${r.RS}</td>
      <td>${r.RA}</td>
      <td>${r.DIFF}</td>
    `;
    tr.querySelector("[data-team]").onclick = ()=> location.href = `baseball-team.html?team=${r.team_code}`;
    tb.appendChild(tr);
  });
}

(async function init(){
  if(!year){ alert("Missing year"); return; }
  await loadGames();
  await loadStandings();
})();
</script>

</body>
</html>
