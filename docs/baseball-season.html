<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:16px;
overflow:hidden;
}

th{
background:#002D72;
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f0f6ff;
}

tr:hover{
background:#e3efff;
cursor:pointer;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Season</h1>
</div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Home</th>
<th>Score</th>
</tr>
</thead>

<tbody id="tbody">
</tbody>

</table>

</div>

<script>

async function loadSeason(){

const params=new URLSearchParams(location.search);

let season=params.get("season");

if(!season){

alert("Missing season parameter.\nOpen like:\nbaseball-season.html?season=2022");

return;

}

document.getElementById("title").textContent=season+" Season";

// load season file list
const indexUrl=`data/baseball/boxscores/${season}/index.json`;

let fileList;

try{

const res=await fetch(indexUrl);

fileList=await res.json();

}catch{

alert("Missing index.json in:\n"+indexUrl);

return;

}

const tbody=document.getElementById("tbody");

for(const filename of fileList){

const gameId=filename.replace(".json","");

const res=await fetch(`data/baseball/boxscores/${season}/${filename}`);

const game=await res.json();

const tr=document.createElement("tr");

tr.onclick=()=>{

location.href=`baseball-game.html?id=${gameId}`;

};

tr.innerHTML=`

<td>${game.date}</td>
<td>${game.away_team}</td>
<td>${game.home_team}</td>
<td>${game.away_score} - ${game.home_score}</td>

`;

tbody.appendChild(tr);

}

}

loadSeason();

</script>

</body>
</html>
