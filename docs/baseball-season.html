<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}
.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}
.navbar a{
text-decoration:none;
color:#0056d6;
}
.page{
max-width:1200px;
margin:auto;
padding:20px;
}
.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:30px;
border-radius:20px;
margin-bottom:14px;
}
table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:16px;
overflow:hidden;
}
th{
background:#002D72;
color:#fff;
padding:12px;
text-align:left;
}
td{
padding:10px;
border-bottom:1px solid #eee;
}
tr:nth-child(even){
background:#f0f6ff;
}
tr:hover{
background:#e3efff;
cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Season</h1>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Home</th>
<th>Score</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

</div>

<script>

function getGameId(game){

return (
game.game_id ||
game.id ||
game.game ||
game.boxscore ||
game.boxscore_id ||
(game.home_code && game.date
? game.home_code + game.date.replaceAll("-","") + "0"
: null)
);

}

async function loadSeason(){

const params=new URLSearchParams(window.location.search);
const season=params.get("season");

if(!season){
alert("Missing season");
return;
}

document.getElementById("title").textContent=season+" Season";

const res=await fetch("data/baseball/seasons/"+season+".json",{cache:"no-store"});

if(!res.ok){
alert("Season file missing");
return;
}

const games=await res.json();

renderGames(games);

}

function renderGames(games){

const tbody=document.getElementById("tbody");
tbody.innerHTML="";

games.forEach(game=>{

const id=getGameId(game);

const tr=document.createElement("tr");

tr.onclick=()=>{
if(!id){
console.log("Missing ID:",game);
alert("Game ID missing");
return;
}
window.location.href="baseball-game.html?game="+id;
};

tr.innerHTML=`
<td>${game.date ?? ""}</td>
<td>${game.away_code ?? ""}</td>
<td>${game.home_code ?? ""}</td>
<td>${game.away_score ?? ""} - ${game.home_score ?? ""}</td>
`;

tbody.appendChild(tr);

});

}

loadSeason();

</script>

</body>
</html>
