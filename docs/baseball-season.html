<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  :root{
    --blue:#002D72;
    --red:#C8102E;
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#0b1220;
    --muted:#667085;
    --line:#e6e8ee;
    --link:#0056d6;
    --soft:#f0f6ff;
  }

  body{
    font-family: Inter, system-ui, Arial, sans-serif;
    margin:0;
    background:var(--bg);
    color:var(--text);
  }

  .navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px;
    background:#fff;
    border-bottom:1px solid #ddd;
    font-weight:700;
  }
  .navbar a{ text-decoration:none; color:var(--link); font-size:18px; }
  .navbar a:hover{ text-decoration:underline; }

  .page{
    max-width:1200px;
    margin:0 auto;
    padding:22px;
  }

  .hero{
    background:linear-gradient(90deg,var(--blue),var(--red));
    color:#fff;
    padding:26px 28px;
    border-radius:18px;
    margin-bottom:14px;
  }
  .hero h1{
    margin:0 0 6px 0;
    font-size:28px;
    letter-spacing:.2px;
  }
  .hero .sub{
    color:rgba(255,255,255,.9);
    font-weight:600;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin:14px 0 10px 0;
  }
  .controls .left{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .chip{
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 12px;
    font-weight:700;
    color:#111;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .chip small{ color:var(--muted); font-weight:700; }

  input[type="search"]{
    width:min(420px, 100%);
    padding:10px 12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#fff;
    font-size:15px;
    outline:none;
  }

  table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(16,24,40,.02);
  }
  thead th{
    background:var(--blue);
    color:#fff;
    text-align:left;
    padding:12px 10px;
    font-size:14px;
    letter-spacing:.2px;
    position:sticky;
    top:0;
    z-index:2;
  }
  tbody td{
    padding:11px 10px;
    border-bottom:1px solid #eef0f4;
    font-size:14px;
    color:#111;
    vertical-align:middle;
  }
  tbody tr:nth-child(even){ background:#fafbfc; }

  .muted{ color:var(--muted); font-weight:700; }
  .link{
    color:var(--link);
    text-decoration:none;
    font-weight:800;
  }
  .link:hover{ text-decoration:underline; }

  .badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    background:var(--soft);
    border:1px solid #d7e6ff;
    color:#0b3d91;
    font-weight:800;
    font-size:12px;
    white-space:nowrap;
  }

  .error{
    background:#fff;
    border:1px solid #ffd4d4;
    color:#8a1f1f;
    border-radius:14px;
    padding:14px;
    font-weight:700;
  }

  .footer-note{
    margin-top:10px;
    color:var(--muted);
    font-size:13px;
    font-weight:700;
  }
</style>
</head>

<body>
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="mlb.html">MLB</a>
  </div>

  <div class="page">
    <div class="hero">
      <h1 id="heroTitle">MLB Season</h1>
      <div class="sub" id="heroSub">Loading…</div>
    </div>

    <div class="controls">
      <div class="left">
        <div class="chip"><small>Season</small> <span id="seasonChip">—</span></div>
        <div class="chip"><small>Games</small> <span id="countChip">—</span></div>
      </div>
      <input id="searchBox" type="search" placeholder="Search team code, venue, date, game id…" />
    </div>

    <div id="status"></div>

    <div style="overflow:auto; border-radius:16px;">
      <table id="gamesTable" aria-label="MLB games">
        <thead>
          <tr>
            <th style="min-width:110px;">Date</th>
            <th style="min-width:120px;">Away</th>
            <th style="min-width:120px;">Home</th>
            <th style="min-width:80px;">Score</th>
            <th style="min-width:110px;">Venue</th>
            <th style="min-width:110px;">Attendance</th>
            <th style="min-width:110px;">Length</th>
            <th style="min-width:140px;">Game</th>
          </tr>
        </thead>
        <tbody id="gamesBody"></tbody>
      </table>
    </div>

    <div class="footer-note">
      If a row has no score/venue/date, that means the season index file didn’t include those fields for that game.
    </div>
  </div>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const season = (qs.get("season") || qs.get("year") || new Date().getFullYear()).toString();

  const heroTitle = document.getElementById("heroTitle");
  const heroSub = document.getElementById("heroSub");
  const seasonChip = document.getElementById("seasonChip");
  const countChip = document.getElementById("countChip");
  const status = document.getElementById("status");
  const body = document.getElementById("gamesBody");
  const searchBox = document.getElementById("searchBox");

  heroTitle.textContent = `MLB Season ${season}`;
  heroSub.textContent = "Games & results";
  seasonChip.textContent = season;

  // Your data is clearly served under /docs/data/... from your screenshot.
  // We try several likely season-index file paths so this works without you renaming files.
  const seasonIndexCandidates = [
    `docs/data/baseball/seasons/${season}.json`,
    `docs/data/baseball/season_${season}.json`,
    `docs/data/baseball/games_${season}.json`,
    `docs/data/baseball/${season}.json`,
    `docs/data/baseball/seasons/${season}/games.json`,
    `docs/data/baseball/seasons/${season}/index.json`,
    // also try without "docs/" in case your production domain differs:
    `data/baseball/seasons/${season}.json`,
    `data/baseball/games_${season}.json`
  ];

  async function fetchFirstJson(paths){
    let lastErr = null;
    for(const p of paths){
      try{
        const res = await fetch(p, { cache: "no-store" });
        if(!res.ok) { lastErr = new Error(`${res.status} ${res.statusText} (${p})`); continue; }
        return await res.json();
      }catch(e){
        lastErr = e;
      }
    }
    throw lastErr || new Error("Unable to load JSON");
  }

  function normalizeGames(data){
    // We accept:
    // - array of games (best)
    // - object with .games
    // - object with .data
    // Return array.
    if(Array.isArray(data)) return data;
    if(data && Array.isArray(data.games)) return data.games;
    if(data && Array.isArray(data.data)) return data.data;
    return [];
  }

  function getField(obj, keys){
    for(const k of keys){
      if(obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
    }
    return "";
  }

  function safeNum(v){
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function render(games){
    body.innerHTML = "";
    countChip.textContent = games.length.toLocaleString();

    const rows = games.map(g => {
      const gameId = getField(g, ["game_id","gameId","id","game"]);
      const date = getField(g, ["date","game_date"]);
      const away = getField(g, ["away_team","away","away_name"]);
      const home = getField(g, ["home_team","home","home_name"]);
      const awayCode = getField(g, ["away_code","awayCode"]);
      const homeCode = getField(g, ["home_code","homeCode"]);
      const awayScore = getField(g, ["away_score","awayScore"]);
      const homeScore = getField(g, ["home_score","homeScore"]);
      const venue = getField(g, ["venue","park","stadium"]);
      const att = getField(g, ["attendance","att"]);
      const len = getField(g, ["game_length_minutes","length_minutes","minutes"]);

      const scoreText = (awayScore !== "" && homeScore !== "") ? `${awayScore}-${homeScore}` : "—";
      const awayText = away || awayCode || "—";
      const homeText = home || homeCode || "—";

      // THIS is the critical fix:
      // link uses gameId derived from game_id first, not some other property.
      const link = gameId ? `baseball-game.html?game=${encodeURIComponent(gameId)}&season=${encodeURIComponent(season)}` : "#";

      return {
        raw: g,
        search: `${date} ${awayText} ${homeText} ${venue} ${awayCode} ${homeCode} ${gameId}`.toLowerCase(),
        html: `
          <tr>
            <td>${date || '<span class="muted">—</span>'}</td>
            <td>${awayText}</td>
            <td>${homeText}</td>
            <td><span class="badge">${scoreText}</span></td>
            <td>${venue || '<span class="muted">—</span>'}</td>
            <td>${att !== "" ? Number(att).toLocaleString() : '<span class="muted">—</span>'}</td>
            <td>${len !== "" ? `${len} min` : '<span class="muted">—</span>'}</td>
            <td>${gameId ? `<a class="link" href="${link}">${gameId}</a>` : '<span class="muted">—</span>'}</td>
          </tr>
        `
      };
    });

    // initial draw
    rows.forEach(r => body.insertAdjacentHTML("beforeend", r.html));

    // search filter
    searchBox.addEventListener("input", () => {
      const q = searchBox.value.trim().toLowerCase();
      body.innerHTML = "";
      const filtered = q ? rows.filter(r => r.search.includes(q)) : rows;
      filtered.forEach(r => body.insertAdjacentHTML("beforeend", r.html));
      countChip.textContent = filtered.length.toLocaleString();
    });
  }

  async function init(){
    status.innerHTML = "";
    try{
      const data = await fetchFirstJson(seasonIndexCandidates);
      const games = normalizeGames(data);
      if(!games.length){
        status.innerHTML = `<div class="error">Loaded season file, but no games array was found. If your file uses a different wrapper key, tell me the top-level structure.</div>`;
        countChip.textContent = "0";
        return;
      }
      render(games);
    }catch(e){
      status.innerHTML = `<div class="error">Couldn’t load the season games index for ${season}.<br><br>Expected one of these files:<br><div class="muted" style="margin-top:8px; line-height:1.5;">${seasonIndexCandidates.map(p=>p).join("<br>")}</div></div>`;
      countChip.textContent = "0";
    }
  }

  init();
})();
</script>
</body>
</html>
