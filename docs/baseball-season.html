<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Arial;
margin:0;
background:#f4f6f8;
color:#111;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px 0;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
font-size:18px;
}

.navbar a:hover{
text-decoration:underline;
}

/* PAGE */

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:42px;
}

/* SUMMARY BOXES */

.summaryRow{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:16px;
margin-bottom:18px;
}

.summaryCard{
background:white;
padding:16px;
border-radius:14px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.summaryLabel{
font-size:13px;
font-weight:800;
color:#666;
text-transform:uppercase;
}

.summaryValue{
font-size:20px;
font-weight:800;
margin-top:4px;
}

/* TABLE */

.tableCard{
background:white;
padding:16px;
border-radius:14px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

tbody tr:hover{
background:#d6e6ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.right{
text-align:right;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading Season...</h1>
</div>

<div class="summaryRow">

<div class="summaryCard">
<div class="summaryLabel">World Series Champion</div>
<div class="summaryValue" id="wsWinner">Loading...</div>
</div>

<div class="summaryCard">
<div class="summaryLabel">American League Champion</div>
<div class="summaryValue" id="alWinner">Loading...</div>
</div>

<div class="summaryCard">
<div class="summaryLabel">National League Champion</div>
<div class="summaryValue" id="nlWinner">Loading...</div>
</div>

</div>

<div class="tableCard">

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th class="right">Score</th>
<th>Home</th>
<th>Venue</th>
<th class="right">Attendance</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

</div>

<script>

/* TEAM LEAGUES */

const LEAGUE = {

ARI:"NL", ATL:"NL", CHC:"NL", CIN:"NL", COL:"NL",
LAD:"NL", MIA:"NL", MIL:"NL", NYM:"NL", PHI:"NL",
PIT:"NL", SD:"NL", SF:"NL", STL:"NL", WSH:"NL",

BAL:"AL", BOS:"AL", CWS:"AL", CLE:"AL", DET:"AL",
HOU:"AL", KC:"AL", LAA:"AL", MIN:"AL", NYY:"AL",
OAK:"AL", SEA:"AL", TB:"AL", TEX:"AL", TOR:"AL"

};

const params=new URLSearchParams(location.search);

const year=params.get("year");

document.getElementById("title").textContent=
`${year} MLB Season`;

let PARKS={};

/* LOAD BALLPARKS */

async function loadBallparks(){

const res=await fetch("data/baseball/ballparks.csv");

const text=await res.text();

const rows=text.split("\n");

const headers=rows[0].split(",");

const parkIndex=headers.indexOf("PARKID");
const nameIndex=headers.indexOf("NAME");

rows.slice(1).forEach(r=>{

const cols=r.split(",");

if(!cols[parkIndex])return;

PARKS[cols[parkIndex]]=cols[nameIndex];

});

}

function parkName(code){

return PARKS[code]||code;

}

/* WINNER */

function getWinner(g){

return Number(g.away_score) > Number(g.home_score)
? g.away_team
: g.home_team;

}

/* DETECT CHAMPIONS */

function detectChampions(games){

let ws="";
let al="";
let nl="";

games.forEach(g=>{

const awayLeague=LEAGUE[g.away_code];
const homeLeague=LEAGUE[g.home_code];

if(awayLeague==="AL" && homeLeague==="AL")
al=getWinner(g);

if(awayLeague==="NL" && homeLeague==="NL")
nl=getWinner(g);

});

/* LAST GAME = WORLD SERIES */

ws=getWinner(games[games.length-1]);

document.getElementById("wsWinner").textContent=ws;
document.getElementById("alWinner").textContent=al;
document.getElementById("nlWinner").textContent=nl;

}

/* LOAD SEASON */

async function loadSeason(){

await loadBallparks();

const games=await fetch(
`data/baseball/seasons/${year}.json`
).then(r=>r.json());

detectChampions(games);

const body=document.getElementById("gamesBody");

body.innerHTML="";

games.forEach(g=>{

const gameId=
`${g.date}_${g.away_code}_${g.home_code}`;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${g.date}</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.away_code}'">
${g.away_team}
</td>

<td class="right click"
onclick="location.href='baseball-game.html?id=${gameId}'">
${g.away_score} – ${g.home_score}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.home_code}'">
${g.home_team}
</td>

<td>${parkName(g.venue)}</td>

<td class="right">
${g.attendance?.toLocaleString()||""}
</td>

`;

body.appendChild(tr);

});

}

loadSeason();

</script>

</body>
</html>
