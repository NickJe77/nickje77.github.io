<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Baseball Season | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.hero{
  padding:20px;
  font-size:32px;
  font-weight:700;
}

.year-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:0 20px 20px 20px;
}

.year-tab{
  padding:10px 16px;
  background:#d9d9d9;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.year-tab.active{
  background:#333;
  color:white;
}

.container{
  padding:0 20px 30px 20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:14px;
  overflow:hidden;
}

th{
  background:#0056d6;
  color:white;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid #eee;
}

tr:nth-child(even){
  background:#f2f7ff;
}

tbody tr{
  cursor:pointer;
}

tbody tr:hover{
  background:#e8f1ff;
}

.score{
  font-weight:700;
}

.status{
  color:#666;
  font-size:13px;
}
</style>
</head>

<body>

<div class="hero" id="heroTitle">Baseball Season</div>

<div class="year-tabs" id="yearTabs"></div>

<div class="container">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Away</th>
        <th>Home</th>
        <th>Score</th>
        <th>Venue</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="gamesBody"></tbody>
  </table>
</div>

<script>
const params = new URLSearchParams(window.location.search);
let season = params.get("season") || "2026";

const years = [];
for(let y = 2026; y >= 1901; y--){
  years.push(String(y));
}

function renderYearTabs(){
  const wrap = document.getElementById("yearTabs");
  wrap.innerHTML = "";

  years.forEach(year=>{
    const div = document.createElement("div");
    div.className = "year-tab" + (year === season ? " active" : "");
    div.textContent = year;

    div.onclick = ()=>{
      window.location.href = `baseball-season.html?season=${year}`;
    };

    wrap.appendChild(div);
  });
}

async function loadSeason(){
  document.getElementById("heroTitle").textContent = `Baseball ${season} Season`;

  try{
    const res = await fetch(`/data/baseball/seasons/${season}.json`);

    if(!res.ok){
      throw new Error("Season file not found");
    }

    const games = await res.json();
    renderGames(games);

  }catch(err){
    console.error(err);
    document.getElementById("gamesBody").innerHTML = `
      <tr>
        <td colspan="6">No games found for ${season}</td>
      </tr>
    `;
  }
}

function getGameFile(game){
  if(game.game_file) return game.game_file;
  if(game.file) return game.file;
  if(game.filename) return game.filename;

  const date = game.date || "";
  const away = game.away_code || game.away || "";
  const home = game.home_code || game.home || "";

  if(date && away && home){
    return `${date}_${away}_${home}.json`;
  }

  return "";
}

function renderGames(games){
  const body = document.getElementById("gamesBody");
  body.innerHTML = "";

  games.forEach(game=>{
    const tr = document.createElement("tr");

    const awayName = game.away_team || game.away || "";
    const homeName = game.home_team || game.home || "";

    const awayScore = game.away_score ?? "";
    const homeScore = game.home_score ?? "";

    const score = awayScore !== "" && homeScore !== ""
      ? `${awayScore}-${homeScore}`
      : "";

    const gameFile = getGameFile(game);

    tr.innerHTML = `
      <td>${game.date || ""}</td>
      <td>${awayName}</td>
      <td>${homeName}</td>
      <td class="score">${score}</td>
      <td>${game.venue || ""}</td>
      <td class="status">${game.status || ""}</td>
    `;

    tr.onclick = ()=>{
      if(!gameFile) return;
      window.location.href =
        `baseball-game.html?season=${season}&game=${encodeURIComponent(gameFile)}`;
    };

    body.appendChild(tr);
  });
}

renderYearTabs();
loadSeason();
</script>

</body>
</html>
