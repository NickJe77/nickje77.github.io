<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:30px;
border-radius:20px;
margin-bottom:14px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:16px;
overflow:hidden;
}

th{
background:#002D72;
color:#fff;
padding:12px;
text-align:left;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f0f6ff;
}

tr:hover{
background:#e3efff;
cursor:pointer;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Season</h1>
</div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Home</th>
<th>Score</th>
</tr>
</thead>

<tbody id="tbody">
</tbody>

</table>

</div>

<script>

let TEAM_MAP = {}; // code -> full name

async function tryFetchJson(paths){
  for(const p of paths){
    try{
      const r = await fetch(p, { cache: "no-store" });
      if(r.ok){
        return await r.json();
      }
    }catch(e){}
  }
  return null;
}

function buildTeamMap(data){
  const map = {};

  if(!data) return map;

  // Case 1: { "NYA": { name: "New York Yankees" }, ... } OR { "NYA":"New York Yankees" }
  if(typeof data === "object" && !Array.isArray(data)){
    for(const [k,v] of Object.entries(data)){
      if(v && typeof v === "object"){
        const name = v.name || v.full_name || v.team_name || v.fullName || v.display || v.long_name;
        if(name) map[k] = name;
      }else if(typeof v === "string"){
        map[k] = v;
      }
    }
    return map;
  }

  // Case 2: [ { code:"NYA", name:"New York Yankees" }, ... ]
  if(Array.isArray(data)){
    data.forEach(t=>{
      if(!t || typeof t !== "object") return;
      const code =
        t.code || t.team_code || t.abbr || t.abbrev || t.abbreviation || t.id || t.short || t.short_code;
      const name =
        t.name || t.full_name || t.team_name || t.fullName || t.long_name || t.display;
      if(code && name) map[code] = name;
    });
  }

  return map;
}

function teamName(code){
  if(!code) return "";
  return TEAM_MAP[code] || TEAM_MAP[String(code).toUpperCase()] || code;
}

async function loadTeams(){
  // Try a few common locations WITHOUT changing your season data path.
  // (If teams.json exists at the first path, it will use it immediately.)
  const data = await tryFetchJson([
    "data/baseball/teams.json",
    "data/baseball/teams_index.json",
    "data/baseball/teams-map.json",
    "data/baseball/teams/teams.json"
  ]);

  TEAM_MAP = buildTeamMap(data);
}

async function loadSeason(){

const params=new URLSearchParams(window.location.search);

const season=params.get("season");

if(!season){

alert("Missing season");

return;

}

document.getElementById("title").textContent=season+" Season";

// Load teams first (safe even if file missing)
await loadTeams();

const res=await fetch(`data/baseball/seasons/${season}.json`, { cache: "no-store" });

if(!res.ok){

alert("Season file missing");

return;

}

const games=await res.json();

renderGames(games);

}

function renderGames(games){

const tbody=document.getElementById("tbody");

tbody.innerHTML="";

games.forEach(game=>{

// THIS IS THE CORRECT ID FIELD
const id = game.game_id;

const tr=document.createElement("tr");

tr.onclick=()=>{
window.location.href="baseball-game.html?game="+id;
};

const away = teamName(game.away_code);
const home = teamName(game.home_code);

tr.innerHTML=`
<td>${game.date}</td>
<td>${away}</td>
<td>${home}</td>
<td>${game.away_score ?? ""} - ${game.home_score ?? ""}</td>
`;

tbody.appendChild(tr);

});

}

loadSeason();

</script>

</body>
</html>
