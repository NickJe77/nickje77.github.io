<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.summaryRow{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:16px;
margin-bottom:16px;
}

.summaryCard{
background:white;
padding:16px;
border-radius:12px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:12px;
}

.tab{
background:white;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.tab.active{
background:#002D72;
color:white;
}

.section{display:none;}
.section.active{display:block;}

.tableCard{
background:white;
padding:16px;
border-radius:12px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">
<h1 id="title"></h1>
</div>

<div class="summaryRow">

<div class="summaryCard">
World Series Champion
<div id="wsWinner"></div>
</div>

<div class="summaryCard">
American League Champion
<div id="alWinner"></div>
</div>

<div class="summaryCard">
National League Champion
<div id="nlWinner"></div>
</div>

</div>

<div class="tabs">

<div class="tab active" onclick="showTab('games',this)">Games</div>
<div class="tab" onclick="showTab('standings',this)">Standings</div>
<div class="tab" onclick="showTab('playoffs',this)">Playoffs</div>

</div>

<div id="games" class="section active">
<div class="tableCard">
<table>
<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Score</th>
<th>Home</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>
</div>

<div id="standings" class="section">
<div class="tableCard">
<table>
<thead>
<tr>
<th>Team</th>
<th>W</th>
<th>L</th>
<th>%</th>
</tr>
</thead>
<tbody id="standingsBody"></tbody>
</table>
</div>
</div>

<div id="playoffs" class="section">
<div class="tableCard">
<table>
<thead>
<tr>
<th>Round</th>
<th>Winner</th>
</tr>
</thead>
<tbody id="playoffsBody"></tbody>
</table>
</div>
</div>

</div>

<script>

const LEAGUE={
ARI:"NL",ATL:"NL",CHC:"NL",CIN:"NL",COL:"NL",
LAD:"NL",MIA:"NL",MIL:"NL",NYM:"NL",PHI:"NL",
PIT:"NL",SD:"NL",SF:"NL",STL:"NL",WSH:"NL",

BAL:"AL",BOS:"AL",CWS:"AL",CLE:"AL",DET:"AL",
HOU:"AL",KC:"AL",LAA:"AL",MIN:"AL",NYY:"AL",
OAK:"AL",SEA:"AL",TB:"AL",TEX:"AL",TOR:"AL"
};

function showTab(name,el){

document.querySelectorAll(".section")
.forEach(s=>s.classList.remove("active"));

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document.getElementById(name).classList.add("active");
el.classList.add("active");

}

const year=new URLSearchParams(location.search).get("year");

title.textContent=year+" MLB Season";

function winner(g){
return g.away_score>g.home_score?g.away_team:g.home_team;
}

function detectChampions(games){

let al,nl;

games.forEach(g=>{

if(LEAGUE[g.away_code]=="AL" && LEAGUE[g.home_code]=="AL")
al=winner(g);

if(LEAGUE[g.away_code]=="NL" && LEAGUE[g.home_code]=="NL")
nl=winner(g);

});

const ws=winner(games[games.length-1]);

wsWinner.textContent=ws;
alWinner.textContent=al;
nlWinner.textContent=nl;

playoffsBody.innerHTML=`
<tr><td>American League Champion</td><td>${al}</td></tr>
<tr><td>National League Champion</td><td>${nl}</td></tr>
<tr><td>World Series Champion</td><td>${ws}</td></tr>
`;

}

function buildStandings(games){

const table={};

games.forEach(g=>{

table[g.away_team]??={w:0,l:0};
table[g.home_team]??={w:0,l:0};

if(g.away_score>g.home_score){
table[g.away_team].w++;
table[g.home_team].l++;
}else{
table[g.home_team].w++;
table[g.away_team].l++;
}

});

const arr=Object.entries(table)
.map(([team,r])=>({

team,
w:r.w,
l:r.l,
pct:(r.w/(r.w+r.l)).toFixed(3)

}))
.sort((a,b)=>b.pct-a.pct);

arr.forEach(t=>{

standingsBody.innerHTML+=`
<tr>
<td>${t.team}</td>
<td>${t.w}</td>
<td>${t.l}</td>
<td>${t.pct}</td>
</tr>
`;

});

}

async function load(){

const games=await fetch(
`data/baseball/seasons/${year}.json`
).then(r=>r.json());

games.forEach(g=>{

gamesBody.innerHTML+=`
<tr>
<td>${g.date}</td>
<td>${g.away_team}</td>
<td>${g.away_score}-${g.home_score}</td>
<td>${g.home_team}</td>
</tr>
`;

});

detectChampions(games);

buildStandings(games);

}

load();

</script>

</body>
</html>
