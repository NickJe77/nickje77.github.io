<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.summaryRow{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:16px;
margin-bottom:16px;
}

.summaryCard{
background:white;
padding:16px;
border-radius:12px;
font-weight:700;
}

.summaryCard div{
margin-top:6px;
font-weight:400;
}

.tableCard{
background:white;
padding:16px;
border-radius:12px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.error{
color:red;
font-weight:700;
padding:20px;
text-align:center;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
</div>

<div class="summaryRow">

<div class="summaryCard">
World Series Champion
<div id="wsWinner">—</div>
</div>

<div class="summaryCard">
American League Champion
<div id="alWinner">—</div>
</div>

<div class="summaryCard">
National League Champion
<div id="nlWinner">—</div>
</div>

</div>

<div class="tableCard">

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Score</th>
<th>Home</th>
</tr>
</thead>

<tbody id="gamesBody">
<tr><td colspan="4">Loading games...</td></tr>
</tbody>

</table>

</div>

</div>

<script>

const params = new URLSearchParams(location.search);

const year =
params.get("year") ||
params.get("season");

const title = document.getElementById("title");
const gamesBody = document.getElementById("gamesBody");

if(!year){

title.textContent="Season not specified";

gamesBody.innerHTML=
"<tr><td colspan='4' class='error'>Missing season parameter</td></tr>";

throw new Error("Missing year parameter");

}

title.textContent = year + " MLB Season";

async function loadSeason(){

try{

const res =
await fetch("data/baseball/seasons/" + year + ".json");

if(!res.ok)
throw new Error("Season file not found");

const games =
await res.json();

renderGames(games);

}catch(err){

console.error(err);

gamesBody.innerHTML =
"<tr><td colspan='4' class='error'>Failed to load season</td></tr>";

}

}

function renderGames(games){

gamesBody.innerHTML="";

games.forEach(g=>{

const id =
`${g.date}_${g.away_code}_${g.home_code}`;

gamesBody.innerHTML+=`

<tr>

<td>${g.date}</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.away_code}'">
${g.away_team}
</td>

<td class="click"
onclick="location.href='baseball-game.html?id=${id}'">
${g.away_score}-${g.home_score}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.home_code}'">
${g.home_team}
</td>

</tr>

`;

});

}

loadSeason();

</script>

</body>
</html>
