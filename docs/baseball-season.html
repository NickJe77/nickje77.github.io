<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLB Season | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#c8102e;
  --accent-soft:rgba(200,16,46,.12);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:var(--body);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
}

.nav{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:15px 10px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.nav a{
    color:var(--ink);
    text-decoration:none;
    font-weight:600;
    margin:0 18px;
    font-size:13.5px;
    opacity:.7;
    transition:opacity .15s,color .15s;
}
.nav a:hover,.nav a[aria-current="page"]{
    opacity:1;
    color:var(--accent);
}

.layout{
    display:flex;
    gap:20px;
    max-width:1600px;
    margin:0 auto;
    padding:26px 20px 70px;
    align-items:flex-start;
}

.ad-col{
    width:160px;
    min-width:160px;
    position:sticky;
    top:80px;
}

.ad-slot{
    width:160px;
    min-height:600px;
    background:var(--surface);
    border-radius:var(--radius);
    border:1px dashed var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--faint);
    font-size:11px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-align:center;
}

.page{
    flex:1;
    min-width:0;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
    position:relative;
    background:linear-gradient(160deg,var(--board-2),var(--board));
    border-radius:var(--radius);
    padding:32px 34px;
    color:#fff;
    margin-bottom:22px;
    box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
    font-family:var(--body);
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:10px;
}
.hero h1{
    margin:0;
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(28px,5vw,44px);
    letter-spacing:.01em;
    text-transform:uppercase;
    line-height:1;
}

/* ── Year tabs ────────────────────────────────────────── */
.year-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:20px;
    max-height:120px;
    overflow-y:auto;
}

.year-tab{
    background:var(--surface);
    padding:7px 14px;
    border-radius:999px;
    font-family:var(--body);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    border:1px solid var(--line);
    color:var(--muted);
    transition:background .15s,color .15s,border-color .15s;
}
.year-tab:hover{border-color:var(--faint);color:var(--ink);}

.year-tab.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
}

/* ── Filters ──────────────────────────────────────────── */
.filters{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
    align-items:center;
}

.filters input,
.filters select{
    padding:9px 16px;
    border:1px solid var(--line);
    border-radius:999px;
    font-size:13px;
    font-family:var(--body);
    font-weight:600;
    background:var(--surface);
    color:var(--ink);
    outline:none;
}
.filters input:hover,
.filters select:hover{border-color:var(--faint);}
.filters input:focus,
.filters select:focus{border-color:var(--accent);}

.filters input{
    width:200px;
}

.filter-count{
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin-left:auto;
}

/* ── Table ────────────────────────────────────────────── */
.table-wrap{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow-x:auto;
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
}

th{
    background:#f7f9fb;
    color:var(--muted);
    padding:11px 14px;
    text-align:left;
    font-family:var(--body);
    font-weight:600;
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    border-bottom:1px solid var(--line);
    transition:color .15s;
}

th:hover{
    color:var(--accent);
}

th .sort-arrow{
    margin-left:4px;
    opacity:0.5;
}

td{
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    color:#27313c;
    font-variant-numeric:tabular-nums;
}

tbody tr:last-child td{
    border-bottom:none;
}

tbody tr{
    cursor:pointer;
    transition:background .15s;
}

tbody tr:hover td{
    background:#f0f6ff;
}

.score{
    font-weight:700;
    white-space:nowrap;
    color:var(--ink);
}

.no-results{
    text-align:center;
    padding:40px;
    color:var(--muted);
    font-size:14px;
}

@media(max-width:900px){

.layout{
    padding:10px;
    gap:0;
}

.ad-col{
    display:none;
}

.hero{
    padding:22px;
    margin-bottom:18px;
}

.hero h1{
    font-size:30px;
}

.nav{
    padding:12px 6px;
}

.nav a{
    margin:0 8px;
    font-size:12px;
}

.year-tabs{
    gap:6px;
    margin-bottom:16px;
}

.year-tab{
    font-size:11px;
    padding:6px 10px;
}

th{
    font-size:10px;
    padding:8px 6px;
}

td{
    font-size:11px;
    padding:8px 6px;
}

.filters input{
    width:140px;
}

}

</style>
</head>

<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="baseball-seasons.html" aria-current="page">Seasons</a>
    <a href="baseball-players.html">Players</a>
</div>

<div class="layout">

    <div class="ad-col">
        <div class="ad-slot">Ad</div>
    </div>

    <div class="page">

        <div class="hero">
            <div class="eyebrow">MLB</div>
            <h1 id="heroTitle">MLB Season</h1>
        </div>

        <div class="year-tabs" id="yearTabs"></div>

        <div class="filters">
            <input
                type="text"
                id="searchInput"
                placeholder="Search team or venue…"
                oninput="applyFilters()"
            />
            <select id="statusFilter" onchange="applyFilters()">
                <option value="">All statuses</option>
                <option value="Final">Final</option>
                <option value="Live">Live</option>
                <option value="Scheduled">Scheduled</option>
                <option value="Postponed">Postponed</option>
            </select>
            <span class="filter-count" id="filterCount"></span>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortBy('date')">Date <span class="sort-arrow" id="sort-date">↕</span></th>
                        <th onclick="sortBy('away_team')">Away <span class="sort-arrow" id="sort-away_team">↕</span></th>
                        <th onclick="sortBy('home_team')">Home <span class="sort-arrow" id="sort-home_team">↕</span></th>
                        <th>Score</th>
                        <th onclick="sortBy('venue')">Venue <span class="sort-arrow" id="sort-venue">↕</span></th>
                    </tr>
                </thead>
                <tbody id="gamesBody"></tbody>
            </table>
        </div>

    </div>

    <div class="ad-col">
        <div class="ad-slot">Ad</div>
    </div>

</div>

<script>

const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
const params = new URLSearchParams(window.location.search);
let season = params.get("season") || "2026";

document.getElementById("heroTitle").innerText = `MLB ${season} Season`;

const years = [];
for(let y = 2026; y >= 1901; y--){
    years.push(String(y));
}

let allGames = [];
let sortKey = "date";
let sortDir = 1;
let VENUE_NAMES = {};

const TEAM_NAMES = {
    "ARI": "Arizona Diamondbacks",
    "ATL": "Atlanta Braves",
    "BAL": "Baltimore Orioles",
    "BOS": "Boston Red Sox",
    "CHC": "Chicago Cubs",
    "CHW": "Chicago White Sox",
    "CIN": "Cincinnati Reds",
    "CLE": "Cleveland Guardians",
    "COL": "Colorado Rockies",
    "DET": "Detroit Tigers",
    "HOU": "Houston Astros",
    "KAN": "Kansas City Royals",
    "LAA": "Los Angeles Angels",
    "LAD": "Los Angeles Dodgers",
    "MIA": "Miami Marlins",
    "MIL": "Milwaukee Brewers",
    "MIN": "Minnesota Twins",
    "NYM": "New York Mets",
    "NYY": "New York Yankees",
    "ATH": "Athletics",
    "PHI": "Philadelphia Phillies",
    "PIT": "Pittsburgh Pirates",
    "SD":  "San Diego Padres",
    "SEA": "Seattle Mariners",
    "SF":  "San Francisco Giants",
    "STL": "St. Louis Cardinals",
    "TB":  "Tampa Bay Rays",
    "TEX": "Texas Rangers",
    "TOR": "Toronto Blue Jays",
    "WSH": "Washington Nationals",
    "ANA": "Los Angeles Angels",
    "CAL": "California Angels",
    "FLA": "Florida Marlins",
    "MON": "Montreal Expos",
    "OAK": "Oakland Athletics",
    "SFN": "San Francisco Giants",
    "SDN": "San Diego Padres",
    "SLN": "St. Louis Cardinals",
    "NYN": "New York Mets",
    "NYA": "New York Yankees",
    "CHN": "Chicago Cubs",
    "CHA": "Chicago White Sox",
    "KCA": "Kansas City Royals",
    "LAN": "Los Angeles Dodgers",
    "TBA": "Tampa Bay Rays",
    "WAS": "Washington Nationals"
};

async function loadBallparks(){
    try{
        const res = await fetch(`${R2}/baseball/ballparks.csv`);
        const text = await res.text();
        const lines = text.trim().split("\n").slice(1);
        lines.forEach(line => {
            const cols = line.split(",");
            const id   = cols[0].trim();
            const name = cols[1].trim();
            if(id && name) VENUE_NAMES[id] = name;
        });
    } catch(err){
        console.error("Could not load ballparks.csv", err);
    }
}

function resolveTeamName(game, side){
    const nameKey = side + "_team";
    const codeKey = side + "_code";
    const raw  = game[nameKey] || "";
    const code = game[codeKey] || "";
    if(raw && raw.includes(" ")){
        return raw;
    }
    const lookup = raw || code;
    return TEAM_NAMES[lookup] || lookup;
}

function resolveVenue(game){
    const v = game.venue || "";
    if(v && !v.includes(" ")){
        return VENUE_NAMES[v] || v;
    }
    return v;
}

function renderYearTabs(){
    const wrap = document.getElementById("yearTabs");
    wrap.innerHTML = "";
    years.forEach(year => {
        const div = document.createElement("div");
        div.className = "year-tab" + (year === season ? " active" : "");
        div.innerText = year;
        div.onclick = () => {
            window.location.href = `baseball-season.html?season=${year}`;
        };
        wrap.appendChild(div);
    });
}

function sortBy(key){
    if(sortKey === key){
        sortDir *= -1;
    } else {
        sortKey = key;
        sortDir = 1;
    }
    document.querySelectorAll(".sort-arrow").forEach(el => el.innerText = "↕");
    const arrow = document.getElementById(`sort-${key}`);
    if(arrow) arrow.innerText = sortDir === 1 ? "↑" : "↓";
    applyFilters();
}

function applyFilters(){
    const search = document.getElementById("searchInput").value.toLowerCase();
    const status = document.getElementById("statusFilter").value.toLowerCase();

    let filtered = allGames.filter(game => {
        const home  = resolveTeamName(game, "home");
        const away  = resolveTeamName(game, "away");
        const venue = resolveVenue(game);
        const matchSearch = !search || [
            home, away, venue, game.date || ""
        ].some(v => v.toLowerCase().includes(search));
        const matchStatus = !status ||
            (game.status || "").toLowerCase().includes(status);
        return matchSearch && matchStatus;
    });

    filtered.sort((a, b) => {
        let av = a[sortKey] || "";
        let bv = b[sortKey] || "";
        return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });

    renderGames(filtered);
}

async function loadSeason(){
    try{
        const res = await fetch(`${R2}/baseball/seasons/${season}.json`);
        if(!res.ok) throw new Error("Season not found");
        const data = await res.json();

        // Some historical seasons have the wrong data sitting at this
        // path (player-level batting stats instead of a game schedule --
        // a pre-existing data issue, not something specific to this
        // page). Detect it by checking for the fields a real game
        // record must have, and show a clear message instead of
        // rendering a table full of blank/fake "0-0" rows.
        const looksLikeGameData = Array.isArray(data) && data.length > 0
            && data[0] && typeof data[0] === "object"
            && "date" in data[0] && "home_team" in data[0];

        if(!looksLikeGameData){
            document.getElementById("gamesBody").innerHTML =
                `<tr><td colspan="5" class="no-results">Game-by-game schedule data isn't available yet for this season.</td></tr>`;
            document.getElementById("filterCount").innerText = "";
            return;
        }

        allGames = data;
        applyFilters();
    } catch(err){
        console.error(err);
        document.getElementById("gamesBody").innerHTML =
            `<tr><td colspan="5" class="no-results">Could not load season data.</td></tr>`;
    }
}

function renderGames(games){
    const body = document.getElementById("gamesBody");
    document.getElementById("filterCount").innerText =
        `${games.length} game${games.length !== 1 ? "s" : ""}`;

    if(!games.length){
        body.innerHTML =
            `<tr><td colspan="5" class="no-results">No games match your search.</td></tr>`;
        return;
    }

    body.innerHTML = "";

    games.forEach(game => {
        const home  = resolveTeamName(game, "home");
        const away  = resolveTeamName(game, "away");
        const venue = resolveVenue(game);
        const link  = `baseball-game.html?season=${season}&game=${encodeURIComponent(game.game_file || "")}`;
        const tr = document.createElement("tr");
        tr.style.cursor = "pointer";
        tr.innerHTML = `
            <td>${game.date || ""}</td>
            <td>${away}</td>
            <td>${home}</td>
            <td class="score">${game.away_score ?? 0} – ${game.home_score ?? 0}</td>
            <td>${venue}</td>
        `;
        tr.addEventListener("click", () => {
            window.location.href = link;
        });
        body.appendChild(tr);
    });
}

renderYearTabs();
loadBallparks().then(() => loadSeason());

</script>

</body>
</html>
