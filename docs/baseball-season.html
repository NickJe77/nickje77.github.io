<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.summaryRow{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:16px;
margin-bottom:16px;
}

.summaryCard{
background:white;
padding:16px;
border-radius:12px;
font-weight:700;
}

.summaryCard div{
margin-top:6px;
font-weight:400;
}

.tableCard{
background:white;
padding:16px;
border-radius:12px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.error{
color:red;
font-weight:700;
padding:20px;
}

</style>
</head>
<body>

<div class="navbar">

<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-players.html">Players</a>

</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
</div>

<div class="summaryRow">

<div class="summaryCard">
World Series Champion
<div id="wsWinner">—</div>
</div>

<div class="summaryCard">
American League Champion
<div id="alWinner">—</div>
</div>

<div class="summaryCard">
National League Champion
<div id="nlWinner">—</div>
</div>

</div>

<div class="tableCard">

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Score</th>
<th>Home</th>
</tr>
</thead>

<tbody id="gamesBody">
<tr><td colspan="4">Loading games...</td></tr>
</tbody>

</table>

</div>

</div>

<script>

const params = new URLSearchParams(location.search);

const year =
params.get("year") ||
params.get("season");

const title = document.getElementById("title");
const gamesBody = document.getElementById("gamesBody");
const wsWinner = document.getElementById("wsWinner");
const alWinner = document.getElementById("alWinner");
const nlWinner = document.getElementById("nlWinner");

if(!year){

title.textContent="Season not specified";

gamesBody.innerHTML=
"<tr><td colspan='4' class='error'>Missing season parameter</td></tr>";

throw new Error("Missing year parameter");

}

title.textContent = year + " MLB Season";

const AL=[
"BAL","BOS","NYY","TB","TOR",
"CWS","CLE","DET","KC","MIN",
"HOU","LAA","OAK","SEA","TEX"
];

function league(code){

return AL.includes(code) ? "AL" : "NL";

}

let ALL_GAMES = [];

async function loadSeason(){

try{

const regularResponse = await fetch(
`data/baseball/seasons/${year}.json`
);

if(!regularResponse.ok)
throw new Error("Season file missing");

const regular = await regularResponse.json();

ALL_GAMES = [...regular];

/* load playoff boxscores */

for(const g of regular){

const id =
`${g.date}_${g.away_code}_${g.home_code}`;

try{

const boxResponse = await fetch(
`data/baseball/boxscores/${id}.json`
);

if(!boxResponse.ok) continue;

const box = await boxResponse.json();

if(
box.date.startsWith(year+"-10") ||
box.date.startsWith(year+"-11")
){

ALL_GAMES.push(box);

}

}catch{}

}

/* sort */

ALL_GAMES.sort(
(a,b)=>a.date.localeCompare(b.date)
);

renderGames();

detectChampions();

}catch(err){

console.error(err);

gamesBody.innerHTML=
"<tr><td colspan='4' class='error'>Failed to load season</td></tr>";

}

}

function renderGames(){

gamesBody.innerHTML="";

ALL_GAMES.forEach(g=>{

const id =
`${g.date}_${g.away_code}_${g.home_code}`;

gamesBody.innerHTML+=`

<tr>

<td>${g.date}</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.away_code}'">
${g.away_team}
</td>

<td class="click"
onclick="location.href='baseball-game.html?id=${id}'">
${g.away_score}-${g.home_score}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.home_code}'">
${g.home_team}
</td>

</tr>

`;

});

}

function detectChampions(){

if(ALL_GAMES.length===0) return;

/* World Series winner */

const ws = ALL_GAMES[ALL_GAMES.length-1];

wsWinner.textContent =
ws.away_score > ws.home_score
? ws.away_team
: ws.home_team;

/* AL winner */

for(let i=ALL_GAMES.length-1;i>=0;i--){

const g = ALL_GAMES[i];

if(
league(g.away_code)==="AL" &&
league(g.home_code)==="AL"
){

alWinner.textContent =
g.away_score>g.home_score
? g.away_team
: g.home_team;

break;

}

}

/* NL winner */

for(let i=ALL_GAMES.length-1;i>=0;i--){

const g = ALL_GAMES[i];

if(
league(g.away_code)==="NL" &&
league(g.home_code)==="NL"
){

nlWinner.textContent =
g.away_score>g.home_score
? g.away_team
: g.home_team;

break;

}

}

}

loadSeason();

</script>

</body>
</html>
