<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

th{
  background:#002D72;
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:10px;
  border-bottom:1px solid #eee;
}

tr:nth-child(even){
  background:#f0f6ff;
}

tr:hover{
  background:#e3efff;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-player.html">Players</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading Season...</h1>
</div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Home</th>
<th>Score</th>
</tr>
</thead>

<tbody id="tbody">
</tbody>

</table>

</div>

<script>

const owner="nickje77";
const repo="nickje77.github.io";
const branch="main";

// TEAM CODE → FULL NAME MAP
const TEAM_NAMES = {
  "HOM":"Homestead Grays",
  "NY6":"New York Giants",
  "CCR":"Cleveland Buckeyes",
  "KCM":"Kansas City Monarchs",
  "BRO":"Brooklyn Dodgers",
  "BSN":"Boston Braves",
  "NYA":"New York Yankees",
  "BOS":"Boston Red Sox",
  "CHN":"Chicago Cubs",
  "CHA":"Chicago White Sox",
  "SLN":"St Louis Cardinals",
  "SLA":"St Louis Browns",
  "DET":"Detroit Tigers",
  "CLE":"Cleveland Indians",
  "PHA":"Philadelphia Athletics",
  "PHI":"Philadelphia Phillies",
  "PIT":"Pittsburgh Pirates",
  "CIN":"Cincinnati Reds",
  "LAN":"Los Angeles Dodgers",
  "SFN":"San Francisco Giants",
  "NYN":"New York Mets",
  "ATL":"Atlanta Braves"
};

function getTeamName(code){
  return TEAM_NAMES[code] || code;
}

async function loadSeason(){

  const params=new URLSearchParams(window.location.search);
  const season=params.get("season");

  if(!season){
    alert("Missing season parameter");
    return;
  }

  document.getElementById("title").textContent=season+" Season";

  const api=
  `https://api.github.com/repos/${owner}/${repo}/contents/docs/data/baseball/boxscores/${season}?ref=${branch}`;

  const res=await fetch(api);

  const files=await res.json();

  files.sort((a,b)=>a.name.localeCompare(b.name));

  const tbody=document.getElementById("tbody");

  for(const file of files){

    if(!file.name.endsWith(".json")) continue;

    const id=file.name.replace(".json","");

    const gameRes=await fetch(file.download_url);
    const game=await gameRes.json();

    const awayCode=game.away_code;
    const homeCode=game.home_code;

    const awayName=getTeamName(awayCode);
    const homeName=getTeamName(homeCode);

    const awayScore=
      game.away_score ??
      game.linescore?.away ??
      "";

    const homeScore=
      game.home_score ??
      game.linescore?.home ??
      "";

    const tr=document.createElement("tr");

    tr.onclick=()=>{
      window.location.href=`baseball-game.html?id=${id}`;
    };

    tr.innerHTML=`
      <td>${game.date}</td>
      <td>${awayName}</td>
      <td>${homeName}</td>
      <td>${awayScore} - ${homeScore}</td>
    `;

    tbody.appendChild(tr);

  }

}

loadSeason();

</script>

</body>
</html>
