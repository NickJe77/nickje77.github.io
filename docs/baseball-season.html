<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLB Season | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Inter,system-ui,sans-serif;
    background:#f4f6f8;
}

.nav{
    background:white;
    border-bottom:1px solid #dfe5ec;
    padding:16px 10px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.nav a{
    color:#0056d6;
    text-decoration:none;
    font-weight:700;
    margin:0 18px;
    font-size:15px;
}

.layout{
    display:flex;
    gap:20px;
    max-width:1600px;
    margin:0 auto;
    padding:20px;
    align-items:flex-start;
}

.ad-col{
    width:160px;
    min-width:160px;
    position:sticky;
    top:80px;
}

.ad-slot{
    width:160px;
    min-height:600px;
    background:white;
    border-radius:16px;
    border:1px dashed #dce3eb;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#bbb;
    font-size:11px;
    text-align:center;
}

.page{
    flex:1;
    min-width:0;
}

.hero{
    background:linear-gradient(135deg,#002f87,#d90429);
    border-radius:30px;
    padding:42px;
    color:white;
    margin-bottom:25px;
}

.hero h1{
    margin:0;
    font-size:58px;
    line-height:1;
}

.year-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:22px;
}

.year-tab{
    background:white;
    padding:8px 14px;
    border-radius:12px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    border:1px solid #dce3eb;
}

.year-tab.active{
    background:#0056d6;
    color:white;
}

.filters{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
    align-items:center;
}

.filters input,
.filters select{
    padding:8px 12px;
    border:1px solid #dce3eb;
    border-radius:10px;
    font-size:13px;
    font-family:inherit;
    background:white;
    outline:none;
}

.filters input{
    width:200px;
}

.filter-count{
    font-size:12px;
    color:#666;
    margin-left:auto;
}

.table-wrap{
    background:white;
    border-radius:22px;
    overflow-x:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
}

th{
    background:#0056d6;
    color:white;
    padding:12px 14px;
    text-align:left;
    font-size:13px;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
}

th:hover{
    background:#0047b8;
}

th .sort-arrow{
    margin-left:4px;
    opacity:0.6;
}

td{
    padding:12px 14px;
    border-bottom:1px solid #edf2f7;
    font-size:13px;
}

tr:nth-child(even){
    background:#f7fbff;
}

tbody tr{
    cursor:pointer;
    transition:.15s;
}

tbody tr:hover{
    background:#eaf2ff;
}

.score{
    font-weight:700;
    white-space:nowrap;
}

.no-results{
    text-align:center;
    padding:40px;
    color:#999;
    font-size:14px;
}

@media(max-width:900px){

.layout{
    padding:10px;
    gap:0;
}

.ad-col{
    display:none;
}

.hero{
    padding:22px;
    border-radius:22px;
    margin-bottom:18px;
}

.hero h1{
    font-size:34px;
}

.nav{
    padding:12px 6px;
}

.nav a{
    margin:0 8px;
    font-size:12px;
}

.year-tabs{
    gap:6px;
    margin-bottom:16px;
}

.year-tab{
    font-size:10px;
    padding:6px 8px;
    border-radius:10px;
}

th{
    font-size:10px;
    padding:8px 6px;
}

td{
    font-size:10px;
    padding:8px 6px;
}

.filters input{
    width:140px;
}

}

</style>
</head>

<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="baseball.html">Baseball</a>
    <a href="baseball-seasons.html">Seasons</a>
    <a href="baseball-players.html">Players</a>
</div>

<div class="layout">

    <div class="ad-col">
        <div class="ad-slot">Ad</div>
    </div>

    <div class="page">

        <div class="hero">
            <h1 id="heroTitle">MLB Season</h1>
        </div>

        <div class="year-tabs" id="yearTabs"></div>

        <div class="filters">
            <input
                type="text"
                id="searchInput"
                placeholder="Search team or venue…"
                oninput="applyFilters()"
            />
            <select id="statusFilter" onchange="applyFilters()">
                <option value="">All statuses</option>
                <option value="Final">Final</option>
                <option value="Live">Live</option>
                <option value="Scheduled">Scheduled</option>
                <option value="Postponed">Postponed</option>
            </select>
            <span class="filter-count" id="filterCount"></span>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortBy('date')">Date <span class="sort-arrow" id="sort-date">↕</span></th>
                        <th onclick="sortBy('away_team')">Away <span class="sort-arrow" id="sort-away_team">↕</span></th>
                        <th onclick="sortBy('home_team')">Home <span class="sort-arrow" id="sort-home_team">↕</span></th>
                        <th>Score</th>
                        <th onclick="sortBy('venue')">Venue <span class="sort-arrow" id="sort-venue">↕</span></th>
                    </tr>
                </thead>
                <tbody id="gamesBody"></tbody>
            </table>
        </div>

    </div>

    <div class="ad-col">
        <div class="ad-slot">Ad</div>
    </div>

</div>
