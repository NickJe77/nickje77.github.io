<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}
th{
  background:#002D72;
  color:#fff;
  padding:10px;
}
td{
  padding:8px;
  border-bottom:1px solid #eee;
}
tr:nth-child(even){
  background:#f7fbff;
}
a.player-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
a.player-link:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="/index.html">Home</a>
  <a href="/baseball.html">Baseball</a>
  <a href="/baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<h1 id="seasonTitle">Season</h1>

<table>
<thead>
<tr>
  <th>Player</th>
  <th>Team</th>
  <th>G</th>
  <th>AB</th>
  <th>H</th>
  <th>HR</th>
  <th>AVG</th>
</tr>
</thead>
<tbody id="seasonBody"></tbody>
</table>

</div>

<script>
(async function(){

function avg(h,ab){ return ab ? (h/ab).toFixed(3) : "0.000"; }

async function safeFetch(url){
  try{
    const r = await fetch(url);
    if(!r.ok) return null;
    return r.json();
  }catch{
    return null;
  }
}

const qs = new URLSearchParams(location.search);
const season = qs.get("season");

if(!season){
  document.getElementById("seasonTitle").textContent="Season not specified";
  return;
}

document.getElementById("seasonTitle").textContent = season + " Season";

const data = await safeFetch(`/data/baseball/players/${season}.json`);
if(!data) return;

document.getElementById("seasonBody").innerHTML = data.map(row => `
  <tr>
    <td>
      <a class="player-link"
         href="/baseball-player.html?player=${row.player_id}">
         ${row.name}
      </a>
    </td>
    <td>${row.team}</td>
    <td>${row.games}</td>
    <td>${row.at_bats}</td>
    <td>${row.hits}</td>
    <td>${row.home_runs}</td>
    <td>${avg(row.hits,row.at_bats)}</td>
  </tr>
`).join("");

})();
</script>

</body>
</html>
