<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--blue:#002D72;--red:#C8102E;--bg:#f4f6f8;--card:#ffffff;--line:#e6e8ee;--zebra:#f0f6ff;--hover:#e0ecff;}
body{font-family:Inter,system-ui,Arial;margin:0;background:var(--bg);}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;background:#fff;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page{max-width:1200px;margin:auto;padding:25px 20px 40px;}
.hero{background:linear-gradient(90deg,var(--blue),var(--red));color:white;padding:32px;border-radius:18px;margin-bottom:20px;}
.hero h1{margin:0;font-size:42px;}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th,td{padding:12px;border-bottom:1px solid var(--line);font-size:14px;}
th{background:#f0f3f7;font-weight:700;}
tbody tr:nth-child(even){background:var(--zebra);}
tbody tr:hover{background:var(--hover);}
.score{font-weight:700;}
a.game-link{display:block;color:inherit;text-decoration:none;}
</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
</div>

<div class="page">
<div class="hero">
<h1 id="seasonTitle">MLB Season</h1>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Home</th>
<th>Score</th>
<th>Venue</th>
<th>Attendance</th>
</tr>
</thead>
<tbody id="gamesBody"></tbody>
</table>
</div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
const season=params.get("season");
document.getElementById("seasonTitle").textContent="MLB Season "+season;

Promise.all([
fetch("data/baseball/seasons/"+season+".json").then(r=>r.json()),
fetch("data/baseball/teams.json").then(r=>r.json()),
fetch("data/baseball/ballparks.csv").then(r=>r.text())
]).then(([seasonData,teamNames,ballparkCSV])=>{

const parkMap={};
ballparkCSV.trim().split("\n").forEach(l=>{
const p=l.split(",");
if(p.length>=2) parkMap[p[0].trim()]=p[1].trim();
});

const tbody=document.getElementById("gamesBody");
tbody.innerHTML="";

seasonData.forEach(game=>{

// ONLY use real stored game_id
const gameId = game.game_id;

const awayTeam=teamNames.find(t=>t.codes.includes(game.away_code));
const homeTeam=teamNames.find(t=>t.codes.includes(game.home_code));

const awayName=awayTeam?awayTeam.name:game.away_code;
const homeName=homeTeam?homeTeam.name:game.home_code;

const venueName=parkMap[game.venue]||game.venue||"";
const score=(game.away_score!==undefined&&game.home_score!==undefined)
?game.away_score+"-"+game.home_score:"";

const tr=document.createElement("tr");

if(gameId){
const link="baseball-game.html?game="+gameId;
tr.innerHTML=`
<td><a class="game-link" href="${link}">${game.date}</a></td>
<td>${awayName}</td>
<td>${homeName}</td>
<td class="score">${score}</td>
<td>${venueName}</td>
<td>${game.attendance?Number(game.attendance).toLocaleString():""}</td>
`;
} else {
tr.innerHTML=`
<td>${game.date}</td>
<td>${awayName}</td>
<td>${homeName}</td>
<td class="score">${score}</td>
<td>${venueName}</td>
<td>${game.attendance?Number(game.attendance).toLocaleString():""}</td>
`;
}

tbody.appendChild(tr);
});

});
</script>

</body>
</html>
