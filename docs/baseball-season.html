<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.summaryRow{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:16px;
margin-bottom:16px;
}

.summaryCard{
background:white;
padding:16px;
border-radius:12px;
font-weight:700;
}

/* FILTER */

.filterBar{
display:flex;
gap:10px;
margin-bottom:12px;
}

.filterBtn{
background:white;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
font-weight:700;
}

.filterBtn.active{
background:#002D72;
color:white;
}

/* TABS */

.tabs{
display:flex;
gap:10px;
margin-bottom:12px;
}

.tab{
background:white;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.tab.active{
background:#002D72;
color:white;
}

.section{display:none;}
.section.active{display:block;}

.tableCard{
background:white;
padding:16px;
border-radius:12px;
margin-bottom:16px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.leagueTitle{
font-size:22px;
font-weight:800;
margin-bottom:10px;
}

.divisionTitle{
font-size:18px;
font-weight:800;
margin:12px 0 6px;
color:#002D72;
}

.right{text-align:right;}

</style>
</head>
<body>

<div class="page">

<div class="hero">
<h1 id="title"></h1>
</div>

<div class="summaryRow">

<div class="summaryCard">
World Series Champion
<div id="wsWinner"></div>
</div>

<div class="summaryCard">
American League Champion
<div id="alWinner"></div>
</div>

<div class="summaryCard">
National League Champion
<div id="nlWinner"></div>
</div>

</div>

<div class="tabs">

<div class="tab active" onclick="showTab('games',this)">Games</div>
<div class="tab" onclick="showTab('standings',this)">Standings</div>
<div class="tab" onclick="showTab('playoffs',this)">Playoffs</div>

</div>

<!-- GAMES -->

<div id="games" class="section active">

<div class="filterBar">

<div class="filterBtn active" onclick="setFilter('all',this)">All Games</div>
<div class="filterBtn" onclick="setFilter('regular',this)">Regular Season</div>
<div class="filterBtn" onclick="setFilter('playoffs',this)">Playoffs</div>

</div>

<div class="tableCard">

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th class="right">Score</th>
<th>Home</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

</div>

<!-- STANDINGS -->

<div id="standings" class="section">
<div id="standingsContainer"></div>
</div>

<!-- PLAYOFFS -->

<div id="playoffs" class="section">

<div class="tableCard">

<table>
<thead>
<tr>
<th>Round</th>
<th>Winner</th>
</tr>
</thead>

<tbody id="playoffsBody"></tbody>

</table>

</div>

</div>

</div>

<script>

const STRUCTURE={

AL:{
East:["BAL","BOS","NYY","TB","TOR"],
Central:["CWS","CLE","DET","KC","MIN"],
West:["HOU","LAA","OAK","SEA","TEX"]
},

NL:{
East:["ATL","MIA","NYM","PHI","WSH"],
Central:["CHC","CIN","MIL","PIT","STL"],
West:["ARI","COL","LAD","SD","SF"]
}

};

function leagueOf(code){

for(const l in STRUCTURE)
for(const d in STRUCTURE[l])
if(STRUCTURE[l][d].includes(code))
return l;

}

/* TABS */

function showTab(name,el){

document.querySelectorAll(".section")
.forEach(s=>s.classList.remove("active"));

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document.getElementById(name).classList.add("active");

el.classList.add("active");

}

const year=new URLSearchParams(location.search).get("year");

title.textContent=year+" MLB Season";

/* GLOBAL */

let ALL_GAMES=[];
let PLAYOFF_START=0;
let FILTER="all";

/* WINNER */

function winner(g){

return g.away_score>g.home_score
?g.away_team:g.home_team;

}

/* DETECT PLAYOFF START */

function findPlayoffStart(games){

for(let i=games.length-1;i>=0;i--){

const g=games[i];

if(leagueOf(g.away_code)!=leagueOf(g.home_code))
return i;

}

return games.length;

}

/* CHAMPIONS */

function detectChampions(games){

const ws=winner(games[games.length-1]);

let al,nl;

games.slice(PLAYOFF_START).forEach(g=>{

if(leagueOf(g.away_code)=="AL" &&
leagueOf(g.home_code)=="AL")
al=winner(g);

if(leagueOf(g.away_code)=="NL" &&
leagueOf(g.home_code)=="NL")
nl=winner(g);

});

wsWinner.textContent=ws;
alWinner.textContent=al;
nlWinner.textContent=nl;

playoffsBody.innerHTML=`
<tr><td>American League Champion</td><td>${al}</td></tr>
<tr><td>National League Champion</td><td>${nl}</td></tr>
<tr><td>World Series Champion</td><td>${ws}</td></tr>
`;

}

/* FILTER */

function setFilter(type,el){

FILTER=type;

document.querySelectorAll(".filterBtn")
.forEach(b=>b.classList.remove("active"));

el.classList.add("active");

renderGames();

}

/* RENDER GAMES */

function renderGames(){

gamesBody.innerHTML="";

let games=ALL_GAMES;

if(FILTER=="regular")
games=ALL_GAMES.slice(0,PLAYOFF_START);

if(FILTER=="playoffs")
games=ALL_GAMES.slice(PLAYOFF_START);

games.forEach(g=>{

const id=
`${g.date}_${g.away_code}_${g.home_code}`;

gamesBody.innerHTML+=`
<tr>

<td>${g.date}</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.away_code}'">
${g.away_team}
</td>

<td class="click right"
onclick="location.href='baseball-game.html?id=${id}'">
${g.away_score}-${g.home_score}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.home_code}'">
${g.home_team}
</td>

<td>${g.venue||""}</td>

</tr>
`;

});

}

/* LOAD */

async function load(){

ALL_GAMES=await fetch(
`data/baseball/seasons/${year}.json`
).then(r=>r.json());

PLAYOFF_START=findPlayoffStart(ALL_GAMES);

detectChampions(ALL_GAMES);

renderGames();

}

load();

</script>

</body>
</html>
