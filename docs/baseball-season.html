<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

.hero h1{
margin:0;
font-size:42px;
}

.tableCard{
background:white;
padding:16px;
border-radius:14px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

tbody tr:hover{
background:#d6e6ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.right{
text-align:right;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">
<h1 id="title">Loading Season...</h1>
</div>

<div class="tableCard">

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th class="right">Score</th>
<th>Home</th>
<th>Venue</th>
<th class="right">Attendance</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

</div>

<script>

const params=new URLSearchParams(location.search);

const year=params.get("year");

document.getElementById("title").textContent=
`${year} MLB Season`;

let PARKS={};

/* LOAD BALLPARKS */

async function loadBallparks(){

const res=await fetch("data/baseball/ballparks.csv");

const text=await res.text();

const rows=text.split("\n");

const headers=rows[0].split(",");

const parkIndex=headers.indexOf("PARKID");
const nameIndex=headers.indexOf("NAME");

rows.slice(1).forEach(r=>{

const cols=r.split(",");

if(!cols[parkIndex])return;

PARKS[cols[parkIndex]]=
cols[nameIndex];

});

}

function parkName(code){

return PARKS[code]||code;

}

/* LOAD SEASON */

async function loadSeason(){

await loadBallparks();

const games=await fetch(
`data/baseball/seasons/${year}.json`
).then(r=>r.json());

const body=document.getElementById("gamesBody");

body.innerHTML="";

games.forEach(g=>{

const gameId=
`${g.date}_${g.away_code}_${g.home_code}`;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${g.date}</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.away_code}'">
${g.away_team}
</td>

<td class="right click"
onclick="location.href='baseball-game.html?id=${gameId}'">
${g.away_score} – ${g.home_score}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.home_code}'">
${g.home_team}
</td>

<td>${parkName(g.venue)}</td>

<td class="right">
${g.attendance?.toLocaleString()||""}
</td>

`;

body.appendChild(tr);

});

}

loadSeason();

</script>

</body>
</html>
