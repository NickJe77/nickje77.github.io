<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:#fff;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

th{
  background:#002D72;
  color:#fff;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid #eee;
}

tbody tr:nth-child(even){
  background:#fafafa;
}

a.game-link{
  color:#0056d6;
  font-weight:700;
  text-decoration:none;
}
a.game-link:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="mlb.html">MLB</a>
</div>

<div class="page">
  <div class="hero">
    <h1 id="title">MLB Season</h1>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Away</th>
        <th>Home</th>
        <th>Score</th>
        <th>Game</th>
      </tr>
    </thead>
    <tbody id="gamesBody"></tbody>
  </table>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const season = params.get("season");

if (!season) {
  document.getElementById("gamesBody").innerHTML =
    "<tr><td colspan='5'>Season missing from URL</td></tr>";
  throw new Error("Season missing");
}

document.getElementById("title").textContent = "MLB Season " + season;

fetch(`docs/data/baseball/seasons/${season}.json`)
  .then(res => res.json())
  .then(data => {

    const tbody = document.getElementById("gamesBody");
    tbody.innerHTML = "";

    data.forEach(game => {

      // THIS IS THE ONLY FIELD WE TRUST
      const gameId = game.game_id;

      if (!gameId) {
        console.error("Missing game_id in season file:", game);
        return;
      }

      const link = `baseball-game.html?season=${season}&game=${gameId}`;

      const score =
        (game.away_score !== undefined && game.home_score !== undefined)
        ? `${game.away_score}-${game.home_score}`
        : "";

      tbody.innerHTML += `
        <tr>
          <td>${game.date || ""}</td>
          <td>${game.away_code || ""}</td>
          <td>${game.home_code || ""}</td>
          <td>${score}</td>
          <td><a class="game-link" href="${link}">${gameId}</a></td>
        </tr>
      `;
    });

  })
  .catch(err => {
    document.getElementById("gamesBody").innerHTML =
      "<tr><td colspan='5'>Could not load season file</td></tr>";
  });

</script>

</body>
</html>
