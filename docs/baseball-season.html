<!DOCTYPE html>
<html>
<head>
<script src="/js/analytics.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLB Season | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family:Inter,system-ui,sans-serif;
    margin:0;
    background:#f4f6f8;
}

.page{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.hero{
    background:linear-gradient(135deg,#0b2b66,#0056d6);
    color:white;
    padding:40px;
    border-radius:24px;
    margin-bottom:25px;
}

.hero h1{
    margin:0;
    font-size:54px;
}

.table-wrap{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0056d6;
    color:white;
    padding:14px;
    text-align:left;
    font-size:14px;
}

td{
    padding:14px;
    border-bottom:1px solid #e7edf5;
    font-size:14px;
}

tr:nth-child(even){
    background:#f7fbff;
}

a{
    color:#0056d6;
    text-decoration:none;
    font-weight:700;
}

a:hover{
    text-decoration:underline;
}

.score{
    font-weight:700;
}

@media(max-width:900px){

.hero h1{
    font-size:34px;
}

th,td{
    padding:10px;
    font-size:12px;
}

}

</style>
</head>

<body>

<div class="page">

    <div class="hero">
        <h1 id="season-title">MLB Season</h1>
    </div>

    <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Away</th>
                    <th>Home</th>
                    <th>Score</th>
                    <th>Venue</th>
                </tr>
            </thead>

            <tbody id="games-body"></tbody>

        </table>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const season = params.get("season") || "2026";

document.getElementById("season-title").innerText =
    `MLB ${season} Season`;

async function loadSeason(){

    try{

        const res = await fetch(
            `/data/baseball/seasons/${season}.json`
        );

        const games = await res.json();

        renderGames(games);

    }catch(err){

        console.error(err);

    }

}

function renderGames(games){

    const tbody = document.getElementById("games-body");

    tbody.innerHTML = "";

    games.forEach(game=>{

        const tr = document.createElement("tr");

        const gameFile = game.game_file;

        tr.innerHTML = `
            <td>${game.date || ""}</td>

            <td>
                <a href="baseball-game.html?season=${season}&game=${encodeURIComponent(gameFile)}">
                    ${game.away_team || ""}
                </a>
            </td>

            <td>
                ${game.home_team || ""}
            </td>

            <td class="score">
                ${(game.away_score ?? 0)}-${(game.home_score ?? 0)}
            </td>

            <td>
                ${game.venue || ""}
            </td>
        `;

        tbody.appendChild(tr);

    });

}

loadSeason();

</script>

</body>
</html>
