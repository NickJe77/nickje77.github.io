<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLB Season | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Inter,system-ui,sans-serif;
    background:#f4f6f8;
}

/* ---------------- NAV ---------------- */

.nav{
    background:white;
    border-bottom:1px solid #dfe5ec;
    padding:16px 10px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.nav a{
    color:#0056d6;
    text-decoration:none;
    font-weight:700;
    margin:0 18px;
    font-size:15px;
}

/* ---------------- PAGE ---------------- */

.page{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

/* ---------------- HERO ---------------- */

.hero{
    background:linear-gradient(135deg,#002f87,#d90429);
    border-radius:30px;
    padding:42px;
    color:white;
    margin-bottom:25px;
}

.hero h1{
    margin:0;
    font-size:58px;
    line-height:1;
}

/* ---------------- YEAR TABS ---------------- */

.year-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:22px;
}

.year-tab{
    background:white;
    padding:8px 14px;
    border-radius:12px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    border:1px solid #dce3eb;
}

.year-tab.active{
    background:#0056d6;
    color:white;
}

/* ---------------- FILTERS ---------------- */

.filters{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
    align-items:center;
}

.filters input,
.filters select{
    padding:8px 12px;
    border:1px solid #dce3eb;
    border-radius:10px;
    font-size:13px;
    font-family:inherit;
    background:white;
    outline:none;
}

.filters input{
    width:200px;
}

.filter-count{
    font-size:12px;
    color:#666;
    margin-left:auto;
}

/* ---------------- TABLE ---------------- */

.table-wrap{
    background:white;
    border-radius:22px;
    overflow-x:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
}

th{
    background:#0056d6;
    color:white;
    padding:12px 14px;
    text-align:left;
    font-size:13px;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
}

th:hover{
    background:#0047b8;
}

th .sort-arrow{
    margin-left:4px;
    opacity:0.6;
}

td{
    padding:12px 14px;
    border-bottom:1px solid #edf2f7;
    font-size:13px;
}

tr:nth-child(even){
    background:#f7fbff;
}

tbody tr{
    cursor:pointer;
    transition:.15s;
}

tbody tr:hover{
    background:#eaf2ff;
}

.score{
    font-weight:700;
    white-space:nowrap;
}

.team-cell{
    display:flex;
    flex-direction:column;
}

.team-name{
    font-weight:600;
}

.team-code{
    font-size:11px;
    color:#888;
}

.status-badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:2px 6px;
    border-radius:6px;
    background:#eef2ff;
    color:#4361ee;
    margin-left:6px;
    vertical-align:middle;
}

.status-badge.final{
    background:#e8f5e9;
    color:#2e7d32;
}

.status-badge.live{
    background:#fff3e0;
    color:#e65100;
}

.no-results{
    text-align:center;
    padding:40px;
    color:#999;
    font-size:14px;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:900px){

.page{
    padding:10px;
}

.hero{
    padding:22px;
    border-radius:22px;
    margin-bottom:18px;
}

.hero h1{
    font-size:34px;
}

.nav{
    padding:12px 6px;
}

.nav a{
    margin:0 8px;
    font-size:12px;
}

.year-tabs{
    gap:6px;
    margin-bottom:16px;
}

.year-tab{
    font-size:10px;
    padding:6px 8px;
    border-radius:10px;
}

th{
    font-size:10px;
    padding:8px 6px;
}

td{
    font-size:10px;
    padding:8px 6px;
}

.filters input{
    width:140px;
}

}

</style>
</head>
