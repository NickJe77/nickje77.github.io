<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.navbar a:hover{
text-decoration:underline;
}

/* PAGE */

.page{
max-width:1200px;
margin:auto;
padding:20px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:16px;
}

/* SUMMARY */

.summaryRow{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:16px;
margin-bottom:16px;
}

.summaryCard{
background:white;
padding:16px;
border-radius:12px;
font-weight:700;
}

/* FILTER */

.filterBar{
display:flex;
gap:10px;
margin-bottom:12px;
}

.filterBtn{
background:white;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
font-weight:700;
}

.filterBtn.active{
background:#002D72;
color:white;
}

/* TABS */

.tabs{
display:flex;
gap:10px;
margin-bottom:12px;
}

.tab{
background:white;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:700;
}

.tab.active{
background:#002D72;
color:white;
}

.section{display:none;}
.section.active{display:block;}

.tableCard{
background:white;
padding:16px;
border-radius:12px;
margin-bottom:16px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

th{
background:#002D72;
color:white;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.right{text-align:right;}

</style>
</head>
<body>

<!-- NAVBAR -->

<div class="navbar">

<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
<a href="baseball-players.html">Players</a>

</div>

<div class="page">

<div class="hero">
<h1 id="title">Loading...</h1>
</div>

<div class="summaryRow">

<div class="summaryCard">
World Series Champion
<div id="wsWinner"></div>
</div>

<div class="summaryCard">
American League Champion
<div id="alWinner"></div>
</div>

<div class="summaryCard">
National League Champion
<div id="nlWinner"></div>
</div>

</div>

<div class="tabs">

<div class="tab active" onclick="showTab('games',this)">Games</div>
<div class="tab" onclick="showTab('standings',this)">Standings</div>
<div class="tab" onclick="showTab('playoffs',this)">Playoffs</div>

</div>

<div id="games" class="section active">

<div class="filterBar">

<div class="filterBtn active" onclick="setFilter('all',this)">All Games</div>
<div class="filterBtn" onclick="setFilter('regular',this)">Regular Season</div>
<div class="filterBtn" onclick="setFilter('playoffs',this)">Playoffs</div>

</div>

<div class="tableCard">

<table>

<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th class="right">Score</th>
<th>Home</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

</div>

<div id="standings" class="section">

<div id="standingsContainer"></div>

</div>

<div id="playoffs" class="section">

<div class="tableCard">

<table>
<thead>
<tr>
<th>Round</th>
<th>Winner</th>
</tr>
</thead>

<tbody id="playoffsBody"></tbody>

</table>

</div>

</div>

</div>

<script>

/* TEAM LEAGUES */

const AL=["BAL","BOS","NYY","TB","TOR","CWS","CLE","DET","KC","MIN","HOU","LAA","OAK","SEA","TEX"];

const NL=["ATL","MIA","NYM","PHI","WSH","CHC","CIN","MIL","PIT","STL","ARI","COL","LAD","SD","SF"];

function league(code){

if(AL.includes(code)) return "AL";
if(NL.includes(code)) return "NL";

}

/* GLOBAL */

const year=new URLSearchParams(location.search).get("year");

title.textContent=year+" MLB Season";

let ALL_GAMES=[];
let PLAYOFF_START=0;
let FILTER="all";

/* FIND PLAYOFF START */

function findPlayoffs(games){

for(let i=games.length-1;i>=0;i--){

const g=games[i];

if(league(g.away_code)!=league(g.home_code))
return i;

}

return games.length;

}

/* CHAMPIONS */

function detectChampions(games){

const wsGame=games[games.length-1];

const wsWinnerTeam =
wsGame.away_score>wsGame.home_score
?wsGame.away_team
:wsGame.home_team;

wsWinner.textContent=wsWinnerTeam;

/* Find ALCS winner */

for(let i=PLAYOFF_START;i<games.length;i++){

const g=games[i];

if(league(g.away_code)=="AL" &&
league(g.home_code)=="AL"){

alWinner.textContent =
g.away_score>g.home_score
?g.away_team
:g.home_team;

}

}

/* Find NLCS winner */

for(let i=PLAYOFF_START;i<games.length;i++){

const g=games[i];

if(league(g.away_code)=="NL" &&
league(g.home_code)=="NL"){

nlWinner.textContent =
g.away_score>g.home_score
?g.away_team
:g.home_team;

}

}

}

/* FILTER */

function setFilter(type,el){

FILTER=type;

document.querySelectorAll(".filterBtn")
.forEach(b=>b.classList.remove("active"));

el.classList.add("active");

renderGames();

}

/* RENDER GAMES FAST */

function renderGames(){

gamesBody.innerHTML="";

let games=ALL_GAMES;

if(FILTER=="regular")
games=ALL_GAMES.slice(0,PLAYOFF_START);

if(FILTER=="playoffs")
games=ALL_GAMES.slice(PLAYOFF_START);

const frag=document.createDocumentFragment();

games.forEach(g=>{

const tr=document.createElement("tr");

const id=
`${g.date}_${g.away_code}_${g.home_code}`;

tr.innerHTML=`

<td>${g.date}</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.away_code}'">
${g.away_team}
</td>

<td class="click right"
onclick="location.href='baseball-game.html?id=${id}'">
${g.away_score}-${g.home_score}
</td>

<td class="click"
onclick="location.href='baseball-team.html?team=${g.home_code}'">
${g.home_team}
</td>

<td>${g.venue||""}</td>

`;

frag.appendChild(tr);

});

gamesBody.appendChild(frag);

}

/* LOAD */

async function load(){

ALL_GAMES=await fetch(
`data/baseball/seasons/${year}.json`
).then(r=>r.json());

PLAYOFF_START=findPlayoffs(ALL_GAMES);

detectChampions(ALL_GAMES);

renderGames();

}

load();

</script>

</body>
</html>
