<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1200px;
margin:0 auto;
padding:22px 18px;
}

.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:32px;
border-radius:22px;
margin-bottom:14px;
}

.hero h1{
margin:0;
font-size:40px;
}

.tabs{
display:flex;
gap:10px;
margin:12px 0 14px;
}

.tab{
background:#fff;
border:1px solid #ddd;
padding:10px 14px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.tab.active{
background:#eaf3ff;
border-color:#bcd6ff;
}

.card{
background:#fff;
border-radius:16px;
padding:14px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

th,td{
padding:10px 10px;
text-align:left;
border-bottom:1px solid #f1f1f1;
}

th{
background:#002D72;
color:#fff;
position:sticky;
top:0;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

tbody tr:hover{
background:#d6e6ff;
}

.click{
color:#0056d6;
font-weight:700;
cursor:pointer;
}

.small{
opacity:0.8;
font-size:13px;
margin-top:6px;
}

</style>
</head>
<body>

<div class="page">

<div class="hero">
<h1 id="title">Season</h1>
<div class="small">
Click score to open game page • Click team to open team page
</div>
</div>

<div class="tabs">
<div id="tabGames" class="tab active">Games</div>
<div id="tabStandings" class="tab">Standings</div>
</div>

<div id="panelGames" class="card">

<table>

<thead>
<tr>
<th style="width:110px;">Date</th>
<th>Away</th>
<th style="width:110px;">Score</th>
<th>Home</th>
<th style="width:140px;">Venue</th>
<th style="width:120px;">Attendance</th>
</tr>
</thead>

<tbody id="gamesBody"></tbody>

</table>

</div>

<div id="panelStandings" class="card" style="display:none;">

<table>

<thead>
<tr>
<th>Team</th>
<th style="width:70px;">W</th>
<th style="width:70px;">L</th>
<th style="width:90px;">PCT</th>
<th style="width:90px;">RS</th>
<th style="width:90px;">RA</th>
<th style="width:90px;">DIFF</th>
</tr>
</thead>

<tbody id="standingsBody"></tbody>

</table>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const year = params.get("year");

if(!year){
alert("Missing season year");
throw new Error("Missing year");
}

document.getElementById("title").textContent = year + " MLB Season";

const tabGames = document.getElementById("tabGames");
const tabStandings = document.getElementById("tabStandings");

const panelGames = document.getElementById("panelGames");
const panelStandings = document.getElementById("panelStandings");

tabGames.onclick = ()=>{
tabGames.classList.add("active");
tabStandings.classList.remove("active");
panelGames.style.display="block";
panelStandings.style.display="none";
};

tabStandings.onclick = ()=>{
tabStandings.classList.add("active");
tabGames.classList.remove("active");
panelStandings.style.display="block";
panelGames.style.display="none";
};

function fmt(n){

if(n===null || n===undefined) return "";

return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");

}

/* LOAD GAMES */

async function loadGames(){

const res =
await fetch(`data/baseball/seasons/${year}.json?cache=${Date.now()}`);

const games = await res.json();

const tbody = document.getElementById("gamesBody");

tbody.innerHTML="";

games.forEach(game=>{

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${game.date}</td>

<td>
<span class="click team" data-team="${game.away_code}">
${game.away_team}
</span>
</td>

<td>
<span class="click game" data-id="${game.id}">
${game.away_score} - ${game.home_score}
</span>
</td>

<td>
<span class="click team" data-team="${game.home_code}">
${game.home_team}
</span>
</td>

<td>${game.venue || ""}</td>

<td>${fmt(game.attendance)}</td>

`;

/* TEAM LINKS */

tr.querySelectorAll(".team").forEach(el=>{

el.onclick=(e)=>{

e.stopPropagation();

window.location.href=
`baseball-team.html?team=${el.dataset.team}`;

};

});

/* GAME LINK — FIXED */

tr.querySelector(".game").onclick=(e)=>{

e.stopPropagation();

window.location.href=
`baseball-game.html?id=${game.id}`;

};

tbody.appendChild(tr);

});

}

/* LOAD STANDINGS */

async function loadStandings(){

const res =
await fetch(`data/baseball/standings/${year}.json?cache=${Date.now()}`);

const rows = await res.json();

const tbody =
document.getElementById("standingsBody");

tbody.innerHTML="";

rows.forEach(row=>{

const tr=document.createElement("tr");

tr.innerHTML=`

<td>
<span class="click"
onclick="location.href='baseball-team.html?team=${row.team_code}'">
${row.team_name}
</span>
</td>

<td>${row.W}</td>
<td>${row.L}</td>
<td>${row.PCT}</td>
<td>${row.RS}</td>
<td>${row.RA}</td>
<td>${row.DIFF}</td>

`;

tbody.appendChild(tr);

});

}

/* INIT */

loadGames();
loadStandings();

</script>

</body>
</html>
