<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
  font-family:Inter,system-ui;
  margin:0;
  background:#f4f6f8;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#002D72,#C8102E);
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,td{
  padding:10px;
  text-align:left;
}

th{
  background:#002D72;
  color:white;
}

tr:nth-child(even){
  background:#eaf3ff;
}

tr{
  cursor:pointer;
}

tr:hover{
  background:#d6e6ff;
}

</style>
</head>

<body>

<div class="page">

<div class="hero">
<h1 id="title">Season</h1>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th></th>
<th>Home</th>
<th>Venue</th>
</tr>
</thead>

<tbody id="games"></tbody>

</table>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const year = params.get("year");

document.getElementById("title").textContent = year + " Season";

async function loadSeason(){

  const res = await fetch(`data/baseball/seasons/${year}.json`);
  const games = await res.json();

  const tbody = document.getElementById("games");

  games.forEach((game,i)=>{

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${game.date}</td>
      <td>${game.away_team}</td>
      <td>${game.away_score} - ${game.home_score}</td>
      <td>${game.home_team}</td>
      <td>${game.venue}</td>
    `;

    tr.onclick=()=>{
      window.location=`baseball-game.html?year=${year}&game=${i}`;
    }

    tbody.appendChild(tr);

  });

}

loadSeason();

</script>

</body>
</html>
