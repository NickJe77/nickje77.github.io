<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Season | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}
.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:700;
}
.navbar a{
text-decoration:none;
color:#0056d6;
}
.page{
max-width:1200px;
margin:auto;
padding:20px;
}
.hero{
background:linear-gradient(90deg,#002D72,#C8102E);
color:#fff;
padding:30px;
border-radius:20px;
margin-bottom:14px;
}
table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:16px;
overflow:hidden;
}
th{
background:#002D72;
color:#fff;
padding:12px;
text-align:left;
}
td{
padding:10px;
border-bottom:1px solid #eee;
}
tr:nth-child(even){
background:#f0f6ff;
}
tr:hover{
background:#e3efff;
cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="baseball.html">Baseball</a>
<a href="baseball-seasons.html">Seasons</a>
</div>

<div class="page">

<div class="hero">
<h1 id="title">Season</h1>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Away</th>
<th>Home</th>
<th>Score</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

</div>

<script>

let TEAM_MAP = {};
let GAME_COUNTER = {};

function teamName(code){
return TEAM_MAP[code] || code;
}

function buildGameId(game){

const date = game.date.replaceAll("-","");
const key = game.home_code + "_" + date;

if(!GAME_COUNTER[key]) GAME_COUNTER[key] = 0;

const num = GAME_COUNTER[key]++;

return game.home_code + date + num;

}

async function loadTeams(){

const res = await fetch("data/baseball/teams.json");
const franchises = await res.json();

// Map every historical code to its franchise name
franchises.forEach(franchise=>{
  franchise.codes.forEach(code=>{
    TEAM_MAP[code] = franchise.name;
  });
});

}

async function loadSeason(){

const params = new URLSearchParams(window.location.search);
const year = params.get("year");

if(!year){
document.getElementById("title").textContent = "Season Not Found";
return;
}

document.getElementById("title").textContent = year + " Season";

await loadTeams();

const res = await fetch("data/baseball/seasons/" + year + ".json");
const games = await res.json();

// Sort chronologically
games.sort((a,b)=> new Date(a.date) - new Date(b.date));

renderGames(games);

}

function renderGames(games){

const tbody=document.getElementById("tbody");
tbody.innerHTML="";

GAME_COUNTER = {}; // reset counter

games.forEach(game=>{

const gameId = buildGameId(game);

const tr=document.createElement("tr");

tr.onclick=()=>{
window.location.href="baseball-game.html?game="+gameId;
};

tr.innerHTML=`
<td>${game.date}</td>
<td>${teamName(game.away_code)}</td>
<td>${teamName(game.home_code)}</td>
<td>${game.away_score ?? ""} - ${game.home_score ?? ""}</td>
`;

tbody.appendChild(tr);

});

}

loadSeason();

</script>

</body>
</html>
