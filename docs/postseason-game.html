<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baseball Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#0b1220;
  --line:#e6e8ee;
  --soft:#f0f6ff;
}
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:var(--bg);
  color:var(--text);
}
.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:700;
}
.navbar a{
  text-decoration:none;
  color:#0056d6;
}
.page{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
.hero{
  background:linear-gradient(90deg,var(--blue),var(--red));
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:20px;
}
.hero h1{
  margin:0;
  font-size:36px;
}
.scoreline{
  font-size:22px;
  font-weight:700;
  margin-top:10px;
}
.meta-line{
  margin-top:6px;
}
.section{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:20px;
}
.section h2{
  margin:0 0 12px 0;
}
table{
  width:100%;
  border-collapse:collapse;
}
th{
  background:var(--blue);
  color:white;
  padding:10px;
  text-align:left;
}
td{
  padding:8px;
  border-bottom:1px solid #eee;
}
tr:nth-child(even){
  background:var(--soft);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
@media(max-width:900px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html">Postseason</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="title">Loading...</h1>
  <div id="scoreline" class="scoreline"></div>
  <div id="subtitle" class="meta-line"></div>
  <div id="venueLine" class="meta-line"></div>
  <div id="crowdLine" class="meta-line"></div>
</div>

<div class="grid">
  <div class="section">
    <h2>Away Batting</h2>
    <div id="awayBatting"></div>
  </div>
  <div class="section">
    <h2>Home Batting</h2>
    <div id="homeBatting"></div>
  </div>
  <div class="section">
    <h2>Away Pitching</h2>
    <div id="awayPitching"></div>
  </div>
  <div class="section">
    <h2>Home Pitching</h2>
    <div id="homePitching"></div>
  </div>
</div>

</div>

<script>
function param(n){return new URLSearchParams(window.location.search).get(n)}
async function fetchJSON(url){const r=await fetch(url);if(!r.ok)return null;return await r.json()}
async function fetchCSV(url){const r=await fetch(url);if(!r.ok)return null;const t=await r.text();return t.split("\n").map(l=>l.split(","))}

function renderTable(container,data){
  if(!data || data.length===0){
    document.getElementById(container).innerHTML="No detailed data available.";
    return;
  }
  const keys=Object.keys(data[0]).filter(k=>k!=="player_id");
  let html="<table><thead><tr><th>Player</th>";
  keys.forEach(k=>html+=`<th>${k}</th>`);
  html+="</tr></thead><tbody>";
  data.forEach(p=>{
    html+=`<tr><td>${p.player || p.player_id || ""}</td>`;
    keys.forEach(k=>html+=`<td>${p[k]??""}</td>`);
    html+="</tr>";
  });
  html+="</tbody></table>";
  document.getElementById(container).innerHTML=html;
}

(async function(){

  const gameId = param("game");
  if(!gameId){
    document.getElementById("title").innerText="Game Not Found";
    return;
  }

  const game = await fetchJSON(`data/baseball/postseason-games/${gameId}.json`);
  if(!game){
    document.getElementById("title").innerText="Game Not Found";
    return;
  }

  const teams = await fetchJSON("data/baseball/team-names.json");
  const parks = await fetchCSV("data/baseball/ballparks.csv");

  const teamMap={};
  if(teams){teams.forEach(t=>teamMap[t.code]=t.name);}

  const parkMap={};
  if(parks){parks.slice(1).forEach(r=>parkMap[r[0]]=r[1]);}

  const home=game.home_code||"";
  const away=game.away_code||"";

  const homeName=teamMap[home]||home;
  const awayName=teamMap[away]||away;

  const date=game.date;
  const homeScore=game.home_score??game.home_runs??"";
  const awayScore=game.away_score??game.away_runs??"";
  const venueName=parkMap[game.venue]||"";
  const attendance=game.attendance;

  document.getElementById("title").innerText=`${awayName} @ ${homeName}`;
  document.getElementById("scoreline").innerText=`${awayName} ${awayScore} – ${homeName} ${homeScore}`;
  document.getElementById("subtitle").innerText=date||"";
  document.getElementById("venueLine").innerText=venueName?`Venue: ${venueName}`:"";
  document.getElementById("crowdLine").innerText=attendance?`Attendance: ${Number(attendance).toLocaleString()}`:"";

  renderTable("awayBatting",game.batters_away||game.away_batting||[]);
  renderTable("homeBatting",game.batters_home||game.home_batting||[]);
  renderTable("awayPitching",game.pitchers_away||game.away_pitching||[]);
  renderTable("homePitching",game.pitchers_home||game.home_pitching||[]);

})();
</script>

</body>
</html>
