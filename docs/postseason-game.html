<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Postseason Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --blue:#002D72;
  --red:#C8102E;
  --bg:#f4f6f8;
  --line:#e6e8ee;
}
body{font-family:Inter,system-ui,Arial;margin:0;background:var(--bg);}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:#fff;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:20px;}
.hero{background:linear-gradient(90deg,var(--blue),var(--red));color:#fff;padding:30px;border-radius:20px;margin-bottom:20px;}
.hero h1{margin:0;font-size:36px;}
.scoreline{font-size:22px;font-weight:700;margin-top:10px;}
.meta-line{margin-top:6px;}
.section{background:#fff;padding:18px;border-radius:16px;border:1px solid var(--line);margin-bottom:20px;}
.section h2{margin:0 0 12px 0;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}
table{width:100%;border-collapse:collapse;}
th{background:var(--blue);color:white;padding:10px;text-align:left;}
td{padding:8px;border-bottom:1px solid #eee;}
tr:nth-child(even){background:#f0f6ff;}
.player-link{color:#0056d6;text-decoration:none;font-weight:600;}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="baseball.html">Baseball</a>
  <a href="baseball-postseason.html">Postseason</a>
</div>

<div class="page">

<div class="hero">
  <h1 id="title">Loading...</h1>
  <div id="scoreline" class="scoreline"></div>
  <div id="subtitle" class="meta-line"></div>
  <div id="venueLine" class="meta-line"></div>
</div>

<div class="section">
  <h2>Game Details</h2>
  <div id="details"></div>
</div>

<div class="grid">
  <div class="section">
    <h2 id="awayBatTitle">Away Batting</h2>
    <div id="awayBatting"></div>
  </div>
  <div class="section">
    <h2 id="homeBatTitle">Home Batting</h2>
    <div id="homeBatting"></div>
  </div>
</div>

<div class="grid">
  <div class="section">
    <h2 id="awayPitTitle">Away Pitching</h2>
    <div id="awayPitching"></div>
  </div>
  <div class="section">
    <h2 id="homePitTitle">Home Pitching</h2>
    <div id="homePitching"></div>
  </div>
</div>

</div>

<script>
function param(n){return new URLSearchParams(window.location.search).get(n)}
async function fetchJSON(u){const r=await fetch(u);if(!r.ok)return null;return await r.json()}
async function fetchCSV(u){const r=await fetch(u);if(!r.ok)return null;const t=await r.text();return t.split("\n").map(l=>l.split(","))}

function buildTable(players,nameMap){
  if(!players.length) return "No data available.";
  const statKeys=new Set();
  players.forEach(p=>Object.keys(p.stats).forEach(k=>statKeys.add(k)));
  const keys=[...statKeys];

  let html="<table><thead><tr><th>Player</th>";
  keys.forEach(k=>html+=`<th>${k}</th>`);
  html+="</tr></thead><tbody>";

  players.forEach(p=>{
    const name=nameMap[p.id]||p.id;
    const slug=name.toLowerCase()
      .replace(/\./g,"").replace(/'/g,"").replace(/,/g,"")
      .replace(/ jr$/,"-jr").replace(/ sr$/,"-sr")
      .replace(/ /g,"-");
    html+=`<tr><td><a class="player-link" href="baseball-player.html?player=${encodeURIComponent(slug)}">${name}</a></td>`;
    keys.forEach(k=>html+=`<td>${p.stats[k]??""}</td>`);
    html+="</tr>";
  });

  html+="</tbody></table>";
  return html;
}

(async function(){

const gameId=param("game");
if(!gameId){document.getElementById("title").innerText="Game Not Found";return;}

const box=await fetchJSON(`/data/baseball/postseason-games/${gameId}.json`);
const metaAll=await fetchJSON(`/data/baseball/postseason_meta.json`);
if(!box||!metaAll){document.getElementById("title").innerText="Game Not Found";return;}

const meta=metaAll.find(g=>g.game_id===gameId);
if(!meta){document.getElementById("title").innerText="Game Not Found";return;}

const [playersList, teams, parks, bioResp] = await Promise.all([
  fetchJSON(`/data/baseball/players.json`),
  fetchJSON(`/data/baseball/teams.json`),
  fetchCSV(`/data/baseball/ballparks.csv`),
  fetch(`/data/baseball/biofile0.csv`).then(r=>r.ok?r.text():null)
]);

const nameMap={};

// From players.json (slug-based)
playersList?.forEach(p=>nameMap[p.player_id]=p.name);

// From biofile0.csv (Retrosheet ID-based)
if(bioResp){
  bioResp.split('\n').slice(1).forEach(line=>{
    const cols=line.split(',');
    if(cols[0]&&cols[1]&&cols[2]){
      nameMap[cols[0].trim()]=`${cols[2].trim()} ${cols[1].trim()}`;
    }
  });
}

const teamMap={};
teams?.forEach(t=>{
  t.codes?.forEach(c=>{ teamMap[c]=t.name; });
});

const parkMap={};
parks?.slice(1).forEach(r=>{ if(r[0]) parkMap[r[0]]=r[1]; });

const homeName=teamMap[meta.home]||meta.home;
const awayName=teamMap[meta.away]||meta.away;

document.getElementById("title").innerText=`${awayName} @ ${homeName}`;
document.getElementById("scoreline").innerText=`${awayName} ${meta.away_score} – ${homeName} ${meta.home_score}`;
document.getElementById("subtitle").innerText=meta.date||"";
document.getElementById("venueLine").innerText=meta.venue&&parkMap[meta.venue]?`Venue: ${parkMap[meta.venue]}`:"";
document.getElementById("details").innerHTML=`Attendance: ${meta.attendance?meta.attendance.toLocaleString():"N/A"}`;

const battingItems=Object.entries(box.batting||{});
const midB=Math.floor(battingItems.length/2);
const awayBat=battingItems.slice(0,midB).map(([id,stats])=>({id,stats}));
const homeBat=battingItems.slice(midB).map(([id,stats])=>({id,stats}));

const pitchingItems=Object.entries(box.pitching||{});
const midP=Math.floor(pitchingItems.length/2);
const awayPit=pitchingItems.slice(0,midP).map(([id,stats])=>({id,stats}));
const homePit=pitchingItems.slice(midP).map(([id,stats])=>({id,stats}));

document.getElementById("awayBatTitle").innerText=`${awayName} Batting`;
document.getElementById("homeBatTitle").innerText=`${homeName} Batting`;
document.getElementById("awayPitTitle").innerText=`${awayName} Pitching`;
document.getElementById("homePitTitle").innerText=`${homeName} Pitching`;

document.getElementById("awayBatting").innerHTML=buildTable(awayBat,nameMap);
document.getElementById("homeBatting").innerHTML=buildTable(homeBat,nameMap);
document.getElementById("awayPitching").innerHTML=buildTable(awayPit,nameMap);
document.getElementById("homePitching").innerHTML=buildTable(homePit,nameMap);

})();
</script>

</body>
</html>
