<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>NHL Franchise History | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8J9ZPKDDH"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N8J9ZPKDDH');</script>
  <link rel="stylesheet" href="style.css">
  <style>
  body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f4f6f8;}
  .navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;position:sticky;top:0;z-index:100;}
  .navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
  .navbar a:hover{text-decoration:underline;}
  .page-wrap{max-width:1200px;margin:0 auto;padding:0 20px 60px;}
  .hero{background:linear-gradient(135deg,#041E42,#0072CE);color:#fff;padding:36px;border-radius:22px;margin:24px 0 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .hero h1{margin:0;font-size:36px;font-weight:900;flex:1;}
  .hero select{padding:12px 16px;font-size:16px;border-radius:12px;border:none;font-weight:700;min-width:260px;cursor:pointer;}
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-bottom:20px;}
  .stat-box{background:white;border-radius:14px;padding:16px 12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .stat-box b{display:block;font-size:11px;color:#0056d6;text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:6px;}
  .stat-num{font-size:30px;font-weight:900;line-height:1;color:#111;}
  .table-wrap{overflow-x:auto;border-radius:14px;border:1px solid #dce3ec;}
  table{width:100%;border-collapse:collapse;background:white;}
  th{background:#041E42;color:white;padding:12px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;text-align:left;cursor:pointer;user-select:none;white-space:nowrap;}
  th:hover{background:#0a3060;}
  td{padding:11px 10px;border-bottom:1px solid #edf2f7;font-size:14px;font-weight:500;}
  tr:nth-child(even) td{background:#f4f8fd;}
  tr:hover td{background:#e8f2ff;}
  .season-link{color:#0056d6;font-weight:700;text-decoration:none;}
  .season-link:hover{text-decoration:underline;}
  .loading{text-align:center;padding:40px;font-size:18px;font-weight:700;color:#555;}
  .progress-wrap{background:#e2e8f0;border-radius:99px;height:8px;max-width:300px;margin:12px auto 0;}
  .progress-bar{background:#041E42;height:8px;border-radius:99px;transition:width .15s;}
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="nba.html">NBA</a>
  <a href="nhl.html">NHL</a>
</div>

<div class="page-wrap">
  <div class="hero">
    <h1 id="heroTitle">NHL Franchise History</h1>
    <select id="teamSelect"><option value="">Select Franchise...</option></select>
  </div>

  <div class="summary-grid" id="summaryGrid" style="display:none"></div>

  <div id="loadingMsg" class="loading" style="display:none">
    Loading season data...
    <div class="progress-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
  </div>

  <div class="table-wrap" id="tableWrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('season')">Season</th>
          <th onclick="sortBy('gp')">GP</th>
          <th onclick="sortBy('w')">W</th>
          <th onclick="sortBy('l')">L</th>
          <th onclick="sortBy('pct')">PCT</th>
          <th onclick="sortBy('pts')">PTS</th>
          <th onclick="sortBy('gf')">GF</th>
          <th onclick="sortBy('ga')">GA</th>
          <th onclick="sortBy('diff')">DIFF</th>
          <th onclick="sortBy('playoff')">Playoffs</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
var TEAM_NAMES = {
  "ANA":"Anaheim Ducks","ARI":"Arizona Coyotes","ATL":"Atlanta Thrashers",
  "BOS":"Boston Bruins","BUF":"Buffalo Sabres","CGY":"Calgary Flames",
  "CAR":"Carolina Hurricanes","CHI":"Chicago Blackhawks","COL":"Colorado Avalanche",
  "CBJ":"Columbus Blue Jackets","DAL":"Dallas Stars","DET":"Detroit Red Wings",
  "EDM":"Edmonton Oilers","FLA":"Florida Panthers","LAK":"Los Angeles Kings",
  "MIN":"Minnesota Wild","MTL":"Montreal Canadiens","NSH":"Nashville Predators",
  "NJD":"New Jersey Devils","NYI":"New York Islanders","NYR":"New York Rangers",
  "OTT":"Ottawa Senators","PHI":"Philadelphia Flyers","PHX":"Phoenix Coyotes",
  "PIT":"Pittsburgh Penguins","SJS":"San Jose Sharks","SEA":"Seattle Kraken",
  "STL":"St. Louis Blues","TBL":"Tampa Bay Lightning","TOR":"Toronto Maple Leafs",
  "UTA":"Utah Hockey Club","VAN":"Vancouver Canucks","VGK":"Vegas Golden Knights",
  "WSH":"Washington Capitals","WPG":"Winnipeg Jets",
  "QUE":"Quebec Nordiques","HFD":"Hartford Whalers","MNS":"Minnesota North Stars",
  "KCS":"Kansas City Scouts","CLR":"Colorado Rockies","OAK":"Oakland Seals",
  "CAL":"California Golden Seals","CLE":"Cleveland Barons","ATF":"Atlanta Flames",
  "AFM":"Atlanta Flames","AIK":"AIK","ALL":"All-Stars","BFT":"Buffalo Bisons",
  "BRY":"Brooklyn Americans","CGS":"California Golden Seals","CSK":"Kansas City Scouts",
  "DAV":"Dayton","DDF":"defunct","DIN":"Denver","DJU":"defunct",
  "MNS":"Minnesota North Stars","PHX":"Phoenix Coyotes"
};

function tn(code){ return TEAM_NAMES[code] || code; }

var allSeasons = [];
var tableData  = [];
var sortState  = { col: 'season', asc: false };

// NHL franchises only — current and historical
var NHL_TEAMS = [
  "ANA","ARI","ATL","BOS","BUF","CAR","CBJ","CGY","CGS","CHI",
  "CLE","CLR","COL","DAL","DET","EDM","FLA","HFD","KCS","LAK",
  "MIN","MNS","MNS","MTL","NJD","NSH","NYI","NYR","OAK","OTT",
  "PHI","PHX","PIT","QUE","SEA","SJS","STL","TBL","TOR","UTA",
  "VAN","VGK","WIN","WPG","WSH"
];

// Remove duplicates and sort by full name
NHL_TEAMS = NHL_TEAMS.filter(function(v, i, a){ return a.indexOf(v) === i; })
  .sort(function(a, b){ return tn(a) < tn(b) ? -1 : 1; });

fetch('/data/nhl/index.json').then(function(r){ return r.json(); }).then(function(seasons){
  allSeasons = seasons;

  var sel = document.getElementById('teamSelect');
  NHL_TEAMS.forEach(function(code){
    sel.innerHTML += '<option value="'+code+'">'+tn(code)+'</option>';
  });

  // Pre-select from URL param
  var params = new URLSearchParams(window.location.search);
  if(params.get('team')){
    sel.value = params.get('team');
    buildFranchise();
  }

  sel.onchange = buildFranchise;
});

function buildFranchise(){
  var team = document.getElementById('teamSelect').value;
  if(!team) return;

  // Update URL
  var url = new URL(window.location);
  url.searchParams.set('team', team);
  window.history.pushState({}, '', url);

  document.getElementById('heroTitle').innerText = tn(team) + ' — Franchise History';
  document.getElementById('summaryGrid').style.display = 'none';
  document.getElementById('tableWrap').style.display   = 'none';
  document.getElementById('loadingMsg').style.display  = 'block';
  document.getElementById('pbar').style.width = '0%';
  document.getElementById('tbody').innerHTML  = '';
  tableData = [];

  var validSeasons = allSeasons.filter(function(s){ return s.games > 0; });
  var done = 0;

  var promises = validSeasons.map(function(s){
    return fetch('/data/nhl/seasons/' + s.season + '.json')
      .then(function(r){ return r.json(); })
      .then(function(games){
        var w=0, l=0, gf=0, ga=0, poW=0, poL=0;

        games.forEach(function(g){
          var isHome = g.home_team === team;
          var isAway = g.away_team === team;
          if(!isHome && !isAway) return;

          var teamGF = isHome ? (g.home_score||0) : (g.away_score||0);
          var teamGA = isHome ? (g.away_score||0) : (g.home_score||0);
          gf += teamGF; ga += teamGA;

          // Derive game_type from game_id if field is missing
          var gtype = g.game_type || (String(g.game_id||'').slice(4,6)==='03' ? 'P' : 'R');
          var isReg = gtype === 'R';
          var isPO  = gtype === 'P';
          var win   = teamGF > teamGA;

          if(isReg){ if(win) w++; else l++; }
          if(isPO){  if(win) poW++; else poL++; }
        });

        var gp  = w + l;
        var pts = w * 2;
        var pct = gp ? (w / gp) : 0;

        if(!gp) return null;

        return {
          season:  s.season,
          gp:      gp,
          w:       w,
          l:       l,
          pct:     pct,
          pts:     pts,
          gf:      gf,
          ga:      ga,
          diff:    gf - ga,
          playoff: poW + poL > 0 ? poW + '–' + poL : '–'
        };
      })
      .catch(function(){ return null; })
      .finally(function(){
        done++;
        var pct = Math.round((done / validSeasons.length) * 100);
        var bar = document.getElementById('pbar');
        if(bar) bar.style.width = pct + '%';
      });
  });

  Promise.all(promises).then(function(rows){
    tableData = rows.filter(Boolean);
    tableData.sort(function(a,b){ return b.season - a.season; });

    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('tableWrap').style.display  = '';

    // Career summary
    var totalGP  = tableData.reduce(function(s,r){ return s+r.gp; }, 0);
    var totalW   = tableData.reduce(function(s,r){ return s+r.w;  }, 0);
    var totalL   = tableData.reduce(function(s,r){ return s+r.l;  }, 0);
    var totalGF  = tableData.reduce(function(s,r){ return s+r.gf; }, 0);
    var totalGA  = tableData.reduce(function(s,r){ return s+r.ga; }, 0);
    var allTimePct = totalGP ? (totalW/totalGP*100).toFixed(1)+'%' : '–';
    var seasons  = tableData.length;

    document.getElementById('summaryGrid').style.display = '';
    document.getElementById('summaryGrid').innerHTML =
      sbox('Seasons', seasons) +
      sbox('Games', totalGP) +
      sbox('Wins', totalW) +
      sbox('Losses', totalL) +
      sbox('Win %', allTimePct) +
      sbox('Goals For', totalGF.toLocaleString()) +
      sbox('Goals Against', totalGA.toLocaleString()) +
      sbox('Goal Diff', (totalGF-totalGA > 0 ? '+' : '') + (totalGF-totalGA));

    renderTable();
  });
}

function sbox(label, val){
  return '<div class="stat-box"><b>'+label+'</b><div class="stat-num">'+val+'</div></div>';
}

function sortBy(col){
  if(sortState.col === col){
    sortState.asc = !sortState.asc;
  } else {
    sortState.col = col;
    sortState.asc = false;
  }
  tableData.sort(function(a, b){
    var av = a[col], bv = b[col];
    // Handle strings like '3–2'
    if(typeof av === 'string') av = parseFloat(av) || 0;
    if(typeof bv === 'string') bv = parseFloat(bv) || 0;
    return sortState.asc ? av - bv : bv - av;
  });
  renderTable();
}

function renderTable(){
  var rows = tableData.map(function(r){
    return '<tr>'+
      '<td><a class="season-link" href="/nhl-season.html?season='+r.season+'">'+
        r.season+'–'+String(r.season+1).slice(2)+'</a></td>'+
      '<td>'+r.gp+'</td>'+
      '<td>'+r.w+'</td>'+
      '<td>'+r.l+'</td>'+
      '<td>'+r.pct.toFixed(3)+'</td>'+
      '<td>'+r.pts+'</td>'+
      '<td>'+r.gf+'</td>'+
      '<td>'+r.ga+'</td>'+
      '<td>'+(r.diff > 0 ? '+' : '')+r.diff+'</td>'+
      '<td>'+r.playoff+'</td>'+
      '</tr>';
  }).join('');
  document.getElementById('tbody').innerHTML = rows ||
    '<tr><td colspan="10" style="text-align:center;color:#888">No data found for this franchise.</td></tr>';
}
</script>
</body>
</html>
