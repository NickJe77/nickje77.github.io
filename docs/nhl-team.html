<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>NHL Team | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8J9ZPKDDH"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N8J9ZPKDDH');</script>
  <link rel="stylesheet" href="style.css">
  <style>
  body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f4f6f8;}
  .navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;position:sticky;top:0;z-index:100;}
  .navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
  .navbar a:hover{text-decoration:underline;}
  .hero{padding:52px 20px 44px;text-align:center;color:white;background:linear-gradient(135deg,#041E42,#0072CE);transition:background .4s;}
  .hero h1{margin:0;font-size:58px;font-weight:900;letter-spacing:-2px;line-height:1;}
  .hero p{margin:12px 0 0;font-size:17px;font-weight:600;opacity:.88;text-transform:uppercase;}
  .page-wrap{max-width:1200px;margin:0 auto;padding:0 20px 60px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:28px 0;}
  .stat-box{background:white;border-radius:14px;padding:18px 14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .stat-box b{display:block;font-size:11px;color:#0056d6;text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:8px;}
  .stat-num{font-size:36px;font-weight:900;line-height:1;color:#111;}
  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .controls select{padding:9px 14px;border-radius:12px;border:1px solid #ddd;font-size:14px;font-weight:700;background:white;cursor:pointer;}
  .section{background:white;border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:24px;}
  .section-title{font-size:19px;font-weight:900;margin:0 0 16px;border-left:5px solid #0056d6;padding-left:12px;color:#111;}
  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid #dce3ec;}
  table{width:100%;border-collapse:collapse;background:white;min-width:500px;}
  th{background:#041E42;color:white;padding:12px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;text-align:left;white-space:nowrap;}
  td{padding:11px 10px;border-bottom:1px solid #edf2f7;font-size:14px;font-weight:500;}
  tr:nth-child(even) td{background:#f4f8fd;}
  tr:hover td{background:#e8f2ff;}
  .win{color:#16a34a;font-weight:800;}
  .loss{color:#dc2626;font-weight:800;}
  .otl{color:#d97706;font-weight:800;}
  .team-link{color:#0056d6;font-weight:700;text-decoration:none;}
  .team-link:hover{text-decoration:underline;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;}
  .badge-reg{background:#e8f0fc;color:#0056d6;}
  .badge-po{background:#fde8e8;color:#c00;}
  .loading{text-align:center;padding:60px;font-size:18px;font-weight:700;color:#555;}
  .progress-wrap{background:#e2e8f0;border-radius:99px;height:8px;max-width:300px;margin:12px auto 0;}
  .progress-bar{background:#041E42;height:8px;border-radius:99px;transition:width .2s;}
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="nba.html">NBA</a>
  <a href="nhl.html">NHL</a>
</div>

<div class="hero" id="hero">
  <h1 id="heroName">Loading...</h1>
  <p id="heroSub">NHL Franchise History</p>
</div>

<div class="page-wrap">
  <div class="stat-grid" id="statGrid">
    <div class="loading">Loading franchise data...<div class="progress-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div></div>
  </div>

  <div class="controls">
    <select id="seasonFilter" onchange="renderGames()"><option value="">All Seasons</option></select>
    <select id="typeFilter" onchange="renderGames()">
      <option value="">All Games</option>
      <option value="R">Regular Season</option>
      <option value="P">Playoffs</option>
    </select>
    <select id="resultFilter" onchange="renderGames()">
      <option value="">All Results</option>
      <option value="W">Wins</option>
      <option value="L">Losses</option>
    </select>
  </div>

  <div class="section">
    <div class="section-title">Game Log</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Season</th><th>H/A</th><th>Opponent</th><th>GF</th><th>GA</th><th>Result</th><th>Type</th>
        </tr></thead>
        <tbody id="gamesTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var team = (params.get('team') || '').toUpperCase();

var TEAM_NAMES = {
  "ANA":"Anaheim Ducks","ARI":"Arizona Coyotes","ATL":"Atlanta Thrashers",
  "BOS":"Boston Bruins","BUF":"Buffalo Sabres","CGY":"Calgary Flames",
  "CAR":"Carolina Hurricanes","CHI":"Chicago Blackhawks","COL":"Colorado Avalanche",
  "CBJ":"Columbus Blue Jackets","DAL":"Dallas Stars","DET":"Detroit Red Wings",
  "EDM":"Edmonton Oilers","FLA":"Florida Panthers","LAK":"Los Angeles Kings",
  "MIN":"Minnesota Wild","MTL":"Montreal Canadiens","NSH":"Nashville Predators",
  "NJD":"New Jersey Devils","NYI":"New York Islanders","NYR":"New York Rangers",
  "OTT":"Ottawa Senators","PHI":"Philadelphia Flyers","PHX":"Phoenix Coyotes",
  "PIT":"Pittsburgh Penguins","SJS":"San Jose Sharks","SEA":"Seattle Kraken",
  "STL":"St. Louis Blues","TBL":"Tampa Bay Lightning","TOR":"Toronto Maple Leafs",
  "UTA":"Utah Hockey Club","VAN":"Vancouver Canucks","VGK":"Vegas Golden Knights",
  "WSH":"Washington Capitals","WPG":"Winnipeg Jets",
  "QUE":"Quebec Nordiques","HFD":"Hartford Whalers","MNS":"Minnesota North Stars",
  "KCS":"Kansas City Scouts","CLR":"Colorado Rockies","OAK":"Oakland Seals",
  "CAL":"California Golden Seals","CLE":"Cleveland Barons","ATF":"Atlanta Flames"
};

var TEAM_COLOURS = {
  "ANA":["#F47A38","#B09057"],"ARI":["#8C2633","#E2D6B5"],"BOS":["#FFB81C","#000000"],
  "BUF":["#003087","#FCB514"],"CGY":["#C8102E","#F1BE48"],"CAR":["#CC0000","#000000"],
  "CHI":["#CF0A2C","#000000"],"COL":["#6F263D","#236192"],"CBJ":["#002654","#CE1126"],
  "DAL":["#006847","#8F8F8C"],"DET":["#CE1126","#FFFFFF"],"EDM":["#041E42","#FF4C00"],
  "FLA":["#041E42","#C8102E"],"LAK":["#111111","#A2AAAD"],"MIN":["#154734","#A6192E"],
  "MTL":["#AF1E2D","#192168"],"NSH":["#FFB81C","#041E42"],"NJD":["#CE1126","#000000"],
  "NYI":["#003087","#FC4C02"],"NYR":["#0038A8","#CE1126"],"OTT":["#C2912C","#000000"],
  "PHI":["#F74902","#000000"],"PIT":["#FCB514","#000000"],"SJS":["#006D75","#EA7200"],
  "SEA":["#001628","#99D9D9"],"STL":["#002F87","#FCB514"],"TBL":["#002868","#FFFFFF"],
  "TOR":["#003E7E","#FFFFFF"],"UTA":["#010101","#69B3E7"],"VAN":["#00205B","#00843D"],
  "VGK":["#B4975A","#333F42"],"WSH":["#041E42","#C8102E"],"WPG":["#041E42","#004C97"],
  "MTL":["#AF1E2D","#192168"],"PHX":["#8C2633","#E2D6B5"]
};

function tn(code){ return TEAM_NAMES[code] || code; }

var teamName = tn(team);
document.getElementById('heroName').innerText = teamName;
document.title = teamName + ' | NHL History | The Sporting Almanac';

// Apply team colours
var colours = TEAM_COLOURS[team] || ['#041E42','#0072CE'];
document.getElementById('hero').style.background =
  'linear-gradient(135deg,' + colours[0] + ',' + colours[1] + ')';

var allGames = [];

fetch('/data/nhl/index.json')
  .then(function(r){ return r.json(); })
  .then(function(index){
    var seasons = index.filter(function(s){ return s.games > 0; });
    var done = 0;
    var total = seasons.length;

    var promises = seasons.map(function(s){
      return fetch('/data/nhl/seasons/' + s.season + '.json')
        .then(function(r){ return r.json(); })
        .then(function(games){
          games.forEach(function(g){
            if(g.home_team === team || g.away_team === team){
              allGames.push({
                date:     g.date || '–',
                season:   s.season,
                game_type: g.game_type || 'R',
                is_home:  g.home_team === team,
                opponent: g.home_team === team ? g.away_team : g.home_team,
                gf:       g.home_team === team ? (g.home_score||0) : (g.away_score||0),
                ga:       g.home_team === team ? (g.away_score||0) : (g.home_score||0),
              });
            }
          });
          done++;
          var pct = Math.round((done/total)*100);
          var bar = document.getElementById('pbar');
          if(bar) bar.style.width = pct + '%';
        }).catch(function(){});
    });

    return Promise.all(promises);
  })
  .then(function(){
    // Sort by date then season
    allGames.sort(function(a,b){
      if(a.season !== b.season) return a.season - b.season;
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });

    // Populate season filter
    var seasons = [...new Set(allGames.map(function(g){ return g.season; }))].sort();
    var sf = document.getElementById('seasonFilter');
    seasons.forEach(function(s){
      sf.innerHTML += '<option value="'+s+'">'+s+'–'+String(s+1).slice(2)+'</option>';
    });

    buildStats();
    renderGames();
  })
  .catch(function(){
    document.getElementById('statGrid').innerHTML = '<div style="color:#c00;padding:20px">Failed to load team data.</div>';
  });

function buildStats(){
  var w=0, l=0, gf=0, ga=0;
  var regW=0, regL=0, poW=0, poL=0;
  allGames.forEach(function(g){
    gf += g.gf; ga += g.ga;
    var win = g.gf > g.ga;
    if(g.game_type === 'P'){ if(win) poW++; else poL++; }
    else { if(win) regW++; else regL++; }
    if(win) w++; else l++;
  });
  var pct = allGames.length ? ((w/allGames.length)*100).toFixed(1) : '–';
  document.getElementById('statGrid').innerHTML =
    sbox('Games', allGames.length) +
    sbox('Wins', w) +
    sbox('Losses', l) +
    sbox('Win %', pct+'%') +
    sbox('Goals For', gf.toLocaleString()) +
    sbox('Goals Against', ga.toLocaleString()) +
    sbox('Goal Diff', (gf-ga > 0 ? '+' : '') + (gf-ga)) +
    sbox('Reg W–L', regW+'–'+regL) +
    sbox('Playoff W–L', poW+'–'+poL);
}

function sbox(label, val){
  return '<div class="stat-box"><b>'+label+'</b><div class="stat-num">'+val+'</div></div>';
}

function renderGames(){
  var sv = document.getElementById('seasonFilter').value;
  var tv = document.getElementById('typeFilter').value;
  var rv = document.getElementById('resultFilter').value;

  var filtered = allGames.filter(function(g){
    if(sv && String(g.season) !== sv) return false;
    if(tv && g.game_type !== tv) return false;
    if(rv === 'W' && g.gf <= g.ga) return false;
    if(rv === 'L' && g.gf >= g.ga) return false;
    return true;
  });

  var rows = filtered.map(function(g){
    var win = g.gf > g.ga;
    var resCls = win ? 'win' : 'loss';
    var resLabel = win ? 'W' : 'L';
    var badge = g.game_type === 'P'
      ? '<span class="badge badge-po">PO</span>'
      : '<span class="badge badge-reg">REG</span>';
    return '<tr>'+
      '<td>'+(g.date||'–')+'</td>'+
      '<td>'+g.season+'–'+String(g.season+1).slice(2)+'</td>'+
      '<td>'+(g.is_home ? 'H' : 'A')+'</td>'+
      '<td><a class="team-link" href="/nhl-team.html?team='+encodeURIComponent(g.opponent)+'">'+tn(g.opponent)+'</a></td>'+
      '<td>'+g.gf+'</td>'+
      '<td>'+g.ga+'</td>'+
      '<td class="'+resCls+'">'+resLabel+'</td>'+
      '<td>'+badge+'</td>'+
      '</tr>';
  }).join('');

  document.getElementById('gamesTable').innerHTML = rows ||
    '<tr><td colspan="8" style="text-align:center;color:#888">No games match this filter.</td></tr>';
}
</script>
</body>
</html>
