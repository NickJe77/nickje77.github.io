<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NHL Game | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N8J9ZPKDDH"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N8J9ZPKDDH');</script>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;position:sticky;top:0;z-index:100;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

/* Hero background set dynamically per-game via JS (split team colours) */
.hero{color:#fff;padding:40px 20px 34px;text-align:center;}
.hero-score{display:flex;align-items:center;justify-content:center;gap:28px;margin:14px 0 8px;}
.hero-team{text-align:center;}
.hero-team-name{font-family:var(--body);font-size:16px;font-weight:700;opacity:.95;}
.hero-team-score{font-family:var(--display);font-size:60px;font-weight:600;line-height:1;}
.hero-vs{font-family:var(--display);font-size:22px;font-weight:600;opacity:.5;}
.hero-meta{font-size:13.5px;opacity:.8;font-weight:500;}

.page-wrap{max-width:1300px;margin:0 auto;padding:26px 20px 70px;}
.section{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;margin-bottom:20px;
}
.section-title{
  font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  margin:0 0 16px;border-left:4px solid var(--accent);padding-left:12px;color:var(--ink);
}
/* Period scores */
.period-table{width:100%;border-collapse:collapse;text-align:center;}
.period-table th{
  background:#f7f9fb;color:var(--muted);padding:10px 16px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;font-family:var(--body);border-bottom:1px solid var(--line);
}
.period-table td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600;color:#27313c;}
.period-table td:first-child{text-align:left;font-weight:700;color:var(--ink);}
.period-table tr:last-child td{font-weight:700;font-size:16px;background:var(--accent-soft);color:var(--ink);}
/* Team stats */
.team-stats-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:center;}
.ts-row{display:contents;}
.ts-home{text-align:right;padding:10px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);color:#27313c;}
.ts-label{
  text-align:center;padding:10px 12px;font-size:11px;font-weight:600;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--body);
}
.ts-away{text-align:left;padding:10px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);color:#27313c;}
.ts-home.better{color:#1e7a3d;font-weight:700;}
.ts-away.better{color:#1e7a3d;font-weight:700;}
/* Player tables */
.team-section{margin-bottom:26px;}
.team-section-title{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 12px;color:var(--ink);text-transform:uppercase;letter-spacing:.01em;}
.tlink{color:var(--ink);font-weight:700;text-decoration:none;}
.tlink:hover{color:var(--accent);}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);margin-bottom:16px;}
table{width:100%;border-collapse:collapse;background:var(--surface);}
th{
  background:#f7f9fb;color:var(--muted);padding:10px 10px;font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;text-align:left;white-space:nowrap;
  font-family:var(--body);border-bottom:1px solid var(--line);
}
td{padding:10px 10px;border-bottom:1px solid var(--line);font-size:12.5px;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tr:hover td{background:#f9fbfd;}
.loading{text-align:center;padding:80px;font-size:15px;font-weight:600;color:var(--muted);}
.error{text-align:center;padding:60px;font-size:16px;font-weight:600;color:#c0362c;}
.badge-po{
  display:inline-block;padding:3px 10px;border-radius:999px;background:#fbe7e5;color:#c0362c;
  font-size:10.5px;font-weight:700;text-transform:uppercase;margin-left:8px;
}
</style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="nba.html">NBA</a>
  <a href="nhl.html">NHL</a>
</div>

<div id="hero" class="hero"><div class="loading">Loading...</div></div>
<div id="pageWrap" class="page-wrap" style="display:none"></div>

<script>
var TEAM_NAMES = {
  "ANA":"Anaheim Ducks","ARI":"Arizona Coyotes","ATL":"Atlanta Thrashers",
  "BOS":"Boston Bruins","BUF":"Buffalo Sabres","CGY":"Calgary Flames",
  "CAR":"Carolina Hurricanes","CHI":"Chicago Blackhawks","COL":"Colorado Avalanche",
  "CBJ":"Columbus Blue Jackets","DAL":"Dallas Stars","DET":"Detroit Red Wings",
  "EDM":"Edmonton Oilers","FLA":"Florida Panthers","LAK":"Los Angeles Kings",
  "MIN":"Minnesota Wild","MTL":"Montreal Canadiens","NSH":"Nashville Predators",
  "NJD":"New Jersey Devils","NYI":"New York Islanders","NYR":"New York Rangers",
  "OTT":"Ottawa Senators","PHI":"Philadelphia Flyers","PHX":"Phoenix Coyotes",
  "PIT":"Pittsburgh Penguins","SJS":"San Jose Sharks","SEA":"Seattle Kraken",
  "STL":"St. Louis Blues","TBL":"Tampa Bay Lightning","TOR":"Toronto Maple Leafs",
  "UTA":"Utah Hockey Club","VAN":"Vancouver Canucks","VGK":"Vegas Golden Knights",
  "WSH":"Washington Capitals","WPG":"Winnipeg Jets",
  "QUE":"Quebec Nordiques","HFD":"Hartford Whalers","MNS":"Minnesota North Stars",
  "KCS":"Kansas City Scouts","CLR":"Colorado Rockies","OAK":"Oakland Seals",
  "CAL":"California Golden Seals","CLE":"Cleveland Barons"
};

var TEAM_COLOURS = {
  "ANA":["#F47A38","#B09057"],"ARI":["#8C2633","#E2D6B5"],"BOS":["#FFB81C","#000000"],
  "BUF":["#003087","#FCB514"],"CGY":["#C8102E","#F1BE48"],"CAR":["#CC0000","#000000"],
  "CHI":["#CF0A2C","#000000"],"COL":["#6F263D","#236192"],"CBJ":["#002654","#CE1126"],
  "DAL":["#006847","#8F8F8C"],"DET":["#CE1126","#FFFFFF"],"EDM":["#041E42","#FF4C00"],
  "FLA":["#041E42","#C8102E"],"LAK":["#111111","#A2AAAD"],"MIN":["#154734","#A6192E"],
  "MTL":["#AF1E2D","#192168"],"NSH":["#FFB81C","#041E42"],"NJD":["#CE1126","#000000"],
  "NYI":["#003087","#FC4C02"],"NYR":["#0038A8","#CE1126"],"OTT":["#C2912C","#000000"],
  "PHI":["#F74902","#000000"],"PIT":["#FCB514","#000000"],"SJS":["#006D75","#EA7200"],
  "SEA":["#001628","#99D9D9"],"STL":["#002F87","#FCB514"],"TBL":["#002868","#FFFFFF"],
  "TOR":["#003E7E","#FFFFFF"],"UTA":["#010101","#69B3E7"],"VAN":["#00205B","#00843D"],
  "VGK":["#B4975A","#333F42"],"WSH":["#041E42","#C8102E"],"WPG":["#041E42","#004C97"]
};

function tn(code){ return TEAM_NAMES[code] || code; }
function toistr(sec){ if(!sec) return '–'; return Math.floor(sec/60)+':'+(sec%60<10?'0':'')+sec%60; }
function pm(v){ return v > 0 ? '+'+v : v; }

var params = new URLSearchParams(location.search);
var gameId = params.get('game');

if(!gameId){
  document.getElementById('hero').innerHTML = '<div class="error">No game specified.</div>';
} else {
  fetch('/data/nhl/boxscores/'+gameId+'.json')
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(render)
    .catch(function(){
      document.getElementById('hero').innerHTML = '<div class="error">Game data not found.</div>';
    });
}

function render(g){
  var home = g.home, away = g.away;
  var hCode = home.team, aCode = away.team;
  var hName = tn(hCode), aName = tn(aCode);
  var hScore = home.score, aScore = away.score;
  var isPO = g.game_type === 'P';
  var hWin = hScore > aScore;

  var hCol = TEAM_COLOURS[hCode] || ['#041E42','#0072CE'];
  var aCol = TEAM_COLOURS[aCode] || ['#C8102E','#041E42'];
  document.getElementById('hero').style.background =
    'linear-gradient(135deg,'+hCol[0]+' 0%,'+hCol[1]+' 49%,'+aCol[0]+' 51%,'+aCol[1]+' 100%)';

  document.title = hName + ' ' + hScore + ' – ' + aScore + ' ' + aName + ' | NHL | The Sporting Almanac';

  document.getElementById('hero').innerHTML =
    '<div class="hero-score">'+
      '<div class="hero-team">'+
        '<div class="hero-team-name"><a class="tlink" style="color:white" href="/nhl-franchise.html?team='+encodeURIComponent(hCode)+'">'+hName+'</a></div>'+
        '<div class="hero-team-score">'+(hScore!=null?hScore:'–')+'</div>'+
      '</div>'+
      '<div class="hero-vs">–</div>'+
      '<div class="hero-team">'+
        '<div class="hero-team-name"><a class="tlink" style="color:white" href="/nhl-franchise.html?team='+encodeURIComponent(aCode)+'">'+aName+'</a></div>'+
        '<div class="hero-team-score">'+(aScore!=null?aScore:'–')+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="hero-meta">'+
      (g.date||'')+(g.venue?' · '+g.venue:'')+(isPO?'<span class="badge-po">Playoff</span>':'')+
      ' · <a class="tlink" style="color:rgba(255,255,255,.8)" href="/nhl-season.html?season='+g.season+'">'+g.season+'–'+String(g.season+1).slice(2)+' Season</a>'+
    '</div>';

  var html = '';

  // Period scores
  if(g.periods && g.periods.length){
    var pRows = g.periods.map(function(p){
      var pLabel = p.period > 3 ? (p.period === 4 ? 'OT' : 'SO') : 'P'+p.period;
      return '<tr><td>'+pLabel+'</td><td>'+p.home_goals+'</td><td>'+p.away_goals+'</td></tr>';
    }).join('');
    html +=
      '<div class="section">'+
        '<div class="section-title">Period Scores</div>'+
        '<table class="period-table">'+
          '<thead><tr><th>Period</th><th>'+hName+'</th><th>'+aName+'</th></tr></thead>'+
          '<tbody>'+pRows+
            '<tr><td>Final</td><td>'+(hScore!=null?hScore:'–')+'</td><td>'+(aScore!=null?aScore:'–')+'</td></tr>'+
          '</tbody>'+
        '</table>'+
      '</div>';
  }

  // Team stats
  var ts = g.team_stats || {};
  var statLabels = {
    'sog':             'Shots on Goal',
    'faceoffWinPctg':  'Faceoff Win %',
    'powerPlayPctg':   'Power Play %',
    'powerPlayGoals':  'PP Goals',
    'powerPlayConversions': 'PP Chances',
    'pim':             'Penalty Minutes',
    'hits':            'Hits',
    'blockedShots':    'Blocked Shots',
    'giveaways':       'Giveaways',
    'takeaways':       'Takeaways',
  };
  var tsKeys = Object.keys(ts);
  if(tsKeys.length){
    var tsRows = tsKeys.map(function(k){
      var label = statLabels[k] || k;
      var hv = ts[k] && ts[k].home != null ? ts[k].home : '–';
      var av = ts[k] && ts[k].away != null ? ts[k].away : '–';
      var hBetter = parseFloat(hv) > parseFloat(av);
      var aBetter = parseFloat(av) > parseFloat(hv);
      return '<div class="ts-row">'+
        '<div class="ts-home'+(hBetter?' better':'')+'">'+hv+'</div>'+
        '<div class="ts-label">'+label+'</div>'+
        '<div class="ts-away'+(aBetter?' better':'')+'">'+av+'</div>'+
        '</div>';
    }).join('');
    html +=
      '<div class="section">'+
        '<div class="section-title">Team Stats</div>'+
        '<div style="display:grid;grid-template-columns:1fr auto;margin-bottom:8px;font-weight:900;font-size:14px;">'+
          '<div style="text-align:right;padding:0 16px">'+hName+'</div>'+
          '<div style="min-width:160px"></div>'+
        '</div>'+
        '<div class="team-stats-grid">'+tsRows+'</div>'+
      '</div>';
  }

  // Skater tables
  function skaterTable(players, teamCode){
    if(!players || !players.length) return '<p style="color:#888">No data</p>';
    var rows = players.map(function(p){
      return '<tr>'+
        '<td>'+(p.number||'')+'</td>'+
        '<td><a class="tlink" href="/nhl-player.html?player='+encodeURIComponent(p.id)+'">'+p.name+'</a></td>'+
        '<td>'+p.position+'</td>'+
        '<td>'+p.goals+'</td><td>'+p.assists+'</td><td>'+p.points+'</td>'+
        '<td>'+pm(p.plus_minus)+'</td>'+
        '<td>'+p.pim+'</td><td>'+p.shots+'</td><td>'+p.hits+'</td>'+
        '<td>'+p.blocked+'</td><td>'+p.pp_goals+'</td>'+
        '<td>'+p.giveaways+'</td><td>'+p.takeaways+'</td>'+
        '<td>'+(p.fo_pctg ? (p.fo_pctg*100).toFixed(0)+'%' : '–')+'</td>'+
        '<td>'+p.toi_str+'</td>'+
        '</tr>';
    }).join('');
    return '<div class="table-wrap"><table>'+
      '<thead><tr><th>#</th><th>Player</th><th>Pos</th>'+
      '<th>G</th><th>A</th><th>PTS</th><th>+/–</th>'+
      '<th>PIM</th><th>SOG</th><th>Hits</th><th>Blk</th><th>PPG</th>'+
      '<th>Give</th><th>Take</th><th>FO%</th><th>TOI</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  function goalieTable(players){
    if(!players || !players.length) return '<p style="color:#888">No data</p>';
    var rows = players.map(function(p){
      var svpct = p.shots_against > 0 ? (p.saves/p.shots_against).toFixed(3) : '–';
      return '<tr>'+
        '<td>'+(p.number||'')+'</td>'+
        '<td><a class="tlink" href="/nhl-player.html?player='+encodeURIComponent(p.id)+'">'+p.name+'</a></td>'+
        '<td>'+(p.decision?p.decision:'–')+'</td>'+
        '<td>'+p.saves+'</td><td>'+p.shots_against+'</td>'+
        '<td>'+p.goals_against+'</td><td>'+svpct+'</td>'+
        '<td>'+p.pim+'</td><td>'+p.toi_str+'</td>'+
        '</tr>';
    }).join('');
    return '<div class="table-wrap"><table>'+
      '<thead><tr><th>#</th><th>Goalie</th><th>Dec</th>'+
      '<th>Saves</th><th>SA</th><th>GA</th><th>SV%</th>'+
      '<th>PIM</th><th>TOI</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  html +=
    '<div class="section">'+
      '<div class="section-title">Player Stats</div>'+
      '<div class="team-section">'+
        '<div class="team-section-title">'+hName+' — Skaters</div>'+
        skaterTable(home.skaters, hCode)+
        '<div class="team-section-title">'+hName+' — Goalies</div>'+
        goalieTable(home.goalies)+
      '</div>'+
      '<div class="team-section">'+
        '<div class="team-section-title">'+aName+' — Skaters</div>'+
        skaterTable(away.skaters, aCode)+
        '<div class="team-section-title">'+aName+' — Goalies</div>'+
        goalieTable(away.goalies)+
      '</div>'+
    '</div>';

  document.getElementById('pageWrap').innerHTML = html;
  document.getElementById('pageWrap').style.display = 'block';
}
</script>
</body>
</html>
