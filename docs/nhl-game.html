<!DOCTYPE html>
<html>
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NHL Game</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1000px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(135deg,#041E42,#0072CE);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.score{
font-size:32px;
font-weight:bold;
}

</style>
</head>
<body>

<div class="page">

<div id="hero" class="hero"></div>

</div>

<script>

function getParams(){

const url=new URLSearchParams(window.location.search);

return{

id:url.get("id"),

season:url.get("season")

};

}

async function loadGame(){

const params=getParams();

const res=await fetch(`data/nhl/seasons/${params.season}.json`);

const data=await res.json();

const game=data.games.find(g=>g.id==params.id);

document.getElementById("hero").innerHTML=`

<h1>${game.away} @ ${game.home}</h1>

<div class="score">

${game.awayScore} - ${game.homeScore}

</div>

<div>${game.date}</div>

`;

}

loadGame();

</script>

</body>
</html>
