<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Test Cricket Head to Head | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#f4f8fc;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:24px;
}

.hero{
  background:linear-gradient(135deg,#0d3320,#1a6b3c);
  color:#fff;
  padding:40px;
  border-radius:22px;
  margin-bottom:24px;
}

.hero h1{margin:0;font-size:42px;}
.hero p{margin-top:10px;font-size:18px;opacity:.9;}

/* SELECTORS */
.selector-wrap{
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:24px;
}

.selector-wrap select{
  padding:10px 16px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
  font-weight:600;
  background:#fff;
  min-width:200px;
}

.selector-wrap select:focus{outline:2px solid #1a6b3c;border-color:#1a6b3c;}

.vs-label{
  font-size:22px;
  font-weight:800;
  color:#1a6b3c;
}

.go-btn{
  padding:10px 24px;
  background:#1a6b3c;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

.go-btn:hover{background:#145c32;transform:translateY(-1px);}

/* RECORD BANNER */
.record-banner{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:0;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #d0e8da;
  margin-bottom:24px;
  text-align:center;
}

.record-team{
  padding:24px 20px;
}

.record-team h2{margin:0 0 4px;font-size:20px;color:#0d3320;}
.record-wins{font-size:48px;font-weight:800;color:#1a6b3c;line-height:1;}
.record-label{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#aaa;margin-top:4px;}

.record-middle{
  padding:24px 20px;
  background:#f5f9f6;
  border-left:1px solid #d0e8da;
  border-right:1px solid #d0e8da;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.record-draws{font-size:36px;font-weight:800;color:#888;line-height:1;}

/* SECTION */
.section-title{
  margin:28px 0 12px;
  font-weight:700;
  color:#0d3320;
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
}

/* STATS GRID */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
  margin-bottom:8px;
}

.stat{
  background:#fff;
  padding:16px;
  border-radius:12px;
  text-align:center;
  border:1px solid #d0e8da;
}

.stat h3{margin:0 0 4px;font-size:22px;color:#0d3320;}
.stat span{font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}

/* TABLE */
.table-wrap{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  margin-bottom:28px;
}

table{width:100%;border-collapse:collapse;font-size:14px;}

th{
  background:linear-gradient(135deg,#0d3320,#1a6b3c);
  color:#fff;
  padding:12px;
  text-align:left;
}

td{padding:12px;border-bottom:1px solid #eee;}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:'SF Mono',Consolas,monospace;}
tr:nth-child(even){background:#f4f8fc;}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:#d6ede0;}

.empty-msg{
  padding:60px;
  text-align:center;
  color:#bbb;
  font-size:15px;
}

.loading{
  padding:40px;
  text-align:center;
  color:#aaa;
  font-size:15px;
}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{
  display:inline-block;
  width:24px;height:24px;
  border:3px solid #e0e0e0;
  border-top-color:#1a6b3c;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
  margin-right:8px;
}

footer{
  text-align:center;
  padding:24px 20px;
  font-size:12px;
  color:#aaa;
  border-top:1px solid #eee;
  margin-top:40px;
}
footer a{color:#888;text-decoration:none;}
footer a:hover{text-decoration:underline;}

</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="cricket.html">Cricket</a>
  <a href="test-cricket.html">Test Cricket</a>
</div>

<div class="page">

  <div class="hero">
    <h1>Head to Head</h1>
    <p>Records, results and individual performances between two nations.</p>
  </div>

  <div class="selector-wrap">
    <select id="team1Select"><option value="">Select Team 1</option></select>
    <span class="vs-label">vs</span>
    <select id="team2Select"><option value="">Select Team 2</option></select>
    <button class="go-btn" onclick="loadH2H()">View Record</button>
  </div>

  <div id="results">
    <div class="empty-msg">Select two teams above to see their head to head record.</div>
  </div>

</div>

<footer>
  Scorecard data sourced from <a href="https://www.howstat.com" target="_blank">howstat.com</a>
</footer>

<script>
const BASE = '/data/test_cricket';

let allMatches = [];
let allTeams = new Set();
let dataLoaded = false;

// Load all years on page load to build team list
async function init() {
  const years = [];
  for (let y = 1970; y <= 2026; y++) years.push(y);

  await Promise.all(years.map(async year => {
    try {
      const res = await fetch(`${BASE}/tests_${year}.json`);
      if (!res.ok) return;
      const data = await res.json();
      (data.matches || []).forEach(match => {
        const innings = match.scorecard?.innings || [];
        const teams = [...new Set(innings.map(i => i.team))];
        teams.forEach(t => allTeams.add(t));
        if (teams.length >= 2) allMatches.push(match);
      });
    } catch {}
  }));

  dataLoaded = true;
  populateSelects();
}

function populateSelects() {
  const sorted = [...allTeams].sort();
  const opts = sorted.map(t => `<option value="${t}">${t}</option>`).join('');
  document.getElementById('team1Select').innerHTML = '<option value="">Select Team 1</option>' + opts;
  document.getElementById('team2Select').innerHTML = '<option value="">Select Team 2</option>' + opts;
}

function getTeams(match) {
  const innings = match.scorecard?.innings || [];
  return [...new Set(innings.map(i => i.team))];
}

function loadH2H() {
  const t1 = document.getElementById('team1Select').value;
  const t2 = document.getElementById('team2Select').value;

  if (!t1 || !t2) { alert('Please select both teams.'); return; }
  if (t1 === t2) { alert('Please select two different teams.'); return; }

  if (!dataLoaded) {
    document.getElementById('results').innerHTML = '<div class="loading"><span class="spinner"></span>Loading data…</div>';
    return;
  }

  // Filter matches between the two teams
  const matches = allMatches.filter(m => {
    const teams = getTeams(m);
    return teams.includes(t1) && teams.includes(t2);
  });

  if (!matches.length) {
    document.getElementById('results').innerHTML =
      `<div class="empty-msg">No matches found between ${t1} and ${t2}.</div>`;
    return;
  }

  // Overall record
  let t1Wins = 0, t2Wins = 0, draws = 0;
  matches.forEach(m => {
    const r = (m.result || '').toLowerCase();
    if (r.includes('drawn') || r.includes('draw') || r.includes('abandoned')) {
      draws++;
    } else if (r.toLowerCase().startsWith(t1.toLowerCase()) || r.includes(`${t1} won`)) {
      t1Wins++;
    } else if (r.toLowerCase().startsWith(t2.toLowerCase()) || r.includes(`${t2} won`)) {
      t2Wins++;
    } else {
      draws++;
    }
  });

  // Highest scores
  let highScores = [];
  // Best bowling
  let bestBowling = [];
  // Fielding (catches/stumpings from dismissals)
  let fielding = {}; // name -> {catches, stumpings}

  matches.forEach(m => {
    const innings = m.scorecard?.innings || [];
    const info = m.scorecard?.match_info || {};
    const series = info.Series || m.teams || '';
    const date = m.date || '';
    const testNo = info['Match No.'] || `#${m.match_number}`;

    innings.forEach(inn => {
      // Batting
      (inn.batting || []).forEach(b => {
        highScores.push({
          player: b.batsman,
          team: inn.team,
          runs: b.runs,
          balls: b.balls_faced,
          notOut: (b.dismissal||'').toLowerCase().includes('not out'),
          date, series, testNo
        });
      });

      // Bowling — dedupe
      const seen = new Set();
      (inn.bowling || []).forEach(b => {
        const k = `${b.bowler}-${b.overs}-${b.runs}-${b.wickets}`;
        if (seen.has(k)) return;
        seen.add(k);
        bestBowling.push({
          player: b.bowler,
          wickets: b.wickets,
          runs: b.runs,
          overs: b.overs,
          economy: b.economy,
          date, series, testNo
        });
      });

      // Fielding — parse dismissals
      (inn.batting || []).forEach(b => {
        const d = (b.dismissal || '').toLowerCase();
        // catch: "c PlayerName b Bowler" or "c †PlayerName b Bowler"
        const catchMatch = d.match(/^c\s+[†]?([^b]+?)\s+b\s+/);
        if (catchMatch) {
          const fielder = catchMatch[1].trim();
          if (!fielding[fielder]) fielding[fielder] = { catches: 0, stumpings: 0 };
          fielding[fielder].catches++;
        }
        // stumping: "st †PlayerName b Bowler"
        const stumpMatch = d.match(/^st\s+[†]?([^b]+?)\s+b\s+/);
        if (stumpMatch) {
          const fielder = stumpMatch[1].trim();
          if (!fielding[fielder]) fielding[fielder] = { catches: 0, stumpings: 0 };
          fielding[fielder].stumpings++;
        }
      });
    });
  });

  // Sort
  highScores.sort((a, b) => b.runs - a.runs);
  bestBowling.sort((a, b) => b.wickets - a.wickets || a.runs - b.runs);
  const fieldingList = Object.entries(fielding)
    .map(([name, f]) => ({ name, ...f, total: f.catches + f.stumpings }))
    .sort((a, b) => b.total - a.total);

  // Render
  document.getElementById('results').innerHTML = `

    <div class="record-banner">
      <div class="record-team">
        <h2>${t1}</h2>
        <div class="record-wins">${t1Wins}</div>
        <div class="record-label">Wins</div>
      </div>
      <div class="record-middle">
        <div class="record-draws">${draws}</div>
        <div class="record-label">Draws</div>
        <div style="font-size:13px;color:#aaa;margin-top:4px;">${matches.length} Tests</div>
      </div>
      <div class="record-team">
        <h2>${t2}</h2>
        <div class="record-wins">${t2Wins}</div>
        <div class="record-label">Wins</div>
      </div>
    </div>

    <div class="section-title">Match Results</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Test #</th><th>Date</th><th>Series</th><th>Venue</th><th>Result</th>
        </tr></thead>
        <tbody>${matches.map(m => {
          const info = m.scorecard?.match_info || {};
          return `<tr>
            <td>${info['Match No.'] || '#'+m.match_number}</td>
            <td>${m.date||''}</td>
            <td>${info.Series || m.teams || ''}</td>
            <td>${m.ground || info.Venue || ''}</td>
            <td>${m.result||'—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>

    <div class="section-title">Highest Individual Scores</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Player</th><th>Team</th><th class="num">Runs</th>
          <th class="num">Balls</th><th>Date</th><th>Series</th>
        </tr></thead>
        <tbody>${highScores.slice(0, 20).map(s => `<tr>
          <td>${s.player}</td>
          <td>${s.team}</td>
          <td class="num"><strong>${s.runs}${s.notOut?'*':''}</strong></td>
          <td class="num">${s.balls??'—'}</td>
          <td>${s.date}</td>
          <td>${s.series}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="section-title">Best Bowling Figures</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Player</th><th class="num">W</th><th class="num">R</th>
          <th class="num">O</th><th class="num">Econ</th><th>Date</th><th>Series</th>
        </tr></thead>
        <tbody>${bestBowling.filter(b => b.wickets > 0).slice(0, 20).map(b => `<tr>
          <td>${b.player}</td>
          <td class="num"><strong>${b.wickets}/${b.runs}</strong></td>
          <td class="num">${b.runs}</td>
          <td class="num">${b.overs}</td>
          <td class="num">${b.economy!=null?Number(b.economy).toFixed(2):'—'}</td>
          <td>${b.date}</td>
          <td>${b.series}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="section-title">Best Fielding</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Player</th>
          <th class="num">Catches</th>
          <th class="num">Stumpings</th>
          <th class="num">Total</th>
        </tr></thead>
        <tbody>${fieldingList.slice(0, 20).map(f => `<tr>
          <td>${f.name}</td>
          <td class="num">${f.catches}</td>
          <td class="num">${f.stumpings}</td>
          <td class="num"><strong>${f.total}</strong></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>

  `;
}

// Show loading state while data builds
document.getElementById('results').innerHTML =
  '<div class="loading"><span class="spinner"></span>Loading team data…</div>';

init().then(() => {
  document.getElementById('results').innerHTML =
    '<div class="empty-msg">Select two teams above to see their head to head record.</div>';
});
</script>

</body>
</html>
