<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:28px;
}

.hero h1{
margin:0;
}

/* SUMMARY BOXES */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.summary-box{
background:#e7e7ec;
padding:12px;
border-radius:10px;
text-align:center;
}

.summary-label{
font-weight:700;
}

.summary-value{
font-size:20px;
}

/* OPPOSITION FILTER */

.filter-wrap{
padding:0 20px 20px 20px;
}

select{
padding:8px 12px;
font-size:16px;
border-radius:6px;
}

/* TABLE */

.container{
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

th{
background:#eef1f6;
}

tr:nth-child(even){
background:#f6fbff;
}

.right{
text-align:right;
}

.match-link{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="hero">
<h1 id="playerName">Loading...</h1>
</div>

<div class="summary" id="careerSummary"></div>

<div class="filter-wrap">

<label><strong>Against opposition:</strong></label>

<select id="oppositionFilter">
<option value="ALL">All opponents</option>
</select>

</div>

<div class="summary" id="oppositionSummary"></div>

<div class="container">

<table id="matchTable">

<tr>
<th>Date</th>
<th>Match</th>
<th class="right">Runs</th>
<th class="right">Balls</th>
<th class="right">Wickets</th>
<th class="right">Overs</th>
</tr>

</table>

</div>

<script>

const INDEX="/data/t20-world-cup/matches/index.json";

const params=new URLSearchParams(location.search);

const player=params.get("player");

let allMatches=[];
let playerCountry="";

document.getElementById("playerName").innerText=player;

init();

async function init(){

const files=await fetch(INDEX).then(r=>r.json());

let career={runs:0,balls:0,wkts:0,ballsBowled:0,matches:0};

let oppositionStats={};

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach((match,index)=>{

let runs=0,balls=0,wkts=0,ballsBowled=0;

let teams=match.info.teams;

let opponent=teams.find(t=>t!==playerCountry);

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

if(inn.team===playerCountry) return;

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

if(d.batter===player){

runs+=d.runs.batter;

if(!d.extras?.wides)
balls++;

playerCountry=match.info.teams.find(t=>t===inn.team);

}

if(d.bowler===player){

if(!d.extras?.wides && !d.extras?.noballs)
ballsBowled++;

if(d.wickets)
wkts+=d.wickets.length;

}

});

});

});

if(runs||balls||wkts||ballsBowled){

career.runs+=runs;
career.balls+=balls;
career.wkts+=wkts;
career.ballsBowled+=ballsBowled;
career.matches++;

allMatches.push({match,file,index,runs,balls,wkts,ballsBowled,opponent});

if(!oppositionStats[opponent])
oppositionStats[opponent]={runs:0,balls:0,wkts:0,matches:0};

oppositionStats[opponent].runs+=runs;
oppositionStats[opponent].balls+=balls;
oppositionStats[opponent].wkts+=wkts;
oppositionStats[opponent].matches++;

}

});

}

document.getElementById("playerName").innerText=
player+" ("+playerCountry+")";

renderCareer(career);

renderOppositionDropdown(oppositionStats);

renderOppositionStats("ALL",oppositionStats);

renderMatches("ALL");

}


/* DROPDOWN */

function renderOppositionDropdown(stats){

const select=document.getElementById("oppositionFilter");

Object.keys(stats).sort().forEach(team=>{

const opt=document.createElement("option");

opt.value=team;
opt.textContent=team;

select.appendChild(opt);

});

select.onchange=e=>{

renderOppositionStats(e.target.value,stats);

renderMatches(e.target.value);

};

}


/* OPPOSITION BOXES */

function renderOppositionStats(team,stats){

let s;

if(team==="ALL"){

s={runs:0,balls:0,wkts:0,matches:0};

Object.values(stats).forEach(v=>{

s.runs+=v.runs;
s.balls+=v.balls;
s.wkts+=v.wkts;
s.matches+=v.matches;

});

}else{

s=stats[team];

}

document.getElementById("oppositionSummary").innerHTML=`

<div class="summary-box">

<div class="summary-label">Matches</div>
<div class="summary-value">${s.matches}</div>

</div>

<div class="summary-box">

<div class="summary-label">Runs</div>
<div class="summary-value">${s.runs}</div>

</div>

<div class="summary-box">

<div class="summary-label">Average</div>
<div class="summary-value">${(s.runs/s.matches||0).toFixed(1)}</div>

</div>

<div class="summary-box">

<div class="summary-label">Strike Rate</div>
<div class="summary-value">${((s.runs/s.balls)*100||0).toFixed(1)}</div>

</div>

<div class="summary-box">

<div class="summary-label">Wickets</div>
<div class="summary-value">${s.wkts}</div>

</div>

`;

}


/* MATCH TABLE */

function renderMatches(team){

const table=document.getElementById("matchTable");

table.innerHTML=table.rows[0].outerHTML;

allMatches.forEach(m=>{

if(team!=="ALL" && m.opponent!==team) return;

const row=document.createElement("tr");

row.innerHTML=`

<td>${formatDate(m.match.info.dates[0])}</td>

<td>
<a href="t20-world-cup-match.html?file=${m.file}&match=${m.index}" class="match-link">
${m.match.info.teams.join(" vs ")}
</a>
</td>

<td class="right">${m.runs}</td>
<td class="right">${m.balls}</td>
<td class="right">${m.wkts}</td>
<td class="right">${formatOvers(m.ballsBowled)}</td>

`;

table.appendChild(row);

});

}


/* CAREER */

function renderCareer(c){

document.getElementById("careerSummary").innerHTML=`

<div class="summary-box">
<div class="summary-label">Matches</div>
<div class="summary-value">${c.matches}</div>
</div>

<div class="summary-box">
<div class="summary-label">Runs</div>
<div class="summary-value">${c.runs}</div>
</div>

<div class="summary-box">
<div class="summary-label">Average</div>
<div class="summary-value">${(c.runs/c.matches||0).toFixed(1)}</div>
</div>

<div class="summary-box">
<div class="summary-label">Strike Rate</div>
<div class="summary-value">${((c.runs/c.balls)*100||0).toFixed(1)}</div>
</div>

<div class="summary-box">
<div class="summary-label">Wickets</div>
<div class="summary-value">${c.wkts}</div>
</div>

`;

}


/* HELPERS */

function formatDate(d){

return new Date(d).toLocaleDateString("en-GB",{

day:"2-digit",
month:"short",
year:"numeric"

});

}

function formatOvers(balls){

return Math.floor(balls/6)+"."+(balls%6);

}

</script>

</body>
</html>
