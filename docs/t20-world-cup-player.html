<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
background:white;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:40px;
margin:20px;
border-radius:18px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero p{
margin:6px 0 0 0;
opacity:.9;
font-size:18px;
}

/* SUMMARY BOXES */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:16px;
padding:0 20px;
margin-bottom:14px;
}

.box{
background:white;
border-radius:14px;
padding:18px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.box .big{
font-size:28px;
font-weight:700;
color:#d00000;
}

/* OPP SUMMARY TITLE */

.section-title{
padding:0 20px;
font-weight:700;
color:#666;
margin-top:6px;
}

/* CONTROLS */

.controls{
display:flex;
gap:14px;
padding:20px;
align-items:center;
flex-wrap:wrap;
}

/* BIGGER MOBILE FRIENDLY SELECT */

select{
padding:14px 16px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
min-width:220px;
font-weight:600;
background:white;
}

/* TABS */

.tab{
padding:12px 22px;
border-radius:10px;
background:#ddd;
cursor:pointer;
font-weight:700;
font-size:16px;
}

.tab.active{
background:#d00000;
color:white;
}

/* TABLE */

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,.06);
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
}

th{
background:#f7f7f7;
}

tr:hover{
background:#f9fbff;
cursor:pointer;
}

.center{
text-align:center;
padding:40px;
color:#666;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="t20-world-cup.html">T20 World Cup</a>
<a href="t20wc-matches.html">Matches</a>
<a href="t20-world-cup-player.html">Players</a>
<a href="t20wc-teams.html">Teams</a>
</div>


<div class="hero">
<h1 id="playerName">Loading...</h1>
<p id="playerCountry"></p>
</div>


<!-- CAREER SUMMARY -->
<div class="summary" id="careerSummary"></div>


<!-- OPPOSITION SUMMARY -->
<div class="section-title">VS SELECTED OPPOSITION</div>

<div class="summary" id="oppSummary"></div>


<div class="controls">

<label style="font-weight:700;">Opposition:</label>

<select id="oppFilter">
<option value="ALL">All</option>
</select>

<div id="batTab" class="tab active">Batting</div>
<div id="bowlTab" class="tab">Bowling</div>

</div>


<table>

<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th id="col1">Runs</th>
<th id="col2">Balls</th>
<th id="col3">Strike Rate</th>
</tr>
</thead>

<tbody id="tbody">
<tr>
<td colspan="7" class="center">Loading...</td>
</tr>
</tbody>

</table>


<script>

const INDEX="data/t20-world-cup/matches/index.json";
const FOLDER="data/t20-world-cup/matches/";

let matches=[];
let player="";
let country="";
let currentTab="bat";
let currentOpp="ALL";

init();

async function init(){

player=
decodeURIComponent(
new URLSearchParams(location.search)
.get("player")
);

playerName.innerText=player;

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch(FOLDER+file).then(r=>r.json());

season.forEach((match,index)=>{

let runs=0;
let balls=0;
let wkts=0;
let ballsBowled=0;
let runsConceded=0;
let team="";

Object.entries(match.info.players||{})
.forEach(([t,list])=>{
if(list.includes(player)){
team=t;
country=t;
}
});

match.innings.forEach(innRaw=>{

const inn=
innRaw.team
?innRaw
:Object.values(innRaw)[0];

let deliveries=[];

if(inn.overs)
inn.overs.forEach(o=>deliveries.push(...o.deliveries));

if(inn.deliveries)
deliveries.push(...inn.deliveries);

deliveries.forEach(d=>{

if(d.batter===player){
runs+=d.runs.batter;
if(!d.extras?.wides) balls++;
}

if(d.bowler===player){
runsConceded+=d.runs.total;
if(!d.extras?.wides&&!d.extras?.noballs) ballsBowled++;
if(d.wickets) wkts+=d.wickets.length;
}

});

});

if(balls>0 || ballsBowled>0){

const opponent=
match.info.teams.find(t=>t!==team);

matches.push({
season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent,
venue:match.info.venue,
runs,
balls,
wkts,
ballsBowled,
runsConceded,
file,
index
});

}

});

}

playerCountry.innerText=country;

populateOppFilter();

render();

}


function populateOppFilter(){

const set=new Set(matches.map(m=>m.opponent));

set.forEach(o=>{
oppFilter.innerHTML+=`<option>${o}</option>`;
});

oppFilter.onchange=e=>{
currentOpp=e.target.value;
render();
};

}


batTab.onclick=()=>{
currentTab="bat";
setTabs();
render();
};

bowlTab.onclick=()=>{
currentTab="bowl";
setTabs();
render();
};

function setTabs(){

batTab.classList.toggle("active",currentTab==="bat");
bowlTab.classList.toggle("active",currentTab==="bowl");

}


function render(){

let filtered=
currentOpp==="ALL"
?matches
:matches.filter(m=>m.opponent===currentOpp);

renderCareerSummary(matches);

renderOppSummary(filtered);

renderTable(filtered);

}


/* CAREER */

function renderCareerSummary(list){

let runs=0,balls=0,wkts=0;

list.forEach(m=>{
runs+=m.runs;
balls+=m.balls;
wkts+=m.wkts;
});

careerSummary.innerHTML=`

<div class="box">
<div class="big">${list.length}</div>
Matches
</div>

<div class="box">
<div class="big">${runs}</div>
Runs
</div>

<div class="box">
<div class="big">${balls?((runs/balls)*100).toFixed(1):"-"}</div>
Strike Rate
</div>

<div class="box">
<div class="big">${wkts}</div>
Wickets
</div>

`;

}


/* OPP SUMMARY */

function renderOppSummary(list){

let runs=0,balls=0,wkts=0;

list.forEach(m=>{
runs+=m.runs;
balls+=m.balls;
wkts+=m.wkts;
});

oppSummary.innerHTML=`

<div class="box">
<div class="big">${list.length}</div>
Matches
</div>

<div class="box">
<div class="big">${runs}</div>
Runs
</div>

<div class="box">
<div class="big">${balls?((runs/balls)*100).toFixed(1):"-"}</div>
Strike Rate
</div>

<div class="box">
<div class="big">${wkts}</div>
Wickets
</div>

`;

}


/* TABLE */

function renderTable(list){

const tbody=document.getElementById("tbody");

tbody.innerHTML="";

list.forEach(m=>{

if(currentTab==="bat" && m.balls===0) return;
if(currentTab==="bowl" && m.ballsBowled===0) return;

const tr=document.createElement("tr");

tr.onclick=()=>{
location.href=
`t20-world-cup-match.html?file=${m.file}&match=${m.index}`;
};

tr.innerHTML=currentTab==="bat"
?`
<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100).toFixed(1)}</td>
`
:`
<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.wkts}</td>
<td>${(m.ballsBowled/6).toFixed(1)}</td>
<td>${(m.runsConceded/(m.ballsBowled/6)||0).toFixed(2)}</td>
`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
