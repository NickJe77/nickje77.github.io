<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.hero-left h1{
margin:0;
font-size:42px;
}

.search-container{
position:relative;
width:300px;
}

.search-container input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
}

.search-results{
position:absolute;
top:48px;
left:0;
right:0;
background:white;
color:black;
border-radius:10px;
max-height:300px;
overflow-y:auto;
display:none;
z-index:999;
box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.search-results div{
padding:10px;
cursor:pointer;
}

.search-results div:hover{
background:#eee;
}

/* CONTROLS */

.controls{
display:flex;
gap:14px;
padding:20px;
}

.tab{
padding:8px 18px;
background:#ddd;
border-radius:8px;
cursor:pointer;
}

.tab.active{
background:#d00000;
color:white;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.box{
background:#e7e7ec;
padding:18px;
border-radius:14px;
text-align:center;
}

.box .big{
font-size:28px;
font-weight:700;
}

/* TABLE */

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

tr:hover{
background:#f8fbff;
cursor:pointer;
}

</style>
</head>
<body>


<div class="hero">

<div class="hero-left">

<h1 id="playerName">Select player</h1>

</div>

<div class="search-container">

<input id="playerSearch" placeholder="Search player...">

<div id="searchResults" class="search-results"></div>

</div>

</div>


<div class="controls">

<select id="oppFilter">
<option value="ALL">All opposition</option>
</select>

<div id="batTab" class="tab active">Batting</div>
<div id="bowlTab" class="tab">Bowling</div>

</div>


<div id="careerSummary" class="summary"></div>

<div id="oppSummary" class="summary"></div>


<table id="matchTable">

<thead>
<tr>

<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th id="col1">Runs</th>
<th id="col2">Balls</th>
<th id="col3">Strike Rate</th>

</tr>
</thead>

<tbody></tbody>

</table>


<script>

const INDEX="/data/t20-world-cup/matches/index.json";

let players=[];
let matches=[];
let career;
let oppStats={};

let currentTab="bat";
let currentOpp="ALL";


/* INIT SEARCH */

async function initSearch(){

const files=await fetch(INDEX).then(r=>r.json());

const set=new Set();

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach(match=>{

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

set.add(d.batter);
set.add(d.bowler);

});

});

});

});

}

players=[...set].sort();

}

initSearch();


/* SEARCH UI */

playerSearch.oninput=function(){

const q=this.value.toLowerCase();

if(!q){

searchResults.style.display="none";
return;

}

const filtered=players.filter(p=>p.toLowerCase().includes(q)).slice(0,30);

searchResults.innerHTML="";

filtered.forEach(name=>{

const div=document.createElement("div");

div.textContent=name;

div.onclick=()=>{

location.href="?player="+encodeURIComponent(name);

};

searchResults.appendChild(div);

});

searchResults.style.display="block";

};


/* LOAD PLAYER */

const playerParam=new URLSearchParams(location.search).get("player");

if(playerParam)
loadPlayer(playerParam);


async function loadPlayer(player){

playerName.innerText=player;

career={
matches:0,runs:0,balls:0,wkts:0,ballsBowled:0,runsConceded:0
};

matches=[];
oppStats={};

const files=await fetch(INDEX).then(r=>r.json());

let playerCountry="";

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach((match,index)=>{

const team=Object.keys(match.info.players||{})
.find(t=>match.info.players[t].includes(player));

if(team) playerCountry=team;

let runs=0,balls=0,wkts=0,ballsBowled=0,runsConceded=0;

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

if(d.batter===player){
runs+=d.runs.batter;
if(!d.extras?.wides) balls++;
}

if(d.bowler===player){
runsConceded+=d.runs.total;
if(!d.extras?.wides&&!d.extras?.noballs) ballsBowled++;
if(d.wickets) wkts+=d.wickets.length;
}

});

});

});

if(runs||wkts){

const opponent=match.info.teams.find(t=>t!==playerCountry);

matches.push({

season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent,
venue:match.info.venue,
runs,
balls,
wkts,
ballsBowled,
runsConceded,
file,
index

});

career.matches++;
career.runs+=runs;
career.balls+=balls;
career.wkts+=wkts;

}

});

}

renderTable();

}


/* TABLE */

function renderTable(){

const tbody=document.querySelector("#matchTable tbody");

tbody.innerHTML="";

matches.forEach(m=>{

const tr=document.createElement("tr");

tr.onclick=()=>{

location.href=`t20-world-cup-match.html?file=${m.file}&match=${m.index}`;

};

tr.innerHTML=currentTab==="bat"

?`

<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100||0).toFixed(1)}</td>

`

:

`

<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.wkts}</td>
<td>${(m.ballsBowled/6).toFixed(1)}</td>
<td>${(m.runsConceded/(m.ballsBowled/6)||0).toFixed(2)}</td>

`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
