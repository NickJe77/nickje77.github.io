<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.navbar a{
text-decoration:none;
color:#0056d6;
}

.page{
max-width:1200px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

.table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:12px;
overflow:hidden;
}

.table th{
background:#e10600;
color:#fff;
padding:12px;
text-align:left;
}

.table td{
padding:10px;
border-bottom:1px solid #eee;
}

.table tr:nth-child(even){
background:#eef3f9;
}

.loading{
font-size:20px;
padding:40px;
text-align:center;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div id="hero" class="hero">Loading player...</div>

<div id="stats"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const playerName = params.get("player");

if(!playerName){

document.getElementById("hero").innerHTML="Invalid player link";
throw new Error("Missing player");

}

document.getElementById("hero").innerHTML=playerName;

loadPlayer();

async function loadPlayer(){

const indexRes = await fetch("data/t20-world-cup/matches/index.json");
const files = await indexRes.json();

const filePromises = files.map(f =>
fetch("data/t20-world-cup/matches/"+f).then(r=>r.json())
);

const allData = await Promise.all(filePromises);

let inningsList=[];

for(const season of allData){

for(const match of season){

for(const innings of match.innings){

const team=Object.values(innings)[0];

if(!team.batting) continue;

for(const batter of team.batting){

if(batter.batter===playerName){

inningsList.push({

date:match.info.dates[0],
team:team.team,
runs:batter.runs,
balls:batter.balls,
dismissal:batter.dismissal||"not out",
opposition:
match.info.teams.find(t=>t!==team.team)

});

}

}

}

}

}

renderStats(inningsList);

}

function renderStats(list){

if(list.length===0){

document.getElementById("stats").innerHTML=
"<div class='loading'>No data found</div>";
return;

}

let html=`
<table class="table">
<tr>
<th>Date</th>
<th>Team</th>
<th>Opposition</th>
<th>Runs</th>
<th>Balls</th>
<th>Dismissal</th>
</tr>
`;

for(const i of list){

html+=`
<tr>
<td>${i.date}</td>
<td>${i.team}</td>
<td>${i.opposition}</td>
<td>${i.runs}</td>
<td>${i.balls}</td>
<td>${i.dismissal}</td>
</tr>
`;

}

html+="</table>";

document.getElementById("stats").innerHTML=html;

}

</script>

</body>
</html>
