<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
}

/* HERO */

.hero{
background:white;
padding:24px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
}

.hero-title{
font-size:42px;
font-weight:800;
}

/* PLAYER SEARCH */

.search-wrap{
position:relative;
width:320px;
}

.search-wrap input{
width:100%;
padding:12px;
font-size:16px;
border-radius:12px;
border:1px solid #ccc;
}

.search-results{
position:absolute;
background:white;
width:100%;
border:1px solid #ccc;
border-radius:10px;
max-height:400px;
overflow-y:auto;
display:none;
z-index:1000;
}

.search-results div{
padding:10px;
cursor:pointer;
}

.search-results div:hover{
background:#f0f6ff;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.summary-box{
background:#e7e7ec;
padding:12px;
border-radius:10px;
text-align:center;
}

/* OPPOSITION FILTER */

.filter-row{
display:flex;
align-items:center;
gap:12px;
padding:0 20px 10px 20px;
}

.filter-row select{
padding:8px 12px;
font-size:16px;
border-radius:8px;
}

/* TABLE */

.container{
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

.match-link{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

</style>
</head>

<body>

<div class="navbar">

<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>

</div>


<div class="hero">

<div id="playerName" class="hero-title">
Select a player
</div>

<div class="search-wrap">

<input id="playerSearch" placeholder="Search player...">

<div id="searchResults" class="search-results"></div>

</div>

</div>


<!-- CAREER SUMMARY -->

<div id="careerSummary" class="summary"></div>


<!-- OPPOSITION FILTER -->

<div class="filter-row">

<label><strong>Against opposition:</strong></label>

<select id="oppositionFilter">

<option value="ALL">All opponents</option>

</select>

</div>


<!-- OPPOSITION SUMMARY -->

<div id="oppositionSummary" class="summary"></div>


<!-- MATCH TABLE -->

<div class="container">

<table id="matchTable">

<tr>

<th>Date</th>
<th>Match</th>
<th>Runs</th>
<th>Balls</th>
<th>Wickets</th>
<th>Overs</th>

</tr>

</table>

</div>


<script>

const INDEX="/data/t20-world-cup/matches/index.json";

let allPlayers=[];
let allMatches=[];
let oppositionStats={};
let careerStats={runs:0,balls:0,wkts:0,ballsBowled:0,matches:0};
let playerCountry="";

initSearch();

loadPlayerFromURL();


/* PLAYER SEARCH */

async function initSearch(){

const files=await fetch(INDEX).then(r=>r.json());

const set=new Set();

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach(match=>{

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

set.add(d.batter);
set.add(d.bowler);

});

});

});

});

}

allPlayers=[...set].sort();

}


const input=document.getElementById("playerSearch");
const results=document.getElementById("searchResults");

input.oninput=function(){

const q=this.value.toLowerCase();

if(!q){
results.style.display="none";
return;
}

const filtered=allPlayers.filter(p=>p.toLowerCase().includes(q)).slice(0,50);

results.innerHTML="";

filtered.forEach(name=>{

const div=document.createElement("div");

div.textContent=name;

div.onclick=()=>{

location.href="?player="+encodeURIComponent(name);

};

results.appendChild(div);

});

results.style.display="block";

};


/* LOAD PLAYER */

function loadPlayerFromURL(){

const params=new URLSearchParams(location.search);

const player=params.get("player");

if(player)
loadPlayer(player);

}


async function loadPlayer(player){

resetStats();

document.getElementById("playerName").innerText=player;

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach((match,index)=>{

let runs=0,balls=0,wkts=0,ballsBowled=0;

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

if(d.batter===player){

runs+=d.runs.batter;

if(!d.extras?.wides)
balls++;

playerCountry=inn.team;

}

if(d.bowler===player){

if(!d.extras?.wides && !d.extras?.noballs)
ballsBowled++;

if(d.wickets)
wkts+=d.wickets.length;

playerCountry=inn.team;

}

});

});

});

if(runs||wkts){

const opponent=match.info.teams.find(t=>t!==playerCountry);

careerStats.runs+=runs;
careerStats.balls+=balls;
careerStats.wkts+=wkts;
careerStats.ballsBowled+=ballsBowled;
careerStats.matches++;

allMatches.push({match,file,index,runs,balls,wkts,ballsBowled,opponent});

if(!oppositionStats[opponent])
oppositionStats[opponent]={runs:0,balls:0,wkts:0,matches:0};

oppositionStats[opponent].runs+=runs;
oppositionStats[opponent].balls+=balls;
oppositionStats[opponent].wkts+=wkts;
oppositionStats[opponent].matches++;

}

});

}

document.getElementById("playerName").innerText=
player+" ("+playerCountry+")";

renderCareer();

renderOppositionDropdown();

renderOpposition("ALL");

renderMatches("ALL");

}


/* CAREER */

function renderCareer(){

document.getElementById("careerSummary").innerHTML=`

<div class="summary-box">Matches<br><strong>${careerStats.matches}</strong></div>

<div class="summary-box">Runs<br><strong>${careerStats.runs}</strong></div>

<div class="summary-box">Average<br><strong>${(careerStats.runs/careerStats.matches||0).toFixed(1)}</strong></div>

<div class="summary-box">Strike Rate<br><strong>${((careerStats.runs/careerStats.balls)*100||0).toFixed(1)}</strong></div>

<div class="summary-box">Wickets<br><strong>${careerStats.wkts}</strong></div>

`;

}


/* OPPOSITION DROPDOWN */

function renderOppositionDropdown(){

const select=document.getElementById("oppositionFilter");

select.innerHTML='<option value="ALL">All opponents</option>';

Object.keys(oppositionStats).sort().forEach(team=>{

const opt=document.createElement("option");

opt.value=team;
opt.textContent=team;

select.appendChild(opt);

});

select.onchange=e=>{

renderOpposition(e.target.value);
renderMatches(e.target.value);

};

}


/* OPPOSITION SUMMARY */

function renderOpposition(team){

let s;

if(team==="ALL") s=careerStats;
else s=oppositionStats[team];

document.getElementById("oppositionSummary").innerHTML=`

<div class="summary-box">Matches<br><strong>${s.matches}</strong></div>

<div class="summary-box">Runs<br><strong>${s.runs}</strong></div>

<div class="summary-box">Average<br><strong>${(s.runs/s.matches||0).toFixed(1)}</strong></div>

<div class="summary-box">Strike Rate<br><strong>${((s.runs/s.balls)*100||0).toFixed(1)}</strong></div>

<div class="summary-box">Wickets<br><strong>${s.wkts}</strong></div>

`;

}


/* MATCH TABLE */

function renderMatches(team){

const table=document.getElementById("matchTable");

table.innerHTML=table.rows[0].outerHTML;

allMatches.forEach(m=>{

if(team!=="ALL" && m.opponent!==team) return;

const row=document.createElement("tr");

row.innerHTML=`

<td>${new Date(m.match.info.dates[0]).toLocaleDateString("en-GB")}</td>

<td>
<a href="t20-world-cup-match.html?file=${m.file}&match=${m.index}" class="match-link">
${m.match.info.teams.join(" vs ")}
</a>
</td>

<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${m.wkts}</td>
<td>${Math.floor(m.ballsBowled/6)+"."+(m.ballsBowled%6)}</td>

`;

table.appendChild(row);

});

}


/* RESET */

function resetStats(){

careerStats={runs:0,balls:0,wkts:0,ballsBowled:0,matches:0};
allMatches=[];
oppositionStats={};

}

</script>

</body>
</html>
