<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
background:white;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:20px;
}

.hero-left{
flex:1;
text-align:center;
}

.hero-left h1{
margin:0;
font-size:42px;
}

.flag{
width:60px;
margin-top:10px;
border-radius:6px;
}

/* SEARCH */

.hero-search{
width:280px;
position:relative;
}

.hero-search input{
width:100%;
padding:12px;
font-size:16px;
border-radius:10px;
border:none;
}

.search-results{
position:absolute;
top:48px;
background:white;
width:100%;
border-radius:10px;
box-shadow:0 4px 12px rgba(0,0,0,.2);
max-height:300px;
overflow:auto;
display:none;
z-index:999;
}

.search-results div{
padding:10px;
cursor:pointer;
}

.search-results div:hover{
background:#eee;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:16px;
padding:0 20px;
margin-top:14px;
}

.box{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.big{
font-size:28px;
font-weight:700;
color:#d00000;
}

/* TABLE */

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:14px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:center;
}

.center{
padding:40px;
color:#666;
}

</style>
</head>
<body>


<div class="navbar">

<a href="index.html">Home</a>
<a href="t20-world-cup.html">T20 World Cup</a>
<a href="t20wc-matches.html">Matches</a>
<a href="t20-world-cup-player.html">Players</a>
<a href="t20wc-teams.html">Teams</a>

</div>


<div class="hero">

<div class="hero-left">

<h1 id="playerName">Select Player</h1>

<img id="flag" class="flag">

</div>


<div class="hero-search">

<input id="playerSearch" placeholder="Search player...">

<div id="searchResults" class="search-results"></div>

</div>

</div>


<div id="careerSummary" class="summary"></div>


<table>

<thead>

<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Runs</th>
<th>Balls</th>
<th>Strike Rate</th>
</tr>

</thead>

<tbody id="tbody">

<tr>
<td colspan="7" class="center">
Search and select a player
</td>
</tr>

</tbody>

</table>


<script>

const INDEX="data/t20-world-cup/matches/index.json";
const PLAYER_NAMES="data/t20-world-cup/players-name.json";
const FOLDER="data/t20-world-cup/matches/";

let playerMap={};
let playerKeys=[];
let matches=[];
let country="";


window.addEventListener("DOMContentLoaded",()=>{

loadSearch();

const param=new URLSearchParams(location.search).get("player");

if(param)
loadPlayer(decodeURIComponent(param));

});


/* LOAD SEARCH */

async function loadSearch(){

const data=await fetch(PLAYER_NAMES).then(r=>r.json());

playerMap=data;

playerKeys=Object.keys(data).sort();

const input=document.getElementById("playerSearch");
const results=document.getElementById("searchResults");

input.oninput=function(){

const q=this.value.toLowerCase();

if(!q){
results.style.display="none";
return;
}

results.innerHTML="";

playerKeys
.filter(raw=>raw.toLowerCase().includes(q) || playerMap[raw].toLowerCase().includes(q))
.slice(0,30)
.forEach(raw=>{

const div=document.createElement("div");

div.innerText=playerMap[raw];

div.onclick=()=>{
location.href=`t20-world-cup-player.html?player=${encodeURIComponent(raw)}`;
};

results.appendChild(div);

});

results.style.display="block";

};

}


/* LOAD PLAYER */

async function loadPlayer(player){

playerName.innerText=playerMap[player] || player;

matches=[];

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch(FOLDER+file).then(r=>r.json());

season.forEach((match,index)=>{

let runs=0,balls=0,team="";

Object.entries(match.info.players||{})
.forEach(([t,list])=>{
if(list.includes(player)){
team=t;
country=t;
}
});

match.innings.forEach(innRaw=>{

const inn=innRaw.team?innRaw:Object.values(innRaw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

if(d.batter===player){
runs+=d.runs.batter;
if(!d.extras?.wides) balls++;
}

});

});

});

if(balls>0){

const opponent=match.info.teams.find(t=>t!==team);

matches.push({
season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent,
venue:match.info.venue,
runs,
balls,
file,
index
});

}

});

}

flag.src=`https://flagcdn.com/w80/${code(country)}.png`;

renderSummary();
renderTable();

}


/* SUMMARY */

function renderSummary(){

let runs=0,balls=0;

matches.forEach(m=>{
runs+=m.runs;
balls+=m.balls;
});

careerSummary.innerHTML=`

<div class="box"><div class="big">${matches.length}</div>Matches</div>

<div class="box"><div class="big">${runs}</div>Runs</div>

<div class="box"><div class="big">${balls?((runs/balls)*100).toFixed(1):"-"}</div>Strike Rate</div>

`;

}


/* TABLE */

function renderTable(){

tbody.innerHTML="";

matches.forEach(m=>{

const tr=document.createElement("tr");

tr.onclick=()=>{
location.href=`t20-world-cup-match.html?file=${m.file}&match=${m.index}`;
};

tr.innerHTML=`
<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100).toFixed(1)}</td>
`;

tbody.appendChild(tr);

});

}


/* COUNTRY CODE */

function code(name){

const map={
India:"in",
Australia:"au",
England:"gb",
Pakistan:"pk",
South Africa:"za",
New Zealand:"nz",
Sri Lanka:"lk",
West Indies:"jm",
Afghanistan:"af",
Bangladesh:"bd"
};

return map[name]||"un";

}

</script>

</body>
</html>
