<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup | The Sporting Almanac</title>

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f3f4f7;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:40px;
margin:20px;
border-radius:18px;
font-size:42px;
font-weight:700;
}

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

th{
background:#eee;
}

a{
color:#d00000;
font-weight:600;
text-decoration:none;
}

a:hover{
text-decoration:underline;
}

</style>
</head>
<body>

<div class="hero">
ICC Men's T20 World Cup
</div>

<table>

<thead>
<tr>
<th>Season</th>
<th>Winner</th>
<th>Most Runs</th>
<th>Most Wickets</th>
</tr>
</thead>

<tbody id="tbody">

<tr>
<td colspan="4">Loading...</td>
</tr>

</tbody>

</table>


<script>

const SUMMARY_FILE =
"data/t20-world-cup/summary.json";

const NAME_MAP_FILE =
"data/t20-world-cup/matches/player-names.json";

let nameMap={};

init();

async function init()
{

/* LOAD NAME MAP */

nameMap =
await fetch(NAME_MAP_FILE)
.then(r=>r.json());

/* LOAD SUMMARY */

const summary =
await fetch(SUMMARY_FILE)
.then(r=>r.json());

render(summary);

}


function displayName(raw)
{
return nameMap[raw] || raw;
}


function playerLink(raw)
{
return `
<a href="t20-world-cup-player.html?player=${encodeURIComponent(raw)}">
${displayName(raw)}
</a>
`;
}


function teamLink(team)
{
return `
<a href="t20wc-team.html?team=${encodeURIComponent(team)}">
${team}
</a>
`;
}


function render(data)
{

const tbody =
document.getElementById("tbody");

tbody.innerHTML="";

data.forEach(row=>{

const tr =
document.createElement("tr");

tr.innerHTML=`

<td>${row.season}</td>

<td>
${teamLink(row.winner)}
</td>

<td>
${playerLink(row.most_runs)}
</td>

<td>
${playerLink(row.most_wickets)}
</td>

`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
