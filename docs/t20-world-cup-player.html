<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
background:white;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* PAGE LAYOUT */

.page{
display:flex;
gap:20px;
padding:20px;
}

/* LEFT SIDEBAR */

.sidebar{
width:280px;
background:white;
padding:16px;
border-radius:14px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
height:fit-content;
}

.sidebar input{
width:100%;
padding:12px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:10px;
}

.search-results{
max-height:400px;
overflow:auto;
}

.search-results div{
padding:8px;
cursor:pointer;
border-radius:6px;
}

.search-results div:hover{
background:#f0f0f0;
}

/* MAIN CONTENT */

.content{
flex:1;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:40px;
border-radius:18px;
text-align:center;
position:relative;
}

.flag{
position:absolute;
right:20px;
top:20px;
width:60px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,.3);
}

.hero h1{
margin:0;
font-size:44px;
}

.hero p{
margin-top:6px;
font-size:18px;
opacity:.9;
}

/* SUMMARY BOXES */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:16px;
margin-top:20px;
}

.box{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.box .big{
font-size:28px;
font-weight:700;
color:#d00000;
}

/* CONTROLS */

.controls{
display:flex;
gap:12px;
margin-top:20px;
align-items:center;
flex-wrap:wrap;
}

select{
padding:14px;
font-size:18px;
border-radius:8px;
border:1px solid #ccc;
}

/* TABS */

.tab{
padding:12px 20px;
border-radius:8px;
background:#ddd;
cursor:pointer;
font-weight:700;
}

.tab.active{
background:#d00000;
color:white;
}

/* TABLE */

table{
width:100%;
margin-top:20px;
background:white;
border-collapse:collapse;
border-radius:14px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:center;
}

th{
background:#f5f5f5;
}

tr:hover{
background:#f9fbff;
cursor:pointer;
}

.center{
padding:40px;
color:#666;
}

/* MOBILE */

@media(max-width:900px){

.page{
flex-direction:column;
}

.sidebar{
width:100%;
}

.flag{
position:static;
margin-top:10px;
}

.hero{
text-align:center;
}

}

</style>
</head>
<body>

<div class="navbar">

<a href="index.html">Home</a>
<a href="t20-world-cup.html">T20 World Cup</a>
<a href="t20wc-matches.html">Matches</a>
<a href="t20-world-cup-player.html">Players</a>
<a href="t20wc-teams.html">Teams</a>

</div>


<div class="page">


<!-- SIDEBAR SEARCH -->

<div class="sidebar">

<input id="playerSearch" placeholder="Search player...">

<div id="searchResults" class="search-results"></div>

</div>


<!-- MAIN CONTENT -->

<div class="content">


<div class="hero">

<img id="flag" class="flag">

<h1 id="playerName">Loading...</h1>

<p id="playerCountry"></p>

</div>


<div class="summary" id="careerSummary"></div>


<div class="summary" id="oppSummary"></div>


<div class="controls">

<label>Opposition:</label>

<select id="oppFilter">

<option value="ALL">All</option>

</select>

<div id="batTab" class="tab active">Batting</div>

<div id="bowlTab" class="tab">Bowling</div>

</div>


<table>

<thead>

<tr>

<th>Season</th>

<th>Date</th>

<th>Opponent</th>

<th>Venue</th>

<th>Runs</th>

<th>Balls</th>

<th>Strike Rate</th>

</tr>

</thead>

<tbody id="tbody">

<tr>

<td colspan="7" class="center">Loading...</td>

</tr>

</tbody>

</table>


</div>
</div>


<script>

const INDEX="data/t20-world-cup/matches/index.json";
const FOLDER="data/t20-world-cup/matches/";

let matches=[];
let players=[];
let country="";
let player="";

init();


async function init(){

player=decodeURIComponent(
new URLSearchParams(location.search)
.get("player")
);

playerName.innerText=player;

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch(FOLDER+file).then(r=>r.json());

season.forEach((match,index)=>{

let runs=0,balls=0,wkts=0;

Object.entries(match.info.players||{})
.forEach(([team,list])=>{
if(list.includes(player)) country=team;
});

match.innings.forEach(innRaw=>{

const inn=innRaw.team?innRaw:Object.values(innRaw)[0];

let deliveries=[];

if(inn.overs)
inn.overs.forEach(o=>deliveries.push(...o.deliveries));

deliveries.forEach(d=>{

players.push(d.batter);
players.push(d.bowler);

if(d.batter===player){
runs+=d.runs.batter;
if(!d.extras?.wides) balls++;
}

});

});

if(balls>0){

const opponent=match.info.teams.find(t=>t!==country);

matches.push({
season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent,
venue:match.info.venue,
runs,
balls,
file,
index
});

}

});

}


playerCountry.innerText=country;

flag.src=`https://flagcdn.com/w80/${countryCode(country)}.png`;

initSearch();

populateOppFilter();

render();

}


function countryCode(name){

const map={

India:"in",
Australia:"au",
England:"gb",
Pakistan:"pk",
South Africa:"za",
New Zealand:"nz",
Sri Lanka:"lk",
West Indies:"jm",
Afghanistan:"af",
Bangladesh:"bd"

};

return map[name]||"un";

}


/* SEARCH */

function initSearch(){

players=[...new Set(players)].sort();

playerSearch.oninput=function(){

const q=this.value.toLowerCase();

searchResults.innerHTML="";

players
.filter(p=>p.toLowerCase().includes(q))
.slice(0,30)
.forEach(p=>{

const div=document.createElement("div");

div.innerText=p;

div.onclick=()=>location.href=
`t20-world-cup-player.html?player=${encodeURIComponent(p)}`;

searchResults.appendChild(div);

});

};

}


/* FILTER */

function populateOppFilter(){

const set=new Set(matches.map(m=>m.opponent));

set.forEach(o=>oppFilter.innerHTML+=`<option>${o}</option>`);

oppFilter.onchange=render;

}


/* SUMMARY + TABLE */

function render(){

const opp=oppFilter.value;

const list=opp==="ALL"?matches:matches.filter(m=>m.opponent===opp);

careerSummary.innerHTML=summaryBox(matches);

oppSummary.innerHTML=summaryBox(list);

renderTable(list);

}


function summaryBox(list){

let runs=0,balls=0;

list.forEach(m=>{

runs+=m.runs;
balls+=m.balls;

});

return `

<div class="box">

<div class="big">${list.length}</div>

Matches

</div>

<div class="box">

<div class="big">${runs}</div>

Runs

</div>

<div class="box">

<div class="big">${balls?((runs/balls)*100).toFixed(1):"-"}</div>

Strike Rate

</div>

`;

}


function renderTable(list){

tbody.innerHTML="";

if(!list.length){

tbody.innerHTML=
`<tr><td colspan="7" class="center">No matches found</td></tr>`;

return;

}

list.forEach(m=>{

const tr=document.createElement("tr");

tr.onclick=()=>location.href=
`t20-world-cup-match.html?file=${m.file}&match=${m.index}`;

tr.innerHTML=`

<td>${m.season}</td>

<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>

<td>${m.opponent}</td>

<td>${m.venue}</td>

<td>${m.runs}</td>

<td>${m.balls}</td>

<td>${((m.runs/m.balls)*100).toFixed(1)}</td>

`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
