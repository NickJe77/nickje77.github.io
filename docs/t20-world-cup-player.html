<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* LAYOUT */

.layout{
display:flex;
}

/* SIDEBAR */

.sidebar{
width:280px;
background:white;
border-right:1px solid #ddd;
height:100vh;
overflow-y:auto;
position:sticky;
top:0;
}

.search-box{
padding:12px;
border-bottom:1px solid #ddd;
}

.search-box input{
width:100%;
padding:8px;
font-size:16px;
}

.player-list{
list-style:none;
padding:0;
margin:0;
}

.player-list li{
padding:10px 14px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.player-list li:hover{
background:#f0f6ff;
}

/* MAIN */

.main{
flex:1;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:28px;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.summary-box{
background:#e7e7ec;
padding:12px;
border-radius:10px;
text-align:center;
}

/* TABLE */

.container{
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

.match-link{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

</style>
</head>

<body>

<div class="layout">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="search-box">

<input type="text" id="playerSearch" placeholder="Search player...">

</div>

<ul id="playerList" class="player-list"></ul>

</div>

<!-- MAIN -->

<div class="main">

<div class="navbar">

<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>

</div>

<div class="hero">

<h1 id="playerName">Select player</h1>

</div>

<div class="summary" id="careerSummary"></div>

<div class="container">

<table id="matchTable">

<tr>

<th>Date</th>
<th>Match</th>
<th>Runs</th>
<th>Balls</th>
<th>Wickets</th>
<th>Overs</th>

</tr>

</table>

</div>

</div>

</div>

<script>

const INDEX="/data/t20-world-cup/matches/index.json";

let allPlayers=[];
let playerStats={};

initSidebar();


async function initSidebar(){

const files=await fetch(INDEX).then(r=>r.json());

const playerSet=new Set();

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach(match=>{

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

playerSet.add(d.batter);
playerSet.add(d.bowler);

});

});

});

});

}

allPlayers=[...playerSet].sort();

renderPlayerList(allPlayers);

}


/* RENDER LIST */

function renderPlayerList(players){

const list=document.getElementById("playerList");

list.innerHTML="";

players.forEach(name=>{

const li=document.createElement("li");

li.textContent=name;

li.onclick=()=>{

location.href="t20-world-cup-player.html?player="+encodeURIComponent(name);

};

list.appendChild(li);

});

}


/* SEARCH */

document.getElementById("playerSearch").oninput=e=>{

const q=e.target.value.toLowerCase();

renderPlayerList(allPlayers.filter(p=>
p.toLowerCase().includes(q)
));

};


/* LOAD SELECTED PLAYER */

const params=new URLSearchParams(location.search);

const player=params.get("player");

if(player){

document.getElementById("playerName").innerText=player;

loadPlayer(player);

}


async function loadPlayer(player){

const files=await fetch(INDEX).then(r=>r.json());

let runs=0,balls=0,wkts=0,ballsBowled=0,matches=0;

const table=document.getElementById("matchTable");

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach((match,index)=>{

let r=0,b=0,w=0,bb=0;

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

if(d.batter===player){

r+=d.runs.batter;

if(!d.extras?.wides)
b++;

}

if(d.bowler===player){

if(!d.extras?.wides && !d.extras?.noballs)
bb++;

if(d.wickets)
w+=d.wickets.length;

}

});

});

});

if(r||w){

runs+=r;
balls+=b;
wkts+=w;
ballsBowled+=bb;
matches++;

const row=document.createElement("tr");

row.innerHTML=`

<td>${formatDate(match.info.dates[0])}</td>

<td>
<a href="t20-world-cup-match.html?file=${file}&match=${index}" class="match-link">
${match.info.teams.join(" vs ")}
</a>
</td>

<td>${r}</td>
<td>${b}</td>
<td>${w}</td>
<td>${formatOvers(bb)}</td>

`;

table.appendChild(row);

}

});

}

renderSummary(matches,runs,balls,wkts);

}


function renderSummary(matches,runs,balls,wkts){

document.getElementById("careerSummary").innerHTML=`

<div class="summary-box">Matches<br><strong>${matches}</strong></div>

<div class="summary-box">Runs<br><strong>${runs}</strong></div>

<div class="summary-box">Average<br><strong>${(runs/matches||0).toFixed(1)}</strong></div>

<div class="summary-box">Strike Rate<br><strong>${((runs/balls)*100||0).toFixed(1)}</strong></div>

<div class="summary-box">Wickets<br><strong>${wkts}</strong></div>

`;

}


/* HELPERS */

function formatDate(d){

return new Date(d).toLocaleDateString("en-GB");

}

function formatOvers(balls){

return Math.floor(balls/6)+"."+(balls%6);

}

</script>

</body>
</html>
