<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:white;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.hero-left{
flex:1;
text-align:center;
}

.hero-left h1{
margin:0;
font-size:42px;
}

.hero-search{
width:300px;
position:relative;
}

.hero-search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
}

.search-results{
position:absolute;
top:48px;
background:white;
color:black;
width:100%;
border-radius:10px;
max-height:300px;
overflow:auto;
display:none;
box-shadow:0 4px 12px rgba(0,0,0,.2);
z-index:999;
}

.search-results div{
padding:10px;
cursor:pointer;
}

.search-results div:hover{
background:#eee;
}

.controls{
padding:0 20px;
display:flex;
gap:20px;
align-items:center;
flex-wrap:wrap;
}

select{
padding:12px;
font-size:18px;
border-radius:10px;
}

.section-title{
text-align:center;
font-weight:700;
margin-top:20px;
color:#666;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:16px;
padding:20px;
}

.box{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
}

.big{
font-size:26px;
font-weight:700;
color:#d00000;
}

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

</style>
</head>
<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/t20-world-cup.html">T20 World Cup</a>
<a href="/t20wc-matches.html">Matches</a>
<a href="/t20-world-cup-player.html">Players</a>
<a href="/t20wc-teams.html">Teams</a>
</div>

<div class="hero">

<div class="hero-left">
<h1 id="playerName">Select Player</h1>
</div>

<div class="hero-search">
<input id="playerSearch" placeholder="Search player...">
<div id="searchResults" class="search-results"></div>
</div>

</div>

<div class="controls">

<select id="oppFilter">
<option value="ALL">All Opponents</option>
</select>

</div>

<div class="section-title">CAREER SUMMARY</div>
<div id="careerSummary" class="summary"></div>

<div class="section-title">VS SELECTED OPPONENT</div>
<div id="oppSummary" class="summary"></div>

<table>

<thead>

<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Runs</th>
<th>Balls</th>
<th>Strike Rate</th>
</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

<script>

const INDEX="/data/t20-world-cup/matches/index.json";
const BASE="/data/t20-world-cup/matches/";

const input=document.getElementById("playerSearch");
const results=document.getElementById("searchResults");

let players=[];
let matches=[];
let currentOpp="ALL";

/* SEARCH */

input.oninput=function(){

const q=this.value.toLowerCase();

results.innerHTML="";

if(!q) return;

players
.filter(p=>p.toLowerCase().includes(q))
.slice(0,30)
.forEach(name=>{

const div=document.createElement("div");

div.innerText=name;

div.onclick=()=>{
window.location.href="/t20-world-cup-player.html?player="+encodeURIComponent(name);
};

results.appendChild(div);

});

results.style.display="block";

};

/* LOAD PLAYER INDEX */

(async function(){

const files=await fetch(INDEX).then(r=>r.json());

let set=new Set();

for(const file of files){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{
Object.values(match.info.players)
.forEach(team=>team.forEach(p=>set.add(p)));
});

}

players=[...set].sort();

})();

/* LOAD PLAYER FROM URL */

const playerParam=new URLSearchParams(window.location.search).get("player");

if(playerParam) loadPlayer(playerParam);

async function loadPlayer(player){

document.getElementById("playerName").innerText=player;

matches=[];

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{

let team="";

Object.entries(match.info.players)
.forEach(([t,list])=>{
if(list.includes(player)) team=t;
});

if(!team) return;

let runs=0,balls=0;

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs.forEach(over=>{

over.deliveries.forEach(ball=>{

if(ball.batter===player){

runs+=ball.runs.batter;

if(!ball.extras?.wides) balls++;

}

});

});

});

matches.push({

season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent:match.info.teams.find(t=>t!==team),
venue:match.info.venue,
runs,
balls

});

});

}

populateOppFilter();
render();

}

/* FILTER */

function populateOppFilter(){

const set=new Set(matches.map(m=>m.opponent));

const opp=document.getElementById("oppFilter");

opp.innerHTML='<option value="ALL">All Opponents</option>';

set.forEach(o=>{
opp.innerHTML+=`<option>${o}</option>`;
});

opp.onchange=e=>{
currentOpp=e.target.value;
render();
};

}

/* RENDER */

function render(){

const filtered=currentOpp==="ALL"
?matches
:matches.filter(m=>m.opponent===currentOpp);

renderCareerSummary();
renderOppSummary(filtered);
renderTable(filtered);

}

/* SUMMARY */

function renderCareerSummary(){

let runs=0,balls=0;

matches.forEach(m=>{
runs+=m.runs;
balls+=m.balls;
});

careerSummary.innerHTML=`
<div class="box"><div class="big">${matches.length}</div>Matches</div>
<div class="box"><div class="big">${runs}</div>Runs</div>
<div class="box"><div class="big">${((runs/balls)*100||0).toFixed(1)}</div>Strike Rate</div>
`;

}

function renderOppSummary(list){

let runs=0,balls=0;

list.forEach(m=>{
runs+=m.runs;
balls+=m.balls;
});

oppSummary.innerHTML=`
<div class="box"><div class="big">${list.length}</div>Matches</div>
<div class="box"><div class="big">${runs}</div>Runs</div>
<div class="box"><div class="big">${((runs/balls)*100||0).toFixed(1)}</div>Strike Rate</div>
`;

}

/* TABLE */

function renderTable(list){

const tbody=document.getElementById("tbody");

tbody.innerHTML="";

list.forEach(m=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString()}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100||0).toFixed(1)}</td>
`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
