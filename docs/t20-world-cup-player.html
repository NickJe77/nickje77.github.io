<script>

const INDEX="/data/t20-world-cup/matches/index.json";
const FOLDER="/data/t20-world-cup/matches/";

const input=document.getElementById("playerSearch");
const results=document.getElementById("searchResults");

let players=[];
let matches=[];
let country="";


/* BUILD SEARCH */

buildSearch();

async function buildSearch(){

const files=await fetch(INDEX).then(r=>r.json());

let set=new Set();

for(const file of files){

const season=await fetch(FOLDER+file).then(r=>r.json());

season.forEach(match=>{

Object.values(match.info.players)
.forEach(team=>{
team.forEach(name=>set.add(name));
});

});

}

players=[...set].sort();

input.oninput=function(){

const q=this.value.toLowerCase();

results.innerHTML="";

if(!q){
results.style.display="none";
return;
}

players
.filter(name=>name.toLowerCase().includes(q))
.slice(0,30)
.forEach(name=>{

const div=document.createElement("div");

div.textContent=name;

div.onclick=()=>{
location.href=`/t20-world-cup-player.html?player=${encodeURIComponent(name)}`;
};

results.appendChild(div);

});

results.style.display="block";

};

}


/* LOAD PLAYER */

const param=new URLSearchParams(location.search).get("player");

if(param) loadPlayer(decodeURIComponent(param));


async function loadPlayer(player){

document.getElementById("playerName").innerText=player;

matches=[];

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch(FOLDER+file).then(r=>r.json());

season.forEach(match=>{

let runs=0;
let balls=0;
let team="";

Object.entries(match.info.players)
.forEach(([t,list])=>{
if(list.includes(player)){
team=t;
country=t;
}
});

/* HANDLE BOTH INNINGS FORMATS */

match.innings.forEach(raw=>{

const inn = raw.team ? raw : Object.values(raw)[0];

if(!inn.overs) return;

inn.overs.forEach(over=>{

over.deliveries.forEach(ball=>{

if(ball.batter===player){

runs+=ball.runs.batter;

if(!ball.extras?.wides) balls++;

}

});

});

});

if(balls>0){

const opponent=match.info.teams.find(t=>t!==team);

matches.push({
season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent,
venue:match.info.venue,
runs,
balls
});

}

});

}

renderSummary();

renderTable();

document.getElementById("flag").src=
`https://flagcdn.com/w80/${code(country)}.png`;

}


function renderSummary(){

let runs=0,balls=0;

matches.forEach(m=>{
runs+=m.runs;
balls+=m.balls;
});

document.getElementById("careerSummary").innerHTML=
`
<div class="box"><div class="big">${matches.length}</div>Matches</div>
<div class="box"><div class="big">${runs}</div>Runs</div>
<div class="box"><div class="big">${balls?((runs/balls)*100).toFixed(1):"-"}</div>Strike Rate</div>
`;

}


function renderTable(){

const tbody=document.getElementById("tbody");

tbody.innerHTML="";

matches.forEach(m=>{

const tr=document.createElement("tr");

tr.innerHTML=
`
<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100).toFixed(1)}</td>
`;

tbody.appendChild(tr);

});

}


function code(name){

const map={
India:"in",
Australia:"au",
England:"gb",
Pakistan:"pk",
South Africa:"za",
New Zealand:"nz",
Sri Lanka:"lk",
West Indies:"jm",
Afghanistan:"af",
Bangladesh:"bd"
};

return map[name]||"un";

}

</script>
