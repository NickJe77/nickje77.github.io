<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f3f4f7;
color:#111;
}

/* NAV */

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:white;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.hero-left{
flex:1;
text-align:center;
}

.hero-left h1{
margin:0;
font-size:42px;
}

.flag{
width:70px;
margin-top:10px;
}

/* SEARCH */

.hero-search{
width:300px;
position:relative;
}

.hero-search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
}

.search-results{
position:absolute;
top:48px;
background:white;
color:black;
width:100%;
border-radius:10px;
max-height:300px;
overflow:auto;
display:none;
box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.search-results div{
padding:10px;
cursor:pointer;
}

.search-results div:hover{
background:#eee;
}

/* CONTROLS */

.controls{
padding:0 20px;
display:flex;
gap:20px;
align-items:center;
flex-wrap:wrap;
}

select{
padding:12px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
}

.tab{
padding:10px 20px;
background:#ddd;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.tab.active{
background:#d00000;
color:white;
}

/* SUMMARY */

.section-title{
text-align:center;
font-weight:700;
margin-top:20px;
color:#666;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.box{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
}

.big{
font-size:28px;
font-weight:700;
color:#d00000;
}

/* TABLE */

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

.opponent-cell{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.opponent-cell img{
width:24px;
}

</style>
</head>
<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/t20-world-cup.html">T20 World Cup</a>
<a href="/t20wc-matches.html">Matches</a>
<a href="/t20-world-cup-player.html">Players</a>
<a href="/t20wc-teams.html">Teams</a>
</div>

<div class="hero">

<div class="hero-left">
<h1 id="playerName">Select Player</h1>
<img id="flag" class="flag">
</div>

<div class="hero-search">
<input id="playerSearch" placeholder="Search player...">
<div id="searchResults" class="search-results"></div>
</div>

</div>

<div class="controls">

<select id="oppFilter">
<option value="ALL">All Opponents</option>
</select>

<div id="batTab" class="tab active">Batting</div>
<div id="bowlTab" class="tab">Bowling</div>

</div>

<div class="section-title">CAREER SUMMARY</div>
<div id="careerSummary" class="summary"></div>

<div class="section-title">VS SELECTED OPPONENT</div>
<div id="oppSummary" class="summary"></div>

<table>
<thead id="tableHead"></thead>
<tbody id="tbody"></tbody>
</table>

<script>

const INDEX="/data/t20-world-cup/matches/index.json";
const BASE="/data/t20-world-cup/matches/";

let players=[];
let matches=[];
let currentOpp="ALL";
let currentTab="bat";

const search=document.getElementById("playerSearch");
const results=document.getElementById("searchResults");

initSearch();

async function initSearch(){

const files=await fetch(INDEX).then(r=>r.json());

let set=new Set();

for(const file of files){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{
Object.values(match.info.players)
.forEach(team=>team.forEach(p=>set.add(p)));
});

}

players=[...set].sort();

}

/* SEARCH */

search.oninput=function(){

const q=this.value.toLowerCase();

results.innerHTML="";

if(!q){
results.style.display="none";
return;
}

players
.filter(p=>p.toLowerCase().includes(q))
.slice(0,30)
.forEach(name=>{

const div=document.createElement("div");
div.innerText=name;

div.onclick=()=>{
location.href="?player="+encodeURIComponent(name);
};

results.appendChild(div);

});

results.style.display="block";

};

/* LOAD PLAYER */

const param=new URLSearchParams(location.search).get("player");

if(param) loadPlayer(param);

async function loadPlayer(player){

document.getElementById("playerName").innerText=player;

matches=[];

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{

let team="";

Object.entries(match.info.players)
.forEach(([t,list])=>{
if(list.includes(player)) team=t;
});

if(!team) return;

let batRuns=0,batBalls=0;
let bowlRuns=0,bowlBalls=0,wkts=0;

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs.forEach(over=>{

over.deliveries.forEach(ball=>{

if(ball.batter===player){

batRuns+=ball.runs.batter;
if(!ball.extras?.wides) batBalls++;

}

if(ball.bowler===player){

bowlRuns+=ball.runs.total;
bowlBalls++;
if(ball.wickets) wkts+=ball.wickets.length;

}

});

});

});

matches.push({

season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent:match.info.teams.find(t=>t!==team),
venue:match.info.venue,
batRuns,
batBalls,
bowlRuns,
bowlBalls,
wkts

});

});

}

populateOppFilter();
render();

}

/* FILTER */

function populateOppFilter(){

const set=new Set(matches.map(m=>m.opponent));

oppFilter.innerHTML='<option value="ALL">All Opponents</option>';

set.forEach(o=>{
oppFilter.innerHTML+=`<option>${o}</option>`;
});

oppFilter.onchange=e=>{
currentOpp=e.target.value;
render();
};

}

/* TABS */

batTab.onclick=()=>{currentTab="bat";setTabs();render();}
bowlTab.onclick=()=>{currentTab="bowl";setTabs();render();}

function setTabs(){

batTab.classList.toggle("active",currentTab==="bat");
bowlTab.classList.toggle("active",currentTab==="bowl");

}

/* RENDER */

function render(){

const filtered=currentOpp==="ALL"
?matches
:matches.filter(m=>m.opponent===currentOpp);

renderCareerSummary();
renderOppSummary(filtered);
renderTable(filtered);

}

/* SUMMARY FUNCTIONS */

function renderCareerSummary(){
renderSummary(matches,"careerSummary");
}

function renderOppSummary(list){
renderSummary(list,"oppSummary");
}

function renderSummary(list,id){

let runs=0,balls=0,wkts=0,bruns=0,bballs=0,high=0,fifty=0,hundred=0;

list.forEach(m=>{

runs+=m.batRuns;
balls+=m.batBalls;
wkts+=m.wkts;
bruns+=m.bowlRuns;
bballs+=m.bowlBalls;

if(m.batRuns>high) high=m.batRuns;
if(m.batRuns>=50) fifty++;
if(m.batRuns>=100) hundred++;

});

document.getElementById(id).innerHTML=`

<div class="box"><div class="big">${list.length}</div>Matches</div>

<div class="box"><div class="big">${runs}</div>Runs</div>

<div class="box"><div class="big">${high}</div>Highest</div>

<div class="box"><div class="big">${fifty}</div>50s</div>

<div class="box"><div class="big">${hundred}</div>100s</div>

<div class="box"><div class="big">${wkts}</div>Wickets</div>

`;

}

/* TABLE */

function renderTable(list){

if(currentTab==="bat"){

tableHead.innerHTML=`
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Runs</th>
<th>Balls</th>
<th>Strike Rate</th>
</tr>
`;

}else{

tableHead.innerHTML=`
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Wickets</th>
<th>Overs</th>
<th>Economy</th>
</tr>
`;

}

tbody.innerHTML="";

list.forEach(m=>{

const tr=document.createElement("tr");

const flag=flagURL(m.opponent);

if(currentTab==="bat"){

tr.innerHTML=`
<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString()}</td>
<td class="opponent-cell"><img src="${flag}">${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.batRuns}</td>
<td>${m.batBalls}</td>
<td>${((m.batRuns/m.batBalls)*100||0).toFixed(1)}</td>
`;

}else{

tr.innerHTML=`
<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString()}</td>
<td class="opponent-cell"><img src="${flag}">${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.wkts}</td>
<td>${(m.bowlBalls/6).toFixed(1)}</td>
<td>${(m.bowlRuns/(m.bowlBalls/6)||0).toFixed(2)}</td>
`;

}

tbody.appendChild(tr);

});

}

/* FLAGS */

function flagURL(team){

const map={
India:"in",
Australia:"au",
England:"gbunited kingdomgb",
Pakistan:"pk",
South Africa:"za",
New Zealand:"nz",
Sri Lanka:"lk",
West Indies:"jm",
Afghanistan:"af",
Bangladesh:"bd"
};

return "https://flagcdn.com/w40/"+(map[team]||"un")+".png";

}

</script>

</body>
</html>
