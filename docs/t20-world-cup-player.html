<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f3f4f7;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:white;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.hero-search{
width:300px;
position:relative;
}

.hero-search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
}

.search-results{
position:absolute;
top:48px;
background:white;
color:black;
width:100%;
border-radius:10px;
max-height:300px;
overflow:auto;
display:none;
}

.search-results div{
padding:10px;
cursor:pointer;
}

.controls{
padding:0 20px;
display:flex;
gap:20px;
}

.tab{
padding:10px 20px;
background:#ddd;
border-radius:10px;
cursor:pointer;
}

.tab.active{
background:#d00000;
color:white;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:16px;
padding:20px;
}

.box{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
}

.big{
font-size:24px;
font-weight:700;
color:#d00000;
}

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

tbody tr:nth-child(even){
background:#f0f6ff;
}

tbody tr:hover{
background:#dbeafe;
cursor:pointer;
}

</style>
</head>
<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/t20-world-cup.html">T20 World Cup</a>
<a href="/t20wc-matches.html">Matches</a>
<a href="/t20-world-cup-player.html">Players</a>
<a href="/t20wc-teams.html">Teams</a>
</div>

<div class="hero">

<h1 id="playerName">Select Player</h1>

<div class="hero-search">
<input id="playerSearch" placeholder="Search player...">
<div id="searchResults" class="search-results"></div>
</div>

</div>

<div class="controls">

<select id="oppFilter">
<option value="ALL">All Opponents</option>
</select>

<div id="batTab" class="tab active">Batting</div>
<div id="bowlTab" class="tab">Bowling</div>

</div>

<h3 style="text-align:center">Career Summary</h3>
<div id="careerSummary" class="summary"></div>

<h3 style="text-align:center">Vs Selected Opposition</h3>
<div id="oppSummary" class="summary"></div>

<table>

<thead id="tableHead"></thead>
<tbody id="tbody"></tbody>

</table>

<script>

const INDEX="/data/t20-world-cup/matches/index.json";
const BASE="/data/t20-world-cup/matches/";

const input=document.getElementById("playerSearch");
const results=document.getElementById("searchResults");

let players=[];
let matches=[];
let currentOpp="ALL";
let currentTab="bat";

/* SEARCH */

input.oninput=function(){

const q=this.value.toLowerCase();

results.innerHTML="";

if(!q) return;

players.filter(p=>p.toLowerCase().includes(q)).slice(0,30)
.forEach(name=>{

const div=document.createElement("div");

div.innerText=name;

div.onclick=()=>{
window.location.href="/t20-world-cup-player.html?player="+encodeURIComponent(name);
};

results.appendChild(div);

});

results.style.display="block";

};

/* LOAD PLAYERS */

(async function(){

const files=await fetch(INDEX).then(r=>r.json());

let set=new Set();

for(const file of files){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{
Object.values(match.info.players)
.forEach(team=>team.forEach(p=>set.add(p)));
});

}

players=[...set].sort();

})();

/* LOAD PLAYER */

const param=new URLSearchParams(window.location.search).get("player");

if(param) loadPlayer(param);

async function loadPlayer(player){

playerName.innerText=player;

matches=[];

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach((match,index)=>{

let team="";

Object.entries(match.info.players)
.forEach(([t,list])=>{
if(list.includes(player)) team=t;
});

if(!team) return;

let runs=0,balls=0,out=false;
let wkts=0,bowlRuns=0,bowlBalls=0;

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs.forEach(over=>{

over.deliveries.forEach(ball=>{

if(ball.batter===player){

runs+=ball.runs.batter;

if(!ball.extras?.wides) balls++;

if(ball.wickets)
ball.wickets.forEach(w=>{
if(w.player_out===player) out=true;
});

}

if(ball.bowler===player){

bowlRuns+=ball.runs.total;
bowlBalls++;

if(ball.wickets) wkts+=ball.wickets.length;

}

});

});

});

matches.push({
season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent:match.info.teams.find(t=>t!==team),
venue:match.info.venue,
runs,balls,out,wkts,bowlRuns,bowlBalls,file,index
});

});

}

populateOppFilter();
render();

}

/* FILTER */

function populateOppFilter(){

const set=new Set(matches.map(m=>m.opponent));

oppFilter.innerHTML='<option value="ALL">All Opponents</option>';

set.forEach(o=>oppFilter.innerHTML+=`<option>${o}</option>`);

oppFilter.onchange=e=>{
currentOpp=e.target.value;
render();
};

}

/* TABS */

batTab.onclick=()=>{currentTab="bat";batTab.classList.add("active");bowlTab.classList.remove("active");render();}
bowlTab.onclick=()=>{currentTab="bowl";bowlTab.classList.add("active");batTab.classList.remove("active");render();}

/* RENDER */

function render(){

const filtered=currentOpp==="ALL"?matches:matches.filter(m=>m.opponent===currentOpp);

renderCareer(matches);
renderOpp(filtered);
renderTable(filtered);

}

/* CAREER SUMMARY */

function renderCareer(list){

let runs=0,balls=0,outs=0,wkts=0,bruns=0,bballs=0,high=0,best="0/0";

list.forEach(m=>{
runs+=m.runs;
balls+=m.balls;
wkts+=m.wkts;
bruns+=m.bowlRuns;
bballs+=m.bowlBalls;
if(m.out) outs++;
if(m.runs>high) high=m.runs;
if(m.wkts>0) best=m.wkts+"/"+m.bowlRuns;
});

careerSummary.innerHTML=`
<div class="box"><div class="big">${list.length}</div>Matches</div>
<div class="box"><div class="big">${runs}</div>Runs</div>
<div class="box"><div class="big">${outs?(runs/outs).toFixed(2):"-"}</div>Average</div>
<div class="box"><div class="big">${wkts}</div>Wickets</div>
<div class="box"><div class="big">${best}</div>Best</div>
`;

}

/* OPP SUMMARY */

function renderOpp(list){

let runs=0,wkts=0;

list.forEach(m=>{
runs+=m.runs;
wkts+=m.wkts;
});

oppSummary.innerHTML=`
<div class="box"><div class="big">${list.length}</div>Matches</div>
<div class="box"><div class="big">${runs}</div>Runs</div>
<div class="box"><div class="big">${wkts}</div>Wickets</div>
`;

}

/* TABLE */

function renderTable(list){

tbody.innerHTML="";

tableHead.innerHTML=currentTab==="bat"
?`<tr><th>Season</th><th>Date</th><th>Opponent</th><th>Venue</th><th>Runs</th><th>Balls</th><th>SR</th></tr>`
:`<tr><th>Season</th><th>Date</th><th>Opponent</th><th>Venue</th><th>Wkts</th><th>Overs</th><th>Eco</th></tr>`;

list.forEach(m=>{

const tr=document.createElement("tr");

tr.onclick=()=>window.location.href="/t20-world-cup-match.html?file="+m.file+"&match="+m.index;

tr.innerHTML=currentTab==="bat"
?`<td>${m.season}</td><td>${new Date(m.date).toLocaleDateString()}</td><td>${m.opponent}</td><td>${m.venue}</td><td>${m.runs}</td><td>${m.balls}</td><td>${((m.runs/m.balls)*100||0).toFixed(1)}</td>`
:`<td>${m.season}</td><td>${new Date(m.date).toLocaleDateString()}</td><td>${m.opponent}</td><td>${m.venue}</td><td>${m.wkts}</td><td>${(m.bowlBalls/6).toFixed(1)}</td><td>${(m.bowlRuns/(m.bowlBalls/6)||0).toFixed(2)}</td>`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
