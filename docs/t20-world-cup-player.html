<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.hero-left h1{
margin:0;
font-size:42px;
}

/* TABLE */

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

tr:hover{
background:#f8fbff;
cursor:pointer;
}

</style>
</head>
<body>

<div class="hero">
<div class="hero-left">
<h1 id="playerName">Loading...</h1>
</div>
</div>

<table id="matchTable">

<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Runs</th>
<th>Balls</th>
<th>Strike Rate</th>
</tr>
</thead>

<tbody></tbody>

</table>


<script>

/* EXACT SAME PATH AS MATCHES PAGE */

const MATCH_INDEX =
"data/t20-world-cup/matches/index.json";

const MATCH_FOLDER =
"data/t20-world-cup/matches/";

const NAME_INDEX =
"data/t20-world-cup/players-name.json";


let nameMap={};
let reverseNameMap={};

let matches=[];


/* INIT */

init();


async function init()
{

await loadNameMap();

const urlPlayer =
new URLSearchParams(location.search)
.get("player");

if(!urlPlayer)
return;

const raw =
reverseNameMap[urlPlayer] || urlPlayer;

loadPlayer(raw);

}


/* LOAD NAME MAP */

async function loadNameMap()
{

nameMap =
await fetch(NAME_INDEX)
.then(r=>r.json());

Object.entries(nameMap)
.forEach(([raw,proper])=>
{
reverseNameMap[proper]=raw;
});

}


/* DISPLAY NAME */

function displayName(raw)
{
return nameMap[raw] || raw;
}


/* LOAD PLAYER */

async function loadPlayer(player)
{

playerName.innerText=
displayName(player);

matches=[];

const files=
await fetch(MATCH_INDEX)
.then(r=>r.json());


for(const file of files)
{

const season=
await fetch(MATCH_FOLDER+file)
.then(r=>r.json());


season.forEach((match,index)=>
{

let runs=0;
let balls=0;

match.innings.forEach(raw=>
{

const inn =
raw.team
? raw
: Object.values(raw)[0];

inn.overs?.forEach(over=>
{

over.deliveries.forEach(d=>
{

if(d.batter===player)
{

runs+=d.runs.batter;

if(!d.extras?.wides)
balls++;

}

});

});

});


if(balls>0)
{

const team =
Object.keys(match.info.players || {})
.find(t=>
match.info.players[t]
.includes(player)
);

const opponent =
match.info.teams
.find(t=>t!==team);

matches.push({

season:
file.match(/\d{4}/)[0],

date:
match.info.dates[0],

opponent,

venue:
match.info.venue,

runs,

balls,

file,

index

});

}

});

}


render();

}


/* RENDER */

function render()
{

const tbody=
document.querySelector("#matchTable tbody");

tbody.innerHTML="";

matches.forEach(m=>
{

const tr=
document.createElement("tr");

tr.onclick=()=>
{

location.href=
`t20-world-cup-match.html?file=${m.file}&match=${m.index}`;

};

tr.innerHTML=`

<td>${m.season}</td>

<td>${new Date(m.date)
.toLocaleDateString("en-GB")}</td>

<td>${m.opponent}</td>

<td>${m.venue}</td>

<td>${m.runs}</td>

<td>${m.balls}</td>

<td>${((m.runs/m.balls)*100)
.toFixed(1)}</td>

`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
