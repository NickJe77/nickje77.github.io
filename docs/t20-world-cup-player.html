<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f3f4f7;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px;
margin:20px;
border-radius:16px;
font-size:36px;
font-weight:700;
}

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

.center{
padding:30px;
text-align:center;
}

tr:hover{
background:#f5f5f5;
cursor:pointer;
}

</style>
</head>
<body>

<div id="playerName" class="hero"></div>

<table>

<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Runs</th>
<th>Balls</th>
<th>Strike Rate</th>
</tr>
</thead>

<tbody id="tbody">

<tr>
<td colspan="7" class="center">Loading...</td>
</tr>

</tbody>

</table>


<script>

const INDEX="data/t20-world-cup/matches/index.json";
const FOLDER="data/t20-world-cup/matches/";

init();

async function init()
{

const player =
decodeURIComponent(
new URLSearchParams(location.search)
.get("player")
);

playerName.innerText = player;

const files =
await fetch(INDEX).then(r=>r.json());

let results=[];

for(const file of files)
{

const season =
await fetch(FOLDER+file).then(r=>r.json());

season.forEach((match,index)=>{

let runs=0;
let balls=0;
let playerTeam="";

/* FIND TEAM */

Object.entries(match.info.players||{})
.forEach(([team,list])=>{
if(list.includes(player))
playerTeam=team;
});

/* PARSE INNINGS */

match.innings.forEach(innRaw=>{

const inn =
innRaw.team
?innRaw
:Object.values(innRaw)[0];

/* GET ALL DELIVERIES */

let deliveries=[];

if(inn.overs)
inn.overs.forEach(o=>deliveries.push(...o.deliveries));

if(inn.deliveries)
deliveries.push(...inn.deliveries);

/* COUNT */

deliveries.forEach(d=>{

if(d.batter===player){

runs+=d.runs.batter;

if(!d.extras?.wides)
balls++;

}

});

});


if(balls>0){

const opponent =
match.info.teams.find(t=>t!==playerTeam);

results.push({

season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent,
venue:match.info.venue,
runs,
balls,
file,
index

});

}

});

}

render(results);

}


function render(results)
{

const tbody =
document.getElementById("tbody");

if(results.length===0){

tbody.innerHTML =
`<tr><td colspan="7" class="center">No matches found</td></tr>`;

return;

}

results.sort((a,b)=>new Date(b.date)-new Date(a.date));

tbody.innerHTML="";

results.forEach(m=>{

const tr=document.createElement("tr");

tr.onclick=()=>{
location.href=
`t20-world-cup-match.html?file=${m.file}&match=${m.index}`;
};

tr.innerHTML=`
<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100).toFixed(1)}</td>
`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
