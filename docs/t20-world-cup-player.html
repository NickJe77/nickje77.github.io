<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
position:relative;
}

.hero-left h1{
margin:0;
font-size:42px;
}

.hero-left p{
margin-top:6px;
opacity:.9;
}

/* SEARCH */

.search-container{
position:relative;
width:300px;
}

.search-container input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
}

.search-results{
position:absolute;
top:48px;
left:0;
right:0;
background:white;
color:black;
border-radius:10px;
max-height:300px;
overflow-y:auto;
display:none;
z-index:999;
box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.search-results div{
padding:10px;
cursor:pointer;
}

.search-results div:hover{
background:#f1f1f1;
}

/* CONTROLS */

.controls{
display:flex;
gap:14px;
align-items:center;
padding:0 20px 20px 20px;
}

select{
padding:8px;
font-size:16px;
border-radius:8px;
}

.tab{
padding:8px 18px;
background:#ddd;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.tab.active{
background:#d00000;
color:white;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.box{
background:#e7e7ec;
padding:18px;
border-radius:14px;
text-align:center;
}

.box .big{
font-size:30px;
font-weight:700;
}

/* TABLE */

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

th{
background:#f1f1f1;
cursor:pointer;
}

tr:hover{
background:#f8fbff;
cursor:pointer;
}

</style>
</head>
<body>


<div class="hero">

<div class="hero-left">

<h1 id="playerName">Player</h1>

<p>T20 World Cup batting & bowling performance by opposition</p>

</div>

<div class="search-container">

<input id="playerSearch" placeholder="Search player...">

<div id="searchResults" class="search-results"></div>

</div>

</div>


<div class="controls">

<label>Opposition:</label>

<select id="oppFilter">
<option value="ALL">All</option>
</select>

<div id="batTab" class="tab active">Batting</div>
<div id="bowlTab" class="tab">Bowling</div>

</div>


<div id="careerSummary" class="summary"></div>

<div id="oppSummary" class="summary"></div>


<table id="matchTable">

<thead>
<tr>

<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>

<th id="col1">Runs</th>
<th id="col2">Balls</th>
<th id="col3">Strike Rate</th>

</tr>
</thead>

<tbody></tbody>

</table>


<script>

const INDEX="/data/t20-world-cup/matches/index.json";

let players=[];
let matches=[];
let career;
let oppStats={};

let currentTab="bat";
let currentOpp="ALL";

/* LOAD SEARCH INDEX */

async function initSearch(){

const files=await fetch(INDEX).then(r=>r.json());

const set=new Set();

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach(match=>{

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{
set.add(d.batter);
set.add(d.bowler);
});

});

});

});

}

players=[...set].sort();

}

initSearch();


/* SEARCH INPUT */

playerSearch.addEventListener("input",function(){

const q=this.value.toLowerCase();

if(!q){

searchResults.style.display="none";
return;

}

const filtered=players.filter(p=>p.toLowerCase().includes(q)).slice(0,30);

searchResults.innerHTML="";

filtered.forEach(name=>{

const div=document.createElement("div");

div.textContent=name;

div.onclick=()=>{
location.href="?player="+encodeURIComponent(name);
};

searchResults.appendChild(div);

});

searchResults.style.display="block";

});


document.addEventListener("click",e=>{

if(!e.target.closest(".search-container"))
searchResults.style.display="none";

});

</script>

</body>
</html>
