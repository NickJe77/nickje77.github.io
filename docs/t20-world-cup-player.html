<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:#fff;
border-bottom:1px solid #ddd;
font-weight:600;
}

.page{
max-width:1000px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

tbody tr:nth-child(even){
background:#eaf3ff;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div id="content">
<div class="hero">Loading player...</div>
</div>

</div>

<script>

const playerName =
decodeURIComponent(
new URLSearchParams(location.search).get("name")
);

if(!playerName){

document.getElementById("content").innerHTML=
"<div class='hero'>Player not specified</div>";

throw new Error("No player");

}

loadPlayer();

async function loadPlayer(){

const index=await fetch("data/t20wc/index.json")
.then(r=>r.json());

let matches=[];

for(const file of index){

const data=await fetch(`data/t20wc/${file}`)
.then(r=>r.json());

matches.push(...data);

}

renderPlayer(matches);

}

function renderPlayer(matches){

const content=document.getElementById("content");

let inningsList=[];

matches.forEach(match=>{

match.innings.forEach(inn=>{

const deliveries=inn.overs.flatMap(o=>o.deliveries);

let runs=0;
let balls=0;
let out="not out";

deliveries.forEach(d=>{

if(d.batter===playerName){

runs+=d.runs.batter;

if(!d.extras?.wides && !d.extras?.noballs)
balls++;

}

if(d.wickets){

d.wickets.forEach(w=>{

if(w.player_out===playerName){

out=w.kind;

}

});

}

});

if(runs>0 || balls>0){

inningsList.push({

team:inn.team,
runs,
balls,
out,
venue:match.info.venue,
date:match.info.dates[0]

});

}

});

});

if(inningsList.length===0){

content.innerHTML=
`<div class="hero">${playerName}<br>No data found</div>`;

return;

}

let totalRuns=0;
let totalBalls=0;
let outs=0;

inningsList.forEach(i=>{

totalRuns+=i.runs;
totalBalls+=i.balls;

if(i.out!=="not out") outs++;

});

const avg=outs?(totalRuns/outs).toFixed(2):"-";

const sr=totalBalls?
((totalRuns/totalBalls)*100).toFixed(2)
:"-";

content.innerHTML=`

<div class="hero" id="${playerName}">
<h1>${playerName}</h1>
Runs: ${totalRuns}<br>
Average: ${avg}<br>
Strike Rate: ${sr}
</div>

<div class="card">

<table>

<thead>
<tr>
<th>Date</th>
<th>Team</th>
<th>Runs</th>
<th>Balls</th>
<th>Dismissal</th>
<th>Venue</th>
</tr>
</thead>

<tbody>

${inningsList.map(i=>`
<tr>
<td>${i.date}</td>
<td>${i.team}</td>
<td>${i.runs}</td>
<td>${i.balls}</td>
<td>${i.out}</td>
<td>${i.venue}</td>
</tr>
`).join("")}

</tbody>

</table>

</div>

`;

scrollToPlayer();

}

function scrollToPlayer(){

const anchor=location.hash.substring(1);

if(anchor){

const el=document.getElementById(anchor);

if(el){

setTimeout(()=>{
el.scrollIntoView({
behavior:"smooth",
block:"start"
});
},200);

}

}

}

</script>

</body>
</html>
