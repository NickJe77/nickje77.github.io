<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
}

.hero h1{
margin:0;
font-size:42px;
}

.hero p{
margin-top:6px;
opacity:.9;
}

/* CONTROLS */

.controls{
display:flex;
gap:14px;
align-items:center;
padding:0 20px 20px 20px;
}

select{
padding:8px;
font-size:16px;
border-radius:8px;
}

/* TABS */

.tab{
padding:8px 18px;
background:#ddd;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.tab.active{
background:#d00000;
color:white;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.box{
background:#e7e7ec;
padding:18px;
border-radius:14px;
text-align:center;
}

.box .big{
font-size:30px;
font-weight:700;
}

/* TABLE */

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

th{
background:#f1f1f1;
cursor:pointer;
}

tr:hover{
background:#f8fbff;
cursor:pointer;
}

</style>
</head>
<body>


<div class="hero">

<h1 id="playerName">Player</h1>

<p>T20 World Cup batting & bowling performance by opposition</p>

</div>


<div class="controls">

<label>Opposition:</label>

<select id="oppFilter">
<option value="ALL">All</option>
</select>

<div id="batTab" class="tab active">Batting</div>
<div id="bowlTab" class="tab">Bowling</div>

</div>


<div id="careerSummary" class="summary"></div>

<div id="oppSummary" class="summary"></div>


<table id="matchTable">

<thead>
<tr>

<th onclick="sortTable('season')">Season</th>
<th onclick="sortTable('date')">Date</th>
<th onclick="sortTable('opponent')">Opponent</th>
<th onclick="sortTable('venue')">Venue</th>

<th id="col1">Runs</th>
<th id="col2">Balls</th>
<th id="col3">Strike Rate</th>

</tr>
</thead>

<tbody></tbody>

</table>


<script>

const INDEX="/data/t20-world-cup/matches/index.json";

let matches=[];
let career;
let oppStats={};

let currentTab="bat";
let currentOpp="ALL";

let currentSort="date";
let sortAsc=false;

loadPlayer();


function initStats(){

return{
matches:0,
runs:0,
balls:0,
wkts:0,
ballsBowled:0,
runsConceded:0,
bestRuns:0,
bestWkts:0
};

}


async function loadPlayer(){

career=initStats();

const player=new URLSearchParams(location.search).get("player");

playerName.innerText=player;

const files=await fetch(INDEX).then(r=>r.json());

let playerCountry="";

for(const file of files){

const seasonData=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

seasonData.forEach((match,index)=>{

const team=Object.keys(match.info.players||{})
.find(t=>match.info.players[t].includes(player));

if(team) playerCountry=team;

let runs=0,balls=0,wkts=0,ballsBowled=0,runsConceded=0;

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

if(d.batter===player){
runs+=d.runs.batter;
if(!d.extras?.wides) balls++;
}

if(d.bowler===player){
runsConceded+=d.runs.total;
if(!d.extras?.wides&&!d.extras?.noballs) ballsBowled++;
if(d.wickets) wkts+=d.wickets.length;
}

});

});

});

if(runs||wkts){

const opponent=match.info.teams.find(t=>t!==playerCountry);

const m={

season:file.match(/\d{4}/)?.[0] || "",

date:match.info.dates[0],

opponent,
venue:match.info.venue,

runs,
balls,

wkts,
ballsBowled,
runsConceded,

file,
index

};

matches.push(m);

updateStats(career,m);

if(!oppStats[opponent])
oppStats[opponent]=initStats();

updateStats(oppStats[opponent],m);

}

});

}

renderOppFilter();
render();

}


function updateStats(s,m){

s.matches++;

s.runs+=m.runs;
s.balls+=m.balls;

s.wkts+=m.wkts;
s.ballsBowled+=m.ballsBowled;
s.runsConceded+=m.runsConceded;

if(m.runs>s.bestRuns) s.bestRuns=m.runs;
if(m.wkts>s.bestWkts) s.bestWkts=m.wkts;

}


function renderOppFilter(){

Object.keys(oppStats).sort().forEach(o=>{

oppFilter.innerHTML+=`<option value="${o}">${o}</option>`;

});

oppFilter.onchange=e=>{

currentOpp=e.target.value;
render();

};

}


batTab.onclick=()=>{

currentTab="bat";
setTabs();
render();

};

bowlTab.onclick=()=>{

currentTab="bowl";
setTabs();
render();

};


function setTabs(){

batTab.classList.toggle("active",currentTab==="bat");
bowlTab.classList.toggle("active",currentTab==="bowl");

}


function updateHeaders(){

if(currentTab==="bat"){

col1.innerText="Runs";
col2.innerText="Balls";
col3.innerText="Strike Rate";

}else{

col1.innerText="Wickets";
col2.innerText="Overs";
col3.innerText="Economy";

}

}


function sortTable(field){

sortAsc = field===currentSort ? !sortAsc : true;
currentSort=field;

render();

}


function render(){

updateHeaders();

const s=currentOpp==="ALL"?career:oppStats[currentOpp];

renderSummary(careerSummary,career);
renderSummary(oppSummary,s);

renderTable();

}


function renderSummary(div,s){

if(currentTab==="bat"){

div.innerHTML=`

<div class="box"><div class="big">${s.matches}</div>Matches</div>

<div class="box"><div class="big">${s.runs}</div>Runs</div>

<div class="box"><div class="big">${(s.runs/s.matches||0).toFixed(1)}</div>Average</div>

<div class="box"><div class="big">${((s.runs/s.balls)*100||0).toFixed(1)}</div>Strike Rate</div>

<div class="box"><div class="big">${s.bestRuns}</div>Best</div>

`;

}else{

div.innerHTML=`

<div class="box"><div class="big">${s.matches}</div>Matches</div>

<div class="box"><div class="big">${(s.ballsBowled/6).toFixed(1)}</div>Overs</div>

<div class="box"><div class="big">${s.wkts}</div>Wickets</div>

<div class="box"><div class="big">${(s.runsConceded/s.wkts||0).toFixed(1)}</div>Average</div>

<div class="box"><div class="big">${(s.runsConceded/(s.ballsBowled/6)||0).toFixed(2)}</div>Economy</div>

<div class="box"><div class="big">${s.bestWkts}</div>Best</div>

`;

}

}


function formatDate(date){

return new Date(date).toLocaleDateString("en-GB",{
day:"numeric",
month:"short",
year:"numeric"
});

}


function renderTable(){

const tbody=document.querySelector("#matchTable tbody");

let filtered=matches.filter(m=>currentOpp==="ALL"||m.opponent===currentOpp);

filtered.sort((a,b)=>{

let A=a[currentSort]||0;
let B=b[currentSort]||0;

return sortAsc?A>B?1:-1:A<B?1:-1;

});

tbody.innerHTML="";

filtered.forEach(m=>{

const tr=document.createElement("tr");

tr.onclick=()=>{

location.href=`t20-world-cup-match.html?file=${m.file}&match=${m.index}`;

};

tr.innerHTML=currentTab==="bat"

?`

<td>${m.season}</td>
<td>${formatDate(m.date)}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100||0).toFixed(1)}</td>

`

:

`

<td>${m.season}</td>
<td>${formatDate(m.date)}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.wkts}</td>
<td>${(m.ballsBowled/6).toFixed(1)}</td>
<td>${(m.runsConceded/(m.ballsBowled/6)||0).toFixed(2)}</td>

`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
