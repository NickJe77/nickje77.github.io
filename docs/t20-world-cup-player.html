<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:28px;
display:flex;
justify-content:space-between;
align-items:center;
}

.hero-title{
font-size:42px;
font-weight:800;
}

/* SEARCH */

.search-wrap{
position:relative;
width:320px;
}

.search-wrap input{
width:100%;
padding:12px;
border-radius:12px;
border:none;
}

/* TABS */

.tabs{
display:flex;
gap:10px;
padding:20px;
}

.tab{
padding:10px 18px;
background:#ddd;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.tab.active{
background:#d00000;
color:white;
}

/* FILTER */

.filter-row{
padding:0 20px 10px 20px;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.summary-box{
background:#e7e7ec;
padding:12px;
border-radius:10px;
text-align:center;
}

/* TABLE */

.container{
padding:20px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

.match-link{
color:#0056d6;
font-weight:600;
text-decoration:none;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="hero">

<div id="playerName" class="hero-title">
Select player
</div>

<div class="search-wrap">
<input id="playerSearch" placeholder="Search player...">
</div>

</div>

<div class="tabs">
<div id="batTab" class="tab active">Batting</div>
<div id="bowlTab" class="tab">Bowling</div>
</div>

<div class="filter-row">

<label><strong>Against opposition:</strong></label>

<select id="oppositionFilter">
<option value="ALL">All opponents</option>
</select>

</div>

<div id="careerSummary" class="summary"></div>

<div class="container">

<table id="matchTable">

<tr>
<th>Date</th>
<th>Match</th>
<th id="col3"></th>
<th id="col4"></th>
<th id="col5"></th>
</tr>

</table>

</div>

<script>

const INDEX="/data/t20-world-cup/matches/index.json";

let battingStats={}, bowlingStats={}, oppositionStats={}, allMatches=[];
let currentTab="bat", currentOpp="ALL", playerCountry="";

initSearch();
loadPlayerFromURL();


/* SEARCH */

async function initSearch(){

const files=await fetch(INDEX).then(r=>r.json());
const set=new Set();

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach(match=>{
match.innings.forEach(raw=>{
const inn=raw.team?raw:Object.values(raw)[0];
inn.overs?.forEach(over=>{
over.deliveries.forEach(d=>{
set.add(d.batter);
set.add(d.bowler);
});
});
});
});

}

const players=[...set].sort();

document.getElementById("playerSearch").onchange=function(){

location.href="?player="+encodeURIComponent(this.value);

};

}


/* LOAD PLAYER */

function loadPlayerFromURL(){

const player=new URLSearchParams(location.search).get("player");

if(player) loadPlayer(player);

}


async function loadPlayer(player){

resetStats();

document.getElementById("playerName").innerText=player;

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach((match,index)=>{

let runs=0,balls=0,wkts=0,ballsBowled=0,runsConceded=0;

const team = Object.keys(match.info.players || {})
.find(t=>match.info.players[t].includes(player));

if(team) playerCountry=team;

match.innings.forEach(raw=>{
const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{
over.deliveries.forEach(d=>{

if(d.batter===player){
runs+=d.runs.batter;
if(!d.extras?.wides) balls++;
}

if(d.bowler===player){
runsConceded+=d.runs.total;
if(!d.extras?.wides&&!d.extras?.noballs) ballsBowled++;
if(d.wickets) wkts+=d.wickets.length;
}

});
});
});

if(runs||wkts){

const opponent=match.info.teams.find(t=>t!==playerCountry);

allMatches.push({
match,file,index,runs,balls,wkts,ballsBowled,runsConceded,opponent
});

if(!oppositionStats[opponent])
oppositionStats[opponent]=initStats();

updateStats(battingStats,runs,balls);
updateBowlStats(bowlingStats,wkts,ballsBowled,runsConceded);
updateStats(oppositionStats[opponent],runs,balls);
updateBowlStats(oppositionStats[opponent],wkts,ballsBowled,runsConceded);

}

});

}

document.getElementById("playerName").innerText=
player+" ("+playerCountry+")";

renderOppositionDropdown();
render();

}


/* STATS */

function initStats(){
return {matches:0,runs:0,balls:0,wkts:0,ballsBowled:0,runsConceded:0};
}

function updateStats(obj,runs,balls){
obj.matches++;
obj.runs+=runs;
obj.balls+=balls;
}

function updateBowlStats(obj,wkts,balls,runs){
obj.wkts+=wkts;
obj.ballsBowled+=balls;
obj.runsConceded+=runs;
}


/* DROPDOWN */

function renderOppositionDropdown(){

const select=document.getElementById("oppositionFilter");

Object.keys(oppositionStats).sort().forEach(t=>{
select.innerHTML+=`<option value="${t}">${t}</option>`;
});

select.onchange=e=>{
currentOpp=e.target.value;
render();
};

}


/* TABS */

document.getElementById("batTab").onclick=()=>{
currentTab="bat";
setTabs();
render();
};

document.getElementById("bowlTab").onclick=()=>{
currentTab="bowl";
setTabs();
render();
};

function setTabs(){
batTab.classList.toggle("active",currentTab==="bat");
bowlTab.classList.toggle("active",currentTab==="bowl");
}


/* RENDER */

function render(){

const stats=currentOpp==="ALL"
? (currentTab==="bat"?battingStats:bowlingStats)
: oppositionStats[currentOpp];

renderSummary(stats);
renderMatches();

}


function renderSummary(s){

if(currentTab==="bat"){

careerSummary.innerHTML=`

<div class="summary-box">Matches<br><strong>${s.matches}</strong></div>
<div class="summary-box">Runs<br><strong>${s.runs}</strong></div>
<div class="summary-box">Average<br><strong>${(s.runs/s.matches||0).toFixed(1)}</strong></div>
<div class="summary-box">Strike Rate<br><strong>${((s.runs/s.balls)*100||0).toFixed(1)}</strong></div>

`;

}else{

careerSummary.innerHTML=`

<div class="summary-box">Matches<br><strong>${s.matches}</strong></div>
<div class="summary-box">Wickets<br><strong>${s.wkts}</strong></div>
<div class="summary-box">Average<br><strong>${(s.runsConceded/s.wkts||0).toFixed(1)}</strong></div>
<div class="summary-box">Economy<br><strong>${(s.runsConceded/(s.ballsBowled/6)||0).toFixed(2)}</strong></div>

`;

}

}


function renderMatches(){

const table=document.getElementById("matchTable");
table.innerHTML=table.rows[0].outerHTML;

allMatches.forEach(m=>{

if(currentOpp!=="ALL" && m.opponent!==currentOpp) return;

const row=document.createElement("tr");

row.innerHTML=currentTab==="bat"?`

<td>${new Date(m.match.info.dates[0]).toLocaleDateString("en-GB")}</td>
<td><a href="t20-world-cup-match.html?file=${m.file}&match=${m.index}" class="match-link">${m.match.info.teams.join(" vs ")}</a></td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100||0).toFixed(1)}</td>

`

:

`

<td>${new Date(m.match.info.dates[0]).toLocaleDateString("en-GB")}</td>
<td><a href="t20-world-cup-match.html?file=${m.file}&match=${m.index}" class="match-link">${m.match.info.teams.join(" vs ")}</a></td>
<td>${m.wkts}</td>
<td>${Math.floor(m.ballsBowled/6)+"."+(m.ballsBowled%6)}</td>
<td>${(m.runsConceded/(m.ballsBowled/6)||0).toFixed(2)}</td>

`;

table.appendChild(row);

});

}


function resetStats(){
battingStats=initStats();
bowlingStats=initStats();
oppositionStats={};
allMatches=[];
}

</script>
</body>
</html>
