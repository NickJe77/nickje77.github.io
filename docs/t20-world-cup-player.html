<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

/* NAV */

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:white;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.hero-left{
flex:1;
text-align:center;
}

.hero-left h1{
margin:0;
font-size:42px;
}

.flag{
width:70px;
margin-top:10px;
}

/* SEARCH */

.hero-search{
width:300px;
position:relative;
}

.hero-search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
color:#000;
background:white;
}

.search-results{
position:absolute;
top:48px;
left:0;
right:0;
background:white;
color:black;
border-radius:10px;
max-height:300px;
overflow-y:auto;
display:none;
box-shadow:0 4px 12px rgba(0,0,0,.2);
z-index:999;
}

.search-results div{
padding:10px;
cursor:pointer;
}

.search-results div:hover{
background:#eee;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.box{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.box .big{
font-size:30px;
font-weight:700;
color:#d00000;
}

/* TABLE */

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

.center{
padding:40px;
color:#666;
}

</style>
</head>
<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/t20-world-cup.html">T20 World Cup</a>
<a href="/t20wc-matches.html">Matches</a>
<a href="/t20-world-cup-player.html">Players</a>
<a href="/t20wc-teams.html">Teams</a>
</div>

<div class="hero">

<div class="hero-left">
<h1 id="playerName">Select Player</h1>
<img id="flag" class="flag">
</div>

<div class="hero-search">
<input id="playerSearch" placeholder="Search player...">
<div id="searchResults" class="search-results"></div>
</div>

</div>

<div id="careerSummary" class="summary"></div>

<table>

<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Runs</th>
<th>Balls</th>
<th>Strike Rate</th>
</tr>
</thead>

<tbody id="tbody">
<tr>
<td colspan="7" class="center">Select player above</td>
</tr>
</tbody>

</table>

<script>

const INDEX="/data/t20-world-cup/matches/index.json";
const FOLDER="/data/t20-world-cup/matches/";

const input=document.getElementById("playerSearch");
const results=document.getElementById("searchResults");
const tbody=document.getElementById("tbody");
const playerName=document.getElementById("playerName");
const flag=document.getElementById("flag");
const careerSummary=document.getElementById("careerSummary");

let players=[];
let matches=[];
let country="";

/* BUILD SEARCH */

initSearch();

async function initSearch(){

try{

const files=await fetch(INDEX).then(r=>r.json());

let set=new Set();

for(const file of files){

const season=await fetch(FOLDER+file).then(r=>r.json());

season.forEach(match=>{

if(match.info && match.info.players){

Object.values(match.info.players)
.forEach(team=>{
team.forEach(name=>set.add(name));
});

}

});

}

players=[...set].sort();

}catch(e){
console.error("Search load failed",e);
}

}

/* SEARCH */

input.oninput=function(){

const q=this.value.toLowerCase();

results.innerHTML="";

if(!q){
results.style.display="none";
return;
}

players
.filter(name=>name.toLowerCase().includes(q))
.slice(0,30)
.forEach(name=>{

const div=document.createElement("div");

div.textContent=name;

div.onclick=()=>{
location.href=
"/t20-world-cup-player.html?player="+encodeURIComponent(name);
};

results.appendChild(div);

});

results.style.display="block";

};


/* LOAD PLAYER */

const param=new URLSearchParams(location.search).get("player");

if(param) loadPlayer(decodeURIComponent(param));


async function loadPlayer(player){

playerName.innerText=player;

matches=[];

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch(FOLDER+file).then(r=>r.json());

season.forEach(match=>{

if(!match.info || !match.innings) return;

let runs=0;
let balls=0;
let team="";

/* FIND TEAM */

Object.entries(match.info.players)
.forEach(([t,list])=>{
if(list.includes(player)){
team=t;
country=t;
}
});

/* READ INNINGS SAFELY */

match.innings.forEach(raw=>{

const inn=raw.team ? raw : Object.values(raw)[0];

if(!inn || !inn.overs) return;

inn.overs.forEach(over=>{

if(!over.deliveries) return;

over.deliveries.forEach(ball=>{

if(ball.batter===player){

runs+=ball.runs.batter;

if(!ball.extras || !ball.extras.wides)
balls++;

}

});

});

});

if(balls>0){

const opponent=match.info.teams.find(t=>t!==team);

matches.push({
season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent,
venue:match.info.venue,
runs,
balls
});

}

});

}

renderSummary();
renderTable();

flag.src="https://flagcdn.com/w80/"+countryCode(country)+".png";

}


/* SUMMARY */

function renderSummary(){

let runs=0;
let balls=0;

matches.forEach(m=>{
runs+=m.runs;
balls+=m.balls;
});

careerSummary.innerHTML=`
<div class="box">
<div class="big">${matches.length}</div>
Matches
</div>

<div class="box">
<div class="big">${runs}</div>
Runs
</div>

<div class="box">
<div class="big">${balls?((runs/balls)*100).toFixed(1):"-"}</div>
Strike Rate
</div>
`;

}


/* TABLE */

function renderTable(){

tbody.innerHTML="";

matches.forEach(m=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100).toFixed(1)}</td>
`;

tbody.appendChild(tr);

});

}


/* COUNTRY CODE */

function countryCode(name){

const map={
India:"in",
Australia:"au",
England:"gb",
Pakistan:"pk",
South Africa:"za",
New Zealand:"nz",
Sri Lanka:"lk",
West Indies:"jm",
Afghanistan:"af",
Bangladesh:"bd"
};

return map[name]||"un";

}

</script>

</body>
</html>
