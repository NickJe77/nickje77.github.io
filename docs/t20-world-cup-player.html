<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.hero-left h1{
margin:0;
font-size:42px;
}

.hero-left p{
margin-top:6px;
opacity:.9;
}

/* SEARCH */

.search-container{
position:relative;
width:300px;
}

.search-container input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
}

.search-results{
position:absolute;
top:48px;
left:0;
right:0;
background:white;
color:black;
border-radius:10px;
max-height:300px;
overflow-y:auto;
display:none;
box-shadow:0 4px 12px rgba(0,0,0,.2);
z-index:999;
}

.search-results div{
padding:10px;
cursor:pointer;
}

.search-results div:hover{
background:#eee;
}

/* CONTROLS */

.controls{
display:flex;
gap:14px;
padding:0 20px 20px 20px;
align-items:center;
}

select{
padding:8px;
font-size:16px;
border-radius:8px;
}

.tab{
padding:8px 18px;
background:#ddd;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.tab.active{
background:#d00000;
color:white;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.box{
background:#e7e7ec;
padding:18px;
border-radius:14px;
text-align:center;
}

.box .big{
font-size:30px;
font-weight:700;
}

/* TABLE */

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

th{
background:#f1f1f1;
cursor:pointer;
}

tr:hover{
background:#f8fbff;
cursor:pointer;
}

.section-title{
text-align:center;
font-weight:700;
margin-top:10px;
color:#666;
}

</style>
</head>
<body>

<div class="navbar" style="
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
background:white;
">

<a href="index.html" style="color:#0056d6;text-decoration:none;font-size:18px;">Home</a>

<a href="t20-world-cup.html" style="color:#0056d6;text-decoration:none;font-size:18px;">T20 World Cup</a>

<a href="t20-world-cup-matches.html" style="color:#0056d6;text-decoration:none;font-size:18px;">Matches</a>

<a href="t20-world-cup-player.html" style="color:#0056d6;text-decoration:none;font-size:18px;">Players</a>

<a href="t20-world-cup-teams.html" style="color:#0056d6;text-decoration:none;font-size:18px;">Teams</a>

</div>


<div class="hero">

<div class="hero-left">

<h1 id="playerName">Select player</h1>
<p>T20 World Cup batting & bowling performance by opposition</p>

</div>

<div class="search-container">

<input id="playerSearch" placeholder="Search player...">

<div id="searchResults" class="search-results"></div>

</div>

</div>


<div class="controls">

<label>Opposition:</label>

<select id="oppFilter">
<option value="ALL">All</option>
</select>

<div id="batTab" class="tab active">Batting</div>
<div id="bowlTab" class="tab">Bowling</div>

</div>


<div class="section-title">CAREER SUMMARY</div>

<div id="careerSummary" class="summary"></div>


<div class="section-title">VS OPPOSITION</div>

<div id="oppSummary" class="summary"></div>


<table id="matchTable">

<thead>

<tr>

<th onclick="sortTable('season')">Season</th>
<th onclick="sortTable('date')">Date</th>
<th onclick="sortTable('opponent')">Opponent</th>
<th onclick="sortTable('venue')">Venue</th>

<th id="col1">Runs</th>
<th id="col2">Balls</th>
<th id="col3">Strike Rate</th>

</tr>

</thead>

<tbody></tbody>

</table>


<script>

const INDEX="/data/t20-world-cup/matches/index.json";

let players=[];
let matches=[];

let currentOpp="ALL";
let currentTab="bat";

let sortField="date";
let sortAsc=false;


/* LOAD SEARCH INDEX */

async function initSearch(){

const files=await fetch(INDEX).then(r=>r.json());

const set=new Set();

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach(match=>{

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

set.add(d.batter);
set.add(d.bowler);

});

});

});

});

}

players=[...set].sort();

}

initSearch();


/* SEARCH UI */

playerSearch.oninput=function(){

const q=this.value.toLowerCase();

if(!q){

searchResults.style.display="none";
return;

}

const filtered=players.filter(p=>p.toLowerCase().includes(q)).slice(0,30);

searchResults.innerHTML="";

filtered.forEach(name=>{

const div=document.createElement("div");

div.textContent=name;

div.onclick=()=>{

location.href="?player="+encodeURIComponent(name);

};

searchResults.appendChild(div);

});

searchResults.style.display="block";

};


/* LOAD PLAYER */

const player=new URLSearchParams(location.search).get("player");

if(player)
loadPlayer(player);


async function loadPlayer(player){

playerName.innerText=player;

matches=[];

const files=await fetch(INDEX).then(r=>r.json());

let playerCountry="";

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach((match,index)=>{

const team=Object.keys(match.info.players||{})
.find(t=>match.info.players[t].includes(player));

if(team) playerCountry=team;

let runs=0,balls=0,wkts=0,ballsBowled=0,runsConceded=0;

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

if(d.batter===player){

runs+=d.runs.batter;

if(!d.extras?.wides) balls++;

}

if(d.bowler===player){

runsConceded+=d.runs.total;

if(!d.extras?.wides&&!d.extras?.noballs)
ballsBowled++;

if(d.wickets)
wkts+=d.wickets.length;

}

});

});

});

if(runs||wkts){

const opponent=match.info.teams.find(t=>t!==playerCountry);

matches.push({

season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent,
venue:match.info.venue,
runs,
balls,
wkts,
ballsBowled,
runsConceded,
file,
index

});

}

});

}

populateOppFilter();
render();

}


/* OPP FILTER */

function populateOppFilter(){

const set=new Set(matches.map(m=>m.opponent));

set.forEach(o=>{

oppFilter.innerHTML+=`<option>${o}</option>`;

});

oppFilter.onchange=e=>{

currentOpp=e.target.value;
render();

};

}


/* TABS */

batTab.onclick=()=>{

currentTab="bat";

setTabs();

render();

};

bowlTab.onclick=()=>{

currentTab="bowl";

setTabs();

render();

};


function setTabs(){

batTab.classList.toggle("active",currentTab==="bat");
bowlTab.classList.toggle("active",currentTab==="bowl");

}


/* SUMMARY */

function calcBat(list){

let runs=0,balls=0,matches=0,best=0;

list.forEach(m=>{

runs+=m.runs;
balls+=m.balls;

if(m.runs>0) matches++;

if(m.runs>best) best=m.runs;

});

return{

matches,
runs,
avg:matches?(runs/matches).toFixed(1):"-",
sr:balls?((runs/balls)*100).toFixed(1):"-",
best

};

}


function calcBowl(list){

let wkts=0,balls=0,runs=0,matches=0,best=0;

list.forEach(m=>{

wkts+=m.wkts;
balls+=m.ballsBowled;
runs+=m.runsConceded;

if(m.wkts>0) matches++;

if(m.wkts>best) best=m.wkts;

});

return{

matches,
overs:(balls/6).toFixed(1),
wkts,
avg:wkts?(runs/wkts).toFixed(1):"-",
econ:balls?(runs/(balls/6)).toFixed(2):"-",
best

};

}


function renderSummary(divId,s){

const div=document.getElementById(divId);

if(currentTab==="bat"){

div.innerHTML=`

<div class="box"><div class="big">${s.matches}</div>Matches</div>

<div class="box"><div class="big">${s.runs}</div>Runs</div>

<div class="box"><div class="big">${s.avg}</div>Average</div>

<div class="box"><div class="big">${s.sr}</div>Strike Rate</div>

<div class="box"><div class="big">${s.best}</div>Best</div>

`;

}else{

div.innerHTML=`

<div class="box"><div class="big">${s.matches}</div>Matches</div>

<div class="box"><div class="big">${s.overs}</div>Overs</div>

<div class="box"><div class="big">${s.wkts}</div>Wickets</div>

<div class="box"><div class="big">${s.avg}</div>Average</div>

<div class="box"><div class="big">${s.econ}</div>Economy</div>

<div class="box"><div class="big">${s.best}</div>Best</div>

`;

}

}


/* RENDER */

function render(){

const filtered=currentOpp==="ALL"
?matches
:matches.filter(m=>m.opponent===currentOpp);

const career=currentTab==="bat"?calcBat(matches):calcBowl(matches);

const opp=currentTab==="bat"?calcBat(filtered):calcBowl(filtered);

renderSummary("careerSummary",career);

renderSummary("oppSummary",opp);

renderTable(filtered);

}


/* TABLE */

function sortTable(field){

sortAsc=field===sortField?!sortAsc:true;

sortField=field;

render();

}


function renderTable(list){

const tbody=document.querySelector("#matchTable tbody");

list.sort((a,b)=>{

let A=a[sortField];
let B=b[sortField];

return sortAsc?A>B?1:-1:A<B?1:-1;

});

tbody.innerHTML="";

list.forEach(m=>{

const tr=document.createElement("tr");

tr.onclick=()=>{

location.href=`t20-world-cup-match.html?file=${m.file}&match=${m.index}`;

};

tr.innerHTML=currentTab==="bat"

?`

<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100||0).toFixed(1)}</td>

`

:

`

<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.wkts}</td>
<td>${(m.ballsBowled/6).toFixed(1)}</td>
<td>${(m.runsConceded/(m.ballsBowled/6)||0).toFixed(2)}</td>

`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
