<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:28px;
display:flex;
justify-content:space-between;
align-items:center;
}

.hero-title{
font-size:42px;
font-weight:800;
}

/* SEARCH */

.search-wrap{
position:relative;
width:320px;
}

.search-wrap input{
width:100%;
padding:12px;
border-radius:12px;
border:none;
}

/* TABS */

.tabs{
display:flex;
gap:10px;
padding:0 20px;
}

.tab{
padding:10px 18px;
background:#ddd;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.tab.active{
background:#d00000;
color:white;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.summary-box{
background:#e7e7ec;
padding:12px;
border-radius:10px;
text-align:center;
}

/* TABLE */

.container{
padding:20px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

.match-link{
color:#0056d6;
font-weight:600;
text-decoration:none;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>


<div class="hero">

<div id="playerName" class="hero-title">
Select a player
</div>

<div class="search-wrap">
<input id="playerSearch" placeholder="Search player...">
</div>

</div>


<!-- TABS -->

<div class="tabs">

<div id="batTab" class="tab active">Batting</div>
<div id="bowlTab" class="tab">Bowling</div>

</div>


<!-- SUMMARY -->

<div id="careerSummary" class="summary"></div>


<div class="container">

<table id="matchTable">

<tr>
<th>Date</th>
<th>Match</th>
<th id="col3">Runs</th>
<th id="col4">Balls</th>
<th id="col5">Strike Rate</th>
</tr>

</table>

</div>


<script>

const INDEX="/data/t20-world-cup/matches/index.json";

let battingStats={
matches:0,runs:0,balls:0,fifties:0,hundreds:0
};

let bowlingStats={
matches:0,wkts:0,balls:0,runs:0
};

let allMatches=[];

let currentTab="bat";

init();
loadPlayerFromURL();


async function init(){

const files=await fetch(INDEX).then(r=>r.json());

const set=new Set();

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach(match=>{

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

set.add(d.batter);
set.add(d.bowler);

});

});

});

});

}

const players=[...set].sort();

const input=document.getElementById("playerSearch");

input.oninput=function(){

const p=players.find(x=>x.toLowerCase()===this.value.toLowerCase());

if(p)
location.href="?player="+encodeURIComponent(p);

};

}


/* LOAD PLAYER */

function loadPlayerFromURL(){

const params=new URLSearchParams(location.search);

const player=params.get("player");

if(player)
loadPlayer(player);

}


async function loadPlayer(player){

document.getElementById("playerName").innerText=player;

resetStats();

const files=await fetch(INDEX).then(r=>r.json());

for(const file of files){

const season=await fetch("/data/t20-world-cup/matches/"+file).then(r=>r.json());

season.forEach((match,index)=>{

let runs=0,balls=0,wkts=0,ballsBowled=0,runsConceded=0;

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

if(d.batter===player){

runs+=d.runs.batter;

if(!d.extras?.wides)
balls++;

}

if(d.bowler===player){

runsConceded+=d.runs.total;

if(!d.extras?.wides && !d.extras?.noballs)
ballsBowled++;

if(d.wickets)
wkts+=d.wickets.length;

}

});

});

});

if(runs||wkts){

battingStats.matches++;
battingStats.runs+=runs;
battingStats.balls+=balls;

if(runs>=50) battingStats.fifties++;
if(runs>=100) battingStats.hundreds++;

bowlingStats.matches++;
bowlingStats.wkts+=wkts;
bowlingStats.balls+=ballsBowled;
bowlingStats.runs+=runsConceded;

allMatches.push({
match,file,index,runs,balls,wkts,ballsBowled,runsConceded
});

}

});

}

renderBatting();

renderMatches();

}


/* TABS */

document.getElementById("batTab").onclick=function(){

currentTab="bat";
setTab();
renderBatting();
renderMatches();

};

document.getElementById("bowlTab").onclick=function(){

currentTab="bowl";
setTab();
renderBowling();
renderMatches();

};


function setTab(){

document.getElementById("batTab").classList.toggle("active",currentTab==="bat");
document.getElementById("bowlTab").classList.toggle("active",currentTab==="bowl");

}


/* SUMMARY */

function renderBatting(){

document.getElementById("careerSummary").innerHTML=`

<div class="summary-box">Matches<br><strong>${battingStats.matches}</strong></div>

<div class="summary-box">Runs<br><strong>${battingStats.runs}</strong></div>

<div class="summary-box">Average<br><strong>${(battingStats.runs/battingStats.matches||0).toFixed(1)}</strong></div>

<div class="summary-box">Strike Rate<br><strong>${((battingStats.runs/battingStats.balls)*100||0).toFixed(1)}</strong></div>

<div class="summary-box">50s<br><strong>${battingStats.fifties}</strong></div>

<div class="summary-box">100s<br><strong>${battingStats.hundreds}</strong></div>

`;

}


function renderBowling(){

document.getElementById("careerSummary").innerHTML=`

<div class="summary-box">Matches<br><strong>${bowlingStats.matches}</strong></div>

<div class="summary-box">Wickets<br><strong>${bowlingStats.wkts}</strong></div>

<div class="summary-box">Average<br><strong>${(bowlingStats.runs/bowlingStats.wkts||0).toFixed(1)}</strong></div>

<div class="summary-box">Economy<br><strong>${(bowlingStats.runs/(bowlingStats.balls/6)||0).toFixed(2)}</strong></div>

<div class="summary-box">Overs<br><strong>${Math.floor(bowlingStats.balls/6)+"."+(bowlingStats.balls%6)}</strong></div>

`;

}


/* MATCH TABLE */

function renderMatches(){

const table=document.getElementById("matchTable");

table.innerHTML=table.rows[0].outerHTML;

allMatches.forEach(m=>{

const row=document.createElement("tr");

row.innerHTML=currentTab==="bat"?`

<td>${new Date(m.match.info.dates[0]).toLocaleDateString("en-GB")}</td>

<td>
<a href="t20-world-cup-match.html?file=${m.file}&match=${m.index}" class="match-link">
${m.match.info.teams.join(" vs ")}
</a>
</td>

<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100||0).toFixed(1)}</td>

`

:

`

<td>${new Date(m.match.info.dates[0]).toLocaleDateString("en-GB")}</td>

<td>
<a href="t20-world-cup-match.html?file=${m.file}&match=${m.index}" class="match-link">
${m.match.info.teams.join(" vs ")}
</a>
</td>

<td>${m.wkts}</td>
<td>${Math.floor(m.ballsBowled/6)+"."+(m.ballsBowled%6)}</td>
<td>${(m.runsConceded/(m.ballsBowled/6)||0).toFixed(2)}</td>

`;

table.appendChild(row);

});

}


function resetStats(){

battingStats={matches:0,runs:0,balls:0,fifties:0,hundreds:0};
bowlingStats={matches:0,wkts:0,balls:0,runs:0};
allMatches=[];

}

</script>

</body>
</html>
