<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.page{
max-width:1200px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

.controls{
display:flex;
gap:10px;
align-items:center;
margin-bottom:20px;
}

select,button{
padding:8px 14px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
cursor:pointer;
}

button.active{
background:#e10600;
color:#fff;
border:none;
}

.summaryTitle{
text-align:center;
font-weight:700;
margin:20px 0 10px;
}

.summaryGrid{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:14px;
margin-bottom:20px;
}

.box{
background:#fff;
padding:16px;
border-radius:12px;
text-align:center;
}

.box .value{
font-size:24px;
font-weight:700;
}

.box .label{
font-size:14px;
color:#666;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f8fbff;
}

.matchLink{
color:#0056d6;
font-weight:600;
text-decoration:none;
}

.matchLink:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName"></h1>
<div>T20 World Cup batting & bowling performance</div>
</div>

<div class="controls">

<label>Opposition:</label>

<select id="oppSelect">
<option value="All">All</option>
</select>

<button id="batBtn" class="active">Batting</button>
<button id="bowlBtn">Bowling</button>

</div>

<div class="summaryTitle">CAREER SUMMARY</div>
<div class="summaryGrid" id="careerBoxes"></div>

<div class="summaryTitle">VS OPPOSITION</div>
<div class="summaryGrid" id="oppBoxes"></div>

<table>

<thead>
<tr>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th id="col1"></th>
<th id="col2"></th>
<th id="col3"></th>
<th id="col4"></th>
</tr>
</thead>

<tbody id="matchRows"></tbody>

</table>

</div>

<script>

const params=new URLSearchParams(window.location.search);
const player=params.get("player");

document.getElementById("playerName").innerText=player;

const folder="data/t20-world-cup/matches/";

let allMatches=[];
let mode="batting";

load();

async function load(){

const index=await fetch(folder+"index.json").then(r=>r.json());

for(const file of index){

const matches=await fetch(folder+file).then(r=>r.json());

matches.forEach(match=>{

match.innings.forEach(inn=>{

const opponent=match.info.teams.find(t=>t!==inn.team);

let bat={runs:0,balls:0};
let bowl={balls:0,runs:0,wickets:0};

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

const legal=!d.extras?.wides&&!d.extras?.noballs;

if(d.batter===player){

bat.runs+=d.runs.batter;
if(legal) bat.balls++;

}

if(d.bowler===player){

bowl.runs+=d.runs.total;
if(legal) bowl.balls++;

if(d.wickets){

d.wickets.forEach(w=>{
if(w.kind!=="run out") bowl.wickets++;
});

}

}

});

});

if(bat.runs>0||bat.balls>0||bowl.balls>0){

allMatches.push({

date:match.info.dates[0],
opponent,
venue:match.info.venue,
bat,
bowl,
file:file,
id:match.info.match_id

});

}

});

});

}

populateOpps();
renderCareer();
renderFiltered();

}

function populateOpps(){

const opps=[...new Set(allMatches.map(m=>m.opponent))];

const sel=document.getElementById("oppSelect");

opps.sort().forEach(o=>{
sel.innerHTML+=`<option value="${o}">${o}</option>`;
});

sel.onchange=renderFiltered;

}

document.getElementById("batBtn").onclick=()=>{
mode="batting";
setActive();
renderCareer();
renderFiltered();
};

document.getElementById("bowlBtn").onclick=()=>{
mode="bowling";
setActive();
renderCareer();
renderFiltered();
};

function setActive(){

batBtn.classList.toggle("active",mode==="batting");
bowlBtn.classList.toggle("active",mode==="bowling");

}

/* CAREER SUMMARY — ALWAYS ALL MATCHES */

function renderCareer(){

renderBoxes(allMatches,"careerBoxes");

}

/* VS OPPOSITION — FILTERED */

function renderFiltered(){

const opp=document.getElementById("oppSelect").value;

const matches=opp==="All"
?allMatches
:allMatches.filter(m=>m.opponent===opp);

renderBoxes(matches,"oppBoxes");

renderTable(matches);

}

function renderBoxes(matches,target){

const el=document.getElementById(target);

if(mode==="batting"){

const runs=sum(matches,m=>m.bat.runs);
const balls=sum(matches,m=>m.bat.balls);

el.innerHTML=
box("Matches",matches.length)+
box("Runs",runs)+
box("Balls",balls)+
box("Average",runs)+
box("Strike Rate",balls?(runs/balls*100).toFixed(1):"-")+
box("50s","-");

}else{

const balls=sum(matches,m=>m.bowl.balls);
const runs=sum(matches,m=>m.bowl.runs);
const wk=sum(matches,m=>m.bowl.wickets);

el.innerHTML=
box("Matches",matches.length)+
box("Overs",(balls/6).toFixed(1))+
box("Wickets",wk)+
box("Average",wk?(runs/wk).toFixed(2):"-")+
box("Economy",balls?(runs/(balls/6)).toFixed(2):"-")+
box("Best","-");

}

}

function renderTable(matches){

const tbody=document.getElementById("matchRows");
tbody.innerHTML="";

if(mode==="batting"){

col1.innerText="Runs";
col2.innerText="Balls";
col3.innerText="SR";
col4.innerText="";

matches.forEach(m=>{

tbody.innerHTML+=`

<tr>

<td>${m.date}</td>

<td>
<a class="matchLink"
href="t20-world-cup-match.html?file=${folder}${m.file}&match=${m.id}">
${m.opponent}
</a>
</td>

<td>${m.venue}</td>

<td>${m.bat.runs}</td>
<td>${m.bat.balls}</td>
<td>${m.bat.balls?(m.bat.runs/m.bat.balls*100).toFixed(1):""}</td>
<td></td>

</tr>

`;

});

}else{

col1.innerText="Overs";
col2.innerText="Runs";
col3.innerText="Wkts";
col4.innerText="Econ";

matches.forEach(m=>{

const overs=(m.bowl.balls/6).toFixed(1);

tbody.innerHTML+=`

<tr>

<td>${m.date}</td>

<td>
<a class="matchLink"
href="t20-world-cup-match.html?file=${folder}${m.file}&match=${m.id}">
${m.opponent}
</a>
</td>

<td>${m.venue}</td>

<td>${overs}</td>
<td>${m.bowl.runs}</td>
<td>${m.bowl.wickets}</td>
<td>${m.bowl.balls?(m.bowl.runs/(m.bowl.balls/6)).toFixed(2):""}</td>

</tr>

`;

});

}

}

function box(label,value){

return `<div class="box">
<div class="value">${value}</div>
<div class="label">${label}</div>
</div>`;

}

function sum(arr,fn){

return arr.reduce((a,b)=>a+fn(b),0);

}

</script>

</body>
</html>
