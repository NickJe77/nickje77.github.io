<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
}

.hero h1{
margin:0;
font-size:42px;
}

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

tr:hover{
background:#f8fbff;
cursor:pointer;
}

</style>
</head>
<body>

<div class="hero">
<h1 id="playerName">Loading player...</h1>
</div>

<table>

<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Runs</th>
<th>Balls</th>
<th>Strike Rate</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<script>

const MATCH_INDEX =
"data/t20-world-cup/matches/index.json";

const MATCH_FOLDER =
"data/t20-world-cup/matches/";

const NAME_INDEX =
"data/t20-world-cup/players-name.json";

let nameMap={};
let reverseMap={};

let matches=[];


/* SAFE FETCH */

async function safeFetch(url)
{
const res=await fetch(url);

if(!res.ok)
throw new Error("Failed to load "+url);

return res.json();
}


/* INIT */

init();


async function init()
{

try{

/* LOAD NAME MAP */

nameMap=await safeFetch(NAME_INDEX);

Object.entries(nameMap).forEach(([raw,proper])=>
{
reverseMap[proper]=raw;
});


/* GET PLAYER FROM URL */

const param=
new URLSearchParams(location.search)
.get("player");

if(!param)
{
playerName.innerText="No player specified";
return;
}

const player=
reverseMap[param] || param;

playerName.innerText=
nameMap[player] || player;


/* LOAD MATCH INDEX */

const files=
await safeFetch(MATCH_INDEX);


/* LOAD MATCHES */

for(const file of files)
{

const season=
await safeFetch(MATCH_FOLDER+file);

season.forEach((match,index)=>
{

let runs=0;
let balls=0;

match.innings.forEach(raw=>
{

const inn=
raw.team
? raw
: Object.values(raw)[0];

inn.overs?.forEach(over=>
{

over.deliveries.forEach(d=>
{

if(d.batter===player)
{

runs+=d.runs.batter;

if(!d.extras?.wides)
balls++;

}

});

});

});


if(balls>0)
{

const team=
Object.keys(match.info.players || {})
.find(t=>
match.info.players[t]?.includes(player)
);

const opponent=
match.info.teams.find(t=>t!==team);

matches.push({

season:
file.match(/\d{4}/)[0],

date:
match.info.dates[0],

opponent,

venue:
match.info.venue,

runs,

balls,

file,

index

});

}

});

}


/* RENDER */

render();

}
catch(err)
{

playerName.innerText="Error loading player";

console.error(err);

}

}


/* RENDER TABLE */

function render()
{

const tbody=
document.getElementById("tbody");

tbody.innerHTML="";

matches.sort((a,b)=>
new Date(b.date)-new Date(a.date)
);

matches.forEach(m=>
{

const tr=
document.createElement("tr");

tr.onclick=()=>
{

location.href=
`t20-world-cup-match.html?file=${m.file}&match=${m.index}`;

};

tr.innerHTML=`

<td>${m.season}</td>

<td>${new Date(m.date)
.toLocaleDateString("en-GB")}</td>

<td>${m.opponent}</td>

<td>${m.venue}</td>

<td>${m.runs}</td>

<td>${m.balls}</td>

<td>${((m.runs/m.balls)*100).toFixed(1)}</td>

`;

tbody.appendChild(tr);

});

}

</script>

</body>
</html>
