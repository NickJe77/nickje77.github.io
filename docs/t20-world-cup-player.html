<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
background:white;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
}

.hero h1{
margin:0;
font-size:42px;
}

/* TABLE */

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

th{
background:#f1f1f1;
}

tr:hover{
background:#f8fbff;
cursor:pointer;
}

.center{
text-align:center;
padding:40px;
font-size:20px;
color:#666;
}

</style>
</head>
<body>


<div class="navbar">

<a href="index.html">Home</a>
<a href="t20-world-cup.html">T20 World Cup</a>
<a href="t20wc-matches.html">Matches</a>
<a href="t20-world-cup-player.html">Players</a>
<a href="t20wc-teams.html">Teams</a>

</div>


<div class="hero">

<h1 id="playerName">Loading player...</h1>

</div>


<table>

<thead>

<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Runs</th>
<th>Balls</th>
<th>Strike Rate</th>
</tr>

</thead>

<tbody id="tbody">

<tr>
<td colspan="7" class="center">Loading...</td>
</tr>

</tbody>

</table>



<script>

/* CORRECT PATHS */

const INDEX =
"data/t20-world-cup/matches/index.json";

const MATCH_FOLDER =
"data/t20-world-cup/matches/";

const NAME_INDEX =
"data/t20-world-cup/matches/player-names.json";


let nameMap={};
let reverseMap={};
let matches=[];


/* START */

init();


async function init()
{

try{

/* LOAD NAME MAP */

nameMap =
await fetch(NAME_INDEX)
.then(r=>r.json());

Object.entries(nameMap)
.forEach(([raw,proper])=>
{
reverseMap[proper]=raw;
});


/* GET PLAYER */

const param =
new URLSearchParams(location.search)
.get("player");

if(!param)
{
showError("No player specified");
return;
}

const player =
reverseMap[param] || param;

playerName.innerText =
nameMap[player] || player;


/* LOAD INDEX */

const files =
await fetch(INDEX)
.then(r=>r.json());


/* LOAD MATCHES */

for(const file of files)
{

const season =
await fetch(MATCH_FOLDER + file)
.then(r=>r.json());


season.forEach((match,index)=>
{

let runs=0;
let balls=0;


/* FIND PLAYER TEAM */

let playerTeam="";

Object.entries(match.info.players||{})
.forEach(([team,list])=>
{
if(list.includes(player))
playerTeam=team;
});


/* PARSE INNINGS */

match.innings.forEach(raw=>
{

const inn =
raw.team
? raw
: Object.values(raw)[0];

inn.overs?.forEach(over=>
{

over.deliveries.forEach(d=>
{

if(d.batter===player)
{

runs+=d.runs.batter;

if(!d.extras?.wides)
balls++;

}

});

});

});


/* STORE RESULT */

if(balls>0)
{

const opponent =
match.info.teams.find(t=>t!==playerTeam);

matches.push({

season:
file.match(/\d{4}/)[0],

date:
match.info.dates[0],

opponent,

venue:
match.info.venue,

runs,

balls,

file,

index

});

}

});

}


/* SHOW */

render();


}
catch(err)
{

console.error(err);

showError("Error loading player");

}

}



/* RENDER */

function render()
{

const tbody =
document.getElementById("tbody");

if(matches.length===0)
{
showError("No matches found");
return;
}


matches.sort((a,b)=>
new Date(b.date)-new Date(a.date)
);


tbody.innerHTML="";


matches.forEach(m=>
{

const tr =
document.createElement("tr");


tr.onclick=()=>
{

location.href =
`t20-world-cup-match.html?file=${m.file}&match=${m.index}`;

};


tr.innerHTML=`

<td>${m.season}</td>

<td>${new Date(m.date)
.toLocaleDateString("en-GB")}</td>

<td>${m.opponent}</td>

<td>${m.venue}</td>

<td>${m.runs}</td>

<td>${m.balls}</td>

<td>${((m.runs/m.balls)*100)
.toFixed(1)}</td>

`;


tbody.appendChild(tr);

});

}



/* ERROR */

function showError(msg)
{

document.getElementById("tbody").innerHTML=`

<tr>
<td colspan="7" class="center">${msg}</td>
</tr>

`;

}

</script>


</body>
</html>
