<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
background:white;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:20px;
}

.hero-left{
flex:1;
text-align:center;
}

.hero-left h1{
margin:0;
font-size:44px;
}

.hero-left p{
margin-top:6px;
opacity:.9;
}

.flag{
width:60px;
margin-top:10px;
border-radius:6px;
}

/* SEARCH */

.hero-search{
width:280px;
position:relative;
}

.hero-search input{
width:100%;
padding:12px;
font-size:16px;
border-radius:10px;
border:none;
}

.search-results{
position:absolute;
top:48px;
background:white;
color:black;
width:100%;
border-radius:10px;
box-shadow:0 4px 12px rgba(0,0,0,.2);
max-height:300px;
overflow:auto;
display:none;
z-index:999;
}

.search-results div{
padding:10px;
cursor:pointer;
}

.search-results div:hover{
background:#eee;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:16px;
padding:0 20px;
margin-top:14px;
}

.box{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.big{
font-size:28px;
font-weight:700;
color:#d00000;
}

/* TABLE */

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:14px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:center;
}

th{
background:#f5f5f5;
}

.center{
padding:40px;
color:#666;
}

</style>
</head>
