<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
background:white;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px 30px 36px 30px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:20px;
}

.hero-left{
text-align:center;
flex:1;
}

.hero-left h1{
margin:0;
font-size:44px;
}

.hero-left p{
margin:6px 0 0 0;
font-size:18px;
opacity:.9;
}

/* FLAG */

.flag{
width:60px;
border-radius:6px;
margin-top:10px;
}

/* SEARCH IN HERO */

.hero-search{
width:280px;
}

.hero-search input{
width:100%;
padding:12px;
font-size:16px;
border-radius:10px;
border:none;
}

/* SEARCH RESULTS */

.search-results{
position:absolute;
background:white;
color:black;
width:280px;
border-radius:10px;
box-shadow:0 4px 12px rgba(0,0,0,.2);
max-height:300px;
overflow:auto;
display:none;
z-index:999;
}

.search-results div{
padding:10px;
cursor:pointer;
}

.search-results div:hover{
background:#eee;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:16px;
padding:0 20px;
margin-top:14px;
}

.box{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.box .big{
font-size:28px;
font-weight:700;
color:#d00000;
}

/* CONTROLS */

.controls{
display:flex;
gap:12px;
padding:20px;
align-items:center;
flex-wrap:wrap;
}

select{
padding:14px;
font-size:18px;
border-radius:8px;
border:1px solid #ccc;
}
