<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
background:white;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.hero-left{
flex:1;
text-align:center;
}

.hero-left h1{
margin:0;
font-size:42px;
}

.flag{
width:70px;
margin-top:10px;
}

.hero-search{
width:300px;
position:relative;
}

.hero-search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
color:black;
}

.search-results{
position:absolute;
top:48px;
left:0;
right:0;
background:white;
color:black;
border-radius:10px;
max-height:300px;
overflow:auto;
display:none;
box-shadow:0 4px 12px rgba(0,0,0,.2);
z-index:999;
}

.search-results div{
padding:10px;
cursor:pointer;
}

.search-results div:hover{
background:#eee;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
padding:20px;
}

.box{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
}

.big{
font-size:30px;
font-weight:700;
color:#d00000;
}

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

</style>
</head>
<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/t20-world-cup.html">T20 World Cup</a>
<a href="/t20wc-matches.html">Matches</a>
<a href="/t20-world-cup-player.html">Players</a>
<a href="/t20wc-teams.html">Teams</a>
</div>

<div class="hero">

<div class="hero-left">
<h1 id="playerName">Select Player</h1>
<img id="flag" class="flag">
</div>

<div class="hero-search">
<input id="playerSearch" placeholder="Search player...">
<div id="searchResults" class="search-results"></div>
</div>

</div>

<div id="careerSummary" class="summary"></div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Runs</th>
<th>Balls</th>
<th>Strike Rate</th>
</tr>
</thead>

<tbody id="tbody"></tbody>
</table>

<script>

const INDEX="/data/t20-world-cup/matches/index.json";
const BASE="/data/t20-world-cup/matches/";

let players=[];
let matches=[];

const search=document.getElementById("playerSearch");
const results=document.getElementById("searchResults");

init();

async function init(){

const files=await fetch(INDEX).then(r=>r.json());

let set=new Set();

for(const file of files){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{

Object.values(match.info.players)
.forEach(team=>{
team.forEach(p=>set.add(p));
});

});

}

players=[...set].sort();

}

/* SEARCH */

search.oninput=function(){

const q=this.value.toLowerCase();

results.innerHTML="";

if(!q){
results.style.display="none";
return;
}

players
.filter(p=>p.toLowerCase().includes(q))
.slice(0,30)
.forEach(name=>{

const div=document.createElement("div");

div.innerText=name;

div.onclick=()=>{
location.href="?player="+encodeURIComponent(name);
};

results.appendChild(div);

});

results.style.display="block";

};

/* LOAD PLAYER */

const param=new URLSearchParams(location.search).get("player");

if(param) loadPlayer(param);

async function loadPlayer(player){

document.getElementById("playerName").innerText=player;

const files=await fetch(INDEX).then(r=>r.json());

matches=[];

for(const file of files){

const season=await fetch(BASE+file).then(r=>r.json());

season.forEach(match=>{

let team="";

Object.entries(match.info.players)
.forEach(([t,list])=>{
if(list.includes(player)) team=t;
});

if(!team) return;

let runs=0;
let balls=0;

match.innings.forEach(innRaw=>{

const inn=innRaw.team?innRaw:Object.values(innRaw)[0];

inn.overs.forEach(over=>{

over.deliveries.forEach(ball=>{

if(ball.batter===player){

runs+=ball.runs.batter;

if(!ball.extras?.wides) balls++;

}

});

});

});

matches.push({

season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent:match.info.teams.find(t=>t!==team),
venue:match.info.venue,
runs,
balls

});

});

}

render();

}

function render(){

const tbody=document.getElementById("tbody");

tbody.innerHTML="";

let totalRuns=0,totalBalls=0;

matches.forEach(m=>{

totalRuns+=m.runs;
totalBalls+=m.balls;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString()}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100||0).toFixed(1)}</td>
`;

tbody.appendChild(tr);

});

document.getElementById("careerSummary").innerHTML=`
<div class="box"><div class="big">${matches.length}</div>Matches</div>
<div class="box"><div class="big">${totalRuns}</div>Runs</div>
<div class="box"><div class="big">${((totalRuns/totalBalls)*100||0).toFixed(1)}</div>Strike Rate</div>
`;

}

</script>

</body>
</html>
