<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
background:white;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:36px;
margin:20px;
border-radius:18px;
}

.hero h1{
margin:0;
font-size:42px;
}

table{
width:calc(100% - 40px);
margin:20px;
background:white;
border-collapse:collapse;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

.center{
text-align:center;
padding:40px;
font-size:20px;
color:#666;
}

tr:hover{
background:#f8fbff;
cursor:pointer;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="t20-world-cup.html">T20 World Cup</a>
<a href="t20wc-matches.html">Matches</a>
<a href="t20-world-cup-player.html">Players</a>
<a href="t20wc-teams.html">Teams</a>
</div>

<div class="hero">
<h1 id="playerName">Loading player...</h1>
</div>

<table>

<thead>
<tr>
<th>Season</th>
<th>Date</th>
<th>Opponent</th>
<th>Venue</th>
<th>Runs</th>
<th>Balls</th>
<th>Strike Rate</th>
</tr>
</thead>

<tbody id="tbody">
<tr>
<td colspan="7" class="center">Loading...</td>
</tr>
</tbody>

</table>


<script>

const INDEX="data/t20-world-cup/matches/index.json";
const MATCH_FOLDER="data/t20-world-cup/matches/";
const NAME_INDEX="data/t20-world-cup/matches/player-names.json";

let nameMap={};
let matches=[];

init();

async function init()
{

try{

/* LOAD NAME MAP IF EXISTS */

try{
nameMap=await fetch(NAME_INDEX).then(r=>r.json());
}catch{}


/* GET PLAYER FROM URL */

const displayName=
new URLSearchParams(location.search)
.get("player");

if(!displayName){
showError("No player specified");
return;
}

playerName.innerText=displayName;


/* BUILD ALL POSSIBLE NAME VARIANTS */

let possibleNames=new Set();

possibleNames.add(displayName);

/* check mapping both directions */

Object.entries(nameMap).forEach(([raw,full])=>{

if(full===displayName)
possibleNames.add(raw);

if(raw===displayName)
possibleNames.add(full);

});


/* LOAD INDEX */

const files=await fetch(INDEX).then(r=>r.json());


/* LOAD MATCHES */

for(const file of files){

const season=
await fetch(MATCH_FOLDER+file).then(r=>r.json());

season.forEach((match,index)=>{

let runs=0;
let balls=0;
let playerTeam="";

/* detect team */

Object.entries(match.info.players||{})
.forEach(([team,list])=>{

list.forEach(p=>{
if(possibleNames.has(p))
playerTeam=team;
});

});


match.innings.forEach(innRaw=>{

const inn=
innRaw.team
?innRaw
:Object.values(innRaw)[0];


/* format A */

if(inn.overs){

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

if(possibleNames.has(d.batter)){

runs+=d.runs.batter;

if(!d.extras?.wides)
balls++;

}

});

});

}


/* format B */

if(inn.deliveries){

inn.deliveries.forEach(d=>{

if(possibleNames.has(d.batter)){

runs+=d.runs.batter;

if(!d.extras?.wides)
balls++;

}

});

}

});


if(balls>0){

const opponent=
match.info.teams.find(t=>t!==playerTeam);

matches.push({

season:file.match(/\d{4}/)[0],
date:match.info.dates[0],
opponent,
venue:match.info.venue,
runs,
balls,
file,
index

});

}

});

}


render();

}
catch(err){

console.error(err);
showError("Error loading player");

}

}


function render(){

const tbody=document.getElementById("tbody");

if(matches.length===0){
showError("No matches found");
return;
}

matches.sort((a,b)=>
new Date(b.date)-new Date(a.date)
);

tbody.innerHTML="";

matches.forEach(m=>{

const tr=document.createElement("tr");

tr.onclick=()=>{
location.href=
`t20-world-cup-match.html?file=${m.file}&match=${m.index}`;
};

tr.innerHTML=`
<td>${m.season}</td>
<td>${new Date(m.date).toLocaleDateString("en-GB")}</td>
<td>${m.opponent}</td>
<td>${m.venue}</td>
<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${((m.runs/m.balls)*100).toFixed(1)}</td>
`;

tbody.appendChild(tr);

});

}


function showError(msg){

document.getElementById("tbody").innerHTML=
`<tr><td colspan="7" class="center">${msg}</td></tr>`;

}

</script>

</body>
</html>
