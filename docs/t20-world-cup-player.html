<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>T20 World Cup Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial;
margin:0;
background:#f4f6f8;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
border-bottom:1px solid #ddd;
background:#fff;
font-weight:600;
}

.page{
max-width:1100px;
margin:30px auto;
padding:0 20px;
}

.hero{
background:linear-gradient(90deg,#8b0000,#e10600);
color:#fff;
padding:30px;
border-radius:18px;
margin-bottom:20px;
}

.statsBox{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#f8fbff;
}

.matchLink{
color:#0056d6;
font-weight:600;
text-decoration:none;
}

.matchLink:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">
<h1 id="playerName">Loading...</h1>
</div>

<div id="careerStats"></div>

<div class="statsBox">

<h2>Match Log</h2>

<table>

<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Runs</th>
<th>Balls</th>
<th>SR</th>
<th>Wickets</th>
</tr>
</thead>

<tbody id="matchTable"></tbody>

</table>

</div>

</div>

<script>

const params=new URLSearchParams(window.location.search);
const player=params.get("player");

document.getElementById("playerName").innerText=player;

/* THIS IS THE CORRECT FOLDER */
const folder="data/t20-world-cup/matches/";

loadPlayer();

async function loadPlayer(){

const indexRes=await fetch(folder+"index.json");
const files=await indexRes.json();

let totalRuns=0;
let totalBalls=0;
let totalWickets=0;

let matchesPlayed=[];

for(const file of files){

const res=await fetch(folder+file);
const matches=await res.json();

for(const match of matches){

let runs=0;
let balls=0;
let wickets=0;

match.innings.forEach(inn=>{

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

const legal=!d.extras?.wides&&!d.extras?.noballs;

if(d.batter===player){

runs+=d.runs.batter;

if(legal) balls++;

}

if(d.bowler===player && d.wickets){

d.wickets.forEach(w=>{

if(w.kind!=="run out")
wickets++;

});

}

});

});

});

if(runs>0 || balls>0 || wickets>0){

totalRuns+=runs;
totalBalls+=balls;
totalWickets+=wickets;

matchesPlayed.push({

date:match.info.dates[0],
teams:match.info.teams.join(" vs "),
runs,
balls,
wickets,
file:file,
matchId:match.info.match_id

});

}

}

}

renderCareer(totalRuns,totalBalls,totalWickets,matchesPlayed);

}

function renderCareer(runs,balls,wickets,matches){

const avg=runs;
const sr=balls?((runs/balls)*100).toFixed(1):"";

document.getElementById("careerStats").innerHTML=`

<div class="statsBox">

<h2>Career Stats</h2>

<table>

<tr>
<th>Matches</th>
<th>Runs</th>
<th>Balls</th>
<th>Average</th>
<th>Strike Rate</th>
<th>Wickets</th>
</tr>

<tr>
<td>${matches.length}</td>
<td>${runs}</td>
<td>${balls}</td>
<td>${avg}</td>
<td>${sr}</td>
<td>${wickets}</td>
</tr>

</table>

</div>

`;

renderMatches(matches);

}

function renderMatches(matches){

const tbody=document.getElementById("matchTable");

matches.sort((a,b)=>new Date(b.date)-new Date(a.date));

matches.forEach(m=>{

const sr=m.balls?((m.runs/m.balls)*100).toFixed(1):"";

tbody.innerHTML+=`

<tr>

<td>${m.date}</td>

<td>
<a class="matchLink"
href="t20-world-cup-match.html?file=${folder}${m.file}&match=${m.matchId}">
${m.teams}
</a>
</td>

<td>${m.runs}</td>
<td>${m.balls}</td>
<td>${sr}</td>
<td>${m.wickets}</td>

</tr>

`;

});

}

</script>

</body>
</html>
