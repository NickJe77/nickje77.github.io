<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NHL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N8J9ZPKDDH"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N8J9ZPKDDH');</script>
<link rel="stylesheet" href="style.css">
<style>
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;background:#eef1f5;color:#111;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}
.hero{padding:56px 20px 44px;text-align:center;color:white;background:linear-gradient(135deg,#041E42,#0072CE);position:relative;}
.hero h1{margin:0;font-size:62px;font-weight:900;line-height:1;letter-spacing:-2px;}
.hero p{margin-top:14px;font-size:19px;font-weight:700;opacity:.9;}
.search-wrap{max-width:480px;margin:24px auto 0;position:relative;}
.search-input{width:100%;padding:14px 18px;border-radius:12px;border:none;font-size:17px;font-weight:700;box-sizing:border-box;outline:none;}
.search-results{position:absolute;top:100%;left:0;right:0;background:white;border-radius:0 0 12px 12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:999;display:none;}
.search-item{padding:12px 16px;border-bottom:1px solid #eee;cursor:pointer;font-weight:700;color:#111;}
.search-item:hover{background:#f3f6fb;}
.search-item small{color:#666;font-weight:600;margin-left:8px;}
.container{max-width:1400px;margin:28px auto;padding:0 20px 60px;}
.section{background:white;border-radius:20px;padding:26px;margin-bottom:24px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.section-title{font-size:16px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:20px;color:#666;border-left:5px solid #0072CE;padding-left:12px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;}
.stat-card{background:#f4f7fb;border-radius:16px;padding:22px;text-align:center;border:1px solid #dde3ea;}
.stat-value{font-size:40px;font-weight:900;line-height:1;margin-bottom:8px;color:#041E42;}
.stat-label{font-size:13px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.filters select{padding:10px 14px;border-radius:10px;border:1px solid #ccc;font-size:14px;font-weight:700;background:white;cursor:pointer;}
table{width:100%;border-collapse:collapse;}
th{background:#041E42;color:white;padding:13px 12px;text-align:left;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
td{padding:12px;border-bottom:1px solid #edf2f7;font-size:14px;font-weight:500;}
tr:nth-child(even) td{background:#f4f8fd;}
tr:hover td{background:#e8f2ff;}
.tlink{text-decoration:none;font-weight:800;color:#0056d6;}
.tlink:hover{text-decoration:underline;}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;}
.badge-reg{background:#e8f0fc;color:#0056d6;}
.badge-po{background:#fde8e8;color:#c00;}
.loading,.error{padding:100px 20px;text-align:center;font-size:28px;font-weight:900;}
.error{color:#d90429;}
@media(max-width:900px){
  .hero h1{font-size:38px;}
  .stat-value{font-size:30px;}
  table{display:block;overflow-x:auto;white-space:nowrap;}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
  <a href="nba.html">NBA</a>
  <a href="nhl.html">NHL</a>
</div>

<div id="page"><div class="loading">Loading player data...</div></div>

<script>
var TEAM_NAMES = {
  "ANA":"Anaheim Ducks","ARI":"Arizona Coyotes","ATL":"Atlanta Thrashers",
  "BOS":"Boston Bruins","BUF":"Buffalo Sabres","CGY":"Calgary Flames",
  "CAR":"Carolina Hurricanes","CHI":"Chicago Blackhawks","COL":"Colorado Avalanche",
  "CBJ":"Columbus Blue Jackets","DAL":"Dallas Stars","DET":"Detroit Red Wings",
  "EDM":"Edmonton Oilers","FLA":"Florida Panthers","LAK":"Los Angeles Kings",
  "MIN":"Minnesota Wild","MTL":"Montreal Canadiens","NSH":"Nashville Predators",
  "NJD":"New Jersey Devils","NYI":"New York Islanders","NYR":"New York Rangers",
  "OTT":"Ottawa Senators","PHI":"Philadelphia Flyers","PHX":"Phoenix Coyotes",
  "PIT":"Pittsburgh Penguins","SJS":"San Jose Sharks","SEA":"Seattle Kraken",
  "STL":"St. Louis Blues","TBL":"Tampa Bay Lightning","TOR":"Toronto Maple Leafs",
  "UTA":"Utah Hockey Club","VAN":"Vancouver Canucks","VGK":"Vegas Golden Knights",
  "WSH":"Washington Capitals","WPG":"Winnipeg Jets",
  "QUE":"Quebec Nordiques","HFD":"Hartford Whalers","MNS":"Minnesota North Stars",
  "KCS":"Kansas City Scouts","CLR":"Colorado Rockies","OAK":"Oakland Seals",
  "CAL":"California Golden Seals","CLE":"Cleveland Barons"
};

var TEAM_COLOURS = {
  "ANA":["#F47A38","#B09057"],"ARI":["#8C2633","#E2D6B5"],"BOS":["#FFB81C","#000000"],
  "BUF":["#003087","#FCB514"],"CGY":["#C8102E","#F1BE48"],"CAR":["#CC0000","#000000"],
  "CHI":["#CF0A2C","#000000"],"COL":["#6F263D","#236192"],"CBJ":["#002654","#CE1126"],
  "DAL":["#006847","#8F8F8C"],"DET":["#CE1126","#FFFFFF"],"EDM":["#041E42","#FF4C00"],
  "FLA":["#041E42","#C8102E"],"LAK":["#111111","#A2AAAD"],"MIN":["#154734","#A6192E"],
  "MTL":["#AF1E2D","#192168"],"NSH":["#FFB81C","#041E42"],"NJD":["#CE1126","#000000"],
  "NYI":["#003087","#FC4C02"],"NYR":["#0038A8","#CE1126"],"OTT":["#C2912C","#000000"],
  "PHI":["#F74902","#000000"],"PIT":["#FCB514","#000000"],"SJS":["#006D75","#EA7200"],
  "SEA":["#001628","#99D9D9"],"STL":["#002F87","#FCB514"],"TBL":["#002868","#FFFFFF"],
  "TOR":["#003E7E","#FFFFFF"],"UTA":["#010101","#69B3E7"],"VAN":["#00205B","#00843D"],
  "VGK":["#B4975A","#333F42"],"WSH":["#041E42","#C8102E"],"WPG":["#041E42","#004C97"]
};

function tn(code){ return TEAM_NAMES[code] || code; }
function gtype(g){
  if(g.game_type) return g.game_type;
  return String(g.game_id||'').slice(4,6)==='03'?'P':'R';
}
function toi(sec){
  if(!sec) return '0:00';
  return Math.floor(sec/60)+':'+(sec%60<10?'0':'')+sec%60;
}

var params    = new URLSearchParams(window.location.search);
var playerId  = params.get('player') || '';
var page      = document.getElementById('page');
var allPlayers = [];

// Load index for search
fetch('/data/nhl/players.json')
  .then(function(r){ return r.json(); })
  .then(function(d){ allPlayers = d; })
  .catch(function(){});

// Load player game log
fetch('/data/nhl/players/'+playerId+'.json')
  .then(function(r){
    if(!r.ok) throw new Error('not found');
    return r.json();
  })
  .then(function(games){
    // Also get name/position from index
    return fetch('/data/nhl/players.json')
      .then(function(r){ return r.json(); })
      .then(function(index){
        var info = index.find(function(p){ return p.id === playerId; }) || {};
        render(info, games);
      });
  })
  .catch(function(){
    page.innerHTML = '<div class="error">Player not found.</div>';
  });

function render(info, games){
  var name     = info.name || playerId;
  var pos      = info.position || '';
  var teams    = info.teams || [];
  var lastTeam = teams[teams.length-1] || '';
  var colours  = TEAM_COLOURS[lastTeam] || ['#041E42','#0072CE'];
  var grad     = 'linear-gradient(135deg,'+colours[0]+','+colours[1]+')';

  document.title = name + ' | NHL | The Sporting Almanac';

  // Career totals
  var gp=0, goals=0, assists=0, points=0, plusMinus=0, pim=0,
      shots=0, hits=0, blocked=0, ppg=0, ppa=0, shg=0, sha=0,
      foW=0, foL=0, toi_s=0;

  var seenGames = {};
  games.forEach(function(g){
    var key = g.game_id+'|'+g.team;
    if(seenGames[key]) return;
    seenGames[key] = true;
    gp++;
    goals     += g.goals    ||0; assists  += g.assists  ||0;
    points    += g.points   ||0; plusMinus+= g.plus_minus||0;
    pim       += g.pim      ||0; shots    += g.shots    ||0;
    hits      += g.hits     ||0; blocked  += g.blocked  ||0;
    ppg       += g.pp_goals ||0; ppa      += g.pp_assists||0;
    shg       += g.sh_goals ||0; sha      += g.sh_assists||0;
    foW       += g.fo_wins  ||0; foL      += g.fo_losses||0;
    toi_s     += g.toi      ||0;
  });

  var foPct = (foW+foL) ? ((foW/(foW+foL))*100).toFixed(1)+'%' : '–';
  var gpg   = gp ? (goals/gp).toFixed(2)  : '–';
  var apg   = gp ? (assists/gp).toFixed(2): '–';
  var isGoalie = pos === 'G';

  // Build season summary
  var seasonMap = {};
  games.forEach(function(g){
    var key = g.season+'|'+g.team;
    if(!seasonMap[key]) seasonMap[key]={season:g.season,team:g.team,gp:0,goals:0,assists:0,points:0,pim:0,shots:0,hits:0,toi:0,ppg:0,ppa:0,pm:0};
    var s = seasonMap[key];
    var gkey = g.game_id+'|'+g.team;
    if(seenGames[gkey+'_s']) return;
    seenGames[gkey+'_s'] = true;
    s.gp++; s.goals+=g.goals||0; s.assists+=g.assists||0;
    s.points+=g.points||0; s.pim+=g.pim||0; s.shots+=g.shots||0;
    s.hits+=g.hits||0; s.toi+=g.toi||0; s.ppg+=g.pp_goals||0;
    s.ppa+=g.pp_assists||0; s.pm+=g.plus_minus||0;
  });

  var seasonRows = Object.values(seasonMap)
    .sort(function(a,b){ return a.season!==b.season ? a.season-b.season : 0; })
    .map(function(s){
      return '<tr>'+
        '<td>'+s.season+'–'+String(s.season+1).slice(2)+'</td>'+
        '<td><a class="tlink" href="/nhl-franchise.html?team='+encodeURIComponent(s.team)+'">'+tn(s.team)+'</a></td>'+
        '<td>'+s.gp+'</td>'+
        (isGoalie ? '' :
          '<td>'+s.goals+'</td><td>'+s.assists+'</td><td>'+s.points+'</td>'+
          '<td>'+(s.pm>0?'+':'')+s.pm+'</td>'+
          '<td>'+s.pim+'</td><td>'+s.shots+'</td><td>'+s.hits+'</td>'+
          '<td>'+s.ppg+'</td><td>'+s.ppa+'</td>'+
          '<td>'+toi(Math.round(s.toi/s.gp))+'</td>'
        )+
        '</tr>';
    }).join('');

  var summaryCards = isGoalie
    ? '<div class="stat-card"><div class="stat-value">'+gp+'</div><div class="stat-label">GP</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+pim+'</div><div class="stat-label">PIM</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+toi(Math.round(toi_s/Math.max(gp,1)))+'</div><div class="stat-label">Avg TOI</div></div>'
    : '<div class="stat-card"><div class="stat-value">'+gp+'</div><div class="stat-label">GP</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+goals+'</div><div class="stat-label">Goals</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+assists+'</div><div class="stat-label">Assists</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+points+'</div><div class="stat-label">Points</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+(plusMinus>0?'+':'')+plusMinus+'</div><div class="stat-label">+/–</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+pim+'</div><div class="stat-label">PIM</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+shots+'</div><div class="stat-label">Shots</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+hits+'</div><div class="stat-label">Hits</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+ppg+'</div><div class="stat-label">PPG</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+ppa+'</div><div class="stat-label">PPA</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+gpg+'</div><div class="stat-label">G/GP</div></div>'+
      '<div class="stat-card"><div class="stat-value">'+apg+'</div><div class="stat-label">A/GP</div></div>'+
      (foW+foL>0?'<div class="stat-card"><div class="stat-value">'+foPct+'</div><div class="stat-label">FO%</div></div>':'');

  var seasonHead = isGoalie
    ? '<th>Season</th><th>Team</th><th>GP</th><th>PIM</th><th>Avg TOI</th>'
    : '<th>Season</th><th>Team</th><th>GP</th><th>G</th><th>A</th><th>PTS</th><th>+/–</th><th>PIM</th><th>SOG</th><th>Hits</th><th>PPG</th><th>PPA</th><th>Avg TOI</th>';

  page.innerHTML =
    '<div class="hero" style="background:'+grad+'">'+
      '<h1>'+name+'</h1>'+
      '<p>'+(pos ? pos+' · ' : '')+tn(lastTeam)+'</p>'+
      '<div class="search-wrap">'+
        '<input type="text" class="search-input" id="srch" placeholder="Search players..." autocomplete="off">'+
        '<div class="search-results" id="srchRes"></div>'+
      '</div>'+
    '</div>'+
    '<div class="container">'+
      '<div class="section">'+
        '<div class="section-title">Career Summary</div>'+
        '<div class="stats-grid">'+summaryCards+'</div>'+
      '</div>'+
      '<div class="section">'+
        '<div class="section-title">Season by Season</div>'+
        '<div style="overflow-x:auto">'+
        '<table><thead><tr>'+seasonHead+'</tr></thead>'+
        '<tbody>'+seasonRows+'</tbody></table>'+
        '</div>'+
      '</div>'+
    '</div>';

  // Search
  var srch    = document.getElementById('srch');
  var srchRes = document.getElementById('srchRes');
  srch.addEventListener('input', function(){
    var q = this.value.toLowerCase().trim();
    if(!q){ srchRes.style.display='none'; return; }
    var matches = allPlayers.filter(function(p){ return (p.name||'').toLowerCase().includes(q); }).slice(0,8);
    if(!matches.length){ srchRes.style.display='none'; return; }
    srchRes.innerHTML = matches.map(function(p){
      return '<div class="search-item" onclick="window.location.href=\'/nhl-player.html?player='+encodeURIComponent(p.id)+'\'">'+
        p.name+'<small>'+tn((p.teams||[])[0]||'')+'</small></div>';
    }).join('');
    srchRes.style.display = 'block';
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.search-wrap')) srchRes.style.display='none';
  });
}
</script>
</body>
</html>
