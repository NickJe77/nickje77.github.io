<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NHL Player | The Sporting Almanac</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter;
margin:0;
background:#f4f6f8;
}

.page{
max-width:1000px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(135deg,#041E42,#0072CE);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.stats{
display:flex;
gap:20px;
}

.stat-box{
background:white;
padding:15px;
border-radius:12px;
flex:1;
text-align:center;
}

.stat{
font-size:28px;
font-weight:bold;
}

</style>
</head>
<body>

<div class="page">

<div id="hero" class="hero">

<h1>Player Name</h1>

</div>

<div class="stats">

<div class="stat-box">
<div>Games</div>
<div class="stat">0</div>
</div>

<div class="stat-box">
<div>Goals</div>
<div class="stat">0</div>
</div>

<div class="stat-box">
<div>Assists</div>
<div class="stat">0</div>
</div>

<div class="stat-box">
<div>Points</div>
<div class="stat">0</div>
</div>

</div>

</div>

</body>
</html>
