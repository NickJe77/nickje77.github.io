<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NHL Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N8J9ZPKDDH"></script>

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

/* Hero background set dynamically per-player via JS (team colours) */
.hero{padding:40px 20px;text-align:center;color:#fff;}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,6vw,44px);
  letter-spacing:.01em;text-transform:uppercase;
}
.hero p{margin:8px 0 0;font-size:14.5px;opacity:.85;}

.search-wrap{max-width:400px;margin:20px auto 0;position:relative;}
.search-input{
  width:100%;padding:13px 18px;border-radius:999px;border:none;font-size:14.5px;
  font-family:var(--body);font-weight:600;box-sizing:border-box;outline:none;
}
.search-results{
  position:absolute;top:100%;left:0;right:0;background:var(--surface);border-radius:14px;
  margin-top:8px;overflow:hidden;box-shadow:0 14px 30px -12px rgba(10,16,24,.4);z-index:999;
  display:none;max-height:300px;overflow-y:auto;
}
.search-item{
  padding:12px 18px;cursor:pointer;font-weight:700;color:var(--ink);
  border-bottom:1px solid var(--line);font-size:14px;
}
.search-item:hover{background:var(--accent-soft);}
.search-item small{color:var(--muted);font-weight:500;margin-left:8px;}

.page-wrap{max-width:1300px;margin:0 auto;padding:26px 20px 70px;}
.section-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px;margin-bottom:22px;
}
.section-title{
  font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);
  margin-bottom:16px;text-transform:uppercase;border-left:3px solid var(--accent);padding-left:10px;
}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:12px;}
.stat-box{background:var(--accent-soft);border-radius:14px;padding:14px;text-align:center;}
.stat-box span{
  display:block;font-family:var(--display);font-size:24px;font-weight:600;line-height:1;
  margin-bottom:4px;color:var(--ink);
}
.stat-box label{color:var(--muted);font-size:11px;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-box small{color:var(--faint);font-size:10px;display:block;margin-top:3px;}

.filters-bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:18px;}
.filter-group{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);font-size:13.5px;}
select{
  padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;
  font-family:var(--body);font-weight:600;color:var(--ink);background:var(--surface);cursor:pointer;
}
select:hover{border-color:var(--faint);}
select:focus{outline:none;border-color:var(--accent);}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.table-header{
  padding:20px 22px 10px;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase;border-left:3px solid var(--accent);margin-left:22px;
}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:800px;}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;}
th{
  background:#f7f9fb;color:var(--muted);font-weight:600;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.03em;font-family:var(--body);
}
th small{display:block;font-size:9px;font-weight:500;color:var(--faint);margin-top:2px;text-transform:none;letter-spacing:0;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.season-total{font-weight:700;color:var(--ink);}
.season-avg{color:var(--muted);font-size:11.5px;}
.tlink{color:var(--ink);font-weight:700;text-decoration:none;}
.tlink:hover{color:var(--accent);}
.loading{text-align:center;padding:60px;font-size:15px;color:var(--muted);font-style:italic;}
.error{text-align:center;padding:60px;font-size:15px;color:#c0362c;font-weight:600;}
@media(max-width:800px){
  .stats-grid{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>

<div id="hero" class="hero" style="background:linear-gradient(135deg,#041E42,#0072CE);">
  <div class="loading">Loading player...</div>
</div>

<div id="pageWrap" class="page-wrap" style="display:none;">

  <div class="section-card">
    <div class="section-title">Career Summary</div>
    <div class="stats-grid" id="careerTotals"></div>
    <div class="stats-grid" id="careerAverages"></div>
    <div class="stats-grid" id="careerHighs"></div>
  </div>

  <div class="section-card">
    <div class="section-title">Filtered Results</div>
    <div class="filters-bar">
      <div class="filter-group">
        <label>Team:</label>
        <select id="teamFilter"><option value="ALL">All Teams</option></select>
      </div>
      <div class="filter-group">
        <label>Type:</label>
        <select id="typeFilter">
          <option value="ALL">All Games</option>
          <option value="R">Regular Season</option>
          <option value="P">Playoffs</option>
        </select>
      </div>
    </div>
    <div class="stats-grid" id="filteredTotals"></div>
    <div class="stats-grid" id="filteredAverages"></div>
    <div class="stats-grid" id="filteredHighs"></div>
  </div>

  <div class="table-wrap">
    <div class="table-header">Season Log</div>
    <div class="table-scroll">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="seasonsBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
var TEAM_NAMES = {
  "ANA":"Anaheim Ducks","ARI":"Arizona Coyotes","ATL":"Atlanta Thrashers",
  "BOS":"Boston Bruins","BUF":"Buffalo Sabres","CGY":"Calgary Flames",
  "CAR":"Carolina Hurricanes","CHI":"Chicago Blackhawks","COL":"Colorado Avalanche",
  "CBJ":"Columbus Blue Jackets","DAL":"Dallas Stars","DET":"Detroit Red Wings",
  "EDM":"Edmonton Oilers","FLA":"Florida Panthers","LAK":"Los Angeles Kings",
  "MIN":"Minnesota Wild","MTL":"Montreal Canadiens","NSH":"Nashville Predators",
  "NJD":"New Jersey Devils","NYI":"New York Islanders","NYR":"New York Rangers",
  "OTT":"Ottawa Senators","PHI":"Philadelphia Flyers","PHX":"Phoenix Coyotes",
  "PIT":"Pittsburgh Penguins","SJS":"San Jose Sharks","SEA":"Seattle Kraken",
  "STL":"St. Louis Blues","TBL":"Tampa Bay Lightning","TOR":"Toronto Maple Leafs",
  "UTA":"Utah Hockey Club","VAN":"Vancouver Canucks","VGK":"Vegas Golden Knights",
  "WSH":"Washington Capitals","WPG":"Winnipeg Jets",
  "QUE":"Quebec Nordiques","HFD":"Hartford Whalers","MNS":"Minnesota North Stars",
  "KCS":"Kansas City Scouts","CLR":"Colorado Rockies","OAK":"Oakland Seals",
  "CAL":"California Golden Seals","CLE":"Cleveland Barons"
};

var TEAM_COLOURS = {
  "ANA":["#F47A38","#B09057"],"ARI":["#8C2633","#E2D6B5"],"BOS":["#FFB81C","#000000"],
  "BUF":["#003087","#FCB514"],"CGY":["#C8102E","#F1BE48"],"CAR":["#CC0000","#000000"],
  "CHI":["#CF0A2C","#000000"],"COL":["#6F263D","#236192"],"CBJ":["#002654","#CE1126"],
  "DAL":["#006847","#8F8F8C"],"DET":["#CE1126","#FFFFFF"],"EDM":["#041E42","#FF4C00"],
  "FLA":["#041E42","#C8102E"],"LAK":["#111111","#A2AAAD"],"MIN":["#154734","#A6192E"],
  "MTL":["#AF1E2D","#192168"],"NSH":["#FFB81C","#041E42"],"NJD":["#CE1126","#000000"],
  "NYI":["#003087","#FC4C02"],"NYR":["#0038A8","#CE1126"],"OTT":["#C2912C","#000000"],
  "PHI":["#F74902","#000000"],"PIT":["#FCB514","#000000"],"SJS":["#006D75","#EA7200"],
  "SEA":["#001628","#99D9D9"],"STL":["#002F87","#FCB514"],"TBL":["#002868","#FFFFFF"],
  "TOR":["#003E7E","#FFFFFF"],"UTA":["#010101","#69B3E7"],"VAN":["#00205B","#00843D"],
  "VGK":["#B4975A","#333F42"],"WSH":["#041E42","#C8102E"],"WPG":["#041E42","#004C97"]
};

function tn(code){ return TEAM_NAMES[code] || code; }
function num(v){ return Number(v) || 0; }
function avg(total, gp){ return gp > 0 ? (total/gp).toFixed(2) : '–'; }
function toistr(sec){ if(!sec) return '0:00'; return Math.floor(sec/60)+':'+(sec%60<10?'0':'')+sec%60; }
function gtype(g){
  if(g.game_type) return g.game_type;
  return String(g.game_id||'').slice(4,6)==='03'?'P':'R';
}

var params    = new URLSearchParams(location.search);
var playerId  = params.get('player') || '';
var heroEl    = document.getElementById('hero');
var pageWrap  = document.getElementById('pageWrap');
var teamFilter= document.getElementById('teamFilter');
var typeFilter= document.getElementById('typeFilter');
var playerIndex = [];
var allGames    = [];
var isGoalie    = false;

function calcStats(games){
  var gp=0, goals=0, assists=0, points=0, pm=0, pim=0,
      shots=0, hits=0, blocked=0, ppg=0, ppa=0,
      shifts=0, toi=0,
      hGoals=0, hAssists=0, hPoints=0, hToi=0,
      hGoalsGame='', hAssistsGame='', hPointsGame='', hToiGame='';

  var seen = {};
  games.forEach(function(g){
    var k = g.game_id+'|'+g.team;
    if(seen[k]) return; seen[k]=1;
    gp++;
    var go=num(g.goals), as=num(g.assists), pt=num(g.points)||go+as;
    goals+=go; assists+=as; points+=pt;
    pm+=num(g.plus_minus); pim+=num(g.pim);
    shots+=num(g.shots); hits+=num(g.hits); blocked+=num(g.blocked);
    ppg+=num(g.pp_goals); ppa+=num(g.pp_assists||0);
    shifts+=num(g.shifts); toi+=num(g.toi);
    var label = tn(g.team)+' '+g.season;
    if(go>hGoals){hGoals=go;hGoalsGame=label;}
    if(as>hAssists){hAssists=as;hAssistsGame=label;}
    if(pt>hPoints){hPoints=pt;hPointsGame=label;}
    if(num(g.toi)>hToi){hToi=num(g.toi);hToiGame=label;}
  });
  return {gp,goals,assists,points,pm,pim,shots,hits,blocked,ppg,ppa,shifts,toi,
          hGoals,hAssists,hPoints,hToi,hGoalsGame,hAssistsGame,hPointsGame,hToiGame};
}

function sbox(val, label, note){
  return '<div class="stat-box"><span>'+val+'</span><label>'+label+'</label>'+(note?'<small>'+note+'</small>':'')+'</div>';
}

function renderStats(stats, totId, avgId, highId){
  var g = Math.max(stats.gp, 1);
  if(isGoalie){
    document.getElementById(totId).innerHTML =
      sbox(stats.gp,'GP') + sbox(toistr(stats.toi),'TOI') + sbox(stats.pim,'PIM');
    document.getElementById(avgId).innerHTML =
      sbox(toistr(Math.round(stats.toi/g)),'Avg TOI');
    document.getElementById(highId).innerHTML =
      sbox(toistr(stats.hToi),'Best TOI', stats.hToiGame);
  } else {
    document.getElementById(totId).innerHTML =
      sbox(stats.gp,'GP') + sbox(stats.goals,'Goals') + sbox(stats.assists,'Assists') +
      sbox(stats.points,'Points') + sbox((stats.pm>=0?'+':'')+stats.pm,'+/–') +
      sbox(stats.pim,'PIM') + sbox(stats.shots,'Shots') + sbox(stats.hits,'Hits') +
      sbox(stats.ppg,'PPG') + sbox(stats.ppa,'PPA');
    document.getElementById(avgId).innerHTML =
      sbox(avg(stats.goals,stats.gp),'G/GP') + sbox(avg(stats.assists,stats.gp),'A/GP') +
      sbox(avg(stats.points,stats.gp),'PTS/GP') + sbox(avg(stats.shots,stats.gp),'SOG/GP') +
      sbox(toistr(Math.round(stats.toi/g)),'Avg TOI');
    document.getElementById(highId).innerHTML =
      sbox(stats.hGoals,'Best Goals',stats.hGoalsGame) +
      sbox(stats.hAssists,'Best Assists',stats.hAssistsGame) +
      sbox(stats.hPoints,'Best Points',stats.hPointsGame) +
      sbox(toistr(stats.hToi),'Best TOI',stats.hToiGame);
  }
}

function buildSeasonRows(games){
  var map = {};
  var seen2 = {};
  games.forEach(function(g){
    var k = g.season+'||'+g.team;
    if(!map[k]) map[k]={season:g.season,team:g.team,gp:0,goals:0,assists:0,points:0,pm:0,pim:0,shots:0,hits:0,ppg:0,toi:0};
    var s=map[k];
    var gk = g.game_id+'|'+g.team;
    if(seen2[gk]) return; seen2[gk]=1;
    s.gp++; s.goals+=num(g.goals); s.assists+=num(g.assists);
    s.points+=(num(g.points)||num(g.goals)+num(g.assists));
    s.pm+=num(g.plus_minus); s.pim+=num(g.pim);
    s.shots+=num(g.shots); s.hits+=num(g.hits);
    s.ppg+=num(g.pp_goals); s.toi+=num(g.toi);
  });
  return Object.values(map).sort(function(a,b){ return a.season!==b.season?a.season-b.season:0; });
}

function renderSeasons(games){
  var rows = buildSeasonRows(games);
  if(isGoalie){
    document.getElementById('tableHead').innerHTML =
      '<tr><th>Season</th><th>Team</th><th>GP</th><th>PIM</th><th>TOI</th><th>Avg TOI</th></tr>';
    document.getElementById('seasonsBody').innerHTML = rows.map(function(s){
      return '<tr>'+
        '<td>'+s.season+'–'+String(s.season+1).slice(2)+'</td>'+
        '<td><a class="tlink" href="/nhl-franchise.html?team='+encodeURIComponent(s.team)+'">'+tn(s.team)+'</a></td>'+
        '<td>'+s.gp+'</td><td>'+s.pim+'</td>'+
        '<td>'+toistr(s.toi)+'</td>'+
        '<td>'+toistr(s.gp?Math.round(s.toi/s.gp):0)+'</td>'+
        '</tr>';
    }).join('');
  } else {
    document.getElementById('tableHead').innerHTML =
      '<tr><th>Season</th><th>Team</th><th>GP</th>'+
      '<th>G<small>total</small></th><th>A<small>total</small></th><th>PTS<small>total</small></th>'+
      '<th>+/–</th><th>PIM</th><th>SOG</th><th>Hits</th><th>PPG</th>'+
      '<th>G/GP</th><th>A/GP</th><th>PTS/GP</th><th>Avg TOI</th></tr>';
    document.getElementById('seasonsBody').innerHTML = rows.map(function(s){
      var g=Math.max(s.gp,1);
      return '<tr>'+
        '<td>'+s.season+'–'+String(s.season+1).slice(2)+'</td>'+
        '<td><a class="tlink" href="/nhl-franchise.html?team='+encodeURIComponent(s.team)+'">'+tn(s.team)+'</a></td>'+
        '<td>'+s.gp+'</td>'+
        '<td><span class="season-total">'+s.goals+'</span></td>'+
        '<td><span class="season-total">'+s.assists+'</span></td>'+
        '<td><span class="season-total">'+s.points+'</span></td>'+
        '<td>'+(s.pm>=0?'+':'')+s.pm+'</td>'+
        '<td>'+s.pim+'</td><td>'+s.shots+'</td><td>'+s.hits+'</td><td>'+s.ppg+'</td>'+
        '<td><span class="season-avg">'+(s.goals/g).toFixed(2)+'</span></td>'+
        '<td><span class="season-avg">'+(s.assists/g).toFixed(2)+'</span></td>'+
        '<td><span class="season-avg">'+(s.points/g).toFixed(2)+'</span></td>'+
        '<td>'+toistr(Math.round(s.toi/g))+'</td>'+
        '</tr>';
    }).join('');
  }
}

function getFiltered(){
  var team = teamFilter.value;
  var type = typeFilter.value;
  return allGames.filter(function(g){
    if(team!=='ALL' && g.team!==team) return false;
    if(type!=='ALL' && gtype(g)!==type) return false;
    return true;
  });
}

function updateFiltered(){
  var filtered = getFiltered();
  renderStats(calcStats(filtered),'filteredTotals','filteredAverages','filteredHighs');
  renderSeasons(filtered);
}

function buildSearch(){
  var si = document.getElementById('playerSearch');
  var sr = document.getElementById('searchResults');
  si.addEventListener('input', function(){
    var val = this.value.toLowerCase().trim();
    if(!val){sr.style.display='none';return;}
    var matches = playerIndex.filter(function(p){ return (p.name||'').toLowerCase().includes(val); }).slice(0,10);
    if(!matches.length){sr.style.display='none';return;}
    sr.innerHTML = matches.map(function(p){
      return '<div class="search-item" onclick="window.location.href=\'/nhl-player.html?player='+encodeURIComponent(p.id)+'\'">'+
        p.name+'<small>'+(p.teams&&p.teams.length?tn(p.teams[p.teams.length-1]):'')+'</small></div>';
    }).join('');
    sr.style.display='block';
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('.search-wrap')) sr.style.display='none';
  });
}

fetch('/data/nhl/players/'+playerId+'.json')
  .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
  .then(function(games){
    return fetch('/data/nhl/players.json')
      .then(function(r){ return r.json(); })
      .then(function(index){
        playerIndex = index;
        var info = index.find(function(p){ return p.id===playerId; }) || {};
        return {games:games, info:info};
      });
  })
  .then(function(data){
    var games = data.games;
    var info  = data.info;
    var name  = info.name || playerId;
    var pos   = info.position || '';
    var teams = info.teams || [];
    var lastTeam = teams[teams.length-1] || '';
    var colours  = TEAM_COLOURS[lastTeam] || ['#041E42','#0072CE'];

    isGoalie = pos === 'G';
    allGames = games;

    document.title = name + ' | NHL | The Sporting Almanac';
    heroEl.style.background = 'linear-gradient(135deg,'+colours[0]+','+colours[1]+')';
    heroEl.innerHTML =
      '<h1>'+name+'</h1>'+
      '<p>'+(pos?pos+' · ':'')+tn(lastTeam)+'</p>'+
      '<div class="search-wrap">'+
        '<input type="text" id="playerSearch" class="search-input" placeholder="Search another player..." autocomplete="off">'+
        '<div class="search-results" id="searchResults"></div>'+
      '</div>';

    buildSearch();

    var teamSet = {};
    games.forEach(function(g){ if(g.team) teamSet[g.team]=1; });
    Object.keys(teamSet).sort().forEach(function(t){
      teamFilter.innerHTML += '<option value="'+t+'">'+tn(t)+'</option>';
    });

    teamFilter.addEventListener('change', updateFiltered);
    typeFilter.addEventListener('change', updateFiltered);

    var stats = calcStats(games);
    renderStats(stats,'careerTotals','careerAverages','careerHighs');
    renderStats(stats,'filteredTotals','filteredAverages','filteredHighs');
    renderSeasons(games);

    pageWrap.style.display = 'block';
  })
  .catch(function(){
    heroEl.innerHTML = '<div class="error">Player not found.</div>';
  });
</script>
</body>
</html>
