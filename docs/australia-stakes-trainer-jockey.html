<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Best Trainer-Jockey Days | Australian Stakes Results</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="racing.css">
<link rel="stylesheet" href="archive.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#0f141a; --muted:#69727c; --faint:#9aa3ad;
  --line:#e3e8ee; --board:#0c130f; --board-2:#161f16; --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16); --win-bg:#e6f4ea; --win-text:#1e7a3d;
  --display:'Oswald',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --radius:16px;
}
*{box-sizing:border-box;}
body{ font-size:15px; font-family:var(--body); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; margin:0; }

#global-nav nav{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;}
#global-nav nav a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s;}
#global-nav nav a:hover{opacity:1;}

.page{ max-width:1000px; margin:0 auto; padding:26px 20px 70px; }

.search-wrap{ max-width:500px; margin:0 auto 26px; position:relative; }
.search-wrap input{
  width:100%; padding:13px 20px; border-radius:999px; border:1px solid var(--line);
  font-family:var(--body); font-size:15px; font-weight:600; outline:none; background:var(--surface);
}
.search-wrap input:focus{ border-color:var(--accent); }
.suggestions{
  position:absolute; width:100%; background:var(--surface); border-radius:14px; margin-top:8px;
  overflow:hidden; box-shadow:0 14px 30px -12px rgba(10,16,24,.4); z-index:10; max-height:320px; overflow-y:auto;
}
.suggestion{ padding:12px 18px; cursor:pointer; font-weight:600; font-size:14px; }
.suggestion:hover{ background:var(--accent-soft); }

.hero{
  position:relative; background:linear-gradient(160deg,var(--board-2),var(--board)); color:#fff;
  padding:32px 34px; border-radius:var(--radius); margin-bottom:22px; text-align:center;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.hero .eyebrow{
  font-family:var(--body); font-size:11.5px; font-weight:600; letter-spacing:.16em;
  text-transform:uppercase; color:var(--accent); margin-bottom:10px;
}
.hero h1{
  margin:0; font-family:var(--display); font-weight:600; font-size:clamp(24px,5vw,38px);
  letter-spacing:.01em; text-transform:uppercase; color:#fff;
}

.summary{ display:flex; justify-content:center; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
.summary div{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px 28px; text-align:center; font-weight:600; color:var(--muted); font-size:13px;
}
.summary span{
  display:block; font-family:var(--display); font-weight:600; font-size:26px;
  color:var(--ink); margin-top:4px; font-variant-numeric:tabular-nums;
}

.table-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); }
table{ width:100%; border-collapse:collapse; min-width:700px; }
th, td{ padding:11px 14px; text-align:left; font-size:13.5px; border-bottom:1px solid var(--line); white-space:nowrap; }
th{ background:#f7f9fb; color:var(--muted); font-family:var(--body); font-weight:600; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
td{ color:#27313c; font-variant-numeric:tabular-nums; }
td:first-child{ font-weight:700; color:var(--ink); }
tbody tr{ cursor:pointer; }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover td{ background:#f9fbfd; }
.win td{ background:var(--win-bg) !important; font-weight:600; color:var(--win-text); }
.win td:first-child{ color:var(--win-text); }

.loading{ text-align:center; color:var(--muted); font-style:italic; padding:20px; }
</style>
</head>

<body>
<body>
<div id="global-nav"></div>

<div class="page">

  <div class="hero">
    <div class="eyebrow">Australian Stakes Races</div>
    <h1>Best Single-Day Performances</h1>
  </div>

  <div class="loading" id="status">Loading data…</div>

  <div id="leaderboardsWrap" style="display:none;">

    <h2 style="font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 12px;">Jockeys</h2>
    <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Rank</th><th>Date</th><th>Jockey</th><th>Wins</th><th></th></tr>
      </thead>
      <tbody id="jockeyLeaderboard"></tbody>
    </table>
    </div>

    <h2 style="font-family:var(--display);font-weight:600;font-size:20px;margin:32px 0 12px;">Trainers</h2>
    <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Rank</th><th>Date</th><th>Trainer</th><th>Wins</th><th></th></tr>
      </thead>
      <tbody id="trainerLeaderboard"></tbody>
    </table>
    </div>

  </div>

  <div id="detailPanel" style="display:none;margin-top:20px;"></div>

</div>

<script>

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const lines = text.trim().replace(/\r/g,"").split("\n");
  const headers = lines[0].split(",").map(h=>h.trim());

  return lines.slice(1).map(line=>{
    const values = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    let obj = {};
    headers.forEach((h,i)=>{
      obj[h] = (values[i]||"").replace(/^"|"$/g,"").trim();
    });
    return obj;
  });
}

let allData = [];
let jockeyCombos = [];
let trainerCombos = [];

fetch("/data/australia-stakes.csv")
  .then(res => res.text())
  .then(text => {
    allData = parseCSV(text);
    buildLeaderboards();
  });

function buildLeaderboards(){
  // Two genuinely separate leaderboards -- a jockey can win with
  // several different trainers' horses on the same day (and vice
  // versa), so grouping by the combined pair understates each
  // individual's real single-day total. Confirmed real: the top
  // trainer day (7 wins) is higher than the top combined-pair day
  // (5 wins), since those 7 wins weren't all with the same jockey.
  // This file is already winner-only (a direct "Winner" column, no
  // "Position" field at all) -- every row is a win, no filtering
  // needed.
  const jockeyGroups = {};
  const trainerGroups = {};

  allData.forEach(r => {
    if(r.Jockey){
      const jKey = `${r.Date}|${r.Jockey}`;
      if(!jockeyGroups[jKey]) jockeyGroups[jKey] = { date: r.Date, name: r.Jockey, races: [] };
      jockeyGroups[jKey].races.push(r);
    }

    if(r.Trainer){
      const tKey = `${r.Date}|${r.Trainer}`;
      if(!trainerGroups[tKey]) trainerGroups[tKey] = { date: r.Date, name: r.Trainer, races: [] };
      trainerGroups[tKey].races.push(r);
    }
  });

  jockeyCombos = Object.values(jockeyGroups)
    .filter(g => g.races.length >= 5)
    .sort((a,b) => b.races.length - a.races.length)
    .slice(0, 50);

  trainerCombos = Object.values(trainerGroups)
    .filter(g => g.races.length >= 5)
    .sort((a,b) => b.races.length - a.races.length)
    .slice(0, 50);

  document.getElementById("status").style.display = "none";
  document.getElementById("leaderboardsWrap").style.display = "block";

  document.getElementById("jockeyLeaderboard").innerHTML = jockeyCombos.map((c, i) => `
    <tr onclick="showDetail('jockey', ${i})" style="cursor:pointer;">
      <td>${i + 1}</td>
      <td>${c.date}</td>
      <td>${c.name}</td>
      <td class="lead">${c.races.length}</td>
      <td>→</td>
    </tr>
  `).join("");

  document.getElementById("trainerLeaderboard").innerHTML = trainerCombos.map((c, i) => `
    <tr onclick="showDetail('trainer', ${i})" style="cursor:pointer;">
      <td>${i + 1}</td>
      <td>${c.date}</td>
      <td>${c.name}</td>
      <td class="lead">${c.races.length}</td>
      <td>→</td>
    </tr>
  `).join("");
}

function showDetail(type, i){
  const c = type === "jockey" ? jockeyCombos[i] : trainerCombos[i];
  const label = type === "jockey" ? "Jockey" : "Trainer";
  const panel = document.getElementById("detailPanel");
  panel.style.display = "block";
  panel.innerHTML = `
    <div class="summary" style="display:flex;">
      <div>Date<span>${c.date}</span></div>
      <div>${label}<span>${c.name}</span></div>
      <div>Wins<span>${c.races.length}</span></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Race</th><th>Track</th><th>Winner</th><th>${type === "jockey" ? "Trainer" : "Jockey"}</th><th>SP</th></tr>
        </thead>
        <tbody>
          ${c.races.map(r => `
            <tr>
              <td>${r.Race}</td>
              <td>${r.Track}</td>
              <td>${r.Winner}</td>
              <td>${type === "jockey" ? r.Trainer : r.Jockey}</td>
              <td>${r.SP}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
  panel.scrollIntoView({behavior: "smooth", block: "nearest"});
}

/* LOAD NAV BAR */
fetch("g1-archive.html")
  .then(res => res.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const nav = doc.querySelector("nav");
    if(nav){ document.getElementById("global-nav").innerHTML = nav.outerHTML; }
  });

</script>
</body>
</html>
