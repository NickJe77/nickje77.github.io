<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Serie A Teams | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
color:#111;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px;
background:white;
border-bottom:1px solid #ddd;
flex-wrap:wrap;
}

.navbar a{
text-decoration:none;
font-weight:700;
color:#0056d6;
}

.hero{
background:linear-gradient(135deg,#008c45,#cd212a);
color:white;
padding:70px 20px;
text-align:center;
}

.hero h1{
margin:0;
font-size:64px;
font-weight:900;
}

.hero p{
margin-top:14px;
font-size:22px;
font-weight:600;
opacity:.95;
}

.container{
max-width:1600px;
margin:40px auto;
padding:0 20px;
}

.search-wrap{
margin-bottom:28px;
display:flex;
justify-content:center;
}

#teamSearch{
width:100%;
max-width:520px;
padding:16px 18px;
font-size:18px;
border-radius:14px;
border:1px solid #d7dbe3;
outline:none;
font-family:Inter,system-ui,Arial,sans-serif;
font-weight:600;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

#teamSearch:focus{
border-color:#008c45;
box-shadow:0 0 0 4px rgba(0,140,69,.15);
}

.team-count{
margin-bottom:24px;
font-size:18px;
font-weight:700;
color:#555;
text-align:center;
}

.teams-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:24px;
}

.team-card{
background:white;
border-radius:18px;
overflow:hidden;
text-decoration:none;
color:#111;
box-shadow:0 2px 10px rgba(0,0,0,.08);
transition:.2s ease;
display:block;
}

.team-card:hover{
transform:translateY(-4px);
box-shadow:0 8px 24px rgba(0,0,0,.14);
}

.team-band{
height:10px;
width:100%;
}

.team-content{
padding:28px 22px;
}

.team-name{
font-size:30px;
font-weight:900;
margin-bottom:10px;
line-height:1.15;
}

.team-meta{
font-size:16px;
color:#666;
font-weight:600;
}

.no-results{
text-align:center;
font-size:22px;
font-weight:800;
padding:60px 20px;
color:#666;
display:none;
}

@media(max-width:900px){
.hero h1{font-size:42px;}
.hero p{font-size:18px;}
.team-name{font-size:24px;}
}

</style>
</head>
<body>

<div class="navbar">
<a href="/">Home</a>
<a href="/epl.html">EPL</a>
<a href="/laliga.html">La Liga</a>
<a href="/seriea.html">Serie A</a>
<a href="/nba.html">NBA</a>
<a href="/afl.html">AFL</a>
<a href="/baseball.html">Baseball</a>
</div>

<div class="hero">
<h1>Serie A Teams</h1>
<p>Every club to play in Serie A</p>
</div>

<div class="container">

<div class="search-wrap">
<input type="text" id="teamSearch" placeholder="Search teams...">
</div>

<div class="team-count" id="teamCount"></div>
<div class="teams-grid" id="teamsGrid"></div>
<div class="no-results" id="noResults">No teams found</div>

</div>

<script>

const TEAMS = [
{name:"Atalanta",colour:"linear-gradient(90deg,#1B449C,#000000)"},
{name:"Bologna",colour:"linear-gradient(90deg,#CC0000,#003DA5)"},
{name:"Brescia",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"Cagliari",colour:"linear-gradient(90deg,#CC0000,#003DA5)"},
{name:"Catania",colour:"linear-gradient(90deg,#CC0000,#003DA5)"},
{name:"Cesena",colour:"linear-gradient(90deg,#FFFFFF,#000000)"},
{name:"Chievo",colour:"linear-gradient(90deg,#FFD700,#003DA5)"},
{name:"Como",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"Cremonese",colour:"linear-gradient(90deg,#CC0000,#808080)"},
{name:"Empoli",colour:"linear-gradient(90deg,#003DA5,#FFFFFF)"},
{name:"Fiorentina",colour:"linear-gradient(90deg,#6C2B8F,#FFFFFF)"},
{name:"Frosinone",colour:"linear-gradient(90deg,#FFD700,#003DA5)"},
{name:"Genoa",colour:"linear-gradient(90deg,#CC0000,#003DA5)"},
{name:"Hellas Verona",colour:"linear-gradient(90deg,#FFD700,#003DA5)"},
{name:"Internazionale",colour:"linear-gradient(90deg,#003DA5,#000000)"},
{name:"Juventus",colour:"linear-gradient(90deg,#000000,#FFFFFF)"},
{name:"Lazio",colour:"linear-gradient(90deg,#87CEEB,#FFFFFF)"},
{name:"Lecce",colour:"linear-gradient(90deg,#FFD700,#CC0000)"},
{name:"Livorno",colour:"linear-gradient(90deg,#CC0000,#FFD700)"},
{name:"Messina",colour:"linear-gradient(90deg,#FFD700,#CC0000)"},
{name:"Milan",colour:"linear-gradient(90deg,#CC0000,#000000)"},
{name:"Modena",colour:"linear-gradient(90deg,#FFD700,#003DA5)"},
{name:"Napoli",colour:"linear-gradient(90deg,#00AAFF,#FFFFFF)"},
{name:"Novara",colour:"linear-gradient(90deg,#CC0000,#000000)"},
{name:"Palermo",colour:"linear-gradient(90deg,#CC0000,#FFD700)"},
{name:"Parma",colour:"linear-gradient(90deg,#FFD700,#003DA5)"},
{name:"Piacenza",colour:"linear-gradient(90deg,#CC0000,#FFFFFF)"},
{name:"Reggina",colour:"linear-gradient(90deg,#FF6600,#000000)"},
{name:"Roma",colour:"linear-gradient(90deg,#CC0000,#FFD700)"},
{name:"Sampdoria",colour:"linear-gradient(90deg,#003DA5,#CC0000)"},
{name:"Sassuolo",colour:"linear-gradient(90deg,#008000,#000000)"},
{name:"Siena",colour:"linear-gradient(90deg,#008000,#FFFFFF)"},
{name:"SPAL",colour:"linear-gradient(90deg,#FFFFFF,#003DA5)"},
{name:"Torino",colour:"linear-gradient(90deg,#8B0000,#FFFFFF)"},
{name:"Udinese",colour:"linear-gradient(90deg,#000000,#FFFFFF)"},
{name:"Venezia",colour:"linear-gradient(90deg,#FF6600,#008000)"},
{name:"Vicenza",colour:"linear-gradient(90deg,#CC0000,#FFFFFF)"},
];

const grid      = document.getElementById("teamsGrid");
const search    = document.getElementById("teamSearch");
const count     = document.getElementById("teamCount");
const noResults = document.getElementById("noResults");

function renderTeams(filter=""){
  const filtered = TEAMS
    .sort((a,b) => a.name.localeCompare(b.name))
    .filter(team => team.name.toLowerCase().includes(filter.toLowerCase()));

  count.innerHTML = `${filtered.length} Teams`;

  if(filtered.length === 0){
    noResults.style.display = "block";
    grid.innerHTML = "";
    return;
  }

  noResults.style.display = "none";

  grid.innerHTML = filtered.map(team => `
    <a class="team-card" href="seriea-team.html?team=${encodeURIComponent(team.name)}">
      <div class="team-band" style="background:${team.colour};"></div>
      <div class="team-content">
        <div class="team-name">${team.name}</div>
        <div class="team-meta">View club stats, results and players</div>
      </div>
    </a>
  `).join('');
}

search.addEventListener("input", e => renderTeams(e.target.value));
renderTeams();

</script>
</body>
</html>
