<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:28px;
border-radius:0 0 16px 16px;
}

.hero h1{
margin:0;
font-size:32px;
}

/* SUMMARY — IPL STYLE */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
padding:20px;
}

.summary-box{
background:#e7e7ec;
padding:14px 16px;
border-radius:12px;
min-height:68px;
display:flex;
flex-direction:column;
justify-content:center;
}

.summary-label{
font-weight:700;
font-size:15px;
margin-bottom:4px;
color:#222;
}

.summary-value{
font-size:16px;
color:#111;
line-height:1.3;
}

/* INNINGS */

.innings-block{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
margin:20px;
}

.innings-header{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:12px 16px;
font-weight:700;
display:flex;
justify-content:space-between;
font-size:18px;
}

.innings-content{
padding:16px;
}

.score{
font-weight:700;
margin-bottom:8px;
}

.meta-line{
margin-bottom:12px;
font-weight:600;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
margin-bottom:14px;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

th{
background:#eef1f6;
}

tr:nth-child(even){
background:#f6fbff;
}

.right{
text-align:right;
}

.fow{
background:#f1f3f7;
padding:10px;
border-radius:8px;
margin-bottom:12px;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="hero">
<h1>T20 World Cup Match</h1>
<p id="heroStatus">Loading match...</p>
</div>

<div id="summary" class="summary"></div>
<div id="inningsContainer"></div>

<script>

const BASE="/data/t20-world-cup/matches/";

const params=new URLSearchParams(location.search);
const file=params.get("file");
const matchIndex=parseInt(params.get("match"));

const heroStatus=document.getElementById("heroStatus");

init();

async function init(){

try{

const response=await fetch(BASE+file);

if(!response.ok)
throw new Error("File not found");

const season=await response.json();

const match=season[matchIndex];

if(!match)
throw new Error("Match not found");

renderMatch(match);

heroStatus.innerText="Match loaded";

}
catch(err){

heroStatus.innerText="Error: "+err.message;

}

}


/* MATCH HEADER */

function renderMatch(match){

const info=match.info;

let winner="";
let result="";
let pom="";
let stage="";

if(info.outcome?.winner){

winner=info.outcome.winner;

if(info.outcome.by?.runs)
result=`won by ${info.outcome.by.runs} runs`;

else if(info.outcome.by?.wickets)
result=`won by ${info.outcome.by.wickets} wickets`;

}

if(info.player_of_match)
pom=info.player_of_match.join(", ");

if(info.event?.stage)
stage=info.event.stage;

document.getElementById("summary").innerHTML=`

<div class="summary-box">
<div class="summary-label">Date</div>
<div class="summary-value">${formatDate(info.dates?.[0])}</div>
</div>

<div class="summary-box">
<div class="summary-label">Teams</div>
<div class="summary-value">${info.teams.join(" vs ")}</div>
</div>

<div class="summary-box">
<div class="summary-label">Venue</div>
<div class="summary-value">${info.venue}</div>
</div>

<div class="summary-box">
<div class="summary-label">Winner</div>
<div class="summary-value">${winner}</div>
</div>

<div class="summary-box">
<div class="summary-label">Result</div>
<div class="summary-value">${result}</div>
</div>

<div class="summary-box">
<div class="summary-label">Player of Match</div>
<div class="summary-value">${pom}</div>
</div>

<div class="summary-box">
<div class="summary-label">Stage</div>
<div class="summary-value">${stage}</div>
</div>

`;

const container=document.getElementById("inningsContainer");

container.innerHTML="";

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

renderInnings(container,inn);

});

}


/* INNINGS */

function renderInnings(container,inn){

let batterStats={};
let bowlerStats={};
let dismissals={};
let fow=[];
let powerplays=inn.powerplays||[];

let runs=0;
let wkts=0;
let balls=0;

let extras={w:0,nb:0,lb:0,b:0};

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

runs+=d.runs.total;

if(!d.extras?.wides && !d.extras?.noballs)
balls++;

if(d.extras?.wides) extras.w+=d.extras.wides;
if(d.extras?.noballs) extras.nb+=d.extras.noballs;
if(d.extras?.legbyes) extras.lb+=d.extras.legbyes;
if(d.extras?.byes) extras.b+=d.extras.byes;

const batter=d.batter;

if(!batterStats[batter])
batterStats[batter]={runs:0,balls:0};

batterStats[batter].runs+=d.runs.batter;

if(!d.extras?.wides)
batterStats[batter].balls++;

const bowler=d.bowler;

if(!bowlerStats[bowler])
bowlerStats[bowler]={balls:0,runs:0,wkts:0};

if(!d.extras?.wides && !d.extras?.noballs)
bowlerStats[bowler].balls++;

bowlerStats[bowler].runs+=d.runs.total;

d.wickets?.forEach(w=>{

wkts++;

bowlerStats[bowler].wkts++;

dismissals[w.player_out]=formatDismissal(w,bowler);

fow.push(`${wkts}-${runs} (${w.player_out}, ${formatOvers(balls)} ov)`);

});

});

});

const overs=formatOvers(balls);

const extrasTotal=extras.w+extras.nb+extras.lb+extras.b;

const extrasText=`${extrasTotal} (w ${extras.w}, nb ${extras.nb}, lb ${extras.lb}, b ${extras.b})`;

const powerplayText=powerplays.map(p=>`Overs ${p.from}–${p.to}`).join(", ");

const div=document.createElement("div");

div.className="innings-block";

div.innerHTML=`

<div class="innings-header">

<div>${inn.team} Innings</div>

<div>${runs}/${wkts} (${overs})</div>

</div>

<div class="innings-content">

<div class="score">${runs}/${wkts} (${overs} overs)</div>

${powerplays.length?`<div class="meta-line">Powerplay: ${powerplayText}</div>`:""}

<strong>Batting</strong>

<table>

<tr>
<th>Batter</th>
<th>How out</th>
<th class="right">R</th>
<th class="right">B</th>
<th class="right">SR</th>
</tr>

${Object.entries(batterStats).map(([name,s])=>`

<tr>
<td>${name}</td>
<td>${dismissals[name]||"not out"}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.balls}</td>
<td class="right">${calcSR(s)}</td>
</tr>

`).join("")}

</table>

<div class="meta-line">Extras: ${extrasText}</div>

${fow.length?`<div class="fow"><strong>Fall of wickets</strong> ${fow.join(", ")}</div>`:""}

<strong>Bowling</strong>

<table>

<tr>
<th>Bowler</th>
<th class="right">O</th>
<th class="right">R</th>
<th class="right">W</th>
<th class="right">Econ</th>
</tr>

${Object.entries(bowlerStats).map(([name,s])=>`

<tr>
<td>${name}</td>
<td class="right">${formatOvers(s.balls)}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.wkts}</td>
<td class="right">${calcEcon(s)}</td>
</tr>

`).join("")}

</table>

</div>

`;

container.appendChild(div);

}


/* HELPERS */

function calcSR(s){
return s.balls?((s.runs/s.balls)*100).toFixed(1):"-";
}

function calcEcon(s){
return s.balls?(s.runs/(s.balls/6)).toFixed(2):"-";
}

function formatOvers(balls){
return Math.floor(balls/6)+"."+(balls%6);
}

function formatDate(d){
return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

function formatDismissal(w,bowler){

const fielders=w.fielders?.map(f=>f.name).join("/");

switch(w.kind){

case "bowled": return `b ${bowler}`;
case "caught": return `c ${fielders} b ${bowler}`;
case "lbw": return `lbw b ${bowler}`;
case "stumped": return `st ${fielders} b ${bowler}`;
case "run out": return `run out (${fielders})`;
case "caught and bowled": return `c & b ${bowler}`;
default: return w.kind;

}

}

</script>

</body>
</html>
