<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:28px;
border-radius:0 0 16px 16px;
}

.hero h1{
margin:0;
font-size:32px;
}

.hero p{
margin:6px 0 0;
opacity:.9;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:16px;
padding:20px;
}

.summary-box{
background:#e7e7ec;
padding:14px;
border-radius:10px;
border:1px solid rgba(0,0,0,0.06);
}

.summary-box strong{
display:block;
margin-bottom:4px;
}

/* INNINGS BLOCK */

.innings-block{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
margin:20px;
}

/* RED HEADER BAR */

.innings-header{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:12px 16px;
font-weight:800;
font-size:18px;
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
}

.innings-header .sub{
font-weight:700;
opacity:.95;
font-size:15px;
white-space:nowrap;
}

/* CONTENT */

.innings-content{
padding:16px;
}

.score{
font-weight:800;
margin-bottom:10px;
font-size:18px;
}

/* META LINES */

.meta-line{
margin:10px 0 14px;
font-weight:700;
color:#222;
}

.meta-line span{
font-weight:600;
color:#333;
}

.section-title{
margin:10px 0 8px;
font-weight:800;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
margin-bottom:14px;
background:white;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
vertical-align:top;
}

th{
background:#eef1f6;
text-align:left;
font-weight:800;
}

tbody tr:nth-child(even){
background:#f6fbff;
}

tbody tr:hover{
background:#eef7ff;
}

.right{
text-align:right;
}

.howout{
max-width:560px;
word-break:break-word;
}

/* FOW */

.fow{
margin:10px 0 14px;
padding:12px 14px;
border-radius:10px;
background:#f6f7fb;
border:1px solid rgba(0,0,0,0.06);
}

.fow strong{
display:block;
margin-bottom:6px;
}

/* SMALL NOTE */

.small{
font-size:13px;
opacity:.85;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="hero">
<h1>T20 World Cup Match</h1>
<p id="heroStatus">Loading match...</p>
</div>

<div id="summary" class="summary"></div>
<div id="inningsContainer"></div>

<script>

const BASE="/data/t20-world-cup/matches/";

const params=new URLSearchParams(location.search);
const file=params.get("file");
const matchIndex=parseInt(params.get("match"));

const heroStatus=document.getElementById("heroStatus");

if(!file){
heroStatus.innerText="Missing file parameter";
throw new Error("Missing file param");
}

if(isNaN(matchIndex)){
heroStatus.innerText="Missing match parameter";
throw new Error("Missing match param");
}

init();

async function init(){

try{

heroStatus.innerText="Loading file...";

const response=await fetch(BASE+file);

if(!response.ok){
throw new Error("File not found: "+file);
}

const season=await response.json();

heroStatus.innerText="Loading match...";

if(!season[matchIndex]){
throw new Error("Match index not found");
}

renderMatch(season[matchIndex]);

heroStatus.innerText="Match loaded";

}
catch(err){

console.error(err);
heroStatus.innerText="Error loading match: "+err.message;

}

}


/* RENDER MATCH */

function renderMatch(match){

const info=match.info;

let winner="";
let result="";
let stage="";

if(info.event?.stage) stage=info.event.stage;
else if(info.event?.name) stage=info.event.name;

if(info.outcome?.winner){

winner=info.outcome.winner;

if(info.outcome.by?.runs)
result=`won by ${info.outcome.by.runs} runs`;

else if(info.outcome.by?.wickets)
result=`won by ${info.outcome.by.wickets} wickets`;

else
result=`won`;

}

const pom = Array.isArray(info.player_of_match) ? info.player_of_match.join(", ") : (info.player_of_match || "");

document.getElementById("summary").innerHTML=`

<div class="summary-box">
<strong>Date</strong>
${formatDate(info.dates?.[0])}
</div>

<div class="summary-box">
<strong>Teams</strong>
${info.teams?.join(" vs ") || ""}
</div>

<div class="summary-box">
<strong>Venue</strong>
${info.venue || ""}
</div>

<div class="summary-box">
<strong>Winner</strong>
${winner || ""}
</div>

<div class="summary-box">
<strong>Result</strong>
${result || ""}
</div>

${(stage || pom) ? `
<div class="summary-box">
<strong>Stage</strong>
${stage || ""}
</div>

<div class="summary-box">
<strong>Player of the Match</strong>
${pom || ""}
</div>
` : ""}

`;

const container=document.getElementById("inningsContainer");
container.innerHTML="";

match.innings.forEach(raw=>{
const inn = raw.team ? raw : Object.values(raw)[0];
renderInnings(container,inn);
});

}


/* RENDER INNINGS */

function renderInnings(container,inn){

let batterStats={};
let bowlerStats={};
let dismissals={};

let runs=0;
let wkts=0;
let legalBalls=0;

/* Extras breakdown */
let ex_w=0, ex_nb=0, ex_b=0, ex_lb=0, ex_p=0;
let extrasTotal=0;

/* Fall of wickets */
let fow=[];

(inn.overs || []).forEach(over=>{

(over.deliveries || []).forEach(d=>{

/* runs */
runs += d.runs?.total || 0;

/* extras values (Cricsheet keys) */
const e = d.extras || {};
ex_w  += (e.wides || 0);
ex_nb += (e.noballs || 0);
ex_b  += (e.byes || 0);
ex_lb += (e.legbyes || 0);
ex_p  += (e.penalty || 0);

/* extras total best-practice */
extrasTotal += ((d.runs?.total || 0) - (d.runs?.batter || 0));

/* legal ball? */
const wide = !!e.wides;
const noball = !!e.noballs;
const isLegal = (!wide && !noball);

/* batter */
const batter=d.batter;

if(!batterStats[batter]) batterStats[batter]={runs:0,balls:0};

batterStats[batter].runs += (d.runs?.batter || 0);

/* batsman balls: wides don't count; no-balls DO count as a ball faced */
if(!wide) batterStats[batter].balls++;

/* bowler */
const bowler=d.bowler;

if(!bowlerStats[bowler]) bowlerStats[bowler]={balls:0,runs:0,wkts:0};

if(isLegal) bowlerStats[bowler].balls++;

bowlerStats[bowler].runs += (d.runs?.total || 0);

/* wickets */
(d.wickets || []).forEach(w=>{

wkts++;
bowlerStats[bowler].wkts++;

dismissals[w.player_out] = formatDismissal(w, bowler);

/* fall of wicket timing (Cricinfo style) */
const displayBalls = isLegal ? (legalBalls + 1) : (legalBalls);
const ovStr = ballsToOverString(displayBalls);
fow.push(`${wkts}-${runs} (${w.player_out}, ${ovStr} ov)`);

});

/* increment legal balls AFTER processing a legal delivery */
if(isLegal) legalBalls++;

});

});

const oversStr = formatOvers(legalBalls);

/* extras text */
const extrasParts=[];
if(ex_w)  extrasParts.push(`w ${ex_w}`);
if(ex_nb) extrasParts.push(`nb ${ex_nb}`);
if(ex_lb) extrasParts.push(`lb ${ex_lb}`);
if(ex_b)  extrasParts.push(`b ${ex_b}`);
if(ex_p)  extrasParts.push(`pen ${ex_p}`);

const extrasText = `${extrasTotal}${extrasParts.length ? " ("+extrasParts.join(", ")+")" : ""}`;

/* build block */
const div=document.createElement("div");
div.className="innings-block";

div.innerHTML=`

<div class="innings-header">
<div>${inn.team} Innings</div>
<div class="sub">${runs}/${wkts} (${oversStr} overs)</div>
</div>

<div class="innings-content">

<div class="score">${runs}/${wkts} <span class="small">(${oversStr} overs)</span></div>

<div class="section-title">Batting</div>

<table>
<thead>
<tr>
<th style="width:26%;">Batter</th>
<th class="howout">How out</th>
<th class="right" style="width:8%;">R</th>
<th class="right" style="width:8%;">B</th>
<th class="right" style="width:10%;">SR</th>
</tr>
</thead>
<tbody>
${Object.entries(batterStats).map(([name,s])=>`
<tr>
<td>${name}</td>
<td class="howout">${dismissals[name] || "not out"}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.balls}</td>
<td class="right">${calcSR(s)}</td>
</tr>
`).join("")}
</tbody>
</table>

<div class="meta-line">Extras: <span>${extrasText}</span></div>

${fow.length ? `
<div class="fow">
<strong>Fall of wickets</strong>
<div>${fow.join(", ")}</div>
</div>
` : ""}

<div class="section-title">Bowling</div>

<table>
<thead>
<tr>
<th>Bowler</th>
<th class="right" style="width:10%;">O</th>
<th class="right" style="width:10%;">R</th>
<th class="right" style="width:10%;">W</th>
<th class="right" style="width:12%;">Econ</th>
</tr>
</thead>
<tbody>
${Object.entries(bowlerStats).map(([name,s])=>`
<tr>
<td>${name}</td>
<td class="right">${formatOvers(s.balls)}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.wkts}</td>
<td class="right">${calcEcon(s)}</td>
</tr>
`).join("")}
</tbody>
</table>

</div>
`;

container.appendChild(div);

}


/* HELPERS */

function calcSR(s){
return s.balls ? ((s.runs/s.balls)*100).toFixed(1) : "-";
}

function calcEcon(s){
return s.balls ? (s.runs / (s.balls/6)).toFixed(2) : "-";
}

function formatOvers(balls){
return Math.floor(balls/6)+"."+(balls%6);
}

function ballsToOverString(balls){
/* balls here are "ball count" in the innings timeline (legal balls only; wides/no-balls may use current) */
const o = Math.floor(balls/6);
const b = balls%6;
return `${o}.${b}`;
}

function formatDate(d){
if(!d) return "";
return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}


/* FULL DISMISSAL FORMAT (Cricinfo style) */

function formatDismissal(w, bowler){

const fielders = (w.fielders || []).map(f=>f.name).filter(Boolean).join("/");

switch(w.kind){

case "bowled":
return `b ${bowler}`;

case "caught":
return `c ${fielders || "?"} b ${bowler}`;

case "lbw":
return `lbw b ${bowler}`;

case "stumped":
return `st ${fielders || "?"} b ${bowler}`;

case "run out":
return `run out (${fielders || "?"})`;

case "caught and bowled":
return `c & b ${bowler}`;

case "hit wicket":
return `hit wicket b ${bowler}`;

case "retired hurt":
return `retired hurt`;

case "retired out":
return `retired out`;

case "obstructing the field":
return `obstructing the field`;

case "handled the ball":
return `handled the ball`;

case "hit the ball twice":
return `hit the ball twice`;

case "timed out":
return `timed out`;

default:
return w.kind || "out";

}

}

</script>

</body>
</html>
