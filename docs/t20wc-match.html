<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

/* NAVBAR */

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}

/* PAGE */

.page-wrap{
  max-width:1000px;
  margin:auto;
  padding:30px 20px;
}

/* HERO */

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:30px;
  border-radius:18px;
  margin-bottom:25px;
}

/* INNINGS BLOCK */

.innings{
  margin-bottom:30px;
  border-radius:14px;
  overflow:hidden;
  border:1px solid #ddd;
}

/* COLOURED HEADER BAR */

.innings-header{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:14px 18px;
  font-size:20px;
  font-weight:700;
}

/* TABLE */

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

th{
  background:#f3f6fb;
  text-align:left;
}

tr:nth-child(even){
  background:#eaf3ff;
}

.right{
  text-align:right;
}

.player-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}

.player-link:hover{
  text-decoration:underline;
}

.summary{
  font-size:18px;
  font-weight:600;
  margin-top:8px;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page-wrap">

<div class="hero">

<h1 id="title">Loading...</h1>

<p id="info"></p>

<div id="result" class="summary"></div>

</div>

<div id="innings"></div>

</div>

<script>

const INDEX="data/t20-world-cup/index.json";
const BASE="data/t20-world-cup/matches/";
const PLAYER_MAP="data/players-name.json";

let playerMap={};
let reverseMap={};

const params=new URLSearchParams(location.search);

const seasonIndex=parseInt(params.get("season"));
const matchIndex=parseInt(params.get("match"));

init();

async function init(){

playerMap=await fetch(PLAYER_MAP).then(r=>r.json());

Object.entries(playerMap).forEach(([short,long])=>{
reverseMap[short]=long;
});

const files=await fetch(INDEX).then(r=>r.json());

const seasonFile=files[seasonIndex];

const season=await fetch(BASE+seasonFile).then(r=>r.json());

const match=season[matchIndex];

renderMatch(match);

}

function fullName(short){

return playerMap[short]||short;

}

function playerLink(short){

const name=fullName(short);

return `<a class="player-link"
href="t20wc-player.html?name=${encodeURIComponent(name)}">
${name}
</a>`;

}

function ballsToOvers(b){

return Math.floor(b/6)+"."+(b%6);

}

function renderMatch(match){

const info=match.info;

title.textContent=info.teams.join(" vs ");

infoEl=info;

document.getElementById("info").textContent=
new Date(info.dates[0]).toLocaleDateString("en-GB")
+" • "+(info.venue||"");

if(info.outcome?.winner){

let text=info.outcome.winner+" won";

if(info.outcome.by?.runs)
text+=" by "+info.outcome.by.runs+" runs";

else if(info.outcome.by?.wickets)
text+=" by "+info.outcome.by.wickets+" wickets";

result.textContent=text;

}

const container=document.getElementById("innings");

container.innerHTML="";

match.innings.forEach(inn=>{

let batterStats={};
let bowlerStats={};

let runs=0;
let wkts=0;
let balls=0;

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

runs+=d.runs.total;

const isWide=d.extras?.wides;
const isNoBall=d.extras?.noballs;

if(!isWide && !isNoBall)
balls++;

const bat=d.batter;
const bowl=d.bowler;

if(!batterStats[bat])
batterStats[bat]={runs:0,balls:0};

batterStats[bat].runs+=d.runs.batter;

if(!isWide)
batterStats[bat].balls++;

if(!bowlerStats[bowl])
bowlerStats[bowl]={balls:0,runs:0,wkts:0};

if(!isWide && !isNoBall)
bowlerStats[bowl].balls++;

bowlerStats[bowl].runs+=d.runs.total;

if(d.wickets){
wkts+=d.wickets.length;
bowlerStats[bowl].wkts+=d.wickets.length;
}

});

});

const overs=ballsToOvers(balls);

let html=`<div class="innings">

<div class="innings-header">
${inn.team} — ${runs}/${wkts} (${overs} overs)
</div>

<table>

<tr>
<th>Batter</th>
<th class="right">R</th>
<th class="right">B</th>
<th class="right">SR</th>
</tr>`;

Object.entries(batterStats).forEach(([name,s])=>{

const sr=s.balls?((s.runs/s.balls)*100).toFixed(1):"-";

html+=`
<tr>
<td>${playerLink(name)}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.balls}</td>
<td class="right">${sr}</td>
</tr>`;

});

html+=`</table><table>

<tr>
<th>Bowler</th>
<th class="right">O</th>
<th class="right">R</th>
<th class="right">W</th>
<th class="right">Econ</th>
</tr>`;

Object.entries(bowlerStats).forEach(([name,s])=>{

const overs=ballsToOvers(s.balls);
const econ=(s.runs/(s.balls/6)).toFixed(2);

html+=`
<tr>
<td>${playerLink(name)}</td>
<td class="right">${overs}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.wkts}</td>
<td class="right">${econ}</td>
</tr>`;

});

html+=`</table></div>`;

container.innerHTML+=html;

});

}

</script>

</body>
</html>
