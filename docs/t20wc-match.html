<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:15px;
  border-bottom:1px solid #ddd;
}

.page{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:30px;
  border-radius:16px;
  margin-bottom:20px;
}

.innings{
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:20px;
}

.innings-header{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:12px;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
}

tr:nth-child(even){
  background:#eaf3ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">

<h1 id="title">Loading match...</h1>

<p id="info"></p>

<p id="result"></p>

</div>

<div id="innings"></div>

</div>

<script>

/* DATA LOCATION */
const BASE="/docs/data/t20-world-cup/matches/";

/* GET PARAMETERS */
const params=new URLSearchParams(window.location.search);

const file=params.get("file");
const matchIndex=parseInt(params.get("match"));

console.log("FILE:", file);
console.log("MATCH INDEX:", matchIndex);

/* VALIDATE */
if(!file){

document.getElementById("title").textContent=
"No file parameter received in URL";

throw new Error("Missing file parameter");

}

if(isNaN(matchIndex)){

document.getElementById("title").textContent=
"No match index received in URL";

throw new Error("Missing match index");

}

/* LOAD */
loadMatch();

async function loadMatch(){

try{

const season=await fetch(BASE+file).then(r=>r.json());

const match=season[matchIndex];

if(!match){

title.textContent="Match not found in file";
return;

}

renderMatch(match);

}catch(err){

console.error(err);

title.textContent="Failed loading file: "+file;

}

}

function overs(b){
return Math.floor(b/6)+"."+(b%6);
}

function renderMatch(match){

title.textContent=match.info.teams.join(" vs ");

info.textContent=
match.info.dates[0]+" • "+(match.info.venue||"");

const container=document.getElementById("innings");

container.innerHTML="";

match.innings.forEach(inn=>{

let runs=0,wkts=0,balls=0;
let bat={};

inn.overs.forEach(o=>{

o.deliveries.forEach(d=>{

runs+=d.runs.total;

if(!d.extras?.wides&&!d.extras?.noballs)
balls++;

if(!bat[d.batter])
bat[d.batter]={runs:0,balls:0};

bat[d.batter].runs+=d.runs.batter;

if(!d.extras?.wides)
bat[d.batter].balls++;

if(d.wickets)
wkts+=d.wickets.length;

});

});

let html=`
<div class="innings">
<div class="innings-header">
${inn.team} — ${runs}/${wkts} (${overs(balls)} overs)
</div>
<table>
<tr>
<th>Batter</th>
<th>R</th>
<th>B</th>
<th>SR</th>
</tr>
`;

Object.entries(bat).forEach(([n,s])=>{

html+=`
<tr>
<td>${n}</td>
<td>${s.runs}</td>
<td>${s.balls}</td>
<td>${s.balls?((s.runs/s.balls)*100).toFixed(1):"-"}</td>
</tr>
`;

});

html+="</table></div>";

container.innerHTML+=html;

});

}

</script>

</body>
</html>
