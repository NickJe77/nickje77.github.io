<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#ffffff;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px;
border-bottom:1px solid #ddd;
background:#fff;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:30px;
margin:20px;
border-radius:16px;
}

.innings{
margin:20px;
border-radius:12px;
overflow:hidden;
border:1px solid #ddd;
}

.innings-header{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:12px;
font-weight:600;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
}

tr:nth-child(even){
background:#eaf3ff;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div id="hero" class="hero">Loading match...</div>

<div id="innings"></div>

<script>

const BASE="/data/t20-world-cup/matches/";

const params=new URLSearchParams(location.search);

const file=params.get("file");
const matchIndex=parseInt(params.get("match"));

if(!file || isNaN(matchIndex)){
document.getElementById("hero").innerHTML="Invalid match link";
throw "";
}

loadMatch();

async function loadMatch(){

const season=await fetch(BASE+file).then(r=>r.json());

const match=season[matchIndex];

renderMatch(match);

}

function renderMatch(match){

const hero=document.getElementById("hero");

hero.innerHTML=`
<h2>${match.info.teams.join(" vs ")}</h2>
<div>${match.info.venue} • ${match.info.dates[0]}</div>
`;

const container=document.getElementById("innings");

match.innings.forEach(inn=>{

let runs=0,wkts=0,balls=0;

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

const wide=d.extras?.wides;
const noball=d.extras?.noballs;

runs+=d.runs.total;

if(!wide && !noball) balls++;

if(d.wickets) wkts+=d.wickets.length;

});

});

const overs=Math.floor(balls/6)+"."+(balls%6);

const div=document.createElement("div");

div.className="innings";

div.innerHTML=`
<div class="innings-header">
${inn.team} — ${runs}/${wkts} (${overs})
</div>
`;

container.appendChild(div);

});

}

</script>

</body>
</html>
