<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:28px;
border-radius:0 0 16px 16px;
}

.hero h1{
margin:0;
font-size:32px;
}

.hero p{
margin:6px 0 0;
opacity:.9;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:16px;
padding:20px;
}

.summary-box{
background:#e7e7ec;
padding:14px;
border-radius:10px;
}

.summary-box strong{
display:block;
margin-bottom:4px;
}

/* INNINGS BLOCK */

.innings-block{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
margin:20px;
}

/* RED HEADER BAR */

.innings-header{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:12px 16px;
font-weight:700;
font-size:18px;
}

/* CONTENT */

.innings-content{
padding:16px;
}

.score{
font-weight:700;
margin-bottom:14px;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
margin-bottom:18px;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

th{
background:#eef1f6;
text-align:left;
}

.right{
text-align:right;
}

</style>
</head>

<body>

<div class="navbar">

<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>

</div>


<div class="hero">

<h1>T20 World Cup Match</h1>
<p id="heroStatus">Loading match...</p>

</div>


<div id="summary" class="summary"></div>

<div id="inningsContainer"></div>


<script>

const BASE="/data/t20-world-cup/matches/";

const params=new URLSearchParams(location.search);

const file=params.get("file");
const matchIndex=parseInt(params.get("match"));

if(!file || isNaN(matchIndex)){

document.getElementById("heroStatus").innerText="Invalid match link";
throw "";

}

init();


async function init(){

const season=await fetch(BASE+file).then(r=>r.json());

const match=season[matchIndex];

if(!match){
document.getElementById("heroStatus").innerText="Match not found";
return;
}

renderMatch(match);

}


/* MATCH HEADER */

function renderMatch(match){

const info=match.info;

let winner="";
let result="";

if(info.outcome?.winner){

winner=info.outcome.winner;

if(info.outcome.by?.runs)
result=`won by ${info.outcome.by.runs} runs`;

else if(info.outcome.by?.wickets)
result=`won by ${info.outcome.by.wickets} wickets`;

}

document.getElementById("heroStatus").innerText="Match loaded";


document.getElementById("summary").innerHTML=`

<div class="summary-box">
<strong>Date</strong>
${formatDate(info.dates?.[0])}
</div>

<div class="summary-box">
<strong>Teams</strong>
${info.teams.join(" vs ")}
</div>

<div class="summary-box">
<strong>Venue</strong>
${info.venue || ""}
</div>

<div class="summary-box">
<strong>Winner</strong>
${winner}
</div>

<div class="summary-box">
<strong>Result</strong>
${result}
</div>

`;

const container=document.getElementById("inningsContainer");

container.innerHTML="";

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

renderInnings(container,inn);

});

}


/* RENDER INNINGS */

runs+=d.runs.total;

if(!d.extras?.wides && !d.extras?.noballs)

const batter=d.batter;

if(!batterStats[batter])
batterStats[batter]={runs:0,balls:0};

batterStats[batter].runs+=d.runs.batter;

bowlerStats[bowler].runs+=d.runs.total;


d.wickets?.forEach(w=>{

wkts++;

bowlerStats[bowler].wkts++
