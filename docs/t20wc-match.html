<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
}

.page-wrap{
  max-width:1000px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:30px;
  border-radius:20px;
  margin-bottom:25px;
}

.hero h1{
  margin:0;
}

.innings{
  border:1px solid #ddd;
  border-radius:14px;
  margin-bottom:25px;
  overflow:hidden;
}

.innings-header{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:14px 18px;
  font-size:20px;
  font-weight:700;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

th{
  background:#f3f6fb;
}

tr:nth-child(even){
  background:#eaf3ff;
}

.right{
  text-align:right;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page-wrap">

<div class="hero">

<h1 id="title">Loading match...</h1>

<p id="info"></p>

<p id="result"></p>

</div>

<div id="innings"></div>

</div>

<script>

/* YOUR REAL DATA FOLDER */
const BASE="/docs/data/t20-world-cup/matches/";

/* GET PARAMETERS */
const params=new URLSearchParams(window.location.search);

const file=params.get("file");
const matchIndex=parseInt(params.get("match"));

/* VALIDATE */
if(!file || isNaN(matchIndex)){

document.getElementById("title").textContent="Invalid match link";

throw new Error("Missing file or match index");

}

/* LOAD MATCH */
loadMatch();

async function loadMatch(){

try{

const season=await fetch(BASE+file).then(r=>r.json());

const match=season[matchIndex];

if(!match){

title.textContent="Match not found";
return;

}

renderMatch(match);

}catch(err){

console.error(err);

title.textContent="Failed to load match";

}

}

/* OVERS FORMAT */
function ballsToOvers(b){

return Math.floor(b/6)+"."+(b%6);

}

/* RENDER MATCH */
function renderMatch(match){

const info=match.info;

document.getElementById("title").textContent=
info.teams.join(" vs ");

document.getElementById("info").textContent=
info.dates[0]+" • "+(info.venue||"");

/* RESULT */
if(info.outcome?.winner){

let text=info.outcome.winner+" won";

if(info.outcome.by?.runs)
text+=" by "+info.outcome.by.runs+" runs";

if(info.outcome.by?.wickets)
text+=" by "+info.outcome.by.wickets+" wickets";

document.getElementById("result").textContent=text;

}

/* INNINGS */
const container=document.getElementById("innings");

container.innerHTML="";

match.innings.forEach(inn=>{

let runs=0;
let wkts=0;
let balls=0;

let batterStats={};
let bowlerStats={};

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

runs+=d.runs.total;

const isWide=d.extras?.wides;
const isNoBall=d.extras?.noballs;

/* ONLY LEGAL BALLS COUNT */
if(!isWide && !isNoBall)
balls++;

/* BATTER */
const batter=d.batter;

if(!batterStats[batter])
batterStats[batter]={runs:0,balls:0};

batterStats[batter].runs+=d.runs.batter;

if(!isWide)
batterStats[batter].balls++;

/* BOWLER */
const bowler=d.bowler;

if(!bowlerStats[bowler])
bowlerStats[bowler]={runs:0,balls:0,wkts:0};

if(!isWide && !isNoBall)
bowlerStats[bowler].balls++;

bowlerStats[bowler].runs+=d.runs.total;

/* WICKETS */
if(d.wickets){

wkts+=d.wickets.length;

bowlerStats[bowler].wkts+=d.wickets.length;

}

});

});

/* BUILD HTML */

let html=`

<div class="innings">

<div class="innings-header">

${inn.team} — ${runs}/${wkts} (${ballsToOvers(balls)} overs)

</div>

<table>

<tr>
<th>Batter</th>
<th class="right">R</th>
<th class="right">B</th>
<th class="right">SR</th>
</tr>
`;

Object.entries(batterStats).forEach(([name,s])=>{

const sr=s.balls?((s.runs/s.balls)*100).toFixed(1):"-";

html+=`

<tr>
<td>${name}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.balls}</td>
<td class="right">${sr}</td>
</tr>
`;

});

html+="</table></div>";

container.innerHTML+=html;

});

}

</script>

</body>
</html>
