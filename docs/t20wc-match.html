<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#ffffff;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:15px;
  border-bottom:1px solid #ddd;
  background:#fff;
}

.page{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:30px;
  border-radius:16px;
  margin-bottom:25px;
}

.innings{
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:25px;
  overflow:hidden;
}

.innings-header{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:14px;
  font-size:20px;
  font-weight:700;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

th{
  background:#f3f6fb;
}

tr:nth-child(even){
  background:#eaf3ff;
}

.right{
  text-align:right;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">

<h1 id="title">Loading match...</h1>

<p id="info"></p>

<p id="result"></p>

</div>

<div id="innings"></div>

</div>

<script>

/* YOUR ACTUAL DATA LOCATION */
const BASE="/docs/data/t20-world-cup/matches/";

/* GET URL PARAMETERS */
const params=new URLSearchParams(location.search);

const seasonFile=params.get("file");
const matchIndex=parseInt(params.get("match"));

if(!seasonFile || isNaN(matchIndex)){

document.getElementById("title").textContent="Invalid match link";

throw new Error("Missing file or match index");

}

/* LOAD MATCH */
loadMatch();

async function loadMatch(){

try{

const season=await fetch(BASE+seasonFile).then(r=>r.json());

const match=season[matchIndex];

if(!match){

title.textContent="Match not found";
return;

}

renderMatch(match);

}catch(err){

console.error(err);

title.textContent="Failed to load match";

}

}

/* OVERS */
function overs(b){

return Math.floor(b/6)+"."+(b%6);

}

/* RENDER */
function renderMatch(match){

title.textContent=match.info.teams.join(" vs ");

info.textContent=
match.info.dates[0]+" • "+(match.info.venue||"");

/* RESULT */

if(match.info.outcome?.winner){

let r=match.info.outcome.winner+" won";

if(match.info.outcome.by?.runs)
r+=" by "+match.info.outcome.by.runs+" runs";

if(match.info.outcome.by?.wickets)
r+=" by "+match.info.outcome.by.wickets+" wickets";

result.textContent=r;

}

const container=document.getElementById("innings");

container.innerHTML="";

match.innings.forEach(inn=>{

let runs=0,wkts=0,balls=0;

let bat={},bowl={};

inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

runs+=d.runs.total;

const isWide=d.extras?.wides;
const isNoBall=d.extras?.noballs;

if(!isWide&&!isNoBall)
balls++;

if(!bat[d.batter])
bat[d.batter]={runs:0,balls:0};

bat[d.batter].runs+=d.runs.batter;

if(!isWide)
bat[d.batter].balls++;

if(!bowl[d.bowler])
bowl[d.bowler]={runs:0,balls:0,wkts:0};

if(!isWide&&!isNoBall)
bowl[d.bowler].balls++;

bowl[d.bowler].runs+=d.runs.total;

if(d.wickets){

wkts+=d.wickets.length;

bowl[d.bowler].wkts+=d.wickets.length;

}

});

});

let html=`

<div class="innings">

<div class="innings-header">

${inn.team} — ${runs}/${wkts} (${overs(balls)} overs)

</div>

<table>

<tr>
<th>Batter</th>
<th class="right">R</th>
<th class="right">B</th>
<th class="right">SR</th>
</tr>
`;

Object.entries(bat).forEach(([name,s])=>{

html+=`

<tr>
<td>${name}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.balls}</td>
<td class="right">${s.balls?((s.runs/s.balls)*100).toFixed(1):"-"}</td>
</tr>
`;

});

html+="</table></div>";

container.innerHTML+=html;

});

}

</script>

</body>
</html>
