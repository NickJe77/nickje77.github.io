<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:15px;
  border-bottom:1px solid #ddd;
}

.page{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:30px;
  border-radius:16px;
  margin-bottom:20px;
}

.innings{
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:20px;
  overflow:hidden;
}

.innings-header{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:12px;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
}

th{
  background:#f3f6fb;
}

tr:nth-child(even){
  background:#eaf3ff;
}

.right{
  text-align:right;
}

</style>
</head>
<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page">

<div class="hero">

<h1 id="title">Loading...</h1>

<p id="info"></p>

<p id="result"></p>

</div>

<div id="innings"></div>

</div>

<script>

/* CORRECT PATHS */

const INDEX="/docs/data/t20-world-cup/matches/index.json";
const BASE="/docs/data/t20-world-cup/matches/";

/* GET URL PARAMS */

const params=new URLSearchParams(window.location.search);

const seasonIndex=parseInt(params.get("season"));
const matchIndex=parseInt(params.get("match"));

if(isNaN(seasonIndex)||isNaN(matchIndex)){

title.textContent="Invalid match link";

throw new Error("Bad parameters");

}

loadMatch();


async function loadMatch(){

try{

const files=await fetch(INDEX).then(r=>r.json());

const seasonFile=files[seasonIndex];

const season=await fetch(BASE+seasonFile).then(r=>r.json());

const match=season[matchIndex];

render(match);

}catch(e){

console.error(e);

title.textContent="Failed to load match";

}

}


function ballsToOvers(b){

return Math.floor(b/6)+"."+(b%6);

}


function render(match){

title.textContent=match.info.teams.join(" vs ");

info.textContent=
match.info.dates[0]+" • "+(match.info.venue||"");

if(match.info.outcome?.winner){

let r=match.info.outcome.winner+" won";

if(match.info.outcome.by?.runs)
r+=" by "+match.info.outcome.by.runs+" runs";

if(match.info.outcome.by?.wickets)
r+=" by "+match.info.outcome.by.wickets+" wickets";

result.textContent=r;

}

const container=document.getElementById("innings");

container.innerHTML="";


match.innings.forEach(inn=>{

let bat={},bowl={};

let runs=0,wkts=0,balls=0;

inn.overs.forEach(o=>{

o.deliveries.forEach(d=>{

runs+=d.runs.total;

if(!d.extras?.wides&&!d.extras?.noballs)
balls++;

if(!bat[d.batter])
bat[d.batter]={runs:0,balls:0};

bat[d.batter].runs+=d.runs.batter;

if(!d.extras?.wides)
bat[d.batter].balls++;

if(!bowl[d.bowler])
bowl[d.bowler]={runs:0,balls:0,wkts:0};

if(!d.extras?.wides&&!d.extras?.noballs)
bowl[d.bowler].balls++;

bowl[d.bowler].runs+=d.runs.total;

if(d.wickets){

wkts+=d.wickets.length;

bowl[d.bowler].wkts+=d.wickets.length;

}

});

});

let html=`

<div class="innings">

<div class="innings-header">

${inn.team} — ${runs}/${wkts} (${ballsToOvers(balls)} overs)

</div>

<table>

<tr>
<th>Batter</th>
<th>R</th>
<th>B</th>
<th>SR</th>
</tr>
`;

Object.entries(bat).forEach(([n,s])=>{

html+=`

<tr>
<td>${n}</td>
<td>${s.runs}</td>
<td>${s.balls}</td>
<td>${s.balls?((s.runs/s.balls)*100).toFixed(1):"-"}</td>
</tr>
`;

});

html+="</table></div>";

container.innerHTML+=html;

});

}

</script>

</body>
</html>
