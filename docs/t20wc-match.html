<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page-wrap{
  max-width:1000px;
  margin:0 auto;
  padding:30px 20px;
}

.hero{
  background:linear-gradient(90deg,#6a040f,#d00000);
  color:white;
  padding:30px;
  border-radius:18px;
  margin-bottom:20px;
}

.hero h1{
  margin:0;
}

.summary{
  font-size:18px;
  font-weight:600;
  margin-top:8px;
}

.innings{
  margin-bottom:30px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
}

.right{
  text-align:right;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="page-wrap">

<div class="hero">

<h1 id="title">Loading...</h1>

<p id="info"></p>

<div id="result" class="summary"></div>

</div>

<div id="innings"></div>

</div>

<script>

const FILES = [

"t20wc_2007_FULL.json",
"t20wc_2008_FULL.json",
"t20wc_2009_FULL.json",
"t20wc_2010_FULL.json",
"t20wc_2012_FULL.json",
"t20wc_2013_FULL.json",
"t20wc_2014_FULL.json",
"t20wc_2015_FULL.json",
"t20wc_2016_FULL.json",
"t20wc_2019_FULL.json",
"t20wc_2021_FULL.json",
"t20wc_2022_FULL.json",
"t20wc_2024_FULL.json"

];

const BASE = "data/t20-world-cup/matches/";

const params = new URLSearchParams(location.search);

const seasonIndex = parseInt(params.get("season"));
const matchIndex = parseInt(params.get("match"));

if(isNaN(seasonIndex) || isNaN(matchIndex)){

document.getElementById("title").textContent="Invalid match";

throw new Error("Missing parameters");

}

loadMatch();


async function loadMatch(){

const seasonFile = FILES[seasonIndex];

const seasonData = await fetch(BASE + seasonFile)
.then(r=>r.json());

const match = seasonData[matchIndex];

renderMatch(match);

}


/* Convert legal balls to proper cricket overs format */

function ballsToOvers(balls){

const overs = Math.floor(balls/6);
const remainder = balls % 6;

return overs + "." + remainder;

}


function renderMatch(match){

const info = match.info;

document.getElementById("title").textContent =
info.teams.join(" vs ");

document.getElementById("info").textContent =
new Date(info.dates[0]).toLocaleDateString("en-GB")
+ " • " + (info.venue || "");

if(info.outcome?.winner){

let text = info.outcome.winner + " won";

if(info.outcome.by?.runs)
text += " by " + info.outcome.by.runs + " runs";

else if(info.outcome.by?.wickets)
text += " by " + info.outcome.by.wickets + " wickets";

document.getElementById("result").textContent=text;

}

const container = document.getElementById("innings");

container.innerHTML="";


match.innings.forEach(inn=>{

let batterStats={};
let bowlerStats={};

let runs=0;
let wkts=0;
let legalBalls=0;


inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

runs += d.runs.total;

const batter=d.batter;
const bowler=d.bowler;

const isWide = d.extras?.wides;
const isNoBall = d.extras?.noballs;

/* ONLY legal balls count */

if(!isWide && !isNoBall){

legalBalls++;

}

/* Batter stats */

if(!batterStats[batter])
batterStats[batter]={runs:0,balls:0};

batterStats[batter].runs+=d.runs.batter;

if(!isWide)
batterStats[batter].balls++;


/* Bowler stats */

if(!bowlerStats[bowler])
bowlerStats[bowler]={balls:0,runs:0,wkts:0};

if(!isWide && !isNoBall)
bowlerStats[bowler].balls++;

bowlerStats[bowler].runs+=d.runs.total;


if(d.wickets){

wkts+=d.wickets.length;
bowlerStats[bowler].wkts+=d.wickets.length;

}

});

});


const oversText = ballsToOvers(legalBalls);


let html=`
<div class="innings">

<h2>${inn.team} — ${runs}/${wkts} (${oversText})</h2>

<table>
<tr>
<th>Batter</th>
<th class="right">R</th>
<th class="right">B</th>
<th class="right">SR</th>
</tr>
`;


Object.entries(batterStats).forEach(([name,s])=>{

const sr=s.balls?((s.runs/s.balls)*100).toFixed(1):"-";

html+=`
<tr>
<td>${name}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.balls}</td>
<td class="right">${sr}</td>
</tr>
`;

});


html+=`</table><br>`;


html+=`
<table>
<tr>
<th>Bowler</th>
<th class="right">O</th>
<th class="right">R</th>
<th class="right">W</th>
<th class="right">Econ</th>
</tr>
`;


Object.entries(bowlerStats).forEach(([name,s])=>{

const overs = ballsToOvers(s.balls);

const econ = s.balls
? (s.runs/(s.balls/6)).toFixed(2)
: "-";

html+=`
<tr>
<td>${name}</td>
<td class="right">${overs}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.wkts}</td>
<td class="right">${econ}</td>
</tr>
`;

});


html+=`</table></div>`;

container.innerHTML+=html;

});

}

</script>

</body>
</html>
