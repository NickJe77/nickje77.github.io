<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:28px;
border-radius:0 0 16px 16px;
}

.hero h1{
margin:0;
font-size:32px;
}

.hero p{
margin:6px 0 0;
opacity:.9;
}

/* SUMMARY BOXES */

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:16px;
padding:20px;
}

.summary-box{
background:#e7e7ec;
padding:14px;
border-radius:10px;
}

.summary-box strong{
display:block;
margin-bottom:4px;
}

/* INNINGS */

.innings{
margin:20px;
}

.innings h2{
margin-bottom:6px;
}

.score{
font-weight:700;
margin-bottom:12px;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
background:white;
margin-bottom:16px;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

th{
background:#eef1f6;
text-align:left;
}

.right{
text-align:right;
}

</style>
</head>

<body>

<div class="navbar">

<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>

</div>

<div class="hero">

<h1>T20 World Cup Match</h1>
<p id="heroStatus">Loading match...</p>

</div>

<div id="summary" class="summary"></div>

<div id="inningsContainer"></div>


<script>

const BASE="/data/t20-world-cup/matches/";

const params=new URLSearchParams(location.search);

const file=params.get("file");
const matchIndex=parseInt(params.get("match"));

if(!file || isNaN(matchIndex)){

document.getElementById("heroStatus").innerText="Invalid match link";
throw "";

}

init();


async function init(){

const season=await fetch(BASE+file).then(r=>r.json());

const match=season[matchIndex];

renderMatch(match);

}


/* MATCH */

function renderMatch(match){

const info=match.info;

let winner="";
let result="";

if(info.outcome?.winner){

winner=info.outcome.winner;

if(info.outcome.by?.runs)
result=`won by ${info.outcome.by.runs} runs`;

else if(info.outcome.by?.wickets)
result=`won by ${info.outcome.by.wickets} wickets`;

}

document.getElementById("heroStatus").innerText="Match loaded";


/* SUMMARY */

document.getElementById("summary").innerHTML=`

<div class="summary-box">
<strong>Date</strong>
${formatDate(info.dates[0])}
</div>

<div class="summary-box">
<strong>Teams</strong>
${info.teams.join(" vs ")}
</div>

<div class="summary-box">
<strong>Venue</strong>
${info.venue}
</div>

<div class="summary-box">
<strong>Winner</strong>
${winner}
</div>

<div class="summary-box">
<strong>Result</strong>
${result}
</div>

`;


/* INNINGS */

const container=document.getElementById("inningsContainer");

container.innerHTML="";

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

renderInnings(container,inn);

});

}


/* INNINGS */

function renderInnings(container,inn){

let batterStats={};
let bowlerStats={};
let dismissals={};

let runs=0;
let wkts=0;
let balls=0;


inn.overs.forEach(over=>{

over.deliveries.forEach(d=>{

runs+=d.runs.total;

if(!d.extras?.wides && !d.extras?.noballs)
balls++;

const batter=d.batter;

if(!batterStats[batter])
batterStats[batter]={runs:0,balls:0};

batterStats[batter].runs+=d.runs.batter;

if(!d.extras?.wides)
batterStats[batter].balls++;

const bowler=d.bowler;

if(!bowlerStats[bowler])
bowlerStats[bowler]={balls:0,runs:0,wkts:0};

if(!d.extras?.wides && !d.extras?.noballs)
bowlerStats[bowler].balls++;

bowlerStats[bowler].runs+=d.runs.total;


d.wickets?.forEach(w=>{

wkts++;

bowlerStats[bowler].wkts++;

dismissals[w.player_out]=formatDismissal(w);

});

});

});


const overs=formatOvers(balls);


/* CREATE */

const div=document.createElement("div");

div.className="innings";

div.innerHTML=`

<h2>${inn.team} Innings</h2>

<div class="score">${runs}/${wkts} (${overs} overs)</div>

<strong>Batting</strong>

<table>

<tr>
<th>Batter</th>
<th>How out</th>
<th class="right">R</th>
<th class="right">B</th>
<th class="right">SR</th>
</tr>

${Object.entries(batterStats).map(([name,s])=>`

<tr>
<td>${name}</td>
<td>${dismissals[name]||"not out"}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.balls}</td>
<td class="right">${calcSR(s)}</td>
</tr>

`).join("")}

</table>


<strong>Bowling</strong>

<table>

<tr>
<th>Bowler</th>
<th class="right">O</th>
<th class="right">R</th>
<th class="right">W</th>
</tr>

${Object.entries(bowlerStats).map(([name,s])=>`

<tr>
<td>${name}</td>
<td class="right">${formatOvers(s.balls)}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.wkts}</td>
</tr>

`).join("")}

</table>

`;

container.appendChild(div);

}


/* HELPERS */

function calcSR(s){

return s.balls?((s.runs/s.balls)*100).toFixed(1):"-";

}

function formatOvers(balls){

return Math.floor(balls/6)+"."+(balls%6);

}

function formatDate(d){

return new Date(d).toLocaleDateString("en-GB",{
day:"2-digit",
month:"short",
year:"numeric"
});

}

function formatDismissal(w){

if(w.kind==="bowled")
return `b ${w.fielders?.[0]?.name || ""}`;

if(w.kind==="caught")
return `c ${w.fielders?.[0]?.name || ""}`;

if(w.kind==="lbw")
return "lbw";

if(w.kind==="run out")
return `run out (${w.fielders?.map(f=>f.name).join("/")})`;

return w.kind;

}

</script>

</body>
</html>
