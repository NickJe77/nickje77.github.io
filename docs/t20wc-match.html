<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 World Cup Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#f3f4f7;
}

.navbar{
display:flex;
justify-content:center;
gap:28px;
padding:18px;
background:white;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
}

.hero{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:28px;
border-radius:0 0 16px 16px;
}

.hero h1{
margin:0;
font-size:32px;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:16px;
padding:20px;
}

.summary-box{
background:#e7e7ec;
padding:14px;
border-radius:10px;
}

.innings-block{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
margin:20px;
}

.innings-header{
background:linear-gradient(90deg,#6a040f,#d00000);
color:white;
padding:12px 16px;
font-weight:700;
}

.innings-content{
padding:16px;
}

.score{
font-weight:700;
margin-bottom:14px;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:18px;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

th{
background:#eef1f6;
}

.right{
text-align:right;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="cricket.html">Cricket</a>
<a href="t20-world-cup.html">T20 World Cup</a>
</div>

<div class="hero">
<h1>T20 World Cup Match</h1>
<p id="heroStatus">Loading match...</p>
</div>

<div id="summary" class="summary"></div>
<div id="inningsContainer"></div>

<script>

const BASE="/data/t20-world-cup/matches/";

const params=new URLSearchParams(location.search);

const file=params.get("file");
const matchIndex=parseInt(params.get("match"));

const heroStatus=document.getElementById("heroStatus");

if(!file){
heroStatus.innerText="Missing file parameter";
throw new Error("Missing file param");
}

if(isNaN(matchIndex)){
heroStatus.innerText="Missing match parameter";
throw new Error("Missing match param");
}

init();

async function init(){

try{

heroStatus.innerText="Loading file...";

const response=await fetch(BASE+file);

if(!response.ok){
throw new Error("File not found: "+file);
}

const season=await response.json();

heroStatus.innerText="Loading match...";

if(!season[matchIndex]){
throw new Error("Match index not found");
}

renderMatch(season[matchIndex]);

heroStatus.innerText="Match loaded";

}
catch(err){

console.error(err);

heroStatus.innerText="Error loading match: "+err.message;

}

}


/* RENDER MATCH */

function renderMatch(match){

const info=match.info;

let winner="";
let result="";

if(info.outcome?.winner){

winner=info.outcome.winner;

if(info.outcome.by?.runs)
result=`won by ${info.outcome.by.runs} runs`;

else if(info.outcome.by?.wickets)
result=`won by ${info.outcome.by.wickets} wickets`;

}

document.getElementById("summary").innerHTML=`

<div class="summary-box">
<strong>Date</strong>
${formatDate(info.dates?.[0])}
</div>

<div class="summary-box">
<strong>Teams</strong>
${info.teams.join(" vs ")}
</div>

<div class="summary-box">
<strong>Venue</strong>
${info.venue || ""}
</div>

<div class="summary-box">
<strong>Winner</strong>
${winner}
</div>

<div class="summary-box">
<strong>Result</strong>
${result}
</div>

`;

const container=document.getElementById("inningsContainer");

container.innerHTML="";

match.innings.forEach(raw=>{

const inn=raw.team?raw:Object.values(raw)[0];

renderInnings(container,inn);

});

}


/* RENDER INNINGS */

function renderInnings(container,inn){

let batterStats={};
let bowlerStats={};
let dismissals={};

let runs=0;
let wkts=0;
let balls=0;

inn.overs?.forEach(over=>{

over.deliveries.forEach(d=>{

runs+=d.runs.total;

if(!d.extras?.wides && !d.extras?.noballs)
balls++;

const batter=d.batter;

if(!batterStats[batter])
batterStats[batter]={runs:0,balls:0};

batterStats[batter].runs+=d.runs.batter;

if(!d.extras?.wides)
batterStats[batter].balls++;

const bowler=d.bowler;

if(!bowlerStats[bowler])
bowlerStats[bowler]={balls:0,runs:0,wkts:0};

if(!d.extras?.wides && !d.extras?.noballs)
bowlerStats[bowler].balls++;

bowlerStats[bowler].runs+=d.runs.total;

d.wickets?.forEach(w=>{

wkts++;

bowlerStats[bowler].wkts++;

dismissals[w.player_out]=formatDismissal(w,bowler);

});

});

});

const overs=formatOvers(balls);

const div=document.createElement("div");

div.className="innings-block";

div.innerHTML=`

<div class="innings-header">
${inn.team} Innings
</div>

<div class="innings-content">

<div class="score">
${runs}/${wkts} (${overs} overs)
</div>

<strong>Batting</strong>

<table>
<tr>
<th>Batter</th>
<th>How out</th>
<th class="right">R</th>
<th class="right">B</th>
<th class="right">SR</th>
</tr>

${Object.entries(batterStats).map(([name,s])=>`
<tr>
<td>${name}</td>
<td>${dismissals[name]||"not out"}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.balls}</td>
<td class="right">${calcSR(s)}</td>
</tr>
`).join("")}

</table>

<strong>Bowling</strong>

<table>
<tr>
<th>Bowler</th>
<th class="right">O</th>
<th class="right">R</th>
<th class="right">W</th>
</tr>

${Object.entries(bowlerStats).map(([name,s])=>`
<tr>
<td>${name}</td>
<td class="right">${formatOvers(s.balls)}</td>
<td class="right">${s.runs}</td>
<td class="right">${s.wkts}</td>
</tr>
`).join("")}

</table>

</div>
`;

container.appendChild(div);

}


/* HELPERS */

function calcSR(s){
return s.balls?((s.runs/s.balls)*100).toFixed(1):"-";
}

function formatOvers(balls){
return Math.floor(balls/6)+"."+(balls%6);
}

function formatDate(d){
if(!d) return "";
return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

function formatDismissal(w,bowler){

const fielders=w.fielders?.map(f=>f.name).join("/");

switch(w.kind){

case "bowled": return `b ${bowler}`;
case "caught": return `c ${fielders} b ${bowler}`;
case "lbw": return `lbw b ${bowler}`;
case "stumped": return `st ${fielders} b ${bowler}`;
case "run out": return `run out (${fielders})`;
case "caught and bowled": return `c & b ${bowler}`;
default: return w.kind;

}

}

</script>

</body>
</html>
