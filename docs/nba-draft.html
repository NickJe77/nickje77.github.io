<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Draft | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#fff;
color:#1f2937;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:700;
background:#fff;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.navbar a:hover{
text-decoration:underline;
}

.page-wrap{
max-width:1400px;
margin:0 auto;
padding:30px 20px 60px;
}

.hero{
background:linear-gradient(90deg,#17408B,#C9082A);
color:white;
border-radius:16px;
padding:26px 26px 22px;
margin-bottom:25px;
text-align:center;
box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.hero h1{
margin:0 0 6px;
font-size:32px;
}

.subtitle{
opacity:.9;
font-size:15px;
}

.controls{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:20px;
}

select,input{
padding:9px 12px;
border-radius:10px;
border:1px solid #d1d5db;
font-size:14px;
min-width:160px;
}

input{
min-width:260px;
}

.table-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
overflow:hidden;
box-shadow:0 6px 16px rgba(0,0,0,0.05);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border-bottom:1px solid #e5e7eb;
padding:10px 12px;
text-align:left;
}

th{
background:#17408B;
color:white;
font-size:14px;
font-weight:700;
}

tr:nth-child(even){
background:#f8faff;
}

tr:hover{
background:#e9f0ff;
}

.player-link{
color:#0056d6;
text-decoration:none;
font-weight:700;
}

.small{
color:#666;
font-size:13px;
}

.team-cell{
display:flex;
align-items:center;
gap:8px;
}

.team-colour{
width:16px;
height:16px;
border-radius:3px;
border:1px solid #bbb;
}

.num{
text-align:right;
white-space:nowrap;
}

.center{
text-align:center;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Draft</h1>
<div class="subtitle">Complete draft history by year</div>
</div>

<div class="controls">
<select id="yearSelect"></select>
<input id="q" placeholder="Filter (player, team, college)…">
</div>

<div class="table-card">
<table>
<thead>
<tr>
<th>Pick</th>
<th>Round</th>
<th>Player</th>
<th class="small">Team</th>
<th class="small">College / From</th>
<th class="small num">Games</th>
<th class="small num">PTS</th>
<th class="small num">PPG</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

</div>

<script>
const yearSelect = document.getElementById("yearSelect");
const q = document.getElementById("q");
const rows = document.getElementById("rows");

let currentData = [];
const statsCache = {};

function slug(name){
  return name.toLowerCase().replace(/[^\w\s-]/g,"").replace(/\s+/g,"-");
}

async function getPlayerStats(name){
  const key = slug(name);
  if(statsCache[key]) return statsCache[key];

  try{
    const res = await fetch(`data/nba/players/${key}.json`);
    const data = await res.json();

    let games = 0;
    let points = 0;

    if(Array.isArray(data.games)){
      games = data.games.length;

      for(const g of data.games){
        const pts = g.points ?? g.pts ?? g.PTS ?? 0;
        points += Number(pts) || 0;
      }
    }

    else if(data.totals){
      games = data.totals.games || 0;
      points = data.totals.points || 0;
    }

    const ppg = games ? (points / games).toFixed(1) : "";

    const stats = { games, points, ppg };
    statsCache[key] = stats;
    return stats;

  }catch(e){
    return { games:"", points:"", ppg:"" };
  }
}

function loadYears(){
  const years = [];
  for(let y=1976; y<=2025; y++) years.push(y);

  yearSelect.innerHTML = years.reverse()
    .map(y=>`<option value="${y}">${y}</option>`)
    .join("");

  loadYear(yearSelect.value);
}

async function loadYear(year){
  rows.innerHTML = "<tr><td colspan='8'>Loading...</td></tr>";

  try{
    const res = await fetch(`data/nba/draft/${year}.json`);
    currentData = await res.json();
    render();
  }catch{
    rows.innerHTML = "<tr><td colspan='8'>Unable to load data</td></tr>";
  }
}

async function render(){
  const term = q.value.toLowerCase();

  const filtered = currentData.filter(p =>
    (p.player||"").toLowerCase().includes(term) ||
    (p.team||"").toLowerCase().includes(term) ||
    (p.college||"").toLowerCase().includes(term)
  );

  const html = await Promise.all(filtered.map(async p=>{
    const stats = await getPlayerStats(p.player);

    return `
<tr>
<td class="center">${p.pick ?? ""}</td>
<td class="center">${p.round ?? ""}</td>
<td><a class="player-link" href="nba-player.html?player=${encodeURIComponent(p.player)}">${p.player}</a></td>
<td>${p.team}</td>
<td>${p.college ?? ""}</td>
<td class="num">${stats.games}</td>
<td class="num">${stats.points}</td>
<td class="num">${stats.ppg}</td>
</tr>`;
  }));

  rows.innerHTML = html.join("") || "<tr><td colspan='8'>No results</td></tr>";
}

yearSelect.addEventListener("change", ()=>loadYear(yearSelect.value));
q.addEventListener("input", render);

loadYears();
</script>

</body>
</html>
