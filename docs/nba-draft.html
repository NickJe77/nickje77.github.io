<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Draft | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1300px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:34px 20px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,5vw,38px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.controls{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
select,input{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);
}
select{cursor:pointer;}
input{min-width:240px;}
select:hover,input:hover{border-color:var(--faint);}
select:focus,input:focus{outline:none;border-color:var(--accent);}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);font-size:11px;padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  border-bottom:1px solid var(--line);
}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
td:nth-child(1),td:nth-child(2){width:60px;text-align:center;font-weight:700;color:var(--ink);}
.player-link{color:var(--ink);font-weight:700;text-decoration:none;}
.player-link:hover{color:var(--accent);}
.loading{text-align:center;padding:40px;color:var(--muted);font-style:italic;}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div class="page-wrap">
  <div class="hero">
    <span class="eyebrow">NBA</span>
    <h1>NBA Draft</h1>
  </div>
  <div class="controls">
    <select id="yearSelect"></select>
    <input id="q" placeholder="Search player, team, college">
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Pick</th>
          <th>Rnd</th>
          <th>Player</th>
          <th>Team</th>
          <th>College</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const R2         = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
const rows       = document.getElementById("rows");
const yearSelect = document.getElementById("yearSelect");
const q          = document.getElementById("q");
let data         = [];
let playerIndex  = [];

function fixName(str){
  if(!str) return str;
  try{
    const bytes = new Uint8Array(str.length);
    for(let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const decoded = new TextDecoder('utf-8').decode(bytes);
    if(decoded.includes('\ufffd')) return str;
    return decoded;
  }catch(e){ return str; }
}

// Load player index for name matching
fetch(`${R2}/basketball/players/index.json`)
  .then(r => r.json())
  .then(idx => { playerIndex = idx; })
  .catch(() => {});

function findPlayerId(name){
  if(!name || !playerIndex.length) return null;
  const needle = name.toLowerCase().trim();
  const match  = playerIndex.find(p => (p.name || "").toLowerCase().trim() === needle);
  return match ? match.id : null;
}

for(let y = 2025; y >= 1975; y--){
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = y;
  yearSelect.appendChild(opt);
}

async function loadYear(year){
  rows.innerHTML = `<tr><td colspan="5" class="loading">Loading ${year} draft...</td></tr>`;
  q.value = "";
  try{
    const res = await fetch(`/data/basketball/nba_draft/${year}.json`);
    if(!res.ok) throw new Error("Not found");
    const json = await res.json();
    if(Array.isArray(json))    data = json;
    else if(json.players)      data = json.players;
    else if(json.picks)        data = json.picks;
    else data = [];
    render();
  }catch(e){
    rows.innerHTML = `<tr><td colspan="5" class="loading">Draft data not available for ${year}.</td></tr>`;
  }
}

function render(){
  const filter = q.value.toLowerCase();
  const filtered = filter
    ? data.filter(p =>
        (p.player  || "").toLowerCase().includes(filter) ||
        (p.team    || "").toLowerCase().includes(filter) ||
        (p.college || "").toLowerCase().includes(filter)
      )
    : data;

  if(!filtered.length){
    rows.innerHTML = `<tr><td colspan="5" class="loading">No results found.</td></tr>`;
    return;
  }

  rows.innerHTML = filtered.map(p => {
    const name     = fixName(p.player || "");
    const pid      = p.player_id || findPlayerId(p.player);
    const nameCell = pid
      ? `<a class="player-link" href="/nba-player.html?id=${encodeURIComponent(pid)}">${name}</a>`
      : name;
    return `
      <tr>
        <td>${p.pick || ""}</td>
        <td>${p.round || ""}</td>
        <td>${nameCell}</td>
        <td>${p.team || ""}</td>
        <td>${p.college || ""}</td>
      </tr>
    `;
  }).join("");
}

yearSelect.onchange = () => loadYear(yearSelect.value);
q.oninput = render;

loadYear(2025);
</script>
</body>
</html>
