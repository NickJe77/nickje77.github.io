<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Draft | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;color:#1f2937;}
.navbar{display:flex;justify-content:center;gap:28px;padding:18px 0;border-bottom:1px solid #ddd;background:#fff;font-weight:700;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}
.page-wrap{max-width:1300px;margin:0 auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(90deg,#17408B,#C9082A);color:#fff;padding:34px 20px;border-radius:16px;text-align:center;margin-bottom:24px;}
.hero h1{margin:0;font-size:34px;}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:20px;}
select,input{padding:10px 14px;border-radius:10px;border:1px solid #d1d5db;font-size:14px;background:#fff;}
input{min-width:240px;}
.table-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.05);}
table{width:100%;border-collapse:collapse;}
th{background:#17408B;color:#fff;font-size:13px;padding:12px 10px;text-align:left;}
td{padding:12px 10px;border-bottom:1px solid #e5e7eb;font-size:14px;}
tr:nth-child(even){background:#f8fbff;}
tbody tr:hover{background:#eaf2ff;}
td:nth-child(1),td:nth-child(2){width:60px;text-align:center;font-weight:600;}
.player-link{color:#1d4ed8;font-weight:700;text-decoration:none;}
.player-link:hover{text-decoration:underline;}
.loading{text-align:center;padding:40px;color:#666;}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div class="page-wrap">
  <div class="hero">
    <h1>NBA Draft</h1>
  </div>
  <div class="controls">
    <select id="yearSelect"></select>
    <input id="q" placeholder="Search player, team, college">
  </div>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Pick</th>
          <th>Rnd</th>
          <th>Player</th>
          <th>Team</th>
          <th>College</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const R2         = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
const rows       = document.getElementById("rows");
const yearSelect = document.getElementById("yearSelect");
const q          = document.getElementById("q");
let data         = [];
let playerIndex  = [];

function fixName(str){
  if(!str) return str;
  try{
    const bytes = new Uint8Array(str.length);
    for(let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const decoded = new TextDecoder('utf-8').decode(bytes);
    if(decoded.includes('\ufffd')) return str;
    return decoded;
  }catch(e){ return str; }
}

// Load player index for name matching
fetch(`${R2}/basketball/players/index.json`)
  .then(r => r.json())
  .then(idx => { playerIndex = idx; })
  .catch(() => {});

function findPlayerId(name){
  if(!name || !playerIndex.length) return null;
  const needle = name.toLowerCase().trim();
  const match  = playerIndex.find(p => (p.name || "").toLowerCase().trim() === needle);
  return match ? match.id : null;
}

for(let y = 2025; y >= 1975; y--){
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = y;
  yearSelect.appendChild(opt);
}

async function loadYear(year){
  rows.innerHTML = `<tr><td colspan="5" class="loading">Loading ${year} draft...</td></tr>`;
  q.value = "";
  try{
    const res = await fetch(`/data/basketball/nba_draft/${year}.json`);
    if(!res.ok) throw new Error("Not found");
    const json = await res.json();
    if(Array.isArray(json))    data = json;
    else if(json.players)      data = json.players;
    else if(json.picks)        data = json.picks;
    else data = [];
    render();
  }catch(e){
    rows.innerHTML = `<tr><td colspan="5" class="loading">Draft data not available for ${year}.</td></tr>`;
  }
}

function render(){
  const filter = q.value.toLowerCase();
  const filtered = filter
    ? data.filter(p =>
        (p.player  || "").toLowerCase().includes(filter) ||
        (p.team    || "").toLowerCase().includes(filter) ||
        (p.college || "").toLowerCase().includes(filter)
      )
    : data;

  if(!filtered.length){
    rows.innerHTML = `<tr><td colspan="5" class="loading">No results found.</td></tr>`;
    return;
  }

  rows.innerHTML = filtered.map(p => {
    const name     = fixName(p.player || "");
    const pid      = p.player_id || findPlayerId(p.player);
    const nameCell = pid
      ? `<a class="player-link" href="/nba-player.html?id=${encodeURIComponent(pid)}">${name}</a>`
      : name;
    return `
      <tr>
        <td>${p.pick || ""}</td>
        <td>${p.round || ""}</td>
        <td>${nameCell}</td>
        <td>${p.team || ""}</td>
        <td>${p.college || ""}</td>
      </tr>
    `;
  }).join("");
}

yearSelect.onchange = () => loadYear(yearSelect.value);
q.oninput = render;

loadYear(2025);
</script>
</body>
</html>
