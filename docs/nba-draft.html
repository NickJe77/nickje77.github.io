<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Draft | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,Arial;margin:0;background:#fff;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;border-bottom:1px solid #ddd;font-weight:700;}
.navbar a{color:#0056d6;text-decoration:none;}
.page-wrap{max-width:1200px;margin:auto;padding:30px;}

.hero{background:linear-gradient(90deg,#17408B,#C9082A);color:#fff;padding:24px;border-radius:12px;text-align:center;margin-bottom:20px;}

.controls{display:flex;justify-content:center;gap:10px;margin-bottom:15px;}

table{width:100%;border-collapse:collapse;}
th,td{padding:10px;border-bottom:1px solid #ddd;}
th{background:#17408B;color:#fff;font-size:13px;}
tr:nth-child(even){background:#f5f8ff;}

.player-link{color:#0056d6;font-weight:700;text-decoration:none;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Draft</h1>
</div>

<div class="controls">
<select id="yearSelect"></select>
<input id="q" placeholder="Search player, team, college">
</div>

<table>
<thead>
<tr>
<th>Pick</th>
<th>Rnd</th>
<th>Player</th>
<th>Team</th>
<th>College</th>
</tr>
</thead>

<tbody id="rows"></tbody>
</table>

</div>

<script>

const rows = document.getElementById("rows");
const yearSelect = document.getElementById("yearSelect");
const q = document.getElementById("q");

let data = [];

function buildYears(){
let years=[];
for(let y=1976;y<=2025;y++) years.push(y);
yearSelect.innerHTML = years.reverse().map(y=>`<option>${y}</option>`).join("");
}

async function loadYear(year){

try{
let res = await fetch(`data/nba/draft/${year}.json`);
let json = await res.json();

// handle structure safely
if(Array.isArray(json)) data = json;
else if(json.players) data = json.players;
else if(json.picks) data = json.picks;
else data = [];

render();

}catch(e){
console.error(e);
rows.innerHTML = "<tr><td colspan='5'>Error loading</td></tr>";
}
}

function render(){

let f = q.value.toLowerCase();

let filtered = data.filter(p=>{
return (
(p.player||"").toLowerCase().includes(f) ||
(p.team||"").toLowerCase().includes(f) ||
(p.college||"").toLowerCase().includes(f)
);
});

rows.innerHTML = filtered.map(p=>`

<tr>

<td>${p.pick || ""}</td>
<td>${p.round || ""}</td>

<td>
<a class="player-link" href="nba-player.html?player=${encodeURIComponent(p.player)}">
${p.player || ""}
</a>
</td>

<td>${p.team || ""}</td>
<td>${p.college || ""}</td>

</tr>

`).join("");

}

yearSelect.onchange = ()=>loadYear(yearSelect.value);
q.oninput = render;

buildYears();
loadYear(2025);

</script>

</body>
</html>
