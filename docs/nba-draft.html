<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Draft | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Inter,system-ui,Arial,sans-serif;
  margin:0;
  background:#fff;
}
.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}
.page-wrap{
  max-width:1400px;
  margin:0 auto;
  padding:30px 20px 60px;
}
h1{text-align:center;margin:0 0 10px;}
p{text-align:center;color:#555;margin:0 0 18px;}
.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:0 0 18px;
}
select,input{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid #ddd;
  padding:8px 10px;
  text-align:left;
  vertical-align:middle;
}
th{background:#f0f0f0;}
tr:nth-child(even){background:#f6f9ff;}
.player-link{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}
.player-link:hover{text-decoration:underline;}
.small{color:#666;font-size:13px;}
.team-cell{
  display:flex;
  align-items:center;
  gap:8px;
}
.team-colour{
  width:16px;
  height:16px;
  border-radius:3px;
  border:1px solid #bbb;
  flex:0 0 16px;
}
.num{
  text-align:right;
  white-space:nowrap;
}
.center{
  text-align:center;
}
@media(max-width:1000px){
  table{font-size:13px;}
  th,td{padding:7px 8px;}
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>

<div class="page-wrap">
  <h1>NBA Draft</h1>
  <p>Complete draft history by year.</p>

  <div class="controls">
    <select id="yearSelect"></select>
    <input id="q" placeholder="Filter (player, team, college)…">
  </div>

  <table>
    <thead>
      <tr>
        <th>Pick</th>
        <th>Round</th>
        <th>Player</th>
        <th class="small">Team</th>
        <th class="small">College / From</th>
        <th class="small num">Games</th>
        <th class="small num">PTS</th>
        <th class="small num">PPG</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
const yearSelect = document.getElementById("yearSelect");
const q = document.getElementById("q");
const rows = document.getElementById("rows");

let currentData = [];
const statsCache = {};

/* ---------- TEAM NAMES ---------- */

const teamNames = {
  ATL:"Atlanta Hawks",

  BOS:"Boston Celtics",

  BKN:"Brooklyn Nets",
  BRK:"Brooklyn Nets",

  CHA:"Charlotte Hornets",
  CHO:"Charlotte Hornets",

  CHI:"Chicago Bulls",

  CLE:"Cleveland Cavaliers",

  DAL:"Dallas Mavericks",

  DEN:"Denver Nuggets",

  DET:"Detroit Pistons",

  GSW:"Golden State Warriors",

  HOU:"Houston Rockets",

  IND:"Indiana Pacers",

  LAC:"Los Angeles Clippers",

  LAL:"Los Angeles Lakers",

  MEM:"Memphis Grizzlies",

  MIA:"Miami Heat",

  MIL:"Milwaukee Bucks",

  MIN:"Minnesota Timberwolves",

  NOP:"New Orleans Pelicans",
  NOH:"New Orleans Hornets",
  NOK:"New Orleans/Oklahoma City Hornets",

  NYK:"New York Knicks",

  OKC:"Oklahoma City Thunder",
  SEA:"Seattle SuperSonics",

  ORL:"Orlando Magic",

  PHI:"Philadelphia 76ers",

  PHX:"Phoenix Suns",
  PHO:"Phoenix Suns",

  POR:"Portland Trail Blazers",

  SAC:"Sacramento Kings",

  SAS:"San Antonio Spurs",

  TOR:"Toronto Raptors",

  UTA:"Utah Jazz",

  WAS:"Washington Wizards",
  WSB:"Washington Bullets"
};

/* ---------- TEAM COLOURS ---------- */

const teamColours = {
  "Atlanta Hawks":"#E03A3E",
  "Boston Celtics":"#007A33",
  "Brooklyn Nets":"#000000",
  "Charlotte Hornets":"#1D1160",
  "Chicago Bulls":"#CE1141",
  "Cleveland Cavaliers":"#860038",
  "Dallas Mavericks":"#00538C",
  "Denver Nuggets":"#0E2240",
  "Detroit Pistons":"#C8102E",
  "Golden State Warriors":"#1D428A",
  "Houston Rockets":"#CE1141",
  "Indiana Pacers":"#002D62",
  "Los Angeles Clippers":"#C8102E",
  "Los Angeles Lakers":"#552583",
  "Memphis Grizzlies":"#5D76A9",
  "Miami Heat":"#98002E",
  "Milwaukee Bucks":"#00471B",
  "Minnesota Timberwolves":"#0C2340",
  "New Orleans Pelicans":"#0C2340",
  "New Orleans Hornets":"#00788C",
  "New Orleans/Oklahoma City Hornets":"#00788C",
  "New York Knicks":"#006BB6",
  "Oklahoma City Thunder":"#007AC1",
  "Orlando Magic":"#0077C0",
  "Philadelphia 76ers":"#006BB6",
  "Phoenix Suns":"#1D1160",
  "Portland Trail Blazers":"#E03A3E",
  "Sacramento Kings":"#5A2D81",
  "San Antonio Spurs":"#C4CED4",
  "Toronto Raptors":"#CE1141",
  "Utah Jazz":"#002B5C",
  "Washington Wizards":"#002B5C",
  "Washington Bullets":"#E31837",
  "Seattle SuperSonics":"#2C5234"
};

/* ---------- YEARS ---------- */

const START_YEAR = 1976;
const END_YEAR = new Date().getFullYear();

for(let y = END_YEAR; y >= START_YEAR; y--){
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = y;
  if(y === END_YEAR) opt.selected = true;
  yearSelect.appendChild(opt);
}

/* ---------- HELPERS ---------- */

function fullTeam(team){
  if(!team) return "";
  return teamNames[team] || team;
}

function cleanName(name){
  return (name || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

function slug(name){
  return cleanName(name)
    .toLowerCase()
    .replace(/[^\w\s-]/g,"")
    .replace(/\s+/g,"-");
}

function formatNumber(n){
  return Number(n || 0).toLocaleString("en-US");
}

function defaultStats(){
  return {
    games: 0,
    pts: 0,
    ppg: "0.0"
  };
}

function computeCareerStats(playerData){
  if(!playerData) return defaultStats();

  let games = 0;
  let pts = 0;

  if(playerData.teams && typeof playerData.teams === "object"){
    Object.values(playerData.teams).forEach(t=>{
      games += Number(t.games || 0);
      pts += Number(t.pts || 0);
    });
  } else if(Array.isArray(playerData.games)){
    playerData.games.forEach(g=>{
      games += 1;
      pts += Number(g.pts || 0);
    });
  }

  return {
    games,
    pts,
    ppg: games ? (pts / games).toFixed(1) : "0.0"
  };
}

async function getPlayerStats(playerName){
  if(!playerName) return defaultStats();

  const key = slug(playerName);

  if(statsCache[key]) return statsCache[key];

  try{
    const res = await fetch(`data/nba/players/${key}.json`);
    if(!res.ok) throw new Error("Player file not found");
    const data = await res.json();
    const stats = computeCareerStats(data);
    statsCache[key] = stats;
    return stats;
  }catch(e){
    const stats = defaultStats();
    statsCache[key] = stats;
    return stats;
  }
}

/* ---------- EVENTS ---------- */

yearSelect.addEventListener("change", loadYear);
q.addEventListener("input", render);

loadYear();

/* ---------- LOAD YEAR ---------- */

function loadYear(){
  const year = yearSelect.value;
  rows.innerHTML = "<tr><td colspan='8'>Loading...</td></tr>";

  fetch(`data/nba/draft/${year}.json`)
    .then(r=>{
      if(!r.ok) throw new Error();
      return r.json();
    })
    .then(async data=>{
      currentData = Array.isArray(data) ? data : [];
      await preloadPlayerStats(currentData);
      render();
    })
    .catch(()=>{
      currentData = [];
      rows.innerHTML = "<tr><td colspan='8'>No data for this year.</td></tr>";
    });
}

async function preloadPlayerStats(data){
  const names = data
    .map(p=>p.player)
    .filter(Boolean);

  await Promise.all(names.map(name=>getPlayerStats(name)));
}

/* ---------- RENDER ---------- */

function render(){
  const needle = (q.value || "").toLowerCase().trim();
  rows.innerHTML = "";

  if(!currentData.length){
    rows.innerHTML = "<tr><td colspan='8'>No data.</td></tr>";
    return;
  }

  currentData.forEach(pick=>{
    const teamFull = fullTeam(pick.team);
    const playerStats = statsCache[slug(pick.player || "")] || defaultStats();

    const haystack = [
      pick.player || "",
      teamFull,
      pick.college || "",
      pick.from || "",
      String(playerStats.games),
      String(playerStats.pts),
      String(playerStats.ppg)
    ].join(" ").toLowerCase();

    if(needle && !haystack.includes(needle)) return;

    const playerCell = pick.player
      ? `<a class="player-link" href="nba-player.html?player=${encodeURIComponent(pick.player)}">${pick.player}</a>`
      : "";

    const colour = teamColours[teamFull] || "#ccc";

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${pick.pick ?? ""}</td>
      <td>${pick.round ?? ""}</td>
      <td>${playerCell}</td>
      <td class="small">
        <div class="team-cell">
          <div class="team-colour" style="background:${colour}"></div>
          <span>${teamFull}</span>
        </div>
      </td>
      <td class="small">${pick.college ?? pick.from ?? ""}</td>
      <td class="small num">${formatNumber(playerStats.games)}</td>
      <td class="small num">${formatNumber(playerStats.pts)}</td>
      <td class="small num">${playerStats.ppg}</td>
    `;
    rows.appendChild(tr);
  });

  if(!rows.children.length){
    rows.innerHTML = "<tr><td colspan='8'>No matches.</td></tr>";
  }
}
</script>

</body>
</html>
