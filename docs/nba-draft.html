<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Draft | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#fff;
color:#1f2937;
}

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:700;
background:#fff;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.navbar a:hover{
text-decoration:underline;
}

.page-wrap{
max-width:1400px;
margin:0 auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#17408B,#C9082A);
color:white;
border-radius:16px;
padding:26px 26px 22px;
margin-bottom:25px;
text-align:center;
box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.hero h1{
margin:0 0 6px;
font-size:32px;
}

.subtitle{
opacity:.9;
font-size:15px;
}

/* CONTROLS */

.controls{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:20px;
}

select,input{
padding:9px 12px;
border-radius:10px;
border:1px solid #d1d5db;
font-size:14px;
min-width:160px;
}

input{
min-width:260px;
}

/* TABLE CARD */

.table-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
overflow:hidden;
box-shadow:0 6px 16px rgba(0,0,0,0.05);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border-bottom:1px solid #e5e7eb;
padding:10px 12px;
text-align:left;
}

th{
background:#17408B;
color:white;
font-size:14px;
font-weight:700;
}

td{
font-size:14px;
}

tr:nth-child(even){
background:#f8faff;
}

tr:hover{
background:#e9f0ff;
}

.player-link{
color:#0056d6;
text-decoration:none;
font-weight:700;
}

.player-link:hover{
text-decoration:underline;
}

.small{
color:#666;
font-size:13px;
}

.team-cell{
display:flex;
align-items:center;
gap:8px;
}

.team-colour{
width:16px;
height:16px;
border-radius:3px;
border:1px solid #bbb;
flex:0 0 16px;
}

.num{
text-align:right;
white-space:nowrap;
}

.center{
text-align:center;
}

@media(max-width:1000px){

table{
font-size:13px;
}

th,td{
padding:8px;
}

}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Draft</h1>
<div class="subtitle">Complete draft history by year</div>
</div>

<div class="controls">
<select id="yearSelect"></select>
<input id="q" placeholder="Filter (player, team, college)…">
</div>

<div class="table-card">

<table>

<tr>

<th>Round</th>
<th>Player</th>
<th class="small">Team</th>
<th class="small">College / From</th>
<th class="small num">Games</th>
<th class="small num">PTS</th>
<th class="small num">PPG</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</div>
