<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Draft | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
  color:#1f2937;
}

/* NAV */
.navbar{
  display:flex;
  justify-content:center;
  gap:28px;
  padding:18px 0;
  border-bottom:1px solid #ddd;
  background:#fff;
  font-weight:700;
}
.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}
.navbar a:hover{ text-decoration:underline; }

/* PAGE */
.page-wrap{
  max-width:1300px;
  margin:0 auto;
  padding:30px 20px 60px;
}

/* HERO */
.hero{
  background:linear-gradient(90deg,#17408B,#C9082A);
  color:#fff;
  padding:34px 20px;
  border-radius:16px;
  text-align:center;
  margin-bottom:24px;
}
.hero h1{
  margin:0;
  font-size:34px;
  letter-spacing:.5px;
}

/* CONTROLS */
.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

select, input{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:14px;
  background:#fff;
}

input{
  min-width:240px;
}

select:focus, input:focus{
  outline:none;
  border-color:#17408B;
  box-shadow:0 0 0 2px rgba(23,64,139,0.15);
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
}

/* HEADER */
th{
  background:#17408B;
  color:#fff;
  font-size:13px;
  padding:12px 10px;
  text-align:left;
}

/* ROWS */
td{
  padding:12px 10px;
  border-bottom:1px solid #e5e7eb;
  font-size:14px;
}

/* ZEBRA */
tr:nth-child(even){
  background:#f8fbff;
}

/* HOVER */
tbody tr:hover{
  background:#eaf2ff;
  transition:0.15s;
}

/* ALIGNMENT */
td:nth-child(1),
td:nth-child(2){
  width:60px;
  text-align:center;
  font-weight:600;
}

td:nth-child(3){
  width:260px;
}

td:nth-child(4){
  width:120px;
  font-weight:600;
}

td:nth-child(5){
  color:#374151;
}

/* PLAYER LINK */
.player-link{
  color:#1d4ed8;
  font-weight:700;
  text-decoration:none;
}
.player-link:hover{
  text-decoration:underline;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Draft</h1>
</div>

<div class="controls">
<select id="yearSelect"></select>
<input id="q" placeholder="Search player, team, college">
</div>

<table>
<thead>
<tr>
<th>Pick</th>
<th>Rnd</th>
<th>Player</th>
<th>Team</th>
<th>College</th>
</tr>
</thead>

<tbody id="rows"></tbody>
</table>

</div>

<script>

const rows = document.getElementById("rows");
const yearSelect = document.getElementById("yearSelect");
const q = document.getElementById("q");

let data = [];

function buildYears(){
let years=[];
for(let y=1976;y<=2025;y++) years.push(y);
yearSelect.innerHTML = years.reverse().map(y=>`<option>${y}</option>`).join("");
}

async function loadYear(year){
try{
let res = await fetch(`data/nba/draft/${year}.json`);
let json = await res.json();

if(Array.isArray(json)) data = json;
else if(json.players) data = json.players;
else if(json.picks) data = json.picks;
else data = [];

render();

}catch(e){
rows.innerHTML = "<tr><td colspan='5'>Error loading</td></tr>";
}
}

function render(){

let f = q.value.toLowerCase();

let filtered = data.filter(p=>{
return (
(p.player||"").toLowerCase().includes(f) ||
(p.team||"").toLowerCase().includes(f) ||
(p.college||"").toLowerCase().includes(f)
);
});

rows.innerHTML = filtered.map(p=>`

<tr>
<td>${p.pick || ""}</td>
<td>${p.round || ""}</td>

<td>
<a class="player-link" href="nba-player.html?player=${encodeURIComponent(p.player)}">
${p.player || ""}
</a>
</td>

<td>${p.team || ""}</td>
<td>${p.college || ""}</td>
</tr>

`).join("");

}

yearSelect.onchange = ()=>loadYear(yearSelect.value);
q.oninput = render;

buildYears();
loadYear(2025);

</script>

</body>
</html>
