<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coolmore Stud Stakes | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="./css/racing.css">

<style>
body{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;margin:0;}
.navbar{text-align:center;padding:16px 0;border-bottom:1px solid #ddd;}
.navbar a{margin:0 18px;text-decoration:none;font-size:18px;font-weight:600;color:#0056d6;}

.header-hero{width:100%;height:320px;background:url("./images/coolmore-stud-stakes-header.jpg") center/cover no-repeat;position:relative;}
.header-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.6),rgba(0,0,0,.1));}
.page-title{position:absolute;bottom:30px;left:40px;font-size:42px;font-weight:bold;letter-spacing:2px;color:white;}

.content-wrap{max-width:1200px;margin:auto;padding:40px;}
.intro{max-width:900px;margin:auto;font-size:18px;line-height:1.6;color:#333;margin-bottom:30px;text-align:center;}

.search-wrap{max-width:600px;margin:0 auto 40px;position:relative;}
.search-wrap input{
width:100%;
padding:14px 16px;
font-size:16px;
border-radius:6px;
border:1px solid #ccc;
}

.autocomplete{
position:absolute;
width:100%;
background:#fff;
border:1px solid #ccc;
border-top:none;
z-index:10;
}

.autocomplete div{
padding:10px 14px;
cursor:pointer;
font-size:15px;
}

.autocomplete div:hover{
background:#f2f2f2;
}

.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:900px;margin:auto;}
.tile{position:relative;overflow:hidden;border-radius:10px;cursor:pointer;background:#f2f2f2;box-shadow:0 4px 10px rgba(0,0,0,.08);height:300px;}
.tile img{width:100%;height:100%;object-fit:cover;transition:.4s;}
.tile:hover img{transform:scale(1.05);}
.tile-title{position:absolute;bottom:0;width:100%;padding:12px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);font-size:17px;font-weight:bold;color:white;text-align:center;letter-spacing:1px;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="racing.html">Racing</a>
<a href="afl.html">AFL</a>
<a href="football.html">Football</a>
<a href="cricket.html">Cricket</a>
<a href="f1.html">F1</a>
</div>

<div class="header-hero">
<div class="header-overlay"></div>
<div class="page-title">COOLMORE STUD STAKES</div>
</div>

<div class="content-wrap">

<div class="intro">
The Coolmore Stud Stakes is a premier Group 1 sprint for three-year-olds at Flemington, showcasing Australia’s elite young speedsters during the Melbourne Cup Carnival.
</div>

<div class="search-wrap">
<input id="searchInput" type="text" placeholder="Search winners, horses, jockeys, trainers...">
<div id="autocomplete" class="autocomplete"></div>
</div>

<div class="tile-grid">

<div class="tile" onclick="location.href='coolmore-stud-stakes-winners.html'">
<img src="./images/coolmore-stud-stakes-winners.jpg">
<div class="tile-title">Winners</div>
</div>

<div class="tile" onclick="location.href='coolmore-stud-stakes-people.html'">
<img src="./images/coolmore-stud-stakes-people.jpg">
<div class="tile-title">Jockeys & Trainers</div>
</div>

</div>
</div>

<script>
const searchData = [
  "Coolmore Stud Stakes",
  "Winners",
  "Jockeys",
  "Trainers",
  "Fastnet Rock",
  "Lankan Rupee",
  "Exceed And Excel",
  "Choisir",
  "Flemington",
  "VRC"
];

const input = document.getElementById("searchInput");
const list = document.getElementById("autocomplete");

if(input){
  input.addEventListener("input",()=>{
    const v=input.value.toLowerCase();
    list.innerHTML="";
    if(!v) return;

    searchData.filter(i=>i.toLowerCase().includes(v)).forEach(item=>{
      const d=document.createElement("div");
      d.textContent=item;
      d.onclick=()=>{
        input.value=item;
        list.innerHTML="";
      };
      list.appendChild(d);
    });
  });
}
</script>

</body>
</html>
