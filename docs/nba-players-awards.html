<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Player | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1100px;margin:0 auto;padding:26px 20px 70px;}

h1{
  font-family:var(--display);font-weight:600;font-size:clamp(24px,5vw,36px);
  letter-spacing:.01em;text-transform:uppercase;color:var(--ink);margin:0 0 20px;text-align:center;
}
h2{
  font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;
  letter-spacing:.02em;color:var(--ink);margin:26px 0 12px;
}

.tile-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
.tile{
  border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  background:var(--surface);text-align:center;
}
.tile h3{
  margin:0 0 6px;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
}
.tile div{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px;color:#27313c;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
tfoot th{background:var(--accent-soft);color:var(--ink);}
</style>
</head>

<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="nba.html">NBA</a>
</div>
<div class="page-wrap">
<h1 id="name"></h1>

<div class="tile-wrap">
<div class="tile"><h3>Debut</h3><div id="debut">—</div></div>
<div class="tile"><h3>Titles</h3><div id="titles">—</div></div>
<div class="tile"><h3>MVPs</h3><div id="mvps">—</div></div>
</div>

<h2>Regular Season</h2>
<div class="table-wrap">
<table>
<thead><tr><th>Season</th><th>Team</th><th>PTS</th><th>REB</th><th>AST</th></tr></thead>
<tbody id="reg"></tbody>
<tfoot><tr><th>Career</th><th></th><th id="cPts"></th><th id="cReb"></th><th id="cAst"></th></tr></tfoot>
</table>
</div>

<h2>Playoffs</h2>
<div class="table-wrap">
<table>
<thead><tr><th>Season</th><th>Team</th><th>PTS</th><th>REB</th><th>AST</th></tr></thead>
<tbody id="po"></tbody>
</table>
</div>

</div>

<script>
const p=new URLSearchParams(location.search).get("player");
document.getElementById("name").textContent=p;

let career={pts:0,reb:0,ast:0};

fetch("data/nba/player-seasons.json").then(r=>r.json()).then(data=>{
const rec=data.find(x=>x.player===p);
rec?.seasons.forEach(s=>{
career.pts+=s.pts||0;career.reb+=s.reb||0;career.ast+=s.ast||0;
document.getElementById("reg").innerHTML+=`<tr><td>${s.season}</td><td>${s.team}</td><td>${s.pts}</td><td>${s.reb}</td><td>${s.ast}</td></tr>`;
});
document.getElementById("cPts").textContent=career.pts.toFixed(1);
document.getElementById("cReb").textContent=career.reb.toFixed(1);
document.getElementById("cAst").textContent=career.ast.toFixed(1);
});

fetch("data/nba/player-playoffs.json").then(r=>r.json()).then(data=>{
const rec=data.find(x=>x.player===p);
rec?.seasons.forEach(s=>{
document.getElementById("po").innerHTML+=`<tr><td>${s.season}</td><td>${s.team}</td><td>${s.pts}</td><td>${s.reb}</td><td>${s.ast}</td></tr>`;
});
});

fetch("data/nba/players.json").then(r=>r.json()).then(players=>{
let pl=players.find(x=>x.player===p);
if(!pl){
fetch("data/nba/leaders.json").then(r=>r.json()).then(ld=>{
let found=ld.flatMap(x=>x.points).find(x=>x.player===p);
pl={debut:"Unknown",titles:0,mvps:0};
});
}
document.getElementById("debut").textContent=pl.debut||"—";
document.getElementById("titles").textContent=pl.titles||0;
document.getElementById("mvps").textContent=pl.mvps||0;
});
</script>
</body>
</html>
