<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    /* HERO */
    header {
      position: relative;
      width: 100%;
      height: 300px; /* intentionally shorter for readability */
      overflow: hidden;
      background: #000;
    }

    header img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    header h1 {
      position: absolute;
      bottom: 20px;
      left: 24px;
      margin: 0;
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* CONTENT */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    nav {
      margin-bottom: 24px;
    }

    nav a {
      margin-right: 18px;
      font-weight: 600;
      text-decoration: none;
      color: #0066cc;
    }

    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <img src="header-web.png" alt="The Sporting Almanac">
    <h1>The Sporting Almanac</h1>
  </header>

  <main>
    <nav>
      <a href="index.html">Home</a>
      <a href="racing.html">Racing</a>
      <a href="breeders-cup.html">Breeders’ Cup</a>
    </nav>

    <h2>Base confirmed</h2>

    <p>
      This cropped header is now optimised for web:
    </p>

    <ul>
      <li>Text in the image is fully readable</li>
      <li>Header no longer dominates the page</li>
      <li>Content appears immediately below the fold</li>
    </ul>

    <p>
      From here, we can safely evolve layout and styling.
    </p>
  </main>

</body>
</html>
