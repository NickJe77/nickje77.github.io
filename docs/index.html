<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Sporting Almanac</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- MAIN STYLES -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* SAFETY INLINE STYLES (guarantees header image shows) */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    header {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 480px;
      object-fit: cover;
    }

    .hero-title {
      position: absolute;
      bottom: 24px;
      left: 24px;
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }

    main {
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    nav a {
      margin-right: 16px;
      text-decoration: none;
      font-weight: 600;
      color: #0066cc;
    }

    nav {
      margin-bottom: 24px;
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <header>
    <img
      src="header.png"
      alt="The Sporting Almanac Header"
      class="hero-image"
    >
    <div class="hero-title">The Sporting Almanac</div>
  </hea
