<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      line-height: 1.55;
    }

    /* HEADER BANNER */
    header {
      width: 100%;
      background: #000;
    }

    header img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* GLOBAL LAYOUT */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 24px;
    }

    /* GLOBAL NAV */
    nav {
      margin-bottom: 44px;
    }

    nav a {
      margin-right: 26px;
      font-weight: 600;
      text-decoration: none;
      color: #003f8c;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* INTRO */
    .intro {
      max-width: 760px;
      margin-bottom: 56px;
    }

    .intro h1 {
      margin: 0 0 12px 0;
      font-size: 34px;
      letter-spacing: -0.3px;
    }

    .intro p {
      font-size: 19px;
      color: #444;
      margin: 0;
    }

    /* FEATURE GRID */
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 32px;
      margin-bottom: 64px;
    }

    .feature {
      border: 1px solid #e6e6e6;
      padding: 22px;
      border-radius: 8px;
      background: #fafafa;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .feature:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.06);
    }

    .feature h3 {
      margin: 0 0 10px 0;
      font-size: 20px;
    }

    .feature p {
      margin: 0;
      color: #555;
      font-size: 16px;
    }

    /* MEDIA / FUTURE SLOT */
    .media-slot {
      width: 100%;
      height: 140px;
      background: #e9e9e9;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 14px;
      border-radius: 4px;
    }

    /* FOOTER NOTE */
    .footer-note {
      border-top: 1px solid #eee;
      padding-top: 28px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <img src="header-banner.png" alt="The Sporting Almanac">
  </header>

  <!-- CONTENT -->
  <div class="container">
