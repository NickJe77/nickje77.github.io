      width: 100%;
      height: 420px;

      position: relative;
      z-index: 1;

      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    nav a {
      margin-right: 18px;
      font-weight: 600;
      text-decoration: none;
      color: #0066cc;
