<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tour de France Rankings | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:20px;}
h1{text-align:center;}

.controls{
  text-align:center;
  margin:20px 0;
}

select{
  padding:8px;
  font-size:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#111;
  color:#fff;
}

tr:hover{background:#f5f5f5;}
</style>
</head>

<body>

<h1>Tour de France General Classification</h1>

<div class="controls">
  <label>Season:</label>
  <select id="yearFilter">
    <option value="all">All</option>
  </select>
</div>

<table>
  <thead>
    <tr>
      <th>Year</th>
      <th>Rank</th>
      <th>Rider</th>
      <th>Team</th>
      <th>Time</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>

let DATA = [];

fetch("data/cycling/rankings.json")
  .then(r => r.json())
  .then(data => {
    DATA = data;
    buildFilter();
    render();
  });

function buildFilter(){
  const years = [...new Set(DATA.map(d => d.Year))].sort((a,b)=>b-a);

  const select = document.getElementById("yearFilter");

  years.forEach(y=>{
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    select.appendChild(opt);
  });

  select.addEventListener("change", render);
}

function render(){

  const year = document.getElementById("yearFilter").value;

  let rows = DATA;

  if(year !== "all"){
    rows = rows.filter(d => d.Year == year);
  }

  const body = document.getElementById("tableBody");
  body.innerHTML = "";

  rows.slice(0,500).forEach(d => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${d.Year || ""}</td>
      <td>${d.Rank || ""}</td>
      <td>${d.Name || ""}</td>
      <td>${d.Team || ""}</td>
      <td>${d.Time || ""}</td>
    `;

    body.appendChild(tr);
  });

}

</script>

</body>
</html>
