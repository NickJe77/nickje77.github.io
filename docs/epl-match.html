<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>EPL Match | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Inter,system-ui,Arial,sans-serif;
    background:#f3f4f7;
    color:#111;
}

.navbar{
    display:flex;
    justify-content:center;
    gap:24px;
    padding:16px;
    background:white;
    border-bottom:1px solid #ddd;
    flex-wrap:wrap;
}

.navbar a{
    text-decoration:none;
    color:#0056d6;
    font-weight:600;
}

.hero{
    background:linear-gradient(135deg,#37003c,#963cff);
    color:white;
    padding:40px 20px;
    text-align:center;
}

.hero-score{
    font-size:54px;
    font-weight:800;
    margin-top:10px;
}

.hero-teams{
    font-size:34px;
    font-weight:700;
}

.hero-details{
    margin-top:12px;
    font-size:16px;
    opacity:.95;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}

.card{
    background:white;
    border-radius:16px;
    padding:24px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    margin-bottom:18px;
    font-size:26px;
}

.event-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.event{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    border-radius:10px;
    background:#f7f9fc;
}

.event:nth-child(even){
    background:#edf3ff;
}

.minute{
    font-weight:800;
    color:#37003c;
    min-width:60px;
}

.player-link{
    color:#0056d6;
    text-decoration:none;
    font-weight:600;
}

.team-link{
    color:#0056d6;
    text-decoration:none;
    font-weight:700;
}

.info-table{
    width:100%;
    border-collapse:collapse;
}

.info-table td{
    padding:12px;
    border-bottom:1px solid #eee;
}

.info-table td:first-child{
    font-weight:700;
    width:180px;
}

.loading{
    text-align:center;
    padding:50px;
    font-size:18px;
    color:#666;
}

.empty{
    color:#666;
    padding:10px 0;
}

@media(max-width:900px){

.grid{
    grid-template-columns:1fr;
}

.hero-score{
    font-size:40px;
}

.hero-teams{
    font-size:24px;
}

}

</style>
</head>
<body>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/epl.html">EPL</a>
    <a href="/nba.html">NBA</a>
    <a href="/afl.html">AFL</a>
    <a href="/baseball.html">Baseball</a>
</div>

<div class="hero">

    <div class="hero-teams" id="heroTeams">
        Loading Match...
    </div>

    <div class="hero-score" id="heroScore"></div>

    <div class="hero-details" id="heroDetails"></div>

</div>

<div class="container">

    <div id="content" class="loading">
        Loading match data...
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const matchId = params.get("match");
const season = params.get("season");

const heroTeams = document.getElementById("heroTeams");
const heroScore = document.getElementById("heroScore");
const heroDetails = document.getElementById("heroDetails");

const content = document.getElementById("content");

function slugify(name){

    return name
        .toLowerCase()
        .replace(/\./g,'')
        .replace(/'/g,'')
        .replace(/"/g,'')
        .replace(/\s+/g,'-');

}

async function loadMatch(){

    try{

        const response = await fetch(`/data/epl/matches/${season}/${matchId}.json`);

        const match = await response.json();

        renderMatch(match);

    }catch(err){

        console.error(err);

        content.innerHTML = `
            <div class="loading">
                Failed to load match data
            </div>
        `;

    }

}

function renderEventList(events, type){

    if(!events || !events.length){

        return `<div class="empty">No ${type} recorded</div>`;

    }

    return `
        <div class="event-list">

            ${events.map(event => `

                <div class="event">

                    <div>

                        <a class="player-link"
                           href="/epl-player.html?player=${slugify(event.player)}">
                           ${event.player || ''}
                        </a>

                        ${event.team ? `
                            <span>
                                (
                                <a class="team-link"
                                   href="/epl-team.html?team=${encodeURIComponent(event.team)}">
                                   ${event.team}
                                </a>
                                )
                            </span>
                        ` : ''}

                    </div>

                    <div class="minute">
                        ${event.minute || ''}'
                    </div>

                </div>

            `).join('')}

        </div>
    `;

}

function renderMatch(match){

    document.title = `${match.home_team} vs ${match.away_team} | EPL Match`;

    heroTeams.innerHTML = `
        <a class="team-link"
           href="/epl-team.html?team=${encodeURIComponent(match.home_team)}">
           ${match.home_team}
        </a>

        vs

        <a class="team-link"
           href="/epl-team.html?team=${encodeURIComponent(match.away_team)}">
           ${match.away_team}
        </a>
    `;

    heroScore.textContent = `
        ${match.home_score ?? '-'}
        -
        ${match.away_score ?? '-'}
    `;

    heroDetails.innerHTML = `
        ${match.date || ''}
        ${match.round ? ` • ${match.round}` : ''}
        ${match.venue ? ` • ${match.venue}` : ''}
    `;

    content.innerHTML = `

        <div class="grid">

            <div class="card">

                <h2>Goalscorers</h2>

                ${renderEventList(match.scorers, 'goalscorers')}

            </div>

            <div class="card">

                <h2>Match Information</h2>

                <table class="info-table">

                    <tr>
                        <td>Date</td>
                        <td>${match.date || ''}</td>
                    </tr>

                    <tr>
                        <td>Round</td>
                        <td>${match.round || ''}</td>
                    </tr>

                    <tr>
                        <td>Venue</td>
                        <td>${match.venue || ''}</td>
                    </tr>

                    <tr>
                        <td>Attendance</td>
                        <td>${match.attendance || ''}</td>
                    </tr>

                    <tr>
                        <td>Referee</td>
                        <td>${match.referee || ''}</td>
                    </tr>

                </table>

            </div>

            <div class="card">

                <h2>Yellow Cards</h2>

                ${renderEventList(match.yellow_cards, 'yellow cards')}

            </div>

            <div class="card">

                <h2>Red Cards</h2>

                ${renderEventList(match.red_cards, 'red cards')}

            </div>

        </div>

    `;

}

loadMatch();

</script>

</body>
</html>
