<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>Football World Cup – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0a0a0a;
  --board-2:#1a1a1a;
  --accent:#1fa25c;
  --accent-soft:rgba(31,162,92,.16);
  --league:#a8790a;
  --league-soft:rgba(168,121,10,.1);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{font-family:var(--body);margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{display:flex;justify-content:center;gap:22px;padding:15px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;flex-wrap:wrap;}
.navbar a{color:var(--ink);text-decoration:none;opacity:.7;transition:opacity .15s;}
.navbar a:hover{opacity:1;}
.navbar a.current{opacity:1;color:var(--accent);}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;padding:44px 20px;text-align:center;
}
.hero .eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,4.5vw,42px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

/* ── Year tiles ───────────────────────────────────────── */
.year-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-bottom:26px;}
.year-tile{
  background:var(--surface);border:1px solid var(--line);color:var(--ink);text-align:center;
  padding:12px;border-radius:var(--radius);font-family:var(--display);font-weight:600;font-size:15px;
  cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.year-tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,16,24,.2);border-color:var(--league);}
.year-tile.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ── Summary ──────────────────────────────────────────── */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:22px;}
.summary h2{
  margin:0 0 16px;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.01em;
  text-transform:uppercase;color:var(--ink);
}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}

.summary-box{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  font-weight:600;font-size:13.5px;color:var(--ink);position:relative;overflow:hidden;
}

.flag-bg{
  position:absolute;font-size:88px;opacity:.14;right:6px;bottom:-6px;pointer-events:none;filter:saturate(1.2);
}
.flag-bg.dual{right:46px;}
.flag-bg.dual2{right:6px;}

/* ── Matches ──────────────────────────────────────────── */
.match{
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;
  background:var(--surface);display:block;text-decoration:none;color:inherit;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.match:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(10,16,24,.18);border-color:var(--faint);}
.match h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.01em;color:var(--ink);}
.small{font-size:12.5px;color:var(--muted);font-weight:600;}

.team-link{color:var(--league);text-decoration:none;font-weight:700;}
.team-link:hover{color:var(--accent);text-decoration:underline;}
</style>
</head>

<body>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="world-cup-countries.html">Countries</a>
</nav>

<div class="hero">
  <div class="eyebrow">Football</div>
  <h1>World Cup – By Year</h1>
</div>

<div class="page-wrap">
<div id="years" class="year-grid"></div>
<div id="output"></div>
</div>

<script>
const COUNTRY_PAGE="world-cup-country.html";

let matchesByYear={}, rawRows=[];

const countryCodes={
"Brazil":"BR","Germany":"DE","West Germany":"DE","FRG":"DE",
"Italy":"IT","Argentina":"AR","France":"FR",
"England":"GB","Spain":"ES","Netherlands":"NL","Uruguay":"UY","Portugal":"PT",
"Belgium":"BE","Croatia":"HR","Mexico":"MX","USA":"US","United States":"US",
"Japan":"JP","South Korea":"KR","Korea Republic":"KR","Australia":"AU",
"Austria":"AT","Switzerland":"CH","Sweden":"SE","Norway":"NO","Denmark":"DK",
"Poland":"PL","Czech Republic":"CZ","Czechoslovakia":"CZ","Russia":"RU",
"Ukraine":"UA","Turkey":"TR","Greece":"GR","Scotland":"GB","Wales":"GB",
"Ireland":"IE","Northern Ireland":"GB","Morocco":"MA","Cameroon":"CM",
"Nigeria":"NG","Ghana":"GH","Senegal":"SN","Tunisia":"TN","Algeria":"DZ",
"Iran":"IR","Iraq":"IQ","Saudi Arabia":"SA","Qatar":"QA","China":"CN",
"South Africa":"ZA","New Zealand":"NZ","Canada":"CA",
"Costa Rica":"CR","Honduras":"HN","Panama":"PA","Jamaica":"JM",
"Trinidad and Tobago":"TT","Colombia":"CO","Chile":"CL","Peru":"PE",
"Paraguay":"PY","Ecuador":"EC","Bolivia":"BO","Venezuela":"VE"
};

function flagEmoji(code){
 if(!code) return "";
 return code.replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt()));
}

function getFlag(name){
 return flagEmoji(countryCodes[name]);
}

/* ---------- LOAD DATA ---------- */
fetch("data/world-cup.json",{cache:"no-store"})
.then(r=>r.json())
.then(data=>{
 rawRows=data;
 normalise(data);
 buildYears();

 // FIX: if the page was linked to with ?year=YYYY (e.g. from the World Cup
 // hub's tournament tiles), auto-select and load that year on arrival
 // instead of leaving the page on a blank "pick a year" state.
 const requestedYear = new URLSearchParams(location.search).get("year");
 if(requestedYear && matchesByYear[requestedYear]){
   const tile = [...document.querySelectorAll(".year-tile")]
     .find(el => el.textContent === String(requestedYear));
   if(tile) loadYear(requestedYear, tile);
 }
});

function normalise(rows){
 rows.forEach(r=>{
  if(r.Team){
   const m={
    year:r.Year,
    round:r.Round,
    team1:r.Team,
    team2:r.Team__1,
    score:r["Final Score"],
    winner:r["Winnning Team"]
   };
   if(!matchesByYear[r.Year]) matchesByYear[r.Year]=[];
   matchesByYear[r.Year].push(m);
  }
 });
}

function buildYears(){
 const box=document.getElementById("years");
 Object.keys(matchesByYear).sort().forEach(y=>{
  const d=document.createElement("div");
  d.className="year-tile";
  d.textContent=y;
  d.onclick=()=>loadYear(y,d);
  box.appendChild(d);
 });
}

function loadYear(year,btn){
 document.querySelectorAll(".year-tile").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 const out=document.getElementById("output");
 out.innerHTML="";
 buildSummary(year,out);
 buildMatches(year,out);
}

/* ---------- SUMMARY ---------- */
function buildSummary(year,out){

 let host="Unknown";
 let winner="Unknown";
 let runnerUp="Unknown";
 let goals={};

 const yearRows = rawRows.filter(r=>String(r.Year)===String(year));

 yearRows.forEach(r=>{
  if(r.Host) host=r.Host;
  if(r["Host Country"]) host=r["Host Country"];
 });

 const finals = yearRows.filter(r =>
   String(r.Round||"").toLowerCase()==="final" &&
   (r["Winnning Team"] || r.Team)
 );

 const gf = finals.length ? finals[0] : null;

 if(gf){
  const w = gf["Winnning Team"];
  const t1 = gf.Team;
  const t2 = gf.Team__1;

  if(w){
   winner=w;
   if(t1 && t2){
    runnerUp=(t1===w)?t2:t1;
   }
  }
 }

 yearRows.forEach(r=>{
  if(r.Scorers){
   const s=r.Scorers.split("(")[0].trim();
   if(s) goals[s]=(goals[s]||0)+1;
  }
 });

 const topGoals=Object.entries(goals).sort((a,b)=>b[1]-a[1]).slice(0,5);

 let hostFlagsHTML="";
 if(host.includes("/")){
  const parts=host.split("/").map(h=>h.trim());
  hostFlagsHTML=`
   <span class="flag-bg dual">${getFlag(parts[0])}</span>
   <span class="flag-bg dual2">${getFlag(parts[1])}</span>
  `;
 }else{
  hostFlagsHTML=`<span class="flag-bg">${getFlag(host)}</span>`;
 }

 const summary=document.createElement("div");
 summary.className="summary";

 summary.innerHTML=`
  <h2>${year} World Cup Summary</h2>
  <div class="summary-grid">
   <div class="summary-box">${hostFlagsHTML}Host: ${host}</div>
   <div class="summary-box"><span class="flag-bg">${getFlag(winner)}</span>Winner: ${winner}</div>
   <div class="summary-box"><span class="flag-bg">${getFlag(runnerUp)}</span>Runner-up: ${runnerUp}</div>
   <div class="summary-box">
    Top Scorers:<br>
    ${topGoals.map(g=>`${g[0]} – ${g[1]}`).join("<br>")}
   </div>
  </div>
 `;

 out.appendChild(summary);
}

/* ---------- MATCHES WITH RESULTS RESTORED ---------- */
function buildMatches(year,out){
 matchesByYear[year].forEach(m=>{
  const div=document.createElement("a");
  div.className="match";
  div.style.display="block";
  div.style.textDecoration="none";
  div.style.color="inherit";
  div.href=`world-cup-match.html?year=${encodeURIComponent(m.year)}&round=${encodeURIComponent(m.round)}&team1=${encodeURIComponent(m.team1)}&team2=${encodeURIComponent(m.team2)}`;

  const result = m.winner ? m.winner : "Draw";

  div.innerHTML=`
   <h3>
    <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.team1)}" onclick="event.stopPropagation()">${m.team1}</a>
    ${m.score}
    <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.team2)}" onclick="event.stopPropagation()">${m.team2}</a>
   </h3>
   <div class="small">${m.round}</div>
   <div class="small">Result: ${result}</div>
  `;

  out.appendChild(div);
 });
}
</script>

</body>
</html>
