<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Football World Cup – Year by Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;background:white;margin:0;}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:0 auto;
padding:30px 20px;
}

.year-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
gap:12px;
margin-bottom:30px;
}

.year-tile{
background:#111;
color:white;
text-align:center;
padding:12px;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

.year-tile.active{background:#0056d6;}

.match{
border:1px solid #ddd;
border-radius:10px;
padding:14px;
margin-bottom:20px;
}

.event-table{
width:100%;
border-collapse:collapse;
font-size:14px;
margin-top:10px;
}

.event-table th{
background:#f0f0f0;
padding:8px;
text-align:left;
}

.event-table td{
padding:8px;
border-bottom:1px solid #ddd;
}

.event-table tr:nth-child(even) td{
background:#f3f7ff;
}

.error{
color:#900;
font-weight:700;
margin-top:20px;
}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
</div>

<div class="page-wrap">

<h1>Football World Cup – Year by Year</h1>

<div id="years" class="year-grid"></div>
<div id="output"></div>

</div>

<script>
let matchesByYear={};

fetch("data/world-cup.json",{cache:"no-store"})
.then(r=>{
 if(!r.ok) throw "not found";
 return r.json();
})
.then(data=>{
 normalise(data);
 buildYears();
})
.catch(()=>{
 document.getElementById("output").innerHTML=
 "<div class='error'>World Cup data failed to load.</div>";
});

function normalise(rows){
 let current=null;

 rows.forEach(r=>{
  if(r.Team){
   current={
    year:r.Year,
    round:r.Round,
    team1:r.Team,
    team2:r.Team__1,
    score:r["Final Score"],
    winner:r["Winnning Team"],
    events:[]
   };

   if(!matchesByYear[r.Year]) matchesByYear[r.Year]=[];
   matchesByYear[r.Year].push(current);
  }

  if(current && r.Scorers){
   current.events.push({
    scorer:r.Scorers,
    minute:r["Time scored"],
    progress:r["Progess Score"]
   });
  }
 });
}

function buildYears(){
 const box=document.getElementById("years");
 Object.keys(matchesByYear).sort().forEach(y=>{
  const d=document.createElement("div");
  d.className="year-tile";
  d.textContent=y;
  d.onclick=()=>loadYear(y,d);
  box.appendChild(d);
 });
}

function loadYear(year,btn){
 document.querySelectorAll(".year-tile").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");

 const out=document.getElementById("output");
 out.innerHTML="";

 matchesByYear[year].forEach(m=>{
  const div=document.createElement("div");
  div.className="match";

  div.innerHTML=`
   <h3>${m.team1} ${m.score} ${m.team2}</h3>
   <div><strong>Round:</strong> ${m.round}</div>
   <div><strong>Winner:</strong> ${m.winner}</div>

   <table class="event-table">
    <tr><th>Scorer</th><th>Minute</th><th>Score</th></tr>
    ${m.events.map(e=>`
     <tr>
      <td>${e.scorer}</td>
      <td>${e.minute}</td>
      <td>${e.progress}</td>
     </tr>`).join("")}
   </table>
  `;
  out.appendChild(div);
 });
}
</script>

</body>
</html>
