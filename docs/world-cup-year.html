<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Football World Cup – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:0 auto;
padding:30px 20px;
}

h1{text-align:center;margin-bottom:30px;}

.year-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
gap:12px;
margin-bottom:30px;
}

.year-tile{
background:#111;
color:white;
text-align:center;
padding:12px;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

.year-tile.active{background:#0056d6;}

.summary{
border:1px solid #ddd;
border-radius:10px;
padding:18px;
margin-bottom:24px;
background:#fafafa;
}

.summary h2{margin:0 0 12px 0;}

.summary-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:14px;
}

.summary-box{
background:white;
border:1px solid #ddd;
border-radius:8px;
padding:12px;
font-weight:600;
}

.match{
border:1px solid #ddd;
border-radius:10px;
padding:14px;
margin-bottom:16px;
background:white;
}

.match h3{margin:0 0 6px 0;}

.small{font-size:13px;color:#555;}

.team-link{
color:#0056d6;
text-decoration:none;
font-weight:600;
}
.team-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="world-cup-countries.html">Countries</a>
</div>

<div class="page-wrap">

<h1>Football World Cup – By Year</h1>

<div id="years" class="year-grid"></div>
<div id="output"></div>

</div>

<script>
const COUNTRY_PAGE="world-cup-country.html";

let matchesByYear={};
let rawRows=[];

fetch("data/world-cup.json",{cache:"no-store"})
.then(r=>r.json())
.then(data=>{
 rawRows=data;
 normalise(data);
 buildYears();
});

function normalise(rows){
 rows.forEach(r=>{
  if(r.Team){
   const current={
    year:r.Year,
    round:r.Round,
    team1:r.Team,
    team2:r.Team__1,
    score:r["Final Score"],
    winner:r["Winnning Team"]
   };

   if(!matchesByYear[r.Year]) matchesByYear[r.Year]=[];
   matchesByYear[r.Year].push(current);
  }
 });
}

function buildYears(){
 const box=document.getElementById("years");

 Object.keys(matchesByYear)
  .sort()
  .forEach(y=>{
   const d=document.createElement("div");
   d.className="year-tile";
   d.textContent=y;
   d.onclick=()=>loadYear(y,d);
   box.appendChild(d);
  });
}

function loadYear(year,btn){
 document.querySelectorAll(".year-tile").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");

 const out=document.getElementById("output");
 out.innerHTML="";

 buildSummary(year,out);
 buildMatches(year,out);
}

/* ---------- SUMMARY HELPERS ---------- */

function getField(row, keys){
 for(const k of keys){
  if(row && row[k] !== undefined && row[k] !== null){
   const v=String(row[k]).replace(/\u00A0/g," ").trim();
   if(v) return v;
  }
 }
 return "";
}

function isGrandFinalRound(round){
 const r=String(round||"").toLowerCase();
 if(!/\bfinal\b/.test(r)) return false;
 if(/semi|quarter|third|bronze|3rd|playoff|play-off|placement/.test(r)) return false;
 return true;
}

function getGrandFinalRow(yearRows){
 // Find rows that look like the actual Final (not semi/quarter/third place)
 const finals=yearRows.filter(r=>isGrandFinalRound(r.Round));
 if(finals.length) return finals[finals.length-1];

 // Fallback: strict "Final"
 const strict=yearRows.filter(r=>String(r.Round||"").trim().toLowerCase()==="final");
 if(strict.length) return strict[strict.length-1];

 // Last resort: any "final" (kept for safety)
 const any=yearRows.filter(r=>String(r.Round||"").toLowerCase().includes("final"));
 return any.length ? any[any.length-1] : null;
}

/* ---------- SUMMARY ---------- */

function buildSummary(year,out){

 let host="Unknown";
 let winner="Unknown";
 let runnerUp="Unknown";
 let goals={};

 const yearRows=rawRows.filter(r=>String(r.Year)===String(year));

 // Host
 yearRows.forEach(r=>{
  const h=getField(r, ["Host","Host Country","HostNation","Host Nation"]);
  if(h) host=h;
 });

 // Grand Final winner/runner-up
 const gf=getGrandFinalRow(yearRows);
 if(gf){
  const w=getField(gf, ["Winnning Team","Winning Team","Winner"]);
  const t1=getField(gf, ["Team"]);
  const t2=getField(gf, ["Team__1","Team 2","Opponent"]);

  if(w) winner=w;
  if(w && t1 && t2){
   runnerUp = (t1===w) ? t2 : t1;
  }else{
   // If winner missing, still show teams if possible
   if(t1 && t2){
    winner = winner==="Unknown" ? "—" : winner;
    runnerUp = "—";
   }
  }
 }

 // Goal scorers (simple count from scorer rows in that year)
 yearRows.forEach(r=>{
  const scorerRaw=getField(r, ["Scorers"]);
  if(!scorerRaw) return;

  const scorer=scorerRaw.split("(")[0].trim();
  if(!scorer) return;

  goals[scorer]=(goals[scorer]||0)+1;
 });

 const topGoals=Object.entries(goals).sort((a,b)=>b[1]-a[1]).slice(0,5);

 const summary=document.createElement("div");
 summary.className="summary";

 summary.innerHTML=`
  <h2>${year} World Cup Summary</h2>
  <div class="summary-grid">
   <div class="summary-box">Host: ${host}</div>
   <div class="summary-box">Winner: ${winner}</div>
   <div class="summary-box">Runner-up: ${runnerUp}</div>
   <div class="summary-box">
    Top Scorers:<br>
    ${topGoals.length ? topGoals.map(g=>`${g[0]} – ${g[1]}`).join("<br>") : "Unknown"}
   </div>
  </div>
 `;

 out.appendChild(summary);
}

/* ---------- MATCHES ---------- */

function buildMatches(year,out){

 matchesByYear[year].forEach(m=>{
  const div=document.createElement("div");
  div.className="match";

  div.innerHTML=`
   <h3>
    <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.team1)}">${m.team1}</a>
    ${m.score}
    <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.team2)}">${m.team2}</a>
   </h3>
   <div class="small">${m.round}</div>
   <div class="small">Winner:
    <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.winner)}">${m.winner}</a>
   </div>
  `;

  out.appendChild(div);
 });
}
</script>

</body>
</html>
