<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Cup Year by Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
  "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  border-bottom:1px solid #ddd;
  font-weight:600;
}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}

.year-grid{
  max-width:1200px;
  margin:30px auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:14px;
  padding:0 20px;
}

.year-tile{
  background:#111;
  color:#fff;
  padding:14px 0;
  text-align:center;
  border-radius:8px;
  font-size:18px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="football-world-cup.html">World Cup</a>
</div>

<h1 style="padding:20px;">World Cup Year by Year</h1>

<div id="years" class="year-grid"></div>

<script>
const years=[
1930,1934,1938,1950,1954,1958,1962,1966,1970,1974,1978,
1982,1986,1990,1994,1998,2002,2006,2010,2014,2018,2022
];

const box=document.getElementById("years");

years.forEach(y=>{
  const d=document.createElement("div");
  d.className="year-tile";
  d.textContent=y;
  box.appendChild(d);
});
</script>

</body>
</html>
