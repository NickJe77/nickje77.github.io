<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Football World Cup – By Year | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:white;}
.navbar{display:flex;justify-content:center;gap:22px;padding:16px;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.page-wrap{max-width:1200px;margin:0 auto;padding:30px 20px;}
h1{text-align:center;margin-bottom:30px;}

.year-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin-bottom:30px;}
.year-tile{background:#111;color:white;text-align:center;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;}
.year-tile.active{background:#0056d6;}

.summary{border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:24px;background:#fafafa;}
.summary h2{margin:0 0 12px 0;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}

.summary-box{
background:white;
border:1px solid #ddd;
border-radius:8px;
padding:12px;
font-weight:600;
position:relative;
overflow:hidden;
}

.flag-bg{
position:absolute;
font-size:96px;
opacity:0.18;
right:6px;
bottom:0px;
pointer-events:none;
filter:saturate(1.2);
}

.flag-bg.dual{right:50px;}
.flag-bg.dual2{right:6px;}

.match{
border:1px solid #ddd;
border-radius:10px;
padding:14px;
margin-bottom:16px;
background:white;
}

.match h3{margin:0 0 6px 0;}

.small{font-size:13px;color:#555;}

.team-link{
color:#0056d6;
text-decoration:none;
font-weight:600;
}
.team-link:hover{text-decoration:underline;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="football.html">Football</a>
<a href="football-world-cup.html">World Cup</a>
<a href="world-cup-countries.html">Countries</a>
</div>

<div class="page-wrap">
<h1>Football World Cup – By Year</h1>
<div id="years" class="year-grid"></div>
<div id="output"></div>
</div>

<script>
const COUNTRY_PAGE="world-cup-country.html";

let matchesByYear={}, rawRows=[];

const countryCodes={
"Brazil":"BR","Germany":"DE","West Germany":"DE","FRG":"DE",
"Italy":"IT","Argentina":"AR","France":"FR",
"England":"GB","Spain":"ES","Netherlands":"NL","Uruguay":"UY","Portugal":"PT",
"Belgium":"BE","Croatia":"HR","Mexico":"MX","USA":"US","United States":"US",
"Japan":"JP","South Korea":"KR","Korea Republic":"KR","Australia":"AU",
"Austria":"AT","Switzerland":"CH","Sweden":"SE","Norway":"NO","Denmark":"DK",
"Poland":"PL","Czech Republic":"CZ","Czechoslovakia":"CZ","Russia":"RU",
"Ukraine":"UA","Turkey":"TR","Greece":"GR","Scotland":"GB","Wales":"GB",
"Ireland":"IE","Northern Ireland":"GB","Morocco":"MA","Cameroon":"CM",
"Nigeria":"NG","Ghana":"GH","Senegal":"SN","Tunisia":"TN","Algeria":"DZ",
"Iran":"IR","Iraq":"IQ","Saudi Arabia":"SA","Qatar":"QA","China":"CN",
"South Africa":"ZA","New Zealand":"NZ","Canada":"CA",
"Costa Rica":"CR","Honduras":"HN","Panama":"PA","Jamaica":"JM",
"Trinidad and Tobago":"TT","Colombia":"CO","Chile":"CL","Peru":"PE",
"Paraguay":"PY","Ecuador":"EC","Bolivia":"BO","Venezuela":"VE"
};

function flagEmoji(code){
 if(!code) return "";
 return code.replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt()));
}

function getFlag(name){
 return flagEmoji(countryCodes[name]);
}

/* ---------- LOAD DATA ---------- */
fetch("data/world-cup.json",{cache:"no-store"})
.then(r=>r.json())
.then(data=>{
 rawRows=data;
 normalise(data);
 buildYears();
});

function normalise(rows){
 rows.forEach(r=>{
  if(r.Team){
   const m={
    year:r.Year,
    round:r.Round,
    team1:r.Team,
    team2:r.Team__1,
    score:r["Final Score"],
    winner:r["Winnning Team"]
   };
   if(!matchesByYear[r.Year]) matchesByYear[r.Year]=[];
   matchesByYear[r.Year].push(m);
  }
 });
}

function buildYears(){
 const box=document.getElementById("years");
 Object.keys(matchesByYear).sort().forEach(y=>{
  const d=document.createElement("div");
  d.className="year-tile";
  d.textContent=y;
  d.onclick=()=>loadYear(y,d);
  box.appendChild(d);
 });
}

function loadYear(year,btn){
 document.querySelectorAll(".year-tile").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 const out=document.getElementById("output");
 out.innerHTML="";
 buildSummary(year,out);
 buildMatches(year,out);
}

/* ---------- SUMMARY ---------- */
function buildSummary(year,out){

 let host="Unknown";
 let winner="Unknown";
 let runnerUp="Unknown";
 let goals={};

 const yearRows = rawRows.filter(r=>String(r.Year)===String(year));

 yearRows.forEach(r=>{
  if(r.Host) host=r.Host;
  if(r["Host Country"]) host=r["Host Country"];
 });

 const finals = yearRows.filter(r =>
   String(r.Round||"").toLowerCase()==="final" &&
   (r["Winnning Team"] || r.Team)
 );

 const gf = finals.length ? finals[0] : null;

 if(gf){
  const w = gf["Winnning Team"];
  const t1 = gf.Team;
  const t2 = gf.Team__1;

  if(w){
   winner=w;
   if(t1 && t2){
    runnerUp=(t1===w)?t2:t1;
   }
  }
 }

 yearRows.forEach(r=>{
  if(r.Scorers){
   const s=r.Scorers.split("(")[0].trim();
   if(s) goals[s]=(goals[s]||0)+1;
  }
 });

 const topGoals=Object.entries(goals).sort((a,b)=>b[1]-a[1]).slice(0,5);

 let hostFlagsHTML="";
 if(host.includes("/")){
  const parts=host.split("/").map(h=>h.trim());
  hostFlagsHTML=`
   <span class="flag-bg dual">${getFlag(parts[0])}</span>
   <span class="flag-bg dual2">${getFlag(parts[1])}</span>
  `;
 }else{
  hostFlagsHTML=`<span class="flag-bg">${getFlag(host)}</span>`;
 }

 const summary=document.createElement("div");
 summary.className="summary";

 summary.innerHTML=`
  <h2>${year} World Cup Summary</h2>
  <div class="summary-grid">
   <div class="summary-box">${hostFlagsHTML}Host: ${host}</div>
   <div class="summary-box"><span class="flag-bg">${getFlag(winner)}</span>Winner: ${winner}</div>
   <div class="summary-box"><span class="flag-bg">${getFlag(runnerUp)}</span>Runner-up: ${runnerUp}</div>
   <div class="summary-box">
    Top Scorers:<br>
    ${topGoals.map(g=>`${g[0]} – ${g[1]}`).join("<br>")}
   </div>
  </div>
 `;

 out.appendChild(summary);
}

/* ---------- MATCHES WITH RESULTS RESTORED ---------- */
function buildMatches(year,out){
 matchesByYear[year].forEach(m=>{
  const div=document.createElement("div");
  div.className="match";

  const result = m.winner ? m.winner : "Draw";

  div.innerHTML=`
   <h3>
    <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.team1)}">${m.team1}</a>
    ${m.score}
    <a class="team-link" href="${COUNTRY_PAGE}?team=${encodeURIComponent(m.team2)}">${m.team2}</a>
   </h3>
   <div class="small">${m.round}</div>
   <div class="small">Result: ${result}</div>
  `;

  out.appendChild(div);
 });
}
</script>

</body>
</html>
