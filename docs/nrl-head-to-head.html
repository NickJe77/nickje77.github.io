<!DOCTYPE html>
<html>
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Head to Head</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px;background:white;border-bottom:1px solid #ddd;font-weight:600;}
.navbar a{text-decoration:none;color:#0056d6;}
.page{max-width:1200px;margin:auto;padding:30px;}
h1{margin-bottom:20px;}
.select-row{display:flex;gap:20px;margin-bottom:20px;}
select{flex:1;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px;}
button{padding:12px 22px;background:#0056d6;color:white;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;}
.card{background:white;border-radius:14px;padding:20px;margin-top:20px;}
table{width:100%;border-collapse:collapse;margin-top:15px;}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px;}
th{background:#f0f2f5;}
tbody tr:hover{background:#eaf3ff;cursor:pointer;}
</style>
</head>
<body>
<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>
<div class="page">
<h1>NRL Head to Head</h1>
<div class="select-row">
  <select id="team1"></select>
  <select id="team2"></select>
</div>
<button onclick="compare()">Compare</button>
<div id="results"></div>
</div>
<script>
// ── Team-name canonicalisation ──────────────────────────────────────────────
// Across seasons the data spells some clubs differently (hyphen vs space, a
// short form, or an old franchise name). Map each variant to ONE canonical name
// so the dropdown lists each club once and head-to-heads count every game
// regardless of which spelling a given season used.
//
// Only clear same-club variants are merged below. Genuinely separate historical
// clubs are deliberately NOT merged (e.g. Gold Coast Chargers ≠ Gold Coast
// Titans; Balmain Tigers / Western Suburbs Magpies ≠ Wests Tigers; St George
// Dragons is the pre-1999 club, kept apart from St George-Illawarra Dragons).
//
// The last three are franchise *renames* — judgment calls. If you'd rather keep
// any of them as separate historical entries, delete that line.
const TEAM_ALIASES = {
  // hyphen / short-form variants of the same current club
  "Bulldogs":                       "Canterbury-Bankstown Bulldogs",
  "Canterbury Bankstown Bulldogs":  "Canterbury-Bankstown Bulldogs",
  "Sharks":                         "Cronulla-Sutherland Sharks",
  "Cronulla Sutherland Sharks":     "Cronulla-Sutherland Sharks",
  "Manly Warringah Sea Eagles":     "Manly-Warringah Sea Eagles",
  "St George Illawarra Dragons":    "St George-Illawarra Dragons",
  // same franchise, historically renamed (judgment calls)
  "Auckland Warriors":              "New Zealand Warriors",
  "Warriors":                       "New Zealand Warriors",
  "Sydney City Roosters":           "Sydney Roosters",
};
function canonTeam(name){ return TEAM_ALIASES[name] || name; }

let allMatches = [];
fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{
  return Promise.all(
    index.seasons.map(s=>
      fetch("data/nrl/seasons/"+s+".json").then(r=>r.json())
    )
  );
})
.then(results=>{
  results.forEach(season => allMatches.push(...season));
  buildTeamDropdowns();
});
function buildTeamDropdowns(){
  // dedupe on the canonical name so each club appears once
  const teams = [...new Set(
    allMatches.flatMap(m=>[canonTeam(m.home_team), canonTeam(m.away_team)])
  )].sort();
  ["team1","team2"].forEach(id=>{
    const sel = document.getElementById(id);
    teams.forEach(t=>{
      const opt = document.createElement("option");
      opt.value = opt.textContent = t;
      sel.appendChild(opt);
    });
  });
}
function getWinner(m){
  if(m.home_points > m.away_points) return m.home_team;
  if(m.away_points > m.home_points) return m.away_team;
  return null;
}
function compare(){
  const team1 = document.getElementById("team1").value;
  const team2 = document.getElementById("team2").value;
  if(team1 === team2) return;
  // match on canonical names so all spellings of each club are included
  const matches = allMatches.filter(m=>{
    const h = canonTeam(m.home_team), a = canonTeam(m.away_team);
    return (h===team1 && a===team2) || (h===team2 && a===team1);
  });
  const team1Wins = matches.filter(m=>canonTeam(getWinner(m))===team1).length;
  const team2Wins = matches.filter(m=>canonTeam(getWinner(m))===team2).length;
  const draws     = matches.filter(m=>getWinner(m)===null).length;
  const totalPts  = matches.reduce((a,m)=>a+(m.home_points||0)+(m.away_points||0),0);
  const avg       = matches.length ? (totalPts/matches.length).toFixed(1) : 0;
  document.getElementById("results").innerHTML = `
    <div class="card">
      <h2>${team1} vs ${team2}</h2>
      <p>Games: ${matches.length} &nbsp;|&nbsp;
         ${team1} wins: ${team1Wins} &nbsp;|&nbsp;
         ${team2} wins: ${team2Wins} &nbsp;|&nbsp;
         Draws: ${draws}</p>
      <p><strong>Average total points per game:</strong> ${avg}</p>
      <table>
        <thead>
          <tr>
            <th>Season</th>
            <th>Round</th>
            <th>Date</th>
            <th>Venue</th>
            <th>Home</th>
            <th>Score</th>
            <th>Away</th>
          </tr>
        </thead>
        <tbody>
          ${matches
            .slice()
            .sort((a,b)=> (a.season-b.season) || String(a.round).localeCompare(String(b.round)))
            .map(m=>`
            <tr onclick="window.location='nrl-game.html?season=${m.season}&match=${m.match_id}'">
              <td>${m.season}</td>
              <td>${m.round||""}</td>
              <td>${m.date||""}</td>
              <td>${m.venue||""}</td>
              <td>${m.home_team}</td>
              <td>${m.home_points} - ${m.away_points}</td>
              <td>${m.away_team}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}
</script>
</body>
</html>
