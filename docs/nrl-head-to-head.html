<!DOCTYPE html>
<html>
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NRL Head to Head</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,Arial;margin:0;background:#f4f6f8;}

.navbar{
  display:flex;
  justify-content:center;
  gap:24px;
  padding:16px;
  background:white;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  text-decoration:none;
  color:#0056d6;
}

.page{max-width:1200px;margin:auto;padding:30px;}

h1{margin-bottom:20px;}

.select-row{
  display:flex;
  gap:20px;
  margin-bottom:20px;
}

select{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  padding:12px 22px;
  background:#0056d6;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-top:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:14px;
}

th{
  background:#f0f2f5;
}
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="nrl.html">NRL</a>
</nav>

<div class="page">

<h1>NRL Head to Head</h1>

<div class="select-row">
  <select id="team1"></select>
  <select id="team2"></select>
</div>

<button onclick="compare()">Compare</button>

<div id="results"></div>

</div>

<script>

let allData=[];

fetch("data/nrl/index.json")
.then(r=>r.json())
.then(index=>{

  const fetches=index.seasons.map(s=>
    fetch("data/nrl/seasons/"+s+".json").then(r=>r.json())
  );

  Promise.all(fetches).then(results=>{
    results.forEach(season=>allData.push(...season));
    buildTeamDropdowns();
  });

});

function buildTeamDropdowns(){

  const teams=[...new Set(allData.map(d=>d.played_for))].sort();

  const t1=document.getElementById("team1");
  const t2=document.getElementById("team2");

  teams.forEach(team=>{
    const opt1=document.createElement("option");
    opt1.value=team;
    opt1.textContent=team;
    t1.appendChild(opt1);

    const opt2=document.createElement("option");
    opt2.value=team;
    opt2.textContent=team;
    t2.appendChild(opt2);
  });

}

function compare(){

  const team1=document.getElementById("team1").value;
  const team2=document.getElementById("team2").value;

  if(team1===team2) return;

  const games=[...new Set(
    allData
      .filter(d=> (d.home_team===team1 && d.away_team===team2) ||
                  (d.home_team===team2 && d.away_team===team1))
      .map(d=>d.match_id)
  )];

  const matches=games.map(id=>{
    const rows=allData.filter(d=>d.match_id===id);
    return rows[0];
  });

  const team1Wins=matches.filter(m=>m.winner===team1).length;
  const team2Wins=matches.filter(m=>m.winner===team2).length;

  let totalPoints=0;
  matches.forEach(m=>{
    totalPoints+=(m.home_points||0)+(m.away_points||0);
  });

  const avg=matches.length? (totalPoints/matches.length).toFixed(1):0;

  const container=document.getElementById("results");

  container.innerHTML=`
    <div class="card">
      <h2>${team1} vs ${team2}</h2>
      <p>Games: ${matches.length} |
      ${team1} wins: ${team1Wins} |
      ${team2} wins: ${team2Wins}</p>
      <p><strong>Average total points:</strong> ${avg}</p>

      <table>
        <thead>
          <tr>
            <th>Season</th>
            <th>Round</th>
            <th>Venue</th>
            <th>Match</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody>
          ${matches.map(m=>`
            <tr>
              <td>${m.season}</td>
              <td>${m.round}</td>
              <td>${m.venue||""}</td>
              <td>${m.home_team} v ${m.away_team}</td>
              <td>${m.home_points} - ${m.away_points}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;

}

</script>

</body>
</html>
