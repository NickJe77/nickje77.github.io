<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>World Cup Best Individual Performances | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Inter, system-ui, Arial, sans-serif; margin: 0; background: #ffffff; }
    .navbar { display: flex; justify-content: center; gap: 22px; padding: 16px 0; border-bottom: 1px solid #ddd; font-weight: 600; }
    .navbar a { color: #0056d6; text-decoration: none; font-size: 18px; }
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .hero { background: linear-gradient(90deg, #004d00, #006400); color: white; padding: 40px 50px; border-radius: 24px; margin-bottom: 25px; }
    .hero h1 { margin: 0; font-size: 46px; }
    .hero p { margin-top: 10px; font-size: 20px; opacity: 0.95; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab { background: #003300; color: white; border: none; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 15px; }
    .tab.active { background: #2e7d32; }
    .tab:hover:not(.active) { background: #005000; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { border-bottom: 1px solid #ddd; padding: 10px 12px; text-align: left; }
    th { background: #f3f6fb; }
    tr:nth-child(even) { background: #f6fbf6; }
    tr:hover { background: #edf7ed; }
    td a { color: #004d00; text-decoration: none; font-weight: 600; }
    td a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>
<div class="page-wrap">
  <div class="hero">
    <h1>World Cup Best Individual Performances</h1>
    <p>Top 25 batting and bowling performances in a single World Cup match.</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('batting', event)">Batting</button>
    <button class="tab" onclick="showTab('bowling', event)">Bowling</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Player</th>
        <th>Figure</th>
        <th>Year</th>
        <th>Match</th>
        <th>Scorecard</th>
      </tr>
    </thead>
    <tbody id="recordsTable"></tbody>
  </table>
</div>

<script>
const TOURNAMENTS = [
  { year: "1975", file: "wc_1975" },
  { year: "1979", file: "wc_1979" },
  { year: "1983", file: "wc_1983" },
  { year: "1987", file: "wc_1987_1988" },
  { year: "1992", file: "wc_1991_1992" },
  { year: "1996", file: "wc_1995_1996" },
  { year: "1999", file: "wc_1999" },
  { year: "2003", file: "wc_2002_2003" },
  { year: "2007", file: "wc_2006_2007" },
  { year: "2011", file: "wc_2010_2011" },
  { year: "2015", file: "wc_2014_2015" },
  { year: "2019", file: "wc_2019" },
  { year: "2023", file: "wc_2023" },
];

const basePath = "data/cricket/world-cup/scorecards/";
let battingRows = [];
let bowlingRows = [];

Promise.all(
  TOURNAMENTS.map(t =>
    fetch(`${basePath}${t.file}.json`)
      .then(r => r.json())
      .then(data => ({ t, matches: data.matches || [] }))
      .catch(() => ({ t, matches: [] }))
  )
).then(results => {
  results.forEach(({ t, matches }) => {
    matches.forEach(m => {
      const sc = m.scorecard;
      if (!sc || !sc.innings) return;
      sc.innings.forEach(inn => {
        // Batting
        inn.batting.forEach(b => {
          battingRows.push({
            player:   b.batsman,
            runs:     b.runs || 0,
            balls:    b.balls_faced,
            sr:       b.strike_rate,
            year:     t.year,
            file:     t.file,
            code:     m.match_code,
            match:    m.teams,
          });
        });
        // Bowling
        inn.bowling.forEach(b => {
          if ((b.wickets || 0) < 1) return;
          bowlingRows.push({
            player:   b.bowler,
            wickets:  b.wickets || 0,
            runs:     b.runs || 0,
            overs:    b.overs,
            econ:     b.economy,
            year:     t.year,
            file:     t.file,
            code:     m.match_code,
            match:    m.teams,
          });
        });
      });
    });
  });

  renderTable("batting");
});

function showTab(tab, e) {
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  renderTable(tab);
}

function matchLink(file, code) {
  return `cricket-wc-match.html?file=${encodeURIComponent(file)}&code=${encodeURIComponent(code)}`;
}

function renderTable(type) {
  const tbody = document.getElementById("recordsTable");
  tbody.innerHTML = "";

  if (type === "batting") {
    const sorted = [...battingRows].sort((a, b) => b.runs - a.runs).slice(0, 25);
    tbody.innerHTML = sorted.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${r.player}</td>
        <td><strong>${r.runs}</strong>${r.balls ? ' <small style="color:#888">(' + r.balls + 'b)</small>' : ''}</td>
        <td>${r.year}</td>
        <td>${r.match}</td>
        <td><a href="${matchLink(r.file, r.code)}">View</a></td>
      </tr>`).join("");
  }

  if (type === "bowling") {
    const sorted = [...bowlingRows].sort((a, b) => b.wickets - a.wickets || a.runs - b.runs).slice(0, 25);
    tbody.innerHTML = sorted.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${r.player}</td>
        <td><strong>${r.wickets}/${r.runs}</strong>${r.overs ? ' <small style="color:#888">(' + r.overs + ' ov)</small>' : ''}</td>
        <td>${r.year}</td>
        <td>${r.match}</td>
        <td><a href="${matchLink(r.file, r.code)}">View</a></td>
      </tr>`).join("");
  }
}
</script>
</body>
</html>
