<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst Race | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:900px;
  margin:auto;
  padding:25px;
}

/* NAV HEADER */
.nav-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.nav-header a{
  color:#0056d6;
  text-decoration:none;
  font-weight:600;
}

.nav-header a:hover{
  text-decoration:underline;
}

h1{
  margin:0;
  text-align:center;
  flex:1;
}

.table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
}

.table th{
  background:#002D72;
  color:#fff;
  padding:12px;
  text-align:left;
}

.table td{
  padding:12px;
}

.table tr:nth-child(even){
  background:#f2f6ff;
}

.driver{
  color:#0056d6;
  font-weight:600;
  text-decoration:none;
}

.driver:hover{
  text-decoration:underline;
}
</style>

</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./bathurst.html">Bathurst</a>
</div>

<div class="page">

  <!-- NAV HEADER -->
  <div class="nav-header">
    <a id="prev"></a>
    <h1 id="title">Loading...</h1>
    <a id="next"></a>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Position</th>
        <th>Driver(s)</th>
        <th>Car</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>

</div>

<script>

// -------------------------
// GET YEAR
// -------------------------
const params = new URLSearchParams(window.location.search);
let year = parseInt(params.get("year"));

if(!year || isNaN(year)){
  document.getElementById("title").textContent = "No year selected";
  throw new Error("Missing year parameter");
}

// -------------------------
// BUILD PREV/NEXT NAV
// -------------------------
fetch("/data/bathurst/index.json")
  .then(res => res.json())
  .then(index => {

    if(!Array.isArray(index)) return;

    const years = index.map(x => x.year).sort((a,b) => a - b);
    const i = years.indexOf(year);

    const prevYear = years[i - 1];
    const nextYear = years[i + 1];

    if(prevYear){
      const prev = document.getElementById("prev");
      prev.textContent = "← " + prevYear;
      prev.href = `./bathurst-race.html?year=${prevYear}`;
    }

    if(nextYear){
      const next = document.getElementById("next");
      next.textContent = nextYear + " →";
      next.href = `./bathurst-race.html?year=${nextYear}`;
    }

  });

// -------------------------
// LOAD RACE DATA
// -------------------------
fetch(`/data/bathurst/seasons/${year}.json`)
  .then(res => {
    if(!res.ok) throw new Error("Fetch failed");
    return res.json();
  })
  .then(data => {

    if(!data || !data.results){
      document.getElementById("title").textContent = "Race not found";
      return;
    }

    document.getElementById("title").textContent =
      `${year} Bathurst 1000`;

    const table = document.getElementById("results");
    table.innerHTML = "";

    // -------------------------
    // SORT RESULTS
    // -------------------------
    data.results.sort((a,b) => {

      const isNumA = !isNaN(a.position);
      const isNumB = !isNaN(b.position);

      if(isNumA && isNumB){
        return Number(a.position) - Number(b.position);
      }

      if(isNumA) return -1;
      if(isNumB) return 1;

      return 0;
    });

    // -------------------------
    // BUILD TABLE
    // -------------------------
    data.results.forEach(r => {

      if(!r.driver) return;

      const driverList = r.driver.split("/").map(d => d.trim());

      const drivers = driverList.map(name => {
        const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,"-");
        return `<a class="driver" href="./bathurst-driver.html?driver=${slug}">${name}</a>`;
      }).join(" / ");

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${r.position || ""}</td>
        <td>${drivers}</td>
        <td>${r.car || ""}</td>
      `;

      table.appendChild(tr);
    });

  })
  .catch(err => {
    document.getElementById("title").textContent = "Error loading race";
    console.error(err);
  });

</script>

</body>
</html>
