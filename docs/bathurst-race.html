<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst 1000 Race | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1100px;
  margin:auto;
  padding:25px;
}

h1{
  margin-bottom:10px;
}

.race-meta{
  margin-bottom:20px;
  color:#555;
}

.table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
}

.table th{
  background:#002D72;
  color:#fff;
  padding:12px;
  text-align:left;
}

.table td{
  padding:10px;
  border-bottom:1px solid #eee;
}

.table tr:nth-child(even){
  background:#f2f6ff;
}

.driver{
  color:#0056d6;
  font-weight:600;
  text-decoration:none;
}

.driver:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./bathurst.html">Bathurst</a>
</div>

<div class="page">

  <h1>2026 Bathurst 1000</h1>

  <div class="race-meta">
    Mount Panorama, Bathurst • 1000km • 161 laps
  </div>

  <!-- MERGED TABLE -->
  <table class="table">
    <thead>
      <tr>
        <th>Finish</th>
        <th>Grid</th>
        <th>Driver(s)</th>
        <th>Car</th>
        <th>Laps</th>
        <th>Time / Gap</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>

</div>

<script>

// 🔧 SAMPLE DATA STRUCTURE (replace with your JSON later)
const data = [
  {
    finish: 1,
    grid: 3,
    drivers: ["Driver One", "Driver Two"],
    car: "Ford Mustang",
    laps: 161,
    time: "6:12:34"
  },
  {
    finish: 2,
    grid: 1,
    drivers: ["Driver Three", "Driver Four"],
    car: "Chevrolet Camaro",
    laps: 161,
    time: "+5.3s"
  }
];

// build table
const table = document.getElementById("results");

data.forEach(row => {

  const tr = document.createElement("tr");

  const driverLinks = row.drivers.map(d => {
    const slug = d.toLowerCase().replace(/ /g,"-");
    return `<a class="driver" href="./bathurst-driver.html?driver=${slug}">${d}</a>`;
  }).join(" / ");

  tr.innerHTML = `
    <td>${row.finish}</td>
    <td>${row.grid}</td>
    <td>${driverLinks}</td>
    <td>${row.car}</td>
    <td>${row.laps}</td>
    <td>${row.time}</td>
  `;

  table.appendChild(tr);
});

</script>

</body>
</html>
