<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst Race | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}

.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}

.page{
  max-width:900px;
  margin:0 auto;
  padding:26px 20px 70px;
}

/* ── Hero / nav header ────────────────────────────────── */
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  padding:24px 28px;
}
.eyebrow{
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:14px;
  text-align:center;
}

.nav-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.nav-header a{
  color:rgba(255,255,255,.75);
  text-decoration:none;
  font-family:var(--body);
  font-weight:600;
  font-size:13px;
  white-space:nowrap;
  transition:color .15s;
}
.nav-header a:hover{ color:var(--accent); }
.nav-header a:empty{ visibility:hidden; }

h1{
  margin:0;
  text-align:center;
  flex:1;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(22px,4.5vw,32px);
  letter-spacing:.01em;
  text-transform:uppercase;
  color:#fff;
}

.table{
  width:100%;
  border-collapse:collapse;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}

.table th{
  background:#f7f9fb;
  color:var(--muted);
  padding:11px 14px;
  text-align:left;
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  border-bottom:1px solid var(--line);
}

.table td{
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  font-size:13.5px;
  color:#27313c;
  font-variant-numeric:tabular-nums;
}
.table td:first-child{
  font-weight:700;
  color:var(--ink);
}

.table tbody tr:last-child td{ border-bottom:none; }
.table tbody tr:hover td{ background:#f9fbfd; }

.driver{
  color:var(--ink);
  font-weight:600;
  text-decoration:none;
}

.driver:hover{
  color:var(--accent);
}
</style>

</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./bathurst.html">Bathurst</a>
</div>

<div class="page">

  <div class="hero">
    <div class="eyebrow">Bathurst 1000</div>
    <!-- NAV HEADER -->
    <div class="nav-header">
      <a id="prev"></a>
      <h1 id="title">Loading...</h1>
      <a id="next"></a>
    </div>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Position</th>
        <th>Driver(s)</th>
        <th>Car</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>

</div>

<script>

// -------------------------
// GET YEAR
// -------------------------
const params = new URLSearchParams(window.location.search);
let year = parseInt(params.get("year"));

if(!year || isNaN(year)){
  document.getElementById("title").textContent = "No year selected";
  throw new Error("Missing year parameter");
}

// -------------------------
// BUILD PREV/NEXT NAV
// -------------------------
fetch("/data/bathurst/index.json")
  .then(res => res.json())
  .then(index => {

    if(!Array.isArray(index)) return;

    const years = index.map(x => x.year).sort((a,b) => a - b);
    const i = years.indexOf(year);

    const prevYear = years[i - 1];
    const nextYear = years[i + 1];

    if(prevYear){
      const prev = document.getElementById("prev");
      prev.textContent = "← " + prevYear;
      prev.href = `./bathurst-race.html?year=${prevYear}`;
    }

    if(nextYear){
      const next = document.getElementById("next");
      next.textContent = nextYear + " →";
      next.href = `./bathurst-race.html?year=${nextYear}`;
    }

  });

// -------------------------
// LOAD RACE DATA
// -------------------------
fetch(`/data/bathurst/seasons/${year}.json`)
  .then(res => {
    if(!res.ok) throw new Error("Fetch failed");
    return res.json();
  })
  .then(data => {

    if(!data || !data.results){
      document.getElementById("title").textContent = "Race not found";
      return;
    }

    document.getElementById("title").textContent =
      `${year} Bathurst 1000`;

    const table = document.getElementById("results");
    table.innerHTML = "";

    // -------------------------
    // SORT RESULTS
    // -------------------------
    data.results.sort((a,b) => {

      const isNumA = !isNaN(a.position);
      const isNumB = !isNaN(b.position);

      if(isNumA && isNumB){
        return Number(a.position) - Number(b.position);
      }

      if(isNumA) return -1;
      if(isNumB) return 1;

      return 0;
    });

    // -------------------------
    // BUILD TABLE
    // -------------------------
    data.results.forEach(r => {

      if(!r.driver) return;

      const driverList = r.driver.split("/").map(d => d.trim());

      const drivers = driverList.map(name => {
        const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,"-");
        return `<a class="driver" href="./bathurst-driver.html?driver=${slug}">${name}</a>`;
      }).join(" / ");

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${r.position || ""}</td>
        <td>${drivers}</td>
        <td>${r.car || ""}</td>
      `;

      table.appendChild(tr);
    });

  })
  .catch(err => {
    document.getElementById("title").textContent = "Error loading race";
    console.error(err);
  });

</script>

</body>
</html>
