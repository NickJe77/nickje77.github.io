<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst Race | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:Inter,system-ui,Arial;
      margin:0;
      background:#f4f6f8;
    }

    .navbar{
      display:flex;
      justify-content:center;
      gap:24px;
      padding:16px 0;
      background:#fff;
      border-bottom:1px solid #ddd;
      font-weight:600;
    }

    .navbar a{
      text-decoration:none;
      color:#0056d6;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:10px;
    }

    h2{
      margin-top:30px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#fff;
      border-radius:10px;
      overflow:hidden;
    }

    th, td{
      padding:10px;
      text-align:left;
      font-size:14px;
    }

    th{
      background:#002D72;
      color:#fff;
    }

    tbody tr:nth-child(even){
      background:#f2f6ff;
    }

    tbody tr:hover{
      background:#e0ecff;
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="bathurst.html">Bathurst</a>
  <a href="/">Home</a>
</div>

<div class="container">
  <h1 id="title"></h1>

  <h2>Starting Grid</h2>
  <table>
    <thead>
      <tr>
        <th>Pos</th>
        <th>Driver(s)</th>
        <th>Team</th>
        <th>Car</th>
      </tr>
    </thead>
    <tbody id="grid"></tbody>
  </table>

  <h2>Race Results</h2>
  <table>
    <thead>
      <tr>
        <th>Pos</th>
        <th>Driver(s)</th>
        <th>Team</th>
        <th>Car</th>
        <th>Laps</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const year = params.get("year");

document.getElementById("title").innerText = year + " Bathurst 1000";

fetch(`data/bathurst/seasons/${year}.json`)
.then(res => res.json())
.then(data => {

  const grid = document.getElementById("grid");
  const results = document.getElementById("results");

  // GRID
  if(data.grid && data.grid.length){
    data.grid.forEach(g => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${g.grid || ""}</td>
        <td>${g.drivers || ""}</td>
        <td>${g.team || ""}</td>
        <td>${g.car || ""}</td>
      `;
      grid.appendChild(tr);
    });
  } else {
    grid.innerHTML = `<tr><td colspan="4">No grid data available</td></tr>`;
  }

  // RESULTS
  if(data.results && data.results.length){
    data.results.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.pos || ""}</td>
        <td>${r.drivers || ""}</td>
        <td>${r.team || ""}</td>
        <td>${r.car || ""}</td>
        <td>${r.laps || ""}</td>
      `;
      results.appendChild(tr);
    });
  } else {
    results.innerHTML = `<tr><td colspan="5">No results data available</td></tr>`;
  }

});
</script>

</body>
</html>
