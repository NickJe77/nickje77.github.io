<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>Bathurst Race | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Inter,system-ui,Arial;
  margin:0;
  background:#f4f6f8;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:16px 0;
  background:#fff;
  border-bottom:1px solid #ddd;
  font-weight:600;
}

.navbar a{
  color:#0056d6;
  text-decoration:none;
  font-size:18px;
}

.page{
  max-width:1100px;
  margin:auto;
  padding:25px;
}

.table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
}

.table th{
  background:#002D72;
  color:#fff;
  padding:12px;
  text-align:left;
}

.table td{
  padding:10px;
  border-bottom:1px solid #eee;
}

.table tr:nth-child(even){
  background:#f2f6ff;
}

.driver{
  color:#0056d6;
  font-weight:600;
  text-decoration:none;
}

.driver:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./bathurst.html">Bathurst</a>
</div>

<div class="page">

  <h1 id="title">Loading...</h1>

  <table class="table">
    <thead>
      <tr>
        <th>Finish</th>
        <th>Grid</th>
        <th>Driver(s)</th>
        <th>Car</th>
        <th>Laps</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>

</div>

<script>

// ✅ GET YEAR FROM URL
const params = new URLSearchParams(window.location.search);
const year = params.get("year") || "2026";

// ✅ IMPORTANT: use /data NOT /docs/data
const url = `/data/bathurst/${year}.json`;

fetch(url)
  .then(res => res.json())
  .then(data => {

    document.getElementById("title").textContent =
      `${data.year} Bathurst 1000`;

    const table = document.getElementById("results");

    data.results.forEach(row => {

      // 🔥 MULTI-DRIVER FIX
      const drivers = row.drivers.map(d => {
        const slug = d.toLowerCase().replace(/ /g, "-");
        return `<a class="driver" href="./bathurst-driver.html?driver=${slug}">${d}</a>`;
      }).join(" / ");

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${row.finish ?? ""}</td>
        <td>${row.grid ?? ""}</td>
        <td>${drivers}</td>
        <td>${row.car ?? ""}</td>
        <td>${row.laps ?? ""}</td>
      `;

      table.appendChild(tr);
    });

  })
  .catch(err => {
    document.getElementById("title").textContent = "Race not found";
    console.error(err);
  });

</script>

</body>
</html>
