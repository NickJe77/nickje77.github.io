<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Season Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#fff;color:#1f2937;}
.navbar{display:flex;justify-content:center;gap:24px;padding:16px 0;border-bottom:1px solid #ddd;font-weight:700;background:#fff;}
.navbar a{color:#0056d6;text-decoration:none;font-size:18px;}
.navbar a:hover{text-decoration:underline;}
.page-wrap{max-width:1200px;margin:auto;padding:30px 20px 60px;}
.hero{background:linear-gradient(90deg,#17408B,#C9082A);color:white;padding:26px 28px 22px;border-radius:16px;margin-bottom:24px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,0.08);}
.hero h1{margin:0;font-size:32px;}
.controls{display:flex;justify-content:center;margin-bottom:22px;}
input{padding:10px 14px;border-radius:10px;border:1px solid #d1d5db;font-size:14px;min-width:280px;}
.table-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,0.05);}
table{width:100%;border-collapse:collapse;}
th,td{padding:11px 12px;border-bottom:1px solid #e5e7eb;text-align:left;}
th{background:#17408B;color:white;font-size:14px;font-weight:700;}
td{font-size:15px;}
tr:nth-child(even){background:#f8faff;}
tr:hover{background:#e9f0ff;}
.player-link{color:#0056d6;text-decoration:none;font-weight:700;}
.player-link:hover{text-decoration:underline;}
.avg{color:#666;font-size:12px;margin-left:4px;}
.loading{padding:20px;text-align:center;color:#666;}
</style>
</head>
<body>

<div class="navbar">
  <a href="/">Home</a>
  <a href="/nba.html">NBA</a>
</div>

<div class="page-wrap">
  <div class="hero">
    <h1>NBA Season Leaders</h1>
  </div>
  <div class="controls">
    <input id="search" placeholder="Search player or season...">
  </div>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Season</th>
          <th>Points</th>
          <th>Rebounds</th>
          <th>Assists</th>
          <th>Steals</th>
          <th>Blocks</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";

const rowsEl  = document.getElementById("rows");
const searchEl= document.getElementById("search");

let allLeaders = [];

function playerCell(stat){
  if(!stat || !stat.player) return "–";
  return `
    <a class="player-link" href="/nba-player.html?id=${encodeURIComponent(stat.player_id)}">
      ${stat.player}
    </a>
    <span class="avg">${stat.avg} avg</span>
  `;
}

function render(){
  const needle = (searchEl.value || "").toLowerCase();
  rowsEl.innerHTML = "";

  const filtered = needle
    ? allLeaders.filter(s => JSON.stringify(s).toLowerCase().includes(needle))
    : allLeaders;

  if(!filtered.length){
    rowsEl.innerHTML = `<tr><td colspan="6" class="loading">No results found.</td></tr>`;
    return;
  }

  filtered.forEach(s => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${parseInt(s.season)-1}-${s.season}</td>
      <td>${playerCell(s.points)}</td>
      <td>${playerCell(s.rebounds)}</td>
      <td>${playerCell(s.assists)}</td>
      <td>${playerCell(s.steals)}</td>
      <td>${playerCell(s.blocks)}</td>
    `;
    rowsEl.appendChild(tr);
  });
}

async function load(){
  try{
    const seasons = Array.from({length: 50}, (_,i) => 1977 + i);

    const results = await Promise.allSettled(
      seasons.map(s =>
        fetch(`${R2}/basketball/leaders/${s}.json`)
          .then(r => r.ok ? r.json() : null)
          .catch(() => null)
      )
    );

    allLeaders = results
      .filter(r => r.status === "fulfilled" && r.value)
      .map(r => r.value)
      .sort((a,b) => b.season - a.season);

    render();
  }catch(e){
    rowsEl.innerHTML = `<tr><td colspan="6" class="loading">Unable to load data.</td></tr>`;
  }
}

searchEl.addEventListener("input", render);
load();
</script>
</body>
</html>
