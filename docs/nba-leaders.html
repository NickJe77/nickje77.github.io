<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Inter,system-ui,Arial;margin:0;background:#fff;}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

h1{text-align:center;margin-bottom:20px;}

.controls{text-align:center;margin-bottom:18px;}

input{
padding:8px 12px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
min-width:260px;
}

table{width:100%;border-collapse:collapse;}

th,td{
border-bottom:1px solid #ddd;
padding:8px 10px;
text-align:left;
}

th{background:#f0f0f0;}

tr:nth-child(even){background:#f6f9ff;}

.player-link{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

.stat{white-space:nowrap;}
</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<h1>NBA Season Leaders</h1>

<div class="controls">
<input id="search" placeholder="Search player or season">
</div>

<table>
<thead>
<tr>
<th>Season</th>
<th>Points</th>
<th>Rebounds</th>
<th>Assists</th>
<th>Steals</th>
<th>Blocks</th>
</tr>
</thead>

<tbody id="rows">
<tr><td colspan="6">Loading...</td></tr>
</tbody>

</table>

</div>

<script>

const rows=document.getElementById("rows");
const search=document.getElementById("search");

let seasons=[];

async function load(){

const index=await fetch("/data/nba/seasons/index.json").then(r=>r.json());

for(const season of index.seasons){

const data=await fetch(`/data/nba/seasons/${season}.json`).then(r=>r.json());

const players={};

data.games.forEach(g=>{

g.players.forEach(p=>{

if(!players[p.player]) players[p.player]={pts:0,reb:0,ast:0,stl:0,blk:0};

players[p.player].pts+=p.points||0;
players[p.player].reb+=p.rebounds||0;
players[p.player].ast+=p.assists||0;
players[p.player].stl+=p.steals||0;
players[p.player].blk+=p.blocks||0;

});

});

function leader(stat){

let bestPlayer="";
let best=0;

Object.entries(players).forEach(([name,stats])=>{

if(stats[stat]>best){

best=stats[stat];
bestPlayer=name;

}

});

return {player:bestPlayer,value:best};

}

seasons.push({
season,
points:leader("pts"),
rebounds:leader("reb"),
assists:leader("ast"),
steals:leader("stl"),
blocks:leader("blk")
});

}

seasons.sort((a,b)=>b.season-a.season);

render();

}

function playerCell(stat){

return `
<a class="player-link"
href="nba-player.html?player=${encodeURIComponent(stat.player)}">
${stat.player}
</a> (${stat.value})
`;

}

function render(){

const needle=(search.value||"").toLowerCase();

rows.innerHTML="";

seasons.forEach(s=>{

const text=JSON.stringify(s).toLowerCase();

if(needle && !text.includes(needle)) return;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${s.season}</td>
<td class="stat">${playerCell(s.points)}</td>
<td class="stat">${playerCell(s.rebounds)}</td>
<td class="stat">${playerCell(s.assists)}</td>
<td class="stat">${playerCell(s.steals)}</td>
<td class="stat">${playerCell(s.blocks)}</td>
`;

rows.appendChild(tr);

});

}

search.addEventListener("input",render);

load();

</script>

</body>
</html>
