<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Season Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#fff;
}

.navbar{
display:flex;
justify-content:center;
gap:22px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:600;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.page-wrap{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.controls{
text-align:center;
margin-bottom:18px;
}

input{
padding:8px 12px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
min-width:260px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border-bottom:1px solid #ddd;
padding:8px 10px;
text-align:left;
}

th{
background:#f0f0f0;
}

tr:nth-child(even){
background:#f6f9ff;
}

.player-link{
color:#0056d6;
text-decoration:none;
font-weight:600;
}

.player-link:hover{
text-decoration:underline;
}

.stat{
white-space:nowrap;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<h1>NBA Season Leaders</h1>

<div class="controls">
<input id="search" placeholder="Search player or season">
</div>

<table>

<thead>
<tr>
<th>Season</th>
<th>Points</th>
<th>Rebounds</th>
<th>Assists</th>
<th>Steals</th>
<th>Blocks</th>
<th>3PT</th>
<th>FT</th>
</tr>
</thead>

<tbody id="rows">
<tr><td colspan="8">Loading...</td></tr>
</tbody>

</table>

</div>

<script>

const rows=document.getElementById("rows");
const search=document.getElementById("search");

let data=[];

async function load(){

try{

data=await fetch("/data/nba/leaders.json").then(r=>r.json());

data.sort((a,b)=>b.season.localeCompare(a.season));

render();

}catch(e){

rows.innerHTML="<tr><td colspan='8'>Unable to load data</td></tr>";

}

}

function playerCell(stat){

if(!stat)return "";

return `
<a class="player-link"
href="nba-player.html?player=${encodeURIComponent(stat.player)}">
${stat.player}
</a> (${stat.value})
`;

}

function render(){

const needle=(search.value||"").toLowerCase();

rows.innerHTML="";

data.forEach(season=>{

const text=JSON.stringify(season).toLowerCase();

if(needle && !text.includes(needle)) return;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${season.season}</td>

<td class="stat">${playerCell(season.points)}</td>

<td class="stat">${playerCell(season.rebounds)}</td>

<td class="stat">${playerCell(season.assists)}</td>

<td class="stat">${playerCell(season.steals)}</td>

<td class="stat">${playerCell(season.blocks)}</td>

<td class="stat">${playerCell(season.threes)}</td>

<td class="stat">${playerCell(season.ft)}</td>

`;

rows.appendChild(tr);

});

}

search.addEventListener("input",render);

load();

</script>

</body>
</html>
