<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>NBA Season Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

.navbar{
  display:flex;justify-content:center;gap:22px;padding:15px;
  background:var(--surface);border-bottom:1px solid var(--line);
  font-weight:600;font-size:13.5px;
}
.navbar a{text-decoration:none;color:var(--ink);opacity:.7;transition:opacity .15s,color .15s;}
.navbar a:hover,.navbar a[aria-current="page"]{opacity:1;color:var(--accent);}

.page-wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px;}

.hero{
  position:relative;background:linear-gradient(160deg,var(--board-2),var(--board));
  border-radius:var(--radius);overflow:hidden;color:#fff;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  margin-bottom:24px;padding:28px 30px;text-align:center;
}
.eyebrow{
  font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.5vw,34px);
  letter-spacing:.01em;text-transform:uppercase;color:#fff;
}

.controls{display:flex;justify-content:center;margin-bottom:22px;}
input{
  padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink);min-width:280px;
}
input:hover{border-color:var(--faint);}
input:focus{outline:none;border-color:var(--accent);}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{
  background:#f7f9fb;color:var(--muted);padding:11px 14px;text-align:left;
  font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid var(--line);
}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;color:#27313c;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f9fbfd;}
.player-link{color:var(--ink);text-decoration:none;font-weight:700;}
.player-link:hover{color:var(--accent);}
.avg{color:var(--muted);font-size:12px;margin-left:4px;}
.loading{padding:20px;text-align:center;color:var(--muted);font-style:italic;}
</style>
</head>
<body>
<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./on-this-day.html">On This Day</a>
  <a href="./racing.html">Racing</a>
  <a href="./afl.html">AFL</a>
  <a href="./nrl.html">NRL</a>
  <a href="./football.html">Football</a>
  <a href="./cricket.html">Cricket</a>
  <a href="./baseball.html">Baseball</a>
  <a href="./f1.html">F1</a>
  <a href="./nba.html">NBA</a>
  <a href="./nhl.html">NHL</a>
  <a href="./ufc.html">UFC</a>
  <a href="./nfl.html">NFL</a>
  <a href="./tennis.html">Tennis</a>
  <a href="./olympics.html">Olympics</a>
</div>
<div class="page-wrap">
  <div class="hero">
    <span class="eyebrow">NBA</span>
    <h1>NBA Season Leaders</h1>
  </div>
  <div class="controls">
    <input id="search" placeholder="Search player or season...">
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Season</th>
          <th>Points</th>
          <th>Rebounds</th>
          <th>Assists</th>
          <th>Steals</th>
          <th>Blocks</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
const R2 = "https://pub-68c8b4322a9d4d7f9b875047b45ac7c6.r2.dev";
const rowsEl   = document.getElementById("rows");
const searchEl = document.getElementById("search");
let allLeaders = [];

function fixName(str){
  if(!str) return str;
  try{
    const bytes = new Uint8Array(str.length);
    for(let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xff;
    const decoded = new TextDecoder('utf-8').decode(bytes);
    if(decoded.includes('\ufffd')) return str;
    return decoded;
  }catch(e){ return str; }
}

function playerCell(stat){
  if(!stat || !stat.player) return "–";
  return `
    <a class="player-link" href="/nba-player.html?id=${encodeURIComponent(stat.player_id)}">
      ${fixName(stat.player)}
    </a>
    <span class="avg">${stat.avg} avg</span>
  `;
}

function render(){
  const needle = (searchEl.value || "").toLowerCase();
  rowsEl.innerHTML = "";
  const filtered = needle
    ? allLeaders.filter(s => JSON.stringify(s).toLowerCase().includes(needle))
    : allLeaders;
  if(!filtered.length){
    rowsEl.innerHTML = `<tr><td colspan="6" class="loading">No results found.</td></tr>`;
    return;
  }
  filtered.forEach(s => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${parseInt(s.season)-1}-${s.season}</td>
      <td>${playerCell(s.points)}</td>
      <td>${playerCell(s.rebounds)}</td>
      <td>${playerCell(s.assists)}</td>
      <td>${playerCell(s.steals)}</td>
      <td>${playerCell(s.blocks)}</td>
    `;
    rowsEl.appendChild(tr);
  });
}

async function load(){
  try{
    const seasons = Array.from({length: 50}, (_,i) => 1977 + i);
    const results = await Promise.allSettled(
      seasons.map(s =>
        fetch(`${R2}/basketball/leaders/${s}.json`)
          .then(r => r.ok ? r.json() : null)
          .catch(() => null)
      )
    );
    allLeaders = results
      .filter(r => r.status === "fulfilled" && r.value)
      .map(r => r.value)
      .sort((a,b) => b.season - a.season);
    render();
  }catch(e){
    rowsEl.innerHTML = `<tr><td colspan="6" class="loading">Unable to load data.</td></tr>`;
  }
}

searchEl.addEventListener("input", render);
load();
</script>
</body>
</html>
