<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA League Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Inter,system-ui,Arial,sans-serif;
margin:0;
background:#fff;
color:#1f2937;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:center;
gap:24px;
padding:16px 0;
border-bottom:1px solid #ddd;
font-weight:700;
background:#fff;
}

.navbar a{
color:#0056d6;
text-decoration:none;
font-size:18px;
}

.navbar a:hover{
text-decoration:underline;
}

/* PAGE */

.page-wrap{
max-width:1200px;
margin:auto;
padding:30px 20px 60px;
}

/* HERO */

.hero{
background:linear-gradient(90deg,#17408B,#C9082A);
color:white;
padding:26px 28px 22px;
border-radius:16px;
margin-bottom:24px;
text-align:center;
box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.hero h1{
margin:0;
font-size:32px;
}

/* SEARCH */

.controls{
display:flex;
justify-content:center;
margin-bottom:22px;
}

input{
padding:10px 14px;
border-radius:10px;
border:1px solid #d1d5db;
font-size:14px;
min-width:280px;
}

/* TABLE CARD */

.table-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
overflow:hidden;
box-shadow:0 6px 16px rgba(0,0,0,0.05);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:11px 12px;
border-bottom:1px solid #e5e7eb;
text-align:left;
}

th{
background:#17408B;
color:white;
font-size:14px;
font-weight:700;
}

td{
font-size:15px;
}

tr:nth-child(even){
background:#f8faff;
}

tr:hover{
background:#e9f0ff;
}

.player-link{
color:#0056d6;
text-decoration:none;
font-weight:700;
}

.player-link:hover{
text-decoration:underline;
}

.stat{
white-space:nowrap;
}

.loading{
padding:20px;
text-align:center;
}

</style>
</head>

<body>

<div class="navbar">
<a href="index.html">Home</a>
<a href="nba.html">NBA</a>
</div>

<div class="page-wrap">

<div class="hero">
<h1>NBA Season Leaders</h1>
</div>

<div class="controls">
<input id="search" placeholder="Search player or season">
</div>

<div class="table-card">

<table>

<thead>
<tr>
<th>Season</th>
<th>Points</th>
<th>Rebounds</th>
<th>Assists</th>
<th>Steals</th>
<th>Blocks</th>
</tr>
</thead>

<tbody id="rows">
<tr><td colspan="6" class="loading">Loading...</td></tr>
</tbody>

</table>

</div>

</div>

<script>

const rows=document.getElementById("rows");
const search=document.getElementById("search");

let leaders=[];

async function load(){

try{

const res=await fetch("/data/nba/leaders.json");
leaders=await res.json();

/* CLEAN BAD DATA */

leaders = leaders
.map(s=>{

let yr=parseInt(s.season);

if(yr>3000){
yr=parseInt(String(yr).slice(-4));
}

s.season=yr;

return s;

})
.filter(s=>{

if(s.season < 1976) return false;

if(!s.points?.player &&
   !s.rebounds?.player &&
   !s.assists?.player &&
   !s.steals?.player &&
   !s.blocks?.player) return false;

return true;

});

leaders.sort((a,b)=>b.season-a.season);

render();

}catch(e){

rows.innerHTML="<tr><td colspan='6'>Unable to load data</td></tr>";

}

}

function playerCell(stat){

if(!stat || !stat.player) return "";

return `
<a class="player-link"
href="nba-player.html?player=${encodeURIComponent(stat.player)}">
${stat.player}
</a> (${stat.value})
`;

}

function render(){

const needle=(search.value||"").toLowerCase();

rows.innerHTML="";

leaders.forEach(s=>{

const text=JSON.stringify(s).toLowerCase();

if(needle && !text.includes(needle)) return;

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${s.season}</td>

<td class="stat">${playerCell(s.points)}</td>

<td class="stat">${playerCell(s.rebounds)}</td>

<td class="stat">${playerCell(s.assists)}</td>

<td class="stat">${playerCell(s.steals)}</td>

<td class="stat">${playerCell(s.blocks)}</td>

`;

rows.appendChild(tr);

});

}

search.addEventListener("input",render);

load();

</script>

</body>
</html>
