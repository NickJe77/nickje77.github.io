<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
<meta charset="UTF-8">
<title>IPL All-Time Leaders | The Sporting Almanac</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}

.page-wrap{
  max-width:1200px;
  margin:0 auto;
  padding:26px 20px 70px;
}

/* ── Hero ─────────────────────────────────────────────── */
.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  padding:32px 34px;
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
}
.eyebrow{
  display:block;
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.hero h1{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(26px,5vw,38px);
  letter-spacing:.01em;
  text-transform:uppercase;
}
.hero p{
  margin-top:10px;
  font-size:14px;
  color:rgba(255,255,255,.75);
  font-weight:600;
}

/* ── Tabs ─────────────────────────────────────────────── */
.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:20px;
}
.tab{
  padding:8px 16px;
  border-radius:999px;
  border:1px solid var(--line);
  cursor:pointer;
  background:var(--surface);
  color:var(--muted);
  font-family:var(--body);
  font-weight:600;
  font-size:12.5px;
  transition:background .15s,color .15s,border-color .15s;
}
.tab:hover{ border-color:var(--faint); color:var(--ink); }
.tab.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

/* ── Table ────────────────────────────────────────────── */
table{
  width:100%;
  border-collapse:collapse;
  font-size:13.5px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
}
th,td{
  border-bottom:1px solid var(--line);
  padding:11px 14px;
  text-align:left;
}
th{
  background:#f7f9fb;
  color:var(--muted);
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
}
td{
  color:#27313c;
  font-variant-numeric:tabular-nums;
}
td:first-child{
  font-weight:700;
  color:var(--accent);
  text-align:center;
  width:40px;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f0f6ff;}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="racing.html">Racing</a>
  <a href="afl.html">AFL</a>
  <a href="football.html">Football</a>
  <a href="cricket.html">Cricket</a>
</div>

<div class="page-wrap">

<div class="hero">
  <span class="eyebrow">Cricket · IPL</span>
  <h1>All-Time Leaders</h1>
  <p>Top 10 players in major statistical categories.</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('runs',this)">Run Scorers</button>
  <button class="tab" onclick="showTab('wickets',this)">Wicket Takers</button>
  <button class="tab" onclick="showTab('fielding',this)">Fielders</button>
  <button class="tab" onclick="showTab('sr',this)">Strike Rate (20+ matches)</button>
</div>

<table>
<thead>
<tr><th>Rank</th><th>Player</th><th>Stat</th></tr>
</thead>
<tbody id="leaderTable"></tbody>
</table>

</div>

<script>
const indexUrl="/data/ipl/index.json";
const basePath="/data/ipl/";
const nameMapUrl="/data/ipl/player-names.json";

const batting={}, bowling={}, fielding={}, matchesPlayed={};
let leaders={};
let nameMap={};

fetch(nameMapUrl)
  .then(r => r.ok ? r.json() : {})
  .catch(() => ({}))
  .then(names => {
    nameMap = names || {};
    return fetch(indexUrl).then(r=>r.json());
  })
  .then(files=>Promise.all(files.map(f=>fetch(basePath+f).then(r=>r.json()))))
  .then(seasons=>{
    seasons.forEach(matches=>{
      matches.forEach(match=>{
        match.innings.forEach(inn=>{
          inn.overs.forEach(over=>{
            over.deliveries.forEach(d=>{
              const batter=d.batter;
              const bowler=d.bowler;

              batting[batter]=batting[batter]||{runs:0,balls:0};
              batting[batter].runs+=d.runs.batter;
              batting[batter].balls++;

              matchesPlayed[batter]=matchesPlayed[batter]||new Set();
              matchesPlayed[batter].add(match.file);

              if(d.wickets){
                d.wickets.forEach(w=>{
                  bowling[bowler]=(bowling[bowler]||0)+1;
                  if(w.kind==="caught"||w.kind==="run out"){
                    const f=w.fielders?.[0]?.name;
                    if(f) fielding[f]=(fielding[f]||0)+1;
                  }
                });
              }
            });
          });
        });
      });
    });

    leaders.runs=Object.entries(batting)
      .sort((a,b)=>b[1].runs-a[1].runs)
      .slice(0,10)
      .map(([p,v],i)=>[i+1,playerLink(p),v.runs]);

    leaders.wickets=Object.entries(bowling)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,10)
      .map(([p,v],i)=>[i+1,playerLink(p),v]);

    leaders.fielding=Object.entries(fielding)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,10)
      .map(([p,v],i)=>[i+1,playerLink(p),v]);

    leaders.sr=[];
    Object.keys(batting).forEach(p=>{
      const games=matchesPlayed[p]?.size||0;
      if(games>=20){
        const sr=(batting[p].runs/batting[p].balls)*100;
        leaders.sr.push([p,sr]);
      }
    });
    leaders.sr.sort((a,b)=>b[1]-a[1]);
    leaders.sr=leaders.sr.slice(0,10)
      .map((x,i)=>[i+1,playerLink(x[0]),x[1].toFixed(1)]);

    render("runs");
  });

function fullName(name){
  if (!name) return name;

  const slug = name
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, "")
    .trim()
    .replace(/\s+/g, "-");

  return nameMap[slug] || name;
}

function slugify(name){
  return name
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, "")
    .trim()
    .replace(/\s+/g, "-");
}

function playerLink(name){
  const slug = slugify(name);
  return `<a href="ipl-player.html?player=${slug}" style="color:var(--ink);text-decoration:none;font-weight:700;">${fullName(name)}</a>`;
}

function showTab(type,btn){
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render(type);
}

function render(type){
  const tbody=document.getElementById("leaderTable");
  tbody.innerHTML="";
  leaders[type].forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td>`;
    tbody.appendChild(tr);
  });
}
</script>

</body>
</html>
