<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/analytics.js"></script>
  <meta charset="UTF-8">
  <title>NASCAR Race | The Sporting Almanac</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --ink:#0f141a;
  --muted:#69727c;
  --faint:#9aa3ad;
  --line:#e3e8ee;
  --board:#0c130f;
  --board-2:#161f16;
  --accent:#c99a3d;
  --accent-soft:rgba(201,154,61,.16);
  --display:'Oswald',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  font-family:var(--body);
  margin:0;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.navbar{
  display:flex;
  justify-content:center;
  gap:22px;
  padding:15px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  font-weight:600;
  font-size:13.5px;
}
.navbar a{
  color:var(--ink);
  text-decoration:none;
  opacity:.7;
  transition:opacity .15s,color .15s;
}
.navbar a:hover,.navbar a[aria-current="page"]{
  opacity:1;
  color:var(--accent);
}

.page{
  max-width:1000px;
  margin:0 auto;
  padding:26px 20px 70px;
}

.hero{
  position:relative;
  background:linear-gradient(160deg,var(--board-2),var(--board));
  color:#fff;
  border-radius:var(--radius);
  margin-bottom:22px;
  box-shadow:0 18px 40px -18px rgba(10,16,24,.55);
  padding:24px 28px;
}
.eyebrow{
  font-family:var(--body);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:14px;
  text-align:center;
}
.nav-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.nav-header a{
  color:rgba(255,255,255,.75);
  text-decoration:none;
  font-family:var(--body);
  font-weight:600;
  font-size:13px;
  white-space:nowrap;
  transition:color .15s;
}
.nav-header a:hover{ color:var(--accent); }
.nav-header a:empty{ visibility:hidden; }
h1{
  margin:0;
  text-align:center;
  flex:1;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(20px,4vw,28px);
  letter-spacing:.01em;
  text-transform:uppercase;
  color:#fff;
}
.race-meta{
  text-align:center;
  color:rgba(255,255,255,.65);
  font-size:12.5px;
  margin-top:10px;
}

.table-wrap{
  overflow-x:auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
}
.table{
  width:100%;
  border-collapse:collapse;
}
.table th{
  background:#f7f9fb;
  color:var(--muted);
  padding:11px 14px;
  text-align:left;
  font-family:var(--body);
  font-weight:600;
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.table td{
  padding:11px 14px;
  border-bottom:1px solid var(--line);
  font-size:13.5px;
  color:#27313c;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.table td:first-child{
  font-weight:700;
  color:var(--ink);
}
.table tbody tr:last-child td{ border-bottom:none; }
.table tbody tr:hover td{ background:#f9fbfd; }

.driver{
  color:var(--ink);
  font-weight:600;
  text-decoration:none;
  white-space:nowrap;
}
.driver:hover{ color:var(--accent); }

.loading{
  text-align:center;
  color:var(--muted);
  font-style:italic;
  padding:20px;
}
</style>

</head>

<body>

<div class="navbar">
  <a href="./index.html">Home</a>
  <a href="./racing.html">Racing</a>
  <a href="./nascar.html">NASCAR</a>
</div>

<div class="page">

  <div class="hero">
    <div class="eyebrow">NASCAR Cup Series</div>
    <div class="nav-header">
      <a id="prev"></a>
      <h1 id="title">Loading...</h1>
      <a id="next"></a>
    </div>
    <div class="race-meta" id="race-meta"></div>
  </div>

  <div class="table-wrap">
  <table class="table">
    <thead>
      <tr>
        <th>Fin</th>
        <th>St</th>
        <th>#</th>
        <th>Driver</th>
        <th>Sponsor</th>
        <th>Make</th>
        <th>Laps</th>
        <th>Led</th>
        <th>Status</th>
        <th>Pts</th>
      </tr>
    </thead>
    <tbody id="results">
      <tr><td colspan="10" class="loading">Loading results...</td></tr>
    </tbody>
  </table>
  </div>

</div>

<script>

// -------------------------
// GET YEAR + RACE FROM URL
// -------------------------
const params = new URLSearchParams(window.location.search);
const year = parseInt(params.get("year"));
const raceNum = params.get("race");

if(!year || isNaN(year) || !raceNum){
  document.getElementById("title").textContent = "No race selected";
  throw new Error("Missing year or race parameter");
}

function driverLink(name){
  if(!name) return "";
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,"-");
  return `<a class="driver" href="./nascar-driver.html?driver=${slug}">${name}</a>`;
}

// -------------------------
// LOAD SEASON DATA (season file contains every race, incl. this one)
// -------------------------
fetch(`/data/nascar/nascar_${year}.json`)
  .then(res => {
    if(!res.ok) throw new Error("Fetch failed");
    return res.json();
  })
  .then(data => {
    if(!data || !Array.isArray(data.races)){
      document.getElementById("title").textContent = "Season not found";
      return;
    }

    const races = data.races;
    const idx = races.findIndex(r => String(r.race_num) === String(raceNum));
    const race = races[idx];

    if(!race){
      document.getElementById("title").textContent = "Race not found";
      return;
    }

    // Prev/next race within the same season
    const prevRace = races[idx - 1];
    const nextRace = races[idx + 1];
    if(prevRace){
      const prev = document.getElementById("prev");
      prev.textContent = "← Race " + prevRace.race_num;
      prev.href = `./nascar-race.html?year=${year}&race=${prevRace.race_num}`;
    }
    if(nextRace){
      const next = document.getElementById("next");
      next.textContent = "Race " + nextRace.race_num + " →";
      next.href = `./nascar-race.html?year=${year}&race=${nextRace.race_num}`;
    }

    document.getElementById("title").textContent =
      race.info && race.info.title ? race.info.title : `${year} — Race ${race.race_num}`;
    document.getElementById("race-meta").textContent =
      [race.date, race.track_text].filter(Boolean).join(" — ");

    const tbody = document.getElementById("results");
    tbody.innerHTML = "";

    if(!Array.isArray(race.results) || race.results.length === 0){
      tbody.innerHTML = '<tr><td colspan="10" class="loading">No results recorded for this race.</td></tr>';
      return;
    }

    race.results.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r["Fin"] || ""}</td>
        <td>${r["St"] || ""}</td>
        <td>${r["#"] || ""}</td>
        <td>${driverLink(r["Driver"])}</td>
        <td>${r["Sponsor"] || ""}</td>
        <td>${r["Make"] || ""}</td>
        <td>${r["Laps"] || ""}</td>
        <td>${r["Led"] || ""}</td>
        <td>${r["Status"] || ""}</td>
        <td>${r["Pts"] || ""}</td>
      `;
      tbody.appendChild(tr);
    });
  })
  .catch(err => {
    document.getElementById("title").textContent = "Error loading race";
    console.error(err);
  });

</script>

</body>
</html>
