name: Fix 2026 Events

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # -------------------------
      # RUN SCRIPT
      # -------------------------
      - name: Fix events
        run: |
          python scripts/fix_2026_events.py

      # -------------------------
      # COMMIT CHANGES
      # -------------------------
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/baseball/boxscores/2026
          git commit -m "Fix 2026 events format" || echo "No changes"
          git push
