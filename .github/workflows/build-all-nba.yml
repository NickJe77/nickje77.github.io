name: Build All-NBA Teams
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests beautifulsoup4 lxml boto3

      - name: Scrape All-NBA teams
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python << 'PYEOF'
          import boto3
          import json
          import os
          import re
          import time
          import random
          import requests
          from bs4 import BeautifulSoup
          from botocore.config import Config

          r2 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4"),
              region_name="auto",
          )

          BUCKET  = "sporting-almanac-data"
          HEADERS = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"}

          NAME_FIX = {
              "doncilu01": "Luka Dončić",
              "jokicni01": "Nikola Jokić",
              "bogdaibo01": "Bogdan Bogdanović",
              "vucevni01": "Nikola Vučević",
              "porzikri01": "Kristaps Porziņģis",
              "nurkiju01": "Jusuf Nurkić",
              "saricda01": "Dario Šarić",
              "hezonja01": "Mario Hezonja",
              "sengual01": "Alperen Şengün",
              "wembavi01": "Victor Wembanyama",
              "topicni01": "Nikola Topić",
              "zubaciv01": "Ivica Zubac",
              "avdijade01": "Deni Avdija",
          }

          def td_int(row, stat):
              td = row.find("td", {"data-stat": stat})
              if not td:
                  return 0
              try:
                  return int(td.get_text(strip=True))
              except:
                  return 0

          all_seasons = []

          for year in range(1976, 2027):
              print(f"Scraping {year}...", flush=True)
              time.sleep(random.uniform(4, 7))
              try:
                  url  = f"https://www.basketball-reference.com/awards/awards_{year}.html"
                  resp = requests.get(url, headers=HEADERS, timeout=30)
                  resp.raise_for_status()
                  html = resp.text
                  html = re.sub(r'<!--(.*?)-->', lambda m: m.group(1) if '<table' in m.group(1) else m.group(0), html, flags=re.DOTALL)
                  soup = BeautifulSoup(html, "lxml")

                  season_data = {"season": year, "teams": []}

                  for table in soup.find_all("table"):
                      cap = table.find("caption")
                      if not cap:
                          continue
                      cap_text = cap.get_text()
                      if "All-NBA" not in cap_text or "Defensive" in cap_text or "Rookie" in cap_text:
                          continue

                      tbody = table.find("tbody")
                      if not tbody:
                          continue

                      # Collect all players with their vote counts
                      all_players = []
                      for row in tbody.find_all("tr"):
                          if "thead" in row.get("class", []):
                              continue
                          player_td = row.find("td", {"data-stat": "player"})
                          if not player_td:
                              continue
                          name = player_td.get_text(strip=True)
                          if not name:
                              continue

                          pid = ""
                          link = player_td.find("a")
                          if link:
                              m = re.search(r"/players/\w/(\w+)\.html", link.get("href",""))
                              if m:
                                  pid = m.group(1)

                          pos_td = row.find("td", {"data-stat": "pos"})
                          pos = pos_td.get_text(strip=True) if pos_td else ""

                          v1 = td_int(row, "first_team_votes")
                          v2 = td_int(row, "second_team_votes")
                          v3 = td_int(row, "third_team_votes")

                          if v1 == 0 and v2 == 0 and v3 == 0:
                              continue

                          if pid in NAME_FIX:
                              name = NAME_FIX[pid]

                          all_players.append({
                              "player": name, "player_id": pid, "pos": pos,
                              "v1": v1, "v2": v2, "v3": v3
                          })

                      # Assign each player to their best team
                      # Sort each team's candidates by that team's votes desc, take top 5
                      team1 = sorted([p for p in all_players if p["v1"] > p["v2"] and p["v1"] > p["v3"] and p["v1"] > 0],
                                     key=lambda x: x["v1"], reverse=True)[:5]
                      team1_ids = {p["player_id"] for p in team1}

                      team2 = sorted([p for p in all_players if p["player_id"] not in team1_ids and p["v2"] >= p["v3"] and p["v2"] > 0],
                                     key=lambda x: x["v2"], reverse=True)[:5]
                      team2_ids = team1_ids | {p["player_id"] for p in team2}

                      team3 = sorted([p for p in all_players if p["player_id"] not in team2_ids and p["v3"] > 0],
                                     key=lambda x: x["v3"], reverse=True)[:5]

                      def clean(players):
                          return [{"player": p["player"], "player_id": p["player_id"], "pos": p["pos"]} for p in players]

                      for num, team in [(1, team1), (2, team2), (3, team3)]:
                          if team:
                              label = f"{num}{'st' if num==1 else 'nd' if num==2 else 'rd'} Team"
                              season_data["teams"].append({"team": label, "players": clean(team)})

                      break

                  if season_data["teams"]:
                      all_seasons.append(season_data)
                      print(f"  {len(season_data['teams'])} teams: {[len(t['players']) for t in season_data['teams']]}", flush=True)
                  else:
                      print(f"  No data found", flush=True)

              except Exception as e:
                  print(f"  ERROR: {e}", flush=True)

          r2.put_object(
              Bucket=BUCKET,
              Key="basketball/allnba.json",
              Body=json.dumps(all_seasons, ensure_ascii=False).encode("utf-8"),
              ContentType="application/json; charset=utf-8",
          )
          print(f"Done! {len(all_seasons)} seasons uploaded.", flush=True)
          PYEOF
