name: Build All-NBA Teams
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests beautifulsoup4 lxml boto3

      - name: Scrape All-NBA teams
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python << 'PYEOF'
          import boto3
          import json
          import os
          import re
          import time
          import random
          import requests
          from bs4 import BeautifulSoup
          from botocore.config import Config

          r2 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4"),
              region_name="auto",
          )

          BUCKET  = "sporting-almanac-data"
          HEADERS = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"}

          NAME_FIX = {
              "doncilu01": "Luka Dončić",
              "jokicni01": "Nikola Jokić",
              "bogdaibo01": "Bogdan Bogdanović",
              "vucevni01": "Nikola Vučević",
              "porzikri01": "Kristaps Porziņģis",
              "nurkiju01": "Jusuf Nurkić",
              "saricda01": "Dario Šarić",
              "hezonja01": "Mario Hezonja",
              "sengunal01": "Alperen Şengün",
              "wembavi01": "Victor Wembanyama",
              "topicni01": "Nikola Topić",
              "zubaciv01": "Ivica Zubac",
              "avdijade01": "Deni Avdija",
          }

          all_seasons = []

          for year in range(1976, 2027):
              print(f"Scraping {year}...", flush=True)
              time.sleep(random.uniform(4, 7))
              try:
                  url = f"https://www.basketball-reference.com/awards/awards_{year}.html"
                  r   = requests.get(url, headers=HEADERS, timeout=30)
                  r.raise_for_status()

                  # Uncomment hidden tables
                  html = re.sub(r'<!--(.*?)-->', lambda m: m.group(1) if '<table' in m.group(1) else m.group(0), html=r.text, flags=re.DOTALL)
                  soup = BeautifulSoup(html, "lxml")

                  season_data = {"season": year, "teams": []}

                  # Find All-NBA table — it contains voting data with team columns
                  for table in soup.find_all("table"):
                      cap = table.find("caption")
                      if not cap:
                          continue
                      cap_text = cap.get_text()
                      if "All-NBA" not in cap_text or "Defensive" in cap_text or "Rookie" in cap_text:
                          continue

                      # Get headers to find team columns (1st, 2nd, 3rd)
                      headers = []
                      thead = table.find("thead")
                      if thead:
                          for th in thead.find_all("th"):
                              headers.append(th.get_text(strip=True))

                      print(f"  Found table: {cap_text.strip()}, headers: {headers[:10]}", flush=True)

                      # Parse rows - each row is a player with votes
                      # The team column tells us which team they made
                      tbody = table.find("tbody")
                      if not tbody:
                          continue

                      team_players = {1: [], 2: [], 3: []}

                      for row in tbody.find_all("tr"):
                          if row.get("class") and "thead" in row.get("class", []):
                              continue

                          player_td = row.find("td", {"data-stat": "player"})
                          if not player_td:
                              continue
                          name = player_td.get_text(strip=True)
                          if not name:
                              continue

                          pid = ""
                          link = player_td.find("a")
                          if link:
                              m = re.search(r"/players/\w/(\w+)\.html", link.get("href",""))
                              if m:
                                  pid = m.group(1)

                          pos_td = row.find("td", {"data-stat": "pos"})
                          pos = pos_td.get_text(strip=True) if pos_td else ""

                          # Check which team they made
                          team_td = row.find("td", {"data-stat": "award"})
                          if not team_td:
                              team_td = row.find("td", {"data-stat": "team"})

                          team_num = None
                          if team_td:
                              team_text = team_td.get_text(strip=True)
                              if "1" in team_text or "First" in team_text:
                                  team_num = 1
                              elif "2" in team_text or "Second" in team_text:
                                  team_num = 2
                              elif "3" in team_text or "Third" in team_text:
                                  team_num = 3

                          if pid in NAME_FIX:
                              name = NAME_FIX[pid]

                          if team_num:
                              team_players[team_num].append({"player": name, "player_id": pid, "pos": pos})

                      for num in [1, 2, 3]:
                          if team_players[num]:
                              label = f"{num}{'st' if num==1 else 'nd' if num==2 else 'rd'} Team"
                              season_data["teams"].append({"team": label, "players": team_players[num]})

                      break  # Only process first All-NBA table

                  if season_data["teams"]:
                      all_seasons.append(season_data)
                      print(f"  {len(season_data['teams'])} teams, players: {[len(t['players']) for t in season_data['teams']]}", flush=True)
                  else:
                      print(f"  No All-NBA data found", flush=True)

              except Exception as e:
                  print(f"  ERROR: {e}", flush=True)

          r2.put_object(
              Bucket=BUCKET,
              Key="basketball/allnba.json",
              Body=json.dumps(all_seasons, ensure_ascii=False).encode("utf-8"),
              ContentType="application/json; charset=utf-8",
          )
          print(f"Done! {len(all_seasons)} seasons uploaded.", flush=True)
          PYEOF
