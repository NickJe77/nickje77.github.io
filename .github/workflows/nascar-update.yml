name: Update NASCAR Data

on:
  schedule:
    - cron: '0 9 * * *'   # daily, 09:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to scrape (defaults to current year)'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # nascar_pipeline.py needs a real Chrome browser (Selenium) for
      # the schedule page specifically. "id: setup-chrome" lets us
      # capture the exact binary path this step installs, so the script
      # can point Selenium at it directly instead of guessing a version
      # number (which broke: a version pinned to match a local Mac's
      # Chrome doesn't match whatever "stable" resolves to here).
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: pip install setuptools undetected-chromedriver requests beautifulsoup4

      - name: Run pipeline (scrape + rebuild index)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then YEAR=$(date +%Y); fi
          python3 scripts/nascar_pipeline.py --year "$YEAR" --data-dir docs/data/nascar

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/nascar/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-update NASCAR data"
          git push
