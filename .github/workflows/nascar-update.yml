name: Update NASCAR Current Season

on:
  schedule:
    - cron: '0 8 * * *'   # daily, 08:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to update (defaults to current year)'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run incremental update
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then YEAR=$(date +%Y); fi
          python3 scripts/update_nascar_current.py --year "$YEAR" --data-dir docs/data/nascar

      - name: Rebuild index.json and drivers.json
        run: |
          python3 scripts/build_nascar_index.py --data-dir docs/data/nascar --out-dir docs/data/nascar

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/nascar/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-update NASCAR current season"
          git push
