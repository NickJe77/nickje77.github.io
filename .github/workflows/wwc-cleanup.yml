name: Clean and Build Womens WC Data
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clean team names
        run: python scripts/clean_womens_wc_names.py
      - name: Rebuild data
        run: python scripts/build_womens_wc_data.py
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "docs/data/women's-wc/womens-world-cup/"
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: clean team names and rebuild Womens WC data [skip ci]"
          git pull --rebase origin main
          git push
