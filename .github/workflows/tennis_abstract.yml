name: Tennis Abstract Builder

on:
  workflow_dispatch:

jobs:
  build-tennis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Build dataset
        run: python scripts/tennis_abstract_builder.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/tennis
          git commit -m "Build tennis matches (1968+)" || echo "No changes"
          git push
