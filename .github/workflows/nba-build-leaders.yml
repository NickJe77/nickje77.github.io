name: Build NBA Leaders

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/data/nba/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build leaders.json
        run: |
          python << 'EOF'
          import json
          from pathlib import Path
          from collections import defaultdict

          base = Path("docs/data/nba")
          season_files = base / "seasons"
          output = base / "leaders.json"

          leaders=[]

          def season_leader(players, stat):

              best=None
              best_val=-1

              for name,stats in players.items():
                  val=stats.get(stat,0)

                  if val>best_val:
                      best_val=val
                      best=name

              return {"player":best,"value":best_val}

          def process_game(g,players):

              plist=g.get("players")

              if not plist:
                  return

              if isinstance(plist,dict):
                  plist=list(plist.values())

              if not isinstance(plist,list):
                  return

              for p in plist:

                  if not isinstance(p,dict):
                      continue

                  name=p.get("player") or p.get("name")

                  if not name:
                      continue

                  players[name]["points"]+=p.get("points",0)
                  players[name]["rebounds"]+=p.get("rebounds",0)
                  players[name]["assists"]+=p.get("assists",0)
                  players[name]["steals"]+=p.get("steals",0)
                  players[name]["blocks"]+=p.get("blocks",0)


          # READ MODERN SEASON FOLDERS
          for season_dir in base.iterdir():

              if not season_dir.is_dir():
                  continue

              if season_dir.name == "seasons":
                  continue

              season=season_dir.name

              players=defaultdict(lambda:{
                  "points":0,
                  "rebounds":0,
                  "assists":0,
                  "steals":0,
                  "blocks":0
              })

              for game_file in season_dir.glob("*.json"):

                  try:
                      data=json.loads(game_file.read_text())
                  except:
                      continue

                  games=data if isinstance(data,list) else [data]

                  for g in games:

                      if isinstance(g,dict):
                          process_game(g,players)

              if players:

                  leaders.append({
                      "season":season,
                      "points":season_leader(players,"points"),
                      "rebounds":season_leader(players,"rebounds"),
                      "assists":season_leader(players,"assists"),
                      "steals":season_leader(players,"steals"),
                      "blocks":season_leader(players,"blocks")
                  })


          # READ OLDER SEASON FILES
          if season_files.exists():

              for f in season_files.glob("*.json"):

                  season=f.stem

                  try:
                      data=json.loads(f.read_text())
                  except:
                      continue

                  players=defaultdict(lambda:{
                      "points":0,
                      "rebounds":0,
                      "assists":0,
                      "steals":0,
                      "blocks":0
                  })

                  for g in data.get("games",[]):

                      if isinstance(g,dict):
                          process_game(g,players)

                  if players:

                      leaders.append({
                          "season":season,
                          "points":season_leader(players,"points"),
                          "rebounds":season_leader(players,"rebounds"),
                          "assists":season_leader(players,"assists"),
                          "steals":season_leader(players,"steals"),
                          "blocks":season_leader(players,"blocks")
                      })


          leaders.sort(key=lambda x:x["season"],reverse=True)

          output.write_text(json.dumps(leaders,indent=2))

          print("leaders.json built successfully")
          EOF

      - name: Commit leaders.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/nba/leaders.json
          git commit -m "Update NBA leaders" || echo "No changes"
          git push
