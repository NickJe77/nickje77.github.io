name: Build NBA Leaders

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/data/nba/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build leaders.json
        run: |
          python << 'EOF'
          import json
          from pathlib import Path
          from collections import defaultdict

          base = Path("docs/data/nba")
          output = base / "leaders.json"

          leaders=[]

          def leader(players, stat):
              best_player=None
              best_value=-1

              for p,stats in players.items():
                  val=stats.get(stat,0)

                  if val>best_value:
                      best_value=val
                      best_player=p

              return {"player":best_player,"value":best_value}

          for season_dir in base.iterdir():

              if not season_dir.is_dir():
                  continue

              season=season_dir.name

              players=defaultdict(lambda:{
                  "points":0,
                  "rebounds":0,
                  "assists":0,
                  "steals":0,
                  "blocks":0
              })

              for game_file in season_dir.glob("*.json"):

                  try:
                      raw=json.loads(game_file.read_text())
                  except:
                      continue

                  # normalize structure
                  games = raw if isinstance(raw,list) else [raw]

                  for data in games:

                      if not isinstance(data,dict):
                          continue

                      plist=data.get("players")

                      if not plist:
                          continue

                      if isinstance(plist,dict):
                          plist=list(plist.values())

                      for p in plist:

                          if not isinstance(p,dict):
                              continue

                          name=p.get("playerName") or p.get("name") or p.get("player")

                          if not name:
                              continue

                          players[name]["points"]+=p.get("points",0)
                          players[name]["rebounds"]+=p.get("reboundsTotal",0)
                          players[name]["assists"]+=p.get("assists",0)
                          players[name]["steals"]+=p.get("steals",0)
                          players[name]["blocks"]+=p.get("blocks",0)

              if not players:
                  continue

              leaders.append({
                  "season":season,
                  "points":leader(players,"points"),
                  "rebounds":leader(players,"rebounds"),
                  "assists":leader(players,"assists"),
                  "steals":leader(players,"steals"),
                  "blocks":leader(players,"blocks")
              })

          leaders.sort(key=lambda x:int(x["season"]), reverse=True)

          output.write_text(json.dumps(leaders,indent=2))

          print("leaders.json rebuilt with",len(leaders),"seasons")
          EOF

      - name: Commit leaders.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/nba/leaders.json
          git commit -m "Update NBA leaders" || echo "No changes"
          git push
