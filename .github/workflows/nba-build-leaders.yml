name: Build NBA Leaders

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/data/nba/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build leaders.json
        run: |
          python << 'EOF'
          import json
          from pathlib import Path
          from collections import defaultdict

          base = Path("docs/data/nba")
          output = base / "leaders.json"

          seasons = {}

          def ensure(season):
              if season not in seasons:
                  seasons[season] = defaultdict(lambda:{
                      "points":0,
                      "rebounds":0,
                      "assists":0,
                      "steals":0,
                      "blocks":0
                  })

          def stat(p, keys):
              for k in keys:
                  if k in p and isinstance(p[k], (int,float)):
                      return p[k]
              return 0

          for file in base.rglob("*.json"):

              if file.name == "leaders.json":
                  continue

              try:
                  data=json.loads(file.read_text())
              except:
                  continue

              if not isinstance(data,dict):
                  continue

              season=data.get("season")

              if not season:
                  continue

              season=str(season)

              if len(season)==5:   # fixes 42022 / 32022
                  season=season[1:]

              ensure(season)

              players=data.get("players",[])

              if not isinstance(players,list):
                  continue

              for p in players:

                  if not isinstance(p,dict):
                      continue

                  name = (
                      p.get("player")
                      or p.get("name")
                      or p.get("player_name")
                  )

                  if not name:
                      continue

                  seasons[season][name]["points"]  += stat(p,["points","pts"])
                  seasons[season][name]["rebounds"]+= stat(p,["rebounds","reb","reboundsTotal"])
                  seasons[season][name]["assists"] += stat(p,["assists","ast"])
                  seasons[season][name]["steals"]  += stat(p,["steals","stl"])
                  seasons[season][name]["blocks"]  += stat(p,["blocks","blk"])

          leaders=[]

          for season,players in seasons.items():

              def leader(stat):

                  best=None
                  best_val=-1

                  for name,stats in players.items():

                      val=stats.get(stat,0)

                      if val>best_val:
                          best_val=val
                          best=name

                  return {"player":best,"value":best_val}

              leaders.append({
                  "season":season,
                  "points":leader("points"),
                  "rebounds":leader("rebounds"),
                  "assists":leader("assists"),
                  "steals":leader("steals"),
                  "blocks":leader("blocks")
              })

          leaders.sort(key=lambda x:int(x["season"]), reverse=True)

          output.write_text(json.dumps(leaders,indent=2))

          print("leaders built:",len(leaders))

          EOF

      - name: Commit leaders.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/nba/leaders.json
          git commit -m "Rebuild NBA leaders" || echo "No changes"
          git push
