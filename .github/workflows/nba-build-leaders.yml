name: Build NBA Leaders

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/data/nba/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build leaders.json
        run: |
          python << 'EOF'
          import json
          from pathlib import Path
          from collections import defaultdict

          base = Path("docs/data/nba")
          output = base / "leaders.json"

          seasons = {}

          def ensure_season(season):
              if season not in seasons:
                  seasons[season] = defaultdict(lambda:{
                      "points":0,
                      "rebounds":0,
                      "assists":0,
                      "steals":0,
                      "blocks":0
                  })

          for file in base.rglob("*.json"):

              if file.name == "leaders.json":
                  continue

              try:
                  data=json.loads(file.read_text())
              except:
                  continue

              if not isinstance(data,dict):
                  continue

              season=str(data.get("season"))

              if not season:
                  continue

              ensure_season(season)

              plist=data.get("players")

              if isinstance(plist,dict):
                  plist=list(plist.values())

              if not isinstance(plist,list):
                  continue

              for p in plist:

                  if not isinstance(p,dict):
                      continue

                  name=p.get("playerName") or p.get("name") or p.get("player")

                  if not name:
                      continue

                  seasons[season][name]["points"]+=p.get("points",0)
                  seasons[season][name]["rebounds"]+=p.get("reboundsTotal",0)
                  seasons[season][name]["assists"]+=p.get("assists",0)
                  seasons[season][name]["steals"]+=p.get("steals",0)
                  seasons[season][name]["blocks"]+=p.get("blocks",0)


          leaders=[]

          for season,players in seasons.items():

              def leader(stat):

                  best=None
                  best_val=-1

                  for name,stats in players.items():
                      val=stats.get(stat,0)
                      if val>best_val:
                          best_val=val
                          best=name

                  return {"player":best,"value":best_val}

              leaders.append({
                  "season":season,
                  "points":leader("points"),
                  "rebounds":leader("rebounds"),
                  "assists":leader("assists"),
                  "steals":leader("steals"),
                  "blocks":leader("blocks")
              })

          leaders.sort(key=lambda x:int(x["season"]), reverse=True)

          output.write_text(json.dumps(leaders,indent=2))

          print("leaders.json built with",len(leaders),"seasons")
          EOF

      - name: Commit leaders.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/nba/leaders.json
          git commit -m "Rebuild NBA leaders" || echo "No changes"
          git push
