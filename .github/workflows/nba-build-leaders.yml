name: Build NBA Leaders

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/data/nba/seasons/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build leaders.json
        run: |
          python << 'EOF'
          import json
          from pathlib import Path
          from collections import defaultdict

          seasons_dir = Path("docs/data/nba/seasons")
          output = Path("docs/data/nba/leaders.json")

          leaders=[]

          def leader(players, stat):
              best_player=None
              best_value=-1

              for p,stats in players.items():
                  val=stats.get(stat,0)

                  if val>best_value:
                      best_value=val
                      best_player=p

              return {
                  "player":best_player,
                  "value":best_value
              }

          for file in sorted(seasons_dir.glob("*.json")):

              season=file.stem

              try:
                  with open(file) as f:
                      data=json.load(f)
              except Exception:
                  print(f"Skipping {file.name} due to JSON error")
                  continue

              players=defaultdict(lambda:{
                  "points":0,
                  "rebounds":0,
                  "assists":0,
                  "steals":0,
                  "blocks":0
              })

              for game in data.get("games",[]):

                  teams=[]

                  if "home" in game:
                      teams.append(game["home"])

                  if "away" in game:
                      teams.append(game["away"])

                  if "teams" in game:
                      teams.extend(game["teams"])

                  for team in teams:

                      for p in team.get("players",[]):

                          name=p.get("player") or p.get("name")

                          if not name:
                              continue

                          players[name]["points"]+=p.get("points",0)
                          players[name]["rebounds"]+=p.get("rebounds",0)
                          players[name]["assists"]+=p.get("assists",0)
                          players[name]["steals"]+=p.get("steals",0)
                          players[name]["blocks"]+=p.get("blocks",0)

              if not players:
                  print(f"No players found in {season}")
                  continue

              leaders.append({
                  "season":season,
                  "points":leader(players,"points"),
                  "rebounds":leader(players,"rebounds"),
                  "assists":leader(players,"assists"),
                  "steals":leader(players,"steals"),
                  "blocks":leader(players,"blocks")
              })

          leaders.sort(key=lambda x:x["season"], reverse=True)

          output.parent.mkdir(parents=True, exist_ok=True)

          with open(output,"w") as f:
              json.dump(leaders,f,indent=2)

          print("leaders.json built successfully")
          EOF

      - name: Commit leaders.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/nba/leaders.json
          git commit -m "Update NBA leaders" || echo "No changes"
          git push
