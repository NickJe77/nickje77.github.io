name: Build NBA Leaders

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/data/nba/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate leaders.json
        run: |
          python << 'EOF'
          import json
          from pathlib import Path
          from collections import defaultdict

          base = Path("docs/data/nba")
          output = base / "leaders.json"

          leaders = []

          def get_leader(players, stat):
              best_name=None
              best_val=-1

              for name,stats in players.items():
                  val=stats.get(stat,0)
                  if val>best_val:
                      best_val=val
                      best_name=name

              return {"player":best_name,"value":best_val}

          for season_dir in base.iterdir():

              if not season_dir.is_dir():
                  continue

              season = season_dir.name

              players = defaultdict(lambda:{
                  "points":0,
                  "rebounds":0,
                  "assists":0,
                  "steals":0,
                  "blocks":0
              })

              for game_file in season_dir.glob("*.json"):

                  try:
                      data=json.loads(game_file.read_text())
                  except:
                      continue

                  games = data if isinstance(data,list) else [data]

                  for g in games:

                      if not isinstance(g,dict):
                          continue

                      plist=g.get("players")

                      if not plist:
                          continue

                      if isinstance(plist,dict):
                          plist=list(plist.values())

                      if not isinstance(plist,list):
                          continue

                      for p in plist:

                          if not isinstance(p,dict):
                              continue

                          name=p.get("player") or p.get("name")

                          if not name:
                              continue

                          players[name]["points"]+=p.get("points",0)
                          players[name]["rebounds"]+=p.get("rebounds",0)
                          players[name]["assists"]+=p.get("assists",0)
                          players[name]["steals"]+=p.get("steals",0)
                          players[name]["blocks"]+=p.get("blocks",0)

              if not players:
                  continue

              leaders.append({
                  "season":season,
                  "points":get_leader(players,"points"),
                  "rebounds":get_leader(players,"rebounds"),
                  "assists":get_leader(players,"assists"),
                  "steals":get_leader(players,"steals"),
                  "blocks":get_leader(players,"blocks")
              })

          leaders.sort(key=lambda x:x["season"], reverse=True)

          output.write_text(json.dumps(leaders, indent=2))

          print("leaders.json rebuilt with",len(leaders),"seasons")
          EOF

      - name: Commit leaders.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/nba/leaders.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Rebuild NBA leaders"
          git push
