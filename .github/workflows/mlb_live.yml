name: MLB Live Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # CHECKOUT REPO
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install deps
        run: |
          pip install requests

      # -------------------------
      # RUN SCRIPT
      # -------------------------
      - name: Run MLB Builder
        run: |
          python scripts/mlb_live_boxscores.py

      # -------------------------
      # COMMIT DATA
      # -------------------------
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/baseball/boxscores/2026/

          git commit -m "Update MLB 2026 boxscores" || echo "No changes"

          git push
