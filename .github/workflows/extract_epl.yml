name: Extract EPL ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Show Repo Structure
        run: |
          echo "ROOT"
          ls

          echo ""
          echo "DOCS/DATA"
          ls docs/data || true

          echo ""
          echo "DOCS/DATA/EPL"
          ls docs/data/epl || true

      - name: Extract EPL ZIP
        run: |

          mkdir -p docs/data/epl

          unzip -o docs/data/epl/epl.zip -d docs/data/

          # Fix nested folders if zip contains epl/epl
          if [ -d "docs/data/epl/epl" ]; then

            mv docs/data/epl/epl/* docs/data/epl/ || true

            rm -rf docs/data/epl/epl

          fi

      - name: Remove Mac Junk
        run: |

          find docs/data/epl -name "__MACOSX" -type d -exec rm -rf {} + || true

          find docs/data/epl -name ".DS_Store" -type f -delete || true

      - name: Remove ZIP
        run: |
          rm -f docs/data/epl/epl.zip

      - name: Verify EPL Structure
        run: |

          echo "EPL ROOT"
          ls docs/data/epl

          echo ""
          echo "MATCHES"
          ls docs/data/epl/matches | head || true

          echo ""
          echo "SEASONS"
          ls docs/data/epl/seasons | head || true

      - name: Commit EPL Files
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl

          git commit -m "Extract EPL dataset" || echo "No changes"

          git push
