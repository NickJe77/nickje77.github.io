name: Extract EPL ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract EPL ZIP
        run: |
          mkdir -p docs/data/epl
          unzip -o docs/data/epl.zip -d docs/data/epl

      - name: Remove ZIP
        run: rm -f docs/data/epl.zip

      - name: Commit extracted EPL files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/epl
          git commit -m "Extract EPL data" || echo "No changes"

          git push
