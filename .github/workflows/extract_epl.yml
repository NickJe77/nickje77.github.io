name: Extract EPL ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract EPL ZIP
        run: |
          mkdir -p docs/data/epl

          unzip -o docs/data/epl.zip -d docs/data/

          # Fix accidental nested epl/epl structure
          if [ -d "docs/data/epl/epl" ]; then
            mv docs/data/epl/epl/* docs/data/epl/ || true
            rm -rf docs/data/epl/epl
          fi

      - name: Remove Mac junk files
        run: |
          find docs/data/epl -name "__MACOSX" -type d -exec rm -rf {} + || true
          find docs/data/epl -name ".DS_Store" -type f -delete || true

      - name: Remove ZIP
        run: rm -f docs/data/epl.zip

      - name: Commit EPL files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/epl

          git commit -m "Extract EPL data" || echo "No changes"

          git push
