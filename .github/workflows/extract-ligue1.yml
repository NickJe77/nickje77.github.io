name: Extract Ligue 1 Zip
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove broken nested folder
        run: |
          rm -rf docs/data/ligue1/ligue1
      - name: Extract Ligue 1 zip correctly
        run: |
          unzip -o docs/data/ligue1/ligue1.zip -d docs/data/
      - name: Verify structure
        run: |
          echo "----- LIGUE 1 ROOT -----"
          ls docs/data/ligue1
          echo "----- MATCHES -----"
          find docs/data/ligue1/matches | head
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ligue1/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Fix Ligue 1 extraction"
          git pull --rebase origin main
          git push
