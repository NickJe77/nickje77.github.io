name: Build Womens WC Data
on:
  push:
    paths:
      - "docs/data/women's-wc/matches/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run build script
        run: python scripts/build_womens_wc_data.py
      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/women's-wc/players.json \
                  docs/data/women's-wc/teams.json \
                  docs/data/women's-wc/team-stats.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: rebuild Womens WC data [skip ci]"
          git pull --rebase origin main
          git push
