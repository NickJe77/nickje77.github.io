name: Build Tennis Players

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT REPO
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # (OPTIONAL) INSTALL DEPS
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests || true

      # -------------------------
      # RUN PLAYER BUILDER
      # -------------------------
      - name: Run builder
        run: |
          python scripts/build_tennis_players.py

      # -------------------------
      # COMMIT OUTPUT
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/players.json

          git commit -m "Update tennis players" || echo "No changes"

          git push
