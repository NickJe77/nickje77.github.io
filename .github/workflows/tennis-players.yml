name: Build Tennis Players

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # 🔥 INSTALL DEPENDENCIES
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests

      # -------------------------
      # RUN SCRIPTS
      # -------------------------
      - name: Build players
        run: python scripts/build_tennis_players.py

      - name: Build player countries
        run: python scripts/build_player_countries.py

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/players.json
          git add docs/data/tennis/player_countries.json

          git commit -m "Update tennis players + countries" || echo "No changes"

          git push
