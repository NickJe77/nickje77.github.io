name: Build Tennis Players

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # 🔥 FORCE INSTALL REQUESTS
      # -------------------------
      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # -------------------------
      # RUN COUNTRY BUILDER
      # -------------------------
      - name: Run builder
        run: |
          python scripts/build_player_countries.py

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/player_countries.json

          git commit -m "Update player countries" || echo "No changes"

          git push
