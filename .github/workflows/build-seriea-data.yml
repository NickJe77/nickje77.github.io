name: Build Serie A Data
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run build script
        run: |
          cd $GITHUB_WORKSPACE
          python3 scripts/build_seriea_data.py
      - name: Debug output
        run: |
          echo "--- seriea dir ---"
          ls docs/data/seriea/
      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/seriea/players.json docs/data/seriea/teams.json docs/data/seriea/team-stats.json
          git commit -m "Build Serie A data" || echo "No changes"
          git push
