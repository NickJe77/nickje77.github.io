name: World Cup Legacy Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT REPO
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      # -------------------------
      # RUN LEGACY SCRAPER
      # -------------------------
      - name: Run legacy scraper
        run: |
          python scripts/world_cup_legacy_builder.py

      # -------------------------
      # DEBUG (IMPORTANT)
      # -------------------------
      - name: Show created files
        run: |
          echo "FILES CREATED:"
          ls -R docs/data/cricket || echo "No cricket folder"

      # -------------------------
      # COMMIT & PUSH
      # -------------------------
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/cricket/ || true

          git commit -m "Update legacy World Cup data" || echo "No changes"
          git push
