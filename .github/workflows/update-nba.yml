name: NBA Updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/update_recent_nba_games.py
      - run: git config user.name "NBA Auto Bot" && git config user.email "bot@example.com" && git add docs/data/nba && git commit -m "NBA auto update" || echo "No changes"
      - run: git push
