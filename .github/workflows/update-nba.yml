name: Update NBA Data (Kaggle)

on:
workflow_dispatch:

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install packages
    run: |
      python -m pip install --upgrade pip
      pip install pandas kaggle

  - name: Configure Kaggle token
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    run: |
      if [ -z "$KAGGLE_API_TOKEN" ]; then
        echo "Missing secret: KAGGLE_API_TOKEN"
        exit 1
      fi
      echo "Kaggle token detected."

  - name: Download dataset
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    run: |
      rm -rf data/kaggle_nba
      mkdir -p data/kaggle_nba
      kaggle datasets download \
        -d eoinamoore/historical-nba-data-and-player-box-scores \
        -p data/kaggle_nba
      unzip -o data/kaggle_nba/*.zip -d data/kaggle_nba

  - name: Run builder
    run: |
      python scripts/build_nba_games.py

  - name: Commit updates
    run: |
      git config user.name "NBA Auto Bot"
      git config user.email "actions@users.noreply.github.com"
      git add docs/data/nba
      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi
      git commit -m "Update NBA game JSONs from Kaggle dataset"
      git push
```
