name: Update NBA Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle
        run: pip install kaggle pandas

      - name: Configure Kaggle
        run: |
          mkdir ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download NBA Dataset
        run: |
          kaggle datasets download -d eoinamoore/historical-nba-data-and-player-box-scores
          unzip historical-nba-data-and-player-box-scores.zip -d data

      - name: Run NBA Builder
        run: python scripts/build_nba_games.py

      - name: Commit updates
        run: |
          git config --global user.name "nba-bot"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "NBA data update" || echo "No changes"
          git push
