name: Update NBA Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install pandas requests

      - name: Run updater
        run: |
          python scripts/update_nba_games.py

      - name: Commit updates
        run: |
          git config user.name "NBA Auto Bot"
          git config user.email "actions@github.com"
          git add docs/data/nba
          git commit -m "Update NBA games" || echo "No changes"
          git push
