name: Update NBA Data

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install requests
      run: pip install requests

    - name: Run updater
      run: python scripts/update_recent_nba_games.py

    - name: Commit updates
      run: |
        git config user.name "NBA Auto Bot"
        git config user.email "bot@example.com"
        git add docs/data/nba
        git commit -m "NBA auto update" || echo "No changes"
        git push
