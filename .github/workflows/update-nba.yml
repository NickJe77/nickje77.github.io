name: Update NBA Data

on:
workflow_dispatch:

jobs:
update:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install pandas kaggle

  - name: Download Kaggle dataset
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    run: |
      mkdir -p data/kaggle_nba
      kaggle datasets download -d eoinamoore/historical-nba-data-and-player-box-scores -p data/kaggle_nba
      unzip -o data/kaggle_nba/*.zip -d data/kaggle_nba

  - name: Run builder
    run: |
      python scripts/build_nba_games.py

  - name: Commit changes
    run: |
      git config user.name "nba-bot"
      git config user.email "actions@github.com"
      git add docs/data/nba || true
      git commit -m "Auto NBA update" || echo "No changes"
      git push
```
