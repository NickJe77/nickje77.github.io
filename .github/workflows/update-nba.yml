name: Update NBA Data

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests pandas

      - name: Run NBA Update Script
        run: python scripts/update_nba_master.py

      - name: Commit Changes
        run: |
          git config user.name "NBA Auto Bot"
          git config user.email "bot@thesportingalmanac.com"
          git add docs/data/nba
          git commit -m "Auto NBA update" || echo "No changes"
          git push
