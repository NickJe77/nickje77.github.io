name: Update NBA Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run NBA Update Script
        run: |
          python scripts/update_nba_master.py

      - name: Commit Changes
        run: |
          git config user.name "NBA Auto Bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/nba/2025/*.json
          git commit -m "Auto NBA update" || echo "No changes to commit"
          git pull --rebase origin main
          git push
