name: Update NBA Data

on:
workflow_dispatch:
schedule:
- cron: "0 9 * * *"

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install packages
    run: |
      python -m pip install --upgrade pip
      pip install requests pandas

  - name: Update recent NBA games
    run: |
      python scripts/update_recent_nba_games.py

  - name: Commit updates
    run: |
      git config user.name "NBA Auto Bot"
      git config user.email "actions@users.noreply.github.com"
      git add docs/data/nba
      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi
      git commit -m "Update NBA games"
      git push
```
