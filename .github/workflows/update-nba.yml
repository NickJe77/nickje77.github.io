import requests
import json
import os
from datetime import datetime, timedelta

START_DATE = datetime(2026, 2, 16)
TODAY = datetime.utcnow()

OUTPUT_DIR = "docs/data/nba/2026"
os.makedirs(OUTPUT_DIR, exist_ok=True)

print("Starting NBA updater")
print("Saving files to:", OUTPUT_DIR)

def get_games(date):

    ds = date.strftime("%Y%m%d")

    url = f"https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_{ds}.json"

    r = requests.get(url)

    if r.status_code != 200:
        print("No scoreboard:", ds)
        return []

    data = r.json()

    games = data.get("scoreboard", {}).get("games", [])

    print("Checking", ds, "- games found:", len(games))

    return games


def get_boxscore(game_id):

    url = f"https://cdn.nba.com/static/json/liveData/boxscore/boxscore_{game_id}.json"

    r = requests.get(url)

    if r.status_code != 200:
        print("Boxscore failed:", game_id)
        return None

    return r.json()


date = START_DATE

while date <= TODAY:

    games = get_games(date)

    for g in games:

        game_id = g["gameId"]

        file_path = f"{OUTPUT_DIR}/{game_id}.json"

        if os.path.exists(file_path):
            print("Already exists:", game_id)
            continue

        box = get_boxscore(game_id)

        if not box:
            continue

        game = box["game"]

        out = {
            "game_id": game_id,
            "season": 2026,
            "date": game["gameTimeUTC"],
            "home_team": game["homeTeam"]["teamName"],
            "away_team": game["awayTeam"]["teamName"],
            "home_score": game["homeTeam"]["score"],
            "away_score": game["awayTeam"]["score"],
            "arena": game["arena"]["arenaName"],
            "players": []
        }

        for team in ["homeTeam", "awayTeam"]:

            team_name = game[team]["teamName"]

            for p in game[team]["players"]:

                stats = p.get("statistics", {})

                player = {
                    "player": p["name"],
                    "team": team_name,
                    "minutes": stats.get("minutes", "0"),
                    "points": stats.get("points", 0),
                    "rebounds": stats.get("reboundsTotal", 0),
                    "assists": stats.get("assists", 0),
                    "steals": stats.get("steals", 0),
                    "blocks": stats.get("blocks", 0),
                    "turnovers": stats.get("turnovers", 0),
                    "fgm": stats.get("fieldGoalsMade", 0),
                    "fga": stats.get("fieldGoalsAttempted", 0),
                    "tpm": stats.get("threePointersMade", 0),
                    "tpa": stats.get("threePointersAttempted", 0),
                    "ftm": stats.get("freeThrowsMade", 0),
                    "fta": stats.get("freeThrowsAttempted", 0)
                }

                out["players"].append(player)

        with open(file_path, "w") as f:
            json.dump(out, f, indent=2)

        print("Saved:", file_path)

    date += timedelta(days=1)

print("NBA update finished")
