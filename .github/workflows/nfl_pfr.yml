name: NFL PFR Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install deps
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # Run scraper (CHANGE SEASON HERE)
      - name: Run scraper
        run: python scripts/pfr_nfl_scraper.py 1970

      # Debug (optional but useful)
      - name: Show output files
        run: |
          echo "=== FILES CREATED ==="
          ls -R docs/data/nfl || true

      # Commit safely (FIXED)
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/nfl || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "NFL data update"
            git push
          fi
