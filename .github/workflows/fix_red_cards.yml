name: Fix EPL Red Cards

on:
  workflow_dispatch:

jobs:
  fix-reds:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull latest
        run: |
          git pull --rebase origin main || echo "Nothing to pull"

      - name: Run red card fixer
        run: |
          python3 scripts/rebuild_epl_derived.py

      - name: Verify changes
        run: |
          git status
          find docs/data/epl/matches -name "*.json" | head

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/matches/

          git commit -m "Fix EPL red card events" || echo "No changes"

          git push
