name: Build La Liga Data
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run build script
        run: python3 scripts/build_laliga_data.py
      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/laliga/players.json docs/data/laliga/teams.json docs/data/laliga/team-stats.json
          git commit -m "Build La Liga data" || echo "No changes"
          git push
