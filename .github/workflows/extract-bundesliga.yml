name: Extract Bundesliga Zip
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove broken nested folder
        run: |
          rm -rf docs/data/bundesliga/bundesliga
      - name: Clear previous extraction
        run: |
          # Without this, files from an earlier zip upload that aren't in
          # the CURRENT zip never get removed -- unzip -o only overwrites
          # matching filenames, it doesn't delete anything. Same fix
          # already applied to extract-ligue1.yml after a confirmed case
          # of removed seasons surviving across re-extractions.
          rm -rf docs/data/bundesliga/matches docs/data/bundesliga/seasons
      - name: Extract Bundesliga zip correctly
        run: |
          unzip -o docs/data/bundesliga/bundesliga.zip -d docs/data/
      - name: Verify structure
        run: |
          echo "----- BUNDESLIGA ROOT -----"
          ls docs/data/bundesliga
          echo "----- MATCHES -----"
          find docs/data/bundesliga/matches | head
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/bundesliga/
          git commit -m "Fix Bundesliga extraction" || echo "No changes"
          git push
