name: Homepage Guard

on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/style.css'
      - 'docs/images/header-banner.png'

jobs:
  block-homepage-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Block homepage changes unless explicitly approved
        run: |
          echo "❌ Homepage files are protected."
          echo "If this change is intentional, remove homepage files from the PR or create a dedicated approval workflow."
          exit 1
