name: UFC Data Scraper

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Start year (e.g. 1993)'
        required: true
        default: '1993'
      end_year:
        description: 'End year (e.g. 2026)'
        required: true
        default: '2026'
  schedule:
    - cron: '0 10 * * 1'  # Every Monday to pick up weekend events

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Scrape UFC data (${{ github.event.inputs.start_year || '1993' }}–${{ github.event.inputs.end_year || '2026' }})
        run: python scripts/ufc_scraper.py ${{ github.event.inputs.start_year || '1993' }} ${{ github.event.inputs.end_year || '2026' }}

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/ufc
          git diff --cached --quiet || git commit -m "Update UFC data ${{ github.event.inputs.start_year || '1993' }}-${{ github.event.inputs.end_year || '2026' }}"
          git pull origin main --no-rebase --no-edit
          git push
