name: Build Search Index

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"   # daily, 4-5am Melbourne

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Build people index
        run: python -u scripts/build_search_index.py

      - name: Commit index
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/search/
          git commit -m "Rebuild search index" || echo "No changes"
          git pull --rebase
          git push
