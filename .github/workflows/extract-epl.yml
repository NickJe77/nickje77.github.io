name: Extract EPL Zip

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip EPL archive
        run: |
          mkdir -p docs/data/epl

          unzip -o docs/data/epl/epl.zip -d docs/data/epl/

      - name: Verify
        run: |
          find docs/data/epl/matches | head

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/

          git commit -m "Extract EPL matches" || echo "No changes"

          git push
