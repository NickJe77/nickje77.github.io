name: Build EPL Seasons

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build season files
        run: |
          python << 'EOF'
          import os
          import json
          from collections import defaultdict

          BASE = "docs/data/epl"
          MATCHES_DIR = f"{BASE}/matches"
          SEASONS_DIR = f"{BASE}/seasons"

          os.makedirs(SEASONS_DIR, exist_ok=True)

          seasons = defaultdict(list)

          for season in os.listdir(MATCHES_DIR):

              season_path = os.path.join(MATCHES_DIR, season)

              if not os.path.isdir(season_path):
                  continue

              for file in os.listdir(season_path):

                  if not file.endswith(".json"):
                      continue

                  path = os.path.join(season_path, file)

                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          data = json.load(f)
                  except:
                      continue

                  match_id = file.replace(".json", "")

                  seasons[season].append({
                      "match_id": match_id,
                      "date": data.get("date", ""),
                      "round": data.get("round", ""),
                      "home_team": data.get("home_team", ""),
                      "away_team": data.get("away_team", ""),
                      "home_score": data.get("home_score"),
                      "away_score": data.get("away_score"),
                      "venue": data.get("venue", "")
                  })

          for season, matches in seasons.items():

              matches.sort(key=lambda x: x.get("date", ""))

              out_path = f"{SEASONS_DIR}/{season}.json"

              with open(out_path, "w", encoding="utf-8") as f:
                  json.dump(matches, f, ensure_ascii=False, indent=2)

              print(f"Built {season}.json ({len(matches)} matches)")

          EOF

      - name: Commit season files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/epl/seasons

          git commit -m "Build EPL season files" || echo "No changes"

          git push
