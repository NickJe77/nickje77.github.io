name: EPL Players Builder

on:
  workflow_dispatch:

jobs:
  build-players:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Files
        run: |
          echo "ROOT FILES:"
          ls

          echo "SCRIPTS FOLDER:"
          ls scripts || true

      - name: Run EPL Player Builder
        run: |

          if [ -f build_epl_players.py ]; then
            echo "FOUND ROOT SCRIPT"
            python build_epl_players.py

          elif [ -f scripts/build_epl_players.py ]; then
            echo "FOUND SCRIPTS VERSION"
            python scripts/build_epl_players.py

          else
            echo "SCRIPT NOT FOUND"
            exit 1
          fi

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/players

          git commit -m "Rebuild EPL players" || echo "No changes"

          git push
