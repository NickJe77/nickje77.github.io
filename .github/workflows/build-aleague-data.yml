name: Build A-League Data
on:
  push:
    paths:
      - "docs/data/aleague/matches/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run build script
        run: python scripts/build_aleague_data.py
      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/aleague/players.json \
                  docs/data/aleague/teams.json \
                  docs/data/aleague/team-stats.json \
                  docs/data/aleague/match-records.json
          git diff --cached --quiet || git commit -m "chore: rebuild A-League data [skip ci]"
          git push
