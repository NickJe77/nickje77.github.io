name: Rebuild EPL Derived Files

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild EPL Derived Files
        run: |
          python scripts/rebuild_epl_derived.py

      - name: Commit EPL Derived Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/players
          git add docs/data/epl/players.json
          git add docs/data/epl/teams.json
          git add docs/data/epl/team_stats.json

          git commit -m "Rebuild EPL derived files" || echo "No changes"

          git push
