name: NFL Updater

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season (e.g. 2025)"
        required: true
        default: "2025"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run updater
        run: python scripts/nfl_update.py ${{ github.event.inputs.season }}

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nfl
          git commit -m "NFL update ${{ github.event.inputs.season }}" || echo "No changes"
          git push
