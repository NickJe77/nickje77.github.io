name: NFL Updater

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season (e.g. 2025)"
        required: true
        default: "2025"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 pandas

      # 1️⃣ FIND GAMES
      - run: python scripts/nfl_discover_games.py ${{ github.event.inputs.season }}

      # 2️⃣ DOWNLOAD FULL BOXSCORES
      - run: python scripts/nfl_download_boxscores.py ${{ github.event.inputs.season }}

      # 3️⃣ BUILD PLAYERS + SEASON
      - run: python scripts/nfl_build_outputs.py ${{ github.event.inputs.season }}

      # COMMIT
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nfl
          git commit -m "NFL update ${{ github.event.inputs.season }}" || echo "No changes"
          git push
