name: Bathurst 2026 Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests

      - name: Ensure folders
        run: |
          mkdir -p docs/data/bathurst

      - name: Build 2026
        run: |
          python scripts/build_bathurst_2026.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/bathurst/2026.json
          git commit -m "Update Bathurst 2026" || echo "No changes"
          git push
