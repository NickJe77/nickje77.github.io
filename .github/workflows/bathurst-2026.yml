name: Bathurst Full Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: mkdir -p docs/data/bathurst

      - run: python scripts/build_bathurst_all_years.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/bathurst
          git commit -m "Update Bathurst all years" || echo "No changes"
          git push
