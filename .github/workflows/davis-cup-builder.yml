name: Davis Cup Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # RUN SCRIPT
      # -------------------------
      - name: Build Davis Cup Matches
        run: |
          python scripts/build_davis_cup_matches.py

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/tennis/seasons/
          git commit -m "Update Davis Cup matches (include doubles)" || echo "No changes"
          git pushdavis
