name: Davis Cup Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday (change if you want)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT REPO
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPS (SAFE)
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests || true

      # -------------------------
      # RUN BUILDER
      # -------------------------
      - name: Build Davis Cup Matches
        run: |
          python scripts/build_davis_cup_matches.py

      # -------------------------
      # COMMIT + PUSH
      # -------------------------
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/seasons/

          git commit -m "Update Davis Cup matches (include doubles)" || echo "No changes"

          git push
