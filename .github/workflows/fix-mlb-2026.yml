name: Fix MLB 2026 Format

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # -------------------------
      # RUN FIX SCRIPT
      # -------------------------
      - name: Fix 2026 boxscores
        run: |
          python << 'EOF'
          import json
          from pathlib import Path

          SEASON = "2026"

          BOX_DIR = Path(f"docs/data/baseball/boxscores/{SEASON}")
          SEASON_FILE = Path(f"docs/data/baseball/seasons/{SEASON}.json")

          print("FIXING 2026 BOXSCORES")

          season_data = json.loads(SEASON_FILE.read_text())
          games = season_data["games"] if isinstance(season_data, dict) else season_data
          lookup = {str(g["game_id"]): g for g in games}

          for file in BOX_DIR.glob("*.json"):

              game_id = file.stem

              if game_id not in lookup:
                  continue

              meta = lookup[game_id]

              away_team = meta["away_team"]
              home_team = meta["home_team"]

              data = json.loads(file.read_text())

              if isinstance(data, dict) and "batters_away" in data:
                  continue

              if not isinstance(data, list):
                  continue

              away = []
              home = []

              for p in data:
                  obj = {
                      "player": p.get("player"),
                      "hits": p.get("hits"),
                      "runs": p.get("runs"),
                      "rbi": p.get("rbi"),
                      "home_runs": p.get("home_runs")
                  }

                  if p.get("team") == away_team:
                      away.append(obj)
                  elif p.get("team") == home_team:
                      home.append(obj)

              new_data = {
                  "batters_away": away,
                  "batters_home": home,
                  "pitchers_away": [],
                  "pitchers_home": []
              }

              file.write_text(json.dumps(new_data, indent=2))
              print("✔ fixed", game_id)

          print("DONE")
          EOF

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/baseball/boxscores/2026
          git commit -m "Fix 2026 MLB boxscore format" || echo "No changes"
          git push
