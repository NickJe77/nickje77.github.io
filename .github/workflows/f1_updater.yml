name: F1 2026 Scraper
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Run scraper
        run: python scripts/f1_2026.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/f1/2026.json
          git diff --staged --quiet || git commit -m "Update F1 2026"
          git pull --rebase origin main
          git push
