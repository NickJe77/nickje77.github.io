name: Update Test Cricket Scorecards
on:
  schedule:
    # Test matches are sparse and irregular (nothing like the daily Tour
    # de France cadence), so this runs weekly rather than daily. Adjust
    # if you want it tighter during a busy period (e.g. an Ashes series).
    - cron: '0 6 * * 1'   # every Monday, 06:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to scrape (defaults to current year)'
        required: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # undetected_chromedriver needs a real Chrome binary on the runner.
      # ubuntu-latest images usually ship one, but pinning it explicitly
      # avoids surprises if that ever changes. The step id lets us read
      # back exactly which version got installed, so the Python script
      # can request a matching ChromeDriver instead of letting
      # undetected_chromedriver auto-detect (which can grab a driver
      # build slightly ahead of what "stable" resolves to and fail with
      # SessionNotCreatedException).
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install dependencies
        run: pip install undetected-chromedriver beautifulsoup4 setuptools
      - name: Run scraper
        env:
          CHROME_VERSION: ${{ steps.setup-chrome.outputs.chrome-version }}
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then YEAR=$(date +%Y); fi
          python3 scripts/scrape_test_cricket.py --year "$YEAR"
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/test_cricket/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-update Test cricket scorecards"
          git push
