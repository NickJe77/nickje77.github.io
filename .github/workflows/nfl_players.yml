name: NFL Players Builder

on:
workflow_dispatch:
push:
paths:
- "docs/data/nfl/games/**"

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  # -------------------------
  # CHECKOUT REPO
  # -------------------------
  - name: Checkout
    uses: actions/checkout@v4

  # -------------------------
  # SETUP PYTHON
  # -------------------------
  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  # -------------------------
  # RUN PLAYER BUILDER
  # -------------------------
  - name: Build NFL Players
    run: |
      python build_nfl_players.py

  # -------------------------
  # COMMIT + PUSH
  # -------------------------
  - name: Commit changes
    run: |
      git config user.name "github-actions"
      git config user.email "actions@github.com"

      git add docs/data/nfl/players

      git commit -m "Update NFL players" || echo "No changes"

      git push
```
