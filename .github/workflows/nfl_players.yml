name: NFL Players Builder

on:
  push:
    paths:
      - "docs/data/nfl/games/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run player builder
        run: |
          python build_nfl_players.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nfl/players
          git commit -m "Update NFL players" || echo "No changes"
          git push
