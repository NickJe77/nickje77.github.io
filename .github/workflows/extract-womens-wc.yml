name: Extract Womens WC Zip
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove broken nested folder
        run: |
          rm -rf "docs/data/women's-wc/women's-wc"
      - name: Extract Womens WC zip correctly
        run: |
          unzip -o "docs/data/women's-wc/womens-world-cup.zip" -d "docs/data/women's-wc/"
      - name: Verify structure
        run: |
          echo "----- WOMENS WC ROOT -----"
          ls "docs/data/women's-wc"
          echo "----- MATCHES -----"
          find "docs/data/women's-wc/matches" | head
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "docs/data/women's-wc/"
          git commit -m "Extract Womens WC data" || echo "No changes"
          git push
