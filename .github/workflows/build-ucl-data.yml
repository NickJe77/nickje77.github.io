name: Build UCL Data
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run build script
        run: |
          cd $GITHUB_WORKSPACE
          python3 scripts/build_ucl_stats.py
      - name: Debug output
        run: |
          echo "--- ucl dir ---"
          ls docs/data/ucl/
      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ucl/players.json docs/data/ucl/teams.json docs/data/ucl/team-stats.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Build UCL data"
          git pull --rebase origin main
          git push origin HEAD
