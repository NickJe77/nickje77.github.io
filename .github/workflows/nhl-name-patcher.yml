name: NHL Name Patcher

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Patch player names
        run: python scripts/nhl_name_patcher.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nhl/boxscores docs/data/nhl/player_names.json docs/data/nhl/players.json
          git diff --cached --quiet || git commit -m "Patch NHL player full names"
          git pull origin main --no-rebase --no-edit
          git push
