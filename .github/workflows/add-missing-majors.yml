name: Add Missing Majors Safe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python scripts/golf_add_missing_majors_safe.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/golf/pga_winners.json
          git commit -m "Add missing majors safely" || echo "No changes"
          git push
