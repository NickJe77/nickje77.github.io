name: EPL Players Builder

on:
  workflow_dispatch:

jobs:
  build-players:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build EPL Players
        run: |

          python build_epl_players.py

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/players

          git commit -m "Rebuild EPL players" || echo "No changes"

          git push
