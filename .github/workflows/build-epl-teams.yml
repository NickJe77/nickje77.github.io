name: Build EPL Teams

on:
  workflow_dispatch:

jobs:
  build-epl-teams:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build teams.json
        run: |

          cat > build_epl_teams.py << 'PYTHON'

          import json
          import os
          from collections import defaultdict

          BASE_DIR = "docs/data/epl"

          PLAYERS_FILE = f"{BASE_DIR}/players.json"

          OUTPUT_FILE = f"{BASE_DIR}/teams.json"

          if not os.path.exists(PLAYERS_FILE):
              raise Exception("players.json missing")

          with open(PLAYERS_FILE, "r", encoding="utf-8") as f:
              data = json.load(f)

          print(f"Loaded {len(data)} rows")

          teams = {}

          def get_team(row):

              possible = [
                  row.get("team"),
                  row.get("club"),
                  row.get("squad"),
                  row.get("Team"),
                  row.get("Club"),
                  row.get("Squad")
              ]

              for p in possible:

                  if p and str(p).strip():
                      return str(p).strip()

              return None

          def get_player(row):

              possible = [
                  row.get("player"),
                  row.get("name"),
                  row.get("Player"),
                  row.get("Name")
              ]

              for p in possible:

                  if p and str(p).strip():
                      return str(p).strip()

              return None

          def get_season(row):

              possible = [
                  row.get("season"),
                  row.get("Season"),
                  row.get("year"),
                  row.get("Year")
              ]

              for p in possible:

                  if p and str(p).strip():
                      return str(p).strip()

              return None

          def to_int(v):

              try:
                  return int(float(v))
              except:
                  return 0

          for row in data:

              team = get_team(row)

              if not team:
                  continue

              if team not in teams:

                  teams[team] = {
                      "team": team,
                      "seasons_set": set(),
                      "goals": 0,
                      "assists": 0,
                      "appearances": 0,
                      "players": defaultdict(lambda: {
                          "player": "",
                          "goals": 0,
                          "assists": 0,
                          "appearances": 0,
                          "seasons": set()
                      })
                  }

              season = get_season(row)

              if season:
                  teams[team]["seasons_set"].add(season)

              goals = to_int(
                  row.get("goals")
                  or row.get("Goals")
                  or row.get("gls")
                  or row.get("Gls")
              )

              assists = to_int(
                  row.get("assists")
                  or row.get("Assists")
                  or row.get("ast")
                  or row.get("Ast")
              )

              apps = to_int(
                  row.get("appearances")
                  or row.get("apps")
                  or row.get("Appearances")
                  or row.get("Apps")
                  or row.get("matches")
              )

              teams[team]["goals"] += goals
              teams[team]["assists"] += assists
              teams[team]["appearances"] += apps

              player_name = get_player(row)

              if not player_name:
                  continue

              p = teams[team]["players"][player_name]

              p["player"] = player_name
              p["goals"] += goals
              p["assists"] += assists
              p["appearances"] += apps

              if season:
                  p["seasons"].add(season)

          output = []

          for team_name, info in teams.items():

              scorers = sorted(
                  info["players"].values(),
                  key=lambda x: x["goals"],
                  reverse=True
              )[:20]

              top_scorers = []

              for s in scorers:

                  top_scorers.append({
                      "player": s["player"],
                      "goals": s["goals"],
                      "assists": s["assists"],
                      "appearances": s["appearances"],
                      "seasons": sorted(list(s["seasons"]))
                  })

              output.append({
                  "team": team_name,
                  "seasons": len(info["seasons_set"]),
                  "goals": info["goals"],
                  "assists": info["assists"],
                  "appearances": info["appearances"],
                  "top_scorers": top_scorers
              })

          output = sorted(output, key=lambda x: x["team"])

          os.makedirs(BASE_DIR, exist_ok=True)

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2)

          print(f"Built {OUTPUT_FILE}")
          print(f"Teams: {len(output)}")

          PYTHON

          python3 build_epl_teams.py

      - name: Commit
        run: |

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add docs/data/epl/teams.json

          git commit -m "Build EPL teams.json" || echo "No changes"

          git push
