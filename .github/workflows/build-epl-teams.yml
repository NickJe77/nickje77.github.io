name: Build EPL Teams JSON

on:

  workflow_dispatch:

  push:
    paths:
      - "docs/data/epl/**"

  schedule:
    - cron: "0 6 * * *"

jobs:
  build-epl-teams:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build teams.json
        run: |

          cat > build_epl_teams.py << 'PYTHON'

          import json
          import glob
          from collections import defaultdict

          BASE_DIR = "docs/data/epl"

          OUTPUT = f"{BASE_DIR}/teams.json"

          json_files = glob.glob(
              f"{BASE_DIR}/**/*.json",
              recursive=True
          )

          print(f"FOUND {len(json_files)} JSON FILES")

          games = []

          # ---------------------------------
          # FIND MATCH FILES
          # ---------------------------------

          for file in json_files:

              if "teams.json" in file:
                  continue

              if "players.json" in file:
                  continue

              if "player-stats.json" in file:
                  continue

              try:

                  with open(file, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  if not isinstance(data, list):
                      continue

                  if not data:
                      continue

                  first = data[0]

                  keys = list(first.keys())

                  joined = " ".join(keys).lower()

                  if (
                      "home" in joined or
                      "away" in joined or
                      "hometeam" in joined
                  ):

                      print(f"USING: {file}")

                      games.extend(data)

              except Exception as e:

                  print(f"SKIP {file}")
                  print(e)

          print(f"TOTAL GAMES: {len(games)}")

          # ---------------------------------
          # TEAM STORAGE
          # ---------------------------------

          teams = defaultdict(lambda: {
              "team": "",
              "seasons": set(),
              "games": 0,
              "goals": 0,
              "wins": 0,
              "draws": 0,
              "losses": 0
          })

          # ---------------------------------
          # PROCESS GAMES
          # ---------------------------------

          for game in games:

              home = (
                  game.get("home_team")
                  or game.get("home")
                  or game.get("HomeTeam")
                  or ""
              ).strip()

              away = (
                  game.get("away_team")
                  or game.get("away")
                  or game.get("AwayTeam")
                  or ""
              ).strip()

              if not home or not away:
                  continue

              # ---------------------------------
              # SEASON LOGIC
              # ---------------------------------

              season = (
                  game.get("season")
                  or game.get("Season")
                  or ""
              )

              if not season:

                  raw_date = (
                      game.get("date")
                      or game.get("Date")
                      or ""
                  )

                  raw_date = str(raw_date).strip()

                  year = None
                  month = None

                  # YYYY-MM-DD
                  if "-" in raw_date:

                      parts = raw_date.split("-")

                      try:

                          year = int(parts[0])
                          month = int(parts[1])

                      except:
                          pass

                  # DD/MM/YYYY
                  elif "/" in raw_date:

                      parts = raw_date.split("/")

                      try:

                          if len(parts[2]) == 4:

                              year = int(parts[2])
                              month = int(parts[1])

                      except:
                          pass

                  # BUILD SEASON
                  if year and month:

                      if month >= 7:
                          season = f"{year}-{str(year+1)[-2:]}"
                      else:
                          season = f"{year-1}-{str(year)[-2:]}"

              season = str(season).strip()

              # ---------------------------------
              # GOALS
              # ---------------------------------

              home_goals = int(
                  game.get("home_score")
                  or game.get("FTHG")
                  or 0
              )

              away_goals = int(
                  game.get("away_score")
                  or game.get("FTAG")
                  or 0
              )

              # ---------------------------------
              # TEAM COUNTS
              # ---------------------------------

              for t in [home, away]:

                  teams[t]["team"] = t
                  teams[t]["games"] += 1

                  if season:
                      teams[t]["seasons"].add(season)

              # ---------------------------------
              # GOALS
              # ---------------------------------

              teams[home]["goals"] += home_goals
              teams[away]["goals"] += away_goals

              # ---------------------------------
              # RESULTS
              # ---------------------------------

              if home_goals > away_goals:

                  teams[home]["wins"] += 1
                  teams[away]["losses"] += 1

              elif away_goals > home_goals:

                  teams[away]["wins"] += 1
                  teams[home]["losses"] += 1

              else:

                  teams[home]["draws"] += 1
                  teams[away]["draws"] += 1

          # ---------------------------------
          # OUTPUT
          # ---------------------------------

          output = []

          for team, data in teams.items():

              output.append({

                  "team": team,

                  "seasons": len(data["seasons"]),

                  "games": data["games"],

                  "goals": data["goals"],

                  "wins": data["wins"],

                  "draws": data["draws"],

                  "losses": data["losses"]

              })

          output = sorted(
              output,
              key=lambda x: x["team"]
          )

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2)

          print(f"BUILT {OUTPUT}")
          print(f"TEAMS: {len(output)}")

          PYTHON

          python3 build_epl_teams.py

      - name: Commit teams.json
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/teams.json

          git commit -m "Update EPL teams.json" || echo "No changes"

          git push
