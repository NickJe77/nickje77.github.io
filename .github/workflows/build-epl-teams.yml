name: Build EPL Teams JSON

on:

  workflow_dispatch:

  push:
    paths:
      - "docs/data/epl/**"

  schedule:
    - cron: "0 6 * * *"

jobs:
  build-epl-teams:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build teams.json
        run: |

          cat > build_epl_teams.py << 'PYTHON'

          import json
          import glob
          import os
          from collections import defaultdict

          BASE_DIR = "docs/data/epl"

          OUTPUT = f"{BASE_DIR}/teams.json"

          files = glob.glob(
              f"{BASE_DIR}/matches/**/*.json",
              recursive=True
          )

          print(f"FOUND {len(files)} MATCH FILES")

          teams = defaultdict(lambda: {
              "team": "",
              "seasons": set(),
              "games": 0,
              "goals": 0,
              "wins": 0,
              "draws": 0,
              "losses": 0
          })

          for file in files:

              try:

                  with open(file, "r", encoding="utf-8") as f:
                      game = json.load(f)

                  # -------------------------
                  # TEAMS
                  # -------------------------

                  home = str(
                      game.get("home_team", "")
                  ).strip()

                  away = str(
                      game.get("away_team", "")
                  ).strip()

                  if not home or not away:
                      continue

                  # -------------------------
                  # SEASON FROM FOLDER
                  # -------------------------

                  parts = file.replace("\\", "/").split("/")

                  season = ""

                  for p in parts:

                      if "-" in p and len(p) == 9:

                          season = p
                          break

                  # -------------------------
                  # SCORES
                  # -------------------------

                  home_goals = int(
                      game.get("home_score", 0)
                  )

                  away_goals = int(
                      game.get("away_score", 0)
                  )

                  # -------------------------
                  # TEAM COUNTS
                  # -------------------------

                  for t in [home, away]:

                      teams[t]["team"] = t
                      teams[t]["games"] += 1

                      if season:
                          teams[t]["seasons"].add(season)

                  # -------------------------
                  # GOALS
                  # -------------------------

                  teams[home]["goals"] += home_goals
                  teams[away]["goals"] += away_goals

                  # -------------------------
                  # RESULTS
                  # -------------------------

                  if home_goals > away_goals:

                      teams[home]["wins"] += 1
                      teams[away]["losses"] += 1

                  elif away_goals > home_goals:

                      teams[away]["wins"] += 1
                      teams[home]["losses"] += 1

                  else:

                      teams[home]["draws"] += 1
                      teams[away]["draws"] += 1

              except Exception as e:

                  print(f"FAILED: {file}")
                  print(e)

          # -------------------------
          # OUTPUT
          # -------------------------

          output = []

          for team, data in teams.items():

              output.append({

                  "team": team,

                  "seasons": len(data["seasons"]),

                  "games": data["games"],

                  "goals": data["goals"],

                  "wins": data["wins"],

                  "draws": data["draws"],

                  "losses": data["losses"]

              })

          output = sorted(
              output,
              key=lambda x: x["team"]
          )

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2)

          print(f"BUILT {OUTPUT}")
          print(f"TEAMS: {len(output)}")

          PYTHON

          python3 build_epl_teams.py

      - name: Commit teams.json
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/teams.json

          git commit -m "Update EPL teams.json" || echo "No changes"

          git push
