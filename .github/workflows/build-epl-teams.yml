name: Build EPL Teams JSON

on:
  workflow_dispatch:

jobs:
  build-epl-teams:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build teams.json
        run: |

          cat > build_epl_teams.py << 'PYTHON'

          import json
          import os
          from collections import defaultdict

          BASE_DIR = "docs/data/epl"

          OUTPUT = f"{BASE_DIR}/teams.json"

          POSSIBLE_FILES = [

              f"{BASE_DIR}/epl.json",
              f"{BASE_DIR}/games.json",
              f"{BASE_DIR}/matches.json",
              f"{BASE_DIR}/results.json"

          ]

          games = []

          for file in POSSIBLE_FILES:

              if os.path.exists(file):

                  print(f"Loading {file}")

                  with open(file, "r", encoding="utf-8") as f:
                      games = json.load(f)

                  break

          if not games:

              raise Exception("NO EPL GAME FILE FOUND")

          print(f"Loaded {len(games)} games")

          teams = defaultdict(lambda: {
              "team": "",
              "seasons": set(),
              "goals": 0,
              "wins": 0,
              "draws": 0,
              "losses": 0,
              "games": 0
          })

          for game in games:

              home = (
                  game.get("home_team")
                  or game.get("home")
                  or game.get("HomeTeam")
                  or ""
              ).strip()

              away = (
                  game.get("away_team")
                  or game.get("away")
                  or game.get("AwayTeam")
                  or ""
              ).strip()

              if not home or not away:
                  continue

              season = (
                  str(game.get("season"))
                  or str(game.get("Season"))
                  or ""
              ).strip()

              home_goals = int(
                  game.get("home_score")
                  or game.get("FTHG")
                  or 0
              )

              away_goals = int(
                  game.get("away_score")
                  or game.get("FTAG")
                  or 0
              )

              for t in [home, away]:
                  teams[t]["team"] = t
                  teams[t]["games"] += 1

                  if season:
                      teams[t]["seasons"].add(season)

              teams[home]["goals"] += home_goals
              teams[away]["goals"] += away_goals

              if home_goals > away_goals:

                  teams[home]["wins"] += 1
                  teams[away]["losses"] += 1

              elif away_goals > home_goals:

                  teams[away]["wins"] += 1
                  teams[home]["losses"] += 1

              else:

                  teams[home]["draws"] += 1
                  teams[away]["draws"] += 1

          output = []

          for team, data in teams.items():

              output.append({

                  "team": team,

                  "seasons": len(data["seasons"]),

                  "games": data["games"],

                  "goals": data["goals"],

                  "wins": data["wins"],

                  "draws": data["draws"],

                  "losses": data["losses"]

              })

          output = sorted(output, key=lambda x: x["team"])

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2)

          print(f"Built {OUTPUT}")
          print(f"Teams: {len(output)}")

          PYTHON

          python3 build_epl_teams.py

      - name: Commit
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/teams.json

          git commit -m "Build EPL teams.json" || echo "No changes"

          git push
