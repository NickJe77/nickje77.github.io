name: Tennis Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 🔥 IMPORTANT (long scraper)

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # -------------------------
      # INSTALL
      # -------------------------
      - name: Install deps
        run: |
          pip install requests beautifulsoup4

      # -------------------------
      # CLEAN ONLY CURRENT YEARS
      # -------------------------
      - name: Clean current seasons only
        run: |
          rm -f docs/data/tennis/seasons/2025.json || true
          rm -f docs/data/tennis/seasons/2026.json || true

      # -------------------------
      # RUN NEW DAILY SCRAPER
      # -------------------------
      - name: Run scraper
        run: python scripts/tennis_live_scraper.py

      # ❌ REMOVE THIS (NO LONGER NEEDED)
      # - name: Clean bad data
      #   run: python scripts/tennis_clean_bad_live_data.py

      # -------------------------
      # REBUILD HISTORY
      # -------------------------
      - name: Rebuild history
        run: python scripts/tennis_rebuild_history.py

      # -------------------------
      # DEBUG
      # -------------------------
      - name: Show output
        run: |
          echo "SEASONS:"
          ls docs/data/tennis/seasons || true

          echo "HISTORY:"
          ls docs/data/tennis || true

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis

          git commit -m "Update tennis data" || echo "No changes"

          git push
