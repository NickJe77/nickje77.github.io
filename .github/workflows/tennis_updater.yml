name: Tennis Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # DEBUG (find your script)
      # -------------------------
      - name: Debug file location
        run: |
          echo "FILES IN ROOT:"
          ls -la
          echo "-----"
          echo "SEARCHING FOR SCRIPT:"
          find . -name "rebuild_tennis_seasons_current.py"

      # -------------------------
      # RUN SCRIPT (TEMP - will fix after debug)
      # -------------------------
      - name: Run Tennis Script
        run: python rebuild_tennis_seasons_current.py

      # -------------------------
      # COMMIT RESULTS
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/seasons/2025.json
          git add docs/data/tennis/seasons/2026.json

          git commit -m "Update tennis seasons (2025 & 2026)" || echo "No changes"
          git push
