name: Tennis Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT REPO
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests

      # -------------------------
      # RUN TENNIS SCRAPER
      # -------------------------
      - name: Run Tennis Scraper
        run: |
          python scripts/rebuild_tennis_seasons_current.py

      # -------------------------
      # COMMIT OUTPUT
      # -------------------------
      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/seasons/2025.json
          git add docs/data/tennis/seasons/2026.json

          git commit -m "Update tennis data (ATP + WTA full matches)" || echo "No changes"

          git push
