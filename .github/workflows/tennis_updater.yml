name: Tennis Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # FIND + RUN SCRIPT (AUTO)
      # -------------------------
      - name: Run Tennis Script (auto find)
        run: |
          FILE=$(find . -name "rebuild_tennis_seasons_current.py" | head -n 1)

          echo "FOUND SCRIPT AT: $FILE"

          if [ -z "$FILE" ]; then
            echo "❌ Script not found"
            exit 1
          fi

          python "$FILE"

      # -------------------------
      # COMMIT RESULTS
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/seasons/2025.json
          git add docs/data/tennis/seasons/2026.json

          git commit -m "Update tennis seasons (2025 & 2026)" || echo "No changes"
          git push
