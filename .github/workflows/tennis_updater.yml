name: Tennis Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Tennis Script
        run: |
          python scripts/rebuild_tennis_seasons_current.py

      - name: Show output files
        run: |
          ls -lh docs/data/tennis/
          wc -l docs/data/tennis/2025.json || true
          wc -l docs/data/tennis/2026.json || true

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/2025.json
          git add docs/data/tennis/2026.json

          git commit -m "Update tennis match data (2025 & 2026)" || echo "No changes"
          git push
