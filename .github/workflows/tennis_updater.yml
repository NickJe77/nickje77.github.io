name: Tennis Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install deps
        run: |
          pip install requests beautifulsoup4

      # -------------------------
      # CLEAN ONLY CURRENT YEARS
      # -------------------------
      - name: Clean current seasons only
        run: |
          rm -f docs/data/tennis/seasons/2025.json || true
          rm -f docs/data/tennis/seasons/2026.json || true
          rm -f docs/data/tennis/matches/2025.json || true
          rm -f docs/data/tennis/matches/2026.json || true

      # -------------------------
      # RUN SCRAPER
      # -------------------------
      - name: Run scraper
        run: python scripts/tennis_live_scraper.py

      # 🔥 NEW STEP (CRITICAL)
      # -------------------------
      - name: Fix tennis matches
        run: python scripts/tennis_fix_matches.py

      # -------------------------
      # REBUILD HISTORY
      # -------------------------
      - name: Rebuild history
        run: python scripts/tennis_rebuild_history.py

      # -------------------------
      # DEBUG OUTPUT
      # -------------------------
      - name: Show output
        run: |
          echo "MATCHES:"
          ls docs/data/tennis/matches || true

          echo "SEASONS:"
          ls docs/data/tennis/seasons || true

          echo "HISTORY:"
          ls docs/data/tennis || true

      # -------------------------
      # COMMIT + PUSH
      # -------------------------
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis

          git commit -m "Update tennis data" || echo "No changes"

          git pull --rebase origin main

          git push || git push --force
