name: Tennis Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # -------------------------
      # INSTALL
      # -------------------------
      - name: Install deps
        run: |
          pip install requests beautifulsoup4

      # -------------------------
      # CLEAR OLD DATA (IMPORTANT)
      # -------------------------
      - name: Clear old data
        run: |
          rm -rf docs/data/tennis/*

      # -------------------------
      # RUN SCRAPER (MATCHES + EVENTS)
      # -------------------------
      - name: Run scraper
        run: python scripts/tennis_full_scraper.py

      # -------------------------
      # DEBUG OUTPUT (OPTIONAL BUT USEFUL)
      # -------------------------
      - name: Show output
        run: |
          echo "MATCH FILES:"
          ls docs/data/tennis/matches || true

          echo "EVENT FILES:"
          ls docs/data/tennis/events || true

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis

          git commit -m "Update tennis data" || echo "No changes"

          git push
