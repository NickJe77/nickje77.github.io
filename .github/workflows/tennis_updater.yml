name: Tennis Full Dataset Builder

on:
  workflow_dispatch:

jobs:
  build-tennis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - run: pip install requests beautifulsoup4

      - run: python scripts/tennis_build_full_dataset.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/tennis
          git commit -m "Build full tennis dataset" || echo "No changes"
          git push
