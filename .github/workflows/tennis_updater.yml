name: Tennis Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ ADD THIS
      - name: Install dependencies
        run: pip install requests

      - name: Run Tennis Script (auto)
        run: |
          FILE=$(find . -name "*.py" | grep -i tennis | head -n 1)
          echo "RUNNING: $FILE"
          python "$FILE"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/seasons/2025.json
          git add docs/data/tennis/seasons/2026.json
          git add docs/data/tennis/full_match_database.json

          git commit -m "Update tennis data" || echo "No changes"
          git push
