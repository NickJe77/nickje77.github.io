name: Tennis Builder (Safe)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 🔥 IMPORTANT for rebase

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install deps
        run: |
          pip install requests beautifulsoup4

      # -------------------------
      # RUN SCRIPT
      # -------------------------
      - name: Run tennis builder
        run: |
          python scripts/tennis_season_builder.py

      # -------------------------
      # COMMIT + PUSH (SAFE)
      # -------------------------
      - name: Commit data safely
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 🔥 Only tennis data
          git add docs/data/tennis/

          # Commit if changes exist
          git commit -m "Update tennis data" || echo "No changes"

          # 🔥 ALWAYS sync with remote before push
          git pull --rebase origin main || git pull origin main

          # Push safely
          git push
