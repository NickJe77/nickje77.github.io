name: Tennis Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT (FULL HISTORY)
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install deps
        run: |
          pip install requests beautifulsoup4

      # -------------------------
      # RUN SCRAPER (2025+)
      # -------------------------
      - name: Run scraper
        run: |
          python scripts/tennis_live_scraper.py

      # -------------------------
      # FIX MATCH STRUCTURE
      # -------------------------
      - name: Fix tennis matches
        run: |
          python scripts/tennis_fix_matches.py

      # -------------------------
      # 🔥 CRITICAL: RESET GIT STATE
      # -------------------------
      - name: Reset git state
        run: |
          git reset --hard

      # -------------------------
      # 🔥 SAFE COMMIT (NO DELETIONS)
      # -------------------------
      - name: Commit data safely
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          FILES="
          docs/data/tennis/matches/2025.json
          docs/data/tennis/matches/2026.json
          docs/data/tennis/seasons/2025.json
          docs/data/tennis/seasons/2026.json
          "

          for f in $FILES
          do
            if [ -s "$f" ]; then
              echo "Adding $f"
              git add "$f"
            else
              echo "Skipping empty $f (prevents deletion)"
            fi
          done

          git commit -m "Update tennis data (safe)" || echo "No changes"
          git push
