name: Tennis Full Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # PYTHON SETUP
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------
      # INSTALL DEPENDENCIES
      # -----------------------------
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # -----------------------------
      # DEBUG FILES (VERY IMPORTANT)
      # -----------------------------
      - name: Debug file structure
        run: |
          echo "=== ROOT ==="
          ls
          echo "=== SCRIPTS ==="
          ls scripts

      # -----------------------------
      # STEP 1 — HISTORICAL DATA
      # -----------------------------
      - name: Build dataset (1968–2024)
        run: |
          python scripts/tennis_dataset_builder.py

      # -----------------------------
      # STEP 2 — LIVE SCRAPER
      # -----------------------------
      - name: Scrape current seasons (2025+)
        run: |
          python scripts/tennis_live_scraper.py

      # -----------------------------
      # STEP 3 — BUILD PLAYERS
      # -----------------------------
      - name: Build players
        run: |
          python scripts/build_tennis_players.py

      # -----------------------------
      # STEP 4 — COMMIT CHANGES
      # -----------------------------
      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis

          git commit -m "Update tennis dataset (historical + live)" || echo "No changes"

          git push
