name: Tennis Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install deps
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/tennis_full_scraper.py

      - name: Build events
        run: python scripts/build_tennis_events.py

      - name: Build players
        run: python scripts/build_tennis_players.py

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis

          git commit -m "Update tennis data" || echo "No changes"

          git push
