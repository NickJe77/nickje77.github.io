name: Tennis Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Tennis Script (auto)
        run: |
          FILE=$(find . -name "*.py" | grep -i tennis | head -n 1)

          echo "RUNNING: $FILE"

          if [ -z "$FILE" ]; then
            echo "❌ No tennis script found"
            exit 1
          fi

          python "$FILE"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/seasons/2025.json
          git add docs/data/tennis/seasons/2026.json

          git commit -m "Fix tennis seasons (2025 & 2026)" || echo "No changes"
          git push
