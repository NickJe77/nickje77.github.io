name: Tennis Full Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # SETUP PYTHON
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------
      # INSTALL DEPENDENCIES
      # -----------------------------
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # -----------------------------
      # DEBUG (CONFIRMS FILES EXIST)
      # -----------------------------
      - name: Debug file structure
        run: |
          echo "=== ROOT ==="
          ls -R
          echo "=== SCRIPTS ==="
          ls scripts || echo "scripts folder missing"

      # -----------------------------
      # SCRAPE CURRENT TENNIS (2025+)
      # -----------------------------
      - name: Scrape tennis (2025+)
        run: |
          python scripts/tennis_live_scraper.py

      # -----------------------------
      # BUILD PLAYERS
      # -----------------------------
      - name: Build tennis players
        run: |
          python scripts/build_tennis_players.py

      # -----------------------------
      # COMMIT & PUSH
      # -----------------------------
      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis

          git diff --quiet && git diff --staged --quiet || git commit -m "Tennis update (2025+ live)"

          git push
