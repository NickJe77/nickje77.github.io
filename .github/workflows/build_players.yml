name: Build NBA Players

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run player builder
        run: python scripts/build_players.py

      - name: Commit updated players file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nba/players.json
          git commit -m "Update players.json" || echo "No changes"
          git push
