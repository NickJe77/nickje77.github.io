name: Normalize MLB 2026 Boxscores

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Normalize
        run: |
          python scripts/normalize_2026_boxscores.py

      - name: Commit
        run: |

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/baseball/boxscores/2026/

          git commit -m "Normalize MLB 2026 boxscores" || echo "No changes"

          git push
