name: NHL Scorers All Seasons

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/nhl/boxscores

      - name: Run NHL scorers builder
        run: |
          python scripts/nhl_scorers_all.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/nhl/boxscores

          git commit -m "Update NHL scorers all seasons" || echo "No changes"

          # 🔥 FIXES YOUR ERROR
          git pull --rebase origin main

          git push
