name: IPL Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests

      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/ipl/matches/2026

      - name: Run IPL builder
        run: |
          python scripts/ipl_builder.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/ipl
          git commit -m "Update IPL data" || echo "No changes"
          git push
