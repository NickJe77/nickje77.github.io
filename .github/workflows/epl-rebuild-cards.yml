name: Rebuild EPL Cards

on:
  workflow_dispatch:

jobs:
  rebuild-cards:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Files
        run: |
          echo "ROOT"
          ls

          echo ""
          echo "SCRIPTS"
          ls scripts

          echo ""
          echo "MATCHES"
          ls docs/data/epl/matches | head

      - name: Run Card Rebuilder
        run: |
          python scripts/rebuild_epl_cards.py

      - name: Commit Changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/matches

          git commit -m "Rebuild EPL card data" || echo "No changes"

          git push
