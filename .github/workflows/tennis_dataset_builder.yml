name: Tennis Full Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install deps
        run: |
          pip install requests

      # STEP 1 — HISTORICAL (SAFE TO RUN AGAIN)
      - name: Build dataset
        run: |
          python scripts/tennis_dataset_builder.py

      # STEP 2 — LIVE UPDATE
      - name: Live updater
        run: |
          python scripts/tennis_live_updater.py

      # STEP 3 — BUILD PLAYERS
      - name: Build players
        run: |
          python scripts/build_tennis_players.py

      # STEP 4 — COMMIT
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis
          git commit -m "Update tennis data (live + historical)" || echo "No changes"

          git push
