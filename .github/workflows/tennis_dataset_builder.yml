name: Tennis Dataset Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install deps
        run: |
          pip install requests

      # 🔥 BUILD MATCH DATA
      - name: Build dataset
        run: |
          python scripts/tennis_dataset_builder.py

      # 🔥 BUILD PLAYERS (LIKE NBA)
      - name: Build players
        run: |
          python scripts/build_tennis_players.py

      # 🔥 COMMIT EVERYTHING
      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis

          git commit -m "Update tennis dataset + players" || echo "No changes"

          git push
