name: Golf Data Builder (PGA + LIV)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps

      - name: Ensure folders
        run: |
          mkdir -p docs/data/golf
          mkdir -p docs/data/golf/players

      - name: Run PGA builder
        run: |
          python scripts/pga_winners_builder.py

      - name: Run LIV scraper (Playwright)
        run: |
          python scripts/liv_winners_playwright.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/golf/

          git commit -m "Update Golf data (PGA + LIV + players)" || echo "No changes"

          git pull --rebase origin main
          git push
