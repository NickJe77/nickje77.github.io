name: PGA Winners Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Ensure golf folders exist
        run: |
          mkdir -p docs/data/golf

      - name: Run PGA full history builder
        run: |
          python scripts/pga_winners_builder.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/golf/pga_winners.json

          git commit -m "Update PGA winners history" || echo "No changes"

          git pull --rebase origin main
          git push
