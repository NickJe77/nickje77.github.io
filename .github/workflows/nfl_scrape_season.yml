name: NFL Scrape Season

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (e.g. 2026)"
        required: true
        default: "2026"

# Only one data-push job at a time; extra runs wait their turn instead of racing.
# Use this same group name in any other workflow that commits to this repo.
concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape season (schedule + scores)
        run: python3 scripts/nfl_scrape_season.py ${{ github.event.inputs.season }}

      - name: Build boxscores
        run: python3 scripts/nfl_build_boxscores.py ${{ github.event.inputs.season }}

      - name: Rebuild players.json / index.json
        run: python3 scripts/build_nfl_players.py

      - name: Show output
        run: |
          echo "=== season file ==="
          ls -la docs/data/nfl/seasons/${{ github.event.inputs.season }}.json
          echo "=== boxscore count ==="
          find docs/data/nfl/boxscores/${{ github.event.inputs.season }} -name "*.json" 2>/dev/null | wc -l

      - name: Commit and push (with retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/nfl/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "NFL scrape: season ${{ github.event.inputs.season }}"

          for i in 1 2 3 4 5; do
            # -X theirs: on a conflict, keep this run's freshly scraped files
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i), retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          echo "Push failed after 5 attempts"
          exit 1
