name: Extract La Liga Zip
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract La Liga zip
        run: |
          unzip -o docs/data/laliga/laliga.zip -d docs/data/temp_extract
      - name: Move to correct folder
        run: |
          rm -rf docs/data/laliga/matches
          rm -rf docs/data/__MACOSX
          mv docs/data/temp_extract/la_liga/* docs/data/laliga/ 2>/dev/null || \
          mv docs/data/temp_extract/laliga/* docs/data/laliga/ 2>/dev/null || \
          mv docs/data/temp_extract/*/* docs/data/laliga/
          rm -rf docs/data/temp_extract
      - name: Verify structure
        run: |
          echo "----- LA LIGA ROOT -----"
          ls docs/data/laliga
          echo "----- MATCHES -----"
          find docs/data/laliga/matches | head
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/laliga/
          git commit -m "Fix La Liga extraction" || echo "No changes"
          git push
