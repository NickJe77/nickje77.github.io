name: Extract La Liga Zip
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove broken nested folder
        run: |
          rm -rf docs/data/la_liga/la_liga
          rm -rf docs/data/__MACOSX
      - name: Extract La Liga zip correctly
        run: |
          unzip -o docs/data/la_liga/la_liga.zip -d docs/data/
      - name: Verify structure
        run: |
          echo "----- LA LIGA ROOT -----"
          ls docs/data/la_liga
          echo "----- MATCHES -----"
          find docs/data/la_liga/matches | head
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/la_liga/
          git commit -m "Fix La Liga extraction" || echo "No changes"
          git push
