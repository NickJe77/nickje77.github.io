name: NHL Player Stats Builder

on:
  workflow_dispatch:
  # Run nightly to pick up new games during the season
  schedule:
    - cron: '0 9 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Ensure folders exist
        run: mkdir -p docs/data/nhl/players

      - name: Build player stats
        run: python scripts/nhl_player_builder.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nhl/players docs/data/nhl/players.json
          git diff --cached --quiet || git commit -m "Update NHL player stats $(date -u +%Y-%m-%d)"
          git push
