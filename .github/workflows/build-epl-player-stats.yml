name: Build EPL Player Stats

on:
  workflow_dispatch:

jobs:
  build-player-stats:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pandas beautifulsoup4 lxml requests

      - name: Build player-stats.json
        run: |

          cat > build_player_stats.py << 'PYTHON'

          import os
          import json
          import time
          import pandas as pd

          BASE_DIR = "docs/data/epl"

          os.makedirs(BASE_DIR, exist_ok=True)

          OUTPUT = f"{BASE_DIR}/player-stats.json"

          seasons = []

          for yr in range(1992, 2026):

              end = str(yr + 1)[-2:]

              seasons.append(f"{yr}-{end}")

          rows = []

          for season in seasons:

              print(f"\nProcessing {season}")

              url = f"https://raw.githubusercontent.com/jokecamp/FootballData/master/EPL/{season}.csv"

              try:

                  df = pd.read_csv(url)

              except Exception as e:

                  print(f"FAILED {season}")
                  print(e)
                  continue

              home_teams = df["HomeTeam"].dropna().unique()

              away_teams = df["AwayTeam"].dropna().unique()

              all_teams = sorted(
                  list(set(home_teams) | set(away_teams))
              )

              for team in all_teams:

                  team_games = df[
                      (df["HomeTeam"] == team) |
                      (df["AwayTeam"] == team)
                  ]

                  goals = 0
                  apps = len(team_games)

                  for _, game in team_games.iterrows():

                      if game["HomeTeam"] == team:
                          goals += int(game["FTHG"])

                      if game["AwayTeam"] == team:
                          goals += int(game["FTAG"])

                  rows.append({

                      "player": f"{team} Squad",

                      "team": team,

                      "season": season,

                      "goals": goals,

                      "assists": 0,

                      "appearances": apps

                  })

              time.sleep(0.2)

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(rows, f, indent=2)

          print(f"\nBuilt {OUTPUT}")
          print(f"Rows: {len(rows)}")

          PYTHON

          python3 build_player_stats.py

      - name: Commit
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/player-stats.json

          git commit -m "Build EPL player stats" || echo "No changes"

          git push
