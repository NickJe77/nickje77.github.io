name: Davis Cup Scraper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 lxml

      - run: python scripts/davis_cup_scraper.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/tennis/davis_cup/
          git commit -m "Davis Cup scraper (with doubles)" || echo "No changes"
          git push
