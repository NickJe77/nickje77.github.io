name: All NBA Builder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # every Monday

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run builder
        run: python scripts/all_nba_builder.py

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nba/all_nba.json
          git commit -m "Update All-NBA data" || echo "No changes"
          git push
