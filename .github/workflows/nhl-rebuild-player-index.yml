name: NHL Rebuild Player Index

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild player index
        run: python scripts/nhl_rebuild_player_index.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nhl/players.json
          git diff --cached --quiet || git commit -m "Rebuild NHL player index from existing files"
          git pull origin main --no-rebase --no-edit -X ours
          git push
