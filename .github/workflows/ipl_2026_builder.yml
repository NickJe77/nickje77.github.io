name: IPL 2026 Builder (Cricsheet Safe)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPS
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests

      # -------------------------
      # ENSURE FOLDER
      # -------------------------
      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/ipl

      # -------------------------
      # RUN BUILDER
      # -------------------------
      - name: Build IPL 2026 (Cricsheet)
        run: |
          python scripts/ipl_2026_builder.py

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/ipl/ipl_2026_FULL.json
          git commit -m "Update IPL 2026 (Cricsheet sync)" || echo "No changes"
          git push
