name: IPL 2026 Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT REPO
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests

      # -------------------------
      # RUN SCRIPT (FIXED PATH)
      # -------------------------
      - name: Run IPL builder
        run: |
          python scripts/ipl_2026_builder.py

      # -------------------------
      # COMMIT CHANGES
      # -------------------------
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/ipl/ipl_2026.json
          git commit -m "Update IPL 2026 data" || echo "No changes"
          git push
