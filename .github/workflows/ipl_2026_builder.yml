name: IPL 2026 Builder (Safe + Gap Fill)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON SETUP
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPS
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # -------------------------
      # ENSURE FOLDERS
      # -------------------------
      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/ipl

      # -------------------------
      # MAIN BUILDER (CRICSHEET - SAFE MERGE)
      # -------------------------
      - name: Build IPL 2026 (Cricsheet)
        run: |
          python scripts/ipl_2026_builder.py

      # -------------------------
      # GAP FILLER (Cricinfo fallback)
      # -------------------------
      - name: Fill missing matches
        run: |
          python scripts/ipl_2026_gap_filler.py

      # -------------------------
      # COMMIT (SAFE)
      # -------------------------
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/ipl/ipl_2026_FULL.json
          git commit -m "Update IPL 2026 data (safe + gap fill)" || echo "No changes"
          git push
