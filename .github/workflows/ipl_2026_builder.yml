name: IPL 2026 Season Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Ensure output folder exists
        run: |
          mkdir -p docs/data/ipl/seasons

      - name: Build IPL 2026 season JSON
        run: |
          python scripts/build_ipl_2026_season.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/ipl/seasons/2026.json
          git commit -m "Update IPL 2026 season JSON" || echo "No changes"
          git push
