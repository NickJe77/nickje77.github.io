name: Rebuild EPL Derived Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run rebuild
        run: |
          python scripts/rebuild_epl_derived.py

      - name: Verify outputs
        run: |
          echo "----- PLAYERS -----"
          ls docs/data/epl/players | head

          echo "----- TEAM STATS -----"
          ls docs/data/epl/team_stats.json

      - name: Commit rebuilt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/

          git commit -m "Rebuild EPL derived files" || echo "No changes"

          git push
