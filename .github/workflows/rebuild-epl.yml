name: Rebuild EPL Derived

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull latest
        run: |
          git pull --rebase origin main || echo "Nothing to pull"

      - name: Run rebuild
        run: |
          python3 scripts/rebuild_epl_derived.py

      - name: Verify output
        run: |
          ls docs/data/epl
          wc -l docs/data/epl/team_stats.json

      - name: Commit
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/teams.json
          git add docs/data/epl/team_stats.json
          git add docs/data/epl/players.json
          git add docs/data/epl/players/

          git commit -m "Rebuild EPL derived files" || echo "No changes"

          git push
