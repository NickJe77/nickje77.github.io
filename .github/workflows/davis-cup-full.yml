name: Davis Cup Full Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT REPO
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      # -------------------------
      # RUN SCRIPT
      # -------------------------
      - name: Run Davis Cup builder
        run: |
          python scripts/build_davis_cup_full.py

      # -------------------------
      # COMMIT RESULTS
      # -------------------------
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/davis_cup/

          git commit -m "Update Davis Cup full dataset" || echo "No changes"

          git push
