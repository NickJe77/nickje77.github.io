name: Davis Cup Full Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python scripts/build_davis_cup_full.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/tennis/davis_cup/
          git commit -m "Build Davis Cup full bracket" || echo "No changes"
          git push
