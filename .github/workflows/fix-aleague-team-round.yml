name: Fix A-League team/round fields

on:
  workflow_dispatch:
    inputs:
      target_folder:
        description: 'Folder to fix (relative to repo root)'
        required: false
        default: 'data/aleague/matches'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fix script
        run: python3 scripts/fix_aleague_team_round.py "${{ github.event.inputs.target_folder }}"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.target_folder }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix corrupted team/round fields in A-League match data"
            git push
          fi
