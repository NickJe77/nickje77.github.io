name: Generate NFL Game Records

on:
  # Run after the player files are updated
  workflow_run:
    workflows: ["Update NFL player files"]
    types: [completed]
  # Also allow manual trigger
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run generator
        run: python docs/generate_nfl_records.py

      - name: Commit game-records.json if changed
        run: |
          git config user.name  "actions-user"
          git config user.email "actions@github.com"
          git add docs/data/nfl/game-records.json
          git diff --cached --quiet || git commit -m "Update NFL game records index"
          git push
