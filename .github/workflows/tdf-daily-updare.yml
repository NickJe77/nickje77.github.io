name: Update TDF daily results

on:
  schedule:
    # Runs at 22:00 UTC daily. Tour stages usually finish mid-afternoon
    # French time (~13:00-16:00 UTC); 22:00 UTC gives PCS time to publish
    # final results (including any post-stage penalties/adjustments).
    # Only meaningfully does anything during the ~3 weeks the Tour is on;
    # outside that window it just finds nothing new and exits quietly.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to update (defaults to current year)'
        required: false
      force_refresh:
        description: 'Discard and re-scrape ALL of this year''s stages (one-time repair after a formatting fix)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install procyclingstats cloudscraper

      - name: Run daily update
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then YEAR=$(date +%Y); fi
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then FORCE_FLAG="--force-refresh"; fi
          python3 scripts/update_tdf_daily.py --year "$YEAR" --data-dir docs/data/cycling $FORCE_FLAG

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/cycling/stages.json docs/data/cycling/riders.json docs/data/cycling/.total_distance_cache.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-update TDF stage results"
          git push
