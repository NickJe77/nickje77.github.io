name: PGA Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests beautifulsoup4

      - name: Run PGA updater
        run: |
          python scripts/pga_update.py

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/golf/pga_winners.json docs/data/golf/players.json

          # 🔥 STOP if nothing changed
          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Update PGA data"

          # 🔥 FIX conflict issue
          git pull --rebase origin main || echo "Nothing to pull"

          git push
