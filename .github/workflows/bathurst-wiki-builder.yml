name: Bathurst Wiki Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  build-bathurst:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas lxml html5lib

      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/bathurst/seasons
          mkdir -p scripts

      - name: Run Bathurst wiki builder
        run: |
          python scripts/bathurst_wiki_builder.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/bathurst/
          git commit -m "Update Bathurst data" || echo "No changes"
          git push
