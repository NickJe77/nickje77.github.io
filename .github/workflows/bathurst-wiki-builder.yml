name: Bathurst Wiki Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  build-bathurst:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas lxml html5lib

      - name: Ensure folders exist
        run: |
          mkdir -p scripts
          mkdir -p docs/data/bathurst/seasons

      - name: Show script file
        run: |
          ls -la scripts
          test -f scripts/bathurst_wiki_builder.py

      - name: Run Bathurst wiki builder
        run: |
          python scripts/bathurst_wiki_builder.py

      - name: Show generated files
        run: |
          echo "---- seasons folder ----"
          ls -la docs/data/bathurst/seasons || true
          echo "---- file count ----"
          find docs/data/bathurst/seasons -type f | wc -l || true
          echo "---- index preview ----"
          if [ -f docs/data/bathurst/index.json ]; then
            head -n 40 docs/data/bathurst/index.json
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/bathurst/
          git commit -m "Update Bathurst data" || echo "No changes"
          git push
