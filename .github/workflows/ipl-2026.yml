name: IPL 2026 ESPN Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # CHECKOUT REPO
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # -------------------------
      # ENSURE FOLDER EXISTS
      # -------------------------
      - name: Ensure IPL folder exists
        run: |
          mkdir -p docs/data/ipl

      # -------------------------
      # RUN ESPN SCRAPER
      # -------------------------
      - name: Build IPL 2026 dataset
        run: |
          python scripts/build_ipl_2026.py

      # -------------------------
      # VERIFY OUTPUT
      # -------------------------
      - name: Check output file
        run: |
          if [ -f docs/data/ipl/ipl_2026.json ]; then
            echo "✅ ipl_2026.json created"
            wc -l docs/data/ipl/ipl_2026.json
          else
            echo "❌ Missing ipl_2026.json"
            exit 1
          fi

      # -------------------------
      # DEBUG (OPTIONAL BUT USEFUL)
      # -------------------------
      - name: List IPL files
        run: |
          echo "=== IPL DATA ==="
          ls -R docs/data/ipl

      # -------------------------
      # COMMIT CHANGES (SAFE)
      # -------------------------
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/ipl || true

          git diff --cached --quiet || git commit -m "Update IPL 2026 data"

          git push
