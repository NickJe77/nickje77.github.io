name: IPL 2026 Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPS
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests

      # -------------------------
      # DEBUG (OPTIONAL BUT GOOD)
      # -------------------------
      - name: List IPL folder
        run: |
          ls -R docs/data/ipl || true

      # -------------------------
      # BUILD FULL FILE
      # -------------------------
      - name: Build FULL 2026
        run: |
          python scripts/build_ipl_2026_full.py

      # -------------------------
      # BUILD RESULTS FILE
      # -------------------------
      - name: Build results
        run: |
          python scripts/build_ipl_2026_results.py

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/ipl || true

          git commit -m "Update IPL 2026 data" || echo "No changes"

          git push
