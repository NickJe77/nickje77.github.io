name: IPL 2026 Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Ensure folder
        run: mkdir -p docs/data/ipl

      - name: Build FULL file (safe)
        run: |
          python scripts/build_ipl_2026_full.py || echo "Skip"

      - name: Build season file
        run: |
          python scripts/build_ipl_2026.py || echo "Skip"

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/ipl || true
          git commit -m "Update IPL 2026 data" || echo "No changes"
          git push
