name: Build J-League Data
on:
  push:
    paths:
      - "docs/data/jleague/matches/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clear old data files
        run: |
          echo "[]" > docs/data/jleague/players.json
          echo "[]" > docs/data/jleague/teams.json
          echo "[]" > docs/data/jleague/team-stats.json
          echo "{}" > docs/data/jleague/match-records.json
      - name: Run build script
        run: |
          cd $GITHUB_WORKSPACE
          python scripts/build_jleague_data.py
      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/jleague/players.json \
                  docs/data/jleague/teams.json \
                  docs/data/jleague/team-stats.json \
                  docs/data/jleague/match-records.json
          git diff --cached --quiet || git commit -m "chore: rebuild J-League data [skip ci]"
          git pull --rebase origin main
          git push
