name: MLB Index Builder

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - name: Build index
    run: |
      mkdir -p docs/data/baseball/boxscores/2026

      ls docs/data/baseball/boxscores/2026 | grep .json | grep -v index.json > files.txt

      echo "[" > docs/data/baseball/boxscores/2026/index.json

      first=1
      while read line; do
        if [ $first -eq 1 ]; then
          first=0
        else
          echo "," >> docs/data/baseball/boxscores/2026/index.json
        fi
        echo "  \"$line\"" >> docs/data/baseball/boxscores/2026/index.json
      done < files.txt

      echo "]" >> docs/data/baseball/boxscores/2026/index.json

  - name: Commit
    run: |
      git config user.name "github-actions"
      git config user.email "actions@github.com"

      git add docs/data/baseball/boxscores/2026/index.json
      git commit -m "Update index" || echo "No changes"
      git push
```
