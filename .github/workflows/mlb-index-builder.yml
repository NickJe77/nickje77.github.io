name: MLB Index Builder

on:
workflow_dispatch:
schedule:
- cron: "0 6 * * *"

jobs:
build-index:
runs-on: ubuntu-latest

```
steps:
  # -------------------------
  # CHECKOUT
  # -------------------------
  - name: Checkout
    uses: actions/checkout@v4

  # -------------------------
  # SETUP PYTHON
  # -------------------------
  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: 3.11

  # -------------------------
  # RUN SCRIPT
  # -------------------------
  - name: Build index
    run: python scripts/build_mlb_index.py

  # -------------------------
  # COMMIT
  # -------------------------
  - name: Commit index
    run: |
      git config user.name "github-actions"
      git config user.email "actions@github.com"

      git add docs/data/baseball/boxscores/2026/index.json

      git commit -m "Update 2026 boxscore index" || echo "No changes"

      git push
```
