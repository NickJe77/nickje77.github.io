name: Bathurst Safe Rebuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run safe rebuild
        run: |
          python scripts/bathurst_rebuild_safe.py

      - name: Commit new files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/bathurst_new
          git commit -m "Build Bathurst safe output" || echo "No changes"
          git push
