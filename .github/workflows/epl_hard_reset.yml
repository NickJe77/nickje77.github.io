name: EPL Hard Reset

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Repo Structure
        run: |
          echo "ROOT:"
          ls

          echo ""
          echo "SCRIPTS:"
          ls scripts

          echo ""
          echo "EPL:"
          ls docs/data/epl

      - name: Run Hard Reset Script
        run: |
          python scripts/hard_reset_epl_cards.py

      - name: Verify Outputs
        run: |

          echo ""
          echo "PLAYERS:"
          ls docs/data/epl/players | head

          echo ""
          echo "TEAM STATS:"
          ls docs/data/epl/team_stats.json

      - name: Commit Changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/matches
          git add docs/data/epl/players
          git add docs/data/epl/team_stats.json

          git commit -m "Fix EPL corrupted card data" || echo "No changes"

          git push
