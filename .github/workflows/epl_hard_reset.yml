name: EPL Hard Reset

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Files
        run: |
          ls
          ls .github/workflows || true

      - name: Run Hard Reset
        run: |
          python hard_reset_epl_cards.py

      - name: Commit Changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/matches
          git add docs/data/epl/players
          git add docs/data/epl/team_stats.json

          git commit -m "Hard reset EPL cards" || echo "No changes"

          git push
