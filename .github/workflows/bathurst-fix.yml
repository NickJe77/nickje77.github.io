name: Bathurst Fix Drivers

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run fix
        run: |
          python scripts/bathurst_fix_drivers.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/bathurst
          git commit -m "Fix Bathurst driver names" || echo "No changes"
          git push
