name: Extract MLS Zip
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove broken nested folder
        run: |
          rm -rf docs/data/mls/mls
      - name: Clear previous extraction
        run: |
          # Without this, files from an earlier zip upload that aren't in
          # the CURRENT zip never get removed -- unzip -o only overwrites
          # matching filenames, it doesn't delete anything. Confirmed real
          # case on Ligue 1: removed seasons kept showing up in the live
          # data because their old extracted files just sat there untouched
          # across multiple re-extractions.
          rm -rf docs/data/mls/matches docs/data/mls/seasons
      - name: Extract MLS zip correctly
        run: |
          unzip -o docs/data/mls/mls.zip -d docs/data/
      - name: Verify structure
        run: |
          echo "----- MLS ROOT -----"
          ls docs/data/mls
          echo "----- MATCHES -----"
          find docs/data/mls/matches | head
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/mls/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Fix MLS extraction"
          git pull --rebase origin main
          git push
