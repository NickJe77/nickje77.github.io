name: Rebuild NBA index

on:
  push:
    paths:
      - 'data/nba/**.json'

jobs:
  rebuild-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Rebuild index.json
        run: |
          cd data/nba/2025
          ls *.json | sed 's/.json//' | sort > games.txt

          echo '{' > index.json
          echo '  "season": 2025,' >> index.json
          echo '  "games": [' >> index.json

          awk '{printf "    \"%s\",\n", $0}' games.txt >> index.json

          sed -i '$ s/,$//' index.json
          echo '  ]' >> index.json
          echo '}' >> index.json

      - name: Commit updated index
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/nba/2025/index.json
          git commit -m "Auto rebuild NBA index"
          git push
