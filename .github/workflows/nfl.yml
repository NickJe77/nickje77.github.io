name: NFL Full Rebuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pandas beautifulsoup4 lxml playwright
          playwright install

      - name: Run script
        run: |
          python nfl_rebuild_full_boxscores.py

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nfl/
          git commit -m "NFL rebuild" || echo "No changes"
          git push
