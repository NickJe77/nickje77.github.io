name: NFL Full Rebuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT REPO
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install deps
        run: |
          pip install pandas beautifulsoup4 lxml playwright
          playwright install

      # -------------------------
      # RUN YOUR SCRIPT (FIXED PATH)
      # -------------------------
      - name: Run script
        run: |
          python scripts/nfl_rebuild_full_boxscores.py

      # -------------------------
      # COMMIT OUTPUT
      # -------------------------
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nfl/
          git commit -m "NFL rebuild" || echo "No changes"
          git push
