name: Golf Data Cleaner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cleaner
        run: |
          python scripts/golf_clean_builder.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/golf/pga_winners.json
          git commit -m "Clean golf dataset" || echo "No changes"
          git push
