name: Scrape EPL Season

on:

  workflow_dispatch:
    inputs:
      season:
        description: 'Season to scrape, e.g. 2026-2027. Leave blank for the current season.'
        required: false
        default: ''

jobs:

  scrape:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies

        run: |

          pip install requests beautifulsoup4 lxml

      - name: Run scraper

        run: |

          python3 scripts/scrape_epl_season.py "${{ github.event.inputs.season }}"

      - name: Verify output

        run: |

          echo "----- SEASON FILES -----"

          ls docs/data/epl/seasons/

      - name: Commit updated data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/seasons/

          git commit -m "Update EPL season data" || echo "No changes"

          git push
