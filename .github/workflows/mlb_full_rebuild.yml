name: MLB FULL REBUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run rebuild
        run: python scripts/mlb_rebuild_all_boxscores.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/baseball/boxscores
          git commit -m "Rebuilt all MLB boxscores with full stats" || echo "No changes"
          git push
