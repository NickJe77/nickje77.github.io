name: Tennis Rebuild History

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - run: pip install requests

      - name: Rebuild history
        run: python scripts/tennis_rebuild_history.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/matches

          git commit -m "Rebuild tennis history 1968-2024" || echo "No changes"
          git push
