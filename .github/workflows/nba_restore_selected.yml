name: NBA Restore Selected Version

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Paste the COMMIT_HASH from the good exported version"
        required: true

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore NBA folder from selected commit
        run: |
          git checkout "${{ github.event.inputs.commit_hash }}" -- docs/data/nba

      - name: Commit restored NBA folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/nba
          git commit -m "Restore NBA folder from selected recovery version" || echo "No changes"
          git push
