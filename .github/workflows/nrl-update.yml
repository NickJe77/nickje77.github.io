name: Update NRL Data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update-nrl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run updater
        run: python scripts/nrl_auto_update.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "NRL auto update" || echo "No changes"
          git push
