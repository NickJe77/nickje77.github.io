name: Update NRL

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run updater
        run: python nrl_auto_update.py

      - name: Commit changes
        run: |
          git config --global user.name github-actions
          git config --global user.email actions@github.com
          git add docs/data/nrl/matches/2026.json
          git diff --cached --quiet || git commit -m "NRL update"
          git push
