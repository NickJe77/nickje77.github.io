name: NRL Auto Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests
          pip install beautifulsoup4

      - name: Run updater
        run: python scripts/nrl_updater.py

      - name: Commit changes
        run: |
          git config --global user.name "NRL Bot"
          git config --global user.email "actions@github.com"

          git add docs/data/nrl/

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "NRL auto update"
            git push
          fi
