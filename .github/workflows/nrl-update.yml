name: Update NRL Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-nrl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Show repo files
        run: |
          pwd
          find . -maxdepth 3 -type f | sort

      - name: Show script being executed
        run: |
          echo "===== START nrl_auto_update.py ====="
          nl -ba nrl_auto_update.py | sed -n '1,220p'
          echo "===== END nrl_auto_update.py ====="

      - name: Run updater
        run: python nrl_auto_update.py

      - name: Commit updated files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add docs/data/nrl/
          git commit -m "Automatic NRL update" || echo "No changes"
          git push
