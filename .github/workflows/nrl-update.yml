name: NRL UPDATE TEST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nrl:
    runs-on: ubuntu-latest

    steps:
      - name: CHECKOUT REPO
        uses: actions/checkout@v4

      - name: SETUP PYTHON
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: INSTALL REQUESTS
        run: pip install requests

      - name: SHOW LIVE FILE LIST
        run: |
          echo "PWD:"
          pwd
          echo ""
          echo "FILES:"
          find . -maxdepth 3 -type f | sort

      - name: SHOW LIVE SCRIPT CONTENT
        run: |
          echo "===== START OF ROOT nrl_auto_update.py ====="
          nl -ba nrl_auto_update.py | sed -n '1,220p'
          echo "===== END OF ROOT nrl_auto_update.py ====="

      - name: RUN ROOT NRL UPDATER
        run: python ./nrl_auto_update.py

      - name: COMMIT UPDATED FILES
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add docs/data/nrl/
          git commit -m "Automatic NRL update" || echo "No changes"
          git push
