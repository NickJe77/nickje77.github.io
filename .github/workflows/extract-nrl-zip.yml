name: Extract and Split NRL Data

on:
  push:
    paths:
      - 'docs/data/nrl/all_seasons.json.zip'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          cd docs/data/nrl
          unzip -o all_seasons.json.zip

      - name: Split into season files
        run: python split_nrl_seasons.py

      - name: Remove large JSON
        run: rm docs/data/nrl/all_seasons.json

      - name: Commit season files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/nrl/seasons/
          git diff --cached --quiet || git commit -m "Split NRL data into per-season files"
          git push
