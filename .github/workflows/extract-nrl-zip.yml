name: Extract NRL Data

on:
  push:
    paths:
      - 'docs/data/nrl/all_seasons.json.zip'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract all_seasons.json
        run: |
          cd docs/data/nrl
          unzip -o all_seasons.json.zip
          echo "Extracted successfully"

      - name: Commit extracted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/nrl/all_seasons.json
          git diff --cached --quiet || git commit -m "Extract all_seasons.json from zip"
          git push
