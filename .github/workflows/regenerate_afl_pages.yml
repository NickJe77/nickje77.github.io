name: Regenerate AFL Player Pages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the page generator
        working-directory: docs
        run: node generate-afl-player-pages.js

      - name: Move generated pages into docs/
        working-directory: docs
        run: |
          mv out-players/*.html .
          rmdir out-players

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/afl-player-*.html
          git commit -m "Regenerate AFL player pages" || echo "No changes"
          git push
