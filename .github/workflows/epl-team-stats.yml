name: EPL Team Stats Builder

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Team Stats
        run: python scripts/build_epl_team_stats.py

      - name: Commit Files
        run: |

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/epl/team_stats.json

          git commit -m "Update EPL team stats" || echo "No changes"

          git push
