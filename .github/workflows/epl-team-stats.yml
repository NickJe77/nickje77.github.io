name: Rebuild EPL Team Stats

on:
  workflow_dispatch:

jobs:
  rebuild-team-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Script Exists
        run: |
          ls -la scripts
          cat scripts/build_epl_team_stats.py | head -20

      - name: Run EPL Team Stats Builder
        run: python3 scripts/build_epl_team_stats.py

      - name: Verify Output
        run: |
          ls -la docs/data/epl
          cat docs/data/epl/team_stats.json | head -50

      - name: Commit Updated team_stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/team_stats.json

          git commit -m "Rebuild EPL team stats" || echo "No changes to commit"

          git pull --rebase origin main || echo "Nothing to pull"

          git push
