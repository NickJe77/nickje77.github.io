name: EPL Team Stats

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show script being run
        run: |
          echo "===== SCRIPT HEAD ====="
          head -40 scripts/build_epl_team_stats.py
          echo "===== SCRIPT PATH ====="
          pwd
          ls -la scripts/build_epl_team_stats.py

      - name: Run EPL team stats builder
        run: python3 scripts/build_epl_team_stats.py

      - name: Show output changed
        run: |
          echo "===== TEAM STATS HEAD ====="
          head -80 docs/data/epl/team_stats.json
          echo "===== GIT STATUS ====="
          git status --short
          echo "===== GIT DIFF ====="
          git diff -- docs/data/epl/team_stats.json | head -200

      - name: Commit updated team stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/team_stats.json

          git commit -m "Update EPL team stats" || echo "No changes to commit"

          git pull --rebase origin main || echo "Nothing to pull"

          git push
