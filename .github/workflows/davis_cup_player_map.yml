name: Build Player Country Map

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # CHECKOUT REPO
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # RUN SCRIPT (FIXED PATH)
      # -------------------------
      - name: Run builder
        run: python scripts/build_player_countries.py

      # -------------------------
      # COMMIT OUTPUT
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/player_countries.json

          git commit -m "Update player country map" || echo "No changes"

          git push
