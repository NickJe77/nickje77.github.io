name: Build Player Country Map

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run builder
        run: python build_player_countries.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/tennis/player_countries.json
          git commit -m "Update player countries" || echo "No changes"
          git push
