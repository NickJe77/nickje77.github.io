name: Build EPL Data

on:
  push:
    paths:
      - "docs/data/epl/matches/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug - count West Ham red cards manually
        run: |
          python3 - <<'EOF'
          import json, glob

          yellow_total = 0
          red_total = 0
          red_matches = []

          files = sorted(glob.glob("docs/data/epl/matches/2025-2026/*.json"))
          print(f"Scanning {len(files)} files in 2025-2026...\n")

          for f in files:
              data = json.load(open(f))
              reds = [c for c in (data.get("red_cards") or []) if c.get("team") == "West Ham United"]
              yellows = [c for c in (data.get("yellow_cards") or []) if c.get("team") == "West Ham United"]
              if reds:
                  red_total += len(reds)
                  red_matches.append((f, reds))
              yellow_total += len(yellows)

          print(f"West Ham yellow cards: {yellow_total}")
          print(f"West Ham red cards:    {red_total}")
          print(f"\nMatches with red cards:")
          for f, reds in red_matches:
              print(f"  {f}: {reds}")
          EOF

      - name: Run build script
        run: python scripts/build_epl_data.py

      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/epl/players.json \
                  docs/data/epl/teams.json \
                  docs/data/epl/team-stats.json
          git diff --cached --quiet || git commit -m "chore: rebuild EPL data [skip ci]"
          git push
