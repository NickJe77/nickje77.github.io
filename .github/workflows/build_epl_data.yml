name: Build EPL Data

on:
  push:
    paths:
      # Only runs when match files are added or changed
      - "docs/data/epl/matches/**"
  workflow_dispatch:  # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed to push the generated JSON files back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug - inspect matches with red cards
        run: |
          python3 - <<'EOF'
          import json, glob

          files = sorted(glob.glob("docs/data/epl/matches/2025-2026/*.json"))
          shown = 0
          for f in files:
              data = json.load(open(f))
              if data.get("red_cards"):
                  print(f"FILE: {f}")
                  print(f"  yellow_cards: {data.get('yellow_cards')}")
                  print(f"  red_cards:    {data.get('red_cards')}")
                  print()
                  shown += 1
                  if shown >= 5:
                      break

          if shown == 0:
              print("No matches with red cards found in 2025-2026")
          EOF

      - name: Run build script
        run: python scripts/build_epl_data.py

      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/epl/players.json \
                  docs/data/epl/teams.json \
                  docs/data/epl/team-stats.json
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "chore: rebuild EPL data [skip ci]"
          git push
