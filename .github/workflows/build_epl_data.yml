name: Build EPL Data
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run build script
        run: |
          python3 -c "import base64; open('/tmp/build_epl.py','w',encoding='utf-8').write(base64.b64decode('').decode('utf-8'))"
          python3 /tmp/build_epl.py
      - name: Debug output
        run: ls docs/data/epl/
      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/epl/players.json docs/data/epl/teams.json docs/data/epl/team-stats.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Build EPL data"
          git pull --rebase origin main
          git push origin HEAD
