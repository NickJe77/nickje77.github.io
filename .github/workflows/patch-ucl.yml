name: Patch UCL Match Files
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write and run patch script
        run: |
          python3 -c "
          import json
          from pathlib import Path
          MATCH_DIR = Path('docs/data/ucl/matches')
          TEAM_NAME_MAP = {
              'Man Utd': 'Manchester United',
              'Man United': 'Manchester United',
              'B. Dortmund': 'Borussia Dortmund',
              'Dortmund': 'Borussia Dortmund',
              'Bayern': 'Bayern Munich',
              'FC Bayern': 'Bayern Munich',
              'FC Bayern Munich': 'Bayern Munich',
              'B. Munich': 'Bayern Munich',
              'Paris': 'Paris Saint-Germain',
              'PSG': 'Paris Saint-Germain',
              'Inter': 'Internazionale',
              'Inter Milan': 'Internazionale',
              'FC Internazionale': 'Internazionale',
              'Atletico': 'Atletico Madrid',
              'Atletico de Madrid': 'Atletico Madrid',
              'S. Bratislava': 'Slovan Bratislava',
              'Crvena Zvezda': 'Red Star Belgrade',
              'FK Crvena zvezda': 'Red Star Belgrade',
              'Milan': 'AC Milan',
              'Juventus FC': 'Juventus',
              'FCB': 'Barcelona',
              'FC Barcelona': 'Barcelona',
              'Real': 'Real Madrid',
              'FC Porto': 'Porto',
              'FC Valencia': 'Valencia',
              'Bayer Leverkusen': 'Leverkusen',
              'Bayer 04': 'Leverkusen',
              'Olympique Lyon': 'Lyon',
              'Olympique de Marseille': 'Marseille',
              'AS Roma': 'Roma',
              'SS Lazio': 'Lazio',
              'ACF Fiorentina': 'Fiorentina',
              'AFC Ajax': 'Ajax',
              'PSV': 'PSV Eindhoven',
              'Sporting': 'Sporting CP',
              'Sporting Lisbon': 'Sporting CP',
              'Zenit': 'Zenit St. Petersburg',
              'RB Salzburg': 'Red Bull Salzburg',
              'Shakhtar': 'Shakhtar Donetsk',
              'Celtic FC': 'Celtic',
              'Rangers FC': 'Rangers',
              'SL Benfica': 'Benfica',
              'Galatasaray SK': 'Galatasaray',
              'Club Brugge KV': 'Club Brugge',
          }
          def normalise(name):
              name = (name or '').strip()
              return TEAM_NAME_MAP.get(name, name)
          def patch_file(path):
              with open(path, encoding='utf-8') as f:
                  match = json.load(f)
              changed = False
              for key in ('home_team', 'away_team', 'home', 'away'):
                  if key in match:
                      normed = normalise(match[key])
                      if normed != match[key]:
                          match[key] = normed
                          changed = True
              home_team = normalise(match.get('home_team') or match.get('home') or '')
              away_team = normalise(match.get('away_team') or match.get('away') or '')
              lineup_map = {}
              for player in match.get('home_lineup') or []:
                  if player:
                      lineup_map[player.strip()] = home_team
              for player in match.get('away_lineup') or []:
                  if player:
                      lineup_map[player.strip()] = away_team
              for section in ('scorers', 'yellow_cards', 'red_cards'):
                  for event in match.get(section) or []:
                      raw = (event.get('team') or '').strip()
                      normed = normalise(raw)
                      if normed != raw:
                          event['team'] = normed
                          changed = True
                      if not event.get('team'):
                          player = (event.get('player') or '').strip()
                          if player in lineup_map:
                              event['team'] = lineup_map[player]
                              changed = True
              if changed:
                  with open(path, 'w', encoding='utf-8') as f:
                      json.dump(match, f, indent=2, ensure_ascii=False)
              return changed
          files = sorted(MATCH_DIR.rglob('*.json'))
          print(f'Found {len(files)} files')
          patched = 0
          for path in files:
              try:
                  if patch_file(path):
                      patched += 1
              except Exception as e:
                  print(f'Error: {path}: {e}')
          print(f'Patched {patched} files')
          "

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ucl/matches/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Patch UCL match files - fix team names and blank fields"
          git pull --rebase origin main
          git push origin main
