name: Rebuild EPL Derived Files

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify EPL folders
        run: |
          ls docs/data/epl || true
          ls docs/data/epl/matches | head || true

      - name: Run rebuild script
        run: |
          python scripts/rebuild_epl_derived.py

      - name: Verify output
        run: |
          echo "---- TEAM STATS ----"
          ls docs/data/epl/team_stats.json || true

          echo "---- PLAYERS ----"
          ls docs/data/epl/players | head || true

          echo "---- RED CARD CHECK ----"
          grep -n "Jamie Redknapp" docs/data/epl/team_stats.json || true

      - name: Commit rebuilt files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/epl

          git status

          git commit -m "Rebuild EPL derived files" || echo "No changes to commit"

      - name: Pull latest
        run: |
          git pull --rebase origin main || true

      - name: Push changes
        run: |
          git push
