name: Rebuild EPL Derived Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify folders
        run: |
          ls
          ls docs
          ls docs/data
          ls docs/data/epl
          ls docs/data/epl/seasons | head

      - name: Run rebuild script
        run: |
          python scripts/rebuild_epl_derived.py

      - name: Verify output
        run: |
          echo "----- TEAM STATS -----"
          ls docs/data/epl/team_stats.json

          echo "----- PLAYERS -----"
          ls docs/data/epl/players | head -20

          echo "----- RED CARD CHECK -----"
          grep -i "red_cards" docs/data/epl/team_stats.json | head

      - name: Commit rebuild files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/

          git status

          git commit -m "Rebuild EPL derived files" || echo "No changes"

      - name: Pull latest
        run: |
          git pull --rebase origin main || echo "Nothing to pull"

      - name: Push
        run: |
          git push
