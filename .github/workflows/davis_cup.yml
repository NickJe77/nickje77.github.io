name: Davis Cup Scraper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🔥 THIS IS THE FIX
      - name: Install Playwright properly
        run: |
          pip install playwright
          playwright install chromium

      - name: Run scraper
        run: |
          python scripts/davis_cup_scraper.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/tennis/davis_cup/
          git commit -m "Davis Cup scraper" || echo "No changes"
          git push
