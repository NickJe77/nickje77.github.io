name: MLB FAST FULL REBUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install deps
        run: |
          pip install requests

      # -------------------------
      # RUN SCRIPT
      # -------------------------
      - name: Run fast rebuild
        run: |
          python scripts/mlb_fast_rebuild.py

      # -------------------------
      # COMMIT (FIXED)
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 🔥 CRITICAL FIX (prevents push failure)
          git pull --rebase origin main

          git add docs/data/baseball/boxscores
          git commit -m "Fast rebuild MLB boxscores (full history)" || echo "No changes"
          git push
