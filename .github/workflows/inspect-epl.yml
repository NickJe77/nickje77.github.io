name: Inspect EPL Players JSON

on:
  workflow_dispatch:

jobs:
  inspect:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect JSON
        run: |

          python3 << 'PYTHON'

          import json

          FILE = "docs/data/epl/players.json"

          with open(FILE, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("\nTOTAL ROWS:")
          print(len(data))

          print("\nFIRST ROW:\n")

          print(json.dumps(data[0], indent=2))

          PYTHON
