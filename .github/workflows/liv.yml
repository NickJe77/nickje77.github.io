name: LIV Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🔥 THIS IS WHAT YOU WERE MISSING
      - name: Install deps
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        run: python scripts/liv_full_builder.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/golf/liv
          git commit -m "Update LIV data" || echo "No changes"
          git push
