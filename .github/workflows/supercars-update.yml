name: Update Supercars Data

on:
  schedule:
    - cron: '0 9 * * *'   # daily, 09:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to scrape (defaults to current year)'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # supercars_pipeline.py is pure requests + BeautifulSoup -- no
      # browser needed, unlike the NASCAR pipeline.
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run pipeline (scrape + rebuild index)
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then YEAR=$(date +%Y); fi
          python3 scripts/supercars_pipeline.py --year "$YEAR" --data-dir docs/data/supercars

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/supercars/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-update Supercars data"
          git push
