name: Rebuild Supercars Index

# Runs automatically whenever you upload/update a supercars_YYYY.json
# file, or you can trigger it manually. No scraping happens here at all
# -- that runs on your Desktop. This just rebuilds index.json and
# drivers.json from whatever season files already exist in the repo.
on:
  push:
    paths:
      - 'docs/data/supercars/supercars_*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild index.json and drivers.json
        run: |
          python3 scripts/build_supercars_official_index.py --data-dir docs/data/supercars --out-dir docs/data/supercars

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/supercars/index.json docs/data/supercars/drivers.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Rebuild Supercars index.json and drivers.json"
          git push
