name: Build Baseball Players All Years

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/baseball/players
          mkdir -p scripts

      - name: Build player files
        run: |
          python scripts/build_baseball_players_all_years.py

      - name: Commit updated player files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/baseball/players/

          git commit -m "Rebuild baseball player files from all seasons" || echo "No changes"

          git push
