name: Fix EPL Cards

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug - inspect bad West Ham matches
        run: |
          python3 - <<'EOF'
          import json, glob

          # Check a sample of the known bad matches
          bad_matches = [
              "docs/data/epl/matches/2025-2026/2025-2026_0060.json",
              "docs/data/epl/matches/2025-2026/2025-2026_0063.json",
              "docs/data/epl/matches/2025-2026/2025-2026_0081.json",
              "docs/data/epl/matches/2025-2026/2025-2026_0148.json",
          ]

          for f in bad_matches:
              try:
                  data = json.load(open(f))
                  print(f"FILE: {f}")
                  print(f"  home: {data.get('home_team')} vs away: {data.get('away_team')}")
                  print(f"  yellow_cards: {data.get('yellow_cards')}")
                  print(f"  red_cards:    {data.get('red_cards')}")
                  print()
              except Exception as e:
                  print(f"ERROR reading {f}: {e}")
          EOF

      - name: Rebuild EPL data
        run: python scripts/build_epl_data.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/epl/players.json \
                  docs/data/epl/teams.json \
                  docs/data/epl/team-stats.json
          git diff --cached --quiet || git commit -m "chore: rebuild EPL data [skip ci]"
          git push
