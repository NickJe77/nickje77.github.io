name: AFL Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - name: Scrape AFL
        run: python scripts/afl_footywire_to_flat.py

      - name: Clean players
        run: |
          rm -rf docs/data/afl/players
          rm -f docs/data/afl/players.json

      - name: Build players
        run: python scripts/build_afl_players.py

      - name: Force change
        run: date > last_run.txt

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update AFL data" || echo "No changes"
          git push
