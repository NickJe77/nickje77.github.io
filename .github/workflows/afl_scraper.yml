name: AFL Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # 🔍 DEBUG — SHOW FILE STRUCTURE (VERY IMPORTANT)
      - name: Debug file structure
        run: |
          echo "=== ROOT ==="
          ls -R

      # ✅ RUN THE CORRECT SCRIPT
      - name: Run AFL scraper
        run: |
          python scripts/afl_footywire_to_flat.py

      # 🔍 DEBUG — SHOW OUTPUT FILE CONTENT
      - name: Check output file
        run: |
          echo "=== OUTPUT FILE ==="
          cat docs/data/afl/afl_2026.json || echo "File not found"

      # ✅ COMMIT EVERYTHING (NO MISS)
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update AFL data" || echo "No changes"
          git push
