name: AFL Stats Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run AFL scraper
        run: |
          python scripts/afl_stats_scraper.py

      - name: Move files into site structure
        run: |
          mkdir -p docs/data/afl
          mv ~/Desktop/afl_2026.json docs/data/afl/afl_2026.json || true
          mv ~/Desktop/afl_2026_matches.json docs/data/afl/afl_2026_matches.json || true
          mv ~/Desktop/players_2026.json docs/data/afl/players_2026.json || true

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/afl
          git commit -m "Update AFL 2026 data" || echo "No changes"
          git push
