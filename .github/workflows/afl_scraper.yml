name: AFL Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # 🔍 DEBUG — SHOW FILE STRUCTURE
      - name: Debug file structure
        run: |
          echo "=== ROOT ==="
          ls -R

      # ✅ STEP 1 — SCRAPE MATCH DATA
      - name: Run AFL scraper
        run: |
          python scripts/afl_footywire_to_flat.py

      # 🔍 CHECK MATCH OUTPUT
      - name: Check match file
        run: |
          echo "=== MATCH FILE ==="
          cat docs/data/afl/afl_2026.json || echo "File not found"

      # ✅ STEP 2 — BUILD PLAYER FILES
      - name: Build AFL players
        run: |
          python scripts/build_afl_players.py

      # 🔍 CHECK PLAYER OUTPUTS
      - name: Check player files
        run: |
          echo "=== PLAYERS 2026 ==="
          cat docs/data/afl/players_2026.json || echo "Missing"

          echo "=== PLAYERS MASTER ==="
          cat docs/data/afl/players.json || echo "Missing"

      # ✅ COMMIT EVERYTHING
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update AFL data + players" || echo "No changes"
          git push
