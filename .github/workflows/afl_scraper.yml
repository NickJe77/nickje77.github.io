name: AFL Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      # STEP 1 — SCRAPER
      - name: Run AFL scraper
        run: |
          python scripts/afl_footywire_to_flat.py

      # STEP 2 — PLAYER BUILDER (NEW CLEAN SCRIPT)
      - name: Build AFL players
        run: |
          python scripts/build_afl_players.py

      # STEP 3 — COMMIT
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update AFL data + players" || echo "No changes"
          git push
