name: NHL Player Records Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build player records
        run: python scripts/nhl_player_records_builder.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nhl/player-records.json
          git diff --cached --quiet || git commit -m "Build NHL player records"
          git pull origin main --no-rebase --no-edit -X ours
          git push
