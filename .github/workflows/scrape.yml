name: Scrape World Cup 2026

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:        # manual trigger from Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        env:
          FD_API_TOKEN: ${{ secrets.FD_API_TOKEN }}
        run: python scripts/scrape_fbref.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/world-cup.json
          git diff --cached --quiet || git commit -m "chore: update World Cup 2026 results [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
