name: Davis Cup Scraper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL PLAYWRIGHT (THIS WAS MISSING)
      # -------------------------
      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install chromium

      # -------------------------
      # RUN SCRAPER
      # -------------------------
      - name: Run scraper
        run: |
          python scripts/davis_cup_scraper.py

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/davis_cup/

          git commit -m "Davis Cup data (with doubles)" || echo "No changes"

          git push
