name: Build NBA Season Indexes
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start season"
        required: true
        default: "1976"
      end:
        description: "End season"
        required: true
        default: "2025"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install boto3

      - name: Build season and player indexes
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python << 'PYEOF'
          import boto3
          import json
          import os
          from collections import defaultdict
          from botocore.config import Config

          r2 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4"),
              region_name="auto",
          )

          BUCKET = "sporting-almanac-data"
          start  = int("${{ github.event.inputs.start }}")
          end    = int("${{ github.event.inputs.end }}")

          def upload(key, data):
              r2.put_object(
                  Bucket=BUCKET,
                  Key=key,
                  Body=json.dumps(data).encode("utf-8"),
                  ContentType="application/json",
              )

          for season in range(start, end + 1):
              print(f"Processing season {season}...", flush=True)
              prefix = f"basketball/boxscores/{season}/"

              paginator = r2.get_paginator("list_objects_v2")
              pages = paginator.paginate(Bucket=BUCKET, Prefix=prefix)

              season_games = []
              season_players = {}

              for page in pages:
                  for obj in page.get("Contents", []):
                      key = obj["Key"]
                      try:
                          data = json.loads(r2.get_object(Bucket=BUCKET, Key=key)["Body"].read())

                          game_id   = data.get("game_id", "")
                          date      = data.get("date", "")
                          home_team = data.get("home", "")
                          away_team = data.get("away", "")
                          arena     = data.get("arena", "")
                          linescore = data.get("linescore", {})
                          teams     = data.get("teams", {})

                          home_score = None
                          away_score = None
                          for abbr, quarters in linescore.items():
                              try:
                                  score = int(quarters.get("T", 0))
                              except (ValueError, TypeError):
                                  score = None
                              if game_id.endswith(abbr):
                                  home_score = score
                              else:
                                  away_score = score

                          season_games.append({
                              "game_id":    game_id,
                              "date":       date,
                              "away":       away_team,
                              "home":       home_team,
                              "away_score": away_score,
                              "home_score": home_score,
                              "arena":      arena,
                          })

                          for abbr, team_players in teams.items():
                              if game_id.endswith(abbr):
                                  team_name = home_team
                                  opp_name  = away_team
                              else:
                                  team_name = away_team
                                  opp_name  = home_team

                              for p in team_players:
                                  if p.get("dnp") or not p.get("player_id"):
                                      continue

                                  pid  = p["player_id"]
                                  name = p.get("player", "")

                                  if pid not in season_players:
                                      season_players[pid] = {"name": name, "player_id": pid, "games": []}

                                  season_players[pid]["games"].append({
                                      "season":     season,
                                      "game_id":    game_id,
                                      "date":       date,
                                      "team":       team_name,
                                      "opp":        opp_name,
                                      "home_score": home_score,
                                      "away_score": away_score,
                                      "mp":         p.get("mp"),
                                      "pts":        p.get("pts"),
                                      "reb":        p.get("trb"),
                                      "ast":        p.get("ast"),
                                      "stl":        p.get("stl"),
                                      "blk":        p.get("blk"),
                                      "tov":        p.get("tov"),
                                      "fg":         p.get("fg"),
                                      "fga":        p.get("fga"),
                                      "fg_pct":     p.get("fg_pct"),
                                      "fg3":        p.get("fg3"),
                                      "fg3a":       p.get("fg3a"),
                                      "fg3_pct":    p.get("fg3_pct"),
                                      "ft":         p.get("ft"),
                                      "fta":        p.get("fta"),
                                      "ft_pct":     p.get("ft_pct"),
                                      "orb":        p.get("orb"),
                                      "drb":        p.get("drb"),
                                      "pf":         p.get("pf"),
                                      "plus_minus": p.get("plus_minus"),
                                  })

                      except Exception as e:
                          print(f"  Error reading {key}: {e}", flush=True)

              season_games.sort(key=lambda g: g["date"])
              upload(f"basketball/indexes/{season}.json", season_games)
              print(f"  Season index done: {len(season_games)} games", flush=True)

              print(f"  Uploading {len(season_players)} player files...", flush=True)
              uploaded = 0
              for pid, player_data in season_players.items():
                  player_key = f"basketball/players/{pid}.json"
                  # Try to get existing player file and merge
                  try:
                      existing = json.loads(r2.get_object(Bucket=BUCKET, Key=player_key)["Body"].read())
                      existing_ids = {g["game_id"] for g in existing.get("games", [])}
                      new_games = [g for g in player_data["games"] if g["game_id"] not in existing_ids]
                      existing["games"].extend(new_games)
                      existing["games"].sort(key=lambda g: g["date"])
                      upload(player_key, existing)
                  except:
                      player_data["games"].sort(key=lambda g: g["date"])
                      upload(player_key, player_data)
                  uploaded += 1

              print(f"  Players uploaded: {uploaded}", flush=True)

          print("All done!", flush=True)
          PYEOF
