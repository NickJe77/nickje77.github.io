name: Rebuild NBA indexes

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/data/nba/**/*.json'

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Rebuild NBA season indexes
        run: |

          for dir in docs/data/nba/*; do
            if [ -d "$dir" ]; then

              season=$(basename "$dir")

              cd "$dir"

              # get all game files
              ls *.json 2>/dev/null | grep -v index.json | sed 's/.json//' | sed 's/^0*//' | sort > games.txt

              echo '{' > index.json
              echo "  \"season\": $season," >> index.json
              echo '  "games": [' >> index.json

              awk '{printf "    \"%s\",\n", $0}' games.txt >> index.json

              # remove trailing comma
              sed -i '$ s/,$//' index.json

              echo '  ]' >> index.json
              echo '}' >> index.json

              rm games.txt

              cd - > /dev/null

            fi
          done

      - name: Commit updated indexes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nba/**/index.json
          git commit -m "Rebuild NBA indexes automatically" || echo "No changes"
          git push
