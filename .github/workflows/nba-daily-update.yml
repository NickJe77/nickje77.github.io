name: NBA Daily Update
on:
  schedule:
    - cron: '0 10 * * *'  # 10am UTC = 8pm AEST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests beautifulsoup4 lxml boto3

      - name: Scrape new games
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # Work out current season (year season ends)
          MONTH=$(date -u +'%m')
          YEAR=$(date -u +'%Y')
          if [ "$MONTH" -ge 10 ]; then
            SEASON=$((YEAR + 1))
          else
            SEASON=$YEAR
          fi
          echo "Current season: $SEASON"
          python scripts/nba_full_rebuild.py --start $SEASON --end $SEASON --overwrite

      - name: Commit schedules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/basketball/schedules
          git diff --staged --quiet || git commit -m "Update NBA schedules $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push || true

      - name: Rebuild season index and player files
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python << 'PYEOF'
          import boto3
          import json
          import os
          from datetime import datetime
          from botocore.config import Config
          from botocore.exceptions import ClientError

          r2 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4"),
              region_name="auto",
          )

          BUCKET = "sporting-almanac-data"
          now    = datetime.utcnow()
          SEASON = (now.year + 1) if now.month >= 10 else now.year

          def upload(key, data):
              r2.put_object(
                  Bucket=BUCKET, Key=key,
                  Body=json.dumps(data, ensure_ascii=True).encode("utf-8"),
                  ContentType="application/json",
              )

          def get_json(key):
              try:
                  return json.loads(r2.get_object(Bucket=BUCKET, Key=key)["Body"].read().decode("utf-8"))
              except ClientError as e:
                  if e.response["Error"]["Code"] in ("NoSuchKey", "404"): return None
                  raise

          def is_playoff(date_str):
              try:
                  d = datetime.strptime(date_str, "%a, %b %d, %Y")
                  if d.month in (5, 6): return True
                  if d.month == 4 and d.day >= 16: return True
              except: pass
              return False

          print(f"Rebuilding indexes for season {SEASON}...", flush=True)

          season_games   = []
          season_players = {}

          paginator = r2.get_paginator("list_objects_v2")
          for page in paginator.paginate(Bucket=BUCKET, Prefix=f"basketball/boxscores/{SEASON}/"):
              for obj in page.get("Contents", []):
                  key = obj["Key"]
                  try:
                      data      = json.loads(r2.get_object(Bucket=BUCKET, Key=key)["Body"].read().decode("utf-8"))
                      game_id   = data.get("game_id", "")
                      date      = data.get("date", "")
                      home_team = data.get("home", "")
                      away_team = data.get("away", "")
                      linescore = data.get("linescore", {})
                      teams     = data.get("teams", {})
                      playoff   = is_playoff(date)

                      # linescore keys are team abbreviations, game_id ends with home abbr
                      home_score = away_score = None
                      for abbr, quarters in linescore.items():
                          try: score = int(quarters.get("T", 0))
                          except: score = None
                          if game_id.endswith(abbr): home_score = score
                          else: away_score = score

                      season_games.append({
                          "game_id": game_id, "date": date,
                          "away": away_team, "home": home_team,
                          "away_score": away_score, "home_score": home_score,
                          "arena": data.get("arena", ""), "playoff": playoff,
                      })

                      for abbr, team_players in teams.items():
                          team_name = home_team if game_id.endswith(abbr) else away_team
                          opp_name  = away_team if game_id.endswith(abbr) else home_team
                          for p in team_players:
                              if p.get("dnp") or not p.get("player_id"): continue
                              pid = p["player_id"]
                              if pid not in season_players:
                                  season_players[pid] = {"name": p.get("player",""), "player_id": pid, "games": []}
                              season_players[pid]["games"].append({
                                  "season": SEASON, "game_id": game_id, "date": date,
                                  "team": team_name, "opp": opp_name, "playoff": playoff,
                                  "home_score": home_score, "away_score": away_score,
                                  "mp": p.get("mp"), "pts": p.get("pts"), "reb": p.get("trb"),
                                  "ast": p.get("ast"), "stl": p.get("stl"), "blk": p.get("blk"),
                                  "tov": p.get("tov"), "fg": p.get("fg"), "fga": p.get("fga"),
                                  "fg_pct": p.get("fg_pct"), "fg3": p.get("fg3"), "fg3a": p.get("fg3a"),
                                  "fg3_pct": p.get("fg3_pct"), "ft": p.get("ft"), "fta": p.get("fta"),
                                  "ft_pct": p.get("ft_pct"), "orb": p.get("orb"), "drb": p.get("drb"),
                                  "pf": p.get("pf"), "plus_minus": p.get("plus_minus"),
                              })
                  except Exception as e:
                      print(f"  Error {key}: {e}", flush=True)

          season_games.sort(key=lambda g: g["date"])
          upload(f"basketball/indexes/{SEASON}.json", season_games)
          print(f"Season index: {len(season_games)} games", flush=True)

          for pid, new_data in season_players.items():
              existing = get_json(f"basketball/players/{pid}.json")
              if existing:
                  existing_ids = {g["game_id"] for g in existing.get("games", [])}
                  for g in new_data["games"]:
                      if g["game_id"] not in existing_ids:
                          existing["games"].append(g)
                  existing["games"].sort(key=lambda g: g["date"])
                  upload(f"basketball/players/{pid}.json", existing)
              else:
                  new_data["games"].sort(key=lambda g: g["date"])
                  upload(f"basketball/players/{pid}.json", new_data)
          print(f"Player files: {len(season_players)}", flush=True)

          # Season leaders
          qualified = []
          for pid, pdata in season_players.items():
              games = [g for g in pdata["games"] if not g.get("playoff")]
              if len(games) < 20: continue
              gp  = len(games)
              pts = sum(g.get("pts") or 0 for g in games)
              reb = sum(g.get("reb") or 0 for g in games)
              ast = sum(g.get("ast") or 0 for g in games)
              stl = sum(g.get("stl") or 0 for g in games)
              blk = sum(g.get("blk") or 0 for g in games)
              qualified.append({"name": pdata["name"], "pid": pid,
                  "gp": gp, "pts": pts, "reb": reb, "ast": ast, "stl": stl, "blk": blk})

          def leader(stat):
              best = max(qualified, key=lambda p: p[stat]/p["gp"] if p["gp"]>0 else 0, default=None)
              if not best: return None
              return {"player": best["name"], "player_id": best["pid"],
                      "total": best[stat], "gp": best["gp"], "avg": round(best[stat]/best["gp"],1)}

          upload(f"basketball/leaders/{SEASON}.json", {
              "season": SEASON, "points": leader("pts"), "rebounds": leader("reb"),
              "assists": leader("ast"), "steals": leader("stl"), "blocks": leader("blk"),
          })
          print("All done!", flush=True)
          PYEOF
