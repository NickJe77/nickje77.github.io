name: NHL Full History Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests

      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/nhl/seasons

      - name: Build ALL seasons
        run: |
          python scripts/nhl_full_history_builder.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nhl/seasons
          git commit -m "Build NHL full history" || echo "No changes"
          git push
