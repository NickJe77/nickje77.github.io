name: NHL 2026 Builder (Fixed)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests

      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/nhl/seasons

      - name: Build NHL 2026
        run: |
          python scripts/nhl_2026_fixed.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/nhl/seasons/2026.json
          git commit -m "Update NHL 2026 season" || echo "No changes"
          git push
