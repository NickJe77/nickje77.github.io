name: On This Day Builder

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL
      # -------------------------
      - name: Install deps
        run: pip install pytz

      # -------------------------
      # ENSURE FOLDER
      # -------------------------
      - name: Ensure data folder
        run: mkdir -p docs/data

      # -------------------------
      # RUN SCRIPT
      # -------------------------
      - name: Build
        run: python scripts/build_on_this_day.py

      # -------------------------
      # DEBUG (IMPORTANT)
      # -------------------------
      - name: Check output
        run: |
          ls -lah docs/data
          cat docs/data/onthisday.json || echo "No file"

      # -------------------------
      # COMMIT (SAFE)
      # -------------------------
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [ -f docs/data/onthisday.json ]; then
            git add docs/data/onthisday.json
            git commit -m "Update On This Day" || echo "No changes"
            git push
          else
            echo "❌ File not created"
            exit 1
          fi
