name: On This Day Builder

on:
  schedule:
    - cron: "0 18 * * *"   # 6am Melbourne time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPS
      # -------------------------
      - name: Install dependencies
        run: |
          pip install pytz

      # -------------------------
      # ENSURE DATA FOLDER
      # -------------------------
      - name: Ensure data folder exists
        run: |
          mkdir -p docs/data

      # -------------------------
      # RUN BUILDER
      # -------------------------
      - name: Build On This Day
        run: |
          python scripts/build_on_this_day.py

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/onthisday.json

          git commit -m "Update On This Day" || echo "No changes"

          git push
