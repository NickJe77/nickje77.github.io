name: On This Day Builder

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily (adjust time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Build On This Day
        run: python scripts/build_on_this_day.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/onthisday.json
          git commit -m "Update On This Day" || echo "No changes"
          git push
