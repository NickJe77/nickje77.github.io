name: On This Day Builder
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pytz
      - name: Ensure data folder
        run: mkdir -p docs/data
      - name: Build
        run: python scripts/build_on_this_day.py
      - name: Debug output
        run: |
          ls -lah docs/data
          cat docs/data/on_this_day.json || echo "No file"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -f docs/data/on_this_day.json ]; then
            git add docs/data/on_this_day.json
            git commit -m "Update On This Day" || echo "No changes"
            git pull --rebase origin main
            git push
          else
            echo "❌ File not created"
            exit 1
          fi
