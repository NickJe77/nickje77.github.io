name: Bathurst Scraper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: mkdir -p docs/data/bathurst

      - run: python scripts/bathurst_scraper.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/bathurst
          git commit -m "Full Bathurst rebuild" || echo "No changes"
          git push
