name: Bathurst Rebuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests beautifulsoup4

      - name: Ensure output folder
        run: |
          mkdir -p docs/data/bathurst

      - name: Run Bathurst rebuild
        run: |
          python scripts/bathurst_rebuild.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/bathurst
          git commit -m "Rebuild Bathurst data" || echo "No changes"
          git push
