name: Bathurst Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas requests beautifulsoup4 lxml

      - name: Run Bathurst builder
        run: |
          python scripts/bathurst_builder.py

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/bathurst/

          # 🔥 Prevent failure when nothing changed
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Bathurst update"
          git push
