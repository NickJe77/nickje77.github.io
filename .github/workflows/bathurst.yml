name: Bathurst Rebuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ Install everything your script needs
      - name: Install dependencies
        run: |
          pip install pandas requests beautifulsoup4 lxml

      # ✅ Ensure folders exist (important)
      - name: Ensure output folders
        run: |
          mkdir -p docs/data/bathurst/seasons

      # ✅ Run your script
      - name: Run Bathurst rebuild
        run: |
          python scripts/bathurst_rebuild.py

      # ✅ Commit + FIXED PUSH (this solves your error)
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git pull --rebase

          git add docs/data/bathurst
          git commit -m "Rebuild Bathurst data" || echo "No changes"
          git push
