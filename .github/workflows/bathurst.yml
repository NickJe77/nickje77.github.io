name: Bathurst Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests beautifulsoup4 pandas lxml

      - name: Run builders
        run: |
          python scripts/bathurst_build_winners.py
          python scripts/bathurst_build_seasons.py
          python scripts/bathurst_build_drivers.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/bathurst/

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Bathurst rebuild"

          git pull --rebase origin main || echo "Nothing to pull"

          git push
