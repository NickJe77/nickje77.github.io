name: Build Ligue 1 Data
on:
  push:
    paths:
      - "docs/data/ligue1/matches/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run build script
        run: python scripts/build_ligue1_data.py
      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ligue1/players.json \
                  docs/data/ligue1/teams.json \
                  docs/data/ligue1/team-stats.json
          git diff --cached --quiet || git commit -m "chore: rebuild Ligue 1 data [skip ci]"
          git push
