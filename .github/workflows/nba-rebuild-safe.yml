name: NBA SAFE REBUILD

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Create rebuild script
        run: |

          mkdir -p scripts

          cat > scripts/rebuild_nba_safe.py << 'EOF'
          import os
          import json
          import time
          import requests
          from datetime import datetime, timedelta

          SEASON = "2026"

          BASE_DIR = f"docs/data/nba_REBUILD_TEST/{SEASON}"
          BOX_DIR = f"docs/data/nba_REBUILD_TEST/boxscores/{SEASON}"

          os.makedirs(BASE_DIR, exist_ok=True)
          os.makedirs(BOX_DIR, exist_ok=True)

          INDEX_FILE = f"{BASE_DIR}/index.json"

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://www.nba.com/",
              "Origin": "https://www.nba.com",
              "Accept": "application/json"
          }

          games_index = []

          start_date = datetime(2025, 10, 1)
          end_date = datetime.now()

          current = start_date

          while current <= end_date:

              game_date = current.strftime("%m/%d/%Y")

              print(f"Fetching {game_date}")

              scoreboard_url = (
                  "https://stats.nba.com/stats/scoreboardv2"
                  f"?DayOffset=0&GameDate={game_date}&LeagueID=00"
              )

              try:

                  r = requests.get(
                      scoreboard_url,
                      headers=HEADERS,
                      timeout=30
                  )

                  if r.status_code != 200:
                      current += timedelta(days=1)
                      continue

                  data = r.json()

              except Exception:
                  current += timedelta(days=1)
                  continue

              result_sets = data.get("resultSets", [])

              if not result_sets:
                  current += timedelta(days=1)
                  continue

              rows = result_sets[0].get("rowSet", [])

              for row in rows:

                  try:

                      game_id = str(row[2])

                      game_file = f"{game_id}.json"

                      games_index.append({
                          "game_id": game_id,
                          "date": current.strftime("%Y-%m-%d"),
                          "home_team": row[7],
                          "away_team": row[6],
                          "game_file": game_file
                      })

                      boxscore_url = (
                          "https://cdn.nba.com/static/json/liveData/boxscore/"
                          f"boxscore_{game_id}.json"
                      )

                      br = requests.get(
                          boxscore_url,
                          headers=HEADERS,
                          timeout=30
                      )

                      if br.status_code == 200:

                          out_path = os.path.join(BOX_DIR, game_file)

                          with open(out_path, "w", encoding="utf-8") as f:
                              json.dump(br.json(), f, indent=2)

                      time.sleep(0.5)

                  except Exception:
                      pass

              current += timedelta(days=1)

          unique = {}

          for g in games_index:
              unique[g["game_id"]] = g

          final_games = list(unique.values())

          print("TOTAL GAMES:", len(final_games))

          if len(final_games) < 500:
              raise SystemExit("ABORTING - TOO FEW GAMES")

          with open(INDEX_FILE, "w", encoding="utf-8") as f:
              json.dump(final_games, f, indent=2)

          print("SAFE REBUILD COMPLETE")
          EOF

      - name: Run rebuild
        run: python scripts/rebuild_nba_safe.py

      - name: Commit rebuild
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/nba_REBUILD_TEST

          git commit -m "Safe NBA rebuild" || echo "No changes"

          git push
