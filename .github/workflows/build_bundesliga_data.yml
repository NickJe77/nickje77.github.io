name: Build Bundesliga Data
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build script
        run: python3 scripts/build_bundesliga_data.py

      - name: Debug output
        run: ls docs/data/bundesliga/

      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/bundesliga/players.json docs/data/bundesliga/teams.json docs/data/bundesliga/team-stats.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Build Bundesliga data"
          git pull --rebase origin main
          git push origin HEAD
