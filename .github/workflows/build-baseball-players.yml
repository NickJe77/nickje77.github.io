name: Build Baseball Players

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/baseball/players

      - name: Run Builder
        run: |
          python scripts/build_baseball_players.py

      - name: Commit Changes
        run: |

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/baseball/players/
          git add docs/data/baseball/players.json

          git commit -m "Update baseball players" || echo "No changes"

          git push
