name: Update Baseball Players
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests boto3
      - name: Download historical box scores from R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/fetch_baseball_sources_from_r2.py
      - name: Build player files
        run: |
          python scripts/build_baseball_players.py
      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -r --cached docs/data/baseball/players/ || true
          git add docs/data/baseball/players/ docs/data/baseball/players.json docs/data/baseball/season_leaders/
          git commit -m "Rebuild baseball players and season leaders" || echo "No changes"
          git push --force
