name: Update Baseball Players
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build player files
        run: |
          python scripts/build_baseball_players.py
      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -r --cached docs/data/baseball/players/ || true
          git add docs/data/baseball/players/ docs/data/baseball/players.json docs/data/baseball/seasons/
          git commit -m "Rebuild baseball players and seasons" || echo "No changes"
          git push
