name: Build A-League Player Games

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"   # daily, 6-7am Melbourne

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build A-League player games
        run: python -u scripts/build_aleague_games.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/aleague/player_games/
          git commit -m "Update A-League player games" || echo "No changes"
          # never --force: rebase onto whatever is newest so nothing gets wiped
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            echo "push rejected, retrying ($i)"; sleep 10
          done
