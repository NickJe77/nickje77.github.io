name: Bathurst History Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests beautifulsoup4 pandas lxml

      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/bathurst/seasons
          mkdir -p scripts

      - name: Build Bathurst history
        run: |
          python scripts/bathurst_build_history.py

      - name: Commit updated Bathurst data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/bathurst
          git commit -m "Update Bathurst history data" || echo "No changes"
          git pushbath
