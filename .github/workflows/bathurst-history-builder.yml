name: NHL Scorers All Seasons

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/nhl/boxscores

      - name: Run NHL scorers builder
        run: |
          python scripts/nhl_scorers_all.py

      - name: Commit and push (SAFE)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/nhl/boxscores

          # ✅ STOP if no changes (prevents your error)
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update NHL scorers all seasons"

          # ✅ ALWAYS sync before push (fixes rejection error)
          git pull --rebase origin main

          git push
