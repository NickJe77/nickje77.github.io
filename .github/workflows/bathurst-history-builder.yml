name: Bathurst Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write   # 🔥 THIS IS CRITICAL

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests beautifulsoup4 pandas lxml

      - name: Run builder
        run: |
          python scripts/bathurst_build_history.py

      - name: Debug files (IMPORTANT)
        run: |
          echo "FILES CREATED:"
          ls -R docs || echo "NO DOCS FOLDER"

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -A   # 🔥 FORCE ADD EVERYTHING

          git status   # 🔍 SEE WHAT IT PICKS UP

          git commit -m "Bathurst data build" || echo "No changes"

          git push
