name: Build EPL Teams

on:
  workflow_dispatch:

jobs:
  build-epl-teams:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create EPL Teams Builder
        run: |

          cat > build_epl_teams.py << 'PYTHON'

          import json
          import os
          from collections import defaultdict

          BASE_DIR = "docs/data/epl"

          OUTPUT_FILE = f"{BASE_DIR}/teams.json"

          POSSIBLE_FILES = [
              f"{BASE_DIR}/players.json",
              f"{BASE_DIR}/epl_players.json",
              f"{BASE_DIR}/player_stats.json"
          ]

          players_data = []

          for file in POSSIBLE_FILES:

              if os.path.exists(file):

                  print(f"Loading {file}")

                  with open(file, "r", encoding="utf-8") as f:
                      data = json.load(f)

                      if isinstance(data, list):
                          players_data = data
                          break

          if not players_data:
              print("No players.json found")
              raise SystemExit

          TEAM_FIXES = {

              "Brighton":"Brighton & Hove Albion",
              "Spurs":"Tottenham Hotspur",
              "Tottenham":"Tottenham Hotspur",
              "Man City":"Manchester City",
              "Man Utd":"Manchester United",
              "Man United":"Manchester United",
              "Wolves":"Wolverhampton Wanderers",
              "Newcastle":"Newcastle United",
              "West Ham":"West Ham United",
              "West Brom":"West Bromwich Albion",
              "QPR":"Queens Park Rangers"

          }

          teams = {}

          for row in players_data:

              team = (
                  row.get("team")
                  or row.get("club")
                  or ""
              ).strip()

              if not team:
                  continue

              team = TEAM_FIXES.get(team, team)

              if team not in teams:

                  teams[team] = {
                      "team": team,
                      "seasons_set": set(),
                      "goals": 0,
                      "assists": 0,
                      "appearances": 0,
                      "players": defaultdict(lambda: {
                          "player": "",
                          "goals": 0,
                          "assists": 0,
                          "appearances": 0,
                          "seasons": set()
                      })
                  }

              season = str(
                  row.get("season")
                  or row.get("year")
                  or ""
              ).strip()

              if season:
                  teams[team]["seasons_set"].add(season)

              goals = int(row.get("goals", 0) or 0)
              assists = int(row.get("assists", 0) or 0)
              apps = int(
                  row.get("appearances", 0)
                  or row.get("apps", 0)
                  or 0
              )

              teams[team]["goals"] += goals
              teams[team]["assists"] += assists
              teams[team]["appearances"] += apps

              player_name = (
                  row.get("player")
                  or row.get("name")
                  or ""
              ).strip()

              if not player_name:
                  continue

              player_entry = teams[team]["players"][player_name]

              player_entry["player"] = player_name
              player_entry["goals"] += goals
              player_entry["assists"] += assists
              player_entry["appearances"] += apps

              if season:
                  player_entry["seasons"].add(season)

          output = []

          for team_name, info in teams.items():

              top_scorers = sorted(
                  info["players"].values(),
                  key=lambda x: x["goals"],
                  reverse=True
              )[:20]

              top_scorers_clean = []

              for p in top_scorers:

                  seasons = sorted(list(p["seasons"]))

                  top_scorers_clean.append({
                      "player": p["player"],
                      "goals": p["goals"],
                      "assists": p["assists"],
                      "appearances": p["appearances"],
                      "seasons": seasons
                  })

              output.append({

                  "team": team_name,

                  "seasons": len(info["seasons_set"]),

                  "goals": info["goals"],

                  "assists": info["assists"],

                  "appearances": info["appearances"],

                  "top_scorers": top_scorers_clean

              })

          output = sorted(output, key=lambda x: x["team"])

          os.makedirs(BASE_DIR, exist_ok=True)

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print(f"Built {OUTPUT_FILE}")
          print(f"Teams: {len(output)}")

          PYTHON

      - name: Run EPL Teams Builder
        run: python3 build_epl_teams.py

      - name: Commit Teams JSON
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/teams.json

          git commit -m "Build EPL teams.json" || echo "No changes"

          git push
