name: MLB 2026 Safe Rebuild

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests

      - name: Run rebuild
        run: |
          python scripts/mlb_rebuild_2026_safe.py

      - name: Commit EVERYTHING
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "Rebuild MLB 2026 (force update all)" || echo "No changes"

          # 🔥 THIS IS THE FIX
          git pull --rebase origin main || echo "Nothing to pull"

          git push
