name: MLB 2026 Safe Rebuild

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests

      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/baseball/boxscores/2026
          mkdir -p docs/data/baseball

      - name: Rebuild 2026 safely
        run: |
          python scripts/mlb_rebuild_2026_safe.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/baseball/boxscores/2026 docs/data/baseball/players.json
          git commit -m "Safe rebuild MLB 2026 boxscores" || echo "No changes"
          git push
