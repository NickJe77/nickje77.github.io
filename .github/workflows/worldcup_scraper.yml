name: World Cup Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: |
          python scripts/worldcup_scraper.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          mkdir -p docs/data/cricket/world_cups

          git pull --rebase

          git add docs/data/cricket/world_cups || true
          git commit -m "World Cup update" || echo "No changes"

          git push || true
