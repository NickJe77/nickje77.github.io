name: World Cup Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPS
      # -------------------------
      - name: Install dependencies
        run: |
          pip install selenium beautifulsoup4 lxml

      # -------------------------
      # INSTALL CHROME
      # -------------------------
      - name: Install Chrome
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable

      # -------------------------
      # RUN SCRAPER
      # -------------------------
      - name: Run scraper
        run: |
          python scripts/worldcup_scraper.py

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/cricket/world_cups/
          git commit -m "World Cup update" || echo "No changes"
          git push
