name: World Cup Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON SETUP
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      # -------------------------
      # ENSURE FOLDERS EXIST
      # -------------------------
      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/cricket/world_cups

      # -------------------------
      # RUN SCRAPER
      # -------------------------
      - name: Run scraper
        run: |
          python scripts/worldcup_scraper.py

      # -------------------------
      # COMMIT + PUSH (SAFE)
      # -------------------------
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git pull --rebase

          git add docs/data/cricket/world_cups || true
          git commit -m "World Cup update" || echo "No changes"

          git push || true
