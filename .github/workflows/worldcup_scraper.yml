name: World Cup Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # SETUP PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      # -------------------------
      # ENSURE FOLDERS EXIST
      # -------------------------
      - name: Ensure folders exist
        run: |
          mkdir -p docs/data/cricket/world_cups

      # -------------------------
      # RUN SCRAPER
      # -------------------------
      - name: Run scraper
        run: |
          python scripts/worldcup_scraper.py

      # -------------------------
      # COMMIT CHANGES
      # -------------------------
      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/cricket/world_cups
          git commit -m "Update World Cup data" || echo "No changes"
          git push
