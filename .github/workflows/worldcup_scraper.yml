name: World Cup Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run builder
        run: |
          python scripts/worldcup_builder.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git pull --rebase

          git add docs/data/cricket/world_cups
          git commit -m "World Cup build" || echo "No changes"

          git push
