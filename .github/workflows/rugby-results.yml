name: Rugby Results Scraper

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Start year (e.g. 2020)'
        required: true
        default: '2020'
      end_year:
        description: 'End year (e.g. 2026)'
        required: true
        default: '2026'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Scrape results (${{ github.event.inputs.start_year }}–${{ github.event.inputs.end_year }})
        run: python scripts/rugby_results_scraper.py ${{ github.event.inputs.start_year }} ${{ github.event.inputs.end_year }}

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/rugby
          git diff --cached --quiet || git commit -m "Rugby results ${{ github.event.inputs.start_year }}-${{ github.event.inputs.end_year }}"
          git pull origin main --no-rebase --no-edit
          git push
