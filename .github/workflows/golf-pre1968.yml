name: Add Pre-1968 Golf Majors

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests beautifulsoup4

      - name: Run builder
        run: |
          python scripts/golf_add_pre1968_majors.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/golf/pga_winners.json
          git commit -m "Add pre-1968 majors" || echo "No changes"
          git push
