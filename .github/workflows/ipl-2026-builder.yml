name: IPL 2026 Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # INSTALL DEPENDENCIES  👈 THIS WAS MISSING
      # -------------------------
      - name: Install dependencies
        run: |
          pip install requests

      # -------------------------
      # DEBUG FILES
      # -------------------------
      - name: List IPL files
        run: |
          echo "=== IPL FILES ==="
          ls -R docs/data/ipl || true

      # -------------------------
      # BUILD FULL FILE (if using it)
      # -------------------------
      - name: Build FULL 2026 file
        run: |
          python scripts/build_ipl_2026_full.py

      # -------------------------
      # BUILD SEASON FILE
      # -------------------------
      - name: Build season file
        run: |
          python scripts/build_ipl_2026.py

      # -------------------------
      # VERIFY OUTPUT
      # -------------------------
      - name: Check output
        run: |
          if [ -f docs/data/ipl/ipl_2026.json ]; then
            echo "✅ ipl_2026.json exists"
          else
            echo "❌ ipl_2026.json missing"
          fi

      # -------------------------
      # COMMIT (SAFE)
      # -------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/ipl || true

          git commit -m "Update IPL 2026 data" || echo "No changes"

          git push
