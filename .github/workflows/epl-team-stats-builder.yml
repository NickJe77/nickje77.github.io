name: EPL Team Stats Builder

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Team Stats
        run: |

          cat > build_epl_team_stats.py << 'PYTHON'
          import os
          import json
          from collections import defaultdict

          PLAYERS_DIR = "docs/data/epl/players"
          OUTPUT_FILE = "docs/data/epl/team_stats.json"

          print("REBUILDING EPL TEAM STATS")

          team_data = {}
          processed = set()

          def ensure_team(team):
              if team not in team_data:
                  team_data[team] = {
                      "team": team,
                      "top_scorers": defaultdict(int),
                      "yellow_cards": defaultdict(int),
                      "red_cards": defaultdict(int)
                  }

          def clean(v):
              return str(v or "").strip()

          def to_int(v):
              try:
                  return int(float(v))
              except:
                  return 0

          def add_goal(team, player, amount):
              if amount > 0:
                  team_data[team]["top_scorers"][player] += amount

          def add_yellow(team, player, amount):
              if amount > 0:
                  team_data[team]["yellow_cards"][player] += amount

          def add_red(team, player, amount):
              if amount > 0:
                  team_data[team]["red_cards"][player] += amount

          files = sorted(
              f for f in os.listdir(PLAYERS_DIR)
              if f.endswith(".json")
          )

          for filename in files:

              path = os.path.join(PLAYERS_DIR, filename)

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      player = json.load(f)
              except Exception:
                  continue

              player_name = clean(
                  player.get("player") or
                  player.get("name")
              )

              if not player_name:
                  continue

              matches = player.get("matches", [])

              for match in matches:

                  team = clean(
                      match.get("team") or
                      player.get("team")
                  )

                  if not team:
                      continue

                  ensure_team(team)

                  match_id = clean(
                      match.get("match_id") or
                      match.get("game_id") or
                      match.get("id") or
                      match.get("match")
                  )

                  unique_key = f"{player_name}_{match_id}"

                  if unique_key in processed:
                      continue

                  processed.add(unique_key)

                  # ------------------------
                  # GOALS
                  # ------------------------

                  goals = 0

                  goals += to_int(match.get("goals"))
                  goals += to_int(match.get("g"))

                  stats = match.get("stats", {})

                  if isinstance(stats, dict):
                      goals += to_int(stats.get("goals"))

                  add_goal(team, player_name, goals)

                  # ------------------------
                  # YELLOWS
                  # ------------------------

                  yellows = 0

                  yellows += to_int(match.get("yellow"))
                  yellows += to_int(match.get("yellow_cards"))
                  yellows += to_int(match.get("yc"))

                  if isinstance(stats, dict):
                      yellows += to_int(stats.get("yellow"))
                      yellows += to_int(stats.get("yellow_cards"))

                  # ------------------------
                  # REDS
                  # ------------------------

                  reds = 0

                  reds += to_int(match.get("red"))
                  reds += to_int(match.get("red_cards"))
                  reds += to_int(match.get("rc"))

                  if isinstance(stats, dict):
                      reds += to_int(stats.get("red"))
                      reds += to_int(stats.get("red_cards"))

                  # ------------------------
                  # EVENT SCAN
                  # ------------------------

                  events = (
                      match.get("events")
                      or match.get("cards")
                      or []
                  )

                  if isinstance(events, list):

                      found_red = False
                      found_yellow = False

                      for ev in events:

                          text = json.dumps(ev).lower()

                          if (
                              "red card" in text
                              or "straight red" in text
                              or '"red"' in text
                          ):
                              found_red = True

                          if (
                              "yellow" in text
                              and "second yellow red" not in text
                          ):
                              found_yellow = True

                      if found_red:
                          reds += 1

                      if found_yellow:
                          yellows += 1

                  add_yellow(team, player_name, yellows)
                  add_red(team, player_name, reds)

          output = []

          for team, data in sorted(team_data.items()):

              scorers = sorted(
                  data["top_scorers"].items(),
                  key=lambda x: (-x[1], x[0])
              )[:20]

              yellows = sorted(
                  data["yellow_cards"].items(),
                  key=lambda x: (-x[1], x[0])
              )[:20]

              reds = sorted(
                  data["red_cards"].items(),
                  key=lambda x: (-x[1], x[0])
              )[:20]

              output.append({
                  "team": team,
                  "top_scorers": [
                      {"player": p, "goals": g}
                      for p, g in scorers
                  ],
                  "yellow_cards": [
                      {"player": p, "yellow": y}
                      for p, y in yellows
                  ],
                  "red_cards": [
                      {"player": p, "red": r}
                      for p, r in reds
                  ]
              })

          os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2)

          print("DONE")
          print(f"SAVED -> {OUTPUT_FILE}")
          PYTHON

          python build_epl_team_stats.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/team_stats.json

          git commit -m "Rebuild EPL team stats" || echo "No changes"

          git push
