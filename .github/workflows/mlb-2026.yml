name: MLB 2026 Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # -------------------------
      # INSTALL DEPS
      # -------------------------
      - name: Install deps
        run: |
          pip install requests

      # -------------------------
      # RUN SCRIPT
      # -------------------------
      - name: Run MLB builder
        run: |
          python scripts/mlb_2026_full_games.py

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/baseball/games/2026
          git commit -m "Update MLB 2026 full game data" || echo "No changes"
          git push
