name: MLB 2026 Safe Rebuild
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests
      - name: Run MLB scraper
        run: |
          python scripts/mlb_rebuild_2026_safe.py
      - name: Repair MLB output schema
        run: |
          python scripts/repair_baseball_data.py
      - name: Patch legacy season files
        run: |
          python scripts/patch_legacy_seasons.py
      - name: Patch scores from events
        run: |
          python scripts/patch_scores_from_events.py
      - name: Commit MLB updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/baseball/
          git diff --staged --quiet || git commit -m "Update MLB 2026 data"
          git push origin main --force
