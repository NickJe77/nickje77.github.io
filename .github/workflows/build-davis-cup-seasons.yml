name: Build Davis Cup From Seasons

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # PYTHON
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------
      # RUN SCRIPT
      # -------------------------
      - name: Build Davis Cup
        run: |
          python scripts/build_davis_cup_from_seasons.py

      # -------------------------
      # COMMIT
      # -------------------------
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/tennis/davis_cup/

          git commit -m "Build Davis Cup dataset" || echo "No changes"

          git push
