name: Restore EPL Match Files

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore match files from previous commit
        run: |

          git checkout HEAD~1 -- docs/data/epl/matches

      - name: Verify restore
        run: |

          git status
          find docs/data/epl/matches | head

      - name: Commit restored files
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/epl/matches

          git commit -m "Restore EPL match files" || echo "No changes"

          git push
