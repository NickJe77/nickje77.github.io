name: Purge Large Files From History
on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Remove basketball boxscores from history
        run: |
          git filter-repo --force --path docs/data/basketball/boxscores --invert-paths

      - name: Force push clean history
        run: |
          git remote add origin-clean https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin-clean --force --all
