name: Extract Serie A Zip
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Serie A zip
        run: |
          unzip -o docs/data/seriea/serie_a.zip -d docs/data/temp_extract
      - name: Move to correct folder
        run: |
          rm -rf docs/data/seriea/matches
          rm -rf docs/data/__MACOSX
          mv docs/data/temp_extract/serie_a/* docs/data/seriea/ 2>/dev/null || \
          mv docs/data/temp_extract/seriea/* docs/data/seriea/ 2>/dev/null || \
          mv docs/data/temp_extract/*/* docs/data/seriea/
          rm -rf docs/data/temp_extract
      - name: Verify structure
        run: |
          echo "----- SERIE A ROOT -----"
          ls docs/data/seriea
          echo "----- MATCHES -----"
          find docs/data/seriea/matches | head
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/seriea/
          git commit -m "Extract Serie A data" || echo "No changes"
          git push
