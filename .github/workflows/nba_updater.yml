name: NBA Updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python scripts/nba_discover_games.py
      - run: python scripts/nba_download_boxscores.py
      - run: python scripts/nba_build_season_summaries.py

      - name: Build career stats (deduped regular season + playoffs only)
        run: |
          python <<EOF
          import json, re
          from pathlib import Path

          nba_dir = Path("docs/data/nba")
          draft_dir = nba_dir / "draft"

          def clean(n):
              n = str(n).lower()
              n = re.sub(r"[^\w\s]", "", n)
              return re.sub(r"\s+", " ", n).strip()

          def is_valid_game(game):
              vals = [
                  game.get("game_type"),
                  game.get("season_type"),
                  game.get("type")
              ]
              vals = [str(v).lower().strip() for v in vals if v]

              allowed = {"regular", "regular season", "playoff", "playoffs"}
              blocked_words = ["all-star", "all star", "preseason", "summer", "exhibition"]

              joined = " ".join(vals)

              if any(word in joined for word in blocked_words):
                  return False

              return any(v in allowed for v in vals)

          def find_stat(obj, keys):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k.lower() in keys:
                          try:
                              return float(v)
                          except:
                              pass
                      res = find_stat(v, keys)
                      if res is not None:
                          return res
              elif isinstance(obj, list):
                  for item in obj:
                      res = find_stat(item, keys)
                      if res is not None:
                          return res
              return None

          def find_player_objects(obj):
              found = []
              if isinstance(obj, dict):
                  has_name = "name" in obj or "player" in obj

                  # only treat as a player record if there is at least one usable stat
                  has_stat = any(
                      find_stat(obj, keys) is not None
                      for keys in [
                          ["pts", "points"],
                          ["reb", "rebounds"],
                          ["ast", "assists"],
                          ["stl", "steals"],
                          ["blk", "blocks"]
                      ]
                  )

                  if has_name and has_stat:
                      found.append(obj)

                  for v in obj.values():
                      found.extend(find_player_objects(v))

              elif isinstance(obj, list):
                  for item in obj:
                      found.extend(find_player_objects(item))

              return found

          stats = {}

          def ensure_player(name):
              key = clean(name)
              if key not in stats:
                  stats[key] = {"g": 0, "pts": 0, "reb": 0, "ast": 0, "stl": 0, "blk": 0}
              return key

          print("Scanning games...")

          for season in nba_dir.iterdir():
              if not season.is_dir():
                  continue

              for f in season.glob("*.json"):
                  if f.name in ["index.json", "games.json"]:
                      continue

                  try:
                      raw = json.loads(f.read_text())
                  except:
                      continue

                  game = raw[0] if isinstance(raw, list) and raw else raw
                  if not isinstance(game, dict):
                      continue

                  if not is_valid_game(game):
                      continue

                  # dedupe within each single game
                  seen_in_game = set()

                  for p in find_player_objects(game):
                      name = p.get("name") or p.get("player")
                      if not name:
                          continue

                      key = ensure_player(name)

                      pts = find_stat(p, ["pts", "points"]) or 0
                      reb = find_stat(p, ["reb", "rebounds"]) or 0
                      ast = find_stat(p, ["ast", "assists"]) or 0
                      stl = find_stat(p, ["stl", "steals"]) or 0
                      blk = find_stat(p, ["blk", "blocks"]) or 0

                      # count the game only once per player per file
                      if key not in seen_in_game:
                          stats[key]["g"] += 1
                          seen_in_game.add(key)

                      stats[key]["pts"] += pts
                      stats[key]["reb"] += reb
                      stats[key]["ast"] += ast
                      stats[key]["stl"] += stl
                      stats[key]["blk"] += blk

          print("Players tracked:", len(stats))

          for file in draft_dir.glob("*.json"):
              try:
                  data = json.loads(file.read_text())
              except:
                  continue

              def inject(obj):
                  if isinstance(obj, list):
                      for item in obj:
                          if isinstance(item, dict) and "player" in item:
                              key = clean(item["player"])
                              s = stats.get(key, {"g": 0, "pts": 0, "reb": 0, "ast": 0, "stl": 0, "blk": 0})

                              g = s["g"]

                              item["games"] = g
                              item["points"] = int(round(s["pts"]))
                              item["ppg"] = round(s["pts"] / g, 1) if g else 0

                              item["reb"] = int(round(s["reb"]))
                              item["rpg"] = round(s["reb"] / g, 1) if g else 0

                              item["ast"] = int(round(s["ast"]))
                              item["apg"] = round(s["ast"] / g, 1) if g else 0

                              item["stl"] = int(round(s["stl"]))
                              item["blk"] = int(round(s["blk"]))

                          inject(item)

                  elif isinstance(obj, dict):
                      for v in obj.values():
                          inject(v)

              inject(data)
              file.write_text(json.dumps(data, indent=2))

          print("DONE")
          EOF

      - run: git config user.name "NBA Auto Bot"
      - run: git config user.email "bot@example.com"
      - run: git add -A
      - run: git commit -m "NBA full rebuild" || echo "No changes"
      - run: git pull --rebase origin main
      - run: git push
