name: NBA Updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python scripts/nba_discover_games.py
      - run: python scripts/nba_download_boxscores.py
      - run: python scripts/nba_build_season_summaries.py

      # ❌ DO NOT DELETE PLAYERS FOLDER ANYMORE
      # - run: rm -rf docs/data/nba/players
      - run: mkdir -p docs/data/nba/players

      # 🔥 BUILD PLAYERS
      - run: python scripts/build_players.py

      # 🔒 CRITICAL SAFETY CHECK (PREVENTS DATA WIPE)
      - name: Validate players exist
        run: |
          COUNT=$(ls docs/data/nba/players/*.json 2>/dev/null | wc -l)
          echo "Player files: $COUNT"

          if [ "$COUNT" -lt 50 ]; then
            echo "❌ Player build failed — stopping to prevent wipe"
            exit 1
          fi

      # 🔥 FILTERED STATS (UNCHANGED)
      - name: Build career stats
        run: |
          python <<EOF
          import json, re
          from pathlib import Path

          nba_dir = Path("docs/data/nba")
          draft_dir = nba_dir / "draft"

          def clean(n):
              n = n.lower()
              n = re.sub(r"[^\w\s]", "", n)
              return re.sub(r"\s+"," ",n).strip()

          def is_valid_game(game):
              values = [
                  str(game.get("game_type","")).lower(),
                  str(game.get("type","")).lower(),
                  str(game.get("season_type","")).lower()
              ]
              text = " ".join(values)
              return ("regular" in text or "playoff" in text)

          stats = {}

          def find_stat(obj, keys):
              if isinstance(obj, dict):
                  for k,v in obj.items():
                      if k.lower() in keys:
                          try: return float(v)
                          except: pass
                      res = find_stat(v, keys)
                      if res: return res
              elif isinstance(obj, list):
                  for i in obj:
                      res = find_stat(i, keys)
                      if res: return res
              return 0

          def find_players(obj):
              out=[]
              if isinstance(obj,dict):
                  if "name" in obj or "player" in obj:
                      out.append(obj)
                  for v in obj.values():
                      out += find_players(v)
              elif isinstance(obj,list):
                  for i in obj:
                      out += find_players(i)
              return out

          def add(name,p):
              key = clean(name)
              if key not in stats:
                  stats[key]={"g":0,"pts":0,"reb":0,"ast":0,"stl":0,"blk":0}

              stats[key]["g"]+=1
              stats[key]["pts"]+=find_stat(p,["pts","points"])
              stats[key]["reb"]+=find_stat(p,["reb","rebounds"])
              stats[key]["ast"]+=find_stat(p,["ast","assists"])
              stats[key]["stl"]+=find_stat(p,["stl","steals"])
              stats[key]["blk"]+=find_stat(p,["blk","blocks"])

          print("Scanning filtered games...")

          for season in nba_dir.iterdir():
              if not season.is_dir(): continue

              for f in season.glob("*.json"):

                  if f.name in ["index.json","games.json"]:
                      continue

                  try:
                      raw = json.loads(f.read_text())
                  except:
                      continue

                  game = raw[0] if isinstance(raw,list) else raw
                  if not isinstance(game,dict):
                      continue

                  if not is_valid_game(game):
                      continue

                  for p in find_players(game):
                      name = p.get("name") or p.get("player")
                      if name:
                          add(name,p)

          print("Players:",len(stats))

          for file in draft_dir.glob("*.json"):

              try:
                  data=json.loads(file.read_text())
              except: continue

              def inject(obj):
                  if isinstance(obj,list):
                      for i in obj:
                          if isinstance(i,dict) and "player" in i:

                              k = clean(i["player"])
                              s = stats.get(k,{"g":0,"pts":0,"reb":0,"ast":0,"stl":0,"blk":0})

                              g=s["g"]

                              i["games"]=g
                              i["points"]=int(s["pts"])
                              i["ppg"]=round(s["pts"]/g,1) if g else 0

                              i["reb"]=int(s["reb"])
                              i["rpg"]=round(s["reb"]/g,1) if g else 0

                              i["ast"]=int(s["ast"])
                              i["apg"]=round(s["ast"]/g,1) if g else 0

                              i["stl"]=int(s["stl"])
                              i["blk"]=int(s["blk"])

                          inject(i)

                  elif isinstance(obj,dict):
                      for v in obj.values(): inject(v)

              inject(data)

              file.write_text(json.dumps(data,indent=2))
              print("UPDATED:",file)

          print("DONE")
          EOF

      - run: git config user.name "NBA Auto Bot"
      - run: git config user.email "bot@example.com"

      - run: git add -A
      - run: git commit -m "NBA full rebuild" || echo "No changes"
      - run: git pull --rebase origin main
      - run: git push
