name: NBA Updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Discover games
        run: python scripts/nba_discover_games.py

      - name: Download boxscores
        run: python scripts/nba_download_boxscores.py

      - name: Build season summaries
        run: python scripts/nba_build_season_summaries.py

      - name: Remove old player files
        run: rm -rf docs/data/nba/players

      - name: Recreate players folder
        run: mkdir -p docs/data/nba/players

      - name: Build players
        run: python scripts/build_players.py

      # 🔥 ABSOLUTE FINAL FIX — FULL SCAN + STRUCTURE DETECTION
      - name: Build career stats from games
        run: |
          python <<EOF
          import json
          import re
          from pathlib import Path

          nba_dir = Path("docs/data/nba")
          draft_dir = nba_dir / "draft"

          def clean(name):
              name = name.lower()
              name = re.sub(r"[^\w\s]", "", name)
              name = re.sub(r"\s+", " ", name)
              return name.strip()

          player_stats = {}

          def add(name, pts):
              key = clean(name)
              if key not in player_stats:
                  player_stats[key] = {"games": 0, "points": 0}
              player_stats[key]["games"] += 1
              player_stats[key]["points"] += pts

          def scan_for_players(obj):
              found = []

              if isinstance(obj, dict):
                  # CASE 1: direct player object
                  if "name" in obj or "player" in obj:
                      found.append(obj)

                  for v in obj.values():
                      found.extend(scan_for_players(v))

              elif isinstance(obj, list):
                  for item in obj:
                      found.extend(scan_for_players(item))

              return found

          def extract_points(p):
              for key in ["points","pts","PTS","Points"]:
                  if key in p:
                      try:
                          return float(p[key])
                      except:
                          return 0
              return 0

          print("Scanning ALL games (structure independent)...")

          for season in nba_dir.iterdir():

              if not season.is_dir():
                  continue

              for game_file in season.glob("*.json"):

                  if game_file.name in ["index.json","games.json"]:
                      continue

                  try:
                      data = json.loads(game_file.read_text())
                  except:
                      continue

                  players = scan_for_players(data)

                  for p in players:

                      name = p.get("name") or p.get("player")
                      if not name:
                          continue

                      pts = extract_points(p)

                      add(name, pts)

          print("Players found:", len(player_stats))


          print("Updating draft files...")

          for file in draft_dir.glob("*.json"):

              try:
                  data = json.loads(file.read_text())
              except:
                  continue

              def inject(obj):
                  if isinstance(obj, list):
                      for item in obj:
                          if isinstance(item, dict) and "player" in item:

                              key = clean(item["player"])
                              stats = player_stats.get(key, {"games":0,"points":0})

                              g = stats["games"]
                              p = stats["points"]
                              ppg = round(p/g,1) if g else 0

                              item["games"] = g
                              item["points"] = int(p)
                              item["ppg"] = ppg

                          inject(item)

                  elif isinstance(obj, dict):
                      for v in obj.values():
                          inject(v)

              inject(data)

              file.write_text(json.dumps(data, indent=2))
              print("UPDATED:", file)

          print("DONE")
          EOF

      - name: Build NBA finals file
        run: python scripts/build_nba_finals.py

      - name: Build playoff games
        run: python scripts/build_nba_playoff_games.py

      - name: Build playoff series
        run: python scripts/build_nba_playoff_series.py

      - name: Build player search index
        run: python scripts/nba_build_stat_leaders.py

      - name: Commit changes
        run: |
          git config user.name "NBA Auto Bot"
          git config user.email "bot@example.com"
          git add -A
          git commit -m "NBA full rebuild" || echo "No changes"

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Push changes
        run: git push origin main
