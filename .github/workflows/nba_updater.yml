name: NBA Updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Discover games
        run: python scripts/nba_discover_games.py

      - name: Download boxscores
        run: python scripts/nba_download_boxscores.py

      - name: Build season summaries
        run: python scripts/nba_build_season_summaries.py

      - name: Remove old player files
        run: rm -rf docs/data/nba/players

      - name: Recreate players folder
        run: mkdir -p docs/data/nba/players

      - name: Build players
        run: python scripts/build_players.py

      # 🔥 FORCE UPDATE STEP (NO STRUCTURE ASSUMPTIONS)
      - name: FORCE update draft files
        run: |
          python <<EOF
          import json
          from pathlib import Path

          draft_dir = Path("docs/data/nba/draft")

          def inject(obj):
              if isinstance(obj, list):
                  for item in obj:
                      if isinstance(item, dict) and "player" in item:
                          item["games"] = 999
                          item["points"] = 9999
                          item["ppg"] = 99
                      inject(item)
              elif isinstance(obj, dict):
                  for v in obj.values():
                      inject(v)

          updated_files = 0

          for file in draft_dir.glob("*.json"):
              try:
                  data = json.loads(file.read_text())
              except:
                  continue

              inject(data)

              file.write_text(json.dumps(data, indent=2))
              updated_files += 1
              print("UPDATED:", file)

          print("FILES UPDATED:", updated_files)
          EOF

      - name: Build NBA finals file
        run: python scripts/build_nba_finals.py

      - name: Build playoff games
        run: python scripts/build_nba_playoff_games.py

      - name: Build playoff series
        run: python scripts/build_nba_playoff_series.py

      - name: Build player search index
        run: python scripts/nba_build_stat_leaders.py

      - name: Commit changes
        run: |
          git config user.name "NBA Auto Bot"
          git config user.email "bot@example.com"
          git add -A
          git commit -m "NBA full rebuild" || echo "No changes"

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Push changes
        run: git push origin main
