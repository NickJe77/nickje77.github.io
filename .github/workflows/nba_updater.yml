name: NBA Updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Discover games
        run: python scripts/nba_discover_games.py

      - name: Download boxscores
        run: python scripts/nba_download_boxscores.py

      - name: Build season summaries
        run: python scripts/nba_build_season_summaries.py

      # 🔥 CRITICAL FIX — CLEAN PLAYERS FIRST
      - name: Remove old player files
        run: rm -rf docs/data/nba/players

      - name: Recreate players folder
        run: mkdir -p docs/data/nba/players

      - name: Build players
        run: python scripts/build_players.py

      - name: Build NBA finals file
        run: python scripts/build_nba_finals.py

      - name: Build playoff games
        run: python scripts/build_nba_playoff_games.py

      - name: Build playoff series
        run: python scripts/build_nba_playoff_series.py

      - name: Build player search index
        run: |
          python <<EOF
          import json
          from pathlib import Path

          players_dir = Path("docs/data/nba/players")
          names = []

          for f in players_dir.glob("*.json"):
              try:
                  with open(f) as file:
                      data = json.load(file)

                  if "name" in data:
                      names.append(data["name"])
              except:
                  pass

          names = sorted(set(names))

          with open(players_dir / "index.json", "w") as f:
              json.dump(names, f, indent=2)

          print("Created player index with", len(names), "players")
          EOF

      - name: Build franchise leaders
        run: |
          python <<EOF
          import json
          from pathlib import Path

          players_dir = Path("docs/data/nba/players")
          leaders = {}

          for f in players_dir.glob("*.json"):

              try:
                  with open(f) as file:
                      data = json.load(file)

                  name = data.get("name")
                  teams = data.get("teams", {})

                  for team, stats in teams.items():

                      if team not in leaders:
                          leaders[team] = {
                              "pts":{"player":"","value":0},
                              "reb":{"player":"","value":0},
                              "ast":{"player":"","value":0},
                              "stl":{"player":"","value":0},
                              "blk":{"player":"","value":0}
                          }

                      if stats.get("pts",0) > leaders[team]["pts"]["value"]:
                          leaders[team]["pts"]={"player":name,"value":stats.get("pts",0)}

                      if stats.get("reb",0) > leaders[team]["reb"]["value"]:
                          leaders[team]["reb"]={"player":name,"value":stats.get("reb",0)}

                      if stats.get("ast",0) > leaders[team]["ast"]["value"]:
                          leaders[team]["ast"]={"player":name,"value":stats.get("ast",0)}

                      if stats.get("stl",0) > leaders[team]["stl"]["value"]:
                          leaders[team]["stl"]={"player":name,"value":stats.get("stl",0)}

                      if stats.get("blk",0) > leaders[team]["blk"]["value"]:
                          leaders[team]["blk"]={"player":name,"value":stats.get("blk",0)}

              except:
                  pass

          output = Path("docs/data/nba/team-leaders.json")

          with open(output,"w") as f:
              json.dump(leaders,f,indent=2)

          print("Created franchise leaders for", len(leaders), "teams")
          EOF

      - name: Build statistical leaders
        run: python scripts/nba_build_stat_leaders.py

      # 🔥 CRITICAL FIX — FORCE COMMIT EVERYTHING
      - name: Commit changes
        run: |
          git config user.name "NBA Auto Bot"
          git config user.email "bot@example.com"
          git add -A
          git commit -m "NBA full rebuild" || echo "No changes"

      - name: Push changes
        run: git push
