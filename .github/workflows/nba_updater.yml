name: NBA Updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Discover games
        run: python scripts/nba_discover_games.py

      - name: Download boxscores
        run: python scripts/nba_download_boxscores.py

      - name: Build season summaries
        run: python scripts/nba_build_season_summaries.py

      - name: Remove old player files
        run: rm -rf docs/data/nba/players

      - name: Recreate players folder
        run: mkdir -p docs/data/nba/players

      - name: Build players
        run: python scripts/build_players.py

      # 🔥 FULL STAT BUILDER
      - name: Build career stats from games
        run: |
          python <<EOF
          import json, re
          from pathlib import Path

          nba_dir = Path("docs/data/nba")
          draft_dir = nba_dir / "draft"

          def clean(name):
              name = name.lower()
              name = re.sub(r"[^\w\s]", "", name)
              name = re.sub(r"\s+", " ", name)
              return name.strip()

          stats = {}

          def add(name, p):
              key = clean(name)
              if key not in stats:
                  stats[key] = {
                      "games":0,
                      "points":0,
                      "reb":0,
                      "ast":0,
                      "stl":0,
                      "blk":0
                  }

              stats[key]["games"] += 1
              stats[key]["points"] += p.get("pts",0)
              stats[key]["reb"] += p.get("reb",0)
              stats[key]["ast"] += p.get("ast",0)
              stats[key]["stl"] += p.get("stl",0)
              stats[key]["blk"] += p.get("blk",0)

          def scan(obj):
              found = []

              if isinstance(obj, dict):
                  if "name" in obj or "player" in obj:
                      found.append(obj)

                  for v in obj.values():
                      found += scan(v)

              elif isinstance(obj, list):
                  for i in obj:
                      found += scan(i)

              return found

          def get_stat(p, keys):
              for k in keys:
                  if k in p:
                      try:
                          return float(p[k])
                      except:
                          return 0
              return 0

          print("Scanning games...")

          for season in nba_dir.iterdir():

              if not season.is_dir():
                  continue

              for file in season.glob("*.json"):

                  if file.name in ["index.json","games.json"]:
                      continue

                  try:
                      data = json.loads(file.read_text())
                  except:
                      continue

                  players = scan(data)

                  for p in players:

                      name = p.get("name") or p.get("player")
                      if not name:
                          continue

                      add(name,{
                          "pts":get_stat(p,["pts","points","PTS"]),
                          "reb":get_stat(p,["reb","REB"]),
                          "ast":get_stat(p,["ast","AST"]),
                          "stl":get_stat(p,["stl","STL"]),
                          "blk":get_stat(p,["blk","BLK"])
                      })

          print("Players:",len(stats))


          print("Updating draft files...")

          for file in draft_dir.glob("*.json"):

              try:
                  data = json.loads(file.read_text())
              except:
                  continue

              def inject(obj):
                  if isinstance(obj,list):
                      for i in obj:
                          if isinstance(i,dict) and "player" in i:

                              key = clean(i["player"])
                              s = stats.get(key,{
                                  "games":0,"points":0,"reb":0,"ast":0,"stl":0,"blk":0
                              })

                              g = s["games"]

                              i["games"] = g
                              i["points"] = int(s["points"])
                              i["ppg"] = round(s["points"]/g,1) if g else 0

                              i["reb"] = int(s["reb"])
                              i["rpg"] = round(s["reb"]/g,1) if g else 0

                              i["ast"] = int(s["ast"])
                              i["apg"] = round(s["ast"]/g,1) if g else 0

                              i["stl"] = int(s["stl"])
                              i["blk"] = int(s["blk"])

                          inject(i)

                  elif isinstance(obj,dict):
                      for v in obj.values():
                          inject(v)

              inject(data)

              file.write_text(json.dumps(data,indent=2))
              print("UPDATED:",file)

          print("DONE")
          EOF

      - name: Commit changes
        run: |
          git config user.name "NBA Auto Bot"
          git config user.email "bot@example.com"
          git add -A
          git commit -m "NBA full rebuild" || echo "No changes"

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Push changes
        run: git push
