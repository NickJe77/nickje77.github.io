name: NBA Updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Discover games
        run: python scripts/nba_discover_games.py

      - name: Download boxscores
        run: python scripts/nba_download_boxscores.py

      - name: Build season summaries
        run: python scripts/nba_build_season_summaries.py

      - name: Remove old player files
        run: rm -rf docs/data/nba/players

      - name: Recreate players folder
        run: mkdir -p docs/data/nba/players

      - name: Build players
        run: python scripts/build_players.py

      # 🔥 FIXED GAME SCANNER
      - name: Build career stats from games
        run: |
          python <<EOF
          import json
          from pathlib import Path

          nba_dir = Path("docs/data/nba")
          draft_dir = nba_dir / "draft"

          player_stats = {}

          def add_player(name, pts):
              if name not in player_stats:
                  player_stats[name] = {"games": 0, "points": 0}

              player_stats[name]["games"] += 1
              player_stats[name]["points"] += pts

          print("Scanning games...")

          for season in nba_dir.iterdir():

              if not season.is_dir():
                  continue

              for game_file in season.glob("*.json"):

                  if game_file.name in ["index.json", "games.json"]:
                      continue

                  try:
                      raw = json.loads(game_file.read_text())
                  except:
                      continue

                  # 🔥 HANDLE LIST OR DICT
                  if isinstance(raw, list):
                      if not raw:
                          continue
                      game = raw[0]
                  else:
                      game = raw

                  if not isinstance(game, dict):
                      continue

                  for side in ["home", "away"]:

                      players = game.get(f"{side}_players")

                      if not isinstance(players, list):
                          continue

                      for p in players:

                          if not isinstance(p, dict):
                              continue

                          name = p.get("name") or p.get("player")
                          pts = p.get("points") or p.get("pts") or p.get("PTS") or 0

                          if name:
                              try:
                                  pts = float(pts)
                              except:
                                  pts = 0

                              add_player(name, pts)

          print("Players tracked:", len(player_stats))


          print("Updating draft files...")

          for file in draft_dir.glob("*.json"):

              try:
                  data = json.loads(file.read_text())
              except:
                  continue

              def inject(obj):
                  if isinstance(obj, list):
                      for item in obj:
                          if isinstance(item, dict) and "player" in item:

                              name = item["player"]
                              stats = player_stats.get(name, {"games": 0, "points": 0})

                              g = stats["games"]
                              p = stats["points"]
                              ppg = round(p / g, 1) if g else 0

                              item["games"] = g
                              item["points"] = int(p)
                              item["ppg"] = ppg

                          inject(item)

                  elif isinstance(obj, dict):
                      for v in obj.values():
                          inject(v)

              inject(data)

              file.write_text(json.dumps(data, indent=2))
              print("UPDATED:", file)

          print("Done.")
          EOF

      - name: Build NBA finals file
        run: python scripts/build_nba_finals.py

      - name: Build playoff games
        run: python scripts/build_nba_playoff_games.py

      - name: Build playoff series
        run: python scripts/build_nba_playoff_series.py

      - name: Build player search index
        run: python scripts/nba_build_stat_leaders.py

      - name: Commit changes
        run: |
          git config user.name "NBA Auto Bot"
          git config user.email "bot@example.com"
          git add -A
          git commit -m "NBA full rebuild" || echo "No changes"

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Push changes
        run: git push origin main
