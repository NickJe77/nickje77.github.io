name: NBA Updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Discover games
        run: python scripts/nba_discover_games.py

      - name: Download boxscores
        run: python scripts/nba_download_boxscores.py

      - name: Build season summaries
        run: python scripts/nba_build_season_summaries.py

      - name: Commit changes
        run: |
          git config user.name "NBA Auto Bot"
          git config user.email "bot@example.com"
          git add docs/data/nba
          git commit -m "NBA auto update" || echo "No changes"

      - name: Push changes
        run: git push
