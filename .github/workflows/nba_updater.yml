name: NBA Updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Discover games
        run: python scripts/nba_discover_games.py

      - name: Download boxscores
        run: python scripts/nba_download_boxscores.py

      - name: Build season summaries
        run: python scripts/nba_build_season_summaries.py

      - name: Remove old player files
        run: rm -rf docs/data/nba/players

      - name: Recreate players folder
        run: mkdir -p docs/data/nba/players

      - name: Build players
        run: python scripts/build_players.py

      # 🔥 REAL FINAL FIX — UNIVERSAL SCANNER
      - name: Add career stats to draft files
        run: |
          python <<EOF
          import json
          from pathlib import Path

          draft_dir = Path("docs/data/nba/draft")
          players_dir = Path("docs/data/nba/players")

          def slug(name):
              return name.lower().replace(".", "").replace("'", "").replace(" ", "-")

          def scan_stats(obj):
              points = 0
              games = 0

              if isinstance(obj, dict):
                  for k, v in obj.items():

                      # count points
                      if k.lower() in ["pts", "points"]:
                          if isinstance(v, (int, float)):
                              points += v

                      # count games (any game-like entry)
                      if k.lower() in ["games", "game_log", "gamelog"]:
                          if isinstance(v, list):
                              games += len(v)

                      # recurse
                      p, g = scan_stats(v)
                      points += p
                      games += g

              elif isinstance(obj, list):
                  for item in obj:
                      p, g = scan_stats(item)
                      points += p
                      games += g

              return points, games


          def get_stats(name):
              file = players_dir / f"{slug(name)}.json"

              if not file.exists():
                  return {"games": 0, "points": 0, "ppg": 0}

              try:
                  data = json.loads(file.read_text())
              except:
                  return {"games": 0, "points": 0, "ppg": 0}

              points, games = scan_stats(data)

              ppg = round(points / games, 1) if games else 0

              return {
                  "games": int(games),
                  "points": int(points),
                  "ppg": ppg
              }


          def inject(obj):
              if isinstance(obj, list):
                  for item in obj:
                      if isinstance(item, dict) and "player" in item:
                          stats = get_stats(item["player"])
                          item["games"] = stats["games"]
                          item["points"] = stats["points"]
                          item["ppg"] = stats["ppg"]
                      inject(item)
              elif isinstance(obj, dict):
                  for v in obj.values():
                      inject(v)


          print("Updating draft files...")

          for file in draft_dir.glob("*.json"):
              try:
                  data = json.loads(file.read_text())
              except:
                  continue

              inject(data)

              file.write_text(json.dumps(data, indent=2))
              print("UPDATED:", file)

          print("Done.")
          EOF

      - name: Build NBA finals file
        run: python scripts/build_nba_finals.py

      - name: Build playoff games
        run: python scripts/build_nba_playoff_games.py

      - name: Build playoff series
        run: python scripts/build_nba_playoff_series.py

      - name: Build player search index
        run: python scripts/nba_build_stat_leaders.py

      - name: Commit changes
        run: |
          git config user.name "NBA Auto Bot"
          git config user.email "bot@example.com"
          git add -A
          git commit -m "NBA full rebuild" || echo "No changes"

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Push changes
        run: git push origin main
