- name: Commit rebuilt NBA files
  run: |

    git config user.name "github-actions"
    git config user.email "github-actions@github.com"

    echo "CHECKING FILES"

    ls docs/data/nba/boxscores/2026 | head

    git add -A docs/data/nba

    git status

    git commit -m "Restore NBA boxscores" || echo "No changes"

    git push
