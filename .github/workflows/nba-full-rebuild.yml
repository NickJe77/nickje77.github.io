
name: NBA Full Rebuild

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pandas boto3

      - name: Run NBA rebuild
        run: |
          python scripts/nba_full_rebuild.py

      - name: Commit rebuilt indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/nba/**/index.json

          git commit -m "Rebuild NBA indexes" || echo "No changes"

          git pull --rebase origin main || echo "Nothing to pull"

          git push
